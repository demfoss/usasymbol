sections:
- id: history
  icon: fa-solid fa-landmark
  title: South Dakota State Seal History and Origin
  paragraphs:
  - "South Dakota held its first constitutional convention in 1883 while still a territory and applied for statehood, but Congress refused. A second convention met in 1885, and Reverend Joseph Ward, a Congregationalist minister who had founded Yankton College in 1881, chaired the Committee on the Great Seal. Ward proposed both the seal's visual composition and its motto, and the 1885 convention adopted both."
  - "The design was rooted in the territorial economy of the mid-1880s: mining from the Black Hills gold rush of 1874, farming from the settlement boom across the eastern prairies, river trade on the Missouri, and cattle ranching in the grassland hills. Ward arranged these four industries into a single landscape that could be read as a snapshot of South Dakota's ambitions at the moment of its first statehood bid."
  - "Congress continued to deny statehood until 1889, when the Omnibus Admission Act enabled South Dakota, North Dakota, Montana, and Washington to seek admission. South Dakota held a third constitutional convention in 1889, which retained Ward's 1885 design with minor modifications. South Dakota and North Dakota were both admitted on November 2, 1889. Ward died on December 11, 1889, forty days after seeing the statehood he had worked toward."

- id: elements
  icon: fa-solid fa-shapes
  title: What the South Dakota State Seal Symbols Mean
  paragraphs:
  - "South Dakota's seal is a landscape composition rather than a heraldic arrangement. Each element in the scene represents one of the territory's four foundational industries."
  elements:
  - id: mining-smelting
    name: Mining and Smelting Furnace (Left)
    image: /images/state-seals/south-dakota/elements/mining-smelting.webp
    paragraphs:
    - "On the left side of the seal, a smelting furnace represents South Dakota's mining industry. The Black Hills gold rush began with Lieutenant Colonel George Custer's 1874 expedition, which reported gold in the hills. By 1876, Deadwood and Lead had become boom towns, and gold smelting was the territory's most lucrative industrial activity."
    - "Placing mining on the left gave it visual prominence alongside farming, signaling that South Dakota's founders saw the two industries as equal pillars of the territorial economy. The smelting furnace, rather than a mine entrance or a miner with a pick, represents the industrial processing stage, the point where raw ore becomes commercial metal."
  - id: farming-scene
    name: Farming Scene (Right)
    image: /images/state-seals/south-dakota/elements/farming-scene.webp
    paragraphs:
    - "On the right side, a farmer represents the agricultural economy of eastern South Dakota. The Homestead Act of 1862 opened the eastern prairies to settlement, and through the 1870s and 1880s, homesteaders broke the prairie sod to plant wheat, corn, and other crops. By 1885, eastern South Dakota was one of the most rapidly settled agricultural regions in North America."
    - "The farming scene on the right answers the mining scene on the left: two different kinds of labor, two different landscapes within the same territory, placed in parallel on the same seal to argue that South Dakota was not merely a mining camp or a farming district but a complete economy."
  - id: river-steamboat
    name: River and Steamboat (Center)
    image: /images/state-seals/south-dakota/elements/river-steamboat.webp
    paragraphs:
    - "Between the mining and farming scenes, a river with a steamboat represents the Missouri River, which bisects South Dakota from north to south and served as the territory's primary commercial highway. Steamboats carried supplies upriver to frontier towns and returned with agricultural and mineral products bound for eastern markets."
    - "By 1885, the Northern Pacific and other railroads were beginning to displace steamboat commerce, but river trade remained significant. The seal's designers chose the steamboat to represent the Missouri's role in connecting the isolated territory to the national economy, a role the river had played since the Lewis and Clark Expedition passed through in 1804 and 1806."
  - id: cattle-cornfields
    name: Cattle and Cornfields in the Hills (Background)
    image: /images/state-seals/south-dakota/elements/cattle-cornfields.webp
    paragraphs:
    - "In the background hills, cattle and cornfields represent the ranching and mixed-farming economy of central South Dakota. The Great Plains grasslands supported large cattle herds, and the hills between the mining west and the farming east served as grazing land and secondary agricultural zones."
    - "The background placement does not diminish these industries; it completes the landscape. The seal moves from foreground industries to a background that shows the full geographical range of the territory: from the river bottoms to the upland pastures."
  - id: motto-under-god
    name: "Motto: Under God the People Rule (Top)"
    image: /images/state-seals/south-dakota/elements/motto.webp
    paragraphs:
    - "'Under God the People Rule' arcs across the top of the seal in black letters on a golden background. Reverend Joseph Ward chose plain English over Latin at the 1885 Constitutional Convention so that every citizen could understand the state's foundational principle without translation. The phrase was unusual for its era; almost all state mottos of the 1880s used Latin."
    - "The motto combines two distinct ideas. 'Under God' asserts that human government operates within a framework of divine authority. 'The People Rule' asserts popular sovereignty. Ward was a Congregationalist minister; the theological phrasing was deliberate, not generic. South Dakota is one of a small number of states with mottos explicitly naming God."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the South Dakota State Seal'
  paragraphs:
  - "The Great Seal of South Dakota was designed in 1885 and retained with minor modifications when the 1889 constitutional convention confirmed it at statehood. The core composition has not changed since Ward's original design: mining on the left, farming on the right, the steamboat and river in the center, cattle and cornfields in the background, and the motto arced across the top."
  versions:
  - name: Original Design (1885)
    years: 1885–1889
    image: /images/state-seals/south-dakota/versions/seal-of-south-dakota-bw.svg
    description: Designed by Reverend Joseph Ward and adopted at the 1885 Constitutional Convention. South Dakota was not yet a state; this historical black-and-white rendering reflects the original seal design before statehood confirmation.
  - name: Statehood Seal (1889–present)
    years: 1889–present
    image: /images/state-seals/south-dakota/versions/state-seal-of-south-dakota.svg
    description: The 1889 constitutional convention retained Ward's 1885 design with minor modifications and established it as the official Great Seal of the State of South Dakota under Article XXI, Section 1 of the state constitution.

