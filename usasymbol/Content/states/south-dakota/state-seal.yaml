state: South Dakota
name: Great Seal of South Dakota
adopted_year: 1885
is_official: true
legislation: South Dakota Constitution, Article XXI, Section 1
meaning: "The Great Seal of South Dakota is a map of the territorial economy in 1885. Reverend Joseph Ward, who chaired the Committee on the Great Seal at the 1885 Constitutional Convention, arranged the four industries of South Dakota settlement in a single circular landscape: mining and smelting on the left, farming on the right, a steamboat on the river between them, and cattle with cornfields in the hills behind. The motto he chose, 'Under God the People Rule,' arcs across the top in plain English rather than Latin, a deliberate choice so that every citizen could read it without translation."
