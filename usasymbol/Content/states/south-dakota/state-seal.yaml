timeline:
- year: '1874'
  description: Lieutenant Colonel George Custer leads an expedition into the Black Hills and reports the presence of gold. The discovery triggers a gold rush that becomes the economic foundation the seal's mining imagery records.
- year: '1883'
  description: South Dakota holds its first constitutional convention and applies for statehood. Congress refuses.
- year: '1885'
  description: A second constitutional convention meets. Reverend Joseph Ward chairs the Committee on the Great Seal, proposes the landscape design and the motto "Under God the People Rule," and sees both adopted. Congress again declines to admit South Dakota.
- year: '1889'
  description: Congress passes the Omnibus Admission Act. A third constitutional convention retains Ward's 1885 seal design with minor modifications. South Dakota and North Dakota are both admitted on November 2. Ward dies December 11, forty days after statehood.

faq:
- question: What does the South Dakota state seal show?
  answer: The seal shows the territory's four industries in a landscape composition. Mining and smelting appear on the left, farming on the right, a river with a steamboat runs through the center, and cattle with cornfields fill the background hills. The motto "Under God the People Rule" arcs across the top.
- question: Who designed South Dakota's state seal?
  answer: Reverend Joseph Ward, a Congregationalist minister who founded Yankton College and chaired the Committee on the Great Seal at the 1885 Constitutional Convention. Ward proposed both the visual composition and the motto. He died December 11, 1889, forty days after South Dakota was admitted to the Union.
- question: When was South Dakota's state seal adopted?
  answer: The design was adopted at the 1885 Constitutional Convention, four years before statehood. South Dakota could not get Congress to act on its statehood applications in 1883 or 1885. When Congress finally admitted South Dakota on November 2, 1889, the 1889 constitutional convention retained Ward's 1885 design with minor modifications.
- question: What does the motto "Under God the People Rule" mean?
  answer: The phrase combines popular sovereignty with divine authority. "Under God" asserts that human government operates within a framework of divine providence. "The People Rule" asserts that citizens hold political power. Ward chose plain English rather than Latin so every citizen could read the foundational principle without translation.
- question: Why does South Dakota's seal show a smelting furnace?
  answer: The furnace represents the Black Hills gold mining industry that began after Custer's 1874 expedition reported gold in the hills. By 1885, gold smelting was South Dakota's most valuable industrial activity. Ward placed mining on the left of the seal as one of the territory's four economic pillars alongside farming, river trade, and ranching.
- question: Why does South Dakota's seal use English instead of Latin?
  answer: Reverend Joseph Ward made that choice deliberately at the 1885 convention. Most state mottos of the era used Latin, connecting states to Roman republican tradition. Ward wanted language every settler and immigrant could read without education in classical languages, so he wrote the motto in plain English.
- question: What is the connection between South Dakota and North Dakota's statehood?
  answer: Both states were admitted on November 2, 1889, carved from the same Dakota Territory under the Omnibus Admission Act. President Benjamin Harrison shuffled the admission papers so no one would know which state was admitted first. South Dakota is considered the 40th state and North Dakota the 39th, but the exact order was deliberately obscured.

