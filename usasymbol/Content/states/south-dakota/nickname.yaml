title: "The Mount Rushmore State"
state: "South Dakota"
type: "State Nickname"
is_official: true
adopted_year: 1992
other_nicknames:
  - "The Sunshine State"
  - "Land of Infinite Variety"
  - "Coyote State"
  - "Blizzard State"

author: "USA Symbol Team"
date_published: "2025-12-16"
date_modified: "2026-03-17"
seo_title: "South Dakota State Nickname | The Mount Rushmore State"
seo_description: "South Dakota is known as The Mount Rushmore State, the official state nickname adopted in 1992. Learn what Mount Rushmore State means, why South Dakota uses it, and what other nicknames the state has had."

intro_text: "South Dakota's official state nickname is <i>The Mount Rushmore State</i>, adopted by lawmakers in 1992 and centered in [South Dakota's state profile](/states/south-dakota). The name comes from Mount Rushmore National Memorial, where sculptors carved four presidential faces into granite between 1927 and 1941. Nearly three million people visit the monument each year."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Mount Rushmore State'"
    paragraphs:
      - "This South Dakota nickname refers to the massive sculpture near Keystone in the Black Hills. Gutzon Borglum chose this granite cliff because the rock could support carvings 60 feet tall. Workers spent 14 years using dynamite and jackhammers to shape the faces of Washington, Jefferson, Roosevelt, and Lincoln."
      - "About 400 people worked on the project between 1927 and 1941. They removed roughly 450,000 tons of rock from the mountainside. Tourism connected to Mount Rushmore became South Dakota's largest industry over time, bringing millions of dollars into the state economy each year. North Dakota entered the Union the same day in 1889 and developed its own tourism-centered identity around a very different landmark — the [Peace Garden State meaning](/states/north-dakota/nickname/the-peace-garden-state) traces how a border park rather than a mountain monument came to define its northern neighbor's national image."
      - "State legislators made the Mount Rushmore State official in 1992. Before that vote, South Dakota had used several different nicknames without any legal designation. The monument appears on license plates and in tourism materials across the state today, including designs linked to [South Dakota's state flag](/states/south-dakota/flag/south-dakota-state-flag). South Dakota's journey through unofficial names before settling on Mount Rushmore State is one of the more interesting backstories found among [all 50 state nicknames explained](/symbols/nicknames)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Sunshine State"
        text: "Tourism promoters in the 1920s and 1930s started calling South Dakota the Sunshine State to attract visitors. Weather data shows the state averages about 213 sunny days per year, with particularly clear skies in the Black Hills. Travel brochures and postcards from that era used the unofficial South Dakota nickname regularly. Florida — whose [Florida's official nickname](/states/florida/nickname/the-sunshine-state) had already become nationally established — created confusion for South Dakota's use of the same phrase. South Dakota eventually stopped using Sunshine State as its primary identifier because Florida's association with the name was stronger and more widespread."
      - subtitle: "Land of Infinite Variety"
        text: "Mid-century tourism campaigns promoted South Dakota as the Land of Infinite Variety. The phrase described how visitors could see Badlands formations, pine-covered mountains, wide prairies, and river valleys within one state's borders. Marketing materials from the 1950s and 1960s used this nickname to encourage people to explore multiple regions during their trips. Some modern brochures still mention it, though the name never went through legislative adoption. Travel writers appreciated how the phrase captured South Dakota's geographic contrasts without exaggeration."
      - subtitle: "Coyote State"
        text: "Newspapers and magazines in the late 1800s called South Dakota the Coyote State because these animals thrived across the prairie landscape. Settlers encountered large coyote populations as they moved into the territory. The animals adapted well to changing conditions even as ranching and farming spread. Some people thought Coyote State might become the official South Dakota nickname and motto before Mount Rushmore gained fame. Wildlife biologists still track healthy coyote populations throughout the state's grasslands and hills today."
      - subtitle: "Blizzard State"
        text: "Severe winter storms gave South Dakota the nickname Blizzard State during the late 1800s. Arctic air masses moving south clash with warmer winds in this region, creating dangerous whiteout conditions and heavy snowfall. The brutal winter of 1880-1881 killed livestock and trapped settlers in their homes for weeks. People started using Blizzard State after experiencing these harsh seasonal patterns year after year. Modern weather tracking confirms the state still faces regular severe winter storms, though the nickname never received official status from legislators."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Mount Rushmore took 14 years to complete and required about 400 workers using dynamite and carving tools."
      - "South Dakota had no official state nickname until 1992, even though people used various names for more than a century."
      - "The state motto is 'Under God the People Rule,' adopted in 1885, decades before the Mount Rushmore State nickname; see [South Dakota's motto page](/states/south-dakota/motto/under-god-the-people-rule)."
      - "Gutzon Borglum originally wanted to carve western heroes like Lewis and Clark but changed plans to honor presidents."
      - "Nearly three million people visit Mount Rushmore each year, making it South Dakota's biggest tourist attraction."
      - "Workers removed about 450,000 tons of rock while carving the four presidential faces into the granite cliff."

faq:

  - question: "What is South Dakota nickname?"
    answer: "South Dakota's official nickname is the Mount Rushmore State. The state legislature adopted this designation in 1992 to honor the famous presidential monument carved in the Black Hills."

  - question: "Why is South Dakota called the Mount Rushmore State?"
    answer: "South Dakota earned this South Dakota nickname because Mount Rushmore National Memorial sits within its borders. The monument attracts millions of visitors and defines the state's identity."

  - question: "What is the unofficial South Dakota nickname?"
    answer: "The Sunshine State served as an unofficial South Dakota nickname in the early 1900s. Tourism promoters used it because the state receives about 213 sunny days each year."

  - question: "When did South Dakota get its nickname?"
    answer: "The Mount Rushmore State became official in 1992 when state lawmakers voted to adopt it. People used other nicknames before that year without legal designation."

  - question: "What is the South Dakota nickname and motto?"
    answer: "The South Dakota nickname is the Mount Rushmore State, adopted in 1992. The state motto is 'Under God the People Rule,' which became official in 1885."

  - question: "What does the Mount Rushmore State mean?"
    answer: "The Mount Rushmore State refers to the national memorial featuring carved presidential faces. This landmark brings tourism revenue and international recognition to South Dakota."

  - question: "Was South Dakota always called the Mount Rushmore State?"
    answer: "No, South Dakota used nicknames like Sunshine State, Coyote State, and Land of Infinite Variety before officially adopting the Mount Rushmore State in 1992."

