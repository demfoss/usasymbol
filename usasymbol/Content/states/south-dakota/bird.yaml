title: Ring-necked Pheasant
scientific_name: Phasianus colchicus
adopted_year: 1943
legislation: S.D. Codified Laws Sec. 1-6-9
meaning: South Dakota did not choose a native prairie bird. In 1943 it chose the Ring-necked Pheasant, a species successfully introduced in Spink County in 1908 and then absorbed into South Dakota's hunting economy and public self-image. The symbol marks not untouched prairie nature, but a working rural landscape the state believed it had made productive and recognizable.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: '2026-03-28'
seo_title: 'South Dakota State Bird: Ring-necked Pheasant'
seo_description: South Dakota adopted the Ring-necked Pheasant in 1943. The key point is that the state chose an introduced bird because it had already become a hunting, farm-country, and tourism symbol.
intro_text: South Dakota's official state bird is the <strong>Ring-necked Pheasant</strong>, adopted on <strong>February 13, 1943</strong> and now listed in <strong>S.D. Codified Laws Sec. 1-6-9</strong>. South Dakota did not choose a native prairie bird. State sources trace the pheasant's successful introduction to <strong>Spink County in 1908</strong>, and by 1943 lawmakers made that imported bird the state's official symbol — not pristine prairie, but the South Dakota of farm country, pheasant season, and the rural economy that had grown around the bird.
