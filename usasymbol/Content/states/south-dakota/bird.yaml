sections:
- id: why-did-south-dakota-choose-a-non-native-bird
  icon: fa-solid fa-circle-question
  title: Why Did South Dakota Choose a Non-Native Bird?
  paragraphs:
  - Because by 1943 the pheasant was no longer just an imported game bird. In South Dakota it had already become a practical symbol of the state's farm country and fall hunting culture.
  - South Dakota did not use the slot to honor a bird that had always belonged to the prairie. It chose a species the state had helped establish and then built traditions around — pheasant season, hunting tourism, and a rural economy that still runs in part on the bird's presence.
- id: how-did-an-introduced-pheasant-become-a-south-dakota-symbol
  icon: fa-solid fa-map-location-dot
  title: How Did an Introduced Pheasant Become a South Dakota Symbol?
  paragraphs:
  - Official South Dakota summaries point to <strong>A. E. Cooper</strong> and <strong>E. L. Ebbert</strong>, who successfully introduced pheasants in Spink County in 1908. That local beginning gives the symbol a concrete South Dakota origin point even though the species itself came from elsewhere.
  - The bird then moved quickly from experiment to institution. South Dakota sources note that the first pheasant hunting season opened in Spink County in 1919, which helped turn the bird into something people associated with the state rather than with one private release.
  - By the time lawmakers acted in 1943, the pheasant was already embedded in public life. The state was not adopting an abstract candidate. It was ratifying a bird that had already become part of South Dakota's annual rhythm and reputation.
- id: why-did-the-pheasant-stay-bigger-than-one-1943-law
  icon: fa-solid fa-road
  title: Why Did the Pheasant Stay Bigger Than One 1943 Law?
  paragraphs:
  - The pheasant stayed visible because South Dakota kept treating it as more than a line in the code. Current Game, Fish and Parks material still describes pheasant hunting as deeply ingrained in the state's culture and a major economic engine.
  - That ongoing visibility shows up in public symbolism too. The <strong>2006 South Dakota quarter</strong> placed a Ring-necked Pheasant above Mount Rushmore, letting the bird stand for the state's outdoor and rural identity on one of its most widely circulated designs.
  - 'The symbol did not freeze in 1943. The pheasant still carries the same compact story: introduced bird, successful adaptation, hunting tradition that opened in Spink County in 1919, and a tourism economy Game, Fish and Parks still calls a major economic engine.'
faq:
- question: What is South Dakota's state bird?
  answer: South Dakota's state bird is the Ring-necked Pheasant.
- question: When did South Dakota adopt the Ring-necked Pheasant?
  answer: South Dakota adopted the Ring-necked Pheasant on February 13, 1943.
- question: Is the Ring-necked Pheasant native to South Dakota?
  answer: No. The pheasant is not native to South Dakota. State sources trace its successful introduction in the state to Spink County in 1908.
- question: Why did South Dakota choose an introduced bird as a state symbol?
  answer: Because by 1943 the pheasant had already become a strong symbol of South Dakota farm country, hunting culture, and rural business. Lawmakers chose the bird that residents and visitors already linked with the state.
- question: Where did the South Dakota pheasant story begin?
  answer: Official state summaries point to Spink County, where A. E. Cooper and E. L. Ebbert successfully introduced pheasants in 1908.
- question: What does the Ring-necked Pheasant mean for South Dakota?
  answer: The pheasant represents South Dakota's working rural landscape and hunting economy — a bird the state actively introduced, developed a hunting season around in 1919, and eventually put on its 2006 quarter above Mount Rushmore.
- question: Did the pheasant appear in any later South Dakota symbol?
  answer: Yes. The Ring-necked Pheasant appeared on South Dakota's 2006 state quarter above Mount Rushmore.
