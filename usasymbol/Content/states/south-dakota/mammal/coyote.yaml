faq:
  - question: "What is South Dakota's state animal?"
    answer: "South Dakota's state animal is the coyote (Canis latrans), designated when Governor George T. Mickelson signed legislation on March 5, 1949."
  
  - question: "When was the coyote designated as South Dakota's state animal?"
    answer: "The coyote became South Dakota's official state animal on March 5, 1949, when Governor George T. Mickelson signed the legislation. Five months later on August 6, 1949, the governor declared Tootsie, a celebrity coyote from Deadwood, as South Dakota's Official Animal at the Days of '76 celebration."
  
  - question: "Why did South Dakota choose the coyote as its state animal?"
    answer: "South Dakota chose the coyote to represent the resilience and survival spirit of South Dakotans who persevered through harsh prairie conditions including blizzards, droughts, and economic hardship. State Senator Alfred Roesler advocated for the designation by noting that the coyote managed to survive despite civilization encroaching upon its territory, much like South Dakota citizens who endured adverse conditions. The coyote's adaptability, intelligence, and persistence embodied qualities that defined South Dakota's pioneer heritage."
  
  - question: "Where can I see coyotes in South Dakota?"
    answer: "Coyotes can be seen throughout South Dakota, with best viewing opportunities at Badlands National Park along the Loop Road, Custer State Park's Wildlife Loop Road, Missouri River recreation areas, and prairie preserves like Samuel H. Ordway Jr. Memorial Preserve. Early morning and dusk provide optimal viewing times when coyotes hunt actively. Winter offers easiest viewing as coyotes stand out against snow and concentrate near food sources."
  
  - question: "Who was Tootsie the coyote?"
    answer: "Tootsie was a female coyote pup found orphaned in the Black Hills in 1947 by Deadwood resident Ollie Wiswell, who rescued her despite state bounties on coyotes. Fred Borsch of Deadwood adopted Tootsie and taught her to howl along to his singing. The duo became celebrities, cutting a record called 'South Dakota Tootsie' and touring ten states including a White House visit. Governor Mickelson declared Tootsie South Dakota's Official Animal on August 6, 1949, at the Days of '76 celebration in Deadwood. Tootsie died in 1959, but a giant neon sign of a howling coyote still stands on Deadwood's Main Street in her honor."
  
  - question: "Are coyotes endangered in South Dakota?"
    answer: "No, coyotes are not endangered in South Dakota. The state maintains a stable, healthy population of approximately 70,000 coyotes, one of the highest concentrations in North America. Coyotes are classified as predators under state law with year-round hunting and trapping seasons and no bag limits. Despite intensive harvest pressure, coyote populations remain robust because the species responds to population declines by producing larger litters, allowing rapid recovery."
  
  - question: "Can you hunt South Dakota's state animal?"
    answer: "Yes, despite being the state animal, coyotes can be hunted and trapped year-round in South Dakota with no bag limits in most areas. The state classifies coyotes as predators to protect livestock operations from predation. Some counties still offer bounty payments for coyotes during certain seasons. This creates the unusual situation of South Dakota simultaneously honoring the coyote as its official state animal while actively managing populations through unlimited harvest, reflecting the balance between symbolic recognition and practical ranching concerns."
  
  - question: "What is the connection between coyotes and the University of South Dakota?"
    answer: "The University of South Dakota adopted Coyotes as its athletic team mascot in 1902, 47 years before the state animal designation. When USD published its first yearbook in 1902, editors had already dubbed the teams 'the Coyotes.' A bronze statue of a coyote stands on the USD campus in Vermillion, and the mascot Charlie Coyote appears at university events. Governor George T. Mickelson, who signed the 1949 state animal legislation, had served as USD student body president, creating a direct connection between the university mascot and the state symbol."

