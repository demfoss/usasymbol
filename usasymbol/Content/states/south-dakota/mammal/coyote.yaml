title: "South Dakota State Animal | Coyote"
scientific_name: "Canis latrans"
adopted_year: 1949

seo_title: "South Dakota State Animal | Coyote"
seo_description: "South Dakota's state animal is the Coyote, adopted in 1949. Learn why this official South Dakota symbol was chosen and what it represents."

intro_text: "The Coyote is the official South Dakota state animal, designated in 1949. This page gives the direct answer for searches like 'south dakota state animal', 'south dakota state animal', and 'south dakota state mammal' while explaining how the symbol fits the state's official animal designations. Adaptability and intelligence; vocal howling called 'song of the west'; trickster figure in Native American folklore; University of South Dakota mascot. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Coyote"
official_since: "1949"
status: "Stable population estimated at 70,000 in South Dakota; hunted year-round with no bag limit in most counties"
habitat_in_state: "Open prairies, grasslands, river corridors, agricultural fields, Black Hills forests; highly adaptable to diverse habitats"
known_for: "Adaptability and intelligence; vocal howling called 'song of the west'; trickster figure in Native American folklore; University of South Dakota mascot"

size: "32 to 37 inches in length (body), plus 16-inch bushy tail"
weight: "20 to 50 pounds; northern populations tend to be larger"
coloration: "Grayish-brown to yellowish-gray coat with lighter underparts; rusty legs and feet; black-tipped bushy tail"
distinctive_traits: "Pointed ears, narrow pointed muzzle, yellow eyes, bushy tail with black tip, excellent hearing and vision, top speed 40 mph"

habitat: "Prairies, grasslands, river valleys, agricultural areas, woodland edges, suburban areas"
range_in_state: "Found throughout South Dakota; most abundant along Missouri River basin and tributaries, Black Hills region"
conservation_status: "Stable population; classified as predator with year-round hunting season; no conservation concerns"
where_to_find: "Badlands National Park, Custer State Park, Missouri River corridor, grasslands throughout state; most active dawn and dusk"
symbol_connections: "Represents resilience matching state motto 'Under God the People Rule'; trickster figure in Lakota culture; mascot of University of South Dakota since 1902; featured on South Dakota Army National Guard crest"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor George T. Mickelson signed legislation designating the coyote as South Dakota's official state animal on March 5, 1949. The bill passed both chambers of the legislature with strong support from lawmakers who saw the coyote's survival instinct as a mirror of South Dakota's pioneer spirit and [the Mount Rushmore State identity](/states/south-dakota/nickname/the-mount-rushmore-state)."
      - "The designation occurred during a period when South Dakota formalized recognition of state symbols. The legislature had designated the [Black Hills spruce](/states/south-dakota/tree/black-hills-spruce) as state tree in 1947 and the ring-necked pheasant as state bird in 1943, creating comprehensive acknowledgment of wildlife and natural resources defining South Dakota's identity."
    
    subsections:
      - subtitle: "Senator Roesler's Advocacy"
        text: "State Senator Alfred Roesler championed the coyote designation with eloquent floor remarks that resonated with legislators representing rural communities familiar with prairie hardships. Roesler told his colleagues in 1949 that the coyote has managed to survive in the face of civilization encroaching upon its territory, adding that the animal's spirit to survive resembles South Dakotans who endured adverse conditions including devastating blizzards, grasshopper plagues, dust bowl droughts, and economic hardship during the Great Depression. This connection between human resilience and coyote adaptability convinced legislators that no other animal better represented the state's character."
      
      - subtitle: "Tootsie: The Celebrity Coyote"
        text: "Public perception of coyotes shifted dramatically during the late 1940s partly due to Tootsie, a female coyote pup found orphaned in the Black Hills by Deadwood resident Ollie Wiswell in 1947. Wiswell ignored the state bounty on coyote pups and rescued the helpless animal, giving her to Fred and Esther Borsch who owned the Spot Liquor store in Deadwood. Fred Borsch taught Tootsie to howl along to his singing, and the duo became celebrities, cutting a record called 'South Dakota Tootsie' and appearing in parades throughout the state. Tootsie toured ten states including a White House visit where President Eisenhower and Vice President Nixon reportedly met the friendly coyote. On August 6, 1949, five months after the official designation, Governor Mickelson declared Tootsie South Dakota's Official Animal at the Days of '76 celebration in Deadwood, cementing her place in state history."
      
      - subtitle: "Alternative Proposals"
        text: "Legislators debated other animals during floor discussions before settling on the coyote. The bull received serious consideration as a symbol of South Dakota's ranching heritage, and decades later, some citizens lobbied to replace the coyote with the American bison, which many viewed as more representative of Great Plains heritage and less controversial than a predator with bounties on its head. A 2012 legislative attempt to change the state animal from coyote to bison failed, and the coyote retained its position. The decision to honor a predator rather than livestock or game animals demonstrated South Dakota's appreciation for wild resilience over domesticated utility."

  - id: "state-symbolism"
    icon: "fa-star"
    title: "What the Coyote Represents"
    style: "highlight"
    paragraphs:
      - "The coyote embodies adaptability, intelligence, and perseverance—qualities that defined South Dakota's settlement and survival. This prairie wolf thrived where larger predators like gray wolves and grizzly bears disappeared, demonstrating the resourcefulness needed to endure on the Great Plains and values echoed by [South Dakota's state motto](/states/south-dakota/motto/under-god-the-people-rule)."
      - "For thousands of years before European settlement, the coyote held prominent place in Lakota, Dakota, and Nakota oral traditions. The Lakota name šuŋgmánitu describes the coyote as a trickster and culture hero, often portrayed as witty, clever, and transformative in traditional stories."
      - "The designation recognizes not just a wild predator but South Dakota's identity as a place where persistence overcomes hardship. When the state chose an animal that survived despite persecution and habitat change, it acknowledged that survival requires flexibility rather than brute force in landscapes described by [States That Border South Dakota](/states/south-dakota/borders)."
    
    subsections:
      - subtitle: "Lewis and Clark's Prairie Wolf"
        text: "Members of the Lewis and Clark Expedition documented coyotes in what became South Dakota on September 18, 1804, near the White River. William Clark killed a specimen he described as a 'Prairie Wolf, about the Size of a Gray fox, bushy tail, head and ears like a Wolf, Some fur, Burrows in the ground and barks like a Small Dog.' Clark noted that animals previously identified as foxes were actually these prairie wolves, providing the first scientific documentation of coyotes in the region. The expedition's journals reveal that coyotes already inhabited the Missouri River corridor when explorers first traveled through Dakota Territory, establishing the species as an original resident rather than recent arrival."
      
      - subtitle: "Surviving the Bounty System"
        text: "South Dakota's decision to honor the coyote as state animal occurred despite decades of state-sponsored bounty programs that paid hunters for dead coyotes. South Dakota offered five dollars for adult coyotes and two dollars for pups through state-run bounty programs designed to protect livestock from predation. Even after the 1949 designation, many counties continued bounty payments during certain seasons, creating the paradox of a state simultaneously honoring and hunting its official animal. This contradiction reflects practical ranching concerns balanced against recognition of the coyote's ecological role and symbolic resonance. The coyote's survival despite intense hunting pressure demonstrated precisely the resilience South Dakotans admired."
      
      - subtitle: "The Coyote State Nickname"
        text: "South Dakota earned informal designation as 'The Coyote State' long before official state animal recognition. The nickname originated in the fall of 1863 when a horse owned by members of Company A, Dakota Cavalry, defeated a horse owned by a major in the 6th Iowa Cavalry in a race at Fort Randall. Witnesses said the Dakota horse ran like a coyote, and the name immediately transferred from the horse to the entire Dakota Cavalry company. Soldiers proudly adopted the coyote moniker, and the name gradually extended to South Dakota residents more broadly. Although 'The Sunshine State' served as official nickname from 1909 to 1992 (replaced by 'The Mount Rushmore State'), many residents and publications continued using 'Coyote State' as an informal alternative."
      
      - subtitle: "University of South Dakota's Charlie Coyote"
        text: "The coyote became University of South Dakota's mascot decades before the state animal designation. When USD published its first yearbook in 1902, editors had already dubbed athletic teams 'the Coyotes,' making it one of the earliest uses of the coyote as an institutional symbol. A bronze statue of a coyote stands on the USD campus in Vermillion, and the mascot Charlie Coyote appears at athletic events and community gatherings. Governor George T. Mickelson, who signed the 1949 state animal legislation, had served as USD student body president, creating a direct personal connection between the university mascot and the state symbol. The university's long association with coyote symbolism predating official recognition demonstrates the animal's grassroots appeal among South Dakotans."
      
      - subtitle: "Military Coyote Symbolism"
        text: "The South Dakota Army National Guard approved a coyote standing on a wreath for its official crest in 1924, twenty-five years before the state animal designation. The Guard's training exercises carry the name 'Golden Coyote,' while the South Dakota Air National Guard adopted the nickname 'Lobos,' Spanish for wolf. These military symbols acknowledge the coyote's qualities of alertness, strategic thinking, and ability to operate effectively in challenging environments—attributes valued in military contexts. The prevalence of coyote imagery across state institutions, universities, and military units before and after the 1949 designation reveals the animal's deep cultural resonance as a South Dakota identity marker."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify Coyotes"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Coyotes display lean, athletic builds designed for endurance running across open prairies. Adults measure 32 to 37 inches in body length with an additional 16-inch bushy tail, standing about 23 to 26 inches tall at the shoulder. South Dakota coyotes typically weigh 20 to 35 pounds, though northern populations occasionally produce individuals exceeding 50 pounds, likely due to hybridization with wolves or dogs."
        list_items:
          - "**Size**: Body 32-37 inches long; tail 16 inches; shoulder height 23-26 inches"
          - "**Weight**: Typically 20-35 pounds in South Dakota; northern individuals occasionally 40-50 pounds"
          - "**Coloration**: Grayish-brown to yellowish-gray back and sides; white to cream underparts; rusty-colored legs and feet; black-tipped tail"
          - "**Distinctive Features**: Pointed ears held erect; long narrow muzzle; yellow eyes; bushy tail typically held down when running (unlike wolves which carry tails horizontal)"
      
      - subtitle: "Vocalizations and Communication"
        text: "Coyotes rank among the most vocal North American mammals, using complex combinations of howls, yips, barks, and yelps to communicate across prairie distances. The characteristic howling often begins with a lone coyote producing a rising and falling wail, soon joined by pack members in a chorus that carries for miles across open grasslands. This vocalization, known as 'the song of the west,' serves multiple purposes including territory marking, pack assembly, and communication between separated family members. Coyotes also use body language through ear position, tail carriage, and facial expressions to convey status and intentions to other coyotes."
      
      - subtitle: "Distinguishing from Wolves and Dogs"
        text: "Coyotes inhabit the same prairies and forests as domestic dogs, requiring careful identification to distinguish species. Coyotes are significantly smaller than gray wolves, which once inhabited South Dakota but were extirpated by the 1920s. Where wolves weigh 70-110 pounds, coyotes rarely exceed 40 pounds. Coyotes carry their tails down when running, while wolves hold tails horizontal. Domestic dogs show tremendous size variation but typically lack the coyote's uniformly grayish-brown coloration and black tail tip. Coyotes move with a characteristic trotting gait covering ground efficiently at sustained speeds, whereas dogs display more varied movement patterns. Voice also distinguishes species—coyote howls sound higher-pitched and more varied than wolf howls, and domestic dogs rarely produce the complex yip-howl sequences characteristic of coyotes."

  - id: "in-the-state"
    icon: "fa-map-marker-alt"
    title: "Coyotes in South Dakota"
    style: "default"
    paragraphs:
      - "Coyotes range throughout South Dakota from Missouri River bottomlands to Black Hills ponderosa pine forests to shortgrass prairies of the western plains. The species occurs in greatest numbers along the Missouri River basin and its tributaries, and in the Black Hills region where diverse habitats provide abundant prey and den sites."
      - "South Dakota's coyote population numbers approximately 70,000 individuals, one of the highest concentrations in North America. This robust population reflects both the species' adaptability to agricultural landscapes and South Dakota's vast expanses of suitable habitat relatively free from urban development."
    
    facts:
      - "**Missouri River Corridor**: Highest coyote densities; river bottomlands provide rodent prey, water, and denning habitat in cutbanks and ravines"
      - "**Black Hills**: Year-round population utilizing forest edges, meadows, and riparian areas; prey includes deer fawns, rabbits, and ground squirrels"
      - "**Central Prairies**: Agricultural areas support coyotes feeding on rodents, rabbits, and livestock carrion; dens located in pasture ravines and creek banks"
      - "**Badlands**: Rocky terrain provides excellent denning sites; coyotes hunt prairie dogs, rabbits, and ground-nesting birds"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Coyotes in South Dakota"
    style: "default"
    paragraphs:
      - "Coyotes appear throughout South Dakota but remain wary of humans due to hunting pressure. Early morning and dusk offer best viewing opportunities when coyotes hunt actively before human activity increases. Winter provides easiest viewing as coyotes stand out against snow and concentrate near reliable food sources."
    
    list_items:
      - "**Badlands National Park**: Coyotes frequently visible along scenic drives hunting prairie dogs and rabbits; Loop Road provides excellent dawn and dusk viewing opportunities"
      - "**Custer State Park**: Wildlife Loop Road offers coyote sightings, particularly in meadows and prairie dog towns; coyotes scavenge near bison herds"
      - "**Samuel H. Ordway Jr. Memorial Preserve**: Prairie Coteau grasslands support healthy coyote populations visible during Nature Conservancy guided tours"
      - "**Missouri River Recreation Areas**: Lewis and Clark Recreation Area and other river access points provide coyote viewing along riparian corridors"
      - "**Agricultural Areas**: Rural roads throughout central South Dakota offer opportunities to spot coyotes hunting in fields during early morning hours"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Population Status and Management"
    style: "default"
    paragraphs:
      - "Coyote populations in South Dakota remain stable and healthy with no conservation concerns. The species is classified as a predator under state law, with year-round hunting and trapping seasons and no bag limits in most areas, allowing unlimited harvest to protect livestock operations."
      - "Despite intensive hunting pressure, coyote numbers remain robust throughout the state. When populations decline, coyotes respond by producing larger litters, a reproductive adaptation that allows rapid population recovery and explains the species' resilience despite sustained persecution."
    
    subsections:
      - subtitle: "Ecological Role"
        text: "Coyotes provide valuable ecosystem services in South Dakota's agricultural landscapes by controlling rodent populations that damage crops and compete with livestock for forage. A single coyote consumes hundreds of mice, voles, ground squirrels, and prairie dogs annually, providing natural pest control worth economic value to farmers. Coyotes also scavenge livestock and big game carcasses, accelerating decomposition and nutrient cycling while reducing disease transmission risks from rotting remains. This ecological contribution balances livestock predation concerns that drive hunting programs. Scientists recognize coyotes as keystone predators that influence prey populations, vegetation patterns, and ecosystem function across Great Plains habitats."
      
      - subtitle: "Adaptability to Human Landscapes"
        text: "Coyotes demonstrate remarkable ability to thrive in human-modified environments, inhabiting agricultural fields, suburban parks, and even small-town edges throughout South Dakota. This adaptability distinguishes coyotes from larger predators like wolves and mountain lions that require wilderness conditions. Coyotes adjust their diet to available food sources, consuming rodents, rabbits, fruit, insects, and human-related food sources when natural prey becomes scarce. They modify activity patterns to avoid human contact, becoming more nocturnal in areas with high human presence while remaining active during daylight in protected areas like national parks. This behavioral flexibility explains why coyote populations increased throughout the twentieth century even as human development expanded across South Dakota prairies."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The coyote connects to South Dakota's other official symbols through shared themes of prairie ecology, survival, and frontier heritage. The designation in 1949 occurred two years after South Dakota designated the Black Hills spruce as state tree and six years after naming the ring-necked pheasant as state bird, creating comprehensive recognition of native and introduced species defining the state's natural character."
      - "South Dakota's wildlife symbols span different ecological roles and human relationships. The ring-necked pheasant represents introduced game species managed for hunting, while the coyote represents native predators adapting to agricultural landscapes. Together they acknowledge both human manipulation of nature (pheasant introduction from Asia) and nature's persistence despite human pressure (coyote survival)."
    
    subsections:
      - subtitle: "State Motto and Resilience"
        text: "The coyote designation embodies South Dakota's state motto 'Under God the People Rule,' adopted in 1885 and featured prominently on the Great Seal. The motto emphasizes popular sovereignty and self-governance, values requiring the same persistence and adaptability that coyotes demonstrate in changing environments. State Senator Roesler explicitly connected these themes in 1949 when he told legislators that the coyote's survival spirit mirrors South Dakotans who endured adverse conditions. The motto's religious reference 'Under God' paired with the coyote's sacred significance in Native American traditions creates additional symbolic resonance—both acknowledge powers beyond human control that shape existence on the Great Plains."
        link:
          label: "See South Dakota state motto"
          url: "/states/south-dakota/motto/under-god-the-people-rule"
      
      - subtitle: "Ring-Necked Pheasant Connection"
        text: "The coyote and ring-necked pheasant share complex predator-prey relationships in South Dakota's agricultural landscapes. Pheasants, designated state bird in 1943, were introduced from Asia in 1908 and thrived in South Dakota's mix of cropland and grassland. Coyotes prey on pheasant nests, eggs, and occasionally adult birds, creating tension between the state's two most prominent wildlife symbols. This ecological relationship mirrors broader conservation debates balancing predator control with ecosystem health. The fact that South Dakota designated both predator and prey species as official symbols demonstrates recognition that complete ecosystems include multiple trophic levels rather than only species directly beneficial to humans."
        link:
          label: "See South Dakota state bird"
          url: "/states/south-dakota/bird/ring-necked-pheasant"
      
      - subtitle: "Pasque Flower and Prairie Ecology"
        text: "The American pasque flower, designated state floral emblem in 1903 with the motto 'I Lead,' creates thematic connections to the coyote through shared prairie ecology and symbolic meaning. The pasque flower blooms first among South Dakota wildflowers, emerging through late snow to announce spring's arrival, demonstrating the resilience required to survive prairie conditions. The flower's motto 'I Lead' parallels the coyote's role as a resilient survivor that persists where other large predators disappeared. Both symbols grow from South Dakota's prairie soils—the pasque flower literally rooted in grassland hillsides, the coyote ecologically dependent on prairie prey populations and denning habitat in prairie ravines."
        link:
          label: "See South Dakota state flower"
          url: "/states/south-dakota/flower/pasque-flower"
      
      - subtitle: "Black Hills Spruce Heritage"
        text: "The Black Hills spruce, designated state tree in 1947, represents the unique Black Hills ecosystem that supports some of South Dakota's densest coyote populations. This variety of white spruce grows naturally only in the Black Hills of South Dakota and a small portion of northeast Wyoming, making it a regional endemic like the coyote's strong association with Great Plains and western landscapes. French explorers first documented Black Hills spruce in 1743, the same century that scientific understanding of coyotes began developing. The spruce provides cover for prey species including rabbits and ground squirrels that form important coyote food sources, creating ecological connections between South Dakota's state tree and state animal."
        link:
          label: "See South Dakota state tree"
          url: "/states/south-dakota/tree/black-hills-spruce"

