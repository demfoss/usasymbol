hero_image_caption: The walleye, South Dakota's state fish, lives in rivers, lakes, and reservoirs across the state. Photo by Eviatar Bach, CC BY-SA 3.0.
intro_text: South Dakota's state fish is the walleye, a sharp-toothed fish with large, glassy eyes that lives in waters across the state. The state adopted it in 1982. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of South Dakota?
  paragraphs:
  - The walleye is South Dakota's official state fish. State lawmakers gave it this title in 1982.
  - Its scientific name today is Sander vitreus. The state law still uses its older scientific name, Stizostedion vitreum.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Walleye
  paragraphs:
  - The walleye has a long, torpedo-shaped body and a large mouth full of sharp teeth.
  - Its large, white, glassy eyes are its best-known feature. Look for a single black spot near the back of the first fin on its back.
  - The lower part of its tail fin is white, and so is the bottom fin near the tail. These white tips help anglers tell it apart from similar fish.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The South Dakota Legislature passed a law in 1982 that made the walleye the official fish of the state. The law is short. It names the fish and its scientific name.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why South Dakota Chose the Walleye
  paragraphs:
  - Official sources name the walleye as the state fish but don't give a detailed reason.
  - The walleye lives in waters all over the state, and it is the fish anglers in eastern South Dakota most want to catch.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Walleye
  paragraphs:
  - Walleye live statewide in large streams, rivers, lakes, and reservoirs.
  - They are most common in the Missouri River system, which includes big reservoirs like Lake Oahe, Lake Sharpe, and Lake Francis Case. Many walleye also live in the glacial lakes of northeastern South Dakota.
