seo_title: South Dakota State Fish | Walleye
seo_description: The South Dakota state fish is the walleye, adopted in 1982. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/south-dakota/south-dakota-fish-hero.webp
