- id: facts
  icon: fa-solid fa-lightbulb
  title: Walleye Facts
  facts:
  - Adopted in 1982 by the South Dakota Legislature.
  - Scientific name is Sander vitreus.
  - Has large white eyes and a black spot on its first back fin.
  - The lower part of its tail fin has a white tip.
  - It is a member of the perch family.
faq:
- question: What is South Dakota's state fish?
  answer: South Dakota's state fish is the walleye. You can recognize it by its large, glassy eyes and sharp teeth.
- question: When did South Dakota adopt the Walleye?
  answer: The South Dakota Legislature made the walleye the official state fish in 1982.
- question: Why did South Dakota choose the Walleye?
  answer: Official sources don't give a detailed reason. The walleye lives in waters across the state, and it is the fish anglers in eastern South Dakota most want to catch.
- question: How can you tell a walleye from other fish?
  answer: Check for large white eyes, a black spot near the back of the first fin on its back, and a white tip on the lower part of the tail.
- question: Does South Dakota have a state fishing museum?
  answer: Yes. State law names the Museum of Wildlife, Science, and Industry in Webster as the official State Fishing Museum.
