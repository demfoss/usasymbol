title: "Under God the People Rule"
language: "English"
english_translation: ""
adopted_year: 1885

author: "USA Symbol Team"
date_published: "2025-12-05"
date_modified: "2026-03-27"
seo_title: "South Dakota State Motto | Under God the People Rule"
seo_description: "South Dakota's motto was adopted in 1885 — four years before statehood. Reverend Joseph Ward proposed it at the Constitutional Convention, then died 40 days after South Dakota finally joined the Union. The motto was on the 1885 territorial constitution that Congress refused; Ward never saw it become permanent law."

intro_text: "South Dakota's state motto is <strong>Under God the People Rule</strong>, adopted at the 1885 Constitutional Convention — four years before South Dakota became a state. Reverend Joseph Ward, who founded Yankton College and chaired the Committee on the Great Seal, proposed both the seal design and the motto. Ward chose plain English over Latin so that every citizen could understand the words immediately. He died on December 11, 1889 — just 40 days after South Dakota's admission on November 2, 1889 — too ill to attend the final constitutional convention that reaffirmed his motto."

sections:
  - id: "adopted-before-statehood"
    icon: "fa-solid fa-clock"
    title: "Adopted Four Years Before Statehood — After Congress Refused the First Attempt"
    paragraphs:
      - "South Dakota held its first constitutional convention in 1883 while still a territory. Delegates drafted a constitution and applied for statehood, but Congress refused. The committee designed a seal during this period, but the whole effort came to nothing. A second constitutional convention met in 1885 — and this time, Reverend Joseph Ward chaired the Committee on the Great Seal."
      - "Ward proposed the motto 'Under God the People Rule' at the 1885 convention. The convention approved his design, and the 1885 constitution included the motto and seal. But South Dakota still did not become a state — Congress continued to refuse until 1889. The motto sat in a territorial constitution for four years, attached to a state that hadn't yet been permitted to exist."
      - "When Congress finally passed the Omnibus Admission Act in 1889, enabling South Dakota and three other territories to seek statehood, the 1889 constitutional convention retained the 1885 motto and seal design with minor modifications. Article XXI, Section 1 of the state constitution specified the Great Seal design and confirmed the motto as official. The South Dakota constitution's preamble opens: 'We, the people of South Dakota, grateful to Almighty God for our civil and religious liberties.'"

  - id: "ward-died-40-days-after"
    icon: "fa-solid fa-person"
    title: "Joseph Ward Died 40 Days After the Statehood He Had Worked For"
    paragraphs:
      - "Reverend Joseph Ward was a Congregationalist minister who founded Yankton College in 1881. He had been involved in South Dakota's statehood movement for years, attending constitutional conventions and advocating for admission to the Union. At the 1885 convention, he chaired the Committee on the Great Seal and proposed both the design and the motto."
      - "By 1889, Ward was seriously ill. He was too sick to attend the final constitutional convention that reaffirmed his motto and sealed South Dakota's entry into the Union. South Dakota became a state on November 2, 1889. Ward died on December 11, 1889 — 40 days later. He had spent years working toward the statehood he barely lived to see."
      - "Ward also suggested mottos at constitutional conventions for North Dakota, though North Dakota chose different language. His influence on Great Plains territorial politics extended beyond South Dakota, but 'Under God the People Rule' — the phrase he proposed from his committee chairmanship — became his lasting contribution to the state."

  - id: "english-over-latin"
    icon: "fa-solid fa-language"
    title: "Plain English Over Latin — Deliberately"
    paragraphs:
      - "Most state mottos from this era were written in Latin, following the convention that classical language connected states to Roman republican ideals. Ward chose English. He wanted language that every South Dakota citizen could read without translation — five words that stated the fundamental principle of democratic government directly."
      - "The phrase does two things simultaneously. 'Under God' acknowledges divine authority above human government. 'The People Rule' asserts popular sovereignty. The two halves create a theological-democratic compact: citizens hold power, but that power operates within a framework of divine providence. This makes it philosophically more complex than its plain language suggests."
      - "South Dakota is one of a small number of states with mottos explicitly mentioning God, alongside Arizona, Florida, and Ohio. Ward's religious vocation shaped the motto's theological dimension; his democratic convictions shaped the populist dimension. The 1880s South Dakota Territory was a place of agricultural settlement and land-rush politics — a motto about people governing themselves under God captured the pioneer spirit Ward was trying to express."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "South Dakota State Motto Facts"
    style: "gradient"
    facts:
      - "The motto was adopted in 1885 — four years before South Dakota became a state in 1889."
      - "Reverend Joseph Ward proposed it while chairing the Committee on the Great Seal at the 1885 Constitutional Convention."
      - "Ward died December 11, 1889 — just 40 days after statehood — too ill to attend the final 1889 convention."
      - "Ward chose English over Latin so every citizen could understand the motto without translation."
      - "South Dakota is one of four states with mottos explicitly mentioning God, along with Arizona, Florida, and Ohio."
      - "The Great Seal depicts South Dakota's 1885 economy: mining, farming, river commerce, and cattle ranching."

faq:
  - question: "What is South Dakota's state motto?"
    answer: "South Dakota's state motto is 'Under God the People Rule.' It was adopted at the 1885 Constitutional Convention — four years before South Dakota became a state — and reaffirmed in the 1889 statehood constitution."

  - question: "Who proposed South Dakota's motto?"
    answer: "Reverend Joseph Ward, founder of Yankton College, who chaired the Committee on the Great Seal at the 1885 Constitutional Convention. Ward proposed both the Great Seal design and the motto. He died on December 11, 1889, just 40 days after seeing South Dakota admitted to the Union."

  - question: "What language is South Dakota's motto written in?"
    answer: "English. Reverend Ward deliberately chose plain English over Latin so that every citizen could understand the motto without translation — unusual for state mottos of the 1880s, which typically used Latin."

  - question: "When did South Dakota officially adopt its motto?"
    answer: "At the 1885 Constitutional Convention, four years before statehood. Congress refused South Dakota's first statehood bid in 1883, but the 1885 convention designed the seal and motto. When Congress finally admitted South Dakota on November 2, 1889, the 1889 constitution retained the 1885 motto unchanged."

  - question: "What does 'Under God the People Rule' mean?"
    answer: "The phrase combines two principles: 'Under God' acknowledges divine authority above human government; 'the People Rule' asserts popular sovereignty and self-governance. The motto places democratic power within a framework of divine providence — citizens hold political authority, but that authority operates under God rather than being fully self-derived."

  - question: "Where does South Dakota's motto appear?"
    answer: "Arced across the top of the Great Seal in black letters on a golden background. The seal shows South Dakota's 1885 economy — mining and smelting on the left, farming on the right, with a river and steamboat between them, and hills with cattle and cornfields in the background. The state flag displays the Great Seal on a blue field surrounded by a gold sun design."

