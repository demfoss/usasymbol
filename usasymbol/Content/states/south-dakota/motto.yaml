faq:
  - question: "What is South Dakota's state motto?"
    answer: "South Dakota's state motto is \"Under God the People Rule.\" It was proposed by Reverend Joseph Ward in 1885 and officially adopted when South Dakota became a state on November 2, 1889."

  - question: "What does \"Under God the People Rule\" mean?"
    answer: "The phrase combines two ideas: \"Under God\" asserts that government operates within a framework of divine authority, and \"The People Rule\" asserts popular sovereignty. Reverend Joseph Ward, a Congregationalist minister, chose the wording deliberately to express both his theology and his view of democratic government."

  - question: "Why is South Dakota's motto in English and not Latin?"
    answer: "Reverend Joseph Ward chose English over Latin at the 1885 Constitutional Convention so every citizen could read the state's foundational principle without translation. Most state mottos of that era used Latin; Ward wanted language accessible to every settler and immigrant on the frontier."

  - question: "When did South Dakota adopt its state motto?"
    answer: "The motto was proposed by Reverend Joseph Ward at the 1885 Constitutional Convention. It was confirmed when South Dakota held a third constitutional convention in 1889, and became official when South Dakota was admitted to the Union on November 2, 1889."

