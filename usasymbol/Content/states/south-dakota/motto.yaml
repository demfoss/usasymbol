seo_title: "South Dakota State Motto | Under God the People Rule"
seo_description: "South Dakota's state motto is \"Under God the People Rule.\" Joseph Ward wrote it in English, not Latin, in 1885 so every citizen could read it."

intro_text: "South Dakota's state motto is <strong>Under God the People Rule</strong>. Reverend Joseph Ward chose the phrase in English — not Latin — at the 1885 Constitutional Convention so that every settler and citizen could read the state's foundational principle without a translation."

