faq:
- question: What is South Dakota's state fossil?
  answer: "South Dakota's state fossil is Triceratops (Triceratops horridus), a three-horned herbivorous dinosaur from the Late Cretaceous period, adopted in 1988."
- question: When did South Dakota adopt its state fossil?
  answer: "South Dakota designated Triceratops horridus as its state fossil in 1988, replacing an earlier designation of a fossil cycad plant."
- question: What did the Triceratops look like?
  answer: "Triceratops had three horns, including two long brow horns and one nose horn, plus a wide bony frill behind the skull. Adults reached up to 29 feet in length and weighed as much as 12 tons."
- question: Where are Triceratops fossils found in South Dakota?
  answer: "Triceratops fossils come from the Hell Creek Formation in the northwestern corner of South Dakota, particularly in Harding, Perkins, and Corson counties. The Museum of Geology in Rapid City holds significant specimens."
- question: When did the Triceratops live?
  answer: "Triceratops lived during the Late Cretaceous period, about 68 to 66 million years ago, and was one of the last non-avian dinosaurs before the mass extinction."
- question: What was South Dakota's state fossil before Triceratops?
  answer: "Before 1988, South Dakota recognized a fossil cycad plant as its state fossil. The legislature replaced it with Triceratops horridus in 1988."

