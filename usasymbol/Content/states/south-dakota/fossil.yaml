- id: facts
  icon: fa-solid fa-lightbulb
  title: Triceratops Facts
  facts:
  - "South Dakota replaced a fossil cycad plant with Triceratops horridus as its state fossil in 1988."
  - "Triceratops is one of the most common large dinosaurs found in the Hell Creek Formation, which spans parts of South Dakota, Montana, and North Dakota."
  - "The two brow horns on large adults could exceed 3 feet in length."
  - "Triceratops lived from about 68 to 66 million years ago and was among the last non-avian dinosaurs before the Cretaceous extinction."
  - "The name Triceratops means 'three-horned face' in Greek, from tri (three), kerat (horn), and ops (face)."

