sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is South Dakota's State Bread?"
    paragraphs:
      - "Frybread is South Dakota's official state bread, designated by the South Dakota Legislature in 2005. It is a flat dough fried until puffed and golden, closely associated with Native American communities across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Frybread"
    paragraphs:
      - "Frybread is made from a simple dough of flour, water, and leavening, flattened by hand and fried in oil until it puffs up and turns golden brown. It can be eaten plain, dusted with sugar, or topped with savory ingredients such as ground beef, beans, lettuce, and cheese to make a dish known as an Indian taco."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Frybread Became South Dakota's State Bread"
    paragraphs:
      - "The South Dakota Legislature designated frybread the official state bread in 2005."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why South Dakota Chose Frybread"
    paragraphs:
      - "South Dakota is home to nine federally recognized tribal nations, including the Lakota, Dakota, and Nakota peoples, and frybread has been a widely shared food across Native communities for generations. Its history is a complicated one, tracing back to government-issued rations in the 1800s, but the bread has since become a staple at powwows and community gatherings across the state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Frybread Facts"
    facts:
      - "Adopted as South Dakota's state bread in 2005."
      - "Frybread is made from a simple flour dough fried in oil."
      - "South Dakota is home to nine federally recognized tribal nations."
      - "Frybread topped with meat, beans, and vegetables is known as an Indian taco."

