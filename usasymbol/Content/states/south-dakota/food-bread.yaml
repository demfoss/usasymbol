faq:
  - question: "What is South Dakota's state bread?"
    answer: "South Dakota's state bread is frybread, adopted by the South Dakota Legislature in 2005."
  - question: "When did South Dakota adopt frybread as its state bread?"
    answer: "The South Dakota Legislature designated frybread the official state bread in 2005."
  - question: "Why did South Dakota choose frybread?"
    answer: "Frybread has long been part of the food traditions of South Dakota's Native American communities, including the state's nine federally recognized tribal nations."
  - question: "Is frybread still eaten in South Dakota today?"
    answer: "Yes, frybread remains common at powwows, community events, and restaurants across South Dakota."

