type: State Coat of Arms
state: South Dakota
name: South Dakota State Coat of Arms
adopted_year: 1885
is_official: true
meaning: "The South Dakota coat of arms packs the territorial economy of the 1880s into a single circular landscape. Mining and smelting appear on the left, farming and cattle on the right, and a steamboat moves along the Missouri River between them. The motto above, written in plain English rather than Latin, was chosen so that every citizen could read it without translation."
meaning_title: Meaning of the South Dakota Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'South Dakota Coat of Arms: Meaning, Symbols and History'
seo_description: "The South Dakota coat of arms was adopted in 1885 and shows mining, farming, a Missouri River steamboat, and the motto Under God the People Rule."
hero_image: /images/coats-of-arms/south-dakota/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of South Dakota, designed 1885, showing mining on the left, farming on the right, a steamboat on the Missouri River, and the motto Under God the People Rule
hero_image_caption: The South Dakota Coat of Arms, designed at the 1885 constitutional convention and confirmed at statehood on November 2, 1889. Mining appears on the left, farming on the right, with a steamboat on the Missouri River and the motto arcing across the top.
intro_text: "The South Dakota coat of arms was designed in 1885 at the territorial constitutional convention, four years before statehood. The design shows four industries in one landscape: a smelting furnace and mining works on the left, a farmer plowing on the right, a steamboat on the Missouri River between them, and cattle grazing in the background. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the South Dakota Coat of Arms?
  paragraphs:
  - "The design is circular rather than a traditional heraldic shield. South Dakota uses it as both its Great Seal and its coat of arms. The circular field shows an outdoor landscape with all four major industries of the territorial economy arranged around a central river view."
  - "The motto Under God the People Rule arcs across the top of the design on a banner. Around the outer ring, the words State of South Dakota and Great Seal appear, along with the year 1889. An official colored version of the design was adopted in 1961, based on an original painting by John G. Moisan of Fort Pierre."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the South Dakota Coat of Arms
  paragraphs:
  - "The design comes from the 1885 Constitutional Convention, held while South Dakota was still a territory. Reverend Joseph Ward, founder of Yankton College, chaired the Committee on the Great Seal and Coat of Arms. He organized the imagery and chose the motto."
  - "Ward selected the English phrase Under God the People Rule instead of a Latin motto. His reasoning was direct: the people governed by the seal should be able to read it. That choice set South Dakota apart from the majority of states that use Latin mottoes."
  - "When South Dakota became a state on November 2, 1889, the new constitution carried the 1885 design forward with only two changes: the words State of Dakota became State of South Dakota, and one phrase describing the mining scene was adjusted. The imagery itself was unchanged."
  - "In 1961 the South Dakota Legislature adopted an official colored version of the coat of arms based on an original painting by John G. Moisan of Fort Pierre. That painting established the standard colors used in all official reproductions."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the South Dakota Coat of Arms
  paragraphs:
  - "The design shows four scenes arranged around the Missouri River. Each scene represents one of the industries that defined South Dakota in the territorial era."
  elements:
  - id: mining
    name: Mining and Smelting
    image: /images/coats-of-arms/south-dakota/elements/mining.webp
    paragraphs:
    - "On the left side of the design, a smelting furnace sends smoke into the sky. A hoist house, mill, and mine dump appear behind it against the Black Hills. The scene represents the mining industry of western South Dakota, which grew rapidly after gold was discovered in the Black Hills in 1874."
    - "Mining was one of the primary reasons settlers came to the Dakota Territory in the 1870s and 1880s. Placing it prominently on the left gives it equal weight with farming, the other major industry shown on the right."
  - id: farming
    name: Farmer, Cattle, and Cornfield
    image: /images/coats-of-arms/south-dakota/elements/farming.webp
    paragraphs:
    - "On the right side, a farmer drives a team of horses pulling a plow across open land. Behind him, a herd of cattle grazes near a cornfield. The scene represents the agriculture that brought settlers to the eastern part of the territory."
    - "The combination of the plowing farmer, cattle, and corn captures the three main branches of South Dakota agriculture: grain farming, livestock ranching, and crop cultivation. These industries sustained the territory's eastern settlements through the 1880s."
  - id: steamboat
    name: The Steamboat on the Missouri River
    image: /images/coats-of-arms/south-dakota/elements/steamboat.webp
    paragraphs:
    - "At the center of the design, the Missouri River runs between the mining scene on the left and the farming scene on the right. A steamboat moves along the river. The steamboat represents commerce and transportation, the link that connected the territory's two economies."
    - "Before railroads reached all parts of the territory, the Missouri River was the main route for goods and people moving into and out of South Dakota. The river and steamboat on the arms place commerce at the center of the design, literally between the two industries it connected."
  - id: motto
    name: Under God the People Rule
    image: /images/coats-of-arms/south-dakota/elements/motto.webp
    paragraphs:
    - "The motto Under God the People Rule arcs across the top of the design on a golden banner. Reverend Joseph Ward chose the phrase at the 1885 constitutional convention. He wrote it in English rather than Latin so that ordinary citizens could read it directly."
    - "The phrase is also the official state motto of South Dakota, adopted at the same time as the coat of arms design. It asserts a specific principle: that governmental authority belongs to the people, not to a monarch or ruling class."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the South Dakota Coat of Arms
  paragraphs:
  - "The design maps the territory's economic geography. Mining is on the left because the mines were in the west, in the Black Hills. Farming is on the right because the farms were in the east, on the prairie. The Missouri River runs between them because it was the border between those two worlds."
  - "Placing all four industries in one landscape was a statement about what South Dakota was and what it hoped to become. The territorial leaders who designed it wanted to show a complete economy, not just one kind of place."
  - "The motto ties the imagery together. Under God the People Rule is not a description of the land but a statement about who governs it. Ward put it at the top of the design, above all four industries, as the organizing principle of the whole."

- id: facts
  icon: fa-solid fa-lightbulb
  title: South Dakota Coat of Arms Facts
  facts:
  - "Designed: 1885, at the territorial constitutional convention, by a committee chaired by Reverend Joseph Ward, founder of Yankton College."
  - "Confirmed at statehood: November 2, 1889, when South Dakota was admitted to the Union. Only the state name wording was changed from the 1885 design."
  - "Official colored version: Adopted in 1961 by the South Dakota Legislature, based on an original painting by John G. Moisan of Fort Pierre."
  - "The motto Under God the People Rule was written in English rather than Latin by Ward so that every citizen could read it without translation."
  - "Gold was discovered in the Black Hills in 1874, which is why the mining and smelting scene on the left represents a major part of the territorial economy by 1885."
  - "South Dakota uses the same design as both the Great Seal and the coat of arms. The circular form functions as the state's official emblem in both roles."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the South Dakota Coat of Arms
  paragraphs:
  - "The 1885 territorial design and the 1889 statehood version are nearly identical. The only documented changes were the substitution of State of South Dakota for State of Dakota and one adjustment to the description of the mining scene."
  - "No coat of arms or seal existed for South Dakota before 1885. The state was part of Dakota Territory, which had its own territorial seal. South Dakota adopted a new design at the 1885 convention rather than carrying forward the territorial emblem."
  versions:
  - name: Territorial Design
    years: 1885
    image: /images/coats-of-arms/south-dakota/versions/territorial-1885.svg
    description: The original design approved at the 1885 Constitutional Convention while South Dakota was still a territory. The imagery is identical to the 1889 statehood version; only the name wording differed.
  - name: Statehood Version
    years: 1889
    image: /images/coats-of-arms/south-dakota/versions/statehood-1889.svg
    description: The design as confirmed in the 1889 South Dakota Constitution when the state was admitted to the Union on November 2, 1889. The coat of arms and Great Seal have been one continuous design since this date.
  - name: Official Standard
    years: 1961-present
    image: /images/coats-of-arms/south-dakota/versions/current-standard.svg
    description: The officially colored version adopted by the South Dakota Legislature in 1961, based on an original painting by John G. Moisan of Fort Pierre. This established the standard colors for all official reproductions.

faq:
- question: What does the South Dakota coat of arms show?
  answer: "The design shows four industries arranged around the Missouri River. On the left, a smelting furnace and mining works represent the Black Hills mining industry. On the right, a farmer plowing with horses, a herd of cattle, and a cornfield represent agriculture. At the center, a steamboat moves along the Missouri River. The motto Under God the People Rule arcs across the top."
- question: What does the steamboat mean on the South Dakota coat of arms?
  answer: "The steamboat on the Missouri River represents commerce and transportation. Before railroads reached all parts of the territory, the Missouri River was the main route for goods and people. The river and steamboat sit at the center of the design, between the mining and farming scenes, because they connected the two economies."
- question: When was the South Dakota coat of arms adopted?
  answer: "The design was created at the 1885 territorial constitutional convention by a committee chaired by Reverend Joseph Ward. It was confirmed when South Dakota became a state on November 2, 1889. An official colored version was adopted by the legislature in 1961."
- question: Who designed the South Dakota coat of arms?
  answer: "Reverend Joseph Ward, founder of Yankton College, chaired the Committee on the Great Seal and Coat of Arms at the 1885 constitutional convention. He organized the imagery and chose the motto Under God the People Rule. John G. Moisan of Fort Pierre painted the original colored version that became the 1961 standard."
- question: Why is the motto in English and not Latin?
  answer: "Reverend Joseph Ward chose English deliberately so that ordinary citizens could read it without translation. Most state mottoes are in Latin, but Ward wanted the motto to be directly readable by the people it described."
- question: What is the difference between the South Dakota coat of arms and the state seal?
  answer: "They use the same design. South Dakota did not create a separate traditional heraldic coat of arms with a shield and supporters. The circular Great Seal design functions as both the seal and the coat of arms."

