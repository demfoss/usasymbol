seo_title: "South Dakota State Flower: American Pasqueflower"
seo_description: "The American Pasqueflower became South Dakota's state flower in 1903. This purple wildflower blooms early in spring across South Dakota prairies."

intro_text: "South Dakota's official state flower is the American Pasqueflower, recognized by the state legislature in 1903 and featured in the [list of U.S. state flowers](/symbols/flowers). These lavender purple wildflowers bloom among prairie grasses throughout South Dakota. Fuzzy stems and delicate petals appear across the state in early spring before most other wildflowers emerge."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the South Dakota State Flower?"
    paragraphs:
      - "The American Pasqueflower stands as South Dakota's floral emblem. Each bloom displays five to seven petal-like sepals in shades of lavender, purple, or occasionally white. The flowers measure 2 to 3 inches across when fully open. A cluster of yellow stamens fills the center. Silky hairs cover the stems, leaves, and buds giving the plant a fuzzy appearance."
      - "American Pasqueflowers bloom from March through May across South Dakota. These flowers appear among the first prairie wildflowers each spring. Peak blooming occurs in April throughout most regions. Individual flowers last about a week. The plants grow 6 to 12 inches tall. Finely divided leaves emerge after flowers appear. Feathery seed heads develop after blooming, resembling small mops."
      - "This native wildflower grows in South Dakota prairies from the Black Hills to the eastern border. The plant thrives in Custer State Park, Badlands National Park, and throughout the grasslands. Well-drained prairie soil suits American Pasqueflower best. Full sun produces the most vigorous growth. The species tolerates the harsh conditions of South Dakota's northern plains including cold winters, strong winds, and variable spring weather."

  - id: name
    icon: "fa-solid fa-tag"
    title: "South Dakota State Flower Name"
    paragraphs:
      - "Known as American Pasqueflower, this plant's scientific designation is Pulsatilla patens. The species belongs to the Ranunculaceae family. This large family includes buttercups, clematis, and about 2,000 other flowering plant species worldwide."
      - "The genus name Pulsatilla comes from a Latin word meaning to beat or pulsate. It may refer to how flowers nod in prairie winds. The species name patens means spreading or open. Pasqueflower derives from Pasque, an old word for Easter. The flowers often bloom around Easter time in spring. Prairie crocus serves as another common name though the plant is not related to true crocuses."
      - "Some botanists classify this species as Anemone patens rather than Pulsatilla patens. The debate over proper classification continues. South Dakota's designation uses the name pasqueflower without specifying genus. This allows the flower to represent the state regardless of taxonomic changes. Native Americans called the plant by various names in Dakota and Lakota languages."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How South Dakota Chose the American Pasqueflower"
    paragraphs:
      - "South Dakota made the American Pasqueflower its official state flower in 1903. This designation came only 14 years after South Dakota achieved statehood. The state legislature acted without organizing a formal statewide vote. School children throughout South Dakota studied native wildflowers during this period alongside broader lessons on [South Dakota state symbols](/states/south-dakota)."
      - "The American Pasqueflower bloomed across South Dakota's vast prairies each spring. Early settlers admired these purple flowers appearing after harsh winters. The blooms signaled spring's arrival on the northern plains. The fuzzy buds pushed through snow and dead grass. This resilience symbolized pioneer determination and aligned with [the Mount Rushmore State identity](/states/south-dakota/nickname/the-mount-rushmore-state). Native Americans used the plant for medicinal purposes."
      - "No competing flowers received serious consideration during selection. The pasqueflower seemed the obvious choice to legislators. Its early blooming made it distinctive. The plant grew throughout South Dakota from east to west. Every region featured these purple blooms. The legislature passed the designation on March 5, 1903. South Dakota became one of the earliest states to adopt an official floral emblem."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "South Dakota State Flower Facts"
    facts:
      - "American Pasqueflowers grow wild throughout South Dakota from the Black Hills to eastern prairies, thriving in Custer State Park and Badlands National Park"
      - "The flowers often bloom before leaves fully emerge, with fuzzy buds pushing through snow and dead grass in early spring"
      - "South Dakota adopted the American Pasqueflower on March 5, 1903, becoming one of the earliest states to designate an official state flower"
      - "The feathery seed heads that develop after blooming resemble small mops and persist through summer, dispersing seeds via wind"
      - "Native Americans used American Pasqueflower for medicinal purposes, though all parts of the plant contain compounds that can cause skin irritation"
      - "Some botanists classify this species as Anemone patens rather than Pulsatilla patens, with ongoing debate over proper taxonomic placement"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "South Dakota State Flower and Bird"
    paragraphs:
      - "The [Ring-necked Pheasant](/states/south-dakota/bird/ring-necked-pheasant) serves as South Dakota's state bird, an introduced game bird that thrives in South Dakota's agricultural landscape. Both symbols represent South Dakota officially. South Dakota adopted the American Pasqueflower in 1903 and designated the Ring-necked Pheasant as state bird in 1943."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The American Pasqueflower is often associated with resilience and renewal on the northern plains. The flower has been linked to courage and determination due to its ability to bloom in harsh early spring conditions. Its fuzzy buds pushing through snow frequently represent hope and perseverance while carrying connotations of South Dakota's pioneer spirit and the strength needed to thrive in the challenging prairie environment, including regions covered in [States That Border South Dakota](/states/south-dakota/borders)."

faq:
  - question: "What is South Dakota's state flower?"
    answer: "South Dakota's state flower is the American Pasqueflower, a lavender purple wildflower that blooms early in spring across the state's prairies."
  
  - question: "When did South Dakota adopt the American Pasqueflower as its state flower?"
    answer: "South Dakota adopted the American Pasqueflower on March 5, 1903. This designation came only 14 years after South Dakota achieved statehood."
  
  - question: "Why did South Dakota choose the American Pasqueflower?"
    answer: "South Dakota chose the American Pasqueflower because it bloomed across the state's vast prairies each spring and symbolized resilience. The fuzzy buds pushed through snow signaling spring's arrival after harsh winters. This resilience represented pioneer determination, and the plant grew throughout South Dakota from the Black Hills to eastern prairies."
  
  - question: "When does the American Pasqueflower bloom in South Dakota?"
    answer: "American Pasqueflowers bloom from March through May in South Dakota, appearing among the first prairie wildflowers each spring. Peak blooming occurs in April, with flowers often appearing before leaves fully emerge."
  
  - question: "Is the American Pasqueflower the same as prairie crocus?"
    answer: "Prairie crocus is another common name for the American Pasqueflower, though the plant is not related to true crocuses. The name comes from the flower's early spring blooming time similar to garden crocuses."

