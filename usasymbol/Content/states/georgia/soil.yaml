faq:
- question: What is Georgia's state soil?
  answer: "Georgia's representative soil is the Tifton series, a well-drained loamy sand soil of the Southern Coastal Plain. The Georgia Soil Classifiers Association designated it Georgia's representative soil in 1999. It has not been officially adopted by the Georgia Legislature."
- question: Why is it called Tifton soil?
  answer: "The series is named for Tifton, Georgia, the seat of Tift County in south Georgia. The series was first established there in 1909 when federal soil scientists mapped the area's Coastal Plain soils for the first time."
- question: What color is Tifton soil?
  answer: "The surface layer is dark grayish brown. Below that, the clay-enriched subsoil is strong brown to yellowish brown — the brown and orange tones come from iron oxides that built up in the subsoil over millions of years of weathering."
- question: Where is Tifton soil found in Georgia?
  answer: "Tifton soil covers more than 2 million acres across 65 counties in southern Georgia's Coastal Plain — the flat, lower third of the state. Key counties include Tift, Grady, Thomas, Colquitt, and Berrien. The series also appears in parts of Florida and Alabama."
- question: What crops grow in Tifton soil?
  answer: "The main crops are peanuts, cotton, soybeans, and corn. Tifton soil has supported south Georgia cotton farming since at least 1909 and is now the primary soil under much of Georgia's peanut belt."
- question: Who chose Tifton as Georgia's state soil?
  answer: "The Georgia Soil Classifiers Association selected Tifton as Georgia's representative soil in 1999, for the centennial of the National Cooperative Soil Survey. It was chosen by soil scientists, not by the state legislature."
- question: What is plinthite in Tifton soil?
  answer: "Plinthite is a soft, iron-rich material found in the lower subsoil of Tifton soil, roughly 30 to 50 inches below the surface. It stays soft and workable underground, but once it is exposed to repeated drying in open air, it hardens permanently into ironstone. Ancient ironstone outcrops in Georgia's Coastal Plain formed the same way."
- question: Who first mapped Tifton soil?
  answer: "Hugh Hammond Bennett mapped Tifton soil in 1909 during the first soil survey of Grady County, Georgia. Bennett went on to become the first chief of the U.S. Soil Conservation Service in 1935 and is known as the Father of Soil Conservation."

