- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Tifton Soil
  paragraphs:
  - "Cotton and peanuts are the crops most closely tied to Tifton soil. When Hugh Hammond Bennett mapped this series in 1909, cotton was the primary cash crop of south Georgia, and Tifton soil was already recognized as among the best land for it. Peanuts followed as Georgia's agricultural economy shifted through the twentieth century. Today Tifton soil supports peanuts, cotton, soybeans, and corn — the core of south Georgia row-crop farming."
  - "The sandy surface makes Tifton soil easy to work early in spring and late into fall. The clay subsoil holds enough moisture to carry crops through dry stretches without irrigation. That combination of a workable surface and a moisture-retaining subsoil is what makes it prime farmland."
  - "Where Tifton land is not cultivated, it supports loblolly pine and slash pine plantations — the other major land use in south Georgia. Some stands include longleaf pine, the original dominant tree of the Georgia Coastal Plain before logging removed most of it."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Tifton Soil Facts
  facts:
  - "Tifton soil covers more than 2 million acres across 65 Georgia counties — the most widespread productive agricultural soil in the state."
  - "Twenty-seven percent of Georgia's prime farmland is on Tifton soil — more than twice as much as any other soil series in the state."
  - "The Tifton series was established in 1909 by Hugh Hammond Bennett, who later became the first chief of the U.S. Soil Conservation Service and is known as the Father of Soil Conservation."
  - "Georgia's representative soil was selected by the Georgia Soil Classifiers Association in 1999 for the centennial of the National Cooperative Soil Survey. It has not been officially designated by the Georgia Legislature."
  - "Tifton soil contains ironstone nodules — small, hard iron pellets — throughout the upper profile, and plinthite in the lower subsoil. Plinthite is a soft iron-rich material underground that hardens irreversibly when dried in the open air."
  - "The series is named for Tifton, Georgia, the seat of Tift County, located in the heart of the south Georgia agricultural belt."

