sections:
  - id: overview
    icon: fa-solid fa-music
    title: Georgia State Song
    paragraphs:
      - "\"Georgia on My Mind\" is Georgia's official state song, adopted in 1979. Composer Hoagy Carmichael and lyricist Stuart Gorrell wrote it in 1930, but the state chose the song specifically because of its association with Georgia-born singer Ray Charles."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Georgia on My Mind\" Explained"
    paragraphs:
      - "The song is a slow, wistful ballad about missing a place called Georgia, with lyrics general enough that listeners have long debated whether Carmichael meant the state or a woman named Georgia. Its melody moves at a relaxed tempo built for a jazz or soul vocal performance."
      - "Hoagy Carmichael composed the music and Stuart Gorrell wrote the words in 1930, and Carmichael first recorded it that same year. The song became far better known after Ray Charles, who was born in Albany, Georgia, and grew up in Greenville, Florida, recorded it in 1960 for his album The Genius Hits the Road."
      - "Charles's version reached number one on the Billboard Hot 100 and won two Grammy Awards, and it is the recording most listeners associate with the song today."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Georgia on My Mind" Represents Georgia
    paragraphs:
      - "Georgia adopted the song largely because of Ray Charles's connection to the state and his 1960 recording's national success. In 1979, the General Assembly invited Charles to perform the song live at the state capitol before voting to make it official."
      - "The moment carried extra weight because Charles had once refused to perform in Georgia during the era of racial segregation. The 1979 adoption, paired with a formal apology from the state senate, turned the song into a symbol of reconciliation as much as state pride."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Georgia on My Mind\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Georgia on My Mind" Became Georgia's State Song
    paragraphs:
      - "The Georgia General Assembly designated \"Georgia on My Mind\" the official state song in 1979, the same year Ray Charles performed it in person at the capitol. Lawmakers also issued a formal apology to Charles that year, acknowledging how he had been treated in the state decades earlier."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Georgia on My Mind\" Facts"
    facts:
      - "Georgia adopted \"Georgia on My Mind\" as its official state song in 1979."
      - "Hoagy Carmichael composed the music and Stuart Gorrell wrote the lyrics in 1930."
      - "Ray Charles, born in Albany, Georgia, recorded the best-known version in 1960."
      - "Charles performed the song live at the Georgia capitol the year it was adopted."
      - "The 1960 Ray Charles recording won two Grammy Awards and reached number one on the Billboard Hot 100."

