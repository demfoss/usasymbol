- id: facts
  icon: fa-solid fa-lightbulb
  title: Largemouth Bass Facts
  facts:
  - Adopted in 1970 by the Georgia Legislature.
  - Its scientific name is Micropterus salmoides.
  - Its upper jaw reaches past the back of its eye.
  - Georgia's state record weighed 22 pounds, 4 ounces.
  - That 1932 fish from Montgomery Lake is still tied for the world record.
faq:
- question: What is Georgia's state fish?
  answer: Georgia's state fish is the largemouth bass. It is a freshwater game fish with a very large mouth and a dark stripe along its side.
- question: When did Georgia adopt the Largemouth Bass?
  answer: The Georgia Legislature made the largemouth bass the official state fish in 1970.
- question: Why did Georgia choose the Largemouth Bass?
  answer: The state says fishing for largemouth bass is very popular in Georgia. Georgia waters also produced a record-setting bass in 1932.
- question: Where was the world record largemouth bass caught?
  answer: George Perry caught it at Montgomery Lake in South Georgia on June 2, 1932. It weighed 22 pounds, 4 ounces.
- question: How can you tell a largemouth bass from other bass?
  answer: Check the mouth. On a largemouth bass, the upper jaw reaches past the back of the eye when the mouth is closed.
