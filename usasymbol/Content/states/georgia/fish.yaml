seo_title: Georgia State Fish | Largemouth Bass
seo_description: The Georgia state fish is the largemouth bass, adopted in 1970. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/georgia/georgia-fish-hero.webp
hero_image_alt: A greenish largemouth bass with a dark stripe along its side and a wide mouth.
hero_image_caption: The largemouth bass has been Georgia's official state fish since 1970. Photo by Arnaudia31, CC BY 4.0.
intro_text: Georgia's state fish is the largemouth bass, a big-mouthed freshwater game fish found in lakes and rivers across the state, adopted in 1970. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Georgia?
  paragraphs:
  - The largemouth bass is Georgia's official state fish. The Georgia Legislature gave it this title in 1970.
  - Its scientific name is Micropterus salmoides. Georgia also has a state cold water game fish, the Southern Appalachian brook trout, and a state saltwater fish, the red drum.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Largemouth Bass
  paragraphs:
  - The largemouth bass is green to olive on its back and lighter on its belly.
  - A dark, uneven stripe runs along each side of its body from head to tail.
  - Its name comes from its huge mouth. When the mouth is closed, the upper jaw reaches past the back of the eye.
  - It is one of the most popular freshwater game fish in the United States.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Georgia Legislature named the largemouth bass the official state fish in 1970. State law simply says the largemouth bass is the official Georgia state fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Georgia Chose the Largemouth Bass
  paragraphs:
  - The state points to Georgia's many good fishing waters and says fishing for largemouth bass is very popular there.
  - Georgia is also home to a famous record fish. In 1932, a farmer named George Perry caught a 22-pound, 4-ounce largemouth bass at Montgomery Lake in South Georgia. It still stands as the Georgia state record and is tied for the world record.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Largemouth Bass
  paragraphs:
  - Largemouth bass live in lakes, ponds, reservoirs, and slow rivers all over Georgia.
  - Anglers fish for them in big lakes such as Lake Seminole, West Point Lake, and Lake Allatoona. Montgomery Lake, where the record bass was caught, is a backwater lake beside the Ocmulgee River.
