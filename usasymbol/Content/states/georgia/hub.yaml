name_meaning:
  heading: What Does Georgia Mean?
  paragraphs:
  - Georgia is one of the original thirteen states and became the fourth state to ratify the U.S. Constitution in 1788. The colony was named for King George II of Great Britain, who granted the colonial charter in 1732.
  - The name Georgia therefore means, in practical historical use, land associated with George. It is a royal colonial name rather than a description of the landscape or a name derived from an Indigenous language.
  - Georgia is most widely known as the Peach State, while Empire State of the South and Goober State point to older economic and agricultural identities. Its postal abbreviation is GA, and residents are Georgians.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named for King George II of Great Britain, who granted the Georgia colonial charter in 1732.
    - label: Name type
      text: A royal colonial name rather than a geographic or Indigenous-language name.
    - label: Statehood
      text: Georgia ratified the U.S. Constitution on January 2, 1788.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Georgia, one of the original thirteen states.
    - label: Colony
      text: The Province of Georgia was founded in 1732 as the last of the thirteen English colonies.
    - label: Country
      text: Georgia is also the English name of an independent country in the Caucasus; the two names have different histories.
    - label: People
      text: People from the U.S. state are called Georgians.
  - heading: Nicknames and Short Forms
    items:
    - label: Peach State
      text: Official popular identity tied to Georgia peaches and agricultural branding.
    - label: Empire State of the South
      text: Older nickname emphasizing Georgia's economic and political weight in the South.
    - label: Goober State
      text: Informal nickname tied to peanuts, a major Georgia crop.
    - label: Abbreviation
      text: GA; older short form Ga.
editorial:
  heading: What Georgia's Symbols Say About the State
  paragraphs:
  - Georgia's [state flag](/states/georgia/flag) carries more political history than most state symbols. The current design removed the 1956 Confederate battle flag from the state flag, but it still uses a pattern based on the Confederacy's first national flag.
  - "The [brown thrasher](/states/georgia/bird), [Cherokee rose](/states/georgia/flower), and [live oak](/states/georgia/tree) give Georgia a more local register: a bird no other state uses, a flower wrapped in Cherokee-removal folklore, and a tree associated with coastal strength and old Southern landscapes."
  - Georgia's animal symbols split between land, coast, and modern adoption culture. The [white-tailed deer](/states/georgia/mammal/white-tailed-deer) tells a conservation recovery story, the [North Atlantic right whale](/states/georgia/mammal/right-whale) makes Georgia responsible for calving waters, and the [adoptable dog](/states/georgia/mammal/adoptable-dog) turns shelter adoption into an official civic value.
faq:
- question: What is the Georgia state abbreviation?
  answer: The Georgia postal abbreviation is [GA](/states/georgia/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: Does Georgia get snow?
  answer: Rarely outside the mountains. Most of Georgia sees fewer than 2 snow days per year, ranking among the [states with the least snow](/rankings/geography/states-with-no-snow).
- question: What is Georgia's most famous state symbol?
  answer: The [brown thrasher](/states/georgia/bird) is one of Georgia's distinctive symbols because no other state uses it as an official state bird.
- question: What is Georgia's state bird?
  answer: Georgia's state bird is the [brown thrasher](/states/georgia/bird), codified in 1970.
- question: What is Georgia's state flower?
  answer: Georgia's state flower is the [Cherokee rose](/states/georgia/flower), adopted in 1916.
- question: Why is Georgia called the Peach State?
  answer: Georgia is called the Peach State because peaches became one of the state's best-known agricultural brands. The nickname is covered on the [Georgia nickname](/states/georgia/nickname) page.
- question: How many official state symbols does Georgia have?
  answer: Georgia's state symbols list here includes the flag, brown thrasher, Cherokee rose, live oak, motto, whale, deer, and adoptable animal symbols.
