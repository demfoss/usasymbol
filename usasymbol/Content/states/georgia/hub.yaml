seo_description: "Georgia symbols include the brown thrasher, Cherokee rose, live oak, state motto, and the 2003 flag."
snippet_answer: Among the major Georgia state emblems are the brown thrasher, Cherokee rose, and live oak — three symbols that speak to woodland and garden culture across the state. The Wisdom, Justice, and Moderation motto, 2003 flag, white-tailed deer, and coastal right whale round out a guide that reaches from familiar Southern woodlands to the Atlantic shoreline.
