seo_title: "Georgia License Plate Slogan | Peach State"
seo_description: "Peach State became Georgia's standard license plate slogan in 1957 and remains tied to the state's agricultural identity."
hero_image: /images/license-plates/georgia/peach-state-plate.webp
hero_image_alt: Georgia Peach State license plate with peach graphic
hero_image_caption: Georgia's current "Peach State" plate restored the state's best-known nickname after a long break from general-issue passenger plates.
intro_text: "**\"Peach State\"** is the slogan most closely associated with Georgia license plates, though it has not appeared continuously. Georgia first used it in 1940, ran it steadily from 1947 through 1970, and brought it back on the current 2012 standard plate, keeping the peach as the state's clearest plate symbol. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"Peach State\" is Georgia's best-known license plate slogan. It first appeared on Georgia general-issue passenger plates in 1940, ran as a long streak from 1947 through 1970, and returned on the current standard plate introduced in 2012."
