sections:
- id: peach-history
  icon: fa-solid fa-seedling
  title: How the Peach Became Georgia's Plate Symbol
  paragraphs:
  - 'Georgia did not start with the peach on its plates. Early twentieth-century Georgia plates were plain — a state name, a year, a number. The move toward distinctive state slogans accelerated nationally after World War II, as state tourism programs recognized that a memorable plate was free advertising on every highway in America.'
  - 'Georgia used "Peach State" early, dropped it for decades, then returned to it in 2012. The peach was not a neutral choice: it distinguished Georgia from neighboring Southern states and tied the plate to a product most Americans associated with the state by name. Once the peach returned as a standard graphic, the old nickname became visually unavoidable again.'
  - 'For context on how other states selected their plate slogans, see the [U.S. license plate slogans guide](/license-plates). Georgia''s approach — anchoring a plate to a single agricultural product — is shared by only a handful of states.'

- id: peach-state
  style: meaning-banner
  title: Meaning of Peach State
  paragraphs:
  - '"Peach State" works as a plate slogan because it is both accurate and recognizable. Georgia built its agricultural reputation on the peach, and for generations the state led U.S. peach production — a fact visible in roadside stands, state symbols, and eventually on the license plates that left Georgia''s borders. The phrase does not require explanation for most Americans.'
  - 'The peach graphic does as much work as the words. A single stylized peach communicates Georgia''s nickname even when the exact bottom or top text changes. That visual shorthand is rare among state plates, and it lets the state preserve the agricultural identity even across redesigns that do not print "Peach State" as the main slogan.'
  - 'Georgia''s [state nickname](/states/georgia/nickname) is also "Peach State," so the plate and the official identity reinforce each other. The [state fruit](/states/georgia) — the peach — was formally codified in 1995, but the peach had been on Georgia plates well before that designation made it official.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Georgia License Plate Designs by Era
  paragraphs:
  - Georgia's standard plates have gone through several distinct slogan and graphic generations. The peach identity appears early, vanishes from the slogan for decades, then returns as the central visual language of the current plate.
  versions:
  - name: Peach State slogan streak
    years: 1947–1970
    image: /images/license-plates/georgia/early-georgia-plate.webp
    description: Georgia used "Peach State" as a general-issue passenger plate slogan beginning in 1940, with its longest uninterrupted streak running from 1947 through 1970. Mid-century examples were simple embossed plates, but the slogan was unmistakable.
  - name: Late Peach State streak
    years: 1960s–1970
    image: /images/license-plates/georgia/1970s-georgia-plate.webp
    description: Georgia kept the "Peach State" text through the end of the 1960s, usually on plain high-contrast plates with the state name, year, and county-coded registration number. The slogan streak ended after 1970.
  - name: Georgia on My Mind
    years: 1997–2011
    image: /images/license-plates/georgia/1990s-peach-state-plate.webp
    description: Georgia's 1997 base used part of the state song title, "...on my mind," alongside a faint peach graphic. It preserved the peach association visually, but it was not a "Peach State" slogan plate.
  - name: Current Standard Plate
    years: 2012–present
    image: /images/license-plates/georgia/2012-georgia-plate.webp
    description: Georgia's current standard plate brought "Peach State" back to general-issue plates in 2012. The design uses a peach orchard scene and large "GEORGIA" text, restoring the nickname after more than forty years away from the regular passenger plate slogan.

- id: why-peach
  icon: fa-solid fa-rotate
  title: Why the Peach Outlasted Every Other Georgia Plate Choice
  paragraphs:
  - 'The peach survived every Georgia plate redesign because the alternative — a generic state name on a plain background — gave drivers nothing to remember. State tourism offices understood early that the plate is a moving advertisement, and the peach gave Georgia a single, concrete image that traveled to every state in the country on Georgia-registered vehicles.'
  - "Georgia is not actually the top peach-producing state today — California and South Carolina have both surpassed it in raw output. But the \"Peach State\" identity was established when Georgia's production numbers supported it, and cultural identity is stickier than agricultural statistics. The peach on the plate is now historical branding as much as current fact."
  - "Georgia's [state flag](/states/georgia/flag) and [state symbols](/states/georgia) reinforce a different set of Georgia identities — the live oak, the brown thrasher, the Cherokee rose. The license plate is where the peach holds its ground, as a symbol that survived every redesign cycle intact."

timeline:
- year: '1940'
  description: '"Peach State" first appears on Georgia general-issue passenger plates.'
- year: 1947–1970
  description: Georgia maintains its longest uninterrupted "Peach State" plate slogan streak.
- year: 1995
  description: Georgia formally designates the peach as the state fruit, giving the plate symbol an official statutory counterpart.
- year: '1997'
  description: Georgia introduces a base using the phrase "...on my mind," a reference to the state song "Georgia on My Mind."
- year: 2012
  description: Georgia issues the current standard plate and returns "Peach State" to general-issue passenger plates after a hiatus of more than forty years.

faq:
- question: What is Georgia's license plate slogan?
  answer: Georgia's best-known license plate slogan is "Peach State." It first appeared on Georgia general-issue passenger plates in 1940, ran as a long streak from 1947 through 1970, and returned on the current plate in 2012.
- question: Why does Georgia use a peach on its license plates?
  answer: Georgia built its reputation on peach farming and was long the leading peach-producing state in the country. The peach became Georgia's most recognizable agricultural symbol, and placing it on the plate turned every Georgia-registered vehicle into a moving advertisement for that identity.
- question: Is Georgia still the top peach-producing state?
  answer: No. Georgia earned the "Peach State" nickname when its production numbers led the country, but California and South Carolina now produce more peaches annually. The nickname and the plate slogan reflect historical branding that stuck long after the statistics changed.
- question: When did the peach appear on Georgia license plates?
  answer: The "Peach State" slogan first appeared on Georgia plates in 1940. The current peach orchard graphic and returned "Peach State" wording arrived with the 2012 standard plate.
- question: What does the current Georgia license plate look like?
  answer: The current Georgia standard plate, introduced in 2012, features large "GEORGIA" text, a peach orchard scene, and the "Peach State" slogan.
- question: Does Georgia have specialty license plates?
  answer: Yes. Georgia offers a large number of specialty and personalized plates. The standard "Peach State" design remains the most-issued, but Georgians can also choose plates supporting universities, military branches, causes, and cultural organizations.

