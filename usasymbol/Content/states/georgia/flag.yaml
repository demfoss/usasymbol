faq:
- question: Is Georgia's current flag based on the Confederate flag?
  answer: Yes. Georgia's current flag, adopted in 2003, is modeled on the First National Flag of the Confederacy — the Stars and Bars from 1861. The red-white-red stripe pattern and blue canton come directly from that design. The state coat of arms replaces the Confederate stars in the canton. Georgia's original 1879 official flag was also based on the Stars and Bars.
- question: Why did Georgia change its state flag?
  answer: Georgia changed its flag in 2003 to remove the Confederate battle flag that had appeared on the design since 1956. A 2000 Georgia Senate research report concluded the 1956 change was made during an atmosphere of preserving segregation following Brown v. Board of Education. After the 2001 compromise design ranked worst in a national survey, the legislature adopted the 2003 Stars and Bars design.
- question: Did Georgia vote on its state flag?
  answer: Yes. A referendum on March 2, 2004, asked voters to choose between the 2001 Barnes design and the 2003 Stars and Bars design. The 2003 flag won with 73.1% of the vote. The 1956 Confederate battle flag was not included as an option on the ballot.
- question: What do the symbols on Georgia's flag mean?
  answer: The 13 white stars represent Georgia as one of the original Thirteen Colonies. The coat of arms shows three pillars (labeled Wisdom, Justice, and Moderation — the state motto) supporting an arch inscribed with Constitution, representing the three branches of government. A colonial soldier with a drawn sword stands between the pillars, representing defense of the constitution. IN GOD WE TRUST appears below the coat of arms.
- question: How many times has Georgia changed its state flag?
  answer: Georgia has had eight official flag designs — more than any other U.S. state. Major changes occurred in 1879, 1902, 1906, 1920, 1956, 2001, and 2003. The most controversial change was in 1956, when the Confederate battle flag was incorporated. It was removed in 2003.
