  title: Georgia's Eight Official Flag Designs
  versions:
  - name: Pre-1879 Militia Flag
    years: Pre-1879
    image: versions/militia-pre1879.webp
    description: Unofficial flag supplied to militia units bearing the coat of arms on a blue field.
  - name: Perry Flag
    years: 1879–1902
    image: versions/perry-1879.webp
    description: First official flag with vertical blue band and horizontal red-white-red stripes, designed by former Confederate colonel Herman H. Perry and based directly on the Confederate Stars and Bars.
  - name: Coat of Arms Addition
    years: 1902–1906
    image: versions/coat-arms-1902.webp
    description: Coat of arms stamped, painted, or embroidered on the blue band. No surviving examples exist from this period.
  - name: Shield Version
    years: 1906–1920
    image: versions/shield-1906.webp
    description: White shield added with gold outline and red GEORGIA banner below coat of arms. Date changed from 1799 to 1776 in 1914.
  - name: State Seal Version
    years: 1920–1956
    image: versions/seal-1920.webp
    description: Coat of arms replaced with state seal in white and blue on the blue band.
  - name: Confederate Battle Flag
    years: 1956–2001
    image: versions/battle-flag-1956.webp
    description: Red and white stripes replaced with the Confederate battle flag, designed by attorney John Sammons Bell. Signed into law February 13, 1956. A 2000 Georgia Senate report linked the adoption to the segregation atmosphere following Brown v. Board of Education.
  - name: Barnes Flag
    years: 2001–2003
    image: versions/barnes-2001.webp
    description: Compromise design by architect Cecil Alexander showing five historical Georgia flags under the words Georgia's History. Ranked worst among all 72 North American flags in a NAVA survey.
  - name: Current Flag
    years: 2003–present
    image: versions/modern-2003.webp
    description: Based on the Confederate Stars and Bars, adopted February 19, 2003. Approved by referendum March 2, 2004, with 73.1% of the vote — the 1956 battle flag was not on the ballot.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Quick Facts
  facts:
  - Georgia has had eight official flag designs — more than any other state
  - The current flag is based on the Confederate Stars and Bars — the Confederacy's first national flag from 1861
  - The 2004 referendum excluded the 1956 Confederate battle flag from the ballot
  - The 2003 design won the 2004 referendum with 73.1% of the vote
  - The 1956 flag was adopted during the segregation era — a 2000 Georgia Senate report confirmed the connection
  - The 2001 Barnes flag was ranked worst among all 72 North American flags in the NAVA survey
  - The coat of arms date was changed from 1799 to 1776 in 1914
  - Georgia is one of three states whose flag carries the motto IN GOD WE TRUST
  - Gold is the only flag color not defined by statute — shade varies by manufacturer
