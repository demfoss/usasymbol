sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Cold Water Game Fish of Georgia?
  paragraphs:
  - The Georgia Legislature named the Southern Appalachian brook trout the official state cold water game fish in 2006. Its scientific name is Salvelinus fontinalis.
  - Georgia has other fish symbols too. The largemouth bass is the state fish, and the red drum is the state saltwater fish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Southern Appalachian Brook Trout
  paragraphs:
  - The brook trout has a dark back covered with light, wavy markings that look like little worms.
  - Its lower fins have bright white front edges, which makes the fish easy to spot in the water.
  - State lawmakers praised it for its brilliant colors and detailed patterns. Wild brook trout in Georgia's small mountain streams are usually small fish.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Cold Water Game Fish
  paragraphs:
  - The Georgia Legislature made the Southern Appalachian brook trout the official state cold water game fish in 2006.
  - The same law also named the red drum as Georgia's state saltwater fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Georgia Chose the Southern Appalachian Brook Trout
  paragraphs:
  - Lawmakers said the brook trout is Georgia's only native member of the trout and salmon family. It lives in the clean, cold, clear waters of the North Georgia mountains.
  - They also said the fish shows how clean the water and air are. When brook trout numbers drop, it can be an early warning sign of trouble in the environment. Lawmakers hoped that naming it a state symbol would help protect it.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Southern Appalachian Brook Trout
  paragraphs:
  - Brook trout live only in the cold mountain streams of North Georgia. Georgia has about 4,000 miles of trout streams, but only about 150 miles still have native brook trout.
  - Most of them now live in small, high-elevation streams. One example is the set of small creeks that feed into Noontootla Creek in the North Georgia mountains.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Southern Appalachian Brook Trout Facts
  facts:
  - Adopted in 2006 by the Georgia Legislature.
  - Its scientific name is Salvelinus fontinalis.
  - It is the only trout native to Georgia.
  - It has light, worm-like markings on a dark back and white edges on its lower fins.
  - Rainbow trout and brown trout were brought into Georgia streams in the 1880s.
faq:
- question: What is Georgia's state cold water game fish?
  answer: Georgia's state cold water game fish is the Southern Appalachian brook trout. It is a native trout of the North Georgia mountains.
- question: When did Georgia adopt the Southern Appalachian brook trout?
  answer: The Georgia Legislature named the Southern Appalachian brook trout the state cold water game fish in 2006.
- question: Why did Georgia choose the Southern Appalachian brook trout?
  answer: Lawmakers chose it because it is Georgia's only native trout and because it needs very clean, cold water. That makes it a good sign of a healthy environment.
- question: Is the brook trout the only trout in Georgia?
  answer: No. Georgia also has rainbow trout and brown trout, but people brought those fish into the state's streams in the 1880s. The brook trout is the only trout that is native to Georgia.
- question: Is the brook trout Georgia's state fish?
  answer: No. The largemouth bass is Georgia's state fish. The brook trout has its own title as the state cold water game fish.
