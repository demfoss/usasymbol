faq:
  - question: "What is Georgia's state animal?"
    answer: "Georgia's state animal is the white-tailed deer (Odocoileus virginianus), designated as the official state mammal in 2015."
  
  - question: "When was the white-tailed deer designated as Georgia's state animal?"
    answer: "The white-tailed deer became Georgia's state mammal on April 30, 2015, when Governor Nathan Deal signed House Bill 70 into law. The designation took effect on July 1, 2015."
  
  - question: "Why did Georgia choose the white-tailed deer as its state animal?"
    answer: "Georgia chose the white-tailed deer because it represents one of conservation's greatest success stories. The species nearly disappeared from Georgia by the early 1900s, with only about 5,000 deer remaining statewide. Through the efforts of conservationists like ranger Arthur Woody and science-based management, the population recovered to approximately 1.1 million deer today. The species was chosen because deer live in all Georgia counties, support a major hunting tradition, and generate substantial economic activity."
  
  - question: "Who was Arthur Woody and what did he do for Georgia's deer?"
    answer: "Arthur Woody was a U.S. Forest Service ranger who served in north Georgia from 1912 to 1945. Known as the Barefoot Ranger of Suches, Woody personally purchased deer from North Carolina beginning in 1927 and released them in what became Blue Ridge Wildlife Management Area. His work laid the foundation for deer restoration across Georgia's mountains. He is also remembered for introducing rainbow and brown trout to the region and for helping establish Georgia's first wildlife management area."
  
  - question: "Where can I see white-tailed deer in Georgia?"
    answer: "White-tailed deer live in all 159 Georgia counties and can be seen in most state parks and wildlife management areas. Prime viewing locations include Amicalola Falls State Park, Cloudland Canyon State Park, Blue Ridge WMA, and Providence Canyon State Park. Dawn and dusk offer the best opportunities to observe deer. Many suburban areas also have visible deer populations."
  
  - question: "Does Georgia have other official mammals?"
    answer: "Yes, Georgia designated the North Atlantic right whale as its official state marine mammal in 1985, thirty years before adding the white-tailed deer as state mammal."
  
  - question: "Is the white-tailed deer on Georgia's flag or seal?"
    answer: "No, the white-tailed deer does not appear on Georgia's flag or Great Seal. The seal features three pillars representing the three branches of government, with the state motto 'Wisdom, Justice, and Moderation' and the date 1776. The flag displays the state coat of arms surrounded by 13 stars representing Georgia's status as one of the original colonies."
  
  - question: "Are white-tailed deer endangered in Georgia?"
    answer: "White-tailed deer are not endangered in Georgia. The state has a stable population of approximately 1.1 million deer. This represents a remarkable recovery from the early 1900s when only about 5,000 deer remained statewide. Georgia manages deer populations through regulated hunting seasons to maintain healthy numbers."
  
  - question: "How many white-tailed deer live in Georgia?"
    answer: "Georgia's white-tailed deer population is estimated at approximately 1.1 million animals. This population is distributed across all 159 counties, with higher densities in central and south Georgia. Nearly 300,000 deer are harvested annually during hunting seasons."

