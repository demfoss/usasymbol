title: "White-Tailed Deer"
scientific_name: "Odocoileus virginianus"
adopted_year: 2015

seo_title: "Georgia State Mammal - White-Tailed Deer | Official State Animal"
seo_description: "The white-tailed deer is Georgia's state mammal, designated in 2015 after a student-led campaign. This species represents Georgia's wildlife recovery success story and the vision of ranger Arthur Woody."

intro_text: "Georgia's state mammal is the white-tailed deer (Odocoileus virginianus), designated in 2015 following a campaign by elementary students at Reese Road Leadership Academy. The legislature chose this species to honor a century-long recovery from near-extinction and to recognize the conservation legacy of ranger Arthur Woody, who restored deer to Georgia's mountains and helped shape [the Peach State's](/states/georgia/nickname/the-peach-state) wildlife identity."

common_name: "White-Tailed Deer"
official_since: "2015"
status: "Stable (population approximately 1.1 million statewide)"
habitat_in_state: "Forests, farmland, mountain regions, coastal plains, suburban woodlands"
known_for: "Representing one of conservation's greatest success stories in the Southeast"

size: "4 to 6 feet in length"
weight: "Males: 150-300 pounds; Females: 90-200 pounds"
coloration: "Reddish-brown in summer, grayish-brown in winter; white underside of tail"
distinctive_traits: "White tail flag raised when alarmed, antlers on males (shed annually), large ears"

habitat: "Mixed forests, agricultural lands, river valleys, mountain foothills"
range_in_state: "Found in all 159 Georgia counties; highest concentrations in central and south Georgia"
conservation_status: "Population recovered from 5,000 in early 1900s to approximately 1.1 million today"
where_to_find: "Amicalola Falls State Park, Blue Ridge WMA, Cloudland Canyon State Park, Providence Canyon State Park, Chattahoochee National Forest"
symbol_connections: "Recovery story parallels Cherokee Rose (resilience through hardship); hunting tradition connects to Georgia's rural heritage and economic vitality; ranger Arthur Woody's deer restoration mirrors conservation values"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor Nathan Deal signed House Bill 70 on April 30, 2015, making the white-tailed deer Georgia's official state mammal. The law took effect on July 1, 2015, adding a new category to Georgia's state symbols nearly three decades after the previous major wildlife designation."
      - "The designation came after more than 200 years of Georgia history with white-tailed deer. From abundant populations before European settlement through near-extinction in the early 1900s to today's healthy numbers, the deer's story mirrors Georgia's own evolution in land use and conservation thinking, a model often cited on the broader [U.S. state mammals hub](/symbols/mammals)."
    
    subsections:
      - subtitle: "A Boy Scout's Question Leads to Change"
        text: "The path to designation began in 2014 when Kevin Green, a fourth-grade Boy Scout at Reese Road Leadership Academy in Columbus, asked a simple question during a civics lesson: Why doesn't Georgia have a state mammal? His question sparked a project that engaged first-grade students at the same school. Working with teachers and the Georgia Department of Natural Resources' Wildlife Resources Division, the students researched native mammals and initially selected the gray fox as their choice."
      
      - subtitle: "From Gray Fox to White-Tailed Deer"
        text: "When the students presented their research to state legislators in February 2015, the General Assembly considered which animal best represented Georgia as a whole. Lawmakers ultimately chose the white-tailed deer over the gray fox. Representative Carolyn Hugley of Columbus sponsored House Bill 70 and emphasized three factors that made the deer the right choice: roughly one million deer live across all Georgia counties, making them familiar to most residents; deer hunting generates substantial economic activity through licenses, equipment, and land leases; and the species embodies a conservation success story spanning a full century."

  - id: "state-symbolism"
    title: "What the White-Tailed Deer Represents"
    style: "highlight"
    paragraphs:
      - "The white-tailed deer stands for recovery and second chances. By the early 1900s, Georgia had perhaps 5,000 deer left statewide after decades of unregulated hunting and forest clearing. Today's population of 1.1 million animals proves that wildlife can return when people make room for it."
      - "Georgia chose an animal central to both its past and present. Creek Indians shipped 60,000 deerskins annually to Europe by the 1750s, making deer central to trade networks before statehood. Modern Georgia sees 200,000 licensed deer hunters contribute roughly $1.5 billion to the state economy each year through equipment, travel, and land leases tied to region-by-region landscapes in [States Neighboring States](/rankings/geography/states-neighboring-states)."
      - "The deer connects Georgia's rural traditions with its conservation achievements. Selecting this species sent the message that hunting heritage and habitat protection strengthen each other rather than conflict, in line with [Georgia's motto of Wisdom, Justice, and Moderation](/states/georgia/motto/wisdom-justice-and-moderation)."
    
    subsections:
      - subtitle: "Arthur Woody and the Mountain Recovery"
        text: "No single person did more to restore Georgia's deer than Arthur Woody, a U.S. Forest Service ranger who served from 1912 to 1945 in the north Georgia mountains. Known as the Barefoot Ranger of Suches, Woody watched his father kill the last deer in that region in 1895. He never forgot. In 1927, Woody used his own money to purchase five deer fawns from North Carolina's Pisgah National Forest. He bottle-fed them and named them Nimble, Bessie, Billy, Nancy, and Bunnie-Girl. When they were strong enough, he released them into what became Rock Creek Refuge."
      
      - subtitle: "Building a Herd from Scratch"
        text: "Through the late 1920s and early 1930s, Woody continued buying deer from North Carolina and releasing them in his refuge area. He fiercely protected every animal, warning locals that poaching would bring consequences. The Forest Service initially resisted his deer program but eventually supported it. By 1936, Rock Creek Refuge became Blue Ridge Wildlife Management Area, Georgia's first WMA and one of the first in the nation where federal and state agencies partnered on wildlife management. From fewer than 70 original deer, the herd grew to an estimated 2,000 animals by 1940."
      
      - subtitle: "Statewide Restoration Takes Decades"
        text: "Georgia established its state game agency in 1911, laying groundwork for organized wildlife management. The first deer restocking outside the mountains began in 1927, the same year Woody started his program. Large-scale restocking ran from 1948 to 1965 and continued sporadically into the early 1980s. Biologists trapped deer from areas with growing populations and moved them to counties where deer remained absent. By 1972, Georgia had roughly 220,000 deer. The population peaked between 1998 and 2005 at 1.4 to 1.7 million animals."
      
      - subtitle: "A Symbol of Everyday Wildlife"
        text: "Lawmakers who voted for House Bill 70 emphasized that white-tailed deer live in every Georgia county. Residents see them crossing roads at dawn, feeding at forest edges, or raising fawns near suburban developments. This familiarity matters. The deer symbolizes not just recovery of a species but the continuing presence of wildlife in daily life across Georgia's diverse landscapes."
      
      - subtitle: "Economic Engine and Cultural Touchstone"
        text: "Deer hunting represents more than recreation in Georgia. Hunters lease private land, purchase equipment and licenses, book lodging, and buy food during hunting trips. This economic impact reaches rural communities where few other industries operate at that scale. The designation acknowledged that white-tailed deer contribute directly to Georgia's economy while remaining part of the state's outdoor heritage."
      
      - subtitle: "Students as Conservation Advocates"
        text: "The student campaign behind the designation showed how civic engagement creates lasting change. First-graders at Reese Road Leadership Academy researched Georgia's wildlife, built presentations, and traveled to the State Capitol to speak with legislators. Their project turned classroom learning into real-world advocacy and gave young Georgians ownership of their state's natural heritage. The success of their campaign proved that conservation issues matter to citizens across all age groups."

  - id: "identification"
    title: "How to Identify White-Tailed Deer"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "White-tailed deer in Georgia have reddish-brown coats during summer months that turn grayish-brown in winter. The underside of the tail is bright white, and deer raise this tail like a flag when alarmed, creating a distinctive warning signal visible to other deer."
        list_items:
          - "**Size**: 4-6 feet long, 3-4 feet tall at shoulder"
          - "**Weight**: Males average 150-300 pounds, females 90-200 pounds"
          - "**Coat**: Reddish-brown in summer, grayish-brown in winter"
          - "**Tail**: Brown on top, bright white underneath (raised when fleeing)"
          - "**Antlers**: Males grow and shed antlers annually; larger racks indicate older age and good nutrition"
      
      - subtitle: "Behavior and Diet"
        text: "White-tailed deer are crepuscular, meaning they are most active during dawn and dusk hours. They feed on leaves, acorns, fruits, agricultural crops, and woody browse. Deer are excellent swimmers and can leap nine-foot fences. Males compete for mates during the autumn rut, when bucks become more visible and less cautious."

  - id: "in-the-state"
    title: "White-Tailed Deer in Georgia"
    style: "default"
    
    paragraphs:
      - "White-tailed deer live in all 159 Georgia counties. Population density varies by region, with higher numbers in central and south Georgia where agricultural lands provide abundant food. North Georgia's mountain counties have lower densities but still support healthy populations."
      - "Georgia's deer population has stabilized at approximately 1.1 million animals after peaking near 1.7 million in the late 1990s and early 2000s. Wildlife biologists attribute the decline partly to changing habitat in some regions and predation from growing coyote and black bear populations in mountain areas."
    
    facts:
      - "**Statewide population**: Approximately 1.1 million deer"
      - "**Annual harvest**: Nearly 300,000 deer taken during the 2023-24 hunting season"
      - "**Licensed hunters**: More than 200,000 deer hunters in Georgia"
      - "**Economic impact**: Roughly $1.5 billion generated annually from deer hunting"

  - id: "where-to-see"
    title: "Where to See Georgia's State Mammal"
    style: "default"
    
    paragraphs:
      - "White-tailed deer are visible throughout Georgia, with dawn and dusk offering the best viewing times. State parks and wildlife management areas provide excellent opportunities to observe deer in natural settings without hunting pressure during closed seasons, often in habitats shared with [Georgia's state bird](/states/georgia/bird/brown-thrasher)."
    
    list_items:
      - "**Amicalola Falls State Park**: Georgia's tallest waterfall draws visitors year-round; white-tailed deer frequent the park's 1,500 acres of mountainous habitat, especially in winter when they seek refuge from harsh weather"
      - "**Blue Ridge Wildlife Management Area**: Historic site where Arthur Woody released Georgia's first restored deer in the late 1920s; this 30,000-acre property in the Chattahoochee National Forest supports a healthy deer population"
      - "**Cloudland Canyon State Park**: Dramatic canyons and overlooks on Lookout Mountain provide habitat for deer and offer scenic viewing opportunities on the park's extensive trail system"
      - "**Providence Canyon State Park**: Georgia's Little Grand Canyon attracts deer to feed along canyon edges at dawn and dusk; visitors hiking canyon trails often encounter deer in the surrounding pine forests"
      - "**Georgia Wildlife Management Areas**: More than 100 WMAs across the state provide public access during non-hunting periods; check with Georgia DNR for seasonal closures and access rules"

  - id: "current-status"
    title: "Current Status and Management"
    style: "default"
    paragraphs:
      - "White-tailed deer are abundant in Georgia and face no conservation threats at the population level. The Georgia Department of Natural Resources' Wildlife Resources Division monitors deer populations through harvest data, aerial surveys, and trail camera studies. These scientific methods help biologists set appropriate hunting seasons and bag limits."
      - "Georgia uses deer hunting as a management tool to keep populations balanced with available habitat. Without natural predators like mountain lions and red wolves (both extirpated from Georgia), regulated hunting prevents overpopulation that could lead to starvation, disease, and habitat damage."
    
    subsections:
      - subtitle: "Modern Management Challenges"
        text: "Wildlife managers balance multiple goals: maintaining healthy deer populations, preventing crop damage, reducing vehicle collisions, and providing hunting opportunities. Some regions face pressure from suburban development that fragments habitat and restricts hunting access. Other areas deal with agricultural damage where deer consume crops. Vehicle collisions with deer remain a public safety concern, with thousands of incidents reported annually across Georgia."
      
      - subtitle: "Chronic Wasting Disease Vigilance"
        text: "Chronic wasting disease (CWD), a fatal neurological illness affecting deer and elk, has been detected in neighboring states including Florida, Alabama, and Tennessee. Georgia has not yet confirmed CWD within its borders, but the Wildlife Resources Division conducts ongoing surveillance through testing of harvested deer. The agency restricts importing live deer and certain deer parts from CWD-positive states to reduce introduction risk."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The white-tailed deer shares thematic connections with several Georgia state symbols. The Cherokee Rose, Georgia's state flower since 1916, represents resilience through hardship—the same quality that defines the deer's recovery from near-extinction. Both symbols honor survival and renewal in the face of devastating challenges, as explained on [Georgia's flower page](/states/georgia/flower/cherokee-rose)."
      - "Georgia's state motto, adopted with the Great Seal in 1798, declares three principles: Wisdom, Justice, and Moderation. These values apply to wildlife management as much as to government. Restoring deer populations required wisdom in scientific planning, justice in protecting animals through law, and moderation in allowing sustainable hunting rather than complete protection or uncontrolled harvest."
    
    subsections:
      - subtitle: "The Southern Live Oak Connection"
        text: "Georgia's state tree, the southern live oak (designated 1937), and the white-tailed deer both exemplify endurance. Ancient live oaks, some more than 500 years old, survived centuries of storms, logging, and land clearing. Deer survived the same pressures during Georgia's early development. Both species now thrive across the state because Georgians chose to protect them. The live oak provides critical habitat for deer, offering acorns as a primary food source and dense canopy for shelter."
        link:
          label: "See Georgia state tree"
          url: "/states/georgia/tree/southern-live-oak"
      
      - subtitle: "Paired with the North Atlantic Right Whale"
        text: "Georgia designated the critically endangered North Atlantic right whale as its state marine mammal in 1985, thirty years before adding the white-tailed deer. These paired symbols cover Georgia's terrestrial and marine environments. Where the whale represents ongoing conservation challenges and the fight to prevent extinction, the deer represents successful recovery and sustainable management. Together they tell a complete story: some species need emergency intervention while others demonstrate that protection works."
        link:
          label: "See Georgia state marine mammal"
          url: "/states/georgia/mammal/right-whale"

