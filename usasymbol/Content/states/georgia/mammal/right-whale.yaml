title: "Georgia State Marine Mammal | North Atlantic Right Whale"
scientific_name: "Eubalaena glacialis"
adopted_year: 1985

seo_title: "Georgia State Marine Mammal | North Atlantic Right Whale"
seo_description: "Georgia's state marine mammal is the North Atlantic Right Whale, adopted in 1985. Learn why this official Georgia symbol was chosen and what it represents."

intro_text: "The North Atlantic Right Whale is the official Georgia state marine mammal, designated in 1985. This page gives the direct answer for searches like 'georgia state marine mammal', 'georgia state animal', and 'georgia state mammal' while explaining how the symbol fits the state's official animal designations. Georgia's waters are the only known calving grounds for the entire species."

common_name: "North Atlantic Right Whale"
official_since: "1985"
status: "Critically Endangered (approximately 384 individuals remaining worldwide)"
habitat_in_state: "Coastal waters within 15 miles of shore from November through April"
