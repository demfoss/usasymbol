size: "45 to 55 feet in length"
weight: "Adults: 40-70 tons (80,000-140,000 pounds)"
coloration: "Black body with distinctive white patches (callosities) on head"
distinctive_traits: "No dorsal fin, V-shaped blow spout, massive head up to one-quarter of body length, white callosities on head"

habitat: "Open ocean, coastal waters, Gulf of St. Lawrence (summer feeding grounds)"
range_in_state: "Coastal waters from Savannah south to Cumberland Island, typically within 15 miles of shore"
conservation_status: "Critically Endangered under Endangered Species Act since 1970; ongoing Unusual Mortality Event since 2017; only about 70 reproductively active females remain"
where_to_find: "Jekyll Island (December-April), Cumberland Island National Seashore, Sapelo Island area, coastal waters off Brunswick and St. Simons Island; viewing from shore or authorized boat tours only"
symbol_connections: "Designated the same year as North Atlantic Right Whale Consortium formed (1986); represents Georgia's coastal conservation values and scientific contribution to marine mammal protection; balances white-tailed deer (land) designation from 2015"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor Joe Frank Harris signed Senate Resolution No. 91 on April 2, 1985, designating the right whale as Georgia's official state marine mammal. The resolution specifically noted that Georgia had never had a state marine mammal and that recent discoveries made this whale the perfect choice for coastal Georgia."
      - "The designation came just months after researchers confirmed what many suspected: the waters off Georgia's coast serve as the only known calving grounds for the entire North Atlantic right whale population. This discovery placed Georgia at the center of international conservation efforts for one of the world's most endangered large whales and is now referenced in the [U.S. marine mammals hub](/symbols/marine-mammals)."
    
    subsections:
      - subtitle: "A Photograph Changes Everything"
        text: "In 1980, photographers from the Georgia Department of Natural Resources captured images of a right whale off the Georgia coast. They sent the photographs to the New England Aquarium in Boston, where researchers identified the whale as Fermata, an individual they had been tracking for years in northern waters. This single photograph raised an urgent question: What was Fermata doing off Georgia's coast in winter?"
      
      - subtitle: "The 1984 Expedition"
        text: "In February 1984, Scott Kraus from the New England Aquarium led an expedition to Georgia's coastal waters, partnering with volunteer Delta Airlines pilots from Atlanta who provided aircraft and expertise. During five days of aerial surveys, the team spotted Fermata with a newborn calf, then found 14 more adult whales and four additional newborn calves. The expedition confirmed what had been unknown for centuries: right whales were using Georgia's warm, shallow coastal waters as their birthing grounds."

  - id: "state-symbolism"
    title: "What the Right Whale Represents"
    style: "highlight"
    paragraphs:
      - "The North Atlantic right whale symbolizes Georgia's stewardship of marine resources that reach far beyond state boundaries. Every pregnant female in the entire species depends on the safety of Georgia's coastal waters for one of the most vulnerable moments in a whale's life: giving birth and nursing a newborn calf."
      - "Georgia chose an animal on the edge of extinction, sending a powerful message about conservation priorities. In 1985, fewer than 300 right whales remained. Today, despite decades of protection, the population has only reached approximately 384 individuals. The designation acknowledges that protecting endangered species requires long-term commitment even when recovery seems slow."
      - "The whale connects Georgia to its maritime history. These same waters once supported commercial whaling in the 1800s, contributing to the species' near-extinction. By designating the right whale as state marine mammal, Georgia accepted responsibility for repairing historical damage and ensuring future generations can witness these gentle giants, consistent with [Georgia's state motto values](/states/georgia/motto/wisdom-justice-and-moderation)."
    
    subsections:
      - subtitle: "Why 'Right' Whale?"
        text: "Whalers named this species the 'right' whale to hunt starting around 800 years ago. Right whales swim slowly near the surface close to shore, making them easy targets. Their bodies contain enormous amounts of blubber, providing high yields of whale oil for lamps and other uses. When killed, right whales float rather than sink, allowing whalers to tow them to shore for processing. These characteristics made them the 'right' choice for commercial hunting, driving the species to the brink of extinction by the late 1800s."
      
      - subtitle: "The Discovery That Changed Conservation"
        text: "Before 1980, scientists knew right whales summered in the Bay of Fundy and other northern feeding grounds, then disappeared south in winter. Finding the calving grounds off Georgia and northern Florida answered one of marine biology's major unsolved mysteries. The discovery transformed conservation strategy because protecting calving mothers and vulnerable newborns became a top priority. Georgia's waters within 15 miles of shore from Savannah to the Florida border received federal designation as critical habitat."
      
      - subtitle: "A Stranded Calf Raises Awareness"
        text: "In the winter of 1981-82, Charles Cowan, Hans Neuhauser, and Cathy Sakas discovered a beached right whale calf on Little St. Simons Island. The stranded calf sparked investigation into whether right whales were regularly present off Georgia's coast rather than being rare visitors. This finding, combined with the 1980 photographs, led to the 1984 expedition that proved Georgia's waters served as calving grounds."
      
      - subtitle: "Only One Calving Ground for Entire Species"
        text: "The waters off Georgia and northern Florida within 15 miles of shore represent the only known place where North Atlantic right whales give birth. Pregnant females arrive in late November and stay through March, seeking calm, warm, predator-free waters where newborns can build strength before the long migration north. This geographic concentration makes the species especially vulnerable—any disaster in these waters could eliminate an entire year's worth of calves."
      
      - subtitle: "Georgia's Coastal Communities as Stewards"
        text: "Designating the right whale as state marine mammal elevated awareness among Georgia's coastal residents, boaters, and commercial mariners. The species faces two primary threats: vessel strikes and entanglement in fishing gear. Seasonal speed restrictions for large vessels, boater education programs, and modified fishing practices all grew from recognizing that Georgia's activities directly affect the species' survival. The designation turned abstract conservation goals into local responsibility."
      
      - subtitle: "Science and Collaboration"
        text: "Georgia's Department of Natural Resources partners with the Clearwater Marine Aquarium Research Institute and Florida Fish and Wildlife Conservation Commission to conduct aerial and boat-based surveys each winter. Researchers photograph the unique white patterns on each whale's head, allowing individual identification and tracking across years. These surveys provide essential data on calf production, population trends, and health status. The North Atlantic Right Whale Consortium, established in 1986, coordinates research and conservation efforts across the United States and Canada."

  - id: "identification"
    title: "How to Identify North Atlantic Right Whales"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "North Atlantic right whales are massive baleen whales with distinctive features that make them identifiable even from shore or aircraft. They lack a dorsal fin, giving them a smooth back profile. The head is enormous, accounting for up to one-quarter of total body length, with a strongly arched upper jaw (rostrum)."
        list_items:
          - "**Size**: 45-55 feet long when fully grown"
          - "**Weight**: 40-70 tons (80,000-140,000 pounds) for adults"
          - "**Calves**: About 14 feet long and 1 ton at birth; double in length during first year"
          - "**Coloration**: Black body; white patches (callosities) on head, jaw, and sometimes belly"
          - "**Distinctive Features**: No dorsal fin, V-shaped blow spout from two blowholes, massive head, flipper-like pectoral fins"
          - "**Callosities**: White or cream-colored rough patches on head colonized by whale lice; unique patterns allow individual identification"
      
      - subtitle: "Behavior and Feeding"
        text: "Right whales are baleen whales, meaning they filter tiny prey from seawater rather than hunting with teeth. Up to 270 baleen plates hang from each side of the upper jaw, trapping copepods and other zooplankton as water flows through. Right whales spend spring and summer in northern feeding grounds where cold, nutrient-rich waters support dense concentrations of prey. They are relatively slow swimmers, typically traveling at 3-5 miles per hour, though they can breach (leap from the water) and slap their flukes on the surface."

  - id: "in-the-state"
    title: "North Atlantic Right Whales in Georgia"
    style: "default"
    
    paragraphs:
      - "Right whales visit Georgia's coastal waters seasonally, arriving in late November and departing by April. Pregnant females come to give birth in the relatively warm, calm waters within 15 miles of shore. Mothers and newborn calves stay close together, with calves nursing frequently as they build strength for the journey north along corridors linked to neighboring states in [States Neighboring States](/rankings/geography/states-neighboring-states)."
      - "Georgia typically sees 10-20 mother-calf pairs each season, though numbers vary by year. Not all pregnant females use the calving grounds every year, and some calves are born in unexpected locations farther north. Researchers conduct regular aerial and boat surveys throughout the winter season to document which whales are present and monitor their health."
    
    facts:
      - "**Worldwide population**: Approximately 384 individuals as of 2024"
      - "**Reproductive females**: Only about 70 reproductively active females remain"
      - "**Calving season**: December through April, with peak activity January-March"
      - "**2024-2025 season**: 11 calves born (4 first-time mothers)"
      - "**Critical habitat**: Georgia waters within 15 miles of shore south of Altamaha River"

  - id: "where-to-see"
    title: "Where to See Georgia's State Marine Mammal"
    style: "default"
    
    paragraphs:
      - "North Atlantic right whales are extremely difficult to see from shore because they spend most of their time just below the surface and lack the prominent dorsal fin that makes other whales easy to spot. Federal law prohibits approaching within 500 yards of right whales, and recreational whale watching is not permitted in Georgia waters. Organized viewing opportunities are limited to protect this critically endangered species."
    
    list_items:
      - "**Jekyll Island beaches**: Scan the ocean during winter months (December-April) for the distinctive V-shaped blow spout; whales occasionally visible from shore but sightings are rare"
      - "**Cumberland Island National Seashore**: Pristine 17-mile beach provides undeveloped coastline where whales may be visible offshore; winter visitors should watch for blows and large black shapes near the surface"
      - "**Sapelo Island**: Remote barrier island accessible only by ferry; winter beach walks may provide opportunities to spot whales from shore"
      - "**Georgia Sea Turtle Center**: Educational exhibits on Jekyll Island provide information about right whale conservation and Georgia's role as calving ground"
      - "**Report sightings**: Call 877-WHALE-HELP (877-942-5343) or hail U.S. Coast Guard on marine VHF channel 16 to report any right whale sightings; photos can be submitted to the North Atlantic Right Whale Catalog"

  - id: "current-status"
    title: "Current Status and Conservation"
    style: "default"
    paragraphs:
      - "The North Atlantic right whale has been listed as endangered under the Endangered Species Act since 1970 and is protected by the Marine Mammal Protection Act of 1972. Despite four decades of protection, the population remains critically low at approximately 384 individuals. The species has experienced an ongoing Unusual Mortality Event since 2017, with more than 20 percent of the population affected by death, serious injury, or illness."
      - "Vessel strikes and entanglement in fishing gear cause the majority of known right whale deaths and serious injuries. In 2024 alone, researchers documented five right whale deaths, 16 entanglements, and eight vessel strikes. Scientists warn that unless these human-caused threats are substantially reduced, the species could become extinct within 200 years despite continued conservation efforts."
    
    subsections:
      - subtitle: "Vessel Speed Restrictions"
        text: "To reduce fatal ship strikes, federal regulations require vessels 65 feet and longer to travel at 10 knots or less in designated Seasonal Management Areas when active (November 1-April 30 north of Georgia's Sapelo Island; November 15-April 15 south of Sapelo Island). Georgia's commercial shipping port at Savannah and the Kings Bay Naval Submarine Base both operate in right whale habitat, making speed compliance essential during calving season."
      
      - subtitle: "Fishing Gear Modifications"
        text: "Entanglement in lobster trap lines, gillnets, and other fishing gear poses a severe threat. Whales become wrapped in ropes that cut into their skin, restrict movement, and prevent feeding. Even whales that survive initial entanglement often die later from infections or starvation. NOAA Fisheries works with the fishing industry to develop 'ropeless' or on-demand fishing gear that eliminates persistent vertical lines in the water. Seasonal fishing closures protect areas where whales concentrate."
      
      - subtitle: "Population Monitoring"
        text: "Each winter, research teams photograph right whales off Georgia and Florida, using the unique white callosity patterns to identify individuals. Biologists compare new photographs to the North Atlantic Right Whale Catalog, a collection of more than one million images dating to 1935. This photo-identification work tracks which females are reproducing, how often they give birth, and whether calves survive. Skin samples collected from newborns provide genetic data about population health."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "Georgia designated the North Atlantic right whale as state marine mammal in 1985, thirty years before adding the white-tailed deer as state mammal in 2015. These paired symbols represent Georgia's terrestrial and marine environments, with complementary conservation stories. The deer recovered from near-extinction through successful management, while the whale remains critically endangered despite decades of protection."
      - "The timing of the right whale designation reflects Georgia's growing environmental awareness in the 1980s. Johnny Isakson, who served in the Georgia General Assembly as minority leader when the whale became the state marine mammal, later sponsored federal legislation as U.S. Senator to fund right whale conservation. His involvement connects state and federal conservation efforts across three decades and aligns with Georgia's modern symbol system, including [the state flag](/states/georgia/flag/georgia-state-flag)."
    
    subsections:
      - subtitle: "Complementing the White-Tailed Deer"
        text: "Together, Georgia's two mammal symbols tell a complete story about wildlife conservation. The white-tailed deer demonstrates that species can recover when given habitat and protection. Right whales show that recovery requires more than just laws—it demands ongoing effort, international cooperation, and changes in how humans use the ocean. Where deer hunting generates economic activity and connects Georgians to rural traditions, right whale protection requires economic sacrifices (slower ships, modified fishing gear) for the long-term goal of species survival."
        link:
          label: "See Georgia state mammal"
          url: "/states/georgia/mammal/white-tailed-deer"
      
      - subtitle: "Georgia's Coastal Identity"
        text: "The right whale represents Georgia's 100-mile coastline and its significance for marine biodiversity. While Georgia has less coastline than neighboring Florida or South Carolina, the state holds approximately one-third of the Atlantic seaboard's marshland. These productive marshes and estuaries support fish and shellfish that feed both people and marine mammals. By choosing the right whale, Georgia connected its coastal economy and maritime heritage to conservation responsibility."

