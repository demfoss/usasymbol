faq:
  - question: "What is Georgia's state marine mammal?"
    answer: "Georgia's state marine mammal is the North Atlantic right whale (Eubalaena glacialis), designated in 1985 through Senate Resolution No. 91."
  
  - question: "When was the right whale designated as Georgia's state marine mammal?"
    answer: "Governor Joe Frank Harris signed the designation into law on April 2, 1985, making the North Atlantic right whale Georgia's official state marine mammal."
  
  - question: "Why did Georgia choose the right whale as its state marine mammal?"
    answer: "Georgia chose the North Atlantic right whale because the state's coastal waters serve as the only known calving grounds for the entire species. This discovery, made in 1980-1984, placed Georgia at the center of international conservation efforts for one of the world's most endangered large whales. The designation recognizes Georgia's unique stewardship role and commitment to protecting this critically endangered species."
  
  - question: "Where can I see right whales in Georgia?"
    answer: "Right whales are difficult to see and are protected by federal law requiring boats to stay 500 yards away. The best opportunities for shore viewing are Jekyll Island, Cumberland Island National Seashore, and Sapelo Island during winter months (December-April). Look for the distinctive V-shaped blow spout from their two blowholes. Recreational whale watching is not permitted in Georgia waters to protect this critically endangered species."
  
  - question: "How many North Atlantic right whales are left?"
    answer: "As of 2024, approximately 384 North Atlantic right whales remain worldwide, including only about 70 reproductively active females. The species has been critically endangered since being hunted nearly to extinction in the 1800s and continues to face threats from vessel strikes and fishing gear entanglement."
  
  - question: "When do right whales visit Georgia?"
    answer: "Right whales visit Georgia's coastal waters from late November through April, with peak presence during January through March. Pregnant females come to give birth in Georgia's warm, shallow waters, then stay with their newborn calves for several weeks before migrating north to feeding grounds."
  
  - question: "What threats do right whales face?"
    answer: "The two primary threats to North Atlantic right whales are vessel strikes and entanglement in fishing gear. In 2024, researchers documented five right whale deaths, 16 entanglements, and eight vessel strikes. Climate change also affects their food supply and may be shifting their habitat patterns."
  
  - question: "Does Georgia have other state mammals?"
    answer: "Yes, Georgia designated the white-tailed deer as its official state mammal in 2015, thirty years after adding the North Atlantic right whale as state marine mammal. Together, these symbols represent Georgia's terrestrial and marine environments."
  
  - question: "Why are they called 'right' whales?"
    answer: "Whalers named them 'right' whales starting about 800 years ago because they were the 'right' whales to hunt. They swim slowly near shore, contain large amounts of valuable blubber, and float when killed. These characteristics made them easy targets for commercial whalers, driving the species to near-extinction by the late 1800s."

