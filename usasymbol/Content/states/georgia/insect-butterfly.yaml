sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Georgia?
  paragraphs:
  - "The eastern tiger swallowtail, Papilio glaucus, is Georgia's official state butterfly. Governor Joe Frank Harris signed the designation into law in 1988."
  - "The eastern tiger swallowtail is common across the eastern United States and is a familiar sight in Georgia backyards and gardens."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Eastern Tiger Swallowtail
  paragraphs:
  - "The eastern tiger swallowtail is a large yellow butterfly marked with four black tiger-like stripes on each forewing and a black border along the wing edges. Each hindwing ends in a narrow tail."
  - "Adults have a wingspan of about 3 to 5.5 inches, among the largest butterflies found in Georgia. Some females have a dark, almost black form instead of the typical yellow coloring, thought to help them mimic the toxic pipevine swallowtail."
  - "Caterpillars start out looking like bird droppings and later turn green with large eyespots that make them resemble small snakes, a defense against predators."

- id: history
  icon: fa-solid fa-landmark
  title: How Georgia Chose the Eastern Tiger Swallowtail
  paragraphs:
  - "The Georgia General Assembly passed a bill naming the eastern tiger swallowtail the official state butterfly, and Governor Joe Frank Harris signed it into law on April 4, 1988."
  - "The designation recognized the butterfly as a familiar, easily recognized species found throughout Georgia."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Eastern Tiger Swallowtail Facts
  facts:
  - "Adopted: 1988, signed into law by Governor Joe Frank Harris."
  - "Scientific name: Papilio glaucus."
  - "Wingspan: about 3 to 5.5 inches, with yellow wings, black tiger stripes, and tailed hindwings."
  - "Some females have an all-dark wing form instead of yellow, mimicking the toxic pipevine swallowtail."
  - "Georgia also has a separate state insect, the European honey bee, adopted in 1975."




