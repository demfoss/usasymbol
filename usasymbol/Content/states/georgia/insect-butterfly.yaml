faq:
- question: What is Georgia's state butterfly?
  answer: "Georgia's state butterfly is the eastern tiger swallowtail, adopted in 1988."
- question: When did Georgia adopt the eastern tiger swallowtail?
  answer: "Georgia adopted the eastern tiger swallowtail as its official state butterfly in 1988, when Governor Joe Frank Harris signed the bill into law."
- question: What does the eastern tiger swallowtail look like?
  answer: "It is a large yellow butterfly with black tiger-like stripes, a black wing border, and narrow tails on the hindwings. It has a wingspan of about 3 to 5.5 inches."
- question: Is the eastern tiger swallowtail the same as Georgia's state insect?
  answer: "No. Georgia's state insect is the European honey bee, adopted in 1975. The eastern tiger swallowtail is a separate designation, the official state butterfly, adopted in 1988."
- question: Where can you find the eastern tiger swallowtail in Georgia?
  answer: "It is common throughout Georgia and across the eastern United States, often seen in gardens, backyards, and along woodland edges."

