faq:
  - question: What is Georgia's state dance?
    answer: "Georgia's official state folk dance is square dance, adopted in 1996."
  - question: When did Georgia adopt square dance as its state dance?
    answer: "Georgia adopted square dance as its official state folk dance in 1996."
  - question: Why did Georgia choose square dance?
    answer: "Square dance was already woven into Georgia's rural community gatherings and barn dances, and it fit a national movement of states naming it their official folk dance."
  - question: Is square dance the same in every state?
    answer: "The core formation and calls are shared nationally, but many states, including Georgia, adopted square dance through the same 1970s-1990s campaign, so the designation and local dance-hall traditions vary by state."

