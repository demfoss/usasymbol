sections:
  - id: overview
    icon: fa-solid fa-music
    title: Georgia State Dance
    paragraphs:
      - "Georgia named square dance its official state folk dance in 1996. The designation recognized a partnered, caller-led dance that had long been part of community gatherings in the state's small towns and rural counties."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples into a square formation, with each couple facing the center from one side. A caller directs the group through a sequence of figures, so dancers respond to spoken instructions rather than a fixed, memorized routine."
      - "The music typically comes from a string band built around fiddle, banjo, and guitar, with the caller's voice riding on top of the rhythm. Movements alternate between whole-square figures, where all eight dancers move together, and partner figures danced with the person across from you."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand in a square, each facing the center, with partners side by side on their own side of the square."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod to your partner and then to your corner as the music starts, a traditional greeting before the calls begin."
      - title: "Circle Left and Right"
        description: "Join hands with the full square and move together in a circle, first left and then right, on the caller's instruction."
      - title: "Do-Si-Do with Your Partner"
        description: "Walk around your partner back to back without turning to face them, then return to your starting spot."
      - title: "Allemande Left and Promenade"
        description: "Turn your corner with a left-hand grip, then walk your partner around the square side by side to close the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Georgia
    paragraphs:
      - "Square dance took hold across Georgia's rural communities, where barn dances and community halls gave neighbors a regular reason to gather to music and calls. The dance's reliance on a caller rather than memorized steps made it easy to teach quickly at these local events."
      - "Georgia's adoption also fit a broader movement in the 1970s through 1990s, when square-dance callers' associations and folk-dance organizations pushed legislatures across the country to name square dance an official state folk dance."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Georgia's State Dance
    paragraphs:
      - "Georgia's General Assembly designated square dance the state's official folk dance in 1996."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Georgia adopted square dance as its official state folk dance in 1996."
      - "The dance is led by a caller who directs eight dancers arranged in a square of four couples."
      - "Georgia's square-dance tradition grew out of rural community gatherings and barn dances."
      - "Square dance is typically danced to string-band music built around fiddle, banjo, and guitar."

