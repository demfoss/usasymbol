title: Brown Thrasher
scientific_name: Toxostoma rufum
adopted_year: 1970
legislation: Ga. Code 50-3-50
meaning: 'Georgia is the only state to use the Brown Thrasher as its state bird. The choice makes most sense alongside Georgia''s other bird designation: the bobwhite quail as state game bird, which freed the thrasher to serve as the state''s general civic emblem.'
