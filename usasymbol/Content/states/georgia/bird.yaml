seo_title: "Georgia State Bird | Brown Thrasher"
seo_description: Georgia's state bird is the Brown Thrasher, codified in 1970. Georgia is the only state with this bird and also has a separate bobwhite quail game bird.
intro_text: 'Georgia''s state bird is the <strong>Brown Thrasher</strong>, codified in <strong>1970</strong> under <strong>Ga. Code 50-3-50</strong>. No other state uses the Brown Thrasher as its official state bird, which makes Georgia''s choice unusually distinctive. The page also needs one clarification: Georgia separately names the <strong>bobwhite quail</strong> as the state game bird under Ga. Code 50-3-51. That split lets the Brown Thrasher serve as Georgia''s broader civic bird while the quail carries hunting and field-sport tradition.'
