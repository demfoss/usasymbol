  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Staurolite Facts"
    facts:
      - "Adopted as Georgia's state mineral in 1976."
      - "Staurolite's name comes from the Greek word stauros, meaning cross."
      - "Ninety-degree cross twins are rarer and more valued by collectors than the more common 60-degree twins."
      - "Fannin County, in north Georgia, is one of the state's most productive staurolite collecting areas."

