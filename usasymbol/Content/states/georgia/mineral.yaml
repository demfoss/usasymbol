faq:
  - question: What is Georgia's state mineral?
    answer: "Georgia's state mineral is staurolite, a reddish-brown to black silicate mineral known for forming natural cross-shaped twin crystals."
  - question: When did Georgia adopt staurolite as its state mineral?
    answer: "The Georgia General Assembly designated staurolite the official state mineral on March 18, 1976."
  - question: Why did Georgia choose staurolite?
    answer: "Staurolite's cross-shaped crystals, nicknamed fairy crosses, are abundant in north Georgia and have long been collected there as good-luck charms."
  - question: Where can you find staurolite in Georgia?
    answer: "North Georgia counties including Fannin, Cherokee, Gilmer, and Pickens are known for staurolite, with the area around Mineral Bluff a particularly productive spot."

