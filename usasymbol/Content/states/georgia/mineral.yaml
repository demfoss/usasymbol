intro_text: "Georgia's state mineral is staurolite, adopted in 1976 to recognize the twinned, cross-shaped crystals nicknamed fairy crosses that generations of north Georgia families have collected as good-luck charms. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Georgia State Mineral
    paragraphs:
      - "Staurolite is Georgia's official state mineral, designated by the Georgia General Assembly in 1976. It is an iron aluminum silicate best known for a rare habit: pairs of crystals grow together at an angle, forming a natural cross."
      - "Georgia was a natural fit for this symbol because staurolite crystals, and the folklore around them, are especially common across the state's northern mountain counties."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Staurolite?"
    paragraphs:
      - "Staurolite is a reddish brown to black silicate mineral that forms in metamorphic rock, most often mica schist. Its name comes from the Greek word for cross, a reference to its habit of growing as twinned crystals that intersect at 60 or 90 degrees, forming an X or a plus-sign shape."
      - "The 90-degree crosses are rarer and more prized by collectors than the more common 60-degree twins. Weathered out of the schist that hosts them, staurolite crystals turn up loose in soil, streambeds, and fields across the mountains of north Georgia."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Georgia Chose Staurolite as Its State Mineral"
    paragraphs:
      - "Staurolite, nicknamed fairy crosses or fairy stones, is abundant in the metamorphic rock of Georgia's northern counties, including Cherokee, Fannin, Gilmer, and Pickens. Generations of families in the region have collected the naturally cross-shaped crystals and carried them as good-luck charms, a tradition the state legislature specifically cited in its designation."
      - "Choosing staurolite gave Georgia a mineral tied to genuine local folk tradition rather than an industrial or commercial use. The 1976 resolution that named it state mineral also named quartz the state gem and shark tooth the state fossil, adding several geology-based symbols in one legislative session."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Staurolite Became Georgia's State Mineral"
    paragraphs:
      - "The Georgia General Assembly designated staurolite the official state mineral on March 18, 1976, as part of a resolution that also named the state gem and state fossil."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Staurolite Is Found in Georgia"
    paragraphs:
      - "Staurolite is especially abundant in Fannin County, in the mica schist around the Mineral Bluff and Blue Ridge areas, along with neighboring Cherokee, Gilmer, and Pickens counties. Crystals weather out of the schist and collect loose in red Georgia clay, road cuts, and stream gravel."
    sites:
