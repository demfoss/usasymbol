title: "Wisdom, Justice, and Moderation"
language: "English"
english_translation: ""
adopted_year: 1799

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Georgia State Motto: Wisdom, Justice, and Moderation"
seo_description: "Georgia's motto 'Wisdom, Justice, and Moderation' comes from Plato's four cardinal virtues — and all four appear on the state seal. Three are named on the pillars; courage is represented by a soldier with a drawn sword. The motto was never adopted as a standalone law. Full history."

intro_text: "Georgia's state motto is <strong>Wisdom, Justice, and Moderation</strong> — three words that appear on the pillars of the state seal's central design, where they support an arch labeled 'Constitution.' The phrase dates to February 8, 1799, when the legislature redesigned the seal to replace earlier Latin mottos. Unlike most state mottos, Georgia's was never adopted through a standalone statute — it exists only through the seal description in Georgia Code. And all four of Plato's cardinal virtues are present on the seal: three named on the pillars, and the fourth — courage — shown as a soldier with drawn sword."

sections:
  - id: "all-four-plato-virtues"
    icon: "fa-solid fa-book-open"
    title: "Plato's Four Virtues, All on One Seal"
    paragraphs:
      - "In <em>Republic</em> Book IV (c. 380 BCE), Plato identified four cardinal virtues for a just state: wisdom, courage, moderation (or temperance), and justice. Georgia's 1799 seal designers placed three of them as explicit text on the three pillars. The fourth — courage — appears not as a word but as an image: a soldier standing between the Justice and Moderation pillars, holding a drawn sword, ready to defend the Constitution."
      - "This means Georgia's state seal is a complete Platonic allegory. The motto names wisdom (for deliberation), justice (for law), and moderation (for restraint), while the soldier embodies courage (for defense). Historian Lawton B. Evans made the governmental connection explicit in 1898: wisdom guides the legislative branch in making laws, justice guides the judicial branch in deciding cases, and moderation guides the executive branch in administering them fairly."
      - "The three pillars support an arch labeled 'Constitution.' The visual argument is direct: remove any one of the three virtues — any one pillar — and the constitutional structure collapses. It's a spatial argument for balance of powers, built into the seal's geometry."

  - id: "replaced-latin-mottos"
    icon: "fa-solid fa-clock-rotate-left"
    title: "What Georgia's Seal Said Before 1799"
    paragraphs:
      - "Georgia's first state seal dates to the 1777 State Constitution. That original design carried two Latin mottos: 'Pro bono publico' (For the public good) and 'Deus nobis haec otia fecit' (God has given us this ease). The reverse showed agricultural scenes — corn fields, sheep, cattle, and ships — alongside buildings representing the colony's economic ambitions."
      - "In 1799, twelve years after Georgia ratified the U.S. Constitution, the legislature redesigned the seal entirely. Out went the Latin phrases and the agricultural scenes. In came the three Greek-philosophy pillars and the English-language virtues. The shift from Latin to English, and from classical-Roman to classical-Greek framing, reflected the early republic's interest in Athens as a democratic model alongside Rome as a civic one."
      - "One later modification came in 1914: the legislature changed the date on the seal from 1799 to 1776. This moved the reference from the year of the seal's design to the year of American independence. The virtues and the pillar design remained exactly as they were in 1799."

  - id: "never-a-standalone-law"
    icon: "fa-solid fa-scale-balanced"
    title: "A Motto That Was Never Officially Adopted as a Motto"
    paragraphs:
      - "Georgia Code §50-3-30 describes the state seal. The three virtues — Wisdom, Justice, and Moderation — appear in that description as required elements of the seal's design. But the Georgia General Assembly never passed a separate statute designating these words as 'the official state motto.' Technically, Georgia's motto exists only inside the legal description of the seal."
      - "This makes Georgia unusual among states. Most states have either a standalone motto statute or a constitution article that names the motto directly. Georgia's three virtues became the de facto motto through consistent use and legislative reference — not through a discrete act of formal adoption. The practical result is the same: the phrase appears on the seal, the flag (which features the seal as its central element), driver's licenses, and official documents. But the legal basis is the seal law, not a motto law."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Georgia State Motto Facts"
    style: "gradient"
    facts:
      - "All four of Plato's cardinal virtues appear on the Georgia seal: three in text on the pillars, one as a soldier with a sword."
      - "Georgia's 1777 seal used Latin mottos, replaced with English virtues in 1799."
      - "The Georgia General Assembly never passed a standalone law designating the phrase as 'the state motto.'"
      - "Historian Lawton B. Evans (1898) connected each virtue to a branch of government: legislative, judicial, executive."
      - "The seal date was changed from 1799 to 1776 in 1914 — the design and virtues were not changed."
      - "The current state flag (adopted 2001) features the seal, making the three virtues more visible than ever."

faq:
  - question: "What is Georgia's state motto?"
    answer: "Georgia's state motto is 'Wisdom, Justice, and Moderation.' The three virtues appear on the pillars of the state seal, where they support an arch labeled 'Constitution.' They were first included in the seal on February 8, 1799."

  - question: "What do the three words in Georgia's motto mean?"
    answer: "Wisdom guides sound decision-making (associated with the legislative branch). Justice means fairness in applying the law (associated with the judiciary). Moderation means restraint in the exercise of power (associated with the executive). Historian Lawton B. Evans drew this three-branch connection in 1898."

  - question: "Where do Georgia's motto words come from?"
    answer: "Three of Plato's four cardinal virtues, described in <em>Republic</em> Book IV (c. 380 BCE): wisdom, moderation, and justice. The fourth Platonic virtue — courage — is represented on the seal by a soldier with a drawn sword rather than as text on the pillars."

  - question: "Was Georgia's motto ever officially adopted by the legislature?"
    answer: "Not as a standalone statute. The phrase appears only within the legal description of the state seal (Georgia Code §50-3-30). The General Assembly never passed a separate law designating 'Wisdom, Justice, and Moderation' as the state motto — it became the de facto motto through consistent use in the seal description."

  - question: "When did Georgia adopt its current state motto?"
    answer: "The three virtues first appeared on Georgia's redesigned state seal on February 8, 1799, replacing earlier Latin mottos from the 1777 seal. The seal date was later changed from 1799 to 1776 in 1914, but the motto and pillar design were not changed."

  - question: "Where does Georgia's motto appear today?"
    answer: "On the state seal (three pillars labeled Wisdom, Justice, and Moderation supporting a Constitution arch, with a soldier between two pillars), on the state flag (which has featured the seal as its central element since 2001), on driver's licenses, official documents, and government buildings."

