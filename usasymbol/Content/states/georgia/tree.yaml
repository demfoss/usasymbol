seo_title: "Georgia State Tree: Live Oak – USS Constitution Wood"
seo_description: "Learn about Georgia's Live Oak state tree, adopted in 1937. Discover its role in building USS Constitution 'Old Ironsides' and its association with famous Georgians."

intro_text: "1937 marked the designation of the Live Oak as Georgia's state tree. The Edmund Burke Chapter of the Daughters of the American Revolution requested this. The tree connected to Georgia's coastal settlements and famous residents including General James Edward Oglethorpe, John Wesley, and Sidney Lanier. Live oak wood from St. Simons Island built USS Constitution's frame, and the dense wood survived cannon fire, reinforcing [the Peach State's](/states/georgia/nickname/the-peach-state) coastal identity."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Georgia State Tree?"
    paragraphs:
      - "The Live Oak functions as Georgia's official tree. This evergreen oak keeps its leaves year-round, though it drops old leaves just before new ones emerge in spring. The tree can reach massive proportions in open areas and is featured in broader comparisons on the [list of U.S. state trees](/symbols/trees)."
      - "Live oaks develop huge rounded crowns. The largest specimens spread up to 150 feet across. Branches grow long and drooping. Spanish moss typically drapes from the limbs in coastal areas. The bark becomes black and blocky with age."
      - "These oaks grow throughout Georgia's coastal plains and islands. The species ranges from Virginia south through Florida and west to Texas, with Georgia's interstate context reflected in [States Neighboring States](/rankings/geography/states-neighboring-states)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Georgia State Tree Name"
    paragraphs:
      - "The common names include Live Oak, Southern Live Oak, and Virginia Live Oak. The scientific name is Quercus virginiana. The name 'live oak' comes from the tree keeping green leaves through winter, unlike deciduous oaks that lose their leaves."
      - "The species name virginiana refers to Virginia, though the tree grows far beyond that state. Taxonomists originally described the species from Virginia specimens in the 1700s."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How the Live Oak Became Georgia's State Tree"
    paragraphs:
      - "Georgia established the Live Oak as its state tree on February 25, 1937. The Edmund Burke Chapter of the Daughters of the American Revolution suggested the designation. Joint Resolution No. 14 passed both chambers."
      - "The resolution emphasized the tree's connection to Georgia's early history. Live oaks flourished where Georgia's first settlers resided along the coast. General James Edward Oglethorpe founded the colony among these trees. Methodist minister John Wesley and poet Sidney Lanier also lived in areas with live oaks, alongside civic ideals captured in [Georgia's official motto](/states/georgia/motto/wisdom-justice-and-moderation)."
      - "The legislature noted many other states had chosen indigenous trees as emblems. Georgia had not. The resolution declared the live oak as 'the official tree emblematic of the State of Georgia.'"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Georgia State Tree Facts"
    facts:
      - "Live oak from St. Simons Island, Georgia, built USS Constitution's frame; the wood's density let it survive cannon fire"
      - "The Seven Sisters Oak in Louisiana is 500 to 1,000 years old and is the largest certified southern live oak"
      - "The Lover's Oak in Brunswick, Georgia, is estimated at 900 years old"
      - "Open-grown live oaks can develop crowns spreading 150 feet across"
      - "The wood is extremely hard, heavy, and difficult to work but very strong for construction"

  - id: shipbuilding
    icon: "fa-solid fa-ship"
    title: "Live Oak and USS Constitution"
    paragraphs:
      - "Live oak wood played a crucial role in American naval history. USS Constitution's frame was built from southern live oak harvested from St. Simons Island, Georgia. The wood grain's extreme density gave the ship unusual strength."
      - "During the War of 1812, British cannon fire bounced off Constitution's hull. Cannonballs struck the wooden sides and fell into the sea. This earned the ship the nickname 'Old Ironsides.' The live oak frame made this possible."
      - "Shipbuilders preferred live oak for framework timbers. The natural trunk and branch angles provided strength. The curved growth patterns fit ship construction needs. The wood resisted rot and withstood tremendous force."

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Georgia State Tree and Flower"
    paragraphs:
      - "Georgia's state flower is the Cherokee Rose (Rosa laevigata), designated in 1916 at the request of the Georgia Federation of Women's Clubs. The white flowers bloom in late spring. The resolution claimed the plant was indigenous to Georgia, but the rose originated in China and was introduced around 1780; see [Georgia's flower page](/states/georgia/flower/cherokee-rose) for details. Current legislation proposes changing the state flower to native Sweetbay Magnolia. Georgia also recognizes native azalea as the state wildflower."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Live Oak"
    paragraphs:
      - "Live oaks display several distinctive features. The leaves are small, leathery, and dark green on top with pale undersides. They measure two to five inches long and stay on year-round. The leaves have smooth or slightly toothed edges."
      - "Long horizontal limbs extend outward, often drooping toward the ground. Spanish moss frequently hangs from branches in coastal areas. The massive spreading crown provides dense shade."
      - "Acorns appear in clusters of three to five. Each acorn measures about three-quarters of an inch long, dark brown, with a warty cap covering one-third of the nut. They mature in September."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Live Oak symbolizes Georgia's coastal heritage and early colonial settlement. Its association with founding figures like Oglethorpe connects the tree to the state's origin story. The tree's use in naval shipbuilding represents Georgia's contribution to American military history and appears in state symbolism alongside [the Georgia state flag](/states/georgia/flag/georgia-state-flag). Its longevity and hurricane resistance stand for strength and endurance."

faq:
  - question: "What is the Georgia state tree?"
    answer: "The Live Oak (Quercus virginiana) is Georgia's official state tree. The legislature designated it on February 25, 1937, at the request of the Edmund Burke Chapter of the Daughters of the American Revolution."
  
  - question: "What is the Georgia state tree called?"
    answer: "Georgia's state tree is called the Live Oak, Southern Live Oak, or Virginia Live Oak. Its scientific name is Quercus virginiana. The name 'live oak' refers to the tree keeping green leaves through winter."
  
  - question: "When was Georgia's state tree adopted?"
    answer: "Georgia adopted the Live Oak as its state tree on February 25, 1937. The General Assembly passed Joint Resolution No. 14 after the Daughters of the American Revolution requested the designation."
  
  - question: "Why is the Live Oak Georgia's state tree?"
    answer: "The legislature chose the Live Oak because it grew where Georgia's first settlers and founders lived along the coastal plains and islands. The tree was associated with famous Georgians including General James Edward Oglethorpe, John Wesley, and Sidney Lanier. The resolution emphasized the tree's close connection to Georgia's early history. Live oak wood from St. Simons Island also built USS Constitution, demonstrating the tree's importance to American naval history."
  
  - question: "What is the Georgia state tree name?"
    answer: "The name is Live Oak or Southern Live Oak. The scientific name is Quercus virginiana, which means 'Virginia oak' referring to where taxonomists first described the species."
  
  - question: "What is special about the Georgia state tree?"
    answer: "Live oak wood from Georgia built the frame of USS Constitution. The wood's extreme density allowed the ship to survive cannon fire during the War of 1812, earning the nickname 'Old Ironsides.' Live oaks can live 400+ years and develop massive spreading crowns up to 150 feet wide. The tree is evergreen and keeps its leaves year-round. Spanish moss typically drapes from the branches in coastal areas."
   
  - question: "Why was USS Constitution called Old Ironsides?"
    answer: "USS Constitution earned the nickname 'Old Ironsides' during the War of 1812 when British cannon fire bounced off its wooden hull. The ship's frame was built from live oak harvested from St. Simons Island, Georgia. The wood's extreme density made the hull strong enough to deflect cannonballs. Sailors watched the ammunition strike the sides and fall harmlessly into the sea."

