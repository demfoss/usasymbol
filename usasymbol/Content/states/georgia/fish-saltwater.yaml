hero_image_caption: The red drum is Georgia's state saltwater fish and lives along the state's Atlantic coast. Photo by Geeklikepi, CC BY-SA 3.0.
intro_text: Georgia's state saltwater fish is the red drum, a bronze coastal fish with a black eyespot near its tail, adopted in 2006. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of Georgia?
  paragraphs:
  - The red drum has been Georgia's official saltwater fish since 2006, when the Georgia Legislature named it. Its scientific name is Sciaenops ocellatus.
  - People also call it redfish, spottail bass, and channel bass. Georgia's state fish is the largemouth bass, and its state cold water game fish is the Southern Appalachian brook trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Red Drum
  paragraphs:
  - The red drum has a long, sturdy body. Its color ranges from pale pink to deep bronze, and its belly is whitish.
  - The easiest way to spot one is the round black spot near the base of its tail. Some fish have several spots. Young fish often have a powder blue edge on the tail.
  - Biologists think the tail spot tricks predators into attacking the tail instead of the head, which gives the fish a better chance to escape.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - The Georgia Legislature named the red drum the official state saltwater fish in 2006. The same law also named the Southern Appalachian brook trout the state cold water game fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Georgia Chose the Red Drum
  paragraphs:
  - State lawmakers said Georgians value the red drum as a strong fighter on a fishing line and as good food. They also pointed to its colors, its tail spot, and the blue markings on its tail.
  - Lawmakers noted that the fish lives everywhere from small tidal creeks to the surf on barrier islands and out into the Atlantic Ocean. That makes it a link between the different habitats along Georgia's coast.
  - Before the mid-1980s, too many red drum were being caught in Georgia. State biologists and anglers worked to protect the fish, and lawmakers mentioned that conservation effort when they named it.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Red Drum
  paragraphs:
  - Red drum live along Georgia's whole coast, which is 105 miles long. You can find them in tidal creeks and marsh flats, around piers and docks, and in the surf off barrier islands.
  - Most young fish stay in the creeks and sounds. Larger adults often move out to the beaches and into the ocean.
