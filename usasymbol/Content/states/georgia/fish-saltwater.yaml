- id: facts
  icon: fa-solid fa-lightbulb
  title: Red Drum Facts
  facts:
  - Adopted in 2006 by the Georgia Legislature.
  - Scientific name is Sciaenops ocellatus.
  - Also called redfish, spottail bass, and channel bass.
  - Has a black eyespot near the base of its tail.
  - Can live for more than 50 years.
faq:
- question: What is Georgia's state saltwater fish?
  answer: Georgia's state saltwater fish is the red drum, also called the redfish. The Georgia Legislature named it in 2006.
- question: When did Georgia adopt the red drum?
  answer: Georgia adopted the red drum as its official saltwater fish in 2006.
- question: Why did Georgia choose the red drum?
  answer: State lawmakers praised it as a popular sport fish and good food, and they liked its pink to bronze colors and its tail spot. They also said it lives in every kind of coastal habitat in Georgia, from tidal creeks to the open ocean.
- question: Why does the red drum have a spot on its tail?
  answer: Biologists think the black spot fools predators into attacking the tail instead of the head. That helps the fish escape.
- question: Is the red drum the same as Georgia's state fish?
  answer: No. The red drum is the state saltwater fish. Georgia's state fish is the largemouth bass.
