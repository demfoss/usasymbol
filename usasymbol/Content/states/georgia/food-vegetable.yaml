sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Georgia's State Vegetable?"
    paragraphs:
      - "The Vidalia sweet onion is Georgia's official state vegetable, designated by the Georgia General Assembly in 1990. It is a mild, sweet onion grown in a specific area of southeast Georgia around the town of Vidalia."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Vidalia Sweet Onion"
    paragraphs:
      - "Vidalia sweet onions are known for their mild, low-sulfur flavor, which comes from the sandy, low-sulfur soil of the region where they are grown. They are planted in the fall and harvested in late spring, typically eaten raw, grilled, or in dishes where a sharper onion would overpower the flavor."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Vidalia Sweet Onion Became Georgia's State Vegetable"
    paragraphs:
      - "The Georgia General Assembly designated the Vidalia sweet onion the official state vegetable in 1990, by which time the onion had already become closely tied to the state's identity through decades of growth around Vidalia and Toombs County."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Georgia Chose the Vidalia Sweet Onion"
    paragraphs:
      - "Georgia lawmakers chose the Vidalia sweet onion because it can only be grown in a legally defined 20-county production area in southeast Georgia, making it one of the state's most distinctive agricultural products and a source of statewide pride."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Vidalia Sweet Onion Comes From in Georgia"
    paragraphs:
      - "Vidalia sweet onions are grown in a defined production area of about 20 counties in southeast Georgia, centered on the town of Vidalia in Toombs County. Only onions grown in this legally protected area can be sold under the Vidalia name."
