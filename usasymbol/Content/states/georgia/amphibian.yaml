sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Georgia?
    paragraphs:
      - "The American green tree frog is Georgia's official state amphibian, designated by the Georgia Legislature in 2005. Its scientific name is Hyla cinerea."
      - "It is a common frog found throughout Georgia, especially in wetlands, ponds, and gardens across the state's coastal plain and piedmont regions."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the American Green Tree Frog
    paragraphs:
      - "The American green tree frog has smooth, bright green skin, often with a pale cream or white stripe running along each side of its body."
      - "It is a small frog, usually around two inches long, with large toe pads that let it grip leaves, stems, and window glass."
      - "It is known for its loud, repeated call, often heard from yards and wetlands on warm summer nights."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Georgia Legislature designated the American green tree frog the official state amphibian in 2005, following a push led by Georgia students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Georgia Chose the American Green Tree Frog
    paragraphs:
      - "The American green tree frog is common and widespread throughout Georgia, making it a familiar amphibian that many residents can recognize by sight and sound."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the American Green Tree Frog
    paragraphs:
      - "The American green tree frog is found across most of Georgia, especially in wetlands, ponds, and marshes throughout the state's coastal plain near the Okefenokee Swamp."
