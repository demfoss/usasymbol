sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Georgia's State Prepared Food?"
    paragraphs:
      - "Grits are Georgia's official state prepared food, designated by the Georgia General Assembly in 2002. Grits are a cooked porridge made from ground corn and are a staple of Southern breakfast tables."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Grits"
    paragraphs:
      - "Grits are made by boiling coarsely ground corn, usually dent corn, in water or milk until it thickens into a soft porridge. They are often served with butter, cheese, shrimp, or gravy and can be eaten at any meal, though they are most common at breakfast in Georgia and across the South."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Grits Became Georgia's State Prepared Food"
    paragraphs:
      - "The Georgia General Assembly designated grits the official state prepared food in 2002, adding to a list of state food symbols that also includes the peach as state fruit."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Georgia Chose Grits"
    paragraphs:
      - "Corn has long been grown across Georgia, and grits made from it became a everyday dish in the state's kitchens well before it was named an official symbol. The designation recognizes a food that is tied closely to Georgia and Southern cooking generally, rather than one dish or recipe from a single town."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Grits Facts"
    facts:
      - "Adopted as Georgia's state prepared food in 2002."
      - "Grits are made from ground corn, usually dent corn."
      - "Grits are traditionally served with butter, cheese, shrimp, or gravy."
      - "Georgia also names the peach its official state fruit."

