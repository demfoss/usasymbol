faq:
  - question: "What is Georgia's state prepared food?"
    answer: "Georgia's state prepared food is grits, adopted by the Georgia General Assembly in 2002."
  - question: "When did Georgia adopt grits as its state prepared food?"
    answer: "The Georgia General Assembly designated grits the official state prepared food in 2002."
  - question: "Why did Georgia choose grits?"
    answer: "Grits made from locally grown corn have long been a staple of Southern breakfast tables in Georgia, making them a familiar and fitting food symbol for the state."
  - question: "Is grits still eaten in Georgia today?"
    answer: "Yes, grits remain a common breakfast dish across Georgia, often served with shrimp, cheese, or butter."

