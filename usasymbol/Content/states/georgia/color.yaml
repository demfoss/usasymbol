seo_title: "Georgia State Colors | Red White Blue"
seo_description: "Georgia state colors are Red, White, and Blue, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Georgia are **Red**, **White**, and **Blue**, derived from [the Georgia state flag](/states/georgia/flag/georgia-state-flag) adopted in 2003. No separate state-colors law exists, but red, white, and blue have been the consistent color foundation of every Georgia state flag and are the widely recognized traditional palette of the Peach State. For Georgia, the color table records HEX, RGB, CMYK, and Pantone references alongside the broader [U.S. state colors reference](/symbols/colors)."

official_colors: "Red, White, and Blue"
