faq:
  - question: "What are the official colors of Georgia?"
    answer: "The traditional state colors of Georgia are Red, White, and Blue, derived from the Georgia state flag. These colors honor Georgia's status as one of the original thirteen colonies and reflect the colors of the United States flag."
  - question: "What is the HEX code for Georgia Red?"
    answer: "The standard HEX code for Georgia Red is #BF0A30, corresponding to Pantone PMS 193, matching the red stripes of the Georgia state flag."
  - question: "What is the HEX code for Georgia Blue?"
    answer: "The standard HEX code for Georgia Blue is #002868, corresponding to Pantone PMS 282, matching the blue canton of the Georgia state flag and the blue of the United States flag."
  - question: "When was the current Georgia state flag adopted?"
    answer: "The current Georgia state flag was adopted on May 8, 2003, under Georgia Code § 50-3-30. It replaced a 2001 flag that itself replaced the controversial 1956 flag featuring the Confederate Battle Flag design."
  - question: "Why does the Georgia flag have thirteen stars?"
    answer: "The thirteen stars on the blue canton of the Georgia state flag represent the original thirteen colonies. Georgia was the fourth state to ratify the United States Constitution on January 2, 1788."
  - question: "What is the design of the Georgia state flag based on?"
    answer: "The current 2003 Georgia state flag is based on the original Stars and Bars — the first national flag of the Confederate States of America — featuring three horizontal red and white stripes with a blue canton. This design was chosen as a historically grounded alternative to the controversial Confederate Battle Flag design used from 1956 to 2001."

