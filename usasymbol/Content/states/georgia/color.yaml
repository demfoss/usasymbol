sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Georgia has not passed a separate state-colors law. However, red, white, and blue have served as the consistent color foundation of every Georgia state flag throughout the state's history, making them Georgia's traditional colors. Georgia has had multiple official state flags across its history, each version maintaining the red, white, and blue palette while varying in design elements — a consistency that establishes these three colors as the bedrock of Georgia's official imagery regardless of flag iteration and aligns with [Georgia's flag history page](/states/georgia/flag/georgia-state-flag)."
      - "The current Georgia state flag, adopted on May 8, 2003, under Georgia Code § 50-3-30, features three horizontal red and white stripes with a blue canton at the upper left bearing the state seal surrounded by thirteen white stars. The design was created to resolve the controversy surrounding the previous flag's prominent display of the Confederate Battle Flag, which had been incorporated into the Georgia flag in 1956 during the era of Massive Resistance to federal desegregation. The 2003 flag drew its design from the original Confederate Stars and Bars — the first national flag of the Confederacy — rather than the Battle Flag, while simultaneously anchoring the design to the broader American red, white, and blue tradition and to [the state motto framework](/states/georgia/motto/wisdom-justice-and-moderation)."
    subsections:
      - subtitle: "Georgia's Flag History and Color Continuity"
        text: "Georgia's flag history is among the most complex of any US state, encompassing at least five distinct official designs since the state's first flag was adopted in 1879. Despite these changes, the red, white, and blue palette has remained constant across every version. The 1879 flag featured a vertical blue bar with the state seal on a red and white field. The 1902 redesign maintained the blue, red, and white elements. The controversial 1956 flag added the Confederate Battle Flag's blue-X-on-red design but retained the overall tricolor framework. The 2001 flag briefly departed from the red stripe pattern before the 2003 design restored the full red, white, and blue composition that remains today."
      - subtitle: "Georgia Code § 50-3-30"
        text: "The current Georgia state flag is governed by Georgia Code § 50-3-30, which describes the flag as three equal horizontal stripes of red and white with a blue canton containing the state seal and thirteen stars. The code does not specify exact Pantone values, but Georgia state procurement standards and the Georgia Secretary of State's office have standardized the colors for official applications. The thirteen stars on the blue canton explicitly reference Georgia's status as one of the original thirteen colonies, embedding the historical justification for the red, white, and blue palette directly into the flag's statutory description and connecting to broader [states and capital cities reference data](/rankings/geography/states-capital-cities)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Georgia's red, white, and blue carry the dual weight of national founding history and Southern heritage, reflecting the state's complex position as both one of America's oldest political communities and a state whose history includes secession, Civil War, and Reconstruction. The 2003 flag resolved decades of controversy by anchoring Georgia's colors firmly in the broader American patriotic tradition while retaining historical references to the Confederacy through the Stars and Bars design structure — a balance that makes Georgia's color palette one of the most historically layered among all fifty states."
    subsections:
      - subtitle: "Red in Georgia History"
        text: "Red carries particular weight in Georgia's history through its association with the state's military contributions across American conflicts. Georgia supplied significant forces to the Continental Army during the Revolutionary War, with figures such as Button Gwinnett and Lyman Hall — Georgia signers of the Declaration of Independence — reflecting Georgia's foundational commitment to American independence. The red of the Georgia flag mirrors the red stripes of the US flag, reinforcing this founding-era identity. Red also resonates through Georgia's agricultural past: the state's red clay soil, which colors the landscape across much of the Piedmont region, is one of Georgia's most distinctive geographic features and has been associated with Georgia's public imagery since the colonial era."
      - subtitle: "White in Georgia History"
        text: "White on the Georgia flag represents both national purity in the American patriotic tradition and Georgia's deep agricultural heritage. Georgia was the leading cotton-producing state in the antebellum South, and the white cotton boll was the defining symbol of the state's economy and landscape from the late 18th century through the early 20th century. The white stripes of the Georgia flag, alternating with red in the pattern derived from the Stars and Bars, visually encode this agricultural legacy alongside the national symbolism of the American tricolor tradition."
      - subtitle: "Blue in Georgia History"
        text: "Blue on the Georgia flag appears as the canton — the most heraldically significant position on a flag, occupying the upper left corner — and bears the Georgia state seal surrounded by thirteen stars. The deep navy blue (PMS 282) matches the blue of the United States flag, a deliberate choice that asserts Georgia's national identity and its founding-era credentials. The thirteen stars on the blue canton are a direct reference to Georgia's status as one of the original thirteen colonies, and their placement on the blue field creates a visual echo of the US flag's blue star canton. Georgia ratified the Constitution on January 2, 1788, as the fourth state, and the blue canton of its flag encodes this history in every official display, with cross-state color comparisons in [U.S. state colors](/symbols/colors)."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Red, white, and blue dominate the Georgia state flag, governed by Georgia Code § 50-3-30, which flies at the Georgia State Capitol in Atlanta and all state government buildings. The Georgia state seal, which appears on the blue canton of the flag, was adopted in 1799 and revised in 1914; it incorporates gold, green, and additional colors through its depiction of three pillars representing the three branches of government, a soldier, and the state motto 'Wisdom, Justice, Moderation' — but the surrounding blue canton and red-and-white stripes establish the tricolor as the flag's dominant visual statement. Red, white, and blue appear consistently across Georgia state agency branding, Georgia Department of Economic Development tourism materials, and official state government publications, alongside core civic pages such as [Georgia's bird profile](/states/georgia/bird/brown-thrasher). The Georgia Secretary of State's office maintains the flag specifications and distributes reproduction guidelines ensuring consistent application of the state's traditional tricolor palette."

