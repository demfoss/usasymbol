type: State Coat of Arms
state: Georgia
name: Georgia State Coat of Arms
adopted_year: 1799
is_official: true
meaning: "The Georgia coat of arms places three pillars at the center, each inscribed with one of the state's three guiding values: Wisdom, Justice, and Moderation. Together they support an arch bearing the word Constitution. A soldier with a drawn sword stands guard beside the arch, showing that the state is prepared to defend its foundational law."
meaning_title: Meaning of the Georgia Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-19'
date_modified: '2026-05-19'
seo_title: 'Georgia Coat of Arms: Meaning, Symbols and History'
seo_description: "The Georgia coat of arms, adopted in 1799, shows three pillars and a soldier defending the Constitution, representing wisdom, justice, and moderation."
hero_image: /images/coats-of-arms/georgia/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Georgia, adopted 1799, showing three pillars supporting an arch inscribed Constitution with a soldier standing guard
hero_image_caption: The Georgia Coat of Arms, adopted February 8, 1799. Three pillars inscribed Wisdom, Justice, and Moderation support an arch bearing the word Constitution. A soldier with a drawn sword stands guard beside the pillars.
intro_text: "The Georgia coat of arms shows three pillars supporting an arch inscribed with the word 'Constitution,' with a soldier and drawn sword standing guard beside it. The Georgia Legislature adopted this design on February 8, 1799."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Georgia Coat of Arms?
  paragraphs:
  - "The coat of arms appears on Georgia's state seal, state flag, and official documents. It is the central design element on the seal, which Georgia has used on legal papers and official correspondence since the eighteenth century."
  - "The design has remained essentially unchanged since 1799. The Georgia General Assembly made one documented modification in 1914 — a change to the date displayed on the seal."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Georgia Coat of Arms
  paragraphs:
  - "Georgia first established a state seal in its 1777 Constitution. That original design was entirely different from the current one. It showed an agricultural and maritime scene — buildings, fields, livestock, a river, and a ship under sail — along with two Latin mottos: Pro bono publico (For the public good) and Deus nobis haec otia fecit (God has given us this ease)."
  - "The Legislature replaced the 1777 design on February 8, 1799, with the three-pillar design still used today. The new design drew on classical principles of civic government rather than landscape imagery."
  - "In 1914, the Georgia General Assembly changed the date shown on the seal from 1799 to 1776 to mark the year of American independence rather than the year the seal was adopted."
  - "During Reconstruction, from 1868 to 1871, an unofficial version of the seal circulated in which the soldier's sword appears in the opposite hand. Historians call this the Period of the False Seal. The correct orientation was restored when Georgia resumed home rule in 1871."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Georgia Coat of Arms
  paragraphs:
  - "The Georgia coat of arms is organized around three pillars, an arch, and a soldier. Each element has a specific civic meaning tied to the state's founding principles."
  elements:
  - id: pillars
    name: The Three Pillars
    image: /images/coats-of-arms/georgia/elements/pillars.svg
    paragraphs:
    - "Three upright pillars stand at the center of the design. Each pillar is inscribed with one word: Wisdom, Justice, and Moderation. According to official sources, these three values correspond to the three branches of state government — legislative, judicial, and executive."
    - "The pillars support an arch above them. The arch is inscribed with the word Constitution, placing the state's founding law at the top of the structure."
  - id: soldier
    name: The Soldier
    image: /images/coats-of-arms/georgia/elements/soldier.svg
    paragraphs:
    - "A soldier stands beside the pillars holding a drawn sword upright. According to official state sources, the soldier represents the military defense of the Georgia Constitution."
    - "During Reconstruction (1868–1871), an unofficial version of the seal showed the sword in the opposite hand. This variant was never legally adopted and is known as the False Seal."
  - id: motto
    name: Wisdom, Justice, and Moderation
    image: /images/coats-of-arms/georgia/elements/motto.svg
    paragraphs:
    - "The motto 'Wisdom, Justice, and Moderation' appears on a banner below the pillars. The same three words appear inscribed on the three pillars themselves, making the motto the organizing principle of the entire design."
    - "These three values are Georgia's official state motto, adopted alongside the coat of arms."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Georgia Coat of Arms
  paragraphs:
  - "The design places the Georgia Constitution at the literal top of the image, supported by the three pillars of government. This arrangement shows that the three branches exist to uphold the Constitution."
  - "The soldier with the drawn sword completes the argument. A document alone cannot defend itself. The soldier shows that Georgia commits force to the protection of its constitutional order."
  - "The three values — Wisdom, Justice, and Moderation — describe how Georgia expects its government to act. The design does not promise outcomes; it names the standards Georgia holds itself to."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Georgia Coat of Arms Facts
  facts:
  - "Adopted: February 8, 1799, when the Georgia Legislature replaced the original 1777 seal design with the three-pillar design."
  - "In 1914, the Georgia General Assembly changed the date shown on the seal from 1799 to 1776, to mark the year of American independence."
  - "The three pillars represent the three branches of state government: legislative (Wisdom), judicial (Justice), and executive (Moderation)."
  - "During Reconstruction (1868–1871), an unofficial version of the seal showed the soldier's sword in the opposite hand. Historians call this the Period of the False Seal."
  - "Georgia's official state motto — Wisdom, Justice, and Moderation — comes directly from the three words inscribed on the pillars in the coat of arms."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Georgia Coat of Arms
  paragraphs:
  - "Georgia used a completely different seal design in 1777, but the modern coat of arms lineage begins with the legislative redesign of February 8, 1799. That redesign introduced the three pillars, the Constitution arch, the soldier, and the motto still associated with Georgia today."
  - "Later changes were mostly standardizing changes rather than symbolic redesigns. The most important surviving version before the current standard is the long-used 1799 design tradition. In 1914, the General Assembly standardized the official rendering and changed the date shown on the seal to 1776."
