    name: Brown
    count: 52300
    ratio: 185
    origin: english
    type: Descriptive
    meaning: "An Old English descriptive name referring to dark hair or complexion. Brown is among Georgia's most evenly distributed surnames, appearing in equal measure across Atlanta's suburbs and rural south Georgia."

