seo:
  title: "Top Last Names in Georgia — Great Migration Numbers"
  description: "Georgia's most common last names are Smith, Johnson, and Williams, with Atlanta's Great Migration history visible in the ranking."

page:
  h1: "Most Common Last Names in Georgia"
  intro: "Johnson and Williams rank within 3,000 of each other in Georgia — both names elevated by Atlanta's position as the Great Migration's largest Southern terminus. Post-Emancipation freedmen across the Black Belt chose Williams, Jackson, and Brown in 1865; Atlanta's growth then pulled more of those same families north from the cotton counties for a century after."
  heritage_title: "African American Freedmen and Scots-Irish Mountain Settlers"
  heritage_body: "After Emancipation in 1865, formerly enslaved Georgians across the Black Belt adopted surnames like Williams, Jackson, and Brown—names still heavily concentrated in Atlanta, Augusta, and Macon. Earlier, Scots-Irish families pushed into north Georgia's Blue Ridge foothills in the late 1700s, seeding the region with English surnames that persist in rural communities today."
  fun_fact: "The surname Williams ranks higher in Georgia than in most other states, reflecting Atlanta's role as a major destination during the Great Migration of the early twentieth century."

surnames:
  - rank: 1
    name: Smith
    count: 75600
    ratio: 128
    origin: english
    type: Occupational
    meaning: "Derived from the Old English smið, meaning metalworker or blacksmith. Smith spread across both the antebellum plantation belt and the Appalachian hill counties, making it Georgia's most universal surname."

  - rank: 2
    name: Johnson
    count: 66800
    ratio: 145
    origin: english
    type: Patronymic
    meaning: "Means 'son of John,' rooted in the Hebrew Yohanan via medieval English. It ranks especially high in Georgia due to its widespread adoption by African American families in Atlanta and Savannah after Emancipation."

  - rank: 3
    name: Williams
    count: 63900
    ratio: 152
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of William,' from the Germanic Willahelm. Georgia's large African American population, concentrated in Fulton and DeKalb counties, makes Williams unusually common relative to its national rank."

  - rank: 4
    name: Jones
    count: 57200
    ratio: 169
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning 'son of John,' carried into Georgia by both colonial settlers and freedmen who chose English surnames after 1865. It appears densely in middle Georgia's historic plantation counties."

