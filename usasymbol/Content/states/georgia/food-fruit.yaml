seo_title: "Georgia State Fruit | Peach"
seo_description: "Georgia's state fruit is the peach, adopted in 1995, the fruit behind the state's nickname, the Peach State."
hero_image: /images/foods/georgia/georgia-state-fruit-hero.webp
hero_image_alt: "Ripe peaches on a tree branch."
hero_image_caption: "The peach, Georgia's official state fruit."
intro_text: "Georgia's state fruit is the peach, adopted in 1995 to recognize a crop so closely tied to the state that Georgia is nicknamed the Peach State. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Georgia's State Fruit?"
    paragraphs:
      - "The peach is Georgia's official state fruit, designated by the Georgia General Assembly in 1995. Peaches are grown commercially across middle and south Georgia, especially around Fort Valley and Peach County."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Peach"
    paragraphs:
      - "Peaches are round, fuzzy-skinned tree fruits with sweet, juicy flesh. Georgia's peach season runs from May through August, when orchards across the state sell fresh peaches at roadside stands and farmers markets."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Peach Became Georgia's State Fruit"
    paragraphs:
      - "The Georgia General Assembly designated the peach the official state fruit in 1995."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Georgia Chose the Peach"
    paragraphs:
      - "Peach farming has shaped Georgia's agricultural economy and identity since the late 1800s, particularly in Peach County and around Fort Valley, and the fruit gave rise to the state's nickname, the Peach State."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Peach Comes From in Georgia"
    paragraphs:
      - "Peach County and the city of Fort Valley in middle Georgia are the heart of the state's peach industry, home to large orchards and the annual Georgia Peach Festival."
    sites:
      - name: Peach County
        city: Fort Valley
        lat: 32.55
        lng: -83.89
        note: "Heart of Georgia's peach industry"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Peach Facts"
    facts:
      - "Adopted as Georgia's state fruit in 1995."
      - "Georgia is nicknamed the Peach State."
      - "Peach County and Fort Valley are centers of Georgia peach farming."

