type: State Flower
state: Montana
name: Bitterroot
scientific_name: Lewisia rediviva
adopted_year: 1895
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-19"
seo_title: "Montana State Flower: Bitterroot – History & Facts"
seo_description: "The Bitterroot became Montana's state flower in 1895. These pink wildflowers bloom across Montana's valleys and mountain slopes each spring."

intro_text: "The Bitterroot represents Montana's floral emblem, adopted in 1895. These delicate pink flowers bloom in valleys and on mountain slopes throughout Montana. White to deep pink petals open close to the ground each spring during the blooming season. This profile appears in the [list of U.S. state flowers](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Montana State Flower?"
    paragraphs:
      - "Montana officially recognizes the Bitterroot as its state flower. Each flower displays 12 to 18 narrow petals ranging from white to deep rose pink. The blooms measure 1 to 2 inches across. Flowers emerge directly from the ground on very short stems. No leaves appear during blooming time. The petals have a silky translucent quality."
      - "Bitterroot blooms from May through July across Montana. Lower elevations see earlier flowers than mountain areas. Peak flowering occurs in June throughout most valleys. Individual blooms last only a few days. Plants open flowers during sunny weather. Petals close at night and on cloudy days. The flowers grow from a thick fleshy taproot."
      - "This native wildflower grows in Montana's dry valleys and rocky hillsides. The plant thrives in poor gravelly soil. Full sun and excellent drainage suit bitterroot best. The flowers appear in areas where few other plants survive. Bitterroot Valley west of Missoula takes its name from abundant wild populations. The plant grows at elevations from 4,000 to 8,000 feet."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Montana State Flower Name"
    paragraphs:
      - "Known as Bitterroot, this flower's scientific designation is Lewisia rediviva. The plant belongs to the Montiaceae family. This small family includes about 200 species of succulent plants found primarily in western North America and South America."
      - "The genus name Lewisia honors Meriwether Lewis of the Lewis and Clark Expedition. Lewis collected specimens of this plant in Montana's Bitterroot Valley in 1806. The species name rediviva means brought back to life. Dried roots can revive and grow when planted again even after months of storage."
      - "Native American tribes called the plant spetlum or many other names in various languages. Early explorers used the name racine amere meaning bitter root in French. The common name bitterroot stuck because the root tastes extremely bitter when raw. The Montana Legislature designated it simply as bitterroot without specifying color variations."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Montana Chose the Bitterroot"
    paragraphs:
      - "Montana lawmakers declared the Bitterroot the official state flower in 1895. This made Montana one of the earliest states to adopt a floral emblem. The legislature chose the bitterroot without organizing a public vote. The flower's connection to Lewis and Clark influenced the decision strongly, as did language later echoed in [The Treasure State nickname](/states/montana/nickname/the-treasure-state)."
      - "Native Americans used bitterroot as an important food source for thousands of years. Women harvested the roots in spring before flowers appeared. Proper preparation removed the bitter taste. The starchy roots provided crucial nutrition. Lewis and Clark expedition members ate bitterroot prepared by Salish people in 1806, in landscapes that now include [Montana's official state tree](/states/montana/tree/ponderosa-pine)."
      - "Montana residents strongly identified with this native wildflower. The Bitterroot Mountains dominated western Montana. Bitterroot Valley contained some of Montana's earliest settlements. The flower represented Montana's wilderness and pioneer heritage. The designation passed unanimously. Montana formalized the Bitterroot as state flower on February 27, 1895."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Montana State Flower Facts"
    facts:
      - "The bitterroot can survive extreme drought by storing water in its thick taproot that may extend 12 inches or more into rocky soil"
      - "Meriwether Lewis collected the first scientific specimen of bitterroot in Montana's Bitterroot Valley in 1806 during the Lewis and Clark Expedition"
      - "Montana adopted the Bitterroot on February 27, 1895, becoming one of the first states in America to designate an official state flower"
      - "Native Americans carefully prepared bitterroot roots by removing the bitter outer layer before cooking, making them an important traditional food source"
      - "The flower opens only in direct sunlight and closes at night or during cloudy weather, protecting reproductive parts from moisture"
      - "Dried bitterroot roots can remain dormant for months and then revive when planted, leading to the species name rediviva meaning brought back to life"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Montana State Flower and Bird"
    paragraphs:
      - "The Western Meadowlark serves as Montana's state bird, a grassland songbird with bright yellow breast and melodious call. Both symbols represent Montana officially. Montana adopted the Bitterroot in 1895 and designated the Western Meadowlark as state bird in 1931; compare with the [Montana state bird page](/states/montana/bird/western-meadowlark)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Bitterroot commonly represents Montana's rugged character and pioneer resilience. The flower has been linked to the Lewis and Clark Expedition and western exploration. Its ability to thrive in harsh conditions frequently represents endurance and survival while carrying connotations of Montana's Native American heritage and wilderness landscapes, with related values in the [Montana state motto](/states/montana/motto/oro-y-plata)."

  - id: "regional-context"
    icon: "fa-solid fa-map"
    title: "Regional Context"
    paragraphs:
      - "Bitterroot habitat shifts with elevation, slope exposure, and soil depth across western valleys and foothills. These transitions become especially clear near state boundaries and mountain corridors shown in [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Montana's state flower?"
    answer: "Montana's state flower is the Bitterroot, a delicate pink wildflower with 12 to 18 narrow petals that blooms in valleys and on mountain slopes across the state."
  
  - question: "When did Montana adopt the Bitterroot as its state flower?"
    answer: "Montana adopted the Bitterroot on February 27, 1895. This made Montana one of the earliest states to designate an official state flower."
  
  - question: "Why did Montana choose the Bitterroot?"
    answer: "Montana chose the Bitterroot because of its connection to the Lewis and Clark Expedition and Native American heritage. The flower represented Montana's wilderness and pioneer character. The Bitterroot Mountains and Bitterroot Valley were important geographical features in western Montana."
  
  - question: "Is the bitterroot native to Montana?"
    answer: "Yes, the bitterroot is native to Montana and grows wild in dry valleys and on rocky hillsides throughout the state. The plant thrives in poor gravelly soil at elevations from 4,000 to 8,000 feet."
  
  - question: "When does the bitterroot bloom in Montana?"
    answer: "The bitterroot blooms from May through July in Montana, with peak flowering occurring in June. Lower elevations see earlier flowers than mountain areas. Individual blooms last only a few days and open only in direct sunlight."

