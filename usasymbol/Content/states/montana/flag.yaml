type: State Flag
state: Montana
name: Montana State Flag
adopted_year: 1905
standardized_year: 1981
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-05-01"

seo_title: "Montana State Flag | Symbols & Meaning"
seo_description: "Montana's flag seal shows the Great Falls of the Missouri — the only river in the continental U.S. that flows north. What the landscape, tools, and motto mean."

intro_text: "The Montana state flag was adopted in 1905 and features the state seal on a blue background. A landscape showing mountains, the Great Falls of Missouri River, and mining tools fills the circular seal. The word Montana appears in gold letters above the seal. This page appears in the [list of U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Montana State Flag Is Designed"
    paragraphs:
      - "The Montana state flag serves as the official flag of Montana. A deep blue field forms the background. The state seal appears in the center showing a mountain landscape with a waterfall and river."
      - "Mining tools including a pick, shovel, and plow appear in the foreground. The state motto Oro y Plata curves on a ribbon. The word Montana sits above the seal in gold capital letters. The flag flies at government offices, schools, and public grounds throughout Montana, with wording tied to the [Montana state motto](/states/montana/motto/oro-y-plata)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Montana Flag Communicates"
    paragraphs:
      - "The flag represents Montana's natural resources and industries through the state seal. The mountains symbolize Montana's rugged terrain. The Great Falls represents the Missouri River and water resources."
      - "Mining tools in the seal show Montana's mining heritage. The plow represents agriculture. Together they emphasize the two foundations of Montana's early economy: mining and farming, the same roots behind [The Treasure State nickname](/states/montana/nickname/the-treasure-state)."
      - "The motto Oro y Plata means Gold and Silver in Spanish. It references the precious metals that drew settlers to Montana Territory. The blue field represents the sky and connects Montana to other western states, while the metallic theme aligns with the [Montana state colors page](/states/montana/color/montana-traditional-state-colors-copper-silver-and-gold)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Montana Flag History and Adoption"
    paragraphs:
      - "Montana authorized its state flag in 1905. The legislature approved a design featuring the state seal on blue. Colonel Harry C. Kessler carried this flag when he led Montana troops during the Spanish-American War in 1898. The design gained popularity before official adoption."
      - "The seal itself dated to 1865. Montana Territory created it 24 years before statehood. The seal showed Montana's landscape and economic activities. When Montana became a state in 1889, the territorial seal became the state seal."
      - "The legislature modified the flag in 1981. Lawmakers added the word Montana in gold letters above the seal. Before this change, the flag showed only the seal on blue. The 1981 revision made Montana's flag easier to identify among states with similar layouts, a pattern visible in [states neighboring states](/rankings/geography/states-neighboring-states)."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Montana Flag"
    versions:
      - name: "Original State Flag"
        years: "1905–1981"
        image: "versions/original-1905.webp"
        description: "The first official flag featured only the state seal centered on a blue field without the state name."

      - name: "Current State Flag"
        years: "1981–present"
        image: "versions/current-1981.webp"
        description: "The modified flag added the word Montana in gold letters above the seal."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Montana Flag"
    symbols:
      - id: seal
        name: "Montana State Seal"
        image: "symbols/seal.svg"
        paragraphs:
          - "The state seal depicts a mountain landscape with a waterfall, river, and mining tools. Montana Territory adopted this seal in 1865. A landscape shows mountains in the background. The Great Falls of the Missouri River cascades in the middle ground. Trees frame both sides."
          - "Mining tools fill the foreground. A pick and shovel cross each other. A plow sits nearby. These tools represent Montana's two main industries during territorial days: mining and agriculture. The imagery shows how settlers made their living."
          - "A ribbon curves below with the motto Oro y Plata. That's Spanish for Gold and Silver. Montana's mountains contained both precious metals. The motto honors the mining boom that built Montana Territory."

      - id: text
        name: "Montana Text"
        image: "symbols/text.svg"
        paragraphs:
          - "The word Montana appears above the seal. Gold capital letters spell out the state name. The legislature added this element in 1981."
          - "Before 1981, nothing identified which state the flag represented. Many states used blue flags with seals. Montana's flag looked similar to others. Adding the state name solved this problem."

      - id: field
        name: "Blue Field"
        image: "symbols/field.svg"
        paragraphs:
          - "Dark blue covers the entire background. Montana chose blue to match other state flags. The color also represents the Montana sky."
          - "Blue became standard for western state flags in the late 1800s and early 1900s. Montana followed this pattern when it adopted its flag in 1905."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Montana State Flag Colors"
    paragraphs:
      - "The flag uses dark blue, gold, green, brown, white, and gray. Dark blue forms the field. Gold appears in the text and motto ribbon. Green shows in the trees and landscape. Brown colors the tools. White and gray depict the waterfall and mountains."
    colors:
      - name: "Dark Blue"
        hex: "#002868"
      - name: "Gold"
        hex: "#FFD700"
      - name: "Green"
        hex: "#2D5016"
      - name: "Brown"
        hex: "#8B4513"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Gray"
        hex: "#808080"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Montana State Flag Facts"
    facts:
      - "Montana adopted its state flag in 1905"
      - "The state seal on the flag dates to 1865"
      - "The word Montana was added to the flag in 1981"
      - "The motto Oro y Plata means Gold and Silver in Spanish"
      - "The seal shows the Great Falls of the Missouri River"
      - "Colonel Harry C. Kessler popularized the flag design before official adoption"

faq:
  - question: "Which flag serves as Montana's official banner?"
    answer: "The Montana state flag is the official banner of Montana. It features the state seal showing mountains, a waterfall, and mining tools on a dark blue field with the word Montana above."

  - question: "What are the main visual elements on Montana's flag?"
    answer: "The flag shows the Montana state seal centered on a dark blue background. The seal depicts mountains, the Great Falls of the Missouri River, and mining tools. The word Montana appears in gold letters above the seal."

  - question: "What does the Montana state flag represent?"
    answer: "The flag represents Montana's natural resources and industries. The mountains symbolize terrain. The waterfall represents rivers. The mining tools and plow show Montana's mining and agricultural heritage."

  - question: "What meaning is attached to Montana's flag?"
    answer: "The flag means Montana's foundation in mining and farming. The motto Oro y Plata means Gold and Silver, referencing precious metals. The landscape shows Montana's natural beauty and resources."

  - question: "Which colors define Montana's flag?"
    answer: "The Montana state flag uses dark blue, gold, green, brown, white, and gray. Dark blue forms the background. Gold appears in the text and ribbon."

  - question: "Who designed the Montana state flag?"
    answer: "No single designer is credited with the Montana state flag. The design emerged from the territorial seal created in 1865. Colonel Harry C. Kessler popularized the flag before its 1905 adoption."

