# verification: Montana law calls it the blackspotted cutthroat trout and lists the scientific name as Salmo clarki, the older name for Oncorhynchus clarkii. The starting record used Oncorhynchus clarkii lewisi, but that name covers only the westslope subspecies. In Montana, "blackspotted cutthroat trout" covers both the westslope and Yellowstone cutthroat trout, so the species name is used here. The year 1977 and the title "State Fish" are confirmed.
