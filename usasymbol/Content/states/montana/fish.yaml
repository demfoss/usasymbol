- id: facts
  icon: fa-solid fa-lightbulb
  title: Blackspotted Cutthroat Trout Facts
  facts:
  - Adopted in 1977 by the Montana Legislature.
  - Scientific name is Oncorhynchus clarkii. State law uses the older name Salmo clarki.
  - Has a bright red slash under each side of its lower jaw.
  - Usually grows about 6 to 16 inches long.
  - Captain William Clark described it in 1805.
faq:
- question: What is Montana's state fish?
  answer: Montana's state fish is the blackspotted cutthroat trout. The name covers two native trout, the westslope cutthroat and the Yellowstone cutthroat.
- question: When did Montana adopt the Blackspotted Cutthroat Trout?
  answer: The Montana Legislature made the blackspotted cutthroat trout the official state fish in 1977.
- question: Why did Montana choose the Blackspotted Cutthroat Trout?
  answer: It is a native Montana trout that William Clark described in 1805. The state's fisheries chief told lawmakers that it needs clean, high-quality habitat, which Montanans value.
- question: Why is it called a cutthroat trout?
  answer: It has a bright red slash on each side of its lower jaw. From the side, the mark looks like a cut on the fish's throat.
- question: Is the blackspotted cutthroat trout one fish or two?
  answer: It is one state fish, but the name includes two native kinds of cutthroat. The westslope cutthroat lives mostly in western Montana, and the Yellowstone cutthroat lives in the Yellowstone River drainage.
