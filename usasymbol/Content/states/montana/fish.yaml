intro_text: Montana's state fish is the blackspotted cutthroat trout, a native trout with a red slash under its jaw, adopted in 1977. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Montana?
  paragraphs:
  - The blackspotted cutthroat trout has been Montana's official state fish since the Montana Legislature named it in 1977. Its scientific name is Oncorhynchus clarkii.
  - The name covers two kinds of cutthroat trout that are native to Montana. They are the westslope cutthroat trout and the Yellowstone cutthroat trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Blackspotted Cutthroat Trout
  paragraphs:
  - The easiest way to spot a cutthroat trout is the bright red slash on each side of its lower jaw. That mark gives the fish its name.
  - Its body is usually golden or gray-green and covered with black spots. Most of the spots sit toward the tail.
  - The Yellowstone cutthroat trout tends to be golden brown with fairly large spots. The westslope cutthroat trout has fewer spots near its head and many more toward its tail and on its fins.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In 1974, a Montana fisheries manager suggested that the state pick an official fish. He pointed out that fishing is a major pastime for Montanans and draws tourists to the state.
  - In 1976, a Montana television host started a campaign asking viewers to vote for a state fish. The Montana Legislature made the blackspotted cutthroat trout the official state fish in 1977.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Montana Chose the Blackspotted Cutthroat Trout
  paragraphs:
  - The trout is native to Montana. Captain William Clark described it in 1805 during the Lewis and Clark expedition.
  - The head of the state's fisheries division spoke for the cutthroat in testimony before lawmakers in 1977. He said the fish needs clean, high-quality habitat to survive, just as Montanans value a high quality of life.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Blackspotted Cutthroat Trout
  paragraphs:
  - Westslope cutthroat trout live in western Montana's Kootenai and Clark Fork river systems. They also live in the headwaters of the Missouri River.
  - Yellowstone cutthroat trout live in the Yellowstone River drainage in south-central Montana. One stronghold is the upper Shields River, where the state works to protect them.
