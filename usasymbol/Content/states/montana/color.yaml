expert_quote:
  text: "Montana's relationship with copper runs as deep as the extensive mine shafts that once honeycombed the hills of Butte — the copper hue is the most economically loaded element of Montana's state colors, representing the industry that shaped the state's cities, labor history, and politics."
  source: "Montana State Historical Society, Mining Heritage Documentation"

faq:
  - question: "What are the state colors of Montana?"
    answer: "The traditional state colors of Montana are Copper, Silver, and Gold, recognized by cultural and mining heritage rather than formal legislative designation. The colors represent the three minerals — gold (discovered 1862), silver (1870s-80s), and copper (1882) — that built Montana's economy and drove its admission to statehood in 1889."
  - question: "What is the HEX code for Montana Copper?"
    answer: "The closest standard HEX code for Montana Copper is #B87333, corresponding to Pantone PMS 7526, representing the warm reddish-brown of elemental copper as seen in the copper dome of the Montana State Capitol."
  - question: "What is the HEX code for Montana Gold?"
    answer: "The closest standard HEX code for Montana Gold is #CFB53B, corresponding to Pantone PMS 4525, representing the warm heraldic gold associated with Montana's gold mining heritage and the Oro y Plata state motto."
  - question: "What is the HEX code for Montana Silver?"
    answer: "The closest standard HEX code for Montana Silver is #A8A9AD, corresponding to Pantone PMS 877 (metallic silver), representing the silver mining industry directly named in the Oro y Plata state motto."
  - question: "What does Oro y Plata mean?"
    answer: "Oro y Plata is Montana's state motto, adopted in 1865, meaning 'Gold and Silver' in Spanish. It is the only U.S. state motto written in Spanish that directly names two colors, reflecting the gold and silver mining that triggered Montana's settlement and drove the creation of Montana Territory in 1864."
  - question: "Why is Montana called the Treasure State?"
    answer: "Montana is called the Treasure State because of its notable mineral wealth, including gold, silver, copper, sapphires, and garnets. The nickname first appeared on a state promotional booklet in 1895 and appeared on Montana license plates from 1950 to 1966 and again starting in 2010."
  - question: "Does Montana have official state colors?"
    answer: "No. Montana has not enacted legislation designating official state colors by statute. Copper, silver, and gold are recognized as traditional colors through the state motto Oro y Plata (Gold and Silver, 1865), the copper dome of the Montana State Capitol, and the metallic mining heritage that shaped the Treasure State."

