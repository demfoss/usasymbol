seo_title: "Montana State Colors | Copper Silver Gold"
seo_description: "Montana state colors are Copper, Silver, and Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Montana are **Copper**, **Silver**, and **Gold**, derived from the three minerals that shaped Montana's statehood and encoded in the state motto *Oro y Plata* adopted in 1865. While Montana has not enacted a separate state color law, these metallic hues appear on [the Montana state flag](/states/montana/flag/montana-state-flag) and throughout state branding. The specifications below list HEX, RGB, CMYK, and Pantone values for Montana color matching."

official_colors: "Copper, Silver, and Gold"
official_since: "Traditional / Mining Heritage (no formal legislative designation; state motto Oro y Plata adopted 1865)"
primary_use: "State cultural identity, Montana State Capitol architecture (copper dome), state historical and tourism branding, University of Montana (silver/maroon) and Montana State University (gold/blue) institutional colors"
known_for: "Montana is the only U.S. state with a motto written in Spanish that directly names two of its three traditional colors — Oro y Plata, meaning Gold and Silver — adopted in 1865 during the territorial period; the Montana State Capitol dome is clad in copper from Montana mines, making copper the most architecturally prominent of the three traditional state colors"

