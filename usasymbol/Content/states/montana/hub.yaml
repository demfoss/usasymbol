name_meaning:
  heading: What Does Montana Mean?
  paragraphs:
  - Montana joined the United States as the 41st state in 1889. The name comes from the Spanish word montana, meaning mountainous country or mountain region.
  - The meaning is almost too fitting. Montana's symbols keep returning to mountain scale, mineral wealth, and wild habitat through the Treasure State nickname, Oro y Plata, ponderosa pine, bitterroot, and grizzly bear.
  - Montana's postal abbreviation is MT, and residents are Montanans. The Treasure State is the main nickname, reflecting the gold and silver language also preserved in the state motto.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From Spanish, connected with mountains or mountainous country.
    - label: Statehood
      text: Montana became the 41st state in 1889.
    - label: Motto
      text: Oro y Plata means Gold and Silver.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Montana, a northern Rocky Mountain and Great Plains state.
    - label: Landscape
      text: The name's mountain meaning fits the western ranges even though eastern Montana includes broad plains.
    - label: People
      text: People from Montana are called Montanans.
  - heading: Nicknames and Short Forms
    items:
    - label: The Treasure State
      text: Main nickname tied to mineral wealth and the state motto.
    - label: Big Sky Country
      text: Widely used informal identity for Montana's open landscapes.
    - label: Abbreviation
      text: MT; older short form Mont.
editorial:
  heading: What Montana's Symbols Say About the State
  paragraphs:
  - Montana's [motto](/states/montana/motto) does not hide its mining origin. Oro y Plata, Gold and Silver, gives the [Treasure State nickname](/states/montana/nickname) a hard economic edge rather than a purely scenic one.
  - The [grizzly bear](/states/montana/mammal/grizzly-bear) changes the emotional weight of the hub. It is not a decorative animal symbol. It brings wilderness, recovery, conflict, and Montana's share of lower-48 grizzly habitat into the official set.
  - The [bitterroot](/states/montana/flower), [ponderosa pine](/states/montana/tree), and [western meadowlark](/states/montana/bird) keep the state grounded in actual western ecosystems, while [Maiasaura peeblesorum](/states/montana/dinosaur) adds Montana's fossil beds and dinosaur science to the story.
faq:
- question: What is Montana's most famous state symbol?
  answer: The [grizzly bear](/states/montana/mammal/grizzly-bear) is one of Montana's most recognizable symbols because it is strongly tied to the state's wilderness image.
- question: What is Montana's state bird?
  answer: Montana's state bird is the [western meadowlark](/states/montana/bird), adopted in 1931.
- question: What is Montana's state flower?
  answer: Montana's state flower is the [bitterroot](/states/montana/flower), adopted in 1895.
- question: What does Montana's motto mean?
  answer: Montana's [state motto](/states/montana/motto), Oro y Plata, means Gold and Silver and connects directly to the state's mining history.
- question: How many official state symbols does Montana have?
  answer: The Montana hub brings together pages for the flag, meadowlark, bitterroot, ponderosa pine, motto, nickname, grizzly bear, dinosaur, and colors.
