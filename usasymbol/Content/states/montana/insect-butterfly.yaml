sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Montana?
  paragraphs:
  - "The mourning cloak, Nymphalis antiopa, is Montana's official state butterfly. The Montana Legislature designated it in 2001."
  - "It is one of the longest-lived butterflies in North America, with adults surviving through the winter."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Mourning Cloak Butterfly
  paragraphs:
  - "The mourning cloak has dark maroon wings bordered by a cream-yellow edge, with a row of small blue spots just inside that border."
  - "Adults have a wingspan of about 3 to 4 inches."
  - "Unlike most butterflies, mourning cloaks can survive Montana winters as adults, hiding under bark or in woodpiles until they emerge on warm days."

- id: history
  icon: fa-solid fa-landmark
  title: How Montana Chose the Mourning Cloak Butterfly
  paragraphs:
  - "The Montana Legislature designated the mourning cloak as the official state butterfly in 2001."
  - "Official sources name the mourning cloak as Montana's state butterfly but do not give a detailed reason for the choice. It is often the first butterfly Montanans see each year, sometimes appearing while snow is still on the ground."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Mourning Cloak Butterfly in Montana
  paragraphs:
  - "The mourning cloak is found across Montana, in forests, parks, and neighborhoods wherever willow, elm, and cottonwood trees grow."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Mourning Cloak Butterfly Facts
  facts:
  - "Adopted: 2001, by the Montana Legislature."
  - "Scientific name: Nymphalis antiopa."
  - "Wingspan: about 3 to 4 inches."
  - "Adults survive winter by hiding under bark, then emerge on warm days, sometimes before snow has melted."
  - "Dark maroon wings with a cream-yellow border and a row of blue spots make it easy to recognize."




