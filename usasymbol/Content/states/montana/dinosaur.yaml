faq:
  - question: "What is Montana's state fossil?"
    answer: "Montana's state fossil is Maiasaura peeblesorum. It was adopted in 1985."

  - question: "What does Maiasaura mean?"
    answer: "Maiasaura means 'good mother lizard.'"

  - question: "Who discovered Maiasaura?"
    answer: "Laurie Trexler found the nesting site in 1978."

  - question: "Did Maiasaura really go to space?"
    answer: "Yes. Maiasaura bone and eggshell flew on STS-51F in 1985."

  - question: "Where is Egg Mountain?"
    answer: "Egg Mountain is near Choteau in Teton County, Montana."

  - question: "Why is Maiasaura significant beyond Montana?"
    answer: "It provided major evidence that some dinosaurs cared for their young."

