faq:
  - question: "What is Montana's state fossil?"
    answer: "Maiasaura didn't just add a name to the list — it changed the field. When Jack Horner's team found nesting colonies and juvenile bones in Montana's Two Medicine Formation in 1978, it dismantled the assumption that dinosaurs were cold-blooded, negligent parents like modern reptiles. Montana designated Maiasaura peeblesorum as its official state fossil by House Bill 422 in 1985 — the same year Montana astronaut Loren Acton carried Maiasaura bone and eggshell aboard the Space Shuttle on mission STS-51F."

  - question: "What does Maiasaura mean?"
    answer: "Maiasaura means 'good mother lizard' — from the Greek words for mother (maia) and lizard (saura). The name refers to evidence of parental care found at the Egg Mountain nesting site, where baby hadrosaurs too young to walk were found in nests, suggesting parents were providing food."

  - question: "Who discovered Maiasaura?"
    answer: "Collector Laurie Trexler found the first nesting site in 1978 and reported it to paleontologist Jack Horner. Horner and colleague Robert Makela excavated the site and formally named and described Maiasaura peeblesorum in 1979. The species name peeblesorum honors the Peebles family, who owned the land."

  - question: "Did Maiasaura really go to space?"
    answer: "Yes. In 1985, Montana astronaut Loren Acton carried a fragment of Maiasaura bone and a piece of eggshell on Space Shuttle Challenger mission STS-51F (Spacelab 2). These specimens are the first dinosaur material with a documented spaceflight history and are now held at the Museum of the Rockies in Bozeman."

  - question: "Where is Egg Mountain?"
    answer: "Egg Mountain is near the town of Choteau in Teton County, northwestern Montana. The site is in the Two Medicine Formation and has been actively excavated by Museum of the Rockies researchers since the late 1970s. The Old Trail Museum in Choteau is the local visitor gateway to the area."

  - question: "Why is Maiasaura significant beyond Montana?"
    answer: "The Egg Mountain discoveries provided the first strong evidence that dinosaurs engaged in parental care — nesting in colonies, tending eggs, and feeding hatchlings too young to forage independently. This overturned the dominant view of dinosaurs as behaviorally simple reptiles and contributed to the broader argument that dinosaurs were more physiologically and behaviorally sophisticated than previously believed."

