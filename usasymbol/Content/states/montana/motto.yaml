title: "Oro y Plata"
language: "Spanish"
english_translation: "Gold and Silver"
adopted_year: 1865

author: "USA Symbol Team"
date_published: "2025-12-03"
date_modified: "2026-03-27"
seo_title: "Montana State Motto | Oro y Plata! Gold and Silver!"
seo_description: "Montana's motto almost had a Spanish grammar error — the original draft read 'Oro el Plata' (Gold the Silver). Someone caught it before adoption. The committee also debated using 'El Dorado' instead. Montana has no Spanish colonial history, yet chose Spanish for its motto. Francis M. Thompson, who designed the seal, had experience engraving seals on ax handles."

intro_text: "Montana's state motto is <strong>Oro y Plata</strong> — Spanish for <em>Gold and Silver</em>. It was adopted on February 9, 1865, when Governor Sidney Edgerton signed the territorial seal resolution. The committee's original draft had a Spanish grammar error: it read 'Oro el Plata' (Gold the Silver) — 'el' being the masculine article rather than the conjunction 'y.' Someone noticed before final adoption. The committee had also debated using 'El Dorado' (the place of gold) instead. Francis M. Thompson, who chaired the design committee, had previous experience engraving seals for mining districts on ax handles."

sections:
  - id: "grammar-error-caught"
    icon: "fa-solid fa-pen"
    title: "The Original Draft Had a Spanish Grammar Error"
    paragraphs:
      - "When the seal committee submitted its design to the First Legislative Assembly in February 1865, the motto read 'Oro el Plata.' In Spanish, 'el' is the masculine definite article — it means 'the.' The phrase translated as 'Gold the Silver,' which is grammatically nonsensical. The conjunction 'and' in Spanish is 'y' — not 'el.'"
      - "Someone on the committee or in the legislature caught the error before final passage. The correction changed 'el' to 'y,' producing the grammatically correct 'Oro y Plata' — 'Gold and Silver.' The corrected version was what Governor Edgerton signed on February 9, 1865."
      - "This was a practical risk: Montana's territorial legislators were largely transplants from eastern states or other mining regions. Most spoke English as their first language. Spanish was the language of the California gold rush's heritage — not a language most committee members knew well. The grammar error is evidence that the committee chose Spanish for its associations rather than from fluency."

  - id: "el-dorado-alternative"
    icon: "fa-solid fa-coins"
    title: "The Competing Alternative: 'El Dorado'"
    paragraphs:
      - "The seal committee debated alternatives before settling on 'Oro y Plata.' One option they considered was 'El Dorado' — Spanish for 'the gilded one' or 'the place of gold.' El Dorado was the legendary city of gold sought by Spanish conquistadors in South America, and the name had become a general term in American English for a place of fabulous wealth."
      - "California had already named a county El Dorado after the gold rush of 1848. The term was well understood and evocative of mineral wealth. The committee ultimately rejected it and chose the more direct 'Oro y Plata,' which named both precious metals found in Montana rather than evoking a mythical city."
      - "The choice of two metals rather than one was accurate: Montana had both gold deposits (the strikes at Grasshopper Creek in 1862 that triggered territorial creation) and silver deposits (later major finds at Butte and elsewhere). 'Oro y Plata' described economic reality more precisely than a legendary reference would have."

  - id: "thompson-and-spanish-without-spanish-history"
    icon: "fa-solid fa-hammer"
    title: "Spanish Motto, No Spanish History"
    paragraphs:
      - "Montana has no Spanish colonial history. The region was explored by Lewis and Clark (American), fur-traded by French-Canadian and British companies, and then settled by American miners. There was no Spanish colonial administration, no Spanish missions, no Spanish land grants. The Spanish language had no organic connection to Montana Territory in 1865."
      - "The committee chose Spanish for its romantic associations with mineral wealth in the American imagination. The California Gold Rush had made Spanish-language terms like bonanza, placer, and madre lode part of the mining vocabulary across the American West. Spanish carried the cultural weight of gold discovery. For a territory built on gold strikes, a Spanish motto felt appropriate even without historical Spanish presence."
      - "Francis M. Thompson, who chaired the design committee, had arrived in Montana from Massachusetts in 1862 during the gold rush. He served as representative from Beaverhead County and had practical experience engraving seals for local mining districts — on ax handles, as one contemporary account notes. His original hand-drawn seal design is preserved at the Montana Historical Society."

  - id: "territorial-to-state"
    icon: "fa-solid fa-landmark"
    title: "The Motto Survived 25 Years as a Territorial Motto Before Statehood"
    paragraphs:
      - "Montana Territory was created on May 26, 1864. The motto was adopted in 1865 as a territorial motto. Montana remained a territory for 25 years — longer than most Western territories. President Benjamin Harrison proclaimed Montana the 41st state on November 8, 1889."
      - "When the territorial seal became a state seal, only one word changed: 'Territory' became 'State.' The motto stayed 'Oro y Plata' without modification. The Third Legislative Assembly formally adopted the Great Seal of the State of Montana on March 2, 1893."
      - "By the time Montana achieved statehood, the gold rush economy that inspired the motto had given way to something larger. Butte's copper mines — not gold or silver — became Montana's dominant industry. Butte was called 'the Richest Hill on Earth' for its copper deposits, which supplied the wire for American electrification. The motto about gold and silver technically understated Montana's actual mineral wealth by 1889."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Montana State Motto Facts"
    style: "gradient"
    facts:
      - "The original draft read 'Oro el Plata' (Gold the Silver) — a Spanish grammar error caught before final adoption."
      - "The committee debated using 'El Dorado' (the place of gold) as an alternative motto."
      - "Montana has no Spanish colonial history, yet chose Spanish for its motto."
      - "Francis M. Thompson, who designed the seal, had experience engraving mining seals on ax handles."
      - "Montana became a territory May 26, 1864, and the 41st state November 8, 1889 — 25 years as a territory."
      - "By statehood, copper mining had surpassed gold and silver as Montana's main industry — but the motto remained unchanged."

faq:
  - question: "What is Montana's state motto?"
    answer: "Montana's state motto is 'Oro y Plata,' a Spanish phrase meaning 'Gold and Silver.' It was adopted on February 9, 1865, when Governor Sidney Edgerton signed the territorial seal resolution."

  - question: "What does 'Oro y Plata' mean?"
    answer: "'Gold and Silver' in Spanish — 'oro' is gold, 'y' is and, 'plata' is silver. The phrase referred to the gold and silver mining that drove Montana Territory's economy in the 1860s."

  - question: "Why is Montana's motto in Spanish?"
    answer: "Montana has no Spanish colonial history, but the committee chose Spanish for its romantic associations with mineral wealth. The California Gold Rush had made Spanish mining terms part of American vocabulary. For a territory built on gold strikes, Spanish carried the cultural weight of precious metal discovery."

  - question: "Was there a grammar error in the original motto?"
    answer: "Yes. The original draft read 'Oro el Plata' — using 'el' (the masculine article meaning 'the') instead of 'y' (and), making it 'Gold the Silver' rather than 'Gold and Silver.' The error was caught before final adoption and corrected to 'Oro y Plata.'"

  - question: "When did Montana adopt its motto?"
    answer: "February 9, 1865, when Governor Sidney Edgerton signed the territorial seal resolution. The motto predates Montana statehood by 24 years — Montana didn't become a state until November 8, 1889. The Third Legislative Assembly formally adopted it as a state seal motto on March 2, 1893."

  - question: "Where does Montana's motto appear?"
    answer: "On Montana's Great Seal (on a banner at the bottom, beneath a plow, mining tools, mountains, and the Great Falls of the Missouri River), and on the state flag (a blue field with the seal and 'MONTANA' in gold letters above, adopted 1905). The seal is kept by the Montana Secretary of State."

