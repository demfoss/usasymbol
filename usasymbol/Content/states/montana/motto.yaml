faq:
  - question: "What is Montana's state motto?"
    answer: "Montana's state motto is \"Oro y Plata,\" a Spanish phrase meaning \"Gold and Silver.\" It was adopted on February 9, 1865, by the Montana Territorial Legislature and formally confirmed by the state on March 2, 1893."

  - question: "What does \"Oro y Plata\" mean?"
    answer: "\"Oro y Plata\" means \"Gold and Silver\" in Spanish. The motto reflects the gold and silver mining that drove settlement in Montana Territory beginning in 1862."

  - question: "Why is Montana's motto in Spanish?"
    answer: "Spanish mining vocabulary was common throughout the American West in the 1860s. Words like placer, bonanza, and plata were everyday terms among prospectors who moved from California and Nevada to Montana's new gold fields."

  - question: "When did Montana adopt its state motto?"
    answer: "The motto was adopted on February 9, 1865, by the Montana Territorial Legislature, 24 years before Montana became a state on November 8, 1889. The state legislature formally confirmed it on March 2, 1893."

  - question: "Who created Montana's state motto?"
    answer: "Francis McGee Thompson, a representative from Beaverhead County, proposed the motto at the First Territorial Legislative Assembly in Bannack in the winter of 1864–1865."

  - question: "Where does Montana's motto appear?"
    answer: "On a ribbon at the bottom of the Montana state seal. The seal appears on the state flag — adopted in 1905 and modified in 1981 to add \"MONTANA\" above the seal on a deep blue background."

