seo_title: "Montana State Motto | Oro y Plata"
seo_description: "Montana's state motto is \"Oro y Plata,\" Spanish for \"Gold and Silver.\" Adopted February 9, 1865, when Montana was a territory, reflecting its mining wealth."

intro_text: "Montana's state motto is <strong>Oro y Plata</strong>, a Spanish phrase meaning <em>Gold and Silver</em>. It was adopted on February 9, 1865, when Montana was still a territory, reflecting the gold and silver strikes that drew tens of thousands of miners to the region. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

