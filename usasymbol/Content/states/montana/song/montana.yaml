faq:
  - question: What is Montana's state song?
    answer: "Montana's official state song is \"Montana,\" adopted in 1945."
  - question: Who wrote Montana's state song?
    answer: "Joseph E. Howard composed the music and Charles Cohan wrote the lyrics in 1910."
  - question: When did Montana adopt "Montana" as its state song?
    answer: "The Montana Legislature adopted the song as the official state song on February 20, 1945."
  - question: Is it true Montana's state song was written on a dare?
    answer: "Yes. A Butte hostess challenged Howard and Cohan to write a Montana song, and they reportedly finished it in about thirty minutes."

