sections:
  - id: overview
    icon: fa-solid fa-music
    title: Montana State Song
    paragraphs:
      - "\"Montana\" is the state's official song, composed by Joseph E. Howard with lyrics by Charles Cohan in 1910. The Montana Legislature adopted it as the official state song on February 20, 1945, thirty-five years after it was first performed."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Montana\" Explained"
    paragraphs:
      - "The song praises Montana's mountains, sunsets, and open landscape in the style of an early twentieth-century stage anthem, written to be sung with full orchestration in a theatrical setting. Its tone is celebratory and direct, built for a big, crowd-pleasing performance."
      - "Composer Joseph E. Howard led a traveling musical theater company that performed \"The Goddess of Liberty\" in Butte on September 27, 1910. After the show, local host Mrs. E. Creighton Largey teased Howard for using a song about Illinois instead of Montana and challenged him and newspaper editor Charles Cohan to write something better."
      - "Howard and Cohan reportedly composed the melody and lyrics within about thirty minutes of the challenge, and the finished song premiered two days later in Helena to an enthusiastic reception, drawing a dozen encores before the show could continue."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Montana" Represents Montana
    paragraphs:
      - "The song's origin story, born from a direct challenge to write something honoring Montana rather than another state, gave it an authenticity that appealed to lawmakers decades later. Its lyrics praise the state's mountains and landscape directly, unlike the borrowed tune it was written to replace."
      - "\"Montana\" had already built thirty-five years of public familiarity and affection by the time the Legislature made it official in 1945, having spread through live performances long before radio or recordings existed to help it."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Montana\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Montana" Became Montana's State Song
    paragraphs:
      - "\"Montana\" served as the state's unofficial musical calling card for 35 years after its 1910 premiere before the Legislature and Governor Sam C. Ford formally adopted it as the official state song on February 20, 1945."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Montana

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Montana\" Facts"
    facts:
      - "Montana adopted \"Montana\" as its official state song on February 20, 1945."
      - "Joseph E. Howard and Charles Cohan reportedly wrote the song in about thirty minutes."
      - "The song premiered in Helena on September 29, 1910, and drew twelve encores."
      - "Montana also recognizes a state ballad and a state lullaby alongside its main state song."

