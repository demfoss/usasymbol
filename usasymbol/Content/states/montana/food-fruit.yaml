faq:
  - question: "What is Montana's state fruit?"
    answer: "Montana's state fruit is the huckleberry, adopted by the Montana Legislature in 2023."
  - question: "When did Montana adopt the huckleberry as its state fruit?"
    answer: "The Montana Legislature designated the huckleberry the official state fruit in 2023."
  - question: "Why did Montana choose the huckleberry?"
    answer: "Huckleberry picking is a long-standing summer tradition in Montana's mountain communities, where the wild berry is gathered for jams and pies."
  - question: "Is the huckleberry grown or gathered in Montana today?"
    answer: "Huckleberries cannot be commercially farmed, so they are still hand-picked wild in Montana's forests each summer."

