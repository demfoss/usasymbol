intro_text: "Montana's state fruit is the huckleberry, adopted in 2023 to recognize a wild berry that grows in the state's mountain forests and has long been gathered by Montanans. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Montana's State Fruit?"
    paragraphs:
      - "The huckleberry is Montana's official state fruit, designated by the Montana Legislature in 2023. Huckleberries grow wild in the forests of western Montana and are not commercially farmed."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Huckleberry"
    paragraphs:
      - "Huckleberries are small, dark purple berries that resemble blueberries but have a more intense, tart-sweet flavor. They grow on low shrubs in mountain forests and ripen in late summer, and because the plants resist cultivation, nearly all huckleberries sold in Montana are hand-picked in the wild."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Huckleberry Became Montana's State Fruit"
    paragraphs:
      - "The Montana Legislature designated the huckleberry the official state fruit in 2023."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Montana Chose the Huckleberry"
    paragraphs:
      - "Huckleberry picking is a long-standing summer tradition in Montana's mountain communities, and the berry appears in local foods from jams to pies across towns near Glacier National Park and the state's forests."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Huckleberry Facts"
    facts:
      - "Adopted as Montana's state fruit in 2023."
      - "Huckleberries cannot be commercially farmed and are gathered wild."
      - "Huckleberries typically ripen in Montana in late summer."

