faq:
  - question: "What is Montana's state animal?"
    answer: "Montana's state animal is the grizzly bear (Ursus arctos horribilis), designated in 1983. Montana schoolchildren selected the grizzly through a democratic vote involving 55,000 students in 425 schools, with the grizzly winning by a two-to-one margin over the elk."

  - question: "When was the grizzly bear designated as Montana's state animal?"
    answer: "Governor Ted Schwinden signed the grizzly bear designation into law on April 7, 1983, following a yearlong educational project where Montana schoolchildren researched, campaigned for, and voted on which animal best represented the state."

  - question: "How many grizzly bears live in Montana?"
    answer: "Approximately 800 grizzly bears live in Montana—more than half the estimated 1,500 grizzlies remaining in the lower 48 states. The Northern Continental Divide Ecosystem (Glacier National Park and Bob Marshall Complex region) hosts 1,000+ bears counting individuals on both sides of the U.S.-Canada border."

  - question: "Why did Montana choose the grizzly bear as state animal?"
    answer: "Montana schoolchildren selected the grizzly because Montana is the only state in the lower 48 with viable grizzly populations in multiple ecosystems. Students recognized the bear's size, strength, and beauty represented Montana's character, and its conservation represented the state's commitment to protecting wilderness and wildlife."

  - question: "Where can you see grizzly bears in Montana?"
    answer: "Prime grizzly viewing locations include Glacier National Park (especially Many Glacier area and Logan Pass), trails in the Bob Marshall Wilderness Complex, and roadside areas in northwest Montana during berry season. Montana Grizzly Encounter near Bozeman offers close viewing of rescued bears that cannot survive in the wild."

  - question: "How do you tell a grizzly bear from a black bear?"
    answer: "Grizzly bears have a distinctive shoulder hump (muscle mass for digging), concave facial profile, and longer curved claws compared to black bears. Black bears lack the shoulder hump, have straight facial profiles, and shorter hooked claws. Color alone doesn't distinguish species—both can be blonde, brown, or black."

  - question: "Are grizzly bears dangerous?"
    answer: "Grizzly bears are powerful wild animals that can be dangerous, particularly female bears with cubs. However, attacks are rare when people follow safety guidelines: carry bear spray, make noise while hiking, properly store food, maintain 100+ yards distance from bears, and never approach cubs. Most grizzly encounters end with the bear fleeing if given space and an escape route."

  - question: "What is the Bob Marshall Wilderness?"
    answer: "The Bob Marshall Wilderness Complex encompasses over 1.5 million acres of protected wilderness south of Glacier National Park—the third-largest wilderness complex in the lower 48 states. Named after conservationist Bob Marshall, it includes the Bob Marshall Wilderness (1 million acres), Great Bear Wilderness (286,700 acres), and Scapegoat Wilderness (239,936 acres). The complex provides core grizzly habitat with some of the highest bear densities outside Yellowstone."

  - question: "Why are grizzly bears threatened?"
    answer: "Grizzly bears are federally listed as threatened due to habitat loss, human-caused mortality, and small isolated populations. Montana's bears show recovery success, but challenges include highway mortality, conflicts with livestock operations, climate change affecting food sources, and genetic isolation of small populations like Cabinet-Yaak. Recovery requires extensive undisturbed habitat and human tolerance—resources increasingly scarce outside Montana and Yellowstone."

