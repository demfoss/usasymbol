title: "Montana State Animal | Grizzly Bear"
scientific_name: "Ursus arctos horribilis"
adopted_year: 1983

seo_title: "Montana State Animal | Grizzly Bear"
seo_description: "Montana's state animal is the Grizzly Bear, adopted in 1983. Learn why this official Montana symbol was chosen and what it represents."

intro_text: "The Grizzly Bear is the official Montana state animal, designated in 1983. This page gives the direct answer for searches like 'montana state animal', 'montana state animal', and 'montana state mammal' while explaining how the symbol fits the state's official animal designations. Montana is only state in lower 48 with viable grizzly populations in multiple ecosystems; symbol of wilderness preservation; chosen by democratic vote of schoolchildren."

common_name: "Grizzly Bear"
official_since: "1983"
status: "Threatened in contiguous United States; Montana hosts ~800 of ~1,500 bears remaining in lower 48 states"
habitat_in_state: "Glacier National Park, Bob Marshall Wilderness Complex, Cabinet-Yaak region, Greater Yellowstone Ecosystem's northern range"
known_for: "Montana is only state in lower 48 with viable grizzly populations in multiple ecosystems; symbol of wilderness preservation; chosen by democratic vote of schoolchildren"

size: "Adults stand 3.5-4.5 feet at shoulder on all fours; rear up to 8+ feet on hind legs"
weight: "Males: 400-500 pounds (up to 1,500 in exceptional cases); Females: 250-350 pounds"
coloration: "Wide range from light brown (nearly blonde) to dark brown or black; guard hairs often tipped with white or gray creating 'grizzled' appearance; coloration varies with season, nutrition, and age"
distinctive_traits: "Large shoulder hump (muscle mass for digging); long curved claws (3-4 inches); concave facial profile; rounded ears; grizzled silver-tipped fur on shoulders and back"

habitat: "Alpine meadows, dense forests, river valleys, mountain ranges from 3,000-8,000 feet elevation"
range_in_state: "Northern Continental Divide Ecosystem (Glacier National Park, Bob Marshall Complex, Mission Mountains); Cabinet-Yaak region; Greater Yellowstone Ecosystem border areas; expanding east onto prairie habitat along Rocky Mountain Front"
conservation_status: "Federally listed as threatened since 1975; Montana population stable and slowly expanding; estimated 800 bears in Montana out of ~1,500 in lower 48 states"
where_to_find: "Glacier National Park (backcountry and Many Glacier area); Bob Marshall Wilderness Complex trails; wildlife viewing areas in northwest Montana; Montana Grizzly Encounter near Bozeman (rescued bears)"
symbol_connections: "Represents Montana's wilderness character and commitment to conservation; embodies 'Big Sky Country' wildness; connects to state motto 'Oro y Plata' through mineral-rich mountain habitat; reflects Montana's unique position as grizzly stronghold; chosen through democratic process by schoolchildren demonstrating civic engagement"

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor Ted Schwinden signed the grizzly bear designation into law on April 7, 1983, wearing a grizzly bear cap to mark the occasion. The designation followed an unprecedented statewide educational project organized by Secretary of State Jim Waltermire, who wanted Montana schoolchildren to experience democracy firsthand by selecting the state animal themselves."
      - "The State Animal Project engaged 55,000 students in 425 schools throughout Montana during the 1982-1983 school year. Students nominated 74 different animals native to Montana, conducted primary and general elections, created campaign materials including posters, buttons, and bumper stickers, organized rallies, and participated in legislative hearings. One teacher remarked their school rallies 'would put the Democratic conventions to shame.'"

    subsections:
      - subtitle: "How the Students Chose"
        text: "Students approached the selection process with remarkable seriousness and civic engagement. They researched Montana wildlife, debated which animal best represented the state, created campaign materials, held debates, and voted in primary elections to narrow the field before conducting general elections. Over 1,000 schoolchildren attended legislative hearings when the bill reached the Montana Legislature, with many testifying or submitting written testimony. Throughout the legislative session, 100 student-created animal posters decorated the state capitol rotunda. Nine posters became part of the Montana Historical Society's permanent collection of children's art."

      - subtitle: "Why Students Chose the Grizzly"
        text: "Students articulated compelling reasons for selecting the grizzly bear. One student testified: 'Montana is really the only one of the lower forty-eight states that has a grizzly population. That makes the grizzly unique to Montana.' Another stated: 'By its very size, strength, and beauty, the grizzly represents an awesome spectacle. Montana has the same characteristics.' Students recognized the bear's historic significance to the state and its role in Montana's identity. The grizzly won by a two-to-one margin over the runner-up, the elk, demonstrating strong consensus among students statewide."

      - subtitle: "Legislative Recognition"
        text: "Senator Larry Tveit of Fairview sponsored the grizzly bear bill in the Senate, while Representative Clyde Smith of Kalispell carried it in the House. Both chambers passed the bill by wide margins, acknowledging the students' democratic process and their choice. On April 21, 1983, Representative Smith presented a large oil painting of a grizzly bear, created by Elmer Sprunger of Bigfork, to Secretary of State Waltermire on behalf of the 55,000 participating students. The painting hangs in the Secretary of State's office as a lasting reminder of democracy in action by Montana's schoolchildren."

  - id: "state-symbolism"
    title: "What the Grizzly Bear Represents"
    style: "highlight"
    paragraphs:
      - "The grizzly bear represents Montana's vast wilderness and the state's commitment to preserving wild places. Montana is the only state in the lower 48 maintaining multiple viable grizzly bear populations across different ecosystems. This distinction reflects Montana's unique position—a state large enough, wild enough, and committed enough to conservation to support an animal requiring extensive undisturbed habitat, matching the identity behind [The Treasure State nickname](/states/montana/nickname/the-treasure-state)."
      - "The grizzly embodies Montana's identity as 'The Last Best Place' where wildness persists despite modern pressures. When most Western states lost their grizzly populations to overhunting and habitat destruction during the late 1800s and early 1900s, Montana retained enough wilderness to serve as the species' last refuge in the contiguous United States. This survival resulted from Montana's geography, its lower population density, and early conservation efforts that recognized the bear's value."
      - "The designation represents Montana's forward-thinking conservation ethic. By 1983, Montana had already spent decades protecting grizzly habitat, conducting scientific research, and managing human-bear conflicts to ensure the species' survival. The schoolchildren's selection acknowledged this legacy while committing future generations to continuing the work. The grizzly symbolizes not just wilderness but the responsibility to maintain it for those who come after, complementing the civic language of the [Montana state motto](/states/montana/motto/oro-y-plata)."

    subsections:
      - subtitle: "Montana's Grizzly Stronghold"
        text: "Montana hosts approximately 800 of the estimated 1,500 grizzly bears remaining in the lower 48 states—more than half the total population outside Alaska. These bears inhabit three primary regions: the Northern Continental Divide Ecosystem centered on Glacier National Park and the Bob Marshall Wilderness Complex (approximately 1,000+ bears in broader ecosystem), the Cabinet-Yaak region in northwest Montana (fewer than 50 bears), and the northern edge of the Greater Yellowstone Ecosystem (several hundred bears spanning Montana, Wyoming, and Idaho). This concentration makes Montana critical to the species' survival and recovery throughout the American West."

      - subtitle: "Glacier National Park and the Crown of the Continent"
        text: "Glacier National Park, established in 1910, forms the centerpiece of Montana's grizzly country. The park's 1 million acres of pristine alpine and subalpine habitat support a thriving grizzly population that has rebounded significantly since the 1970s. Glacier anchors the Crown of the Continent Ecosystem—one of the most ecologically complete mountain regions in North America. The park's grizzlies serve as ambassadors for the species, with hundreds of thousands of annual visitors witnessing bears in their natural habitat. This exposure creates public support for conservation while demonstrating that humans and grizzlies can coexist when proper precautions are taken."

      - subtitle: "The Bob Marshall Wilderness Complex"
        text: "The Bob Marshall Wilderness Complex encompasses over 1.5 million acres of designated wilderness—the third-largest wilderness complex in the lower 48 states. Named after pioneering conservationist Bob Marshall, who recognized the inherent value of roadless wildlands in the 1930s, the complex includes the Bob Marshall Wilderness (1 million acres, designated 1964), Great Bear Wilderness (286,700 acres, designated 1978), and Scapegoat Wilderness (239,936 acres, designated 1972). This vast roadless region provides core habitat for grizzlies, with population densities among the highest outside Yellowstone. The complex's southern boundary lies 100 miles from Glacier National Park, creating a wildlife corridor supporting bears, wolves, wolverines, and other species requiring large territories."

      - subtitle: "Early Conservation Leadership"
        text: "Montana pioneered grizzly bear conservation decades before federal protection. In 1913, the state created the Sun River Game Preserve on the east side of the Continental Divide to protect elk herds depleted by market hunting—coincidentally providing sanctuary for grizzlies. In 1941, Robert 'Bob' Cooney, Montana's first wildlife biologist, and Ray Gibler conducted one of the first scientific grizzly bear surveys in the Bob Marshall Wilderness. 'There hadn't been much of anything done about the grizzly but we did I'm sure help out in bringing them up from practically nothing to pretty reasonable numbers,' Cooney later reflected. This early research laid groundwork for modern conservation efforts. The contrast with California illustrates what was at stake — [California's grizzly bear became extinct](/states/california/mammal/grizzly-bear) by 1924, eliminated by hunting pressure that Montana's early protections helped prevent within its own borders."

      - subtitle: "Montana's Research Legacy"
        text: "Montana became the center of grizzly bear science in North America. Major research projects included the Border Grizzly Bear Study led by Chuck Jonkel in the 1970s, the East Front Grizzly Bear Study directed by Keith Aune, Rick Mace's South Fork of the Flathead River study, and Chris Servheen's Mission Mountains research. These studies established fundamental understanding of grizzly ecology, behavior, and habitat requirements. Montana Fish, Wildlife & Parks continued surveys through the 1940s, 1950s, and beyond, creating scientific foundation for recovery efforts. This research tradition reflects Montana's commitment to managing wildlife through knowledge rather than assumption."

      - subtitle: "Expanding East onto the Prairie"
        text: "Grizzly bears are reclaiming historic range east of the Rocky Mountain Front, following rivers from Glacier National Park and the Bob Marshall Wilderness onto ranchlands of central Montana. This expansion represents recovery success but creates new challenges as bears encounter livestock operations and human communities. Conservation organizations work with ranchers along the Front, employing range riders, guardian dogs, and bear-proof infrastructure to reduce conflicts. The Blackfeet Nation, whose reservation borders Glacier National Park, plays crucial roles in coexistence efforts. This eastward movement demonstrates healthy population growth while testing Montana's ability to maintain human-bear coexistence in working landscapes."

  - id: "identification"
    title: "How to Identify Grizzly Bears"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Grizzly bears are large, powerfully built animals distinguished by several key features. The prominent shoulder hump—a mass of muscle used to power the forelimbs during digging—immediately identifies grizzlies and distinguishes them from black bears. Adult grizzlies appear massive and heavily built compared to other North American bears, though size varies considerably by sex, age, and season. Their muscle structure supports tremendous strength, quickness, and running speeds up to 35 miles per hour despite their bulk."
        list_items:
          - "**Size**: Adults stand 3.5-4.5 feet at shoulder on all fours; rear to 8+ feet on hind legs; body length 5-7 feet"
          - "**Weight**: Males 400-500 pounds average (exceptional individuals reach 1,500 pounds); females 250-350 pounds; cubs weigh 14 ounces at birth"
          - "**Appearance**: Distinctive shoulder hump; concave (dish-shaped) facial profile; small rounded ears; long straight snout; massive head"
          - "**Features**: Long curved claws 3-4 inches long (adapted for digging, not climbing); grizzled silver-tipped guard hairs creating frosted appearance; coloration from blonde to black"

      - subtitle: "Distinguishing from Black Bears"
        text: "Montana hosts both grizzly and black bears, making correct identification essential for safety and conservation. Grizzlies have prominent shoulder humps absent in black bears, longer curved claws compared to black bears' shorter hooked claws, and concave facial profiles versus black bears' straight profiles. Size alone doesn't reliably distinguish species—large male black bears can weigh more than small female grizzlies. Color provides poor identification since both species range from blonde to black. The shoulder hump and facial profile offer the most reliable field marks when observing bears at safe distances."

      - subtitle: "Behavior and Temperament"
        text: "Grizzly bears are highly intelligent, adaptable omnivores with complex social structures. Adult males (boars) occupy large territories up to 1,100+ square miles, while females (sows) use smaller ranges of 50-300 square miles. Bears are generally solitary except during mating season (late May through mid-July, peaking in mid-June) and when females rear cubs. Sows give birth to 1-3 cubs (usually twins) during winter hibernation, with cubs remaining with mothers for 2-3 years before independence. Female grizzlies defending cubs are extremely dangerous and account for most human injuries. Grizzlies show remarkable memory for food sources and return annually to productive feeding areas."

      - subtitle: "Diet and Feeding Behavior"
        text: "Grizzly bears are opportunistic omnivores eating whatever food sources are seasonally available. Spring diet emphasizes grasses, forbs, roots, winter-killed carrion, and ground squirrels. Summer brings berries, insects, and continued vegetation. Fall focuses on high-calorie foods—whitebark pine nuts, army cutworm moths (in alpine talus slopes), berries, and salmon runs in accessible streams. Montana grizzlies typically eat 36-74 plant species plus rodents and carrion. Bears enter hibernation when food becomes unavailable, typically November through April depending on elevation and individual condition. Pregnant females emerge last, often not until May."

  - id: "in-the-state"
    title: "Grizzly Bears in Montana Today"
    style: "default"
    paragraphs:
      - "Montana's grizzly bear population has shown remarkable recovery since federal protection began in 1975. The Northern Continental Divide Ecosystem population—including Glacier National Park, the Bob Marshall Wilderness, and surrounding areas—contains approximately 1,000+ bears and has demonstrated consistent growth. Population expansion has reestablished bears in areas they hadn't occupied for decades, particularly along the Rocky Mountain Front, in a broad western geography reflected by [states neighboring states](/rankings/geography/states-neighboring-states)."
      - "Despite recovery success, challenges remain. The Cabinet-Yaak population struggles with fewer than 50 bears isolated from other populations by highways and human development. Genetic isolation threatens long-term viability without augmentation or natural immigration. Human-bear conflicts increase as bears expand into areas with livestock operations, rural residences, and recreation. Montana Fish, Wildlife & Parks, federal agencies, tribal governments, and conservation organizations collaborate on management strategies balancing bear recovery with human safety and economic interests."

    facts:
      - "**Population Estimates**: ~800 bears in Montana; ~1,000+ in Northern Continental Divide Ecosystem (spanning into Canada); <50 in Cabinet-Yaak; several hundred in Greater Yellowstone's northern range"
      - "**Protected Habitat**: Glacier National Park (1 million acres); Bob Marshall Wilderness Complex (1.5+ million acres); Cabinet Mountains Wilderness; surrounding national forests and tribal lands"
      - "**Longevity**: Grizzlies are long-lived; individuals known to survive 30+ years in wild; females typically breed first at age 5-6; males mature later at 5-8 years"

  - id: "where-to-see"
    title: "Where to See Grizzly Bears in Montana"
    style: "default"
    paragraphs:
      - "Montana offers exceptional opportunities to observe grizzly bears in their natural habitat, though visitors must prioritize safety and respect for wildlife. Prime viewing locations require proper bear safety equipment including bear spray, food storage, and knowledge of bear behavior."

    list_items:
      - "**Glacier National Park**: Many Glacier area offers excellent bear viewing opportunities along trails and roads during summer berry season. Logan Pass and surrounding high country host bears feeding on glacier lilies, grasses, and ground squirrels in spring and early summer. Going-to-the-Sun Road provides roadside viewing opportunities. Always maintain 100+ yards distance; use binoculars or spotting scopes for observation."
      - "**Bob Marshall Wilderness Complex**: Backcountry hiking and horseback trips through 'The Bob' traverse prime grizzly habitat. Chinese Wall area, South Fork of the Flathead River drainage, and Continental Divide trails offer wilderness bear encounters. Trips require proper food storage in bear canisters or panniers, bear spray, and understanding of bear safety in remote settings. Outfitters based in areas like Choteau, Augusta, and Swan Valley offer guided trips."
      - "**Montana Grizzly Encounter (Bozeman)**: Educational facility 10 minutes from Bozeman houses rescued grizzly bears that cannot survive in wild due to human habituation or other issues. Visitors observe Brutus, Bella, and other resident bears at close range while learning about conservation. This represents the only way to safely see grizzlies up close without endangering wild populations through habituation."

  - id: "current-status"
    title: "Conservation Status and Management"
    style: "default"
    paragraphs:
      - "The grizzly bear has been federally listed as threatened in the contiguous United States since 1975 under the Endangered Species Act. Montana's populations demonstrate recovery success, particularly the Northern Continental Divide Ecosystem which has exceeded recovery goals. Federal and state agencies periodically evaluate delisting petitions, though conservation organizations often challenge removals of protection, arguing continued threats from habitat loss, climate change, and mortality risks."
      - "Montana maintains active management programs balancing bear conservation with human safety and economic interests. Montana Fish, Wildlife & Parks works with federal agencies, tribal governments, private landowners, and conservation groups to reduce conflicts, maintain habitat connectivity, and ensure population viability. Education programs teach bear safety, proper food storage, and coexistence strategies to residents and visitors throughout grizzly country."

    subsections:
      - subtitle: "Recovery Successes and Challenges"
        text: "The Northern Continental Divide Ecosystem represents one of North America's greatest conservation success stories. Bears once reduced to perhaps 300-400 individuals in the 1970s have recovered to 1,000+ animals occupying historic range. However, the Cabinet-Yaak population remains critically small with fewer than 50 bears threatened by genetic isolation and low reproductive rates. The Bitterroot Ecosystem, once home to thriving populations, contains fewer than 15 bears despite offering over 5,600 square miles of suitable habitat. Climate change threatens whitebark pine—a crucial high-calorie food source—and alters berry production patterns that bears depend upon for pre-hibernation weight gain."

      - subtitle: "Human-Bear Coexistence"
        text: "Successful grizzly conservation requires human behavior changes as much as bear management. Montana leads coexistence efforts through education, infrastructure improvements, and conflict prevention. Bear-resistant garbage containers, electric fencing for livestock operations, carcass removal programs, range riders monitoring livestock in bear country, and proper food storage in campgrounds all reduce conflicts. Organizations like Montana Wildlife Federation, Vital Ground Foundation, and People and Carnivores work with ranchers and rural communities to implement coexistence measures. The Blackfeet Nation employs range riders and coordinates with federal agencies on bear management across the reservation."

      - subtitle: "Future Outlook"
        text: "Montana's grizzly bears face uncertain future depending on federal protection decisions, habitat security, climate change impacts, and human tolerance. Continued population growth brings more bears into contact with humans, testing coexistence in working landscapes. Highway mitigation—overpasses and underpasses allowing wildlife movement—becomes increasingly important for maintaining connectivity between isolated populations. Montana's commitment to conservation, demonstrated by the 1983 state animal designation and decades of management, suggests the state will remain North America's grizzly stronghold. However, long-term success requires sustained funding, public support, and political will to prioritize wildlife conservation alongside economic development in a state whose scale is clear in [states by population](/rankings/demographics/states-by-population)."

  - id: "symbol-connections"
    title: "Connections to Other Montana Symbols"
    style: "default"
    paragraphs:
      - "The grizzly bear connects meaningfully to Montana's other state symbols, each reinforcing themes of wilderness, natural resources, and frontier character that define the state's identity."

    subsections:
      - subtitle: "State Motto: 'Oro y Plata' (Gold and Silver)"
        text: "Montana's motto means 'Gold and Silver,' reflecting the mineral wealth that drove 19th-century settlement and remains economically important. Grizzly bears inhabit the same mountain ranges where prospectors sought precious metals—the Bob Marshall region, Cabinet Mountains, and areas surrounding Glacier National Park all contain historic mining districts. The bear's presence in these mountains symbolizes that Montana's true treasures extend beyond extractable resources to include irreplaceable wilderness and wildlife. Both the motto and the grizzly acknowledge Montana's mountainous character, though they represent different values—economic exploitation versus ecological preservation."
        link:
          label: "See Montana state motto"
          url: "/states/montana/motto/oro-y-plata"

      - subtitle: "State Nickname: 'Treasure State' and 'Big Sky Country'"
        text: "Montana's nickname 'Treasure State' originated from abundant mining activities in the 1800s but expanded to encompass the state's natural treasures—wilderness, wildlife, pristine landscapes. The grizzly represents these non-extractive treasures, embodying wild Montana in ways gold and silver cannot. The alternate nickname 'Big Sky Country' captures Montana's vast open spaces and low population density—exactly the conditions grizzlies require for survival. The bear needs 'big sky' and everything beneath it: extensive roadless areas, diverse habitats from alpine to prairie, and human tolerance for sharing landscapes with powerful carnivores. Montana's full [state symbols usa](/symbols) profile reflects both traditions, pairing a wilderness-based animal symbol with civic and botanical emblems that span the state's many landscapes."

      - subtitle: "State Tree: Ponderosa Pine"
        text: "The ponderosa pine, designated Montana's state tree in 1949, grows throughout lower elevation forests where grizzlies forage, travel, and den. While grizzlies don't depend directly on ponderosa pines for food (they rely more on whitebark pine nuts at higher elevations), both species represent Montana's forested mountain ecosystems. Ponderosa pine forests provide transitional habitat between prairie and high country, exactly where bears expanding east from the Bob Marshall and Glacier encounter human communities. Both symbols emphasize Montana's identity as a forested mountain state despite extensive prairie regions in the east."
        link:
          label: "See Montana state tree"
          url: "/states/montana/tree/ponderosa-pine"

      - subtitle: "State Flower: Bitterroot"
        text: "The bitterroot, Montana's state flower since 1895, grows in rocky mountain soils from valleys to subalpine zones—grizzly bear habitat throughout its range. Native peoples including the Salish, Kootenai, and Blackfeet gathered bitterroot as an important food source, cooking the roots after careful preparation. Grizzlies also dig and consume various roots including bitterroot, particularly in spring when other foods remain scarce. Both the flower and bear connect to indigenous cultures, traditional knowledge, and sustainable relationships with Montana's mountain ecosystems. The bitterroot's ability to thrive in harsh conditions mirrors the grizzly's resilience and adaptation to challenging environments."
        link:
          label: "See Montana state flower"
          url: "/states/montana/flower/bitterroot"

