seo_title: 'Montana License Plate Slogan: Treasure State and Big Sky Country History'
seo_description: Montana's current standard license plate uses "Treasure State," reintroduced on the 2010 retro base. Earlier Montana plates used "Big Sky Country," "Big Sky," and statehood centennial designs.
hero_image: /images/license-plates/montana/2010-treasure-state.jpg
hero_image_alt: Montana license plate with Treasure State slogan
hero_image_caption: Montana's 2010-present standard plate brought "TREASURE STATE" back to the top of the plate in a retro design.
intro_text: '**"Treasure State"** is the slogan on Montana''s current standard license plate base, introduced in 2010. Montana is also strongly associated with **"Big Sky Country,"** which first appeared on plates in 1967 and returned on the 2006 base. The important correction is that Big Sky Country is not the single current standard slogan: the 2010-present standard plate reintroduced Treasure State, while Montana also lets motorists choose several older-style standard designs.'
quick_answer: 'Montana''s current 2010-present standard plate uses "Treasure State." "Big Sky Country" first appeared on Montana plates in 1967, was shortened to "Big Sky" on the 1976 base, and returned on the 2006 base. Montana now offers several standard designs, including older Big Sky-style bases.'
