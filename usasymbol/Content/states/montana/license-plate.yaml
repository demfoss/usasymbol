sections:
- id: current-plate
  icon: fa-solid fa-car-side
  title: Current Montana Plate
  paragraphs:
  - 'Montana''s current standard plate base dates to 2010 and carries "TREASURE STATE" at the top. The design was intentionally retro, bringing back the state nickname used on mid-century plates.'
  - 'That matters because Montana plate history is easy to misread. "Big Sky Country" is the better-known tourism identity, but the current 2010 base does not use that full phrase. Montana also offers several standard plate choices, including replicas of earlier bases, so drivers may still be seen with Big Sky-style plates.'
  - 'The safest way to describe the present is: Montana''s current 2010 standard base says "Treasure State," while "Big Sky Country" remains a major historic and optional plate identity.'

- id: treasure-state
  icon: fa-solid fa-gem
  title: The Treasure State Era
  paragraphs:
  - '"The Treasure State" refers to Montana''s mineral wealth. Gold, silver, copper, coal, and other resources shaped Montana''s territorial economy and made mining central to the state''s identity.'
  - 'The Montana Motor Vehicle Division''s license plate history identifies 1950 as the first Montana plate with "The Treasure State." Plate-reference tables show the slogan continuing through the mid-1950s, followed by a shorter "TREASURE STATE" version in 1963.'
  - 'When Montana introduced the 2010 retro base, it restored "TREASURE STATE" to the standard plate. That made the official state nickname visible again on the default modern design.'

- id: big-sky-origin
  icon: fa-solid fa-mountain-sun
  title: Big Sky Country
  paragraphs:
  - '"Big Sky Country" traces to A.B. Guthrie Jr.''s 1947 novel "The Big Sky" and to the open-horizon landscape that became central to Montana tourism. The phrase moved from literature and promotion onto license plates in 1967.'
  - 'From 1967 through 1975, Montana standard plates carried "BIG SKY COUNTRY." The 1976 base shortened the wording to "BIG SKY," and later bases kept variations of that identity.'
  - '"Big Sky Country" returned on the 2006 plate base. Even after the 2010 Treasure State base appeared, older Big Sky-style bases continued to matter because Montana made several previous standard designs available as choices.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Montana License Plate Slogans by Era
  paragraphs:
  - Montana's plate slogans move between two identities: the mineral-rich Treasure State and the landscape-focused Big Sky Country.
  versions:
  - name: THE TREASURE STATE
    years: 1950-1956
    image: /images/license-plates/montana/1954-treasure-state.jpg
    description: Montana's first slogan era used "THE TREASURE STATE," referring to the mining wealth behind the official state nickname. The image here is a 1954 example from that run.
  - name: TREASURE STATE
    years: '1963'
    image: /images/license-plates/montana/1963-treasure-state.jpg
    description: The slogan returned without the leading "THE." Same meaning, shorter plate text.
  - name: BIG SKY COUNTRY
    years: 1967-1975
    image: /images/license-plates/montana/1967-big-sky-country.jpg
    description: Montana's famous Big Sky Country slogan debuted on plates in 1967 and ran through 1975.
  - name: BIG SKY
    years: 1976-1991
    image: /images/license-plates/montana/1976-big-sky.png
    description: The 1976 base shortened the slogan to "BIG SKY." This base remained in use into the early 1990s.
  - name: Statehood Centennial
    years: '1987'
    image: /images/license-plates/montana/1987-centennial.jpg
    description: Montana issued a Statehood Centennial design for the 100th anniversary of statehood in 1889. It was a commemorative option, not the main standard slogan sequence.
  - name: Big Sky Country
    years: 2006-2009
    image: /images/license-plates/montana/2006-big-sky-country.jpg
    description: The full "Big Sky Country" phrase returned on the 2006 base after decades of shortened Big Sky wording.
  - name: TREASURE STATE
    years: 2010-present
    image: /images/license-plates/montana/2010-treasure-state.jpg
    description: Montana's 2010-present standard base reintroduced "TREASURE STATE" in a retro design. Several older-style standard bases also remain available as choices.

timeline:
- year: '1950'
  description: Montana first uses "THE TREASURE STATE" on license plates, according to Montana MVD's plate-history page.
- year: '1963'
  description: The shorter "TREASURE STATE" wording appears on Montana plates.
- year: '1967'
  description: '"BIG SKY COUNTRY" debuts on Montana plates and runs through 1975.'
- year: '1976'
  description: Montana shortens the plate slogan to "BIG SKY" on the 1976 base.
- year: '1987'
  description: Montana offers a Statehood Centennial plate for the 100th anniversary of statehood in 1889.
- year: '2006'
  description: '"Big Sky Country" returns on Montana''s standard plate base.'
- year: '2010'
  description: Montana introduces the current retro standard base and reintroduces "TREASURE STATE."
- year: Present
  description: Montana motorists can choose among several standard designs, including the 2010 Treasure State base and older Big Sky-style replicas.

faq:
- question: What is Montana's current license plate slogan?
  answer: Montana's current 2010-present standard plate says "Treasure State." Montana also offers other standard design choices, including older Big Sky-style bases.
- question: When did Montana first use "Treasure State" on plates?
  answer: Montana MVD identifies 1950 as the first year Montana plates used "The Treasure State."
- question: When did Montana first use "Big Sky Country"?
  answer: Montana first used "Big Sky Country" on standard plates in 1967. The slogan ran through 1975 before the 1976 base shortened it to "Big Sky."
- question: Did "Big Sky Country" return?
  answer: Yes. The full "Big Sky Country" phrase returned on the 2006 plate base.
- question: Why is the 2010 Montana plate called retro?
  answer: The 2010 base is retro because it brought back the older "Treasure State" identity and used a simplified vintage-style design.
- question: Was Montana's Statehood Centennial plate a standard plate?
  answer: Montana's 1987 Statehood Centennial plate was a commemorative option for the 100th anniversary of statehood, not the main long-running slogan base.

