seo_title: "Montana State Bird | Western Meadowlark"
seo_description: 'Montana adopted the Western Meadowlark as its state bird in 1931. The key to the page is the word Western: it names the species precisely and turns the bird into a clear marker of Montana''s place in the American West.'
intro_text: Montana's official state bird is the <strong>Western Meadowlark</strong>, adopted in <strong>1931</strong> and now codified in <strong>Mont. Code Ann. Sec. 1-1-504</strong>. The key word is <strong>Western</strong>. It does more than sort one meadowlark from another. It makes the bird sound like it belongs to Montana's part of the country. The legal wording is also precise in a literal sense, since Montana's own bird records treat the Eastern Meadowlark as only accidental in the state. So the symbol names both a real species and a regional identity.
