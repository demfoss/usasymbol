legislation: Mont. Code Ann. Sec. 1-1-504; Ch. 149, Laws of 1931
meaning: 'The key word in Montana''s state bird is Western. It does two jobs at once: it names the specific species and it places the symbol in the part of the country Montana claims as its own.'
