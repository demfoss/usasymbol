sections:
- id: why-does-the-word-western-matter-in-montanas-state-bird
  icon: fa-solid fa-circle-question
  title: Why Does the Word Western Matter in Montana's State Bird?
  paragraphs:
  - The strongest Montana detail is not meadowlark by itself but Western Meadowlark. State law identifies the species directly and adds the scientific name <em>Sturnella neglecta</em>.
  - That wording does symbolic work as well as legal work. Western is a location word. On this page it makes the bird sound less like a generic meadowlark and more like a marker of Montana's part of the country.
  - The precision is also literal. Montana's own field records list the Western Meadowlark as native, while the Eastern Meadowlark is only accidental in the state. So the symbol names the meadowlark that actually belongs in Montana's public landscape.
- id: how-did-the-western-meadowlark-become-official-in-montana
  icon: fa-solid fa-scale-balanced
  title: How Did the Western Meadowlark Become Official in Montana?
  paragraphs:
  - Montana did not arrive at the symbol as a purely legislative invention. The statute says the Western Meadowlark was preferred by a referendum vote of Montana school children before it was formally designated in 1931.
  - Montana ratified a public choice, but it also fixed the symbol on the species that matched the state's own western grass-country identity. The schoolchildren's vote explains how it entered law; the word Western explains why this particular bird fit the state.
faq:
- question: What is Montana's state bird?
  answer: Montana's state bird is the Western Meadowlark.
- question: When did Montana adopt the Western Meadowlark?
  answer: Montana adopted the Western Meadowlark as its official state bird in 1931.
- question: Why does Montana law say Western Meadowlark instead of just meadowlark?
  answer: Because Montana law identifies the specific species, not a generic meadowlark. The word Western also gives the symbol a regional meaning by tying it to Montana's place in the American West.
- question: Did Montana schoolchildren help choose the state bird?
  answer: Yes. The statute says the Western Meadowlark was preferred by a referendum vote of Montana school children before the Legislature made the symbol official in 1931.
- question: What other states share the Western Meadowlark as a state bird?
  answer: Kansas, Nebraska, North Dakota, Oregon, and Wyoming also use the Western Meadowlark as a state bird.
- question: What does the Western Meadowlark mean for Montana?
  answer: It points to Montana's open-country identity in a specific western way. The symbol is not just any meadowlark or any songbird. It names the species that fits the state's own landscape and even sounds like it belongs to the West.
