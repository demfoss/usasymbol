  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Sapphire and Montana Agate Facts"
    facts:
      - "Sapphire and Montana agate were both adopted as Montana's official state gemstones in 1969."
      - "Yogo sapphires are prized in the gem trade for a natural cornflower-blue color that does not require heat treatment, unlike most commercial sapphires."
      - "Montana agate's dark, branching patterns are dendrites of manganese and iron oxide, not fossilized plants, even though they look like moss or ferns."
      - "Montana agate is found only as water-worn pebbles along the Yellowstone River and its tributaries, not as a solid rock outcrop."

