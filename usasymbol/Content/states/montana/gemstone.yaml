faq:
  - question: What are Montana's state gemstones?
    answer: "Montana has two official state gemstones: sapphire and Montana agate, both adopted by the Montana Legislature in 1969."
  - question: When did Montana adopt sapphire and Montana agate as its state gemstones?
    answer: "The Montana Legislature designated both sapphire and Montana agate as official state gemstones in 1969."
  - question: Why did Montana choose sapphire and Montana agate?
    answer: "Sapphire represents Montana's gem mining industry, especially the Yogo Gulch deposit known for natural blue color, while Montana agate reflects the state's long rockhounding tradition along the Yellowstone River."
  - question: Where can you find sapphire and Montana agate in Montana?
    answer: "Yogo Gulch in Judith Basin County is the source of Montana's best-known sapphires. Montana agate is collected along Yellowstone River gravel bars between Billings and Miles City."

