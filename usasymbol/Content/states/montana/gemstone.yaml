intro_text: "Montana's state gemstones are sapphire and Montana agate, both adopted by the Montana Legislature in 1969 to honor two very different stones found within the state, one mined from hard rock at Yogo Gulch, the other picked up as river-worn pebbles along the Yellowstone River. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

