sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Montana State Gemstones
    paragraphs:
      - "Sapphire and Montana agate are Montana's two official state gemstones, both designated by the Montana Legislature in 1969 at the request of the Montana Council of Rock and Mineral Clubs. The two stones could hardly be more different: sapphire is a hard, transparent gem mined from bedrock, while Montana agate is a moss-patterned quartz picked up as loose river pebbles."
      - "Lawmakers recognized both in a single statute rather than choosing one over the other, giving equal standing to Montana's hard-rock gem mining and its long tradition of river rockhounding."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Are Sapphire and Montana Agate?"
    paragraphs:
      - "Sapphire is a variety of the mineral corundum, transparent and hard enough to scratch nearly anything except diamond. Montana's sapphires are unusual for their range of natural, untreated colors, cornflower blue, teal, green, yellow, pink, and orange, rather than one dominant shade."
      - "Montana agate is a variety of chalcedony, a form of quartz, and forms as translucent gray, white, or amber pebbles with dark, fern-like patterns running through them. Those dark patterns are dendrites, branching mineral deposits of manganese and iron oxide that grew inside cracks in the stone, giving the agate its moss-like look rather than the concentric bands typical of most agates."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Montana Chose Sapphire and Montana Agate as Its State Gemstones"
    paragraphs:
      - "Sapphires from Yogo Gulch have been mined since the 1890s and are known in the gem trade for a rich cornflower blue that needs no heat treatment, a rarity among sapphires worldwide. That reputation, plus over a century of mining at Yogo and other Montana deposits, made sapphire an obvious choice to represent the state's gem mining history."
      - "Montana agate carries a different kind of history: generations of families have collected it by walking the gravel bars of the Yellowstone River, and hobbyists across the state have cut and polished it into jewelry for over a century. The 1969 designation, pushed by the state's rockhounding clubs, recognized that popular tradition alongside the more commercial sapphire industry."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Sapphire and Montana Agate Became Montana's State Gemstones"
    paragraphs:
      - "The Montana Council of Rock and Mineral Clubs petitioned the Montana Legislature to name both stones official state gemstones, and lawmakers adopted the designation in 1969 rather than choosing between them."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Sapphire and Montana Agate Are Found in Montana"
    paragraphs:
      - "Yogo Gulch, in the Little Belt Mountains of Judith Basin County, is the source of Montana's most famous sapphires and remains the state's only sapphire deposit mined primarily for gem quality rather than volume. Montana agate is gathered along the Yellowstone River and its gravel bars between Billings and Miles City, where the river has tumbled the stones out of older volcanic gravels."
