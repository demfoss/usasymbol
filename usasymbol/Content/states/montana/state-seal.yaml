intro_text: "Montana's state seal shows the Great Falls of the Missouri River, the Rocky Mountains, a rising sun, a plow, and a crossed pick and shovel beneath the motto 'Oro y Plata' (Spanish for 'Gold and Silver'). The basic design began as a territorial seal in 1865 and was sanctioned as the state seal on March 2, 1893."
