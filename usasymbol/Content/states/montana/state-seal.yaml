name: Great Seal of Montana
adopted_year: 1893
is_official: true
legislation: Montana Code Annotated § 1-1-501
meaning: "The Great Seal of Montana centers on a landscape specific to the state: the Great Falls of the Missouri River, the Rocky Mountains, and a rising sun in the background. A plow and a crossed pick and shovel in the foreground name the two industries that built early Montana. The motto 'Oro y Plata,' Spanish for 'Gold and Silver,' states the economic foundation without allegory."
