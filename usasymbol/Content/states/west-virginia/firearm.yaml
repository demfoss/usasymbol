title: "Hall Model 1819 Flintlock Rifle"
adopted_year: 2013
legislation: "SCR 7"
meaning: "The Hall Model 1819 represents West Virginia's dual heritage of frontier craftsmanship and industrial innovation — the rifle that was manufactured in what would become West Virginia before West Virginia existed, and whose production methods created the modern assembly line."

