intro_text: "West Virginia's state seal shows a farmer and a miner flanking a rock marked 'June 20, 1863,' the date the state entered the Union as the only state admitted during the Civil War. Crossed rifles and a liberty cap on the rock reinforce the motto 'Montani Semper Liberi,' Mountaineers Are Always Free. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
