sections:
- id: history
  icon: fa-solid fa-landmark
  title: West Virginia State Seal History and Origin
  paragraphs:
  - "West Virginia's path to statehood was unlike any other state's. When Virginia voted to secede from the Union in April 1861, the western counties of Virginia refused to follow. Those counties had long differed from eastern Virginia in geography, economy, and culture: they were mountainous, had few large plantations, and depended on small farming and emerging industry rather than slave agriculture."
  - "A series of conventions in 1861 and 1862 established a loyal government for Virginia's western counties. Congress passed the West Virginia Enabling Act, and President Lincoln signed the statehood bill on December 31, 1862, with an effective date of June 20, 1863. West Virginia entered the Union as the 35th state, the only state admitted during the Civil War and the only state formed by breaking away from a Confederate state."
  - "Joseph H. Diss Debar, a West Virginia artist and legislator, designed the Great Seal in 1863. The design recorded the specific circumstances of the state's founding: Civil War admission, a split from Virginia, and an economy built on farming and mineral extraction. The current authoritative description is codified in W. Va. Code §2-2-2."

- id: elements
  icon: fa-solid fa-shapes
  title: What the West Virginia State Seal Symbols Mean
  paragraphs:
  - "The West Virginia state seal organizes its symbols around a central rock. Every figure and object in the design relates directly to the circumstances of the state's 1863 founding."
  elements:
  - id: central-rock
    name: The Rock and Ivy
    image: /images/state-seals/west-virginia/elements/rock.png
    paragraphs:
    - "A large rock occupies the center of the seal, inscribed with the date 'June 20, 1863,' West Virginia's date of admission to the Union. Ivy grows across the rock. In traditional symbolism, ivy represents durability and permanence, marking the new state and the date it carried as things meant to endure."
    - "The rock is not simply a background element. It is the pivot of the design: the farmer stands on one side, the miner on the other, and the rifles and liberty cap rest on its surface. The date carved into its face makes the rock a monument to statehood itself."
  - id: crossed-rifles-liberty-cap
    name: Crossed Rifles and Liberty Cap
    image: /images/state-seals/west-virginia/elements/rifles-cap.png
    paragraphs:
    - "Two crossed rifles rest on the rock above the date. A red Phrygian cap, the traditional liberty cap, sits atop them. The Phrygian cap was a symbol of freedom used by American patriots and French revolutionaries; its presence on a Civil War-era seal signals that West Virginia's statehood was understood as an act of liberation."
    - "The rifles make a more direct statement: the new state was prepared to defend its existence by force. West Virginia's admission came while the Civil War was ongoing, and the men of its counties were actively serving in the Union Army. The crossed rifles on the seal acknowledged that context plainly."
  - id: farmer
    name: The Farmer
    image: /images/state-seals/west-virginia/elements/farmer.png
    paragraphs:
    - "A farmer stands to the right of the rock, representing West Virginia's agricultural economy. The western counties of Virginia had long depended on small-scale farming rather than the plantation agriculture of Virginia's eastern lowlands. The farmer on the seal identifies this economy as a defining feature of the new state."
  - id: miner
    name: The Miner
    image: /images/state-seals/west-virginia/elements/miner.png
    paragraphs:
    - "A miner stands to the left of the rock, holding a pickaxe. West Virginia sits atop some of the largest coal and mineral deposits in the eastern United States, and mining was already an established industry in the region by 1863. The miner on the seal acknowledged this resource and the industry that would define the state's economy through the late 19th and 20th centuries."
  - id: motto-montani-semper-liberi
    name: Montani Semper Liberi
    image: /images/state-seals/west-virginia/elements/motto.png
    paragraphs:
    - "'Montani Semper Liberi' is Latin for 'Mountaineers Are Always Free.' It is West Virginia's official state motto and appears on the seal. The phrase was written by Joseph H. Diss Debar, the seal's designer, and adopted with the seal in 1863."
    - "The motto had a precise meaning in 1863: the mountaineers of western Virginia had chosen the Union over secession. The word 'always' asserted permanence. West Virginia's residents had been free when part of Virginia and free when they broke from it; the motto claimed they would remain so."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the West Virginia State Seal'
  paragraphs:
  - "The West Virginia state seal has retained its composition since 1863. The farmer, the miner, the rock, the rifles, the liberty cap, and the motto have remained constant elements."
  - "What varies across surviving images is the rendering. Nineteenth-century printed obverse and reverse views show different engraving styles, while modern digital versions standardize the linework and color more tightly."
