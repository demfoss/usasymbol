type: State Seal
state: West Virginia
name: Great Seal of the State of West Virginia
adopted_year: 1863
is_official: true
legislation: W. Va. Code §2-2-2
meaning: "The Great Seal of the State of West Virginia was designed to make a specific argument in 1863: that a new state, cut from Virginia during the Civil War, had the right to exist. The farmer and the miner flanking the central rock represent the two pillars of the state's economy. The rock itself, dated June 20, 1863, records the moment of admission. The crossed rifles and liberty cap declare that this statehood was earned and defended."
