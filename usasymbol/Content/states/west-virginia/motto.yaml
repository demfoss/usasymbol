faq:
  - question: "What is West Virginia's state motto?"
    answer: "West Virginia's state motto is \"Montani Semper Liberi,\" a Latin phrase meaning \"Mountaineers Are Always Free.\" The first state legislature adopted it on September 26, 1863."

  - question: "What does \"Montani Semper Liberi\" mean?"
    answer: "It means \"Mountaineers Are Always Free\" in Latin. Montani means mountain people, semper means always, and liberi means free. The phrase expressed the spirit of a state that chose to stay in the Union when Virginia seceded in 1861."

  - question: "What is the English translation of \"Montani Semper Liberi\"?"
    answer: "\"Mountaineers Are Always Free.\" The Latin words break down as: montani (mountaineers), semper (always), liberi (free)."

  - question: "When did West Virginia adopt its state motto?"
    answer: "September 26, 1863 — three months after West Virginia became the 35th state on June 20, 1863. The first state legislature adopted the motto and the Great Seal in the same session."

  - question: "Who created West Virginia's state motto?"
    answer: "Joseph H. Diss Debar, an Alsatian-born artist who lived in Parkersburg and Doddridge County. He proposed the Latin phrase and designed the Great Seal. The legislature adopted both on September 26, 1863."

