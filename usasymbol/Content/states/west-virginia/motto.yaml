seo_title: "West Virginia State Motto | Montani Semper Liberi"
seo_description: "West Virginia's state motto is \"Montani Semper Liberi,\" Latin for \"Mountaineers Are Always Free.\" Adopted in 1863, proposed by Joseph H. Diss Debar."

intro_text: "West Virginia's state motto is <strong>Montani Semper Liberi</strong>, a Latin phrase meaning <em>Mountaineers Are Always Free</em>. The first West Virginia Legislature adopted it on September 26, 1863 — just three months after the state was formed — and it was proposed by Joseph H. Diss Debar, the artist who designed the Great Seal."

