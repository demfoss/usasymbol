faq:
- question: What is West Virginia's state insect?
  answer: "West Virginia's state insect is the European honey bee, adopted by the West Virginia Legislature in 2002."
- question: When did West Virginia adopt the European honey bee?
  answer: "West Virginia adopted the European honey bee as its official state insect in 2002."
- question: Why did West Virginia choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to West Virginia agriculture and pollination."
- question: What does a European honey bee look like?
  answer: "It is a fuzzy, golden-brown and black striped insect that lives in large colonies and produces honey and beeswax."
- question: Is the European honey bee the same as West Virginia's state butterfly?
  answer: "No. West Virginia's state butterfly is the monarch, adopted in 1995. The European honey bee is a separate designation, the state insect, adopted in 2002."

