sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of West Virginia?
  paragraphs:
  - "The European honey bee, Apis mellifera, is West Virginia's official state insect. The West Virginia Legislature designated it in 2002."
  - "It is a separate designation from West Virginia's state butterfly, the monarch, adopted in 1995."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "The European honey bee is a fuzzy, golden-brown and black striped insect that lives in large colonies."
  - "Worker bees collect nectar and pollen from flowers and carry it back to the hive, where the colony produces honey and beeswax."
  - "Each hive has one queen, thousands of worker bees, and a small number of drones, and the bees work together to raise young and defend the colony."

- id: history
  icon: fa-solid fa-landmark
  title: How West Virginia Chose the European Honey Bee
  paragraphs:
  - "The West Virginia Legislature named the European honey bee the official state insect in 2002."
  - "The designation recognizes the value of honey bees to West Virginia agriculture, since bees pollinate a wide range of the state's fruit and vegetable crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted in 2002 by the West Virginia Legislature."
  - "Scientific name: Apis mellifera."
  - "Golden-brown and black striped insect that lives in large hive colonies."
  - "Worker bees gather nectar and pollen and help produce honey and beeswax."
  - "West Virginia also has a separate state butterfly, the monarch, adopted in 1995."




