name_meaning:
  heading: What Does West Virginia Mean?
  paragraphs:
  - "West Virginia's name is literal: it was formed from the western counties of Virginia during the Civil War. It became a separate state in 1863."
  - That origin makes the symbol list unusually direct. The motto Montani Semper Liberi, the Mountain State nickname, the flag's central coat of arms, and the old gold and blue colors all sit inside a statehood story about mountain counties breaking away from Virginia.
  - West Virginia's postal abbreviation is WV, and residents are West Virginians. The state name keeps the older Virginia connection visible even while the symbols emphasize separation and mountain identity.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named as the western part of Virginia that became a separate state.
    - label: Statehood
      text: West Virginia entered the Union in 1863 during the Civil War.
    - label: Motto
      text: Montani Semper Liberi means Mountaineers Are Always Free.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to the Appalachian state formed from western Virginia counties.
    - label: People
      text: People from West Virginia are called West Virginians.
    - label: Landscape
      text: Mountain terrain shapes the nickname, motto, wildlife symbols, and forest symbols.
  - heading: Nicknames and Short Forms
    items:
    - label: The Mountain State
      text: West Virginia's common nickname, tied to the Appalachian Mountains across the state.
    - label: Abbreviation
      text: WV; older short form W.Va.
editorial:
  heading: What West Virginia's Symbols Say About the State
  paragraphs:
  - The [motto](/states/west-virginia/motto) and [Mountain State nickname](/states/west-virginia/nickname) do most of the interpretive work. West Virginia's public identity is not just scenic mountain language; it is bound to the state's Civil War formation.
  - The [rhododendron](/states/west-virginia/flower), [sugar maple](/states/west-virginia/tree), and [black bear](/states/west-virginia/mammal/black-bear) keep the page in Appalachian forests instead of generic state symbolism.
  - The [Hall Model 1819 Flintlock Rifle](/states/west-virginia/firearm) adds a sharp Harpers Ferry note. It points to manufacturing history from a place that became West Virginia only decades after the rifle's adoption by the U.S. military.
faq:
- question: What is West Virginia's most famous state symbol?
  answer: The [Mountain State nickname](/states/west-virginia/nickname) is the most recognizable shorthand because the Appalachian Mountains shape the whole state.
- question: What is West Virginia's state bird?
  answer: West Virginia's state bird is the [Northern Cardinal](/states/west-virginia/bird), approved by legislative resolution in 1949.
- question: What is West Virginia's state flower?
  answer: West Virginia's state flower is the [rhododendron](/states/west-virginia/flower), adopted in 1903.
- question: What does Montani Semper Liberi mean?
  answer: "[Montani Semper Liberi](/states/west-virginia/motto) means Mountaineers Are Always Free, a motto adopted at statehood in 1863."
- question: How many official state symbols does West Virginia have?
  answer: West Virginia's state symbols list here includes the flag, cardinal, rhododendron, sugar maple, Montani Semper Liberi motto, Mountain State nickname, colors, firearm, and black bear.
