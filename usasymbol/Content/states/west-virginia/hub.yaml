seo_description: "West Virginia state symbols: official state symbols include the rhododendron, cardinal, sugar maple, black bear, Montani Semper Liberi motto, and Mountain State nickname."
snippet_answer: West Virginia's Montani Semper Liberi motto — Mountaineers Are Always Free — is the most widely known of the state's official state symbols and the source of the Mountain State identity. The rhododendron, cardinal, sugar maple, black bear, and old gold and blue colors round out a list rooted in Appalachian ridges and Civil War-era statehood.
