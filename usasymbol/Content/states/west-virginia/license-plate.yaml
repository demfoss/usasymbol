sections:
- id: current-standard-plate
  icon: fa-solid fa-id-card
  title: Current Standard Plate
  paragraphs:
  - West Virginia changed the layout of its standard Class A motor vehicle plate beginning in July 2023 so it could accommodate a seventh character. The state DMV explains that the first digit still reflects the month of issuance.
  - The 2023 change was a layout and serial-format update, not a slogan replacement. The plate still uses "Wild, Wonderful," continuing the phrase that first appeared on standard West Virginia passenger plates in 1976.
  - The earlier 1995 base is important historically, but it is no longer the full current-series description. The current article should identify July 2023 as the current layout while noting that the slogan itself is much older.

- id: wild-wonderful
  icon: fa-solid fa-mountain-sun
  title: What "Wild, Wonderful" Means
  paragraphs:
  - '"Wild, Wonderful" is a tourism-facing phrase built around West Virginia''s Appalachian landscape: forests, rivers, ridges, and mountain roads. It is distinct from the state nickname, "The Mountain State," but the two work together.'
  - The slogan replaced "MOUNTAIN STATE" in 1976. That shift moved the plate from a straightforward geographic nickname to a more promotional phrase.
  - '"Almost Heaven" is strongly associated with West Virginia tourism and the John Denver song, but it is not the standard license plate slogan in this chronology. The standard plate slogan remains "Wild, Wonderful."'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: West Virginia License Plate Slogans by Era
  paragraphs:
  - West Virginia's passenger plate slogan history runs from centennial commemoration to nickname language and then to the long-running tourism slogan.
  versions:
  - name: Statehood Centennial
    years: 1963-1964
    image: /images/license-plates/west-virginia/1963-centennial.jpg
    description: Centennial plates commemorated West Virginia's 1863 admission to the Union. The 1964 issue used a reversed color scheme.
  - name: MOUNTAIN STATE
    years: 1965-1975
    image: /images/license-plates/west-virginia/1965-mountain-state.jpg
    description: The state nickname appeared as the standard slogan. Annual/revalidated formats changed across the period, but "MOUNTAIN STATE" remained the slogan through 1975.
  - name: Wild, Wonderful
    years: 1976-1994
    image: /images/license-plates/west-virginia/1976-wild-wonderful.jpg
    description: West Virginia introduced "Wild, Wonderful" on the white plate with a yellow state outline and blue top slogan bar. This was also the era when staggered/month-coded registration was introduced.
  - name: Wild, Wonderful
    years: 1995-June 2023
    image: /images/license-plates/west-virginia/1995-wild-wonderful-callwva.jpg
    description: Blue-and-gold standard base with "Wild, Wonderful." The URL "www.callwva.com" appeared on the base from 2002 until early 2006, then was removed.
  - name: Wild, Wonderful
    years: July 2023-present
    image: /images/license-plates/west-virginia/2023-current-wild-wonderful.png
    description: Current standard Class A layout with room for a seventh character. The first digit continues to indicate month of issuance.

- id: corrected-dates
  icon: fa-solid fa-clock-rotate-left
  title: Date Corrections
  paragraphs:
  - Saying the "current base" began in 1995 is now outdated. The slogan continued, but West Virginia updated the standard Class A plate layout in July 2023.
  - '"MOUNTAIN STATE" should run through 1975, not just six years. It appeared from 1965 through the 1970-1975 reflective yellow base.'
  - The 2002-2006 website note belongs to the 1995 base period, not to the slogan's start or current status.

timeline:
- year: '1863'
  description: West Virginia enters the Union on June 20 during the Civil War.
- year: '1963'
  description: West Virginia issues Statehood Centennial plates for the 100th anniversary of statehood.
- year: '1964'
  description: The Centennial plate continues with a reversed color scheme.
- year: '1965'
  description: '"MOUNTAIN STATE" appears as the standard passenger plate slogan.'
- year: '1970'
  description: West Virginia introduces the reflective yellow Mountain State base used through 1975.
- year: '1976'
  description: '"Wild, Wonderful" debuts on standard passenger plates.'
- year: '1995'
  description: A new blue-and-gold standard base continues the "Wild, Wonderful" slogan.
- year: '2002'
  description: The tourism URL "www.callwva.com" is added to the standard base.
- year: '2006'
  description: The URL is removed; "Wild, Wonderful" remains.
- year: '2023'
  description: Beginning in July, West Virginia updates the standard Class A layout to allow a seventh character while keeping the slogan.

faq:
- question: What is West Virginia's license plate slogan?
  answer: West Virginia's current standard license plate slogan is "Wild, Wonderful."
- question: When did Wild, Wonderful first appear on West Virginia plates?
  answer: '"Wild, Wonderful" first appeared on standard West Virginia passenger plates in 1976.'
- question: What was West Virginia's license plate slogan before Wild, Wonderful?
  answer: The previous standard slogan was "MOUNTAIN STATE," used from 1965 through 1975.
- question: What changed on West Virginia plates in July 2023?
  answer: West Virginia changed the standard Class A plate layout to accommodate a seventh character. The first digit still reflects the month of issuance, and the slogan remains "Wild, Wonderful."
- question: Is Almost Heaven the West Virginia license plate slogan?
  answer: No. "Almost Heaven" is a famous West Virginia tourism phrase, but the standard license plate slogan remains "Wild, Wonderful."
- question: Did West Virginia put a website on its plate?
  answer: Yes. The URL "www.callwva.com" appeared on the standard base beginning in 2002 and was removed in early 2006.

