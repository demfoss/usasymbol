seo_title: "West Virginia State Reptile | Timber Rattlesnake"
seo_description: "West Virginia's state reptile is the timber rattlesnake, adopted in 2008. Learn what it looks like and why it became official."
hero_image: /images/reptiles/west-virginia/west-virginia-state-reptile-hero.webp
hero_image_alt: "A timber rattlesnake with dark banding coiled on a rocky mountain ledge."
hero_image_caption: "The timber rattlesnake, West Virginia's state reptile, lives in the state's forested mountains."
intro_text: "West Virginia's state reptile is the timber rattlesnake, a large venomous snake found in the state's Appalachian forests, adopted in 2008. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of West Virginia?
    paragraphs:
      - "The timber rattlesnake is West Virginia's official state reptile, designated by the West Virginia Legislature in 2008. Its scientific name is Crotalus horridus."
      - "It is a large venomous snake found throughout the forested mountains and ridges of West Virginia."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Timber Rattlesnake
    paragraphs:
      - "The timber rattlesnake has a heavy body patterned with dark, jagged crossbands over a yellow, brown, or gray background, and it can grow up to about 5 feet long."
      - "It has a segmented rattle at the tip of its tail, which it shakes as a warning when it feels threatened."
      - "It spends much of the year in rocky, forested terrain, often near ledges and dens on wooded mountainsides."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The West Virginia Legislature designated the timber rattlesnake the official state reptile in 2008, recognizing a species long associated with the state's mountain forests."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why West Virginia Chose the Timber Rattlesnake
    paragraphs:
      - "The timber rattlesnake has deep roots in early American symbolism, appearing on Revolutionary War flags such as the Gadsden flag dating to 1775, and it remains closely tied to West Virginia's forested mountain identity."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Timber Rattlesnake
    paragraphs:
      - "Timber rattlesnakes live in forested, rocky terrain throughout the Appalachian Mountains of West Virginia, including areas of the Monongahela National Forest."
    sites:
      - name: Monongahela National Forest
        city: Elkins
        lat: 38.93
        lng: -79.85
        note: "Forested mountain habitat for the species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Timber Rattlesnake Facts
    facts:
      - "Adopted in 2008 by the West Virginia Legislature."
      - "Has dark, jagged crossbands and a segmented tail rattle."
      - "Can grow up to about 5 feet long."
      - "Appeared as a symbol on early American flags dating to 1775."
      - "Found in rocky, forested mountain terrain across West Virginia."

