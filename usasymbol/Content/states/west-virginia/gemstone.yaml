faq:
  - question: What is West Virginia's state gem?
    answer: "West Virginia's state gem is Lithostrotionella, a fossilized colonial coral preserved in silica, adopted in 1990."
  - question: When did West Virginia adopt Lithostrotionella as its state gem?
    answer: "The West Virginia Legislature named Lithostrotionella the state gem on March 10, 1990."
  - question: Why did West Virginia choose Lithostrotionella?
    answer: "The fossil coral is found only in the Hillsdale Limestone of Greenbrier and Pocahontas counties, giving lawmakers a gem-like symbol unique to the state's own rock layers."
  - question: Is Lithostrotionella a true gemstone?
    answer: "Not in the traditional sense. It is a fossil coral whose original calcite skeleton was replaced by silica, which is why it takes a polish similar to a true gemstone."

