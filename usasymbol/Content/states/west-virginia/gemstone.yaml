        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Lithostrotionella Facts"
    facts:
      - "Adopted as West Virginia's state gem in 1990."
      - "Lithostrotionella fossils are about 340 million years old, dating to the Mississippian period."
      - "The fossil coral is found only in the Hillsdale Limestone of Greenbrier and Pocahontas counties."
      - "Silica replaced the coral's original calcite skeleton, preserving its structure as chalcedony."

