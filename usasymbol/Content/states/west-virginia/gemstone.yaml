intro_text: "West Virginia's state gem is Lithostrotionella, a colonial coral fossil from an ancient sea, adopted in 1990 and found today preserved in silica within the Hillsdale Limestone of Greenbrier and Pocahontas counties. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: West Virginia State Gem
    paragraphs:
      - "Lithostrotionella is West Virginia's official state gem, designated by the state legislature in 1990. It is not a mineral gem in the usual sense. The material is the fossilized remains of a colonial coral that lived in a shallow sea covering the region about 340 million years ago, later replaced by silica."
      - "State lawmakers chose a fossil rather than a traditional gemstone to point to a distinctly West Virginia layer of rock, the Hillsdale Limestone, that formed long before the Appalachian Mountains rose."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Lithostrotionella?"
    paragraphs:
      - "Lithostrotionella was a colonial coral, meaning many individual coral animals grew together in a single structure, each leaving behind a small tube-shaped skeleton packed tightly against its neighbors. Cut and polished cross-sections show a honeycomb-like pattern of small circular cells, each with fine radiating lines inside."
      - "The original coral skeleton, made of calcite, was slowly replaced by silica after burial, a process called silicification that preserved the coral's structure in the harder mineral chalcedony. Specimens range from light to dark bluish gray, and some show pink or red coloring from trace iron or manganese."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why West Virginia Chose Lithostrotionella as Its State Gem"
    paragraphs:
      - "Lithostrotionella fossils occur in the Hillsdale Limestone, a rock layer found only in parts of Greenbrier and Pocahontas counties, which makes the fossil a genuinely local emblem rather than a material also claimed by several other states. The coral records a period when a warm, shallow sea covered what is now West Virginia, long before the Appalachian Mountains formed."
      - "Because true gem minerals are scarce in West Virginia's sedimentary rock, lawmakers turned to a fossil with the polish and pattern of a gemstone instead. The designation gave collectors and rockhounds in the state a symbol tied to a specific, well-documented rock formation."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Lithostrotionella Became West Virginia's State Gem"
    paragraphs:
      - "The West Virginia Legislature named the silicified fossil coral Lithostrotionella the official state gem on March 10, 1990."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Lithostrotionella Is Found in West Virginia"
    paragraphs:
      - "Lithostrotionella occurs in the Hillsdale Limestone of the Greenbrier Group, a rock layer exposed in parts of Greenbrier and Pocahontas counties in southeastern West Virginia. Collectors have historically found weathered pieces in fields and streambeds where the limestone is exposed near Lewisburg and surrounding communities."
    sites:
      - name: Hillsdale Limestone (Greenbrier Group)
        city: Lewisburg
        lat: 37.8018
