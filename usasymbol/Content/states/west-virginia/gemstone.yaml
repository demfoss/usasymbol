seo_title: "West Virginia State Gem | Lithostrotionella"
seo_description: "West Virginia's state gem is Lithostrotionella, a 340-million-year-old fossil coral adopted in 1990 and found in the Hillsdale Limestone."
hero_image: /images/gemstones/west-virginia/west-virginia-state-gemstone-hero.webp
