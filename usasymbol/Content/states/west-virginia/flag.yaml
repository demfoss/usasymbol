seo_title: "West Virginia State Flag | Meaning & Symbols"
seo_description: "West Virginia's flag shows a farmer and miner beneath rhododendron, tying statehood to industry and Civil War split."

intro_text: "West Virginia adopted its state flag on February 24, 1905, featuring a white field with a blue border. The state coat of arms sits in the center surrounded by rhododendron branches. The motto Montani Semper Liberi appears below, and the design is part of the broader [list of U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the West Virginia State Flag Is Designed"
    paragraphs:
      - "The West Virginia state flag is the official civic flag of the state of West Virginia. A pure white field forms the background. A blue stripe borders the flag on all four sides. The state coat of arms sits in the center with rhododendron branches below."
      - "An unfurled red ribbon with the words State of West Virginia tops the coat of arms. Another red ribbon below displays the Latin motto Montani Semper Liberi. The Legislature adopted the current design on March 7, 1929, aligning the flag with [West Virginia's official motto page](/states/west-virginia/motto/montani-semper-liberi)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the West Virginia Flag Communicates"
    paragraphs:
      - "The West Virginia state flag meaning comes from symbols depicting West Virginia's Civil War origins and industrial heritage. The design reflects West Virginia's separation from Virginia during the Civil War."
      - "The white field symbolizes purity. The blue border represents the Union. The coat of arms shows agriculture and industry as the state's principal resources. The crossed rifles illustrate the importance of West Virginia's fight for liberty as the 35th state, while the natural imagery ties closely to [West Virginia's state tree](/states/west-virginia/tree/sugar-maple)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "West Virginia Flag History and Adoption"
    paragraphs:
      - "West Virginia became a state on June 20, 1863. The Legislature commissioned Joseph H. Diss Debar to design the Great Seal in 1863. The state officially adopted the seal on September 26, 1863. No official state flag existed until 1905."
      - "The need for a state flag arose in 1904. The West Virginia State Commission attended the Louisiana Purchase Exposition in St. Louis. The commission designed a flag with mountain laurel on a white field with a blue border. The Legislature adopted this design with a red fringe on February 24, 1905."
      - "The 1905 flag proved impractical. The coat of arms on the reverse showed through the white field. Lettering on one side read toward the staff. The Legislature amended the flag on February 25, 1907. The new design placed the coat of arms on the front with a State of West Virginia banner. The rhododendron moved to the reverse. The fringe changed from red to old gold."
      - "The 1907 flag was costly to reproduce due to different designs on each side. The state needed an inexpensive flag for public schools. The Legislature adopted the current single-sided design on March 7, 1929. The new flag integrated the coat of arms and rhododendron on both sides."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the West Virginia Flag"
    versions:
      - name: "First Official Flag"
        years: "1905–1907"
        image: "versions/first-1905.webp"
        description: "White field with blue border and red fringe, featuring rhododendron on the obverse and coat of arms on the reverse."

      - name: "Second Official Flag"
        years: "1907–1929"
        image: "versions/second-1907.webp"
        description: "Coat of arms on obverse with State of West Virginia banner, rhododendron on reverse, gold fringe."

      - name: "Current State Flag"
        years: "1929–present"
        image: "versions/current-1929.webp"
        description: "Coat of arms in center with rhododendron wreath, State of West Virginia banner above, single-sided design."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the West Virginia Flag"
    symbols:
      - id: coat-of-arms
        name: "West Virginia State Flag Coat of Arms"
        image: "symbols/coat-of-arms.svg"
        paragraphs:
          - "The state coat of arms dominates the center of the flag. Joseph H. Diss Debar designed it in 1863. The coat of arms shows the principal pursuits and resources of West Virginia."
          - "An ivy-draped boulder sits at the center inscribed June 20, 1863. This date marks West Virginia's admission to the Union. Two men stand on either side representing agriculture and industry."

      - id: crossed-rifles
        name: "West Virginia State Flag Crossed Rifles"
        image: "symbols/crossed-rifles.svg"
        paragraphs:
          - "Two crossed hunting rifles lie in front of the boulder. A Phrygian cap sits between them. These elements illustrate the importance of the state's fight for liberty during the Civil War."
          - "West Virginia is the only U.S. state flag showing crossing rifles. The rifles represent the state's determination to break from Virginia and join the Union."

      - id: farmer
        name: "West Virginia State Flag Farmer"
        image: "symbols/farmer.svg"
        paragraphs:
          - "A farmer stands on the left side of the boulder. He holds an ax and plow. A cornstalk and wheat sheaf appear before him."
          - "The farmer represents agriculture as one of West Virginia's principal pursuits. His tools and crops show the state's farming heritage."

      - id: miner
        name: "West Virginia State Flag Miner"
        image: "symbols/miner.svg"
        paragraphs:
          - "A miner stands on the right side of the boulder. He holds a pickaxe. Two barrels, an anvil, and a sledge hammer appear behind him."
          - "The miner represents industry and West Virginia's mining heritage. His tools symbolize the state's coal and manufacturing sectors."

      - id: rhododendron
        name: "West Virginia State Flag Rhododendron"
        image: "symbols/rhododendron.svg"
        paragraphs:
          - "Rhododendron maximum branches wreath the lower half of the coat of arms. Two tethered swags connect below the shield. Rhododendron maximum is the state flower; see [West Virginia's flower profile](/states/west-virginia/flower/rhododendron)."
          - "The rhododendron was added to the flag design in 1929. It replaced the separate reverse-side design used from 1907 to 1929."

      - id: motto
        name: "West Virginia State Flag Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "The Latin motto Montani Semper Liberi appears on a tied red ribbon below the coat of arms. The phrase means Mountaineers are always free in English and directly connects to [the Mountain State nickname](/states/west-virginia/nickname/the-mountain-state)."
          - "The motto reflects West Virginia's identity and its fight for independence from Virginia during the Civil War."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "West Virginia State Flag Colors"
    paragraphs:
      - "The West Virginia state flag uses white and blue as primary colors. The coat of arms contains additional colors including red, green, gold, and flesh tones."
    colors:
