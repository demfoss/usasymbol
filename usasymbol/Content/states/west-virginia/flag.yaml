  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "West Virginia State Flag Facts"
    facts:
      - "West Virginia adopted its first state flag on February 24, 1905"
      - "The current flag design was adopted on March 7, 1929"
      - "West Virginia is the only state flag showing crossed rifles"
      - "Joseph H. Diss Debar designed the state coat of arms in 1863"
      - "The flag was changed in 1907 and 1929 for cost reasons"
      - "A pledge to the state flag was adopted in 1977"

faq:
  - question: "What design is recognized as the state flag of West Virginia?"
    answer: "The West Virginia state flag is the official banner of West Virginia, featuring the state coat of arms surrounded by rhododendron on a white field with a blue border."

  - question: "What does West Virginia's flag look like?"
    answer: "The flag shows a white background with a blue border. The state coat of arms sits in the center with rhododendron branches below. Red ribbons display State of West Virginia above and Montani Semper Liberi below."

  - question: "When did West Virginia adopt its current state flag?"
    answer: "The flag displays the state coat of arms showing a farmer and miner, crossed rifles, a boulder dated June 20, 1863, and rhododendron branches."

  - question: "Which person or group shaped the current West Virginia flag?"
    answer: "Joseph H. Diss Debar designed the state coat of arms in 1863 that appears on the flag. The flag design was created by the State Commission in 1905 and revised in 1929."

  - question: "How would you describe the design of the West Virginia state flag?"
    answer: "West Virginia adopted its first state flag on February 24, 1905. The current design was adopted on March 7, 1929."

  - question: "What are the main visual elements on West Virginia's flag?"
    answer: "West Virginia's flag shows a white field with coat of arms featuring a farmer and miner. Virginia's flag shows a blue field with Virtus standing over Tyranny. The designs reflect each state's different history."

