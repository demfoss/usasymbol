intro_text: West Virginia's state fish is the brook trout, a small and colorful fish of cold mountain streams, adopted in 1973. It is the only trout native to West Virginia. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of West Virginia?
  paragraphs:
  - The brook trout is the official state fish of West Virginia. The West Virginia Legislature adopted it in 1973. Its scientific name is Salvelinus fontinalis.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout has a dark green back covered with lighter, worm-shaped markings. Its sides are bluish and sprinkled with yellow spots and some red ones.
  - Its belly is pink to scarlet, and males usually have the reddest bellies. The easiest way to spot one is by its lower fins, which are orange-red with a bright white stripe along the front edge.
  - In West Virginia's small native streams, most brook trout are only five to six inches long and rarely grow past 10 inches.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The brook trout won a poll of West Virginia anglers, beating the smallmouth bass, largemouth bass, muskellunge, and bluegill.
  - The West Virginia Legislature then made the brook trout the official state fish during its 1973 session.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why West Virginia Chose the Brook Trout
  paragraphs:
  - The brook trout is the only trout species native to West Virginia. Anglers also seek it out because it fights hard for its size.
  - State biologists point to its beauty and its status as the state's only native trout as reasons it was a natural choice.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Native brook trout live only in the coldest and cleanest mountain streams. These streams are usually less than 15 feet wide, shaded by trees, and full of pools.
  - Many headwater streams of the Cheat, Greenbrier, Elk, Potomac, and Tygart rivers have good brook trout populations. Some of the best fishing is in the high Allegheny Highlands.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Adopted in 1973 by the West Virginia Legislature.
  - Scientific name is Salvelinus fontinalis.
  - It is the only trout native to West Virginia.
  - Native brook trout in West Virginia average five to six inches long.
  - Brook trout are native to eastern North America, from northern Georgia to Nova Scotia.
faq:
- question: What is West Virginia's state fish?
  answer: West Virginia's state fish is the brook trout. It is a small, colorful trout that lives in cold mountain streams.
- question: When did West Virginia adopt the Brook trout?
  answer: The West Virginia Legislature adopted the brook trout as the official state fish in 1973.
- question: Why did West Virginia choose the Brook trout?
  answer: It is the only trout native to West Virginia, and it won a poll of the state's anglers. People also admire it for its bright colors and hard fight.
- question: Is the brook trout the only trout native to West Virginia?
  answer: Yes. Rainbow trout and brown trout also live in some West Virginia streams, but the brook trout is the only native trout.
- question: How can you recognize a brook trout?
  answer: Look at its lower fins. They are orange-red with a bright white stripe on the front edge. It also has pale wavy markings on a dark green back.
