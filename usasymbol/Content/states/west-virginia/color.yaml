sections:
  - id: "official-designation"
    title: "West Virginia State Colors History"
    style: "default"
    paragraphs:
      - "The West Virginia Legislature made old gold and blue the official state colors in 1895 under Joint Resolution No. 8. That was just 32 years after the state was formed."
      - "West Virginia University had adopted the colors first, and the state followed its lead."
  - id: "symbolism"
    title: "What West Virginia State Colors Mean"
    style: "highlight"
    paragraphs:
      - "Old gold is a rich, deep amber-gold, distinct from standard gold. The pairing represents the mineral and agricultural wealth of the Mountain State and the blue of its Appalachian skies."
      - "The university specifies Old Gold as PMS 7549 and Blue as PMS 282."
  - id: "state-emblems"
    title: "Where West Virginia Colors Appear"
    style: "default"
    paragraphs:
      - "Old gold and blue appear on the West Virginia state flag, in university materials and in West Virginia University athletics. They also mark state agency insignia and official state communications."
