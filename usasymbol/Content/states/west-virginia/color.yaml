seo_title: "West Virginia State Colors | Old Gold Blue"
seo_description: "West Virginia state colors are Old Gold and Blue, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of West Virginia are **Old Gold** and **Blue**, formally designated by the West Virginia Legislature in 1895 under Joint Resolution No. 8. Designated just 32 years after West Virginia became the only state formed by seceding from a Confederate state, old gold and blue appear on [the West Virginia state flag](/states/west-virginia/flag/west-virginia-state-flag), university materials, and state branding. The specifications below list HEX, RGB, CMYK, and Pantone values for West Virginia color matching."

official_colors: "Old Gold and Blue"
official_since: "1895 (Joint Resolution No. 8)"
primary_use: "State government branding, West Virginia University athletics, state agency insignia, official state communications"
known_for: "Old gold — a rich, deep amber-gold distinct from standard gold — adopted originally by West Virginia University and made official state colors in 1895; the pairing represents the mineral and agricultural wealth of the Mountain State and the blue of its Appalachian skies"

color_data:
  - name: "Old Gold"
    hex: "#EAAA00"
    rgb: "234, 170, 0"
    cmyk: "0, 27, 100, 8"
    pantone: "PMS 7549"
    symbolism: "Represents the mineral wealth of West Virginia's coalfields — the Mountain State holds the largest coal reserves east of the Mississippi River and has been the nation's leading underground coal producer for over a century — and the agricultural abundance of the mountain valleys where corn, tobacco, and livestock production have sustained West Virginia's rural economy since statehood; old gold, with its deeper and warmer amber tone compared to standard flag gold, also evokes the autumnal forest colors of West Virginia's Appalachian hardwood canopy, one of the most species-diverse temperate forests in the world"
  - name: "Blue"
    hex: "#002D62"
    rgb: "0, 45, 98"
    cmyk: "100, 54, 0, 62"
    pantone: "PMS 282"
    symbolism: "Represents the clear blue skies visible from the ridgetops of the Allegheny and Appalachian ranges that define West Virginia's landscape, and the rivers — the Ohio, the Kanawha, the Monongahela, the New, and the Greenbrier — that carved the mountain terrain and served as the arteries of West Virginia's industrial and settlement history; blue also reflects West Virginia's identity as the only state created during and because of the Civil War, born out of loyalty to the Union in 1863 and associated with the Union Army's blue uniform that distinguished the Mountain State's founders"

sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "West Virginia officially designated old gold and blue as the state colors in 1895 under Joint Resolution No. 8, making the Mountain State one of the earlier states to codify its color tradition by formal legislative action in the late nineteenth century. The 1895 designation followed a pattern established by the colors' origin at West Virginia University, which had adopted old gold and blue as its official institutional colors in the years following the university's founding in 1867. The Legislature's decision to make the university's colors official state colors reflected WVU's already substantial cultural footprint across the young state, which had only achieved statehood thirty-two years earlier in 1863, as reflected in [West Virginia's state motto history](/states/west-virginia/motto/montani-semper-liberi)."
      - "The Joint Resolution No. 8 of 1895 was one of the more consequential acts in West Virginia's early legislative history, not because of its legal significance but because it formalized a color tradition that would prove durable over the following 130 years. West Virginia University's Mountaineers, competing in old gold and blue uniforms across NCAA athletics, have maintained continuous national visibility for the state's colors through football, basketball, and other major sports programs. The university's colors are among the most recognized in Big 12 athletics and carry the full weight of the Mountain State's official color designation into every national sporting context, similar to [the public imagery of the state flag](/states/west-virginia/flag/west-virginia-state-flag)."
    subsections:
      - subtitle: "Joint Resolution No. 8 (1895)"
        text: "Joint Resolution No. 8 formally adopted old gold and blue as the official colors of the State of West Virginia, acknowledging the colors' established status through West Virginia University without specifying exact Pantone or HEX values — a common limitation of nineteenth-century color legislation that predated modern color standardization systems. West Virginia University has since standardized the colors as PMS 7549 (Old Gold) and PMS 282 (Blue) in its official brand identity guidelines, and these specifications serve as the de facto standard for state government applications as well."
      - subtitle: "West Virginia University and the 1867 Color Tradition"
        text: "West Virginia University, founded in Morgantown in 1867, four years after West Virginia's statehood, adopted old gold and blue as its official colors in the institution's early years. The choice of old gold — a richer, more amber-toned gold than the brighter yellows used by many other institutions — distinguished WVU's palette from competitors and created a color tradition that would prove unusually durable. By the time the Legislature adopted the colors as official state colors in 1895, WVU had already established 28 years of institutional use of the old gold and blue, making the legislative act a formal acknowledgment of an existing cultural reality rather than the creation of a new one."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Old gold and blue in West Virginia carry a depth of meaning that reflects the state's unique origin story, its notable natural resource heritage, and the Appalachian cultural identity that distinguishes West Virginia from every other state in the Union. West Virginia is the only state created by seceding from another state during the Civil War — breaking away from Virginia in 1863 when western Virginia's counties refused to follow the Confederate cause. This origin in loyalty to the Union gives blue a special resonance in West Virginia: the color of the Union Army, the color of the federal government that recognized West Virginia's statehood, and the color that distinguished the Mountain State's founders from their Confederate Virginia counterparts, which also informs [the Mountain State nickname](/states/west-virginia/nickname/the-mountain-state)."
    subsections:
      - subtitle: "Old Gold: Coal, Minerals, and Mountain Harvest"
        text: "West Virginia's old gold speaks directly to the mineral wealth that has defined the state's economy and landscape more than any other single factor. West Virginia contains the largest bituminous coal reserves east of the Mississippi River and has been the dominant underground coal-producing state in the nation for over a century. The coal seams of the Appalachian coalfields — running through Mingo, McDowell, Logan, Boone, Raleigh, and Wyoming counties — produce the black gold that built West Virginia's industrial economy, but it is the amber-gold of economic wealth and natural richness that the color represents symbolically in the state colors. Old gold's warm, deep tone also evokes the notably diverse hardwood forest of West Virginia's mountains — one of the most biodiverse temperate forests in North America — whose autumn palette of oak, maple, and hickory creates one of the Appalachian region's most spectacular seasonal color displays."
      - subtitle: "Blue: Union Loyalty, Waterways, and Mountain Sky"
        text: "Blue in West Virginia's color tradition carries the unique historical weight of the state's Civil War origin. When Virginia seceded from the Union in April 1861, the largely non-slaveholding counties of western Virginia refused to follow, eventually organizing a loyal state government and petitioning Congress for admission to the Union as a separate state. West Virginia was admitted on June 20, 1863 — the only state admitted during the Civil War and the only state in American history created by seceding from a Confederate state. The blue of the Union Army's uniforms worn by West Virginia soldiers who fought for the state's very existence gives the color a foundational significance in West Virginia's identity that no other state's blue can match. Blue also represents West Virginia's river heritage: the Ohio, Kanawha, Monongahela, New, and Greenbrier Rivers that carved the Mountain State's terrain and served as the pathways of settlement, industry, and commerce."

  - id: "state-emblems"
    title: "Usage in State Emblems, Athletics, and Civic Identity"
    style: "default"
    paragraphs:
      - "Old gold and blue appear across West Virginia's official and civic landscape through both the formal designation of 1895 and the overwhelming cultural presence of West Virginia University's Mountaineers. WVU athletics — particularly football at Mountaineer Field at Milan Puskar Stadium in Morgantown, one of the most passionate college football environments in the Big 12 — give old gold and blue their highest national visibility, with games broadcast to a national audience showing the distinctively warm-toned gold and deep navy of the Mountain State's official colors. West Virginia state government branding, the Governor's official communications, and state agency materials reference the official color designation in maintaining the old gold and blue palette. The West Virginia Division of Tourism uses the colors in marketing campaigns emphasizing the state's outdoor recreation economy — white water rafting on the New River Gorge, skiing at Snowshoe Mountain, and hiking in the Monongahela National Forest — that generates over $4 billion annually for the Mountain State and complements natural symbols such as [the Sugar Maple state tree](/states/west-virginia/tree/sugar-maple)."

