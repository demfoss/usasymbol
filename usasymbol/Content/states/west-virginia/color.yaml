expert_quote:
  text: "West Virginia is the only state born out of the Civil War, and the blue of its official state colors carries that history — it is literally the color of the Union cause that made West Virginia possible. Old gold speaks to the mineral wealth of the Appalachian coalfields that built the state's economy for a century. Together they capture the Mountain State's notable character."
  source: "West Virginia State Archives, Charleston, State Symbols and Legislative History Documentation"

faq:
  - question: "What are the official colors of West Virginia?"
    answer: "The official state colors of West Virginia are Old Gold and Blue, formally designated in 1895 under Joint Resolution No. 8. The colors originated with West Virginia University and were made official state colors by the Legislature, with old gold for the state's mineral and agricultural wealth and blue for its Union heritage and river landscape."
  - question: "What is the HEX code for West Virginia Old Gold?"
    answer: "The standard HEX code for West Virginia Old Gold is #EAAA00, corresponding to Pantone PMS 7549, as standardized by West Virginia University's official brand identity guidelines."
  - question: "What is the HEX code for West Virginia Blue?"
    answer: "The standard HEX code for West Virginia Blue is #002D62, corresponding to Pantone PMS 282, as standardized by West Virginia University's official brand identity guidelines."
  - question: "When were West Virginia's state colors officially adopted?"
    answer: "West Virginia's state colors were officially adopted in 1895 under Joint Resolution No. 8, though old gold and blue had been West Virginia University's official colors since the university's founding in 1867."
  - question: "Why does West Virginia use old gold and blue?"
    answer: "Old gold and blue originated as West Virginia University's institutional colors and were adopted as official state colors in 1895 because WVU's cultural influence had already made the pairing synonymous with West Virginia identity. Old gold represents the state's mineral wealth and mountain forests; blue represents the Union loyalty that made West Virginia's statehood possible in 1863 and the rivers that define the Mountain State's terrain."

