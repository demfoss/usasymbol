seo_title: "West Virginia State Colors | Old Gold Blue"
seo_description: "West Virginia state colors are Old Gold and Blue, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of West Virginia are **Old Gold** and **Blue**, formally designated by the West Virginia Legislature in 1895 under Joint Resolution No. 8. Designated just 32 years after West Virginia became the only state formed by seceding from a Confederate state, old gold and blue appear on [the West Virginia state flag](/states/west-virginia/flag/west-virginia-state-flag), university materials, and state branding. The specifications below list HEX, RGB, CMYK, and Pantone values for West Virginia color matching. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Old Gold and Blue"
official_since: "1895 (Joint Resolution No. 8)"
primary_use: "State government branding, West Virginia University athletics, state agency insignia, official state communications"
known_for: "Old gold — a rich, deep amber-gold distinct from standard gold — adopted originally by West Virginia University and made official state colors in 1895; the pairing represents the mineral and agricultural wealth of the Mountain State and the blue of its Appalachian skies"

color_data:
