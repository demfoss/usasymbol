sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is West Virginia's State Fruit?"
    paragraphs:
      - "The Golden Delicious apple is West Virginia's official state fruit, designated by the West Virginia Legislature in 1995. The variety originated on the Mullins family farm in Clay County in the early 1900s."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Golden Delicious Apple"
    paragraphs:
      - "The Golden Delicious is a yellow-skinned apple with sweet, mellow flesh, popular for both fresh eating and baking. It is one of the most widely grown apple varieties in the world today."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Golden Delicious Apple Became West Virginia's State Fruit"
    paragraphs:
      - "The West Virginia Legislature designated the Golden Delicious apple the official state fruit in 1995."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why West Virginia Chose the Golden Delicious Apple"
    paragraphs:
      - "The original Golden Delicious tree grew on the Mullins family farm near Odessa in Clay County, discovered around 1905. The Stark Brothers Nursery later purchased the tree and propagated the variety, which spread to orchards worldwide."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Golden Delicious Apple Comes From in West Virginia"
    paragraphs:
      - "Clay County, in central West Virginia, is home to the original Golden Delicious tree site near the community of Odessa, now marked with a historical monument."
    sites:
      - name: Original Golden Delicious tree site
        city: Odessa
        lat: 38.53
        lng: -81.02
        note: "Birthplace of the Golden Delicious apple"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Golden Delicious Apple Facts"
    facts:
      - "Adopted as West Virginia's state fruit in 1995."
      - "The original tree was discovered on a Clay County farm around 1905."
      - "The Golden Delicious is now one of the most widely grown apples in the world."

