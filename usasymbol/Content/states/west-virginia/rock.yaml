seo_title: "West Virginia State Rock | Bituminous Coal"
seo_description: "West Virginia's state rock is bituminous coal, adopted in 2009. Coal mining has shaped the state's economy and communities for two centuries."
hero_image: /images/rocks/west-virginia/west-virginia-state-rock-hero.webp
