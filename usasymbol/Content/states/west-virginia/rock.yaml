faq:
  - question: What is West Virginia's state rock?
    answer: "West Virginia's state rock is bituminous coal, a black sedimentary rock formed from ancient swamp plants."
  - question: When did West Virginia adopt bituminous coal as its state rock?
    answer: "The West Virginia Legislature named bituminous coal the state rock on April 11, 2009."
  - question: Why did West Virginia choose bituminous coal?
    answer: "Coal mining has shaped West Virginia's economy and communities since a commercial mine opened near Wheeling in 1810, and the state still holds 117 named coal seams."
  - question: Where can you find bituminous coal in West Virginia?
    answer: "Coal seams run through most of the state's 55 counties, with the deepest mining history concentrated in the southern coalfields around Beckley."

