hero_image_caption: "Bituminous coal, West Virginia's official state rock, comes from seams mined across the state since the early 1800s."
intro_text: "West Virginia's state rock is bituminous coal, adopted in 2009 to recognize the fuel that has driven the state's mining economy since commercial operations began near Wheeling in 1810. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: West Virginia State Rock
    paragraphs:
      - "Bituminous coal is West Virginia's official state rock, designated by the state legislature in 2009. It is a sedimentary rock formed from ancient swamp plants compressed and heated over millions of years, and it has been mined in the state since the early 1800s."
      - "West Virginia holds coal seams in most of its 55 counties, and few other states have an industry so closely tied to a single rock."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Bituminous Coal?"
    paragraphs:
      - "Bituminous coal is a dense, black sedimentary rock that burns readily and produces more heat than lower-grade lignite coal. It sits in the middle of the coal rank scale, softer and less carbon-rich than anthracite but harder and more energy-dense than lignite."
      - "Bituminous coal forms from peat, dead plant matter that accumulated in ancient swamps, buried under sediment and gradually compressed and heated over tens of millions of years. West Virginia's coal formed mostly during the Pennsylvanian period, when the region was covered by low, swampy forests."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why West Virginia Chose Bituminous Coal as Its State Rock"
    paragraphs:
      - "Coal mining has run through West Virginia's economy since a commercial mine opened near Wheeling in 1810, and the state now counts 117 named coal seams across its mountains. Entire communities in the southern coalfields grew up around mining, and the industry remains one of the state's largest employers and exports."
      - "Gilbert High School student Britnee Gibson led the push for the designation, giving lawmakers a grassroots case for honoring an industry that had shaped West Virginia for two centuries without ever holding an official state symbol of its own."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Bituminous Coal Became West Virginia's State Rock"
    paragraphs:
      - "The West Virginia Legislature named bituminous coal the official state rock on April 11, 2009, after Gilbert High School student Britnee Gibson campaigned for the designation."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Bituminous Coal Is Found in West Virginia"
    paragraphs:
      - "Coal seams run through most of West Virginia, but the deepest concentration sits in the southern coalfields around Beckley, long a center of underground mining. The Beckley Exhibition Coal Mine there lets visitors tour a real mine once worked by hand."
    sites:
      - name: Beckley Exhibition Coal Mine
        city: Beckley
        lat: 37.7782
        lng: -81.1882
        note: "Historic mine open to the public"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Bituminous Coal Facts"
    facts:
      - "Adopted as West Virginia's state rock in 2009."
      - "West Virginia has 117 named coal seams, of which about 62 are considered minable."
      - "The state's first commercial coal mine opened near Wheeling in 1810."
      - "Gilbert High School student Britnee Gibson led the campaign that resulted in the 2009 designation."

