faq:
- question: What is West Virginia's state butterfly?
  answer: "West Virginia's state butterfly is the monarch butterfly, adopted by the West Virginia Legislature in 1995."
- question: When did West Virginia adopt the monarch butterfly?
  answer: "West Virginia adopted the monarch butterfly as its official state butterfly in 1995."
- question: What does West Virginia's state butterfly look like?
  answer: "The monarch has bright orange wings crossed by black veins, with a black border dotted with white spots. It has a wingspan of about 3.5 to 4 inches."
- question: Where is the monarch butterfly found in West Virginia?
  answer: "Monarchs are seen statewide during the warmer months, with migration passing through the state in late summer and early fall on the way to Mexico."
- question: Is the monarch the same as West Virginia's state insect?
  answer: "No. West Virginia's state insect is the European honey bee, adopted in 2002. The monarch butterfly is a separate designation, the state butterfly, adopted in 1995."

