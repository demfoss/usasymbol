sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of West Virginia?
  paragraphs:
  - "The monarch butterfly, Danaus plexippus, is West Virginia's official state butterfly. The West Virginia Legislature designated it in 1995."
  - "It is a separate designation from West Virginia's state insect, the European honey bee, adopted in 2002."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Monarch Butterfly
  paragraphs:
  - "A monarch has bright orange wings crossed by thick black veins, with a black border dotted with two rows of small white spots. Males have a small black scent patch on each hind wing that females lack."
  - "Adult monarchs have a wingspan of about 3.5 to 4 inches, one of the larger butterflies found in West Virginia."
  - "Monarch caterpillars are banded in white, yellow, and black, and feed only on milkweed. That single food source is why milkweed plantings matter so much for the species."

- id: history
  icon: fa-solid fa-landmark
  title: How West Virginia Chose the Monarch Butterfly
  paragraphs:
  - "The West Virginia Legislature named the monarch butterfly the official state butterfly in 1995."
  - "Official sources confirm the designation and its year but do not give a detailed account of the selection process."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Monarch Butterfly in West Virginia
  paragraphs:
  - "Monarchs are seen across West Virginia during the warmer months, feeding on milkweed and other flowering plants in fields, meadows, and gardens."
  - "Migration typically passes through the state in late summer and early fall, as monarchs head toward their overwintering grounds in central Mexico."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Monarch Butterfly Facts
  facts:
  - "Adopted in 1995 by the West Virginia Legislature."
  - "Scientific name: Danaus plexippus."
  - "Wingspan: about 3.5 to 4 inches, with bright orange wings, black veins, and white-spotted black borders."
  - "Caterpillars feed only on milkweed, which makes milkweed habitat important across the state."
  - "West Virginia also has a separate state insect, the European honey bee, adopted in 2002."




