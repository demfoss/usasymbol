seo_title: "West Virginia State Amphibian | Red Salamander"
seo_description: "West Virginia's state amphibian is the red salamander, adopted in 2015. Learn what it looks like and why it became official."
hero_image: /images/amphibians/west-virginia/west-virginia-state-amphibian-hero.webp
hero_image_alt: "A bright orange-red salamander with black spots on a mossy forest floor."
hero_image_caption: "The red salamander, West Virginia's state amphibian, is common in the state's mountain streams."
intro_text: "West Virginia's state amphibian is the red salamander, a bright orange-red salamander found in streams and springs across the state, adopted in 2015. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of West Virginia?
    paragraphs:
      - "The red salamander is West Virginia's official state amphibian, designated by the West Virginia Legislature in 2015. Its scientific name is Pseudotriton ruber."
      - "It is a stream-dwelling salamander found throughout the Appalachian Mountains of West Virginia."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Red Salamander
    paragraphs:
      - "The red salamander has bright orange-red to reddish-brown skin covered in irregular black spots, with a stout body and short legs."
      - "It grows to about 4 to 7 inches long and has small eyes with yellow irises."
      - "It lives near clean springs, seeps, and mountain streams, hiding under rocks and logs during the day."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The West Virginia Legislature designated the red salamander the official state amphibian in 2015, following an effort led by students to give West Virginia an official state amphibian."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why West Virginia Chose the Red Salamander
    paragraphs:
      - "The red salamander was chosen for its bright, easily recognized coloring and because it is common in the clean mountain streams that run throughout West Virginia."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Red Salamander
    paragraphs:
      - "Red salamanders live near clean, cool springs and streams throughout the Appalachian Mountains of West Virginia, including the Monongahela National Forest."
    sites:
      - name: Monongahela National Forest streams
        city: Elkins
        lat: 38.93
        lng: -79.85
        note: "Common mountain stream habitat"
