title: Northern Cardinal
scientific_name: Cardinalis cardinalis
adopted_year: 1949
legislation: House Resolution 12 (1949)
meaning: West Virginia's cardinal page works best as a not-from-Virginia story. The state did not simply inherit the same bird from the older commonwealth whose name it shares. West Virginia held its own 1949 public vote involving schools and civic organizations, chose the cardinal first, and only then saw Virginia formalize the same bird in 1950. That makes the symbol read as a West Virginia decision rather than a borrowed family emblem.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: "2026-05-02"
seo_title: "West Virginia State Bird | Northern Cardinal"
seo_description: "West Virginia adopted the Northern Cardinal in 1949 after a public vote, and it did so before Virginia."
intro_text: West Virginia's official state bird is the <strong>Northern Cardinal</strong>, approved on <strong>March 7, 1949</strong> by legislative resolution. West Virginia and Virginia now share the same bird, but West Virginia chose it first. The Legislature opened the vote to public school students and civic organizations, the cardinal won by more than 11,000 ballots, and the bird became official before Virginia made the same decision in 1950. West Virginia treated the cardinal as its own public choice — not a symbol inherited from the older commonwealth next door.
