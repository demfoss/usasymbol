faq:
  - question: "What is Colorado's state dinosaur?"
    answer: "Colorado's 1982 Stegosaurus designation was among the first in the country — before school lobbying campaigns made state dinosaurs a routine legislative category. The type species is Stegosaurus stenops, formally described from Colorado material by Marsh in the 1880s and collected from the Morrison Formation, the same geological unit named after a town west of Denver. Every state dinosaur program that came after Colorado's traces back to this one."

  - question: "Where were the original Stegosaurus fossils found?"
    answer: "The most significant early Stegosaurus material came from Garden Park, near Cañon City, Colorado, and from Morrison, Colorado. Both sites are in the Morrison Formation — the formation named after the Colorado town."

  - question: "What were Stegosaurus plates for?"
    answer: "The function of Stegosaurus's dorsal plates is still debated. The leading hypotheses are thermoregulation (the plates were vascular and acted as heat exchangers) and display (they were visually prominent for mate recognition or species signaling). The plates were not solid bone, which argues against a purely defensive role."

  - question: "What is the Morrison Formation?"
    answer: "The Morrison Formation is a Late Jurassic sedimentary rock sequence spanning 13 western US states. It is named for Morrison, Colorado — where significant dinosaur material was first collected in 1877. The Morrison Formation is the world's most productive source of Late Jurassic dinosaur fossils, and Colorado is at its geographic and historical center."

  - question: "Where can I see Stegosaurus fossils in Colorado?"
    answer: "The Denver Museum of Nature and Science has extensive Morrison Formation collections including Stegosaurus material. The Dinosaur Depot Museum in Cañon City covers the Garden Park fossil heritage, and Garden Park Fossil Area itself is accessible northeast of Cañon City as a National Natural Landmark."

  - question: "What was the Bone Wars?"
    answer: "The Bone Wars was the intense competitive rivalry between paleontologists Othniel Charles Marsh and Edward Drinker Cope, primarily from the 1870s through the 1890s. Both men collected from Colorado sites including Garden Park, and their competition — marked by scientific shortcuts and personal hostility — nonetheless produced an enormous volume of new species descriptions, including Stegosaurus."

