title: "Stegosaurus"
adopted_year: 1982
legislation: "Colorado House Bill 1200 (1982)"
meaning: "Colorado didn't just give the world Stegosaurus — it gave the world the Morrison Formation, the geological unit that produced Stegosaurus and most of the famous Jurassic dinosaurs in American natural history museums. Designating Stegosaurus as a state symbol was Colorado acknowledging that the fossils under its soil built the field of North American paleontology."
