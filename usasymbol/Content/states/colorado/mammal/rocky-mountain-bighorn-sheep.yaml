faq:
  - question: "What is Colorado's state animal?"
    answer: "Colorado's state animal is the Rocky Mountain bighorn sheep (Ovis canadensis canadensis), designated by the General Assembly in 1931."

  - question: "Why did Colorado choose the bighorn sheep?"
    answer: "Colorado chose the bighorn sheep because it is the only large mammal that lives at the extreme high elevations the state is known for. The sheep can survive above 14,000 feet where few other animals can. The designation also drew attention to the species' conservation needs at a time when its population had fallen dangerously low."

  - question: "How many bighorn sheep live in Colorado?"
    answer: "Colorado is home to an estimated 13,000 to 17,000 Rocky Mountain bighorn sheep. This represents a dramatic recovery from fewer than 2,500 animals in the early 1900s, thanks to decades of conservation and reintroduction programs."

  - question: "Where can I see bighorn sheep in Colorado?"
    answer: "Rocky Mountain National Park is the easiest place to see bighorn sheep. Sheep Lakes and Trail Ridge Road are two reliable spots, especially in the early morning. Mount Evans Scenic Byway also has a resident herd visible near the summit. Garden of the Gods near Colorado Springs occasionally has sightings at lower elevations."

  - question: "Why are bighorn sheep threatened?"
    answer: "The biggest threat to bighorn sheep in Colorado is disease transmitted by domestic sheep. A pneumonia caused by bacteria like Pasteurella can kill most of a wild herd within weeks. Habitat fragmentation from roads and development also limits the sheep's ability to move between mountain ranges."

  - question: "Can bighorn sheep really climb vertical cliffs?"
    answer: "Yes. Bighorn sheep are remarkable climbers. Their wide, splayed hooves have hard outer edges for gripping rock and soft undersides for absorbing shock. They can navigate near-vertical rock faces at speeds up to 40 miles per hour, a skill that helps them escape predators like mountain lions."

  - question: "Were bighorn sheep ever endangered in Colorado?"
    answer: "Yes. By the early 1900s, fewer than 2,500 bighorn sheep remained across Colorado, down from tens of thousands before European settlement. Hunting, habitat loss, and disease from domestic sheep all contributed to the decline. Reintroduction programs beginning in the 1940s and 1950s brought the population back to over 13,000 animals today."

  - question: "What is the difference between bighorn sheep and domestic sheep?"
    answer: "Rocky Mountain bighorn sheep are a wild species native to the mountains of western North America. They are much larger and more muscular than domestic sheep, with curved horns and hooves adapted for rocky terrain. Domestic sheep are descended from Eurasian Mouflon and were brought to North America by settlers. The two species can share diseases, which is one reason wildlife managers work to keep them apart."

