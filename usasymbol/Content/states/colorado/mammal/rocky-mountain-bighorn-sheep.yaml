title: "Rocky Mountain Bighorn Sheep"
scientific_name: "Ovis canadensis canadensis"
adopted_year: 1931

seo_title: "Colorado State Animal - Rocky Mountain Bighorn Sheep"
seo_description: "The Rocky Mountain bighorn sheep became Colorado's state animal in 1931, representing alpine resilience and a celebrated wildlife recovery story."

intro_text: "Colorado's state animal is the Rocky Mountain bighorn sheep (Ovis canadensis canadensis), designated in 1931. As a standout species in the [list of U.S. state mammals](/symbols/mammals), it survives at elevations where few large mammals can live—some above 14,000 feet. The legislature chose this alpine species to represent Colorado's rugged mountain landscape and the conservation efforts that brought it back from the edge of extinction."

common_name: "Rocky Mountain Bighorn Sheep"
official_since: "1931"
status: "Stable (recovered; population growing after near-extinction in early 1900s)"
habitat_in_state: "Alpine and subalpine terrain from 2,500 to over 14,000 feet elevation across the Rocky Mountains"
known_for: "Navigating near-vertical rock faces at high speed; symbolizing Colorado's alpine wilderness and conservation success"

size: "4.5 to 5.5 feet long; 2.5 to 3.5 feet tall at the shoulder"
weight: "Males: 170–300 pounds; Females: 115–200 pounds"
coloration: "Tan to dark brown coat in summer; lighter grayish-brown in winter; white underbelly and rump patch year-round"
distinctive_traits: "Curved, spiraling horns on both males and females (males much larger); thick, coarse coat; wide, splayed hooves with soft rubber-like soles adapted for rocky terrain"

habitat: "Steep rocky cliffs, alpine meadows, and rugged mountain terrain"
range_in_state: "Rocky Mountain National Park, Mount Evans, the San Juan Mountains, and numerous wilderness areas across the Colorado Rockies"
conservation_status: "Population estimated at 13,000–17,000 in Colorado; recovering from fewer than 2,500 animals in the early 1900s"
where_to_find: "Rocky Mountain National Park (Trail Ridge Road, Sheep Lakes near Estes Park); Mount Evans Scenic Byway; Garden of the Gods"
symbol_connections: "The bighorn sheep shares its mountain habitat with Colorado's state flower, the Rocky Mountain columbine, which also thrives at high elevations. Both symbols were chosen specifically because they represent the alpine landscape that defines Colorado's identity."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Colorado General Assembly designated the Rocky Mountain bighorn sheep as the state animal in 1931. The choice came at a critical moment—the species was near its lowest population in recorded history."
      - "Colorado was among the earliest states to formally recognize a mammal as its official animal. The 1931 designation reflected growing awareness that bighorn sheep needed public attention and legal protection to survive."

    subsections:
      - subtitle: "How It Became the State Symbol"
        text: "By the late 1920s, Colorado residents and wildlife officials had watched bighorn sheep decline for decades. Hunters, ranchers, and settlers had pushed the species toward extinction throughout the 1800s. A handful of conservation-minded legislators pushed for the designation partly to raise public awareness. Making the bighorn sheep a state symbol put its survival on the political map."

      - subtitle: "Why Colorado Chose the Bighorn Sheep"
        text: "Colorado's identity is built around its mountains. No other large mammal in the state lives as high, moves as nimbly on steep rock, or represents the alpine wilderness as completely as the bighorn sheep. Elk, mule deer, and mountain lions all share Colorado's mountains, but none of them occupy the extreme terrain that bighorn sheep call home. The legislature chose the animal that lived where no other could."

  - id: "state-symbolism"
    title: "What the Bighorn Sheep Represents"
    style: "highlight"
    paragraphs:
      - "The Rocky Mountain bighorn sheep stands for toughness in extreme conditions. These animals run across near-vertical rock faces at speeds up to 40 miles per hour. They survive winters at elevations where temperatures drop to minus 30 degrees Fahrenheit and winds exceed 100 miles per hour, which is why Colorado consistently ranks high in the [highest point by state list](/rankings/geography/highest-point-by-state)."
      - "Before European settlement, bighorn sheep roamed across the entire Rocky Mountain chain. Indigenous peoples including the Ute and Arapaho hunted them and wove their presence into the rhythms of mountain life."
      - "In modern Colorado, the bighorn sheep has become a symbol of what states can accomplish when they commit to protecting wildlife. The species came back from fewer than 2,500 animals to more than 13,000 today—one of the most successful recovery programs in the American West."

    subsections:
      - subtitle: "The Climb: Colorado's Vertical Identity"
        text: "Colorado is the only state in the contiguous United States where every county seat sits above 5,000 feet elevation. The state's highest point, Mount Elbert, reaches 14,440 feet. Bighorn sheep live in this vertical world more completely than any other large mammal. They embody what it means to thrive where the air is thin, the ground is steep, and conditions punish anything that is not built to survive them."

      - subtitle: "Indigenous Peoples and the Mountain Hunter"
        text: "The Ute people lived in Colorado's mountains for centuries before European contact. Bighorn sheep were important prey for Ute hunters, who tracked herds across high-altitude ridgelines. The Arapaho, who moved into Colorado's eastern plains and foothills, also hunted bighorn sheep during seasonal migrations to higher ground. These hunts required knowledge of the sheep's behavior on steep terrain—a skill developed over generations of living in the Rockies."

      - subtitle: "The Near-Extinction"
        text: "Commercial hunters in the 1800s devastated bighorn sheep populations across the West. In Colorado, settlers also converted mountain meadows to livestock grazing. Domestic sheep brought diseases—particularly a form of pneumonia caused by bacteria like Pasteurella and Mycoplasma—that killed wild bighorn populations in waves. By 1900, fewer than 2,500 bighorn sheep remained across all of Colorado. Several mountain ranges had lost their herds entirely."

      - subtitle: "The Recovery Program"
        text: "Colorado's bighorn sheep recovery began in earnest during the 1940s and 1950s. Wildlife biologists developed capture and translocation techniques, moving sheep from healthy herds into areas where they had disappeared. Rocky Mountain National Park became a key source of animals for these programs. Over decades, herds reappeared in mountain ranges across the state. Today, Colorado Parks and Wildlife manages one of the most successful bighorn sheep programs in North America."

      - subtitle: "The Ongoing Threat of Disease"
        text: "Domestic sheep still graze on Colorado's public lands, and the risk of disease transmission to wild bighorn sheep has not gone away. When domestic and wild herds come into contact, pneumonia can sweep through a bighorn population and kill most of a herd within weeks. Wildlife managers spend significant time and effort separating the two populations. The bighorn sheep's survival in Colorado depends on keeping this boundary clear."

  - id: "identification"
    title: "How to Identify Rocky Mountain Bighorn Sheep"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "Rocky Mountain bighorn sheep are sturdy, compact animals built for mountain life. Males carry large, curved horns that spiral backward and can measure up to three feet long. Females have shorter, thinner horns. Their hooves are uniquely adapted for rocky ground—hard on the outside edge for gripping and soft on the underside for absorbing shock."
        list_items:
          - "**Size**: 4.5–5.5 feet long; 2.5–3.5 feet tall at the shoulder"
          - "**Weight**: Males 170–300 pounds; females 115–200 pounds"
          - "**Color**: Tan to dark brown in summer; lighter grayish-brown in winter; white underbelly and rump patch"
          - "**Distinguishing features**: Curved spiraling horns (both sexes); wide splayed hooves; thick coarse coat; compact muscular build"

      - subtitle: "Behavior and Habitat"
        text: "Bighorn sheep are most active during dawn and dusk. They spend summer months at higher elevations, feeding on alpine grasses and wildflowers. Winter drives them to lower rocky outcrops where wind keeps snow from covering their food. Their ability to spot predators from great distances—and escape down cliff faces that would stop a mountain lion—is their primary defense."

  - id: "in-the-state"
    title: "Bighorn Sheep in Colorado"
    style: "default"

    paragraphs:
      - "Colorado is home to one of the largest bighorn sheep populations in the United States. An estimated 13,000 to 17,000 animals live across the state's mountain ranges, from the northern Front Range to the San Juan Mountains in the southwest."
      - "The population has grown steadily since the 1950s, when reintroduction programs began placing sheep into empty mountain ranges. Some areas now support herds that have not existed there for over a century."

    facts:
      - "**Rocky Mountain National Park**: One of the largest and most visible herds in the state; sheep regularly seen near Trail Ridge Road and Sheep Lakes"
      - "**Mount Evans**: Year-round resident herd visible from the scenic byway at elevations above 10,000 feet"
      - "**San Juan Mountains**: Remote herds in southwestern Colorado; less accessible but significant to statewide population"
      - "**Statewide population**: 13,000–17,000 animals across multiple mountain ranges"

  - id: "where-to-see"
    title: "Where to See Colorado's State Animal"
    style: "default"

    paragraphs:
      - "Rocky Mountain bighorn sheep are visible year-round at several locations in Colorado. Morning hours offer the best viewing, when herds move to feeding areas on open alpine slopes."

    list_items:
      - "**Sheep Lakes, Rocky Mountain National Park**: Named for the bighorn sheep that gather here regularly; one of the most reliable viewing spots in the state, especially in early morning"
      - "**Trail Ridge Road, Rocky Mountain National Park**: One of the highest paved roads in North America; bighorn sheep are frequently spotted along the alpine tundra on both sides"
      - "**Mount Evans Scenic Byway**: Reaches 14,264 feet; a resident herd of bighorn sheep is often seen grazing near the summit area from late spring through fall"
      - "**Garden of the Gods, Colorado Springs**: Rocky terrain at lower elevations occasionally hosts bighorn sheep; accessible and well-maintained trails"
      - "**St. Vrain Canyon, Estes Park area**: Popular with wildlife photographers; bighorn sheep move through the canyon during seasonal migrations"

  - id: "current-status"
    title: "Current Status and Conservation"
    style: "default"
    paragraphs:
      - "Rocky Mountain bighorn sheep are stable and growing in Colorado. The statewide population has increased from fewer than 2,500 animals in the early 1900s to an estimated 13,000 to 17,000 today."
      - "Colorado Parks and Wildlife continues to monitor herds closely. Disease remains the single biggest threat to the species' long-term survival in the state."

    subsections:
      - subtitle: "Management in Colorado"
        text: "Colorado Parks and Wildlife runs one of the most active bighorn sheep management programs in the country. Biologists monitor herd sizes, track disease, and relocate sheep into suitable habitat when opportunities arise. Limited regulated hunting exists in some units—carefully managed to ensure populations remain healthy. The department also works with ranchers and federal land managers to reduce contact between domestic sheep and wild herds on public grazing lands."

      - subtitle: "Threats and Outlook"
        text: "Pneumonia transmitted by domestic sheep remains the most dangerous ongoing threat. A single disease event can kill 80 to 90 percent of a wild herd. Habitat fragmentation from roads, subdivisions, and ski resorts also limits the sheep's ability to move between mountain ranges. Climate change is gradually shifting the alpine vegetation that bighorn sheep depend on for food, though scientists are still studying how significant this effect will become over coming decades."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "Colorado's state symbols are unusually unified around a single theme—the mountains. The bighorn sheep, the Rocky Mountain columbine, and the Colorado blue spruce all belong to the same high-altitude world. Choosing symbols that share the same landscape gives Colorado a more coherent identity than most states."
      - "The bighorn sheep's 1931 designation came during a decade when Colorado added or formalized several state symbols. The state was building an identity around its natural environment at a time when many states still focused on agriculture or industry."

    subsections:
      - subtitle: "The Rocky Mountain Columbine: Shared Summit"
        text: "Colorado's state flower, the Rocky Mountain columbine (designated 1899), grows in alpine meadows at elevations up to 11,000 feet. Bighorn sheep graze on and near the same mountain slopes where columbines bloom each summer. Both symbols were chosen because they thrive in terrain that defines Colorado more than any other state. The columbine is the plant of the peaks; the bighorn sheep is the animal of the peaks."
        link:
          label: "See Colorado state flower"
          url: "/states/colorado/flower/rocky-mountain-columbine"

      - subtitle: "The Colorado Blue Spruce: Alpine Endurance"
        text: "Colorado's state tree, the Colorado blue spruce (designated 1925), grows across mountain elevations from 5,000 to 11,000 feet. Its silvery-blue needles are adapted to survive harsh winters, strong winds, and intense ultraviolet radiation at altitude. Bighorn sheep shelter in spruce-covered ridgelines during the coldest months. Both symbols represent species that evolved to endure conditions most organisms cannot tolerate."
        link:
          label: "See Colorado state tree"
          url: "/states/colorado/tree/colorado-blue-spruce"

      - subtitle: "The Lark Bunting: Plains Versus Peaks"
        text: "Colorado's state bird, the lark bunting (designated 1931—the same year as the bighorn sheep), lives primarily on the eastern plains rather than in the mountains. The two symbols chosen in the same year represent opposite halves of Colorado. The bighorn sheep belongs to the Rockies. The lark bunting belongs to the grasslands east of Denver. Together they acknowledge that Colorado is not only a mountain state—it is also a plains state."
        link:
          label: "See Colorado state bird"
          url: "/states/colorado/bird/lark-bunting"

      - subtitle: "The Centennial State and 1876"
        text: "Colorado earned the nickname 'The Centennial State' when it joined the Union on August 1, 1876—exactly 100 years after the Declaration of Independence was signed. The bighorn sheep had already been a symbol of the Rocky Mountains long before statehood. When Colorado formalized the designation in 1931, it connected an ancient mountain species to a state that was itself relatively young. The sheep predated the state by millennia."
        link:
          label: "See Colorado state nickname"
          url: "/states/colorado/nickname/the-centennial-state"

