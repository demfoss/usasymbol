faq:
  - question: "What are Colorado's state pets?"
    answer: "Colorado's state pets are shelter dogs and cats, designated by the legislature in 2013. The symbol honors every dog and cat living in an animal shelter or rescue organization across the state."

  - question: "Why did Colorado choose shelter animals as state pets?"
    answer: "Colorado chose shelter animals to promote adoption and to draw attention to the millions of dogs and cats waiting in shelters for homes. The designation also supported Colorado's efforts to crack down on puppy mills—commercial operations that breed animals in cruel conditions for profit."

  - question: "Is Colorado the only state with state pets?"
    answer: "Very few states have official state pets at all. Colorado's designation is unusual because it chose a category—shelter animals—rather than a specific breed or species. This made the symbol a statement about animal welfare rather than simply honoring a particular type of pet."

  - question: "What is a puppy mill?"
    answer: "A puppy mill is a commercial breeding operation that produces puppies for sale with little concern for the health or wellbeing of the dogs. Animals in puppy mills are often kept in small cages, given minimal veterinary care, and bred repeatedly. Colorado has passed laws restricting puppy mill operations and requiring pet stores to source animals from shelters and rescues instead."

  - question: "How many dogs and cats are in shelters in the United States?"
    answer: "Approximately 6.3 million dogs and cats enter animal shelters across the United States each year. Of those, about 2 million are euthanized because shelters do not have enough space, funding, or time to care for all of them. Colorado is one of the states working hardest to reduce those numbers through adoption and transfer programs."

  - question: "Can I adopt a Colorado state pet?"
    answer: "Yes. Adopting a shelter dog or cat is exactly what the state symbol encourages. The Denver Dumb Friends League, Denver Animal Shelter, Colorado Humane Society, and hundreds of rescue organizations across the state have dogs and cats available for adoption year-round."

  - question: "Are shelter pets healthy?"
    answer: "Most shelter dogs and cats are healthy. Reputable shelters and rescue organizations vaccinate, spay or neuter, and provide veterinary checkups before animals are adopted. Some animals may need a little extra time to adjust to a new home, but with patience and care, shelter pets make loyal and loving companions."

  - question: "What is the difference between a shelter pet and a pet from a store?"
    answer: "Shelter pets are animals that ended up in a rescue or shelter for various reasons—their previous owners could not care for them, they were found as strays, or they were rescued from bad situations. Store-bought pets often come from commercial breeders. Colorado's state pet designation encourages adoption because shelter animals already need homes, and adopting one saves a life."

