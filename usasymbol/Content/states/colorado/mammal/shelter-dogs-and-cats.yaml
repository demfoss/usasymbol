symbol_connections: "Shelter dogs and cats represent the opposite end of Colorado's symbolic spectrum from the bighorn sheep—one wild and solitary on a mountaintop, the other domestic and waiting for human connection. Together they show that Colorado values both wilderness and compassion."

sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Colorado General Assembly designated shelter dogs and cats as the state's official pets in 2013. Governor John Hickenlooper signed the bill into law, making Colorado one of the first states in the nation to give an official symbol to animals living in shelters."
      - "The designation was not about any single breed or species. It was about a category—animals that had ended up in shelters and needed families. That choice made the symbol unlike any other state pet designation in the country."

    subsections:
      - subtitle: "How It Became the State Symbol"
        text: "The push to designate shelter animals came from Colorado's growing animal welfare community during the early 2010s. Legislators and advocates argued that a state symbol could change how residents thought about where pets come from. At the same time, Colorado was tightening laws against puppy mills—commercial operations that breed dogs in cruel conditions for profit. The state pet designation and the anti-puppy mill legislation reinforced each other."

      - subtitle: "Why Shelter Animals Were Chosen"
        text: "Colorado did not pick a specific breed—not a golden retriever, not a collie, not a Siamese cat. The legislature chose every dog and every cat that was sitting in a shelter on any given day. That decision carried a specific political message: commercial pet breeding was not the only way, and not the best way, to bring a pet into a Colorado family. Adoption was the answer the state wanted to promote."

  - id: "state-symbolism"
    title: "What Shelter Pets Represent"
    style: "highlight"
    paragraphs:
      - "Shelter dogs and cats represent compassion as a civic value. Most state symbols honor nature—a plant, a bird, a wild animal, like [Colorado's state flower, the Rocky Mountain Columbine](/states/colorado/flower/rocky-mountain-columbine). Colorado's state pets honor something different: the relationship between humans and the animals they choose to care for."
      - "Every shelter dog or cat has a story. Some were surrendered by owners who could no longer care for them. Others were found as strays. A few were rescued from conditions no animal should endure. The state symbol honors all of them equally."
      - "In Colorado, the designation shifted a conversation. Before 2013, most residents thought of pets as something you buy. After the designation, the state itself was saying: the best pets are the ones already waiting for you, especially across communities connected through the [Colorado borders guide](/states/colorado/borders) and the identity of [the Centennial State](/states/colorado/nickname/the-centennial-state)."

    subsections:
      - subtitle: "The Puppy Mill Problem"
        text: "Puppy mills are commercial breeding operations that produce puppies for profit with little regard for the health or wellbeing of the animals. Dogs in puppy mills often live in small cages, receive minimal veterinary care, and are bred repeatedly until they can no longer produce litters. Colorado passed legislation in the 2010s restricting the sale of commercially bred dogs and cats within the state. The shelter pet designation gave that effort a visible symbol."

      - subtitle: "Adopt, Don't Shop"
        text: "The phrase 'adopt, don't shop' became a national slogan for animal welfare organizations in the 2000s and 2010s. Colorado's state pet designation put that idea into law. By making shelter animals the official state pets, the legislature declared that adoption was not just an option—it was the state's preferred choice. Pet stores in Colorado increasingly shifted from selling puppies to hosting adoption events run by local rescues."

      - subtitle: "Second Chances as a Colorado Value"
        text: "The shelter pet symbol connects to a broader idea in Colorado culture: that second chances matter. The state motto area and public discourse often emphasize opportunity and moving forward. A shelter dog or cat carries that same idea. These animals did not fail—their circumstances changed. Given a new home, most thrive. Colorado chose a symbol that says every living thing deserves another opportunity."

      - subtitle: "The Numbers Behind the Symbol"
        text: "Across the United States, approximately 6.3 million dogs and cats enter animal shelters each year. Of those, roughly 2 million are euthanized because shelters run out of space, funding, and time. Colorado has been a national leader in reducing those numbers through large-scale transfer programs that move animals from overcrowded shelters in other states to Colorado rescues with capacity to find them homes. The state pet designation gave that work public recognition."

      - subtitle: "A Symbol for Every Family"
        text: "Unlike most state symbols, which residents observe from a distance, shelter pets are meant to come home. A family in Denver can adopt a state pet from a local rescue. A family in Grand Junction can do the same. The symbol is participatory in a way that [the bighorn sheep](/states/colorado/mammal/rocky-mountain-bighorn-sheep) or a columbine flower never could be. Colorado's state pets are not something you look at—they are something you welcome."

  - id: "identification"
    title: "About Dogs and Cats"
    style: "default"

    subsections:
      - subtitle: "Dogs: Colorado's Most Popular Pet"
        text: "Dogs (Canis lupus familiaris) are domesticated descendants of wolves. They come in over 200 recognized breeds plus countless mixed-breed combinations, ranging from tiny Chihuahuas to giant Great Danes. Shelter dogs in Colorado include every size, coat type, and temperament imaginable. Most are healthy, trainable, and eager for a home. Breed does not determine personality—individual dogs vary enormously regardless of what they are mixed with."
        list_items:
          - "**Size range**: 6 inches to over 3 feet at the shoulder"
          - "**Weight range**: 4 pounds to 180+ pounds"
          - "**Temperament**: Varies by individual, not breed; shelter dogs are as loyal and loving as any other"
          - "**Average lifespan**: 10–13 years depending on size"

      - subtitle: "Cats: Independent and Versatile"
        text: "Cats (Felis catus) are semi-domesticated descendants of the African wildcat. They require less hands-on care than dogs but still need attention, enrichment, and veterinary visits. Shelter cats in Colorado range from kittens to senior cats, from highly social to more reserved personalities. Black cats make up a disproportionate share of shelter populations nationwide and are often the last to be adopted—a fact that animal welfare groups work hard to change."
        list_items:
          - "**Size**: Typically 9–10 inches tall at the shoulder"
          - "**Weight**: 7–15 pounds for most domestic cats"
          - "**Temperament**: Ranges from highly social to independent; each cat is an individual"
          - "**Average lifespan**: 12–18 years for indoor cats"

  - id: "in-the-state"
    title: "Shelter Pets in Colorado"
    style: "default"

    paragraphs:
      - "Colorado operates one of the most active shelter and rescue networks in the western United States. Denver alone has multiple large facilities serving hundreds of thousands of residents. Across all 64 counties, shelters range from small rural operations to large regional organizations with professional staff and medical teams."
      - "Colorado has become a destination for animals transferred from overcrowded shelters in other states. Organizations like the Denver Dumb Friends League take in animals from across the country and work to find them permanent homes within Colorado."

    facts:
      - "**Denver Dumb Friends League**: One of the largest humane societies in the West; operates multiple facilities and places thousands of animals annually"
      - "**Denver Animal Shelter**: The city's municipal shelter, serving Denver's 700,000+ residents"
      - "**Colorado Humane Society**: Statewide organization with locations in Denver and surrounding communities"
      - "**Rescue organizations**: Hundreds of breed-specific and mixed-breed rescues operate across Colorado, many run by volunteers"

  - id: "where-to-see"
    title: "Where to Adopt Colorado's State Pets"
    style: "default"

    paragraphs:
      - "Adopting a shelter dog or cat is the state's preferred way to welcome a pet into a family. Colorado offers adoption opportunities in every region, from large urban shelters to small rural rescues. Many organizations also host adoption events at pet stores and community locations."

    list_items:
      - "**Denver Dumb Friends League**: Colorado's largest humane society; operates shelters in Denver and Aurora with dogs, cats, rabbits, and other animals available year-round"
      - "**Denver Animal Shelter**: Municipal shelter on the east side of Denver; offers walk-in adoption visits and online listings of available animals"
      - "**Colorado Humane Society**: Locations in Denver and surrounding areas; specializes in finding the right match between pet and family"
      - "**Petco and PetSmart adoption events**: Local rescue partners hold weekend adoption events at retail stores across the Front Range and Western Slope"
      - "**Breed-specific rescues**: Hundreds of organizations across Colorado specialize in particular breeds—from golden retrievers to greyhounds to barn cats—and can match you with a dog or cat that fits your lifestyle"
      - "**Adopt-a-Pet.com and Petfinder.com**: Online databases that list available animals at shelters and rescues across Colorado and the entire country"

  - id: "current-status"
    title: "Current Status of Animal Welfare in Colorado"
    style: "default"
    paragraphs:
      - "Colorado ranks among the most progressive states in the country on animal welfare. Shelter euthanasia rates have declined significantly over the past two decades, driven by adoption programs, foster networks, and interstate transfer partnerships, while the state continues to grow demographically as shown in [U.S. state population rankings](/rankings/demographics/states-by-population)."
      - "The state continues to strengthen protections for both shelter animals and animals in commercial breeding operations. New legislation is introduced nearly every legislative session to address gaps in animal welfare law."

    subsections:
      - subtitle: "Anti-Puppy Mill Laws"
        text: "Colorado has enacted some of the strictest anti-puppy mill regulations in the nation. State law restricts the sale of dogs and cats by commercial breeders and requires that pet stores selling dogs and cats source them exclusively from shelters and rescues. Enforcement is handled by the Colorado Department of Agriculture and local animal control agencies. These laws directly support the state pet designation by making adoption the most accessible path to a new pet."

      - subtitle: "Foster and Transfer Programs"
        text: "Modern animal welfare in Colorado relies heavily on foster families and interstate transfers. When a shelter reaches capacity, animals are moved to foster homes where volunteers care for them until adoption. Colorado also accepts animals transferred from shelters in other states that have no room. This network allows Colorado to save animals that would otherwise face euthanasia in overcrowded facilities elsewhere. The state pet designation gave this system public visibility and political support."

  - id: "symbol-connections"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "Colorado's state pets sit at an unusual place among the state's symbols. Every other Colorado symbol—the bighorn sheep, the columbine, the blue spruce, the lark bunting—represents something wild or growing in nature. Shelter dogs and cats represent something else entirely: the bond between humans and the animals they choose to bring into their lives."
      - "The 2013 designation expanded what Colorado considers worthy of official recognition. For the first time, a state symbol honored not a species in its natural habitat but a population defined by its need for human kindness."

    subsections:
      - subtitle: "The Bighorn Sheep: Wild Versus Domestic"
        text: "Colorado's state animal, the Rocky Mountain bighorn sheep, lives on cliff faces thousands of feet above the nearest human settlement. The state pets live in shelters, waiting for a human to walk through the door. These two symbols represent opposite poles of Colorado's relationship with animals. The bighorn sheep is protected so it can remain wild. Shelter dogs and cats are honored so they can become part of a family. Both symbols reflect care—but care expressed in very different ways."
        link:
          label: "See Colorado state animal"
          url: "/states/colorado/mammal/rocky-mountain-bighorn-sheep"

      - subtitle: "The Rocky Mountain Columbine: Compassion and Beauty"
        text: "Colorado's state flower, the Rocky Mountain columbine, was designated in 1899—over a century before the shelter pet designation. The columbine represents the natural beauty that draws people to Colorado. Shelter dogs and cats represent the compassion that keeps people in communities. Together, these two symbols capture two reasons Colorado matters: the landscape that inspires and the values that hold."
        link:
          label: "See Colorado state flower"
          url: "/states/colorado/flower/rocky-mountain-columbine"

      - subtitle: "The Lark Bunting: Symbols Chosen in Purpose"
        text: "Colorado's state bird, the lark bunting, was designated in 1931—the same year as the bighorn sheep. Both were chosen to represent Colorado's natural environment. The shelter pet designation in 2013 marked a deliberate expansion of that tradition. Colorado began saying that state symbols did not have to be wild. They could also be the animals that needed help the most."
        link:
          label: "See Colorado state bird"
          url: "/states/colorado/bird/lark-bunting"

      - subtitle: "The Centennial State and Community"
        text: "Colorado earned its nickname, the Centennial State, by joining the Union in 1876—exactly 100 years after independence. The state has always valued community and collective action. Shelter pet adoption is one of the most community-driven activities in Colorado. Volunteers, foster families, rescue organizations, and ordinary residents all participate. The state pet designation honored that collective effort with the same weight given to mountains and wildlife."
        link:
          label: "See Colorado state nickname"
          url: "/states/colorado/nickname/the-centennial-state"

