title: "Colorado State Pets | Shelter Dogs and Cats"
scientific_name: "Canis lupus familiaris & Felis catus"
adopted_year: 2013

seo_title: "Colorado State Pets | Shelter Dogs and Cats"
seo_description: "Colorado's state pets are Shelter Dogs and Cats, adopted in 2013. Learn why this official Colorado symbol was chosen and what it represents."

intro_text: "Shelter Dogs and Cats are the official Colorado state pets, designated in 2013. This page gives the direct answer for searches like 'colorado state pets', 'colorado state animal', and 'colorado state mammal' while explaining how the symbol fits the state's official animal designations. The only Colorado state symbol chosen to represent compassion toward domestic animals; central to the state's anti-puppy mill movement. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Shelter Dogs and Cats"
official_since: "2013"
status: "Millions in shelters nationwide annually; Colorado adoption rates improving year over year"
habitat_in_state: "Animal shelters and rescue organizations across Colorado, from Denver-metro facilities to rural county shelters"
known_for: "The only Colorado state symbol chosen to represent compassion toward domestic animals; central to the state's anti-puppy mill movement"

size: "Dogs: 6 inches to over 3 feet at the shoulder; Cats: typically 9–10 inches tall at the shoulder"
weight: "Dogs: 4–180+ pounds depending on breed; Cats: 7–15 pounds for most domestic breeds"
coloration: "Dogs and cats come in nearly every color combination—short, long, and wire-haired coats in black, brown, white, orange, gray, and blended patterns"
distinctive_traits: "No single physical trait defines shelter dogs or cats—they represent every size, breed, and appearance. What unites them is not how they look but where they are: waiting in a shelter for a home."

habitat: "Shelters, foster homes, and rescue organizations across all 64 Colorado counties"
range_in_state: "Denver Animal Shelter and Denver Dumb Friends League serve the largest population; county shelters operate in every region from the Front Range to the Western Slope"
