faq:
  - question: What is Colorado's state rock?
    answer: "Colorado's state rock is Yule marble, a pure white metamorphic rock adopted in 2004."
  - question: When did Colorado adopt Yule marble as its state rock?
    answer: "The Colorado General Assembly designated Yule marble the official state rock in 2004, after a petition from a Lakewood Girl Scout troop."
  - question: Why did Colorado choose Yule marble?
    answer: "Yule marble, quarried only near the town of Marble, supplied the stone for the Lincoln Memorial and the Tomb of the Unknown Soldier, giving Colorado a rock with national recognition."
  - question: Where can you find Yule marble in Colorado?
    answer: "Yule marble is quarried underground in the Yule Creek Valley, about 2.8 miles southeast of the town of Marble in Gunnison County."

