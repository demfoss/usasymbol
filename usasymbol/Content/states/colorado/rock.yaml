hero_image_caption: "Yule marble, Colorado's official state rock, is quarried near the town of Marble in the West Elk Mountains."
intro_text: "Colorado's state rock is Yule marble, adopted in 2004 after a Girl Scout troop petitioned the legislature to honor the pure white stone quarried near the town of Marble that built the Lincoln Memorial and the Tomb of the Unknown Soldier. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Colorado State Rock
    paragraphs:
      - "Yule marble is Colorado's official state rock, designated by the Colorado General Assembly in 2004. It is a metamorphic rock quarried only in the Yule Creek Valley near the town of Marble, and its purity and fine grain have made it one of the most sought-after building marbles in the country."
      - "Colorado earned this designation through the stone's national reach. Yule marble left the state to become the material of some of the nation's most recognized monuments."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Yule Marble?"
    paragraphs:
      - "Yule marble is a metamorphic rock formed when heat and pressure recrystallized an ancient limestone deposit into dense, interlocking calcite grains. The result is a stone that is close to 99.5 percent pure calcite, giving it an even white color with a soft, luminous quality when polished."
      - "Yule marble cuts and carves cleanly, with few of the veins or color streaks found in many other marbles. That purity, combined with its fine and uniform grain, separates it from most other building marbles quarried in the United States."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Colorado Chose Yule Marble as Its State Rock"
    paragraphs:
      - "Yule marble comes from a single deposit in the Yule Creek Valley, southeast of the town of Marble, and nowhere else. That deposit has supplied the stone for some of the country's most significant monuments, including the exterior of the Lincoln Memorial and the 57-ton block carved into the Tomb of the Unknown Soldier at Arlington National Cemetery."
      - "The stone's national visibility made it a natural choice to represent Colorado, giving the state a rock whose reach extends far beyond its own borders while still coming from one identifiable place inside them."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Yule Marble Became Colorado's State Rock"
    paragraphs:
      - "Yule marble became Colorado's official state rock in 2004 after Girl Scout Troop 357 of Lakewood petitioned the state legislature for the designation. Lawmakers approved the request, giving Colorado a state rock alongside its existing state mineral and gemstone."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Yule Marble Is Found in Colorado"
    paragraphs:
      - "Yule marble is quarried underground in the Yule Creek Valley, about 2.8 miles southeast of the town of Marble in Gunnison County, at an elevation near 9,300 feet. The deposit is worked by a single quarry that has supplied the stone since the early 20th century, with breaks in operation over the decades."
    sites:
      - name: Yule Marble Quarry
        city: Marble
        lat: 39.0360
        lng: -107.1683
        note: "Source of Colorado's Yule marble since the early 1900s"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Yule Marble Facts"
    facts:
      - "Adopted as Colorado's state rock in 2004."
      - "Yule marble is about 99.5 percent pure calcite, unusually pure for a building marble."
      - "The Lincoln Memorial and the Tomb of the Unknown Soldier were both built with Yule marble."
      - "The single block of Yule marble carved into the Tomb of the Unknown Soldier weighs 57 tons."

