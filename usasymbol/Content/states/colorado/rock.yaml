seo_title: "Colorado State Rock | Yule Marble"
seo_description: "Colorado's state rock is Yule marble, adopted in 2004. This pure white marble from the town of Marble built the Lincoln Memorial and the Tomb of the Unknown Soldier."
hero_image: /images/rocks/colorado/colorado-state-rock-hero.webp
