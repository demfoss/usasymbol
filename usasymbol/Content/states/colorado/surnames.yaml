seo:
  title: "Most Popular Last Names in Colorado — Hispano & Gold Rush"
  description: "The most common last names in Colorado are Smith, Garcia, and Johnson — reflecting a mix of Hispano families who predate statehood and Anglo settlers who arrived after the 1859 gold rush."

page:
  h1: "Most Common Last Names in Colorado"
  intro: "Two distinct surname traditions define the most common last names in Colorado: Hispano families in the San Luis Valley whose roots predate statehood, and Anglo-European settlers drawn by the 1859 Pikes Peak gold rush and the silver booms that followed."
  heritage_title: "Hispano Settlers and Mining-Era Europeans"
  heritage_body: "Hispano families from New Mexico established Colorado's oldest European communities in the San Luis Valley in the 1850s, leaving surnames like Martinez, Vigil, and Archuleta woven into county and town names. The 1859 Pikes Peak Gold Rush and later silver strikes drew English, Irish, German, and Italian workers to camps like Central City and Leadville, anchoring Anglo surnames across the Front Range."
  fun_fact: "San Luis, Colorado, founded in 1851, is the oldest continuously inhabited European settlement in the state and the birthplace of many Hispano surnames still common across the San Luis Valley today."

