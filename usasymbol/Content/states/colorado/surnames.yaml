unique_surnames:
  - name: "Archuleta"
    state_rank: 200
    national_rank: 1200 # UNVERIFIED
    origin: spanish
    why: "The Archuleta family were prominent Hispano leaders in Territorial Colorado; Archuleta County in southwest Colorado bears the family name. The surname is far more common in Colorado and New Mexico than in any other state."

  - name: "Vigil"
    state_rank: 105
    national_rank: 700 # UNVERIFIED
    origin: spanish
    why: "Vigil families settled Costilla and Conejos counties in the San Luis Valley as early as the 1840s under New Mexican land grants. The name appears at higher rates in Colorado than in any state outside New Mexico."

  - name: "Trujillo"
    state_rank: 135
    national_rank: 600 # UNVERIFIED
    origin: spanish
    why: "Trujillo families were among the earliest Hispano settlers in Costilla and Conejos counties, arriving in the 1850s as part of the New Mexican migration that established the San Luis Valley's first permanent communities."

  - name: "Espinosa"
    state_rank: 185
    national_rank: 500 # UNVERIFIED
    origin: spanish
    why: "Concentrated in the San Luis Valley and Pueblo, Espinosa families trace descent from early Hispano settlers from New Mexico. Pueblo's steel industry drew additional Hispanic migration in the early 20th century that reinforced the name's local presence."

etymology_groups:
  - type: "Hispano Patronymics"
    icon: fa-solid fa-sun
    description: "Spanish patronymic surnames dominate southern Colorado, reflecting Hispano families who migrated from New Mexico in the 1840s–1850s to settle the San Luis Valley. These names follow the Spanish pattern of 'son of [father's name]' and remain concentrated in Costilla, Conejos, and Huerfano counties today."
    examples:
      - Martinez (son of Martín)
      - Garcia (son of García)
      - Hernandez (son of Hernando)
      - Lopez (son of Lope)
      - Gonzalez (son of Gonzalo)

  - type: "Mining-Era Occupational"
    icon: fa-solid fa-hammer
    description: "The 1859 Pikes Peak Gold Rush and 1870s–1880s silver bonanzas drew tradesmen and laborers whose surnames reflect their trades. Central City, Leadville, and Cripple Creek mining camps were home to Smiths, Millers, and Taylors who settled permanently across the Front Range."
    examples:
      - Smith (metalworker)
      - Miller (mill operator)
      - Taylor (tailor)
      - Cooper (barrel maker)

  - type: "Welsh Patronymics"
    icon: fa-solid fa-mountain
    description: "Welsh miners were recruited for Colorado's coal fields in the 1880s–1900s, particularly in Huerfano and Las Animas counties. Surnames like Jones, Williams, Davis, and Thomas appear at disproportionately high rates in southern Colorado coal communities compared to the national average."
    examples:
      - Jones (son of Ioan)
      - Williams (son of Gwilym)
      - Davis (son of Dafydd)
      - Thomas (son of Tomos)

faq:
  - question: "What are the most common last names in Colorado?"
    answer: "The most common last names in Colorado are Smith, Johnson, Martinez, Garcia, and Williams. Smith ranks first statewide, but Colorado's upper ranks also show a strong Hispano surname presence."

  - question: "Why are Spanish last names so common in Colorado?"
    answer: "Spanish last names are common in Colorado because Hispano settlement in the San Luis Valley and southern counties predates statehood. That older New Mexico-to-Colorado settlement pattern helps keep names like Martinez, Garcia, Hernandez, Lopez, and Gonzalez highly visible."

