meaning: 'The Great Seal of the State of Colorado encodes the two defining facts about Colorado at statehood: its Rocky Mountain geography and the mining economy that made settlement possible. The Eye of Providence at the top and the motto *Nil Sine Numine* — Latin for "Nothing Without the Deity" — place the state''s founding under divine authority, while the shield''s snow-capped mountains and crossed mining tools anchor the design to the specific landscape and industry of 1876. Colorado entered the Union on August 1, 1876, exactly one hundred years after the Declaration of Independence, earning it the name the Centennial State.'
