intro_text: 'Colorado was admitted to the Union on August 1, 1876 — exactly one hundred years after the Declaration of Independence — and its state seal encodes that year directly above a shield that maps the state''s identity: Rocky Mountains and mining, under the Eye of Providence and the motto *Nil Sine Numine*, "Nothing Without the Deity."'
