seo_description: "Why is the Eye of Providence on the Colorado state seal? Colorado's seal pairs that divine symbol with three snow-capped Rocky Mountains, crossed pick and sledgehammer, and the motto Nil Sine Numine — Nothing Without the Deity — from its 1877 design."
