- id: facts
  icon: fa-solid fa-lightbulb
  title: Stegosaurus Facts
  facts:
  - "Colorado was the first state in the country to designate a state dinosaur, doing so in 1982 after a campaign organized by schoolchildren."
- "Stegosaurus was first named in 1877 by Othniel Charles Marsh from fossils found near Morrison, Colorado, the same town the Morrison Formation is named after."
- "The four tail spikes of Stegosaurus are called the thagomizer, a term coined in a 1982 Gary Larson Far Side cartoon and later adopted by paleontologists."
- "The bony back plates of Stegosaurus contained dense blood vessel networks, suggesting they may have flushed with blood for temperature control or visual signaling."
- "Stegosaurus armatus had a brain roughly the size of a walnut relative to its five-ton body, one of the smallest brain-to-body ratios of any dinosaur."

