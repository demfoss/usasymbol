faq:
- question: What is Colorado's state fossil?
  answer: "Colorado's state fossil is Stegosaurus (Stegosaurus armatus), the plated dinosaur of the Late Jurassic. The state legislature designated it in 1982, making Colorado the first state in the country to adopt a state dinosaur."
- question: When did Colorado adopt its state fossil?
  answer: "Colorado adopted Stegosaurus as its state fossil in 1982. The campaign was organized by Colorado schoolchildren who lobbied the state legislature directly."
- question: What did Stegosaurus look like?
  answer: "Stegosaurus was up to 30 feet long and weighed about five tons. It had a small head, short front legs, a high arched back carrying up to 17 bony plates, and four long tail spikes. Its plates stood up to two feet tall along the spine."
- question: Where are Stegosaurus fossils found in Colorado?
  answer: "Most Stegosaurus fossils come from the Morrison Formation. Dinosaur Ridge near Morrison is the original 1877 discovery site and is open to visitors. Garden Park near Canon City is the other major Colorado site, which produced dozens of specimens starting in the 1870s."
- question: When did Stegosaurus live?
  answer: "Stegosaurus lived during the Late Jurassic, about 155 to 150 million years ago. It went extinct before the end of the Jurassic period."
- question: Who pushed to make Stegosaurus Colorado's state fossil?
  answer: "Colorado schoolchildren organized the campaign in the early 1980s, lobbying the state legislature to designate Stegosaurus. Their effort succeeded in 1982, making Colorado the first state in the nation to adopt a state dinosaur."

