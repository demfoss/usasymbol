intro_text: "Colorado's state fossil is Stegosaurus (Stegosaurus armatus), the plated dinosaur first discovered near Morrison, Colorado in 1877, designated in 1982 after a campaign by Colorado schoolchildren. This profile appears in the [list of U.S. state fossils](/symbols/fossils)."

sections:
- id: overview
  icon: fa-solid fa-bone
  title: Colorado State Fossil
  paragraphs:
  - "Stegosaurus is Colorado's official state fossil, designated in 1982. Colorado was the first state in the country to adopt a state dinosaur, and the campaign to do so was driven by schoolchildren who lobbied the legislature for the designation. Stegosaurus armatus was first found in Colorado in 1877, and the Morrison Formation that runs through the state remains one of the richest sources of Stegosaurus material in the world."
  - "The most recognized feature of Stegosaurus is the double row of large bony plates along its back, paired with four pointed tail spikes. No other dinosaur looks quite like it."

- id: about
  icon: fa-solid fa-paw
  title: What the Stegosaurus Was
  paragraphs:
  - "Stegosaurus armatus was a large herbivore, reaching up to 30 feet long and weighing about five tons, roughly the size of a large African elephant. Despite its bulk, it stood low to the ground with a small head and a mouth suited to cropping ferns, cycads, and horsetails near the forest floor. It could not have reached high branches."
  - "Its back carried up to 17 alternating bony plates that stood vertically along the spine, reaching up to two feet tall on the largest individuals. Its tail ended in four spikes, each up to three feet long, now called the thagomizer by paleontologists. The plates were not armor. Studies of their internal structure show dense networks of blood vessels, suggesting the plates flushed with blood and functioned for temperature regulation or visual display."
  - "Stegosaurus had a very small brain relative to its body size. For decades, textbooks suggested it had a secondary nerve cluster near the hips to help control the rear of its body. That idea has been questioned, but the hip region did contain a large nerve cavity, the function of which is still debated."

- id: history
  icon: fa-solid fa-landmark
  title: How Stegosaurus Became Colorado's State Fossil
  paragraphs:
  - "Stegosaurus was named by paleontologist Othniel Charles Marsh in 1877, based on fossils collected from Morrison, Colorado. The discovery came during the height of the Bone Wars, the competitive rivalry between Marsh and Edward Drinker Cope that drove a decade of explosive dinosaur discovery across the American West. Colorado was at the center of that rush, and Stegosaurus was one of its most dramatic finds."
  - "The campaign to make Stegosaurus Colorado's state fossil was organized by schoolchildren in the early 1980s. Students across the state lobbied the legislature directly, and in 1982 Colorado became the first state in the country to officially designate a state dinosaur. The designation recognized not just the animal's fame but Colorado's central role in the history of North American paleontology."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Stegosaurus Fossils Are Found in Colorado
  paragraphs:
  - "The Morrison Formation, a layer of Late Jurassic sedimentary rock named for the town of Morrison, Colorado, runs through much of the state and contains the bulk of Colorado's dinosaur fossils. Dinosaur Ridge, just west of Denver near Morrison, is where the original 1877 Stegosaurus bones were found. The exposed rock face at Dinosaur Ridge is open to the public and still shows fossil bones in place."
  - "Garden Park, north of Cañon City in Fremont County, is the other major Colorado site. Excavations there from the 1870s through the early twentieth century produced dozens of Stegosaurus specimens along with Allosaurus, Camarasaurus, and other Morrison dinosaurs. The Denver Museum of Nature and Science holds a significant Colorado Stegosaurus collection."
