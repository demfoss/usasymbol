seo_description: "Colorado state symbols: the Rocky Mountain columbine, lark bunting, Colorado blue spruce, bighorn sheep, and Centennial State nickname."
snippet_answer: Colorado's Rocky Mountain columbine is one of the most distinctive official state symbols in the country — a high-altitude wildflower that sets the tone for a list built around mountain and plains life. The lark bunting, Colorado blue spruce, bighorn sheep, red-C flag, and Centennial State nickname complete the picture of a state that spans Great Plains and Rocky Mountain country.
