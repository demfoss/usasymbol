name_meaning:
  heading: What Does Colorado Mean?
  paragraphs:
  - Colorado is the 38th U.S. state, admitted to the Union on August 1, 1876. Its name comes from Spanish, where colorado means colored red, reddish, or ruddy.
  - Spanish explorers used the name for the Colorado River because of the red-tinted sediment in its water. The territory and then the state took the name from that river, even though the modern state of Colorado does not contain the Grand Canyon stretch most strongly associated with the river today.
  - Colorado's official nickname is the Centennial State, with Colorful Colorado and Rocky Mountain State also widely used. Its postal abbreviation is CO, and residents are Coloradans.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From Spanish colorado, meaning colored red, reddish, or ruddy.
    - label: River connection
      text: The name was first associated with the Colorado River because of red sediment in the water.
    - label: Statehood
      text: Colorado became the 38th state in 1876, the United States centennial year.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Colorado, a Mountain West state spanning the Rockies, Front Range, high plains, and western slope.
    - label: River
      text: Also used for the Colorado River, whose Spanish name gave the state its name.
    - label: Territory
      text: Colorado Territory was organized in 1861 during the mining boom.
    - label: People
      text: People from Colorado are called Coloradans.
  - heading: Nicknames and Short Forms
    items:
    - label: Centennial State
      text: Official nickname from Colorado's 1876 admission during the U.S. centennial year.
    - label: Colorful Colorado
      text: Popular tourism phrase tied to mountains, red rock, blue sky, and seasonal color.
    - label: Rocky Mountain State
      text: Informal nickname pointing to the Rockies as Colorado's dominant public image.
    - label: Abbreviation
      text: CO; older short form Colo.
editorial:
  heading: What Colorado's Symbols Say About the State
  paragraphs:
  - "The [state flag](/states/colorado/flag) compresses much of Colorado into one design: a red C for Colorado, centennial, and columbine; a gold disk for mining and sunshine; blue for sky; and white for snow and silver. It is more local than a seal-on-blue flag because the parts are tied to Colorado's name and landscape."
  - The [Rocky Mountain columbine](/states/colorado/flower), [Colorado blue spruce](/states/colorado/tree), and [Rocky Mountain bighorn sheep](/states/colorado/mammal/rocky-mountain-bighorn-sheep) all reinforce the alpine side of the state. They make sense for a place whose public identity is built around high country, snow, cliffs, and mountain forests.
  - The [lark bunting](/states/colorado/bird) keeps the symbol set from becoming only a mountain story. It gives the eastern plains a place beside the Rockies, while [shelter dogs and cats](/states/colorado/mammal/shelter-dogs-and-cats) bring in a modern civic value rather than a wild landscape emblem.
faq:
- question: What is Colorado's most famous state symbol?
  answer: The [Colorado state flag](/states/colorado/flag) is one of the state's most recognizable symbols because of its red C, gold disk, and blue-white-blue stripes.
- question: What is Colorado's state bird?
  answer: Colorado's state bird is the [lark bunting](/states/colorado/bird), adopted in 1931 after supporters argued for a plains symbol.
- question: What is Colorado's state flower?
  answer: Colorado's state flower is the [Rocky Mountain columbine](/states/colorado/flower), adopted in 1899 after a schoolchildren's campaign.
- question: Why is Colorado called the Centennial State?
  answer: Colorado is called the Centennial State because it joined the Union in 1876, the centennial year of the United States. The nickname is covered on the [Colorado nickname](/states/colorado/nickname) page.
- question: How many official state symbols does Colorado have?
  answer: Colorado's state symbols list here includes the flag, columbine, lark bunting, blue spruce, motto, nickname, bighorn sheep, and shelter pet symbols.
