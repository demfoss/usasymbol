sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Colorado?
    paragraphs:
      - "The western tiger salamander is Colorado's official state amphibian, designated by the Colorado Legislature in 2012. Its scientific name is Ambystoma mavortium."
      - "It is found across much of Colorado, from grasslands and prairies to mountain ponds, and is one of the state's most widespread amphibians."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Western Tiger Salamander
    paragraphs:
      - "The western tiger salamander has a thick body with dark brown to black skin marked by irregular yellow or olive blotches, giving it a tiger-like pattern."
      - "Adults can grow to more than a foot long, making it one of the largest salamander species that lives on land in North America."
      - "It spends most of its adult life underground in burrows and only returns to water to breed."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Colorado Legislature designated the western tiger salamander the official state amphibian in 2012, following a campaign led by Colorado students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Colorado Chose the Western Tiger Salamander
    paragraphs:
      - "The western tiger salamander is found throughout Colorado in a wide range of habitats, from the eastern plains to high mountain ponds, making it a fitting representative of the state's amphibian life."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Western Tiger Salamander
    paragraphs:
      - "The western tiger salamander lives across nearly all of Colorado, including prairie ponds on the eastern plains and high-elevation lakes in the Rocky Mountains."
