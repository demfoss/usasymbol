seo_description: The Colorado state fish is the greenback cutthroat trout, adopted in 1994. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/colorado/colorado-fish-hero.webp
hero_image_alt: A greenback cutthroat trout with a greenish back, dark spots, and a red slash under its jaw, swimming over a rocky stream bed.
hero_image_caption: The greenback cutthroat trout is a rare native trout that lives in Colorado's mountain streams.
intro_text: Colorado's state fish is the greenback cutthroat trout, a rare native trout of the Rocky Mountains, adopted in 1994. People once thought it had gone extinct. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Colorado?
  paragraphs:
  - The greenback cutthroat trout is Colorado's official state fish. State lawmakers made it official in March 1994. Its scientific name is Oncorhynchus clarkii stomias.
  - It is native to the South Platte River basin in northeastern Colorado.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Greenback Cutthroat Trout
  paragraphs:
  - The greenback cutthroat trout is named for its greenish back. Like all cutthroat trout, it has a bright red or orange slash on each side of its throat, under the lower jaw.
  - Its body is covered with dark spots, which are thicker toward the tail.
  - It lives in cold, clear mountain streams. Fish found in one recent survey were about 12 inches long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Colorado General Assembly passed a law that made the greenback cutthroat trout the state fish, and the law took effect on March 15, 1994.
  - From 1954 until 1994, many people thought of the rainbow trout as the state fish. But the rainbow trout was never adopted officially.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Colorado Chose the Greenback Cutthroat Trout
  paragraphs:
  - The state law names the fish but does not give a detailed reason.
  - State sources point out that the greenback is a native Colorado trout. They also note it nearly disappeared after mining and settlement in the 1800s damaged many mountain streams.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Greenback Cutthroat Trout
  paragraphs:
  - The greenback once lived in many mountain streams across its home range. In 2012, researchers found the only known wild population of pure greenbacks in a short stretch of Bear Creek near Colorado Springs.
  - Biologists use fish from Bear Creek to bring the trout back to its old waters. In 2022, the state confirmed that greenbacks were breeding on their own in Herman Gulch in Clear Creek County.
