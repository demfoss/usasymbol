- id: facts
  icon: fa-solid fa-lightbulb
  title: Greenback Cutthroat Trout Facts
  facts:
  - Adopted in 1994 by the Colorado Legislature.
  - Its scientific name is Oncorhynchus clarkii stomias.
  - It is native to the South Platte River basin.
  - Biologists once thought it was extinct, but it survived in Bear Creek.
  - The Bear Creek fish were probably brought there in the 1870s or 1880s by an innkeeper who stocked ponds for his guests.
faq:
- question: What is Colorado's state fish?
  answer: Colorado's state fish is the greenback cutthroat trout. It is a rare trout native to the state's mountain streams.
- question: When did Colorado adopt the Greenback cutthroat trout?
  answer: The Colorado Legislature made the greenback cutthroat trout the state fish in 1994. The law took effect on March 15 of that year.
- question: Why did Colorado choose the Greenback cutthroat trout?
  answer: The state law does not give a detailed reason. State sources say it is a native Colorado trout that almost disappeared.
- question: Was the rainbow trout ever Colorado's state fish?
  answer: Not officially. People thought of the rainbow trout as the state fish from 1954 to 1994, but it was never adopted by law.
- question: Is the greenback cutthroat trout extinct?
  answer: No. People once believed it was extinct, but a pure population turned up in Bear Creek near Colorado Springs. Biologists have since helped it breed again in the wild at Herman Gulch.
