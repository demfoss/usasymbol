title: "Nil Sine Numine"
language: "Latin"
english_translation: "Nothing Without Providence"
adopted_year: 1861

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Colorado State Motto: Nil Sine Numine"
seo_description: "Colorado's motto 'Nil Sine Numine' means 'Nothing Without Providence' — but you'll also see 'Nothing Without the Deity.' The Latin word 'numen' is the key: not simply 'God' but a classical Roman concept of divine will. The Eye of Providence on the state seal reinforces the meaning. Full history."

intro_text: "Colorado's official motto is <strong>Nil Sine Numine</strong> — Latin for <em>Nothing Without Providence</em>. The phrase appeared on Colorado's territorial seal when Congress created the territory on February 28, 1861, and it carried over unchanged when Colorado became the 38th state in 1876. The motto is one of five U.S. state mottos referencing God or divine power — but it is the only one that uses the classical Roman term <em>numen</em> rather than 'Deus' or 'God.'"

sections:
  - id: "numine-not-deus"
    icon: "fa-solid fa-scroll"
    title: "'Nothing Without Providence' — What 'Numen' Actually Means"
    paragraphs:
      - "Five U.S. states reference God or divine authority in their mottos. Most use plain language: Florida's 'In God We Trust,' Ohio's 'With God, All Things Are Possible,' South Dakota's 'Under God the People Rule,' Arizona's 'Ditat Deus' (God Enriches). Colorado does it differently: <em>numine</em> is not the Latin word for God ('Deus'). It comes from 'numen,' a classical Roman concept describing divine will, divine spirit, or the power that animates the natural world."
      - "Virgil and Cicero used 'numen' to describe an immanent divine force rather than a personal deity. It suggests that the universe operates under a governing will — whether you read that as divine providence, divine authority, or the force that makes things possible. This is why Colorado's official translation is 'Nothing Without Providence' rather than 'Nothing Without God.' The word was a deliberate theological choice rooted in classical learning."
      - "Some sources still translate it as 'Nothing Without the Deity,' which is looser but not wrong. The ambiguity is probably intentional for a territory designed to attract settlers of many backgrounds — the word covers religious frameworks from Christianity to more philosophical interpretations."

  - id: "eye-of-providence"
    icon: "fa-solid fa-eye"
    title: "The Eye of Providence on Colorado's Seal"
    paragraphs:
      - "The motto doesn't stand alone on Colorado's seal. At the top of the circular design sits the Eye of Providence — a triangle with an all-seeing eye inside, the same symbol that appears on the reverse of the U.S. dollar bill and on the reverse of the Great Seal of the United States. On Colorado's seal, it reinforces the motto visually: divine oversight watches over the state."
      - "Below the Eye of Providence, the seal shows a shield with three snow-capped mountains and a mining pick and shovel (representing the 1859 Pike's Peak Gold Rush), a bald eagle at the top of the shield, fasces (Roman symbols of civic authority) on the sides, and 'Nil Sine Numine' on a banner ribbon at the bottom. The religious symbolism and the civic symbolism sit together deliberately."

  - id: "territory-to-centennial-state"
    icon: "fa-solid fa-landmark"
    title: "1861 Territory, 1876 Statehood — Same Motto"
    paragraphs:
      - "Congress created Colorado Territory on February 28, 1861 — just before the Civil War began. Lewis Ledyard Weld served as the first territorial secretary and oversaw the creation of the territorial seal. No historical record identifies who chose 'Nil Sine Numine' specifically. It appeared on the seal from the beginning."
      - "The Pike's Peak Gold Rush had started in 1858, pulling tens of thousands of miners into the region. By 1861, Colorado had enough population for territorial status. The motto about nothing being possible without divine guidance made practical sense to settlers dealing with 14,000-foot mountain passes, harsh winters, and the uncertainties of mining life."
      - "Colorado became the 38th state on August 1, 1876 — exactly 100 years after the Declaration of Independence, which is why the state's nickname is The Centennial State. The state constitution carried over the territorial seal without modification. 'Nil Sine Numine' was never debated or voted on separately — it simply continued."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Colorado State Motto Facts"
    style: "gradient"
    facts:
      - "'Numen' in classical Latin means divine will or spirit, not simply 'God' — making Colorado's motto more philosophical than most God-referencing mottos."
      - "The Eye of Providence on Colorado's seal mirrors the symbol on the U.S. dollar bill."
      - "No historical record names who chose 'Nil Sine Numine' for the 1861 territorial seal."
      - "Colorado became a state on August 1, 1876 — 100 years after American independence — earning it 'The Centennial State' nickname."
      - "The motto has been in continuous use since 1861 with no attempt to change or replace it."
      - "Colorado Revised Statutes describes the seal and motto — no separate motto statute was ever passed."

faq:
  - question: "What is Colorado's state motto?"
    answer: "Colorado's state motto is 'Nil Sine Numine,' a Latin phrase officially translated as 'Nothing Without Providence.' It has appeared on Colorado's seal since 1861 when the territory was created."

  - question: "What does 'Nil Sine Numine' mean in English?"
    answer: "The official translation is 'Nothing Without Providence.' Some sources use 'Nothing Without the Deity,' but Colorado's official state government uses 'Providence.' The key word is 'numen' — a classical Latin term for divine will or spirit, broader than simply 'God.'"

  - question: "Is Colorado's motto 'Nothing Without God' or 'Nothing Without Providence'?"
    answer: "The official Colorado translation is 'Nothing Without Providence.' The Latin word 'numine' comes from 'numen' — the classical Roman concept of divine will — rather than 'Deus,' which means God directly. 'Providence' is the more accurate rendering of 'numen' in English."

  - question: "When did Colorado adopt its motto?"
    answer: "The motto appeared on Colorado's territorial seal when Congress created the territory on February 28, 1861. It carried over automatically when Colorado became the 38th state on August 1, 1876. No separate legislative vote established it as the state motto — it's codified through the state seal description in Colorado Revised Statutes."

  - question: "What appears on Colorado's state seal alongside the motto?"
    answer: "The Eye of Providence (a triangle with an all-seeing eye) at the top, a shield with three snow-capped mountains and mining tools, a bald eagle, Roman fasces on the sides, and 'Nil Sine Numine' on a banner ribbon at the bottom. The Eye of Providence visually reinforces the motto's meaning."

  - question: "Is Colorado's motto in Latin?"
    answer: "Yes. 'Nil Sine Numine' is Latin — 'nil' means 'nothing,' 'sine' means 'without,' and 'numine' is the ablative form of 'numen,' meaning divine will or providence."

