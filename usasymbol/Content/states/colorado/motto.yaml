faq:
  - question: "What is Colorado's state motto?"
    answer: "Colorado's state motto is \"Nil Sine Numine,\" a Latin phrase meaning \"Nothing Without the Deity.\" It has appeared on the Colorado state seal since 1877."

  - question: "What does \"Nil Sine Numine\" mean?"
    answer: "\"Nil Sine Numine\" is Latin for \"Nothing Without the Deity\" or \"Nothing Without Divine Providence.\" The phrase asserts that nothing can be achieved without divine guidance."

  - question: "What is the English translation of \"Nil Sine Numine\"?"
    answer: "The standard translation is \"Nothing Without the Deity.\" Some sources give \"Nothing Without Providence\" or \"Nothing Without God.\" The variation comes from the Latin word numen, which can mean divine will, divine power, or a deity."

  - question: "When did Colorado adopt its state motto?"
    answer: "The motto was chosen at Colorado's constitutional convention of 1875–1876. The first state legislature formally adopted it as part of the Great Seal in 1877."

