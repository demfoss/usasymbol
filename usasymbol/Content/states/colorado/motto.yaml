seo_title: "Colorado State Motto | Nil Sine Numine"
seo_description: "Colorado's state motto is \"Nil Sine Numine,\" Latin for \"Nothing Without the Deity.\" It appears on the state seal adopted by the first legislature in 1877."

intro_text: "Colorado's state motto is <strong>Nil Sine Numine</strong>, a Latin phrase meaning <em>Nothing Without the Deity</em>. Chosen at Colorado's constitutional convention of 1875–1876, it has appeared on the state seal since 1877 — making it one of the few American state mottos with an explicit theological claim."

