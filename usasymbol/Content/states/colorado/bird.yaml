title: Lark Bunting
scientific_name: Calamospiza melanocorys
adopted_year: 1931
legislation: Colo. Rev. Stat. 24-80-910
meaning: Colorado's state bird is best understood as a successful plains campaign. The Lark Bunting became official in 1931 not because it was the obvious statewide favorite, but because supporters argued that Colorado needed one emblem that pointed east across the prairie, not only up toward the Rockies.
author: USA Symbol Team
date_published: '2024-01-15'
date_modified: "2026-05-02"
seo_title: "Colorado State Bird | Lark Bunting"
seo_description: "Colorado adopted the Lark Bunting in 1931 after a successful push for a plains bird, not just a mountain symbol."
intro_text: Colorado's state bird is the <strong>Lark Bunting</strong>, adopted on <strong>April 29, 1931</strong> and now listed in <strong>Colo. Rev. Stat. 24-80-910</strong>. What makes the choice useful is that it was not just a routine favorite-bird vote. Supporters had to argue for a plains species in a state more often imagined through mountains, and that campaign is the real reason the symbol still stands out.
