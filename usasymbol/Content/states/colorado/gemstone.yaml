  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Aquamarine Facts"
    facts:
      - "Adopted as Colorado's state gemstone in 1971."
      - "Prospectors first found gem aquamarine near the summit of Mount Antero in 1880."
      - "Mount Antero, at 14,269 feet, is one of the highest-elevation gem localities in North America."
      - "Colorado's mineral, rock, and gemstone symbols, rhodochrosite, Yule marble, and aquamarine, read red, white, and blue, matching the national flag."

