faq:
  - question: What is Colorado's state gemstone?
    answer: "Colorado's state gemstone is aquamarine, a pale blue to blue-green variety of beryl adopted in 1971."
  - question: When did Colorado adopt aquamarine as its state gemstone?
    answer: "The Colorado General Assembly designated aquamarine the official state gemstone on April 30, 1971."
  - question: Why did Colorado choose aquamarine?
    answer: "Gem-quality aquamarine has been collected from Mount Antero and neighboring White Mountain since 1880, making it one of the highest-elevation gem localities in North America."
  - question: Where can you find aquamarine in Colorado?
    answer: "Mount Antero, in the Sawatch Range near Buena Vista, is Colorado's best-known aquamarine site, with crystals collected from granite pockets above 13,000 feet."

