intro_text: "Colorado's state gemstone is aquamarine, adopted in 1971 to recognize the pale blue beryl gem that prospectors have collected from the summit area of Mount Antero, one of the highest gem localities in North America, since 1880. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Colorado State Gemstone
    paragraphs:
      - "Aquamarine is Colorado's official state gemstone, designated by the Colorado General Assembly in 1971. It is a blue to blue-green variety of the mineral beryl, and Colorado's finest specimens come from the upper slopes of Mount Antero in Chaffee County."
      - "Colorado stands out for producing gem aquamarine at extreme elevation, with crystals collected above 13,000 feet in some of the harshest gem-hunting conditions in the country."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Aquamarine?"
    paragraphs:
      - "Aquamarine is a variety of beryl colored pale blue to blue-green by traces of iron. It forms as six-sided hexagonal crystals, often growing long and slender, and clear, well-formed pieces are cut into faceted gems for jewelry."
      - "Colorado's aquamarine grows in pockets within granite at high elevation, where cold temperatures and thin air make collecting difficult. The best crystals are transparent with an even, pale blue color, though many specimens from Mount Antero are pale or included with other minerals."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Colorado Chose Aquamarine as Its State Gemstone"
    paragraphs:
      - "Mount Antero and neighboring White Mountain, both above 13,000 feet in the Sawatch Range, have produced gem aquamarine since prospectors first found crystals near the summit in 1880. The peaks remain one of the highest-elevation gem localities in North America, drawing collectors willing to work pockets exposed by frost and thin mountain air."
      - "Naming aquamarine the state gemstone gave Colorado a gem tied to a specific, still-active collecting site inside its own mountains, rather than a stone imported from elsewhere. The choice also completed a matching set with the state's mineral and rock symbols; rhodochrosite, Yule marble, and aquamarine read red, white, and blue."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Aquamarine Became Colorado's State Gemstone"
    paragraphs:
      - "The Colorado General Assembly named aquamarine the official state gemstone, and the designation took effect on April 30, 1971."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Aquamarine Is Found in Colorado"
    paragraphs:
      - "Mount Antero, in the Sawatch Range southwest of Buena Vista, is Colorado's best-known aquamarine locality and one of the highest gem-collecting sites in the country at 14,269 feet. Neighboring White Mountain has also produced gem-quality crystals from the same granite pegmatite pockets."
    sites:
