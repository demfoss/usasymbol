faq:
- question: What is Colorado's state soil?
  answer: "Colorado's state soil is the Seitz series, a very rocky mountain soil found on steep forested slopes between 7,500 and 12,000 feet in south-central and southwestern Colorado. It covers about 350,000 acres across 17 counties. Colorado's Legislature has not passed a formal law making it official."
- question: Why is it called Seitz soil?
  answer: "The series is named after the Seitz stream near where soil scientists first described it in 1972, about 11 miles southwest of Monte Vista in Rio Grande County, Colorado."
- question: What color is Seitz soil?
  answer: "The surface layer is dark gray — almost black when wet — from organic matter. Below that is a pinkish gray eluvial layer where iron and clay have been washed out. The subsoil is brown, packed with angular rock fragments. The overall profile is pale at mid-depth and darker at the top and bottom."
- question: Where is Seitz soil found in Colorado?
  answer: "Seitz soil is found on the steep mountain slopes of south-central and southwestern Colorado, including Rio Grande, Saguache, Mineral, and Hinsdale counties. It covers about 350,000 acres across 17 counties at elevations of 7,500 to 12,000 feet."
- question: What grows in Seitz soil?
  answer: "Seitz soil supports Engelmann spruce, subalpine fir, and Rocky Mountain Douglas-fir forests. It is not used for crops — the slopes are too steep, the soil too rocky, and the growing season too short. Some gentler areas support summer cattle and sheep grazing."
- question: Who chose Seitz as Colorado's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Seitz series as Colorado's representative state soil. Colorado's Legislature has not passed a formal law making it an official state symbol."
- question: How cold and steep is Seitz soil?
  answer: "Very cold and very steep. Elevations run from 7,500 to 12,000 feet, with slopes up to 65 percent. The frost-free growing season lasts only 40 to 80 days per year — one of the shortest of any state soil in the country. Mean annual temperatures range from 32 to 44°F."

