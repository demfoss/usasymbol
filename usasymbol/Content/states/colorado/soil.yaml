name: Seitz Soil Series
adopted_year: ~
is_official: false
meaning: "Seitz soil is Colorado's mountains. It covers the steep forested slopes of the southern Rockies — the same slopes that feed Colorado's rivers, hold the snowpack that supplies water to seven western states, and draw millions of visitors to hike, ski, and camp every year. Unlike most state soils, Seitz is not farmland. It sits under a canopy of Engelmann spruce and subalpine fir at elevations where frost can come any month and rocky ground makes a plow useless. It was chosen to represent Colorado because it represents what Colorado actually is: high, rugged, forested, and built on ancient rock."
meaning_title: Meaning of the Seitz Soil Series
meaning_after_section: history
author: USA Symbol Team
date_published: "2025-12-02"
date_modified: "2026-05-24"
seo_title: "Colorado State Soil | Seitz Series"
seo_description: "The Colorado state soil is the Seitz series, established in 1972. It covers 350,000 mountain acres and supports Engelmann spruce and subalpine fir forests."
hero_image: /images/soils/colorado/red-mountain-pass-engelmann-spruce.jpg
hero_image_alt: Engelmann spruce forest on a steep mountain slope below Red Mountain Pass in Colorado
hero_image_caption: Engelmann spruce on a steep slope below Red Mountain Pass in southwestern Colorado. Rocky, high-elevation forested terrain like this is the natural setting of Seitz soil.
intro_text: "Colorado's state soil is the Seitz series — a very deep, rocky mountain soil found on steep forested slopes between 7,500 and 12,000 feet in south-central and southwestern Colorado, covering about 350,000 acres across 17 counties. The series was first described in 1972 near Monte Vista in Rio Grande County, and named after a nearby stream."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Colorado State Soil
  paragraphs:
  - "The Seitz soil series is Colorado's recognized state soil. It sits on the steep hill and mountain slopes of the southern Rocky Mountains — ground covered in Engelmann spruce, subalpine fir, and Rocky Mountain Douglas-fir, at elevations where the growing season lasts as few as 40 days."
  - "Seitz soil is full of rocks. The technical classification calls it 'clayey-skeletal' — more than 35 percent of the soil volume is rock fragments, pieces broken from the surrounding peaks of granite, gneiss, schist, rhyolite, and basalt. Those fragments work their way downhill over centuries, mixing into the soil as colluvium. The result is a soil that is deep, well-drained, and too rocky and steep for any plow."

- id: history
  icon: fa-solid fa-landmark
  title: Why Colorado Chose the Seitz Soil
  paragraphs:
  - "Soil scientists at the USDA Natural Resources Conservation Service selected the Seitz series to represent Colorado because it captures the landscape that defines the state: the forested, high-elevation mountain slopes of the southern Rockies. More than two-thirds of Colorado sits above 6,000 feet, and the Seitz series covers the mountain heart of that terrain."
  - "The Seitz series was first established in 1972 in Rio Grande County, where the type location sits about 11 miles southwest of Monte Vista. It takes its name from the Seitz stream near the original description site."
  - "Colorado's Legislature has not passed a formal law designating a state soil. The Seitz series is recognized by the USDA as Colorado's representative state soil, chosen by Colorado soil scientists to represent the mountain landscape that most defines the state's geography, economy, and identity."

- id: profile
  icon: fa-solid fa-layer-group
  title: Seitz Soil Profile and Horizons
  paragraphs:
  - "Digging into Seitz soil means working around rocks — constantly. Below a thin mat of organic duff from fallen needles and decaying wood, the soil darkens for a few inches, then fades to a pale, washed-out gray before dropping into a brown clay zone packed with angular rock fragments. Every horizon is stony. The deeper you go, the more rocks there are."
  layers:
  - horizon: Oi / Oe
    name: Forest duff
    depth_in: "0–4"
    color_hex: "#3B2A1A"
    color_name: very dark brown
    texture: slightly to moderately decomposed spruce and fir needles
    note: protects soil from erosion; breaks down slowly in cold
  - horizon: A
    name: Surface mineral layer
    depth_in: "4–6"
    color_hex: "#4A4540"
    color_name: dark gray
    texture: very stony loam
    note: thin; dark from organic matter; already full of rock fragments
  - horizon: E
    name: Eluvial layer
    depth_in: "6–13"
    color_hex: "#CAB8A8"
    color_name: pinkish gray
    texture: very stony very fine sandy loam
    note: iron and clay leach out; pale color is what remains
  - horizon: Bt
    name: Argillic subsoil
    depth_in: "18–36"
    color_hex: "#8B6E4A"
    color_name: brown
    texture: very stony clay
    note: argillic horizon; rock fragments exceed half the volume
  - horizon: C
    name: Parent material
    depth_in: "36–64"
    color_hex: "#9A7040"
    color_name: brown
    texture: extremely stony clay loam
    note: colluvium from peaks of granite, gneiss, schist, rhyolite, basalt

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Seitz Soil Grows in Colorado
  paragraphs:
  - "Seitz soil covers about 350,000 acres across 17 counties in south-central and southwestern Colorado — the mountain terrain of the San Juan Mountains, the Rio Grande headwaters, and the ranges of the southern Rockies."
  - "Slopes range from 2 to 65 percent, and elevations run from 7,500 to 12,000 feet. The soil forms on hill and mountain sideslopes where colluvium — rock and soil material that slowly slides and creeps downhill — gathers over centuries."
  - "The series is found in Colorado and extends into northern New Mexico. Within Colorado, the core area is the southern Rocky Mountains, where ancient igneous and metamorphic peaks shed the rock fragments that become Seitz soil."
  counties:
  - Rio Grande County
  - Saguache County
  - Mineral County
  - Hinsdale County

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Seitz Soil
  paragraphs:
  - "Seitz soil does not support farming. The slopes are too steep, the rocks too numerous, the growing season too short — only 40 to 80 frost-free days per year. Instead, this soil holds some of Colorado's most important forests: Engelmann spruce, subalpine fir, and Rocky Mountain Douglas-fir."
  - "These forests sit at the headwaters of major river systems. The snowpack that accumulates on Seitz soil slopes through winter melts slowly into the Rio Grande, Arkansas, and other rivers that supply water to Colorado cities and seven downstream states. In this sense, Seitz soil is one of Colorado's most critical natural resources — not for what it grows, but for what it holds."
  - "Most land on Seitz soil is managed for forestry, wildlife habitat, and outdoor recreation. Skiing, hiking, hunting, and fishing are the main economic uses. Some gentler Seitz slopes support native pastureland used for summer grazing by cattle and sheep."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Seitz Soil Facts
  facts:
  - "The Seitz series was first established in Rio Grande County, Colorado in 1972. The type location is about 11 miles southwest of Monte Vista."
  - "The name comes from the Seitz stream near the original description site in Rio Grande County."
  - "Coverage: about 350,000 acres in 17 counties of south-central and southwestern Colorado."
  - "Elevation: 7,500 to 12,000 feet — one of the highest elevation ranges of any state soil in the United States."
  - "Frost-free period: only 40 to 80 days per year — shorter than any other U.S. state soil."
  - "The soil is classified as a Cryalf — a cold-climate Alfisol. The prefix 'cryo' means ice or frost, reflecting the freezing temperatures that define this soil's environment."
  - "Colorado's Legislature has not passed a formal law designating a state soil. The Seitz series is recognized by the USDA Natural Resources Conservation Service as Colorado's representative state soil."

