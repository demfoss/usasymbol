faq:
  - question: What is Colorado's state mineral?
    answer: "Colorado's state mineral is rhodochrosite, a rose-red to pink manganese carbonate mineral adopted in 2002."
  - question: When did Colorado adopt rhodochrosite as its state mineral?
    answer: "The Colorado General Assembly designated rhodochrosite the official state mineral in 2002, and Governor Bill Owens signed the bill that April."
  - question: Why did Colorado choose rhodochrosite?
    answer: "The Sweet Home Mine near Alma produced some of the finest rhodochrosite crystals ever found, including the Alma King, discovered in 1992 and still the largest fine rhodochrosite crystal on record."
  - question: Is Colorado rhodochrosite valuable?
    answer: "Sharp, well-formed crystals from the Sweet Home Mine are highly valued by mineral collectors and museums. Massive, banded rhodochrosite without distinct crystal faces is far more common and much less valuable."

