intro_text: "Colorado's state mineral is rhodochrosite, adopted in 2002 to recognize the deep red manganese carbonate that miners at the Sweet Home Mine turned from a silver-mining nuisance into some of the finest crystal specimens in the world. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Colorado State Mineral
    paragraphs:
      - "Rhodochrosite is Colorado's official state mineral, designated by the Colorado General Assembly in 2002. It is a manganese carbonate that forms in hydrothermal veins, and Colorado's most famous specimens came out of the Sweet Home Mine above Alma."
      - "Lawmakers chose rhodochrosite because Colorado produced some of the finest crystals of the mineral ever found anywhere, a claim few other states could make about a mineral tied to their own ground."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Rhodochrosite?"
    paragraphs:
      - "Rhodochrosite is a manganese carbonate mineral, ranging from pale pink to a deep rose red, sometimes banded with streaks of white or light brown. Well-formed crystals grow as rhombohedrons, the same slanted-cube shape common to carbonate minerals like calcite."
      - "Rhodochrosite forms in hydrothermal veins, where manganese-rich fluids deposit the mineral in cracks and open pockets underground. Massive banded material is common and inexpensive, but sharp, gem-quality crystals like Colorado's are rare and valued by collectors."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Colorado Chose Rhodochrosite as Its State Mineral"
    paragraphs:
      - "For most of its history, the Sweet Home Mine near Alma was a silver operation, and miners treated the rhodochrosite mixed into the ore veins as waste that fouled the silver-refining process. That changed as collectors began to recognize the crystals for what they were, some of the finest rhodochrosite specimens on Earth."
      - "In 1992, a mining crew working the old Sweet Home workings uncovered the Alma King, a rhodochrosite crystal more than 16 centimeters across and the largest fine rhodochrosite ever documented. Colorado lawmakers Ken Chlouber and a State House colleague sponsored the bill naming rhodochrosite the state mineral in 2002, and Governor Bill Owens signed it that April."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Rhodochrosite Became Colorado's State Mineral"
    paragraphs:
      - "State lawmakers designated rhodochrosite the official state mineral in 2002, a decade after the Alma King discovery renewed public attention on the Sweet Home Mine's crystals."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Rhodochrosite Is Found in Colorado"
    paragraphs:
      - "The Sweet Home Mine, on the southern slope of Mount Bross near Alma in Park County, produced the rhodochrosite specimens that made Colorado's reputation among mineral collectors. The mine is on private land and is no longer open to the public, but specimens it produced are held in museum and private collections worldwide."
    sites:
