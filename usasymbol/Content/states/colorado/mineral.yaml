  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Rhodochrosite Facts"
    facts:
      - "Adopted as Colorado's state mineral in 2002."
      - "The Alma King, found at the Sweet Home Mine in 1992, is the largest fine rhodochrosite crystal ever documented."
      - "Miners at the Sweet Home Mine originally discarded rhodochrosite because it interfered with processing the silver ore they were after."
      - "Colorado's mineral, rock, and gemstone symbols, rhodochrosite, Yule marble, and aquamarine, are red, white, and blue, matching the national flag."

