type: State Tree
state: Colorado
name: Colorado Blue Spruce
scientific_name: Picea pungens
adopted_year: 1939
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "Colorado State Tree | Colorado Blue Spruce"
seo_description: "Colorado's state tree is the Colorado blue spruce, chosen after a student vote and adopted in 1939 for its mountain range and silver-blue needles."

intro_text: "Colorado adopted the Colorado Blue Spruce as its state tree in 1939 after decades of public support dating back to a schoolchildren's vote in 1892. Its silver-blue needles and mountain range make it one of the trees most closely identified with the state."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Colorado"
    paragraphs:
      - "The Colorado Blue Spruce holds the designation of Colorado's official state tree. This conifer typically reaches 50 to 75 feet tall, though exceptional specimens grow up to 150 feet. The tallest documented Blue Spruce stands 180 feet high in Colorado's San Juan Mountains. Individual trees live between 150 and 600 years."
      - "The tree's most striking feature is its needle color. A waxy coating creates the distinctive blue-silver appearance that gives the tree its name. Sometimes called the Silver Spruce, these trees display stiff, sharp needles measuring about one inch long. The needles radiate in all directions around the branch."
      - "Blue Spruce bark appears gray to reddish-brown with deep furrows on mature trees. The tree maintains a pyramidal shape with layered branches. This symmetrical form made Blue Spruce popular for ornamental planting across America."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Colorado Blue Spruce"
    paragraphs:
      - "The common names include Colorado Blue Spruce, Blue Spruce, Colorado Spruce, and Silver Spruce. The scientific name is Picea pungens. The species name pungens means 'sharp' in Latin, referring to the tree's stiff, pointed needles."
      - "Dr. Charles Christopher Parry identified this species during an 1862 expedition to Pikes Peak. Botanist George Engelmann named the species in 1879. Some early references called it Water Spruce because it grows along mountain streams."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Blue Spruce Became the Colorado State Tree"
    paragraphs:
      - "The Colorado General Assembly proclaimed the Blue Spruce as the official state tree on March 7, 1939. This came 47 years after Colorado's school children voted for it on Arbor Day in 1892. Students chose the Blue Spruce over white fir by more than two to one, echoing how school votes also shaped the [Colorado state flower](/states/colorado/flower/rocky-mountain-columbine)."
      - "Denver teacher George L. Cannon Jr. established selection criteria. The tree should grow in Colorado's mountains, represent the mountain landscape, be familiar to residents, possess practical value, and display beauty. The Blue Spruce met every requirement. Various pines and firs received scattered support, but Blue Spruce won decisively."
      - "The tree's unique blue-silver color and pyramidal form made it distinctive. Blue Spruce grows naturally only in the Rocky Mountain region. By the 1930s, it had become popular as an ornamental species nationwide, spreading Colorado's character beyond state borders. The nearly five-decade delay between the children's vote and legislative approval remains unexplained."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Colorado State Tree Facts"
    facts:
      - "Colorado school children voted for the Blue Spruce in 1892, but official designation didn't occur until March 7, 1939"
      - "The tallest documented Colorado Blue Spruce measures 180 feet tall in the San Juan Mountains"
      - "Dr. C.C. Parry identified the Blue Spruce on Pikes Peak in 1862"
      - "The scientific name Picea pungens means 'sharp spruce,' referring to the stiff, pointed needles"
      - "Blue Spruce can live between 150 and 600 years in their natural mountain habitat"
      - "A waxy coating on the needles creates the distinctive blue-silver color"
      - "The tree grows naturally at elevations between 6,000 and 11,000 feet in Colorado's mountains"
      - "Utah designated the Blue Spruce as its state tree in 1933 but replaced it with the quaking aspen in 2014"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Colorado State Tree and Flower"
    paragraphs:
      - "Colorado's state flower is the Rocky Mountain Columbine (Aquilegia caerulea), designated on April 4, 1899. School children chose the white and lavender columbine in 1891. Both symbols emerged from democratic student votes. The columbine blooms from May through July in Colorado's mountains, complementing the year-round evergreen Blue Spruce and the [official state bird](/states/colorado/bird/lark-bunting)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Colorado Blue Spruce"
    paragraphs:
      - "The Blue Spruce's most distinctive feature is its needle color. Look for silvery-blue or blue-gray coating on the needles. Some trees appear more green, while others show intense silver-white coloring. The needles feel stiff and sharp, measuring about one inch long and radiating in all directions."
      - "The tree forms a perfect pyramid shape. Branches grow in distinct horizontal layers. Young trees maintain lower branches, creating a full profile. Bark appears gray with reddish-brown undertones. Young bark has small scales, while mature bark develops deep vertical furrows."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Colorado Blue Spruce reflects high-elevation hardiness. Its selection through a student vote emphasizes the student-led selection process. The tree's ability to thrive at high elevations represents Colorado's toughness and pioneering spirit. Its blue-silver color evokes Colorado's mountain skies and snow-covered peaks associated with [The Centennial State](/states/colorado/nickname/the-centennial-state). As an ornamental species planted nationwide, the Blue Spruce is an ambassador for Colorado."

faq:
  - question: "What is the Colorado state tree?"
    answer: "The Colorado Blue Spruce (Picea pungens) is Colorado's official state tree. The Colorado General Assembly designated it on March 7, 1939, though school children had voted for it 47 years earlier in 1892."
  
  - question: "What is the Colorado state tree called?"
    answer: "Colorado's state tree is called the Colorado Blue Spruce, Blue Spruce, Colorado Spruce, or Silver Spruce. Its scientific name is Picea pungens, which means 'sharp spruce' in Latin."
  
  - question: "When was Colorado's state tree adopted?"
    answer: "Colorado officially adopted the Blue Spruce as its state tree on March 7, 1939. School children voted for it on Arbor Day in 1892, but legislative approval didn't come until 47 years later."
  
  - question: "Why is the Blue Spruce Colorado's state tree?"
    answer: "Colorado chose the Blue Spruce because it grows naturally in the state's mountains, displays a distinctive blue-silver color, and represents Colorado's mountain landscape. School children overwhelmingly voted for it in 1892 based on criteria that included beauty, hardiness, and familiarity. The tree's symmetrical form and unique coloration made it an ideal state symbol."
  
  - question: "What is the Colorado state tree name?"
    answer: "The name is Colorado Blue Spruce or simply Blue Spruce. The scientific name is Picea pungens. Other names include Colorado Spruce, Silver Spruce, and historically, Water Spruce."
  
  - question: "Where do Colorado Blue Spruce trees grow?"
    answer: "Colorado Blue Spruce grows naturally in the Rocky Mountains at elevations between 6,000 and 11,000 feet. The tree's native range includes Colorado, Wyoming, Utah, New Mexico, Arizona, and Idaho. In Colorado, Blue Spruce grows throughout the western two-thirds of the state, often along mountain streams and in well-watered canyons; for geographic context, compare the [highest points by state ranking](/rankings/geography/highest-point-by-state)."
  
  - question: "What are some facts about the Colorado state tree?"
    answer: "Colorado Blue Spruce can live 150 to 600 years and grow up to 150 feet tall (with the record at 180 feet). Dr. C.C. Parry found it on Pikes Peak in 1862. The blue color comes from a waxy coating on the needles. School children voted for it in 1892, but it wasn't officially designated until 1939. The tree grows at elevations between 6,000 and 11,000 feet and provides food for various wildlife species."
  
  - question: "Is the Blue Spruce the state tree of other states?"
    answer: "The Blue Spruce was also Utah's state tree from 1933 to 2014. Utah replaced it with the quaking aspen because aspens are far more common in Utah, comprising 10% of the state's tree cover. Colorado is now the only state with the Blue Spruce as its official state tree."

