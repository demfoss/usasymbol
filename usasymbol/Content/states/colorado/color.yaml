faq:
  - question: "What are the official colors of Colorado?"
    answer: "The traditional state colors of Colorado are Blue and White, derived from the state flag adopted in 1911. Blue represents Colorado's deep high-altitude sky, and white represents the snow-capped Rocky Mountain peaks."
  - question: "What is the HEX code for Colorado Blue?"
    answer: "The standard HEX code for Colorado's state blue is #002868, corresponding to Pantone PMS 286, matching the blue of the United States flag as specified in the 1929 flag revision."
  - question: "Why does Colorado use blue and white?"
    answer: "Blue and white were chosen for the Colorado state flag to represent the defining visual imagery of the Rocky Mountain landscape — the deep blue of Colorado's high-altitude sky contrasted against the white of its permanently snow-capped mountain peaks."
  - question: "When was the Colorado state flag adopted?"
    answer: "The Colorado state flag was adopted by the Colorado General Assembly on June 5, 1911. It was subsequently revised in 1929 to standardize color specifications and again in 1964, with blue and white remaining the dominant colors throughout all versions."
  - question: "Does Colorado have officially legislated state colors?"
    answer: "No. Colorado does not have a separate legislative act designating official state colors. Blue and white are recognized as traditional state colors derived from the Colorado state flag, which is governed by Colorado Revised Statutes § 24-80-904."
  - question: "What do the colors on the Colorado flag mean?"
    answer: "The blue bands represent the Colorado sky and the blue of the United States flag; the white band represents the snow-capped Rocky Mountains; the red letter C represents the state's name and its red soil; and the gold interior of the C represents the state's sunshine and mineral wealth."

