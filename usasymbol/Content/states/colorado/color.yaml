intro_text: "The traditional state colors of Colorado are **Blue** and **White**, derived from [the Colorado state flag](/states/colorado/flag/colorado-state-flag) adopted in 1911. No separate state-colors law exists, but blue and white are widely recognized as the traditional colors of Colorado through the state flag, state branding, and official insignia. The color cards below list practical HEX, RGB, CMYK, and Pantone references for Colorado blue and white. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Blue and White"
official_since: "Traditional (based on 1911 state flag)"
primary_use: "State Flag, state government branding, state agency insignia"
known_for: "Blue representing Colorado's famous deep blue high-altitude sky; white representing the snow-capped Rocky Mountain peaks visible across the state's Front Range and western slope"

