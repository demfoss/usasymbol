seo_title: "Ohio State Colors | Red White Blue"
seo_description: "Ohio state colors are Red, White, and Blue, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of Ohio are **Red**, **White**, and **Blue**, derived from [the Ohio state flag](/states/ohio/flag/ohio-state-flag) adopted in 1902. Ohio does not define its state colors through a standalone legislative statute; they are formalized in the Ohio Brand Guide and appear throughout official state branding and communications. For Ohio, the reference values cover HEX, RGB, CMYK, and Pantone for comparing palettes across [U.S. state colors](/symbols/colors)."

official_colors: "Red (Cardinal Red), White, and Blue (Buckeye Blue)"
official_since: "1902 (state flag adoption); formalized in Ohio Brand Guide"
primary_use: "State flag, state government branding under 'Ohio: The Heart of it All' brand, state agency materials"
known_for: "Ohio is the only U.S. state with a non-rectangular flag — the distinctive swallowtail burgee whose red, white, and blue design is the source of the official state color palette; Buckeye Blue and Cardinal Red are named after Ohio's state tree (the Ohio Buckeye) and the state bird (the Northern Cardinal)"

color_data:
  - name: "Buckeye Blue"
    hex: "#0E3F75"
    rgb: "14, 63, 117"
    cmyk: "100, 74, 0, 45"
    pantone: "PMS 294 C"
    symbolism: "Named after the Ohio Buckeye tree (Aesculus glabra), Ohio's official state tree since 1953; the deep navy blue evokes the blue canton of the Ohio burgee and the state's connection to the Great Lakes, Lake Erie forming Ohio's entire northern border; Buckeye Blue is the primary brand color of the State of Ohio per the Ohio Brand Guide and represents the steadfastness and strength associated with the buckeye nut that gives Ohio its nickname, the Buckeye State"
  - name: "Cardinal Red"
    hex: "#C12637"
    rgb: "193, 38, 55"
    cmyk: "0, 100, 76, 13"
    pantone: "PMS 200 C"
    symbolism: "Named after the Northern Cardinal (Cardinalis cardinalis), Ohio's official state bird since 1933; the vivid red appears in the three horizontal red stripes of the Ohio burgee and in the red 'O' at the center of the flag's white circle; Cardinal Red represents the energy, vitality, and leadership that Ohio embodies as the nation's seventh-largest state by population and the birthplace of seven U.S. presidents"
  - name: "White"
    hex: "#FFFFFF"
    rgb: "255, 255, 255"
    cmyk: "0, 0, 0, 0"
    pantone: "—"
    symbolism: "Represents purity, integrity, and civic clarity; white appears in the two horizontal white stripes of the Ohio burgee and in the large circle at the center of the flag's triangular canton; white functions as the ground upon which Buckeye Blue and Cardinal Red are displayed and provides the visual contrast that makes the Ohio flag one of the most distinctive and recognizable state flags in the nation"

sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Ohio's state colors are formally identified in the Ohio Brand Guide as Buckeye Blue and Cardinal Red alongside white — the three colors of the Ohio state flag (the Ohio burgee). Ohio Revised Code Annotated § 5.01 governs the design of the Ohio flag but does not specify a separate standalone state color law. The Ohio Brand Guide, maintained by the Ohio Office of Travel and Tourism under the 'Ohio: The Heart of it All' brand identity, provides the definitive color specifications: Buckeye Blue at PMS 294 C (HEX #0E3F75) and Cardinal Red at PMS 200 C (HEX #C12637), connected to [Ohio's state flag page](/states/ohio/flag/ohio-state-flag)."
      - "The Ohio burgee — the state's swallowtail flag — was designed by architect John Eisemann and adopted by the Ohio General Assembly on May 9, 1902. It is the only state flag in the United States that is not rectangular, featuring a distinctive forked pennant shape. The flag's design was inspired by cavalry and maritime pennant traditions. The 17 stars in the blue canton represent Ohio as the 17th state admitted to the Union, and the central white circle with a red 'O' symbolizes both the letter O of Ohio and the buckeye nut."
    subsections:
      - subtitle: "Ohio Revised Code § 5.01 and the Burgee Design"
        text: "ORC § 5.01 establishes the official design specifications for the Ohio burgee, including the arrangement of three red and two white horizontal stripes, the triangular blue canton, the 17 gold-and-white stars, and the white circle with a red 'O' at center. The code does not specify Pantone or HEX values, but the Ohio Brand Guide supplements this with precise specifications. The swallowtail design was adopted to make Ohio's flag visually distinctive among the many blue 'seal on a bedsheet' flags common across U.S. states. Its success in achieving visual distinction was later reinforced when the flag design remained essentially unchanged for over 120 years."
      - subtitle: "The Ohio Brand Guide Color Specifications"
        text: "The Ohio Brand Guide (current version 1.8, December 2023) specifies the complete color palette for Ohio state branding. The primary palette consists of Buckeye Blue (PMS 294 C, HEX #0E3F75), Cardinal Red (PMS 200 C, HEX #C12637), and White (#FFFFFF). Secondary palette colors include Ohio-themed names such as Circleville Orange (named after the Circleville Pumpkin Show), Appalachian Green, Quarry Blue, and Solar Yellow — all reflecting specific aspects of Ohio's regional identity. The guide explicitly states that the primary palette is 'inspired by the state flag, the unusual Ohio burgee.'"
  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Ohio's Buckeye Blue and Cardinal Red are named after two of the state's most iconic natural symbols — the Ohio Buckeye tree and the Northern Cardinal — giving the state's official colors a distinctive connection to its native flora and fauna that is unusual among U.S. state color palettes. This naming convention, established in the Ohio Brand Guide, transforms the abstract red-white-and-blue patriotic palette into something specifically Ohioan, aligned with [the Buckeye State nickname](/states/ohio/nickname/the-buckeye-state)."
    subsections:
      - subtitle: "Buckeye Blue and the Ohio Buckeye Tree"
        text: "The Ohio Buckeye (Aesculus glabra) was designated the official state tree in 1953, though the association between Ohio and the buckeye dates to 1840 when William Henry Harrison's presidential campaign used buckeye log cabins and buckeye nut accessories as campaign symbols. The buckeye nut — a round, dark-brown seed with a light-colored eye — gave Ohio its enduring nickname, the Buckeye State. Buckeye Blue honors this heritage through a deep navy shade that evokes both the blue canton of the burgee and the formal dignity of the state's civic symbolism; see [the Ohio buckeye profile](/states/ohio/tree/ohio-buckeye)."
      - subtitle: "Cardinal Red and the Northern Cardinal"
        text: "The Northern Cardinal (Cardinalis cardinalis) was designated Ohio's official state bird in 1933. The male cardinal's brilliant red plumage — one of the most recognizable sights at Ohio bird feeders and in Ohio woodlands — is one of the state's most beloved natural symbols. Cardinal Red in the Ohio Brand Guide (PMS 200 C, HEX #C12637) captures this vivid scarlet and connects the state's official color palette to the living natural world of Ohio's forests, parks, and backyards. Ohio is home to more than 450 bird species, and the cardinal's red is the most iconic among them; compare [the Northern Cardinal page](/states/ohio/bird/northern-cardinal)."
  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Red, white, and blue define the Ohio burgee in its entirety, making the flag itself the primary vehicle for the state's official color tradition. The Ohio state seal, established in the Ohio Constitution of 1803 and refined over subsequent decades, features a detailed landscape with mountains, a river, a rising sun, a sheaf of wheat, and a bundle of 17 arrows, rendered in a broad palette of colors. The Ohio 'Heart of it All' brand identity, used extensively in state tourism communications, applies Buckeye Blue and Cardinal Red across print, digital, and environmental applications. These colors appear on Ohio highway signage, state agency logos, the Ohio National Guard insignia, and the official materials of the Ohio Governor's office, while broader scale context appears in [U.S. states by population](/rankings/demographics/states-by-population)."

