faq:
  - question: "What are the official colors of Ohio?"
    answer: "Ohio's official state colors are Buckeye Blue (HEX #0E3F75, PMS 294 C), Cardinal Red (HEX #C12637, PMS 200 C), and White, derived from the Ohio state flag (the burgee) adopted in 1902 and formalized in the Ohio Brand Guide."
  - question: "What is the HEX code for Ohio Buckeye Blue?"
    answer: "The official HEX code for Ohio Buckeye Blue is #0E3F75, corresponding to Pantone PMS 294 C, as specified in the Ohio Brand Guide version 1.8 (2023)."
  - question: "What is the HEX code for Ohio Cardinal Red?"
    answer: "The official HEX code for Ohio Cardinal Red is #C12637, corresponding to Pantone PMS 200 C, as specified in the Ohio Brand Guide version 1.8 (2023)."
  - question: "Why is Ohio's flag the only non-rectangular state flag?"
    answer: "Ohio's flag, the burgee, was designed in 1902 by architect John Eisemann with a distinctive swallowtail pennant shape inspired by cavalry and maritime flag traditions. The design was adopted to give Ohio a visually distinctive flag unlike the rectangular 'seal on a bedsheet' designs common to most other states."
  - question: "What do Buckeye Blue and Cardinal Red refer to?"
    answer: "Buckeye Blue is named after the Ohio Buckeye tree (the state tree since 1953), which gives Ohio its nickname, the Buckeye State. Cardinal Red is named after the Northern Cardinal (the state bird since 1933), whose brilliant red plumage is one of the most iconic sights in Ohio's woodlands."

