type: State Tree
state: Ohio
name: Ohio Buckeye
scientific_name: Aesculus glabra
adopted_year: 1953
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "Ohio State Tree | Ohio Buckeye"
seo_description: 'Ohio chose the Ohio buckeye in 1953, formalizing the tree behind the Buckeye State nickname, school traditions, and good-luck seeds.'

intro_text: "Ohio made the Ohio Buckeye its state tree in 1953, formalizing the connection to the tree behind the Buckeye State nickname. Its importance is cultural more than botanical: the buckeye became one of Ohio's strongest symbols long before it was written into law. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Ohio"
    paragraphs:
      - "Ohio's official state tree is the <strong>Ohio Buckeye</strong>, a medium-sized deciduous tree native to the Midwest. It grows 30 to 50 feet tall and can reach 70 feet in ideal conditions. The trunk measures one to two feet in diameter. The tree typically lives 80 to 100 years."
      - "Unlike many state trees, buckeye is not valued for timber. The wood is soft and weak, and the seeds are poisonous to humans and livestock. Despite this, the buckeye remains Ohio’s most beloved symbol. Its importance comes entirely from culture, while statewide scale can be compared in [U.S. states by population](/rankings/demographics/states-by-population)."
      - "Ohio buckeye grows throughout <strong>all 88 counties</strong> in moist forests, river valleys, and stream banks. Ohio lies at the center of the species’ natural range. The tree often grows in forest understory beneath taller hardwoods. This statewide presence makes it truly representative."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Ohio Buckeye"
    paragraphs:
      - "The official name is <strong>Ohio Buckeye</strong>, distinguishing it from other buckeye species. The name comes from the seed’s resemblance to a deer’s eye. The scientific name <strong>Aesculus glabra</strong> refers to the tree’s smooth seeds and leaf surfaces. Early Ohioans called it simply buckeye or fetid buckeye."
      - "The genus Aesculus includes about 13 species worldwide. Ohio buckeye belongs to the Sapindaceae family. It is closely related to horse chestnut, which is commonly planted in Ohio cities. The name “Buckeye” became so tied to Ohio that residents themselves are called Buckeyes."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Ohio Buckeye Became the Ohio State Tree"
    paragraphs:
      - "Ohio adopted the <strong>Ohio Buckeye</strong> as its official state tree on <strong>October 3, 1953</strong>. The designation formalized a connection that had existed since pioneer days. By then, Ohio had been known as the “Buckeye State” for over a century. The law simply made official what Ohioans already believed."
      - "The buckeye nickname emerged in the late 1700s and early 1800s as settlers noticed the distinctive trees. People began carrying buckeye seeds as good luck charms, a tradition that continues today. The nickname appeared in print by 1840. William Henry Harrison’s 1840 presidential campaign cemented the buckeye–Ohio link nationally."
      - "The tree became woven into Ohio culture through schools, sports, and politics. Ohio State University adopted “Buckeyes” as its team name, and Brutus Buckeye became an well-known mascot. Politicians used buckeye imagery to appeal to voters. The 1953 designation recognized a symbol that already defined Ohio culture and matched [the official nickname page](/states/ohio/nickname/the-buckeye-state)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Ohio State Tree Facts"
    facts:
      - "Ohio adopted Ohio Buckeye on October 3, 1953, formalizing the tree's role in giving Ohio the 'Buckeye State' nickname"
      - "The smooth brown seed with a tan patch resembles a deer's eye - the 'buck's eye' that inspired both tree and state names"
      - "Buckeye seeds are poisonous to humans and most animals, containing aesculin and other toxic compounds that cause vomiting and diarrhea"
      - "Ohio State University's athletic teams are called the Buckeyes, and mascot Brutus Buckeye is one of college sports' most famous mascots"
      - "Ohioans traditionally carry buckeye seeds as good luck charms - the only state where residents routinely carry their state tree's seeds"
      - "William Henry Harrison's 1840 presidential campaign used buckeye imagery extensively, cementing the buckeye-Ohio association nationally"
      - "The five-leaflet palmate compound leaf makes Ohio buckeye easy to identify - the leaflets radiate from a central point like fingers"
      - "Ohio buckeye is the only buckeye species native throughout Ohio, growing naturally in all 88 counties"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Ohio State Tree and Flower"
    paragraphs:
      - "Ohio's state flower is the <strong>Scarlet Carnation</strong>, designated in 1904. The flower honors President William McKinley, an Ohioan who wore it in his lapel. The state adopted the flower nearly 50 years before choosing the buckeye. Together, these symbols reflect Ohio’s political history and pioneer heritage; see [the scarlet carnation profile](/states/ohio/flower/scarlet-carnation)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize an Ohio Buckeye"
    paragraphs:
      - "The leaf structure provides instant identification. Look for palmate compound leaves with <strong>five leaflets</strong> radiating from a central point. Each leaflet is three to six inches long with fine serrations. This hand-like shape is unique among Ohio trees."
      - "The fruit is the most distinctive feature. Round spiny husks split open in fall to reveal shiny brown seeds with a large tan patch. This patch creates the classic <strong>“buck’s eye”</strong> appearance. Seeds carpet the ground in September and October."
      - "The tree forms a rounded crown nearly as wide as it is tall. Bark is gray-brown and becomes scaly and lightly furrowed with age. Twigs are stout with large winter buds. Yellow-green flower clusters bloom in spring."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Ohio State Tree Symbolizes"
    paragraphs:
      - "<strong>Ohio Buckeye</strong> represents state pride and character. It symbolizes pioneer heritage, good luck traditions, and the nickname that defines Ohio. For many residents, carrying a buckeye means carrying a piece of home. The tree reflects how a simple species became a powerful cultural icon and complements [the Northern Cardinal state bird](/states/ohio/bird/northern-cardinal)."

  - id: context
    icon: "fa-solid fa-map-location-dot"
    title: "Ohio Tree Context"
    paragraphs:
      - "The buckeye's spread across all counties is best understood with geography from [the Ohio borders guide](/states/ohio/borders)."

faq:
  - question: "What is the Ohio state tree?"
    answer: "The Ohio Buckeye (Aesculus glabra) is Ohio's official state tree. The Ohio General Assembly adopted it on October 3, 1953, formalizing the tree's role in giving Ohio the 'Buckeye State' nickname."
  
  - question: "What is the Ohio state tree called?"
    answer: "Ohio's state tree is called Ohio Buckeye. The scientific name is Aesculus glabra, meaning 'smooth buckeye.' It's also known as American buckeye, smooth buckeye, or fetid buckeye. The name comes from the seed resembling a buck's (deer's) eye."
  
  - question: "When was the Ohio state tree adopted?"
    answer: "Ohio adopted the Ohio Buckeye as its official state tree on October 3, 1953. The General Assembly passed the designation during the 1953 session, formalizing a connection that had existed since pioneer days."
  
  - question: "Why is the Ohio Buckeye Ohio's state tree?"
    answer: "Ohio chose the buckeye because it gave the state its 'Buckeye State' nickname. Pioneers noticed the distinctive trees and began carrying buckeye seeds as good luck charms. The nickname appeared by 1840. William Henry Harrison's 1840 presidential campaign used buckeye imagery. Ohio State University adopted Buckeyes as its team name. The tree represents Ohio culture through culture, not economics - the wood is weak and seeds are poisonous, but the cultural symbolism is unmatched. No other tree could represent Ohio as completely."
  
  - question: "What is the Ohio state tree name?"
    answer: "The name is Ohio Buckeye. The scientific name is Aesculus glabra. 'Buckeye' comes from the seed resembling a deer's eye - the brown seed with a tan patch looks like a 'buck's eye.' The species is native to Ohio and throughout the Midwest."
  
  - question: "Where does the Ohio state tree grow?"
    answer: "The Ohio Buckeye grows throughout Ohio in all 88 counties. It thrives on moist, well-drained soils in forests, river valleys, and stream banks. Ohio lies at the center of the buckeye's natural range, which extends from Pennsylvania to Kansas and south to Tennessee."
  
  - question: "What are some facts about the Ohio state tree?"
    answer: "The Ohio Buckeye grows 30 to 50 feet tall with five-leaflet palmate compound leaves. The seeds resemble a deer's eye with a brown seed and tan patch. Seeds are poisonous to humans and livestock. Ohio State University's teams are called the Buckeyes. Ohioans carry buckeye seeds as good luck charms. William Henry Harrison's 1840 campaign used buckeye imagery. The tree grows naturally in all 88 Ohio counties."
  
  - question: "How do you recognize the Ohio state tree?"
    answer: "Look for palmate compound leaves with five leaflets radiating from a central point like fingers on a hand. Each leaflet is three to six inches long. In fall, look for round, spiny husks that split open to reveal shiny brown seeds with a large tan patch - the 'buck's eye.' Yellow-green flower clusters bloom in spring. The tree has gray-brown scaly bark and forms a rounded crown."

