title: Northern Cardinal
scientific_name: Cardinalis cardinalis
adopted_year: 1933
legislation: Ohio Rev. Code Sec. 5.03
meaning: Ohio's cardinal makes the most sense as the bird of the Ohio residents recognized by 1933. Historical summaries say cardinals were scarce in the old deep-forest state but spread widely after clearing created the brushy edges of farms, towns, and woodlots. The symbol therefore points to a settled working landscape rather than untouched wilderness, and later reappears in the state's public color language as Cardinal Red.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: '2026-03-28'
seo_title: 'Ohio State Bird: Northern Cardinal'
seo_description: Ohio adopted the Northern Cardinal in 1933. The stronger story is that the bird fit the changed Ohio of farms, towns, and woodland edges and later reappeared in the state's public color language as Cardinal Red.
intro_text: Ohio's official state bird is the <strong>Northern Cardinal</strong>, adopted on <strong>March 2, 1933</strong> and now carried in <strong>Ohio Rev. Code Sec. 5.03</strong>. The more revealing fact is that the cardinal was not always an obvious Ohio bird. Historical summaries say it was scarce in the heavily forested state before settlement and became common only after Ohio turned into a mix of farms, towns, and woodland edges. That makes the symbol less a tribute to primeval Ohio than a marker of the everyday landscape Ohioans had made and recognized by 1933.
