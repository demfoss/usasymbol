seo_title: "Ohio State Flower | Scarlet Carnation"
seo_description: "The Scarlet Carnation became Ohio's state flower in 1904. This red flower honors President William McKinley who wore carnations as his signature emblem."

intro_text: "Since 1904, the Scarlet Carnation has served as Ohio's state flower and appears in the [list of U.S. state flowers](/symbols/flowers). This distinctive red flower honors President William McKinley's legacy. The carnation became McKinley's signature emblem during his political career and Ohio's lasting tribute after his assassination."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Ohio State Flower?"
    paragraphs:
      - "Ohio recognizes the Scarlet Carnation as its state flower. Each bloom displays numerous ruffled petals arranged in a full rounded shape. The flowers measure 2 to 3 inches across. Deep red petals give the scarlet variety its distinctive color. A spicy clove-like fragrance emanates from the blooms. Carnations grow on sturdy stems reaching 18 to 24 inches tall."
      - "Carnations bloom year-round in greenhouses across Ohio. Outdoor garden carnations flower from late spring through fall. Peak blooming occurs in June and July for garden varieties. The plants require well-drained soil. Full sun produces the strongest growth. Gray-green narrow leaves grow opposite along the stems. Commercial growers in Ohio produce carnations for the floral industry throughout the year."
      - "Ohio's floral industry developed significantly around carnation production during the early 1900s. Greenhouses in Cleveland, Columbus, and Cincinnati specialized in carnation cultivation. The Columbus area became particularly known for carnation growing. These facilities supplied flowers for Memorial Day tributes, political events, and the cut flower market. Modern Ohio still maintains carnation production though the industry has declined from its peak."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Ohio State Flower Name"
    paragraphs:
      - "This flower carries the common name Scarlet Carnation and the scientific name Dianthus caryophyllus. The plant belongs to the Caryophyllaceae family. This family includes pinks, sweet williams, and about 2,000 species of flowering plants worldwide."
      - "The genus name Dianthus comes from Greek words meaning divine flower. The species name caryophyllus refers to the clove-like scent. Carnation comes from the word coronation, as these flowers decorated ceremonial crowns. The term may also derive from incarnation, referring to flesh-colored pink varieties."
      - "Ohio specifically designated the scarlet or red variety rather than pink or white carnations. This color choice honored President McKinley who always wore a red carnation. The scarlet carnation appeared on McKinley campaign materials and became his trademark. After his assassination in 1901, Ohio citizens remembered him through this distinctive red flower."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Ohio Chose the Scarlet Carnation"
    paragraphs:
      - "Ohio established the Scarlet Carnation as its official state flower in 1904. This designation came three years after President William McKinley's assassination in Buffalo, New York. McKinley served as Ohio's governor before becoming president. He represented Ohio in Congress for 14 years before that. The carnation symbolized his entire political career and later connected with [Ohio's state motto tradition](/states/ohio/motto/with-god-all-things-are-possible)."
      - "McKinley wore a red carnation in his lapel constantly. He considered the flower his good luck charm. He gave carnations to visitors, well-wishers, and children. At public events, McKinley often removed his carnation and handed it to someone in the crowd. Minutes before his assassination at the Pan-American Exposition, McKinley gave his carnation to a young girl. This final gesture became part of American political legend."
      - "After McKinley's death, Ohio citizens sought ways to honor their native son. The General Assembly received numerous petitions supporting the scarlet carnation. No opposition emerged to the proposal. Lawmakers unanimously agreed the flower represented Ohio's connection to McKinley. The legislature passed the designation on February 3, 1904. Ohio became one of the first states to choose a state flower based on a political figure rather than native flora, consistent with [the Buckeye State civic identity](/states/ohio/nickname/the-buckeye-state)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Ohio State Flower Facts"
    facts:
      - "President William McKinley wore a red carnation in his lapel constantly and gave his boutonniere to a young girl minutes before his assassination in 1901"
      - "Ohio adopted the Scarlet Carnation on February 3, 1904, specifically choosing the red variety to honor McKinley rather than selecting a native wildflower"
      - "Carnation greenhouses in Cleveland, Columbus, and Cincinnati developed a major floral industry in Ohio during the early 1900s supplying flowers nationwide"
      - "The carnation's spicy fragrance comes from the same chemical compound eugenol found in cloves, giving the flower its distinctive scent"
      - "Carnations can live as perennials in mild climates but are typically grown as annuals in Ohio's climate with cold winters"
      - "Ohio remains one of the few states to choose a cultivated flower rather than a native wildflower as its official state emblem"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Ohio State Flower and Bird"
    paragraphs:
      - "The Northern Cardinal serves as Ohio's state bird, a brilliant red songbird common in Ohio woodlands and gardens year-round. Both symbols represent Ohio officially. Ohio adopted the Scarlet Carnation in 1904 and designated the Northern Cardinal as state bird in 1933; compare [the cardinal profile](/states/ohio/bird/northern-cardinal)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Scarlet Carnation Symbolizes"
    paragraphs:
      - "The Scarlet Carnation is commonly seen as representing Ohio's connection to President William McKinley and his political legacy. The flower has been linked to patriotism, remembrance, and public service. Its red color traditionally symbolizes love and admiration while carrying connotations of McKinley's final generous gesture and Ohio's pride in its native son who became president, alongside symbols like [the Ohio buckeye state tree](/states/ohio/tree/ohio-buckeye)."

faq:
  - question: "What is Ohio's state flower?"
    answer: "Ohio's state flower is the Scarlet Carnation, a red cultivated flower chosen to honor President William McKinley who wore carnations as his signature emblem."
  
  - question: "When did Ohio adopt the Scarlet Carnation as its state flower?"
    answer: "Ohio adopted the Scarlet Carnation on February 3, 1904. This designation came three years after President McKinley's assassination in 1901."
  
  - question: "Why did Ohio choose the Scarlet Carnation?"
    answer: "Ohio chose the Scarlet Carnation to honor President William McKinley, who served as Ohio's governor and congressman. McKinley wore a red carnation constantly and considered it his good luck charm. Minutes before his assassination, he gave his carnation to a young girl, making this final gesture part of American political legend."
  
  - question: "Is the carnation native to Ohio?"
    answer: "No, the carnation is not native to Ohio. Ohio chose a cultivated flower rather than a native wildflower, making it one of the few states to select a state flower based on a political figure rather than native flora."
  
  - question: "What does the scarlet carnation symbolize?"
    answer: "The Scarlet Carnation symbolizes Ohio's connection to President William McKinley and his legacy of public service. The red color traditionally represents love and admiration, while the flower carries connotations of patriotism, remembrance, and McKinley's generous spirit."

