title: "With God, All Things Are Possible"
language: "English"
english_translation: ""
adopted_year: 1959

author: "USA Symbol Team"
date_published: "2025-12-04"
date_modified: "2026-04-16"
seo_title: "Ohio State Motto | With God, All Things Are Possible"
seo_description: "Ohio's motto was proposed by a 12-year-old who gathered 18,000 signatures. Ohio is the only state with a motto taken directly from the Bible (Matthew 19:26). Ohio's first motto lasted only 2 years before repeal, leaving the state without any motto for 91 years. The Sixth Circuit Court ruled 9-4 in 2001 that the motto is constitutional."

intro_text: "Ohio's state motto is <strong>With God, All Things Are Possible</strong>, adopted on October 1, 1959. It is the only state motto in the United States taken directly from the Bible — Matthew 19:26. The phrase was proposed by 12-year-old James Mastronardo of Cincinnati, who gathered 18,000 signatures and personally lobbied the legislature. Ohio had previously gone 91 years without any motto — its first motto, the Latin <em>Imperium in Imperio</em> (An Empire Within an Empire), was repealed in 1868 after just two years because critics called it pretentious and royalist."

sections:
  - id: "12-year-old-proposed-it"
    icon: "fa-solid fa-user"
    title: "Proposed by a 12-Year-Old With 18,000 Signatures"
    paragraphs:
      - "In March 1958, ten-year-old James Mastronardo wrote a letter to the Cincinnati Enquirer pointing out that Ohio was the only state among 48 without an official motto. He proposed 'With God, All Things Are Possible' — his mother's favorite saying. Secretary of State Ted W. Brown read the newspaper story, contacted Mastronardo, and encouraged him to lobby the legislature, officially registering the boy as a lobbyist."
      - "Mastronardo gathered 18,000 signatures supporting his proposal. He started by going door to door in his neighborhood, then continued collecting signatures at a local food festival. He made multiple trips from Cincinnati to Columbus to speak with lawmakers. Senator William H. Deddens invited him to testify before the Senate State Government Committee on February 24, 1959. On June 22, 1959, the House of Representatives granted Mastronardo the unprecedented privilege of addressing them from the speaker's podium."
      - "The House voted unanimously to adopt the motto. Governor Michael DiSalle signed the legislation, and the law took effect October 1, 1959. Secretary of State Brown presented Mastronardo with a Citation Award at a statewide meeting of elections officials. Comedian Joe E. Brown attended as a surprise guest at the ceremony."

  - id: "only-biblical-motto"
    icon: "fa-solid fa-book-open"
    title: "The Only State Motto Taken Directly From the Bible"
    paragraphs:
      - "Ohio is the only U.S. state whose motto is a direct Biblical quotation. The phrase comes from Matthew 19:26, where Jesus responds to his disciples' question about who can be saved. The full verse: 'Jesus looked at them and said, With man this is impossible, but with God all things are possible.' Ohio's motto quotes only the second half."
      - "Mastronardo later told reporters he didn't know the phrase came from the Bible when he proposed it — he simply knew it as his mother's favorite saying. State officials in 1959 presented the motto as an expression of optimism rather than religious endorsement. The American Civil Liberties Union challenged the motto's constitutionality in 1997, arguing it violated the separation of church and state."
      - "The full Sixth Circuit Court of Appeals ruled 9-4 in 2001 that the motto is constitutional. The majority found it represented ceremonial deism — a type of religious reference so embedded in American tradition that it doesn't constitute state endorsement of religion. Ohio's motto remains in effect as of 2026."

  - id: "first-motto-repealed"
    icon: "fa-solid fa-clock-rotate-left"
    title: "Ohio's First Motto Lasted 2 Years — Then 91 Years Without Any Motto"
    paragraphs:
      - "Ohio first adopted a state motto in 1866 when the Republican legislature chose the Latin phrase 'Imperium in Imperio' — 'An Empire Within an Empire.' Governor Jacob D. Cox, a former Civil War general, championed the Latin wording to celebrate Ohio's role in preserving the Union. The phrase argued that Ohio, as an empire within the American empire, had earned special status through its Civil War contributions."
      - "Democrats criticized the motto immediately as pretentious, royalist, and inappropriate for a democratic republic. The word 'empire' struck many as antithetical to American values — the country had just fought a war to preserve a democratic union, not an imperial one. Public backlash intensified. Democrats won the next election and repealed the motto in 1868. Ohio went 91 years without any official motto."
      - "When Mastronardo pointed out in 1958 that Ohio was the only state without a motto, the 91-year gap was genuine — the state had been without one since the 1868 repeal. His campaign filled a void that had existed for nearly a century."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Ohio State Motto Facts"
    style: "gradient"
    facts:
      - "Ohio is the only U.S. state with a motto taken directly from the Bible (Matthew 19:26)."
      - "James Mastronardo was 12 years old when he successfully lobbied the Ohio legislature — gathering 18,000 signatures."
      - "Ohio's first motto 'Imperium in Imperio' (An Empire Within an Empire) lasted only two years, 1866 to 1868."
      - "Ohio went 91 years without any official motto between 1868 and 1959."
      - "The House voted unanimously to adopt the motto in 1959."
      - "The full Sixth Circuit Court ruled 9-4 in 2001 that the motto is constitutional."

faq:
  - question: "What is Ohio's state motto?"
    answer: "Ohio's state motto is 'With God, All Things Are Possible,' adopted October 1, 1959. It is the only state motto in the United States taken directly from the Bible — Matthew 19:26."

  - question: "Who proposed Ohio's motto?"
    answer: "James Mastronardo, a 12-year-old from Cincinnati, who wrote to the Cincinnati Enquirer in 1958 pointing out Ohio had no motto. He proposed his mother's favorite saying, gathered 18,000 signatures, and lobbied the legislature — addressing the House from the speaker's podium on June 22, 1959."

  - question: "Did Ohio always have this motto?"
    answer: "No. Ohio's first motto was 'Imperium in Imperio' (An Empire Within an Empire), adopted in 1866 and repealed in 1868 after critics called it pretentious and royalist. Ohio then had no official motto for 91 years — until Mastronardo's campaign succeeded in 1959."

  - question: "Is Ohio's motto constitutional?"
    answer: "Yes, under current law. The American Civil Liberties Union challenged it in 1997 as a violation of the separation of church and state. The full Sixth Circuit Court of Appeals ruled 9-4 in 2001 that the motto represents ceremonial deism — a religious reference so embedded in American tradition that it does not constitute state endorsement of religion."

  - question: "What language is Ohio's motto written in?"
    answer: "English. The phrase 'With God, All Things Are Possible' is a direct English quotation from the Bible (Matthew 19:26, King James translation equivalent). Ohio's previous motto was in Latin."

  - question: "Where does Ohio's motto appear?"
    answer: "Beneath Ohio's state seal on official documents and government letterhead. The seal shows a sunrise over Mount Logan with seventeen arrows and a sheaf of wheat. A large inscription of the motto is also visible in a plaza near the Statehouse in Columbus."

