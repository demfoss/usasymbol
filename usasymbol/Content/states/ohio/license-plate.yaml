sections:
- id: current-plate
  icon: fa-solid fa-sun
  title: Current Ohio Plate
  paragraphs:
  - Ohio's current standard design is "Sunrise in Ohio." It was unveiled in October 2021 and became available to drivers on December 29, 2021, replacing the Ohio Pride plate.
  - The design includes a sunrise, skyline, hills, river, field, child on a swing, the Wright Flyer, and a banner with "Birthplace of Aviation." It was corrected before release after the first public version showed the Wright Flyer towing the banner from the wrong end.
  - The current plate is not a clean break from the aviation slogan. It keeps "Birthplace of Aviation" while using a broader scenic design inspired by the Ohio seal and state landscapes.

- id: birthplace-of-aviation
  icon: fa-solid fa-plane-departure
  title: What "Birthplace of Aviation" Means
  paragraphs:
  - Ohio's claim is biographical and technological. Wilbur and Orville Wright lived and worked in Dayton, where their bicycle shop helped fund the experiments that led to powered flight. Orville was born in Dayton, and Wilbur grew up there after being born in Indiana.
  - Neil Armstrong strengthens the aviation identity. The first person to walk on the moon was born in Wapakoneta, Ohio, linking Ohio's plate slogan to both early flight and spaceflight.
  - "North Carolina's \"First in Flight\" slogan makes the geographic claim: the first successful powered flights happened at Kitty Hawk on December 17, 1903. Ohio's plate answers that aviation's inventors and much of the engineering work belonged to Ohio."

- id: heart-of-it-all
  icon: fa-solid fa-heart
  title: The Heart of It All
  paragraphs:
  - Ohio introduced "the heart of it all" on the 1991 base after years without a standard slogan. The phrase promoted Ohio's central location in the Midwest and its position near major highways, markets, and population centers.
  - The lowercase styling was a real part of the design, making it softer and more conversational than the all-caps safety and commemorative slogans that came before it.
  - The slogan ended as a standard plate phrase in 1997, when Ohio shifted to "Birthplace of Aviation," but "Ohio, The Heart of It All" later returned as a state tourism brand.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Ohio License Plate Slogans by Era
  paragraphs:
  - Ohio's plate history includes commemorative slogans, a safety question, a tourism identity, an aviation claim, and several modern scenic bases that keep the aviation phrase alive.
  versions:
  - name: Northwest Territory Sesquicentennial
    years: '1938'
    image: /images/license-plates/ohio/1938-northwest-territory-sesquicentennial.jpg
    description: Ohio marked the 150th anniversary of the Northwest Territory Ordinance of 1787 with a commemorative plate.
  - name: Sesquicentennial
    years: '1953'
    image: /images/license-plates/ohio/1953-sesquicentennial.jpg
    description: Ohio's 150th statehood anniversary plate carried sesquicentennial dates rather than a modern identity slogan.
  - name: Seat Belts Fastened?
    years: 1973-1975
    image: /images/license-plates/ohio/1974-seat-belts-fastened.png
    description: A safety slogan phrased as a direct question to the driver. The older file cut this era short at 1974, but the passenger base continued through 1975.
  - name: the heart of it all
    years: 1991-1997
    image: /images/license-plates/ohio/1991-heart-of-it-all.jpg
    description: Ohio's central-location tourism slogan appeared in lowercase on the 1991 base and ran until the Ohio Gold aviation base.
  - name: Birthplace of Aviation
    years: 1997-2001
    image: /images/license-plates/ohio/1997-birthplace-of-aviation.jpg
    description: The Ohio Gold base introduced "Birthplace of Aviation" in mid-1997, not 1998.
  - name: Bicentennial / Birthplace of Aviation
    years: 2001-2004
    image: /images/license-plates/ohio/2001-bicentennial-birthplace-of-aviation-full.jpg
    description: Ohio's Bicentennial plate marked the state's 200th anniversary while retaining the aviation slogan.
  - name: Sunburst / Birthplace of Aviation
    years: 2004-2010
    image: /images/license-plates/ohio/2004-sunburst-birthplace-of-aviation.jpg
    description: The Sunburst base continued "Birthplace of Aviation" before Beautiful Ohio gradually replaced it as the standard base.
  - name: Beautiful Ohio / Birthplace of Aviation
    years: 2009-2013
    image: /images/license-plates/ohio/2009-beautiful-ohio-birthplace-of-aviation.jpg
    description: The scenic Beautiful Ohio plate began as a no-cost alternative in 2009 and became the standard base on December 1, 2010.
  - name: Ohio Pride / Birthplace of Aviation
    years: 2013-2021
    image: /images/license-plates/ohio/2013-ohio-pride-birthplace-of-aviation.jpg
    description: The Ohio Pride base used a background collage of Ohio words and landmarks while keeping the aviation slogan.
  - name: Sunrise in Ohio / Birthplace of Aviation
    years: December 29, 2021-present
    image: /images/license-plates/ohio/2021-sunrise-in-ohio-official.png
    description: The current standard base uses scenic statewide imagery and a Wright Flyer banner reading "Birthplace of Aviation."

- id: modern-sequence
  icon: fa-solid fa-rotate
  title: Modern Base Sequence
  paragraphs:
  - The old file blended 1998-2009 into a single aviation era, but Ohio changed standard bases several times inside that period. The important split is Ohio Gold, Bicentennial, Sunburst, Beautiful Ohio, Ohio Pride, and then Sunrise in Ohio.
  - Official state release material for Sunrise in Ohio lists the recent standard plate sequence as Bicentennial in 2001, Sunburst in 2003, Beautiful Ohio in 2009, and Ohio Pride in 2013. Registration-plate tables refine those issue windows by actual base availability.
  - This means "Birthplace of Aviation" is not just one plate design. It is a slogan carried across multiple standard bases for nearly three decades.

