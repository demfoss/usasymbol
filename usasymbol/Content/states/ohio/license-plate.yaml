hero_image_alt: Ohio Sunrise in Ohio license plate with Birthplace of Aviation slogan
hero_image_caption: Ohio's current Sunrise in Ohio standard plate, released December 29, 2021, still carries the Birthplace of Aviation slogan.
intro_text: '**"Birthplace of Aviation"** is Ohio''s main license plate slogan. It began on the Ohio Gold base in 1997 and continues on the **Sunrise in Ohio** plate introduced in 2021. The phrase points to the Wright brothers'' Dayton work and astronaut Neil Armstrong, while North Carolina claims **"First in Flight."**'
quick_answer: 'Ohio''s current standard plate is the "Sunrise in Ohio" design, introduced December 29, 2021, and it carries the "Birthplace of Aviation" slogan. Earlier standard slogans include "the heart of it all" from 1991 to 1997, "SEAT BELTS FASTENED?" from 1973 to 1975, and "Beautiful Ohio" paired with Birthplace of Aviation from 2009 to 2013.'
