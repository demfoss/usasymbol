faq:
- question: What is Ohio's current license plate slogan?
  answer: Ohio's current standard plate carries "Birthplace of Aviation" on the Sunrise in Ohio design.
- question: When did Ohio introduce Sunrise in Ohio?
  answer: Ohio's Sunrise in Ohio plate became available December 29, 2021, replacing the Ohio Pride plate.
- question: When did Ohio first use "Birthplace of Aviation"?
  answer: Ohio first used "Birthplace of Aviation" on the Ohio Gold base in 1997.
- question: Why does Ohio say "Birthplace of Aviation"?
  answer: The phrase refers to the Wright brothers' Dayton work and to Ohio aviation figures such as Neil Armstrong. Ohio's claim focuses on the people and engineering behind aviation, while North Carolina's "First in Flight" focuses on where the 1903 flight occurred.
- question: When did Ohio use "the heart of it all"?
  answer: Ohio used "the heart of it all" on standard plates from 1991 to 1997.
- question: Was the first Sunrise in Ohio design wrong?
  answer: The version first shown publicly in October 2021 had the Wright Flyer banner attached to the wrong end of the aircraft. Ohio corrected the graphic before the plate became available on December 29, 2021.

