intro_text: "Ohio's state reptile is the northern black racer, a fast, slender black snake, adopted in 1995. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Ohio?
    paragraphs:
      - "The northern black racer is Ohio's official state reptile, designated by the Ohio General Assembly in 1995. Its scientific name is Coluber constrictor constrictor."
      - "It is a non-venomous snake known for its speed and its solid black coloring as an adult."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Northern Black Racer
    paragraphs:
      - "Adult northern black racers are slender and solid black or dark gray on top with a lighter, often whitish underside on the chin and throat."
      - "They can grow to about 3 to 5 feet long and move quickly through grass and brush, which is how the species got its common name."
      - "Young racers look very different, with a pattern of reddish-brown blotches that fades to solid black as they mature."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Ohio General Assembly designated the northern black racer the official state reptile in 1995, giving Ohio's reptiles their own dedicated state symbol."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Ohio Chose the Northern Black Racer
    paragraphs:
      - "Official sources name the northern black racer as the state reptile but do not give a detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Northern Black Racer
    paragraphs:
      - "The northern black racer lives in fields, meadows, and forest edges throughout Ohio, where it hunts during the day for insects, rodents, and other small animals."
    sites:
      - name: Wayne National Forest
        city: Nelsonville
        lat: 39.46
        lng: -82.23
        note: "Woodland and field habitat for the species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Northern Black Racer Facts
    facts:
      - "Adopted in 1995 by the Ohio General Assembly."
      - "Adults are solid black or dark gray with a lighter chin and throat."
      - "Can grow to about 3 to 5 feet long."
      - "Young racers have a blotched pattern that fades to solid black as they grow."
      - "Is non-venomous and moves quickly to escape rather than attack."

