sections:
  - id: overview
    icon: fa-solid fa-music
    title: Ohio State Song
    paragraphs:
      - "\"Beautiful Ohio\" is Ohio's official state song, adopted in 1969. Composer Mary Earl and lyricist Ballard MacDonald wrote it as a popular song in 1918, and Wilbert McBride later revised the lyrics in 1989 to focus more directly on the state itself."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Beautiful Ohio\" Explained"
    paragraphs:
      - "The original 1918 song was a romantic waltz describing moonlight along the Ohio River, written for the popular sheet-music market rather than as a civic anthem. Its melody borrows phrases from Rimsky-Korsakov's \"Song of India\" and Stephen Foster's \"Beautiful Dreamer.\""
      - "Mary Earl was a pen name for songwriter Robert A. King, who composed the tune, while Ballard MacDonald wrote the original lyrics. Both were established Tin Pan Alley songwriters, and the song became a genuine commercial hit years before Ohio ever considered it for official status."
      - "In 1989, Wilbert B. McBride wrote new special verses, with the Ohio Legislature's permission, that shifted the song's focus from river romance to the state's golden fields, growing cities, and ideals of freedom and industry."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Beautiful Ohio" Represents Ohio
    paragraphs:
      - "Ohio chose the song because it was already a widely known and loved melody with a direct tie to the Ohio River, the waterway that shaped much of the state's early settlement and economy. Its national popularity by the 1960s made it a familiar, low-risk choice for state lawmakers."
      - "The 1989 lyric revision let Ohio keep the beloved tune while making the words speak more clearly about the state itself rather than just a river setting. That update helped the song serve double duty as both a nostalgic favorite and a genuine civic anthem."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Beautiful Ohio\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Beautiful Ohio" Became Ohio's State Song
    paragraphs:
      - "The Ohio General Assembly adopted \"Beautiful Ohio\" as the official state song in 1969, more than fifty years after its original release as a popular song. Ohio later added \"Hang On Sloopy\" as its official state rock song in 1985, making Ohio one of the few states with both a traditional state song and a rock song."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Ohio

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Beautiful Ohio\" Facts"
    facts:
      - "Ohio adopted \"Beautiful Ohio\" as its official state song in 1969."
      - "The song was originally published in 1918 by lyricist Ballard MacDonald and composer Mary Earl, a pen name for Robert A. King."
      - "Wilbert McBride wrote revised lyrics for the song in 1989, with the Ohio Legislature's approval."
      - "The melody borrows phrases from Rimsky-Korsakov's \"Song of India\" and Stephen Foster's \"Beautiful Dreamer.\""
      - "Ohio separately adopted \"Hang On Sloopy\" as its official state rock song in 1985."

