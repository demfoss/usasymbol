faq:
  - question: What is Ohio's state song?
    answer: "Ohio's official state song is \"Beautiful Ohio,\" adopted in 1969."
  - question: Who wrote Ohio's state song?
    answer: "Ballard MacDonald wrote the original lyrics in 1918, and composer Mary Earl, a pen name for Robert A. King, wrote the music."
  - question: When did Ohio adopt "Beautiful Ohio" as its state song?
    answer: "The Ohio General Assembly adopted the song in 1969."
  - question: Does Ohio have another official song besides "Beautiful Ohio"?
    answer: "Yes. Ohio adopted \"Hang On Sloopy\" as its official state rock song in 1985."

