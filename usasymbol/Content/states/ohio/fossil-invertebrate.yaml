faq:
- question: What is Ohio's state fossil invertebrate?
  answer: "Ohio's state fossil invertebrate is the trilobite Isotelus maximus, one of the largest trilobites ever known, from the Ordovician period about 450 million years ago, designated in 1985."
- question: When did Ohio adopt its state fossil invertebrate?
  answer: "Ohio designated Isotelus maximus as its official state fossil invertebrate in 1985."
- question: What did the trilobite look like?
  answer: "Isotelus maximus had a smooth oval body with a domed head shield, a segmented middle section, and a fused tail plate. Large individuals reached up to 24 inches in length — much bigger than most trilobites."
- question: Where are trilobite fossils found in Ohio?
  answer: "Isotelus fossils are found throughout the Cincinnati region in Upper Ordovician limestone. Hamilton, Butler, and Warren counties have the highest concentration of outcrops. The Cincinnati Museum Center has notable specimens."
- question: When did the trilobite live?
  answer: "Isotelus maximus lived during the Ordovician period, about 450 million years ago, when a shallow sea covered what is now southwestern Ohio."
- question: Why is the trilobite Ohio's state fossil?
  answer: "The Cincinnati region holds one of the richest Ordovician fossil records in North America, and Isotelus maximus — named the largest for its exceptional size — is the most distinctive fossil from those beds."

