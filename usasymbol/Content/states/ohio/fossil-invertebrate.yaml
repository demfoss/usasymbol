- id: facts
  icon: fa-solid fa-lightbulb
  title: Trilobite Facts
  facts:
  - "Ohio designated Isotelus maximus as its state fossil invertebrate in 1985."
  - "Isotelus maximus is one of the largest trilobites ever found — specimens reach up to 24 inches long."
  - "The species name maximus, Latin for largest, was assigned because Ohio specimens dwarf most other Isotelus finds."
  - "The Cincinnati region's Ordovician limestone outcrops are among the richest shallow-marine fossil beds in North America."
  - "Trilobites survived on Earth for about 270 million years before going extinct at the end of the Permian, 252 million years ago."

