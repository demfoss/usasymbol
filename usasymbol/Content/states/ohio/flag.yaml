seo_title: "Ohio State Flag: Meaning, Burgee Shape, History & Facts"
seo_description: "Read why Ohio uses this flag design, what each major emblem points to, and how the state records color details for Ohio's flag."

intro_text: "In 1902, Ohio adopted a flag that features a unique swallowtail burgee shape and stands out in the [list of U.S. state flags](/symbols/flags). Architect John Eisenmann designed the banner in 1901 for the Pan-American Exposition. Ohio's flag remains the only non-rectangular state flag in the United States."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Ohio State Flag Is Designed"
    paragraphs:
      - "The Ohio state flag is the official government flag of the state of Ohio. A blue triangle extends from the left edge. Three red and two white horizontal stripes fill the remaining space."
      - "Architect John Eisenmann created the design in 1901. He needed a flag to fly over the Ohio Building at the Pan-American Exposition in Buffalo, New York. State Representative William S. McKinnon introduced legislation to adopt the design. Ohio lawmakers approved it on May 9, 1902."
      - "The flag uses a swallowtail burgee shape. It stands as the only non-rectangular state flag in the United States. Seventeen white stars surround a white circle with a red center on the blue triangle."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Ohio State Flag Means"
    paragraphs:
      - "The Ohio state flag meaning connects to the state's landscape and position in the Union. Each element represents a specific feature of Ohio's geography or history."
      - "The burgee shape suggests Ohio's hills and valleys. The stripes stand for the state's roads and waterways. The white circle with its red center forms the letter O for Ohio and represents the buckeye nut from the state tree, linking directly to [Ohio buckeye symbolism](/states/ohio/tree/ohio-buckeye)."
      - "Seventeen stars mark Ohio as the seventeenth state admitted to the Union. Thirteen stars represent the original colonies. Four additional stars stand for Vermont, Kentucky, Tennessee, and Ohio."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Ohio Chose Its State Flag"
    paragraphs:
      - "Ohio operated without an official state flag for nearly a century after statehood in 1803. In 1860, military leaders proposed a flag featuring the state seal on a white field. James A. Garfield spoke against the proposal in 1861. He argued that Ohio soldiers should march under the national flag only. The plan was dropped."
      - "Cleveland architect John Eisenmann received a commission in 1901 to design the Ohio Building for the Pan-American Exposition. He created a distinctive burgee to fly at each corner of the building. The wool flags represented the Ohio Pan-American Exposition Commission rather than the state itself."
      - "Eisenmann obtained a U.S. design patent for his flag in July 1901. He described it as a triangular swallowtail flag similar to a cavalry guidon. State Representative William S. McKinnon introduced House Bill 213 in 1902 to adopt Eisenmann's design as the official state flag. Governor George K. Nash signed the bill into law on May 9, 1902, reinforcing themes later visible in [the Buckeye State nickname](/states/ohio/nickname/the-buckeye-state)."
      - "The press initially compared Ohio's flag to foreign designs. Some noted similarities to the Cuban or Philippine flags. Others criticized the red and white circles as resembling the Japanese flag. The design gained popularity slowly. By the early 1900s, only Governor Nash displayed the flag regularly."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Ohio Flag"
    symbols:
      - id: burgee
        name: "Ohio State Flag Burgee Shape"
        image: "symbols/burgee.svg"
        paragraphs:
          - "The Ohio flag uses a swallowtail burgee shape instead of a rectangle. The pointed end creates a distinctive silhouette. No other U.S. state flag shares this shape."
          - "Eisenmann designed the shape to represent Ohio's hills and valleys. The triangular form may draw from cavalry flags used during the Civil War and Spanish-American War. The unique shape prevents the flag from being flown incorrectly."

      - id: stars
        name: "Ohio State Flag Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Seventeen white five-pointed stars appear on the blue triangle. They surround the white circle and red disc. The stars are arranged in a specific pattern."
          - "Thirteen stars represent the original thirteen colonies. Four additional stars mark Vermont, Kentucky, Tennessee, and Ohio as the next four states to join the Union. Ohio became the seventeenth state in 1803."

      - id: circle
        name: "Ohio State Flag Circle"
        image: "symbols/circle.svg"
        paragraphs:
          - "A white circle sits at the center of the blue triangle. A red disc fills the circle's interior. Together they form the letter O."
          - "The circle represents Ohio's name. It also symbolizes the buckeye nut from the state tree. Eisenmann noted the design represents the original territory of Ohio in the Northwest Territory."

      - id: stripes
        name: "Ohio State Flag Stripes"
        image: "symbols/stripes.svg"
        paragraphs:
          - "Three red stripes alternate with two white stripes across the flag. The stripes run horizontally from the blue triangle to the pointed end."
          - "The stripes symbolize Ohio's roads and waterways. They connect the design to the national flag while maintaining a distinct appearance in the same civic framework as [Ohio's official motto](/states/ohio/motto/with-god-all-things-are-possible)."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Colors of the Ohio State Flag"
    paragraphs:
      - "The Ohio state flag uses red, white, and blue. These colors match those on the U.S. national flag. The Ohio Secretary of State provides specific Cable and Pantone values for each color, and broader palette comparisons appear in [the U.S. state colors guide](/symbols/colors)."
      - "Blue forms the triangular field on the left. Red appears in the central disc and three horizontal stripes. White fills two stripes and the circle surrounding the red disc, while modern population context is available in [U.S. states by population](/rankings/demographics/states-by-population)."
    colors:
      - name: "Blue"
        hex: "#002147"
        cable: "Cable No. 70075 Old Glory Blue"
        pantone: "PMS 282c"
      - name: "Red"
        hex: "#bb133e"
        cable: "Cable No. 70180 Old Glory Red"
        pantone: "PMS 193C"
      - name: "White"
        hex: "#ffffff"
        cable: "Cable No. 70001 White"
        pantone: "Pantone White"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Quick Facts About the Ohio State Flag"
    facts:
      - "Ohio made its swallowtail burgee the official state flag on May 9, 1902"
      - "John Eisenmann designed the flag in 1901 for the Pan-American Exposition"
      - "The flag is the only non-rectangular U.S. state flag"
      - "The swallowtail shape is called a burgee"
      - "An official folding procedure creates 17 folds symbolizing Ohio as the 17th state"
      - "Ohio adopted an official flag salute in 2002 for the flag's centennial"

faq:
  - question: "Which flag serves as Ohio's official banner?"
    answer: "The state flag of Ohio is the official banner of Ohio, featuring a blue triangle with 17 white stars and a white circle with a red center, plus red and white stripes."

  - question: "What are the key symbols on Ohio's flag?"
    answer: "The flag has a blue triangle on the left with 17 white stars surrounding a white circle and red disc. Three red and two white horizontal stripes extend to a swallowtail point on the right."

  - question: "What should readers know first about Ohio's flag?"
    answer: "The Ohio state flag uses a swallowtail burgee shape with a pointed end instead of a rectangular edge."

  - question: "Who is credited with the design of Ohio's flag?"
    answer: "John Eisenmann designed the flag with a burgee shape to represent Ohio's hills and valleys and to create a distinctive design that stands apart from other state flags."

  - question: "What stands out most about Ohio's flag?"
    answer: "Ohio's flag is the only non-rectangular state flag in the United States. Its swallowtail burgee shape distinguishes it from all other U.S. state flags."

  - question: "What symbols appear on the Ohio state flag?"
    answer: "The Ohio state flag has 17 white stars."

  - question: "Which emblems or icons are shown on Ohio's flag?"
    answer: "Thirteen stars represent the original colonies. Four stars represent Vermont, Kentucky, Tennessee, and Ohio, making Ohio the 17th state admitted to the Union."

  - question: "When was the present Ohio flag approved in law?"
    answer: "Ohio adopted its state flag on May 9, 1902."

