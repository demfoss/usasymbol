sections:
- id: overview
  title: What Is the State Insect of Ohio?
  paragraphs:
  - "The ladybug, family Coccinellidae, is Ohio's official state insect. The Ohio General Assembly designated it in 1975."
  - "Several small beetle species in the same family go by the name ladybug, so the title belongs to a group and not one species."

- id: about
  title: About the Ladybug
  paragraphs:
  - "Think of a tiny red or orange dome with black spots. That is a ladybug, a small, round beetle with a hard shell."
  - "Wings folded away beneath the hard shell let ladybugs fly. They also have short legs and antennae."
  - "They are commonly found on plants and in gardens, where they feed on aphids and other small, soft-bodied insects."

- id: history
  title: How Ohio Chose the Ladybug
  paragraphs:
  - "The Ohio General Assembly designated the ladybug as the official state insect in 1975."
  - "The ladybug was chosen as a familiar, easily recognized insect found throughout Ohio's gardens and farmland."

- id: facts
  title: Ladybug Facts
  facts:
  - "Adopted: 1975, by the Ohio General Assembly."
  - "Ladybug refers to beetles in the family Coccinellidae, not one single species."
  - "Small, round, domed beetle, usually red or orange with black spots."
  - "Ladybugs feed on aphids and other small insects in gardens and on plants."
  - "Several other states, including Massachusetts, New York, and Tennessee, also recognize a ladybug as their state insect."




