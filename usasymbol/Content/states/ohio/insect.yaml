faq:
- question: What is Ohio's state insect?
  answer: "Ohio's state insect is the ladybug, adopted by the Ohio General Assembly in 1975."
- question: When did Ohio adopt the ladybug?
  answer: "Ohio adopted the ladybug as its official state insect in 1975."
- question: Why did Ohio choose the ladybug?
  answer: "The ladybug is a familiar, easily recognized insect found throughout Ohio's gardens and farmland."
- question: What does Ohio's state insect look like?
  answer: "The ladybug is a small, round, domed beetle, usually red or orange with black spots."
- question: Is the ladybug one specific species?
  answer: "No. Ladybug is a common name for many small beetle species in the family Coccinellidae, not one single species."

