faq:
  - question: "What is Ohio's state nut?"
    answer: "The buckeye is listed as Ohio's state nut, dating to 1953."
  - question: "When was the buckeye listed as Ohio's state nut?"
    answer: "State food lists give 1953 as the designation year."
  - question: "Why is the buckeye associated with Ohio?"
    answer: "The Ohio buckeye tree grows across the state and gave Ohio its long-standing Buckeye State nickname."
  - question: "Is the buckeye eaten in Ohio?"
    answer: "No. The actual buckeye seed is toxic. Ohio's buckeye candy is named for its appearance but contains peanut butter and chocolate instead."

