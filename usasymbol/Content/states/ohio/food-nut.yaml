sections:
  - id: overview
    icon: fa-solid fa-seedling
    title: "What Is Ohio's State Nut?"
    paragraphs:
      - "The buckeye is listed as Ohio's state nut with a 1953 designation year. Unlike most other state nuts, the buckeye is not a food crop. It is a symbolic nut tied to the Ohio buckeye tree and the Buckeye State nickname."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Buckeye"
    paragraphs:
      - "The buckeye is the seed of the Ohio buckeye tree, a round, dark brown nut with a lighter tan patch that looks a bit like a deer's eye, which is how it got its name. It grows inside a spiky green husk that splits open in the fall. Buckeyes are toxic if eaten raw and are not used as food. In Ohio, people also make a popular peanut butter and chocolate candy shaped and named after the buckeye nut, though the candy contains no actual buckeye seed."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Buckeye Became Ohio's State Nut"
    paragraphs:
      - "Compiled state food lists date the buckeye's state nut status to 1953, the year Ohio officially adopted the Ohio buckeye as its state tree."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Ohio Chose the Buckeye"
    paragraphs:
      - "The buckeye is associated with Ohio because the Ohio buckeye tree grows throughout the state and Ohioans have been called Buckeyes since the early 1800s. Its place in state food lists reflects that familiar identity rather than an edible farm crop."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Buckeye Facts"
    facts:
      - "Listed as Ohio's state nut with a 1953 designation year."
      - "The buckeye nut is toxic raw and is not eaten as food."
      - "Ohio's nickname, the Buckeye State, dates back to the early 1800s."
      - "The Ohio buckeye tree became Ohio's official state tree in 1953."

