hero_image_caption: The Great Seal of Ohio, adopted at the 1802 Chillicothe constitutional convention. The rising sun has 13 rays representing the original states; the 17 arrows below represent Ohio's place as the 17th state admitted to the Union.
intro_text: "Ohio's state seal shows 17 arrows for the 17th state, 13 rays on a rising sun for the 13 original colonies, and the Scioto River valley below Mount Logan, a composition designed in 1802 to say exactly where Ohio stood in the new nation's geography and order. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
