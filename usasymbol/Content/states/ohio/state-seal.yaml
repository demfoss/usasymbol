type: State Seal
state: Ohio
name: Great Seal of Ohio
adopted_year: 1803
is_official: true
legislation: Ohio Revised Code § 5.03
meaning: "The Great Seal of Ohio uses two precise numbers to mark where Ohio stands in American history: 17 arrows for the 17th state, and 13 rays on the rising sun for the 13 original colonies. The seal shows the Scioto River valley at dawn, with Mount Logan in the background and a sheaf of wheat in the foreground above cultivated fields, placing agricultural abundance at the base of the scene and westward expansion at its horizon."
