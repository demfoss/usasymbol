date_modified: '2026-07-30'
seo_title: "Ohio State Native Fruit | Pawpaw"
seo_description: "Ohio's state native fruit is the pawpaw, adopted in 2009, the largest edible fruit native to North America."
hero_image: /images/foods/ohio/ohio-state-native-fruit-hero.webp
hero_image_alt: "Ripe green pawpaw fruit hanging from a tree branch."
hero_image_caption: "The pawpaw, Ohio's official state native fruit."
intro_text: "Ohio's state native fruit is the pawpaw, adopted in 2009 to recognize the largest edible fruit native to North America, which grows wild across the state. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Ohio's State Native Fruit?"
    paragraphs:
      - "The pawpaw is Ohio's official state native fruit, designated by the Ohio General Assembly in 2009. Pawpaws grow wild in the understory of forests across Ohio and much of the eastern United States."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pawpaw"
    paragraphs:
      - "Pawpaws are oblong, green-skinned fruits with soft, custard-like yellow flesh often described as tasting like a mix of banana and mango. They grow on small understory trees and ripen in late summer and early fall, but bruise easily and are rarely sold in stores."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Pawpaw Became Ohio's State Native Fruit"
    paragraphs:
      - "The Ohio General Assembly designated the pawpaw the official state native fruit in 2009."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Ohio Chose the Pawpaw"
    paragraphs:
      - "The pawpaw is the largest fruit native to North America and grows wild throughout Ohio's forests, and the town of Albany in southeastern Ohio hosts the Ohio Pawpaw Festival each September, one of the largest celebrations of the fruit in the country."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Pawpaw Comes From in Ohio"
    paragraphs:
      - "Southeastern Ohio, especially around Albany in Athens County, is closely associated with the pawpaw and hosts the Ohio Pawpaw Festival every September."
    sites:
      - name: Ohio Pawpaw Festival site
        city: Albany
        lat: 39.23
        lng: -82.20
        note: "Home of the Ohio Pawpaw Festival"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pawpaw Facts"
    facts:
      - "Adopted as Ohio's state native fruit in 2009."
      - "The pawpaw is the largest fruit native to North America."
