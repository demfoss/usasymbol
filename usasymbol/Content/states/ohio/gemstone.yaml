sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Ohio State Gemstone
    paragraphs:
      - "Ohio flint is the state's official gemstone, designated by the General Assembly in 1965. Flint Ridge, a six-square-mile ridge in Licking and Muskingum counties, has supplied colorful flint to toolmakers and, later, jewelers and collectors for over 12,000 years."
      - "Legislators chose flint over a more conventional gem because of how thoroughly it is tied to Ohio's early human history, not for its market value."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Ohio Flint?"
    paragraphs:
      - "Ohio flint is a hard, fine-grained variety of quartz that fractures into sharp, curved flakes when struck. Unlike plain gray flint found elsewhere, Ohio's deposits show a wide range of color, including red, pink, blue, gray, and white, often swirled together in the same piece."
      - "Polishing brings out the color banding, which is why lapidaries cut Ohio flint into cabochons and slabs for jewelry. It formed within ancient limestone beds, where silica gradually replaced the original rock over millions of years."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Ohio Chose Ohio Flint as Its State Gemstone"
    paragraphs:
      - "Flint Ridge was one of the most important toolmaking sources in eastern North America. Native peoples quarried it for spear points, knives, and trade goods that have been found as far away as the Rocky Mountains and the Gulf of Mexico."
      - "Early settlers continued to use the stone for millstones and gun flints after Native quarrying declined. That long, continuous use, spanning thousands of years and multiple cultures, gave Ohio flint a claim to state symbol status that a purely decorative gem could not match."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Ohio Flint Became Ohio's State Gemstone"
    paragraphs:
      - "The Ohio General Assembly designated flint the official state gemstone in 1965, recognizing a stone already central to the state's archaeological record and to its rock-collecting community."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Ohio Flint Is Found in Ohio"
    paragraphs:
      - "Flint Ridge, straddling eastern Licking County and western Muskingum County, holds Ohio's best-known flint deposits. A state memorial and nature preserve protects part of the ridge, with an on-site museum built over an original quarry pit."
    sites:
      - name: Flint Ridge State Memorial and Nature Preserve
        city: Glenford
        lat: 39.9903
        lng: -82.2600
        note: "Quarried for flint for over 12,000 years"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Ohio Flint Facts"
    facts:
      - "Adopted as Ohio's state gemstone in 1965."
      - "Flint Ridge covers about six square miles across Licking and Muskingum counties."
      - "Tools made from Flint Ridge flint have been found as far away as the Rocky Mountains and the Gulf Coast."
      - "Ohio flint can occur in nearly every color, including red, pink, blue, and black, often banded together in one piece."

