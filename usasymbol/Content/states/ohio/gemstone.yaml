faq:
  - question: What is Ohio's state gemstone?
    answer: "Ohio's state gemstone is Ohio flint, a hard, colorful variety of quartz adopted by the General Assembly in 1965."
  - question: When did Ohio adopt flint as its state gemstone?
    answer: "The Ohio General Assembly designated flint the official state gemstone in 1965."
  - question: Why did Ohio choose flint?
    answer: "Flint Ridge supplied Native toolmakers for more than 12,000 years, and tools made there have been found as far away as the Rocky Mountains, giving flint a deep tie to Ohio's early history."
  - question: What color is Ohio flint?
    answer: "Ohio flint occurs in a wide range of colors, including red, pink, blue, gray, white, and black, often banded together in a single piece."

