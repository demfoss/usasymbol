seo_title: "Ohio State Amphibian | Spotted Salamander"
seo_description: "Ohio's state amphibian is the spotted salamander, adopted in 2010. Learn what it looks like and why it became official."
hero_image: /images/amphibians/ohio/ohio-state-amphibian-hero.webp
hero_image_alt: "A black spotted salamander with two rows of yellow spots on a forest floor."
hero_image_caption: "The spotted salamander, Ohio's state amphibian, is found in woodlands across the state."
intro_text: "Ohio's state amphibian is the spotted salamander, a black salamander with bright yellow spots, adopted in 2010. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Ohio?
    paragraphs:
      - "The spotted salamander is Ohio's official state amphibian, designated by the Ohio General Assembly in 2010. Its scientific name is Ambystoma maculatum."
      - "It is a large, secretive salamander that spends most of the year underground and only appears at the surface to breed."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Spotted Salamander
    paragraphs:
      - "The spotted salamander has smooth, dark bluish-black to black skin with two uneven rows of round yellow or orange spots running from its head to the tip of its tail."
      - "It can grow to about 6 to 10 inches long, making it one of the larger salamanders found in Ohio."
      - "It spends most of its life hidden underground or under logs and leaf litter, coming out mainly on rainy spring nights to migrate to breeding ponds."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Ohio General Assembly designated the spotted salamander the official state amphibian in 2010, giving Ohio's amphibians their own dedicated state symbol."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Ohio Chose the Spotted Salamander
    paragraphs:
      - "Official sources name the spotted salamander as the state amphibian but do not give a detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Spotted Salamander
    paragraphs:
      - "The spotted salamander lives in moist deciduous forests throughout Ohio, especially near vernal pools and other temporary woodland ponds used for breeding."
    sites:
      - name: Hocking Hills State Park
        city: Logan
        lat: 39.43
        lng: -82.54
        note: "Forest habitat with breeding pools"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Spotted Salamander Facts
    facts:
      - "Adopted in 2010 by the Ohio General Assembly."
      - "Has two rows of yellow or orange spots along its dark body."
      - "Can grow to about 6 to 10 inches long."
      - "Spends most of the year underground and migrates to ponds to breed in early spring."
      - "Can live for 20 years or more in the wild."

