faq:
- question: What is Washington's state insect?
  answer: "Washington's state insect is the green darner dragonfly, adopted by the Washington State Legislature in 1997."
- question: When did Washington adopt the green darner dragonfly?
  answer: "Washington adopted the green darner dragonfly as its official state insect in 1997."
- question: Why did Washington choose the green darner dragonfly?
  answer: "Washington schoolchildren campaigned for an official state insect, and lawmakers responded in 1997 by naming the green darner dragonfly."
- question: What does the green darner dragonfly look like?
  answer: "It has a bright green thorax and head. Males have a blue abdomen, while females have a duller brown or reddish abdomen. It has a wingspan of about 4 inches."
- question: Where is the green darner dragonfly found in Washington?
  answer: "It is found statewide near ponds, lakes, slow streams, and marshes, from lowland wetlands to higher elevation waters."
- question: Does the green darner dragonfly migrate?
  answer: "Yes. Some green darners in Washington migrate south for the winter, similar to monarch butterflies, while others stay in the region year-round."

