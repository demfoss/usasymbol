sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Washington?
  paragraphs:
  - "The green darner dragonfly, Anax junius, is Washington's official state insect. The Washington State Legislature designated it in 1997."
  - "It is one of the largest and most common dragonflies in North America, found near ponds, lakes, and marshes across the state."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Green Darner Dragonfly
  paragraphs:
  - "The green darner has a bright green thorax and head, with males showing a blue abdomen and females showing a duller brown or reddish abdomen."
  - "Adults have a wingspan of about 4 inches, making them one of the larger dragonflies found in Washington."
  - "Green darners are strong, fast fliers that patrol back and forth over open water while hunting smaller flying insects."

- id: history
  icon: fa-solid fa-landmark
  title: How Washington Chose the Green Darner Dragonfly
  paragraphs:
  - "Washington schoolchildren pushed for an official state insect and brought the idea to state lawmakers."
  - "In 1997, the Washington State Legislature responded by naming the green darner dragonfly the official state insect."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Green Darner Dragonfly in Washington
  paragraphs:
  - "Green darners are found throughout Washington near ponds, lakes, slow streams, and marshes, from lowland wetlands to higher elevation waters."
  - "Some green darners in Washington migrate south for the winter, similar to monarch butterflies, while others remain in the region year-round as resident populations."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Green Darner Dragonfly Facts
  facts:
  - "Adopted in 1997 by the Washington State Legislature."
  - "Scientific name: Anax junius."
  - "Wingspan: about 4 inches, with a green thorax and a blue abdomen in males."
  - "Chosen after Washington schoolchildren campaigned for an official state insect."
  - "Some green darners migrate south for winter, much like monarch butterflies."




