seo_title: "Washington State Flag | George Washington Meaning"
seo_description: "Washington is the only U.S. state with a green flag — and the only one showing a president's portrait. George Washington's face, from Gilbert Stuart's famous painting, sits at the center. Adopted 1923."

intro_text: "Washington's state flag stands out among all 50 state flags in two ways no other state can claim: it is the only flag with a **dark green background**, and the only flag showing the **likeness of a U.S. president** — George Washington, rendered from Gilbert Stuart's famous portrait. The state seal, featuring Washington's portrait in a gold ring inscribed \"The Seal of the State of Washington 1889,\" sits at the center. The Daughters of the American Revolution designed the flag in 1915; the legislature formally adopted it on March 5, 1923. The green field represents Western Washington's evergreen forests — the same identity carried by [The Evergreen State nickname](/states/washington/nickname/the-evergreen-state). The flag is featured in the [U.S. state flags collection](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Washington State Flag Is Designed"
    paragraphs:
      - "The Washington state flag is the official government flag of the state of Washington. A dark green rectangular field forms the background. The state seal sits in the center. The seal shows George Washington's portrait inside a gold ring with the words The Seal of the State of Washington 1889."
      - "The flag may include optional gold fringe along the outer edge when displayed indoors. The Secretary of State regulates flag protocol and approves replica flags for commercial sale. Washington is the only U.S. state with a green flag and the only state flag depicting a U.S. president."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Washington State Flag Means"
    paragraphs:
      - "The Washington state flag meaning comes from symbols depicting Washington's evergreen forests and honoring its founding president. The design honors George Washington while reflecting the state's natural landscape and evergreen identity represented by [Washington's state tree](/states/washington/tree/western-hemlock)."
      - "The green field represents the verdant fields of Western Washington. The gold seal symbolizes the wheat areas of Eastern Washington. These colors balance the state's contrasting regions and reinforce [The Evergreen State nickname](/states/washington/nickname/the-evergreen-state)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Washington Flag History and Adoption"
    paragraphs:
      - "Washington became a state on November 11, 1889. The state adopted its seal on August 21, 1889, during the constitutional convention. No official flag existed for the first three decades of statehood. Military units used unofficial flags showing George Washington's gold profile on blue fabric during the Philippine-American War in 1899."
      - "The Daughters of the American Revolution began campaigning for a state flag in 1909 during the Alaska-Yukon-Pacific Exposition in Seattle. The national DAR requested a Washington flag for display in Washington, D.C., in 1914. The Washington DAR formed a design committee led by Emma Chadwick. The committee created a flag with a green background and the state seal in the center. The DAR flag was manufactured in 1915 at a cost of $48."
      - "Representative William J. Hughes proposed forming a flag commission in 1913. The bill passed the House but failed in the Senate. Patriotic groups opposed state flags as detrimental to the national flag. The DAR renewed its lobbying in 1922 with support from civic organizations. The legislature passed a flag bill unanimously in 1923. The law took effect on June 7, 1923."
      - "The legislature changed the fringe from green to gold in 1925-26 to match the state seal. The Secretary of State issued standardized colors in 1955. Dick Nelms redesigned the state seal in 1967 using Gilbert Stuart's famous portrait of George Washington. The legislature approved the new seal in April 1967, long after the territorial period associated with [Washington's motto, Alki](/states/washington/motto/al-ki)."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Washington Flag"
    symbols:
      - id: seal
        name: "Washington State Flag Seal"
        image: "symbols/seal.svg"
        paragraphs:
          - "The state seal dominates the center of the flag. The seal was adopted on August 21, 1889. It shows George Washington's portrait inside a gold ring. The words The Seal of the State of Washington 1889 circle the portrait."
          - "Dick Nelms redesigned the seal in 1967. He based it on Gilbert Stuart's portrait painting of George Washington. The seal diameter measures one-third the length of the flag."

      - id: portrait
        name: "Washington State Flag Portrait"
        image: "symbols/portrait.svg"
        paragraphs:
          - "George Washington's portrait sits at the center of the seal. Washington is the state's namesake. The portrait comes from Gilbert Stuart's famous painting."
          - "Washington is the only U.S. state flag to feature the likeness of an identifiable historic person. The portrait faces the same direction on both sides of the flag."

      - id: green-field
        name: "Washington State Flag Green Field"
        image: "symbols/green-field.svg"
        paragraphs:
          - "A dark green field forms the background of the flag. Washington is the only U.S. state with a green flag. The green represents the verdant fields of Western Washington."
          - "The color choice reflects the state's forests and natural landscape. Green distinguishes Washington's flag from other state flags."

      - id: gold-ring
        name: "Washington State Flag Gold Ring"
        image: "symbols/gold-ring.svg"
        paragraphs:
          - "A gold ring surrounds George Washington's portrait. The text The Seal of the State of Washington 1889 appears in the ring. The year 1889 marks when Washington became a state."
          - "The gold represents the wheat areas of Eastern Washington. Gold balances the green field to symbolize both sides of the state."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Washington State Flag Colors"
    paragraphs:
      - "The Washington state flag uses dark green and gold as primary colors. The seal contains additional colors including flesh tones, blue, and black. Colors were standardized in 1955 using the Standard Color Reference of America and Pantone Matching System, in close alignment with [Washington's official bird and other symbols](/states/washington/bird/american-goldfinch)."
