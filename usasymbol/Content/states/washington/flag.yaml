  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Washington State Flag Facts"
    facts:
      - "Washington adopted its state flag on March 5, 1923"
      - "The flag is the only U.S. state flag with a green field"
      - "Washington is the only state flag showing a U.S. president"
      - "The Daughters of the American Revolution designed the flag in 1915"
      - "The seal was redesigned by Dick Nelms in 1967"
      - "The flag is among the most expensive state flags to manufacture"

faq:
  - question: "Which flag serves as Washington's official banner?"
    answer: "The Washington state flag is the official banner of Washington, featuring the state seal with George Washington's portrait on a dark green field."

  - question: "What are the main visual elements on Washington's flag?"
    answer: "The flag shows a dark green background with the state seal in the center. The seal displays George Washington's portrait inside a gold ring with text."

  - question: "What symbols appear on the Washington state flag?"
    answer: "The state seal appears on the flag, showing George Washington's portrait in a gold ring with the words The Seal of the State of Washington 1889."

  - question: "Who is credited with the design of Washington's flag?"
    answer: "The Daughters of the American Revolution designed the flag in 1915. Emma Chadwick led the design committee. Dick Nelms redesigned the seal in 1967."

  - question: "When was the present Washington flag approved in law?"
    answer: "Washington adopted its state flag on March 5, 1923. The law took effect on June 7, 1923."

  - question: "What should readers know first about Washington's flag?"
    answer: "Washington is the only U.S. state flag with a green background and the only state flag showing the likeness of a U.S. president."

  - question: "What does the Washington state flag mean?"
    answer: "The green field represents Western Washington's dense evergreen forests — the same identity captured in the state's nickname, the Evergreen State. The gold seal ring represents the wheat fields of Eastern Washington, balancing the state's two contrasting regions. George Washington's portrait honors the state's namesake and signals that Washington took statehood seriously from the start, choosing the nation's founding president as its central image."

  - question: "Why is the Washington state flag green?"
    answer: "Washington chose a dark green background to represent the state's vast evergreen forests, which define the western half of the state. No other U.S. state flag uses green as its primary background color, making Washington's flag immediately distinctive. The Daughters of the American Revolution selected the green field when they designed the flag in 1915; the legislature formally adopted it in 1923."

  - question: "When was the Washington state flag officially adopted?"
    answer: "Washington's state flag was officially adopted on March 5, 1923, when the legislature passed the flag bill unanimously. The law took effect on June 7, 1923. The Daughters of the American Revolution had been using the green-background design since 1915, lobbying for official adoption for nearly a decade. Colors were formally standardized by the Secretary of State in 1955."

  - question: "What are the colors of the Washington state flag?"
    answer: "Washington's state flag uses dark green (Irish Green) as the field color and Spanish Yellow (gold) for the seal ring. The seal itself contains additional colors including Oriental Blue, black, and eggshell. These colors were standardized in 1955 using the Standard Color Reference of America and the Pantone Matching System."

