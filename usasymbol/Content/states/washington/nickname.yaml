title: "The Evergreen State"
state: "Washington"
type: "State Nickname"
is_official: true
adopted_year: null
other_nicknames:
  - "The Chinook State"
  - "The Green Tree State"

author: "USA Symbol Team"
date_published: "2025-12-16"
date_modified: "2026-03-11"
seo_title: "Washington State Nickname | The Evergreen State"
seo_description: "Washington is known as The Evergreen State, its official state nickname. Learn what Evergreen State means, why Washington uses it, and what other nicknames the state has had."

intro_text: "People commonly refer to Washington as <i>The Evergreen State</i>. Dense coniferous forests stay green year-round across much of the state. Douglas fir, western hemlock, and cedar trees dominate the landscape west of the Cascade Mountains."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Evergreen State'"
    paragraphs:
      - "The Washington nickname Evergreen State describes forests that keep their needles through winter instead of dropping leaves. Heavy rainfall west of the Cascades creates ideal conditions for conifers. Douglas fir, Sitka spruce, western red cedar, and western hemlock grew in such density that early settlers described traveling through permanent twilight under the canopy. That same forest identity is reflected in [Washington's state tree, the western hemlock](/states/washington/tree/western-hemlock)."
      - "C.T. Conover, a Seattle real estate developer, promoted the Evergreen State name during the 1890s to attract settlers and investors. He published promotional materials emphasizing Washington's timber resources and green landscape. Newspapers picked up the phrase, and it spread through travel guides and advertisements. Forests covered nearly half of Washington's total area, making timber the backbone of the territorial economy."
      - "The Evergreen State is Washington’s established state nickname. License plates have displayed the phrase since the 1950s without any law requiring it. Some residents question whether the name fits eastern Washington, where sagebrush deserts and wheat fields dominate rather than forests. The Cascade Mountains create such different climates that the two halves of the state look nothing alike. The Evergreen State stands out in the [united states nicknames by state](/symbols/nicknames) as one of the few nicknames that technically describes only part of its state — the rainy west and dry east could almost qualify for separate identities."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Chinook State"
        text: "Traders and settlers in the late 1800s sometimes called Washington the Chinook State after the Native people who controlled the Columbia River region. The Chinook had lived along the river and coast for thousands of years, developing extensive trading networks and controlling prime salmon fishing locations. They created Chinook Jargon, a trade language mixing their own words with French, English, and other tribal languages that became essential for commerce across the Pacific Northwest. Early documents and promotional materials occasionally used Chinook State to describe the territory. A warm winter wind that melts snow rapidly also carries the Chinook name in parts of Washington. The nickname faded as Evergreen State gained popularity, and few modern residents recognize it, while this territorial-era language legacy remains closely tied to [Washington's state motto page](/states/washington/motto/al-ki)."
      - subtitle: "The Green Tree State"
        text: "Travel writers used Green Tree State occasionally during the early 1900s as a simpler version of Evergreen State. The phrase appeared in brochures and newspaper articles describing Washington's forests to potential visitors and settlers. It meant essentially the same thing but with more straightforward language. Green Tree State never caught on widely, possibly because it sounded too plain or lacked the distinctive quality that made Evergreen State memorable. Historical records from the territorial period mention it sporadically. Modern Washington residents almost never use or recognize this nickname, and it survives mainly in archived documents from early statehood."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The Evergreen State nickname has never been officially adopted by Washington's legislature despite appearing on license plates for decades."
      - "Forests cover approximately 22 million acres, or about half of Washington's total land area, mostly with evergreen conifers."
      - "C.T. Conover, a Seattle real estate developer, popularized the Evergreen State nickname in the 1890s through promotional campaigns."
      - "Eastern Washington has a dramatically different climate than western Washington, with dry conditions creating sagebrush deserts instead of forests."
      - "The state motto is 'Alki,' a Chinook Jargon word meaning 'by and by' or 'someday,' adopted in 1889 when Washington became a state; see [the Washington state flag history](/states/washington/flag/washington-state-flag) for how territorial and state-era symbols diverged."
      - "Washington produces more apples than any other state, with orchards concentrated in the drier eastern regions rather than evergreen forests."

faq:

  - question: "What is Washington nickname?"
    answer: "Washington nickname is the Evergreen State. The name describes abundant evergreen forests covering much of the state, though it has never been officially adopted by law."

  - question: "Why is Washington called the Evergreen State?"
    answer: "Washington earned this nickname because dense coniferous forests stay green year-round. Douglas fir, western hemlock, and other evergreen trees cover nearly half the state's land area."

  - question: "What is the Washington nickname evergreen state history?"
    answer: "The Washington nickname evergreen state history traces to the 1890s when C.T. Conover promoted it to attract settlers. The phrase spread through newspapers, travel guides, and promotional materials."

  - question: "What is the Washington nickname and motto?"
    answer: "The Washington nickname is the Evergreen State. The state motto is 'Alki,' a Chinook Jargon word meaning 'by and by' or 'someday,' adopted in 1889."

  - question: "Does all of Washington have evergreen forests?"
    answer: "No, western Washington has dense evergreen forests while eastern Washington has dry conditions with sagebrush deserts and grasslands. The Cascade Mountains create this dramatic climate difference."

  - question: "When did Washington start using the Evergreen State nickname?"
    answer: "The Evergreen State nickname gained popularity in the 1890s through promotional campaigns. It appeared on license plates starting in the 1950s despite never receiving official legislative approval."

  - question: "What other nicknames does Washington have?"
    answer: "Washington has been called the Chinook State and Green Tree State. These older nicknames referred to Native people and forests but never gained widespread recognition."

