seo:
  title: "Most Common Last Names in Washington"
  description: "The most common last names in Washington are Johnson, Anderson, and Brown, with Nordic, Asian, and Yakima Valley Latino roots shaping the list."

page:
  h1: "Most Common Last Names in Washington"
  intro: "The most common last names in Washington are Johnson, Anderson, and Brown, a top three shaped by old Anglo-American migration and an unusually strong Nordic imprint around Puget Sound. Nelson, Peterson, Olson, and Lee in the top 20 show how fishing ports, timber towns, Seattle's Asian communities, and later refugee resettlement changed the state's surname map."
  heritage_title: "Nordic Ports, Asian Seattle, and Yakima Valley Fields"
  heritage_body: "Washington's surname pattern begins with settlers from the Midwest, Canada, and the older American West who moved into logging camps, wheat counties, and railroad towns in the late nineteenth century. Scandinavian immigrants gave the state one of the country's strongest Nordic surname layers, especially in Ballard, Puget Sound maritime trades, and coastal fishing communities where Johnson, Anderson, Nelson, Peterson, and Olson stayed common. Asian migration added another visible layer: Chinese residents were present in Seattle by the 1860s, Japanese farmers helped shape King County agriculture before World War II, and Southeast Asian refugees after 1975 helped lift Nguyen and Tran. In Eastern Washington, Mexican and Mexican American farmworker communities centered in the Yakima Valley and Columbia Basin pushed Garcia, Martinez, Lopez, Hernandez, and Rodriguez into the broader statewide ranking."
  fun_fact: "Olson ranks 18th in Washington but only 135th nationally, one of the clearest surname clues that the state's Nordic history is not just a Ballard memory but a statewide demographic mark."

surnames:
  - rank: 1
    name: Johnson
    count: 57427
    ratio: 132
    origin: scandinavian
    type: Patronymic
    meaning: "Son of John, from the Hebrew name Yohanan. In Washington it is both an Anglo-American surname and a Scandinavian one, strengthened by Norwegian and Swedish families who entered Puget Sound fishing, logging, and maritime work from the late nineteenth century onward."

  - rank: 2
    name: Anderson
    count: 37691
    ratio: 202
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Anders or Andrew. Anderson ranks especially high in Washington because Danish, Norwegian, and Swedish immigrants settled around Seattle, Ballard, Tacoma, and smaller mill and fishing towns where Nordic churches and trade networks kept the name visible."

  - rank: 3
    name: Brown
    count: 33604
    ratio: 226
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', a nickname for brown hair, complexion, or clothing. Brown reached Washington through broad English-speaking migration and appears across the state's older settlement zones, from Puget Sound towns to inland farming counties."

  - rank: 4
    name: Miller
    count: 31277
    ratio: 243
    origin: english
    type: Occupational
    meaning: "An occupational surname for someone who ran a grain mill. Miller fits Washington's early economy, where wheat counties east of the Cascades, timber towns, and river settlements all depended on practical trades tied to food, lumber, and transport."

  - rank: 5
    name: Williams
    count: 30021
    ratio: 253
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic name Willahelm. Williams belongs to the durable British surname base carried west by families from the Midwest, the South, and the older Pacific Northwest during Washington's rapid growth after statehood in 1889."

  - rank: 6
    name: Jones
    count: 29211
    ratio: 260
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning son of John. In Washington, Jones reflects general English-language migration rather than one enclave, which is why it appears in older ports, agricultural counties, and growing suburbs alike."

  - rank: 7
    name: Davis
    count: 25675
    ratio: 296
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from the Hebrew name Dawid, meaning beloved. Davis followed the same westward routes that filled Washington's railroad towns, farms, and timber communities in the late nineteenth and early twentieth centuries."

  - rank: 8
    name: Nelson
    count: 22060
    ratio: 345
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Nels or Nils, a Scandinavian form of Nicholas. Nelson's high Washington rank points to the Nordic families who worked in Puget Sound maritime trades, Alaska fishing routes, logging camps, and coastal settlements."

  - rank: 9
    name: Lee
    count: 22052
    ratio: 345
    origin: english
    type: Habitational
    meaning: "In English, Lee means a clearing or meadow, from Old English 'leah', but in Washington it also overlaps with Chinese and Korean surname traditions. That dual identity matters in a state where Seattle's Asian American communities have been central since the nineteenth century."

  - rank: 10
    name: Thompson
    count: 19528
    ratio: 389
    origin: english
    type: Patronymic
    meaning: "Son of Thomas, with the inserted 'p' becoming standard in medieval spelling. Thompson is common in Washington because it traveled easily with English-speaking settlers and also fit the wider northern European surname pool."

  - rank: 11
    name: Peterson
    count: 18019
    ratio: 422
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Peter, often anglicized from Petersen or Pedersen. Peterson ranks high in Washington because Nordic immigrants became prominent in Ballard, coastal fishing, and Puget Sound shipping work."

  - rank: 12
    name: Taylor
    count: 17956
    ratio: 424
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a cutter of cloth. Taylor is one of the broad occupational surnames carried west by English-speaking families into Washington's farms, ports, mining districts, and later metro suburbs."

  - rank: 13
    name: Martin
    count: 17258
    ratio: 441
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', associated with Mars. In Washington, Martin is shared by several communities, including older Anglo-American families, French Canadian and Catholic lines, and Spanish-speaking families where Martin and Martinez sit near each other in the broader ranking."

  - rank: 14
    name: Clark
    count: 17168
    ratio: 443
    origin: english
    type: Occupational
    meaning: "From clerk, originally a literate or clerical worker. Clark has a Northwest resonance because William Clark's name was attached to the Lewis and Clark Expedition, but most Washington Clark families reflect wider English-language migration rather than one founder."

  - rank: 15
    name: Nguyen
    count: 15654
    ratio: 486
    origin: vietnamese
    type: Dynastic
    meaning: "Vietnam's most common surname, associated with the Nguyen dynasty and earlier Chinese-derived forms. Its Washington rank reflects Southeast Asian refugee resettlement after 1975 and later Vietnamese American communities in Seattle, King County, and other urban centers."

  - rank: 16
    name: Thomas
    count: 15105
    ratio: 503
    origin: welsh
    type: Patronymic
    meaning: "From the Aramaic word for twin, carried into English and Welsh naming traditions through Christian usage. Thomas is a classic British surname in Washington, spread broadly by families who arrived for railroads, agriculture, military work, and urban jobs."

  - rank: 17
    name: White
    count: 14924
    ratio: 510
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', usually a nickname for fair hair, pale complexion, or white clothing. White appears throughout Washington because it belongs to the same general English-speaking surname pool that fed the state's nineteenth-century settlement."

  - rank: 18
    name: Olson
    count: 13959
    ratio: 545
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Ole or Olaf. Olson is far more prominent in Washington than in the United States overall, a sign of Norwegian and Swedish settlement in Ballard, Puget Sound maritime work, and northern farming and logging communities."

  - rank: 19
    name: Harris
    count: 13891
    ratio: 547
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry. Harris came west with English-speaking families and became common in Washington without belonging to a single ethnic enclave, which keeps it broadly distributed across the state."

  - rank: 20
    name: Allen
    count: 13321
    ratio: 571
    origin: english
    type: Patronymic
    meaning: "Usually traced to the personal name Alan, possibly from Celtic roots meaning little rock or handsome. Allen is one of Washington's broad settler surnames, common enough to appear in cities, wheat country, military communities, and postwar suburbs."

unique_surnames:
  - name: Olson
    state_rank: 18
    national_rank: 135
    origin: scandinavian
    why: "Olson means son of Ole or Olaf and ranks far higher in Washington than nationally. Its strength reflects Norwegian and Swedish settlement around Puget Sound, especially Ballard and maritime communities tied to fishing, ship work, and Alaska routes."

  - name: Hansen
    state_rank: 34
    national_rank: 174
    origin: scandinavian
    why: "Hansen means son of Hans, a Scandinavian form of John. Washington's high Hansen rank points to the same Nordic migration that shaped Ballard, Tacoma, coastal fishing towns, and logging communities from the late nineteenth century into the early twentieth."

  - name: Larson
    state_rank: 38
    national_rank: 213
    origin: scandinavian
    why: "Larson means son of Lars, the Scandinavian form of Lawrence. Its Washington concentration comes from Nordic families who entered sawmills, farms, fishing fleets, and Puget Sound neighborhoods where Scandinavian social clubs and churches reinforced family networks."

  - name: Carlson
    state_rank: 44
    national_rank: 207
    origin: scandinavian
    why: "Carlson means son of Carl. The name sits high in Washington because Swedish and other Nordic immigrants were unusually visible in Seattle, Ballard, and western Washington's timber and maritime economy."

  - name: Tran
    state_rank: 72
    national_rank: 194
    origin: vietnamese
    why: "Tran is a major Vietnamese surname and one of Washington's clearest post-1975 refugee-era names. Its statewide rank reflects Southeast Asian settlement in the Seattle area and other urban communities rather than the older pioneer surname layer."

etymology_groups:
  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Washington's top 20, including Johnson, Anderson, Williams, Jones, Davis, Nelson, Thompson, Peterson, Martin, Thomas, Harris, and Allen. The group is unusually Nordic for a West Coast state because Scandinavian son-names were reinforced by fishing, logging, and maritime settlement around Puget Sound."
    examples:
      - Johnson (son of John)
      - Anderson (son of Anders)
      - Nelson (son of Nels)
      - Peterson (son of Peter)
      - Olson (son of Ole)

  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Miller, Taylor, and Clark are the main occupational names in Washington's top 20. They fit a state whose early non-Native economy was built around mills, railroads, ports, farms, and administrative town centers rather than old colonial counties."
    examples:
      - Miller (grain miller)
      - Taylor (tailor)
      - Clark (clerical worker)

  - type: Asian and Pacific Surnames
    icon: fa-solid fa-ship
    description: "Lee and Nguyen show how Washington's Pacific-facing migration history changed the surname list. Chinese residents were present in Seattle by the 1860s, Japanese and Filipino communities shaped farms and urban labor, and Southeast Asian refugees after 1975 made Vietnamese names much more visible."
    examples:
      - Lee (English clearing; also Chinese and Korean surname)
      - Nguyen (Vietnamese dynastic surname)
      - Tran (Vietnamese surname)
      - Kim (Korean surname meaning gold)

faq:
  - question: "What are the most common last names in Washington?"
    answer: "The most common last names in Washington in this statewide table are Johnson, Anderson, Brown, Miller, and Williams. The ranking is notable because Johnson and Anderson reflect the state's unusually strong Scandinavian surname layer."

  - question: "Why are Scandinavian last names so common in Washington?"
    answer: "Scandinavian last names are common in Washington because Norwegian, Swedish, Danish, and Finnish immigrants settled around Puget Sound, Ballard, Tacoma, and coastal fishing towns in large numbers from the late nineteenth century. That history helps explain high-ranking names such as Johnson, Anderson, Nelson, Peterson, Olson, Hansen, Larson, and Carlson."

  - question: "Why is Nguyen common in Washington?"
    answer: "Nguyen is common in Washington because Southeast Asian refugees began arriving after 1975, and Vietnamese American communities took root in Seattle, King County, and other urban centers. In this statewide table, Nguyen ranks 15th, ahead of many older English surnames."

