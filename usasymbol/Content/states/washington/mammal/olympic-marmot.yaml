faq:
  - question: "What is Washington's state endemic mammal?"
    answer: "Washington's state endemic mammal is the Olympic marmot (Marmota olympus), designated in 2009. The Olympic marmot is found exclusively in the Olympic Mountains of Washington's Olympic Peninsula and exists nowhere else on Earth. This makes it Washington's only endemic mammal species—the only mammal whose entire global population lives within Washington's borders."
  
  - question: "Where can I see Olympic marmots in Washington?"
    answer: "Olympic marmots can only be seen in Olympic National Park in the Olympic Mountains. Hurricane Ridge provides the most accessible viewing, with marmots frequently visible from roadside pullouts and near the visitor center during summer months. Marmots also inhabit remote backcountry areas including High Divide, Grand Valley, and along Obstruction Point Road. The best viewing period is late July through August when marmots are most active before hibernation. Look for marmots basking on rocks near burrow entrances in alpine meadows between 4,000 and 7,000 feet elevation."
  
  - question: "Why is the Olympic marmot Washington's state endemic mammal?"
    answer: "Washington designated the Olympic marmot as state endemic mammal in 2009 because it is the only mammal species found exclusively in Washington. Olympic marmots evolved in isolation in the Olympic Mountains over the past 10,000-15,000 years after being separated from mainland marmot populations. The designation recognizes Washington's unique responsibility for this species' survival since it exists nowhere else on Earth. This makes Washington globally important for mammal conservation regardless of state size or total species diversity. The designation also highlights the Olympic Peninsula's role as an evolutionary laboratory where geographic isolation created distinct species."
  
  - question: "How is the Olympic marmot different from other marmots?"
    answer: "Olympic marmots differ from other marmot species in range, size, coloration, and behavior. They are the largest North American marmot species, heavier-bodied than yellow-bellied marmots from which they evolved. Olympic marmots have brown fur with yellowish-brown bellies, contrasting with the silver-gray frosted coat of hoary marmots found in Washington's Cascade Range. Behaviorally, Olympic marmots live in larger, more complex social colonies than most marmot species and have distinctive alarm call patterns. Genetically, Olympic marmots are sufficiently different from yellow-bellied marmots to warrant classification as a separate species (Marmota olympus) rather than a subspecies. Most importantly, Olympic marmots occur only in the Olympic Mountains while other marmot species have much larger ranges spanning multiple states or countries."
  
  - question: "Are Olympic marmots endangered?"
    answer: "Olympic marmots are currently listed as a state Candidate Species in Washington but are not federally endangered. Population estimates of 10,000-15,000 individuals suggest stable numbers within Olympic National Park at present. However, Candidate Species status recognizes potential future threats, primarily from climate change. Warming temperatures are causing tree lines to advance into alpine meadows, reducing Olympic marmot habitat over time. Unlike species that can migrate to cooler regions, Olympic marmots cannot leave the Olympic Mountains because no connected mountain ranges exist. This limited range makes them vulnerable to habitat loss from climate change even though current populations remain stable. Protection within Olympic National Park boundaries prevents hunting and habitat destruction but cannot prevent climate-driven habitat changes."
  
  - question: "How long do Olympic marmots hibernate?"
    answer: "Olympic marmots hibernate approximately eight months each year, from late September or early October through late April or early June depending on elevation and snowpack. This represents one of the longest hibernation periods of any North American mammal relative to lifespan. Olympic marmots spend only about four months active above ground each year, during which time they must eat enough vegetation to double their body weight before entering hibernation burrows. During hibernation, body temperature drops dramatically, heart rate slows, and metabolic rate decreases to conserve energy stored as fat. Entire colonies hibernate together in shared burrow chambers, generating collective warmth. Survival depends on accumulating sufficient fat reserves during the short summer feeding season, making growing-season length critical for population health."
  
  - question: "What do Olympic marmots eat?"
    answer: "Olympic marmots are herbivores that consume grasses, wildflowers, and sedges growing in alpine meadows. They prefer forbs (flowering plants) including lupines, asters, and buckwheat over grasses, though they eat grass when preferred plants are scarce. Marmots also consume leaves, flowers, and stems of avalanche lilies, glacier lilies, and various alpine wildflowers. During late summer before hibernation, marmots increase feeding intensity to double body weight, storing fat essential for eight-month hibernation survival. They do not cache food for winter but instead rely entirely on body fat accumulated during the four-month active season. Marmots obtain water from vegetation moisture and snow, rarely drinking from streams or puddles. Diet composition varies by meadow type and seasonal availability of different plant species."
  
  - question: "When was the Olympic marmot designated as Washington's state endemic mammal?"
    answer: "The Olympic marmot became Washington's official state endemic mammal on March 22, 2009, when Governor Christine Gregoire signed Senate Bill 5071 into law. The legislation created the state endemic mammal category specifically to recognize species found exclusively in Washington. This designation occurred seventy-one years after Olympic National Park's establishment in 1938, linking state recognition to federal protection. The 2009 designation acknowledged Washington's responsibility for the Olympic marmot's survival since no other state or country shares this obligation for a species found nowhere else on Earth. Students from Olympic Peninsula schools testified during legislative hearings supporting the designation, demonstrating local pride in the region's unique wildlife."

