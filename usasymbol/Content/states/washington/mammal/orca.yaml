faq:
  - question: "What is Washington's state marine mammal?"
    answer: "Washington's official state marine mammal is the orca (Orcinus orca), also known as the killer whale, designated on June 24, 2005, when Governor Christine Gregoire signed legislation promoted by second-graders from Crescent Harbor Elementary School in Oak Harbor. The students conducted a two-year campaign including research, public education, and collecting over 1,000 signatures supporting the designation. The legislature intended to promote orca awareness and encourage protection of natural marine habitat supporting these iconic whales. The orca is the largest member of the dolphin family and holds profound spiritual significance in Pacific Northwest Native American cultures as the Lord of the Ocean, symbolizing family, longevity, and protection."
  
  - question: "Why did Washington choose the orca as state marine mammal?"
    answer: "Washington chose the orca because many people visit the state specifically to watch orcas migrating through Puget Sound and the Salish Sea, making them economically and culturally important. The orca is a significant sacred symbol in Native American culture throughout the Pacific Northwest, known as 'qwe lhol mechen' (people that live under the water) by the Lummi Nation. Orcas are easily recognizable because of their distinctive black and white markings, making them ideal ambassadors for marine conservation. The designation emerged from a student-led campaign demonstrating civic engagement and commitment to protecting endangered Southern Resident killer whales whose population was declining. By designating the orca, Washington committed to promoting awareness and protecting marine habitat essential for orca survival. The legislature explicitly stated its intent to use the designation as a tool for conservation education and habitat protection."
  
  - question: "Are orcas endangered in Washington?"
    answer: "The answer depends on which orca ecotype. Three distinct populations occur in Washington: Southern Residents are critically endangered, listed federally in 2005 and by Washington State in 2004, with population declining from 98 individuals in 1995 to just 73 by December 2021. The three family groups (J, K, and L pods) face threats from reduced Chinook salmon prey, marine contaminants, and vessel traffic noise interfering with feeding and communication. West Coast Transient (Bigg's) killer whales are stable and growing, estimated at over 500 individuals, thriving due to recovery of their marine mammal prey base. Offshore killer whales are stable at approximately 300 individuals. Washington's state endangered designation applies to all orcas in state waters due to Southern Residents' imperiled status, though only Southern Residents are federally endangered. All three populations are protected under the Marine Mammal Protection Act regardless of endangered status."
  
  - question: "What is the difference between Resident, Transient, and Offshore orcas?"
    answer: "The three ecotypes differ fundamentally in diet, vocalizations, and social structure despite similar appearance. Resident orcas (including endangered Southern Residents) are fish-eaters specializing on salmon, particularly Chinook. They live in large stable pods, use complex vocal repertoires with distinct dialects, and are commonly seen in Puget Sound during summer. Transient orcas (also called Bigg's killer whales) are mammal-eaters feeding on harbor seals, sea lions, porpoises, and occasionally whales. They travel in smaller, more fluid groups and use click-like vocalizations and screaming sounds to frighten prey rather than complex calls. Transients have more shark-like dorsal fins and larger eye spots than Residents. Offshore orcas feed primarily on sharks and have severely worn teeth from consuming tough shark skin. They typically occur more than nine miles offshore and are the least studied population. The three ecotypes rarely interact and do not interbreed despite overlapping ranges, essentially functioning as separate species."
  
  - question: "Where can I see orcas in Washington?"
    answer: "The best places to see orcas in Washington include the San Juan Islands, particularly during summer and fall when Southern Resident killer whales spend months feeding on salmon in these waters. Lime Kiln Point State Park on San Juan Island offers excellent land-based viewing and is sometimes called 'Whale Watch Park.' Numerous whale-watching tour companies operate from Friday Harbor, Anacortes, and other ports, though they must now maintain 300 yards distance from endangered Southern Residents under new regulations. The Whale Museum in Friday Harbor provides education about orcas and helps visitors understand conservation challenges. Puget Sound shorelines occasionally provide sightings, though less predictably than San Juan Islands. West Coast Transient orcas can be seen year-round throughout Washington's coastal and inland waters, while Offshore orcas occur primarily beyond nine miles offshore and are rarely seen from shore. The Center for Whale Research conducts population surveys and sometimes shares sighting information. Remember that orcas are protected—never approach them in boats or kayaks, and observe all distance regulations."
  
  - question: "What do Southern Resident orcas eat and why does it matter?"
    answer: "Southern Resident orcas are salmon specialists feeding primarily on Chinook salmon year-round, with chum and coho salmon consumed during certain seasons. Chinook salmon—particularly large, fatty adults—provides essential nutrition for orca survival and reproduction. This dietary specialization creates vulnerability because Chinook populations have declined dramatically throughout the Pacific Northwest due to habitat loss from dams blocking spawning grounds, degraded stream conditions, overfishing, hatchery impacts, and climate change. When Chinook runs are weak, Southern Residents face food shortages forcing them to expend more energy searching for limited prey while receiving inadequate nutrition. Pregnant and nursing females are especially vulnerable during poor salmon years. The connection between salmon abundance and orca population health is well-documented: years with good Chinook returns see improved survival and reproduction, while years with poor returns often result in deaths and reproductive failures. Recovering Southern Resident orcas requires recovering Chinook salmon throughout their range from California to British Columbia—an enormous challenge requiring dam removal, habitat restoration, fishing restrictions, hatchery reforms, and climate change mitigation."
  
  - question: "What is the orca's significance in Native American culture?"
    answer: "Orcas hold profound spiritual significance for Coast Salish, Lummi, Haida, and other Pacific Northwest Indigenous peoples who view them as relatives rather than merely wildlife. The Lummi Nation calls orcas 'qwe lhol mechen' meaning 'people that live under the water.' Known as the Lord of the Ocean and Guardian of the Sea, orcas symbolize family, longevity, protection, harmony, community, and romance. Some tribes believe orcas are reincarnations of deceased chiefs who appear offshore to communicate with loved ones. Orcas are closely related to wolves in many traditions—both renowned for hunting skills, intelligence, and devotion—with legends describing transformation between wolves and orcas. The orca's matrilineal society (females leading family groups spanning generations) mirrors some Indigenous kinship structures and demonstrates values of family loyalty and intergenerational responsibility. Orcas feature prominently as crest symbols passed down through families, with varying meanings depending on clan and nation. Contemporary Indigenous communities exercise leadership in orca conservation, with the Lummi Nation waging campaigns to return captured orca Tokitae/Lolita to home waters and advocating for habitat protection as 'sacred obligation' to their relatives under the water."
  
  - question: "What happened at Penn Cove and why does it matter?"
    answer: "In summer 1970, dozens of orcas were captured at Penn Cove on Whidbey Island using aircraft and explosives to herd and trap whales for sale to marine parks. Five orcas died during the brutal operations. Nearly all captured orcas eventually died in captivity; only Tokitae/Lolita survives today after over 50 years at Miami Seaquarium. Penn Cove and other Pacific Northwest captures from 1965-1977 removed dozens of Southern Residents during their most productive reproductive years, decimating the population from an estimated 200 individuals before captures to approximately 71 by the mid-1970s. Captures preferentially targeted juveniles and young adults, removing future breeding stock and stripping pods of reproductive potential. The trauma inflicted on pod members forced to watch family members taken or killed likely affected their health and reproductive success. Governor Dan Evans filed a federal restraining order ending Washington captures in 1976 after his aide witnessed the cruelty. Southern Residents have never fully recovered from capture-era impacts, and the population remains critically endangered today. Penn Cove represents historical trauma requiring acknowledgment and serves as powerful motivation for current conservation efforts ensuring no further harm befalls these vulnerable whales."

