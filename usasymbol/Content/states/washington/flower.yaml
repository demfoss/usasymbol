type: State Flower
state: Washington
name: Coast Rhododendron
scientific_name: Rhododendron macrophyllum
adopted_year: 1892
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-24"
seo_title: "Washington State Flower: Coast Rhododendron"
seo_description: "The Coast Rhododendron became Washington's state flower in 1892. These pink-purple blooms grow wild across Washington's coastal forests and mountain slopes each spring."

intro_text: "Washington made the Coast Rhododendron its official state flower in 1892, and it remains a key entry in the [list of U.S. state flowers](/symbols/flowers). Large clusters of pink to purple bell-shaped flowers bloom on evergreen shrubs reaching 5 to 25 feet tall. This native species grows in coastal forests and mountain slopes throughout western Washington from April through July."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Washington State Flower?"
    paragraphs:
      - "The Coast Rhododendron holds the position of Washington's official state flower. Each flower cluster contains 5 to 20 individual blooms. Bell-shaped flowers measure 1 to 2 inches across. Colors range from pale pink to deep rose-purple. Dark green leathery leaves measure 3 to 8 inches long. The evergreen foliage persists year-round on woody stems."
      - "Coast Rhododendrons bloom from April through July across Washington. Peak flowering occurs in May and June throughout most regions. The Olympic Peninsula, Cascade foothills, and San Juan Islands showcase spectacular displays. Individual blooms last one to two weeks. Shrubs prefer acidic soil and partial shade. Moist well-drained conditions suit rhododendrons best."
      - "Native populations grow wild throughout western Washington in coniferous forests, coastal bluffs, and mountain slopes up to 4,000 feet elevation. The shrubs thrive under Douglas fir and western hemlock canopies. Bumblebees and hummingbirds pollinate the flowers. Coast rhododendrons dominate understory vegetation in many old-growth forests west of the Cascades."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Washington State Flower Name"
    paragraphs:
      - "Known as Coast Rhododendron, this flower's scientific designation is Rhododendron macrophyllum. The plant belongs to the Ericaceae family. This family includes azaleas, blueberries, and about 4,000 species of flowering plants worldwide."
      - "Rhododendron comes from Greek words meaning rose tree. The showy pink flowers and woody growth inspired this name. The species name macrophyllum means large-leaved in Greek. The broad evergreen leaves distinguish this species from other rhododendrons. Early botanists noted the impressive leaf size when documenting Pacific Northwest flora."
      - "Regional names include Pacific rhododendron, California rosebay, and big-leaf rhododendron. Native American tribes called it different names in various languages. The Makah people used the wood for smoking salmon. Other common names reference the plant's coastal distribution and evergreen nature."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Washington Chose the Coast Rhododendron"
    paragraphs:
      - "The legislature designated the Coast Rhododendron as Washington's state flower in 1892. Washington became one of the first states to adopt an official floral emblem. Women's groups campaigned for recognition of the native rhododendron. The spectacular spring blooms made the choice popular across the state and fit the regional identity later reinforced by [The Evergreen State nickname](/states/washington/nickname/the-evergreen-state)."
      - "Coast rhododendrons bloomed abundantly in forests throughout western Washington. The pink flowers appeared in gardens, parks, and wilderness areas. Settlers transplanted wild shrubs to homesteads. The evergreen leaves and showy blooms made rhododendrons desirable ornamental plants. Native populations grew from sea level to mountain slopes throughout the region."
      - "The flower represented Washington's natural beauty and Pacific Northwest character. No other native shrub produced such dramatic floral displays. Artists and photographers captured rhododendron blooms against forest backgrounds. The designation reflected pride in Washington's unique flora. The Coast Rhododendron remains closely identified with Washington state over 130 years later, often alongside [the Western Hemlock state tree](/states/washington/tree/western-hemlock)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Washington State Flower Facts"
    facts:
      - "Washington designated the Coast Rhododendron on February 10, 1892, making it among the earliest official state flower adoptions in United States history"
      - "Coast Rhododendron leaves contain grayanotoxins that are toxic to humans and livestock if ingested, though native wildlife generally avoid browsing the plants"
      - "The shrubs can live over 100 years in favorable conditions, with some specimens in old-growth forests estimated at 150 years or older"
      - "Unlike many rhododendrons that require careful cultivation, Coast Rhododendron thrives in poor acidic soil under dense forest canopies with minimal sunlight"
      - "The Olympic Peninsula, particularly areas around Lake Quinault and the Hoh Rainforest, features some of Washington's most impressive wild rhododendron displays"
      - "Coast Rhododendron grows naturally only along the Pacific Coast from British Columbia to central California, making it a distinctive western species"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Washington's Flower and Bird Symbols"
    paragraphs:
      - "The American Goldfinch serves as Washington's state bird, a small yellow songbird with black wings and cap. Both symbols represent Washington officially. Washington adopted the Coast Rhododendron in 1892 and designated the American Goldfinch as state bird in 1951; see [Washington's state bird page](/states/washington/bird/american-goldfinch)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Coast Rhododendron commonly represents Washington's natural wilderness, evergreen forests, and Pacific Northwest identity. The flower is considered to reflect resilience and endurance through its ability to thrive in dense forest shade and harsh coastal conditions. Its vibrant blooms frequently represent beauty emerging from rugged landscapes, carrying connotations of Washington's temperate rainforests and mountainous terrain, similar to the symbolism behind [the Washington state flag](/states/washington/flag/washington-state-flag)."

faq:
  - question: "What is Washington's state flower?"
    answer: "Washington's state flower is the Coast Rhododendron. This native evergreen shrub produces clusters of pink to purple bell-shaped flowers and grows wild in forests throughout western Washington from sea level to mountain slopes."
  
  - question: "When did Washington adopt the Coast Rhododendron?"
    answer: "Washington adopted the Coast Rhododendron on February 10, 1892. This made Washington among the earliest states to designate an official floral emblem, reflecting the plant's importance to the region's natural landscape."
  
  - question: "Where does the Coast Rhododendron grow in Washington?"
    answer: "The Coast Rhododendron grows throughout western Washington in coniferous forests, coastal bluffs, and mountain slopes up to 4,000 feet elevation. The Olympic Peninsula, Cascade foothills, and San Juan Islands feature particularly spectacular displays during spring blooming season."
  
  - question: "Why did Washington choose the Coast Rhododendron?"
    answer: "Washington chose the Coast Rhododendron because it bloomed abundantly in forests across the state and produced dramatic spring displays. Women's groups campaigned for the native rhododendron's recognition. No other native shrub offered such showy flowers combined with evergreen foliage."
  
  - question: "Are Coast Rhododendron leaves poisonous?"
    answer: "Yes, Coast Rhododendron leaves contain toxic compounds called grayanotoxins that are poisonous if ingested by humans or livestock. Native wildlife generally avoid browsing the plants. Despite this toxicity, the species remains safe as an ornamental plant when not consumed."

