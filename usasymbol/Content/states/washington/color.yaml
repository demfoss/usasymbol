title: "Official and Traditional Colors of Washington"
state: "Washington"
adopted_year: null

seo_title: "Washington State Colors: Official HEX Codes & Meaning"
seo_description: "Washington state colors are Green and Gold, based on the state seal and Evergreen State identity. Find HEX, RGB, CMYK, and Pantone codes plus the history and meaning."

intro_text: "The traditional state colors of Washington are **Green** and **Gold**, reflecting the Evergreen State's forests and the gold of [the Washington state flag](/states/washington/flag/washington-state-flag). Although Washington has not formally designated official state colors by legislative statute, green and gold are the colors most broadly associated with the state's natural and civic identity through the state seal, tourism branding, and university traditions. Designers and students can find the exact HEX and RGB codes below for accurate digital and print reproduction, as part of the broader [U.S. state colors reference](/symbols/colors)."

official_colors: "Green and Gold"
official_since: "Unofficial (no formal legislative designation; derived from state flag, state seal, and Evergreen State natural heritage)"
primary_use: "State flag and seal imagery, University of Washington athletics, Washington State University branding, state tourism identity, civic and commercial applications statewide"
known_for: "Green representing the dense coniferous forests that earned Washington the nickname the Evergreen State, and gold representing the portrait of George Washington on the state seal — the only U.S. state seal to feature a president's portrait and the only state named after a U.S. president"

color_data:
  - name: "Green"
    hex: "#004C45"
    rgb: "0, 76, 69"
    cmyk: "100, 0, 9, 70"
    pantone: "PMS 3305"
    symbolism: "Represents the dense temperate rainforest and coniferous woodland that covers approximately 22 million acres of Washington state — nearly 52 percent of the state's land area — making Washington one of the most forested states in the nation and the source of its iconic Evergreen State nickname; the deep forest green of Washington's mountains, river valleys, and coastal ranges is among the most visually distinctive natural colors of the Pacific Northwest"
  - name: "Gold"
    hex: "#FFCD00"
    rgb: "255, 205, 0"
    cmyk: "0, 20, 100, 0"
    pantone: "PMS 108"
    symbolism: "Represents the gold of the state seal's portrait of George Washington — rendered in a gilded medallion style unique among U.S. state seals — the golden wheat fields of the Palouse region that make eastern Washington the nation's most productive soft white wheat-growing area, and the amber tones of fall foliage along the Columbia River corridor and the deciduous valleys of the Cascades; gold in Washington also reflects the legacy of Pacific Northwest timber industry prosperity that made the state one of the wealthiest in the nation during the twentieth century"

sections:
  - id: "official-designation"
    title: "Status and History of Washington's State Colors"
    style: "default"
    paragraphs:
      - "Washington has not formally designated official state colors by legislative statute, placing green and gold in the category of traditional rather than legally codified color identities. Washington's Legislature has designated numerous official state symbols — including the [willow goldfinch](/states/washington/bird/american-goldfinch), [coast rhododendron](/states/washington/flower/coast-rhododendron), western hemlock (state tree), and Walla Walla sweet onion (state vegetable) — but has not enacted a state colors statute. The green-and-gold association develops from the state flag's dark green field and gold seal, as well as the broader cultural resonance of the Evergreen State's forested identity."
      - "Washington's state flag, which features the state seal centered on a field of dark green, is the only U.S. state flag with a green background — a design choice that makes green the most immediately distinctive element of Washington's official visual identity. The state seal, adopted when Washington achieved statehood on November 11, 1889, features a portrait of George Washington rendered in gold, making the flag's green-and-gold combination an explicit official color pairing even in the absence of a formal state colors statute; see [Washington's flag history](/states/washington/flag/washington-state-flag)."
    subsections:
      - subtitle: "The Washington State Flag: The Only Green State Flag"
        text: "Washington's state flag stands alone among U.S. state flags as the only one to feature a green field as its primary background color. This extraordinary distinction directly establishes green as Washington's most definitive official color. The green field, established by the 1923 state flag legislation (Chapter 77, Laws of 1923), reflects Washington's identity as the Evergreen State — a nickname that captures Washington's year-round green character — Pacific rainfall keeps the western landscape verdant through all four seasons, well beyond the evergreen forests alone. The gold seal of George Washington centered on this green field creates the green-and-gold pairing that serves as Washington's de facto official color identity."
      - subtitle: "Washington State University and University of Washington Color Traditions"
        text: "Washington's two flagship public universities both incorporate gold into their official colors, reinforcing the color's statewide institutional presence. The University of Washington uses purple and gold as its official colors — the purple an institutional choice, the gold reinforcing the state's traditional gold identity. Washington State University uses crimson and gray as its official colors, a divergence from the gold tradition, though the Cougars' rivalry with the purple-and-gold Huskies ensures that gold remains the dominant university color in Washington's public consciousness. The University of Washington's consistent use of gold across its prominent athletics programs — including Pac-12 football and basketball — makes UW's gold the most visible institutional gold in the state."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Green and gold in Washington carry a symbolism grounded in the physical reality of the state's landscape and the historical significance of its founding identity. Washington is simultaneously one of the greenest and most productive states in the nation: green in the literal sense of its forest-covered western slopes and temperate rainforests, and gold in the figurative sense of its agricultural abundance, timber prosperity, and the gilded portrait of the first U.S. president on its state seal. The juxtaposition of these two colors captures the dual character of Washington — the natural wealth of the Pacific Northwest coast and the agricultural and economic productivity of the interior regions east of the Cascades."
    subsections:
      - subtitle: "Green: The Evergreen State"
        text: "Washington's Evergreen State nickname is one of the most literally accurate state nicknames in the American system. The western slopes of the Cascades and the Olympic Peninsula receive between 60 and 140 inches of precipitation annually, supporting temperate rainforests of Sitka spruce, western red cedar, Douglas fir, and western hemlock that remain intensely green through every month of the year. The Hoh Rainforest on the Olympic Peninsula, one of the largest temperate rainforests in the Western Hemisphere, presents an unbroken canopy of old-growth green that represents the extreme of Washington's forest heritage. Washington's 22 million acres of forest — managed across the Olympic and Mount Baker-Snoqualmie National Forests, the Okanogan-Wenatchee National Forest, and the Gifford Pinchot National Forest — make green the state's most ecologically essential color identity, which aligns with [the Evergreen State nickname story](/states/washington/nickname/the-evergreen-state)."
      - subtitle: "Gold: The Seal, the Wheat, and the Timber Legacy"
        text: "Gold in Washington's color identity has three distinct sources. The most visible is the state seal's portrait of George Washington, rendered in a gold medallion format that makes the gold emblem the central image of the state's only green state flag. Washington is the only state named after a U.S. president, and the gold of Washington's portrait on the seal links the state's color to its founding honoree. The second source is the Palouse, the rolling agricultural region of southeastern Washington that produces approximately 100 million bushels of soft white wheat annually — more than any other region of equivalent size in the nation — turning the landscape a brilliant gold from July through August. The third is the legacy of Washington's timber industry, which made the state one of the wealthiest in the early twentieth century from the harvest of the same forests whose green defines the western landscape."

  - id: "state-emblems"
    title: "Usage in the State Flag, Seal, and Institutional Branding"
    style: "default"
    paragraphs:
      - "Green and gold appear explicitly on Washington's state flag — the only green state flag in the Union — making the color pairing more formally embedded in Washington's official visual identity than the absence of a state colors statute might suggest. The state seal's gold portrait of George Washington, centered on the flag's green field, creates the foundational green-and-gold image of Washington's governmental identity. Washington state agency branding, the Governor's official communications, and state government materials consistently employ the green-and-gold palette drawn from the flag. Washington's tourism campaigns, promoted by the Washington Tourism Alliance, use green extensively to reference the Evergreen State identity that drives the state's $22 billion outdoor recreation and tourism economy. The University of Washington's purple and gold — visible on the Husky Stadium in Seattle and across the Pac-12 athletic network — further anchors gold as Washington's most prominent institutional color in national sports media, alongside iconic natural symbols such as [the western hemlock](/states/washington/tree/western-hemlock)."

big_stat:
  number: "22,000,000"
  description: "Acres of forest covering Washington state — approximately 52 percent of the state's total land area — making Washington one of the most forested states in the contiguous United States and the source of the Evergreen State nickname that makes green Washington's most definitive and internationally recognized color identity"

timeline:
  - year: "1853"
    description: "Washington Territory organized by Congress on March 2, separated from Oregon Territory; the new territory is named after President George Washington, establishing the connection between the state and its presidential namesake whose gold portrait will anchor the state seal"
  - year: "1889"
    description: "Washington admitted to the Union on November 11 as the 42nd state; the state seal is adopted, featuring a gold portrait of George Washington that will become the defining emblem of the state's visual identity and the gold anchor of the flag's eventual green-and-gold design"
  - year: "1923"
    description: "Washington Legislature formally adopts the state flag design featuring the state seal on a green field, creating the only green state flag in the United States and establishing green as the most distinctively Washingtonian of all state flag colors"
  - year: "1967"
    description: "Washington officially adopts the Evergreen State as its state nickname, formally acknowledging the green forest heritage that defines the state's landscape and serves as the thematic foundation of the green-and-gold color identity"
  - year: "2009"
    description: "Washington's outdoor recreation economy surpasses $22 billion annually, driven by the green landscape — national parks, national forests, ski areas, and coastline — that makes green Washington's most economically essential color identity"

expert_quote:
  text: "Washington's green state flag is unique in American vexillology — no other state chose a green field — and that choice was not incidental. Washington is the Evergreen State, and the green of its flag is the green of old-growth Douglas fir and cedar that has defined the Pacific Northwest since before European contact."
  source: "Washington State Historical Society, Tacoma, State Flag and Symbol Documentation"

faq:
  - question: "What are the state colors of Washington?"
    answer: "Washington's traditional state colors are Green and Gold, reflected in the state flag's green field and the gold portrait of George Washington on the state seal. Washington has not formally designated official state colors by legislative statute, but the flag's green-and-gold design gives the pairing a strong de facto official character."
  - question: "What is the HEX code for Washington Green?"
    answer: "The standard HEX code for Washington Green is #004C45, corresponding to Pantone PMS 3305, consistent with the dark green field of the Washington state flag as specified in official flag standards."
  - question: "What is the HEX code for Washington Gold?"
    answer: "The standard HEX code for Washington Gold is #FFCD00, corresponding to Pantone PMS 108, consistent with the gold portrait of George Washington on the state seal and the gold elements of the University of Washington's official brand identity."
  - question: "Why does Washington have a green state flag?"
    answer: "Washington's state flag features a green field because Washington is the Evergreen State — a reference to the dense coniferous forests that cover approximately 52 percent of the state's land area and remain green year-round due to the Pacific Northwest's high rainfall. Washington's green flag is the only green state flag in the United States."
  - question: "Are green and gold Washington's official state colors?"
    answer: "Green and gold are traditional rather than officially designated state colors in Washington. The Washington Legislature has not formally codified state colors by statute, but the state flag's green field and gold seal portrait of George Washington give the pairing a stronger official character than a purely traditional designation."

