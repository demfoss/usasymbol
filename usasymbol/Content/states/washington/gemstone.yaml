intro_text: "Washington's state gem is petrified wood, adopted in 1975 to honor the fossilized forests preserved in volcanic ash beds around Vantage, most famously at Ginkgo Petrified Forest State Park. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Washington State Gem
    paragraphs:
      - "Petrified wood is Washington's official state gem, designated by the state legislature in 1975. It is fossilized wood in which silica has replaced the original plant tissue cell by cell, preserving the tree's growth rings and grain in stone."
      - "Washington earned this symbol through Ginkgo Petrified Forest State Park near Vantage, one of the most diverse petrified forests in the world, holding more than 50 species of trees buried by ancient lava flows."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Petrified Wood?"
    paragraphs:
      - "Petrified wood forms when a fallen tree is buried quickly, cutting off oxygen and slowing decay long enough for mineral-rich water to seep through the wood. Silica dissolved in that water gradually replaces the wood's cell structure, turning organic tissue into solid stone while keeping the original grain, rings, and even bark texture visible."
      - "Color varies widely depending on which minerals accompanied the silica; iron produces red, orange, or yellow tones, while other trace minerals can add black, purple, or blue. Polished cross-sections often show the tree's growth rings as sharp, colorful bands."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Washington Chose Petrified Wood as Its State Gem"
    paragraphs:
      - "Around 15 million years ago, lava flows in central Washington dammed rivers and buried entire stands of trees, cypress, oak, elm, spruce, and ginkgo among them, in mud and ash. Groundwater carrying dissolved silica moved through the buried logs over the following millions of years, replacing the wood with stone in fine enough detail to preserve individual growth rings."
      - "Ginkgo Petrified Forest State Park near Vantage, established in the 1930s, protects one of the most varied collections of petrified logs found anywhere, representing dozens of species that no longer grow together in one region. That range, and the park's role as a public reserve, made petrified wood a natural choice to represent the state's geology."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Petrified Wood Became Washington's State Gem"
    paragraphs:
      - "State lawmakers designated petrified wood the official state gem in 1975, formalizing a status the fossil already held informally through decades of visitors collecting and viewing specimens at Ginkgo Petrified Forest State Park."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Petrified Wood Is Found in Washington"
    paragraphs:
      - "Ginkgo Petrified Forest State Park, one mile north of Vantage along the Columbia River, protects the largest and most varied concentration of petrified wood in Washington. The park's interpretive center displays logs representing more than 50 tree species preserved in the surrounding basalt flows."
    sites:
      - name: Ginkgo Petrified Forest State Park
        city: Vantage
        lat: 46.9482
