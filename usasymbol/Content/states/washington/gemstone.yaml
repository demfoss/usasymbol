faq:
  - question: What is Washington's state gem?
    answer: "Washington's state gem is petrified wood, fossilized wood in which silica has replaced the original plant tissue while preserving its grain and rings."
  - question: When did Washington adopt petrified wood as its state gem?
    answer: "The Washington Legislature designated petrified wood the official state gem in 1975."
  - question: Why did Washington choose petrified wood?
    answer: "Ginkgo Petrified Forest State Park near Vantage preserves one of the most varied petrified forests in the world, buried by lava flows roughly 15 million years ago."
  - question: Where can you find petrified wood in Washington?
    answer: "Ginkgo Petrified Forest State Park, just north of Vantage along the Columbia River, holds Washington's largest and most varied collection of petrified wood."

