  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Petrified Wood Facts"
    facts:
      - "Adopted as Washington's state gem in 1975."
      - "Ginkgo Petrified Forest State Park near Vantage preserves more than 50 species of petrified trees."
      - "The petrified logs formed when lava flows buried ancient forests roughly 15 million years ago."
      - "Silica-rich groundwater replaced the wood's cell structure so precisely that growth rings and bark are still visible in cut specimens."

