- id: facts
  icon: fa-solid fa-lightbulb
  title: Steelhead Trout Facts
  facts:
  - Adopted in 1969 by the Washington Legislature.
  - Scientific name is Oncorhynchus mykiss.
  - Has a gray spotted back, silver scales and a white belly.
  - Belongs to the same species as the rainbow trout.
  - Swims to the ocean and comes back to rivers to spawn.
faq:
- question: What is Washington's state fish?
  answer: Washington's state fish is the steelhead trout. It is a silver, spotted trout that lives in the ocean and in rivers.
- question: When did Washington adopt the Steelhead Trout?
  answer: The Washington Legislature made the steelhead trout the official state fish in 1969.
- question: Why did Washington choose the Steelhead Trout?
  answer: Official sources do not give a detailed reason. The state does say the steelhead is one of the most popular fish for recreational fishing in Washington.
- question: Is a steelhead the same as a rainbow trout?
  answer: Yes, they are the same species. A steelhead is a rainbow trout that swims out to the ocean and then comes back to a river to spawn.
- question: What does a steelhead trout look like?
  answer: It has a gray spotted back, shiny silver scales and a bright white belly. A hint of pink runs along its side.
