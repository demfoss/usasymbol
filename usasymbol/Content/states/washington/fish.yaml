seo_title: Washington State Fish | Steelhead Trout
seo_description: The Washington state fish is the steelhead trout, adopted in 1969. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/washington/washington-fish-hero.webp
hero_image_alt: A silver steelhead trout with a gray spotted back, a white belly and a faint pink stripe along its side.
hero_image_caption: The steelhead trout became Washington's state fish in 1969.
intro_text: Washington's state fish is the steelhead trout, adopted in 1969. It is a silver, spotted trout that swims out to the ocean and comes back to rivers to spawn. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Washington?
  paragraphs:
  - The Washington Legislature made the steelhead trout the official state fish in 1969. Its scientific name is Oncorhynchus mykiss.
  - The state law from 1969 lists the fish under an older scientific name, Salmo gairdnerii. Scientists later renamed the species, but it is the same fish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Steelhead Trout
  paragraphs:
  - A steelhead has a gray back covered in spots from head to tail. Its scales shine with flecks of silver, and its belly is bright white.
  - A hint of shiny pink runs along its side, between the dark back and the white belly.
  - Steelhead belong to the same species as rainbow trout. The difference is that steelhead swim out to the ocean and then come back to fresh water rivers to spawn, just like salmon. Biologists call fish that do this anadromous.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - Washington lawmakers passed a bill in 1969 that named the steelhead trout the official state fish.
  - In Washington, a new state symbol is made official only when the Legislature passes a bill to adopt it.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Washington Chose the Steelhead Trout
  paragraphs:
  - The state's official description does not give a detailed reason for the choice. It does point out that the steelhead is one of the most popular fish for recreational fishing, which is a major industry in Washington.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Steelhead Trout
  paragraphs:
  - Steelhead live in rivers that flow into Puget Sound, Hood Canal and the Strait of Juan de Fuca. Some swim far inland up the Columbia River.
  - In 2007, the steelhead in the Puget Sound area were listed as a threatened species. Washington works to protect and restore these wild fish.
