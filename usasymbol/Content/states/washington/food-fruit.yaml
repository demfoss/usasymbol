faq:
  - question: "What is Washington's state fruit?"
    answer: "Washington's state fruit is the apple, adopted by the Washington State Legislature in 1989."
  - question: "When did Washington adopt the apple as its state fruit?"
    answer: "The Washington State Legislature designated the apple the official state fruit in 1989."
  - question: "Why did Washington choose the apple?"
    answer: "Washington has led the nation in apple production for decades, thanks to the growing conditions in the Yakima and Wenatchee valleys."
  - question: "Where does the apple come from in Washington?"
    answer: "The Yakima Valley and the Wenatchee Valley in central Washington are the state's largest apple-growing regions."

