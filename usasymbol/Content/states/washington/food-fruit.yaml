seo_title: "Washington State Fruit | Apple"
seo_description: "Washington's state fruit is the apple, adopted in 1989, grown in the orchards of the Yakima and Wenatchee valleys."
hero_image: /images/foods/washington/washington-state-fruit-hero.webp
hero_image_alt: "Red apples on a tree branch in a Washington orchard."
hero_image_caption: "The apple, Washington's official state fruit."
intro_text: "Washington's state fruit is the apple, adopted in 1989 to recognize a crop that makes the state the nation's leading apple producer. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Washington's State Fruit?"
    paragraphs:
      - "The apple is Washington's official state fruit, designated by the Washington State Legislature in 1989. Washington grows more apples than any other state, mainly in the Yakima and Wenatchee valleys."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Apple"
    paragraphs:
      - "Apples are round tree fruits that grow in many colors and flavors, from tart to sweet. Washington's dry, sunny growing season and irrigated orchards produce varieties including Red Delicious, Gala, and Honeycrisp."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Apple Became Washington's State Fruit"
    paragraphs:
      - "The Washington State Legislature designated the apple the official state fruit in 1989."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Washington Chose the Apple"
    paragraphs:
      - "Washington has led the nation in apple production for decades, with the Yakima and Wenatchee valleys providing the sunny days, cool nights, and irrigation that orchards need to thrive."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Apple Comes From in Washington"
    paragraphs:
      - "The Yakima Valley and the Wenatchee Valley in central Washington are the state's largest apple-growing regions, home to thousands of acres of orchards."
    sites:
      - name: Wenatchee Valley
        city: Wenatchee
        lat: 47.42
        lng: -120.31
        note: "Major Washington apple-growing region"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Apple Facts"
    facts:
      - "Adopted as Washington's state fruit in 1989."
      - "Washington grows more apples than any other U.S. state."
      - "The Yakima and Wenatchee valleys are the state's largest apple-growing regions."

