sections:
- id: evergreen-state
  icon: fa-solid fa-tree
  title: Current Slogan
  paragraphs:
  - '"Evergreen State" appears at the bottom of Washington''s standard passenger plate. The phrase matches Washington''s widely used state nickname, although Washington state sources note that the nickname has not been formally adopted by law.'
  - The slogan began on the standard passenger plate in July 1998. The design kept the Mount Rainier background introduced for the statehood centennial era, but dropped the dark blue border and added "EVERGREEN STATE" in red at the bottom.
  - Washington kept the same slogan through later serial and manufacturing changes. The ABC1234 format began January 1, 2010, and flat, unembossed plates began appearing in October 2024, but the bottom slogan stayed "Evergreen State."

- id: anniversary-slogans
  icon: fa-solid fa-cake-candles
  title: Anniversary Slogans
  paragraphs:
  - Washington's first standard passenger plate slogan was "1889-GOLDEN JUBILEE-1939" on the 1939 plate. It marked 50 years since Washington entered the Union on November 11, 1889.
  - The next standard slogan did not appear until the statehood centennial period. The 1987-late 1990 Mount Rainier base used "Centennial Celebration" at the bottom.
  - After the centennial wording ended, Washington issued a no-slogan Mount Rainier base from late 1990 until July 1998. That gap matters because "Evergreen State" did not immediately follow the 1987 centennial plate.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Washington License Plate Slogans by Era
  paragraphs:
  - Washington's standard slogan history is mostly no-slogan plates, with two anniversary exceptions before the current nickname-based slogan.
  versions:
  - name: Centennial Celebration
    years: 1987-late 1990
    image: /images/license-plates/washington/1987-centennial-celebration.png
    description: Mount Rainier graphic base issued for the statehood centennial period, with "Centennial Celebration" screened at the bottom.
  - name: 1889-GOLDEN JUBILEE-1939
    years: '1939'
    image: /images/license-plates/washington/1939-golden-jubilee.jpg
    description: One-year commemorative slogan for Washington's 50th anniversary of statehood.
  - name: No slogan / Mount Rainier base
    years: late 1990-July 1998
    image: /images/license-plates/washington/1990-no-slogan-rainier.jpg
    description: Same general Rainier design after the centennial wording was removed. This no-slogan interval is often skipped in short summaries.
  - name: Evergreen State
    years: July 1998-present
    image: /images/license-plates/washington/1998-evergreen-state.jpg
    description: Current standard passenger slogan. The slogan continued through the 2010 ABC1234 serial format and the 2024 change to flat, unembossed plates.

- id: corrected-dates
  icon: fa-solid fa-clock-rotate-left
  title: Date Corrections
  paragraphs:
  - The current slogan should be dated to July 1998, not just 1998. Washington's passenger plate chronology lists the current slogan beginning in July of that year.
  - '"Centennial Celebration" belongs to the 1987-late 1990 base, not a single 1987 plate year. It was followed by a no-slogan Rainier base until July 1998.'
  - Avoid calling "Evergreen State" Washington's official nickname in the legal sense. It is the widely used nickname and current plate slogan, but Washington has not officially adopted it by statute.

timeline:
- year: '1915'
  description: Washington begins issuing state license plates; early passenger plates carry no slogan.
- year: '1939'
  description: Washington uses "1889-GOLDEN JUBILEE-1939" for the state's 50th anniversary.
- year: '1940'
  description: Standard passenger plates return to no-slogan designs.
- year: '1987'
  description: Washington introduces the Mount Rainier centennial base with "Centennial Celebration."
- year: '1990'
  description: The centennial wording is removed in late 1990, leaving a no-slogan Mount Rainier base.
- year: '1998'
  description: In July, Washington adds "EVERGREEN STATE" to the standard passenger plate.
- year: '2010'
  description: Washington changes the standard passenger serial format to ABC1234 while keeping "Evergreen State."
- year: '2024'
  description: In October, Washington begins flat, unembossed standard passenger plates; the slogan remains "Evergreen State."

faq:
- question: What is Washington's license plate slogan?
  answer: Washington's current standard license plate slogan is "Evergreen State." It was introduced on the standard passenger plate in July 1998.
- question: When did Washington start using Evergreen State on plates?
  answer: Washington added "Evergreen State" to the standard passenger plate in July 1998.
- question: What was Washington's first license plate slogan?
  answer: Washington's first standard passenger plate slogan was "1889-GOLDEN JUBILEE-1939," used in 1939 for the state's 50th anniversary.
- question: What was Centennial Celebration on Washington plates?
  answer: '"Centennial Celebration" was the slogan on the 1987-late 1990 Mount Rainier base, marking Washington''s statehood centennial.'
- question: Did Washington have a no-slogan Mount Rainier plate?
  answer: Yes. From late 1990 to July 1998, Washington used a Mount Rainier passenger base without a slogan.
- question: Is Evergreen State Washington's official nickname?
  answer: '"Evergreen State" is Washington''s widely used nickname and current plate slogan, but Washington state sources note that the nickname has not been formally adopted by law.'

