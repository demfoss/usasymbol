seo_title: 'Washington License Plate Slogan: Evergreen State, Golden Jubilee & Centennial'
seo_description: Washington's current standard license plate slogan is "Evergreen State," introduced in July 1998. Learn the corrected timeline from Golden Jubilee in 1939, Centennial Celebration in 1987-1990, the no-slogan Rainier base, and the modern flat plate update.
hero_image: /images/license-plates/washington/1998-evergreen-state.jpg
hero_image_alt: Washington license plate with Evergreen State slogan and Mount Rainier
hero_image_caption: Washington added "EVERGREEN STATE" to the standard Mount Rainier passenger plate in July 1998.
intro_text: '**"Evergreen State"** is Washington''s current standard license plate slogan. It was added to the Mount Rainier passenger base in **July 1998**, after a no-slogan version of the same general mountain design had run from late 1990 to July 1998. Washington''s earlier standard slogans were anniversary phrases: **"1889-GOLDEN JUBILEE-1939"** in 1939 and **"Centennial Celebration"** on the 1987-late 1990 Rainier base.'
quick_answer: '"Evergreen State" is Washington''s current standard license plate slogan, introduced in July 1998. Earlier Washington standard slogans were "1889-GOLDEN JUBILEE-1939" in 1939 and "Centennial Celebration" from 1987 to late 1990. Between late 1990 and July 1998, the Mount Rainier passenger base had no slogan.'
