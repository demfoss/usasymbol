seo_title: "Washington State Tree | Western Hemlock"
seo_description: 'Washington chose western hemlock in 1947, recognizing a rainforest conifer important to timber, shade-tolerant forests, and the Evergreen State image.'

intro_text: "The Western Hemlock is Washington's state tree since 1947, and it remains a major entry in the [list of U.S. state trees](/symbols/trees). This towering evergreen dominates Washington's coastal and mountain forests, reaching heights of 150 to 200 feet in old-growth stands. Washington chose the hemlock because it represented the state's most valuable timber resource and thrived throughout western Washington's rainforests. The tree's economic importance and massive presence in Washington forests made it the natural choice for the state's arboreal symbol."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Washington State Tree?"
    paragraphs:
      - "Washington recognizes the Western Hemlock as its official state tree. This evergreen conifer grows 150 to 200 feet tall in Washington's coastal forests, with exceptional specimens exceeding 230 feet. The trunk can reach four to six feet in diameter at breast height. These dimensions made western hemlock Washington's most commercially valuable timber species through much of the 20th century. The tree provided lumber that built homes, schools, and businesses across the Pacific Northwest and shipped worldwide from Washington ports."
      - "The bark appears reddish-brown to gray-brown with deep furrows and thick ridges on mature trees. Young trees display smoother, thinner bark. The foliage consists of short flat needles, each measuring one-quarter to three-quarters of an inch long. The needles attach individually to the twigs rather than in bundles like pine needles. Dark green above and silvery below, the needles create dense shade beneath the canopy. Small oval cones hang from branch tips, measuring just three-quarters to one inch long. These cones distinguish western hemlock from other Washington conifers, which typically produce larger cones."
      - "Western hemlock grows throughout Washington west of the Cascade Range crest. The species thrives in the cool, moist climate of Washington's western lowlands and mountain slopes. Hemlock forests dominate from sea level to elevations approaching 5,000 feet. The tree requires substantial rainfall, flourishing in areas receiving 50 to 80 inches annually. Washington's Olympic Peninsula and Cascades foothills contain some of North America's finest hemlock forests. The species grows in pure stands or mixed with Douglas-fir, western redcedar, and Sitka spruce. Eastern Washington's drier climate prevents western hemlock from establishing naturally east of the Cascades."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Washington State Tree Name"
    paragraphs:
      - "The common name is Western Hemlock, distinguishing it from Eastern Hemlock found in Appalachian forests. The scientific name is Tsuga heterophylla. Tsuga is the Japanese word for hemlock trees. Heterophylla means 'various leaves' in Greek, referring to the needles' varying lengths and arrangements. This species belongs to the Pinaceae family, the pine family."
      - "Early Washington loggers called this tree hemlock, Alaska pine, or West Coast hemlock. The name hemlock refers to a supposed resemblance between the foliage and the poisonous hemlock plant, though the tree contains no toxic compounds. Pacific hemlock is another regional name emphasizing the tree's coastal distribution. Washington timber industry workers distinguished between hemlock and 'hem-fir,' a commercial lumber grade mixing western hemlock and true fir species. This lumber category became one of Washington's primary timber products."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Western Hemlock Became the Washington State Tree"
    paragraphs:
      - "Washington selected the Western Hemlock as its official state tree in 1947. The Washington State Legislature passed House Bill 196 during the 1947 session. Governor Monrad C. Wallgren signed the legislation on March 20, 1947. The bill established western hemlock as Washington's arboreal emblem in recognition of the tree's dominance in state forests and importance to the timber economy. No public vote determined the choice—legislators made the selection based on economic and ecological criteria, similar to [Washington's state flag adoption history](/states/washington/flag/washington-state-flag)."
      - "Washington picked western hemlock because it represented the backbone of the state's timber industry. By the 1940s, Washington led the nation in lumber production, and western hemlock supplied a substantial portion of that output. The species grew abundantly throughout western Washington, providing a seemingly endless timber supply. Hemlock lumber built military facilities during World War II, contributing to Washington's economic boom. The wood's light color, fine grain, and workability made it versatile for construction, paper production, and manufacturing. Choosing hemlock acknowledged the tree's role in Washington's prosperity."
      - "The tree's ecological dominance influenced the selection. Western hemlock grows more abundantly than any other tree species in Washington's coastal forests. It regenerates prolifically in shade, eventually replacing even long-lived Douglas-firs as forests mature. This ability to thrive beneath other trees gives hemlock the final word in forest succession across western Washington. The species defines Washington's temperate rainforest ecosystems more completely than any competitor. Legislators choosing a state tree in 1947 found western hemlock's combination of economic value and ecological supremacy compelling. The tree represented what Washington forests meant to state character—productive, abundant, and economically crucial natural resources."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Washington State Tree Facts"
    facts:
      - "Washington adopted Western Hemlock on March 20, 1947, through House Bill 196 signed by Governor Monrad C. Wallgren"
      - "Western hemlock is the most shade-tolerant tree in Washington forests, allowing it to regenerate beneath closed forest canopies"
      - "The drooping leader—the topmost shoot that hangs to one side—provides a distinctive identification feature visible from great distances"
      - "A single acre of mature hemlock forest can contain over 100 tons of biomass per acre, among the highest of any temperate forest"
      - "The tree can live 400 to 500 years under ideal conditions in Washington's Olympic Peninsula rainforests"
      - "Western hemlock bark was historically harvested for tannin used in leather processing, creating a secondary forest industry"
      - "Washington produced more hemlock lumber than any other state through most of the 20th century, shipping millions of board feet annually"
      - "The species grows naturally only along the Pacific Coast from northern California through southeast Alaska, with Washington at the center of its range"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Washington State Tree and Flower"
    paragraphs:
      - "Washington's state flower is the Coast Rhododendron (Rhododendron macrophyllum), designated in 1892. The state adopted its floral symbol more than half a century before selecting the western hemlock. Both the Western Hemlock and Coast Rhododendron represent Washington's native Pacific Northwest flora. The pink-purple rhododendron blooms create spectacular displays in late spring beneath the towering hemlocks. Both species thrive in Washington's moist climate and acidic soils. Hemlock forests provide the filtered light that rhododendrons prefer, creating a natural partnership in Washington ecosystems. The pair shows the layered structure of Washington forests—tall conifers overhead with flowering shrubs below; see [Washington's flower page](/states/washington/flower/coast-rhododendron)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Washington Western Hemlock"
    paragraphs:
      - "The leader provides the most distinctive identification feature. Look for a drooping or nodding top on the tree—the uppermost shoot bends to one side rather than pointing straight up. This drooping leader appears on hemlocks of all sizes and remains visible even on trees exceeding 200 feet. No other Washington conifer shows this characteristic. The drooping tip creates a graceful appearance that distinguishes hemlock from the more rigid profiles of Douglas-fir or true firs. Foresters and naturalists use the drooping leader as the quickest field identification marker."
      - "The needles offer definitive identification upon closer inspection. Each needle grows directly from the twig rather than in clusters. The needles vary in length on the same twig, creating an irregular, feathery appearance. Check the underside of needles for two white stomatal bands—lines of breathing pores that appear as white stripes. These bands distinguish hemlock from similar species. The needles remain on the tree for three to four years before dropping, maintaining dense foliage year-round. Small oval cones hang from outer branches, measuring smaller than most other Washington conifers."
      - "The overall form shows a narrow conical crown when growing in open conditions. Forest-grown hemlocks develop long, straight trunks with narrow crowns reaching toward available light. The branches droop slightly, creating a layered appearance. Lower branches often sweep downward and then curve upward at the tips. In old-growth forests, massive hemlocks develop thick bark with deep furrows that appears almost black. The combination of drooping leader, layered branches, and dark furrowed bark on old trees creates the classic Washington hemlock profile found in the state's ancient forests."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Washington State Tree Symbolizes"
    paragraphs:
      - "The Western Hemlock reflects Washington's character as a timber state and home to ancient rainforests. Its towering height represents strength and the vast natural resources that built Washington's economy. The tree's ability to thrive in shade and eventually dominate forests symbolizes persistence and long-term success. For many Washingtonians, hemlock forests evoke the state's unique Pacific Northwest character—misty, green, and seemingly endless. Conservation debates over old-growth hemlock forests reflect tensions between economic use and ecological preservation that define modern Washington. The tree stands at the center of discussions about sustainable forestry and wilderness protection that shape Washington's environmental policies and support [The Evergreen State nickname](/states/washington/nickname/the-evergreen-state)."

faq:
  - question: "What is the Washington state tree?"
    answer: "The Western Hemlock (Tsuga heterophylla) is Washington's official state tree, adopted by the State Legislature on March 20, 1947."
  
  - question: "What is the Washington state tree called?"
    answer: "Washington's state tree is called the Western Hemlock. It's also known as West Coast hemlock, Pacific hemlock, or Alaska pine. The scientific name is Tsuga heterophylla."
  
  - question: "When was the Washington state tree adopted?"
    answer: "Washington adopted the Western Hemlock as its official state tree on March 20, 1947. Governor Monrad C. Wallgren signed House Bill 196 establishing the designation."
  
  - question: "Why is the Western Hemlock Washington's state tree?"
    answer: "Washington chose the Western Hemlock because it was the state's most important timber species and dominated western Washington forests. By the 1940s, Washington led the nation in lumber production, with hemlock providing much of that output. The tree grows more abundantly than any other species in Washington's coastal forests and represented the state's timber economy. Its ecological dominance and economic value made it the clear choice."
  
  - question: "What is the Washington state tree name?"
    answer: "The name is Western Hemlock. The scientific name is Tsuga heterophylla, from the Japanese word for hemlock and Greek words meaning 'various leaves.' The 'western' distinguishes it from Eastern Hemlock."
  
  - question: "Where does the Washington state tree grow?"
    answer: "The Western Hemlock grows throughout Washington west of the Cascade Range crest. It thrives from sea level to about 5,000 feet elevation in areas receiving 50 to 80 inches of rain annually. The Olympic Peninsula and Cascades foothills contain extensive hemlock forests. The tree doesn't grow naturally in drier eastern Washington."
  
  - question: "What are some facts about the Washington state tree?"
    answer: "The Western Hemlock was adopted March 20, 1947. It grows 150 to 200 feet tall and can live 400 to 500 years. It's the most shade-tolerant Washington tree. The drooping leader is a distinctive identification feature. Washington produced more hemlock lumber than any state through most of the 20th century. An acre of mature hemlock forest contains over 100 tons of biomass."
  
  - question: "How do you recognize the Washington state tree?"
    answer: "Look for a distinctive drooping or nodding leader—the top shoot bends to one side. The needles vary in length on the same twig and have two white stripes underneath. Small oval cones measure three-quarters to one inch. Mature bark has deep furrows and dark. The overall form shows a narrow conical crown with slightly drooping branches. This drooping leader is visible even on 200-foot trees."

