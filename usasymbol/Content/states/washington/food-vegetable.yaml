sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Washington's State Vegetable?"
    paragraphs:
      - "The Walla Walla sweet onion is Washington's official state vegetable, designated by the Washington State Legislature in 2007. It is a mild, sweet onion grown in the valley surrounding the town of Walla Walla in southeastern Washington."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Walla Walla Sweet Onion"
    paragraphs:
      - "Walla Walla sweet onions are large, mild onions with a low-sulfur, sweet flavor, traced back to seeds an Italian soldier brought to the Walla Walla Valley in the late 1800s. They are planted in the fall, overwinter in the ground, and are harvested in early summer."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Walla Walla Sweet Onion Became Washington's State Vegetable"
    paragraphs:
      - "The Washington State Legislature designated the Walla Walla sweet onion the official state vegetable in 2007, recognizing a crop that had already given the Walla Walla Valley a national reputation for sweet onions."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Washington Chose the Walla Walla Sweet Onion"
    paragraphs:
      - "Washington chose the Walla Walla sweet onion because it can only be grown well in the specific soil and climate of the Walla Walla Valley, making it a distinctive regional crop tied directly to the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Walla Walla Sweet Onion Comes From in Washington"
    paragraphs:
      - "Walla Walla sweet onions are grown in the Walla Walla Valley in southeastern Washington, around the town of Walla Walla, where the mild climate and fertile soil suit the crop's slow overwinter growth."
