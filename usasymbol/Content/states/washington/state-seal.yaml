name: Great Seal of the State of Washington
adopted_year: 1889
is_official: true
legislation: RCW 1.20.103
meaning: "The Great Seal of the State of Washington places the portrait of George Washington at its center, making the connection between the state and its namesake literal. Washington entered the Union as the 42nd state on November 11, 1889. Its seal was created that same year, and its core design, the portrait ringed by the state name and the date 1889, has remained unchanged in its essential elements since adoption."
