intro_text: "Washington's state seal places a portrait of George Washington at the center, making it the only U.S. state seal built around the face of a specific historical person. The design dates to 1889, when Charles Talcott improvised it using a postage stamp as the portrait reference and a silver dollar to draw the inner circle."
