seo_description: "Washington made coffee its state beverage in 2011, formalizing the espresso identity the state already projected."
intro_text: Washington's official state beverage is **coffee**, designated in **2011** by a legislature that wrote its reasoning into the bill itself — citing the state's espresso culture and the coffee industry's economic weight before the vote. No other U.S. state has made coffee its official drink.
