sections:
- id: adoption
  icon: fa-solid fa-landmark
  title: When Coffee Became Washington's Official State Beverage
  paragraphs:
  - Washington designated coffee as its state beverage in 2011 through House Bill 1715, formally titled the 'official Washington state beverage act.' The legislature added coffee to the state's official symbols list in a single session.
  - Washington joins a short list of states with an official beverage. Most of those designations go to milk. Washington chose something different — a drink the state did not just consume but helped define for the rest of the country.
- id: why-coffee
  icon: fa-solid fa-bullseye
  title: Why Washington's Legislature Cited Espresso Culture in a Beverage Bill
  paragraphs:
  - The bill's findings go beyond naming a popular drink. Lawmakers wrote that Washington is well known for its espresso culture — phrasing that treats the state's coffee identity as an established regional fact, not a marketing tagline. The same findings call the coffee industry a vital part of the Washington state economy, giving the designation a commercial rationale alongside the cultural one.
  - That combination — identity and commerce — is what separates this from a feel-good gesture. The legislature was naming a reality the state already lived, then making it official enough to use.
- id: what-the-law-says
  icon: fa-solid fa-scroll
  title: "Washington's State Beverage Law: A Designation Built to Promote, Not Just Declare"
  paragraphs:
  - "[House Bill 1715](https://app.leg.wa.gov/billsummary?BillNumber=1715&Year=2011) characterizes the designation as a promotional tool Washington businesses can use worldwide — unusual language for a state symbol law. Most beverage designations name a product and stop. Washington's goes further, stating a purpose: the symbol exists partly to drive commerce."
  - The law names coffee broadly — no roast, no brew method, no specific producer. From the specialty roasters of Seattle to the drive-through espresso stands that line the state's highways, the full industry is covered. The breadth is the point.
- id: common-confusion
  icon: fa-solid fa-circle-question
  title: Is Washington's State Beverage About Starbucks or Coffee in General?
  paragraphs:
  - The designation is about coffee broadly — the beverage, the industry, and the culture — not about any single company. Starbucks did open its first store in Seattle in 1971, and it became one of the largest coffee companies in the world. But Washington's espresso identity did not begin and end with one chain.
  - The independent espresso stand became its own Pacific Northwest institution long before it spread elsewhere. Seattle's wholesale roasters, the regional café culture, and the walkup espresso window embedded into gas stations and strip malls across the state are all part of what the legislature was recognizing. Starbucks is a piece of that story. It is not the story.
- id: context
  icon: fa-solid fa-scale-balanced
  title: Why Washington's Official Drink Isn't Wine, Beer, or Cider
  paragraphs:
  - Washington is the country's top producer of hops, a major wine-producing state, and home to a serious craft beer industry. None of those got the official beverage designation. Coffee did.
  - Wine and beer are regionally significant, but neither carries the same association with the state's public character — the espresso culture cited in the bill is something people across the country connect specifically to Washington in a way they do not connect Yakima Valley hops or Columbia Valley wine.
  - The beverage category was where lawmakers decided to plant the coffee flag. The [full list of Washington state symbols](/states/washington) has room for the apple, the orca, the western hemlock — coffee claimed the drink.
timeline:
- year: Late 1980s
  description: Espresso carts and drive-through espresso stands begin multiplying across Seattle and the surrounding region, establishing the state's distinct walkup coffee culture — a format that would spread across the Pacific Northwest before appearing anywhere else in the country.
- year: 1990s
  description: Seattle becomes nationally synonymous with specialty coffee. The city's roasters, cafés, and espresso stand model gain recognition beyond the region, and Washington's coffee identity solidifies as something distinct from the rest of the country's coffee habits.
- year: '2011'
  description: Washington State Legislature passes House Bill 1715, designating coffee as the official state beverage. The bill cites the state's espresso culture and the coffee industry's economic importance. The act may be cited as the 'official Washington state beverage act.'
faq:
- question: What is Washington's official state beverage?
  answer: Washington's official state beverage is coffee. The designation was made by the Washington State Legislature in 2011 through House Bill 1715, also known as the official Washington state beverage act.
- question: When did Washington designate coffee as its state beverage?
  answer: In 2011, through House Bill 1715. The act passed in the 2011 legislative session and has remained on the official Washington state symbol list since.
- question: Why did Washington choose coffee as its state beverage?
  answer: "The legislature's own findings cite two reasons: Washington's well-known espresso culture and the coffee industry's importance to the state's economy. The designation was also framed explicitly as a promotional tool for Washington businesses to use worldwide."
- question: Is the Washington state beverage designation about Starbucks?
  answer: No. The designation covers coffee broadly — the beverage, the industry, and the regional espresso culture. It is not tied to or named for any specific company. Starbucks is part of Washington's coffee story but the law designates the category, not the chain.
- question: Does Washington have a state drink besides coffee?
  answer: Coffee is Washington's only official state beverage. The state also produces wine, beer, and cider at significant scale, but none of those carry an official state symbol designation.
- question: What does the Washington state beverage law say exactly?
  answer: House Bill 1715 designates coffee as the official state beverage and may be cited as the 'official Washington state beverage act.' The findings state that Washington is well known for its espresso culture, that the coffee industry is a vital part of the Washington state economy, and that the designation serves as a promotional tool Washington businesses can use worldwide.
