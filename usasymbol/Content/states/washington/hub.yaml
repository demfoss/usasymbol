seo_description: "Washington state symbols: official state symbols include the Willow Goldfinch, coast rhododendron, western hemlock, orca, and Evergreen State nickname."
snippet_answer: Washington's orca and western hemlock are two of the state's most recognized official state symbols — one tied to Puget Sound and one to the forests that earned the Evergreen State nickname. The Willow Goldfinch, coast rhododendron, George Washington portrait flag, Olympic marmot, and coffee designation round out a list shaped by coast, rainforest, and mountain country.
