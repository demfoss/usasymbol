name_meaning:
  heading: What Does Washington Mean?
  paragraphs:
  - Washington is named for George Washington, the first president of the United States. It is the only U.S. state named for a president.
  - "The name shows up literally on the state flag, which places Washington's portrait on a green field. Around that presidential name, the rest of the hub becomes much more local: Evergreen forests, Puget Sound orcas, Olympic marmots, coast rhododendron, and coffee culture."
  - Washington's postal abbreviation is WA, and residents are Washingtonians. The state does not have an officially adopted motto, though Alki remains an important territorial-era word.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named for George Washington, the first U.S. president.
    - label: Statehood
      text: Washington became the 42nd state in 1889.
    - label: Unique point
      text: It is the only U.S. state named for a president.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Washington state in the Pacific Northwest, not Washington, D.C.
    - label: People
      text: People from Washington are called Washingtonians.
    - label: Motto status
      text: Washington has no officially adopted state motto, though Alki is historically associated with the territory.
  - heading: Nicknames and Short Forms
    items:
    - label: The Evergreen State
      text: The common nickname points to the state's year-round conifer forests.
    - label: Abbreviation
      text: WA; older short form Wash.
editorial:
  heading: What Washington's Symbols Say About the State
  paragraphs:
  - The [Evergreen State nickname](/states/washington/nickname), [western hemlock](/states/washington/tree), and green [state flag](/states/washington/flag) make forests the hub's easiest first read.
  - The animal symbols are more geographically specific. The [orca](/states/washington/mammal/orca) belongs to Puget Sound and the Salish Sea, while the [Olympic marmot](/states/washington/mammal/olympic-marmot) lives only in the Olympic Mountains.
  - Washington's [coffee](/states/washington/beverage/coffee) designation keeps the page from becoming only a nature guide. It names an everyday urban and economic culture that fits Seattle and the broader state in a way no generic drink symbol would.
faq:
- question: What is Washington's most famous state symbol?
  answer: The [Evergreen State nickname](/states/washington/nickname) is the most direct shorthand because it matches Washington's forests and the green field of the state flag.
- question: What is Washington's state bird?
  answer: Washington's state bird is the [Willow Goldfinch](/states/washington/bird), commonly known today as the American Goldfinch.
- question: What is Washington's state flower?
  answer: Washington's state flower is the [coast rhododendron](/states/washington/flower), adopted in 1892.
- question: Does Washington have an official state motto?
  answer: Washington has never officially adopted a state motto. [Alki](/states/washington/motto) is historically associated with the territory, but it is not an official motto.
- question: How many official state symbols does Washington have?
  answer: Washington's state symbols list here includes the flag, Willow Goldfinch, coast rhododendron, western hemlock, Evergreen State nickname, colors, coffee, orca, Olympic marmot, and Alki motto page.
