faq:
  - question: What is Washington's state sport?
    answer: "Washington's official state sport is pickleball, adopted in 2022."
  - question: When did Washington adopt pickleball as its state sport?
    answer: "Washington adopted pickleball as its state sport in 2022, signed into law on March 28 of that year."
  - question: Why did Washington choose pickleball?
    answer: "Pickleball was invented on Bainbridge Island in 1965, making Washington the only state that can claim to be the sport's birthplace. Lawmakers designated it the state sport to honor that homegrown history."
  - question: Where was pickleball invented?
    answer: "Pickleball was invented on Bainbridge Island, Washington, in the summer of 1965. Joel Pritchard, Bill Bell, and Barney McCallum built the first court and wrote the first rules there."

