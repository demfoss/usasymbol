faq:
  - question: "What is Washington's state motto?"
    answer: "Washington has no official state motto. It is the only U.S. state that has never adopted one by law. The word \"Alki\" is Washington's territorial motto — it appeared on the territorial seal from 1854 through 1889 — but no legislature has ever made it official."

  - question: "What does \"Alki\" mean?"
    answer: "\"By and by\" or \"eventually\" in Chinook Jargon, the Pacific Northwest trade language of the 1800s. The word expressed patient optimism. Settlers used it when they named their 1851 settlement New York-Alki, meaning \"New York, someday.\""

  - question: "What language is \"Alki\" from?"
    answer: "Chinook Jargon, a Pacific Northwest pidgin trade language combining words from Chinook and Nuu-chah-nulth Indigenous languages with French and English. It was spoken across Oregon, Washington, British Columbia, and Idaho in the 1800s."

  - question: "Why does Washington have no state motto?"
    answer: "When Washington became a state in 1889, jeweler Charles Talcott designed a new seal without a motto. The legislature adopted that design and has never passed a bill to designate one. Washington has official symbols for dozens of categories, but a motto is not among them."

