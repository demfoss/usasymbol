title: "Alki"
language: "Chinook Jargon"
english_translation: "Bye and Bye"
adopted_year: "Never officially adopted"

author: "USA Symbol Team"
date_published: "2025-12-05"
date_modified: "2026-03-27"
seo_title: "Washington State Motto: Alki – History & Translation"
seo_description: "Washington is the only U.S. state that has never officially adopted a state motto. 'Alki' appeared on the territorial seal in the 1850s but disappeared when a jeweler redesigned the seal at statehood in 1889. The word is Chinook Jargon — a Pacific Northwest trade language — meaning 'bye and bye' or 'eventually.'"

intro_text: "Washington is the only U.S. state that has never officially adopted a state motto. The word <strong>Alki</strong> — Chinook Jargon for <em>bye and bye</em> or <em>eventually</em> — appeared on the territorial seal designed by Lieutenant J.K. Duncan around 1853. But when Washington achieved statehood in 1889, jeweler Charles Talcott created a new seal design based on a silver dollar portrait of George Washington. Alki was not included. No legislature has ever passed a law establishing an official motto. Washington remains, officially, motto-less."

sections:
  - id: "only-state-without-motto"
    icon: "fa-solid fa-circle-xmark"
    title: "The Only State That Never Adopted a Motto"
    paragraphs:
      - "All 49 other states have at least one officially adopted state motto — passed by legislature or written into a constitution. Washington has none. The word 'Alki' appeared on the territorial seal for about 36 years, from the early 1850s to 1889 statehood, but it was never formally adopted as a motto by any legislative body. It was part of a seal design, not a legally designated state motto."
      - "At statehood in 1889, jeweler Charles Talcott created a replacement seal. His design centered on a portrait of George Washington derived from a Gilbert Stuart painting on a silver dollar. The design had no motto. No text equivalent to 'Alki' appeared anywhere on it. When the legislature adopted the new seal, it adopted a motto-less design and never went back to fix the gap."
      - "The Washington Legislature adopted the state flag on March 5, 1923 — still no motto. Washington has passed laws establishing official state birds, trees, flowers, fish, insects, gems, and dozens of other symbols. But through every legislative session since 1889, no bill to designate an official motto has ever become law."

  - id: "alki-meaning-and-origin"
    icon: "fa-solid fa-language"
    title: "Alki: A Chinook Jargon Word for Patient Hope"
    paragraphs:
      - "Chinook Jargon was a Pacific Northwest trade language — a pidgin that combined words from Chinook and Nuu-chah-nulth Indigenous languages with French and English borrowings. Over 100,000 people across Oregon, Washington, British Columbia, Idaho, and Alaska spoke it in the 1800s. Fur traders, missionaries, settlers, and Native Americans used it as their common language for trade and everyday communication."
      - "In Chinook Jargon, 'alki' means bye and bye, eventually, or in the future — expressing patient optimism about things not yet achieved. When Arthur Denny's party arrived at what they named New York-Alki in November 1851, the name carried that meaning: New York, someday. They believed their settlement on the western shore of Elliott Bay would grow into a city as significant as New York. It didn't — most of them moved across the bay and founded Seattle instead."
      - "Lieutenant J.K. Duncan placed 'Alki' on the territorial seal around 1853 beneath the Goddess of Hope, who holds an anchor and points toward the word. The combination — hope, anchor, and 'eventually' — expressed the pioneer belief that Washington Territory would eventually prosper. When that territory became a state 36 years later, the word didn't survive the transition."

  - id: "new-york-alki"
    icon: "fa-solid fa-city"
    title: "New York-Alki: The Settlement That Named Itself 'Eventually'"
    paragraphs:
      - "On November 13, 1851, the schooner Exact delivered 24 settlers to a beach on the west shore of Elliott Bay — Arthur Denny's party from Illinois. It was raining. The women reportedly cried when they saw the conditions. They named their settlement New York-Alki: New York after Charles Terry's hometown in New York State, and Alki because they believed it would someday grow as large."
      - "The New York part of the name didn't survive. By 1852, most of the party had relocated across the bay to a site with a deeper harbor — the settlement that became Seattle. Charles Terry stayed at Alki Point. The community shrank. Seattle grew. Alki Point is now a West Seattle neighborhood with a beach, a lighthouse, and a monument at Alki Avenue and 63rd Avenue Southwest marking the 1851 landing."
      - "The optimism embedded in the word proved more durable than the settlement it named. Alki Point remained on maps, 'Alki' remained on the territorial seal, and the word outlasted the specific ambition it once described. It expressed something more general: the pioneer belief that patience and work would eventually bring prosperity to the Pacific Northwest."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Washington State Motto Facts"
    style: "gradient"
    facts:
      - "Washington is the only U.S. state that has never officially adopted a state motto."
      - "'Alki' appeared on the territorial seal from the 1850s to 1889, when a new seal design omitted it."
      - "Jeweler Charles Talcott created the 1889 state seal from a Gilbert Stuart portrait on a silver dollar — no motto included."
      - "Arthur Denny's settlers named their 1851 beach settlement 'New York-Alki' — meaning 'New York, someday.'"
      - "Most of the New York-Alki settlers relocated across Elliott Bay and founded Seattle; Charles Terry stayed at Alki Point."
      - "Chinook Jargon was spoken by over 100,000 people across the Pacific Northwest in the 1800s."

faq:
  - question: "What is Washington's state motto?"
    answer: "Washington has no official state motto — it is the only U.S. state that has never officially adopted one. The word 'Alki' appeared on the territorial seal from the 1850s through 1888, but was not carried forward to the state seal at statehood in 1889. No legislation has ever formally designated a motto."

  - question: "What does 'Alki' mean?"
    answer: "'Bye and bye' or 'eventually' in Chinook Jargon, the Pacific Northwest trade language spoken by over 100,000 people in the 1800s. The word expressed patient optimism — the pioneer belief that Washington Territory would eventually prosper. Settlers used it in the settlement name 'New York-Alki' (meaning 'New York, someday') at the 1851 Alki Point landing."

  - question: "Why does Washington have no official motto?"
    answer: "When Washington achieved statehood in 1889, jeweler Charles Talcott designed a new state seal based on a portrait of George Washington — without including 'Alki.' The legislature adopted that seal and never passed legislation to designate a motto. Washington has enacted laws for dozens of other state symbols, but no motto bill has ever become law."

  - question: "What language is 'Alki' from?"
    answer: "Chinook Jargon — a Pacific Northwest pidgin trade language combining Chinook, Nuu-chah-nulth, French, and English vocabulary. It was the common language of fur traders, missionaries, settlers, and Native Americans across the region in the 1800s. 'Alki' is one of several Chinook Jargon words preserved in Pacific Northwest place names."

  - question: "Where does 'Alki' appear today?"
    answer: "Primarily in place names and historical references. Alki Point in West Seattle marks the 1851 landing site, with a monument at Alki Avenue and 63rd Avenue Southwest. Museums display reproductions of the old territorial seal showing the Goddess of Hope pointing to the word. 'Alki' does not appear on Washington's current state seal or flag."

  - question: "Is 'Alki' Washington's official motto?"
    answer: "No. 'Alki' has never been legally adopted as Washington's state motto. It appeared on the territorial seal by design choice, not by legislative action, and was dropped from the seal at statehood in 1889. Washington is commonly listed in motto collections with 'Alki' as its unofficial or historical motto, but it has no official legal status."

