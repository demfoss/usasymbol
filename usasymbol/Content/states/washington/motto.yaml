title: "Alki"
language: "Chinook Jargon"
english_translation: "By and By"
adopted_year: "Never officially adopted"

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-05-24"
seo_title: "Washington State Motto | Alki"
seo_description: "Washington has no official state motto. \"Alki,\" Chinook Jargon for \"by and by,\" appeared on the territorial seal from 1854 until statehood in 1889."

intro_text: "Washington is the only U.S. state without an official state motto. The word <strong>Alki</strong> — Chinook Jargon for <em>by and by</em> or <em>eventually</em> — appeared on the territorial seal from 1854 through 1889, then was dropped when a new state seal was created at statehood. No Washington legislature has ever adopted a motto. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

