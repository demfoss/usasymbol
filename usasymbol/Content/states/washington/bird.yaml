title: Willow Goldfinch
scientific_name: Spinus tristis salicamans
adopted_year: 1951
legislation: RCW 1.20.040
meaning: Washington's bird page works best as a refusal story. The state did not simply accept the first bird schoolchildren chose. When the Western Meadowlark won in 1928, lawmakers hesitated because the symbol already belonged to too many other states. The eventual 1951 choice of the Willow Goldfinch, the regional name preserved in Washington law for the bird now commonly called the American Goldfinch, reads as an attempt to keep the emblem from feeling borrowed.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: "2026-05-02"
seo_title: "Washington State Bird | Willow Goldfinch"
seo_description: "Washington adopted the Willow Goldfinch in 1951 after dropping a meadowlark pick. The law still keeps the older name."
intro_text: Washington's official state bird is the <strong>Willow Goldfinch</strong>, adopted in <strong>1951</strong> and now listed in <strong>RCW 1.20.040</strong>. Most readers know the same bird today as the <strong>American Goldfinch</strong>. The useful part of the story is that Washington did not settle for the first winner. Schoolchildren chose the Western Meadowlark in 1928, but the state backed away because too many other states already used it. After more voting and a long delay, Washington ended up with a goldfinch instead. That makes this page less about bird facts and more about a state trying not to borrow someone else's emblem. This profile appears in the [list of U.S. state birds](/symbols/birds).
shared_states:
- Iowa
- New Jersey
