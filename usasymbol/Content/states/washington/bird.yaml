sections:
- id: why-did-washington-walk-away-from-the-meadowlark
  icon: fa-solid fa-circle-question
  title: Why Did Washington Walk Away From the Meadowlark?
  paragraphs:
  - 'Washington''s first state-bird vote did not stick. In 1928 schoolchildren chose the Western Meadowlark, but the result stalled immediately: Oregon had just adopted the meadowlark, and several other states were already using it. The winner felt borrowed before the ink was dry.'
  - The Washington Federation of Women's Clubs sponsored a second referendum in 1931, and the goldfinch won that round. The Legislature still did not act. Washington went back to schoolchildren for another vote before finally making the goldfinch official in 1951.
  - Twenty-three years is a long time for a bird. Washington kept reopening the question because it wanted an emblem that didn't feel like it belonged to everyone — which is also why Iowa and New Jersey having the same species doesn't undercut the choice the way the meadowlark would have.
- id: why-does-washington-law-still-say-willow-goldfinch
  icon: fa-solid fa-tag
  title: Why Does Washington Law Still Say Willow Goldfinch?
  paragraphs:
  - RCW 1.20.040 still uses the older name <strong>Willow Goldfinch</strong>. Modern bird guides and Washington wildlife pages more often use <strong>American Goldfinch</strong> for the same bird.
  - That older wording is not an oversight. Washington preserved a more regional name for the species it was claiming — which fits the larger pattern of the adoption. A state that spent twenty-three years avoiding a generic symbol was unlikely to settle for a generic label either.
- id: how-did-the-washington-federation-of-womens-clubs-move-the-process-forward
  icon: fa-solid fa-users
  title: How Did the Washington Federation of Women's Clubs Move the Process Forward?
  paragraphs:
  - After the 1928 meadowlark vote stalled, the question needed a new mechanism. The Washington Federation of Women's Clubs provided one by sponsoring a fresh referendum in 1931 — not another school poll, but a broader public vote that could produce a less contested result.
  - That 1931 referendum was the first time the goldfinch won a formal majority. Without the federation's intervention, Washington might have stayed stuck between a discarded meadowlark result and a Legislature unwilling to act on it. The clubs gave the goldfinch its first clear mandate.
  - The Legislature still waited another twenty years. But when it finally moved in 1951, the goldfinch had already won twice — the 1931 referendum and a later school vote. The designation was less a new decision than a ratification of what civic organizations had settled long before lawmakers caught up.
faq:
- question: What is Washington's state bird?
  answer: Washington's state bird is the Willow Goldfinch, the older legal name for the bird now more commonly called the American Goldfinch.
- question: When did Washington adopt the Willow Goldfinch?
  answer: Washington adopted the Willow Goldfinch in 1951. The designation now appears in RCW 1.20.040.
- question: Why did Washington not keep the Western Meadowlark?
  answer: Washington backed away from the meadowlark after the 1928 school vote because the species was already used by too many other states. The symbol felt too widely shared.
- question: Why does Washington law still say Willow Goldfinch?
  answer: Because that is the older regional name preserved in the statute. Today many readers and wildlife agencies use the broader name American Goldfinch for the same bird.
- question: Why did it take Washington so long to choose a state bird?
  answer: The process stretched across twenty-three years because Washington did not accept the first winner. There was a 1928 school vote, a 1931 referendum backed by the Washington Federation of Women's Clubs, and a final 1951 decision.
- question: Does Washington share its state bird with other states?
  answer: Yes. Iowa and New Jersey also use the goldfinch, but Washington's page reads differently because the state arrived there only after rejecting a more crowded symbol and keeping the older legal name Willow Goldfinch.
- question: What does the Willow Goldfinch mean for Washington?
  answer: Washington's goldfinch is the result of the state deciding the first answer wasn't good enough. The symbol carries the weight of that twenty-three-year process — not a default choice, but the one Washington kept reaching for after rejecting something that felt too widely shared.
