hero_image_caption: The Great Seal of the State of New York, adopted in 1777 and updated in 2020. Liberty stands at left with a Phrygian cap on a pole and a crown at her feet. Justice at right holds scales and a sword. The ribbon below now reads Excelsior and E Pluribus Unum.
intro_text: "New York's state seal, adopted in 1777, places Liberty and Justice on either side of a shield showing Hudson River ships, the Highland mountains, and a rising sun. A crown lies at Liberty's feet, marking the founders' rejection of monarchy. The ribbon below now carries both Excelsior and E Pluribus Unum."
