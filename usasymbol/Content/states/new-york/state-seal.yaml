name: Great Seal of the State of New York
adopted_year: 1777
is_official: true
legislation: New York State Law § 74
meaning: "New York's state seal organizes its symbols around a specific argument: liberty and law are equally necessary for republican government, and both require an active rejection of monarchy. Liberty stands on the left with a Phrygian cap and a discarded crown at her feet. Justice stands on the right, blindfolded, holding scales and a sword. The Hudson River landscape between them grounds the design in New York's own geography. The eagle above and the paired mottos Excelsior and E Pluribus Unum complete the state's statement about aspiration, union, and republican identity."
