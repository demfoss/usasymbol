sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is New York's State Muffin?"
    paragraphs:
      - "The apple muffin is New York's official state muffin, designated by the New York State Legislature in 1987. It is a sweet muffin made with chopped or grated apple mixed into the batter."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Apple Muffin"
    paragraphs:
      - "An apple muffin combines a spiced batter, often flavored with cinnamon, with pieces of fresh apple that soften while baking, adding moisture and a mild fruit flavor throughout the muffin."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Apple Muffin Became New York's State Muffin"
    paragraphs:
      - "The New York State Legislature designated the apple muffin the official state muffin in 1987, the same year the apple was named the state fruit."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New York Chose the Apple Muffin"
    paragraphs:
      - "New York is one of the largest apple-producing states in the country, with major orchard regions in the Hudson Valley, western New York, and the Lake Ontario shore. The apple muffin reflects that agricultural industry directly."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Apple Muffin Facts"
    facts:
      - "Adopted as New York's state muffin in 1987."
      - "New York is one of the top apple-producing states in the country."
      - "Adopted the same year the apple became New York's state fruit."

