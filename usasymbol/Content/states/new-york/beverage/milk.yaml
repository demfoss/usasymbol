faq:
- question: What is the official state beverage of New York?
  answer: Milk is the official state beverage of New York. It was designated in 1981 and signed into law by Governor Hugh Carey.
- question: Why did New York choose milk as its state beverage?
  answer: New York chose milk because of the state's major dairy industry. New York ranks third in the nation in dairy production, and dairy farming — particularly in Upstate New York — is one of the foundational parts of the state's agricultural economy. The designation recognized that economic reality directly.
- question: When was milk designated as New York's state beverage?
  answer: In 1981. The New York state legislature passed the designation and Governor Hugh Carey signed it into law.
- question: How big is New York's dairy industry?
  answer: New York ranks third in the country in dairy production, behind California and Wisconsin. The industry is concentrated in Upstate New York and supports fluid milk production as well as the manufacturing of cheese, butter, and yogurt.
- question: Does New York have any other dairy-related state symbols?
  answer: Yes. In 2014, New York designated yogurt as the official state snack — the first state to name a snack food as an official symbol. The yogurt designation reflected New York's position as the largest yogurt-producing state in the country by that point, driven largely by Greek yogurt manufacturing in the Mohawk Valley and Central New York.
- question: Which New York governor signed the milk designation?
  answer: Governor Hugh Carey signed the legislation designating milk as New York's official state beverage in 1981.
