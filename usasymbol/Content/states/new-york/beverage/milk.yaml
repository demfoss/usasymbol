seo_title: 'New York State Beverage: Why Milk Was Chosen in 1981'
seo_description: Milk is the official state beverage of New York, designated in 1981 and signed by Governor Hugh Carey. Learn why New York's dairy economy — one of the largest in the country — made milk the only real choice.
intro_text: New York's official state beverage is <strong>milk</strong>, designated in <strong>1981</strong> by the state legislature and signed into law by Governor Hugh Carey. The choice was not sentimental. New York has one of the most productive dairy industries in the country, and milk was the symbol that made that economic reality visible. For the farms of Upstate New York, the designation was less a celebration than a plain acknowledgment of what has driven the region's agriculture for well over a century.
