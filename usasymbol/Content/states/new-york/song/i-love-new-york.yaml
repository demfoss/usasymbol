faq:
  - question: What is New York's state song?
    answer: "New York's official state song is \"I Love New York,\" adopted in 1980."
  - question: Who wrote New York's state song?
    answer: "Steve Karmen wrote both the words and music in 1977."
  - question: When did New York adopt "I Love New York" as its state song?
    answer: "The New York Legislature adopted the song in 1980, three years after it was written."
  - question: Was "I Love New York" originally a commercial?
    answer: "Yes. It began as a jingle for a 1977 state tourism campaign before becoming the official state song."

