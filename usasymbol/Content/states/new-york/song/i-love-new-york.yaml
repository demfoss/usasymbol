sections:
  - id: overview
    icon: fa-solid fa-music
    title: New York State Song
    paragraphs:
      - "\"I Love New York\" is New York's official state song, adopted in 1980. Advertising composer Steve Karmen wrote it in 1977 as the jingle for a state tourism campaign, and it became one of the rare state songs to start life as a commercial rather than a formal anthem."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"I Love New York\" Explained"
    paragraphs:
      - "The song is a short, upbeat, brass-driven jingle built to be instantly memorable, with a simple repeated hook rather than multiple verses. Its tone is closer to a commercial fanfare than a traditional folk-style state song."
      - "Steve Karmen, known in the advertising industry as the King of Jingles, wrote the song in 1977 at the request of Governor Hugh Carey's administration and the Wells, Rich, Greene advertising agency, which was building a campaign to improve New York's image during a period of economic trouble."
      - "Karmen gave the state free rights to use the song, an unusual move for a working jingle writer, and it was paired with designer Milton Glaser's now-famous \"I ❤ NY\" logo."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "I Love New York" Represents New York
    paragraphs:
      - "New York adopted the song because it had already become the sound most associated with the state in the public mind by the late 1970s. The tourism campaign it launched helped shift perceptions of New York City during a difficult economic stretch, and the song was inseparable from that turnaround."
      - "Its commercial origin also fit New York's identity as a state built on media, advertising, and reinvention. Few states could claim a song written for television that grew into genuine civic pride rather than the other way around."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"I Love New York\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "I Love New York" Became New York's State Song
    paragraphs:
      - "The New York Legislature designated \"I Love New York\" the official state song in 1980, three years after Karmen wrote it as a tourism jingle. The quick jump from advertisement to official anthem reflects how fast the song and its accompanying logo took hold statewide."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of New York

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"I Love New York\" Facts"
    facts:
      - "New York adopted \"I Love New York\" as its official state song in 1980."
      - "Steve Karmen wrote the song in 1977 as a jingle for a state tourism campaign."
      - "Karmen gave the state free rights to use the song rather than charging a licensing fee."
      - "The song launched alongside designer Milton Glaser's \"I ❤ NY\" logo."
      - "New York also recognizes \"Here Rests in Honored Glory\" as its official state hymn of remembrance."

