faq:
- question: What is New York's current license plate slogan?
  answer: New York's current standard license plate slogan is "Excelsior," the state motto meaning "ever upward."
- question: Did New York plates always use Empire State before Excelsior?
  answer: No. New York used World's Fair slogans in 1938-1940 and 1964-1965, used Empire State wording in several periods, and had no standard passenger plate slogan from 1966 through 2000.
- question: When did New York first use "The Empire State" on plates?
  answer: New York first used "THE EMPIRE STATE" on standard passenger plates in 1951. That full wording continued through the 1955-56 base.
- question: When did New York shorten the slogan to "Empire State"?
  answer: New York shortened the slogan to "EMPIRE STATE" in 1957, and that wording continued through 1963. It returned on the Empire Gold base issued from April 2010 through May 2020.
- question: When did New York plates have no slogan?
  answer: New York standard passenger plates carried no text slogan from 1966 through 2000. The 1964 World's Fair plate was revalidated for 1965, so 1965 is not part of the clean no-slogan period.
- question: Are Excelsior plates mandatory in New York?
  answer: No. New York DMV says drivers can keep their current valid plates or order Excelsior plates; Excelsior plates are issued for new registrations, lost or stolen replacement plates, and new personalized plates.

