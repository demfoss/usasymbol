intro_text: "**\"Excelsior\"** is the slogan on New York's current standard license plate design. The word is New York's state motto, usually translated as \"ever upward.\" It replaced the Empire State slogan on the Excelsior base introduced in 2020, though older valid Empire State and Empire Gold plates can still remain on registered vehicles. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "New York's current license plate slogan is \"Excelsior.\" Earlier general-issue passenger plates used World's Fair slogans in 1938-1940 and 1964-1965, \"THE EMPIRE STATE\" from 1951-1956, \"EMPIRE STATE\" from 1957-1963 and 2010-2020, and \"THE EMPIRE STATE\" again from 2001-2010. Standard passenger plates carried no slogan from 1966 through 2000."
