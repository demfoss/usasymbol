    description: The slogan shortened to "EMPIRE STATE" in 1957 and stayed that way on the 1958-59, 1960-61, and 1962-63 bases.
  - name: World's Fair
    years: 1964-1965
    image: /images/license-plates/new-york/1964-worlds-fair.jpg
    description: The 1964 base carried "WORLD'S FAIR" for the 1964-65 New York World's Fair and was revalidated for 1965.
  - name: The Empire State
    years: January 2001-March 2010
    image: /images/license-plates/new-york/2001-the-empire-state.webp
    description: The scenic Empire State plate brought back "THE EMPIRE STATE" with Niagara Falls, the Adirondacks, and New York City imagery.
  - name: Empire State
    years: April 2010-May 2020
