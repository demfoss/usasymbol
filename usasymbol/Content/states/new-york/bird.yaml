title: Eastern Bluebird
scientific_name: Sialia sialis
adopted_year: 1970
legislation: N.Y. State Law Sec. 78
meaning: New York's state bird makes the most sense as a long-delayed public choice. The bluebird had already won a 1928 statewide preference vote, but the Legislature did not turn that result into law until 1970. That delay made the symbol feel less like a sudden Albany invention and more like a late ratification of an older New York favorite.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: "2026-05-02"
seo_title: "New York State Bird | Eastern Bluebird"
seo_description: New York adopted the Eastern Bluebird in 1970 after a 42-year delay from an earlier public vote, making New York the last state to designate an official bird.
intro_text: The <strong>Eastern Bluebird</strong> became New York's official state bird on <strong>May 18, 1970</strong>, when Governor Nelson Rockefeller signed the designation now carried in <strong>N.Y. State Law Sec. 78</strong>. What makes the story unusual is the wait. New Yorkers had already informally chosen the bluebird in <strong>1928</strong>, but the state left that result unofficial for <strong>42 years</strong>. That made New York the last state to adopt an official bird and turned the bluebird into a symbol the public had chosen long before Albany finished the job.
