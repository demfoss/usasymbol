sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of New York?
    paragraphs:
      - "The common snapping turtle is New York's official state reptile, designated by the New York Legislature in 2006. Its scientific name is Chelydra serpentina, and it is one of the largest freshwater turtles in the northeastern United States."
      - "It lives in ponds, lakes, marshes, and slow rivers throughout New York."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Common Snapping Turtle
    paragraphs:
      - "Common snapping turtles have a large, rugged, dark brown to black shell, a long tail with jagged ridges, and a powerful hooked jaw."
      - "Adults can grow to 18 inches or more in shell length and can weigh over 30 pounds, making them among the heaviest turtles in the state."
      - "They spend most of their time submerged in mud or vegetation at the bottom of ponds and slow waterways, with only their eyes and nostrils above the surface."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The New York Legislature designated the common snapping turtle the official state reptile in 2006, following a campaign led by New York schoolchildren who proposed the turtle for the honor."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why New York Chose the Common Snapping Turtle
    paragraphs:
      - "The common snapping turtle is found in nearly every freshwater habitat across New York, and its size and long history in the state's waterways made it a popular choice among the students who championed it."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Common Snapping Turtle
    paragraphs:
      - "Common snapping turtles live in ponds, lakes, marshes, and slow-moving rivers throughout New York, from Long Island to the Adirondacks."
