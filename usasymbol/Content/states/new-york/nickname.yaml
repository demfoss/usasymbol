seo_title: "New York State Nickname | The Empire State"
seo_description: "New York is known as The Empire State, its official state nickname. Learn why the name fits and what other nicknames the state has used."

intro_text: "In 1785, George Washington referred to New York as <i>the Seat of the Empire</i> in a letter to the New York Common Council, a phrase that later inspired the Empire State nickname. The name appeared on New York license plates from 1951 through the mid-1960s and returned in 2001. Today, the Empire State is New York’s most widely recognized and established state nickname, supported by long-standing public and governmental use."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Empire State'"
    paragraphs:
      - "In a 1785 letter to the New York Common Council, George Washington praised New York's role during the Revolutionary War and described the state as the Seat of the Empire. He emphasized New York's strategic position between New England and the southern colonies, control of the Hudson River, and access to major Atlantic ports. Neighboring Connecticut shared that same strategic corridor — the [Connecticut's official moniker](/states/connecticut/nickname/the-constitution-state) grew from a similar founding-era identity shaped by proximity to major Revolutionary battlegrounds."
      - "By the early 1800s, the Empire State nickname had entered common use. Historian Alexander Flick noted that the name was widely recognized by 1825 and appeared in print as early as 1819. The nickname is often linked to New York's growing population, economic strength, and expanding influence following independence. Pennsylvania experienced nearly parallel growth during the same decades, and the [Keystone State history](/states/pennsylvania/nickname/the-keystone-state) reflects how its central position among the original colonies earned it a name that still resonates today."
      - "The state of New York nickname appears in several official and cultural landmarks. The Empire State Building, completed in 1931, carried the name long before becoming one of the world's most recognizable skyscrapers. Empire State Plaza in Albany serves as a center for state government offices. License plates displayed Empire State from 1951 through the mid-1960s, disappeared for several decades, and returned in 2001. Few entries in the [state by state nickname list](/symbols/nicknames) carry as much cultural weight or appear on as many recognizable landmarks as Empire State does."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Big Apple"
        text: "Sports writer John J. Fitz Gerald heard African American stable hands in New Orleans around 1920 refer to New York City racetracks as the big apple, meaning prestigious venues with large prizes. Fitz Gerald began using the term in his New York Morning Telegraph horse racing column titled <i>Around the Big Apple</i>, which debuted in February 1924. Jazz musicians later adopted the phrase during the 1930s to describe New York City as a center for major music clubs. Use of the nickname declined by the 1940s. In 1971, Charles Gillett of the New York Convention and Visitors Bureau revived the phrase as part of a tourism campaign. The campaign succeeded, and the Big Apple remains one of the most recognized New York City nicknames worldwide. In 1997, Mayor Rudy Giuliani designated the corner of West 54th Street and Broadway as Big Apple Corner in honor of Fitz Gerald."
      - subtitle: "Gotham"
        text: "Writer Washington Irving first used Gotham to describe New York in the November 11, 1807 edition of his satirical magazine <i>Salmagundi</i>. He borrowed the name from a medieval English village in Nottinghamshire whose residents were known in folklore for pretending to be foolish. Irving applied the term sarcastically to comment on New York's culture and politics. The nickname endured, and in 1940, Batman co-creator Bill Finger selected Gotham City as Batman's fictional home after finding the name in a New York City phone book. Gotham City has since become closely associated with New York's architecture and atmosphere in popular culture."
      - subtitle: "The Excelsior State"
        text: "This nickname comes from New York's state motto <i>Excelsior</i>, a Latin phrase meaning ever upward. The legislature adopted the motto in 1778, and it appears on the state seal and flag. Excelsior reflects ideals of progress and ambition. While less commonly used than Empire State, the Excelsior State nickname appears in historical references and official contexts."
      - subtitle: "The Knickerbocker State"
        text: "Washington Irving created the fictional Dutch historian Diedrich Knickerbocker for his 1809 book <i>A History of New York from the Beginning of the World to the End of the Dutch Dynasty</i>. Irving promoted the book by circulating newspaper stories about the historian's disappearance. The name Knickerbocker became associated with New York's early Dutch settlers and later with New Yorkers in general. The term eventually influenced local culture and sports, including the name of the New York Knicks basketball team."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The New York nickname and motto both reference upward movement and growth: Empire State suggests influence and power, while Excelsior means ever upward."
      - "The Empire State Building was named after New York's nickname when it opened in 1931."
      - "New York was originally known as New Amsterdam during Dutch control in the 1600s."
      - "Washington Irving contributed two enduring New York nicknames through his writing: Gotham and Knickerbocker."
      - "John J. Fitz Gerald popularized the Big Apple nickname through his horse racing columns in the 1920s."
      - "The name New York was adopted in 1664 in honor of the Duke of York."

faq:
  - question: "What is New York nickname?"
    answer: "New York nickname is the Empire State. The name dates back to 1785, when George Washington referred to New York as the Seat of the Empire."

  - question: "What is the New York nickname Big Apple?"
    answer: "The Big Apple is a nickname for New York City. It was popularized in the 1920s by sports writer John J. Fitz Gerald."

  - question: "What is the origin of New York nickname Big Apple?"
    answer: "The Big Apple nickname originated around 1920 when stable hands used the phrase to describe New York racetracks with major prizes."

  - question: "What is Gotham New York nickname?"
    answer: "Gotham is a nickname for New York City that originated in Washington Irving's 1807 satirical writing."

  - question: "Why is New York called the Empire State?"
    answer: "New York is called the Empire State because of its strategic location, economic growth, and the phrase used by George Washington in 1785."

  - question: "What is the New York nickname and motto?"
    answer: "The New York nickname is the Empire State, and the state motto is Excelsior, meaning ever upward."

