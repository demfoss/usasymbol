type: surnames
state: New York
state_slug: new-york
population: 19378102
data_year: 2010

seo:
  title: "Most Common Surnames in New York"
  description: "The most common surnames in New York are Williams, Johnson, and Rodriguez, a ranking shaped by Black New York, Puerto Rican migration, Ellis Island immigration, and the state's long role as a global port."

page:
  h1: "Most Common Surnames in New York"
  intro: "Williams, Johnson, and Rodriguez were New York's three most common surnames in 2010, and Smith ranked only 61st statewide. That ranking tells you immediately that New York's surname history is not just colonial English: it reflects Black New York, Puerto Rican migration after 1917 and especially after World War II, and the immigrant gateway created by New York Harbor and Ellis Island."
  heritage_title: "Dutch Beginnings, Ellis Island, and the Puerto Rican Century"
  heritage_body: "New York's surname map starts with Dutch New Netherland in the early 17th century, then changes sharply with the Ellis Island era, when more than 12 million immigrants were processed between 1892 and 1924. After the Jones Act of 1917 and the Balzac decision of 1922 confirmed free movement to the mainland, New York City became the main destination for Puerto Rican migrants, helping push Rodriguez, Rivera, Perez, Torres, and Hernandez high into the statewide ranks. The same gateway role also explains why names such as Lee, Kim, Wong, Chan, Singh, and Patel are far more visible in New York than in most states."
  fun_fact: "Smith is the most common surname nationally, but in New York it ranks only 61st."

surnames:
  - rank: 1
    name: Williams
    count: 92658
    ratio: 224
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic personal name Willahelm. Williams ranks first in New York because it sits at the overlap of older British settlement and large Black communities in New York City, Buffalo, Rochester, and Yonkers."

  - rank: 2
    name: Johnson
    count: 81717
    ratio: 254
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew Yohanan, meaning God is gracious. Johnson has the same broad reach as Williams across both long-settled Anglo-American families and Black New Yorkers, which keeps it near the very top statewide."

  - rank: 3
    name: Rodriguez
    count: 75775
    ratio: 274
    origin: spanish
    type: Patronymic
    meaning: "Son of Rodrigo, a Germanic personal name usually interpreted as famous ruler. Rodriguez ranks unusually high in New York because Puerto Rican and Dominican communities became central to the state's population, especially in New York City."

  - rank: 4
    name: Jones
    count: 66641
    ratio: 311
    origin: welsh
    type: Patronymic
    meaning: "A Welsh surname meaning son of John. Jones is one of the classic broad-base American surnames that remained common through every New York migration wave, from the Hudson Valley to the modern metropolis."

  - rank: 5
    name: Miller
    count: 60616
    ratio: 342
    origin: english
    type: Occupational
    meaning: "An occupational surname for a grain miller. In New York, Miller reflects both older English usage and the large German-speaking immigration that entered the state in the 19th century."

  - rank: 6
    name: Lee
    count: 56202
    ratio: 369
    origin: english
    type: Habitational
    meaning: "In English, Lee comes from Old English 'leah', a clearing or meadow, but in New York it also represents major Chinese and Korean surname lines. That overlap helps explain why Lee ranks so high in the country's most globally connected state."

  - rank: 7
    name: Rivera
    count: 54729
    ratio: 379
    origin: spanish
    type: Habitational
    meaning: "A Spanish place-name surname meaning riverbank or streamside. Rivera's prominence in New York tracks the state's long Puerto Rican presence, especially in New York City and the Hudson Valley cities tied to postwar migration."

  - rank: 8
    name: Davis
    count: 53145
    ratio: 390
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from the Hebrew name Dawid, meaning beloved. Davis remained highly visible in New York because it belongs to the durable British surname layer while also being well established in Black urban communities."

  - rank: 9
    name: Gonzalez
    count: 43964
    ratio: 472
    origin: spanish
    type: Patronymic
    meaning: "Son of Gonzalo, from a medieval Iberian personal name. Gonzalez rose in New York with the broader growth of Latino communities, especially in the late 20th century."

  - rank: 10
    name: Martinez
    count: 42927
    ratio: 483
    origin: spanish
    type: Patronymic
    meaning: "Son of Martin, from the Latin Martinus. Martinez is a sign that New York's top surnames are no longer dominated by British names alone but by the state's full Hispanic population as well."

  - rank: 11
    name: Garcia
    count: 42367
    ratio: 489
    origin: spanish
    type: Patronymic
    meaning: "A classic Iberian surname often traced to an old personal name of Basque origin. Garcia ranks high in New York because Latino settlement is spread across the city and well beyond it, not confined to one borough or one decade."

  - rank: 12
    name: Perez
    count: 41508
    ratio: 500
    origin: spanish
    type: Patronymic
    meaning: "Son of Pedro, the Spanish form of Peter. Perez is especially associated with New York's Puerto Rican and Dominican communities, which made Spanish patronymics a core part of the state's surname profile."

  - rank: 13
    name: Wilson
    count: 37761
    ratio: 549
    origin: english
    type: Patronymic
    meaning: "Son of Will, a short form of William. Wilson belongs to New York's older British surname base and remains common across both upstate counties and the state's largest cities."

  - rank: 14
    name: White
    count: 37230
    ratio: 557
    origin: english
    type: Descriptive
    meaning: "Originally a nickname from Old English 'hwit' for someone with fair hair or complexion. White stayed common in New York because it arrived early and remained distributed across many regions rather than being tied to one immigrant stream."

  - rank: 15
    name: Lewis
    count: 36377
    ratio: 570
    origin: welsh
    type: Patronymic
    meaning: "Usually derived from the given name Louis or Lewis, ultimately from the Germanic Hludwig. Lewis persists near the top in New York because it crosses several surname traditions at once, including British, Jewish, and Black American usage."

  - rank: 16
    name: Torres
    count: 35949
    ratio: 577
    origin: spanish
    type: Habitational
    meaning: "A Spanish place-name surname referring to someone who lived near a tower. Torres rose with the same Puerto Rican and wider Latino migration that elevated Rivera, Rodriguez, and Perez."

  - rank: 17
    name: Hernandez
    count: 35156
    ratio: 590
    origin: spanish
    type: Patronymic
    meaning: "Son of Hernando or Fernando, from the Germanic name Ferdinand. Hernandez is another marker of how strongly Hispanic migration reshaped New York's statewide surname rankings."

  - rank: 18
    name: Jackson
    count: 33916
    ratio: 611
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval diminutive of John. Jackson has long been prominent in Black New York, especially in New York City, which helps keep it in the statewide top 20."

  - rank: 19
    name: Martin
    count: 33153
    ratio: 625
    origin: french
    type: Patronymic
    meaning: "From the personal name Martin, from Latin Martinus, meaning of Mars. Martin fits New York's layered history because it appears in older French and English lines as well as in Hispanic naming traditions."

  - rank: 20
    name: Anderson
    count: 32600
    ratio: 636
    origin: scottish
    type: Patronymic
    meaning: "Son of Anders or Andrew, from Greek Andreas. Anderson reflects the northern European immigration that entered New York through its ports and spread into both the city and upstate industrial counties."

unique_surnames:
  - name: Cohen
    state_rank: 44
    national_rank: 247
    origin: hebrew
    why: "Cohen is far more visible in New York than nationally because New York became the country's largest center of Jewish immigration and settlement, first through Lower Manhattan and later through Brooklyn, Queens, Long Island, and the northern suburbs."

  - name: Goldstein
    state_rank: 127
    national_rank: 848
    origin: german
    why: "Goldstein is strongly overrepresented in New York for the same reason as Cohen: the state absorbed a huge share of eastern European Jewish immigration in the Ellis Island era, and many families stayed in the metropolitan region."

  - name: Wong
    state_rank: 49
    national_rank: 237
    origin: chinese
    why: "Wong ranks high because New York City built one of the nation's largest Chinese populations, with major communities in Manhattan Chinatown, Sunset Park, and Queens by 2010."

  - name: Chan
    state_rank: 51
    national_rank: 376
    origin: chinese
    why: "Chan is more common in New York than in the country as a whole because Cantonese and later broader Chinese migration made the surname especially visible in the city's long-established Chinese neighborhoods."

  - name: Singh
    state_rank: 33
    national_rank: 273
    origin: indian
    why: "Singh stands out because New York, especially Queens, became a major South Asian destination. Its high state rank reflects Sikh, Punjabi, and wider Indian and Indo-Caribbean migration into the city."

etymology_groups:
  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate New York's top surnames. Williams, Johnson, Rodriguez, Jones, Davis, Gonzalez, Martinez, Perez, Wilson, Lewis, Hernandez, Jackson, and Anderson all descend from personal names, showing how British and Spanish naming systems shaped the state most strongly."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Rodriguez (son of Rodrigo)
      - Hernandez (son of Hernando)

  - type: Spanish-Language Names
    icon: fa-solid fa-map-location-dot
    description: "Eight of New York's top 20 surnames are plainly Spanish-language names: Rodriguez, Rivera, Gonzalez, Martinez, Garcia, Perez, Torres, and Hernandez. That concentration reflects Puerto Rican migration to New York City after 1917 and especially after World War II, followed by later Dominican and broader Latino growth."
    examples:
      - Rivera (riverbank)
      - Garcia (from an old Iberian personal name)
      - Perez (son of Pedro)
      - Torres (near a tower)

  - type: Gateway-City Names
    icon: fa-solid fa-ship
    description: "New York's role as the country's biggest port of entry left a wider surname mix than most states. Lee reaches the top 10, while Cohen, Wong, Chan, Kim, Singh, and Patel all rank unusually high because the state absorbed large Jewish, Chinese, Korean, and South Asian populations through New York City."
    examples:
      - Lee (clearing; also Chinese and Korean surname traditions)
      - Cohen (priest)
      - Wong (Chinese surname)
      - Singh (lion)

faq:
  - question: "Why are Rodriguez and Rivera so common in New York?"
    answer: "Rodriguez and Rivera rank high in New York because the state, and especially New York City, became the main mainland destination for Puerto Rican migrants in the 20th century. Later Dominican and broader Latino migration reinforced the same Spanish-language surname layer."

  - question: "Why isn't Smith the most common last name in New York?"
    answer: "Smith is only 61st in New York because the state's population is unusually diverse. Large Black, Hispanic, Jewish, Chinese, Korean, and South Asian communities lifted many other surnames above the national standard leader."

