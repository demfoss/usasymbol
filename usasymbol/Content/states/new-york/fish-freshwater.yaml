- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Adopted in 1975 by the New York Legislature.
  - Its scientific name is Salvelinus fontinalis.
  - The New York record brook trout weighed 6 pounds, 3 ounces and measured 22 inches.
  - That record fish was caught in the Adirondacks in July 2025.
  - Some Adirondack waters hold native heritage strains, which are local types of brook trout that developed in their own watersheds.
faq:
- question: What is New York's state fish?
  answer: New York's state freshwater fish is the brook trout. The state saltwater fish is the striped bass.
- question: When did New York adopt the Brook trout?
  answer: The New York Legislature made the brook trout the state fish in 1975.
- question: Why did New York choose the Brook trout?
  answer: State law does not give a detailed reason. The brook trout is native to New York and has long been popular with anglers in the Adirondacks.
- question: What does a brook trout look like?
  answer: It is dark brown to green with light wavy markings on its back. Its belly and lower fins are often reddish.
- question: Where do brook trout live in New York?
  answer: Most live in cold mountain streams and ponds. The largest numbers are in the Adirondack Mountains.
