intro_text: New York's state freshwater fish is the brook trout, a colorful native trout of cold mountain streams and ponds, adopted in 1975. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of New York?
  paragraphs:
  - The brook trout is New York's official state freshwater fish. State lawmakers first made it the state fish in 1975. Its scientific name is Salvelinus fontinalis.
  - State law also calls it the speckled trout. New York's state saltwater fish is the striped bass.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout is dark brown to green, with a marbled pattern of lighter wavy lines on its back. Its belly and lower fins are often reddish.
  - Anglers also call it the brookie or speckled trout because of the small spots along its sides.
  - It needs cool, clean water and does best in shaded streams that stay around 50 degrees.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - The New York Legislature made the brook trout the state fish in 1975.
  - In 2006, lawmakers named the striped bass the state saltwater fish. That same year, state law named the brook trout the official freshwater fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why New York Chose the Brook Trout
  paragraphs:
  - State law names the brook trout without giving a detailed reason.
  - The brook trout is native to New York's cold waters, and it has long been a favorite of anglers in the Adirondacks.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Brook trout used to live all over New York. Today most of them live in small streams and the headwaters of larger streams in the mountains.
  - The Adirondack Mountains are their stronghold. In the United States, brook trout that live in ponds are very rare outside of New York and Maine.
