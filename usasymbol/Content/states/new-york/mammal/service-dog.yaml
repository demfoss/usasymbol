title: "New York State Dog | Working Dog"
scientific_name: "Canis lupus familiaris"
adopted_year: 2015

seo_title: "New York State Dog | Working Dog"
seo_description: "New York's state dog is the Working Dog, adopted in 2015. Learn why this official New York symbol was chosen and what it represents."

intro_text: "The Working Dog is the official New York state dog, designated in 2015. This page gives the direct answer for searches like 'new york state dog', 'new york state animal', and 'new york state mammal' while explaining how the symbol fits the state's official animal designations. Symbolizing service, loyalty, courage, and the heroic work of dogs who responded to 9/11; honoring all dogs trained to serve and protect. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Working Dog"
