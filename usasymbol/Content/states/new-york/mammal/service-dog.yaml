faq:
  - question: "What is New York's state dog?"
    answer: "New York's state dog is the working dog (Canis lupus familiaris), designated as the official state dog on December 23, 2015. Unlike other states that chose specific breeds, New York honors any dog trained for service work."
  
  - question: "When was the working dog designated as New York's state dog?"
    answer: "The working dog became New York's official state dog on December 23, 2015, when Governor Andrew Cuomo signed the legislation. The law is codified in New York State Law Section 90."
  
  - question: "Why did New York choose the working dog as its state dog?"
    answer: "New York chose the working dog to honor all dogs trained to serve, inspired especially by over 300 dogs that worked at Ground Zero after the September 11, 2001 terrorist attacks. Assemblyman Matthew Titone sponsored the legislation after watching his therapy dog Bari help children with autism. The designation recognizes guide dogs, police K-9s, search and rescue dogs, therapy dogs, war dogs, detection dogs, and all canines that perform service work. It sends a clear signal that New York honors and pays tribute to working dogs."
  
  - question: "What types of dogs qualify as New York's state dog?"
    answer: "The designation applies to any dog trained for service work, regardless of breed. This includes guide dogs for the blind, police work dogs, war dogs, hearing dogs, service dogs for people with disabilities, working search dogs, therapy dogs, detection dogs (explosives, narcotics), and farm dogs trained to herd or protect livestock."
  
  - question: "Does New York have specific breed requirements for its state dog?"
    answer: "No. New York is unique among states with official dogs because it chose a category rather than a specific breed. Any breed or mixed breed trained to perform service work qualifies as New York's state dog."
  
  - question: "How many dogs worked at Ground Zero after 9/11?"
    answer: "An estimated 300 specially trained dogs worked at Ground Zero after the September 11, 2001 attacks. These included search and rescue dogs, cadaver dogs, and therapy dogs. They worked 12-hour shifts searching for survivors, recovering remains, and providing emotional support to rescue workers."
  
  - question: "Are working dogs protected by New York law?"
    answer: "Yes. New York has strong legal protections for working dogs. Harming a service animal is a felony under New York State law. The Americans with Disabilities Act and New York regulations require businesses to allow service dogs in all public places. Law enforcement gives special recognition to police K-9s injured or killed in the line of duty."
  
  - question: "Where can I see working dogs in New York?"
    answer: "Working dogs are visible throughout New York. NYPD K-9 units patrol Times Square and transit hubs. Detection dogs work at JFK, LaGuardia, and other airports. Guide dogs accompany visually impaired New Yorkers on streets and subways. Therapy dogs visit hospitals, schools, and nursing homes. The 9/11 Memorial and Museum has exhibits honoring working dogs from Ground Zero."

