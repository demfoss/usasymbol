faq:
  - question: "What is New York's state animal?"
    answer: "New York's state animal is the American beaver (Castor canadensis), designated as the official state mammal on August 11, 1975."
  
  - question: "When was the beaver designated as New York's state animal?"
    answer: "The beaver became New York's official state mammal on August 11, 1975, when Governor Hugh Carey signed the legislation. The law is codified in New York State Consolidated Laws, State Law, Article 6, Section 79."
  
  - question: "Why did New York choose the beaver as its state animal?"
    answer: "New York chose the beaver because the animal literally founded the state's economy. Dutch settlers established Fort Orange (Albany) in 1624 specifically to trade beaver pelts, and the surrounding village was named Beverwijck (Beaver District) in 1652. The fur trade drove European colonization of New York, with 80,000 beavers harvested annually from the Hudson River region between 1630 and 1640. The beaver represents both New York's commercial origins and a remarkable conservation success story, recovering from near-extinction by 1900 to thriving populations today."
  
  - question: "Where can I see beavers in New York?"
    answer: "Your best chances to see beavers are in the Adirondacks, where 50,000-75,000 beavers inhabit lakes, ponds, and streams throughout the six-million-acre park. Beavers are primarily nocturnal, so dawn and dusk offer optimal viewing along quiet waterways. The Bronx River in New York City provides urban beaver viewing, marking the species' return after a 200-year absence. Harriman State Park, Catskill streams, and Finger Lakes region waters also support beaver populations."
  
  - question: "Does New York have other official state mammals?"
    answer: "No, the American beaver is New York's only official state mammal."
  
  - question: "Is the beaver on New York's flag or seal?"
    answer: "The beaver appears on New York City's seal and flag, where it has been featured continuously since 1654. Two beavers are positioned between windmill sails, representing the fur trade that built the city's economy. The beaver does not appear on New York State's seal or flag, though it is the official state mammal."
  
  - question: "Are beavers endangered in New York?"
    answer: "No, beavers are not endangered in New York. The population is stable and healthy, with 50,000-75,000 beavers in the Adirondacks alone. This represents a remarkable conservation success, as beavers were nearly extinct in New York by 1900, with only one colony remaining in 1903. Regulated trapping seasons now help manage populations at sustainable levels."
  
  - question: "How many beavers live in New York?"
    answer: "New York supports robust beaver populations throughout the state. The Adirondacks alone contain an estimated 50,000-75,000 beavers. Healthy populations also exist in the Catskills, Finger Lakes region, Hudson Valley, and beavers have recently recolonized New York City waterways after a 200-year absence."

