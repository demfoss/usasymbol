title: "New York State Animal | American Beaver"
scientific_name: "Castor canadensis"
adopted_year: 1975

seo_title: "New York State Animal | American Beaver"
seo_description: "New York's state animal is the American Beaver, adopted in 1975. Learn why this official New York symbol was chosen and what it represents."

intro_text: "The American Beaver is the official New York state animal, designated in 1975. This page gives the direct answer for searches like 'new york state animal', 'new york state animal', and 'new york state mammal' while explaining how the symbol fits the state's official animal designations. Symbolizing New York's fur trade heritage and its role in founding Albany and New Amsterdam; nature's ecosystem engineers."

common_name: "American Beaver"
official_since: "1975"
status: "Stable (population recovered from near-extinction)"
habitat_in_state: "Lakes, ponds, rivers, and streams statewide; strongest populations in Adirondacks, Catskills, and recently returning to New York City waterways"
known_for: "Symbolizing New York's fur trade heritage and its role in founding Albany and New Amsterdam; nature's ecosystem engineers"

size: "3 to 3.5 feet in length"
weight: "30 to 60 pounds (average 40-45 pounds in New York)"
coloration: "Glossy chestnut-brown guard hairs over dense gray-brown underfur"
distinctive_traits: "Broad, flat, scaly black tail; orange-colored incisors strengthened with iron; webbed hind feet; transparent eyelids for underwater vision"

habitat: "Rivers, streams, lakes, ponds, and wetlands with accessible trees along shorelines"
range_in_state: "Statewide distribution; 50,000-75,000 in Adirondacks; recovering populations in Catskills, Finger Lakes, and Hudson Valley; recent return to New York City after 200-year absence"
conservation_status: "Population stable and healthy; regulated trapping season manages numbers; estimated 10-15 million across North America (10% of pre-colonial population)"
where_to_find: "Adirondack waterways, Catskill streams, Finger Lakes region, Hudson River tributaries, Bronx River in NYC, Central Park vicinity, Harriman State Park"
symbol_connections: "Featured on New York City's seal since 1654 representing fur trade economy; connects to Albany's original name 'Beverwijck' (Beaver District); appears on New Netherland coat of arms; links to Dutch colonial heritage"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    paragraphs:
      - "Governor Hugh Carey signed legislation designating the American beaver as New York's official state animal on August 11, 1975. The law is codified in New York State Consolidated Laws, State Law, Article 6, Section 79."
      - "The designation occurred six years after Oregon named the beaver its state animal in 1969. Oregon officials and citizens protested New York's choice, with Governor Bob Straub declaring the beaver belonged to Oregon because of the state's heavier rainfall and more suitable habitat."
    
    subsections:
      - subtitle: "Oregon's Lighthearted Protest"
        text: "Oregon's reaction to New York's beaver designation was swift and colorful. Governor Straub suggested New York should adopt the muskrat instead, while State Treasurer Jim Redden called it the most outrageous thing eastern influences had inflicted on country folk. House Republican leader Roger Martin noted that everybody knew the beaver was why the West was won, since many New Yorkers left in the early 1800s specifically to trap beaver out west. Senate President Jason Boe claimed he was pelted with letters from citizens raising their tails in protest. New York legislators remained unmoved by these objections."
      
      - subtitle: "Why New York Chose the Beaver"
        text: "New York selected the beaver because the animal literally founded the state's economy and drove European colonization of the region. The Dutch West India Company established New Netherland in the 1620s primarily to exploit beaver fur, not to build settlements. Fort Orange, founded in 1624 near present-day Albany, existed solely as a beaver trading post where Dutch merchants exchanged European goods for pelts from Mohawk and Mahican trappers. The village surrounding Fort Orange was even named Beverwijck, meaning Beaver District, in 1652. Between 1630 and 1640, approximately 80,000 beavers per year were harvested from the Hudson River and western New York regions."

  - id: "state-symbolism"
    icon: "fa-circle-dollar"
    title: "What the Beaver Represents"
    style: "highlight"
    paragraphs:
      - "The beaver embodies New York's transformation from wilderness to commercial power. Dutch settlers came to North America searching for a short route to Asia but stayed because of the beaver."
      - "For 17th-century Europeans, beaver felt hats represented status and necessity. Russia's beaver populations declined just as French explorers discovered abundant beaver in Canada and Henry Hudson charted the Hudson River in 1609."
      - "The beaver's symbolic importance extends beyond commerce into engineering, persistence, and environmental stewardship. Native Americans called beavers the sacred center of the land because they create habitats supporting countless other species."
    
    subsections:
      - subtitle: "The Fur That Built New York"
        text: "Beaver pelts weren't just valuable—they served as currency in colonial New York. Dutch traders literally valued beaver skins at specific amounts of Holland guilders, making them legal tender alongside wampum beads. The beaver's dense underfur, hidden beneath glossy guard hairs, produced superior felt for European hat manufacturing. Robert Juet, sailing with Henry Hudson on September 18, 1609, wrote of Native Americans bringing beaver and otter skins near Albany, trading them for beads, knives, and hatchets. Johannes de Laet noted in 1625 that the Hudson River supported great traffic in beaver, otter, fox, bear, mink, and wildcat skins."
      
      - subtitle: "From Abundance to Near-Extinction"
        text: "Pre-colonial New York supported an estimated 60 million beavers, possibly exceeding buffalo populations on the Great Plains. Between 1620 and 1630, trappers took more than 10,000 beavers annually just from Connecticut and Massachusetts. The Hudson River and western New York yielded 80,000 beavers yearly between 1630 and 1640. By 1640, beavers had vanished from most of New York except isolated Adirondack populations. These too dwindled until 1903, when only one colony remained northwest of Upper Saranac Lake. The very demand that created New York's wealth nearly eliminated the species that made it possible."
      
      - subtitle: "A Conservation Triumph"
        text: "New York's beaver story demonstrates how protection and reintroduction can reverse ecological collapse. In 1903, the legislature appropriated $500 to restock Adirondack beavers. Fewer than 50 animals were released between 1901 and 1907, and following complete protection, populations expanded rapidly. Extensive aspen and birch stands resulting from early-century Adirondack fires created ideal beaver habitat. By 1924, an estimated 20,000 beavers lived in the Adirondacks, prompting the state to reopen regulated trapping seasons. Today's Adirondack population of 50,000 to 75,000 beavers represents successful wildlife management balancing conservation with human needs."
      
      - subtitle: "The Bronx River Beaver"
        text: "In February 2007, a beaver was spotted in the Bronx River—the first beaver sighting in New York City in over 200 years. Named José by local residents, this individual symbolized both historical loss and ecological recovery. The Wildlife Conservation Society and Bronx River Alliance had spent years restoring the river, reintroducing alewife herring and cleaning decades of accumulated trash. José's arrival proved restoration efforts worked. By 2010, a second beaver appeared, potentially doubling the city's known beaver population. Beavers have since been documented on Staten Island, with sightings in Manhattan and Brooklyn, marking a remarkable urban wildlife comeback."
      
      - subtitle: "The Iroquois Connection"
        text: "Beaver abundance in New York fueled the Beaver Wars of the 1600s, reshaping Native American territories and alliances. By the 1620s, the Iroquois had become dependent on iron implements obtained by trading beaver fur with the Dutch at Fort Nassau (modern Albany). Between 1624 and 1628, the Iroquois drove out their Mahican neighbors to become the sole Hudson River valley people able to trade with the Dutch. When beaver populations declined in the valley, the Iroquois pushed westward through Mohawk country, creating decades of conflict with the Huron, Miami, Illinois, Ottawa, and Susquenhannock nations over access to beaver-rich territories."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify American Beavers"
    
    subsections:
      - subtitle: "Physical Description"
        text: "The beaver is North America's largest rodent. Adults grow continuously throughout their lives, though most reach only moderate size."
        list_items:
          - "**Size**: 3 to 3.5 feet long; occasional individuals reach 4.5 feet"
          - "**Weight**: 30-60 pounds typically; New York adults average 40-45 pounds; rare specimens reach 90 pounds"
          - "**Tail**: Broad, flat, scaly, black; 9 to 18 inches long; used for swimming, balance, fat storage, and danger signaling"
          - "**Teeth**: Orange incisors strengthened with iron-rich enamel; grow continuously; self-sharpening through constant gnawing"
          - "**Fur**: Dense gray-brown underfur beneath glossy chestnut guard hairs; waterproof when groomed with castoreum oil"
          - "**Feet**: Webbed hind feet for swimming; small forefeet for handling; two innermost hind toenails modified for grooming"
      
      - subtitle: "Behavior and Engineering"
        text: "Beavers are primarily nocturnal, though occasionally active at dawn and dusk. They're famous ecosystem engineers, fundamentally altering landscapes through dam and lodge construction. A beaver family can fell trees up to 6 feet in diameter, though they prefer aspen, birch, willow, poplar, and maple trees 2-6 inches wide. Dams average 100-200 feet long and 5-7 feet high, though some Adirondack structures measure over 2,000 feet. Lodges are conical mounds of branches, mud, and stones, typically 12-14 feet wide at the base with 5-6 feet protruding above water. Multiple underwater entrances lead to a central chamber lined with shredded wood bedding, positioned safely above water level."

  - id: "in-the-state"
    icon: "fa-map-location-dot"
    title: "Beavers Across New York"
    paragraphs:
      - "Beavers inhabit every region of New York State except areas without suitable water and trees. The Adirondacks support the densest populations, estimated at 50,000 to 75,000 individuals."
      - "Populations have rebounded dramatically from near-extinction. The species now thrives in the Catskills, Finger Lakes region, Hudson Valley, and has recently recolonized New York City waterways after a 200-year absence."
    
    facts:
      - "**Adirondacks**: 50,000-75,000 beavers; descended from Lake Superior stock introduced 1907-1924"
      - "**Hudson Valley**: Growing populations along tributaries; historical center of 17th-century fur trade"
      - "**New York City**: Returned to Bronx River 2007; now present on Staten Island with sightings in Manhattan and Brooklyn"
      - "**Catskills**: Healthy populations in mountain streams; important watershed habitat creators"
      - "**Finger Lakes**: Widespread distribution; descendants of Southern Tier populations"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Beavers"
    paragraphs:
      - "Beavers are primarily nocturnal, making daytime sightings challenging. Dawn and dusk offer the best viewing opportunities along quiet waterways with fresh gnaw marks on shoreline trees."
    
    list_items:
      - "**Adirondack Park Waterways**: Numerous lakes, ponds, and streams throughout the six-million-acre park provide excellent beaver habitat. Look for lodges along shorelines and dam structures across streams. Best viewing at dawn or dusk."
      - "**Bronx River (New York City)**: Site of the city's first beaver in 200 years. The river corridor near the Bronx Zoo and through parkland offers urban beaver viewing opportunities. Rangers occasionally lead beaver walks."
      - "**Harriman State Park**: Reintroduction site from the 1920s when three breeding pairs were released. Numerous lakes and streams support multiple beaver colonies. Popular with wildlife watchers."
      - "**Finger Lakes Region**: Beaver activity visible along inlet and outlet streams of major lakes. Extensive wetland creation benefits multiple species. Check state wildlife management areas."
      - "**Catskill Park Streams**: Mountain streams and beaver meadows throughout the park. Look for characteristic beaver ponds creating wetland habitats in forested valleys."

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Current Status and Management"
    paragraphs:
      - "The beaver population in New York is stable and healthy. Statewide populations have recovered from near-extinction to sustainable levels requiring active management."
      - "Regulated trapping seasons help maintain populations at levels compatible with human land use. Dam removal requires permits from the Department of Environmental Conservation, recognizing beavers' ecological importance."
    
    subsections:
      - subtitle: "Management in New York"
        text: "The New York State Department of Environmental Conservation manages beaver populations through regulated trapping seasons, population monitoring, and conflict mitigation programs. Annual aerial surveys track colony numbers, consistently showing population increases. Declining interest in trapping has made population management challenging, as regulated harvest remains the most effective control available. The DEC promotes coexistence strategies including tree protection, flow devices for managing water levels at dams, and public education about beaver ecology. Beavers are recognized as keystone species whose wetland creation benefits countless other species including fish, amphibians, waterfowl, and mammals."
      
      - subtitle: "Ecological Importance"
        text: "Scientists increasingly view beavers as partners in watershed restoration and climate resilience. Beaver wetlands increase habitat diversity, support species unable to thrive in fast-moving streams, store water during droughts, mitigate floods, and purify water through silt removal. Recent research highlights beaver dams' role in carbon storage and groundwater recharge. The same engineering behaviors that occasionally flood roads and properties also create ecosystem benefits worth millions in flood control and water quality improvements. Modern management focuses on coexistence where possible, using flow devices and exclusion techniques rather than widespread removal."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    paragraphs:
      - "The beaver connects to New York's civic identity through heraldry dating to Dutch colonial times. The animal appears on New York City's seal continuously since 1654, placed between windmill sails and flour barrels representing early commerce."
      - "Albany, New York's capital, was originally named Beverwijck (Beaver District) in 1652, directly referencing the fur trade that justified the settlement's existence. The city's early seals featured beavers prominently, linking municipal identity to economic origins."
    
    subsections:
      - subtitle: "On New York City's Seal and Flag"
        text: "New York City's official seal features two beavers arranged between the arms of a windmill, a design element present since the 1686 seal approved under the Dongan Charter. The beaver came from the seal of New Netherland, where it symbolized the fur trade forming the basis of the colony's economy. The current seal, designed in 1915 by sculptor Paul Manship, maintains this tradition. A proposal for New Amsterdam's coat of arms in 1630 featured even more prominent beavers as supporters—heraldic figures flanking the shield—though this design was rejected as too outlandish for official heraldry."
        link:
          label: "See New York City seal"
          url: "https://www.nyc.gov/site/dcas/about/green-book-city-seal-and-flag.page"
      
      - subtitle: "Beverwijck: The Beaver District"
        text: "In 1652, Dutch officials named the village growing around Fort Orange as Beverwijck, literally meaning Beaver District or Beaver Town. This name acknowledged that beaver trade was the settlement's entire purpose. When the English captured New Netherland in 1664, they renamed Beverwijck as Albany in honor of the Duke of York and Albany (later James II). The city's early seals under English rule continued featuring beavers, with one version from the 1730s-1740s showing a beaver at center above the letters ALB. Even after American independence, Albany maintained beaver imagery in civic symbols, recognizing the animal's role in founding the capital city."
      
      - subtitle: "State Motto and Industry"
        text: "New York's state motto, 'Excelsior' (Ever Upward), adopted in 1778, reflects the same industrious spirit embodied by beavers. The beaver's relentless work ethic, cooperation within family groups, and ability to accomplish seemingly impossible tasks mirror the qualities New Yorkers value. The phrase busy as a beaver entered American English specifically because of these rodents' tireless dam and lodge construction. Their waste-not-want-not philosophy and engineering ingenuity made them natural symbols for a state built on commerce, innovation, and persistence."
        link:
          label: "See New York state motto"
          url: "/states/new-york/motto/excelsior"

