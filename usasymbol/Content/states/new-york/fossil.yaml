faq:
- question: What is New York's state fossil?
  answer: "New York's state fossil is the sea scorpion (Eurypterus remipes), a swimming predatory arthropod from the Silurian period, designated in 1984."
- question: When did New York adopt its state fossil?
  answer: "New York adopted the sea scorpion (Eurypterus remipes) as its state fossil in 1984."
- question: What did the sea scorpion look like?
  answer: "Eurypterus remipes was a flat, segmented arthropod typically 5 to 8 inches long, with six pairs of appendages including broad paddle-like rear limbs for swimming. It looked somewhat like a cross between a horseshoe crab and a scorpion."
- question: Where are sea scorpion fossils found in New York?
  answer: "Most fossils come from the Bertie Formation in western New York, particularly in Erie, Niagara, and Monroe counties. The Williamsville area near Buffalo is a classic locality. The New York State Museum in Albany holds a major collection."
- question: When did the sea scorpion live?
  answer: "Eurypterus remipes lived during the Late Silurian, roughly 432 to 419 million years ago, in the shallow, partially enclosed sea that covered what is now western New York."
- question: Who pushed to make it the state fossil?
  answer: "New York designated the sea scorpion in 1984, reflecting the state's long paleontological history with the species. Eurypterus remipes had been known from New York specimens since 1825, and the state's Bertie Formation is the world's primary source of these fossils."

