- id: facts
  icon: fa-solid fa-lightbulb
  title: Sea Scorpion Facts
  facts:
  - "New York designated Eurypterus remipes its state fossil in 1984. The species was first described from New York specimens in 1825."
- "Eurypterus remipes is probably the most abundantly preserved eurypterid in the fossil record, and most of its known specimens come from New York."
- "The hind pair of appendages were broad, flat paddles used for swimming, giving the genus the name Eurypterus, meaning 'broad wing.'"
- "Many Bertie Formation slabs preserve dozens of individuals together, likely the shed exoskeletons of molting animals rather than mass deaths."
- "Eurypterids are more closely related to horseshoe crabs and scorpions than to true lobsters or crabs, despite their superficial resemblance to both."

