title: "Excelsior"
language: "Latin"
english_translation: "Ever Upward"
adopted_year: 1778

author: "USA Symbol Team"
date_published: "2025-12-03"
date_modified: "2026-03-27"
seo_title: "New York State Motto: Excelsior – Meaning, History & Adoption"
seo_description: "New York's motto was designed while British forces occupied New York City. Henry Wadsworth Longfellow's 1842 poem 'Excelsior' — inspired by the New York state seal — appeared in 272 newspapers and made the word famous nationwide. Stan Lee used 'Excelsior' as his Marvel Comics sign-off. New York added a second official motto in 2020."

intro_text: "New York's state motto is <strong>Excelsior</strong> — Latin for <em>Ever Upward</em>. The word was adopted on March 16, 1778, as part of the coat of arms designed by a committee led by John Jay at age 32, while British forces occupied New York City. Henry Wadsworth Longfellow's 1842 poem 'Excelsior' — inspired by seeing the word on the New York state seal — appeared in 272 newspapers and made the motto one of the most recognized words in 19th-century American culture. Stan Lee used 'Excelsior' as his signature sign-off in Marvel Comics columns. In 2020, New York added a second official motto: 'E Pluribus Unum' (Out of Many, One)."

sections:
  - id: "designed-under-occupation"
    icon: "fa-solid fa-landmark"
    title: "Designed While British Forces Occupied New York City"
    paragraphs:
      - "British forces captured New York City in September 1776 and held it until November 1783 — for the entire Revolutionary War. Yet New York's coat of arms was designed during this occupation, in 1777, by a committee of patriots working in upstate areas the British did not control. John Jay chaired the committee at age 32, already serving as Chief Justice of the New York Supreme Court since May 1777. John Sloss Hobart and Gouverneur Morris collaborated with him."
      - "The committee worked through summer and fall of 1777, completing the design in December. The legislature formally adopted it on March 16, 1778. The motto 'Excelsior' appears on a white banner below a shield depicting Hudson River commerce — ships sailing between mountains — while Liberty stands on the left treading on a crown (rejecting monarchy) and Justice stands on the right with sword and scales."
      - "Jay, Hobart, and Morris had all worked on New York's 1777 state constitution. No records explain who specifically suggested 'Excelsior' as the motto. The single Latin word — comparatival form of 'excelsus' meaning high or elevated — expressed aspiration through the minimum of words."

  - id: "longfellow-poem-272-newspapers"
    icon: "fa-solid fa-newspaper"
    title: "The Poem That Made the Motto Famous: 272 Newspapers"
    paragraphs:
      - "In January 1842, Henry Wadsworth Longfellow published the poem 'Excelsior.' He later said he had been inspired by seeing the word on a scrap of New York newspaper that included the state seal. The poem tells the story of a young man climbing an Alpine pass in the Alps, carrying a banner reading 'Excelsior' and ignoring warnings from locals. Despite a voice crying 'Beware the pine-tree's withered branch! / Beware the awful avalanche!' the young man presses upward. He is found dead in the snow, still holding the banner, still looking toward the stars."
      - "The poem became one of the most widely reproduced poems of the 19th century. It appeared in 272 newspapers. It was set to music, performed at concerts, recited in schools. The word 'Excelsior' entered popular American vocabulary not as a state motto but as a cultural shorthand for aspirational striving — the pursuit of ever-higher goals regardless of cost."
      - "Longfellow's poem spread New York's motto far beyond New York. Businesses across the country adopted the name 'Excelsior' to suggest excellence. The word appeared on product labels, hotel names, and civic organization titles. Many Americans knew 'Excelsior' through Longfellow rather than through any knowledge of New York's state seal."

  - id: "stan-lee-and-second-motto"
    icon: "fa-solid fa-star"
    title: "Stan Lee's Sign-Off and New York's Second Motto"
    paragraphs:
      - "Stan Lee, the Marvel Comics creator who was born and based in New York, used 'Excelsior' as his signature sign-off in his 'Stan's Soapbox' columns beginning in the 1960s. Lee said he chose the word for its aspirational energy. After his death in 2018, the phrase became even more closely associated with his memory. Marvel characters frequently use it in reference to Lee. The word now carries dual associations: New York's civic motto and a creator's farewell."
      - "In 2020, New York added a second official motto. Governor Andrew Cuomo signed legislation making 'E Pluribus Unum' — 'Out of Many, One' — an official secondary motto of New York. The phrase already appears on the U.S. Great Seal and is the informal national motto. New York's 2020 adoption placed it on the state motto banner alongside 'Excelsior.' Both appear on the state seal."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "New York State Motto Facts"
    style: "gradient"
    facts:
      - "John Jay designed the coat of arms at age 32, while serving as state Chief Justice, during the British occupation of New York City."
      - "New York adopted 'Excelsior' on March 16, 1778."
      - "Henry Wadsworth Longfellow's 1842 poem 'Excelsior' appeared in 272 newspapers, making the word nationally famous."
      - "Stan Lee used 'Excelsior' as his signature sign-off in Marvel Comics columns."
      - "New York added 'E Pluribus Unum' as a second official motto in 2020."
      - "New York ratified the U.S. Constitution on July 26, 1788, becoming the 11th state."

faq:
  - question: "What is New York's state motto?"
    answer: "New York's primary state motto is 'Excelsior,' a Latin word meaning 'Ever Upward.' It was adopted on March 16, 1778. New York also added a second official motto, 'E Pluribus Unum' (Out of Many, One), in 2020."

  - question: "What does 'Excelsior' mean?"
    answer: "'Ever Upward' — from the Latin 'excelsus' meaning high or elevated, in comparative form. It conveys continuous aspiration toward higher goals. New York sources consistently use 'Ever Upward' as the official translation."

  - question: "Why is 'Excelsior' such a famous word?"
    answer: "Henry Wadsworth Longfellow's 1842 poem 'Excelsior' — inspired by seeing the New York state seal — appeared in 272 newspapers and became one of the most widely reproduced poems of the 19th century. The word entered American popular culture as a symbol of aspirational striving. Stan Lee later adopted 'Excelsior' as his signature sign-off in Marvel Comics columns."

  - question: "What language is New York's motto written in?"
    answer: "Latin. 'Excelsior' is a comparative adjective from classical Latin, derived from 'excelsus' (high, elevated). It was adopted in 1778 during the Revolutionary War period when Latin was the prestige language for state symbols."

  - question: "Does New York have more than one official motto?"
    answer: "Yes. New York's primary motto 'Excelsior' has been official since 1778. In 2020, Governor Andrew Cuomo signed legislation making 'E Pluribus Unum' (Out of Many, One) a second official motto. Both appear on the current state seal."

  - question: "Where does New York's motto appear?"
    answer: "On the state coat of arms (on a white banner below the shield, with Liberty and Justice as flanking figures), on the state seal, on the state flag (a blue field with the coat of arms centered, adopted in its current form in 1901), and on New York state license plates."

