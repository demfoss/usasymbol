seo_title: "New York State Motto | Excelsior"
seo_description: "New York's state motto is \"Excelsior,\" Latin for \"Ever Upward.\" Adopted March 16, 1778, it later inspired Henry Wadsworth Longfellow's 1842 poem."

intro_text: "New York's state motto is <strong>Excelsior</strong>, a Latin word meaning <em>Ever Upward</em>. It was adopted on March 16, 1778, as part of the state coat of arms designed by a committee that included John Jay and Gouverneur Morris — while British forces still occupied New York City. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

