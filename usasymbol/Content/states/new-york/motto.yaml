faq:
  - question: "What is New York's state motto?"
    answer: "New York's state motto is \"Excelsior,\" a Latin word meaning \"Ever Upward.\" It was adopted on March 16, 1778, as part of the state coat of arms."

  - question: "What does \"Excelsior\" mean in English?"
    answer: "\"Excelsior\" is Latin for \"Ever Upward\" or \"Higher.\" It is the comparative form of excelsus, meaning high or elevated. New York's official translation is \"Ever Upward.\""

  - question: "When did New York adopt its state motto?"
    answer: "The New York legislature adopted \"Excelsior\" on March 16, 1778, as part of the state coat of arms designed by a committee that included John Jay and Gouverneur Morris."

  - question: "Does New York have a second state motto?"
    answer: "Yes. In April 2020, New York officially added \"E Pluribus Unum\" (Out of Many, One) as a second motto through the 2021 state budget signed by Governor Andrew Cuomo. Excelsior remains the primary motto."

  - question: "What is the connection between \"Excelsior\" and Henry Wadsworth Longfellow?"
    answer: "In January 1842, Longfellow published a poem titled \"Excelsior\" after seeing the word on a scrap of newspaper carrying the New York state seal. The poem describes a young man climbing upward through hardship, repeating the word as his rallying cry. It became one of Longfellow's most widely read works."

