hero_image_caption: The striped bass, New York's state saltwater fish, returns to the Hudson River each spring.
intro_text: New York's state saltwater fish is the striped bass, a big striped game fish of the Hudson River and Long Island waters, adopted in 2006. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of New York?
  paragraphs:
  - The striped bass became New York's official saltwater fish in 2006. It is also called the state marine fish. Its scientific name is Morone saxatilis.
  - New York's state freshwater fish is the brook trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Striped Bass
  paragraphs:
  - The striped bass is easy to spot because of the dark stripes that run lengthwise along its body. These stripes give it nicknames like striper and linesider. Some people also call it rockfish.
  - It is a large fish. Stripers often grow longer than three feet and can weigh more than 30 pounds. Some live for 30 years or more.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - State lawmakers named the striped bass New York's official saltwater fish in 2006. The state already had a state fish, the brook trout, so the striped bass became a second fish symbol for the state's ocean and tidal waters.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why New York Chose the Striped Bass
  paragraphs:
  - Official sources name the striped bass without giving a detailed reason. Biologists do call it an important fish for the Hudson River, and it is one of the river's top game fish.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Striped Bass
  paragraphs:
  - Striped bass live in the tidal part of the Hudson River and in coastal waters around Long Island for part of each year.
  - Adults spend most of their lives in the Atlantic Ocean. Each spring they swim up the Hudson River to spawn in fresh water. Young stripers grow up in the river's tidal waters, including around New York City.
