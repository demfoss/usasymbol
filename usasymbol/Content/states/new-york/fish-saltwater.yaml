- id: facts
  icon: fa-solid fa-lightbulb
  title: Striped Bass Facts
  facts:
  - Adopted in 2006 by the New York Legislature.
  - Scientific name is Morone saxatilis.
  - Often grows longer than three feet and heavier than 30 pounds.
  - Can live 30 years or more.
  - Lives in the ocean but swims into fresh water to spawn.
faq:
- question: What is New York's state fish?
  answer: New York has two state fish. The striped bass is the state saltwater fish and the brook trout is the state freshwater fish.
- question: When did New York adopt the striped bass?
  answer: New York lawmakers named the striped bass the official state saltwater fish in 2006.
- question: Why did New York choose the striped bass?
  answer: Official sources do not give a detailed reason. The striped bass is a well-known fish in the Hudson River and the coastal waters around Long Island.
- question: Why is the striped bass called a striper?
  answer: It has dark stripes running lengthwise from head to tail. That is where the nicknames striper and linesider come from.
- question: Does the striped bass live in fresh water or salt water?
  answer: Both. Adults live mostly in the ocean, and each spring they swim up the Hudson River to spawn in fresh water.
