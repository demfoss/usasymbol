seo_title: New York State Saltwater Fish | Striped Bass
seo_description: The New York state saltwater fish is the striped bass, adopted in 2006. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/new-york/new-york-fish-saltwater-hero.webp
