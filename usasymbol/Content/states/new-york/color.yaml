faq:
  - question: "What are the official colors of New York State?"
    answer: "The official state colors of New York are Blue and Gold, derived from the state flag and coat of arms adopted in 1778. These colors are formally specified in the Empire State Development New York State Brand Guidelines as Dark Blue (HEX #002D72) and Gold."
  - question: "What is the HEX code for New York Blue?"
    answer: "The official HEX code for New York Dark Blue is #002D72, corresponding to Pantone PMS 288 C, as specified in the 2015 Empire State Development New York State Brand Guidelines."
  - question: "What is the HEX code for New York Gold?"
    answer: "The standard HEX code for New York Gold is #FFD200, corresponding to Pantone PMS 109 C. Gold appears in the state coat of arms and flag heraldic details."
  - question: "Does New York have an official state color law?"
    answer: "New York does not have a standalone statute designating specific state colors in the manner of states like California or Oregon. The blue and gold identity derives from State Law § 70 governing the state flag, and from the Empire State Development Brand Guidelines which specify the official color values."
  - question: "What does the blue field on the New York state flag represent?"
    answer: "The blue field represents the sky and the defining waterways of New York, including the Hudson River, New York Harbor, and the Great Lakes. Blue has anchored New York's official visual identity since the adoption of the state coat of arms in 1778."

