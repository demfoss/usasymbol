sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "New York does not define its state colors through a specific standalone statute in the way some other states do. The blue and gold identity derives from the state flag, first formally adopted in 1778 when the state coat of arms was established, and confirmed in its modern form in 1882 and 1896. The current state flag — a blue field charged with the state coat of arms in the center — has defined New York's official color identity for over a century. The Empire State Development New York State Brand Guidelines, published in 2015, formalize the color specifications used across state government, designating Dark Blue (HEX #002D72) as the primary color alongside gold and light blue accents."
      - "The consistency of blue and gold in New York's official presentation across the state flag, state seal, and government communications has established these colors as the de facto official palette. State Law § 70 governs the design of the state flag and thereby implicitly anchors blue as the defining state color. Gold appears in the heraldic details of the coat of arms — the eagle, the rising sun, and the landscape of the Hudson Highlands — and in official ceremonial contexts throughout state government."
    subsections:
      - subtitle: "The 1778 Coat of Arms and Flag Origins"
        text: "New York's coat of arms was formally adopted on March 16, 1778, during the American Revolution. The design features two female figures flanking a central shield: Liberty, holding a staff topped with a Phrygian cap, and Justice, blindfolded and holding scales. An eagle crowns the shield, and the motto Excelsior — meaning 'Ever Upward' — appears below. The blue field of the flag was established to display this coat of arms, and the gold heraldic details have remained a constant element of New York's official visual identity from the founding era through the modern brand guidelines."
      - subtitle: "Empire State Development Brand Guidelines"
        text: "The Empire State Development New York State Brand Guidelines (2015) specify HEX #002D72 as the primary Dark Blue for all official state communications. A secondary Light Blue (HEX #0077C8, PMS 285 C) and Gold are also defined. These specifications represent the only official digital color standards New York has published, and they are used by state agencies, tourism communications, and official government materials. Unlike states such as California or Oregon where specific color values are encoded in statute, New York's color specifications exist at the brand governance level rather than the legislative level."
  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Blue and gold in New York carry layers of meaning rooted in both the natural geography and the civic ambition of the state. Blue speaks to the defining role of water in New York's identity — the Hudson River cutting through the Catskills and Highlands, the expansive harbor that made New York City the gateway to America, and the Great Lakes that define the state's western border. Gold represents the ambition and commercial enterprise that transformed New York into the Empire State, from the Erie Canal era of the 1820s through the rise of Wall Street as the financial center of the world."
    subsections:
      - subtitle: "Blue: Water, Sky, and New York's Geographic Identity"
        text: "New York's geography is defined by water. The Hudson River provided the arterial pathway for settlement and commerce from the earliest Dutch colonization in the 1620s. New York Harbor became the principal entry point for millions of immigrants between the 1820s and the 1920s. The Erie Canal, completed in 1825, linked the Hudson River to the Great Lakes, establishing New York City as the commercial capital of North America within a decade of its opening. The deep navy blue of the state's official palette reflects these defining waterways and the expansive sky over the Adirondacks, Catskills, and the Finger Lakes."
      - subtitle: "Gold: The Empire State's Civic Ambition"
        text: "Gold in New York's official palette traces directly to the heraldic tradition of the 1778 coat of arms, where the rising sun over the Hudson Highlands symbolizes New York's emergence as a leading state at the founding of the republic. The state's nickname — the Empire State — was in common use by the early 19th century and reflects the gold-hued aspiration that gold embodies in New York's iconography. The motto Excelsior, meaning 'Ever Upward,' reinforces this association between gold and the relentless civic and commercial ambition that has defined New York's character since the American founding."
  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Blue and gold define the New York state flag's visual identity in full. The flag consists of a blue field charged with the state coat of arms, which presents the gold eagle, the landscape, and the gold details of the allegorical figures of Liberty and Justice. The state seal, which appears at the center of the flag, was adopted in 1778 and has been refined several times, most recently in 1882, with gold heraldic elements consistent throughout. Blue and gold appear in Empire State Development tourism branding, state agency signage, official government publications, and the insignia of the New York National Guard. The New York State Police and numerous state commissions use the blue and gold palette in their official seals and uniforms."

