sections:
  - id: "official-designation"
    title: "History of New York State Colors"
    style: "default"
    paragraphs:
      - "New York does not define its colors by a standalone statute. Blue and gold come from the state coat of arms, adopted in 1778, and the state flag, adopted in 1889."
      - "They are formally specified today in the Empire State Development Brand Guidelines."
  - id: "symbolism"
    title: "What New York State Colors Mean"
    style: "highlight"
    paragraphs:
      - "Dark navy blue represents New York's sky and waters. Gold stands for the richness and civic aspiration shown in the coat of arms."
  - id: "state-emblems"
    title: "Where New York Colors Appear"
    style: "default"
    paragraphs:
      - "Blue and gold appear on the New York state flag. They also run through state government branding handled by Empire State Development and through state agency materials."
