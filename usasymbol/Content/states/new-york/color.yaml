title: "Official and Traditional Colors of New York"
state: "New York"
adopted_year: 1889

seo_title: "New York State Colors: Official HEX Codes & Meaning"
seo_description: "New York state colors are Blue and Gold, derived from the state coat of arms and the 1889 state flag. Find HEX, RGB, CMYK, and Pantone codes plus history and meaning."

intro_text: "The official state colors of New York are **Blue** and **Gold**, derived from the state coat of arms and [the New York state flag](/states/new-york/flag/new-york-state-flag) adopted in 1889. New York does not define its colors by standalone statute, but they are formally specified in the Empire State Development Brand Guidelines and appear throughout official state branding. Designers and students can find the exact HEX and RGB codes below for accurate digital and print reproduction, as part of the broader [U.S. state colors reference](/symbols/colors)."

official_colors: "Blue and Gold"
official_since: "1889 (state flag adoption; formalized in NYS Brand Guidelines)"
primary_use: "State flag, state government branding via Empire State Development, state agency materials"
known_for: "Dark navy blue representing New York's sky and waters; gold representing the richness and civic aspiration symbolized in the state coat of arms adopted in 1778"

