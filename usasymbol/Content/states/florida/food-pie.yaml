sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Florida's State Pie?"
    paragraphs:
      - "Key lime pie is Florida's official state pie, designated by the Florida Legislature in 2006. It is a custard pie made with the juice of small Key limes in a graham cracker crust."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Key Lime Pie"
    paragraphs:
      - "Key lime pie combines Key lime juice, egg yolks, and sweetened condensed milk baked into a graham cracker crust, often topped with whipped cream or meringue. Key limes are smaller, more tart, and more aromatic than the common Persian limes sold in most grocery stores."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Key Lime Pie Became Florida's State Pie"
    paragraphs:
      - "The Florida Legislature designated Key lime pie the official state pie in 2006, formally recognizing a dessert already closely tied to the Florida Keys."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Florida Chose Key Lime Pie"
    paragraphs:
      - "Key limes were once grown widely in the Florida Keys, and the pie became a signature dish of Key West kitchens by the early 1900s, well before refrigerated shipping made other citrus common statewide. The choice reflects that regional food history."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Key Lime Pie Comes From in Florida"
    paragraphs:
      - "Key lime pie is most closely associated with Key West, in the Florida Keys, where Key limes were historically grown and where the pie is a well-known local specialty."
    sites:
      - name: Key West
        city: Key West
        lat: 24.5551
