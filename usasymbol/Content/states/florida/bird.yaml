seo_title: 'Florida State Bird: Northern Mockingbird'
seo_description: Florida adopted the Northern Mockingbird in 1927 — bypassing its own tropical wildlife. Learn why the state chose a backyard bird over flamingos and spoonbills.
intro_text: 'Florida''s official state bird is the <strong>Northern Mockingbird</strong>, adopted in <strong>1927</strong> through <strong>Senate Concurrent Resolution No. 3</strong>. The timing is early and the legal form is a resolution rather than a codified statute. What makes the choice worth examining is what Florida passed over: flamingos, roseate spoonbills, pelicans — distinctive wildlife the state already had — and it picked the mockingbird anyway.'
