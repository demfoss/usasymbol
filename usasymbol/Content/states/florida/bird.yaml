title: Northern Mockingbird
scientific_name: Mimus polyglottos
adopted_year: 1927
legislation: Senate Concurrent Resolution No. 3 (1927)
meaning: 'Florida''s 1927 choice of the mockingbird over its own tropical wildlife says something specific: the state wanted to look like a settled, ordinary American place, not an exotic destination.'
