lyrics_verses:
  - |-
    Way down upon the Suwannee River,
    Far, far away,
    There's where my heart is turning ever,
    There's where the old folks stay.

    All up and down the whole creation,
    Sadly I roam,
    Still longing for my childhood station,
    And for the old folks at home.
  - |-
    All the world is sad and dreary
    Everywhere I roam.
    O dear ones, how my heart grows weary,
    Far from the old folks at home.
  - |-
    All around the little farm I wandered,
    When I was young;
    Then many happy days I squandered,
    Many the songs I sung.
    When I was playing with my brother,
    Happy was I.
    Oh, take me to my kind old mother,
    There let me live and die.
  - |-
    One little hut among the bushes,
    One that I love.
    Still sadly to my memory rushes,
    No matter where I rove.
    When will I see the bees a humming,
    All around the comb?
    When shall I hear the banjo strumming,
    Down in my good old home.
lyrics_note: "The 1851 original describes a narrator far from home longing for the Suwannee River and the people he left behind, written in the dialect style common to minstrel songs of the period. Florida's current official version uses lyrics revised in 2008 by the Stephen Foster Memorial at the University of Pittsburgh, which removed the outdated dialect and racial content while keeping the river imagery and melody, so no single version of the text is reproduced here."
