faq:
  - question: What is Florida's state song?
    answer: "Florida's official state song is \"Old Folks at Home,\" adopted in 1935 with lyrics revised in 2008."
  - question: Who wrote Florida's state song?
    answer: "Stephen Foster wrote the music and original words in 1851."
  - question: When did Florida adopt "Old Folks at Home" as its state song?
    answer: "Florida adopted the song in 1935 and updated its lyrics in 2008."
  - question: Is the Suwannee River in "Old Folks at Home" a real Florida river?
    answer: "Yes. The Suwannee River flows through north Florida, though Foster had never seen it when he wrote the song."

