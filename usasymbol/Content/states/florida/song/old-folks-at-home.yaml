sections:
  - id: overview
    icon: fa-solid fa-music
    title: Florida State Song
    paragraphs:
      - "\"Old Folks at Home\" is Florida's official state song, adopted in 1935 with music and original words by Stephen Foster. Florida kept the song but revised its lyrics in 2008, updating a piece written 84 years before the state was even asked to adopt anything."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Old Folks at Home\" Explained"
    paragraphs:
      - "The song is a slow, sentimental ballad sung from the perspective of someone far from home, longing for the river and the people he left behind. Foster wrote it as a minstrel-style number for E. P. Christy's performing troupe, and its melody became one of the most recognized tunes in nineteenth-century American music."
      - "Foster picked the Suwannee River almost by accident. He wanted a two-syllable Southern river name to fit the meter, checked an atlas, and shortened Suwannee to \"Swanee\" for the lyric, having never actually seen the river himself."
      - "The song has been recorded by artists ranging from opera singers to jazz bands over the past century and a half, and it remains one of the most performed Foster compositions."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Old Folks at Home" Represents Florida
    paragraphs:
      - "Florida adopted the song because it names an actual Florida landmark, the Suwannee River, giving the state a rare case of a song about a specific, real place within its borders. Few other state songs of the era pointed to one identifiable river."
      - "By the 1930s the melody was already famous nationwide, which made it an easy symbol for lawmakers to attach to the state. The lyrics later became a source of public discomfort, prompting the 2008 revision rather than an outright replacement."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Old Folks at Home\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Old Folks at Home" Became Florida's State Song
    paragraphs:
      - "The Florida Legislature adopted \"Old Folks at Home\" as the state song in 1935, 84 years after Foster wrote it. By 2008, the original dialect lyrics were widely viewed as outdated and offensive, so lawmakers commissioned the Stephen Foster Memorial at the University of Pittsburgh to revise the words while keeping the melody and river reference, and adopted a companion state anthem, \"Florida (Where the Sawgrass Meets the Sky),\" the same year."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Florida

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Old Folks at Home\" Facts"
    facts:
      - "Florida adopted \"Old Folks at Home\" as its official state song in 1935."
      - "Stephen Foster wrote the song in 1851 without ever having visited the Suwannee River."
      - "The lyrics were officially revised in 2008 to remove outdated dialect."
      - "Florida named a companion state anthem, \"Florida (Where the Sawgrass Meets the Sky),\" the same year the lyrics were revised."
      - "The Suwannee River, named in the song, flows through north Florida into the Gulf of Mexico."

