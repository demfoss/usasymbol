sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Florida's State Fruit?"
    paragraphs:
      - "The orange is Florida's official state fruit, designated by the Florida Legislature in 2005. Florida has long been one of the top citrus-producing regions in the United States."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Orange"
    paragraphs:
      - "Oranges are round citrus fruits with a thick orange rind and juicy segmented flesh. Florida's warm, humid climate and sandy soil are well suited to growing citrus, and the state's oranges are used for both fresh eating and juice."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Orange Became Florida's State Fruit"
    paragraphs:
      - "The Florida Legislature designated the orange the official state fruit in 2005."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Florida Chose the Orange"
    paragraphs:
      - "Florida's citrus industry, centered in regions like the Indian River area and central Florida's Ridge, has made the orange central to the state's agricultural economy and its identity since the late 1800s."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Orange Comes From in Florida"
    paragraphs:
      - "Central Florida's citrus belt, including the historic Ridge region around Lake Wales, and the Indian River area along the Atlantic coast are among the state's best-known orange growing regions."
    sites:
      - name: Lake Wales Ridge
        city: Lake Wales
        lat: 27.90
        lng: -81.59
        note: "Historic center of Florida citrus growing"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Orange Facts"
    facts:
      - "Adopted as Florida's state fruit in 2005."
      - "Florida has grown citrus commercially since the late 1800s."
      - "Central Florida's Ridge region is a historic citrus growing area."

