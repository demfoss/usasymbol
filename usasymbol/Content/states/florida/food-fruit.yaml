    answer: "Florida's state fruit is the orange, adopted by the Florida Legislature in 2005."
  - question: "When did Florida adopt the orange as its state fruit?"
    answer: "The Florida Legislature designated the orange the official state fruit in 2005."
  - question: "Why did Florida choose the orange?"
    answer: "Florida's citrus industry has been central to its agricultural economy since the late 1800s, making the orange a natural choice for state fruit."
