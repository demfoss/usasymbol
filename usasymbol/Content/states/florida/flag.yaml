- id: previous-versions
  icon: fa-solid fa-flag
  title: Florida's Flags From Statehood to 1985
  versions:
  - name: Moseley Flag
    years: '1845'
    image: versions/moseley-1845.webp
    description: Unofficial flag with five horizontal stripes and a 'Let us alone' ribbon, flown at Governor Moseley's inauguration. Never officially adopted.
  - name: Lone Star Flag
    years: '1861'
    image: versions/lone-star-1861.webp
    description: Unofficial flag raised by Colonel William H. Chase at the Pensacola Navy Yard in early 1861. Thirteen red and white stripes with a single white star on a blue canton.
  - name: Secession Flag
    years: '1861'
    image: versions/secession-1861.webp
    description: Unofficial secession flag presented to Governor Madison S. Perry and displayed at the Capitol during the signing of the Ordinance of Secession.
  - name: Civil War State Flag
    years: 1861–1865
    image: versions/state-1861.webp
    description: Florida's first official state flag, adopted following secession. The design was recorded from a written description; it is unknown whether the flag was ever physically flown.
  - name: Seal on White
    years: 1868–1900
    image: versions/state-1868.webp
    description: "Florida's post-Civil War state flag: state seal on a plain white field, as directed by the 1868 Constitutional Convention. The all-white field prompted the 1900 redesign. The seal at this stage already contained the cocoa palm, mountains, and headdress that would persist until 1985."
  - name: Red Cross Flag
    years: 1900–1985
    image: versions/red-cross-1900.webp
    description: Red saltire added to white field with the 1868 seal. Adopted after voter approval on November 6, 1900, by 5,088 to 3,819. The seal's errors — cocoa palm, mountains, headdress — remained throughout this period.
  - name: Current Flag
    years: 1985–present
    image: versions/modern-1985.webp
    description: 'Corrected seal: sabal palmetto replacing cocoa palm, mountains removed, Seminole headdress removed. Commissioned by Governor Bob Graham, executed by artist John Locastro. Officially adopted May 21, 1985.'
- id: facts
  icon: fa-solid fa-lightbulb
  title: Quick Facts
  facts:
  - The red saltire was added in 1900 because the all-white flag looked like a surrender banner
  - Governor Francis P. Fleming, who proposed the cross, was a former Confederate officer
  - 'The 1900 design was approved by popular vote: 5,088 to 3,819'
  - Florida's seal showed a cocoa palm — not native to Florida — from 1868 to 1985
  - The original seal showed mountains despite Florida being one of the flattest states in the country
  - The 1985 revision was executed by artist John Locastro, commissioned by Governor Bob Graham
  - The flag is one of three U.S. state flags featuring the motto In God We Trust
  - Florida statute does not specify exact color values for any element of the flag
  - Ranked 34th among all North American flags in the 2001 NAVA design survey
