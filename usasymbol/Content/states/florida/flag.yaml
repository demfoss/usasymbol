faq:
- question: Why does Florida's flag have a red cross?
  answer: The red saltire was added in 1900 because Florida's previous flag — a state seal on a plain white field — looked like a flag of surrender when hanging limp. Governor Francis P. Fleming, a former Confederate officer, proposed the diagonal cross. Florida voters approved the change by 5,088 to 3,819.
- question: Does Florida's flag reference the Confederate battle flag?
  answer: 'Florida statute does not make the connection explicit, but historians note two relevant facts: the diagonal cross added in 1900 visually resembles the Confederate battle flag, and it was proposed by Governor Francis Fleming, a former Confederate officer, during the Jim Crow era. Both the practical reason and the historical context are part of the documented record.'
- question: What is on Florida's state seal?
  answer: The current seal shows a Seminole woman scattering flowers by the shore, a sabal palmetto tree, a steamboat on water, and sun rays, with the motto In God We Trust. The seal was established in 1868 and corrected in 1985 — the original showed a cocoa palm, mountains, and a Seminole headdress, all removed as inaccurate.
- question: Why did Florida's flag change in 1985?
  answer: The state seal was corrected after 117 years of geographic and cultural errors. The 1868 seal showed a cocoa palm (not native to Florida), mountains (Florida has none), and a Seminole woman with a headdress (historically inaccurate). Artist John Locastro fixed all three. The revised flag was officially adopted May 21, 1985.
- question: When was Florida's state flag officially adopted?
  answer: The red saltire design was approved by Florida voters on November 6, 1900. The seal was corrected and the current version adopted on May 21, 1985.
