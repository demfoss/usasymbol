faq:
  - question: "What is Florida's state saltwater mammal?"
    answer: "Florida's state saltwater mammal is the bottlenose dolphin (Tursiops truncatus), designated in 1975. The statute specifies \"porpoise, also commonly known as the dolphin,\" though true porpoises do not inhabit Florida waters."
  
  - question: "When was the bottlenose dolphin designated as Florida's state saltwater mammal?"
    answer: "The bottlenose dolphin became Florida's official state saltwater mammal in 1975 through Chapter 75-75, the same legislation that designated the manatee as state marine mammal."
  
  - question: "Why did Florida designate both a marine mammal and a saltwater mammal?"
    answer: "The 1975 legislature created two categories by designating the manatee as \"state marine mammal\" and the dolphin as \"state saltwater mammal.\" This distinction may have been intended to honor both a threatened species (manatee) and a thriving one (dolphin), or to recognize different habitats (manatees use fresh and saltwater; dolphins are exclusively marine)."
  
  - question: "Are dolphins and porpoises the same animal?"
    answer: "No. Despite Florida's statute using both names, dolphins and porpoises are different animals. Bottlenose dolphins have elongated beaks, conical teeth, curved dorsal fins, and larger bodies (6-12 feet). True porpoises have no beak, spade-shaped teeth, triangular dorsal fins, and smaller bodies (4-6 feet). True porpoises rarely appear in Florida waters. The statute's confusion reflects historical vernacular usage rather than scientific accuracy."
  
  - question: "Where can I see dolphins in Florida?"
    answer: "Dolphins appear throughout Florida's coastline year-round. Prime viewing locations include Shell Island and St. Andrews Bay (Panama City Beach), Marco Island, Naples, the Florida Keys, Indian River Lagoon, Destin-Fort Walton Beach, Tampa Bay, and Miami/Biscayne Bay. Dolphin cruise operators exist in virtually every coastal city. Any boat trip or beach visit may produce dolphin sightings."
  
  - question: "Are Florida dolphins endangered?"
    answer: "No, bottlenose dolphins are not endangered. Florida populations appear stable and healthy. However, dolphins are protected under the Marine Mammal Protection Act of 1972. It is illegal to feed, pursue, touch, or harass dolphins, with penalties up to $100,000 and one year imprisonment."
  
  - question: "How intelligent are bottlenose dolphins?"
    answer: "Bottlenose dolphins are among the most intelligent animals on Earth with brain-to-body mass ratios second only to humans. They demonstrate self-awareness, recognize themselves in mirrors, use tools, develop complex social structures, and communicate using signature whistles that function like individual names. Mothers teach whistles to calves, and dolphins remember these names for decades."
  
  - question: "Can I swim with dolphins in Florida?"
    answer: "Federal law prohibits approaching, touching, or harassing wild dolphins—you must maintain at least 50 yards distance. However, several facilities offer legal dolphin encounters in controlled settings, including Miami Seaquarium, Marineland St. Augustine, Dolphin Plus in Key Largo, and Gulfarium in Fort Walton Beach. These encounters allow swimming with or touching dolphins under professional supervision."
  
  - question: "What is the connection between Florida's dolphin and the Miami Dolphins football team?"
    answer: "The Miami Dolphins NFL team adopted the name in 1966, nine years before Florida's 1975 state designation. The team name reflected South Florida's coastal identity and dolphins' prominence in the region. When Florida designated the dolphin as state saltwater mammal, the symbolism already resonated with Floridians. The team logo reinforced the association between Florida and dolphins in American popular culture."

