faq:
  - question: "What is Florida's state marine mammal?"
    answer: "Florida's state marine mammal is the Florida manatee (Trichechus manatus latirostris), a subspecies of the West Indian manatee. It was designated in 1975 alongside the bottlenose dolphin as state saltwater mammal."
  
  - question: "When was the manatee designated as Florida's state marine mammal?"
    answer: "The manatee became Florida's official state marine mammal in 1975 when the Legislature passed Chapter 75-75, codified as Florida Statute 15.038."
  
  - question: "Why did Florida choose the manatee as its state marine mammal?"
    answer: "Florida chose the manatee to honor the state's springs, rivers, and coastal waters while recognizing the species' vulnerability to human activity. The 1975 designation occurred during America's environmental awakening, just three years after the Marine Mammal Protection Act and two years after the Endangered Species Act. Selecting a threatened species as the state symbol reflected Florida's acknowledgment that conservation and state identity should strengthen each other."
  
  - question: "Where can I see manatees in Florida?"
    answer: "The best places to see manatees in Florida are Crystal River National Wildlife Refuge (particularly Three Sisters Springs), Blue Spring State Park near Orlando, and the TECO Manatee Viewing Center in Apollo Beach. Winter months (November through March) offer the best viewing as cold weather drives hundreds of manatees to warm-water refuges. Crystal River is the only place in Florida where swimming with wild manatees is permitted, though strict passive observation rules apply."
  
  - question: "How many manatees live in Florida?"
    answer: "Florida's manatee population is estimated at 8,350 to 11,730 individuals based on the most recent statewide abundance survey conducted in 2021-2022. The population has grown significantly from fewer than 1,000 manatees in the 1970s, though it faced a major setback during the 2020-2022 starvation event when 1,255 manatees died."
  
  - question: "Are manatees endangered in Florida?"
    answer: "Florida manatees are federally listed as threatened under the Endangered Species Act. They were downlisted from endangered to threatened in 2017, a decision that remains controversial among conservation groups. Despite population growth, manatees face ongoing threats from boat strikes, habitat loss, seagrass decline, and loss of warm-water refuges."
  
  - question: "Can I touch or feed manatees?"
    answer: "No, it is illegal to touch, feed, harass, or disturb manatees in any way under federal law (Marine Mammal Protection Act) and Florida state law (Florida Manatee Sanctuary Act). Violations can result in fines up to $50,000 and one year imprisonment. In areas where swimming with manatees is permitted (Crystal River), visitors must practice passive observation—meaning you can observe but cannot initiate contact, chase, or disturb resting manatees."
  
  - question: "What is the connection between Florida's manatee and other state symbols?"
    answer: "The manatee connects to other Florida symbols through shared dependence on healthy ecosystems. It relies on natural springs where the state tree (sabal palm) grows, creating a physical link through Florida's groundwater system. The manatee designation (1975) contrasts with the orange blossom (1909), which celebrates agricultural development that destroyed manatee habitat. Both the manatee and Florida panther (state animal) face similar threats from development and vehicle collisions, representing Florida's dual conservation challenges on land and water."
  
  - question: "What was the 2020-2022 manatee starvation event?"
    answer: "Between December 2020 and April 2022, Florida experienced the deadliest manatee Unusual Mortality Event in recorded history. A total of 1,255 manatees died from starvation caused by catastrophic seagrass loss in the Indian River Lagoon. Decades of nutrient pollution had fueled algal blooms that smothered seagrass beds, eliminating the manatees' food source. Wildlife officials took the unprecedented step of feeding manatees lettuce to prevent further deaths. The UME officially ended in March 2025 as conditions improved, but seagrass recovery remains incomplete."

