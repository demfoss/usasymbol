sections:
  - id: "official-designation"
    icon: "fa-scroll"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Florida Legislature designated the manatee as the official state marine mammal in 1975 through Chapter 75-75, signed into law as Florida Statute 15.038. The same legislation also named the bottlenose dolphin (often called porpoise in the statute) as Florida's state saltwater mammal, creating a distinction between the two aquatic mammals."
      - "The 1975 designation occurred during America's environmental awakening. Just three years earlier, Congress passed the Marine Mammal Protection Act of 1972. The Endangered Species Act followed in 1973, listing the Florida manatee among the first protected species. Florida's choice to honor the manatee as a state symbol reflected growing recognition that the species faced extinction without immediate protection."
    
    subsections:
      - subtitle: "A Symbol of Florida's Waterways"
        text: "The legislature chose the manatee to represent Florida's distinctive aquatic landscapes—the springs, rivers, estuaries, and coastal waters that define the peninsula. Unlike terrestrial symbols, the manatee embodies Florida's liquid geography. These animals migrate through interconnected waterways from the St. Johns River to the Keys, from Crystal River to the Indian River Lagoon, touching nearly every major water body in the state. Designating the manatee acknowledged that Florida's identity depends as much on water as land."
      
      - subtitle: "From 'Ugly' to Beloved"
        text: "Public perception of manatees transformed dramatically during the 1960s and 1970s. A 1966 St. Petersburg Times article called them \"huge, awkward, ugly, vegetarian sea mammals.\" Early 20th century entrepreneurs exhibited captive manatees as exotic curiosities at facilities like the Florida Alligator Farm in Palm Beach, which operated from 1900 until closing around 1953. By 1975, however, conservation awareness had shifted the narrative. Manatees became gentle giants worthy of protection rather than spectacles for entertainment. The state symbol designation formalized this cultural change, declaring that manatees deserved celebration, not exploitation."
      
      - subtitle: "The Mermaids of Sailors' Tales"
        text: "The scientific order Sirenia—to which manatees belong—takes its name from sirens, the mythical mermaids of Greek legend. Spanish explorers and later sailors reported seeing \"mermaids\" in Florida waters, likely mistaking manatees for half-human sea creatures. The name \"manatee\" probably derives from the Taino word \"manati\" meaning \"big beaver\" or from Latin \"manatus\" meaning \"furnished with hands,\" referring to the flipper's almost hand-like appearance from a distance. Christopher Columbus encountered manatees during his Caribbean voyages, noting they were \"not as beautiful as depicted.\" These legends connect Florida's manatees to centuries of maritime history and exploration."

  - id: "state-symbolism"
    icon: "fa-heart"
    title: "What the Manatee Represents"
    style: "highlight"
    paragraphs:
      - "The Florida manatee represents the state's springs, rivers, and coastal ecosystems—the liquid infrastructure that makes Florida unique. These animals require specific conditions: warm water, abundant seagrass, access to freshwater, and protection from boats. When manatees thrive, it signals that Florida's waterways remain healthy. When they suffer, it reveals deeper environmental problems affecting all who depend on these waters in [the Sunshine State](/states/florida/nickname/the-sunshine-state)."
      - "Manatees embody Florida's paradox. The state celebrates natural beauty while accommodating explosive growth. Over 1 million recreational boats register in Florida as of 2024, more than any other state. Each boat represents both economic vitality and potential harm to wildlife. The manatee designation forces Floridians to confront this tension: can the state sustain both rapid development and the wild creatures that define its character?"
      - "As a state symbol, the manatee demands action rather than passive admiration. Unlike [the mockingbird](/states/florida/bird/northern-mockingbird) (a common bird that thrives near humans) or the orange blossom (celebrating agricultural transformation), the manatee requires Floridians to slow boats, protect springs, reduce pollution, and maintain warm-water refuges. The symbol carries responsibility. Every winter, thousands of manatees depend on human decisions about water quality, boating regulations, and habitat preservation."
    
    subsections:
      - subtitle: "Recent Arrivals? The Little Ice Age Theory"
        text: "New research published in 2024 by University of South Florida anthropologist Thomas Pluckhahn challenges long-held assumptions about manatees in Florida. Archaeological evidence reveals surprisingly few manatee bones at Native American sites throughout Florida compared to Caribbean sites, despite extensive excavations spanning thousands of years. Spanish explorers who documented Florida's wildlife in detail from the 1500s through 1700s rarely mentioned manatees. The research suggests manatees may have become Florida residents relatively recently—perhaps only during the last 200 years. The Little Ice Age (1200s-1800s) brought cooler water temperatures that would have prevented cold-sensitive manatees from thriving in Florida. As industrialization warmed the planet beginning in the late 1800s, water temperatures rose enough to make Florida hospitable year-round. Today's population of 8,000-plus manatees may actually exceed any historical Florida population. This research complicates conservation narratives, suggesting humans created conditions that favor manatees even as human activity threatens them."
      
      - subtitle: "The 2020-2022 Starvation Crisis"
        text: "Between December 2020 and April 2022, Florida manatees experienced the deadliest Unusual Mortality Event (UME) in recorded history. Along Florida's Atlantic coast, 1,255 manatees died from starvation caused by catastrophic seagrass loss in the Indian River Lagoon. For over a decade, nutrient pollution from septic systems, agricultural runoff, and stormwater had fueled harmful algal blooms that blocked sunlight and smothered seagrass beds. The 150-mile lagoon serves as critical winter habitat for manatees migrating along the Atlantic coast. When seagrass disappeared, manatees had nothing to eat. Wildlife officials resorted to feeding manatees lettuce—an unprecedented emergency measure. The UME officially ended in March 2025, but seagrass recovery remains incomplete and fragile. The crisis revealed how completely Florida's manatees depend on healthy waterways and how quickly human-caused pollution can trigger ecological collapse."
      
      - subtitle: "Propeller Scars: Individual Identification"
        text: "Scientists identify individual manatees by their propeller scars—the distinctive patterns of healed wounds left by boat strikes. Nearly every adult Florida manatee carries these scars. Some have survived dozens of boat collisions over their lifetimes. Researchers photograph manatees and catalog scar patterns to track individuals across years and locations. The system works because propeller injuries are so common. This method speaks to a grim reality: boat strikes are so prevalent that scarring has become the defining physical characteristic of the species in Florida waters. The state's most beloved marine mammal is literally marked by human activity."
      
      - subtitle: "Bob Graham and Jimmy Buffett: Conservation Champions"
        text: "In 1981, Florida Governor Bob Graham and singer-songwriter Jimmy Buffett co-founded the Save the Manatee Club, transforming manatee conservation from government responsibility into public movement. Graham served as governor from 1979 to 1987 before representing Florida in the U.S. Senate until 2005. Buffett, whose music celebrated Florida's coastal culture, lent celebrity power and authentic passion to the cause. Together they created the Adopt-A-Manatee program, which funds research, rescue, rehabilitation, public education, and legal advocacy. Buffett narrated public service announcements urging boaters to slow down, recorded educational videos, and performed benefit concerts. The club has grown to 40,000 active members worldwide. Both founders have since passed—Graham died in 2021 at age 100, Buffett in 2023 at age 76—but their organization continues protecting manatees across Florida, the Caribbean, South America, and West Africa."
      
      - subtitle: "Crystal River: The Only Place to Swim with Manatees"
        text: "Crystal River in Citrus County holds unique status as the only location in Florida where swimming with wild manatees is permitted. The designation exists because of Three Sisters Springs and the surrounding Kings Bay system, where hundreds of manatees congregate each winter in 72-degree spring water. In 1983, the U.S. Fish and Wildlife Service established Crystal River National Wildlife Refuge as the only refuge created specifically for Florida manatee protection. Visitors can kayak, paddleboard, or snorkel in designated areas using \"passive observation\"—meaning no touching, chasing, or disturbing resting manatees. The experience draws over 400,000 visitors annually. Between 500 and 1,000 manatees winter in Crystal River, making it the most important warm-water refuge on Florida's Gulf Coast. The delicate balance between tourism and conservation defines Crystal River's identity."
      
      - subtitle: "Power Plants as Accidental Refuges"
        text: "Florida manatees have become dependent on power plant warm-water discharges, creating a conservation dilemma. Coastal power plants discharge heated water from cooling systems, maintaining temperatures above 68 degrees even during cold snaps. Hundreds of manatees now winter at sites like the TECO Manatee Viewing Center in Apollo Beach, Riviera Beach Next Generation Clean Energy Center, and FPL plants throughout the state. This dependency worries scientists: as Florida transitions away from fossil fuels over the next 30 to 40 years, these artificial warm-water sources will disappear. Manatees lack sufficient natural springs to replace power plant refuges. The species faces an uncertain future where the very energy infrastructure supporting human life has become essential to manatee survival, yet climate goals require dismantling that infrastructure."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify Florida Manatees"
    style: "default"
    
    subsections:
      - subtitle: "Physical Appearance"
        text: "Florida manatees are massive, gray, seal-like aquatic mammals with wrinkled skin covered in sparse, coarse hairs. Their large, rounded body tapers to a distinctive paddle-shaped tail that moves up and down (unlike fish that move side to side). Two flippers bear three to four nail-like structures on each. The broad, fleshy snout features stiff whiskers (vibrissae) that help manatees locate and manipulate food. Manatees range from 8 to 13 feet long and typically weigh 800 to 1,200 pounds, though some individuals exceed 3,000 pounds."
        list_items:
          - "**Size**: 8-13 feet long; height varies with body position in water"
          - "**Weight**: 800-1,200 pounds average; up to 3,000+ pounds"
          - "**Color**: Gray to gray-brown; may appear greenish from algae growth"
          - "**Distinctive features**: Paddle-shaped tail, seal-like snout, wrinkled skin, flipper nails, no hind limbs"
      
      - subtitle: "Behavior and Diet"
        text: "Manatees are herbivores that spend six to eight hours daily grazing on seagrass, freshwater vegetation, algae, and other aquatic plants. They consume 10 to 15 percent of their body weight in vegetation each day—up to 150 pounds for large adults. Manatees are slow swimmers, typically traveling 3 to 5 miles per hour. They surface to breathe every few minutes when active, or every 15 to 20 minutes when resting. Manatees can hold their breath for up to 20 minutes. They have no natural predators. These gentle mammals are solitary except during mating and winter aggregations at warm-water sites."
      
      - subtitle: "Cold Sensitivity"
        text: "Florida manatees require water temperatures of 68 degrees Fahrenheit or warmer. When water drops below this threshold for extended periods, manatees suffer cold stress syndrome—a potentially fatal condition affecting the immune system, metabolism, and organ function. Cold stress makes manatees vulnerable to disease and pneumonia. During winter cold snaps, manatees migrate to warm-water refuges: natural springs that maintain 72-74 degree temperatures year-round, or power plant discharge areas. This cold sensitivity explains why manatees evolved in tropical waters and why Florida's warming climate may have enabled their recent population growth."

  - id: "in-the-state"
    icon: "fa-map-marker-alt"
    title: "Florida Manatees Today"
    style: "default"
    
    paragraphs:
      - "Florida hosts the entire U.S. population of West Indian manatees. During winter, the statewide population concentrates at warm-water refuges throughout central and southern Florida. In summer, manatees disperse throughout Florida's coastal and inland waters, with some traveling north along the Atlantic coast to the Carolinas and occasionally Rhode Island, or west along the Gulf coast to Louisiana and Texas."
      - "The most recent statewide abundance survey (2021-2022) estimated Florida's manatee population at 8,350 to 11,730 individuals. The Florida Fish and Wildlife Conservation Commission conducts these surveys every five to six years using aerial photography, statistical modeling, and accounting for diving behavior and water visibility. The wide range reflects inherent uncertainty in counting submerged, mobile animals across Florida's vast aquatic habitats."
    
    facts:
      - "**Population**: 8,350-11,730 individuals (2021-2022 survey)"
      - "**Winter concentration**: Natural springs (Crystal River, Blue Spring, Wakulla Springs) and power plant discharges"
      - "**Summer range**: Throughout Florida; some travel to Carolinas, Louisiana, Texas"
      - "**Legal protection**: Marine Mammal Protection Act (1972), Endangered Species Act (1973), Florida Manatee Sanctuary Act (1978)"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Florida's State Marine Mammal"
    style: "default"
    
    paragraphs:
      - "Winter (November through March) offers the best manatee viewing opportunities as cold weather drives hundreds of animals to warm-water refuges. Natural springs and power plant discharge areas become gathering points where visitors can observe dozens or hundreds of manatees simultaneously. Summer viewing is less reliable as manatees disperse throughout coastal waters."
    
    list_items:
      - "**Crystal River National Wildlife Refuge** (Citrus County): Only refuge created specifically for manatees; Three Sisters Springs boardwalk offers land-based viewing November-March; 500-1,000 manatees winter here; only place where swimming with wild manatees is permitted (with restrictions)"
      - "**Blue Spring State Park** (Orange City, near Orlando): Premier viewing location with half-mile boardwalk along spring run; recorded 729 manatees in winter 2023; crystal-clear 72-degree water allows exceptional visibility; closed to swimming during manatee season (mid-November through March)"
      - "**TECO Manatee Viewing Center** (Apollo Beach near Tampa): Free observation deck overlooking warm-water discharge canal; hundreds of manatees gather during cold weather; visitor center with exhibits; open November-April"
      - "**Homosassa Springs Wildlife State Park** (Citrus County): Natural spring with underwater viewing windows; wild manatees access headwaters during winter; daily educational programs; rehabilitation facility for injured manatees"
      - "**Manatee Lagoon - FPL Eco-Discovery Center** (Riviera Beach/West Palm Beach): Free observation deck at Riviera Beach Next Generation Clean Energy Center; educational exhibits; opened 2016"
      - "**Lee County Manatee Park** (Fort Myers): Hundreds gather at Orange River and FPL discharge canal during winter; parking fee; gates close at sunset"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Conservation Status and Future"
    style: "default"
    paragraphs:
      - "The Florida manatee is federally listed as threatened under the Endangered Species Act. In March 2017, the U.S. Fish and Wildlife Service downlisted the species from endangered to threatened, citing population growth from fewer than 1,000 individuals in the 1970s to over 6,000 by 2016. The decision remains controversial. In January 2025, after completing a five-year review, FWS proposed splitting the West Indian manatee listing into two subspecies: retaining threatened status for the Florida manatee while uplisting the Caribbean Antillean manatee to endangered, a policy shift frequently compared across the [U.S. marine mammals hub](/symbols/marine-mammals)."
      - "Despite population increases, Florida manatees face escalating threats. The 2020-2022 starvation event killed 1,255 manatees in just 16 months. Boat strikes remain the leading known cause of death, with vehicle collisions killing hundreds annually. Habitat loss from coastal development continues. Loss of warm-water refuges from power plant closures looms as a future crisis. Scientists warn that population size alone does not ensure long-term survival without addressing underlying threats to habitat and water quality."
    
    subsections:
      - subtitle: "Boat Strikes: The Persistent Threat"
        text: "Collisions with watercraft cause more documented Florida manatee deaths than any other factor. Boats strike manatees because these animals swim near the surface, move slowly, and frequent shallow coastal areas—exactly where boat traffic concentrates. Propeller blades inflict fatal injuries or leave distinctive scars. Florida has established manatee protection zones with slow speed regulations throughout coastal waters, particularly in known manatee habitats during winter months. The Florida Manatee Sanctuary Act of 1978 gave the Governor and Cabinet authority to designate sanctuaries and speed zones. However, with over 1 million registered boats in Florida, enforcement challenges persist. Education campaigns urge boaters to wear polarized sunglasses to spot submerged manatees and to slow down in designated areas."
      
      - subtitle: "The Indian River Lagoon Crisis"
        text: "The 2020-2022 starvation event centered on the Indian River Lagoon, a 150-mile estuary along Florida's east-central coast. Decades of nutrient pollution from septic systems, lawn fertilizers, agricultural runoff, and urban stormwater fueled massive algal blooms that blocked sunlight and killed seagrass beds. Without seagrass, manatees starved. The crisis triggered unprecedented intervention: wildlife officials fed manatees thousands of pounds of lettuce at provisional feeding sites. Since April 2022, manatee deaths have declined and seagrass has begun recovering in some areas, particularly Mosquito Lagoon. However, restoration remains incomplete and fragile. The fundamental problem—nutrient pollution—continues. Full recovery requires addressing septic system failures, reducing fertilizer use, upgrading wastewater treatment, and restoring natural water flow. The Indian River Lagoon crisis serves as a warning that manatee populations can collapse rapidly when human activities degrade critical habitat."
      
      - subtitle: "Red Tide and Other Threats"
        text: "Harmful algal blooms called red tide (caused by Karenia brevis) produce neurotoxins that kill manatees and other marine life. Red tide blooms occur naturally in the Gulf of Mexico but human nutrient pollution may increase their frequency and severity. Manatees die from inhaling toxic aerosols or ingesting contaminated seagrass. Additional threats include entanglement in fishing gear and crab trap lines, crushing in flood control structures and canal locks, and ingestion of fishing hooks, monofilament line, and plastic debris. Habitat loss from coastal development eliminates seagrass beds, destroys natural springs, and fragments migratory corridors. Climate change poses complex challenges: warmer water may expand habitat but more intense hurricanes threaten seagrass, stronger storm surge erodes coastal vegetation, and sea level rise threatens spring outlets."
      
      - subtitle: "The Power Plant Dilemma"
        text: "Florida's transition away from fossil fuels creates an unexpected conservation challenge. Hundreds of manatees depend on warm-water discharges from coastal power plants as winter refuges. These artificial habitats have supplemented natural springs for decades. As Florida closes coal-fired and fossil fuel plants to meet climate goals, these warm-water sources will disappear by 2050 or sooner. Natural springs cannot accommodate all displaced manatees—many springs already reach capacity during cold snaps. Solutions require identifying and protecting new natural warm-water habitats, restoring springs diminished by groundwater pumping, potentially creating artificial warm-water sources using renewable energy, or accepting that manatee populations may decline as refuges disappear. This dilemma illustrates how deeply manatees have become entangled with human infrastructure and how conservation success in one area (reducing fossil fuels) may create problems in another (protecting wildlife)."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "Florida's manatee designation in 1975 occurred during the same decade as several other conservation-focused symbols. The state named the manatee and bottlenose dolphin (state saltwater mammal) simultaneously in 1975. Seven years later, in 1982, students voted to make the Florida panther the state animal. These designations reflected growing environmental consciousness during the 1970s and early 1980s, when Americans began recognizing that wildlife needed active protection rather than passive appreciation."
      - "The manatee connects to Florida's other symbols through shared dependence on healthy waterways and complicated relationships with human development. Unlike celebratory symbols that honor abundance or economic success, Florida's mammal symbols—panther and manatee—acknowledge species pushed to the brink of extinction by the same growth and development that defines modern Florida, especially near interstate corridors summarized in [States Neighboring States](/rankings/geography/states-neighboring-states)."
    
    subsections:
      - subtitle: "The Sabal Palm and Springs Connection"
        text: "Florida designated the sabal palm as state tree in 1953, twenty-two years before the manatee designation. Sabal palms grow naturally around many of Florida's springs—the first-magnitude spring systems where manatees winter. Palms thrive in the sandy soils and humid conditions near springs and coastal areas where manatees congregate. The connection runs deeper than physical proximity: both symbols represent Florida's distinctive natural features before widespread development. Natural springs maintain constant 72-74 degree temperatures year-round because they draw from the underground Floridan Aquifer. These springs are essential manatee habitat. As groundwater pumping increases to supply Florida's growing population, spring flow diminishes, threatening both the ecosystems sabal palms inhabit and the warm-water refuges manatees require. The symbols are literally linked through underground water."
        link:
          label: "See Florida state tree"
          url: "/states/florida/tree/sabal-palm"
      
      - subtitle: "Orange Blossom: Development and Conservation Tension"
        text: "Florida chose the orange blossom as state flower in 1909, celebrating the citrus industry that transformed Central and South Florida's landscape. The contrast between orange blossom (1909) and manatee (1975) symbols spans 66 years and captures Florida's environmental evolution. The orange blossom honors agricultural and economic development—draining wetlands, clearing native vegetation, and establishing industrial-scale farming. The manatee designation acknowledges costs of that development: habitat loss, water quality degradation, and species pushed toward extinction. Both symbols are accurate and important. Together they tell Florida's complete story: a state built through dramatic landscape transformation, now grappling with whether growth and wildness can coexist. The manatee forces questions the orange blossom avoids: at what cost comes prosperity, and who bears that cost?"
        link:
          label: "See Florida state flower"
          url: "/states/florida/flower/orange-blossom"
      
      - subtitle: "The Florida Panther's Shared Waterways"
        text: "Florida panthers and manatees inhabit different realms—land and water—yet depend on the same underlying ecosystems. Panthers in South Florida hunt white-tailed deer in hardwood hammocks, cypress strands, and pine forests. These terrestrial habitats require healthy water systems: the same rivers, wetlands, and aquifer recharge areas that support manatees. When nutrient pollution degrades water quality, it affects both species through interconnected pathways. Poor water quality kills seagrass (manatee food) and disrupts the wetlands and forests that support deer (panther prey). Both the 1982 panther designation and 1975 manatee designation emerged from student advocacy or environmental consciousness. Both species are protected under federal law. Both face threats primarily from human activity—vehicle collisions, habitat loss, and development pressure. The paired symbols represent Florida's dual ecosystems and dual conservation challenges."
        link:
          label: "See Florida state animal"
          url: "/states/florida/mammal/florida-panther"

