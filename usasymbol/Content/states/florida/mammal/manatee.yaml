title: "Florida State Marine Mammal | Florida Manatee"
scientific_name: "Trichechus manatus latirostris"
adopted_year: 1975

seo_title: "Florida State Marine Mammal | Florida Manatee"
seo_description: "Florida's state marine mammal is the Florida Manatee, adopted in 1975. Learn why this official Florida symbol was chosen and what it represents."

intro_text: "The Florida Manatee is the official Florida state marine mammal, designated in 1975. This page gives the direct answer for searches like 'florida state marine mammal', 'florida state animal', and 'florida state mammal' while explaining how the symbol fits the state's official animal designations. Symbolizing Florida's waterways; 'gentle giants'; only place in U.S. where you can swim with wild manatees (Crystal River)."

common_name: "Florida Manatee (Sea Cow)"
official_since: "1975"
status: "Federally threatened (downlisted from endangered in 2017); population 8,350-11,730"
habitat_in_state: "Coastal waters, rivers, springs, estuaries, bays throughout Florida; winter in warm-water refuges"
known_for: "Symbolizing Florida's waterways; 'gentle giants'; only place in U.S. where you can swim with wild manatees (Crystal River)"

size: "8 to 13 feet in length"
weight: "Adults: 800-1,200 pounds; some exceed 3,000 pounds"
coloration: "Gray to gray-brown; may appear green or brown from algae growing on skin"
distinctive_traits: "Paddle-shaped tail, wrinkled skin with whiskers, seal-like snout, two flippers with 3-4 nails, no hind limbs"

habitat: "Shallow coastal waters, rivers, springs, estuaries; dependent on warm-water refuges (68°F+) in winter"
range_in_state: "Throughout Florida waterways; concentrate in Crystal River, Blue Spring, natural springs, and power plant warm-water discharges in winter"
conservation_status: "Threatened under ESA; population rebounded from endangered status but faces ongoing threats from boat strikes, habitat loss, seagrass decline"
where_to_find: "Crystal River National Wildlife Refuge (Three Sisters Springs), Blue Spring State Park, TECO Manatee Viewing Center (Apollo Beach), Homosassa Springs State Park"
