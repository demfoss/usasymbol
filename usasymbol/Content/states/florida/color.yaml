timeline:
  - year: "1513"
    description: "Juan Ponce de León arrives in Florida on April 2, claiming the territory for Spain under the red Cross of Burgundy battle flag; Spanish colonial rule begins, introducing orange cultivation to the peninsula"
  - year: "1821"
    description: "Florida transferred to the United States under the Adams-Onís Treaty, ending 288 combined years of Spanish rule under the red and white Cross of Burgundy"
  - year: "1845"
    description: "Florida admitted to the Union on March 3 as the 27th state; the original state flag features the state seal on a plain white field"
  - year: "1900"
    description: "Florida voters approve the addition of a red diagonal cross to the state flag in a statewide referendum, embedding the Cross of Burgundy reference and establishing red and white as the flag's defining colors"
  - year: "1967"
    description: "Florida Legislature designates orange juice as the official state beverage, cementing orange as an officially recognized symbol of Florida"
  - year: "2005"
    description: "Orange designated the official state fruit of Florida, completing the formal recognition of orange as a core element of the state's official symbol system"

expert_quote:
  text: "Florida's color tradition is unusually layered — the red and white of the state flag reach back five centuries to the Spanish Empire, while orange speaks to the modern Florida of sunshine, citrus, and tourism that the world recognizes today. No other state's colors span such a breadth of history in a single palette."
  source: "Florida Division of Historical Resources, State Symbols and Emblems Documentation"

faq:
  - question: "What are the official colors of Florida?"
    answer: "The traditional de facto state colors of Florida are Orange, Red, and White. Orange represents the state's citrus industry and sunshine; red and white are derived from the cross of Burgundy on the Florida state flag, referencing the state's Spanish colonial heritage."
  - question: "What is the HEX code for Florida Orange?"
    answer: "The standard HEX code for Florida Orange is #FA4616, corresponding to Pantone PMS 172, representing the warm red-leaning orange of ripe Florida citrus fruit and subtropical sunlight."
  - question: "What is the HEX code for Florida Red?"
    answer: "The standard HEX code for Florida Red is #C01933, corresponding to Pantone PMS 200, derived from the red diagonal cross of Burgundy on the Florida state flag."
  - question: "What is the cross of Burgundy on the Florida flag?"
    answer: "The cross of Burgundy is a red diagonal saltire (X-shaped cross) that was the battle flag of the Spanish Empire. It appears on the Florida state flag as a reference to Florida's nearly 300 years of Spanish colonial rule from 1513 to 1821."
  - question: "Why is orange associated with Florida?"
    answer: "Orange is associated with Florida because the state is the leading producer of oranges and orange juice in the United States. Spanish missionaries introduced orange cultivation to Florida in the 16th century, and by the 20th century Florida's citrus industry had made the orange the state's most globally recognized symbol. The orange is the official state fruit, and orange juice is the official state beverage."
  - question: "Does Florida have official state colors by law?"
    answer: "No. Florida does not have a separate legislative act designating official state colors. Orange, red, and white function as de facto traditional colors derived from the state flag design and the state's dominant citrus and sunshine cultural associations."

