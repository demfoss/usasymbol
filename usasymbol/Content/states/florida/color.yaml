seo_title: "Florida State Colors | Orange Red White"
seo_description: "Florida state colors are Orange, Red, and White, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Florida are **Orange**, **Red**, and **White**, with orange representing Florida's citrus industry and subtropical sun, while red and white derive from the cross of Burgundy on [the Florida state flag](/states/florida/flag/florida-state-flag) adopted in 1900. No separate state-colors law exists, but these three colors function as Florida's informal color tradition across state branding, tourism marketing, and official state imagery. For Florida, the reference table gives practical HEX, RGB, CMYK, and Pantone values for comparison with other [U.S. state colors](/symbols/colors)."

official_colors: "Orange, Red, and White"
official_since: "De facto (based on 1900 state flag and citrus industry association)"
primary_use: "State Flag, state tourism branding, citrus industry identity, University of Florida and Florida State University color traditions"
known_for: "Orange representing Florida's $9 billion citrus industry and subtropical sunshine; red and white derived from the cross of Burgundy on the state flag, referencing Florida's Spanish colonial heritage under the rule of the Spanish Empire"

