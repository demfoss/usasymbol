sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Florida has not passed a separate state-colors law. The three colors — orange, red, and white — have emerged as the state's informal color tradition through distinct but complementary historical processes: red and white through the design of the Florida state flag, and orange through the state's globally dominant citrus industry and its warm subtropical environment. Together, these three colors form a coherent and broadly recognized color palette that represents Florida across government, commerce, tourism, and sports, reinforcing [the Sunshine State nickname](/states/florida/nickname/the-sunshine-state)."
      - "The Florida state flag, governed by Article II, Section 1 of the Florida Constitution and Florida Statutes § 15.012, features a red diagonal cross of Burgundy on a white field with the state seal at center. The flag's design was adopted in its current form in 1900 following a referendum, with the red cross added to the existing plain white flag bearing the state seal. This addition of the red cross was specifically intended to prevent the flag from resembling a flag of surrender when there was no wind — a practical concern that simultaneously embedded a reference to Florida's Spanish colonial heritage into the state's most prominent official symbol and to wording from [the state motto](/states/florida/motto/in-god-we-trust)."
    subsections:
      - subtitle: "The Cross of Burgundy and Spanish Florida"
        text: "The red diagonal cross on the Florida state flag is a direct reference to the Cross of Burgundy, the personal emblem of the House of Habsburg that served as the battle flag of the Spanish Empire from the 16th through 19th centuries. Spain governed Florida under this flag for two distinct periods: from Juan Ponce de León's arrival in 1513 through 1763, when Florida was ceded to Britain in exchange for Havana, and again from 1783 to 1821, when Florida was transferred to the United States under the Adams-Onís Treaty. The total span of Spanish rule — approximately 288 years — exceeds the period of American governance, making the Spanish colonial heritage encoded in the flag's red cross a historically dominant influence on Florida's identity."
      - subtitle: "Orange and the Florida Citrus Industry"
        text: "Orange's association with Florida dates to the Spanish colonial period, when Spanish missionaries and settlers introduced sweet orange trees to the peninsula in the 16th century. By the late 19th century, Florida had become the center of American citrus production, and orange groves defined the landscape of central Florida from Orlando to Lakeland. The Florida citrus industry reached its peak economic dominance in the mid-20th century, and the orange — designated the official state fruit in 2005 — became the single most widely recognized symbol of Florida in national and international perception. The state's official beverage, orange juice, was designated by the Florida Legislature in 1967, further cementing orange as an unofficial but pervasive state color tied to [the orange blossom symbol](/states/florida/flower/orange-blossom)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Florida's orange, red, and white palette reflects the state's unusual dual identity as both a product of Spanish colonial history and a modern American symbol of sunshine, warmth, and natural abundance. No other state's traditional color tradition encompasses such a wide historical arc — from the Spanish Empire's 16th-century battle flag encoded in red and white, to the 20th-century citrus and tourism boom encoded in orange. Together, these three colors form a palette that is simultaneously historically grounded and immediately evocative of the sensory experience of Florida: the orange warmth of a Gulf Coast sunset, the red flash of bougainvillea in a Miami garden, and the white glare of sunlight on a Gulf beach."
    subsections:
      - subtitle: "Orange in Florida History"
        text: "Orange is Florida's most globally recognized color symbol. The state's nickname 'The Sunshine State,' adopted officially in 1970, reinforces orange as a natural color descriptor for Florida's climate and character. Florida produces the vast majority of orange juice consumed in the United States, and 'Florida Orange' has become a recognized color and brand identity in its own right. The University of Florida's official color — adopted in 1906 as orange and blue — further embedded orange into Florida's institutional palette, making it visible on athletic uniforms, merchandise, and campus branding throughout the state's most populated regions. The specific orange used in Florida contexts, PMS 172, is a warm, red-leaning orange that evokes ripe citrus fruit and tropical sunlight; related entries are grouped in [U.S. state colors](/symbols/colors)."
      - subtitle: "Red and White in Florida History"
        text: "Red and white derive their Florida significance from the state flag's cross of Burgundy design, but these colors also resonate through Florida's broader history. The red of the flag's diagonal cross is the same heraldic red used in the Spanish royal standard, and its presence on the Florida flag is one of the few explicit acknowledgments in American state symbolism of Spanish colonial heritage. White, forming the flag's entire background field, connects to Florida's most famous natural asset — its beaches. Florida's white quartz sand beaches, particularly those of the Panhandle region around Destin and Panama City Beach, are consistently ranked among the whitest and finest-grained beaches in the world, and white carries a geographic resonance in Florida that parallels the blue-sky association in other states across border regions listed in [States Neighboring States](/rankings/geography/states-neighboring-states)."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Red and white appear prominently on the Florida state flag, governed by Florida Statutes § 15.012, which flies at the Florida State Capitol in Tallahassee and all state government buildings. The state seal centered on the flag incorporates additional colors including gold, green, and blue through its depiction of a Seminole woman, a sabal palm tree, a steamboat on the water, and a rising sun — but the flag's dominant visual impression is the red cross on white, firmly establishing those two colors as the state's official visual foundation. Orange appears throughout Florida's state branding and tourism identity: the Florida Department of Citrus uses orange extensively in its marketing, the Visit Florida tourism brand incorporates orange prominently, and Florida state highway welcome signs use the iconic orange-on-green color scheme. The University of Florida (orange and blue) and Florida State University (garnet and gold) together cover much of the state's sports and institutional color landscape, with orange appearing in both traditions in different forms."

