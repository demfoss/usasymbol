    why: "Crews is a distinctly North Central Florida surname concentrated in Marion and Levy counties, where Anglo pioneer families with this name settled during the territorial period of the 1830s and established multigenerational roots."

etymology_groups:
  - type: Spanish Patronymics
    icon: fa-solid fa-star
    description: "Florida's large Cuban and Puerto Rican communities pushed Spanish patronymics — Garcia, Martinez, Rodriguez, and Hernandez — into the state's top ten. Miami-Dade County, rebuilt by post-1959 Cuban exiles, and Osceola County, with one of the highest Puerto Rican concentrations in the continental U.S., are the twin engines of this pattern."
    examples:
      - Garcia (young / Basque place name origin)
      - Martinez (son of Martín)
      - Rodriguez (son of Rodrigo)
      - Hernandez (son of Hernando)
      - Suarez (Latinized from suarius, swineherd)

  - type: English Occupational
    icon: fa-solid fa-hammer
    description: "Occupational surnames like Smith and Taylor arrived with Scots-Irish and English settlers moving into North Florida's panhandle during the early territorial period of the 1820s. These families built the first Anglo communities around Pensacola, Tallahassee, and Marianna."
    examples:
      - Smith (metalworker or blacksmith)
      - Taylor (cloth cutter)
      - Mason (stoneworker)
      - Hunter (one who hunts)

  - type: English and Welsh Patronymics
    icon: fa-solid fa-people-group
    description: "Patronymics like Johnson, Williams, Jones, and Davis dominate Florida's top twenty, carried south by Anglo settlers from the Carolinas, Virginia, and Georgia in the early 1800s. Williams and Jackson also reflect the African-American tradition of adopting English patronymics after emancipation in the post-Civil War South."
    examples:
      - Johnson (son of John)
      - Williams (son of William)
      - Jones (son of John — Welsh form)
      - Davis (son of David — Welsh form)
      - Jackson (son of Jack)

faq:
  - question: "What are the most common last names in Florida?"
    answer: "The most common last names in Florida are Smith, Johnson, Williams, Garcia, and Jones. Florida's top ranks mix the usual Southern surnames with Spanish surnames that rose through later migration."

  - question: "Why are Hispanic last names so common in Florida?"
    answer: "Hispanic last names became especially common in Florida through two major migration waves: Cuban settlement in South Florida after 1959 and Puerto Rican growth in the Orlando area from the 1980s onward. That is why Garcia, Martinez, Rodriguez, and Hernandez all rank so high statewide."

  - question: "Why are Cuban last names so common in Florida?"
    answer: "Cuban last names are especially common in Florida because Miami-Dade became the main center of Cuban exile settlement after the 1959 revolution. That concentration helped push surnames like Garcia, Martinez, Suarez, Diaz, and Alvarez far higher in Florida than in much of the rest of the Southeast."

