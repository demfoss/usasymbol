  - name: Alvarez
    state_rank: 48
    national_rank: 200  # UNVERIFIED
    origin: spanish
    why: "Alvarez is concentrated in South Florida's Cuban exile community, particularly in Hialeah and Coral Gables, where waves of immigration after 1959 established tight family networks that persist across generations."

