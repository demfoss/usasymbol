    ratio: 361
    origin: english
    type: Descriptive
    meaning: "From the Old English hwīt, describing someone with fair coloring or white hair. White is distributed across rural North Florida, where English-speaking pioneer families established farms during the 1820s–1840s territorial period."

  - rank: 18
    name: Harris
