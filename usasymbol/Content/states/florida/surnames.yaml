    ratio: 235
    origin: spanish
    type: Patronymic
    meaning: "Means 'son of Martín,' from the Latin Martinus. Martinez is heavily represented in Miami-Dade's Cuban-American community and grew further as Puerto Rican and Mexican families settled the I-4 corridor from the 1980s onward."

  - rank: 8
    name: Davis
    count: 79000
    ratio: 238
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of David,' from the Hebrew Dawid. Davis reached Florida during the antebellum cotton era, when Anglo planters moved into North Florida's fertile counties along the Georgia border."

  - rank: 9
    name: Rodriguez
    count: 75000
    ratio: 251
    origin: spanish
    type: Patronymic
    meaning: "Means 'son of Rodrigo,' from the Visigothic Hrodric. Rodriguez is concentrated in Miami's Cuban community and has expanded through Puerto Rican and Mexican populations settling the I-4 corridor since the 1980s."

