seo:
  title: "Most Common Last Names in Florida"
  description: "Florida's most common last names include Smith, Garcia, and Rodriguez, with Cuban, Scots-Irish, and Puerto Rican roots visible."

page:
  h1: "Most Common Last Names in Florida"
  intro: "No southeastern state has a surname map as layered as Florida's — the most common last names in Florida range from Scots-Irish pioneer names in the panhandle to Cuban surnames in Miami-Dade and Puerto Rican family names around Orlando."
  heritage_title: "Anglo Pioneer, Cuban, and Puerto Rican Heritage"
  heritage_body: "North Florida's Anglo surnames trace to Scots-Irish and English settlers who farmed the panhandle in the early 1800s. Miami-Dade's Cuban community, which grew rapidly after 1959, drove Spanish surnames like Garcia and Suarez into the state's top ranks. Puerto Rican families settling in Osceola County since the 1980s added Hernandez, Reyes, and Rivera to Central Florida's landscape."
  fun_fact: "Hialeah — a city in Miami-Dade County that was over 96 percent Hispanic in 2010 — is the engine behind Garcia, Suarez, and Martinez ranking among Florida's most common surnames."

surnames:
  - rank: 1
    name: Smith
    count: 155700
    ratio: 121
    origin: english
    type: Occupational
    meaning: "Derived from the Old English smið, meaning a metalworker or blacksmith. In Florida, the name arrived with Anglo settlers who farmed North Florida's panhandle counties and established early towns like Pensacola and Tallahassee in the early 1800s."

  - rank: 2
    name: Johnson
    count: 123200
    ratio: 153
    origin: english
    type: Patronymic
    meaning: "Means 'son of John,' from the Hebrew Yohanan. It spread through Florida during the late 19th century as English-speaking migrants from the Deep South followed Henry Flagler's railroad lines south into the peninsula."

  - rank: 3
    name: Williams
    count: 116100
    ratio: 162
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of William,' from the Germanic Willahelm. Williams ranks high in Florida partly because of historically large African-American communities in Jacksonville and Miami, where the surname is strongly concentrated."

  - rank: 4
    name: Garcia
    count: 110000
    ratio: 171
    origin: spanish
    type: Habitational
    meaning: "A Basque-origin surname possibly referring to a place named Garcia or meaning 'young.' It surged in Florida after the 1959 Cuban Revolution, when exiles established a dense community across Miami-Dade County."

  - rank: 5
    name: Jones
    count: 100200
    ratio: 188
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of John' in its Welsh form, carried to Florida by settlers from the Carolinas and Georgia during the antebellum period. It remains especially common in North Florida's rural panhandle counties."

  - rank: 6
    name: Brown
    count: 87800
    ratio: 214
    origin: english
    type: Descriptive
    meaning: "From the Old English brún, describing someone with brown hair or a dark complexion. Brown is distributed broadly across Florida, with notable concentrations in Jacksonville and Tampa's historically African-American neighborhoods."

  - rank: 7
    name: Martinez
    count: 80000
    ratio: 235
    origin: spanish
    type: Patronymic
    meaning: "Means 'son of Martín,' from the Latin Martinus. Martinez is heavily represented in Miami-Dade's Cuban-American community and grew further as Puerto Rican and Mexican families settled the I-4 corridor from the 1980s onward."

  - rank: 8
    name: Davis
    count: 79000
    ratio: 238
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of David,' from the Hebrew Dawid. Davis reached Florida during the antebellum cotton era, when Anglo planters moved into North Florida's fertile counties along the Georgia border."

  - rank: 9
    name: Rodriguez
    count: 75000
    ratio: 251
    origin: spanish
    type: Patronymic
    meaning: "Means 'son of Rodrigo,' from the Visigothic Hrodric. Rodriguez is concentrated in Miami's Cuban community and has expanded through Puerto Rican and Mexican populations settling the I-4 corridor since the 1980s."

  - rank: 10
    name: Hernandez
    count: 65000
    ratio: 289
    origin: spanish
    type: Patronymic
    meaning: "Means 'son of Hernando,' a variant of Ferdinand. Hernandez is especially common in Osceola County, which by 2010 had one of the highest concentrations of Puerto Rican residents of any county in the continental United States."

  - rank: 11
    name: Wilson
    count: 63200
    ratio: 298
    origin: english
    type: Patronymic
    meaning: "Means 'son of Will,' a diminutive of William. Wilson spread through Florida during the post-Reconstruction era as African-American families migrated from Georgia and Alabama into the state's citrus-growing regions."

  - rank: 12
    name: Moore
    count: 58800
    ratio: 320
    origin: english
    type: Habitational
    meaning: "From the Old English mōr, meaning open marshland. Moore is common throughout Florida's Gulf Coast counties, where families from the Carolinas and Georgia settled during the early territorial period of the 1820s."

  - rank: 13
    name: Taylor
    count: 58500
    ratio: 321
    origin: english
    type: Occupational
    meaning: "From the Old French tailleur, meaning a cloth cutter. Taylor arrived in Florida with English-speaking settlers from the Carolinas and Virginia during the American territorial period of the 1820s and 1830s."

  - rank: 14
    name: Anderson
    count: 58200
    ratio: 323
    origin: english
    type: Patronymic
    meaning: "Means 'son of Andrew,' from the Greek Andreas. Anderson is concentrated along Jacksonville's First Coast, where descendants of early Anglo settlers established the region's foundational communities."

  - rank: 15
    name: Thomas
