    origin: english
    type: Patronymic
    meaning: "From the Latin Martinus, meaning 'of Mars.' Martin is common among both Anglo families in North Florida's Alachua County and Cuban-American households in Miami-Dade, reflecting the name's parallel English and Spanish heritage."

  - rank: 20
    name: Thompson
    count: 49200
    ratio: 382
    origin: english
    type: Patronymic
    meaning: "Means 'son of Thomas,' from the Aramaic toma. Thompson is well represented along Florida's Gulf Coast, where Scots-Irish families settled in the antebellum era around Pensacola and the Tampa Bay region."

