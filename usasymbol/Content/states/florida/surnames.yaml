    ratio: 328
    origin: english
    type: Patronymic
    meaning: "From the Aramaic toma, meaning twin. Thomas has deep roots in Florida's panhandle, where families with this name were among the first Anglo settlers of Pensacola and surrounding West Florida counties in the early 1800s."

  - rank: 16
    name: Jackson
    count: 56200
    ratio: 335
    origin: english
    type: Patronymic
    meaning: "Means 'son of Jack,' a medieval diminutive of John. Jackson is strongly associated with Florida's African-American communities in Duval County and the panhandle, where it was widely adopted after the Civil War."

