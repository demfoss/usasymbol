    ratio: 367
    origin: english
    type: Patronymic
    meaning: "Means 'son of Harry,' a medieval English form of Henry. Harris is common along Florida's Atlantic coast counties, carried south by families migrating from Georgia and the Carolinas throughout the 19th century."

