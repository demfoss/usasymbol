    ratio: 214
    origin: english
    type: Descriptive
    meaning: "From the Old English brún, describing someone with brown hair or a dark complexion. Brown is distributed broadly across Florida, with notable concentrations in Jacksonville and Tampa's historically African-American neighborhoods."

