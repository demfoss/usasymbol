seo_title: "Florida State Tree | Sabal Palm"
seo_description: 'Florida adopted the sabal palm in 1953 after debate with pine supporters, choosing a salt-tolerant palm closely tied to coastal scenery.'

intro_text: "The Florida state tree is the <strong>Sabal Palm</strong> (<em>Sabal palmetto</em>), adopted in <strong>1953</strong>. Florida chose this native palm after years of debate because it is common across the state, withstands coastal storms, and strongly matches Florida's tropical public image. The Florida Federation of Garden Clubs backed the palm against proposals for slash pine and longleaf pine, and tourism interests favored a tree people immediately associated with Florida. The Sabal Palm is the official state tree of Florida and complements symbols such as [the Florida state flag](/states/florida/flag/florida-state-flag)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Florida State Tree?"
    paragraphs:
      - "The Sabal Palm is Florida's official state tree. Despite its name, this plant is not technically a tree. Sabal palms are monocots, more closely related to grasses than oaks. The trunk consists of tightly packed fibers rather than wood rings. This structure grows up to 80 feet tall with a diameter of 10 to 16 inches, and it is frequently referenced in broader guides such as the [list of U.S. state trees](/symbols/trees)."
      - "The palm displays long, fan-shaped leaves reaching four to six feet in length. Small white fragrant flowers appear in large branched clusters during late spring. Black fruits about one-quarter inch across ripen in early fall."
      - "Sabal palms grow naturally throughout Florida and along the southeastern coast. The species also occurs in Cuba and the Bahamas. These hardy palms tolerate salt spray, brackish water, and drought. They survive temperatures down to 14°F, and Florida's regional position can be compared in [States Neighboring States](/rankings/geography/states-neighboring-states)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Florida State Tree Name"
    paragraphs:
      - "The common names include Sabal Palm, Cabbage Palm, Cabbage Palmetto, and Carolina Palmetto. The scientific name is Sabal palmetto. The species name palmetto means 'little palm' in Spanish."
      - "The nickname 'cabbage palm' refers to the terminal bud at the tree's crown. This growing point resembles a cabbage head in shape and taste. Native Americans and early settlers ate this bud as food, calling it 'heart of palm.' Harvesting the bud kills the palm."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Sabal Palm Became the Florida State Tree"
    paragraphs:
      - "Florida chose the Sabal Palm in 1953 after several years of legislative debate. The Florida Federation of Garden Clubs led the campaign. They rejected an earlier 1949 proposal to designate the royal palm, arguing the sabal palm was more common statewide and better matched [the Sunshine State image](/states/florida/nickname/the-sunshine-state)."
      - "Competing proposals favored commercial lumber trees. State Forester C.H. Coulter initially supported slash pine for its economic value. Longleaf pine also had supporters. Both pine species provided valuable timber. The debate pitted economic value against symbolic representation."
      - "Tourism interests strongly preferred a palm tree symbol. Visitors associated Florida with palms, not pines. This tourism appeal proved decisive. When garden clubs endorsed sabal palm, even Forester Coulter accepted the choice. The 1953 legislature passed the designation, noting the palm's commercial uses wouldn't be limited."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Florida State Tree Facts"
    facts:
      - "Florida chose the Sabal Palm in 1953 after years of debate between palm supporters and those favoring slash pine or longleaf pine"
      - "State Forester C.H. Coulter initially opposed the palm but eventually supported it after garden clubs campaigned"
      - "The Florida Legislature replaced the cocoa palm with sabal palm on the state seal in 1970"
      - "Sabal palms are monocots, making them more closely related to grasses than oaks"
      - "The species is 85 million years old and existed during the age of dinosaurs"
      - "The terminal bud called 'heart of palm' was a staple food for Native Americans"
      - "Sabal palms are hurricane-resistant because flexible trunks bend without breaking"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Florida State Tree and Flower"
    paragraphs:
      - "Florida's state flower is the Orange Blossom (Citrus sinensis), designated in 1909. The legislature chose orange blossoms because of Florida's massive citrus industry. Millions of white fragrant flowers perfume central and southern Florida each spring; see [Florida's flower page](/states/florida/flower/orange-blossom) for the full legislative history. Florida also recognizes orange as the state fruit and orange juice as the state beverage."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Sabal Palm"
    paragraphs:
      - "The fan-shaped leaves provide the clearest identification. Each leaf measures four to six feet long with many segments radiating from a central point. The leaf ends fold vertically. Long leaf stalks extend through the leaf base. Leaves emerge directly from the trunk with no branches."
      - "The trunk displays a covering created by old frond bases. Gray-brown fibers wrap the trunk in a rough pattern. The trunk grows straight and unbranched, reaching up to 80 feet. Dead fronds often hang down before falling off."
      - "Small white flowers appear in branched clusters several feet long in late spring. Black fruits appear in early fall, each about one-quarter inch wide. Birds feed heavily on the ripe fruits."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Sabal Palm symbolizes Florida's tropical paradise image and tourist appeal. Its presence along beaches defines the state's landscape. The palm represents resilience through hurricane resistance and salt tolerance. The palm's victory over economically valuable pine trees shows Florida prioritized symbolic role over industrial practicality, a pattern also visible in [Florida's state motto history](/states/florida/motto/in-god-we-trust)."

faq:
  - question: "What is the Florida state tree?"
    answer: "The Sabal Palm (Sabal palmetto), also called cabbage palm, is Florida's official state tree. The legislature designated it in 1953 after years of debate with competing proposals for slash pine and longleaf pine."
  
  - question: "What is the Florida state tree called?"
    answer: "Florida's state tree is called the Sabal Palm, Cabbage Palm, or Cabbage Palmetto. Its scientific name is Sabal palmetto. The nickname 'cabbage palm' comes from the edible terminal bud that resembles a cabbage head."
  
  - question: "When was Florida's state tree adopted?"
    answer: "Florida adopted the Sabal Palm as its state tree in 1953. The Florida Federation of Garden Clubs campaigned for several years before the legislature approved the designation. In 1970, the legislature also replaced the cocoa palm with the sabal palm on Florida's state seal."
  
  - question: "Why is the Sabal Palm Florida's state tree?"
    answer: "Florida chose the Sabal Palm because it grows throughout the state and represents Florida's tropical image. After years of debate, the Florida Federation of Garden Clubs convinced legislators that a palm tree better symbolized Florida than competing pine species. Tourism interests preferred the palm for its association with beaches and vacation destinations. State Forester C.H. Coulter initially favored slash pine but eventually supported the palm. The sabal palm's widespread distribution and multiple traditional uses also supported the choice."
  
  - question: "What is the Florida state tree name?"
    answer: "The name is Sabal Palm or Cabbage Palm. Other names include Cabbage Palmetto and Carolina Palmetto. The scientific name is Sabal palmetto, meaning 'little palm' in Spanish."
  
  - question: "Is the Sabal Palm really a tree?"
    answer: "Technically, sabal palms are not trees. They are monocots, making them more closely related to grasses, corn, and orchids than oak or maple trees. Unlike trees, palms don't have wood rings or bark. The trunk consists of thousands of tightly packed fibers. Despite this technical difference, Florida designated the sabal palm as its state tree because of its tree-like appearance and cultural importance."
   
  - question: "What was the debate about Florida's state tree?"
    answer: "The debate lasted several years in the early 1950s. Supporters of slash pine and longleaf pine argued these valuable lumber species had greater economic importance. State Forester C.H. Coulter initially favored slash pine. Tourism interests and the Florida Federation of Garden Clubs preferred sabal palm because tourists associated Florida with palm trees. The garden clubs also rejected an earlier proposal for royal palm, arguing sabal palm was more common statewide. The palm won because it better represented Florida's tropical character despite the pines' commercial value."

