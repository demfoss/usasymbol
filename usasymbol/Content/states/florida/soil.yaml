faq:
- question: What is Florida's state soil?
  answer: "Florida's state soil is Myakka fine sand — a sandy, poorly drained flatwoods soil that covers more than 1.5 million acres across the Florida peninsula. The Legislature designated it the official state soil in 1989."
- question: Why is Myakka soil special?
  answer: "Myakka is the only official state soil in the United States that does not occur in any other state. It also has one of the most visually striking profiles of any soil — a white bleached layer over a jet-black spodic horizon, both formed by the same slow process of water moving iron and organic matter downward through the sand."
- question: What does Myakka mean?
  answer: "Myakka comes from a Native American word meaning 'big waters.' The name fits: Myakka soil has a seasonally high water table and floods regularly. The Myakka River and Myakka River State Park in Sarasota and Manatee counties share the same name."
- question: What is the white layer in Myakka soil?
  answer: "The white layer is called the albic horizon or E horizon. Rainwater dissolves iron and organic matter out of the sand and carries it downward, leaving the grains completely bleached. The material that washes out accumulates in the black spodic layer just below."
- question: What color is Myakka soil?
  answer: "Myakka soil has three distinct colors moving downward. The surface is black from decomposed organic matter. Below that is a very pale, almost white layer — the bleached albic horizon. Below that is jet black again — the spodic horizon where iron and organic carbon accumulated. Deeper sand is brown to grayish brown."
- question: Where is Myakka soil found in Florida?
  answer: "Myakka soil is found throughout the Florida peninsula in the Southern Florida Flatwoods region, including Hendry, Collier, Glades, Lee, Lake, Sarasota, Manatee, Charlotte, and Highlands counties, among others. It covers more than 1.5 million acres across dozens of counties."
- question: What grows in Myakka soil?
  answer: "Naturally, Myakka soil supports South Florida slash pine, saw palmetto, and flatwoods grasses including wiregrass species. With drainage and irrigation systems, farmers grow citrus, vegetables — squash, tomatoes, cucumbers, watermelons — and improved pasture grass."
- question: Why does Myakka soil have a high water table?
  answer: "Two things trap water in Myakka soil: the nearly flat land gives water nowhere to flow, and the spodic horizon slows downward drainage. In wet season, the water table sits within ten inches of the surface. During dry periods it drops, which is why irrigation is needed for farming."

