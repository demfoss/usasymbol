meaning: "Myakka soil does something almost no other soil does: it bleaches itself white underground. Rain carries organic matter and iron down through the sand, stripping the middle layer of all color until it looks like pale ash. That material piles up just below — a jet-black band called the spodic horizon — and stops. That dark layer holds moisture in a soil that would otherwise drain instantly. Without it, Florida's pine flatwoods would be dry desert sand. With it, they support slash pine, saw palmetto, and the wildlife that depends on both."
meaning_title: What Makes Myakka Soil Unusual
meaning_after_section: history
