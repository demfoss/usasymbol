name_meaning:
  heading: What Does Florida Mean?
  paragraphs:
  - Florida is the 27th U.S. state, admitted to the Union in 1845. The name comes from Spanish explorer Juan Ponce de Leon, who reached the peninsula in 1513 and called it La Florida.
  - The name is usually explained through Pascua Florida, the Spanish phrase for the Easter season or feast of flowers. In Spanish, florida means flowery or full of flowers, which made the name both seasonal and descriptive.
  - Florida's official nickname is the Sunshine State, while Orange State and Everglade State preserve older agricultural and wetland associations. Its postal abbreviation is FL, and residents are Floridians.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From Spanish La Florida, used by Juan Ponce de Leon after his 1513 landing.
    - label: Meaning
      text: Connected with Pascua Florida and the Spanish word florida, meaning flowery.
    - label: Statehood
      text: Florida became the 27th state on March 3, 1845.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Florida, the southeastern peninsula state between the Atlantic Ocean and Gulf of Mexico.
    - label: Spanish Florida
      text: Refers to the large Spanish colonial territory once centered on the peninsula.
    - label: People
      text: People from Florida are called Floridians.
    - label: Seasonal origin
      text: The name is tied to the Easter season when Spanish explorers reached the area.
  - heading: Nicknames and Short Forms
    items:
    - label: Sunshine State
      text: Official nickname tied to Florida's climate and tourism identity.
    - label: Orange State
      text: Older nickname tied to citrus agriculture.
    - label: Everglade State
      text: Informal nickname referring to the Everglades and South Florida wetlands.
    - label: Abbreviation
      text: FL; older short form Fla.
editorial:
  heading: What Florida's Symbols Say About the State
  paragraphs:
  - "Florida's [orange blossom](/states/florida/flower), [sabal palm](/states/florida/tree), and [orange juice](/states/florida/beverage/orange-juice) are the most direct symbols of the peninsula people think they know: warm, agricultural, coastal, and branded through citrus."
  - The [mockingbird](/states/florida/bird) complicates that image because Florida chose a familiar backyard bird instead of a flamingo, pelican, or other tropical species. It belongs to the Florida of towns, roadsides, and groves rather than postcard wildlife.
  - "The [manatee](/states/florida/mammal/manatee), [Florida panther](/states/florida/mammal/florida-panther), [dolphin](/states/florida/mammal/dolphin), and [Florida Cracker Horse](/states/florida/mammal/florida-cracker-horse) pull the state in several directions at once: springs and seagrass, endangered interior habitat, open coast, and ranching history."
faq:
- question: What is Florida's most famous state symbol?
  answer: The [orange blossom](/states/florida/flower) is one of Florida's best-known symbols because it connects directly to the state's citrus industry.
- question: What is Florida's state bird?
  answer: Florida's state bird is the [northern mockingbird](/states/florida/bird), adopted in 1927.
- question: What is Florida's state flower?
  answer: Florida's state flower is the [orange blossom](/states/florida/flower), adopted in 1909.
- question: Why is Florida called the Sunshine State?
  answer: Florida is called the Sunshine State because of its warm climate, tourism identity, and long association with winter sun. The nickname is covered on the [Florida nickname](/states/florida/nickname) page.
- question: How many official state symbols does Florida have?
  answer: The Florida hub gathers the state-symbol pages now available on USA Symbol, including the flag, mockingbird, orange blossom, sabal palm, orange juice, and several water-linked mammals.
