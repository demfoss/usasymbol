sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Florida's State Honey?"
    paragraphs:
      - "Tupelo honey is Florida's official state honey, designated by the Florida Legislature in 2016. It is made from the nectar of white tupelo trees that grow in the swamps along the Apalachicola River in the state's Panhandle."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Tupelo Honey"
    paragraphs:
      - "Tupelo honey has a light golden color with a greenish tint and a mild, buttery taste. Beekeepers place hives on platforms in the river swamps for the short two to three week bloom of the white tupelo tree each spring, then remove the honey before other flowers can mix in. Because it is high in fructose, tupelo honey resists crystallizing."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Tupelo Honey Became Florida's State Honey"
    paragraphs:
      - "The Florida Legislature designated tupelo honey the official state honey in 2016, recognizing a specialty product tied closely to the Apalachicola River region."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Florida Chose Tupelo Honey"
    paragraphs:
      - "The swamps along the Apalachicola River hold one of the largest concentrations of white tupelo trees in the world, and beekeepers there have produced pure tupelo honey for generations. The town of Wewahitchka is especially known for its tupelo honey industry and hosts an annual Tupelo Honey Festival."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Tupelo Honey Comes From in Florida"
    paragraphs:
      - "The Apalachicola River swamps in Florida's Panhandle, especially around Wewahitchka, produce most of the world's tupelo honey."
    sites:
