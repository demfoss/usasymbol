is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-05-01"
seo_title: "Florida State Flower | Orange Blossom"
seo_description: "Florida's state flower is the orange blossom, adopted November 15, 1909. Its perfume — called neroli — is prized in fine fragrance, and the blossoms grow in groves that produce 70% of U.S. oranges."

intro_text: "The orange blossom is Florida's official state flower, adopted on November 15, 1909. The small waxy white flowers bloom each spring across Florida's citrus groves, filling the air with one of the most recognizable fragrances in American agriculture — and the state that grows them produces around 70% of the nation's orange crop. Browse other state floral emblems on the [list of U.S. state flowers](/symbols/flowers), or explore all Florida symbols on the [Florida state hub](/states/florida)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Florida State Flower?"
    paragraphs:
      - "Florida recognizes the Orange Blossom as its state flower. Each blossom displays five white petals with waxy texture. The flowers measure about 1 to 2 inches across when fully open. A cluster of yellow stamens sits at the center. Orange blossoms produce an intensely sweet fragrance that can fill entire groves."
      - "Orange trees bloom primarily from late winter through early spring in Florida. Peak blooming occurs in March and April across most citrus-growing regions. A single mature orange tree can produce thousands of blossoms during the season. The flowers develop into fruit over several months. Not all blossoms become oranges as trees naturally drop excess flowers."
      - "Florida citrus groves cover hundreds of thousands of acres. Central and southern Florida contain the largest concentrations of orange trees. The trees thrive in Florida's warm subtropical climate and in landscapes often marked by [Florida's state tree](/states/florida/tree/sabal-palm). Freezing temperatures can damage both blossoms and fruit. Commercial growers monitor weather conditions carefully during blooming season."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Florida State Flower Name"
    paragraphs:
      - "This flower carries the common name Orange Blossom and the scientific name Citrus sinensis. The plant belongs to the Rutaceae family. This family includes citrus fruits like lemons, limes, and grapefruits along with several hundred other species."
      - "The genus name Citrus covers all citrus fruit trees. The species name sinensis means from China, indicating the sweet orange's geographic origin. Sweet oranges developed in southern China thousands of years ago. Spanish explorers brought orange trees to Florida in the 1500s. The trees adapted remarkably well to Florida's climate and soil, particularly in a peninsula setting summarized in [States Neighboring States](/rankings/geography/states-neighboring-states)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Orange Blossom Became the Florida State Flower"
    paragraphs:
      - "The Florida legislature recognized the Orange Blossom as the state flower in 1909. Lawmakers chose this flower without organizing a statewide vote. Florida's citrus industry had already become central to the state's economy. Orange groves dominated the landscape across central Florida counties and shaped symbolism later reflected on [the Florida state flag](/states/florida/flag/florida-state-flag)."
      - "Women's organizations advocated for the Orange Blossom selection. They argued the flower represented Florida better than any native wildflower. The citrus industry provided jobs for thousands of Florida residents. Orange production brought national attention to the state. Fresh Florida oranges shipped to markets throughout America."
      - "Some people suggested native flowers like magnolia or jasmine instead. Supporters of the Orange Blossom won the debate. They pointed out that oranges defined Florida's identity in the national imagination. The legislature made the designation official on November 15, 1909. Florida became one of the first southern states to adopt a state flower."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Florida State Flower Facts"
    facts:
      - "Orange Blossom honey comes from bees that pollinate orange groves, producing a light-colored honey with distinctive citrus flavor prized by beekeepers"
      - "The fragrance from Orange Blossoms has been used in perfumes and cosmetics for centuries, with the essential oil called neroli after an Italian princess"
      - "Florida adopted the Orange Blossom on November 15, 1909, during the peak era of Florida's citrus industry expansion"
      - "A single orange tree can live and produce fruit for over 50 years, blooming annually if conditions remain favorable"
      - "Orange blossoms appear white but sometimes show a slight pink tinge on the outside of unopened buds"
      - "Florida produces approximately 70% of the United States' orange crop, making citrus one of the state's most valuable agricultural products"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Florida State Flower and Bird"
    paragraphs:
      - "The Northern Mockingbird serves as Florida's state bird, a talented songbird that mimics calls of other birds. Both symbols represent Florida officially. The state adopted the Orange Blossom in 1909 and designated the Northern Mockingbird as state bird in 1927, as described on [Florida's official bird page](/states/florida/bird/northern-mockingbird)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Cultural Significance"
    paragraphs:
      - "The Orange Blossom commonly represents Florida's agricultural prosperity and warm climate. The flower has been linked to the state's identity as the Sunshine State and major citrus producer. Its sweet fragrance carries connotations of southern hospitality and Florida's appeal as a destination for visitors seeking warmth and natural beauty, and it is often compared with other floral emblems in the [list of U.S. state flowers](/symbols/flowers)."

faq:
  - question: "What is Florida's state flower?"
    answer: "Florida's state flower is the orange blossom, the fragrant white flower that blooms on orange trees throughout the state's citrus groves."

  - question: "What does the orange blossom look like?"
    answer: "Orange blossoms are small five-petaled white flowers about 1 to 2 inches across, with a cluster of yellow stamens at the center. The petals have a waxy texture, and unopened buds may show a slight pink tinge. Flowers grow in clusters on orange trees and produce an intensely sweet fragrance that carries across entire groves."
  
  - question: "When did Florida adopt the Orange Blossom as its state flower?"
    answer: "Florida adopted the Orange Blossom on November 15, 1909. The legislature chose this flower during the height of Florida's citrus industry growth."
  
  - question: "Why did Florida choose the Orange Blossom?"
    answer: "Florida chose the Orange Blossom because the citrus industry had become central to the state's economy and identity. Orange groves dominated the landscape and oranges defined how the nation viewed Florida. Women's organizations advocated for this selection over native wildflowers."
  
  - question: "When do Orange Blossoms bloom in Florida?"
    answer: "Orange Blossoms bloom primarily from late winter through early spring in Florida, with peak blooming occurring in March and April. A single mature tree can produce thousands of blossoms during the season."
  
  - question: "What does Orange Blossom honey taste like?"
    answer: "Orange Blossom honey has a light color and distinctive citrus flavor. Bees produce this honey while pollinating orange groves. The honey is prized by beekeepers for its delicate taste and aroma."

