meaning: 'Florida''s state seal shows a Seminole woman scattering flowers beside a sabal palm, with a steamboat on the water and the sun rising in the background. The design carries the motto "In God We Trust" around the border. The current version was corrected in 1985, when the legislature replaced inaccurate imagery that had appeared on the seal since 1868, including a figure who was not Seminole and a bird that was not native to Florida.'
