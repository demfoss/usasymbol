timeline:
- year: '1845'
  description: Florida is admitted to the United States as the 27th state. A territorial seal had been in use since 1847; the new state begins developing its own official imagery.
- year: '1868'
  description: Florida is readmitted to the Union after the Civil War and adopts its first state seal. The design includes a woman scattering flowers, a sabal palm, a steamboat, and the rising sun, with the motto "In God We Trust." The seal also contains a cockatoo not native to Florida.
- year: '1956'
  description: The United States Congress adopts "In God We Trust" as the national motto, the same phrase Florida had used on its seal since 1868.
- year: '1970'
  description: Florida officially adopts the Sunshine State as its nickname, formalizing the association with sun and warmth that the rising sun on the 1868 seal had already suggested.
- year: '1985'
  description: The Florida legislature revises the state seal, replacing the generic woman with a Seminole woman in traditional patchwork dress, removing the non-native cockatoo, and eliminating the geographically inaccurate highland background.

faq:
- question: What does Florida's state seal show?
  answer: Florida's state seal shows a Seminole woman in traditional patchwork dress scattering flowers in front of a sabal palm, with a steamboat on the water and the sun rising in the background. The motto "In God We Trust" runs around the border.
- question: Why is a Seminole woman on Florida's state seal?
  answer: The original 1868 seal showed a generic woman with no identifying features. The Florida legislature revised the seal in 1985, replacing the figure with a Seminole woman in traditional patchwork dress to accurately represent the Indigenous people who have lived in Florida continuously and who are the only Native American group in the continental United States that never signed a peace treaty with the federal government.
- question: When was Florida's state seal adopted?
  answer: Florida's state seal was first adopted in 1868, when the state was readmitted to the Union after the Civil War. The current version was revised and corrected in 1985. The 1985 version is the one currently in official use under Florida Statute § 15.03.
- question: What was wrong with the original Florida state seal?
  answer: The original 1868 seal contained three factual errors. It showed a cockatoo, a bird not native to Florida. The central woman figure was generic, with no features identifying her as Seminole or any specific group. Some renderings included distant mountains or highlands in the background, which do not exist in Florida's geography.
- question: What does "In God We Trust" mean on Florida's seal?
  answer: '"In God We Trust" is the motto on the border of Florida''s seal, present since the seal was first adopted in 1868. Florida used the phrase as a seal motto 88 years before Congress adopted it as the United States national motto in 1956.'
- question: Does Florida's seal appear on the state flag?
  answer: Yes. The Florida state seal appears at the center of the state flag, which shows the seal on a white field crossed by a red diagonal cross (saltire). The seal was placed on the flag in 1900.
- question: Did Florida's state seal change over time?
  answer: The seal was used essentially unchanged from 1868 until 1985, when the Florida legislature corrected the factual errors in the original design. The Seminole woman replaced the generic figure, the non-native cockatoo was removed, and the inaccurate highland background was eliminated. The composition of palm, steamboat, sun, and motto has remained constant since 1868.

