intro_text: 'Florida''s state seal spent 117 years with a factual error at its center: a bird identified as a cockatoo that is not native to Florida, and distant highlands in a state with no mountains. The 1985 legislature corrected the design, replacing the generic figure with a Seminole woman in traditional dress.'
