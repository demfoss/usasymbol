- id: facts
  icon: fa-solid fa-lightbulb
  title: Atlantic Sailfish Facts
  facts:
  - Adopted in 1975 by the Florida Legislature.
  - State law gives its scientific name as Istiophorus platypterus.
  - It can grow up to 11 feet long and weigh up to 220 pounds.
  - Young sailfish grow fast and can reach four to five feet in their first year.
  - Author Ernest Hemingway caught a sailfish over nine feet long off Key West in 1934.
faq:
- question: What is Florida's state saltwater fish?
  answer: Florida's state saltwater fish is the Atlantic sailfish. It is a fast ocean fish with a tall, spotted fin that looks like a sail.
- question: When did Florida adopt the Atlantic sailfish?
  answer: The Florida Legislature made the Atlantic sailfish the official state saltwater fish in 1975.
- question: Why did Florida choose the Atlantic sailfish?
  answer: Sailfish are common off Florida's coast and very popular with anglers. Florida's sailfishing is famous, especially near Fort Pierce, Miami, and the Keys.
- question: How fast can a sailfish swim?
  answer: A sailfish can swim as fast as 60 miles per hour, which makes it one of the fastest fish in the ocean.
- question: Is the sailfish found only in Florida?
  answer: No. Sailfish live in warm ocean waters around the world, but they are especially common off Florida.
