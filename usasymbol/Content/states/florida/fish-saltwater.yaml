intro_text: Florida's state saltwater fish is the Atlantic sailfish, a fast ocean fish with a tall sail-like fin, adopted in 1975. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of Florida?
  paragraphs:
  - The Atlantic sailfish became Florida's official state saltwater fish when the Florida Legislature adopted it in 1975. State law gives its scientific name as Istiophorus platypterus.
  - Florida's state freshwater fish is a different species, the Florida largemouth bass.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Atlantic Sailfish
  paragraphs:
  - The sailfish is easy to spot because of its first dorsal fin. This fin is huge and shaped like a sail, and it has black spots.
  - Its upper jaw stretches into a long, spear-shaped bill. The fish has a dark blue back and brownish-blue sides that fade to a silvery-white belly.
  - Sailfish in Florida usually measure about six to seven feet long and weigh 30 to 45 pounds. They can swim as fast as 60 miles per hour.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - In 1975, the Florida Legislature named the Atlantic sailfish the official state saltwater fish. State law still names it today.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Florida Chose the Atlantic Sailfish
  paragraphs:
  - Sailfish live in warm oceans around the world, so they are not unique to Florida. However, Florida says its sailfishing is legendary.
  - Sailfish are common off Florida's coast and very popular with anglers, and those are the main reasons it became the state saltwater fish.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Atlantic Sailfish
  paragraphs:
  - Sailfish live in warm offshore waters and are often found near the Gulf Stream.
  - Florida's best-known sailfishing spots are off Fort Pierce, Miami, and the Florida Keys, especially in the colder months. Sailfish move south as the weather cools in the north.
