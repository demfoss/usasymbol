# verification: The adoption year is 1975, not 2007. The Florida Department of State says the 1975 Florida Legislature adopted the sailfish, and Florida Statutes § 15.037 uses the scientific name Istiophorus platypterus, not Istiophorus albicans. Istiophorus albicans is an older name some sources still use for the Atlantic sailfish.
