sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Florida?
  paragraphs:
  - "The zebra longwing, Heliconius charitonius, is Florida's official state butterfly. State lawmakers designated it in 1996."
  - "It lives in Florida year-round rather than migrating, and is a common sight in gardens, hammocks, and shaded woodland edges across the state."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Zebra Longwing
  paragraphs:
  - "The zebra longwing has long, narrow black wings crossed by bold yellow stripes, a pattern that gives the butterfly its name."
  - "Adults have a wingspan of about 3 to 4 inches and fly with a slow, gliding flutter that makes them easy to watch and photograph."
  - "Unlike most butterflies, zebra longwings collect pollen along with nectar. The extra nutrients let adults live for several months, far longer than most butterfly species."
  - "At night, groups of zebra longwings roost together on the same branches, returning to the same roost spot repeatedly."

- id: history
  icon: fa-solid fa-landmark
  title: How Florida Chose the Zebra Longwing
  paragraphs:
  - "The Florida Legislature designated the zebra longwing as the official state butterfly in 1996."
  - "The species was a natural choice as a year-round Florida resident, seen statewide in gardens and natural areas rather than only passing through during migration."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Zebra Longwing in Florida
  paragraphs:
  - "Zebra longwings are found throughout Florida, including gardens, hammocks, and the shaded edges of woodlands, and are especially common in central and south Florida."
  - "Caterpillars feed only on passionflower vines, so butterflies are most often seen near gardens or wild areas where passionflower grows."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Zebra Longwing Facts
  facts:
  - "Adopted: 1996, by the Florida Legislature."
  - "Scientific name: Heliconius charitonius."
  - "Wingspan: about 3 to 4 inches, with long narrow black wings striped in yellow."
  - "One of the few butterflies that eats pollen as well as nectar, which helps adults live for several months."
  - "Roosts communally at night, with groups returning to the same branches each evening."




