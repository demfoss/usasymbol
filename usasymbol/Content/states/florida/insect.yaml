faq:
- question: What is Florida's state butterfly?
  answer: "Florida's state butterfly is the zebra longwing, adopted by the Florida Legislature in 1996."
- question: When did Florida adopt the zebra longwing?
  answer: "Florida adopted the zebra longwing as its official state butterfly in 1996."
- question: What does the zebra longwing look like?
  answer: "It has long, narrow black wings crossed by bold yellow stripes. Adults have a wingspan of about 3 to 4 inches."
- question: Where is the zebra longwing found in Florida?
  answer: "It is found statewide, especially in central and south Florida, in gardens, hammocks, and shaded woodland edges where passionflower vines grow."
- question: Is the zebra longwing a butterfly, bee, beetle, or dragonfly?
  answer: "It is a butterfly known for its striped wings, slow gliding flight, and unusual habit of eating pollen along with nectar."

