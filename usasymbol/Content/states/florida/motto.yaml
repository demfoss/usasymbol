title: "In God We Trust"
language: "English"
english_translation: ""
adopted_year: 1868

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Florida State Motto | In God We Trust"
seo_description: "Florida's state motto is 'In God We Trust,' the same as the U.S. national motto. It appeared on Florida's seal before becoming official in 2006."

intro_text: "Florida's official motto is <strong>In God We Trust</strong> — the same phrase as the official national motto of the United States. Florida placed it on the state seal on August 6, 1868, during Reconstruction, copying the exact wording from Union silver coins of the Civil War era. The phrase became the U.S. national motto 88 years later, in 1956 — and the legislation that made it national was introduced by Charles Edward Bennett, a congressman from Florida. A standalone state statute formally designating the phrase as Florida's motto didn't exist until 2006."

sections:
  - id: "same-as-national-motto"
    icon: "fa-solid fa-flag-usa"
    title: "The Only State Motto Identical to the National Motto"
    paragraphs:
      - "Florida is the only state whose official motto matches the national motto word for word. 'In God We Trust' has been the official motto of the United States since July 30, 1956, when President Eisenhower signed it into law. Florida had been using the exact same phrase on its state seal since 1868 — 88 years earlier."
      - "This wasn't a coincidence. Florida legislators copied the phrase from United States coinage during Reconstruction. The 1868 Joint Resolution No. 2 that redesigned Florida's seal specified that the motto 'In God We Trust' should surround the seal design and that the seal should be the size of an American silver dollar — the coin they were copying it from."
      - "The identical national and state mottos create an unusual overlap. When you see 'In God We Trust' on a Florida state document, you're reading the same phrase that appears on every U.S. coin and banknote, embedded in state law for a reason (Reconstruction-era loyalty to the Union) that preceded the national designation by nearly a century."

  - id: "from-coins-to-seal"
    icon: "fa-solid fa-coins"
    title: "How the Phrase Went From Coins to Florida's Seal"
    paragraphs:
      - "The story starts in 1861. Reverend M. R. Watkinson, a Pennsylvania minister, wrote to Treasury Secretary Salmon P. Chase suggesting that U.S. coins acknowledge God — to distinguish American currency from that of 'heathen' nations, as he put it. Chase supported the idea. Congress authorized the motto on April 22, 1864, and the two-cent piece became the first U.S. coin to carry 'IN GOD WE TRUST.'"
      - "Florida rejoined the Union in 1868 after the Civil War. The Reconstruction-era legislature needed a new constitution and a redesigned state seal. Lawmakers wanted to align Florida's symbolism with the Union — and the phrase that had appeared on Union coins since 1864 was an obvious choice. The 1868 resolution specified the motto and sized the seal to match a silver dollar."
      - "The phrase also appears in the fourth stanza of Francis Scott Key's 1814 poem that became 'The Star-Spangled Banner': 'And this be our motto: In God is our Trust.' Florida's Confederate-era predecessor used 'In God is our Trust' as a battle banner motto. The 1868 seal changed one word — dropping 'is our' and adopting the coin's wording exactly."

  - id: "florida-congressman-national-motto"
    icon: "fa-solid fa-landmark"
    title: "A Florida Congressman Made It the National Motto"
    paragraphs:
      - "In 1955, Representative Charles Edward Bennett of Jacksonville, Florida, introduced H.R. 619 in Congress to require 'In God We Trust' on all U.S. currency. Bennett was a World War II veteran who had survived the Bataan Death March. He argued that during the Cold War against an 'atheistic Communist' Soviet Union, the nation needed an explicit statement of faith as its motto."
      - "Congress passed the bill. President Eisenhower signed it on July 30, 1956. 'In God We Trust' officially replaced 'E Pluribus Unum' as the national motto, though 'E Pluribus Unum' continues to appear on the Great Seal of the United States. Bennett's home state of Florida had been carrying the exact phrase on its seal for 88 years before he elevated it to national status."

  - id: "2006-statute-and-2018-schools"
    icon: "fa-solid fa-calendar-check"
    title: "From Seal Inscription to Official Statute"
    paragraphs:
      - "For 138 years, 'In God We Trust' was part of Florida's law only through the state seal description. It had no standalone motto statute. That changed on June 22, 2006, when Governor Jeb Bush signed House Bill 1145, which took effect July 1, 2006. Florida Statutes §15.0301 now designates the phrase as the official state motto separately from the seal."
      - "In 2018, Florida went further. Representative Kimberly Daniels introduced HB 839, requiring all Florida public schools to display 'In God We Trust' conspicuously on campus. The House passed it 97-10 on February 21, 2018. Governor Rick Scott signed it. Florida's motto — identical to the national motto — now appears by law in every public school in the state."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Florida State Motto Facts"
    style: "gradient"
    facts:
      - "Florida is the only state with a motto identical to the U.S. national motto."
      - "Florida put the phrase on its seal in 1868 — 88 years before it became the national motto in 1956."
      - "Charles Edward Bennett, a Florida congressman and Bataan Death March survivor, introduced the bill making it the national motto."
      - "The 1868 resolution specified the seal should be the size of a silver dollar — the coin where they found the motto."
      - "The phrase didn't have a standalone Florida statute until Governor Jeb Bush signed it in 2006."
      - "A 2018 Florida law requires all public schools to display the motto conspicuously."

faq:
  - question: "What is Florida's state motto?"
    answer: "Florida's state motto is 'In God We Trust.' It appeared on the state seal beginning in 1868 and was designated as a standalone state motto by statute in 2006 (Florida Statutes §15.0301)."

  - question: "Is Florida's state motto the same as the U.S. national motto?"
    answer: "Yes — exactly the same. 'In God We Trust' has been the national motto since 1956. Florida had it on the state seal since 1868, 88 years earlier. Florida is the only state whose official motto is identical to the national motto."

  - question: "Why did Florida choose 'In God We Trust'?"
    answer: "Florida legislators chose it in 1868 during Reconstruction by copying it directly from Union silver coins. The 1868 Joint Resolution even specified that the new state seal should be the size of a silver dollar. It was partly a political act — demonstrating loyalty to the Union during Reconstruction."

  - question: "When was Florida's motto officially adopted?"
    answer: "The phrase first appeared on Florida's state seal on August 6, 1868, through Joint Resolution No. 2. It became a standalone statute on July 1, 2006, when Governor Jeb Bush signed House Bill 1145 (Florida Statutes §15.0301)."

  - question: "Did a Florida congressman make 'In God We Trust' the national motto?"
    answer: "Yes. Representative Charles Edward Bennett of Jacksonville, Florida, introduced H.R. 619 in 1955. Congress passed it, and President Eisenhower signed it on July 30, 1956, replacing 'E Pluribus Unum' with 'In God We Trust' as the official U.S. national motto."

  - question: "Where does Florida's motto appear today?"
    answer: "On the Florida state seal (circling the bottom of the design showing a Native American woman, a steamboat, a sabal palmetto, and sun rays), on the state flag (centered on a white background with a red cross), on driver's licenses, and by law since 2018, displayed conspicuously in every Florida public school."

