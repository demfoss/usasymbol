faq:
  - question: What is Florida's state stone?
    answer: "Florida's state stone is agatized coral, fossil coral in which chalcedony has replaced the original coral structure."
  - question: When did Florida adopt agatized coral as its state stone?
    answer: "The Florida Legislature designated agatized coral the official state stone in 1979."
  - question: Why did Florida choose agatized coral?
    answer: "Florida's ancient limestone seabeds host fossil coral that silica-rich groundwater has slowly replaced with chalcedony, a process well documented at sites like Tampa Bay's Ballast Point."
  - question: Where can you find agatized coral in Florida?
    answer: "Ballast Point on Tampa Bay is Florida's most famous locality, and collectors also find it along the Econfina River and the Withlacoochee and Suwannee river beds."

