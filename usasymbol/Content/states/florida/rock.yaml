  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Agatized Coral Facts"
    facts:
      - "Adopted as Florida's state stone in 1979."
      - "Florida's agatized coral is estimated at 25 to 38 million years old."
      - "Ballast Point on Tampa Bay got its name from sailing ships that loaded the heavy stone as ballast starting in the 1840s."
      - "Silica replacement of coral into agate is a slow process, taking an estimated 20 to 30 million years."

