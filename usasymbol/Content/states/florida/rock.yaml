intro_text: "Florida's state stone is agatized coral, adopted in 1979 to recognize the fossil coral that silica-rich groundwater slowly replaced with chalcedony over millions of years, most famously along Tampa Bay's Ballast Point. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Florida State Stone
    paragraphs:
      - "Agatized coral is Florida's official state stone, designated by the Florida Legislature in 1979. It forms when silica-bearing water gradually replaces the calcium carbonate skeleton of ancient coral, preserving the coral's original structure in chalcedony."
      - "Florida was a fitting choice for this symbol because its limestone bedrock, laid down when the state sat under shallow seas, hosts fossil coral in the exact conditions needed for this kind of silica replacement."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Agatized Coral?"
    paragraphs:
      - "Agatized coral is fossil coral in which the original skeleton has been replaced by chalcedony, a microcrystalline form of quartz also called agate. The state statute describes it as a chalcedony pseudomorph after coral, meaning the mineral took over the coral's shape without changing its outward form."
      - "Pieces often appear as limestone geodes lined with rounded, grape-like botryoidal agate or small drusy quartz crystals inside. Colors run gray, tan, and white, frequently banded, and the replacement process preserves fine details of the coral's original branching or cup-shaped structure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Florida Chose Agatized Coral as Its State Stone"
    paragraphs:
      - "Florida's fossil coral beds sit in limestone formed roughly 25 to 38 million years ago, when the state's landmass was covered by warmer, shallower seas. Over millions of years, silica-rich groundwater moving through that limestone replaced the coral's original structure with chalcedony, a process that itself takes 20 to 30 million years to complete."
      - "Ballast Point, on Tampa Bay, became the material's best-known source after specimens started turning up there in the 1840s. Sailing ships loaded chunks of the heavy stone as ballast for the return voyage to Europe, which is how the point got its name and how agatized coral became linked to Tampa."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Agatized Coral Became Florida's State Stone"
    paragraphs:
      - "The Florida Legislature designated agatized coral the official state stone in 1979, writing a specific mineralogical description of the material into state law."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Agatized Coral Is Found in Florida"
    paragraphs:
      - "Ballast Point, on Hillsborough Bay in Tampa, is Florida's most famous agatized coral locality and remains one of the best-known sources of the material anywhere. Collectors also find it along the Econfina River and in the Withlacoochee and Suwannee river beds."
    sites:
