seo_title: "Florida State Stone | Agatized Coral"
seo_description: "Florida's state stone is agatized coral, adopted in 1979. Silica slowly replaced ancient coral skeletons, and Tampa's Ballast Point is its best-known source."
hero_image: /images/rocks/florida/florida-state-stone-hero.webp
