intro_text: Florida's state freshwater fish is the Florida largemouth bass, a big-mouthed game fish of the state's lakes and rivers, adopted in 1975. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of Florida?
  paragraphs:
  - The Florida largemouth bass became Florida's official state freshwater fish when the Florida Legislature named it in 1975. State law gives its scientific name as Micropterus salmoides floridanus.
  - Biologists now call this fish the Florida bass. They treat it as its own species, with the scientific name Micropterus salmoides.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Florida Largemouth Bass
  paragraphs:
  - The Florida largemouth bass is a long, sturdy member of the sunfish family. Its best-known feature is its very large mouth.
  - It has a deep notch in the fin along its back, so the fin looks almost like two fins. Its body is greenish, and a dark stripe often runs along each side.
  - This bass grows unusually large in Florida waters. It can be more than 20 inches long and weigh more than 15 pounds.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - The Florida Legislature named the Florida largemouth bass the official state freshwater fish in 1975. State law still uses the name Florida largemouth bass.
  - In the same year, lawmakers named the Atlantic sailfish the state saltwater fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Florida Chose the Florida Largemouth Bass
  paragraphs:
  - State law names the fish but does not give a detailed reason for choosing it.
  - The state calls it one of America's most famous game fish, and it grows unusually large in Florida waters.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Florida Largemouth Bass
  paragraphs:
  - The Florida largemouth bass lives in lakes and rivers all across Florida. It likes quiet water with lots of plants.
  - Look for it near weeds, logs, and other underwater cover. Groups of bass sometimes swim in the open middle of lakes.
  - Florida bass live in most of the state except the western Panhandle. Their native range also reaches into parts of Georgia, South Carolina, and North Carolina.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Florida Largemouth Bass Facts
  facts:
  - Adopted in 1975 by the Florida Legislature.
  - State law gives its scientific name as Micropterus salmoides floridanus.
  - It can be more than 20 inches long and weigh more than 15 pounds.
  - It has a very large mouth and a deep notch in the fin on its back.
  - Biologists now call it the Florida bass, a species of its own.
faq:
- question: What is Florida's state fish?
  answer: Florida's state freshwater fish is the Florida largemouth bass. Florida also has a state saltwater fish, the Atlantic sailfish.
- question: When did Florida adopt the Florida largemouth bass?
  answer: The Florida Legislature named the Florida largemouth bass the official state freshwater fish in 1975.
- question: Why did Florida choose the Florida largemouth bass?
  answer: State law does not give a detailed reason. The state calls it one of America's most famous game fish, and it grows unusually large in Florida.
- question: Is the Florida largemouth bass different from a regular largemouth bass?
  answer: Yes. Biologists now treat the Florida bass as its own species. The two fish look almost the same, and only a genetic test can tell them apart.
- question: Why do some people call it the Florida bass?
  answer: In 2024, the state's wildlife biologists started calling it the Florida bass after genetic studies showed it is a separate species. State law still calls it the Florida largemouth bass.
