# verification: Changed adopted_year from 2007 to 1975 and binomial_name from Micropterus floridanus to Micropterus salmoides floridanus. Florida Statutes 15.036 (enacted 1975, ch. 75-1) names the Florida largemouth bass (Micropterus salmoides floridanus). Since 2024, state wildlife biologists call this fish the Florida bass and use the scientific name Micropterus salmoides. The statute text has not changed.
