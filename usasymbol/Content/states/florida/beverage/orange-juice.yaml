seo_description: "Florida made orange juice its state beverage in 1967, tying the symbol to citrus law, frozen concentrate, and the orange economy."
intro_text: Florida's official state beverage is <strong>orange juice</strong>, designated on <strong>April 20, 1967</strong>. The choice was less a statement than a confirmation — Florida and orange juice had already been inseparable for decades, and the 1967 law gave formal recognition to what the state's economy, tourism, and public image had long made obvious. This profile appears in the [list of U.S. state beverages](/symbols/beverages).
