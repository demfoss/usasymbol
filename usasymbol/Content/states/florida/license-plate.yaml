sections:
- id: sunshine-state
  icon: fa-solid fa-sun
  title: What "The Sunshine State" Means on Florida Plates
  paragraphs:
  - '"The Sunshine State" works because it is both a measurable fact and an implied invitation. Florida receives more annual sunshine than any other state in the continental United States, and the phrase captures the core reason people move to or visit Florida in the first place. On the plate, it does double duty: describing a climate and marketing a lifestyle at the same time.'
  - 'When Florida plates began carrying the slogan, the state was already building its economy around tourism, winter warmth, and year-round outdoor living. Every Florida-registered car that crossed into a colder state was, in effect, a rolling advertisement for what Florida offered. The slogan and [Florida''s official state nickname](/states/florida/nickname) eventually converged when the Legislature formalized the phrase in 1970 — but the plates got there first.'
  - 'The slogan fits naturally alongside Florida''s other symbols. The [Florida state flower](/states/florida/flower) is the orange blossom, subtropical and fragrant, tied to the same warmth and agricultural abundance the plate invokes. The [Florida state flag](/states/florida/flag) carries the state seal, which features the sun. None of these identities contradict each other — they reinforce the same image Florida has been selling since the early 20th century.'

- id: orange-graphic-era
  icon: fa-solid fa-lemon
  title: The Orange Graphic That Defined Modern Florida Plates
  paragraphs:
  - 'Florida''s most recognized modern plate idea is not a rocket or a beach scene — it is an orange. Beginning in the late 1970s, Florida plates moved toward screened graphics that placed a citrus image and state outline behind the registration number. Later versions refined that idea into the orange blossom design still associated with the state today.'
  - 'The citrus imagery worked because it matched Florida''s public identity. At its peak in the 1970s and early 1980s, Florida produced much of the nation''s orange juice supply, and the orange graphic on the plate turned that agricultural reputation into a simple roadside symbol. The Sunshine State slogan and the citrus graphic worked as a unit — sunshine grows oranges, oranges define Florida.'
  - 'The modern orange blossom plate family also allows several bottom legends. Some plates read "Sunshine State," some carry a county name, and some use "In God We Trust." That variation matters: "Sunshine State" is the historic slogan, but it is not the only bottom text a driver may see on current Florida plates.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Florida License Plate Designs by Era
  paragraphs:
  - Florida has updated its standard plate design several times since adding "The Sunshine State" slogan in 1949. Each design reflects a different chapter in how the state chose to present itself to the country.
  versions:
  - name: Early Sunshine State plates
    years: 1949–1976
    image: /images/license-plates/florida/1950s-sunshine-state.webp
    description: Florida first used "Sunshine State" on general-issue passenger plates in 1949. Earlier designs were functional rather than pictorial — bold lettering on simple backgrounds — but they established the phrase that would outlast every subsequent design change.
  - name: 1970s Sunshine State plates
    years: 1971–1976
    image: /images/license-plates/florida/1970s-sunshine-state.webp
    description: Florida's early 1970s plates kept the slogan prominent, usually with "Sunshine State" at the top or bottom and the state name on the opposite edge. The Legislature made the nickname official in 1970, after the plate slogan was already familiar.
  - name: Orange graphic plates
    years: 1979–2003
    image: /images/license-plates/florida/1990s-florida-plate.webp
    description: Florida introduced screened citrus-and-state graphics in the late 1970s and kept refining the idea through the 1980s and 1990s. Some versions used county names at the bottom, while others retained "Sunshine State."
  - name: Orange blossom plates
    years: 2004–present
    image: /images/license-plates/florida/current-orange-blossom.webp
    description: Florida's current standard graphic plate family uses oranges, orange blossoms, and the state outline. The bottom legend may read "Sunshine State," "In God We Trust," or a county name, depending on the plate option issued.

- id: specialty-plates
  icon: fa-solid fa-layer-group
  title: Florida's Specialty Plate Program
  paragraphs:
  - 'Florida operates one of the largest specialty license plate programs in the United States, with more than 100 approved designs available to registered vehicles. Each specialty plate carries "The Sunshine State" slogan alongside a cause-specific graphic — conservation programs, state universities, military branches, and community foundations all have approved designs.'
  - 'A portion of the additional fee for most specialty plates goes directly to the cause named on the plate. The Florida Panther plate directs funds toward wildlife conservation. The Save the Manatee plate supports programs protecting [Florida''s state marine mammal](/states/florida/mammal). The Keep Florida Beautiful plate funds anti-litter programs. The system turns the plate into a visible declaration of the driver''s priorities while generating dedicated revenue for specific causes.'
  - 'For a full state-by-state overview of how plate slogans and designs vary across the country, see [U.S. license plate slogans by state](/license-plates).'

timeline:
- year: '1949'
  description: Florida general-issue passenger plates first carry "Sunshine State," establishing the phrase in public circulation years before the Legislature acts on it.
- year: '1970'
  description: The Florida Legislature officially adopts "The Sunshine State" as Florida's state nickname — formalizing what the state's own license plates had already been saying for decades.
- year: '1976'
  description: Florida's red-on-white base remains in use with staggered registration stickers while "Sunshine State" continues as the plate slogan.
- year: '1979'
  description: Florida begins issuing plates with a screened orange/state graphic, starting the citrus-centered visual identity that still defines the standard plate family.
- year: '2004'
  description: Florida updates the standard graphic plate with oranges and orange blossoms over the state outline.
- year: '2009'
  description: Florida debuts the optional "In God We Trust" bottom legend, giving drivers another standard plate text option alongside county names and "Sunshine State."

faq:
- question: What is Florida's license plate slogan?
  answer: Florida's license plate slogan is "The Sunshine State." It first appeared on Florida general-issue passenger plates in 1949 and was formally adopted as the official state nickname in 1970.
- question: When did "The Sunshine State" first appear on Florida license plates?
  answer: '"The Sunshine State" first appeared on Florida general-issue passenger plates in 1949. That means the plate slogan predates the 1970 law that made it Florida''s official nickname.'
- question: What is the Florida orange license plate?
  answer: Florida's modern standard graphic plate uses oranges, orange blossoms, and the state outline. The orange graphic tradition began with screened citrus imagery in the late 1970s and was updated into the current orange blossom design in the 2000s.
- question: What does Florida's current license plate look like?
  answer: Florida's current standard graphic plate uses oranges, orange blossoms, and the state outline. The bottom legend may read "Sunshine State," "In God We Trust," or a county name.
- question: Why does Florida have so many specialty license plates?
  answer: Florida passed legislation allowing specialty plates as a funding mechanism for specific causes — conservation programs, universities, military branches, and community organizations. Drivers pay an additional fee for a specialty plate, and a portion of that fee goes to the named cause. The result is one of the largest specialty plate programs in the country, with more than 100 approved designs each carrying the Sunshine State slogan.
- question: Does Florida's license plate slogan match its official state nickname?
  answer: Yes. "The Sunshine State" is both Florida's license plate slogan and its official state nickname, adopted by the Florida Legislature in 1970. The plates carried the phrase before the legislative action — making this a case where the plates helped establish the identity the law later formalized.
- question: Does every current Florida plate say "The Sunshine State"?
  answer: No. Florida's standard plate family can carry "Sunshine State," "In God We Trust," or a county name at the bottom. "Sunshine State" remains the historic plate slogan, but it is not printed on every current Florida plate.

