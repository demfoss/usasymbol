seo_title: 'Florida License Plate Slogan: The Sunshine State — History & Designs'
seo_description: Florida's license plate slogan is "The Sunshine State," carried on plates decades before the Florida Legislature made it official in 1970. Learn how it moved from mid-century embossed plates to today's orange blossom design.
hero_image: /images/license-plates/florida/current-orange-blossom.webp
hero_image_alt: Florida license plate with orange blossom graphic and Sunshine State slogan
hero_image_caption: Florida's standard orange blossom plate keeps "Sunshine State" on the base design — a phrase the state had already been printing on plates before the Legislature formalized it in 1970.
intro_text: '**"The Sunshine State"** is the Florida license plate slogan, and it is the rare case where the plate led the law. Florida was already printing the phrase on standard plates well before the Florida Legislature formally adopted it as the state''s official nickname in 1970. Today the slogan appears on standard orange-themed plates and many specialty designs, making it one of the most visible state identities in the country. The slogan has outlasted repeated design changes, carrying the same two words through embossed mid-century plates, county-name options, citrus graphics, and modern specialty plates.'
quick_answer: '"The Sunshine State" is Florida''s license plate slogan, first used on Florida general-issue passenger plates in 1949 and formally adopted as the official state nickname in 1970. The current standard plate family uses Florida''s orange graphic, with bottom text that may read "Sunshine State," "In God We Trust," or a county name.'
