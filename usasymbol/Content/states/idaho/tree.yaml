author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "Idaho State Tree | Western White Pine"
seo_description: 'Idaho adopted western white pine in 1935, honoring a major timber tree later threatened by blister rust and restored through breeding work.'

intro_text: "The Western White Pine became Idaho's state tree in 1935 after the Daughters of Pioneers promoted the designation. The species was once one of northern Idaho's defining timber trees, and its later decline turned it into a symbol of both the state's forest history and its conservation work."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Idaho"
    paragraphs:
      - "The Western White Pine is Idaho's official state tree. This evergreen conifer grows 150 to 180 feet tall with trunk diameters of three to eight feet. The largest specimen stands 219 feet high near Elk River, Idaho."
      - "The bark develops dark gray color and cracks into small rectangular segments. Needles grow two to four inches long in bundles of five with blue-green color. Large cylindrical cones measure five to twelve inches long."
      - "The tree grows in mountains across the western United States and Canada. Northern Idaho historically contained the largest western white pine forests, overlapping habitats linked with [Idaho's state flower, the Syringa](/states/idaho/flower/syringa)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Western White Pine"
    paragraphs:
      - "Common names include Western White Pine, Mountain White Pine, Idaho White Pine, and Silver Pine. The scientific name is Pinus monticola. The species name monticola means 'mountain dweller' in Latin."
      - "The wood earned the nickname 'soft pine' for its straight grain and even texture. Loggers called it 'King Pine' before the 1860s when it dominated moist inland forests."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "History of the Idaho State Tree"
    paragraphs:
      - "Idaho adopted the Western White Pine on February 13, 1935. The Ellen Wright Camp, Franklin County Chapter of the Daughters of Pioneers promoted the designation. The law appears in Idaho Statutes Title 67, Chapter 45, Section 67-4504."
      - "The designation came at a pivotal moment. Blister rust had already spread through Idaho forests by 1935. The disease arrived in Vancouver Island around 1910 on imported French ornamental shrubs. By the 1940s, the rust had become epidemic in Idaho, including open landscapes associated with [Idaho's state bird, the Mountain Bluebird](/states/idaho/bird/mountain-bluebird)."
      - "Legislators chose the white pine for its economic importance. The tree provided Idaho's most valuable timber. The state wanted to honor its forestry heritage even as the species faced catastrophic decline."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Idaho State Tree Facts"
    facts:
      - "White pine blister rust fungus from Europe (1910) has killed 90% of western white pines"
      - "Today, 93 percent fewer western white pines exist than 40 years ago"
      - "Forest geneticists have bred rust-resistant strains since the 1970s using naturally resistant trees"
      - "The 219-foot specimen near Elk River, Idaho is the tallest western white pine in the world"
      - "Americans handled western white pine wood 2,300 times yearly in 1950, mostly as matchsticks"

  - id: blister-rust
    icon: "fa-solid fa-biohazard"
    title: "White Pine Blister Rust Disease"
    paragraphs:
      - "White pine blister rust is a fungal disease caused by Cronartium ribicola. The fungus requires two hosts to complete its life cycle: five-needle pines and currant or gooseberry shrubs. Spores travel between hosts on the wind."
      - "The disease entered North America accidentally around 1910. Infected French ornamental shrubs imported to Vancouver Island carried the fungus. The rust spread rapidly through western forests. By the 1940s, it reached epidemic levels in Idaho."
      - "The U.S. Forest Service estimates blister rust killed 90 percent of western white pines west of the Cascades. Today, mature trees exist mostly as scattered individuals. Mountain pine beetles and harvesting compounded the devastation."

  - id: breeding-program
    icon: "fa-solid fa-dna"
    title: "Genetic Resistance Breeding Program"
    paragraphs:
      - "Forest geneticists found that some individual trees showed natural resistance to blister rust. These rare survivors possessed genetic traits that protected them from infection. Scientists collected seeds and pollen from resistant trees."
      - "Breeding efforts began in the 1970s. Researchers tested thousands of trees for rust resistance. They selected the most resistant individuals as parent trees for future generations. This work produced seedlings with inherited disease resistance."
      - "Reforestation using rust-resistant seedlings started in the mid-1970s. The program has planted resistant trees throughout northern Idaho, southern British Columbia, western Montana, and other areas. Progress remains slow because competing species now occupy former white pine habitat."

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Idaho State Tree and Flower"
    paragraphs:
      - "Idaho's state flower is the Syringa (Philadelphus lewisii), designated in 1931. Also called Lewis' mock orange, the shrub produces fragrant white flowers. The species honors Meriwether Lewis, who collected specimens in Idaho. The flower appeared on Idaho's state seal in 1890."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Western White Pine"
    paragraphs:
      - "The needles provide the clearest identification. Five needles grow together in each bundle. Each needle measures two to four inches long with blue-green color. Needles persist three to four years."
      - "The bark starts with red-brown furrows on young trees. Mature trees develop dark gray bark broken into small rectangular blocks. This pattern is unique among North American trees."
      - "Large cones hang from branches. Each cone measures five to twelve inches long with thin, curved scales. Brown when mature, the scales often display spots of white resin."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Western White Pine symbolizes Idaho's forestry heritage and economic history. Its designation in 1935, amid epidemic disease, shows determination to honor the species despite catastrophe. The ongoing breeding program represents scientific innovation and conservation commitment. The tree's struggle and potential recovery mirror themes of resilience and adaptation that align with [Idaho's state motto, Esto Perpetua](/states/idaho/motto/esto-perpetua)."

  - id: regional-context
    icon: "fa-solid fa-map"
    title: "Regional Forest Context"
    paragraphs:
      - "Because the species range crosses state and international boundaries, readers often use [States Neighboring States](/rankings/geography/states-neighboring-states) to understand Idaho's forest geography in regional context."

faq:
  - question: "What is the Idaho state tree?"
    answer: "The Western White Pine (Pinus monticola) is Idaho's official state tree. The legislature adopted it on February 13, 1935, promoted by the Ellen Wright Camp, Franklin County Chapter of the Daughters of Pioneers."
  
  - question: "What is the Idaho state tree called?"
    answer: "Idaho's state tree is called Western White Pine, Mountain White Pine, Idaho White Pine, or Silver Pine. The scientific name is Pinus monticola, meaning 'mountain dweller.' Loggers called it 'King Pine' before the 1860s."
  
  - question: "When was Idaho's state tree adopted?"
    answer: "Idaho adopted the Western White Pine on February 13, 1935. The designation came during the blister rust epidemic that was already devastating Idaho's white pine forests."
  
  - question: "Why is the Western White Pine Idaho's state tree?"
    answer: "The legislature chose western white pine because northern Idaho contained the nation's largest volumes of this valuable timber. The tree provided Idaho's most important forest product. Despite the blister rust epidemic already spreading in 1935, legislators wanted to honor the state's forestry heritage and the economically vital species."
  
  - question: "What is white pine blister rust?"
    answer: "White pine blister rust is a fungal disease caused by Cronartium ribicola. The fungus was accidentally introduced from Europe around 1910 on French ornamental shrubs. It spread rapidly and became epidemic in Idaho by the 1940s. The U.S. Forest Service estimates the rust killed 90 percent of western white pines."
  
  - question: "Are there rust-resistant western white pines?"
    answer: "Yes. Forest geneticists found that some individual trees showed natural genetic resistance to blister rust. Since the 1970s, scientists have bred rust-resistant strains using these survivors as parent trees. Reforestation programs plant rust-resistant seedlings throughout the historic range. Progress is slow because competing species now occupy former white pine habitat."
  
  - question: "What are some facts about the Idaho state tree?"
    answer: "Blister rust fungus from Europe (1910) killed 90% of western white pines. Today, 93% fewer trees exist than 40 years ago. Forest geneticists breed rust-resistant strains since the 1970s. The world's tallest western white pine (219 feet) stands near Elk River, Idaho. Americans handled the wood 2,300 times yearly in 1950, mostly as matchsticks. Disease-free trees can live 350 to 500 years. Idaho adopted the tree in 1935 during the epidemic."
  
  - question: "Why did western white pine populations decline?"
    answer: "The primary cause is white pine blister rust, a fungal disease accidentally introduced from Europe in 1910. The fungus spread rapidly and became epidemic by the 1940s, killing 90% of western white pines. Mountain pine beetle infestations, fire suppression changing forest composition, and heavy logging also contributed. Competing species like fir and hemlock replaced white pines in many areas."

