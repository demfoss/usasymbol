seo_title: 'Idaho License Plate Slogan: Famous Potatoes History, Origin & Designs'
seo_description: Idaho license plates say "Famous Potatoes" — not "Gem State," the official nickname. Learn when "Famous Potatoes" first appeared on Idaho plates, why the agricultural slogan beat the official nickname, and how it survived decades of proposed changes.
hero_image: /images/license-plates/idaho/famous-potatoes-plate.webp
hero_image_alt: Idaho Famous Potatoes license plate
hero_image_caption: Idaho's current "Scenic Idaho" base keeps "Famous Potatoes" at the bottom, preserving the slogan streak that began in 1957.
intro_text: '**"Famous Potatoes"** is the Idaho license plate slogan — and the phrase that has appeared on Idaho''s standard plate for decades. The potato identity developed in stages: a 1948 baked-potato decal with "World Famous POTATOES," a 1956 "WORLD FAMOUS POTATO" plate, and then the long-running "FAMOUS POTATOES" wording that began in 1957. It is not Idaho''s official nickname. The state''s official nickname is "The Gem State," adopted by the legislature in 1957 for the gemstones found throughout Idaho''s mountains.'
quick_answer: '"Famous Potatoes" has been Idaho''s license plate slogan since 1957, following earlier potato-themed plate slogans in 1948 and 1956. The phrase reflects Idaho''s standing as the largest potato-producing state in the country. Idaho''s official nickname is "The Gem State," but the standard plate chose agriculture over minerals.'
