intro_text: "**\"Famous Potatoes\"** is Idaho's license plate slogan, in long-running use on the standard plate since 1957. The potato theme began earlier with a 1948 decal and a 1956 \"World Famous Potato\" plate. It is separate from Idaho's official nickname, \"The Gem State.\ This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"Famous Potatoes\" has been Idaho's license plate slogan since 1957, following earlier potato-themed plate slogans in 1948 and 1956. The phrase reflects Idaho's standing as the largest potato-producing state in the country. Idaho's official nickname is \"The Gem State,\" but the standard plate chose agriculture over minerals."
