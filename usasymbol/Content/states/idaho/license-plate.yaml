sections:
- id: famous-potatoes
  icon: fa-solid fa-wheat-awn
  title: What "Famous Potatoes" Says That "Gem State" Does Not
  paragraphs:
  - 'Idaho has two distinct identities, and its license plate chose one of them. "The Gem State" — official since 1957 — reflects the mineral deposits across Idaho''s mountains: star garnets found in only two places on Earth, along with opals, rubies, sapphires, and jade. That is a real and specific claim. But gemstones are a niche interest. Potatoes feed the country, and everyone knows where they come from.'
  - 'The agricultural claim is overwhelming. Idaho''s volcanic soil in the Snake River Plain, combined with high elevation and controlled irrigation, produces a growing environment that no other state has been able to replicate at scale. Idaho russets, in particular, became the standard for french fries and baked potatoes across the country — so much so that "Idaho potato" is a phrase people say even when they mean a generic russet. The plate slogan is capitalizing on a brand recognition that built itself.'
  - 'Idaho''s [state nickname](/states/idaho/nickname) covers both identities — the Gem State history and the Famous Potatoes reality. The license plate resolved the tension by picking the one most Americans already associated with the state, regardless of what the legislature had officially designated.'

- id: potato-industry
  icon: fa-solid fa-tractor
  title: Why Idaho Can Call Its Potatoes Famous
  paragraphs:
  - 'Idaho produces roughly one-third of all potatoes grown in the United States each year — more than any other state, by a wide margin. The industry is concentrated in southern Idaho, particularly in the Snake River Plain, where the combination of volcanic soil, cold nights, and the Snake River irrigation network creates near-ideal growing conditions for the Russet Burbank variety that dominates commercial production.'
  - 'The Idaho Potato Commission, established in 1937, is one of the oldest agricultural marketing organizations in the country and is responsible for the certification mark that distinguishes genuine Idaho potatoes from imitations. When a bag of potatoes in a grocery store carries the "Grown in Idaho" seal, it is a legally protected claim. That kind of infrastructure — a commission, a trademark, a national advertising campaign — is what turned a regional crop into a national brand, and what made the plate slogan not just defensible but accurate.'
  - 'See [Idaho''s state flag](/states/idaho/flag) and [state motto](/states/idaho/motto) for the other formal expressions of Idaho''s identity. The motto — Esto Perpetua, "let it be perpetual" — takes a different register entirely from the potato slogan, which is one of the most deliberately commercial plate slogans in the United States.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Idaho License Plate Designs by Era
  paragraphs:
  - Idaho's plates have gone through several visual generations, but the agricultural identity has been the constant thread on the standard plate since the late 1940s.
  versions:
  - name: 50 Years of Statehood
    years: '1940'
    image: /images/license-plates/idaho/early-idaho-plate.webp
    description: Idaho's 1940 plate marked the state's fiftieth anniversary with "50 Years Statehood" and the dates 1890 and 1940. It was a commemorative statehood slogan, not yet a potato plate.
  - name: World Famous Potatoes
    years: '1948'
    image: /images/license-plates/idaho/1948-idaho-plate.webp
    description: Idaho paired a baked-potato decal with the slogan "World Famous POTATOES" in 1948. It was the first clear potato-branding step on Idaho passenger plates.
  - name: World Famous Potato
    years: '1956'
    image: /images/license-plates/idaho/1956-idaho-plate.webp
    description: Idaho used the singular "WORLD FAMOUS POTATO" in 1956. The wording was short-lived, but it led directly into the long-running plural slogan that followed.
  - name: Famous Potatoes
    years: 1957–1991
    image: /images/license-plates/idaho/1957-famous-potatoes.webp
    description: In 1957 Idaho began the long streak of plain green-on-white or white-on-green plates with "FAMOUS POTATOES." This is the wording that became Idaho's durable plate identity.
  - name: Scenic Idaho
    years: 1992–present
    image: /images/license-plates/idaho/scenic-idaho-plate.webp
    description: Idaho introduced the current Scenic Idaho base in 1992, adding mountain scenery while keeping "FAMOUS POTATOES" at the bottom. The plate combines outdoor branding with the agricultural slogan instead of replacing it.

- id: why-survived
  icon: fa-solid fa-rotate
  title: Why "Famous Potatoes" Survived Every Attempt to Change It
  paragraphs:
  - 'Idaho has fielded proposals over the decades to replace "Famous Potatoes" with something more conventionally aspirational — "Scenic Idaho," "Great Potatoes," or phrases pointing to mountains, rivers, or outdoor recreation. Each time, the potato slogan held. The reason is partly nostalgia and partly brand logic: "Famous Potatoes" is self-aware in a way that "Scenic Idaho" is not. It makes a specific agricultural claim and commits to it without hedging.'
  - 'There is also a defensive pride at work. When Idahoans are asked whether they want to remove the potato from their plate, the answer is consistently no — not because they think potatoes are glamorous, but because the slogan is honest and the industry behind it is real. States that have replaced agricultural slogans with landscape or quality-of-life phrases often lose the identity that made them memorable. Idaho has watched that happen elsewhere and chosen not to follow.'
  - 'The potato slogan also does something subtle that most plate slogans cannot: it distinguishes Idaho from every neighboring state. Oregon, Washington, Montana, Wyoming, Nevada, and Utah all share some version of mountain, scenic, or natural greatness. "Famous Potatoes" is unambiguously Idaho. For a comparison with states that chose more conventional plate identities, see [Illinois''s "Land of Lincoln"](/states/illinois/license-plate) and [Alaska''s "The Last Frontier"](/states/alaska/license-plate).'

timeline:
- year: 1890
  description: Idaho becomes the 43rd U.S. state on July 3. Early plates carry the state name with no slogan.
- year: 1937
  description: The Idaho Potato Commission is established — the marketing infrastructure that will turn Idaho potatoes into a nationally recognized brand and eventually justify the plate slogan.
- year: '1940'
  description: Idaho marks fifty years of statehood on its passenger plate with "50 Years Statehood."
- year: '1948'
  description: A baked-potato decal is paired with "World Famous POTATOES," Idaho's first clear potato slogan on passenger plates.
- year: '1956'
  description: Idaho uses "WORLD FAMOUS POTATO" on passenger plates.
- year: 1957
  description: Idaho begins the long-running "FAMOUS POTATOES" streak on plain green-and-white plates. The same year, Idaho officially designates "The Gem State" as its nickname.
- year: 1992
  description: Idaho introduces the Scenic Idaho base, reintroducing a scenic lead while retaining "FAMOUS POTATOES" at the bottom.
- year: Present
  description: '"Famous Potatoes" remains Idaho''s standard plate slogan. The Idaho Potato Commission continues operating as one of the oldest agricultural marketing organizations in the country.'

faq:
- question: What is Idaho's license plate slogan?
  answer: Idaho's license plate slogan is "Famous Potatoes," in continuous use on the standard passenger plate since 1957. Idaho used earlier potato slogans in 1948 and 1956 before settling on the current wording.
- question: Why does Idaho's plate say "Famous Potatoes" instead of "Gem State"?
  answer: '"Gem State" is Idaho''s official nickname, adopted by the state legislature in 1957. But the same year also began the long "Famous Potatoes" plate-slogan streak, reflecting Idaho''s agricultural identity rather than its mineral one.'
- question: When did Idaho start putting "Famous Potatoes" on license plates?
  answer: Idaho first used a potato-themed plate slogan in 1948 with "World Famous POTATOES." The exact "FAMOUS POTATOES" wording began in 1957 and has remained the standard slogan since.
- question: Does Idaho grow the most potatoes in the United States?
  answer: Yes. Idaho produces roughly one-third of all potatoes grown annually in the United States — more than any other state. The Snake River Plain's volcanic soil and irrigation network create growing conditions that no other state has matched at scale.
- question: What is Idaho's official nickname if not "Famous Potatoes"?
  answer: Idaho's official nickname is "The Gem State," designated by the state legislature in 1957. The name reflects Idaho's extensive mineral deposits, including star garnets found in only two places on Earth. The nickname is covered in full on the [Idaho state nickname](/states/idaho/nickname) page.
- question: Has Idaho ever tried to change the "Famous Potatoes" slogan?
  answer: Yes. Over the decades Idaho has considered alternative slogans emphasizing mountain scenery and outdoor recreation. None replaced "Famous Potatoes" on the standard plate. The agricultural slogan consistently survives because it makes a specific, verifiable claim and because Idahoans identify with it strongly enough to resist generic replacements.
- question: What does the Idaho Potato Commission do?
  answer: The Idaho Potato Commission, established in 1937, markets Idaho potatoes nationally and administers the certification mark that legally distinguishes genuine Idaho-grown potatoes from imitations. Its work is the institutional backbone behind the "Famous Potatoes" plate slogan.

