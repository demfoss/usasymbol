faq:
- question: What is Idaho's state insect?
  answer: "Idaho's state insect is the monarch butterfly, adopted by the Idaho Legislature in 1992."
- question: When did Idaho adopt the monarch butterfly?
  answer: "Idaho adopted the monarch butterfly as its official state insect in 1992."
- question: What does Idaho's state insect look like?
  answer: "The monarch has bright orange wings crossed by black veins, with a black border dotted with white spots. It has a wingspan of about 3.5 to 4 inches."
- question: Where is the monarch butterfly found in Idaho?
  answer: "Monarchs breed in Idaho each summer, mainly in the southern part of the state, wherever milkweed grows along rivers, canals, and open fields."
- question: Do Idaho's monarchs migrate to Mexico?
  answer: "No. Idaho's monarchs are part of the western monarch population, which migrates to overwintering sites along the California coast rather than to central Mexico like eastern monarchs."
- question: Is the monarch a butterfly, bee, beetle, or dragonfly?
  answer: "It is a butterfly, easily recognized by its orange-and-black wings and long-distance migration."

