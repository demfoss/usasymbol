sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Idaho?
  paragraphs:
  - "The monarch butterfly, Danaus plexippus, is Idaho's official state insect. The Idaho Legislature designated it in 1992."
  - "Idaho monarchs breed in the state each summer and belong to the western monarch population, a group that behaves differently from the better-known eastern monarchs."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Monarch Butterfly
  paragraphs:
  - "A monarch has bright orange wings crossed by thick black veins, with a black border dotted with two rows of small white spots. Males have a small black scent patch on each hind wing that females lack."
  - "Adult monarchs have a wingspan of about 3.5 to 4 inches."
  - "Monarch caterpillars are banded in white, yellow, and black, and feed only on milkweed. That single food source is why milkweed plants matter so much to the species."

- id: history
  icon: fa-solid fa-landmark
  title: How Idaho Chose the Monarch Butterfly
  paragraphs:
  - "The Idaho Legislature designated the monarch butterfly as the official state insect in 1992."
  - "The monarch was already a familiar summer visitor across Idaho, recognized wherever milkweed grows."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Monarch Butterfly in Idaho
  paragraphs:
  - "Monarchs breed in Idaho during the summer, laying eggs on milkweed found along rivers, irrigation canals, and open fields, mostly in the southern part of the state."
  - "Idaho's monarchs are part of the western monarch population. In fall, they head toward overwintering sites along the California coast, unlike eastern monarchs, which migrate to central Mexico."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Monarch Butterfly Facts
  facts:
  - "Adopted: 1992, by the Idaho Legislature."
  - "Scientific name: Danaus plexippus."
  - "Wingspan: about 3.5 to 4 inches, with bright orange wings, black veins, and white-spotted black borders."
  - "Idaho monarchs belong to the western population, which overwinters along the California coast rather than in Mexico."
  - "Caterpillars feed only on milkweed, so Idaho monarchs are found wherever milkweed grows."




