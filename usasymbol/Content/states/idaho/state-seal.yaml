sections:
- id: history
  icon: fa-solid fa-landmark
  title: Idaho State Seal History and Origin
  paragraphs:
  - 'Idaho became a state on July 3, 1890. The new state legislature needed an official seal and announced a public design competition. Emma Edwards Green, an artist based in Boise, submitted the winning entry in 1890, and the legislature officially adopted the seal on March 14, 1891.'
  - "Green's win made her the only woman in U.S. history to design a state seal. She later said that she chose a woman as the central figure to represent Justice and the importance of women in the new state. The legislature accepted the design with no major alterations."
  - "The seal's core composition has remained recognizable since 1891, but Idaho did adopt an official revised copy in 1957. That update, prepared by Paul B. Evans and Caxton Printers, clarified the figures and landscape while preserving Emma Edwards Green's overall arrangement and symbolism."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Idaho State Seal Symbols Mean
  paragraphs:
  - "Emma Edwards Green packed the Idaho seal with specific references to the state's geography, economy, and founding aspirations."
  elements:
  - id: justice
    name: Justice (Female Figure)
    image: /images/state-seals/idaho/elements/justice.webp
    paragraphs:
    - "The female figure of Justice stands to the left of the central shield, holding scales in one hand and a liberty cap on a pole in the other. Green placed her in the dominant position of the composition, making Justice the first thing a viewer's eye reaches."
    - "Green's choice to center a woman on the seal was a statement. Idaho was one of a small number of western states where women had already gained voting rights — Idaho women received the right to vote in 1896, just five years after the seal was adopted. The figure of Justice both represents the legal order of the new state and acknowledges the role of women in it."
  - id: miner
    name: Miner
    image: /images/state-seals/idaho/elements/miner.webp
    paragraphs:
    - "A miner stands to the right of the shield, holding a pick. He represents the silver and gold mining industry that drew settlers to Idaho in the 1860s and remained central to the state's economy at the time of statehood in 1890."
    - "The Coeur d'Alene silver mines in northern Idaho were among the most productive in the world by 1891. Placing a miner on the seal directly acknowledged that mining — not farming or timber — was Idaho's primary economic engine at the moment the state was founded."
  - id: shield
    name: Central Shield
    image: /images/state-seals/idaho/elements/shield.webp
    paragraphs:
    - 'The shield at the center of the seal is divided into two parts. The upper section shows the Shoshone Falls on the Snake River, a natural feature sometimes called the "Niagara of the West" for its width and drop. The lower section shows a pine tree — the western white pine, Idaho''s state tree — and a sheaf of grain representing agriculture.'
    - "The Snake River appears on the seal because it is Idaho's defining geographic feature. The river drains most of southern Idaho, forms much of the Oregon border, and its canyon and falls were among the most dramatic landscapes encountered by settlers on the Oregon Trail, which passed through the region."
  - id: elk-head
    name: Elk Head
    image: /images/state-seals/idaho/elements/elk-head.webp
    paragraphs:
    - "An elk head with full antlers appears above the shield. It represents Idaho's wildlife and the importance of hunting and trapping to the state's early economy and identity."
    - "Idaho had — and retains — one of the largest elk populations in the continental United States. The elk's placement at the top of the composition gives it structural prominence, balancing the human figures below."
  - id: cornucopia-grain
    name: Cornucopia and Sheaf of Grain
    image: /images/state-seals/idaho/elements/cornucopia-grain.webp
    paragraphs:
    - "Below the shield, a cornucopia (horn of plenty) appears on the left and a sheaf of grain on the right. They flank the motto ribbon and together represent Idaho's agricultural potential, which the state's founders hoped would develop alongside mining."
    - "By 1891, irrigation projects along the Snake River Plain were beginning to demonstrate that Idaho's southern desert could support grain and potato farming at commercial scale. The cornucopia and grain on the seal reflect that calculation: mining was the engine of 1890, but agriculture was the bet on the future."
  - id: esto-perpetua
    name: Esto Perpetua (State Motto)
    image: /images/state-seals/idaho/elements/esto-perpetua.webp
    paragraphs:
    - '*Esto Perpetua* is Latin for "Let it be perpetual." The phrase is attributed to Pietro Sarpi (1552–1623), a Venetian monk, scientist, and statesman who reportedly spoke it on his deathbed, wishing perpetuity for the Republic of Venice.'
    - "How the phrase reached Idaho's seal is not fully documented, but it was likely chosen for its civic resonance — a wish for the permanence of the new state's institutions — rather than for any specific connection to Sarpi or Venice. It is found on no other U.S. state seal."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Idaho State Seal'
  paragraphs:
  - 'Idaho used territorial seals before statehood, then adopted Emma Edwards Green''s state seal in 1891. The best-known later change came in 1957, when the legislature authorized an updated official copy that refined the drawing while preserving the basic composition.'
