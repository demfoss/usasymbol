meaning: "Idaho's state seal is the only U.S. state seal designed by a woman. Emma Edwards Green won a public design competition in 1890 and placed a female figure of Justice at the center of the composition — a deliberate choice that made Idaho's seal unlike any other in the country. The seal also shows a miner, a pine tree, the Snake River, and the Shoshone Falls, grounding the design in Idaho's specific geography and economy at the moment of statehood."
