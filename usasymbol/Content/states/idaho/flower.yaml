seo_title: "Idaho State Flower | Syringa"
seo_description: "Idaho made the Syringa its official state flower in 1931. This fragrant white shrub grows wild in Idaho's canyons and mountain slopes."

intro_text: "Idaho made the Syringa its official state flower in 1931. This white flowering shrub grows wild throughout Idaho's canyons and mountainsides. The Syringa produces clusters of fragrant blossoms each spring across the state's diverse landscapes and pairs seasonally with sightings of [Idaho's state bird, the Mountain Bluebird](/states/idaho/bird/mountain-bluebird)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Idaho State Flower?"
    paragraphs:
      - "Official since 1931, the Syringa represents Idaho. Each flower displays four white petals arranged in a simple cross shape. The blooms measure about 1 to 2 inches across. Flowers grow in loose clusters containing 5 to 15 individual blossoms. A sweet fragrance similar to orange blossoms fills the air during peak blooming."
      - "Syringa shrubs bloom from late May through July across Idaho. Lower elevations see earlier blooms than mountain areas. Peak flowering occurs in June throughout most of the state. The shrub reaches heights of 3 to 10 feet. Multiple stems arch outward from the base. The plant produces oval leaves with smooth edges that turn yellow in fall."
      - "This native shrub grows wild in canyons, along streams, and on mountain slopes. Idaho's forests and foothills provide ideal habitat. The plant tolerates dry conditions once established. Well-drained soil suits Syringa best. The shrub grows from sea level to elevations around 7,000 feet across Idaho's varied terrain, including forest regions associated with [Idaho's state tree, the Western White Pine](/states/idaho/tree/western-white-pine)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Idaho State Flower Name"
    paragraphs:
      - "Known as Syringa, this flower's scientific designation is Philadelphus lewisii. The plant belongs to the Hydrangeaceae family. This family includes hydrangeas and mock oranges along with about 170 species of flowering shrubs worldwide."
      - "The genus name Philadelphus means brotherly love in Greek. The species name lewisii honors Meriwether Lewis of the Lewis and Clark Expedition. Lewis collected specimens of this shrub during the expedition's journey through Idaho in 1806. He recognized it as a new species and preserved samples for scientific study."
      - "People commonly call this plant mock orange because its fragrance resembles orange blossoms. Idaho residents typically use the name Syringa. Some confusion exists because true syringa refers to lilac bushes. Idaho's Syringa is not related to lilacs despite sharing the common name. The scientific name Philadelphus lewisii avoids this confusion."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Idaho Chose the Syringa"
    paragraphs:
      - "Idaho's legislature declared the Syringa the official state flower in 1931. A statewide vote among school children preceded the official designation. Students throughout Idaho participated in selecting their favorite native flower. The Syringa won this vote by a clear margin over competing flowers, and similar adoption histories are gathered on the [list of U.S. state flowers](/symbols/flowers)."
      - "Idaho wanted a native flower that grew abundantly throughout the state. The Syringa met this requirement perfectly. Native Americans had used the shrub's wood for arrow shafts and other tools. Early settlers admired the fragrant blooms. The connection to Lewis and Clark added historical significance."
      - "Women's clubs and garden societies supported the Syringa selection. They promoted native plants over imported garden flowers. The legislature received the children's vote results and quickly passed the designation. No significant opposition emerged during the process. Idaho formalized the Syringa as state flower on February 5, 1931."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Idaho State Flower Facts"
    facts:
      - "The Syringa grows naturally from British Columbia south through Idaho to northern California, thriving in mountainous regions of the Pacific Northwest"
      - "Native Americans used Syringa wood for making arrows, pipe stems, and snowshoe frames because the wood is hard and straight-grained"
      - "Idaho adopted the Syringa on February 5, 1931, following a statewide vote by school children who selected it as their favorite native flower"
      - "Meriwether Lewis collected the first scientific specimens of this plant in 1806 during the Lewis and Clark Expedition's journey through Idaho"
      - "The Syringa produces nectar that attracts butterflies, bees, and hummingbirds during its blooming period in late spring and early summer"
      - "Despite its common name, Idaho's Syringa is not related to lilac bushes which belong to the genus Syringa in a completely different plant family"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Idaho State Flower and Bird"
    paragraphs:
      - "The Mountain Bluebird serves as Idaho's state bird, a small songbird with brilliant blue plumage. Both symbols represent Idaho officially. Idaho adopted the Syringa in 1931 and designated the Mountain Bluebird as state bird in 1931 during the same legislative session."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Syringa Symbolizes"
    paragraphs:
      - "The Syringa commonly represents Idaho's pioneer heritage and connection to western exploration. The flower has been linked to the Lewis and Clark Expedition's historic journey through Idaho territory. Its hardy nature frequently represents the resilience of Idaho's early settlers who established communities in challenging terrain, a lasting identity often summarized by [Idaho's nickname, the Gem State](/states/idaho/nickname/the-gem-state)."

  - id: "regional-context"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Context"
    paragraphs:
      - "Idaho's varied blooming zones are easier to understand in interstate context, especially when comparing mountain, basin, and plateau environments across [States Neighboring States](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Idaho's state flower?"
    answer: "Idaho's state flower is the Syringa, a white flowering shrub with fragrant blossoms that grows wild throughout the state's canyons and mountains."
  
  - question: "When did Idaho adopt the Syringa as its state flower?"
    answer: "Idaho adopted the Syringa on February 5, 1931. The designation followed a statewide vote by school children who selected it as their favorite native flower."
  
  - question: "Why did Idaho choose the Syringa?"
    answer: "Idaho chose the Syringa because it grows abundantly throughout the state and is native to Idaho. The connection to Meriwether Lewis who collected specimens during the Lewis and Clark Expedition added historical significance. School children voted for it over competing native flowers."
  
  - question: "Is the Syringa the same as lilac?"
    answer: "No, Idaho's Syringa is not related to lilac bushes despite sharing the common name. True syringa refers to lilacs which belong to a different plant family. Idaho's Syringa is a mock orange with the scientific name Philadelphus lewisii."
  
  - question: "When does the Syringa bloom in Idaho?"
    answer: "The Syringa blooms from late May through July in Idaho, with peak flowering occurring in June. Lower elevations see earlier blooms than mountain areas where the shrub grows at elevations up to 7,000 feet."

