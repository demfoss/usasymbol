seo_title: "Idaho State Flag: Meaning, Seal & Emma Edwards Green, History"
seo_description: "Find the story behind Idaho's flag, from adoption and symbolism to the official way Idaho describes its colors."

intro_text: "In 1907, Idaho adopted a flag that features the state seal on a blue field. A red and gold banner reading State of Idaho appears below the seal. The design traces back to the battle flag carried by the First Idaho Infantry during the Spanish-American War, and the banner repeats the long-lived language of [Idaho's state motto, Esto Perpetua](/states/idaho/motto/esto-perpetua)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Idaho State Flag Is Designed"
    paragraphs:
      - "The Idaho state flag is the official civic flag of Idaho. A field of blue covers the entire flag. The state seal appears in full color at the center, and the design is indexed with other official banners on the [list of U.S. state flags](/symbols/flags)."
      - "Below the seal sits a red banner with gold borders. The words State of Idaho appear in gold letters. A gold fringe borders the flag edges."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Idaho Flag Communicates"
    paragraphs:
      - "The Idaho state flag represents the state's natural resources and industries. The seal depicts mining, agriculture, and forestry as the chief economic activities at statehood, which also align with themes behind [Idaho's nickname, the Gem State](/states/idaho/nickname/the-gem-state)."
      - "A woman and a miner support the shield. The woman represents liberty, justice, and equality. The miner represents Idaho's mining industry. The two figures stand at equal height, reflecting women's suffrage discussions in the 1890s."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Idaho Flag History and Adoption"
    paragraphs:
      - "Idaho became the 43rd state on July 3, 1890. The First Legislature sponsored a design competition for the state seal in 1891. Emma Edwards Green won unanimously. She became the first and only woman to design a U.S. state seal, a statehood period also covered in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "During the Spanish-American War, the First Idaho Infantry received a regimental flag with the state seal centered on a blue field. The regiment carried this flag to the Philippines in 1899."
      - "The legislature passed an act on March 12, 1907, creating a state flag. The design honored the First Idaho Infantry by using their battle flag, replacing the regiment's name with State of Idaho. In 1957, Paul B. Evans revised the seal to add more detail. This version was approved on March 1, 1957."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Idaho Flag"
    symbols:

      - id: state-seal
        name: "Idaho State Flag Seal"
        image: "symbols/state-seal.png"
        paragraphs:
          - "The Idaho state flag features the Great Seal of the State of Idaho at its center. The seal combines symbolic figures, text, and imagery depicting Idaho's key industries and natural scenery, including symbols later reflected in [Idaho's state flower, the Syringa](/states/idaho/flower/syringa)."
          - "A woman and a miner support the shield. The woman represents justice and equality, while the miner holds a pick and shovel, symbolizing Idaho's mining industry."
          - "The shield displays natural and economic resources. A pine tree represents timber, a farmer plowing represents agriculture, and a sheaf of grain sits beneath the shield."
          - "Two cornucopias symbolize horticulture, while an elk's head above the shield represents wildlife protection. The river depicted is commonly identified as the Snake River."
          - "The outer ring bears the text Great Seal of the State of Idaho and a star representing a new light in the galaxy of states. The Latin motto Esto perpetua appears within the design, meaning Let it be perpetual."

      - id: banner
        name: "Idaho State Flag Banner"
        image: "symbols/banner.svg"
        paragraphs:
          - "A red banner with gold borders sits below the seal. The words State of Idaho appear in gold letters."
          - "This banner replaced the regiment's name from the original battle flag. It distinguishes the state flag from the military banner."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Idaho State Flag Colors"
    paragraphs:
      - "The Idaho state flag uses blue as the primary field color. The state seal adds multiple supporting colors. Idaho statute does not provide exact Cable or Pantone values."
    colors:
      - name: "Blue"
        hex: "#003776"
      - name: "Red"
        hex: "#EF1439"
      - name: "Gold"
        hex: "#FFB32B"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Green"
        hex: "#36E218"
      - name: "Brown"
        hex: "#C5792C"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Idaho State Flag Facts"
    facts:
      - "Idaho officially adopted its flag on March 12, 1907"
      - "Emma Edwards Green designed the seal in 1891, the only woman to design a U.S. state seal"
      - "The First Idaho Infantry carried a battle flag version in 1899"
      - "Paul B. Evans revised the seal in 1957"
      - "The flag has unique proportions of 26:33"
      - "The flag ranked 64th out of 72 in a 2001 NAVA survey"

faq:
  - question: "What design is recognized as the state flag of Idaho?"
    answer: "The state flag of Idaho is the official banner of Idaho, featuring the state seal centered on a blue field with a red and gold banner reading State of Idaho below."

  - question: "What does Idaho's flag look like?"
    answer: "The Idaho flag shows a blue background with the state seal in the center. Below the seal is a red banner with gold borders displaying State of Idaho in gold letters."

  - question: "What meaning is attached to Idaho's flag?"
    answer: "The seal represents Idaho's natural resources and industries: mining, agriculture, and forestry. The woman represents justice and equality. The miner represents the mining industry."

  - question: "What are the key symbols on Idaho's flag?"
    answer: "The seal shows a woman and miner supporting a shield. The shield contains a pine tree, farmer plowing, grain, cornucopias, an elk's head, and a river. The motto Esto perpetua appears on a banner."

  - question: "When did Idaho adopt its current state flag?"
    answer: "Idaho officially adopted its state flag on March 12, 1907. The seal was revised on March 1, 1957."

