faq:
  - question: What is Idaho's state dance?
    answer: "Idaho's official state American folk dance is square dance, adopted in 1989."
  - question: When did Idaho adopt square dance as its state dance?
    answer: "Idaho adopted square dance as its official state American folk dance in 1989."
  - question: Why did Idaho choose square dance?
    answer: "Square dance was already central to social life in Idaho's grange halls and farming communities, and it fit a national movement of states naming it their official folk dance."
  - question: Is square dance the same in every state?
    answer: "The core formation and calls are shared nationally, but many states, including Idaho, adopted square dance through the same 1970s-1990s campaign, so the exact designation and local traditions vary by state."

