sections:
  - id: overview
    icon: fa-solid fa-music
    title: Idaho State Dance
    paragraphs:
      - "Idaho named square dance its official state American folk dance in 1989. The designation recognized a caller-led dance that had already anchored social life in the state's grange halls and farming communities for decades."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples in a square, each pair facing the center from its own side. A caller directs the group through a sequence of figures, so dancers follow spoken instructions rather than a memorized routine."
      - "Music comes from a string band built around fiddle, guitar, and banjo, with the caller's voice layered over the rhythm. Figures alternate between whole-square movements involving all eight dancers and partner-specific figures."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand in a square, each facing the center, with partners side by side on their own side."
      - title: "Honor Your Partner and Corner"
        description: "Bow or nod first to your partner and then to your corner as the music begins."
      - title: "Circle Left and Right"
        description: "Join hands as a full square and move together in a circle, first left and then right, on the caller's cue."
      - title: "Do-Si-Do with Your Partner"
        description: "Walk around your partner back to back without turning to face them, then return to your original spot."
      - title: "Allemande Left and Promenade"
        description: "Turn your corner with a left-hand grip, then walk your partner around the square side by side to finish the figure."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Idaho
    paragraphs:
      - "Square dance spread through Idaho's rural communities as grange halls and farming settlements used it as a regular social gathering that required no formal training to join. A caller could teach the figures to newcomers in a single evening, which kept the dance accessible across small towns."
      - "Idaho's adoption also aligned with a broader national movement in the 1970s through 1990s, when square-dance callers' associations and folk-dance organizations urged state legislatures to name square dance an official folk dance."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Idaho's State Dance
    paragraphs:
      - "The Idaho Legislature designated square dance the state's official American folk dance in 1989."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Idaho adopted square dance as its official state American folk dance in 1989."
      - "The dance is led by a caller who directs eight dancers arranged in a square of four couples."
      - "Idaho's square-dance tradition grew out of grange halls and homestead-era community gatherings."
      - "Square dance is typically danced to string-band music built around fiddle, guitar, and banjo."

