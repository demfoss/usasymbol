sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Idaho's State Fruit?"
    paragraphs:
      - "The huckleberry is Idaho's official state fruit, designated by the Idaho Legislature in 2000. Huckleberries grow wild in the mountain forests of north and central Idaho and are not commercially farmed."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Huckleberry"
    paragraphs:
      - "Huckleberries are small, dark purple berries similar in appearance to blueberries but with a tarter, more intense flavor. They grow on low shrubs in high-elevation forests and ripen in late summer, and cannot be successfully cultivated on farms, so nearly all huckleberries are hand-picked in the wild."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Huckleberry Became Idaho's State Fruit"
    paragraphs:
      - "The Idaho Legislature designated the huckleberry the official state fruit in 2000."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Idaho Chose the Huckleberry"
    paragraphs:
      - "Huckleberry picking is a long-standing tradition in Idaho's mountain communities, and the berry is featured in local foods from jams to pies, especially in north Idaho towns near the forests where it grows."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Huckleberry Facts"
    facts:
      - "Adopted as Idaho's state fruit in 2000."
      - "Huckleberries grow wild and cannot be commercially farmed like most fruit."
      - "Huckleberries typically ripen in Idaho in late summer."

