faq:
  - question: "What is Idaho's state fruit?"
    answer: "Idaho's state fruit is the huckleberry, adopted by the Idaho Legislature in 2000."
  - question: "When did Idaho adopt the huckleberry as its state fruit?"
    answer: "The Idaho Legislature designated the huckleberry the official state fruit in 2000."
  - question: "Why did Idaho choose the huckleberry?"
    answer: "Huckleberry picking is a long-standing tradition in Idaho's mountain communities, where the wild berry grows in forests and is used in local cooking."
  - question: "Is the huckleberry grown or gathered in Idaho today?"
    answer: "Huckleberries cannot be commercially farmed, so they are still hand-picked wild in Idaho's forests each summer."

