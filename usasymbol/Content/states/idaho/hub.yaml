name_meaning:
  heading: What Does Idaho Mean?
  paragraphs:
  - Idaho is the 43rd U.S. state, admitted to the Union on July 3, 1890. The name is famous partly because its origin story is disputed.
  - A popular explanation says Idaho came from a Native American phrase meaning "gem of the mountains" or "light on the mountains." Historical research treats that story carefully because the name appears to have been promoted in the 1860s before anyone could verify the supposed Indigenous source.
  - Idaho's official nickname is the Gem State, which fits the state's mining history even if the name Idaho itself does not have a securely proven gem-related meaning. Its postal abbreviation is ID, and residents are Idahoans.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Disputed; the commonly repeated Native-language explanation is not securely documented.
    - label: Popular claim
      text: Often said to mean gem of the mountains or light on the mountains, but that explanation should be treated as folklore.
    - label: Statehood
      text: Idaho became the 43rd state on July 3, 1890.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Idaho, a Mountain West state known for mining, forests, agriculture, and the Snake River Plain.
    - label: Territory
      text: Idaho Territory was created in 1863 before statehood in 1890.
    - label: People
      text: People from Idaho are called Idahoans.
    - label: Name caution
      text: The name's uncertain origin is part of Idaho history and should not be simplified into one confident translation.
  - heading: Nicknames and Short Forms
    items:
    - label: Gem State
      text: Official nickname tied to Idaho's mineral variety and mining history.
    - label: Potato State
      text: Informal nickname from Idaho's nationally recognized potato industry.
    - label: Spud State
      text: Casual version of the potato nickname.
    - label: Abbreviation
      text: ID; older short form Ida.
editorial:
  heading: What Idaho's Symbols Say About the State
  paragraphs:
  - Idaho's [state flag](/states/idaho/flag) is dominated by the state seal, and the seal matters because Emma Edwards Green designed it in 1891. Mining, forestry, agriculture, the Snake River, and equality imagery all sit inside one crowded but historically specific emblem.
  - "The [mountain bluebird](/states/idaho/bird), [syringa](/states/idaho/flower), and [western white pine](/states/idaho/tree) give Idaho a more ecological identity: open high country, fragrant canyon shrubs, and northern timber forests shaped by disease and recovery."
  - The [Appaloosa](/states/idaho/mammal/appaloosa-horse) gives Idaho one of its strongest non-flag symbols. It connects the state to Nez Perce horsemanship, the Palouse region, the 1877 war, and the modern breed registry in Moscow, Idaho.
faq:
- question: What is Idaho's most famous state symbol?
  answer: The [Appaloosa horse](/states/idaho/mammal/appaloosa-horse) is one of Idaho's strongest symbols because the breed is tied to the Nez Perce people, the Palouse region, and Idaho's modern horse heritage.
- question: What is Idaho's state bird?
  answer: Idaho's state bird is the [mountain bluebird](/states/idaho/bird), adopted in 1931.
- question: What is Idaho's state flower?
  answer: Idaho's state flower is [syringa](/states/idaho/flower), a native mock orange shrub adopted in 1931.
- question: Does Idaho really mean gem of the mountains?
  answer: The phrase gem of the mountains is widely repeated, but the origin of Idaho is disputed and that translation is not securely proven. The [Idaho nickname](/states/idaho/nickname) page covers the Gem State identity separately.
- question: How many official state symbols does Idaho have?
  answer: Idaho's state symbols list here includes the seal-based flag, mountain bluebird, syringa, western white pine, motto, colors, nickname, and Appaloosa horse.
