seo_description: "Idaho state symbols: official state symbols include the mountain bluebird, syringa, western white pine, Appaloosa horse, and Esto Perpetua motto."
snippet_answer: The mountain bluebird, syringa, and western white pine are Idaho's most recognized official state symbols. The Appaloosa horse, Esto Perpetua motto, and star garnet — found in only two places in the world — make Idaho's list unusually distinctive among state symbols collections.
