seo_title: Idaho State Fish | Cutthroat Trout
seo_description: The Idaho state fish is the cutthroat trout, adopted in 1990. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/idaho/idaho-fish-hero.webp
hero_image_alt: A cutthroat trout with an olive green back, yellow-brown sides, and a red-orange slash under its lower jaw.
hero_image_caption: The cutthroat trout is Idaho's state fish and is native to the state's rivers, streams, and lakes.
intro_text: Idaho's state fish is the cutthroat trout, a native trout named for the red-orange slash under its jaw, adopted in 1990. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Idaho?
  paragraphs:
  - The cutthroat trout is the official state fish of Idaho. The Idaho Legislature made it the state fish in 1990, and its scientific name is Oncorhynchus clarkii.
  - It is one of three trout native to Idaho. The other two are the rainbow trout and the bull trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Cutthroat Trout
  paragraphs:
  - The cutthroat trout gets its name from a red to orange slash on the underside of its lower jaw. That mark is the easiest way to recognize it.
  - Its back can be steel gray to olive green. Its sides may be yellow brown, with red or pink along the belly.
  - Its scientific name honors William Clark of the Lewis and Clark expedition, who wrote detailed descriptions of cutthroat trout in the Columbia River.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In 1990, a class of fourth graders from Kuna, Idaho, came up with the idea of a state fish and took it to state lawmakers.
  - The Idaho Legislature passed the bill, and Governor Cecil Andrus approved it on April 5, 1990. That made the cutthroat trout Idaho's official state fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Idaho Chose the Cutthroat Trout
  paragraphs:
  - State lawmakers said the cutthroat trout is the fish that best represents all Idaho waters and anglers. They pointed to its history as the first salmon or trout in Idaho and as a key food source for early Idahoans.
  - The fish is sensitive to polluted or damaged habitat, so lawmakers called it a good measure of environmental quality. They hoped naming it the state fish would build public support for protecting Idaho's waters.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Cutthroat Trout
  paragraphs:
  - Cutthroat trout are native to northern and eastern Idaho. They live in small mountain streams, large rivers, and lakes.
  - In the Idaho Panhandle, westslope cutthroat trout live in big lakes like Priest Lake and in rivers like the North Fork Coeur d'Alene River.
