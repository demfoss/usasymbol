- id: facts
  icon: fa-solid fa-lightbulb
  title: Cutthroat Trout Facts
  facts:
  - Adopted in 1990 by the Idaho Legislature.
  - Scientific name is Oncorhynchus clarkii.
  - Named for the red to orange slash under its lower jaw.
  - The Lewis and Clark expedition first saw cutthroat trout near the Great Falls of the Missouri River in 1805.
  - In 2020, an angler set a state catch-and-release record with a 21-inch westslope cutthroat.
faq:
- question: What is Idaho's state fish?
  answer: Idaho's state fish is the cutthroat trout. It is a native trout with a red to orange slash under its lower jaw.
- question: When did Idaho adopt the Cutthroat trout?
  answer: The Idaho Legislature made the cutthroat trout the state fish in 1990. The governor approved it on April 5, 1990.
- question: Why did Idaho choose the Cutthroat trout?
  answer: Lawmakers said it best represents Idaho's waters and anglers. They also pointed to its history in Idaho and to how it shows whether streams and lakes are healthy.
- question: Who suggested the cutthroat trout as Idaho's state fish?
  answer: A class of fourth graders from Kuna, Idaho, came up with the idea in 1990 and took it to state lawmakers.
- question: Why is it called a cutthroat trout?
  answer: It has a red to orange slash on the underside of its lower jaw. From a distance, the mark looks like a cut on its throat.
