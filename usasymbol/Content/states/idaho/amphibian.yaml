hero_image_caption: "The Idaho giant salamander, Idaho's state amphibian, is found only in the state's northern forests."
intro_text: "Idaho's state amphibian is the Idaho giant salamander, a large salamander found only in the state's northern mountain streams, adopted in 2015. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Idaho?
    paragraphs:
      - "The Idaho giant salamander is Idaho's official state amphibian, designated by the Idaho Legislature in 2015. Its scientific name is Dicamptodon aterrimus."
      - "It is found only in north-central Idaho and adjoining parts of Montana, making it a species closely tied to the region."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Idaho Giant Salamander
    paragraphs:
      - "The Idaho giant salamander has smooth, mottled brown and black skin and a thick body built for life in cold mountain streams and moist forest floors."
      - "It is one of the largest land-capable salamanders in North America, with adults sometimes reaching close to a foot long."
      - "Young salamanders live in streams and breathe through feathery gills, while some adults move onto land and breathe with lungs."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Idaho Legislature designated the Idaho giant salamander the official state amphibian in 2015, following a campaign led by Idaho students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Idaho Chose the Idaho Giant Salamander
    paragraphs:
      - "The Idaho giant salamander is found only in a limited area of north-central Idaho and nearby Montana, making it one of the few amphibians closely tied to the state by name and range."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Idaho Giant Salamander
    paragraphs:
      - "The Idaho giant salamander lives in cold, clear mountain streams and moist forests of north-central Idaho, including the forested mountains near the Clearwater River."
    sites:
      - name: Clearwater Mountains
        city: Orofino
        lat: 46.48
        lng: -116.25
        note: "Forest stream habitat for the species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Idaho Giant Salamander Facts
    facts:
      - "Adopted in 2015 by the Idaho Legislature."
      - "Scientific name is Dicamptodon aterrimus."
      - "Found only in north-central Idaho and nearby Montana."
      - "Can grow to nearly a foot long, large for a salamander."
      - "Young live in streams with gills before some move onto land."

