faq:
  - question: "What is Idaho's state horse?"
    answer: "Idaho's state horse is the Appaloosa (Equus caballus), designated in 1975 through House Bill 195. The Appaloosa is a distinctive spotted breed developed by the Nez Perce tribe in north-central Idaho."

  - question: "When was the Appaloosa designated as Idaho's state horse?"
    answer: "The Appaloosa became Idaho's official state horse on March 25, 1975, when the legislature passed House Bill 195 recognizing the breed's historical connection to Idaho and the Nez Perce people."

  - question: "Why did Idaho choose the Appaloosa as its state horse?"
    answer: "Idaho chose the Appaloosa because the breed was developed by the Nez Perce tribe in Idaho's Palouse River region, nearly became extinct following the Nez Perce War of 1877, and was revived by Idaho residents who established the international breed registry in Moscow, Idaho in 1938. No other horse breed has such deep historical ties to Idaho."

  - question: "What makes an Appaloosa horse distinctive?"
    answer: "Appaloosas are known for spotted coat patterns including leopard, blanket, and snowflake designs. Beyond coat patterns, registered Appaloosas must display specific breed characteristics: mottled skin visible around eyes and muzzle, white sclera around the colored iris, and often striped hooves. These traits define the breed regardless of coat spotting intensity."

  - question: "Where can I see Appaloosa horses in Idaho?"
    answer: "You can visit the Appaloosa Museum and Heritage Center in Moscow, Idaho, which documents breed history and Nez Perce horsemanship. Appaloosas are common at ranches, riding stables, and horse shows throughout Idaho. The Nez Perce Horse Registry on the Nez Perce Reservation also maintains breeding programs demonstrating traditional horsemanship."

  - question: "Did the Nez Perce create the Appaloosa breed?"
    answer: "Yes, the Nez Perce developed the Appaloosa through sophisticated selective breeding programs beginning in the early 1700s. They acquired horses descended from Spanish stock and selectively bred for intelligence, endurance, and distinctive spotted patterns. This selective breeding created the Appaloosa as a distinct type, making the Nez Perce the breed's creators."

  - question: "What happened to Appaloosa horses after the Nez Perce War?"
    answer: "After defeating the Nez Perce in 1877, the U.S. Army confiscated approximately 1,100 horses from the tribe. The army sold prime horses at auction, distributed others to settlers, and killed many remaining animals. This destroyed the Nez Perce breeding program and nearly eliminated the Appaloosa breed. Scattered spotted horses survived across the Northwest but no organized breeding program existed until Claude Thompson founded the Appaloosa Horse Club in 1938."

  - question: "How many Appaloosa horses exist today?"
    answer: "Over 600,000 Appaloosas are registered worldwide through the Appaloosa Horse Club in Moscow, Idaho. The breed has become one of the most popular horse breeds in the United States, representing a remarkable recovery from near-extinction in the late 1800s."

