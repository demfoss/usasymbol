sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Idaho's State Vegetable?"
    paragraphs:
      - "The potato is Idaho's official state vegetable, designated by the Idaho Legislature in 2002. Idaho is the leading potato-growing state in the country, and the crop appears on the state's license plates and in its nickname."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Potato"
    paragraphs:
      - "Potatoes are starchy root vegetables grown underground and harvested in the fall. Idaho's volcanic soil, cool nights, and irrigation from the Snake River Plain create growing conditions well suited to russet potatoes, the variety most associated with the state."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Potato Became Idaho's State Vegetable"
    paragraphs:
      - "The Idaho Legislature designated the potato the official state vegetable in 2002, formally recognizing a crop that had already defined the state's agricultural reputation for over a century."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Idaho Chose the Potato"
    paragraphs:
      - "Idaho grows more potatoes than any other state, thanks to its volcanic soil and irrigated farmland along the Snake River Plain. The crop is central to the state's farm economy and its national image, making the potato an obvious choice for the designation."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Potato Comes From in Idaho"
    paragraphs:
      - "Most of Idaho's potatoes are grown in the Snake River Plain region of southern Idaho, where irrigated, volcanic soil supports large-scale potato farming around towns such as Idaho Falls and Blackfoot."
    sites:
      - name: Snake River Plain
        city: Idaho Falls
        lat: 43.4917
        lng: -112.0339
        note: "Major potato-growing region of southern Idaho"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Potato Facts"
    facts:
      - "Adopted as Idaho's state vegetable in 2002."
      - "Idaho grows more potatoes than any other U.S. state."
      - "Most Idaho potatoes are grown in the irrigated Snake River Plain region."
      - "The russet is the potato variety most associated with Idaho."

