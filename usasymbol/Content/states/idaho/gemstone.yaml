faq:
  - question: What is Idaho's state gem?
    answer: "Idaho's state gem is the star garnet, a dark purple almandine-pyrope garnet that shows a four-rayed star when cut and polished."
  - question: When did Idaho adopt star garnet as its state gem?
    answer: "The Idaho Legislature designated star garnet the official state gem in 1967."
  - question: Why did Idaho choose star garnet?
    answer: "Gem-quality star garnet is confirmed in meaningful quantity in only two places on Earth, Idaho and India, making it a rare stone tied directly to the state's Gem State nickname."
  - question: Where can you find star garnet in Idaho?
    answer: "The Emerald Creek Garnet Area near St. Maries, in the Idaho Panhandle National Forests, is Idaho's main source. The U.S. Forest Service runs a public fee-digging site there each summer."

