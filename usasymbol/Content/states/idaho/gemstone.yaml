seo_title: "Idaho State Gem | Star Garnet"
seo_description: "Idaho's state gem is the star garnet, adopted in 1967. It is found in only two places on Earth: Idaho's Emerald Creek and parts of India."
hero_image: /images/gemstones/idaho/idaho-state-gem-hero.webp
