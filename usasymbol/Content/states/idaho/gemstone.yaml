hero_image_caption: "Star garnet, Idaho's official state gem, shows a four-rayed star when cut into a rounded cabochon."
intro_text: "Idaho's state gem is the star garnet, adopted in 1967 to recognize a stone found almost nowhere else on Earth besides the Emerald Creek area of the Idaho Panhandle. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Idaho State Gem
    paragraphs:
      - "Star garnet is Idaho's official state gem, designated by the Idaho Legislature in 1967. It is a variety of almandine-pyrope garnet that shows a visible star of reflected light when cut and polished, a trait known as asterism."
      - "Idaho earned its nickname, the Gem State, largely because of this stone. Gem-quality star garnet has been confirmed in significant quantity in only two places on Earth, and Idaho is one of them."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Star Garnet?"
    paragraphs:
      - "Star garnet is dark purple to plum in color, often so dark it looks nearly black until light catches it. Cut into a smooth, rounded cabochon, most stones show a four-rayed star that appears to glide across the surface as the stone turns; a rare few show six rays."
      - "Star garnet is a variety of almandine garnet with some pyrope in the mix, and its star comes from tiny needle-like rutile inclusions aligned inside the crystal. Light bounces off these needles at fixed angles, producing the star pattern."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Idaho Chose Star Garnet as Its State Gem"
    paragraphs:
      - "Idaho's star garnet deposits are unusually rare on a global scale. Outside of a small area in India, the Emerald Creek Garnet Area in the Idaho Panhandle is the only other place in the world where gem-quality star garnet has been found in meaningful quantity."
      - "That scarcity, combined with the fact that Idaho already called itself the Gem State for its broader gemstone deposits, made star garnet a natural choice to represent the state officially."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Star Garnet Became Idaho's State Gem"
    paragraphs:
      - "The Idaho Legislature designated star garnet the official state gem in 1967, formally tying the state's Gem State nickname to a specific, rare stone found within its own borders."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Star Garnet Is Found in Idaho"
    paragraphs:
      - "The Emerald Creek Garnet Area, in the Idaho Panhandle National Forests south of St. Maries, is the primary source of Idaho star garnet. The U.S. Forest Service runs a public fee-digging site there each summer, where visitors sift gravel for garnets."
    sites:
      - name: Emerald Creek Garnet Area
        city: St. Maries
        lat: 46.9924
        lng: -116.3732
        note: "One of two known sources of star garnet worldwide"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Star Garnet Facts"
    facts:
      - "Adopted as Idaho's state gem in 1967."
      - "Gem-quality star garnet is confirmed in significant quantity in only two places on Earth: Idaho and India."
      - "The star effect comes from oriented rutile needles inside the garnet, not from a different mineral."
      - "The U.S. Forest Service operates a public fee-digging area at Emerald Creek each summer where visitors can search for their own star garnets."

