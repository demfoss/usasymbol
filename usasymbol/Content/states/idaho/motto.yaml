sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Idaho State Motto"
    paragraphs:
      - "Idaho's state motto is <strong>Esto Perpetua</strong>, a Latin phrase meaning <em>Let It Be Perpetual</em>. The legislature adopted it on March 14, 1891, inscribed on a banner across the bottom of the Great Seal of Idaho. The motto and the seal came together in a single act — Idaho had become a state only nine months earlier, on July 3, 1890."
      - "The phrase is attributed to Paolo Sarpi (1552–1623), a Venetian theologian and statesman who reportedly spoke it on his deathbed as a wish for the Republic of Venice to endure. Emma Edwards Green, the Boise artist who designed the seal, chose the phrase and became the only woman in U.S. history to design an official state seal."

  - id: meaning
    icon: "fa-solid fa-language"
    title: "Idaho State Motto Meaning"
    paragraphs:
      - "In Latin, <em>esto</em> is a jussive form of the verb <em>esse</em> (to be), expressing a wish or command: <em>let it be</em> or <em>may it be</em>. <em>Perpetua</em> means perpetual, continuous, or enduring. Together, <em>Esto Perpetua</em> is a wish for permanence — for something to last forever."
      - "Emma Edwards Green, who placed the motto on the seal, gave her own translation in her notes: <em>It is forever</em>. Her version is a declarative statement, not a wish. Idaho statute designates the Latin phrase but specifies no single official English translation, so both <em>Let It Be Perpetual</em> and Green's <em>It is forever</em> appear in official and historical contexts."
      - "Applied to a new state in 1891, the phrase reads as a founding aspiration: a wish that Idaho's institutions and identity would endure. In that sense its meaning is the same as when Sarpi reportedly spoke it about Venice — a desire for continuance against the possibility of loss."

  - id: translation
    icon: "fa-solid fa-globe"
    title: "Translation of \"Esto Perpetua\""
    paragraphs:
      - "The standard English translation is <em>Let It Be Perpetual</em>, reflecting the Latin subjunctive mood of <em>esto</em>. Other versions in common use include <em>May It Be Perpetual</em> and <em>May It Endure Forever</em>. All three preserve the sense of the original: a wish, not a declaration."
      - "Emma Edwards Green's own translation, <em>It is forever</em>, shifts the mood to declarative. Idaho law specifies only the Latin motto; no single English rendering is authorized by statute. Both the traditional and Green's versions appear in official Idaho publications and historical accounts."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Idaho's State Motto"
    paragraphs:
      - "Idaho became the 43rd state on July 3, 1890. The new state legislature needed an official seal and opened a design competition. Emma Edwards Green, an artist who had recently moved to Boise, submitted the winning entry. The legislature adopted her design, with the motto <em>Esto Perpetua</em> on a banner at the bottom, on March 14, 1891. Governor Norman B. Willey awarded Green $100 for the work on May 5, 1891."
      - "Green was the daughter of former Missouri Governor John Cummins Edwards and had studied at the Art Students League in New York. She was the only woman to enter the competition, and the legislature chose her design unanimously. No other woman has designed an official U.S. state seal."
      - "The phrase itself traces to Paolo Sarpi, a Venetian theologian, scientist, and historian who spent his career defending the Republic of Venice's independence from papal authority. His reported dying words in 1623 were <em>Esto perpetua</em> — a wish that Venice would last. The phrase entered American civic vocabulary in the 19th century before Green placed it on Idaho's seal."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Esto Perpetua\" on the Idaho State Seal"
    paragraphs:
      - "The motto appears on a banner running across the bottom of the Great Seal of Idaho. Above the banner, the seal shows a central shield with the Snake River and Shoshone Falls in the upper half and a western white pine and grain in the lower half. A female figure of Justice stands to the left of the shield; a miner with a pick stands to the right. An elk head tops the design."
      - "The state flag displays the seal on a blue field, bringing the motto onto the flag as well. Idaho's 2007 state quarter included <em>Esto Perpetua</em> prominently alongside a peregrine falcon, placing the phrase on a coin distributed nationwide."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Idaho State Motto Facts"
    style: "gradient"
    facts:
      - "Idaho's state motto \"Esto Perpetua\" was adopted on March 14, 1891, nine months after statehood."
      - "Emma Edwards Green, who chose the motto and designed the seal, is the only woman in U.S. history to design an official state seal."
      - "The phrase is attributed to Paolo Sarpi (1552–1623), a Venetian theologian who reportedly spoke it as a dying wish for the Republic of Venice."
      - "Idaho statute designates only the Latin wording; no single official English translation exists in law."
      - "Green's own translation was \"It is forever\" — a declarative statement, unlike the standard \"Let It Be Perpetual.\""
      - "Idaho's 2007 state quarter included the motto prominently alongside a peregrine falcon."

