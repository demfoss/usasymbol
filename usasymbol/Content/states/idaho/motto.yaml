intro_text: "Idaho's state motto is <strong>Esto Perpetua</strong>, a Latin phrase meaning <em>Let It Be Perpetual</em>. Adopted on March 14, 1891, as part of the Great Seal designed by Emma Edwards Green, it is the only U.S. state motto attributed to the last words of a 17th-century Venetian theologian."

