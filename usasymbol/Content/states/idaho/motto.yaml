title: "Esto Perpetua"
language: "Latin"
english_translation: "Let It Be Perpetual"
adopted_year: 1891

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Idaho State Motto: Esto Perpetua"
seo_description: "Idaho's motto 'Esto Perpetua' (Let It Be Perpetual) was designed by Emma Edwards Green — the only woman in U.S. history to design a state seal. The phrase comes from a 17th-century Venetian theologian's dying words. Full history, meaning, and what the phrase meant to Green herself."

intro_text: "Idaho's official motto is <strong>Esto Perpetua</strong> — Latin for <em>Let It Be Perpetual</em>. The phrase appears on a banner at the bottom of Idaho's state seal, adopted on March 14, 1891. The seal was designed by Emma Edwards Green of Boise — the only woman in U.S. history to design a state seal. Green chose the phrase for its connection to a 17th-century prayer about Venice's endurance, and she translated it in her own notes simply as <em>It is forever</em>."

sections:
  - id: "emma-edwards-green"
    icon: "fa-solid fa-palette"
    title: "The Only Woman to Design a U.S. State Seal"
    paragraphs:
      - "In December 1890, Idaho's first state legislature needed an official seal. A committee accepted design submissions. Emma Edwards Green, an artist who had recently moved to Boise and was teaching art classes there, submitted her design in early 1891. The committee voted unanimously in her favor. On May 5, 1891, Governor Norman B. Willey awarded her $100 for the work."
      - "Green was the daughter of former Missouri Governor John Cummins Edwards and had studied at the Arts Students League in New York. Her Idaho seal design was deliberate in its symbolism: a woman figure (representing Justice and Liberty) and a man figure (representing a miner) stand at equal height on either side of the shield — an unusual visual equality for 1891, four years before Idaho granted women the right to vote (1896)."
      - "No other woman has designed an official state seal in U.S. history. The Idaho Historical Society continues to give 'Esto Perpetua Awards' for outstanding contributions to preserving Idaho heritage — taking its name from the motto Green placed on her winning design."

  - id: "paolo-sarpi-dying-words"
    icon: "fa-solid fa-scroll"
    title: "The Phrase's Origins: A Venetian Theologian's Last Words"
    paragraphs:
      - "The phrase 'Esto Perpetua' traces to Paolo Sarpi (1552–1623), a Venetian theologian, mathematician, and historian who spent his career defending the Venetian Republic's independence from papal authority. His final recorded words — reportedly spoken about the Venetian Republic — were <em>Esto perpetua</em>: 'Let it be perpetual.' It was a dying wish for his city to endure."
      - "The phrase traveled to America through the 19th century. The National Grange farm organization adopted it in 1867. Jefferson Davis used it in his 1881 memoirs about the Confederacy. By 1891, the phrase had enough presence in American civic vocabulary that Green could use it with confidence that educated readers would recognize its weight."
      - "Green's own translation differs slightly from the standard 'Let it be perpetual.' In her notes about the seal, she rendered it as <em>It is forever</em> — a declarative statement rather than a prayer or wish. Idaho statute specifies only the Latin wording, so no single official English translation exists in law. 'Let it be perpetual,' 'May it endure forever,' and 'It is forever' all appear in official contexts."

  - id: "seal-design"
    icon: "fa-solid fa-shield-halved"
    title: "What Surrounds the Motto on Idaho's Seal"
    paragraphs:
      - "The motto banner runs across the bottom of the seal below a shield showing Idaho's mountains, the Snake River, and a sunrise. A miner with a pick and shovel represents the mining industry that drove Idaho's early economy. A woman figure holding scales of justice stands at equal height. Pine trees, wheat, and a cornucopia fill the lower portion of the shield. A shoshone (elk) head tops the shield."
      - "Artist Paul B. Evans redesigned the seal's artwork in 1957 to update the style, but kept all of Green's original elements — including the Latin motto unchanged. The 2007 Idaho state quarter included 'Esto Perpetua' prominently, bringing the phrase to millions of coin holders nationwide alongside a peregrine falcon and a state map outline."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Idaho State Motto Facts"
    style: "gradient"
    facts:
      - "Emma Edwards Green is the only woman in U.S. history to design an official state seal."
      - "The phrase originates from Paolo Sarpi's dying words about Venice in 1623 — 268 years before Idaho adopted it."
      - "Green translated the motto herself as 'It is forever' — different from the standard 'Let it be perpetual.'"
      - "Idaho statute specifies only the Latin wording; no single official English translation exists in law."
      - "The National Grange farm organization used 'Esto Perpetua' in 1867, before Idaho's statehood."
      - "The Idaho Historical Society gives 'Esto Perpetua Awards' for outstanding work preserving Idaho heritage."

faq:
  - question: "What is Idaho's state motto?"
    answer: "Idaho's state motto is 'Esto Perpetua,' a Latin phrase officially adopted on March 14, 1891, as part of the state seal. It appears on a banner at the bottom of the seal."

  - question: "What does 'Esto Perpetua' mean in English?"
    answer: "The most common translation is 'Let It Be Perpetual.' Other versions include 'May It Endure Forever.' Emma Edwards Green, who designed the seal, translated it in her own notes as 'It is forever.' Idaho law specifies only the Latin; no single official English translation exists by statute."

  - question: "Where did the phrase 'Esto Perpetua' come from?"
    answer: "From Paolo Sarpi (1552–1623), a Venetian theologian who reportedly spoke the phrase as his dying wish for the Venetian Republic's endurance. The National Grange farm organization adopted it in 1867, and Jefferson Davis used it in his 1881 memoirs — giving it currency in American civic vocabulary before Idaho's 1891 adoption."

  - question: "Who designed the Idaho state seal with the motto?"
    answer: "Emma Edwards Green of Boise, an artist and daughter of former Missouri Governor John Cummins Edwards. She is the only woman in U.S. history to design a state seal. Governor Norman B. Willey awarded her $100 for the winning design on May 5, 1891."

  - question: "When did Idaho officially adopt 'Esto Perpetua'?"
    answer: "March 14, 1891, when the legislature adopted the complete state seal design. Idaho had become the 43rd state on July 3, 1890."

  - question: "Where does Idaho's motto appear today?"
    answer: "On the state seal (a banner across the bottom), the state flag (which features the seal on a blue field), official documents, driver's licenses, and — prominently — on the 2007 Idaho state quarter."

