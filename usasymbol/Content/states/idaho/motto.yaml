faq:
  - question: "What is Idaho's state motto?"
    answer: "Idaho's state motto is \"Esto Perpetua,\" a Latin phrase meaning \"Let It Be Perpetual.\" It was adopted on March 14, 1891, inscribed on a banner at the bottom of the Great Seal of Idaho, which was designed by Emma Edwards Green."

  - question: "What does \"Esto Perpetua\" mean?"
    answer: "The standard translation is \"Let It Be Perpetual\" — a wish for permanence. Emma Edwards Green, who designed the seal, translated it in her own notes as \"It is forever.\" Idaho law specifies only the Latin; no single official English translation is defined by statute."

  - question: "What language is Idaho's state motto in?"
    answer: "Idaho's motto is in Latin. \"Esto\" is a Latin jussive form meaning \"let it be\" or \"may it be,\" and \"perpetua\" means perpetual or enduring."

  - question: "When did Idaho adopt its state motto?"
    answer: "Idaho adopted \"Esto Perpetua\" on March 14, 1891, when the legislature approved the Great Seal of Idaho. Idaho had become the 43rd state on July 3, 1890, nine months earlier."

  - question: "Who designed the Idaho state seal with the motto?"
    answer: "Emma Edwards Green, a Boise artist and daughter of former Missouri Governor John Cummins Edwards. She won a public design competition and is the only woman in U.S. history to design an official state seal. Governor Norman B. Willey awarded her $100 for the winning design on May 5, 1891."

  - question: "Where did the phrase \"Esto Perpetua\" come from?"
    answer: "The phrase is attributed to Paolo Sarpi (1552–1623), a Venetian theologian and statesman who reportedly spoke it on his deathbed as a wish for the Republic of Venice to endure. The phrase was in circulation in American civic life before Emma Edwards Green chose it for Idaho's seal in 1891."

  - question: "Where does Idaho's motto appear?"
    answer: "On a banner at the bottom of the Great Seal of Idaho, on the state flag (which displays the seal on a blue field), on official documents, and prominently on the 2007 Idaho state quarter."

