faq:
- question: What is Idaho's state soil?
  answer: "Idaho's state soil is the Threebear series, a deep, well-drained forest soil formed from volcanic ash and loess in the mountains of northern Idaho. It supports ponderosa pine, Douglas fir, and western red cedar forests across Clearwater, Latah, Idaho, and nearby counties."
- question: Why is it called Threebear soil?
  answer: "The Threebear series is named for Threebear Lakes in Clearwater County, Idaho. USDA soil scientists typically name soil series after lakes, creeks, towns, or ridges near where the series was first studied and described."
- question: What color is Threebear soil?
  answer: "The surface layer is very dark brown, almost black, because of organic matter from forest leaves and needles. Below it, the volcanic ash horizon is dark yellowish brown and feels silky. Deeper down, the loess-derived subsoil is brown to yellowish brown."
- question: Where is Threebear soil found in Idaho?
  answer: "Threebear soil is found on forested mountain slopes and ridges in northern Idaho, primarily in Clearwater, Latah, Idaho, Shoshone, and Benewah counties. It grows at elevations between roughly 2,500 and 5,500 feet, where the climate is cool and moist enough for dense conifer forests."
- question: What grows in Threebear soil?
  answer: "The main plants are trees: ponderosa pine at lower elevations, and Douglas fir, grand fir, and western red cedar higher up. Western larch and Engelmann spruce also grow in the northern part of the range. The soil's deep, moist, porous profile makes it among the most productive timberland soils in the Rocky Mountain West."
- question: What makes Threebear soil unusual?
  answer: "Threebear soil has two distinct layers stacked on top of each other. The upper portion formed in volcanic ash blown east from the Cascade volcanoes — fine, light, and porous. Below it is older loess-derived material with a clay-enriched subsoil. This combination gives the soil both high water-holding capacity in the upper layers and good root depth in the lower ones."
- question: How does volcanic ash affect the Threebear soil?
  answer: "Volcanic ash gives the upper layers of Threebear soil a very low bulk density — the soil is lighter and more porous than most. This means water soaks in quickly, roots can push deep, and the soil stays moist longer through dry summers. It is one reason Idaho's northern forests can grow so dense on steep slopes."

