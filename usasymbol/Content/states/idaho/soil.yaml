meaning: "The Threebear soil formed over thousands of years from volcanic ash carried east from the Cascade volcanoes, settling onto loess and basalt in Idaho's northern mountains. That ash gave the soil an unusual ability to hold water and nutrients, making it the foundation of some of the most productive timber country in the Pacific Northwest — ponderosa pine, Douglas fir, and western red cedar forests that have shaped Idaho's identity and economy since statehood."
