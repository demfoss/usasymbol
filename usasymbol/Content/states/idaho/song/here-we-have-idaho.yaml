lyrics_verses:
  - |-
    You’ve heard of the wonders our land does possess,
    Its beautiful valleys and hills.
    The majestic forests where nature abounds,
    We love every nook and rill
  - |-
    And here we have Idaho,
    Winning her way to fame.
    Silver and gold in the sunlight blaze,
    And romance lies in her name.
    Singing, we’re singing of you,
    Ah, proudly too. All our lives thru,
    We’ll go singing, singing of you,
    Singing of Idaho.
  - |-
    There’s truly one state in this great land of ours,
    Where ideals can be realized.
    The pioneers made it so for you and me,
    A legacy we’ll always prize.
lyrics_note: "The song praises Idaho's mountains, forests, and rivers, and closes with a call for the state to prosper and grow, written in a formal, hymn-like style typical of early twentieth-century state anthems."
