sections:
  - id: overview
    icon: fa-solid fa-music
    title: Idaho State Song
    paragraphs:
      - "\"Here We Have Idaho\" is Idaho's official state song, adopted in 1931. Its melody, composed by Sallie Hume Douglas, started as a different song years earlier and was reworked twice, first into a university alma mater and then into the state song."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Here We Have Idaho\" Explained"
    paragraphs:
      - "The song is a formal, march-like anthem that praises Idaho's mountains, forests, and rivers and calls on the state to grow and prosper. Its steady, hymn-like tempo suits group singing at ceremonies and schools."
      - "Sallie Hume Douglas composed the melody around 1915 for an earlier song titled \"Garden of Paradise.\" In 1917, University of Idaho students McKinley Helm and Alice Bessee adapted that tune for a campus song contest under the title \"Our Idaho,\" which won and later became the university's alma mater."
      - "Albert J. Tompkins, a Boise Public Schools music director, later added two more verses to Helm's contest verse, and the combined text became \"Here We Have Idaho.\""

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Here We Have Idaho" Represents Idaho
    paragraphs:
      - "Idaho adopted the song because it already had a decade of local use behind it by the time lawmakers acted, first as a prizewinning student composition and then as a university tradition. That built-in familiarity made it a natural choice over an untested piece."
      - "Its lyrics also focus squarely on Idaho's landscape, mountains, forests, and rivers, without borrowing imagery from anywhere else, giving the state a song written specifically for its own geography."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Here We Have Idaho\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Here We Have Idaho" Became Idaho's State Song
    paragraphs:
      - "The Idaho Legislature adopted \"Here We Have Idaho\" as the official state song in 1931, 14 years after McKinley Helm's original contest verse won at the University of Idaho. Albert Tompkins's added verses expanded the song from a school alma mater into something intended to represent the whole state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Here We Have Idaho\" Facts"
    facts:
      - "Idaho adopted \"Here We Have Idaho\" as its official state song in 1931."
      - "The melody was composed by Sallie Hume Douglas around 1915 for an earlier song, \"Garden of Paradise.\""
      - "McKinley Helm's original verse won a University of Idaho student song contest in 1917 and became the university's alma mater."
      - "Albert J. Tompkins, a Boise Public Schools music director, wrote two additional verses used in the state song."

