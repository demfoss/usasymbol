faq:
  - question: What is Idaho's state song?
    answer: "Idaho's official state song is \"Here We Have Idaho,\" adopted in 1931."
  - question: Who wrote Idaho's state song?
    answer: "Sallie Hume Douglas composed the music, and McKinley Helm and Albert J. Tompkins wrote the words."
  - question: When did Idaho adopt "Here We Have Idaho" as its state song?
    answer: "The Idaho Legislature adopted it as the official state song in 1931."
  - question: Is "Here We Have Idaho" also a university song?
    answer: "Yes. Its melody and first verse began as \"Our Idaho,\" the University of Idaho's alma mater, before being expanded into the state song."

