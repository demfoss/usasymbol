title: "Official and Traditional Colors of Idaho"
state: "Idaho"
adopted_year: null

seo_title: "Idaho State Colors: Official HEX Codes & Meaning"
seo_description: "Idaho state colors are Green, Gold, and Red, based on the state seal and state flag. Includes HEX, RGB, CMYK, and Pantone codes plus the history and symbolism behind each color."

intro_text: "The traditional state colors of Idaho are **Green**, **Gold**, and **Red**, derived from the Idaho state seal and [the Idaho state flag](/states/idaho/flag/idaho-state-flag). While not officially designated by a separate legislative act, these three colors have become the recognized traditional color identity of Idaho through the state seal, flag, and state branding. Exact HEX, RGB, CMYK, and Pantone values are listed in the color cards below — useful for designers, developers, and anyone reproducing Idaho colors accurately."

official_colors: "Green, Gold, and Red"
official_since: "Traditional (based on 1891 state seal and 1907 state flag)"
primary_use: "State Seal, State Flag banner, state government branding, University of Idaho color traditions"
known_for: "Colors derived from the Idaho state seal designed in 1891 by Emma Edwards Green — the only woman ever to design a US state seal — whose palette was chosen to represent Idaho's mining, agriculture, and forestry industries and to 'typify pure Americanism and the history of the State'"

color_data:
  - name: "Green"
    hex: "#2D6A27"
    rgb: "45, 106, 39"
    cmyk: "58, 0, 63, 58"
    pantone: "PMS 364"
    symbolism: "Represents Idaho's immense timber and forestry industry — symbolized on the state seal by the large fir tree in the foreground of the shield — and the fertile agricultural landscape of the Snake River Plain, where Idaho produces more potatoes than any other US state; green also evokes the rolling green fields and mountain forests that define Idaho's visual landscape from the Panhandle to the Sawtooth Range"
  - name: "Gold"
    hex: "#F0A500"
    rgb: "240, 165, 0"
    cmyk: "0, 31, 100, 6"
    pantone: "PMS 124"
    symbolism: "Represents Idaho's historic gold and silver mining industry — the economic force that drove the creation of Idaho Territory in 1863 — and appears on the state flag as the gold lettering of 'State of Idaho' on the banner below the seal; gold also references the sheaf of grain and cornucopias on the state seal, symbols of Idaho's agricultural abundance"
  - name: "Red"
    hex: "#A50021"
    rgb: "165, 0, 33"
    cmyk: "0, 100, 80, 35"
    pantone: "PMS 187"
    symbolism: "Appears on the state flag as the red portion of the red-and-gold banner below the state seal bearing the words 'State of Idaho'; red in the state seal tradition represents valor and the sacrifices of Idaho's early settlers; the University of Idaho has adopted silver and gold as its primary colors, while Idaho State University uses orange and black, but red appears consistently as an accent throughout official Idaho state imagery"

sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Idaho does not have officially legislated state colors designated by a separate statute. The traditional colors of green, gold, and red emerge from two primary sources: the detailed multicolor imagery of the Idaho state seal, first designed in 1891 and revised in 1957, and the red-and-gold banner on the Idaho state flag adopted in 1907. These colors collectively reflect the three industries that the seal's designer, Emma Edwards Green, deliberately embedded into Idaho's official imagery: forestry (green), mining (gold), and agriculture (gold and red), themes also central to [Idaho's official nickname, the Gem State](/states/idaho/nickname/the-gem-state)."
      - "The Idaho state seal holds a unique distinction in American heraldry: it is the only state seal in the United States designed by a woman. Emma Edwards Green, a trained artist who had studied in New York, won a competition held by the First Idaho Legislature in 1891 and was personally handed the honorarium by Governor Norman B. Willey on March 5, 1891. Green's own written account of her design choices — preserved in the Idaho Secretary of State's records — reveals that her color decisions were deliberate and meaningful: she stated that her 'principal desire was to use such colors as would typify pure Americanism and the history of the State.' The green of the forests, the gold of the mineral wealth, and the red of the state banner together embody this design philosophy."
    subsections:
      - subtitle: "Emma Edwards Green and the 1891 Seal Design"
        text: "Emma Edwards Green's design process for the Idaho state seal was exhaustive and community-driven. She consulted with every member of the Idaho Legislature and sought advice from mining authorities, former governors, and long-term Idaho residents before finalizing her palette and imagery. Her written account describes each element in precise symbolic terms: the large fir tree represents Idaho's timber industry; the husbandman plowing and the sheaf of grain represent agriculture; the miner represents Idaho's mineral extraction economy; the Snake River represents the state's water resources; and the goddess robed in white (a deliberate choice by Green to represent Idaho as a 'virgin state') holds a spear topped with a liberty cap. The green of the forests, the gold of the grain and mineral wealth, and the red of the flag banner together form the practical color legacy of this 1891 design."
      - subtitle: "The 1907 State Flag and 1957 Seal Revision"
        text: "The Idaho state flag, governed by Idaho Code § 46-801, was adopted on March 12, 1907, and features the state seal in full color on a blue field, with a distinctive red-and-gold banner below reading 'State of Idaho' — the explicit source of the red and gold in Idaho's traditional state color identity. In 1957, the thirty-fourth session of the Idaho legislature commissioned Paul B. Evans and the Caxton Printers to revise the seal to more clearly emphasize Idaho's mining, agriculture, and forestry industries. The revised seal's color palette reinforced the green-gold-red tradition established by Green's original 1891 design, and the 1957 version is designated the 'Official Copy' displayed in the Idaho Secretary of State's office, alongside the enduring civic language of [Idaho's state motto, Esto Perpetua](/states/idaho/motto/esto-perpetua)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Idaho's traditional color palette of green, gold, and red is one of the most directly industry-referenced state color traditions in the United States. Each color connects to a specific economic pillar of Idaho's history and present identity, as deliberately encoded by Emma Edwards Green in the 1891 seal design and reinforced by the state flag's red-and-gold banner. Green speaks to the forests and farms that define Idaho's landscape; gold to the mineral wealth and agricultural abundance that drove settlement and statehood; and red to the patriotic tradition and civic pride that Emma Edwards Green described as 'pure Americanism.' Together, these three colors form a palette that is simultaneously geographically specific and historically grounded."
    subsections:
      - subtitle: "Green in Idaho History"
        text: "Green represents Idaho's dual dominance in timber and agriculture — two industries that have defined the state since territorial days. Idaho's forests, concentrated in the northern Panhandle and the central mountains, encompass approximately 21.6 million acres of national forest land, making Idaho one of the most heavily forested states in the continental United States. The large fir tree at the center of the state seal's shield is Emma Edwards Green's explicit symbol of this timber wealth. Green also represents Idaho's agricultural productivity: the Snake River Plain, stretching across southern Idaho, is one of the most productive agricultural regions in North America, producing potatoes, dairy, wheat, barley, and trout in quantities that make Idaho a consistent national leader across multiple agricultural categories."
      - subtitle: "Gold in Idaho History"
        text: "Gold carries a layered significance for Idaho that encompasses both literal mineral wealth and agricultural abundance. The discovery of gold in the Clearwater River region in 1860 triggered a rush of prospectors that directly led to the creation of Idaho Territory in 1863 — gold is therefore the color most directly responsible for Idaho's political existence as a distinct territory and eventual state. Silver strikes in the Coeur d'Alene mining district beginning in 1884 further cemented Idaho's identity as a mineral-rich state. The gold of the state flag's banner lettering and the sheaves of grain and cornucopias on the state seal together represent both forms of Idaho gold: the mineral wealth extracted from mountain rock and the agricultural wealth harvested from the fertile plains."
      - subtitle: "Red in Idaho History"
        text: "Red appears on the Idaho state flag as one half of the red-and-gold banner reading 'State of Idaho,' placed directly below the state seal. In the heraldic tradition that Emma Edwards Green drew upon for the seal design, red (gules) signifies valor, hardiness, and military strength — qualities that early Idahoans associated with the state's frontier settlers, miners, and agricultural pioneers. The Idaho state flag itself has a direct military origin: the blue silk flag bearing the state seal was first created for the Idaho regiment preparing to serve in the Spanish-American War in 1898, and the regiment carried it through the war before the legislature adopted the design as the official state flag in 1907. Red's presence on this military-origin flag carries a specifically martial resonance in Idaho's color heritage."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Green, gold, and red appear throughout Idaho's official state imagery in both the state seal and the state flag. The Idaho state seal — governed by Idaho Code § 59-1006 and displayed in the Idaho Secretary of State's office — is the primary source of the green and gold in Idaho's traditional color palette, with the detailed full-color imagery of forests, farmland, and mineral wealth rendered in these dominant tones. The Idaho state flag, governed by Idaho Code § 46-801, adds the explicit red-and-gold banner that completes the traditional tricolor. These colors appear across Idaho state agency branding, the Idaho Department of Commerce tourism and economic development materials, the Idaho Capitol Building interior decor, and official state publications. The University of Idaho in Moscow uses silver and gold as its official colors — gold directly referencing the traditional state palette — while Idaho State University uses orange and black. Boise State University's distinctive blue and orange is the most nationally recognized Idaho university color scheme, but the traditional state colors of green, gold, and red remain the foundation of official Idaho governmental visual identity and are cataloged with other palettes in [U.S. state colors](/symbols/colors), while statehood context is covered in [states and capital cities reference data](/rankings/geography/states-capital-cities)."

