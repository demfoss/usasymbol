faq:
  - question: "What are the official colors of Idaho?"
    answer: "The traditional state colors of Idaho are Green, Gold, and Red, derived from the Idaho state seal designed in 1891 and the red-and-gold banner of the state flag adopted in 1907. These colors represent Idaho's forestry, mining, and agricultural heritage."
  - question: "What is the HEX code for Idaho Green?"
    answer: "The standard HEX code for Idaho Green is #2D6A27, corresponding to Pantone PMS 364, representing the forest green of the fir tree and agricultural landscape depicted on the Idaho state seal."
  - question: "What is the HEX code for Idaho Gold?"
    answer: "The standard HEX code for Idaho Gold is #F0A500, corresponding to Pantone PMS 124, representing the gold lettering and banner on the Idaho state flag and the mineral and agricultural wealth depicted on the state seal."
  - question: "What is the HEX code for Idaho Red?"
    answer: "The standard HEX code for Idaho Red is #A50021, corresponding to Pantone PMS 187, representing the red portion of the red-and-gold banner on the Idaho state flag reading 'State of Idaho.'"
  - question: "Who designed the Idaho state seal?"
    answer: "The Idaho state seal was designed by Emma Edwards Green, a trained artist, who won a competition held by the First Idaho Legislature and received the honorarium from Governor Norman B. Willey on March 5, 1891. She is the only woman in US history to have designed an official state seal."
  - question: "Does Idaho have officially legislated state colors?"
    answer: "No. Idaho does not have a separate legislative act designating official state colors. Green, gold, and red are recognized as traditional state colors derived from the Idaho state seal and the red-and-gold banner of the Idaho state flag, governed by Idaho Code § 46-801."
  - question: "Why did Idaho's seal designer choose those colors?"
    answer: "Emma Edwards Green stated in her own account that her principal desire was to use colors that would 'typify pure Americanism and the history of the State.' Green selected the palette to represent Idaho's three defining industries at statehood: forestry (green), mining and agriculture (gold), and the patriotic American tradition (red)."

