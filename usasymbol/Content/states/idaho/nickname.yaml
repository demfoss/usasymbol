title: "The Gem State"
state: "Idaho"
type: "State Nickname"
is_official: true
adopted_year: 1957
other_nicknames:
  - "Little Ida"
  - "Gem of the Mountains"
  - "Spud State"

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-14"
seo_title: "Idaho State Nickname: The Gem State"
seo_description: "Idaho is known as the Gem State because a wide variety of gemstones are found across the state, including the rare star garnet."

intro_text: "Idaho carries the official state nickname <i>the Gem State</i>. The state legislature made this name official in 1957. Idaho gem deposits include over 70 different types of precious and semi-precious stones found in mountains and streams across the state. The star garnet serves as Idaho's official state gem, and miners have discovered it in only two places on Earth."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Gem State'"
    paragraphs:
      - "The Gem State nickname connects directly to Idaho's rich mineral deposits. Miners and prospectors found gold in Idaho during the 1860s, a discovery that paralleled the gold and silver rush happening just across the border in Montana — a state whose [Montana's official moniker](/states/montana/nickname/the-treasure-state) reflects the mineral wealth that defined the Northern Rockies region. That discovery brought thousands of people searching for wealth. But gold was just the beginning. Idaho mountains contain garnets, opals, rubies, sapphires, and jade. The Clearwater River area produces star garnets with unique six-pointed stars visible when light hits the stone's surface, a legal and cultural identity reinforced on the [Idaho state flag](/states/idaho/flag/idaho-state-flag)."
      - "How did Idaho get its nickname the Gem State? People started using this name in the late 1800s when gem hunting became popular. Tourists and rock collectors traveled to Idaho looking for treasures. The nickname appeared in newspapers and travel guides during that time. State lawmakers officially adopted the Gem State in 1957, making it part of Idaho law and part of a broader catalog on the [all 50 state nicknames hub](/symbols/nicknames)."
      - "Today, gem mining remains an active part of Idaho culture. Visitors can search for gems at several public mining areas. The town of Spencer holds an annual opal festival each summer. License plates display Famous Potatoes rather than the Gem State nickname, which often leads readers to related symbols such as [Idaho's state motto, Esto Perpetua](/states/idaho/motto/esto-perpetua)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Little Ida"
        text: "This nickname came from early settlers shortening Idaho's name. People used Little Ida in casual conversation during territorial days before Idaho became a state in 1890. The name suggested affection for the territory despite its large size. Idaho covers 83,570 square miles, making it the 14th largest state, so calling it little seems odd. Records suggest this nickname was more common in the 1870s and 1880s. Residents stopped using Little Ida regularly after statehood, though historical societies sometimes mention it when discussing Idaho's past."
      - subtitle: "Gem of the Mountains"
        text: "Writers and poets used this longer version of the Gem State nickname. The phrase appeared in promotional materials encouraging people to visit or settle in Idaho during the late 1800s and early 1900s. Gem of the Mountains emphasized both the precious stones found throughout the state and the beautiful Rocky Mountain scenery. Tourism companies liked this nickname because it painted Idaho as a valuable destination. The phrase shows up less today, though some historical markers and old buildings still display it. Most people shortened it to just the Gem State over time, while geographic context remains useful in [States Neighboring States](/rankings/geography/states-neighboring-states)."
      - subtitle: "Spud State"
        text: "Idaho grows more potatoes than any other American state, which led to this nickname. Farmers plant potatoes across southern Idaho in areas with rich volcanic soil and good irrigation. The state produces roughly one-third of all potatoes grown in the United States each year. Spud State appeared on souvenirs and postcards starting in the mid-1900s when Idaho's potato industry expanded rapidly. The nickname sticks around today, and Idaho license plates even say Famous Potatoes instead of the Gem State. Some residents prefer focusing on agriculture rather than geology when describing their state, often alongside heritage symbols like [Idaho's state horse, the Appaloosa](/states/idaho/mammal/appaloosa-horse)."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Idaho contains over 70 different types of gemstones including star garnets, opals, rubies, sapphires, and jade."
      - "The star garnet is found in only two locations worldwide: Idaho and India."
      - "Idaho officially adopted the Gem State nickname in 1957 through state legislation."
      - "The state motto is Esto Perpetua, which means let it be perpetual or let it last forever in Latin."
      - "Gold was discovered in Idaho in 1860, bringing thousands of miners and leading to territorial status in 1863."
      - "Despite being called the Gem State, Idaho license plates display Famous Potatoes as the slogan."

faq:
  - question: "What is Idaho’s nickname?"
    answer: "Idaho’s nickname is the Gem State. The name reflects the wide variety of gemstones found across the state."

  - question: "Why is Idaho called the Gem State?"
    answer: "Idaho is called the Gem State because of its rich mineral resources. Gold and other gemstones were discovered throughout Idaho during the 19th century."

  - question: "How did Idaho get the Gem State nickname?"
    answer: "The Gem State nickname developed in the late 1800s as gem hunting and mining became popular. It was later formally adopted by the state legislature."

  - question: "When did Idaho adopt the Gem State nickname?"
    answer: "Idaho officially adopted the Gem State nickname in 1957, making it part of state law."

  - question: "What is Idaho’s nickname and motto?"
    answer: "Idaho’s nickname is the Gem State, and its state motto is Esto Perpetua, a Latin phrase meaning let it be perpetual."


