# verification: Tennessee state sources disagree on the year. The Secretary of State and the Tennessee Blue Book say the channel catfish was designated in 1988 by Public Chapter 489 of the 95th General Assembly. The state wildlife agency page says 1987. This page uses 1988 because the Secretary of State gives the exact enacting law. State pages list the old name Ictalurus lacustris. The current accepted name, Ictalurus punctatus, is kept here and also appears in the state's own fishing proclamations.
