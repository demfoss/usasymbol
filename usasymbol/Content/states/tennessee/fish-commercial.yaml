intro_text: Tennessee's state commercial fish is the channel catfish, a whiskered fish with a forked tail that lives in most of the state's streams, adopted in 1988. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Commercial Fish of Tennessee?
  paragraphs:
  - The channel catfish is Tennessee's official state commercial fish. The Tennessee Legislature gave it this title in 1988. Its scientific name is Ictalurus punctatus.
  - Tennessee also has a state sport fish, the smallmouth bass.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Channel Catfish
  paragraphs:
  - The channel catfish has smooth skin with no scales. Its back and sides range from gray to slate-blue, and they often have an olive or yellow shine.
  - Look for its deeply forked tail and the black spots on its sides. Large adults often lose their spots.
  - Eight whiskers, called barbels, grow around its mouth. Catfish have taste buds all over their bodies, and these help them find food.
  - In Tennessee, people also call it the spotted cat or the fiddler.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Commercial Fish
  paragraphs:
  - The Tennessee Legislature named the channel catfish the official state commercial fish in 1988. State law now lists it among Tennessee's official symbols.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Tennessee Chose the Channel Catfish
  paragraphs:
  - Official state sources name the channel catfish without giving a detailed reason. They do say it lives in most Tennessee streams and many lakes, and that many farm ponds are stocked with it.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Channel Catfish
  paragraphs:
  - Channel catfish live in most Tennessee streams and many of its lakes. They usually stay near the bottom and often feed in moving water.
  - Kentucky Lake on the Tennessee River and Fort Loudoun Lake near Knoxville are well-known catfish waters. Many farm ponds across the state are also stocked with channel catfish.
