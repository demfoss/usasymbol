- id: facts
  icon: fa-solid fa-lightbulb
  title: Channel Catfish Facts
  facts:
  - Adopted in 1988 by the Tennessee Legislature.
  - Scientific name is Ictalurus punctatus.
  - Nicknamed the spotted cat and the fiddler in Tennessee.
  - Has a deeply forked tail, smooth skin with no scales, and eight whiskers.
  - In Tennessee, channel catfish usually weigh less than 10 pounds.
faq:
- question: What is Tennessee's state fish?
  answer: Tennessee has two state fish. The channel catfish is the state commercial fish, and the smallmouth bass is the state sport fish.
- question: When did Tennessee adopt the channel catfish?
  answer: The Tennessee Legislature made the channel catfish the official state commercial fish in 1988.
- question: Why did Tennessee choose the channel catfish?
  answer: Official sources do not give a detailed reason. They do say it lives in most Tennessee streams and many lakes, and that many farm ponds are stocked with it.
- question: How can you spot a channel catfish?
  answer: Look for a deeply forked tail, smooth gray or bluish skin with black spots, and eight whiskers around the mouth. Big adults may not have spots.
- question: Why does a catfish have whiskers?
  answer: The whiskers, called barbels, are covered with taste buds. They help the catfish find food along the bottom.
