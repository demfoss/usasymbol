seo_title: "Tennessee State Motto | Agriculture and Commerce"
seo_description: "Tennessee's state motto is \"Agriculture and Commerce,\" adopted in 1796 when Tennessee became the 16th state. It names the two industries on the state seal."

intro_text: "Tennessee's state motto is <strong>Agriculture and Commerce</strong>. It was adopted in 1796 when Tennessee entered the Union as the 16th state, and it names the two industries shown directly on the state seal — a farming scene above and a river with a vessel below."

