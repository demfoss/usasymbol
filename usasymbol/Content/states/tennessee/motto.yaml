faq:
  - question: "What is Tennessee's state motto?"
    answer: "Tennessee's state motto is \"Agriculture and Commerce.\" It was adopted in 1796 when Tennessee became the 16th state on June 1, and it names the two industries shown on the state seal."

  - question: "What does \"Agriculture and Commerce\" mean?"
    answer: "The motto names Tennessee's two economic foundations in 1796. Agriculture referred to the farming in Tennessee's river valleys, which produced wheat and cotton. Commerce referred to the river trade that carried those goods to market, since Tennessee had no coastline and depended on flatboats on the Tennessee, Cumberland, and Mississippi rivers."

  - question: "When did Tennessee adopt its state motto?"
    answer: "Tennessee adopted its motto in 1796 as part of the state seal, when Tennessee entered the Union as the 16th state on June 1, 1796. The current standardized version of the seal was codified in 1987 under Tennessee Code Annotated § 4-1-301."

  - question: "Where does Tennessee's motto appear?"
    answer: "The motto encircles the Great Seal of Tennessee. The seal appears on official state documents and government correspondence, but not on the state flag. Tennessee's flag uses three stars on a red field representing the state's three Grand Divisions."

