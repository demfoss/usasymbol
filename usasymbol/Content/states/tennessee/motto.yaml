title: "Agriculture and Commerce"
language: "English"
english_translation: ""
adopted_year: 1987

author: "USA Symbol Team"
date_published: "2025-12-05"
date_modified: "2026-03-27"
seo_title: "Tennessee State Motto | Agriculture and Commerce"
seo_description: "Tennessee's motto appeared on the state seal in 1801 but wasn't officially adopted until 1987 — 186 years later. The first document ever stamped with Tennessee's Great Seal was the payment order to the men who built it. Tennessee is one of few states with an English motto; the words appear split across the top and bottom of the seal."

intro_text: "Tennessee's state motto is <strong>Agriculture and Commerce</strong> — two plain English words that appeared on the state's Great Seal in 1801 but weren't officially designated as the state motto until 1987, 186 years later. The legislature appointed a commission to design the seal in 1801; William and Matthew Atkinson built it by April 1802. The first document ever stamped with the completed seal was the payment order to the Atkinsons for making it. The 95th General Assembly formally adopted the motto through Public Chapter 402 on March 14, 1987."

sections:
  - id: "186-years-on-the-seal"
    icon: "fa-solid fa-clock"
    title: "186 Years on the Seal Before Becoming the Official Motto"
    paragraphs:
      - "Tennessee became the 16th state on June 1, 1796. Governor John Sevier used his personal seal on official documents because Tennessee had no state seal yet. The legislature appointed a commission in 1801 to create one. The commission chose images of a plow, wheat sheaf, and cotton plant for the upper half — labeled 'Agriculture' — and a riverboat for the lower half — labeled 'Commerce.' William and Matthew Atkinson made the physical seal and press; Governor Archibald Roane received it in April 1802."
      - "The first document ever stamped with Tennessee's Great Seal, on April 24, 1802, was the payment order to the Atkinsons for making the seal. For the next 186 years, 'Agriculture and Commerce' appeared on that seal — on every official state document, letterhead, and legal paper — without ever being the official state motto. The words were just part of the seal's design, not a separately designated symbol."
      - "In 1987, the 95th General Assembly passed Public Chapter 402, formally designating 'Agriculture and Commerce' as Tennessee's state motto. The legislature also codified the complete seal design in statute that same year. Tennessee had been using the phrase for nearly two centuries before deciding to make it official."

  - id: "english-not-latin"
    icon: "fa-solid fa-language"
    title: "Plain English in 1801 — When Most States Chose Latin"
    paragraphs:
      - "In the early 19th century, states designing seals and mottos almost universally chose Latin. Latin carried associations with classical republicanism and Roman civic virtues. Tennessee's 1801 commission chose plain English — 'Agriculture' and 'Commerce' — words that any Tennessee settler could read without a classical education."
      - "The choice reflected Tennessee's frontier character in 1801. The state had been admitted to the Union only five years earlier. Its population consisted largely of settlers who had crossed the Appalachians in search of farmland. These were practical people building farms along river valleys; a Latin motto would have been performative rather than descriptive. Two English nouns naming what Tennesseans actually did was more honest."
      - "Tennessee is one of a small number of states with English mottos, alongside Pennsylvania ('Virtue, Liberty and Independence'), South Dakota ('Under God the People Rule'), and Washington ('Al-ki'). Most states chose Latin; Tennessee's 1801 commission chose to describe economic reality directly."

  - id: "what-the-seal-shows"
    icon: "fa-solid fa-shield-halved"
    title: "The Seal That Split the Motto Across Two Halves"
    paragraphs:
      - "Tennessee's Great Seal divides into two vertical halves. The upper half bears the word 'Agriculture' above a plow, a sheaf of wheat, and a cotton plant — the primary crops of Tennessee's early economy. The lower half bears the word 'Commerce' above a riverboat — representing the Cumberland, Tennessee, and Mississippi Rivers that carried Tennessee products to distant markets."
      - "The Roman numeral XVI appears on the seal, marking Tennessee as the 16th state admitted to the Union. A circular band around the entire design reads 'The Great Seal of the State of Tennessee.' The design has remained essentially unchanged from the 1801 commission's specifications through two centuries of use."
      - "The motto's two words appear separated — 'Agriculture' at the top, 'Commerce' at the bottom — rather than together as a single phrase. This makes Tennessee's motto visually unusual: the two halves of the motto frame the central imagery rather than appearing together on a ribbon or scroll as most state mottos do."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Tennessee State Motto Facts"
    style: "gradient"
    facts:
      - "The motto appeared on Tennessee's seal from 1801 but wasn't officially adopted as the state motto until 1987 — 186 years later."
      - "The first document stamped with Tennessee's Great Seal (April 24, 1802) was the payment order to the men who built it."
      - "Tennessee chose plain English in 1801 when most states were choosing Latin for their mottos."
      - "The two words appear split across the seal — 'Agriculture' at the top, 'Commerce' at the bottom — framing the central imagery."
      - "The seal includes Roman numeral XVI marking Tennessee as the 16th state admitted to the Union."
      - "The 95th General Assembly adopted the motto through Public Chapter 402 on March 14, 1987."

faq:
  - question: "What is Tennessee's state motto?"
    answer: "Tennessee's state motto is 'Agriculture and Commerce,' adopted officially on March 14, 1987, through Public Chapter 402. The phrase had appeared on Tennessee's Great Seal since 1801 — 186 years before official designation."

  - question: "Why did it take 186 years to officially adopt the motto?"
    answer: "The words 'Agriculture' and 'Commerce' were part of the Great Seal design from 1801, not a separately designated motto. Tennessee's legislature didn't formally designate a state motto until 1987, when the 95th General Assembly passed Public Chapter 402 and also codified the complete seal design in statute."

  - question: "What language is Tennessee's motto written in?"
    answer: "English. In 1801, Tennessee's commission chose plain English words rather than Latin — unusual for the era, when most states selected Latin mottos. The choice reflected Tennessee's frontier character: the words described what Tennesseans actually did rather than invoking classical republican ideals."

  - question: "What does Tennessee's motto mean?"
    answer: "'Agriculture' refers to farming — growing crops like wheat, corn, tobacco, and cotton, and raising livestock. 'Commerce' refers to trade — the buying and selling of goods, particularly via the rivers that transported Tennessee products to distant markets. Together, the words described the two economic activities that sustained Tennessee in the early 19th century."

  - question: "What was the first document stamped with Tennessee's Great Seal?"
    answer: "The payment order to William and Matthew Atkinson for building the seal itself. Governor Archibald Roane received the completed seal in April 1802, and on April 24, 1802, the first official document stamped with it authorized payment to the craftsmen who made it."

  - question: "Where does Tennessee's motto appear?"
    answer: "On Tennessee's Great Seal — 'Agriculture' arcs across the top half and 'Commerce' appears at the bottom, with the economic imagery of plow, wheat, cotton, and a riverboat between them. The seal appears on official state documents, government letterhead, and the State Capitol in Nashville."

