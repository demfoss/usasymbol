seo_title: "Tennessee State Tree | Tulip Poplar"
seo_description: 'Tennessee named tulip poplar its state tree in 1947, recognizing a tall hardwood used for pioneer buildings, furniture, and Appalachian timber.'

intro_text: "Tennessee chose the Tulip Poplar as its state tree in 1947, recognizing a hardwood long valued in the state's forests and timber history. Its tall straight trunk, distinct leaves, and spring flowers make it one of Tennessee's most recognizable native trees."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Tennessee"
    paragraphs:
      - "Tennessee's official state tree is the Tulip Poplar, also called tulip tree or yellow poplar. This massive deciduous hardwood grows 80 to 120 feet tall in Tennessee forests, with exceptional old-growth specimens reaching 150 to 180 feet. The trunk measures three to six feet in diameter on mature trees. Some ancient tulip poplars in the Great Smoky Mountains exceed eight feet across. These enormous dimensions made tulip poplar Tennessee's most valuable timber species for over two centuries. The tree grows rapidly for a hardwood, adding two to three feet per year in favorable Tennessee conditions. Tulip poplar can live 200 to 300 years in Tennessee. The species dominated Tennessee's lumber industry from settlement through the 20th century, producing billions of board feet of light, easily worked wood."
      - "The leaves provide instant recognition with their unique shape. Each leaf measures four to six inches across with four distinct lobes and a notch at the tip, creating a shape resembling a tulip or cat face. No other Tennessee tree has this distinctive leaf form. The leaves emerge bright yellow-green in spring, darken to glossy green in summer, and turn bright yellow in fall before dropping. The flowers give the tree its common name. Large tulip-shaped flowers appear in May and June, measuring two to three inches across. Each flower has six yellow-green petals with orange bands at the base. The flowers bloom high in the canopy, often going unnoticed on forest-grown trees. By fall, the flowers produce cone-like seed clusters that break apart in winter, dispersing winged seeds."
      - "Tulip poplar grows throughout Tennessee in virtually every county. The species thrives across the entire state from Memphis to the Smoky Mountains. Tennessee's varied topography and climate provide ideal conditions for tulip poplar. The tree dominates cove forests in East Tennessee mountains where it reaches maximum size. In Middle Tennessee, tulip poplar grows in moist valleys and along streams. The tree adapts to West Tennessee bottomlands and uplands. Tennessee lies near the center of tulip poplar's natural range where the species grows most abundantly. The tree requires rich, moist, well-drained soils. Young tulip poplars tolerate shade but mature trees need full sun. The species regenerates prolifically after logging, sprouting thousands of seedlings per acre."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Tulip Poplar"
    paragraphs:
      - "The official name is Tulip Poplar, though the tree is not a true poplar. The name comes from the tulip-shaped flowers. The scientific name Liriodendron tulipifera combines Liriodendron (Greek for 'lily tree') with tulipifera (Latin for 'tulip-bearing'). Both the common and scientific names reference the distinctive flowers. Early Tennessee settlers called it tulip tree, yellow poplar for the wood color, or whitewood. Cherokee people called it canoewood because large trunks could be hollowed into dugout canoes. The genus Liriodendron contains only two species - Tennessee's tulip poplar and a Chinese relative."
      - "Some Tennessee references use tuliptree as one word. Loggers and lumber dealers marketed the wood as yellow poplar or simply poplar, though it's actually in the magnolia family. The species belongs to the Magnoliaceae family, the magnolia family, evident in the large tulip-like flowers. Tennessee shares the tulip poplar with Kentucky and Indiana as their state tree. The species grows naturally throughout eastern North America from Massachusetts to Florida and west to Michigan and Louisiana. Tennessee contains some of the largest and finest tulip poplars due to rich mountain soils in the Smokies."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Tulip Poplar Became the Tennessee State Tree"
    paragraphs:
      - "Tennessee adopted the Tulip Poplar as its official state tree in 1947. The Tennessee General Assembly passed Public Chapter 51 during the 1947 session. The legislation recognized tulip poplar as Tennessee's most valuable native hardwood and the tree most representative of the state's forests. By 1947, tulip poplar had supplied Tennessee's lumber industry for over 150 years and remained the most sought-after hardwood in state forests. The designation honored both the tree's economic importance and its dominance in Tennessee's landscape."
      - "Tennessee selected Tulip Poplar because the species shaped the state's settlement and economy more than any other tree. When pioneers crossed the Cumberland Gap into Tennessee in the late 1700s, they found vast tulip poplar forests growing in mountain coves and river valleys. The straight-grained, easily worked wood proved ideal for frontier construction. Tennessee pioneers built log cabins from tulip poplar logs, which split easily and resisted warping. The wood's light weight made it manageable for construction even without heavy equipment. Tennessee settlements from Jonesborough to Nashville featured tulip poplar buildings. The Cherokee had long used tulip poplar for dugout canoes - the soft wood could be hollowed using fire and stone tools. A single large tulip poplar trunk could provide a 30-foot canoe, reinforcing [the Volunteer State story](/states/tennessee/nickname/the-volunteer-state)."
      - "Tennessee's official symbols span its natural and industrial heritage equally. The Tulip Poplar represents Appalachian forests and pioneer timber culture; the state also holds a rare modern distinction — it is the only U.S. state to designate a weapon still in active military service worldwide. [Tennessee's official state firearm](/states/tennessee/firearm/barrett-m82-m107) — the Barrett M82, designed by a Tennessee native and manufactured in Murfreesboro today — reflects the same spirit of homegrown innovation that made Tennessee's timber and manufacturing industries foundational to American history."
      - "The tree dominated Tennessee's lumber industry from the mid-1800s through the 20th century. Sawmills processed tulip poplar for furniture, cabinets, interior trim, plywood core stock, molding, and general construction. Its light-colored, straight-grained wood also worked well for painted furniture and organ pipes. The Great Smoky Mountains National Park still protects old-growth tulip poplars that show the size early Tennesseans associated with the species. The 1947 designation recognized a tree tied to pioneer buildings, Cherokee dugout canoes, hardwood manufacturing, and Tennessee's forest economy."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Tennessee State Tree Facts"
    facts:
      - "Tennessee adopted Tulip Poplar in 1947, recognizing the state's most valuable native hardwood and tallest eastern tree"
      - "The distinctive four-lobed leaf with a notch at the tip is unique - no other Tennessee tree has this shape"
      - "Tulip poplar is not a true poplar but belongs to the magnolia family (Magnoliaceae), related to magnolias rather than poplars"
      - "Old-growth specimens in the Great Smoky Mountains exceed 150 feet tall and eight feet in diameter, making them among eastern North America's largest hardwoods"
      - "The tulip-shaped flowers bloom in May and June with yellow-green petals and orange bands, giving the tree both common and scientific names"
      - "Cherokee people hollowed tulip poplar trunks into 30-foot dugout canoes - the soft wood could be shaped with fire and stone tools"
      - "Tennessee shares the tulip poplar with Kentucky and Indiana as their state tree - one of few species adopted by multiple states"
      - "The wood is light-colored, straight-grained, and easily worked, making it ideal for furniture, cabinets, organ pipes, and interior trim"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Tennessee State Tree and Flower"
    paragraphs:
      - "Tennessee's state flower is the [Iris](/states/tennessee/flower/iris) (Iridaceae), designated in 1933. The state adopted its floral symbol 14 years before choosing tulip poplar. Both symbols produce distinctive flowers. The iris blooms purple or white in late spring across Tennessee gardens and wetlands, while tulip poplar flowers appear yellow-green high in forest canopies. Both flowers inspired their species' names. The pair covers Tennessee from cultivated landscapes to mountain forests. The iris grows at ground level while tulip poplar towers overhead."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Tennessee Tulip Poplar"
    paragraphs:
      - "The leaf shape provides certain identification. Look for leaves with four distinct lobes creating a squared-off or truncated appearance. The leaf has two lobes at the sides, two at the base, and a distinctive notch at the tip where a fifth lobe would be. This notch makes the leaf appear as if the tip was cut off. The shape resembles a tulip flower viewed from above or a cat face with ears. The leaves measure four to six inches long and equally wide. They attach to twigs on long stems and flutter in wind. Leaf color is bright yellow-green when emerging, glossy dark green in summer, and bright golden yellow in fall. The unique four-lobed shape with terminal notch makes tulip poplar unmistakable."
      - "The flowers help confirm identification in late spring. Look for tulip-shaped flowers two to three inches across high in the tree canopy. Each flower has six yellow-green petals with orange bands at the base. The flowers bloom after leaves emerge, making them less visible than spring flowers on bare branches. The flowers stand upright on branch tips. By late summer, look for upright cone-like seed clusters measuring two to three inches long. These break apart in fall and winter, releasing winged seeds that spin to the ground. Old seed cones often persist on branches into winter."
      - "The overall form shows a tall, straight trunk with a relatively narrow crown. Forest-grown tulip poplars develop clear, branch-free trunks for 50 to 80 feet before the crown begins. The crown appears narrow and somewhat sparse compared to oaks or maples. Open-grown trees branch lower and develop fuller crowns. Young trees show perfectly straight growth and smooth gray bark. As trees mature, the bark develops shallow furrows with flat ridges creating a pattern of diamond shapes. Very old trees show gray bark with deep furrows. Winter identification uses the distinctive leaf scars on twigs - they encircle the twig completely, and buds resemble duck bills. The enormous size, straight trunk, and relatively sparse crown distinguish mature tulip poplars in Tennessee forests."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Tennessee State Tree Symbolizes"
    paragraphs:
      - "Tulip Poplar represents Tennessee's forest wealth and pioneer resourcefulness. The tree symbolizes the lumber industry that employed generations of Tennesseans and the large forests that greeted early settlers. For Tennesseans, tulip poplar evokes the Great Smoky Mountains, frontier heritage, and the quality hardwood forests that continue supporting rural communities. The species reflects Tennessee's geographic diversity - growing in every region from the Smokies to the Mississippi River. The tree represents how natural resources shaped Tennessee's development from wilderness to statehood to modern prosperity. Tulip poplar connects modern Tennessee to Cherokee heritage, pioneer cabins, and the towering old-growth forests preserved in the Smokies, including areas summarized in [States That Border Tennessee](/states/tennessee/borders)."

faq:
  - question: "What is the Tennessee state tree?"
    answer: "The Tulip Poplar (Liriodendron tulipifera) is Tennessee's official state tree. The Tennessee General Assembly adopted it in 1947, recognizing the state's most valuable native hardwood and tallest eastern tree."
  
  - question: "What is the Tennessee state tree called?"
    answer: "Tennessee's state tree is called Tulip Poplar, tulip tree, or yellow poplar. The scientific name is Liriodendron tulipifera, meaning 'lily tree bearing tulips.' Cherokee called it canoewood. Early settlers called it tulip tree or whitewood. Despite 'poplar' in the name, it's not a true poplar but belongs to the magnolia family."
  
  - question: "When was the Tennessee state tree adopted?"
    answer: "Tennessee adopted the Tulip Poplar as its official state tree in 1947. The General Assembly passed Public Chapter 51 during the 1947 session, recognizing the tree's economic importance and forest dominance."
  
  - question: "Why is the Tulip Poplar Tennessee's state tree?"
    answer: "Tennessee chose Tulip Poplar because it shaped the state's settlement and economy. The species provided easily worked wood for pioneer cabins and dominated Tennessee's lumber industry for over 150 years. Cherokee hollowed trunks into dugout canoes. The straight-grained wood served in furniture, cabinets, organ pipes, and construction. Old-growth specimens in the Great Smoky Mountains exceed 150 feet tall. The tree grows in every Tennessee region and represented the forest wealth that supported the state's development from wilderness to prosperity."
  
  - question: "What is the Tennessee state tree name?"
    answer: "The name is Tulip Poplar, referring to the tulip-shaped flowers. The scientific name is Liriodendron tulipifera - Liriodendron means 'lily tree,' and tulipifera means 'tulip-bearing.' It's also called tulip tree or yellow poplar. Despite the name, it's in the magnolia family, not a true poplar."
  
  - question: "Where does the Tennessee state tree grow?"
    answer: "The Tulip Poplar grows throughout Tennessee in virtually every county. It thrives across the state from Memphis to the Great Smoky Mountains. The species reaches maximum size in East Tennessee mountain coves. Tennessee lies near the center of tulip poplar's natural range, which extends throughout eastern North America from Massachusetts to Florida and west to Michigan and Louisiana."
  
  - question: "What are some facts about the Tennessee state tree?"
    answer: "The Tulip Poplar grows 80 to 120 feet tall, with some exceeding 150 feet in the Smokies. The four-lobed leaf with a notched tip is distinctive to this species. It's not a true poplar but belongs to the magnolia family. Tulip-shaped flowers bloom yellow-green with orange bands in May-June. Cherokee hollowed trunks into 30-foot canoes. The wood is light, straight-grained, and easily worked. Tennessee shares this tree with Kentucky and Indiana. Old-growth trees exceed eight feet in diameter."
  
  - question: "How do you recognize the Tennessee state tree?"
    answer: "Look for distinctive four-lobed leaves with a notch at the tip, as if the top was cut off. Leaves measure four to six inches across and turn bright yellow in fall. Tulip-shaped flowers (two to three inches) bloom yellow-green with orange bands in late spring. Very tall, straight trunk with relatively narrow crown. Smooth gray bark on young trees becomes furrowed with diamond patterns. Upright cone-like seed clusters break apart in fall. The unique leaf shape provides certain identification."

