faq:
- question: What is Tennessee's state fossil?
  answer: "Tennessee's state fossil is the trigonia clam, Pterotrigonia thoracica, an extinct Cretaceous shellfish designated by the Tennessee General Assembly in 1998."
- question: When did Tennessee adopt its state fossil?
  answer: "Tennessee adopted Pterotrigonia thoracica as its state fossil in 1998."
- question: What did the trigonia clam look like?
  answer: "Pterotrigonia thoracica had a heavily ribbed shell up to 4 inches across, with a distinctive wing-like extension at the rear. Its bold raised ribs and interlocking hinge teeth set it apart from most modern clams."
- question: Where are trigonia clam fossils found in Tennessee?
  answer: "The finest specimens come from the Coon Creek Formation in McNairy County, managed as the Coon Creek Science Center by the Memphis Pink Palace Museum. Cretaceous marine fossils also appear in road cuts and creek beds in Hardeman, Hardin, and Fayette counties in western Tennessee."
- question: When did the trigonia clam live?
  answer: "Pterotrigonia thoracica lived during the Late Cretaceous period, roughly 78 to 66 million years ago. It went extinct at the end of the Cretaceous in the same mass extinction that ended the non-avian dinosaurs."
- question: Why is Pterotrigonia thoracica Tennessee's state fossil?
  answer: "Tennessee chose Pterotrigonia thoracica because the Coon Creek Formation in McNairy County is one of the most productive and well-preserved Cretaceous fossil sites in North America, and this trigonia clam is its most recognized species."

