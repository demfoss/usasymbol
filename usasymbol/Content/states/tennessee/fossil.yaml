- id: facts
  icon: fa-solid fa-lightbulb
  title: Trigonia Clam Facts
  facts:
  - "Tennessee designated Pterotrigonia thoracica as its state fossil in 1998, recognizing the species' close association with the Coon Creek Formation."
- "The Coon Creek Formation in McNairy County has been a scientific study site since the 1880s and preserves some of the best-detailed Cretaceous marine fossils in North America."
- "Some Coon Creek specimens of Pterotrigonia thoracica retain traces of the original shell material and soft-tissue outlines — rare preservation for a 75-million-year-old fossil."
- "The trigoniid family to which Pterotrigonia belongs was once worldwide; today its only living relatives are a few species found exclusively off the coast of Australia and New Zealand."
- "Pterotrigonia thoracica went extinct 66 million years ago in the same mass extinction event that ended the non-avian dinosaurs."

