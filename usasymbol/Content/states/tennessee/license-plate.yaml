sections:
- id: current-blue-plate
  icon: fa-solid fa-id-card
  title: The Current Blue Plate
  paragraphs:
  - Tennessee introduced the current blue passenger base on January 1, 2022. The standard serial format uses white characters on a blue background with the state flag emblem as a separator and "THE VOLUNTEER STATE" at the upper left.
  - The first version of the blue plate also carried `TNVACATION.COM` below the serial. Beginning November 16, 2023, Tennessee removed the travel website from both the standard and "In God We Trust" versions. On the "In God We Trust" option, that phrase moved into the position where the travel website had been.
  - Because plates are issued through inventory, examples with the 2022 website text and later examples without it can overlap on the road. For chronology, the important split is January 1, 2022 for the blue base and November 16, 2023 for the no-website revision.

- id: volunteer-state-meaning
  icon: fa-solid fa-star
  title: What "The Volunteer State" Means on Tennessee Plates
  paragraphs:
  - "\"The Volunteer State\" is Tennessee's best-known nickname and the anchor phrase on its modern passenger plates. The nickname comes from Tennessee's reputation for military volunteer service, especially the large response to calls for troops in the War of 1812 and the Mexican-American War."
  - On license plates, the phrase works as civic identity rather than tourism copy. Even when Tennessee added anniversary wording, a music slogan, a travel website, or an optional "In God We Trust" inscription, "The Volunteer State" remained the phrase that tied the plate back to the state's long-running public identity.
  - The exact start date matters. Tennessee first used the phrase on the 1976-1982 passenger base, not in 1977. After the 1988-1993 base dropped the slogan, "Volunteer State" returned on the 1994 BicenTENNial plate and has stayed in some form on standard plates since.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Tennessee License Plate Slogans by Era
  paragraphs:
  - Tennessee's plate-slogan sequence includes a first Volunteer State run, a no-slogan gap, bicentennial wording, music-tourism branding, website slogans, and the current blue plate.
  versions:
  - name: Volunteer State
    years: 1976-1987
    image: /images/license-plates/tennessee/1977-volunteer-state.jpg
    description: The phrase first appeared on the 1976-1982 base and continued on the 1983-1987 base, usually paired with county-coded serial systems.
  - name: No slogan
    years: 1988-1993
    image: /images/license-plates/tennessee/1988-no-slogan.png
    description: Tennessee's 1988-1993 base did not carry the Volunteer State slogan, creating the key break before the phrase returned for good.
  - name: BicenTENNial / Volunteer State
    years: 1994-1999
    image: /images/license-plates/tennessee/1994-bicentennial.jpg
    description: The BicenTENNial plate commemorated Tennessee's 200 years of statehood. "VOLUNTEER STATE" appeared with the anniversary wordmark, starting the continuous modern run.
  - name: Sounds good to me / Volunteer State
    years: 2000-2005
    image: /images/license-plates/tennessee/2000-sounds-good.jpg
    description: A music-themed tourism base pairing "Sounds good to me" with "Volunteer State." This is Tennessee's clearest tourism-slogan plate before the website era.
  - name: The Volunteer State
    years: January 2006-February 2011
    image: /images/license-plates/tennessee/2006-volunteer-state.jpg
    description: Tennessee introduced a graphic green-hills base with "The Volunteer State" above the state name.
  - name: The Volunteer State / TNVacation.com
    years: February 2011-December 31, 2021
    image: /images/license-plates/tennessee/2011-volunteer-state-tnvacation.jpg
    description: The same graphic base added `www.tnvacation.com` below the serial. An "In God We Trust" option with the green-hills design began July 1, 2017.
  - name: The Volunteer State / TNVacation.com
    years: January 1, 2022-November 15, 2023
    image: /images/license-plates/tennessee/2022-blue-standard.png
    description: The blue base chosen by online vote kept "THE VOLUNTEER STATE" at upper left and placed `TNVACATION.COM` below the serial.
  - name: In God We Trust
    years: 2017-present
    image: /images/license-plates/tennessee/2023-in-god-we-trust.jpg
    description: The "In God We Trust" passenger option began on the green-hills base in 2017 and continued on the blue base. Since the November 2023 revision, the phrase appears where the travel website had been.
  - name: In God We Trust / TNVacation.com
    years: January 1, 2022-November 15, 2023
    image: /images/license-plates/tennessee/2022-in-god-we-trust.jpg
    description: The first blue "In God We Trust" version still carried `TNVACATION.COM` below the serial before the November 2023 no-website revision.

- id: bicentennial-sounds-good
  icon: fa-solid fa-music
  title: BicenTENNial and Sounds Good to Me
  paragraphs:
  - 'The 1994 BicenTENNial plate is one of Tennessee''s cleverest plate wordmarks: it folds "TENN" into "Bicentennial" while still keeping "VOLUNTEER STATE" on the plate. It was issued ahead of Tennessee''s 1796-1996 statehood anniversary.'
  - In 2000, Tennessee moved to the "Sounds good to me" base. The phrase connected license-plate identity to Tennessee music culture, from Nashville country to Memphis blues and rock and roll, while "Volunteer State" remained below the serial.
  - These two plates explain why Tennessee's plate history should not be summarized as only "The Volunteer State." That phrase is the through-line, but Tennessee repeatedly layered it with anniversary, music, travel, and faith-language elements.

timeline:
