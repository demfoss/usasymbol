faq:
- question: What is Tennessee's license plate slogan?
  answer: Tennessee's main license plate slogan is "The Volunteer State." It appears on the current blue plate at the upper left.
- question: When did Tennessee first use "The Volunteer State" on plates?
  answer: Tennessee first used the phrase on the 1976-1982 passenger base. The old 1977 date is a common simplification, but the base itself began in 1976.
- question: Has "The Volunteer State" been continuous forever?
  answer: No. It appeared from 1976 through 1987, disappeared on the 1988-1993 no-slogan base, then returned on the 1994 BicenTENNial plate and has appeared continuously since.
- question: What was Tennessee's "Sounds good to me" plate?
  answer: It was the 2000-2005 Tennessee passenger base. The slogan referenced the state's music identity and appeared together with "Volunteer State."
- question: What changed on Tennessee plates in November 2023?
  answer: Beginning November 16, 2023, Tennessee removed `TNVACATION.COM` from the blue standard and "In God We Trust" plates. The standard plate still carries "THE VOLUNTEER STATE."
- question: Is "In God We Trust" a Tennessee standard plate slogan?
  answer: It is an alternate passenger plate option rather than the single universal standard slogan. The option began in 2017 and continued on the blue base.

