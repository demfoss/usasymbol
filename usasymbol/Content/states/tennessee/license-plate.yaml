intro_text: "**\"The Volunteer State\"** is Tennessee's main license plate slogan. It first appeared on the 1976-1982 passenger base, returned after a short no-slogan period, and has run continuously since the 1994 BicenTENNial plate. Later plates also used music, tourism, and optional **\"In God We Trust\"** branding."
quick_answer: "Tennessee's main license plate slogan is \"The Volunteer State.\" It first appeared on the 1976-1982 base and has been used continuously since 1994. The current blue plate was introduced January 1, 2022 and revised November 16, 2023 to remove `TNVACATION.COM`; the \"In God We Trust\" variant remains available."
