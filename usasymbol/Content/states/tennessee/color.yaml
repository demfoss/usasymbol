expert_quote:
  text: "Tennessee Orange is one of the most powerful examples of a university color achieving genuine statewide cultural identity — in Tennessee, the orange and white of the Volunteers is simply what the state looks like on a Saturday in October."
  source: "University of Tennessee Brand and Licensing Office, Knoxville, Color Identity Documentation"

faq:
  - question: "What are the state colors of Tennessee?"
    answer: "Tennessee's traditional state colors are Orange and White, originating from the University of Tennessee. They have not been formally designated by legislative statute but function as the state's informal color tradition, embraced statewide across commerce, tourism, and civic culture."
  - question: "What is the HEX code for Tennessee Orange?"
    answer: "The official HEX code for Tennessee Orange is #FF8200, corresponding to Pantone PMS 151 as standardized by the University of Tennessee's brand guidelines."
  - question: "Why is Tennessee associated with orange?"
    answer: "Tennessee's association with orange originates from the University of Tennessee Volunteers, who adopted orange and white as official colors in the 1890s. The Volunteers' athletic success and statewide cultural influence spread the color across all 95 Tennessee counties, making it the state's dominant color symbol."
  - question: "Are orange and white Tennessee's official state colors?"
    answer: "Orange and white are considered semi-official state colors in Tennessee. The Tennessee General Assembly has not formally designated official state colors by legislative statute, but orange and white are treated as Tennessee's state color tradition because University of Tennessee culture is visible statewide."
  - question: "What Pantone color is Tennessee Orange?"
    answer: "Tennessee Orange is officially standardized as Pantone PMS 151, a pure, vivid orange with no red undertone, as designated by the University of Tennessee's brand identity guidelines and adopted by the Tennessee Titans NFL franchise."

