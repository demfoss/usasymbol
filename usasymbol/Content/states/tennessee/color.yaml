sections:
  - id: "official-designation"
    title: "Status and History of Tennessee's State Colors"
    style: "default"
    paragraphs:
      - "Tennessee has not formally designated official state colors by legislative statute, placing it among a minority of U.S. states without a codified color tradition. However, orange and white function as Tennessee's state colors in practice, driven by the cultural dominance of the University of Tennessee's brand across all 95 counties of the state. The Tennessee General Assembly has never needed to formalize the designation because the University of Tennessee's orange and white achieved a level of statewide saturation that made legislative action effectively redundant next to symbols like [the Tennessee state flag](/states/tennessee/flag/tennessee-state-flag)."
      - "The semi-official status of orange and white reflects a broader pattern in American state identity, where flagship university colors often outpace legislatively designated state colors in public recognition. In Tennessee's case, the University of Tennessee's orange has saturated daily life across all 95 counties — small businesses paint storefronts orange on game days, state tourism campaigns use it as a defining visual element — making the distinction between official and semi-official status largely academic in practice."
    subsections:
      - subtitle: "University of Tennessee and the Origin of Tennessee Orange"
        text: "The University of Tennessee, founded in Knoxville in 1794 and chartered as a public university in 1879, adopted orange and white as its official colors in the 1890s. According to university tradition, the colors were chosen by a committee that selected orange and white from a field of daisies growing on the Hill, the raised ground at the center of the Knoxville campus where the original university buildings stood. The specific shade of orange — PMS 151, a pure, warm orange with no red undertone — has been standardized by the university's brand guidelines and is enforced consistently across all official applications."
      - subtitle: "Tennessee Orange as a Cultural Phenomenon"
        text: "Tennessee Orange has transcended its origins as a university color to become a statewide symbol with few parallels in American state culture. The University of Tennessee's football program, which plays home games at Neyland Stadium in Knoxville — one of the largest stadiums in the world with a capacity exceeding 100,000 — fills the entire venue with fans dressed in orange on game days, creating the iconic visual known as the 'Big Orange.' The color appears on commercial signage, state tourism materials, civic banners in cities with no direct connection to the university, and even on the Tennessee Welcome Centers that greet travelers entering the state on major interstate highways, including routes summarized on [States That Border Tennessee](/states/tennessee/borders)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Orange and white carry a layered significance in Tennessee that blends the pride of a flagship university with the broader identity of a state whose nickname — the Volunteer State — suggests a spirit of bold, forward commitment. Orange is a color of energy, warmth, and visibility: qualities that resonate with Tennessee's self-image as a state of passionate people and dramatic landscapes, from the Smoky Mountains in the east to the Mississippi Delta in the west. White provides the grounding contrast that gives Tennessee's color tradition its clean, enduring legibility across a century of athletic and civic application, echoing [Tennessee's state motto](/states/tennessee/motto/agriculture-and-commerce)."
    subsections:
      - subtitle: "Orange and the Volunteer State Identity"
        text: "Tennessee earned the nickname the Volunteer State from the exceptional response of its citizens to calls for military service during the War of 1812 and the Mexican-American War, events that preceded the adoption of orange and white by the University of Tennessee by several decades. The pairing of orange — a color associated with courage, determination, and visible presence — with the Volunteer State narrative has proven culturally durable. The University of Tennessee's nickname, the Volunteers, directly echoes the state's historical identity, creating a seamless connection between the university's color and the state's founding mythology."
      - subtitle: "The Smoky Mountains and Natural Resonance"
        text: "Tennessee's geography lends additional resonance to an orange and white palette. The Great Smoky Mountains, which anchor the eastern edge of the state and form the most visited national park in the United States, display spectacular orange, gold, and white autumn foliage each October — the same season as college football. The timing is not coincidental in the public imagination: for many Tennesseans, the turning of the leaves in the Smokies and the opening of football season are emotionally linked experiences, both saturated in orange and white, reinforcing the color tradition's hold on the state's cultural life."

  - id: "state-emblems"
    title: "Usage in Tourism, Commerce, and Civic Identity"
    style: "default"
    paragraphs:
      - "Orange and white appear throughout Tennessee's public landscape in ways that exceed the reach of many officially designated state color programs. The Tennessee Department of Tourist Development has used orange extensively in state branding campaigns, leveraging the color's national recognition through University of Tennessee athletics to create immediate state identification. Tennessee Welcome Centers on major interstates use orange as a primary accent color. Small businesses across the state — particularly in regions with no direct geographic connection to Knoxville — adopt orange and white for storefronts, signage, and promotional materials during football season in a display of statewide solidarity that functions as a form of collective civic identity. The Tennessee Titans NFL franchise uses the same Tennessee Orange (PMS 151) as its primary color, further extending the orange-and-white identity into professional sports and national media markets tied to [Tennessee's state profile](/states/tennessee)."

