seo_title: "Tennessee State Colors | Orange White"
seo_description: "Tennessee state colors are Orange and White, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Tennessee are **Orange** and **White**, originating from the University of Tennessee in Knoxville and now the informal color tradition of [the Volunteer State](/states/tennessee/nickname/the-volunteer-state). Although orange and white have not been formally designated as official state colors by the Tennessee Legislature, they appear throughout state tourism branding, civic culture, and official state imagery. The specifications below list HEX, RGB, CMYK, and Pantone values for Tennessee color matching."

official_colors: "Orange and White"
official_since: "Semi-official (no formal legislative designation; University of Tennessee tradition)"
primary_use: "University of Tennessee athletics and branding, state tourism identity, commercial signage, civic celebrations statewide"
known_for: "Tennessee Orange — one of the most recognizable colors in American collegiate sports — and the white that together form the palette of the University of Tennessee Volunteers, whose identity has permeated every corner of state culture from Memphis to Bristol"

