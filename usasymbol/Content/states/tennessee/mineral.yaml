sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Tennessee State Mineral
    paragraphs:
      - "Agate is Tennessee's official state mineral, first designated the state stone in 1969 and reclassified as the state mineral in 2009. It is a banded, cryptocrystalline variety of quartz best known in Tennessee through the Paint Rock agate found in the state's south-central counties."
      - "Lawmakers picked a stone tied to Tennessee's own creek gravel rather than an imported gem, giving rockhounds and collectors an official mineral rooted in the state's own geology."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Agate?"
    paragraphs:
      - "Agate is a waxy, cryptocrystalline variety of quartz that forms in bands, clouds, or distinct color zones rather than as a single clear crystal. Tennessee's Paint Rock agate typically shows warm bands of red, orange, yellow, and cream."
      - "Tennessee agate forms as nodules weathered out of Mississippian-age chert and limestone, then carried and rounded in creek gravel. Collectors cut and polish the nodules to reveal the banding hidden inside a plain, weathered outer surface."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Tennessee Chose Agate as Its State Mineral"
    paragraphs:
      - "Tennessee agate is collected mainly in the south-central part of the state, in gravel bars near the Alabama line, an area rockhounds have worked for generations. Naming it a state symbol in 1969 gave the state's collecting community official recognition."
      - "State lawmakers did not record a detailed reason for the 2009 change beyond correcting the inconsistent use of 'stone,' 'rock,' and 'mineral' in the original 1969 resolution. The material itself did not change, only its official category and name."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Agate Became Tennessee's State Mineral"
    paragraphs:
      - "The Tennessee General Assembly named agate the official state stone in 1969 under the name Tennessee Paint Rock agate. In 2009, the General Assembly redesignated it the state mineral and simplified the official name to Agate, correcting terminology that had mixed up 'stone,' 'rock,' and 'mineral' in the original resolution."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Agate Facts"
    facts:
      - "First named Tennessee's state stone in 1969 under the name Tennessee Paint Rock agate."
      - "Redesignated the state mineral in 2009, when the General Assembly simplified the official name to Agate."
      - "Collected mainly in south-central Tennessee, in creek gravel near the Alabama state line."
      - "Tennessee agate varieties include iris agate and Greenhaw paint rock agate, both named for local collecting grounds."

