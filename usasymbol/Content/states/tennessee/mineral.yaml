faq:
  - question: What is Tennessee's state mineral?
    answer: "Tennessee's state mineral is agate, a banded variety of quartz best known through the Tennessee Paint Rock agate found in the state's south-central counties."
  - question: When did Tennessee adopt agate as its state mineral?
    answer: "The Tennessee General Assembly first named it the state stone in 1969 as Tennessee Paint Rock agate, then redesignated it the state mineral in 2009."
  - question: Why did Tennessee choose agate?
    answer: "Agate collected from Tennessee's own creek gravel near the Alabama border gave the state's rockhounding community an official mineral tied to local ground, rather than an imported gem."
  - question: What does Tennessee agate look like?
    answer: "It shows bands of red, orange, yellow, and cream inside a plain, weathered outer nodule, visible only once the stone is cut and polished."

