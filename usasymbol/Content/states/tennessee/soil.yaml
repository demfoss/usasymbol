faq:
- question: What is Tennessee's state soil?
  answer: "Tennessee's state soil is the Dickson series, a silty upland soil of the Highland Rim with a dense fragipan about 2 feet below the surface."
- question: Why is it called Dickson soil?
  answer: "The series was first mapped in Dickson County, Tennessee, in 1923 and is named after that county."
- question: What is a fragipan?
  answer: "A fragipan is a dense, brittle subsoil layer that roots and water have trouble passing through. In Dickson soil it usually starts 18 to 36 inches below the surface."
- question: Where is Dickson soil found?
  answer: "Dickson soil covers upland ridges of the Highland Rim in Tennessee, plus northern Alabama and the Pennyroyal region of Kentucky."
- question: What grows on Dickson soil?
  answer: "Hay, pasture, small grains, corn, soybeans, and tobacco. Forested areas grow oaks, hickories, and maples."

