intro_text: "Tennessee's state soil is the Dickson series, a silty upland soil of the Highland Rim with a hard, brittle layer called a fragipan hidden about 2 feet down. It covers more than 400,000 acres and was first mapped in Dickson County. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Tennessee State Soil
  paragraphs:
  - "Dickson soil is an Ultisol, an old, well-weathered soil typical of the warm, humid Southeast. It formed in a silty blanket 2 to 4 feet thick that lies on top of clay weathered from limestone."
  - "Its most unusual feature is the fragipan, a dense, brittle layer that roots and water have trouble getting through. After heavy rain, water can perch on top of the fragipan, which is why Dickson soil is moderately well drained rather than well drained."

- id: history
  icon: fa-solid fa-landmark
  title: Why Tennessee Chose the Dickson Soil
  paragraphs:
  - "The Dickson series was established in 1923 in Dickson County, Tennessee, where it was first mapped. The county survey that described it was published in 1926."
  - "Soil scientists in Tennessee selected Dickson as the state soil because of how much of the state it covers. More than 400,000 acres of Dickson soil have been mapped."

- id: profile
  icon: fa-solid fa-layer-group
  title: Dickson Soil Profile and Horizons
  paragraphs:
  - "A Dickson profile begins with brown silt loam at the surface and yellowish brown silt loam below. A thin pale layer sits on top of the fragipan, which runs from about 2 feet to more than 3 feet deep. Under it lies red, yellow, and white clay weathered from limestone, and at the bottom, soft weathered siltstone."
  layers:
