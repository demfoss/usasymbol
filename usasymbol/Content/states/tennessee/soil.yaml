- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Dickson Soil Is Found
  paragraphs:
  - "Dickson soil covers ridges on the uplands of the Highland Rim, the raised plateau that rings Middle Tennessee's Nashville Basin. It also reaches northern Alabama and the Pennyroyal region of Kentucky."
  - "It usually sits on gentle slopes of 0 to 12 percent, in a climate with about 50 inches of precipitation a year."
  counties:
  - Dickson
  - Cannon

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming on Dickson Soil
  paragraphs:
  - "Dickson soil is used for hay, pasture, small grains, corn, soybeans, and tobacco."
  - "The fragipan limits how deep roots can grow, so crops on Dickson soil can run short of water in dry spells. Wooded areas grow oaks, hickories, and maples."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Dickson Soil Facts
  facts:
  - "Dickson soil is classified as a fine-silty Glossic Fragiudult, an Ultisol with a fragipan."
  - "The series was established in 1923 in Dickson County, Tennessee."
  - "Its official reference profile was described in Cannon County, Tennessee."
  - "More than 400,000 acres of Dickson soil have been mapped."
  - "The fragipan typically starts 18 to 36 inches below the surface."

