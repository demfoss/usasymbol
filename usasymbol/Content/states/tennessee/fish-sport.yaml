- id: facts
  icon: fa-solid fa-lightbulb
  title: Smallmouth Bass Facts
  facts:
  - Adopted in 2005 by the Tennessee Legislature.
  - Scientific name is Micropterus dolomieu.
  - Nicknamed the bronzeback for its bronze color.
  - The Tennessee record weighed 11 pounds, 15 ounces, which is also the world record.
  - Replaced the largemouth bass as Tennessee's state sport fish.
faq:
- question: What is Tennessee's state fish?
  answer: Tennessee's state sport fish is the smallmouth bass. The state also names the channel catfish as its state commercial fish.
- question: When did Tennessee adopt the Smallmouth bass?
  answer: The Tennessee Legislature made the smallmouth bass the state sport fish in 2005.
- question: Why did Tennessee choose the Smallmouth bass?
  answer: It is popular with anglers, and Tennessee has produced some of the largest smallmouth bass ever caught.
- question: Where was the world record smallmouth bass caught?
  answer: It was caught at Dale Hollow Lake in Tennessee on July 9, 1955. It weighed 11 pounds, 15 ounces.
- question: What fish was Tennessee's sport fish before the smallmouth bass?
  answer: The largemouth bass was Tennessee's state sport fish until the smallmouth bass replaced it in 2005.
