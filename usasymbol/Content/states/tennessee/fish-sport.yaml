seo_title: Tennessee State Sport Fish | Smallmouth Bass
seo_description: The Tennessee state sport fish is the smallmouth bass, adopted in 2005. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/tennessee/tennessee-fish-sport-hero.webp
hero_image_alt: A bronze-brown smallmouth bass with dark vertical bars along its sides and a red eye.
hero_image_caption: The smallmouth bass, nicknamed the bronzeback, has been Tennessee's state sport fish since 2005.
intro_text: Tennessee's state sport fish is the smallmouth bass, a hard-fighting bronze bass of the state's streams and lakes, adopted in 2005. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Sport Fish of Tennessee?
  paragraphs:
  - The smallmouth bass has been the official sport fish of Tennessee since 2005. Its scientific name is Micropterus dolomieu.
  - It replaced the largemouth bass, which had held the title before. Tennessee also has a state commercial fish, the channel catfish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Smallmouth Bass
  paragraphs:
  - The smallmouth bass is bronze to brownish green, with dark vertical bars along its sides. Its golden-brown color earned it the nickname bronzeback.
  - Many smallmouth bass have red eyes. Its upper jaw does not reach past the eye, which helps anglers tell it apart from the largemouth bass.
  - The state says it fights harder, ounce for ounce, than any other sport fish in Tennessee.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Sport Fish
  paragraphs:
  - The largemouth bass was Tennessee's first official sport fish. In 2005, state lawmakers passed a law that made the smallmouth bass the new state sport fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Tennessee Chose the Smallmouth Bass
  paragraphs:
  - The state chose the smallmouth bass because it is popular with anglers. Tennessee waters have also produced some of the largest smallmouth bass ever caught.
  - The state and world record fish weighed 11 pounds, 15 ounces. It was caught at Dale Hollow Lake in 1955.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Smallmouth Bass
  paragraphs:
  - Smallmouth bass live in most streams and lakes across Tennessee, but not in West Tennessee.
  - Dale Hollow Lake, on the Tennessee and Kentucky border, is the most famous smallmouth lake in the state. Center Hill Lake also produces big smallmouth bass.
