faq:
  - question: What is Tennessee's state amphibian?
    answer: "Tennessee's state amphibian is the Tennessee cave salamander, adopted by the Tennessee General Assembly in 1995."
  - question: When did Tennessee adopt the Tennessee cave salamander?
    answer: "The Tennessee General Assembly designated the Tennessee cave salamander the official state amphibian in 1995."
  - question: Why did Tennessee choose the Tennessee cave salamander?
    answer: "The salamander is named after the state and is found mainly in Tennessee's cave systems, making it a distinctive choice for a state symbol."
  - question: Is the Tennessee cave salamander endangered?
    answer: "The Tennessee cave salamander is considered a species of conservation concern because it depends on clean, undisturbed cave water to survive."

