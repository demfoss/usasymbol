sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Tennessee?
    paragraphs:
      - "The Tennessee cave salamander is Tennessee's official state amphibian, designated by the Tennessee General Assembly in 1995. Its scientific name is Gyrinophilus palleucus."
      - "It is an aquatic salamander that spends its entire life underground in cave streams and springs, and it is named directly after the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Tennessee Cave Salamander
    paragraphs:
      - "The Tennessee cave salamander has pale pink to white skin, small or reduced eyes, and feathery red external gills that it keeps for its entire life."
      - "It typically grows to about 4 to 8 inches long and lives fully in water, unlike many salamanders that leave the water as adults."
      - "Because it lives in the constant darkness of caves, it does not rely on eyesight and instead senses its surroundings and prey through other cues."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Tennessee General Assembly designated the Tennessee cave salamander the official state amphibian in 1995, recognizing a species named directly after the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Tennessee Chose the Tennessee Cave Salamander
    paragraphs:
      - "The Tennessee cave salamander is named after the state and is found mainly in Tennessee's cave systems, making it a distinctive choice to represent the state's wildlife."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Tennessee Cave Salamander
    paragraphs:
      - "The Tennessee cave salamander lives in cave streams, springs, and underground waters mainly in the Cumberland Plateau and Highland Rim regions of Tennessee."
    sites:
      - name: Cumberland Plateau
        city: Cookeville
        lat: 36.16
        lng: -85.50
        note: "Cave system habitat for the species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Tennessee Cave Salamander Facts
    facts:
      - "Adopted in 1995 by the Tennessee General Assembly."
      - "Named directly after the state of Tennessee."
      - "Keeps its feathery external gills for its entire life."
      - "Lives entirely in water inside cave streams and springs."
      - "Has small or reduced eyes because it lives in total darkness."

