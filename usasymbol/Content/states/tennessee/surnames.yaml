seo:
  title: "Most Common Last Names in Tennessee"
  description: "The most common last names in Tennessee are Smith, Jones, and Johnson, a ranking shaped by Appalachian settlement, Middle Tennessee farms, and West Tennessee cotton counties."

page:
  h1: "Most Common Last Names in Tennessee"
  intro: "The most common last names in Tennessee are Smith, Jones, Johnson, Williams, and Brown, led by English and Welsh names carried through the Appalachian frontier and the Cumberland settlements. Jones ranks unusually high here, reflecting the strength of Welsh and upland British surnames in East and Middle Tennessee, while Williams, Brown, and Jackson also show the imprint of African American families whose legal surnames stabilized after emancipation."
  heritage_title: "Appalachian Roads, Cumberland Farms, and West Tennessee Cotton"
  heritage_body: "Tennessee's surname map follows the state's three grand divisions. East Tennessee was settled early through the Great Valley and Cumberland Gap routes by families from Virginia, North Carolina, and Pennsylvania, which helps explain the weight of Smith, Jones, Moore, Wilson, and Hall. Middle Tennessee grew around the Cumberland settlements after the late 1770s, while West Tennessee's plantation counties and Memphis added larger Black communities, making Williams, Brown, Jackson, Harris, and King more prominent than a purely Appalachian list would suggest."
  fun_fact: "Jones ranks second in Tennessee, ahead of Johnson and Williams, even though it is fifth nationally; that small shift is a clue to the state's strong Welsh and upland British naming layer."

surnames:
  - rank: 1
    name: Smith
    count: 92205
    ratio: 76
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Smith reached Tennessee with early English and Scots-Irish families moving through the Appalachian backcountry, then spread across all three grand divisions because it was already common before statehood in 1796."

  - rank: 2
    name: Jones
    count: 60958
    ratio: 115
    origin: welsh
    type: Patronymic
    meaning: "Son of John, from the Welsh form of the biblical name. Jones ranks higher in Tennessee than it does nationally, a sign of the Welsh and border-country families who moved from Virginia and North Carolina into East Tennessee and the Cumberland settlements."

  - rank: 3
    name: Johnson
    count: 60902
    ratio: 116
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' (God is gracious). Johnson belongs to both sides of Tennessee's history: it came west with frontier settlers and became a common surname among African American families after emancipation."

  - rank: 4
    name: Williams
    count: 54691
    ratio: 129
    origin: english
    type: Patronymic
    meaning: "Son of William, from the Norman name 'Willahelm', meaning will and helm. Williams is common across Tennessee, but it is especially tied to communities where formerly enslaved people established legal family names after the Civil War."

  - rank: 5
    name: Brown
    count: 50098
    ratio: 141
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', meaning brown hair, complexion, or clothing. Brown spread through Tennessee by two routes, with British-origin settler families in the uplands and African American families in Middle and West Tennessee cotton counties."

  - rank: 6
    name: Davis
    count: 46904
    ratio: 150
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid', meaning beloved. Davis was already a common Welsh and English border surname before Tennessee statehood, and its high rank fits the state's heavy settlement from Virginia, North Carolina, and the upper South."

  - rank: 7
    name: Taylor
    count: 33285
    ratio: 212
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a cutter of cloth. Taylor belongs to the medieval trade-name layer that frontier families brought into Tennessee, where craft surnames survived even in rural farming communities."

  - rank: 8
    name: Moore
    count: 31783
    ratio: 222
    origin: english
    type: Habitational
    meaning: "From Old English 'mōr', someone who lived near open, uncultivated ground. Moore fits Tennessee's upland pattern because the name was common among English, Scots-Irish, and sometimes Irish families moving along the Appalachian corridor."

  - rank: 9
    name: Miller
    count: 31119
    ratio: 226
    origin: english
    type: Occupational
    meaning: "A person who operated a grain mill. In Tennessee, Miller reflects the practical economy of creek-powered mills, which became anchor points for early farming settlements before towns and railroads reshaped the landscape."

  - rank: 10
    name: Wilson
    count: 29996
    ratio: 235
    origin: english
    type: Patronymic
    meaning: "Son of Will, a short form of William. Wilson came into Tennessee with English and Scots-Irish families from the older backcountry and remains especially at home in the state's upland naming tradition."

  - rank: 11
    name: Harris
    count: 26541
    ratio: 265
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry. Harris is common in both white and Black Tennessee families, linking old British patronymics with the post-emancipation naming patterns of the state's central and western counties."

  - rank: 12
    name: White
    count: 25060
    ratio: 281
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwīt', often describing pale hair or complexion. White spread through Tennessee as a broad English surname rather than a single family line, which is why it appears across rural counties, towns, and cities alike."

  - rank: 13
    name: Jackson
    count: 25029
    ratio: 281
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval nickname for John. Jackson has special resonance in Tennessee because Andrew Jackson built his political career at the Hermitage near Nashville, while the surname also became common among African American families after emancipation."

  - rank: 14
    name: Martin
    count: 24505
    ratio: 287
    origin: latin
    type: Patronymic
    meaning: "From Latin 'Martinus', meaning of Mars. Martin entered Tennessee through several streams, including English, Scots-Irish, French Huguenot, and Irish Catholic families, which helps the name rank high without belonging to one region alone."

  - rank: 15
    name: Anderson
    count: 24297
    ratio: 290
    origin: scottish
    type: Patronymic
    meaning: "Son of Andrew, from Greek 'Andreas'. Anderson is a classic Scots and northern English patronymic, well matched to Tennessee's migration from Ulster-influenced communities in Pennsylvania, Virginia, and the Carolinas."

  - rank: 16
    name: Thomas
    count: 22124
    ratio: 318
    origin: welsh
    type: Patronymic
    meaning: "From Aramaic 'Toma', meaning twin. Thomas was common among Welsh and English families before Tennessee's rapid early growth, and it also became a familiar surname in African American communities after slavery ended."

  - rank: 17
    name: Thompson
    count: 21869
    ratio: 322
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a short form of Thomas. Thompson reflects the same British patronymic pattern that fills Tennessee's top 20, especially the names carried by families who moved through the Great Valley into the southern Appalachians."

  - rank: 18
    name: Clark
    count: 20893
    ratio: 337
    origin: english
    type: Occupational
    meaning: "From Old English 'clerc', a clerk, scholar, or churchman. Clark's rank shows how medieval status and office names traveled west with ordinary farming families, long after the original occupation had faded."

  - rank: 19
    name: King
    count: 20884
    ratio: 337
    origin: english
    type: Descriptive
    meaning: "From Old English 'cyning', originally a nickname for someone connected with a royal household or pageant role. King is common in Tennessee's Black and white communities, and its rise after 1865 gave the old nickname a new association with dignity and self-definition."

  - rank: 20
    name: Hall
    count: 20650
    ratio: 341
    origin: english
    type: Habitational
    meaning: "A person who lived or worked at a hall, manor house, or large residence. Hall is stronger in Tennessee than in the national ranking, fitting a state where old English place and household names survived in mountain and valley communities."

unique_surnames:
  - name: Hensley
    state_rank: 111
    national_rank: 664
    origin: english
    why: "Hensley is far more visible in Tennessee than nationally, with the state holding more than one-tenth of the U.S. total in the Forebears ranking. The name fits the Appalachian surname belt that runs through East Tennessee and neighboring mountain counties."

  - name: Shelton
    state_rank: 79
    national_rank: 312
    origin: english
    why: "Shelton ranks in Tennessee's top 80 while sitting much lower nationally, a pattern typical of old upper-South families that multiplied through rural county networks. Its English origin points to a settlement name, usually a shelf or ledge near a farmstead."

  - name: Holt
    state_rank: 84
    national_rank: 323
    origin: english
    why: "Holt is a compact old English place-name meaning a small wood or grove, and Tennessee carries a noticeably high share of it. Its strength matches the state's older rural settlement zones, where landform surnames often stayed local for generations."

  - name: Lawson
    state_rank: 74
    national_rank: 245
    origin: english
    why: "Lawson ranks much higher in Tennessee than in the country as a whole. The name means son of Lawrence, and its Tennessee concentration reflects the same upland British naming stream that lifted Jones, Moore, Wilson, and Hall."

  - name: Webb
    state_rank: 48
    national_rank: 137
    origin: english
    why: "Webb is an occupational surname for a weaver, and it is unusually common in Tennessee compared with its national rank. Its high placement preserves a medieval craft name inside a state better known for farm, frontier, and Appalachian family lines."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Four of Tennessee's top 20 are occupational names: Smith, Taylor, Miller, and Clark. Their survival in the ranking shows how medieval trades became hereditary surnames long before the families carrying them reached the Appalachian frontier."
    examples:
      - Smith (metalworker)
      - Taylor (tailor)
      - Miller (grain mill operator)
      - Clark (clerk or scholar)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Tennessee's top 20, including Jones, Johnson, Williams, Davis, Wilson, Harris, Jackson, Anderson, Thomas, and Thompson. The pattern reflects British and Welsh naming customs carried west by settlers from Virginia and North Carolina, then reinforced as newly free Black Tennesseans formalized family names after 1865."
    examples:
      - Jones (son of John)
      - Williams (son of William)
      - Davis (son of David)
      - Anderson (son of Andrew)

  - type: Habitational Names
    icon: fa-solid fa-map-location-dot
    description: "Moore and Hall are the top 20's clearest habitational surnames, both rooted in the places where medieval families lived or worked. Tennessee's more distinctive names, including Shelton and Holt, show the same place-name habit in a more regional form."
    examples:
      - Moore (near a moor)
      - Hall (near or at a hall)
      - Shelton (shelf settlement)
      - Holt (small wood)

faq:
  - question: "What are the most common last names in Tennessee?"
    answer: "The most common last names in Tennessee are Smith, Jones, Johnson, Williams, and Brown. Smith ranks first statewide, while Jones ranks second, higher than its national position."

  - question: "Why is Jones so common in Tennessee?"
    answer: "Jones is especially common in Tennessee because Welsh and British border-country surnames moved into the state through the Appalachian backcountry and the Cumberland settlements. That migration pattern helps Jones outrank Johnson and Williams in Tennessee."

