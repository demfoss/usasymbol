type: State Coat of Arms
state: Tennessee
name: Tennessee State Coat of Arms
adopted_year: 1802
is_official: true
meaning: "The Tennessee coat of arms states the economy of 1802 in two words and four images. Agriculture sits above the dividing line: a plow, a sheaf of wheat, and a cotton plant. Commerce sits below: a riverboat moving on water. The Roman numeral XVI at the top marks Tennessee as the 16th state to enter the Union, the single fact the founders considered important enough to place above everything else."
meaning_title: Meaning of the Tennessee Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Tennessee Coat of Arms: Meaning, Symbols and History'
seo_description: "The Tennessee coat of arms was adopted in 1802 and shows a plow, wheat, and cotton above for agriculture, and a riverboat below for commerce."
hero_image: /images/coats-of-arms/tennessee/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Tennessee, showing XVI at top, agriculture symbols above and a riverboat below, with the motto Agriculture and Commerce
hero_image_caption: The Tennessee Coat of Arms, first used April 24, 1802. The design divides into agriculture above and commerce below, with the Roman numeral XVI marking Tennessee as the 16th state.
intro_text: "The Tennessee coat of arms divides into two halves matching its motto: a plow, sheaf of wheat, and cotton plant above for agriculture, and a riverboat below for commerce. The design was created in 1801 by William and Matthew Atkinson and first used by Governor Archibald Roane on April 24, 1802. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Tennessee Coat of Arms?
  paragraphs:
  - "The design is circular rather than a traditional heraldic shield. A horizontal line divides the circle into two equal halves, with the word AGRICULTURE labeling the upper section and COMMERCE labeling the lower one. The upper half holds three agricultural symbols; the lower half holds a riverboat on water."
  - "Tennessee uses this design as both its Great Seal and its coat of arms. Around the outer edge, the words The Great Seal of the State of Tennessee run above and the year 1796 appears below, marking the year Tennessee entered the Union. The Roman numeral XVI sits prominently at the very top of the inner design."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Tennessee Coat of Arms
  paragraphs:
  - "Tennessee entered the Union on June 1, 1796, as the 16th state, and its first constitution required an official seal. However, Governors John Sevier and Archibald Roane used personal seals for the next several years while the design was being arranged."
  - "On September 25, 1801, the Tennessee General Assembly appointed committees to prepare a design and motto. The state contracted William and Matthew Atkinson, seal makers, to produce the physical seal. Governor Roane applied it officially for the first time on April 24, 1802."
  - "The design remained largely unchanged for over a century. In 1929, the phrase Feb. 6th, 1796 was removed from the outer ring. In 1987, the 95th General Assembly passed Public Chapter 402, which replaced the original boatman figure in the lower half with a larger, more detailed rigged vessel and standardized the design for all official uses. That 1987 version is the current standard."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Tennessee Coat of Arms
  paragraphs:
  - "The design uses six distinct elements arranged within two semicircles. Each is labeled or identified by its position within the halved circle."
  elements:
  - id: xvi
    name: The Roman Numeral XVI
    image: /images/coats-of-arms/tennessee/elements/xvi.webp
    paragraphs:
    - "The Roman numeral XVI sits at the top of the inner circle, above the agricultural scene. XVI equals 16 in Arabic numerals. It marks Tennessee's place in the order of statehood: the 16th state to enter the Union, admitted on June 1, 1796."
    - "Placing the numeral at the very top, above the agricultural and commercial symbols, was a deliberate choice. The order of statehood was considered the single most defining fact about Tennessee's identity at its founding."
  - id: agriculture
    name: Plow, Sheaf of Wheat, and Cotton Plant
    image: /images/coats-of-arms/tennessee/elements/agriculture.webp
    paragraphs:
    - "The upper half holds three agricultural symbols arranged side by side: a plow on the left, a sheaf of wheat in the center, and a cotton plant on the right. The word AGRICULTURE appears below them. Together they represent the farming economy that defined Tennessee's river valleys in the early 1800s."
    - "Each crop or tool points to a different part of that economy. The plow represents the labor of cultivation. The wheat represents grain farming, which sustained settlements across middle and east Tennessee. The cotton plant represents the cash crop economy of west Tennessee and the lowlands."
  - id: riverboat
    name: The Riverboat
    image: /images/coats-of-arms/tennessee/elements/riverboat.webp
    paragraphs:
    - "The lower half shows a riverboat on water. The word COMMERCE appears below the vessel. The boat represents the waterways that carried Tennessee's agricultural goods to market, particularly the Mississippi River and the Tennessee River system."
    - "In the original 1802 design, a boatman figure appeared alongside the vessel. The 1987 revision replaced that figure with a larger, more detailed rigged riverboat. The meaning remained the same: the water routes that turned farm production into trade."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Tennessee Coat of Arms
  paragraphs:
  - "The horizontal split in the design is not decorative. It is a statement about how Tennessee's founders understood the state's economy. Agriculture and commerce were not the same activity; they were two halves of a working system. Farming produced goods; waterway commerce moved them."
  - "The choice to label each half directly was also deliberate. Most state coats of arms use symbols alone and leave meaning implicit. Tennessee labeled each section with its category and then put the category name in its motto. The coat of arms and the motto say the same thing twice, in images and in words."
  - "XVI at the top sits outside the agriculture-commerce split entirely. Statehood order was the founding generation's way of measuring belonging: Tennessee was the 16th state, not a territory anymore, and the designers made certain that fact appeared first."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Tennessee Coat of Arms Facts
  facts:
  - "First use: April 24, 1802, by Governor Archibald Roane. The design was created by seal makers William and Matthew Atkinson, contracted after the General Assembly appointed design committees on September 25, 1801."
  - "Tennessee entered the Union on June 1, 1796, as the 16th state. The Roman numeral XVI at the top of the design records that fact."
  - "The 1987 revision under Public Chapter 402 replaced the original boatman figure with a larger rigged riverboat and standardized the design for all official reproductions."
  - "The motto Agriculture and Commerce was inscribed on the seal from its first use in 1802 but was not officially designated as the state motto until 1987."
  - "A small change in 1929 removed the phrase Feb. 6th, 1796 from the outer ring of the design. That was the only alteration between 1802 and 1929."
  - "Tennessee uses the same circular design as both its Great Seal and its coat of arms. No separate traditional heraldic shield form was created."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Tennessee Coat of Arms
  paragraphs:
  - "The Tennessee design has been re-engraved and standardized over time, but the core imagery has remained the same: XVI at the top, agriculture in the upper half, and a vessel for commerce in the lower half."
  - "The clearest documented visual milestones are a nineteenth-century printed rendering and the standardized modern artwork adopted in 1987. Earlier statutory changes, including the 1929 border-text revision, did not create a completely different composition."
  versions:
  - name: Historical Print
    years: 1879
    image: /images/coats-of-arms/tennessee/versions/historical-print-1879.jpg
    description: A public-domain 1879 printed rendering of the Tennessee seal from The American Cyclopaedia. It preserves the long-used agriculture-and-commerce composition before twentieth-century standardization.
  - name: Official Standard
    years: 1987-present
    image: /images/coats-of-arms/tennessee/versions/official-standard-1987.png
    description: The current official version adopted under Public Chapter 402 by the 95th General Assembly in 1987. The boatman figure was replaced by a larger, more detailed rigged riverboat, and the design was standardized for official state use.

faq:
- question: What does the Tennessee coat of arms show?
  answer: "The design divides into two halves. The upper half shows three agricultural symbols: a plow, a sheaf of wheat, and a cotton plant, labeled AGRICULTURE. The lower half shows a riverboat on water, labeled COMMERCE. The Roman numeral XVI sits at the top, marking Tennessee as the 16th state."
- question: What does XVI mean on the Tennessee coat of arms?
  answer: "XVI is the Roman numeral for 16. It marks Tennessee's place in the order of statehood: Tennessee was the 16th state to enter the Union, admitted on June 1, 1796."
- question: When was the Tennessee coat of arms adopted?
  answer: "The design was created by seal makers William and Matthew Atkinson after the General Assembly appointed committees on September 25, 1801. Governor Archibald Roane first used it officially on April 24, 1802."
- question: What do the plow, wheat, and cotton mean?
  answer: "The plow represents the labor of farming. The sheaf of wheat represents grain crops, which sustained settlements across middle and east Tennessee. The cotton plant represents the cash crop economy of west Tennessee. Together they are labeled AGRICULTURE on the coat of arms."
- question: Why does the design show a riverboat?
  answer: "The riverboat represents commerce, specifically the river trade that carried Tennessee's farm goods to market. The Tennessee and Mississippi river systems were the primary routes for moving agricultural products in the early 1800s. The lower half of the design is labeled COMMERCE."
- question: What changed in 1987?
  answer: "The 95th General Assembly passed Public Chapter 402, which replaced the original boatman figure in the lower half with a larger, more detailed rigged riverboat. The 1987 version also officially designated Agriculture and Commerce as the state motto for the first time."

