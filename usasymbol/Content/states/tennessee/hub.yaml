name_meaning:
  heading: What Does Tennessee Mean?
  paragraphs:
  - Tennessee entered the Union in 1796 as the 16th state. The name is usually traced to Tanasi or Tanasqui, names associated with Cherokee towns in the region.
  - "The state name reaches into Indigenous geography, while the official symbols here lean heavily into later state identity: volunteers, agriculture, commerce, horse breeding, and practical working symbols."
  - Tennessee's postal abbreviation is TN, and residents are Tennesseans. Volunteer State remains the state's strongest identity phrase.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Usually traced to Tanasi or Tanasqui, names associated with Cherokee towns.
    - label: Statehood
      text: Tennessee became the 16th state in 1796.
    - label: Motto
      text: Agriculture and Commerce is Tennessee's state motto.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Tennessee, a state stretching from the Mississippi River to the Appalachian Mountains.
    - label: Regions
      text: The three-star flag design is often associated with Tennessee's three grand divisions.
    - label: People
      text: People from Tennessee are called Tennesseans.
  - heading: Nicknames and Short Forms
    items:
    - label: The Volunteer State
      text: Main nickname tied to Tennessee military volunteer traditions.
    - label: TN
      text: Postal abbreviation and common short form.
    - label: Abbreviation
      text: TN; older short form Tenn.
editorial:
  heading: What Tennessee's Symbols Say About the State
  paragraphs:
  - The [Volunteer State nickname](/states/tennessee/nickname) gives Tennessee a public identity built around service and military memory, while the [flag](/states/tennessee/flag) reduces the state to a bold three-star design.
  - The [Tennessee Walking Horse](/states/tennessee/mammal/tennessee-walking-horse) is the most locally named animal page in the hub. It gives Tennessee a breeding and show-horse tradition rather than a generic wildlife pick.
  - The [tulip poplar](/states/tennessee/tree), [iris](/states/tennessee/flower), [mockingbird](/states/tennessee/bird), and [raccoon](/states/tennessee/mammal/raccoon) keep the guide in eastern and southern landscapes, while the [Barrett M82 / M107](/states/tennessee/firearm) adds a modern manufacturing symbol.
faq:
- question: What is Tennessee's most famous state symbol?
  answer: The [Volunteer State nickname](/states/tennessee/nickname) is Tennessee's clearest public shorthand and appears far beyond official-symbol lists.
- question: What is Tennessee's state bird?
  answer: Tennessee has used the [northern mockingbird](/states/tennessee/bird) as its bird emblem since 1933.
- question: What is Tennessee's state flower?
  answer: The [iris](/states/tennessee/flower) became Tennessee's flower symbol in 1933.
- question: Why is the Tennessee Walking Horse listed?
  answer: The [Tennessee Walking Horse](/states/tennessee/mammal/tennessee-walking-horse) reflects a horse breed and show tradition strongly tied to the state.
- question: How many official state symbols does Tennessee have?
  answer: Tennessee's guide includes the flag, mockingbird, iris, tulip poplar, motto, nickname, colors, milk, Tennessee Walking Horse, raccoon, shelter dogs and cats, and Barrett firearm.
