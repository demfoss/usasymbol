seo_description: "Tennessee state symbols: official state symbols include the northern mockingbird, iris, tulip poplar, Volunteer State nickname, and Agriculture and Commerce motto."
snippet_answer: Find out more about the official state symbols that represent Tennessee, from the northern mockingbird and iris to the tulip poplar, Volunteer State nickname, and Agriculture and Commerce motto. The Tennessee Walking Horse, shelter animal designations, and Barrett M82 make Tennessee's list one of the more wide-ranging in the Southeast.
