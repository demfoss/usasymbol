sections:
  - id: overview
    icon: fa-solid fa-music
    title: Tennessee State Song
    paragraphs:
      - "\"My Homeland, Tennessee\" was Tennessee's first official state song, adopted in 1925. Nell Grayson Taylor wrote the words and Roy Lamont Smith composed the music, winning a statewide contest for a patriotic state song."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"My Homeland, Tennessee\" Explained"
    paragraphs:
      - "The song opens with the line \"O Tennessee, that gave us birth,\" setting a formal, reverent tone that praises the state as a homeland worth honoring. It moves at a steady, hymn-like pace suited to school assemblies and civic occasions."
      - "Nell Grayson Taylor, a published poet and World War I nurse, wrote the lyrics for a contest seeking a patriotic Tennessee song. Roy Lamont Smith, who taught at the Cadek Conservatory of Music in Chattanooga, composed the music, and the pairing won the competition."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "My Homeland, Tennessee" Represents Tennessee
    paragraphs:
      - "The song won a statewide contest specifically designed to find a patriotic anthem for Tennessee, giving it a built-in claim to represent the whole state rather than one region or genre. Its formal tone matched what lawmakers in the 1920s expected from an official state song."
      - "Because it became the state's first official song, it set the pattern Tennessee has followed ever since: rather than replacing an outdated song, the state simply keeps adding new ones alongside it. Tennessee now recognizes nearly 20 official state songs, more than any other state, with \"My Homeland, Tennessee\" still holding its place as the original."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"My Homeland, Tennessee\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "My Homeland, Tennessee" Became Tennessee's State Song
    paragraphs:
      - "The Tennessee General Assembly adopted \"My Homeland, Tennessee\" in 1925 after it won a statewide contest for a patriotic state song. Rather than replacing it over time, Tennessee has continued adding official state songs alongside it, including \"Tennessee Waltz\" in 1965 and \"Rocky Top\" in 1982, building the largest collection of state songs of any state in the country."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Tennessee

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"My Homeland, Tennessee\" Facts"
    facts:
      - "Tennessee adopted \"My Homeland, Tennessee\" as its first official state song in 1925."
      - "Nell Grayson Taylor, a World War I nurse and published poet, wrote the lyrics."
      - "The song won a statewide contest for a patriotic Tennessee anthem."
      - "Tennessee has since adopted nearly 20 official state songs in total, more than any other state, including \"Tennessee Waltz\" and \"Rocky Top.\""

