title: "Tennessee State Wild Animal | Raccoon"
scientific_name: "Procyon lotor"
adopted_year: 1971

seo_title: "Tennessee State Wild Animal | Raccoon"
seo_description: "Tennessee's state wild animal is the Raccoon, adopted in 1971. Learn why this official Tennessee symbol was chosen and what it represents."

intro_text: "The Raccoon is the official Tennessee state wild animal, designated in 1971. This page gives the direct answer for searches like 'tennessee state wild animal', 'tennessee state animal', and 'tennessee state mammal' while explaining how the symbol fits the state's official animal designations. Distinctive black mask and ringed tail; Davy Crockett's coonskin cap; featured in state painting 'Tennessee Treasures'; intelligent and adaptable; Tennessee Titans mascot T-Rac."

common_name: "Raccoon"
official_since: "1971"
status: "Common throughout Tennessee; stable population; hunted as fur-bearing game animal"
