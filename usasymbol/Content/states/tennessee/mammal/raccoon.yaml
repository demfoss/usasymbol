faq:
  - question: "What is Tennessee's state wild animal?"
    answer: "Tennessee's state wild animal is the raccoon (Procyon lotor), designated through House Joint Resolution 156, which was signed by Governor Winfield Dunn on May 21, 1971."
  
  - question: "When was the raccoon designated as Tennessee's state wild animal?"
    answer: "The raccoon became Tennessee's official state wild animal on May 21, 1971, when Governor Winfield Dunn signed House Joint Resolution 156 passed by the 87th Tennessee General Assembly."
  
  - question: "Why did Tennessee choose the raccoon as its state wild animal?"
    answer: "Tennessee chose the raccoon to honor the state's frontier heritage, particularly Davy Crockett's legendary coonskin cap and the rich coon hunting tradition passed through generations. The resolution noted that raccoons were abundant throughout Tennessee, valued as important fur-bearing game animals, and that people nationwide associated Tennessee with Davy Crockett and coon hunting. The raccoon symbolized Tennessee's outdoor traditions, pioneer resourcefulness, and rural culture that remained vibrant despite modernization."
  
  - question: "Where can I see raccoons in Tennessee?"
    answer: "Raccoons are abundant throughout Tennessee and can be seen in Great Smoky Mountains National Park (especially Cades Cove), Reelfoot Lake State Park, Radnor Lake State Park in Nashville, Shelby Farms Park in Memphis, and suburban parks statewide. Raccoons are primarily nocturnal, making dusk the best viewing time. Many Tennessee residents encounter raccoons in their own yards, though wildlife officials warn against feeding them."
  
  - question: "What is the connection between raccoons and Davy Crockett?"
    answer: "Davy Crockett, born in Greene County (then North Carolina) in 1786, became Tennessee's most famous frontiersman and wore coonskin caps made from raccoon pelts. Crockett wore his coonskin cap even while serving in the U.S. House of Representatives representing Tennessee from 1827-1835, symbolizing frontier independence and connection to common people. Disney's 1954-1955 Davy Crockett television series starring Fess Parker created a national craze for coonskin caps that cemented the association between raccoons, Davy Crockett, and Tennessee in American popular culture."
  
  - question: "Are raccoons common in Tennessee?"
    answer: "Yes, raccoons are abundant throughout Tennessee, occurring in all 95 counties from mountain forests to river bottoms to urban neighborhoods. The 1971 designation resolution specifically noted that raccoons exist 'in great abundance throughout the entire State of Tennessee.' The population remains stable and healthy, supporting both recreational hunting and commercial trapping while thriving in diverse habitats including wilderness, agricultural, suburban, and urban environments."
  
  - question: "Can you hunt raccoons in Tennessee?"
    answer: "Yes, Tennessee classifies raccoons as fur-bearing game animals with regulated hunting and trapping seasons managed by the Tennessee Wildlife Resources Agency. Raccoon hunting traditionally occurs at night using specially trained coonhounds to track and tree raccoons. Coon hunting remains a popular Tennessee tradition that the 1971 designation resolution specifically honored, noting that without this sport, many rich and colorful stories would never have been possible to pass between generations."
  
  - question: "What is Tennessee's state painting and does it feature raccoons?"
    answer: "Tennessee's official state painting is 'Tennessee Treasures' by artist Michael Sloan, designated in 1997. The painting prominently features the raccoon along with nine other recognizable Tennessee symbols including the mockingbird, iris, passion flower, tulip poplar, Tennessee River pearl, ladybug, zebra swallowtail butterfly, largemouth bass, and limestone. The raccoon's inclusion demonstrates its status as one of Tennessee's most iconic natural symbols."

