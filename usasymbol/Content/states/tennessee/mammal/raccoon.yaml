sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Tennessee General Assembly designated the raccoon as the official state wild animal through House Joint Resolution 156, approved by the 87th General Assembly on May 17, 1971, and signed by Governor Winfield Dunn on May 21, 1971. The resolution recognized raccoons as abundant throughout Tennessee and valued as one of the state's most important fur-bearing game animals, reinforcing [the Volunteer State narrative](/states/tennessee/nickname/the-volunteer-state)."
      - "The designation occurred during a period when Tennessee expanded recognition of natural heritage symbols. The mockingbird became state bird in 1933, the tulip poplar became state tree in 1947, and the iris became state cultivated flower in 1973, creating comprehensive acknowledgment of Tennessee's wildlife and natural resources."
    
    subsections:
      - subtitle: "The Resolution's Language"
        text: "House Joint Resolution 156 included eloquent language connecting raccoons to Tennessee identity. The resolution noted that the coonskin cap has been displayed in the Halls of Congress and on the frontier with equal candor, and that most small boys and men alike across the nation think of Tennessee as the home hunting ground of Davy Crockett, green mountains, and coons. The resolution emphasized that without the sport of coon hunting, many rich and colorful stories would never have been possible to be related from one generation to another for centuries to come, highlighting the cultural importance of raccoons beyond their biological or economic value."
      
      - subtitle: "Coon Hunting Heritage"
        text: "The designation explicitly honored coon hunting as a Tennessee tradition spanning generations. The resolution stated that without the sport of coon hunting, many men would have missed the invigorating benefits and enriching experiences that came from this nighttime pursuit through Tennessee forests. Coon hunting involved releasing trained hounds to track raccoons by scent, following the chase through darkness by listening to dogs' distinctive baying, and gathering around trees where raccoons sought refuge. This sport created social bonds among hunters, developed legendary hunting dogs, and generated countless stories exchanged around campfires and country stores across rural Tennessee."
      
      - subtitle: "Why Tennessee Chose the Raccoon"
        text: "Tennessee selected the raccoon over other potential state animals because of its unique combination of abundance, cultural significance, and economic importance. The raccoon occurred throughout all three grand divisions of Tennessee—East Tennessee mountains, Middle Tennessee heartland, and West Tennessee river bottoms—making it truly representative of the entire state. The species held high esteem as a valuable game animal supporting both subsistence hunting and commercial fur trapping industries. Most importantly, the raccoon connected Tennessee to frontier heritage through Davy Crockett's legendary coonskin cap, creating immediate recognition nationwide of Tennessee's outdoor traditions and pioneer spirit."

  - id: "state-symbolism"
    icon: "fa-mask"
    title: "What the Raccoon Represents"
    style: "highlight"
    paragraphs:
      - "The raccoon embodies resourcefulness, adaptability, and cleverness—qualities that defined Tennessee pioneers who settled mountains, valleys, and river bottoms. This masked bandit thrives in diverse habitats from wilderness forests to modern cities, demonstrating the flexibility needed to succeed in changing conditions."
      - "For centuries, raccoons provided Tennessee families with warm winter clothing and supplemental income from fur sales. The species' pelt proved ideal for frontier garments because raccoon fur sheds water while providing insulation, making coonskin caps practical as well as symbolic."
      - "The designation recognizes not just a wildlife species but Tennessee's identity as a state where outdoor traditions remain vibrant despite urbanization. When Tennessee chose an animal associated with hunting dogs, moonlit chases, and campfire storytelling, it celebrated rural heritage that continues shaping state culture."
    
    subsections:
      - subtitle: "Davy Crockett and the Coonskin Cap"
        text: "Davy Crockett, born in Greene County (then part of North Carolina) in 1786, became Tennessee's most legendary frontiersman, wearing coonskin caps that symbolized frontier independence and wilderness skills. Crockett served three terms representing Tennessee in the U.S. House of Representatives from 1827 to 1835, famously wearing his coonskin cap even in the halls of Congress to emphasize his frontier roots and connection to common people. He became known as 'a gentleman from the cane' because of his deerhide and coonskin attire. The coonskin cap worn by Crockett in Congress and on the frontier embodied Tennessee's rejection of eastern sophistication in favor of practical, self-reliant frontier values."
      
      - subtitle: "Disney's Davy Crockett Craze"
        text: "The coonskin cap achieved unprecedented national prominence through Disney's Davy Crockett television series starring Fess Parker, which aired on Disneyland from December 1954 to February 1955. The show created a merchandising phenomenon that sold approximately 5,000 coonskin caps daily at peak popularity, making Tennessee's frontier heritage familiar to millions of children across America and the United Kingdom. While these mass-produced caps used faux fur rather than authentic raccoon pelts, they cemented the association between raccoons, Tennessee, and American frontier mythology. The cultural impact persisted for decades, influencing Tennessee's 1971 decision to honor the animal behind this iconic headwear."
      
      - subtitle: "Original Coonskin Cap Traditions"
        text: "Coonskin caps originated with Native American peoples in Kentucky, Tennessee, and West Virginia who developed this practical winter headwear centuries before European settlement. The design utilized the entire raccoon pelt including the head and tail, providing excellent insulation while the water-repellent guard hairs shed rain and snow. European pioneers settling Tennessee in the late 1700s and early 1800s adopted coonskin caps for hunting, trapping, and everyday cold weather wear. The caps became particularly associated with Tennessee and Kentucky frontiersmen including Daniel Boone, Meriweth Lewis, and Davy Crockett, though historical evidence suggests Daniel Boone actually preferred felt hats made from beaver rather than coonskin."
      
      - subtitle: "Coon Hunting Culture"
        text: "Coon hunting developed into Tennessee's distinctive nighttime sport combining woodsmanship, dog breeding, and social tradition. Hunters prized coonhounds—including Bluetick Coonhounds later designated Tennessee's state dog in 2019—for their ability to track raccoons by scent across miles of rough terrain and tree the quarry with distinctive vocalizations audible from great distances. Experienced hunters could identify individual dogs by their unique voices during chases lasting hours through darkness. Competitive coon hunts judged dogs' tracking ability, treeing speed, and voice quality, while casual hunts provided opportunities for fathers to teach sons outdoor skills and for rural communities to gather in fellowship that strengthened social bonds."
      
      - subtitle: "Tennessee Titans' T-Rac Mascot"
        text: "The Tennessee Titans selected a raccoon as their mascot when the franchise debuted in 1999 following relocation from Houston, honoring Tennessee's state wild animal. Owner Bud Adams personally selected the raccoon design over alternatives including a Greek god figure, recognizing that a raccoon mascot would connect the team to Tennessee heritage and provide immediate recognition among local fans. The mascot T-Rac, combining 'Titans' and 'raccoon,' made his debut on August 27, 1999, during a preseason game against the Atlanta Falcons at Adelphia Colisium (now Nissan Stadium). The choice demonstrated how deeply raccoon symbolism penetrates Tennessee identity nearly three decades after the 1971 state animal designation."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify Raccoons"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Raccoons display stocky, medium-sized builds with distinctive markings that make them unmistakable even at distance. Adults measure 26 to 38 inches in total length, with the bushy tail accounting for 8 to 12 inches of that measurement. The characteristic black mask outlined in white across the eyes creates the 'masked bandit' appearance, while the tail shows 4 to 7 alternating rings of black and yellowish-gray fur."
        list_items:
          - "**Size**: 26-38 inches total length; tail 8-12 inches; weight 12-25 pounds (males larger than females)"
          - "**Coloration**: Grizzled brown and black upperparts; gray underparts; black mask outlined in white across eyes; ringed tail"
          - "**Distinctive Features**: Pointed snout; head widens toward body; delicate front paws with long fingers used like hands; rounded ears 2-2.5 inches tall"
          - "**Behavior**: Nocturnal; excellent climber and swimmer; walks with bear-like gait; solitary except during breeding season"
      
      - subtitle: "Intelligence and Dexterity"
        text: "Raccoons demonstrate exceptional problem-solving abilities and manual dexterity that enable them to thrive in diverse environments. Their front paws contain specialized mechanoreceptors providing acute tactile sensitivity, allowing raccoons to manipulate objects with remarkable precision even underwater. This dexterity enables raccoons to open containers, turn doorknobs, unlatch gates, and extract food from challenging locations, leading to their reputation as clever raiders of garbage cans and campsites. The name 'raccoon' derives from the Algonquian word 'aroughcoune' meaning 'he who scratches with his hands,' acknowledging these manipulative abilities observed by Native Americans."
      
      - subtitle: "Food Washing Behavior"
        text: "Raccoons famously appear to wash their food before eating, dipping items in water and manipulating them with their front paws in repeated motions. Scientists debate whether this behavior actually cleans food or serves other purposes such as increasing tactile information about food items, removing unwanted parts, or simply engaging sensory receptors concentrated in their paws. Raccoons perform these washing motions even without water present, suggesting the behavior relates more to tactile exploration than cleanliness. The scientific name Procyon lotor references this trait, with 'lotor' meaning 'washer' in Latin."

  - id: "in-the-state"
    icon: "fa-map-marker-alt"
    title: "Raccoons in Tennessee"
    style: "default"
    paragraphs:
      - "Raccoons occur in great abundance throughout Tennessee, inhabiting all 95 counties from Great Smoky Mountains elevations exceeding 6,000 feet to Mississippi River bottomlands at 200 feet elevation. The species thrives in Tennessee's diverse habitats including mountain forests, agricultural valleys, river swamps, and urban neighborhoods."
      - "Tennessee's raccoon population remains stable and healthy, supporting both recreational hunting and commercial fur trapping. The Tennessee Wildlife Resources Agency manages raccoons as a fur-bearing game species with regulated seasons ensuring sustainable harvest while maintaining abundant populations for hunting traditions and ecological functions."
    
    facts:
      - "**Great Smoky Mountains**: Raccoons common in cove hardwood forests, stream corridors, and campgrounds where natural and human food sources abound"
      - "**Middle Tennessee**: Agricultural areas with mixture of cropland and woodlots provide ideal habitat; raccoons abundant along Cumberland River tributaries"
      - "**West Tennessee**: Bottomland hardwood swamps along Mississippi River and its tributaries support dense raccoon populations feeding on crayfish, mussels, and fish"
      - "**Urban Areas**: Nashville, Memphis, Knoxville, and Chattanooga sustain thriving raccoon populations adapted to human presence and suburban resources"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Raccoons in Tennessee"
    style: "default"
    paragraphs:
      - "Raccoons appear throughout Tennessee but remain primarily nocturnal, with best viewing opportunities occurring at dusk when raccoons emerge from daytime dens to forage. Urban and suburban parks provide frequent sightings as raccoons grow accustomed to human presence and exploit accessible food sources."
    
    list_items:
      - "**Great Smoky Mountains National Park**: Raccoons commonly seen at Cades Cove, near streams throughout the park, and around developed areas at dusk; do not feed wildlife"
      - "**Reelfoot Lake State Park**: Excellent raccoon habitat in cypress swamps and bottomland forests; raccoons frequently visible along boardwalks and near water at dusk"
      - "**Radnor Lake State Park (Nashville)**: Urban nature preserve with abundant raccoons visible on trails during evening hours; educational programs discuss raccoon ecology"
      - "**Shelby Farms Park (Memphis)**: Large urban park where raccoons commonly seen near wetlands, streams, and wooded areas; accessible year-round"
      - "**Backyard Wildlife Viewing**: Raccoons regularly visit suburban yards throughout Tennessee; observe from distance and never feed to avoid habituating wildlife"

  - id: "current-status"
    icon: "fa-shield-alt"
    title: "Population Status and Management"
    style: "default"
    paragraphs:
      - "Tennessee's raccoon population remains common and stable across the state with no conservation concerns. Raccoons adapt readily to human-modified landscapes, maintaining healthy populations in agricultural, suburban, and urban environments alongside remaining wild habitats documented through [States That Border Tennessee](/states/tennessee/borders)."
      - "The Tennessee Wildlife Resources Agency classifies raccoons as fur-bearing game animals subject to regulated hunting and trapping seasons. These seasons occur primarily during fall and winter when pelts achieve prime quality and provide recreational opportunities while generating income from fur sales."
    
    subsections:
      - subtitle: "Historical Fur Industry"
        text: "Raccoons supported Tennessee's fur trade for centuries, with commercial trappers shipping millions of pelts to markets during the 1800s and early 1900s. Historical estimates suggest more than a million raccoons were killed annually for their water-repellent fur during peak demand periods. Excessive harvest in the 1800s prompted taxation on raccoon pelts to prevent population collapse, demonstrating early recognition of wildlife management needs. Raccoon populations proved resilient, rebounding from historical overharvest to achieve current abundance through a combination of harvest regulations, habitat availability, and the species' exceptional adaptability."
      
      - subtitle: "Living with Urban Raccoons"
        text: "Tennessee's expanding cities increasingly support raccoon populations that adapt to urban resources while sometimes creating conflicts with human residents. Raccoons den in attics, chimneys, crawl spaces, and storm drains, and raid garbage cans, pet food, and gardens. The Tennessee Wildlife Resources Agency recommends preventing conflicts by securing garbage in raccoon-proof containers, removing outdoor pet food at night, sealing potential den sites in buildings, and never feeding raccoons. Raccoons carry diseases including rabies and raccoon roundworm parasites, making physical contact dangerous despite their cute appearance. It is illegal in Tennessee to remove raccoons from the wild to keep as pets."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The raccoon connects to Tennessee's other official symbols through shared themes of natural heritage, pioneer history, and cultural identity. The designation in 1971 occurred between the tulip poplar becoming state tree in 1947 and the iris becoming state cultivated flower in 1973, creating comprehensive recognition of Tennessee's diverse natural resources including [Tennessee's shelter pet designation](/states/tennessee/mammal/shelter-dogs-and-cats)."
      - "Tennessee's wildlife symbols acknowledge both wild and domestic animals that shaped state development. The raccoon represents wild game animals supporting subsistence and commerce, while the Tennessee Walking Horse (designated state horse in 2000) represents agricultural heritage and selective breeding expertise. Together they span Tennessee's relationship with animals from wilderness to domestication."
    
    subsections:
      - subtitle: "Tennessee Treasures Painting"
        text: "The raccoon appears prominently in 'Tennessee Treasures,' designated as Tennessee's official state painting in 1997. Created by artist Michael Sloan, the painting features ten of Tennessee's most recognizable symbols including the raccoon, mockingbird, iris, passion flower, tulip poplar, Tennessee River pearl, ladybug, zebra swallowtail butterfly, largemouth bass, and limestone, along with images of the state flag, Tennessee's geographic outline, the Great Seal, and Governor John Sevier's signature. The raccoon's inclusion among this select group demonstrates its status as one of Tennessee's most iconic natural symbols, recognized immediately by residents and visitors as representing frontier heritage and outdoor traditions."
      
      - subtitle: "Tulip Poplar Pioneer Connection"
        text: "The tulip poplar, designated Tennessee's state tree in 1947, provided essential building materials for Tennessee pioneers who also hunted raccoons and wore coonskin caps. The legislature chose the tulip poplar specifically because pioneers used it extensively to construct houses, barns, and farm buildings throughout Tennessee. This parallel demonstrates how both symbols honor pioneer resourcefulness—raccoons providing warm winter clothing and income from fur sales, while tulip poplars provided structural lumber and canoe-building material. Both species occurred abundantly from East Tennessee mountains to West Tennessee river bottoms, making them accessible to settlers throughout the state."
        link:
          label: "See Tennessee state tree"
          url: "/states/tennessee/tree/tulip-poplar"
      
      - subtitle: "State Motto and Rural Heritage"
        text: "Tennessee's state motto 'Agriculture and Commerce,' officially designated in 1987 but appearing on the Great Seal since 1801, connects directly to raccoons' economic importance in Tennessee history. Raccoons supported commerce through the fur trade that generated significant revenue for trappers, buyers, and traders throughout Tennessee's development. Rural agricultural communities particularly valued raccoons both as game animals supplementing food supplies and as crop pests requiring control measures, creating complex relationships between farmers and wildlife. The raccoon designation honored this agricultural heritage where wildlife management, hunting traditions, and rural livelihoods intersected."
        link:
          label: "See Tennessee state motto"
          url: "/states/tennessee/motto/agriculture-and-commerce"
      
      - subtitle: "Mockingbird and Native Wildlife"
        text: "The mockingbird, designated Tennessee's state bird in 1933 through a statewide vote, joined the raccoon as official wildlife symbols representing native species abundant throughout Tennessee. Both species thrive in human-modified landscapes, successfully adapting to suburban and urban environments while maintaining populations in natural habitats. The mockingbird's fearless nest defense and beautiful mimicking songs parallel the raccoon's cleverness and adaptability, demonstrating that Tennessee's chosen symbols reflect practical survival skills rather than merely aesthetic appeal. Both animals remain common and familiar to Tennessee residents, encountered regularly in backyards, parks, and rural areas."
        link:
          label: "See Tennessee state bird"
          url: "/states/tennessee/bird/northern-mockingbird"

