faq:
  - question: "What is Tennessee's state pet?"
    answer: "Tennessee's state pet is dogs and cats that are adopted from Tennessee animal shelters and rescues, designated through Public Chapter 821 with an effective date of April 29, 2014. This unique designation honors not a specific breed but rather all shelter animals finding homes through adoption."
  
  - question: "When was Tennessee's state pet designated?"
    answer: "Tennessee designated shelter dogs and cats as the official state pet on April 29, 2014, through Public Chapter 821 passed by the Tennessee General Assembly. Tennessee was among the first states to create this unique designation promoting animal adoption."
  
  - question: "Why did Tennessee choose shelter animals as the state pet?"
    answer: "Tennessee designated shelter pets to raise public awareness about the millions of abandoned dogs and cats living in American animal shelters and the approximately 3-4 million euthanized annually. The designation encourages Tennesseans to choose adoption, giving homeless animals second chances while reducing euthanasia rates through responsible pet acquisition rather than purchasing from breeders or pet stores."
  
  - question: "Where can I adopt shelter pets in Tennessee?"
    answer: "Tennessee has over 321 animal shelters, rescue organizations, and foster groups serving all 95 counties. Major facilities include Nashville Humane Association, Metro Animal Care and Control (Nashville), Memphis Animal Services, Young-Williams Animal Center (Knoxville), McKamey Animal Center (Chattanooga), Humane Society of Tennessee Valley, and county shelters throughout the state. Adoptable pets can be found through shelter websites, Petfinder, Adopt-a-Pet, and by visiting facilities directly."
  
  - question: "What other states have designated shelter pets as official symbols?"
    answer: "Tennessee was among the first states to designate shelter animals as an official symbol in 2014. Colorado and Georgia also recognize shelter pets, and California designated 'a shelter pet' as the official state pet in 2015. These states created their designations to promote animal adoption and raise awareness about shelter animal populations."
  
  - question: "What are the benefits of adopting from shelters?"
    answer: "Adopting from Tennessee shelters provides numerous benefits including saving animal lives, lower costs than purchasing from breeders (adoption fees typically $50-300 include spay/neuter, vaccinations, microchip worth $500+), access to diverse animal populations spanning all breeds and ages, behavioral assessments from staff who know the animals, health screenings and veterinary care, and post-adoption support. Adopters also support nonprofit organizations providing essential community services like low-cost spay/neuter clinics."
  
  - question: "How many animals are euthanized in shelters annually?"
    answer: "Approximately 920,000 dogs and cats are euthanized in American animal shelters annually as of 2024. While this represents tragic loss, it also reflects enormous progress - in 1984, approximately 17 million shelter animals were euthanized yearly, meaning euthanasia has decreased 94%. Tennessee shelters increasingly achieve no-kill status (90%+ live release rates) through adoption programs, fostering, transfers, and community support."
  
  - question: "What is the adoption process for Tennessee shelter pets?"
    answer: "The typical Tennessee shelter adoption process includes: 1) Researching and visiting shelters to meet animals, 2) Completing adoption application with household and experience information, 3) Interview and screening by shelter staff, 4) Possible home check (varies by organization), 5) Meet-and-greet sessions with potential animals and existing pets, 6) Paying adoption fee ($50-300 depending on organization and animal), 7) Receiving post-adoption support including trial periods and behavioral resources. Specific procedures vary by shelter and rescue organization."

