faq:
  - question: "What is Tennessee's state horse?"
    answer: "Tennessee's state horse is the Tennessee Walking Horse, designated through Public Chapter 596, signed by Governor Don Sundquist on March 21, 2000, with an effective date of July 1, 2000."
  
  - question: "When was the Tennessee Walking Horse designated as Tennessee's state horse?"
    answer: "The Tennessee Walking Horse became Tennessee's official state horse on July 1, 2000, following passage of Public Chapter 596 by the 101st General Assembly on March 13, 2000, and signing by Governor Don Sundquist on March 21, 2000."
  
  - question: "What makes the Tennessee Walking Horse unique?"
    answer: "The Tennessee Walking Horse is uniquely known for its smooth, naturally inherited four-beat running walk gait that provides exceptional rider comfort at speeds of 10-12 miles per hour. The breed also displays a characteristic head nod in rhythm with the gait, calm gentle temperament, and sure-footedness. It is the first horse breed named after a state and was developed entirely in Middle Tennessee's bluegrass region."
  
  - question: "Who was Black Allan and why is he important?"
    answer: "Black Allan (later designated Allan F-1) was foaled in 1886 and became the foundation sire of the Tennessee Walking Horse breed. Originally intended as a trotting racehorse, Black Allan failed on the track but excelled as a breeding stallion. When the Tennessee Walking Horse Breeders' Association formed in 1935, they designated him F-1, recognizing him as the foundation sire. His most important offspring was Roan Allen F-38 (born 1904), to whom all modern Tennessee Walking Horses trace their lineage."
  
  - question: "What is the Tennessee Walking Horse National Celebration?"
    answer: "The Tennessee Walking Horse National Celebration is the world's largest show for the breed, held annually in Shelbyville, Tennessee since 1939. The event spans 11 days in late August and early September, concluding the Saturday before Labor Day with the crowning of the World Grand Champion. The Celebration draws approximately 2,000 horses and 250,000 spectators to the 105-acre Celebration Grounds, making it one of the world's largest horse shows and establishing Shelbyville as the Walking Horse Capital of the World."
  
  - question: "What is the running walk gait?"
    answer: "The running walk is the Tennessee Walking Horse's signature gait—a smooth, gliding four-beat movement where each foot strikes the ground independently at speeds of 10-12 miles per hour. The gait is characterized by overstride, where the hind hoof lands 6-18 inches ahead of the front hoof's track on the same side, creating exceptional smoothness for riders. Horses performing the running walk typically nod their head in rhythm with the gait. This gait is naturally inherited and cannot be taught to horses not possessing it genetically."
  
  - question: "Where can I see Tennessee Walking Horses in Tennessee?"
    answer: "Tennessee Walking Horses can be seen at the Tennessee Walking Horse National Celebration in Shelbyville (late August/early September annually), Harlinsdale Farm in Franklin (historic breeding facility now public park), trail riding outfitters throughout Tennessee, training facilities in Middle Tennessee (especially Bedford, Coffee, and Marshall counties), and numerous county and regional horse shows throughout the year. The Celebration Grounds in Shelbyville also hosts events year-round."
  
  - question: "What is Roan Allen's significance?"
    answer: "Roan Allen F-38, foaled May 23, 1904, was the most influential offspring of foundation sire Black Allan. This striking red roan stallion could perform seven distinct gaits and became a successful show horse. Roan Allen sired 470 registered foals and is believed to be in the pedigree of 100% of all living Tennessee Walking Horses. His ability to pass on the smooth running walk and excellent conformation made him arguably the most important stallion in Tennessee Walking Horse breed development."

