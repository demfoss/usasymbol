title: "Tennessee Walking Horse"
scientific_name: "Equus caballus"
adopted_year: 2000

seo_title: "Tennessee State Horse - Tennessee Walking Horse"
seo_description: "The Tennessee Walking Horse became Tennessee's state horse in 2000. This uniquely gaited breed features a smooth running walk and represents Middle Tennessee's agricultural heritage."

intro_text: "Tennessee's state horse is the Tennessee Walking Horse, designated through Public Chapter 596 signed by Governor Don Sundquist on March 21, 2000. The legislature chose this breed to honor its development in Middle Tennessee's bluegrass region, where farmers and planters created a uniquely smooth-gaited horse combining Standardbred, Morgan, Thoroughbred, and Saddlebred bloodlines that became the first breed to bear a state's name, achieving worldwide recognition for its distinctive running walk and a lasting place in [Tennessee's symbol profile](/states/tennessee)."

common_name: "Tennessee Walking Horse; Tennessee Walker"
official_since: "2000"
status: "Active breeding population; approximately 450,000 horses registered since breed registry founded; 13,000-15,000 new foals registered annually"
habitat_in_state: "Originally developed on Middle Tennessee farms and plantations; concentrated in Bedford, Coffee, Marshall, and Maury counties; present throughout Tennessee"
known_for: "Unique four-beat running walk gait; smooth ride; calm temperament; head-nodding motion; first breed named for a state; Tennessee Walking Horse National Celebration in Shelbyville"

size: "14.3 to 17 hands (59-68 inches) at withers; average 15.2 hands"
weight: "900 to 1,200 pounds"
coloration: "All solid colors accepted including bay, black, chestnut, white, gray, dun, palomino, roan; patterned coats including overo, sabino, tobiano, tovero"
distinctive_traits: "Elegant build with sloping shoulders, long neck, refined head, expressive eyes; smooth four-beat running walk with distinctive head nod; long mane and tail; overstride placing hind hoof ahead of front hoof print"

habitat: "Farms, ranches, equestrian facilities throughout Tennessee and United States"
range_in_state: "Historically concentrated in Middle Tennessee bluegrass region around Shelbyville, Wartrace, Manchester, Murfreesboro, and Franklin; now throughout Tennessee"
conservation_status: "Not threatened; active breeding population with approximately 13,000-15,000 foals registered annually"
where_to_find: "Tennessee Walking Horse National Celebration Grounds in Shelbyville; Harlinsdale Farm in Franklin; equestrian facilities statewide; trail riding destinations across Tennessee"
symbol_connections: "Middle Tennessee agricultural heritage; represents transition from utility farm horse to show horse; Shelbyville known as Walking Horse Capital of the World; honors breeding expertise and selective animal husbandry"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Tennessee General Assembly designated the Tennessee Walking Horse as the official state horse through Public Chapter 596, passed by the 101st General Assembly on March 13, 2000, and signed by Governor Don Sundquist on March 21, 2000, with an effective date of July 1, 2000. The designation honored a uniquely Tennessee breed developed entirely within the state's Middle Tennessee region and documented in the [U.S. state mammals guide](/symbols/mammals)."
      - "Tennessee became the first state to have a horse breed bearing its name recognized as an official state symbol. The designation acknowledged both the breed's agricultural heritage as a versatile farm and plantation horse and its modern prominence in show rings worldwide, where the distinctive running walk gait continues attracting riders seeking smooth, comfortable mounts."
    
    subsections:
      - subtitle: "First Breed Named for a State"
        text: "The Tennessee Walking Horse holds the distinction of being the first horse breed named after a state, predating the 2000 official designation by many decades. The name emerged organically as the breed developed in Middle Tennessee during the late 1800s and early 1900s, when horsemen recognized these animals' unique characteristics warranted separate identification from other gaited horses. By the time the Tennessee Walking Horse Breeders' Association formed in 1935, the name had become standard terminology among breeders, trainers, and owners throughout the region."
      
      - subtitle: "Agricultural Heritage Symbol"
        text: "The designation recognized the Tennessee Walking Horse as a symbol of Tennessee's agricultural heritage and selective breeding expertise. Middle Tennessee farmers and plantation owners developed the breed specifically for their rocky, hilly terrain and diverse farming needs, requiring horses that could plow fields, pull wagons, transport families to town, and provide comfortable all-day rides when inspecting land. This versatility combined with the smooth gait made Tennessee Walkers invaluable to rural communities, where a single horse often served multiple purposes rather than specialized roles."
      
      - subtitle: "Modern Economic Impact"
        text: "By 2000, the Tennessee Walking Horse industry generated substantial economic activity throughout Middle Tennessee, centered in Bedford County around Shelbyville, known worldwide as the Walking Horse Capital. The annual Tennessee Walking Horse National Celebration drew hundreds of thousands of spectators and generated tens of millions of dollars in revenue for the region. The state designation acknowledged this economic importance while celebrating Tennessee's unique contribution to American horse breeding that transformed a practical farm animal into an internationally recognized show horse."

  - id: "state-symbolism"
    icon: "fa-horse"
    title: "What the Tennessee Walking Horse Represents"
    style: "highlight"
    paragraphs:
      - "The Tennessee Walking Horse embodies Tennessee's transformation from agricultural frontier to modern state while maintaining connection to rural heritage. This breed symbolizes selective improvement through careful breeding rather than chance, demonstrating how Tennessee farmers applied systematic methods to create animals perfectly suited to their specific needs in [the Volunteer State](/states/tennessee/nickname/the-volunteer-state)."
      - "The running walk itself represents Tennessee ingenuity—transforming natural gaits through breeding selection into a distinctive four-beat rhythm providing comfort during long days in the saddle while covering ground efficiently. This practical innovation solved real problems for farmers who spent entire days riding across hilly terrain inspecting crops and livestock, directly tying into [Tennessee's state motto](/states/tennessee/motto/agriculture-and-commerce)."
      - "As a state symbol, the Tennessee Walking Horse celebrates Middle Tennessee's bluegrass region where limestone-rich soil supported horse breeding operations that rivaled Kentucky's more famous thoroughbred farms. The designation honors generations of Tennessee horsemen who developed breeding expertise producing one of America's most distinctive horse breeds."
    
    subsections:
      - subtitle: "Calm Temperament and Versatility"
        text: "Tennessee Walkers became known as the 'gentleman of horses' for their exceptionally calm, gentle temperament making them suitable for riders from young children to elderly adults. This disposition was deliberately bred into the line because farmers needed horses that family members of all ages and skill levels could safely handle. The breed's versatility meant the same horse that plowed fields Monday through Friday could transport the family to church Sunday morning and compete in local shows on occasional Saturday afternoons, providing both utility and recreation."
      
      - subtitle: "Smooth Ride for All-Day Comfort"
        text: "The Tennessee Walking Horse's signature running walk gait provides riders with an exceptionally smooth ride because the horse's unique footfall pattern eliminates the jarring motion common in trotting or pacing horses. During the running walk, one hind foot and the diagonal front foot touch ground simultaneously while the other two feet remain airborne, creating a four-beat rhythm rather than the two-beat trot. This gait allows riders to sit comfortably for hours without the bouncing that causes fatigue and soreness, essential for farmers who spent entire days in the saddle inspecting hundreds of acres."
      
      - subtitle: "Middle Tennessee Bluegrass Heritage"
        text: "The Tennessee Walking Horse developed specifically in Middle Tennessee's bluegrass region, where limestone-rich soil produced nutritious grass supporting strong bone development in horses. Counties including Bedford, Coffee, Marshall, Maury, and Williamson became centers of Walking Horse breeding, with Shelbyville emerging as the industry's capital. This geographic concentration created a breeding community where horsemen shared knowledge, compared bloodlines, and refined the breed through generations of selective breeding, producing a distinctly Tennessee contribution to American equine culture."
      
      - subtitle: "From Plow Horse to Show Ring Star"
        text: "The Tennessee Walking Horse's evolution from practical farm animal to celebrated show horse mirrors Tennessee's own development from agricultural frontier to modern state maintaining rural traditions. Early Tennessee Walkers worked weekdays pulling plows and hauling wagons, then showcased their gaits at county fairs on weekends. As mechanization reduced need for farm horses in the mid-1900s, breeders emphasized show qualities while preserving the smooth gait and gentle temperament, creating horses equally suited to trail riding and competitive exhibition. This adaptability demonstrates Tennessee values of preserving heritage while embracing progress associated with [States That Border Tennessee](/states/tennessee/borders)."

  - id: "foundation-history"
    icon: "fa-horse-head"
    title: "Foundation Sires and Breed Development"
    style: "default"
    
    subsections:
      - subtitle: "Black Allan - Foundation Sire Allan F-1"
        text: "Black Allan, later designated Allan F-1 as the Tennessee Walking Horse foundation sire, was foaled in 1886 from the stallion Allendorf (a Standardbred descended from Hambletonian 10) and the Morgan-Thoroughbred cross mare Maggie Marshall. Born on a limestone pasture in Middle Tennessee, Black Allan was intended as a trotting racehorse but consistently paced instead, finishing last in his races despite early speed. His inability to trot led to his sale multiple times, with one owner even using him merely as a teaser stallion to test whether mares were ready for breeding to jack donkeys for mule production."
        list_items:
          - "**Birth**: 1886, Middle Tennessee limestone pasture; black stallion with white blaze"
          - "**Pedigree**: Sired by Allendorf (Standardbred); dam Maggie Marshall (Morgan-Thoroughbred cross)"
          - "**Career**: Failed trotting racer due to preference for pacing; registered American Trotting Registry No. 7623"
          - "**Final Years**: Purchased by Albert Dement of Wartrace, Tennessee for $140 at age 23; bred 111 mares final breeding season"
          - "**Death**: September 16, 1910, at age 24 at Dement's farm"
          - "**Legacy**: Designated Allan F-1 when Tennessee Walking Horse Breeders' Association formed 1935"
      
      - subtitle: "Roan Allen F-38 - Most Influential Offspring"
        text: "Roan Allen, foaled May 23, 1904, on James Brantley's farm in Coffee County, Tennessee, became arguably the most influential stallion in Tennessee Walking Horse history. Sired by Black Allan out of the mare Gertrude (American Saddlebred descent), Roan Allen was a striking red roan stallion with blaze, front socks, high hind stockings, and long flaxen mane and tail. Brantley observed him performing a true running walk within hours of birth, demonstrating the gait was naturally inherited. Trainer Charlie Ashley of Manchester taught Roan Allen to perform seven distinct gaits on command: running walk, flat walk, fox trot, true trot, rack, pace, and canter, making him one of the few seven-gaited horses in history."
        list_items:
          - "**Birth**: May 23, 1904, Coffee County, Tennessee; red roan with striking markings"
          - "**Size**: 15.3 hands (63 inches) at maturity; noted for excellent conformation"
          - "**Gaits**: Could perform seven distinct gaits on command; excelled in show competition"
          - "**Show Success**: Competed successfully in Walking Horse, five-gaited, and harness classes at county fairs"
          - "**Death**: 1930 from broken leg sustained when kicked by mare at breeding farm in McMinnville"
          - "**Designation**: Given F-38 registration when TWHBEA formed 1935, five years after death"
          - "**Legacy**: Sired 470 registered foals; 100% of living Tennessee Walking Horses trace lineage to Roan Allen"
      
      - subtitle: "Development of the Breed"
        text: "The Tennessee Walking Horse developed beginning in the late 18th century when settlers brought various horse breeds to Middle Tennessee, including Narragansett Pacers and Canadian Pacers from the Eastern United States, crossed with gaited Spanish Mustangs from Texas. These foundation stocks were later combined with Standardbreds, Morgans, Thoroughbreds, and American Saddlebreds to create horses suited specifically for Middle Tennessee's rocky, hilly terrain and diverse farming needs. The breed emerged organically through generations of farmers selecting horses that demonstrated smooth gaits, calm temperaments, sure-footedness, and versatility for both work and riding."

  - id: "running-walk-gait"
    icon: "fa-running"
    title: "The Distinctive Running Walk"
    style: "default"
    paragraphs:
      - "The Tennessee Walking Horse's signature running walk is a smooth, gliding four-beat gait that cannot be taught to horses not possessing it naturally through inheritance. This unique gait provides riders with exceptional comfort because it eliminates the jarring motion characteristic of trotting or pacing, allowing all-day riding without fatigue or soreness."
      - "During the running walk, each foot strikes the ground independently in a specific sequence creating four distinct beats, while the hind feet overstride the tracks left by front feet by six to eighteen inches. Greater overstride indicates superior quality, providing riders with a sensation of smooth gliding power as the horse covers ten to twelve miles per hour."
    
    subsections:
      - subtitle: "Three Natural Gaits"
        text: "Tennessee Walking Horses naturally perform three gaits without training: the flat walk, the running walk, and the canter. The flat walk is a brisk, long-reaching walk covering four to eight miles per hour, comparable to the walk in other breeds but with longer stride. The running walk accelerates to ten to twelve miles per hour while maintaining the smooth four-beat rhythm. The canter, sometimes called the 'rocking chair canter,' is a collected gallop performed more relaxed than other breeds, maintaining comfort for the rider."
      
      - subtitle: "Head-Nodding and Ear Movement"
        text: "Tennessee Walkers characteristically nod their head and neck in rhythm with the running walk gait, while many also swing their ears or click their teeth in time with the footfalls. This head motion occurs because horses relax certain muscles while performing the running walk, creating the distinctive bobbing movement observers immediately associate with the breed. The head nod serves as a visual indicator of the proper running walk gait and adds to the breed's distinctive appearance in show rings and on trails."
      
      - subtitle: "Overstride and Gait Quality"
        text: "The running walk's most distinctive mechanical feature is overstride, where the hind hoof lands ahead of the front hoof's track on the same side by six to eighteen inches. This overstride creates the smooth gliding sensation prized by riders, as energy transfers efficiently forward rather than producing vertical bounce. Judges evaluate running walk quality by measuring overstride distance, with greater overstride indicating superior gait mechanics and breeding. The overstride demonstrates the breed's efficiency in covering ground while maintaining rider comfort."

  - id: "national-celebration"
    icon: "fa-trophy"
    title: "Tennessee Walking Horse National Celebration"
    style: "default"
    paragraphs:
      - "The Tennessee Walking Horse National Celebration, held annually in Shelbyville since 1939, ranks among the world's largest horse shows and serves as the centerpiece of the Walking Horse industry. The event spans eleven days in late August and early September, concluding the Saturday before Labor Day with the crowning of the World Grand Champion Tennessee Walking Horse."
      - "The Celebration draws an estimated 2,000 horses, 250,000 spectators, and generates approximately $41 million in annual revenue for Shelbyville and Bedford County. The 105-acre Celebration Grounds encompasses 60 barns, outdoor arena seating 30,000, and indoor Calsonic Arena seating 4,500, establishing it as the largest equestrian complex in America."
    
    subsections:
      - subtitle: "Origins and Henry Davis"
        text: "Henry Davis of Wartrace, Tennessee, a longtime Walking Horse owner and trainer, conceived the Celebration idea in spring 1939 after witnessing the Crimson Clover Festival in nearby Winchester. Davis believed the Shelbyville area should have a festival celebrating its most important asset—the Tennessee Walking Horse. After consulting fellow horsemen, Davis presented the concept to the Shelbyville Lion's Club, later joined by the Rotary Club, and plans proceeded for the first show scheduled September 7-9, 1939. The first Celebration featured a parade and elaborate pageant depicting the breed's evolution from plow and utility horse to show horse, attracting over 40,000 spectators."
      
      - subtitle: "Growth and Development"
        text: "The first Celebration in 1939 drew 218 horses, mostly from Middle Tennessee, with attendance estimated at 2,000-8,000. By 1949, 610 horses entered the show. By 1996, entries reached 2,170 from throughout the United States and as far as Germany and Puerto Rico, with attendance exceeding 150,000. Prize money grew from $2,895 in 1939 to over $650,000 in recent years. The show moved from Wartrace to Shelbyville a few years after inception due to space limitations, with Shelbyville subsequently adopting the nickname 'Walking Horse Capital of the World.'"
      
      - subtitle: "World Grand Championship"
        text: "The World Grand Championship represents the highest honor in the Tennessee Walking Horse breed, awarded on the Celebration's final Saturday night after eleven days of competition. The first World Grand Champion, crowned in 1939, was Strolling Jim, a former plow horse retrained for show by Floyd Carothers and Henry Davis when only three years old. Notable champions include Midnight Sun (1945-1946), who sired over 2,600 foals including five World Grand Champions, and Merry Go Boy (1947-1948), known for producing ideal Tennessee Walker conformation in offspring."
      
      - subtitle: "Celebration Traditions"
        text: "Competition opens each night with a white or gray Tennessee Walking Horse and rider carrying the American flag during the national anthem, with the same flag horse serving for years without competing in shows during their tenure. Children as young as six compete in leadline classes riding ponies, while senior citizens compete in age-division classes, demonstrating the breed's suitability for all ages due to gentle temperament and smooth gaits. The crowning ceremony on final Saturday night brings spectators to their feet as horses and trainers await the World Grand Champion announcement, followed by a victory lap around the 300-foot by 150-foot ring."

  - id: "in-tennessee"
    icon: "fa-map-marker-alt"
    title: "Tennessee Walking Horses in Tennessee"
    style: "default"
    paragraphs:
      - "Tennessee Walking Horses concentrated in Middle Tennessee's bluegrass region, particularly Bedford, Coffee, Marshall, Maury, and Williamson counties, where limestone-rich soil supported breeding operations from the late 1800s. Shelbyville in Bedford County became the Walking Horse Capital of the World, hosting the annual National Celebration and supporting numerous training facilities, breeding farms, and equestrian businesses."
      - "The Tennessee Walking Horse Breeders' and Exhibitors' Association, headquartered in Lewisburg, Tennessee, maintains the breed registry and promotes the breed worldwide. Founded in 1935, the TWHBEA has registered approximately 450,000 horses over its history, with 13,000-15,000 new foals registered annually, making Tennessee Walkers among the most common breeds in the southeastern United States."
    
    facts:
      - "**Shelbyville**: Walking Horse Capital of the World; home to Celebration Grounds and numerous training facilities"
      - "**Franklin**: Harlinsdale Farm, historic Walking Horse breeding facility now public park with preserved barns and pastures"
      - "**Wartrace**: Birthplace of National Celebration concept; home of Strolling Jim, first World Grand Champion"
      - "**Lewisburg**: Headquarters of Tennessee Walking Horse Breeders' and Exhibitors' Association"

  - id: "where-to-experience"
    icon: "fa-binoculars"
    title: "Where to Experience Tennessee Walking Horses"
    style: "default"
    paragraphs:
      - "Tennessee offers numerous opportunities to experience Tennessee Walking Horses through shows, historic sites, trail rides, and breeding farms. The annual National Celebration provides the most comprehensive showcase, while year-round facilities welcome visitors interested in this uniquely Tennessee breed."
    
    list_items:
      - "**Tennessee Walking Horse National Celebration** (Shelbyville): Eleven-day show late August/early September; 105-acre Celebration Grounds; World Grand Championship final Saturday before Labor Day"
      - "**Harlinsdale Farm** (Franklin): Historic Walking Horse breeding facility established 1940s; now city park preserving barns, pastures, training facilities; free admission; educational programs"
      - "**Trail Riding Outfitters**: Numerous Tennessee facilities offer trail rides on Tennessee Walkers through Great Smoky Mountains, Cumberland Plateau, and other scenic locations"
      - "**Training Facilities**: Middle Tennessee training barns often welcome visitors by appointment to observe training sessions and learn about breed"
      - "**County and Regional Shows**: Walking Horse shows throughout Tennessee year-round provide opportunities to see breed in competition"

  - id: "breed-standards"
    icon: "fa-list-check"
    title: "Breed Standards and Characteristics"
    style: "default"
    
    subsections:
      - subtitle: "Physical Standards"
        text: "Tennessee Walking Horses typically stand 14.3 to 17 hands (59-68 inches) at the withers, averaging 15.2 hands, and weigh 900 to 1,200 pounds. The breed standard describes an elegant build with sloping shoulders, distinctive long neck, refined head, and expressive eyes giving a regal appearance. All coat colors are accepted by the Tennessee Walking Horse Breeders' and Exhibitors' Association, including solid colors (bay, black, chestnut, white, gray, dun, palomino, roan) and patterned coats (overo, sabino, tobiano, tovero), with no color discrimination in registration or showing."
      
      - subtitle: "Temperament and Trainability"
        text: "Tennessee Walkers earned recognition as the 'gentleman of horses' for their exceptionally calm, gentle, and kind disposition. The breed demonstrates high intelligence, willingness to please, and patient nature making them suitable for beginners, children, elderly riders, and therapeutic riding programs. Their calm temperament combined with smooth gaits creates horses that experienced and novice riders alike handle with confidence. Most Tennessee Walkers respond well to light handling and require minimal correction during training, preferring gentle guidance over forceful methods."
      
      - subtitle: "Versatility and Uses"
        text: "While Tennessee Walking Horses gained fame in show rings, the breed excels in diverse disciplines including trail riding, endurance riding, pleasure riding, Western events, English disciplines, therapeutic riding, and farm work. Their sure-footedness on rocky, hilly terrain makes them exceptional trail horses, while their smooth gait allows riders to cover long distances comfortably. The Tennessee Walking Horse Breeders' and Exhibitors' Association maintains awards programs for trail riding and endurance riding to recognize the breed's versatility beyond show competition."
      
      - subtitle: "Lifespan and Health"
        text: "Tennessee Walking Horses typically live 25 to 30 years with proper care, nutrition, and veterinary attention, though some individuals live longer. The breed generally enjoys good health without breed-specific genetic issues affecting many other horse breeds. Standard equine care requirements include quality grass hay, balanced grain rations, routine veterinary care, dental care, regular hoof trimming or shoeing, and daily grooming. Some individuals show propensity toward obesity requiring careful diet management and regular exercise."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Tennessee Walking Horse connects to Tennessee's other official symbols through themes of agricultural heritage, selective breeding expertise, and Middle Tennessee's distinctive contributions to state identity. The 2000 designation occurred amid expanded recognition of Tennessee's natural and cultural resources, following the raccoon as state wild animal (1971) and the Bluetick Coonhound as state dog (2019)."
      - "Tennessee's animal symbols span domestic and wild species that shaped state development. The Tennessee Walking Horse represents domestic animal breeding achievement, while the raccoon honors wild game animals supporting frontier economy. Together they demonstrate Tennessee's diverse relationships with animals from agricultural innovation to wilderness traditions."
    
    subsections:
      - subtitle: "State Motto and Agricultural Commerce"
        text: "Tennessee's state motto 'Agriculture and Commerce,' appearing on the Great Seal since 1801 and officially designated in 1987, directly connects to the Tennessee Walking Horse industry. The breed's development demonstrated Tennessee agricultural innovation creating a commodity that generated substantial commerce through breeding, training, showing, and sales. The Walking Horse industry continues supporting Middle Tennessee's economy through the National Celebration, breeding operations, training facilities, and tourism, embodying the motto's dual emphasis on agricultural production and commercial enterprise."
        link:
          label: "See Tennessee state motto"
          url: "/states/tennessee/motto/agriculture-and-commerce"
      
      - subtitle: "Raccoon and Wildlife Tradition"
        text: "The raccoon, designated Tennessee's state wild animal in 1971, pairs naturally with the Tennessee Walking Horse in stories of rural Tennessee. The Walking Horse represents transport, agriculture, and breeding expertise, while the raccoon symbolizes wildlife traditions and nighttime hunting culture. Together they show how Tennessee's identity combines domesticated working animals with long-standing outdoor heritage."
        link:
          label: "See Tennessee state wild animal"
          url: "/states/tennessee/mammal/raccoon"
      
      - subtitle: "Tulip Poplar and Pioneer Heritage"
        text: "The tulip poplar, designated Tennessee's state tree in 1947, served Tennessee pioneers who also relied on Tennessee Walking Horses and their ancestors for farm work and transportation. Pioneers used tulip poplar extensively for construction while developing the smooth-gaited horses that would become Tennessee Walkers. Both symbols honor pioneer resourcefulness in utilizing Tennessee's natural resources—native trees for building and selectively bred horses for work and transportation—demonstrating practical innovation that characterized Tennessee settlement."
        link:
          label: "See Tennessee state tree"
          url: "/states/tennessee/tree/tulip-poplar"
      
      - subtitle: "Tennessee Treasures State Painting"
        text: "The state painting 'Tennessee Treasures' by artist Michael Sloan, designated in 1997, does not feature the Tennessee Walking Horse among its depicted symbols, as the breed's designation occurred three years later in 2000. However, the Tennessee Walking Horse would fit naturally among the painting's celebration of uniquely Tennessee resources including the raccoon, mockingbird, iris, passion flower, and other symbols representing state identity. The Walking Horse embodies Tennessee Treasures' theme of symbols unique to or particularly associated with Tennessee."

