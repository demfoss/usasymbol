seo_title: "Tennessee State Rifle | Barrett M82 / M107"
seo_description: "Tennessee made the Barrett M82/M107 its state rifle in 2016, linking the symbol to Ronnie Barrett and a homegrown maker."

intro_text: "Most [official state firearms](/symbols/firearms) are relics of a past century — flintlock rifles, frontier revolvers, weapons of a world long gone. Tennessee took a different path. In 2016, the state officially recognized the Barrett M82/M107 as its state rifle: a weapon currently in production, actively deployed with the U.S. military and allied forces worldwide, and built every single day in Murfreesboro, Tennessee — just 35 miles from Nashville."

big_stat:
  number: "1,800 m"
  description: "Effective anti-materiel range of the Barrett M82/M107 — nearly 1.1 miles. At that distance, the rifle can disable vehicles, radar arrays, and grounded aircraft. No previous sniper rifle had ever approached this capability."

timeline:
  - year: "1982"
    description: "Ronnie Barrett, a 26-year-old photographer with no engineering degree, sketches a semi-automatic .50 caliber rifle design on his dining table in Murfreesboro. Every expert he consults tells him it cannot be built."
  - year: "1983"
    description: "Barrett assembles the first working prototype in his garage. The M82 fires reliably. He founds Barrett Firearms Manufacturing and begins seeking military contracts — facing repeated rejection."
  - year: "1989"
    description: "The U.S. Army and Marine Corps formally adopt the M82A1 as their primary .50 caliber semi-automatic rifle, validating a design that began with a sketch on a dining table six years earlier."
  - year: "1999"
    description: "The improved M107 variant enters service, incorporating lessons from combat use and becoming the U.S. Army's standard long-range .50 caliber sniper system deployed across multiple theaters."
  - year: "February 2016"
    description: "HJR 0231, sponsored by Marine veteran Rep. Micah Van Huss, passes the Tennessee General Assembly 27-1. The Barrett M82/M107 becomes the official state rifle of Tennessee."

expert_quote:
  text: "A photographer with no engineering degree, working at a dining table in Murfreesboro, designed a rifle that the world's most elite militaries would adopt within a decade. Barrett Firearms is Tennessee innovation at its most improbable."
  source: "Barrett Firearms Manufacturing — company founding history, Murfreesboro, Tennessee, 1982"

sections:
  - id: "ronnie-barrett"
    icon: "fa-person"
    title: "From Dining Table to the U.S. Military: Ronnie Barrett's Story"
    paragraphs:
      - "In 1982, Ronnie Barrett was not an engineer. He was a 26-year-old photographer working in Murfreesboro, Tennessee, who wanted to shoot targets across a wide river and couldn't find a rifle powerful enough to do it. So he designed one. On a dining table. With no formal engineering training."
      - "Barrett sketched a semi-automatic rifle chambered in .50 BMG — a cartridge originally designed for heavy machine guns, never before used in a handheld, semi-automatic platform. Every firearms expert he approached told him the design was mechanically impossible. He assembled the first working prototype in his garage anyway."
      - "Barrett Firearms Manufacturing grew from that garage into a company that today supplies the U.S. military, NATO allies, and defense forces in over 60 countries. The factory is still in Murfreesboro — the same city where Ronnie Barrett had no business designing the most influential anti-materiel rifle of the 20th century. Like Utah's tribute to John Browning through the [Browning M1911](/states/utah/firearm/browning-m1911-pistol), Tennessee's designation is ultimately a salute to a single inventor who changed history from within state lines."
    subsections:
      - subtitle: "Inventor Profile: Ronnie Barrett"
        text: "Born and raised in Tennessee, Ronnie Barrett founded Barrett Firearms Manufacturing as a sole proprietorship with personal savings. He held no engineering degrees, had no military background, and faced near-universal skepticism from the firearms industry. Barrett's company remains 100% privately held and 100% based in Murfreesboro, Tennessee — a point of significant state pride."

  - id: "hjr-0231"
    icon: "fa-scale-balanced"
    title: "HJR 0231: The Marine Who Pushed the Bill"
    paragraphs:
      - "House Joint Resolution 0231 was introduced by Tennessee state Representative Micah Van Huss in the 109th General Assembly. Van Huss brought to the legislation something few sponsors of state symbol bills can claim: firsthand combat experience with the weapon he was trying to honor. As a U.S. Marine, Van Huss had used the Barrett M82/M107 in active military operations."
      - "The bill passed the Tennessee Senate 27-1 and moved through the House with similarly strong support. For Van Huss, the designation was not bureaucratic ceremony — it was recognition of a weapon he had personally relied upon, manufactured by a company that employed his fellow Tennesseans and reflected [Tennessee's industrial identity](/states/tennessee/motto/agriculture-and-commerce)."
      - "HJR 0231 was signed in February 2016, making Tennessee the first — and to date only — state to designate a currently manufactured, currently deployed military sniper system as an official state symbol."

  - id: "jack-daniels-controversy"
    icon: "fa-comments"
    title: "The Jack Daniel's Controversy: Tennessee's 27-1 Vote"
    paragraphs:
      - "The Barrett M82/M107 designation passed the Tennessee Senate 27-1 — nearly unanimous, but the single dissenting vote belongs to one of the most memorable arguments in Tennessee legislative history. Senator Jeff Yarbro, a Democrat from Nashville, cast the lone 'no' vote and offered a challenge that stopped the chamber cold."
      - "Yarbro's objection was not to the Barrett rifle itself, nor to its military record, nor to Ronnie Barrett's Tennessee roots. His argument was structural: the state was essentially endorsing a specific private company's product with official government recognition. If that standard applied, Yarbro asked, why not make Jack Daniel's the official state whiskey? Tennessee produces the world's best-selling whiskey too. Where does the endorsement of private commerce end?"
      - "Supporters of the bill countered that Barrett Firearms is a uniquely Tennessee success story — a company founded by a Tennessean, employing Tennesseans, manufacturing a weapon recognized by the U.S. Army as one of its ten greatest inventions. The state wasn't advertising a product; it was honoring an achievement. The resolution passed. The Jack Daniel's question remains unanswered."
    subsections:
      - subtitle: "Senator Jeff Yarbro: The Case Against Endorsement"
        text: "Yarbro's core argument was a question of precedent and principle. State symbols carry government authority. If Tennessee officially endorses a specific manufacturer's product — even one with legitimate historical and economic significance — it implicitly sets a standard for which private enterprises deserve that honor. The Jack Daniel's comparison was rhetorical, but the underlying concern about state government endorsing specific corporations over their competitors was a legitimate constitutional and policy question."
      - subtitle: "The Majority Position: Tennessee Pride, Not Corporate Advertising"
        text: "The 27 senators who voted in favor argued that the Barrett designation was categorically different from commercial endorsement. The rifle had been adopted by the U.S. military on merit. It was designed in Tennessee, built in Tennessee, and had put Tennessee on the map of global defense manufacturing. Honoring that achievement was no different from designating a state bird found in Tennessee or a mineral mined here — it celebrated what the state produces, not what it sells."

  - id: "light-fifty"
    icon: "fa-crosshairs"
    title: "The Light Fifty: Technical Specs of the M82/M107"
    paragraphs:
      - "The Barrett M82 earned the nickname 'Light Fifty' because it was the first semi-automatic rifle to make the .50 BMG cartridge portable enough for a single soldier to carry and operate. At nearly 30 pounds, 'light' is relative — but compared to the crew-served .50 caliber machine guns it supplemented, the Barrett represented a genuine reduction in operational weight for extreme long-range capability."
      - "The .50 BMG cartridge (12.7×99mm NATO) was designed for heavy machine guns. Chambering it in a semi-automatic platform required Barrett's recoil-operated system to absorb forces that would destroy a conventional action. The result was a rifle capable of engaging targets at nearly 1,800 meters — disabling vehicles, destroying radar equipment, and defeating light armor. The U.S. Army recognized the M82/M107 as one of the ten greatest battlefield inventions of the modern era."
    subsections:
      - subtitle: "Barrett M82/M107 Technical Specifications"
        list:
          - "**Caliber:** .50 BMG (12.7×99mm NATO)"
          - "**Operation:** Recoil-operated, semi-automatic"
          - "**Effective range:** 1,800 m (anti-materiel); 1,500 m (personnel)"
          - "**Weight:** 29.7 lbs / 13.5 kg (M107)"
          - "**Barrel length:** 29 inches (M82A1 standard)"
          - "**Magazine capacity:** 10 rounds (detachable box)"
          - "**Overall length:** 57 inches (M82A1)"
          - "**Muzzle brake:** Dual chamber (absorbs approximately 70% of recoil)"

  - id: "comparison"
    icon: "fa-scale-balanced"
    title: "Tennessee's Modern Rifle vs. Historic State Firearms"
    paragraphs:
      - "Tennessee stands alone among states that have designated state firearms: every other designation honors a historical weapon from the frontier era, the Civil War, or the Wild West — like [West Virginia's Hall Model 1819 Flintlock](/states/west-virginia/firearm/hall-model-1819-flintlock-rifle), which honors the birth of American industrial manufacturing in 1819. Tennessee chose the present over the past — a weapon that was engineered, not inherited."
    subsections:
      - subtitle: "Kentucky Long Rifle: 18th Century vs. 21st Century"
        text: "Kentucky designated the Kentucky Long Rifle — a flintlock weapon perfected circa 1740 by Pennsylvania German gunsmiths — as its state firearm in 2013. The contrast with Tennessee could not be starker: one state honors the rifle that opened the American frontier; the other honors the rifle redefining what modern warfare looks like."
        link:
          label: "View Kentucky State Firearm"
          url: "/states/kentucky/firearm/kentucky-long-rifle"
      - subtitle: "Arizona Colt Single Action Army: Wild West vs. Modern Battlefield"
        text: "Arizona designated the Colt Single Action Army — the iconic revolver of the American West, introduced in 1873 — as its state firearm. Where Arizona celebrates the weapon that tamed the frontier saloon, Tennessee celebrates the weapon deployed by special operations forces on contemporary battlefields."
        link:
          label: "View Arizona State Firearm"
          url: "/states/arizona/firearm/colt-single-action-army"

  - id: "where-to-see"
    icon: "fa-building-columns"
    title: "Where the Barrett Is Built — and Displayed"
    paragraphs:
      - "Unlike historical state firearms housed in museum archives, the Barrett M82/M107 is a living weapon: manufactured daily, deployed globally, and demonstrably part of Tennessee's present economic and industrial identity documented across [Tennessee's state symbol pages](/states/tennessee)."
    subsections:
      - subtitle: "Barrett Firearms Manufacturing — Murfreesboro, TN"
        text: "Barrett Firearms Manufacturing is headquartered at 14052 Smith Road in Murfreesboro, Tennessee — the same city where Ronnie Barrett assembled his first prototype in a garage in 1983. The company's Murfreesboro facility is the sole production site for all Barrett rifles. Every Barrett M82 and M107 delivered to the U.S. military or allied forces around the world originates here."
      - subtitle: "Tennessee State Museum — Nashville"
        text: "The Tennessee State Museum in Nashville holds military collections spanning the state's full history, from the Revolutionary War through contemporary conflicts. Their galleries documenting Tennessee's contributions to American military service include context for the weapons and technology that defined each era of combat — including the modern sniper systems that Tennessee-born manufacturers helped create."

