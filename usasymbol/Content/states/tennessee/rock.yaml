faq:
  - question: What is Tennessee's state rock?
    answer: "Tennessee's state rock is limestone, a sedimentary rock adopted by the General Assembly in 1979."
  - question: When did Tennessee adopt limestone as its state rock?
    answer: "The Tennessee General Assembly designated limestone the official state rock in 1979."
  - question: Why did Tennessee choose limestone?
    answer: "Limestone quarried around Knoxville, long sold nationwide as 'Tennessee marble,' supported one of the state's best-known building-stone industries and earned Knoxville the nickname 'the Marble City.'"
  - question: Is Tennessee marble real marble?
    answer: "No. 'Tennessee marble' is actually limestone that takes a fine polish; it is not the metamorphic rock geologists classify as true marble."

