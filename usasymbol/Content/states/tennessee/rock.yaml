intro_text: "Tennessee's state rock is limestone, adopted in 1979, the sedimentary rock that underlies most of the state and was quarried around Knoxville as fine-grained stone long sold nationally as 'Tennessee marble.' This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Tennessee State Rock
    paragraphs:
      - "Limestone is Tennessee's official state rock, designated by the General Assembly in 1979. It is a sedimentary rock that forms the bedrock under much of Middle and East Tennessee, and for over a century it supported one of the state's most recognized quarrying industries."
      - "Tennessee was a natural choice for this symbol because limestone quarried around Knoxville was cut, polished, and shipped nationwide for building and monument use, even though it was marketed under the misleading name 'Tennessee marble.'"

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Limestone?"
    paragraphs:
      - "Limestone is a sedimentary rock built from compacted marine sediment, largely the shells and skeletal fragments of ancient sea creatures cemented together over millions of years. Tennessee's limestone ranges from plain gray to a mottled pinkish-gray that takes a fine polish."
      - "That polished pink-toned stone became known commercially as 'Tennessee marble,' though geologically it is true limestone rather than metamorphic marble. The name stuck because polished limestone can look strikingly similar to marble once cut and finished."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Tennessee Chose Limestone as Its State Rock"
    paragraphs:
      - "East Tennessee's limestone quarrying industry centered on Knoxville, which by 1900 was home to nearly a dozen quarrying and finishing companies and had earned the nickname 'the Marble City.' Firms such as the John J. Craig Company operated quarries near Friendsville and Concord, shipping finished stone across the country."
      - "Limestone also underlies the Nashville Basin and much of Middle Tennessee, making it one of the most common and economically significant rocks in the state. Naming it the state rock in 1979 recognized both its geological reach and its role in a building-stone industry that carried the Tennessee name nationwide."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Limestone Became Tennessee's State Rock"
    paragraphs:
      - "The Tennessee General Assembly designated limestone the official state rock in 1979, the same year lawmakers named the Tennessee River pearl the state gem."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Limestone Is Found in Tennessee"
    paragraphs:
      - "Friendsville, in Blount County near Knoxville, sits at the center of Tennessee's historic limestone quarrying district. Companies there and around nearby Concord quarried the pink-toned stone sold nationally as 'Tennessee marble' for more than a century."
    sites:
      - name: Friendsville
        city: Friendsville
        lat: 35.7604
        lng: -84.1357
        note: "Historic 'Tennessee marble' limestone quarrying district"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Limestone Facts"
    facts:
      - "Adopted as Tennessee's state rock in 1979."
      - "Limestone underlies most of Middle Tennessee's Nashville Basin and much of East Tennessee."
      - "Quarried around Knoxville and sold nationally for over a century as 'Tennessee marble,' although it is true limestone, not metamorphic marble."
      - "Knoxville earned the nickname 'the Marble City' for its limestone quarrying and finishing industry."

