  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Tennessee Flag"
    symbols:
      - id: stars
        name: "Tennessee State Flag Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Three white five-pointed stars form the central emblem of the Tennessee flag. The stars are distributed at equal intervals around a center point inside the blue circle. Each star is positioned so one point approaches the other two stars without touching."
          - "The three stars represent the three Grand Divisions of Tennessee. East Tennessee covers the mountainous Appalachian region. Middle Tennessee includes the central basin. West Tennessee stretches to the Mississippi River. These divisions reflect distinct geographic and cultural regions that developed separately before statehood."

      - id: circle
        name: "Tennessee State Flag Circle"
        image: "symbols/circle.svg"
        paragraphs:
          - "A blue circle with a white border surrounds the three stars. The circle diameter equals half the width of the flag. The white border separates the blue from the crimson field."
          - "The blue circle symbolizes the unity of Tennessee's three divisions. The endless circle binds the three regions together as one. Reeves called it an indissoluble trinity. The circle emphasizes that the three divisions form a single unified state."

      - id: bar
        name: "Tennessee State Flag Blue Bar"
        image: "symbols/bar.svg"
        paragraphs:
          - "A vertical blue bar runs along the fly end of the flag. The bar width equals one-eighth of the total flag width. A white stripe separates the blue bar from the crimson field. The stripe width is one-fifth that of the blue bar."
          - "Reeves explained the bar serves a practical purpose. It relieves the sameness of the crimson field. The bar prevents the flag from showing too much crimson when hanging limp. The white stripe creates stronger contrast between the colors."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Tennessee State Flag Colors"
    paragraphs:
      - "The Tennessee state flag uses crimson, blue, and white. Crimson forms the main field covering most of the flag. Blue appears on the circle and the vertical bar. White outlines the circle and separates the bar from the field."
      - "The three white stars complete the color scheme. State law describes the main field as crimson rather than red. The exact shades are not specified in the original 1905 law."
    colors:
      - name: "Crimson"
        hex: "#C8102E"
      - name: "Blue"
        hex: "#002868"
      - name: "White"
        hex: "#FFFFFF"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Tennessee State Flag Facts"
    facts:
      - "Colonel Le Roy Reeves designed the Tennessee state flag in 1905"
      - "The three stars represent East, Middle, and West Tennessee"
      - "The blue circle symbolizes unity of the three grand divisions"
      - "Tennessee's first flag from 1897 was a red, white, and blue tricolor"
      - "The flag ranked 14th out of 72 in a 2001 NAVA survey"
      - "A 1976 US postage stamp illustrated Tennessee's flag upside down"

faq:
  - question: "What design is recognized as the state flag of Tennessee?"
    answer: "The state flag of Tennessee is the official banner of Tennessee, featuring three white stars on a blue circle against a crimson field with a blue bar on the fly end."

  - question: "What does Tennessee's flag look like?"
    answer: "The flag shows a crimson field with three white stars inside a blue circle at the center. A vertical blue bar runs along the fly end, separated from the crimson field by a thin white stripe."

  - question: "What meaning is attached to Tennessee's flag?"
    answer: "The flag represents the unity of Tennessee's three geographic regions. The three stars stand for East Tennessee, Middle Tennessee, and West Tennessee. The blue circle symbolizes their unity."

  - question: "How many stars are on the Tennessee flag?"
    answer: "There are three stars on the Tennessee state flag. They sit inside a blue circle at the center of the crimson field. State law specifies their exact positions: one point of each star approaches the other two without touching, and the centers of no two stars may be in a line parallel to either the side or end of the flag."

  - question: "Why does the Tennessee flag have three stars?"
    answer: "The three stars represent Tennessee's three Grand Divisions: East Tennessee, Middle Tennessee, and West Tennessee. Designer Colonel Le Roy Reeves called the blue circle binding them an 'indissoluble trinity.' The three geographic divisions are recognized in Tennessee law and reflect distinct cultural regions — Appalachian East, the central basin of Middle Tennessee, and the Mississippi flatlands of the West."

  - question: "What does the blue bar on the Tennessee flag mean?"
    answer: "The blue vertical bar running along the fly end has a practical purpose: Colonel Le Roy Reeves added it to prevent the flag from showing too much crimson when hanging limp. A thin white stripe separates the bar from the crimson field to create stronger visual contrast. Reeves described it as 'relieving the sameness of the crimson field.'"

  - question: "Which person or group shaped the current Tennessee flag?"
    answer: "Colonel Le Roy Reeves designed the Tennessee state flag. He was a Johnson City attorney who served in the Third Regiment, Tennessee Infantry of the Tennessee National Guard."

  - question: "When did Tennessee adopt its current state flag?"
    answer: "Tennessee adopted its state flag on April 17, 1905. The Tennessee General Assembly passed Chapter 498 of the Public Acts of 1905 officially adopting the design."

