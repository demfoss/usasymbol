sections:
- id: why-did-tennessee-put-its-state-bird-to-a-vote
  icon: fa-solid fa-circle-question
  title: Why Did Tennessee Put Its State Bird to a Vote?
  paragraphs:
  - Because Tennessee's bird symbol did not begin as a quiet legislative label. The Tennessee Ornithological Society first put the question to a statewide vote in April 1933.
  - The mockingbird was not handed down as one more official emblem. It reached the General Assembly after Tennesseans had already been asked to choose — public selection first, formal designation second.
- id: why-did-the-mockingbird-win-tennessees-1933-election
  icon: fa-solid fa-check-to-slot
  title: Why Did the Mockingbird Win Tennessee's 1933 Election?
  paragraphs:
  - Historical summaries say the mockingbird won narrowly over the robin, which is useful in itself. Tennessee was not looking at an obvious uncontested bird.
  - The mockingbird's advantage was that it already worked as a public bird. It was familiar, heard widely, and easy for ordinary residents to recognize without specialized knowledge.
  - The voters favored the bird that already felt like a statewide presence — widely heard, easy to recognize, and needing no specialist knowledge to identify as a Tennessee bird.
- id: why-did-the-mockingbird-stay-official-without-a-typical-code-section
  icon: fa-solid fa-bookmark
  title: Why Did the Mockingbird Stay Official Without a Typical Code Section?
  paragraphs:
  - Tennessee legislative manuals make an interesting distinction. They describe the mockingbird as <strong>generally accepted</strong> as the state bird and note that it was selected by the Tennessee Ornithological Society and confirmed by joint resolution rather than by a standard act-and-code path.
  - The mockingbird did not depend only on one neat code citation. It survived because the public vote, the 1933 resolution, and decades of official use all reinforced the same choice — which is why the legislative manual's phrasing is descriptive rather than merely statutory.
  - In that sense, Tennessee's bird is a public tradition with legislative backing rather than just a line item in a modern state-symbol statute book.
faq:
- question: What is Tennessee's state bird?
  answer: Tennessee's state bird is the Northern Mockingbird.
- question: When did Tennessee adopt the Northern Mockingbird?
  answer: Tennessee confirmed the Northern Mockingbird as its state bird on April 19, 1933.
- question: Who chose Tennessee's state bird?
  answer: The Tennessee Ornithological Society held a statewide election on April 11, 1933, and the General Assembly then confirmed the result by Senate Joint Resolution No. 51.
- question: Was Tennessee's state bird chosen by public vote?
  answer: Yes. Tennessee's mockingbird story is unusual because the choice first went through a statewide election before lawmakers ratified it.
- question: Why did the mockingbird win in Tennessee?
  answer: Historical summaries say the mockingbird narrowly beat the robin. The bird appears to have won because it already felt familiar and statewide enough to work as a public symbol.
- question: Is Tennessee's state bird listed in the Tennessee Code?
  answer: Tennessee legislative manuals emphasize the 1933 joint resolution and describe the mockingbird as generally accepted as the state bird, rather than pointing to a typical later code section.
- question: What does the mockingbird mean for Tennessee?
  answer: The mockingbird represents a symbol that came through public choice first and legislative confirmation second — the Tennessee Ornithological Society's statewide vote on April 11 preceded the General Assembly's joint resolution by eight days.
