title: Northern Mockingbird
scientific_name: Mimus polyglottos
adopted_year: 1933
legislation: Senate Joint Resolution No. 51 (1933)
meaning: In 1933 the Tennessee Ornithological Society put the state-bird question to a statewide election, and the General Assembly confirmed the result by joint resolution. The mockingbird reads less like a bird legislators simply named and more like a bird Tennesseans publicly chose for themselves.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: "2026-05-02"
seo_title: "Tennessee State Bird | Northern Mockingbird"
seo_description: Tennessee's state bird is the Northern Mockingbird, confirmed in 1933 after a statewide vote. The choice came through public selection and joint resolution.
intro_text: 'Tennessee''s state bird is the <strong>Northern Mockingbird</strong>, confirmed on <strong>April 19, 1933</strong> by <strong>Senate Joint Resolution No. 51</strong>. The important keyword answer is simple, but the route into law was unusual. The <strong>Tennessee Ornithological Society</strong> held a statewide vote on April 11, 1933, and the General Assembly ratified the winner eight days later. Later legislative manuals still describe the mockingbird as the bird <strong>generally accepted</strong> as the state bird, reflecting public vote and long use rather than a standard code section.'
