faq:
  - question: "What is Tennessee's state fruit?"
    answer: "Tennessee's state fruit is the tomato, adopted by the Tennessee General Assembly in 2003."
  - question: "When did Tennessee adopt the tomato as its state fruit?"
    answer: "The Tennessee General Assembly designated the tomato the official state fruit in 2003."
  - question: "Why did Tennessee choose the tomato?"
    answer: "Tomatoes are grown widely across Tennessee farms and gardens and are a familiar part of the state's home cooking traditions."
  - question: "Is the tomato really a fruit?"
    answer: "Yes, botanically the tomato is a fruit because it develops from a flower and contains seeds, even though it is usually cooked and eaten like a vegetable."

