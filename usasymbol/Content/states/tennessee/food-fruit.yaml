sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Tennessee's State Fruit?"
    paragraphs:
      - "The tomato is Tennessee's official state fruit, designated by the Tennessee General Assembly in 2003. Tomatoes are grown across the state, both commercially and in home gardens."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Tomato"
    paragraphs:
      - "Tomatoes are round, juicy fruits that are botanically a fruit but commonly cooked and eaten like a vegetable. In Tennessee they ripen through the summer, and are used in dishes from fried green tomatoes to fresh salads."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Tomato Became Tennessee's State Fruit"
    paragraphs:
      - "The Tennessee General Assembly designated the tomato the official state fruit in 2003, following a campaign by Tennessee students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Tennessee Chose the Tomato"
    paragraphs:
      - "Tomatoes are grown widely across Tennessee farms and gardens and are a familiar part of the state's home cooking, from summer sandwiches to fried green tomatoes."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Tomato Facts"
    facts:
      - "Adopted as Tennessee's state fruit in 2003."
      - "Tomatoes are grown across Tennessee both commercially and in home gardens."
      - "Tomatoes are botanically a fruit, though usually cooked as a vegetable."

