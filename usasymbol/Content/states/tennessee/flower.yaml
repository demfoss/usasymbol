seo_title: "Tennessee State Flower | Iris"
seo_description: "Tennessee adopted the iris in 1933, but the state still recognizes the passion flower too."

intro_text: "The iris is Tennessee's official state flower, adopted on April 1, 1933. Tennessee stands out among U.S. states by recognizing two official flowers — the iris came first, and the passion flower was added in 1973, with both designations still active today. Irises bloom across Tennessee each spring in purple, blue, yellow, and white, growing wild in wetlands and mountain forests as well as in gardens from Memphis to Knoxville. Browse the full [list of U.S. state flowers](/symbols/flowers), or explore Tennessee's complete symbol set on the [Tennessee state hub](/states/tennessee)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Tennessee"
    paragraphs:
      - "Tennessee recognizes the Iris as its first official state flower. Each bloom displays three upright petals called standards and three drooping petals called falls. The flowers measure 3 to 5 inches across in most varieties. Colors range from deep purple and blue to yellow, white, and bronze. A sweet or spicy fragrance varies by species. Distinctive bearded varieties show fuzzy ridges on the falls."
      - "Irises bloom from April through June across Tennessee. Wild species flower earlier than garden varieties. Peak blooming occurs in May throughout most of the state. Plants grow 1 to 4 feet tall depending on species. Sword-shaped leaves emerge in fans from the base. The foliage remains attractive after flowers fade."
      - "Wild iris species grow naturally in Tennessee wetlands, along streams, and in moist meadows. Reelfoot Lake, the Tennessee River bottoms, and mountain coves support native populations. Blue flag iris thrives in wet areas across the state. Crested dwarf iris grows in Great Smoky Mountains forests. Garden iris varieties flourish in Tennessee yards from Memphis to Nashville to Knoxville. Both wild and cultivated types adapt well to Tennessee's climate with hot summers and moderate winters."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Iris"
    paragraphs:
      - "This flower carries the common name Iris and the scientific genus name Iris. The genus belongs to the Iridaceae family. This family includes about 2,000 species of flowering plants found worldwide including gladiolus and crocus."
      - "The genus name Iris comes from the Greek word for rainbow. It refers to the wide range of flower colors. Over 300 species exist in the genus Iris. Wild iris species native to Tennessee include Iris virginica, called southern blue flag, and Iris cristata, known as crested dwarf iris. Garden bearded iris varieties trace ancestry to multiple species."
      - "Tennessee never specified which iris species or color represents the state. The 1933 designation simply said iris without naming a particular type. This broad approach allows all iris varieties to serve as state symbols. Wild native species and cultivated garden varieties equally represent Tennessee. The inclusive designation reflects the iris family's diversity."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Iris Became the Tennessee State Flower"
    paragraphs:
      - "Tennessee established the Iris as its official state flower in 1933. The Tennessee Federation of Garden Clubs campaigned for this designation. They organized activities promoting iris cultivation across the state. School children studied different iris varieties during this educational effort alongside broader lessons about [Tennessee's state symbols](/states/tennessee)."
      - "Irises grew successfully throughout Tennessee. Wild species thrived in wetlands and mountain forests. Garden varieties flourished in yards and public spaces. The diverse colors appealed to residents statewide. Iris flowers symbolized beauty and resilience. The plants required minimal care once established. Both native and cultivated types represented Tennessee's varied geography."
      - "Some people suggested passion flower or Tennessee coneflower instead. Iris supporters emphasized the flower's statewide adaptability. The plant grew well from the Appalachian highlands to the Mississippi bottomlands. Its spectacular blooms attracted attention each spring. The legislature passed the designation on April 1, 1933. Forty years later in 1973, Tennessee added the Passion Flower as a second official state flower while preserving [the Volunteer State tradition](/states/tennessee/nickname/the-volunteer-state)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Tennessee State Flower Facts"
    facts:
      - "Tennessee recognizes two official state flowers: the Iris adopted in 1933 and the Passion Flower designated in 1973"
      - "Wild iris species native to Tennessee include southern blue flag in wetlands and crested dwarf iris in Great Smoky Mountains forests"
      - "The iris gets its name from the Greek word for rainbow, referring to the wide range of flower colors found across the genus"
      - "Tennessee adopted the Iris on April 1, 1933, following advocacy by the Tennessee Federation of Garden Clubs"
      - "Tennessee never specified which iris species or color represents the state, allowing all iris varieties to serve as official symbols"
      - "Iris rhizomes grow horizontally underground, spreading slowly to form clumps that can live for decades in Tennessee gardens"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Tennessee State Flower and Bird"
    paragraphs:
      - "The Northern Mockingbird serves as [Tennessee's state bird](/states/tennessee/bird/northern-mockingbird), a talented songbird that mimics calls of other birds. Both symbols represent Tennessee officially. Tennessee adopted the Iris in 1933 and designated the Northern Mockingbird as state bird in 1933 during the same year."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Iris Symbolizes"
    paragraphs:
      - "The Iris commonly represents faith, hope, and wisdom in traditional flower symbolism. Different colors carry specific meanings with purple representing royalty, blue symbolizing faith, and yellow indicating passion. The flower has been linked to communication and messages across cultures. Its diverse forms frequently represent Tennessee's varied landscapes from mountains to river valleys while the resilient nature carries connotations of strength and adaptability, a theme echoed by [Tennessee's state tree](/states/tennessee/tree/tulip-poplar)."

faq:
  - question: "What is Tennessee's state flower?"
    answer: "Tennessee has two official state flowers: the iris, adopted in 1933, and the passion flower, designated in 1973. The iris was Tennessee's first state flower."

  - question: "What does the Tennessee iris look like?"
    answer: "The iris produces showy flowers with three upright petals called standards and three drooping outer petals called falls. Blooms measure 3 to 5 inches across in most varieties and come in deep purple, blue, yellow, white, and bronze. Bearded varieties show a fuzzy ridge along the falls. Plants grow 1 to 4 feet tall with distinctive sword-shaped leaves that fan out from the base."
  
  - question: "When did Tennessee adopt the Iris as its state flower?"
    answer: "Tennessee adopted the Iris on April 1, 1933. The Tennessee Federation of Garden Clubs campaigned for this designation. Tennessee later added the Passion Flower as a second state flower in 1973."
  
  - question: "Why did Tennessee choose the Iris?"
    answer: "Tennessee chose the Iris because it grew successfully throughout the state in diverse conditions. Wild species thrived in wetlands and mountain forests while garden varieties flourished in yards. The plant's adaptability from the Appalachian highlands to Mississippi bottomlands and spectacular spring blooms made it representative of Tennessee's varied geography."
  
  - question: "Which type of iris is Tennessee's state flower?"
    answer: "Tennessee never specified which iris species or color represents the state. The 1933 designation allows all iris varieties to serve as official symbols including wild native species like southern blue flag and cultivated garden varieties."
  
  - question: "Does Tennessee have two state flowers?"
    answer: "Yes, Tennessee recognizes two official state flowers. The Iris was adopted in 1933 as the first state flower. The Passion Flower was added in 1973 as a second official state flower."

