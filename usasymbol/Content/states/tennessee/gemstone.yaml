seo_title: "Tennessee State Gem | Freshwater Pearl"
seo_description: "Tennessee's state gem is the freshwater pearl, adopted in 1979. Cultured at Camden's Birdsong Creek, it comes from North America's only pearl farm."
hero_image: /images/gemstones/tennessee/tennessee-state-gemstone-hero.webp
