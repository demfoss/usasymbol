    answer: "Tennessee's state gem is the freshwater pearl, also called the Tennessee River pearl, adopted by the General Assembly in 1979."
  - question: When did Tennessee adopt the freshwater pearl as its state gem?
    answer: "The Tennessee General Assembly designated the freshwater pearl the official state gem in 1979."
  - question: Why did Tennessee choose the freshwater pearl?
    answer: "The Birdsong Creek pearl farm near Camden, the only freshwater pearl farm in North America, gave Tennessee a gem cultured entirely within the state."
  - question: Where can you see Tennessee River pearls being cultured?
    answer: "Birdsong Creek near Camden, on the Tennessee River, is the site of North America's only freshwater pearl farm."

