intro_text: "Tennessee's state gem is the freshwater pearl, known as the Tennessee River pearl, adopted in 1979 to recognize the cultured pearl industry centered at Camden on the Tennessee River system. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Tennessee State Gem
    paragraphs:
      - "Tennessee's official state gem is the freshwater pearl, designated by the General Assembly in 1979. Unlike most state gemstones, it is not mined. Freshwater mussels grow the pearls in the Tennessee River system, especially at Birdsong Creek near Camden."
      - "Tennessee stands out among states for naming an organic gem cultured within its own borders, tying the designation to a pearl-farming industry unlike any other in North America."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is a Freshwater Pearl?"
    paragraphs:
      - "A freshwater pearl forms when a mussel secretes layer after layer of nacre, a combination of calcium carbonate and organic material, around an irritant inside its shell. The result can be white, pink, lavender, or softly metallic, in round, pear, or irregular baroque shapes."
      - "Tennessee's pearls come from mussels farmed in the Tennessee River system rather than gathered wild, giving growers more control over shape and color while still relying on the same natural process mussels use anywhere."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Tennessee Chose the Freshwater Pearl as Its State Gem"
    paragraphs:
      - "John Latendresse pioneered commercial freshwater pearl culturing in the United States, founding a pearl farm at Birdsong Creek near Camden as one of several pilot locations nationwide. Birdsong Creek was the only site to succeed long-term, making it the only freshwater pearl farm in North America."
      - "That singular industry, unmatched anywhere else in the country, gave Tennessee a gem it could claim as genuinely its own rather than one traded or mined elsewhere."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How the Freshwater Pearl Became Tennessee's State Gem"
    paragraphs:
      - "The Tennessee General Assembly named the freshwater pearl the official state gem in 1979, the same year the Birdsong Creek pearl farm near Camden began operating, a coincidence that tied the new state symbol directly to the industry that inspired it."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Freshwater Pearls Are Found in Tennessee"
    paragraphs:
      - "Birdsong Creek, near Camden on the Tennessee River, is home to the only freshwater pearl farm in North America. Mussels raised there have supplied cultured pearls for jewelry since the farm's founding in 1979."
    sites:
      - name: Birdsong Creek Pearl Farm
        city: Camden
        lat: 36.0589
        lng: -88.0978
        note: "North America's only freshwater pearl farm"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Freshwater Pearl Facts"
    facts:
      - "Adopted as Tennessee's state gem in 1979."
      - "Cultured at Birdsong Creek near Camden, the only freshwater pearl farm in North America."
      - "The Camden pearl farm began operating in 1979, the same year the freshwater pearl became Tennessee's state gem."
      - "Freshwater pearls often form without a bead nucleus, which is why many Tennessee pearls grow in irregular, baroque shapes."

