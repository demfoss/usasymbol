sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of New Jersey?
  paragraphs:
  - "The black swallowtail, Papilio polyxenes, is New Jersey's official state butterfly. The New Jersey Legislature designated it in 2014."
  - "New Jersey also has a separate state bug, the European honey bee, adopted much earlier in 1974."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Black Swallowtail
  paragraphs:
  - "The black swallowtail has black wings marked with two rows of yellow spots and a patch of blue near the tail edges of the hindwings."
  - "Adults have a wingspan of about 3 to 4 inches."
  - "Caterpillars are green with black bands and yellow spots, and they feed on plants in the carrot family, including parsley, dill, and Queen Anne's lace."

- id: history
  icon: fa-solid fa-landmark
  title: How New Jersey Chose the Black Swallowtail
  paragraphs:
  - "The New Jersey Legislature designated the black swallowtail as the official state butterfly in 2014."
  - "The black swallowtail is common across New Jersey and is often seen in gardens where its caterpillars feed on parsley, dill, and similar plants."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Black Swallowtail in New Jersey
  paragraphs:
  - "The black swallowtail is found statewide in New Jersey, especially in gardens, meadows, and fields where parsley, dill, and Queen Anne's lace grow."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Black Swallowtail Facts
  facts:
