faq:
- question: What is New Jersey's state butterfly?
  answer: "New Jersey's state butterfly is the black swallowtail, adopted by the New Jersey Legislature in 2014."
- question: When did New Jersey adopt the black swallowtail?
  answer: "New Jersey adopted the black swallowtail as its official state butterfly in 2014."
- question: Why did New Jersey choose the black swallowtail?
  answer: "The black swallowtail is common across New Jersey and is a familiar sight in gardens, where its caterpillars feed on parsley, dill, and related plants."
- question: What does the black swallowtail look like?
  answer: "It has black wings with two rows of yellow spots and a patch of blue near the hindwing tails, with a wingspan of about 3 to 4 inches."
- question: Where is the black swallowtail found in New Jersey?
  answer: "It is found statewide, especially in gardens, meadows, and fields where parsley, dill, and Queen Anne's lace grow."
- question: Is the black swallowtail the same as New Jersey's state bug?
  answer: "No. New Jersey's state bug is the European honey bee, adopted in 1974. The black swallowtail is a separate designation, the state butterfly, adopted in 2014."

