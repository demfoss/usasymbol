# verification: The designation, species and scientific name match the starting record. The adoption year is different. The law is numbered with the state's 1991 session laws, but the governor approved it on January 8, 1992, and it took effect right away. State sources give 1992 as the year, so the page uses 1992. The law first named the brook trout the "State Fish," and state lawmakers changed the title to "State Freshwater Fish" in 2017.
