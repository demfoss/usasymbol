seo_title: New Jersey State Freshwater Fish | Brook Trout
seo_description: The New Jersey state freshwater fish is the brook trout, adopted in 1992. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/new-jersey/new-jersey-fish-freshwater-hero.webp
hero_image_alt: A brook trout with an olive-green back, pale wavy markings, small red spots and orange lower fins edged in white.
hero_image_caption: The brook trout is the only trout native to New Jersey.
intro_text: New Jersey's state freshwater fish is the brook trout, the only trout native to the state, adopted in 1992. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of New Jersey?
  paragraphs:
  - The brook trout became New Jersey's official state fish in 1992. Its scientific name is Salvelinus fontinalis.
  - In 2017, state lawmakers renamed its title to state freshwater fish. They also named the striped bass the state saltwater fish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout is a small, colorful trout with an olive-green back covered in pale, wavy markings.
  - Its lower fins are orange to red, and each one has a bright white front edge. That white edge is one of the easiest ways to recognize it.
  - In the fall, males turn bright orange or red underneath. People also call this fish a brookie.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - A teacher and her students at Hopatcong Middle School asked state lawmakers for years to name the brook trout the state fish.
  - Their work paid off. Governor Jim Florio visited the school and signed the law on January 8, 1992.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why New Jersey Chose the Brook Trout
  paragraphs:
  - The brook trout is the only trout native to New Jersey. Its ancestors moved into the region after the glaciers melted at the end of the last Ice Age.
  - The law says the brook trout reacts quickly to changes in its habitat, which makes it a good sign of clean water. Lawmakers also hoped that honoring the fish would build support for protecting New Jersey's wild places.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Wild brook trout live in small, cold headwater streams. Most are in the hilly northwest of the state, and a few live in one watershed in southern New Jersey.
  - The Flat Brook watershed in Sussex County has the most stream miles in the state where brook trout are the only trout. The state also raises brook trout in a hatchery and stocks them in waters across New Jersey.
