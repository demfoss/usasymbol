- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Adopted in 1992 by the New Jersey Legislature.
  - Its scientific name is Salvelinus fontinalis.
  - It is the only trout native to New Jersey.
  - Its lower fins are orange to red with white front edges.
  - It needs cold, clean water to survive.
faq:
- question: What is New Jersey's state fish?
  answer: New Jersey's state freshwater fish is the brook trout. The state saltwater fish is the striped bass.
- question: When did New Jersey adopt the Brook trout?
  answer: Governor Jim Florio signed the law on January 8, 1992, making the brook trout New Jersey's state fish. In 2017, its title became state freshwater fish.
- question: Why did New Jersey choose the Brook trout?
  answer: It is the only trout native to New Jersey. Lawmakers also said it is a good sign of clean water and that honoring it could help protect wild places.
- question: Who helped make the brook trout New Jersey's state fish?
  answer: A teacher and her students at Hopatcong Middle School led the effort. The governor came to their school to sign the law.
- question: How can you tell a brook trout from other trout?
  answer: Look for pale, wavy markings on its dark green back and a white front edge on its orange lower fins.
