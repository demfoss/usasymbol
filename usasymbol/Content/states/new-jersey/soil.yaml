faq:
- question: What is New Jersey's state soil?
  answer: "New Jersey's state soil is the Downer series, a sandy, acidic coastal plain soil found on the flat uplands of southern New Jersey. It supports both the pitch pine forests of the Pine Barrens and the blueberry and cranberry farms of the Garden State."
- question: Why is it called Downer soil?
  answer: "The Downer series is named for Downer, New Jersey, a community in Burlington County within the Pine Barrens region. USDA soil scientists name soil series after nearby towns, streams, or geographic features where the soil was first described."
- question: What color is Downer soil?
  answer: "The surface layer is dark grayish brown from organic matter. Below it is a pale, sandy eluvial layer where nutrients have washed out. The argillic subsoil is yellowish brown to brownish yellow from iron accumulation. The deepest layers are pale yellow, almost the color of dry beach sand."
- question: Where is Downer soil found in New Jersey?
  answer: "Downer soil is found on the flat coastal plain uplands of southern New Jersey, primarily in Burlington, Ocean, Atlantic, Cape May, Cumberland, Salem, and Gloucester counties. It covers the elevated ground between wetlands and bogs across the Pine Barrens region."
- question: What grows in Downer soil?
  answer: "Blueberries and cranberries are the main crops, both requiring the acidic, sandy conditions Downer soil provides. Vegetables including tomatoes, sweet corn, peppers, and potatoes also grow on cleared and irrigated Downer land. Where the soil stays forested, pitch pine and scrub oak cover the uplands."
- question: Why is Downer soil so acidic?
  answer: "Downer soil is acidic for two reasons. The parent material — ancient marine sediments — is silica-rich and low in minerals that would buffer acidity. And the pitch pine forests that grow on the soil add organic acids as their needles decompose, driving the pH down to between 4.0 and 5.5."
- question: What is the connection between Downer soil and the Pine Barrens?
  answer: "The Pine Barrens sit on Downer and similar sandy coastal plain soils. The nutrient-poor, acidic, well-drained profile is what allows the Pine Barrens ecosystem to survive — the land is too sandy and acidic for most conventional crops, which kept it from being cleared and farmed. The same soil conditions also support carnivorous plants like sundews and pitcher plants in the bogs adjacent to Downer uplands."

