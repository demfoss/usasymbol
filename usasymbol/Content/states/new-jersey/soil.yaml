meaning: "The Downer soil formed in ancient marine and river sediments deposited on New Jersey's Coastal Plain millions of years ago, long before the state existed. The sandy, acidic profile those deposits left behind feeds the pitch pines, scrub oaks, and wetland bogs of the Pine Barrens — and, where cleared and irrigated, the blueberry and cranberry farms that helped earn New Jersey the name Garden State."
