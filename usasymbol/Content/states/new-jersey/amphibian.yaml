sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of New Jersey?
    paragraphs:
      - "The Pine Barrens tree frog is New Jersey's official state amphibian, designated by the New Jersey Legislature in 2018. Its scientific name is Dryophytes andersonii, formerly classified as Hyla andersonii."
      - "It is named for the Pine Barrens, a large forested and wetland region in southern New Jersey where it is most often found."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Pine Barrens Tree Frog
    paragraphs:
      - "The Pine Barrens tree frog is bright green on top with a plum or lavender stripe bordered in white running along each side, making it one of the most colorful frogs in the eastern United States."
      - "It is small, usually growing only about 1 to 2 inches long, with sticky toe pads that help it climb plants and shrubs."
      - "It has a distinctive nasal, honking call that is often heard from wetlands on warm nights during breeding season."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The New Jersey Legislature designated the Pine Barrens tree frog the official state amphibian in 2018, recognizing a species closely tied to the state's Pine Barrens region."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why New Jersey Chose the Pine Barrens Tree Frog
    paragraphs:
      - "The Pine Barrens tree frog is strongly associated with New Jersey's Pine Barrens, one of the state's most distinctive natural areas, and the frog's bright coloring and limited range made it a fitting symbol of that landscape."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Pine Barrens Tree Frog
    paragraphs:
      - "Pine Barrens tree frogs live in the acidic bogs, cedar swamps, and wetlands of the Pinelands region of southern New Jersey."
