seo_title: "New Jersey State Flag | Colors & Meaning"
seo_description: "New Jersey's flag uses buff and blue — the colors of Washington's Continental Army uniform. It's the only state flag on a buff field. What the coat of arms means."

intro_text: "The official state flag of New Jersey dates to 1896 and includes the state coat of arms on a buff-colored background, making it a distinctive entry in the [list of U.S. state flags](/symbols/flags). Two female figures flank a shield displaying three plows. A horse head sits above the shield with ribbons below bearing the state motto and date."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the New Jersey State Flag Is Designed"
    paragraphs:
      - "The New Jersey state flag is the official civic flag of New Jersey. A buff-colored field covers the background. The state coat of arms appears in the center showing two women supporting a shield."
      - "The shield displays three plows. A horse head sits above in a helmet. Two ribbons curve below with the motto Liberty and Prosperity and the date 1776. Courthouses, state offices, and schools across New Jersey display this flag. For a comparison with a neighboring state, the [New York state flag](/states/new-york/flag) follows a similar coat-of-arms tradition but uses a blue field rather than buff."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the New Jersey Flag Communicates"
    paragraphs:
      - "The flag represents New Jersey's agricultural heritage and commitment to freedom. The three plows symbolize agriculture as the foundation of New Jersey's early economy. Each plow represents one of the state's main agricultural regions and the same identity behind [the Garden State nickname](/states/new-jersey/nickname/the-garden-state)."
      - "Liberty holds a pole with a liberty cap. She represents freedom and independence. Ceres holds a cornucopia filled with harvest. She represents abundance and prosperity through agriculture, echoing [New Jersey's state motto](/states/new-jersey/motto/liberty-and-prosperity)."
      - "The buff color honors George Washington and New Jersey troops. Continental soldiers from New Jersey wore buff-colored uniforms during the Revolution. The date 1776 marks the Declaration of Independence."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "New Jersey Flag History and Adoption"
    paragraphs:
      - "New Jersey adopted its state flag in 1896. The legislature approved a design featuring the state coat of arms on a buff field. The coat of arms itself dated to 1777. Neighboring New York formalized its own flag five years later in 1901 — see the [New York state flag history](/states/new-york/flag) to understand how two adjacent states with nearly identical heraldic traditions ended up with such different color choices."
      - "The 1896 law formalized what had been unofficial practice for decades. New Jersey militia units had carried buff-colored flags with the coat of arms since the early 1800s. No single designer is credited. The flag emerged from military tradition."
      - "The buff color came from General George Washington's choice for New Jersey Continental Line uniforms. Washington selected buff and blue as his army's colors. New Jersey regiments wore buff facings on their blue coats. The state preserved this color connection when adopting the flag, now documented on [New Jersey's state colors page](/states/new-jersey/color/new-jersey-official-state-colors-jersey-blue-and-buff)."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the New Jersey Flag"
    symbols:
      - id: coat-of-arms
        name: "New Jersey Coat of Arms"
        image: "symbols/coat-of-arms.svg"
        paragraphs:
          - "The coat of arms shows two women supporting a shield bearing three plows. New Jersey adopted this design in 1777. A shield shows three plows arranged vertically. The plows represent New Jersey's agricultural economy and three main farming regions."
          - "A forward-facing horse head sits in a helmet above the shield. This symbolizes speed and strength. The horse head symbolizes strength, speed, and independence, qualities associated with New Jersey."
          - "Two female figures serve as supporters. Liberty stands on the left holding a pole with a liberty cap. The cap symbolizes freedom from tyranny. Ceres stands on the right holding a cornucopia overflowing with produce. She represents agricultural abundance and prosperity."

      - id: ribbons
        name: "Motto Ribbons"
        image: "symbols/ribbons.svg"
        paragraphs:
          - "Two ribbons curve below the shield. The motto Liberty and Prosperity appears on the top ribbon. New Jersey adopted this motto in 1777. It emphasizes the state's values of freedom and economic success."
      - "The date 1776 appears on the lower ribbon. This marks the signing of the Declaration of Independence. New Jersey was one of the thirteen original colonies that declared independence that year, a timeline often compared in [U.S. states by population](/rankings/demographics/states-by-population)."

      - id: field
        name: "Buff Field"
        image: "symbols/field.svg"
        paragraphs:
          - "Buff covers the entire background. This yellowish-brown color honors New Jersey Continental Line soldiers. They wore buff-colored uniform facings during the Revolutionary War."
          - "George Washington chose buff and blue as Continental Army colors. New Jersey preserved this military connection. Buff makes New Jersey's flag distinctive among state flags that typically use blue."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "New Jersey State Flag Colors"
    paragraphs:
      - "The flag uses buff, blue, gold, green, brown, and white. Buff forms the field. Blue appears in Liberty's clothing and details. Gold shows in Ceres' cornucopia. Green depicts vegetation. Brown colors the plows. White highlights the ribbons and clothing; for a broader palette comparison see [U.S. state colors](/symbols/colors)."
