  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Jersey State Flag Facts"
    facts:
      - "New Jersey adopted its state flag in 1896"
      - "The state coat of arms dates to 1777"
      - "The buff color honors Continental Army uniforms"
      - "Three plows represent New Jersey's agricultural regions"
      - "Liberty and Ceres serve as supporters on the coat of arms"
      - "The date 1776 appears on the lower ribbon"

faq:
  - question: "What design is recognized as the state flag of New Jersey?"
    answer: "The New Jersey state flag is the official banner of New Jersey. It features the state coat of arms showing two female figures supporting a shield with three plows on a buff-colored field."

  - question: "What does New Jersey's flag look like?"
    answer: "The flag shows the New Jersey coat of arms on a buff background. The coat of arms includes a shield with three plows, a horse head above, and two women (Liberty and Ceres) on each side. Two ribbons below display the motto and date 1776."

  - question: "What meaning is attached to New Jersey's flag?"
    answer: "The flag represents New Jersey's agricultural heritage and Revolutionary War history. The plows symbolize farming. Liberty represents freedom. Ceres represents prosperity. The buff color honors Continental soldiers."

  - question: "How do historians explain the symbolism of New Jersey's flag?"
    answer: "The flag means agriculture and liberty. Three plows show farming as New Jersey's economic foundation. Liberty and Ceres represent freedom and prosperity. The 1776 date marks independence."

  - question: "What should readers know first about New Jersey's flag?"
    answer: "The New Jersey coat of arms is in the center. It shows a shield with three plows, a horse head above, Liberty and Ceres as supporters, and ribbons with the motto Liberty and Prosperity and the date 1776."

  - question: "How is New Jersey's flag usually described?"
    answer: "The designer of the flag is not recorded in New Jersey state archives. The design emerged from the state coat of arms created in 1777 and military tradition. The 1896 law formalized existing practice."

