seo_title: "New Jersey State Nickname: The Garden State"
seo_description: "New Jersey's state nickname, the Garden State, reflects its agricultural history. This page explains how the name originated and why it became widely used despite never being officially adopted."

intro_text: "Abraham Browning referred to New Jersey as <i>the Garden State</i> during a speech at the 1876 Philadelphia Centennial Exhibition. In 1954, the state legislature voted to place the phrase on New Jersey license plates over Governor Robert Meyner’s veto. Today, the Garden State remains New Jersey’s most widely recognized and established state nickname, supported by long-standing public and governmental use and closely tied to [New Jersey's state motto](/states/new-jersey/motto/liberty-and-prosperity)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Garden State'"
    paragraphs:
      - "Abraham Browning spoke on New Jersey Day at the Philadelphia Centennial Exhibition on August 24, 1876. He compared New Jersey to an immense barrel filled with good things to eat and open at both ends, with Pennsylvanians drawing from one side and New Yorkers from the other — the same New York whose [history of the Empire State](/states/new-york/nickname/the-empire-state) was built partly on the agriculture and trade that New Jersey's fertile land supplied. Similar barrel imagery appeared earlier in the writings of Benjamin Franklin, leading historians to debate whether Browning originated the phrase or helped popularize it."
      - "Long before Browning’s speech, farmland advertisements promoted New Jersey’s fertile soil and agricultural output. Communities in the Pine Barrens, including Hammonton and Vineland, marketed themselves as part of the Garden State of the East during the mid-1800s. Other states briefly used similar garden-related descriptions, but by the 1860s New Jersey had become most closely associated with the name and with agricultural symbols such as [the New Jersey state flower](/states/new-jersey/flower/violet)."
      - "Use of the Garden State became standardized in practice when the legislature voted in 1954 to place the phrase on license plates. Governor Robert Meyner vetoed the measure after questioning its historical basis, but lawmakers overrode his veto. New Jersey license plates began displaying Garden State in 1959, marking the nickname’s permanent place in the state’s public identity — and in the broader [directory of state monikers](/symbols/nicknames), alongside visual cues from [the New Jersey state flag](/states/new-jersey/flag/new-jersey-state-flag)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Crossroads of the Revolution"
        text: "New Jersey earned this nickname because of its central role in the American Revolutionary War. More than 100 battles and skirmishes occurred within the state as British and American forces fought for control between New York and Philadelphia. George Washington crossed the Delaware River from Pennsylvania to mount his surprise attack at Trenton — a campaign that runs through the [Keystone State history](/states/pennsylvania/nickname/the-keystone-state) as the western bookend of this same Revolutionary corridor. His victories at Trenton and Princeton in late 1776 and early 1777 proved especially important. The concentration of military activity led historians to describe New Jersey as the Crossroads of the Revolution."
      - subtitle: "The Clam State"
        text: "New Jersey’s Atlantic coastline and Delaware Bay supported extensive clam harvesting for generations. Hard clams, soft-shell clams, and surf clams contributed to coastal economies, particularly in southern parts of the state. Although the nickname never became widespread, it reflects the importance of seafood industries. In 1995, New Jersey designated the knobbed whelk as its official shell, further highlighting the state’s maritime resources."
      - subtitle: "The Switzerland of America"
        text: "Travel writers in the 1800s compared the hills and lakes of northwestern New Jersey to the scenery of Switzerland. Resorts developed around places such as Lake Hopatcong to attract visitors seeking mountain landscapes near major cities. Guidebooks and newspapers promoted the comparison to emphasize natural beauty. Modern use of Switzerland of America is rare and appears mainly in historical descriptions."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "New Jersey’s state motto is Liberty and Prosperity, adopted in 1777 and displayed on the state seal."
      - "Garden State does not appear on the state seal but is used prominently on license plates and in state identity materials."
      - "About 9,000 farms operate in New Jersey, covering roughly 720,000 acres, or about 15 percent of the state’s land area."
      - "New Jersey ranks among the top states nationally for blueberries, cranberries, tomatoes, bell peppers, and eggplant production."
      - "Blueberries were first cultivated commercially in Whitesbog, New Jersey, and became the official state fruit in 2004."
      - "New Jersey license plates changed from orange and black to yellow and black in 1959, the first year Garden State appeared on the design."

faq:
  - question: "What is New Jersey’s nickname?"
    answer: "New Jersey’s nickname is the Garden State, a name that reflects the state’s agricultural heritage and long history of farming."

  - question: "Why is New Jersey called the Garden State?"
    answer: "New Jersey is called the Garden State because fertile farmland once supplied fruits and vegetables to major cities like New York and Philadelphia during the 1800s."

  - question: "Who first called New Jersey the Garden State?"
    answer: "Abraham Browning popularized the phrase in an 1876 speech at the Philadelphia Centennial Exhibition, though similar language appeared in earlier agricultural promotions."

  - question: "When did New Jersey start using the Garden State nickname?"
    answer: "The nickname appeared in agricultural advertising during the mid-1800s and became widely recognized after the legislature placed it on license plates in 1954."

  - question: "What is New Jersey’s nickname and motto?"
    answer: "New Jersey’s nickname is the Garden State, and its state motto is Liberty and Prosperity."

