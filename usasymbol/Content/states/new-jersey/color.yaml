title: "Official and Traditional Colors of New Jersey"
state: "New Jersey"
adopted_year: 1965

seo_title: "New Jersey State Colors: Official HEX Codes & Meaning"
seo_description: "New Jersey state colors are Jersey Blue and Buff, officially designated in 1965. Full HEX, RGB, CMYK, and Pantone values with historical context for designers and researchers."

intro_text: "The official state colors of New Jersey are **Jersey Blue** and **Buff**, formally designated on September 30, 1965, under New Jersey Chapter 170, P.L. 1965. The colors trace to September 14, 1779, when General George Washington personally chose Jersey blue coats with buff facings for the New Jersey Continental Line — buff previously reserved for Washington's own uniform — and both appear on [the New Jersey state flag](/states/new-jersey/flag/new-jersey-state-flag) today. Use the color codes below for accurate New Jersey branding in any medium — HEX, RGB, CMYK, and Pantone values all included."

official_colors: "Jersey Blue and Buff"
official_since: "1965 (New Jersey Chapter 170, P.L. 1965; Title 52:2A-1; colors originally chosen by George Washington, September 14, 1779)"
primary_use: "State flag of New Jersey (buff field with Jersey blue coat of arms), New Jersey state government branding, state agency communications and official materials"
known_for: "New Jersey is the only U.S. state to define its official colors using the Cable Color System developed by the Color Association of the United States; the colors were chosen by George Washington himself during the Revolutionary War — making them the only U.S. state colors with a direct Presidential origin; buff was previously reserved exclusively for Washington's own uniform and those of Continental generals, making New Jersey's assignment a special honor in 1779"

