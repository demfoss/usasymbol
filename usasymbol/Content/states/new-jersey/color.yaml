faq:
  - question: "What are the official colors of New Jersey?"
    answer: "The official state colors of New Jersey are Jersey Blue and Buff, designated in 1965 under New Jersey Chapter 170, P.L. 1965 (Title 52:2A-1). Jersey Blue is Cable No. 70087 (HEX #2484C6) and Buff is Cable No. 65015 (HEX #E1B584), per the New Jersey Secretary of State."
  - question: "What is the HEX code for Jersey Blue?"
    answer: "The official HEX code for Jersey Blue is #2484C6, provided by the New Jersey Secretary of State as the digital equivalent of Cable No. 70087. This corresponds approximately to Pantone PMS 285."
  - question: "What is the HEX code for New Jersey Buff?"
    answer: "The official HEX code for New Jersey Buff is #E1B584, provided by the New Jersey Secretary of State as the digital equivalent of Cable No. 65015. The U.S. Army's Institute of Heraldry designates PMS 465 as the Pantone equivalent."
  - question: "Who chose New Jersey's state colors?"
    answer: "General George Washington personally chose Jersey Blue and Buff for the New Jersey Continental Line uniforms on September 14, 1779, while encamped at Jockey Hollow in Morristown, New Jersey. These military colors were formally designated as official state colors by the New Jersey Legislature in 1965."
  - question: "Why is New Jersey's flag buff-colored?"
    answer: "New Jersey's state flag has a buff background because buff was the color Washington assigned to New Jersey's Continental Army uniform facings in 1779, honoring the state's troops with a distinction previously reserved for Washington and other Continental generals. The 1896 state flag law placed the coat of arms on a buff field, and the buff background has remained unchanged ever since — making New Jersey's flag the only U.S. state flag with a buff field."
  - question: "What is the Cable Color System?"
    answer: "The Cable Color System was developed by the Color Association of the United States, a non-profit organization founded in 1915 to standardize color specifications for American textile and manufacturing industries. New Jersey used Cable No. 70087 (Jersey Blue) and Cable No. 65015 (Buff) in its 1965 color statute — the only U.S. state to use the Cable system rather than Pantone for official color designation."

