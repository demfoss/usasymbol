sections:
  - id: "official-designation"
    title: "Official Designation and the Cable Color System"
    style: "default"
    paragraphs:
      - "New Jersey's official state colors were designated on September 30, 1965, under Chapter 170, P.L. 1965, introduced in the New Jersey Senate as Senate No. 159 by Senator Farley. The act states: 'The official colors of the State of New Jersey for use on the state flag and for other purposes shall be buff and Jersey blue.' The law then specifies the colors using the Cable color system developed by the Color Association of the United States, designating Jersey Blue as Cable No. 70087 (described as royal blue) and Buff as Cable No. 65015 (described as U.S. Army Buff). The New Jersey Secretary of State's office provides the hexadecimal equivalents as #2484C6 for Jersey Blue and #E1B584 for Buff, making New Jersey one of the few states to publish official digital color values directly from the Secretary of State's office and directly informing [the New Jersey state flag](/states/new-jersey/flag/new-jersey-state-flag)."
      - "New Jersey is unique in American state color history for using the Cable Color System rather than the more commonly referenced Pantone Matching System. The Cable system was developed by the Color Association of the United States, a non-profit organization founded in 1915 to standardize color specifications for American textile and manufacturing industries. The Cable system was the authoritative American color standard in the mid-20th century before Pantone became dominant in printing and design. The U.S. Army's Institute of Heraldry has provided PMS 465 as the Pantone equivalent for buff, while Jersey Blue approximates PMS 285."
    subsections:
      - subtitle: "George Washington's 1779 Color Choice"
        text: "The origin of New Jersey's state colors is unique among American state color histories: they were personally chosen by George Washington during the Revolutionary War. On September 14, 1779, while commanding the Continental Army, Washington ordered that the uniform coats of the New Jersey Continental Line be dark (Jersey) blue, with buff facings. This was a deliberate honor — buff-colored facings had until that point been reserved exclusively for Washington's own uniform and the uniforms of other Continental Army generals and their aides-de-camp. By extending buff facings to New Jersey's regiments, Washington conferred a distinction previously held only by the highest ranks of the Continental Army. On February 14, 1780, the Continental War Officers in Philadelphia then directed that the uniform coat facings of all regiments should match the background color of each regiment's state flag, connecting the uniform colors directly to what became the state's flag palette. New Jersey adopted these military colors as its official state flag in 1896 and formally codified them as official state colors in 1965, while the civic message remained aligned with [New Jersey's motto](/states/new-jersey/motto/liberty-and-prosperity)."
      - subtitle: "The Dutch Heritage Connection"
        text: "Historians and vexillologists have offered a compelling explanation for why Washington selected specifically dark blue and buff for the New Jersey and New York Continental regiments: both states had been originally settled by the Dutch, and dark blue and buff were historically identified with the Holland (Netherlands) national palette. Washington, who was deeply attentive to historical symbolism, may have selected these colors specifically to honor the Dutch heritage of the two original Dutch settlements — New Amsterdam (New York) and New Jersey — that had become the states whose regiments he was outfitting. This Dutch connection gives New Jersey's state colors one of the most historically layered origins of any American state, linking the Revolutionary War buff-and-blue to the earlier colonial period of Dutch settlement that began in the 1620s and to identity narratives on [the Garden State page](/states/new-jersey/nickname/the-garden-state)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Jersey Blue and Buff carry Revolutionary War symbolism that is more specifically documented than almost any other state color pair in America. Because Washington personally chose both colors on a specific date (September 14, 1779) for a documented military purpose (the uniform coats of the New Jersey Continental Line), the colors have a verifiable historical origin that most state colors — derived from abstract symbolism or natural association — lack. Buff in particular carries a special significance: it was the color of distinction previously reserved for Washington's own uniform, and its extension to New Jersey's troops was an explicit honor conveyed by the Commander-in-Chief of the Continental Army."
    subsections:
      - subtitle: "Buff: Washington's Distinguished Color"
        text: "The buff facing color on Continental Army uniforms had a specific heraldic function in the 18th-century military context. In the Continental Army's uniform regulations, the color of a coat's facings — the contrasting cloth on lapels, cuffs, and collar — indicated a soldier's regimental and sometimes national affiliation. Buff facings were specifically designated for General Washington and other senior Continental generals, making the color a visual marker of the highest military authority. When Washington extended buff facings to New Jersey's troops in September 1779, he was sharing the color of his own uniform with them — a gesture of distinction that New Jersey's soldiers wore on every subsequent engagement of the Revolutionary War. The buff color's warm, golden-yellow tone was also visually distinctive on the battlefield, allowing New Jersey's regiments to be identified at a distance in the confused visual environment of 18th-century warfare. New Jersey's state flag, adopted in 1896, uses buff as the entire flag background — the only state flag in the country with a buff field — making the Washington connection visible on every New Jersey flag flown today."
      - subtitle: "Jersey Blue: The Dutch Colonial Legacy"
        text: "Jersey Blue's shade — a royal blue specified as Cable No. 70087 with hexadecimal value #2484C6 — connects to both Dutch colonial heritage and Revolutionary War identity. The blue is specifically called Jersey Blue rather than simply blue, a named shade that reflects the color's unique association with New Jersey's military and state identity since 1779. In the Revolutionary War context, the dark blue coat was the foundation of the Continental Army uniform — the primary color before buff facings were added — and the blue of New Jersey's regiments became inseparable from their identity as one of Washington's most trusted forces during the long New Jersey campaigns of 1776-1780. Washington's New Jersey headquarters at Jockey Hollow in Morristown, where he chose the state's colors, is now preserved as Morristown National Historical Park, the country's first national historical park, established in 1933."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and State Identity"
    style: "default"
    paragraphs:
      - "New Jersey's Jersey Blue and Buff appear with consistent specificity across the state's official symbols. The state flag, adopted in 1896 and unchanged since, displays the New Jersey coat of arms in Jersey blue against a buff background — the only state flag in the United States with a buff field, giving New Jersey one of the most visually distinctive flags in the country. The state coat of arms, designed in 1777 during the Revolutionary War, features three plows representing New Jersey's agricultural heritage (the Garden State), two female figures representing Liberty and Ceres (goddess of agriculture), and the motto 'Liberty and Prosperity 1776.' The coat of arms is rendered in Jersey blue tones against the buff field, creating a two-color composition that directly expresses the official state color palette. New Jersey's specification of Jersey Blue and Buff using the Cable Color System — rather than the Pantone Matching System used by most other states — reflects the historical context of the 1965 designation, when the Cable system was still the authoritative American textile color standard. The Secretary of State's office maintains and publishes the HEX equivalents (#2484C6 and #E1B584) for digital use, ensuring that the 18th-century Cable specifications translate accurately into 21st-century design contexts and supporting symbol consistency with [the state horse page](/states/new-jersey/mammal/horse)."

