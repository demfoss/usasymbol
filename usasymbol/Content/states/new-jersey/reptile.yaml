sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of New Jersey?
    paragraphs:
      - "The bog turtle is New Jersey's official state reptile, designated by the New Jersey Legislature in 2018. Its scientific name is Glyptemys muhlenbergii, and it is one of the smallest turtle species in the world."
      - "It lives in small, spring-fed wetlands and wet meadows scattered across parts of New Jersey."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Bog Turtle
    paragraphs:
      - "The bog turtle has a dark brown to black shell and is easily identified by a bright orange or yellow patch on each side of its neck."
      - "It is tiny for a turtle, with adults usually reaching only about 3 to 4 inches in shell length."
      - "Bog turtles spend most of their time in mud and shallow water within wet meadows, often burrowing into soft mud to hide or hibernate."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The New Jersey Legislature designated the bog turtle the official state reptile in 2018, recognizing a rare native species found in the state's wetlands."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why New Jersey Chose the Bog Turtle
    paragraphs:
      - "The bog turtle is one of the rarest and smallest turtles in North America, and its presence in New Jersey's wetlands made it a distinctive choice tied to the conservation of the state's remaining wet meadow habitat."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Bog Turtle
    paragraphs:
      - "Bog turtles are found in scattered spring-fed wetlands and wet meadows in northern and western New Jersey, though their habitat is limited and increasingly rare."
