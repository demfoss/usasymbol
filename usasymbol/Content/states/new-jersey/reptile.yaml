faq:
  - question: What is New Jersey's state reptile?
    answer: "New Jersey's state reptile is the bog turtle, adopted by the New Jersey Legislature in 2018."
  - question: When did New Jersey adopt the bog turtle?
    answer: "The New Jersey Legislature designated the bog turtle the official state reptile in 2018."
  - question: Why did New Jersey choose the bog turtle?
    answer: "The bog turtle is one of the smallest and rarest turtles in North America, and its presence in New Jersey's wetlands ties it closely to the state's conservation efforts."
  - question: Is the bog turtle endangered?
    answer: "The bog turtle is federally listed as threatened because its wetland habitat has become increasingly rare and fragmented."

