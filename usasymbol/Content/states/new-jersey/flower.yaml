seo_title: "New Jersey State Flower | Violet"
seo_description: "The Violet became New Jersey's state flower in 1971. These small purple flowers bloom in woodlands and meadows across New Jersey each spring."

intro_text: "The Violet gained official status as New Jersey's state flower in 1971 and remains a familiar entry in the [list of U.S. state flowers](/symbols/flowers). These small purple flowers bloom in woodlands and meadows throughout New Jersey. Delicate blooms carpet forest floors and grassy areas across the state each spring."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the New Jersey State Flower?"
    paragraphs:
      - "New Jersey recognizes the Violet as its state flower. Each flower displays five petals in shades of purple, blue, or white depending on species. The blooms measure about half an inch to one inch across. Heart-shaped leaves grow on short stems from the plant's base. A distinctive spur extends from the back of each flower."
      - "New Jersey violets bloom from March through May across the state. Early spring triggers the first blooms in southern counties. Northern regions see flowers appear several weeks later. The plants grow 4 to 8 inches tall. Low growing stems spread across the ground. Violets thrive in moist soil with partial shade."
      - "Native violet species grow throughout New Jersey in diverse habitats. Woodlands provide ideal conditions for many varieties. Meadow violets prefer open grassy areas. The plants tolerate various soil types. Some species grow in wetlands while others thrive in dry upland areas. New Jersey hosts over 20 native violet species."

  - id: name
    icon: "fa-solid fa-tag"
    title: "New Jersey State Flower Name"
    paragraphs:
      - "Known as Violet, this flower's scientific designation is Viola sororia for the most common New Jersey species. The plant belongs to the Violaceae family. This family contains about 900 species of violets and pansies found worldwide."
      - "The genus name Viola comes from the Latin word for violet. The species name sororia means sisterly, referring to how closely this violet resembles other species. Common blue violet serves as another name for Viola sororia. People also call it common meadow violet or hooded violet."
      - "New Jersey never specified which violet species qualified as the official state flower. The 1971 designation simply said violet without naming a particular species. This allows all native New Jersey violets to represent the state. Viola sororia appears most frequently across New Jersey landscapes among the many violet species."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How New Jersey Chose the Violet"
    paragraphs:
      - "New Jersey adopted the Violet as its official state flower in 1971. This came surprisingly late compared to other states. New Jersey operated without an official flower for decades. The state legislature debated various flower choices during the 1900s without reaching consensus, even as [the Garden State nickname](/states/new-jersey/nickname/the-garden-state) was already widely used."
      - "School children throughout New Jersey participated in voting for their preferred flower during the 1960s. The violet won this informal vote among students. Garden clubs supported the violet selection. The flower's widespread distribution across New Jersey influenced the choice. Every county in the state had native violet populations, much like species tracked in the [list of U.S. state birds](/symbols/birds)."
      - "Some legislators questioned adopting the same flower as several other states. Illinois, Rhode Island, and Wisconsin already used the violet. Supporters argued that New Jersey's violets deserved recognition regardless. The delicate flowers bloomed reliably each spring. The legislature finally passed the designation on June 9, 1971. New Jersey became one of the last states to adopt an official floral emblem, with language that fits [New Jersey's state motto](/states/new-jersey/motto/liberty-and-prosperity)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Jersey State Flower Facts"
    facts:
      - "New Jersey hosts over 20 native violet species with flowers ranging from deep purple to white, growing in habitats from woodlands to wetlands"
      - "Violets produce two types of flowers including showy spring blooms for pollination and hidden summer flowers that self-pollinate without opening"
      - "New Jersey adopted the Violet on June 9, 1971, making it one of the last states to designate an official state flower"
      - "Native Americans and early settlers ate violet leaves in salads and used the flowers to make syrup, with the leaves being rich in vitamins A and C"
      - "Violet seeds have a special appendage that attracts ants which carry the seeds to new locations and help spread the plants"
      - "The common blue violet can produce flowers in fall as well as spring when conditions remain favorable with adequate moisture"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "New Jersey State Flower and Bird"
    paragraphs:
      - "The American Goldfinch serves as New Jersey's state bird, a small yellow songbird with distinctive black markings. Both symbols represent New Jersey officially. New Jersey adopted the Violet in 1971 and designated the American Goldfinch as state bird in 1935; see [the state bird profile](/states/new-jersey/bird/american-goldfinch)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Violet commonly represents modesty and faithfulness in traditional flower symbolism. The flower has been linked to humility and spiritual wisdom. Its delicate appearance carries connotations of innocence and affection while representing the natural beauty found throughout New Jersey's diverse landscapes from mountains to shore, including habitats shaped by [the Northern Red Oak state tree](/states/new-jersey/tree/northern-red-oak)."

faq:
  - question: "What is New Jersey's state flower?"
    answer: "New Jersey's state flower is the Violet, a small purple flower that blooms in woodlands and meadows throughout the state each spring."
  
  - question: "When did New Jersey adopt the Violet as its state flower?"
    answer: "New Jersey adopted the Violet on June 9, 1971. The designation followed voting by school children who selected it as their favorite flower."
  
  - question: "Why did New Jersey choose the Violet?"
    answer: "New Jersey chose the Violet because it grows abundantly throughout every county in the state. School children voted for it in an informal election. The flower's widespread distribution, reliable spring blooms, and delicate beauty made it an appropriate symbol despite other states also using the violet."
  
  - question: "Which species of violet is New Jersey's state flower?"
    answer: "New Jersey never specified a particular violet species as the state flower. The 1971 designation includes all native New Jersey violets. The common blue violet appears most frequently across the state among over 20 native violet species."
  
  - question: "When do violets bloom in New Jersey?"
    answer: "Violets bloom from March through May in New Jersey. Early spring triggers the first blooms in southern counties while northern regions see flowers several weeks later. Some species can produce fall blooms when conditions remain favorable."

