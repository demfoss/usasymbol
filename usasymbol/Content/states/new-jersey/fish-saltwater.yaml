- id: facts
  icon: fa-solid fa-lightbulb
  title: Striped Bass Facts
  facts:
  - Adopted in 2017 by the New Jersey Legislature.
  - Its scientific name is Morone saxatilis.
  - It has seven or eight dark stripes along a silvery body.
  - New Jersey's record striped bass weighed 78 pounds 8 ounces. It was caught at Atlantic City in 1982.
  - That Atlantic City fish was once the world record striped bass.
faq:
- question: What is New Jersey's state fish?
  answer: New Jersey's state saltwater fish is the striped bass. The state freshwater fish is the brook trout.
- question: When did New Jersey adopt the striped bass?
  answer: The striped bass became New Jersey's state saltwater fish on August 7, 2017, when the governor signed the law.
- question: Why did New Jersey choose the striped bass?
  answer: Overfishing almost wiped out striped bass in the 1980s, but strict protections helped them recover. Lawmakers chose the fish because it matters so much to anglers and to the state's waters.
- question: Who came up with the idea to make the striped bass a state symbol?
  answer: Students at the New Jersey Academy of Aquatic Sciences in Camden started the effort. State lawmakers then passed the bill.
- question: What is the biggest striped bass ever caught in New Jersey?
  answer: Al McReynolds caught a 78-pound, 8-ounce striped bass from an Atlantic City jetty in 1982. It was a world record for many years.
