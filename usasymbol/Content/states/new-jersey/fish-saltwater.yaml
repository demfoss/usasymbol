intro_text: New Jersey's state saltwater fish is the striped bass, a silvery fish with dark stripes, adopted in 2017. Anglers catch it along the Jersey Shore and in the state's bays and rivers. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of New Jersey?
  paragraphs:
  - The striped bass is New Jersey's official state saltwater fish. State lawmakers gave it this title in 2017. Its scientific name is Morone saxatilis.
  - The same law renamed the brook trout as New Jersey's state freshwater fish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Striped Bass
  paragraphs:
  - The striped bass is a silvery white fish. Seven or eight dark stripes run along its body from head to tail, and that is how it got its name.
  - Many people call it a striper. Striped bass can grow very large, and the biggest ones are often females.
  - Striped bass live in both fresh and salt water. They grow up in the ocean and swim up rivers in spring to lay their eggs.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - Students at the New Jersey Academy of Aquatic Sciences in Camden started the push to make the striped bass a state symbol. Today the school is called the Center for Aquatic Sciences.
  - A state lawmaker from Cape May County who also worked as a commercial fisherman sponsored the bill. Governor Chris Christie signed it into law on August 7, 2017.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why New Jersey Chose the Striped Bass
  paragraphs:
  - The law explains the choice. Overfishing in the early 1980s caused striped bass numbers to drop sharply, so the state put strict rules in place to protect them.
  - The fish came back to healthy numbers. Lawmakers chose it because it matters so much to anglers and to the state's waters.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Striped Bass
  paragraphs:
  - Striped bass live along the whole New Jersey coast. You can also find them in Raritan Bay, Barnegat Bay, Delaware Bay, and rivers such as the Navesink and the Delaware.
  - Every spring, large striped bass swim up the Delaware River to spawn. The Delaware is one of the most important places on the Atlantic coast where young striped bass are born.
