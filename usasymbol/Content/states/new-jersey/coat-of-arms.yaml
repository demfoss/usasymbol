type: State Coat of Arms
state: New Jersey
name: New Jersey State Coat of Arms
adopted_year: 1777
is_official: true
meaning: "The New Jersey coat of arms translates the state motto directly into two figures. Liberty on the left holds the Phrygian cap that colonists used as a symbol of rebellion against British rule. Ceres on the right holds a cornucopia full of produce, placing agriculture at the same level as freedom in the state's founding identity. The three plows on the shield tie both values to the land, which is why New Jersey has been called the Garden State for more than two centuries."
meaning_title: Meaning of the New Jersey Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'New Jersey Coat of Arms: Meaning, Symbols and History'
seo_description: "The New Jersey coat of arms was adopted in 1777 and shows three plows on a shield flanked by Liberty and Ceres, representing freedom and prosperity."
hero_image: /images/coats-of-arms/new-jersey/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of New Jersey, adopted 1777, showing a blue shield with three plows, a knight's helmet, a horse's head crest, and the figures of Liberty and Ceres as supporters
hero_image_caption: The New Jersey Coat of Arms, adopted May 1777. The blue shield displays three plows representing the state's agriculture. Liberty stands on the left holding a Phrygian cap on a staff; Ceres stands on the right holding a cornucopia. A knight's helmet sits above the shield, topped by a horse's head. The motto reads "Liberty and Prosperity."
intro_text: "The New Jersey coat of arms was designed by Pierre Eugene du Simitière, a Swiss-born artist in Philadelphia, and adopted by the state Legislature at the Indian King Tavern in Haddonfield in May 1777. Du Simitière added a knight's helmet to the design that the Legislature had not requested, placing it between the horse's head crest and the shield as a symbol of state sovereignty. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the New Jersey Coat of Arms?
  paragraphs:
  - "New Jersey is one of the few U.S. states with a proper heraldic coat of arms: a full design with a shield, crest, supporters, and motto. It is separate from but closely related to the state seal, which uses the coat of arms centered on a circular disc."
  - "The design shows a blue shield bearing three gold plows. Above the shield sits a knight's helmet, and above that is a horse's head. On the left stands the figure of Liberty, holding a staff topped with a Phrygian cap. On the right stands Ceres, the Roman goddess of grain, holding an upright cornucopia filled with fruit."
  - "A ribbon at the base carries the motto 'Liberty and Prosperity' with the year 1776. The coat of arms appears in the center of New Jersey's buff-colored state flag. The buff background was adopted in 1965, tracing its color to the facing cloth worn on New Jersey soldiers' uniforms during the Revolutionary War in 1779."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the New Jersey Coat of Arms
  paragraphs:
  - "In September 1776, the New Jersey Legislature appointed a joint committee to recommend a design for a state seal. The committee turned to Pierre Eugene du Simitière, a Swiss-born artist living in Philadelphia who was working on seal designs for several of the new American states."
  - "Du Simitière completed his design in late 1776. When he presented the finished coat of arms to the Legislature in May 1777, the Legislature was meeting at the Indian King Tavern in Haddonfield, South Jersey, because British forces had occupied much of northern New Jersey. The Legislature adopted the design there."
  - "Du Simitière had not followed the committee's brief exactly. He added a knight's helmet between the horse's head and the shield, an element the Legislature had not specified. The helmet represented state sovereignty in traditional heraldic language, and the Legislature kept it."
  - "The design remained essentially unchanged for 150 years. In 1928, the Legislature passed Joint Resolution 8, which made several corrections to the standard version. Liberty's staff was moved from her left arm to her right hand, both female figures were turned to face forward rather than away from the shield, and Ceres's cornucopia was changed to stand upright rather than inverted. The year 1776 was written in Arabic numerals for the first time, replacing the Roman numerals used in the original."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the New Jersey Coat of Arms
  paragraphs:
  - "The New Jersey coat of arms is a full heraldic achievement: shield, crest, supporters, and motto. Each element was chosen to represent a specific aspect of the new state's identity in 1777."
  elements:
  - id: shield-plows
    name: Shield with Three Plows
    image: /images/coats-of-arms/new-jersey/elements/shield.webp
    paragraphs:
    - "The shield is blue and displays three gold plows arranged vertically. Each plow faces the same direction. The plows represent New Jersey's agricultural economy, which was the foundation of the colonial and early state economy."
    - "New Jersey's identity as the Garden State grows directly from this heraldic choice. The three plows on a blue field have been the central visual of the coat of arms since 1777."
  - id: helmet
    name: Knight's Helmet
    image: /images/coats-of-arms/new-jersey/elements/helmet.webp
    paragraphs:
    - "A forward-facing knight's helmet sits directly above the shield. In heraldry, a helmet placed above a shield indicates sovereignty: the state governs itself. Du Simitière added this element on his own initiative; the Legislature's original brief did not include it."
  - id: horse-head
    name: Horse's Head Crest
    image: /images/coats-of-arms/new-jersey/elements/horse.webp
    paragraphs:
    - "A horse's head sits at the top of the design, above the helmet, as the crest. According to official sources, the horse's head represents speed, strength, and utility. New Jersey has a long history of horse breeding, and the horse was designated the official state animal in 1977."
  - id: liberty
    name: Liberty
    image: /images/coats-of-arms/new-jersey/elements/liberty.webp
    paragraphs:
    - "Liberty stands on the left side of the shield. She holds a staff in her right hand, topped with a Phrygian cap. In the American colonies, the Phrygian cap was worn as a symbol of rebellion against British authority. The word 'LIBERTY' appears beneath her."
    - "In the original 1777 design, Liberty held her staff in her left arm and faced away from the shield. The 1928 modification turned her to face forward and moved the staff to her right hand."
  - id: ceres
    name: Ceres
    image: /images/coats-of-arms/new-jersey/elements/ceres.webp
    paragraphs:
    - "Ceres, the Roman goddess of grain, stands on the right side of the shield. She holds an upright cornucopia filled with apples, grapes, and plums. The word 'PROSPERITY' appears beneath her. Together, Liberty and Ceres represent the two words of the state motto."
    - "In the original 1777 design, Ceres held her cornucopia inverted and faced away from the shield. The 1928 modification turned her forward and corrected the cornucopia to stand upright."
  - id: motto
    name: Liberty and Prosperity
    image: /images/coats-of-arms/new-jersey/elements/motto.webp
    paragraphs:
    - "A ribbon at the base of the design carries the state motto 'Liberty and Prosperity' with the year 1776. The year marks New Jersey's declaration of independence. In the original design, the year appeared in Roman numerals; the 1928 revision changed it to Arabic numerals."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the New Jersey Coat of Arms
  paragraphs:
  - "The design puts the state motto into visual form. Liberty on the left and Ceres on the right each represent one word: Liberty stands for freedom, and Ceres, the goddess of grain holding a cornucopia, represents prosperity. The three plows on the shield anchor both ideas to the land."
  - "The knight's helmet above the shield states that New Jersey governs itself. The Phrygian cap on Liberty's staff was a specific colonial symbol: patriots wore it to signal their opposition to British rule. Both symbols carry the political context of 1777, when the design was created in the middle of the Revolutionary War."

- id: facts
  icon: fa-solid fa-lightbulb
  title: New Jersey Coat of Arms Facts
  facts:
  - "Adopted in May 1777 at the Indian King Tavern in Haddonfield, New Jersey, where the state Legislature was meeting after British forces occupied northern New Jersey."
  - "Designed by Pierre Eugene du Simitière, a Swiss-born artist in Philadelphia who also created seal designs for several other early American states."
  - "Du Simitière added the knight's helmet to the design without being asked. The Legislature's brief did not include a helmet, but the Legislature kept it when they adopted the design."
  - "In 1928, Joint Resolution 8 standardized the design: Liberty and Ceres were turned to face forward, Ceres's cornucopia was corrected to stand upright, and the year 1776 was written in Arabic numerals for the first time."
  - "The buff color of New Jersey's flag, on which the coat of arms appears, traces to the facing cloth of New Jersey's Revolutionary War uniforms in 1779. The color was officially standardized by law in 1965."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the New Jersey Coat of Arms
  paragraphs:
  - "The coat of arms has existed in two distinct forms: the original 1777 design and the standardized 1928 version. The core elements (shield with three plows, helmet, horse's head, Liberty, and Ceres) have remained the same in both."
  versions:
  - name: Original Design
    years: 1777
    image: /images/coats-of-arms/new-jersey/versions/original-1777.jpg
    description: The original coat of arms adopted in May 1777 at the Indian King Tavern. Liberty held her staff in her left arm, both female figures faced away from the shield, Ceres's cornucopia was inverted, and the year appeared in Roman numerals at the base of the shield.
  - name: Standardized Design
    years: 1928-present
    image: /images/coats-of-arms/new-jersey/coat-of-arms.svg
    description: The version codified by Joint Resolution 8 in 1928. Liberty now holds her staff in her right hand, both figures face forward, Ceres's cornucopia stands upright, and the year 1776 appears in Arabic numerals. This is the standard design used in the article's main image and element crops.

faq:
- question: What does the New Jersey coat of arms show?
  answer: "The New Jersey coat of arms shows a blue shield with three gold plows. Above the shield is a knight's helmet, topped by a horse's head. Liberty stands on the left holding a staff with a Phrygian cap; Ceres stands on the right holding a cornucopia of fruit. A ribbon at the base reads 'Liberty and Prosperity' with the year 1776."
- question: When was the New Jersey coat of arms adopted?
  answer: "The New Jersey coat of arms was adopted in May 1777. The state Legislature was meeting at the Indian King Tavern in Haddonfield at the time, having relocated from northern New Jersey because of the British occupation. A second version was standardized by Joint Resolution 8 in 1928."
- question: Who designed the New Jersey coat of arms?
  answer: "Pierre Eugene du Simitière, a Swiss-born artist living in Philadelphia, designed the New Jersey coat of arms. He also worked on seal designs for other early American states. He added a knight's helmet to the design that the Legislature had not requested, and the Legislature kept it."
- question: What do the three plows mean on the New Jersey coat of arms?
  answer: "The three plows represent New Jersey's agricultural economy. They are the reason New Jersey is called the Garden State. The plows appear on a blue field and have been part of the design since 1777."
- question: Who are the two women on the New Jersey coat of arms?
  answer: "The two figures are Liberty and Ceres. Liberty stands on the left holding a staff topped with a Phrygian cap, a symbol of colonial rebellion. Ceres is the Roman goddess of grain; she stands on the right holding a cornucopia of fruit. Together they represent the state motto: 'Liberty and Prosperity.'"
- question: What changed in the 1928 modification?
  answer: "Joint Resolution 8 in 1928 made four changes: Liberty's staff was moved from her left arm to her right hand, both female figures were turned to face forward rather than away from the shield, Ceres's cornucopia was corrected to stand upright instead of inverted, and the year 1776 was written in Arabic numerals for the first time."
- question: What is the knight's helmet on the New Jersey coat of arms?
  answer: "The knight's helmet sits between the horse's head and the shield. In heraldry, a helmet above a shield indicates state sovereignty: the state governs itself. Du Simitière added it on his own initiative; the Legislature's original brief did not include it."

