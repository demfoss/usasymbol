faq:
  - question: What is New Jersey's state dance?
    answer: "New Jersey's official folk dance is square dance, adopted in 1983."
  - question: When did New Jersey adopt square dance as its state dance?
    answer: "New Jersey adopted square dance as its official folk dance in 1983."
  - question: Why did New Jersey choose square dance?
    answer: "New Jersey had an active statewide network of square-dance clubs meeting in grange halls and community centers, and national callers' associations were pressing states to give the dance official status."
  - question: Is square dance the same in every state?
    answer: "The core figures such as circling, do-si-do, and promenade are shared nationwide, but local clubs and callers develop their own regional calling style."

