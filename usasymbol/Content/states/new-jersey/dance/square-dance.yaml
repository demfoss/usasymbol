sections:
  - id: overview
    icon: fa-solid fa-music
    title: New Jersey State Dance
    paragraphs:
      - "New Jersey named square dance its official folk dance in 1983, among the earlier states to make the designation. The choice reflected a dance already supported by an active statewide network of community dance clubs and grange halls."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance groups four couples into a square, each pair facing the center, and a caller announces every figure just before it happens. Dancers follow the live call rather than a fixed routine, so figures can be combined in countless sequences."
      - "A string band of fiddle, banjo, and guitar traditionally carries the music, holding a steady tempo for all eight dancers. Figures move couples through circles, crossings, and turns before the square returns to its original arrangement."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples stand on the four sides of a square, partners beside each other, facing in."
      - title: "Circle Right as a Group"
        description: "All eight dancers join hands and move together around the square, reversing direction on cue."
      - title: "Do-Si-Do Your Partner"
        description: "Pass right shoulders with your partner, circle back to back, and return to your starting spot."
      - title: "Allemande Left with Your Corner"
        description: "Take the hand of the dancer on your left, the corner, and turn around each other before releasing."
      - title: "Promenade Back to Place"
        description: "Take your partner's hands and walk together around the outside of the square to your home position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents New Jersey
    paragraphs:
      - "New Jersey supported a large number of local square-dance clubs by the early 1980s, many meeting weekly in grange halls and community centers across the state's suburbs and rural pockets. That club network gave the dance a genuine, ongoing presence rather than a symbolic gesture."
      - "New Jersey's 1983 designation also came during the national campaign, active from the 1970s through the 1990s, in which square-dance callers' associations and dance organizations pushed state legislatures to adopt square dance as an official folk dance. New Jersey acted earlier than many other states in that same movement."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: When New Jersey Adopted Square Dance
    paragraphs:
      - "New Jersey designated square dance its official folk dance in 1983, one of the earlier states to act during the national square-dance callers' campaign of that period."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "New Jersey adopted square dance as its official folk dance in 1983."
      - "New Jersey was among the earlier states to make the designation during the national campaign of the 1970s through 1990s."
      - "New Jersey's grange halls and community centers have long hosted regular square-dance club meetings."
      - "A caller announces every figure live, so no two square dances follow an identical sequence."
      - "Square dance music is traditionally played by a string band of fiddle, banjo, and guitar."

