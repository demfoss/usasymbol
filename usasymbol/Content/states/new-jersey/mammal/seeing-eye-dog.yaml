sections:
  - id: "official-designation"
    icon: "fa-certificate"
    title: "Official Designation"
    paragraphs:
      - "The New Jersey Legislature designated the Seeing Eye Dog as the official state dog on January 21, 2020. Governor Phil Murphy signed Senate Bill 2818 into law after years of advocacy from disability rights organizations and supporters of The Seeing Eye, adding a modern chapter to [the Garden State nickname story](/states/new-jersey/nickname/the-garden-state)."
      - "New Jersey became the first state to designate a service dog rather than a specific breed as its state dog. The designation recognizes The Seeing Eye's work training guide dogs and New Jersey's leadership in disability rights, aligned with the values in [New Jersey's motto, Liberty and Prosperity](/states/new-jersey/motto/liberty-and-prosperity)."

    subsections:
      - subtitle: "How It Became the State Symbol"
        text: "State Senator Joseph Pennacchio of Morris County sponsored Senate Bill 2818 in 2018. The bill highlighted The Seeing Eye's 90-year history in Morris Township and its impact on blind and visually impaired individuals nationwide. Pennacchio noted that The Seeing Eye had trained over 17,000 guide dogs since 1929, making it the oldest guide dog school in the Western Hemisphere. The bill passed both legislative chambers with unanimous support. Governor Murphy signed the legislation at The Seeing Eye headquarters in January 2020, surrounded by current students and their guide dogs, while the state-level context appears on [the New Jersey state flag page](/states/new-jersey/flag/new-jersey-state-flag)."

      - subtitle: "Why New Jersey Chose the Seeing Eye Dog"
        text: "New Jersey lawmakers chose the Seeing Eye Dog because The Seeing Eye organization is headquartered in Morris Township and represents American innovation in assistive technology. Dorothy Harrison Eustis and Morris Frank founded The Seeing Eye in 1929 after witnessing guide dog training programs in Switzerland. They brought the concept to the United States and established the first American guide dog school in New Jersey. The organization chose New Jersey for its proximity to major cities, accessible transportation, and supportive community. The state's designation honors both The Seeing Eye's work and New Jersey's commitment to disability rights and independence for all residents."

  - id: "state-symbolism"
    icon: "fa-star"
    title: "What the Seeing Eye Dog Represents"
    style: "highlight"
    paragraphs:
      - "The Seeing Eye Dog represents independence and dignity for blind and visually impaired individuals. Guide dogs provide mobility, confidence, and freedom that transform daily life. The symbol recognizes that technology can take many forms—including the trained partnership between human and dog."
      - "For New Jersey, the Seeing Eye Dog symbolizes the state's role in advancing disability rights. The Seeing Eye pioneered guide dog training in America and fought legal battles that established public access rights for working service dogs. These victories changed American law and culture."
      - "The symbol represents partnership and trust. A guide dog and handler work as a team, each depending on the other. This relationship reflects values New Jersey residents hold as essential—mutual respect, hard work, and the power of collaboration to overcome obstacles, much like the civic effort behind [New Jersey's state horse designation](/states/new-jersey/mammal/horse)."

    subsections:
      - subtitle: "Morris Frank and the First Seeing Eye Dog"
        text: "Morris Frank lost his sight at age sixteen in separate accidents that damaged both eyes. In 1927, Frank read an article by Dorothy Harrison Eustis describing guide dog training programs in Switzerland. Frank wrote to Eustis asking if she would train a dog for him. Eustis agreed, and Frank traveled to Switzerland in 1928. There he received Buddy, a female German Shepherd who became the first Seeing Eye Dog. Frank and Buddy returned to the United States and demonstrated guide dog capabilities to skeptical Americans. Their partnership convinced Eustis to establish The Seeing Eye in the United States in 1929."

      - subtitle: "The Seeing Eye Arrives in New Jersey"
        text: "Dorothy Harrison Eustis and Morris Frank founded The Seeing Eye in Nashville, Tennessee, in 1929. The organization relocated to New Jersey in 1931, first to Whippany and then permanently to Morristown in 1965. New Jersey offered better access to population centers and more diverse training environments than Nashville. The move proved successful—The Seeing Eye trained thousands of guide dogs in New Jersey and established the standards that other guide dog schools worldwide still follow. The organization has remained headquartered in Morris Township for over 90 years."

      - subtitle: "Breaking Down Barriers"
        text: "Early Seeing Eye Dogs faced widespread discrimination. Restaurants, hotels, buses, and trains often refused Morris Frank and other blind travelers with guide dogs. Frank spent years fighting these restrictions through legal challenges and public demonstrations. His efforts led to New Jersey passing one of America's first laws guaranteeing public access for guide dogs in 1934. Other states followed New Jersey's example. Today, federal law protects the rights of service dog handlers nationwide, but New Jersey led this movement in the 1930s."

      - subtitle: "The Breeding and Training Program"
        text: "The Seeing Eye maintains a selective breeding program that produces dogs with the temperament and intelligence required for guide work. The organization breeds primarily Labrador Retrievers, Golden Retrievers, and German Shepherds, plus crosses between these breeds. Puppies live with volunteer families for their first year, learning basic obedience and socialization. At 18 months, dogs return to The Seeing Eye campus for formal training. Professional instructors teach dogs to navigate obstacles, stop at curbs, refuse dangerous commands, and judge heights and widths. The training takes four to five months."

      - subtitle: "More Than Mobility"
        text: "Seeing Eye Dogs provide benefits beyond navigation. Studies show that guide dog handlers report increased social interaction, improved mental health, and greater community participation compared to blind individuals who use canes or electronic mobility aids. The dogs serve as social bridges—strangers who might ignore a blind person with a cane often approach to ask about the dog, creating connections. These interactions matter. The Seeing Eye Dog symbol represents not just independence but also belonging and social participation."

  - id: "identification"
    icon: "fa-search"
    title: "How to Identify a Seeing Eye Dog"

    subsections:
      - subtitle: "Physical Description"
        text: "Seeing Eye Dogs are not a single breed but rather dogs from several breeds trained for guide work. The Seeing Eye primarily trains Labrador Retrievers, Golden Retrievers, German Shepherds, and crosses between these breeds. All Seeing Eye Dogs wear distinctive white harnesses when working. The harness is the legal indicator that the dog is performing guide work and should not be distracted."
        list_items:
          - "**Breeds used**: Labrador Retrievers, Golden Retrievers, German Shepherds, and Lab-Golden crosses"
          - "**Size**: Medium to large dogs; 21–26 inches tall at shoulder; 50–80 pounds"
          - "**Working equipment**: White U-shaped harness with rigid handle; handler holds handle to feel dog's movements"
          - "**Identification**: The Seeing Eye Dogs wear tags and harnesses identifying them as working guide dogs"
          - "**Distinguishing behavior**: Calm demeanor, focused attention on handler, ignores distractions, stops at curbs and stairs, navigates around obstacles"

      - subtitle: "Behavior and Training"
        text: "Seeing Eye Dogs demonstrate exceptional focus and judgment. The dogs must obey commands when appropriate but also practice 'intelligent disobedience'—refusing commands that would place the handler in danger. For example, if a handler commands 'forward' at a curb but a car is approaching, the dog must refuse and wait until it is safe to cross. This balance between obedience and independent judgment requires months of training. Working guide dogs remain calm in crowded, noisy environments and ignore food, other animals, and strangers who attempt to pet them while they are in harness."

  - id: "in-the-state"
    icon: "fa-map-marker"
    title: "Seeing Eye Dogs in New Jersey"

    paragraphs:
      - "The Seeing Eye headquarters occupies a 12-acre campus in Morris Township. The facility includes breeding kennels, puppy-raising program coordination, training facilities, student housing, and administrative offices. The organization trains approximately 250 guide dogs annually."
      - "Hundreds of Seeing Eye Dog alumni live throughout New Jersey. The state has one of the highest concentrations of guide dog teams in the country due to The Seeing Eye's presence and New Jersey's population density."

    facts:
      - "**Morris Township campus**: 12-acre facility housing breeding program, training center, and student residence halls"
      - "**Annual training**: Approximately 250 guide dogs trained each year"
      - "**Alumni in state**: Hundreds of Seeing Eye Dog teams live and work across New Jersey"
      - "**Economic impact**: The Seeing Eye employs over 200 staff members and brings students from across the country to New Jersey for training"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to Learn About New Jersey's State Dog"

    paragraphs:
      - "The Seeing Eye welcomes visitors to its Morristown campus through scheduled tours and public events. The organization also maintains working Seeing Eye Dog teams throughout New Jersey communities, though people should never distract working guide dogs."

    list_items:
      - "**The Seeing Eye Headquarters, Morris Township**: Offers guided tours by appointment; visitors learn about breeding, puppy raising, training, and matching dogs with blind handlers; gift shop features Seeing Eye merchandise"
      - "**Public education events**: The Seeing Eye hosts open houses and community events where attendees can meet trainers, see demonstrations, and learn about guide dog etiquette"
      - "**Morris County tourism**: Several historical markers in Morristown area note The Seeing Eye's role in the community"
      - "**Working teams throughout New Jersey**: Seeing Eye Dogs work in communities statewide; observers should never pet, feed, or distract working guide dogs wearing harnesses"
      - "**New Jersey State Museum, Trenton**: Occasional exhibits on New Jersey contributions to disability rights and assistive technology"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Current Status and Impact"

    paragraphs:
      - "The Seeing Eye remains the premier guide dog training organization in the United States. Since 1929, the organization has trained over 17,000 guide dogs and placed them with blind and visually impaired individuals from all 50 states and Canada, against a national growth backdrop reflected in [U.S. states by population](/rankings/demographics/states-by-population)."
      - "The Seeing Eye operates on a unique financial model. Students pay only $150 for their first guide dog and $50 for subsequent dogs. This nominal fee covers a dog worth approximately $50,000 in breeding, raising, training, and placement costs. Donations and endowment income fund the difference, ensuring that financial barriers never prevent blind individuals from receiving guide dogs."

    subsections:
      - subtitle: "The Seeing Eye's Continuing Mission"
        text: "The Seeing Eye continues training approximately 250 guide dogs annually. The organization provides lifetime support for every graduate—if a dog becomes ill, injured, or unable to work, The Seeing Eye covers veterinary costs and provides a replacement dog at no charge. Students return to Morristown for subsequent dog training throughout their lives. This commitment to lifetime service distinguishes The Seeing Eye from many other assistance dog organizations. The Seeing Eye also conducts research on guide dog breeding, training methods, and handler outcomes."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"

    paragraphs:
      - "The Seeing Eye Dog connects to New Jersey's identity as a state of innovation and industry. Just as New Jersey pioneered developments in transportation, telecommunications, and medicine, The Seeing Eye pioneered guide dog training in America. The symbol represents applied innovation—technology designed to solve real human problems and improve quality of life."

    subsections:
      - subtitle: "The Eastern Goldfinch and Statewide Presence"
        text: "New Jersey designated the eastern goldfinch as its state bird in 1935. Both the goldfinch and the Seeing Eye Dog represent species that thrive in New Jersey's diverse environments. Eastern goldfinches nest in fields, gardens, and parks across the state. Seeing Eye Dogs train on Morristown streets, suburban shopping centers, and urban transit systems. Both symbols adapt to the developed landscape that characterizes modern New Jersey. The goldfinch brings color to ordinary spaces, while the Seeing Eye Dog brings independence to ordinary people facing extraordinary challenges."
        link:
          label: "See New Jersey state bird"
          url: "/states/new-jersey/bird/american-goldfinch"

      - subtitle: "The Horse and Working Animals"
        text: "New Jersey designated the horse as its state animal in 1977, recognizing the horse's role in agriculture, transportation, and recreation. Both the horse and the Seeing Eye Dog represent working animals that partner with humans. Horses pulled plows and carriages that built New Jersey's economy. Seeing Eye Dogs guide blind residents through modern New Jersey's communities. Both symbols honor the bond between humans and animals—a partnership based on training, trust, and mutual dependence."
        link:
          label: "See New Jersey state animal"
          url: "/states/new-jersey/mammal/horse"

      - subtitle: "Liberty and Prosperity"
        text: "New Jersey's state motto, 'Liberty and Prosperity,' appears on the state seal and reflects the state's founding principles. The Seeing Eye Dog fulfills both concepts in practice. Liberty means independence—the freedom to move through the world without depending on others for basic mobility. Prosperity means more than wealth; it means the ability to participate fully in economic and social life. Seeing Eye Dogs provide both liberty and prosperity to blind individuals who might otherwise face restricted opportunities. The symbol captures New Jersey's commitment to ensuring all residents can pursue independent, prosperous lives."
        link:
          label: "See New Jersey state motto"
          url: "/states/new-jersey/motto/liberty-and-prosperity"

      - subtitle: "The Red Oak and New Jersey Landscapes"
        text: "New Jersey designated the northern red oak as its state tree in 1950. Red oaks grow throughout New Jersey's diverse landscapes from Appalachian ridges to coastal plains. Seeing Eye Dogs train in these same varied environments. The dogs must navigate Morris County suburbs, Jersey City streets, Atlantic City boardwalks, and rural roads in the Pine Barrens. This adaptability mirrors the red oak's range across the state. Both symbols represent New Jersey's diversity and the importance of functioning successfully in multiple environments."
        link:
          label: "See New Jersey state tree"
          url: "/states/new-jersey/tree/northern-red-oak"

