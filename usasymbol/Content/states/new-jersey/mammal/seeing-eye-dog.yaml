faq:
  - question: "What is New Jersey's state dog?"
    answer: "New Jersey's state dog is the Seeing Eye Dog, designated by the state legislature in 2020. This designation honors The Seeing Eye organization in Morris Township, which has trained guide dogs for blind and visually impaired individuals since 1929. New Jersey is the first state to designate a service dog rather than a specific breed."

  - question: "Why did New Jersey choose the Seeing Eye Dog as the state dog?"
    answer: "New Jersey chose the Seeing Eye Dog because The Seeing Eye headquarters is located in Morris Township and represents American innovation in assistive technology. The organization was founded in 1929 and pioneered guide dog training in the United States. The symbol recognizes New Jersey's leadership in disability rights and The Seeing Eye's impact on thousands of blind individuals nationwide."

  - question: "When was the Seeing Eye Dog designated as New Jersey's state dog?"
    answer: "The Seeing Eye Dog was designated as New Jersey's official state dog on January 21, 2020, when Governor Phil Murphy signed Senate Bill 2818 into law at The Seeing Eye headquarters in Morris Township."

  - question: "What breeds are trained as Seeing Eye Dogs?"
    answer: "The Seeing Eye primarily trains Labrador Retrievers, Golden Retrievers, German Shepherds, and crosses between Labs and Goldens. These breeds are selected for their intelligence, temperament, size, and trainability. The organization maintains a selective breeding program to produce dogs suitable for guide work."

  - question: "How many Seeing Eye Dogs have been trained?"
    answer: "The Seeing Eye has trained over 17,000 guide dogs since 1929. The organization currently trains approximately 250 guide dogs each year and places them with blind and visually impaired individuals from all 50 states and Canada."

  - question: "Who was Morris Frank?"
    answer: "Morris Frank was a blind Nashville resident who became the first American to train with a guide dog. In 1928, he traveled to Switzerland and received Buddy, a German Shepherd trained by Dorothy Harrison Eustis. Frank and Buddy returned to the United States and demonstrated guide dog capabilities to skeptical Americans. Frank co-founded The Seeing Eye with Eustis in 1929 and spent his life advocating for public access rights for guide dog handlers."

  - question: "Can I visit The Seeing Eye in New Jersey?"
    answer: "Yes. The Seeing Eye headquarters in Morris Township offers guided tours by appointment. Visitors learn about the breeding program, puppy raising, training process, and how dogs are matched with blind handlers. The organization also hosts public education events and open houses throughout the year. Check The Seeing Eye's website for current tour schedules and registration information."

  - question: "How much does a Seeing Eye Dog cost?"
    answer: "Students pay only $150 for their first Seeing Eye Dog and $50 for subsequent dogs. This nominal fee covers a dog worth approximately $50,000 in breeding, raising, training, and placement costs. The Seeing Eye relies on donations and endowment income to cover the difference, ensuring that financial barriers never prevent blind individuals from receiving guide dogs."

  - question: "What should I do if I see a working Seeing Eye Dog?"
    answer: "Never pet, feed, or distract a working guide dog wearing a harness. The dog is performing an important job and needs to focus on keeping its handler safe. If the handler needs assistance, they will ask. You can admire the dog from a distance, but do not call to it, make noises, or attempt to interact with it while it is working."

