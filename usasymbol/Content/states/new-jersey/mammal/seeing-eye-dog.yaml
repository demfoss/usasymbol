title: "Seeing Eye Dog"
scientific_name: "Canis lupus familiaris"
adopted_year: 2020

seo_title: "New Jersey State Dog - Seeing Eye Dog | Official Symbol"
seo_description: "New Jersey designated the Seeing Eye Dog as state dog in 2020. The Seeing Eye in Morristown pioneered guide dog training in America starting in 1929."

intro_text: "New Jersey's state dog is the Seeing Eye Dog, designated in 2020. The symbol honors The Seeing Eye organization in Morristown, which pioneered guide dog training in the United States starting in 1929. Seeing Eye Dogs represent service, independence, and New Jersey's leadership in assistive technology and disability rights, and they are featured in the [list of U.S. state dogs](/symbols/dogs)."

