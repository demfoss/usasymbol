seo_title: "New Jersey State Animal | Horse"
seo_description: "New Jersey's state animal is the Horse, adopted in 1977. Learn why this official New Jersey symbol was chosen and what it represents."

intro_text: "The Horse is the official New Jersey state animal, designated in 1977. This page gives the direct answer for searches like 'new jersey state animal', 'new jersey state animal', and 'new jersey state mammal' while explaining how the symbol fits the state's official animal designations. Thoroughbred and Standardbred racing (Haskell Invitational, Hambletonian Stakes), agricultural land preservation, state seal symbolism since 1777, student-driven designation."

common_name: "Horse"
official_since: "1977 (signed August 14 by Governor Brendan Byrne)"
status: "Thriving industry with approximately 42,500 horses statewide; generates $1.1 billion annually and provides 13,000 jobs; preserves 222,000 acres of agricultural land in America's most densely populated state"
habitat_in_state: "Horse farms, breeding facilities, training centers, racetracks, equestrian centers, therapeutic riding facilities, private stables across all 21 counties; highest concentrations in Monmouth County and northwest New Jersey"
known_for: "Thoroughbred and Standardbred racing (Haskell Invitational, Hambletonian Stakes), agricultural land preservation, state seal symbolism since 1777, student-driven designation"

size: "Varies by breed: Thoroughbreds 15-17 hands (60-68 inches) tall at shoulder; Standardbreds 14-16 hands (56-64 inches); draft horses up to 18+ hands (72+ inches)"
weight: "Varies by breed: Light horses (Thoroughbred, Standardbred) 900-1,200 pounds; draft horses (Percheron, Belgian) 1,400-2,000+ pounds"
coloration: "Highly variable by breed: bay, chestnut, black, gray, white, palomino, pinto, appaloosa patterns; coat color determined by complex genetics"
distinctive_traits: "Single-toed hooves (evolved from multi-toed ancestors), long flowing mane and tail, herbivorous diet, herd social structure, exceptional speed (up to 55 mph for Thoroughbreds), excellent memory and intelligence"

habitat: "Domesticated species living in human-managed facilities: pastures, paddocks, barns, training facilities; requires grazing land, shelter, veterinary care"
range_in_state: "All 21 New Jersey counties; highest concentrations in Monmouth County (historic racing center), Hunterdon County, Somerset County, Warren County, Sussex County (northwest farmland)"
conservation_status: "Domesticated species not requiring conservation; New Jersey horse population stable at ~42,500; racing industry challenges from competition with neighboring state casinos, but overall equine industry robust including recreational riding, therapeutic programs, breeding"
where_to_find: "Monmouth Park Racetrack (Oceanport), Meadowlands Racetrack (East Rutherford), Freehold Raceway, Horse Park of New Jersey (Allentown), Hamilton Farm/US Equestrian Team Foundation (Gladstone), Brookdale Farm historic site (Lincroft), countless private farms and riding facilities statewide"
symbol_connections: "Featured on state seal since 1777 (horse head crest representing speed and strength); connects to state motto 'Liberty and Prosperity' through agricultural economy; violet (state flower) and eastern goldfinch (state bird) share pastoral landscapes"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    paragraphs:
      - "The New Jersey Legislature designated the horse as the official state animal in 1977 through Senate Bill 1784, signed by Governor Brendan T. Byrne on August 14, 1977, at the Sussex County Fair. The designation resulted from advocacy by fifth-grader Michael McCarthy and his classmates at Our Lady of Victories School in Harrington Park, along with eighth-grader James Sweetman from Freehold. These students researched horses' historical and contemporary importance to New Jersey, presented their findings to legislators, and testified at hearings advocating for the designation, expanding the identity behind [the Garden State nickname](/states/new-jersey/nickname/the-garden-state)."
      - "The designation carried special significance because 1977 marked exactly 200 years since Pierre Eugene du Simitiere designed New Jersey's state seal in 1777, featuring a horse's head as the crest above a knight's helmet. Governor Byrne noted this connection at the signing ceremony, stating that the founding fathers valued horses so highly they included one in the state seal. The Trenton Evening Times captured the moment with the headline 'Horse is official N.J. animal; passes Assembly with 1 "neigh'—a playful reference to the single dissenting vote. Assemblywoman Jane Burgio, who preferred the collie, told the students "If I had a lobbyist like you, I think my bill would have done better,' and that seal context is visible on [the New Jersey state flag](/states/new-jersey/flag/new-jersey-state-flag)."

    subsections:
      - subtitle: "Student Advocacy Prevails"
        text: "Michael McCarthy's fifth-grade class at Our Lady of Victories School in Harrington Park and James Sweetman, an eighth-grader from Freehold, conducted extensive research demonstrating why horses deserved recognition as New Jersey's state animal. They documented that New Jersey had 4,654 horse farms in 1977 (including 888 raising racing horses), representing a population increase from 18,000 horses in 1961 to over 38,000 by 1977. Students emphasized horses' contributions to agriculture, economic development through racing and breeding, and preservation of open space in an increasingly urbanized state. Their presentation to legislators included historical context about horses' role in Revolutionary War-era New Jersey and contemporary economic data about the racing industry."

      - subtitle: "200-Year Anniversary Connection"
        text: "The 1977 designation coincided precisely with the 200th anniversary of New Jersey's state seal, which Pierre Eugene du Simitiere designed in 1777 at the request of signer Francis Hopkinson. The seal's horse head crest symbolizes speed, strength, and progress—qualities the Provincial Congress valued as New Jersey transitioned from colony to independent state during the American Revolution. This was no coincidence; Governor Byrne and legislators recognized that officially designating the horse as state animal in 1977 honored both the founding generation's vision and the contemporary horse industry's contributions to New Jersey's economy and landscape preservation."

  - id: "state-symbolism"
    icon: "fa-certificate"
    title: "What the Horse Represents"
    style: "highlight"
    paragraphs:
      - "The horse represents New Jersey's agricultural identity as the Garden State, an identity under constant pressure from urbanization and suburban development. New Jersey is America's most densely populated state, yet maintains approximately 222,000 acres of agricultural land due to horse farms, breeding facilities, training centers, hay fields, and pastures. Without the equine industry, this farmland would likely have been converted to housing developments, shopping centers, and industrial parks. Horses thus preserve the rural character and green open space that make New Jersey livable despite its density."
      - "The designation symbolizes New Jersey's agricultural heritage stretching back to colonial times. When the Provincial Congress designed the state seal in 1777, horses provided essential power for plowing, transportation of crops to market, travel between communities, and military operations during the Revolutionary War. The seal features three plows on a shield with Liberty and Ceres (Roman goddess of agriculture) as supporters, emphasizing New Jersey's identity as an agricultural breadbasket. The horse head crest crowning the helmet represented the motive power enabling this agricultural productivity—without horses, farmers could not plow fields, haul harvests, or transport goods, aligning with [New Jersey's motto](/states/new-jersey/motto/liberty-and-prosperity)."
      - "Today's horse represents economic vitality and recreational opportunity rather than agricultural labor. New Jersey's equine industry generates approximately $1.1 billion annually and provides about 13,000 jobs for caretakers, trainers, veterinarians, farriers, breeding facility staff, track employees, and related professionals. The state hosts prestigious racing events including the Haskell Invitational (attracting top three-year-old Thoroughbreds) at Monmouth Park and the Hambletonian Stakes (the 'Kentucky Derby of Standardbred harness racing') at Meadowlands Racetrack. Hamilton Farm in Gladstone serves as headquarters for the United States Equestrian Team Foundation, hosting national championships and Olympic qualifier events, while broader growth context is reflected in [U.S. states by population](/rankings/demographics/states-by-population)."

    subsections:
      - subtitle: "State Seal Symbolism Since 1777"
        text: "New Jersey's state seal, adopted March 25, 1777, places a horse's head as the crest above a forward-facing knight's helmet, representing sovereignty of a self-governing state. Below the helmet, a blue shield displays three golden plows honoring agricultural tradition. Liberty (holding a staff with liberty cap) and Ceres (holding a cornucopia) flank the shield, with the motto 'Liberty and Prosperity' and the date 1776 on a banner. The horse head symbolizes speed and strength—qualities New Jersey valued as it fought for independence. Pierre Eugene du Simitiere, a Swiss artist who also contributed to designs for other state seals and currency, created this enduring emblem that remains largely unchanged since 1777, with only minor modifications in 1928 to standardize artistic details."

      - subtitle: "Agricultural Land Preservation"
        text: "New Jersey's horse industry preserves approximately 222,000 acres—nearly one-quarter of the state's remaining agricultural land—through breeding facilities, training centers, hay fields, pastures, and equestrian centers. This land preservation proves especially vital in America's most densely populated state, where development pressure constantly threatens open space. Horse farms provide environmental benefits including groundwater recharge, air quality improvement, wildlife habitat, and scenic beauty that enhance quality of life for all residents. The economic value of horses makes farming financially viable, enabling property owners to resist selling land to developers. Without the equine industry's economic engine, much of this acreage would have been converted to residential or commercial development."

      - subtitle: "Economic Engine and Employment"
        text: "New Jersey's equine industry generates approximately $1.1 billion in economic activity annually and provides about 13,000 jobs across various sectors: horse breeding and training, veterinary medicine, farrier services (blacksmiths), hay and feed production, track operations, racing officials, exercise riders, grooms, maintenance staff, and agricultural support services. The industry creates demand for supplies, equipment, veterinary pharmaceuticals, and specialized services supporting rural economies throughout the state. Racetracks generate millions in wagering handle, purses, and associated hospitality spending. This economic impact justified the 1977 designation and continues validating the horse's status as state animal today."

  - id: "identification"
    icon: "fa-magnifying-glass"
    title: "About Horses"

    subsections:
      - subtitle: "Domestication and Evolution"
        text: "The domestic horse (Equus caballus) evolved over 45-55 million years from Eohippus, a small multi-toed forest-dwelling creature the size of a dog, into the large single-toed grazing animal we know today. Domestication occurred approximately 6,000 years ago on the steppes of Central Asia. Humans selectively bred horses for various purposes: strength for farm work, speed for racing, agility for riding, and temperament for training. This selective breeding produced hundreds of distinct breeds, each specialized for specific tasks. Modern horses remain fundamentally the same species despite breed diversity—all horses can interbreed and produce fertile offspring."
        list_items:
          - "**Evolution**: Descended from Eohippus (~55 million years ago); gradually increased in size, developed single hoof from multiple toes, adapted from browsing forest plants to grazing grasslands"
          - "**Domestication**: Approximately 4000 BCE in Kazakhstan region; transformed human civilization enabling agriculture, transportation, warfare, and communication"
          - "**Breeds**: Over 300 recognized breeds worldwide including Thoroughbred (racing), Standardbred (harness racing), Quarter Horse (ranch work), Arabian (endurance), draft breeds (farm power)"
          - "**Intelligence**: Exceptional memory, social intelligence, ability to learn complex tasks; form strong bonds with handlers; recognize human facial expressions and emotions"

      - subtitle: "Physical Characteristics"
        text: "Horses are large herbivorous mammals characterized by a single hoof on each foot, long neck, flowing mane and tail, and powerful muscular build. Size varies dramatically by breed—light riding horses like Thoroughbreds stand 60-68 inches tall at the shoulder (measured in 'hands,' each hand equaling four inches), while massive draft breeds like Percherons and Belgians exceed 72 inches. Coat colors include bay (brown body with black mane/tail/legs), chestnut (reddish-brown), black, gray, white, palomino (golden with white mane/tail), and pattern variations including pinto (large patches) and appaloosa (spots on hindquarters). Horses are prey animals with eyes positioned on sides of head providing nearly 360-degree vision to detect predators."

      - subtitle: "Behavior and Care"
        text: "Horses are herd animals with complex social structures, communicating through vocalizations (neighing, nickering, snorting), body language (ear position, tail swishing), and physical interactions. They form strong hierarchies within herds but also develop deep bonds with humans through training and daily interaction. As herbivores, horses graze constantly when food is available, consuming 15-25 pounds of hay and grain daily for an average-sized riding horse. Proper care requires veterinary attention (vaccinations, dental floating, deworming), farrier services (hoof trimming and shoeing every 6-8 weeks), daily grooming, regular exercise, and shelter from extreme weather. Well-cared-for horses typically live 25-30 years, with some exceeding 40 years."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "Horses in New Jersey"
    paragraphs:
      - "New Jersey is home to approximately 42,500 horses distributed across all 21 counties, with the highest concentrations in Monmouth County (historic center of Thoroughbred racing and breeding), Hunterdon County, Somerset County, Warren County, and Sussex County in the northwest. The state supports diverse equine operations including Thoroughbred racing and breeding farms, Standardbred harness racing facilities, recreational riding stables, therapeutic riding centers serving people with disabilities, competitive show jumping and dressage facilities, and pony farms for children's programs. This diversity reflects horses' versatility and broad appeal across demographics."
      - "New Jersey's horse industry has evolved significantly since the 1977 designation. The 1977 legislation noted 4,654 horse farms (including 888 raising racing horses) and 38,000 horses statewide—figures representing dramatic growth from 18,000 horses in 1961. Today's population of approximately 42,500 horses reflects continued expansion despite challenges including high land costs, competition from neighboring states offering casino-subsidized racing purses, and conversion of farmland to development. The industry persists due to New Jersey's proximity to major population centers (New York City, Philadelphia), strong equestrian tradition, historic racing venues, and dedicated community of horsemen and women maintaining agricultural heritage."

    facts:
      - "**Population**: Approximately 42,500 horses statewide across all 21 counties; highest concentrations in Monmouth, Hunterdon, Somerset, Warren, and Sussex counties"
      - "**Economic Impact**: Generates $1.1 billion annually; provides approximately 13,000 jobs in breeding, training, veterinary care, farrier services, racing operations, and support industries"
      - "**Land Preservation**: Maintains 222,000 acres of agricultural land (approximately 25% of state's remaining farmland) through pastures, hay fields, breeding facilities, training centers"
      - "**Racing Industry**: Three major racetracks (Monmouth Park, Meadowlands, Freehold Raceway); hosts Haskell Invitational and Hambletonian Stakes attracting international attention"
      - "**Historic Facilities**: Hamilton Farm (US Equestrian Team headquarters), Brookdale Farm (19th-century stud farm), Horse Park of New Jersey, numerous century-old breeding operations"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Horses"
    paragraphs:
      - "New Jersey offers numerous opportunities to observe horses in various settings, from world-class racing venues to working farms and historic sites. The state's equestrian facilities welcome visitors year-round, with racing seasons providing exciting spectator experiences and educational opportunities to learn about horse breeding, training, and care."

    list_items:
      - "**Monmouth Park Racetrack** (Oceanport): Historic Thoroughbred racing venue operating May-September; hosts Haskell Invitational (Grade 1 stakes race attracting top three-year-olds); free parking and admission most days; paddock area allows close viewing of horses before races; opened 1946 after 53-year hiatus"
      - "**Meadowlands Racetrack** (East Rutherford): Year-round harness racing facility; hosts Hambletonian Stakes (first leg of Trotting Triple Crown) first Saturday in August; occasional Thoroughbred racing select weekends; visitors can watch qualifying races mornings; opened 1976"
      - "**Freehold Raceway** (Freehold): Oldest continuously operating racetrack in United States (since 1853); fastest daytime half-mile harness racing track in country; intimate venue with excellent sight lines; afternoon racing allows viewing before dinner"
      - "**Hamilton Farm/US Equestrian Team Foundation** (Gladstone): Headquarters of US Equestrian Team; hosts national championships, Olympic qualifier events, clinics; visitors welcome during competitions; beautiful historic facility with championship-level riders and horses"
      - "**Horse Park of New Jersey** (Allentown): Multi-discipline equestrian facility hosting Jersey Fresh International 3-Day Event (Olympic qualifier for eventing); combined training, horse shows, clinics throughout year; spectator-friendly venue with food vendors during major events"
      - "**Brookdale Farm Historic Racing Stable** (Lincroft): Monmouth County Park System property preserving 19th-century Thoroughbred breeding history; 40-stall stable restored 2024 with exhibitions about racing heritage; free admission; guided tours available; established 1870s by David Dunham Withers"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Industry Status and Challenges"
    paragraphs:
      - "New Jersey's horse industry remains economically significant but faces challenges unknown in 1977 when the designation occurred. Neighboring states Pennsylvania and New York operate casino gaming at racetracks, generating revenue supplementing racing purses and attracting horses, trainers, and owners away from New Jersey. New Jersey voters rejected referendums expanding gaming to racetracks, creating competitive disadvantage. Some historic facilities including Showplace Farms (Millstone) closed after 36 years in 2015, citing poor economic climate for harness racing. Racing attendance and wagering have declined from historical peaks, though major events like the Haskell Invitational still draw substantial crowds."
      - "Despite racing industry challenges, New Jersey's broader equine industry thrives through diversification. Recreational riding, therapeutic riding programs serving people with disabilities, competitive show jumping and dressage, breeding operations supplying national markets, and equestrian tourism generate stable income independent of racing's fluctuations. The industry's land preservation role becomes increasingly valuable as development pressure intensifies—222,000 acres of horse-related agricultural land provide environmental benefits, wildlife habitat, groundwater recharge, and scenic beauty that would disappear if converted to residential or commercial use. Policymakers recognize horses' multifaceted contributions to economy, environment, and quality of life."

    subsections:
      - subtitle: "Racing Industry Challenges"
        text: "New Jersey's racing industry experienced significant decline since peak years in the 1970s-1980s when the state actively promoted horse racing. The state's exit from direct racing involvement, combined with casino-subsidized purses in Pennsylvania and New York, created competitive disadvantages. Thoroughbred and Standardbred owners increasingly stable and race horses in neighboring states offering larger purses funded by slot machine revenue at racetracks. Freehold Raceway, Meadowlands, and Monmouth Park all face financial pressures despite hosting historic races. Industry advocates continue pressing for expanded gaming at tracks to level the competitive playing field and generate revenue supporting breeders, trainers, and support services."

      - subtitle: "Broader Equine Industry Success"
        text: "While racing faces challenges, New Jersey's overall equine industry remains robust through diversification beyond racing. Recreational riding facilities serve thousands of New Jersey residents learning horsemanship, participating in trail riding, and competing in various disciplines. Therapeutic riding programs use horses to provide physical, occupational, and speech therapy for people with disabilities, autism, PTSD, and other conditions. Competitive show jumping, dressage, eventing, and hunter/jumper competitions attract participants from across the region. Breeding operations produce horses sold nationally and internationally. This diversity creates industry resilience—not dependent on racing alone, the equine sector adapts to changing economic conditions while maintaining its land preservation and economic contributions."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connection to New Jersey Symbols"
    paragraphs:
      - "The horse connects intimately to New Jersey's other state symbols through shared agricultural heritage and landscape. The violet (state flower since 1971) grows wild in pastures and meadows where horses graze, thriving in the same open fields and edges that characterize horse country. The eastern goldfinch (state bird since 1935) frequents horse farms feeding on seeds from grasses and wildflowers growing in pastures and along fence lines. The red oak (state tree since 1950) provides shade for horses in summer paddocks and features prominently in New Jersey's farmland landscape; compare [the Northern Red Oak page](/states/new-jersey/tree/northern-red-oak)."

    subsections:
      - subtitle: "State Seal: 200-Year Connection"
        text: "The horse's most profound connection is to New Jersey's state seal, adopted 1777—exactly 200 years before the horse's official designation as state animal. Pierre Eugene du Simitiere designed the seal featuring a horse head crest above a forward-facing knight's helmet, representing speed, strength, and sovereignty of a self-governing state. The seal's three plows symbolize agriculture, while goddesses Liberty and Ceres represent the state motto 'Liberty and Prosperity.' The horse head anchors this entire composition—crowning the helmet that tops the shield. When Governor Byrne signed the 1977 designation at the Sussex County Fair, he noted this historical connection, stating the founding fathers valued horses so highly they included one in the state seal."

      - subtitle: "State Motto: 'Liberty and Prosperity'"
        text: "New Jersey's motto 'Liberty and Prosperity,' featured on the state seal since 1777, connects directly to horses' role in achieving both values. Horses provided the agricultural power creating prosperity—plowing fields, hauling harvests, transporting goods to market. They enabled communication and transportation maintaining liberty through connection between communities. During the Revolutionary War, horses carried messages, transported supplies, pulled artillery, and mounted cavalry defending independence. Today, horses continue generating prosperity through the $1.1 billion equine industry while preserving agricultural land maintaining New Jersey's landscape liberty—freedom from wall-to-wall development, open space for recreation, connection to rural heritage."
        link:
          label: "See New Jersey state motto"
          url: "/states/new-jersey/motto/liberty-and-prosperity"

      - subtitle: "State Flower: Violet"
        text: "The common meadow violet (Viola sororia), designated state flower in 1971, grows abundantly in horse pastures, meadows, and field edges throughout New Jersey. These purple-blue flowers bloom in spring when mares are foaling and horses transition from winter hay feeding to spring grazing. Violets thrive in the open grasslands and partially shaded edges characteristic of horse farms, creating scenic landscapes that make New Jersey's remaining agricultural areas beautiful and desirable. Both symbols—horse and violet—represent New Jersey's agricultural heritage and the pastoral landscape increasingly rare in America's most densely populated state."
        link:
          label: "See New Jersey state flower"
          url: "/states/new-jersey/flower/violet"

      - subtitle: "State Bird: Eastern Goldfinch"
        text: "The eastern goldfinch (Spinus tristis), designated state bird in 1935, frequents horse farms feeding on thistle, dandelion, and other seeds abundant in pastures and fence lines. Male goldfinches display brilliant yellow breeding plumage during summer when horses graze pastures dotted with wildflowers. These small songbirds nest in late summer, coinciding with hay harvests that provide nesting material and newly exposed seed heads. The goldfinch's presence on horse farms creates connections between equine agriculture and wildlife habitat—properly managed pastures support diverse bird species benefiting from the mosaic of grassland, edge habitat, and hedgerows typical of horse country."
        link:
          label: "See New Jersey state bird"
          url: "/states/new-jersey/bird/american-goldfinch"

