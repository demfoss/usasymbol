faq:
  - question: "What is New Jersey's state animal?"
    answer: "New Jersey's state animal is the horse (Equus caballus), designated in 1977. The horse was chosen to honor its 200-year presence on New Jersey's state seal (since 1777) and its contributions to agriculture, economic development, and land preservation in the Garden State."

  - question: "When was the horse designated as New Jersey's state animal?"
    answer: "The horse became New Jersey's official state animal on August 14, 1977, when Governor Brendan T. Byrne signed Senate Bill 1784 at the Sussex County Fair. The designation occurred exactly 200 years after Pierre Eugene du Simitiere designed the state seal in 1777 featuring a horse head crest."

  - question: "Why did New Jersey choose the horse as its state animal?"
    answer: "New Jersey chose the horse because it has been featured on the state seal since 1777 (representing speed and strength), played essential roles in agriculture and transportation throughout state history, and continues contributing economically through a $1.1 billion equine industry that preserves 222,000 acres of agricultural land. Fifth-grader Michael McCarthy, his classmates, and eighth-grader James Sweetman successfully advocated for the designation."

  - question: "How many horses live in New Jersey?"
    answer: "New Jersey is home to approximately 42,500 horses distributed across all 21 counties. When the horse was designated state animal in 1977, the population was about 38,000 horses (up from 18,000 in 1961). The highest concentrations today are in Monmouth County and northwest counties including Hunterdon, Somerset, Warren, and Sussex."

  - question: "What is New Jersey's horse racing industry?"
    answer: "New Jersey's horse racing industry includes three major tracks: Monmouth Park (Thoroughbred racing, hosts Haskell Invitational), Meadowlands (harness and Thoroughbred racing, hosts Hambletonian Stakes), and Freehold Raceway (oldest continuously operating US racetrack since 1853). The industry generates significant economic activity but faces challenges from casino-subsidized purses in neighboring states."

  - question: "How did students get the horse designated as state animal?"
    answer: "Fifth-grader Michael McCarthy and his class at Our Lady of Victories School in Harrington Park, along with eighth-grader James Sweetman from Freehold, researched horses' importance to New Jersey and advocated for the designation. They presented findings to legislators, testified at hearings, and convinced lawmakers to pass Senate Bill 1784 in 1977. Governor Byrne specifically thanked the students at the signing ceremony, noting their effective lobbying."

  - question: "Why is there a horse on New Jersey's state seal?"
    answer: "Pierre Eugene du Simitiere designed New Jersey's state seal in 1777 with a horse head crest above a knight's helmet to symbolize speed, strength, and sovereignty of the newly independent state. At that time, horses provided essential agricultural power, transportation, and military support during the Revolutionary War. The horse head crowns the entire seal design, emphasizing horses' importance to New Jersey's founding generation."

  - question: "How does New Jersey's equine industry preserve farmland?"
    answer: "New Jersey's horse industry preserves approximately 222,000 acres—about 25% of the state's remaining agricultural land—through breeding facilities, training centers, pastures, hay fields, and equestrian centers. This farmland provides environmental benefits including groundwater recharge, wildlife habitat, air quality improvement, and scenic beauty. In America's most densely populated state, horse farming makes agriculture economically viable, enabling landowners to resist selling to developers."

