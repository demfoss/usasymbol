seo_title: 'New Jersey State Juice: Cranberry Juice Official Symbol (2023)'
seo_description: New Jersey's official state juice is cranberry juice, designated in 2023 after a three-year student campaign. Learn why New Jersey chose cranberry juice, which students pushed it into law, and what the state's cranberry heritage really looks like.
intro_text: '<strong>Cranberry juice became New Jersey''s official state juice in 2023</strong> — and it got there because a group of fourth-graders decided it should. The students at Eleanor Rush Intermediate School in Cinnaminson Township spent nearly three years lobbying the legislature, writing letters, and testifying before the state Senate, turning a classroom civics project into an actual law. Behind their campaign stood one of the quieter but more durable facts about New Jersey agriculture: the state has been growing cranberries since the early 1800s, and the Pinelands still produce them at a scale that puts New Jersey among the top three cranberry-producing states in the country.'
