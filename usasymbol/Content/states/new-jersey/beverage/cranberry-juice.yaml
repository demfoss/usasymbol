faq:
- question: What is New Jersey's official state juice?
  answer: Cranberry juice. It was designated New Jersey's official state juice in 2023 — the first time the state had ever named an official juice.
- question: When was cranberry juice named New Jersey's state juice?
  answer: 2023. Assembly Bill A2271 completed a multi-year legislative process and was signed into law that year.
- question: Why did New Jersey choose cranberry juice as its state juice?
  answer: New Jersey ranks among the top three cranberry-producing states in the country. Cranberries have been grown commercially in Burlington County and the Pinelands since the early 1800s and were used by the Lenni-Lenape long before that. The designation reflects a genuine agricultural identity rooted in a specific landscape.
- question: Who campaigned for cranberry juice to become the state juice?
  answer: Fourth-grade students at Eleanor Rush Intermediate School in Cinnaminson Township. They spent approximately three years writing letters, attending hearings, and testifying before the New Jersey Senate before the bill passed in 2023.
- question: Where are New Jersey's cranberries grown?
  answer: Primarily in Burlington County and the surrounding New Jersey Pinelands — a million-acre region of coastal plain, wetlands, and bog in South Jersey whose acidic, sandy soil is well-suited to cranberry cultivation.
- question: Are cranberries native to New Jersey?
  answer: Yes. Cranberries are native to North America and grew wild in the New Jersey Pinelands before European settlement. The Lenni-Lenape used them for food and dye. Commercial cultivation in New Jersey began in the early 1800s.
