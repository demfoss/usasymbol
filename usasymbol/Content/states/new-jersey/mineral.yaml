faq:
  - question: What is New Jersey's state mineral?
    answer: "New Jersey's state mineral is franklinite, a black, metallic zinc-iron-manganese oxide adopted by the New Jersey Legislature in 2023."
  - question: When did New Jersey adopt franklinite as its state mineral?
    answer: "Governor Phil Murphy signed the bill designating franklinite as New Jersey's official state mineral in July 2023."
  - question: Why did New Jersey choose franklinite?
    answer: "Franklinite was the primary zinc ore mined at Franklin and Sterling Hill for over a century, and it is found in real abundance almost nowhere else in the world, making it a mineral effectively unique to New Jersey."
  - question: Where can you find franklinite in New Jersey?
    answer: "The Franklin Mining District in Sussex County, including the former Franklin and Sterling Hill mines, is the source of virtually all documented franklinite."

