sections:
  - id: overview
    icon: fa-solid fa-cube
    title: New Jersey State Mineral
    paragraphs:
      - "Franklinite is New Jersey's official state mineral, designated by the New Jersey Legislature in 2023. It is a black, metallic zinc-iron-manganese oxide that was the primary ore of zinc mined from Franklin and Sterling Hill in Sussex County for more than a century."
      - "New Jersey chose franklinite because the mineral is essentially tied to the state. Outside a few minor occurrences elsewhere, workable deposits of franklinite have been found almost nowhere else on Earth."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Franklinite?"
    paragraphs:
      - "Franklinite is a black, opaque mineral with a metallic luster, often forming octahedral crystals or rounded grains embedded in white or pink calcite. It belongs to the spinel group of oxide minerals and typically appears alongside two other Franklin-area minerals, red-fluorescing calcite and green-fluorescing willemite."
      - "Chemically, franklinite is a zinc-iron-manganese oxide, with manganese and iron substituting for one another within the crystal structure. It does not fluoresce under ultraviolet light itself, but it is commonly found intermixed with the fluorescent minerals that made the Franklin area famous among collectors."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why New Jersey Chose Franklinite as Its State Mineral"
    paragraphs:
      - "Franklinite was first described from Franklin, New Jersey, in the early 1800s and went on to become the primary zinc ore mined from the Franklin and Sterling Hill deposits for more than a hundred years. Mining that ore built the borough of Franklin's economy and turned the district into one of the most studied mineral localities in the world."
      - "Advocates from the Sterling Hill Mining Museum and Franklin Borough schoolchildren pushed for years to give New Jersey an official state mineral, and franklinite's tie to a single, well-documented New Jersey locality made it the clear candidate over more common minerals found in many other states."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Franklinite Became New Jersey's State Mineral"
    paragraphs:
      - "State Senator Steve Oroho and Assemblymen Parker Space and Hal Wirths sponsored the bill naming franklinite New Jersey's state mineral, with support from the Sterling Hill Mining Museum and students at a Franklin Borough school who wrote letters backing the effort. The New Jersey Assembly passed the bill unanimously in May 2023, and Governor Phil Murphy signed it into law that July, giving New Jersey its first official state mineral."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Franklinite Is Found in New Jersey"
    paragraphs:
      - "The Franklin and Sterling Hill mines, in the Franklin Mining District of Sussex County, are the source of virtually all documented franklinite. The Franklin Mine closed in 1954 and the Sterling Hill Mine in 1986, but both sites are preserved today as mineral museums, and the area is still known as the Fluorescent Mineral Capital of the World."
    sites:
      - name: Franklin Mining District
        city: Franklin
        lat: 41.1136
        lng: -74.5889
        note: "Source of virtually all documented franklinite"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Franklinite Facts"
    facts:
      - "Adopted as New Jersey's state mineral in 2023, becoming New Jersey's first official state mineral."
      - "Franklinite was the primary ore of zinc mined at Franklin and Sterling Hill for more than a century."
      - "The Franklin, New Jersey area has been declared the Fluorescent Mineral Capital of the World, and more than 300 mineral species have been documented there."
      - "The bill naming franklinite the state mineral passed the New Jersey Assembly by a unanimous 73-0 vote."

