title: Eastern Goldfinch
scientific_name: Spinus tristis
adopted_year: 1935
legislation: N.J. Rev. Stat. Sec. 52:9A-1
meaning: New Jersey's state bird is easier to explain through the Garden State than through a detailed legislative record. The statute is only a one-line designation, but later civic history shows why a goldfinch already felt right for a state long identified with gardens, flowers, and cultivated landscape.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: "2026-05-02"
seo_title: "New Jersey State Bird | Eastern Goldfinch"
seo_description: "New Jersey adopted the Eastern Goldfinch in 1935. Sparse records leave much of the story to garden-club history."
intro_text: In New Jersey law, the official state bird is the <strong>Eastern Goldfinch</strong>, the older name for the bird now more commonly called the <strong>American Goldfinch</strong>, adopted in <strong>1935</strong> and listed in <strong>N.J. Rev. Stat. Sec. 52:9A-1</strong>. The statute is only a short designation, and modern state symbol pages preserve little adoption history. The clearest surviving clue comes from the <strong>Garden Club of New Jersey</strong>, which says it worked to get the goldfinch adopted that year — placing the choice in the same civic-organization tradition that backed state bird campaigns across the country in the 1930s.
