intro_text: "New Jersey's state fruit is the northern highbush blueberry, adopted in 2004 to recognize the variety first cultivated in the state's Pine Barrens in the early 1900s. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is New Jersey's State Fruit?"
    paragraphs:
      - "The northern highbush blueberry is New Jersey's official state fruit, designated by the New Jersey Legislature in 2004. New Jersey is where the modern cultivated blueberry industry began."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Northern Highbush Blueberry"
    paragraphs:
      - "Highbush blueberries grow on tall shrubs that can reach six feet or more, producing large, sweet, dark blue berries. New Jersey's blueberry season runs through the summer, centered in the Pine Barrens of the southern part of the state."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Northern Highbush Blueberry Became New Jersey's State Fruit"
    paragraphs:
      - "The New Jersey Legislature designated the northern highbush blueberry the official state fruit in 2004."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New Jersey Chose the Northern Highbush Blueberry"
    paragraphs:
      - "In the early 1900s, botanist Elizabeth Coleman White worked with USDA scientist Frederick Coville in the Pine Barrens near Whitesbog to develop the first cultivated highbush blueberry, founding what became a major American fruit industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Northern Highbush Blueberry Comes From in New Jersey"
    paragraphs:
      - "Whitesbog, in the Pine Barrens of Burlington County, is where the first cultivated highbush blueberries were developed in the early 1900s."
    sites:
      - name: Whitesbog Village
        city: Browns Mills
        lat: 39.90
        lng: -74.53
        note: "Birthplace of the cultivated blueberry industry"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Northern Highbush Blueberry Facts"
    facts:
      - "Adopted as New Jersey's state fruit in 2004."
      - "The cultivated highbush blueberry was first developed at Whitesbog in the Pine Barrens."
      - "Elizabeth Coleman White and Frederick Coville pioneered blueberry cultivation there."

