seo:
  title: "Most Common Surnames in New Jersey"
  description: "New Jersey's most common surnames are Patel, Williams, and Brown, shaped by Indian American, Latino, English, Dutch, and Jewish roots."

page:
  h1: "Most Common Surnames in New Jersey"
  intro: "Patel is the most common surname in New Jersey, followed by Williams and Brown, an unusual ranking for a U.S. state in 2010. New Jersey's Dutch river colonies, Ellis Island era immigration into Newark, Jersey City, and Paterson, and the later growth of Puerto Rican, Korean, and Indian American communities all show up in the top 20. Few states place a South Asian surname first while also giving such a large share of the list to Spanish-language patronymics."
  heritage_title: "Dutch Rivers, Ellis Island, and Edison"
  heritage_body: "New Jersey's surname map reflects three big layers of settlement. The oldest runs back to Dutch and English colonists along the Hudson, Passaic, and Raritan rivers; the second came through the industrial age, when Italians, Jews, Poles, and other southern and eastern Europeans entered through Ellis Island and settled in North Jersey mill and port cities; the third is modern, with Puerto Rican migration expanding after World War II and Asian Indian, Korean, and other Asian communities growing sharply after 1970, especially in Middlesex and Bergen counties."
  fun_fact: "New Jersey is unusual enough that Smith does not make the top 20 here at all. Patel ranks first statewide, and Shah also lands in the top 30, a strong sign of how large the state's Indian American population had become by 2010."

surnames:
  - rank: 1
    name: Patel
    count: 33399
    ratio: 269
    origin: indian
    type: Occupational
    meaning: "From Gujarati, originally a title for a village headman or landholder. Patel ranks first in New Jersey because the state built one of the country's largest Indian American populations, with especially strong concentrations in Middlesex, Bergen, and Somerset counties."

  - rank: 2
    name: Williams
    count: 31895
    ratio: 282
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic personal name Willahelm. Williams remains near the top in New Jersey because it belongs to both the older English Atlantic seaboard surname layer and later Black American communities in cities such as Newark, Trenton, and Camden."

  - rank: 3
    name: Brown
    count: 30473
    ratio: 295
    origin: english
    type: Descriptive
    meaning: "Originally a nickname for someone with brown hair, clothing, or complexion, from Old English 'brun'. Brown is one of the durable broad-base surnames that stayed common through every phase of New Jersey history, from colonial farms to industrial cities and postwar suburbs."

  - rank: 4
    name: Johnson
    count: 28944
    ratio: 310
    origin: english
    type: Patronymic
    meaning: "Son of John, from the Hebrew name Yohanan, meaning God is gracious. Johnson has deep roots in early English America and remained widely shared across New Jersey's white and Black populations, which helps keep it near the top statewide."

  - rank: 5
    name: Rodriguez
    count: 27691
    ratio: 325
    origin: spanish
    type: Patronymic
    meaning: "Son of Rodrigo, a Germanic personal name usually interpreted as famous ruler. Rodriguez ranks high because New Jersey's large Hispanic population grew rapidly in the late 20th century, especially in Hudson, Passaic, Essex, Union, and Middlesex counties."

  - rank: 6
    name: Lee
    count: 23184
    ratio: 388
    origin: english
    type: Habitational
    meaning: "In English, Lee comes from Old English 'leah', a clearing or meadow, though in New Jersey it also carries major Chinese and Korean surname lines. That overlap helps explain why a short surname with several origins ranks so high in one of the country's most diverse states."

  - rank: 7
    name: Jones
    count: 22755
    ratio: 395
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form meaning son of John. Jones came early into the Mid-Atlantic through British settlement and stayed widespread enough across every region of New Jersey to remain a top 10 surname."

  - rank: 8
    name: Miller
    count: 21548
    ratio: 417
    origin: english
    type: Occupational
    meaning: "An occupational surname for a grain miller. Miller fits a state that moved from colonial agriculture into early industry, with water-powered places such as Paterson making milling and manufacturing surnames familiar across New Jersey."

  - rank: 9
    name: Davis
    count: 19799
    ratio: 454
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from the Hebrew name Dawid, meaning beloved. Davis has the same broad American reach as Johnson and Williams, which is why it remained common as New Jersey layered new immigrant populations onto its older British surname base."

  - rank: 10
    name: Rivera
    count: 18604
    ratio: 483
    origin: spanish
    type: Habitational
    meaning: "A place-based Spanish surname meaning riverbank or streamside. Rivera's prominence in New Jersey tracks the state's large Puerto Rican population, which was the biggest Hispanic origin group in the state in 2010."

  - rank: 11
    name: Gonzalez
    count: 17820
    ratio: 504
    origin: spanish
    type: Patronymic
    meaning: "Son of Gonzalo, from a medieval Iberian personal name. Gonzalez rose with the broad expansion of Latino communities in North and Central Jersey, especially after 1980."

  - rank: 12
    name: Perez
    count: 17077
    ratio: 526
    origin: spanish
    type: Patronymic
    meaning: "Son of Pedro, the Spanish form of Peter. Perez is common in New Jersey for the same reason Rivera and Rodriguez are: the state became a major destination for Puerto Rican, Dominican, Colombian, and other Latin American families."

  - rank: 13
    name: Garcia
    count: 15729
    ratio: 571
    origin: spanish
    type: Patronymic
    meaning: "A classic Iberian surname, often traced to an old personal name of Basque origin. Garcia's high rank reflects the depth and geographic spread of New Jersey's Hispanic population far beyond a single city or county."

  - rank: 14
    name: Martinez
    count: 15638
    ratio: 575
    origin: spanish
    type: Patronymic
    meaning: "Son of Martin, from the Latin Martinus. Martinez is especially characteristic of states where Latino migration has reshaped the top surname ranks, and New Jersey is one of them."

  - rank: 15
    name: Lopez
    count: 15305
    ratio: 587
    origin: spanish
    type: Patronymic
    meaning: "Son of Lope, from the Latin lupus, wolf. Lopez became highly visible in New Jersey as Hispanic communities spread through older industrial cities and into suburban counties as well."

  - rank: 16
    name: Kim
    count: 14268
    ratio: 630
    origin: korean
    type: Descriptive
    meaning: "From the Korean surname Gim or Kim, traditionally associated with the character for gold. Kim ranks this high because New Jersey built one of the country's largest Korean American populations, with Bergen County standing out as the state's main center."

  - rank: 17
    name: Wilson
    count: 14157
    ratio: 635
    origin: english
    type: Patronymic
    meaning: "Son of Will, a short form of William. Wilson is part of the older British surname stock that remained common even as newer immigrant names transformed the rest of the New Jersey list."

  - rank: 18
    name: Torres
    count: 13680
    ratio: 657
    origin: spanish
    type: Habitational
    meaning: "A Spanish place-name surname referring to someone who lived near a tower. Torres rose statewide with the same Puerto Rican and wider Latino growth that pushed Rivera, Rodriguez, and Lopez high into New Jersey's top tier."

  - rank: 19
    name: Hernandez
    count: 13234
    ratio: 679
    origin: spanish
    type: Patronymic
    meaning: "Son of Hernando or Fernando, from the Germanic name Ferdinand. Hernandez is another sign that New Jersey's surname profile is no longer dominated by English names alone."

  - rank: 20
    name: Jackson
    count: 13188
    ratio: 681
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval form of John. Jackson has long been common in African American communities and remains strong in New Jersey's older cities, which keeps it in the statewide top 20."

unique_surnames:
  - name: Patel
    state_rank: 1
    national_rank: 123
    origin: indian
    why: "Patel is the clearest New Jersey outlier: it ranks first statewide while sitting far lower nationally. That pattern matches New Jersey's exceptionally large Asian Indian population, which reached 292,256 in 2010 and clustered heavily in Middlesex, Bergen, and Somerset counties."

  - name: Shah
    state_rank: 28
    national_rank: 516
    origin: indian
    why: "Shah is far more visible in New Jersey than in the United States as a whole. Its rise follows the same post-1970 South Asian growth that made Edison and nearby Middlesex County central hubs of Indian American life."

  - name: Kim
    state_rank: 16
    national_rank: 91
    origin: korean
    why: "Kim ranks unusually high because New Jersey has one of the nation's largest Korean American populations. Bergen County alone held more than 60 percent of the state's Korean population in 2010, giving the surname an especially strong North Jersey footprint."

  - name: Cohen
    state_rank: 37
    national_rank: 247
    origin: hebrew
    why: "Cohen is more common in New Jersey than nationally because the state developed both urban Jewish communities in the north and Jewish agricultural colonies in the south. Settlements such as Alliance and Woodbine helped make Jewish surnames part of New Jersey's long-term local history, not just its big-city story."

  - name: Santiago
    state_rank: 51
    national_rank: 362
    origin: spanish
    why: "Santiago stands out because Puerto Ricans were New Jersey's largest Hispanic origin group in 2010. The surname is tied especially to the state's long Puerto Rican presence in cities such as Newark, Camden, Jersey City, and Perth Amboy."

etymology_groups:
  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate New Jersey's top surnames. Williams, Johnson, Rodriguez, Jones, Davis, Gonzalez, Perez, Garcia, Martinez, Lopez, Wilson, Hernandez, and Jackson all descend from personal names, which shows how many of the state's strongest surname traditions came through British and Spanish naming systems."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Rodriguez (son of Rodrigo)
      - Martinez (son of Martin)

  - type: Spanish and Caribbean Names
    icon: fa-solid fa-map-location-dot
    description: "Nine of New Jersey's top 20 surnames are clearly Spanish-language names: Rodriguez, Rivera, Gonzalez, Perez, Garcia, Martinez, Lopez, Torres, and Hernandez. That concentration reflects how strongly Puerto Rican, Dominican, Colombian, Mexican, and other Latino communities reshaped the state from the late 20th century onward."
    examples:
      - Rivera (riverbank)
      - Perez (son of Pedro)
      - Torres (near a tower)
      - Hernandez (son of Hernando)

  - type: South and East Asian Names
    icon: fa-solid fa-ship
    description: "Patel, Lee, and Kim give New Jersey a surname profile that looks more like a global gateway than a typical East Coast state. By 2010, Asian Indians were the state's largest Asian group, while Bergen County had become one of the country's best-known Korean American centers."
    examples:
      - Patel (village headman or landholder)
      - Lee (clearing; also several East Asian surname traditions)
      - Kim (gold)

faq:
  - question: "Why is Patel the most common last name in New Jersey?"
    answer: "Patel is the most common last name in New Jersey because the state built one of the largest Indian American populations in the United States, especially in Middlesex, Bergen, and Somerset counties. By 2010, Asian Indians were New Jersey's largest Asian group, large enough to push Patel above long-dominant Anglo-American names."

