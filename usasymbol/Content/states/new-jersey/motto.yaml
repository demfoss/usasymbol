faq:
  - question: "What is New Jersey's state motto?"
    answer: "New Jersey's state motto is \"Liberty and Prosperity.\" It has appeared on the state coat of arms and seal since 1777."

  - question: "What does \"Liberty and Prosperity\" mean?"
    answer: "Liberty refers to political freedom from British rule. Prosperity refers to economic well-being and abundance. The two figures on the coat of arms show this directly: Liberty holds a staff with a freedom cap, and Ceres holds a cornucopia."

  - question: "When did New Jersey adopt its state motto?"
    answer: "The motto has been on the state seal since it was formally adopted on October 3, 1777. It was never adopted separately by statute — it became the recognized motto through its inclusion in the seal description under New Jersey Statutes, Title 52, § 52:2-1."

  - question: "What was New Jersey's original motto?"
    answer: "The original 1776 committee proposal used the motto \"Liberty and Property.\" It was changed to \"Liberty and Prosperity\" by the time Swiss artist Pierre du Simitière delivered the finished seal to the legislature in May 1777."

