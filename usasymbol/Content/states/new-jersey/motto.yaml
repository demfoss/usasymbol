seo_title: "New Jersey State Motto | Liberty and Prosperity"
seo_description: "New Jersey's state motto is \"Liberty and Prosperity.\" It has appeared on the state seal since 1777, supported by the figures of Liberty and Ceres."

intro_text: "New Jersey's state motto is <strong>Liberty and Prosperity</strong>. The phrase has appeared on the state coat of arms since 1777, carried on a scroll beneath two figures — Liberty on the left and Ceres on the right."

