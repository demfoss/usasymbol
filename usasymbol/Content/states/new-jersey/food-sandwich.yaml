intro_text: "New Jersey's state sandwich is the pork roll, egg and cheese sandwich, recognized in a 2023 gubernatorial proclamation and built around a meat product invented in the state. This profile appears in the [list of U.S. state foods](/symbols/dishes)."

sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is New Jersey's State Sandwich?"
    paragraphs:
      - "The pork roll, egg and cheese sandwich is listed as New Jersey's state sandwich following a gubernatorial proclamation in 2023. It is a breakfast sandwich built around pork roll, a cured and smoked pork product invented in the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pork Roll, Egg and Cheese Sandwich"
    paragraphs:
      - "The sandwich layers slices of griddled pork roll, a fried egg, and melted cheese, usually American, on a roll or bagel. Pork roll is a cured, smoked pork product with a distinct tangy flavor, sold both under the name pork roll and, in some parts of the state, as Taylor ham."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Pork Roll, Egg and Cheese Sandwich Became New Jersey's State Sandwich"
    paragraphs:
      - "New Jersey Governor Phil Murphy issued a playful proclamation recognizing the state's famous pork roll or Taylor ham, egg and cheese sandwich in 2023. Earlier legislative proposals to create a state sandwich did not become law."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why New Jersey Chose the Pork Roll, Egg and Cheese Sandwich"
    paragraphs:
      - "Pork roll was created in the mid-1800s by John Taylor, a butcher and meat packer in Trenton, New Jersey. The sandwich built around it has become a fixture of New Jersey diners and delis, and the debate over whether to call it pork roll or Taylor ham is itself a well known piece of New Jersey identity."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Pork Roll, Egg and Cheese Sandwich Comes From in New Jersey"
    paragraphs:
      - "Trenton, New Jersey, is where John Taylor first developed pork roll in the mid-1800s, giving the city a lasting connection to the sandwich."
    sites:
      - name: Trenton
        city: Trenton
        lat: 40.2171
        lng: -74.7429
        note: "Birthplace of pork roll in the mid-1800s"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pork Roll, Egg and Cheese Sandwich Facts"
    facts:
      - "Recognized in a New Jersey gubernatorial proclamation in 2023."
      - "Pork roll was created by John Taylor, a Trenton butcher, in the mid-1800s."
      - "The sandwich is also known regionally as Taylor ham, egg and cheese."
      - "It is a staple breakfast order at diners and delis across New Jersey."

