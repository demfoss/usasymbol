faq:
  - question: "What is New Jersey's state sandwich?"
    answer: "The pork roll, egg and cheese sandwich is listed as New Jersey's state sandwich following a 2023 gubernatorial proclamation."
  - question: "When did New Jersey recognize the pork roll, egg and cheese sandwich?"
    answer: "Governor Phil Murphy issued the proclamation in 2023."
  - question: "Why did New Jersey choose the pork roll, egg and cheese sandwich?"
    answer: "Pork roll was invented in Trenton in the mid-1800s, and the sandwich built around it is a signature order at diners across the state."
  - question: "Is pork roll called something else in parts of New Jersey?"
    answer: "Yes. In parts of the state it is called Taylor ham, and the choice between the two names is a well known local debate."

