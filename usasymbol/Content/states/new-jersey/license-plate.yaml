seo_title: "New Jersey License Plate Slogan | Garden State"
seo_description: "Garden State has been New Jersey's license plate slogan since 1959, tied to its farm-market history."
hero_image: /images/license-plates/new-jersey/2014-current-garden-state.jpg
hero_image_alt: New Jersey standard license plate with Garden State slogan
hero_image_caption: New Jersey's current standard plate keeps "Garden State" at the bottom, continuing a slogan streak that began in 1959.
intro_text: "**\"Garden State\"** has been New Jersey's standard license plate slogan since 1959. The plate design has changed from cream-on-black to blue-on-cream, then to the yellow gradient base that began in late 1992, but the wording has stayed the same. The current screened-serial version of that yellow base was introduced in April 2014. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"Garden State\" has been New Jersey's standard license plate slogan since 1959. It is New Jersey's official state nickname, commonly traced to Abraham Browning's 1876 remarks at the Philadelphia Centennial Exposition."
