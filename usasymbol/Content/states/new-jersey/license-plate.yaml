  answer: New Jersey's standard license plate slogan is "Garden State."
- question: How long has Garden State been on New Jersey plates?
  answer: '"Garden State" has appeared on New Jersey standard passenger plates since 1959.'
- question: Where does Garden State come from?
  answer: The phrase is commonly attributed to Abraham Browning, who used it at the 1876 Philadelphia Centennial Exposition.
- question: When did the current New Jersey plate start?
  answer: The yellow gradient base began in late 1992. The current screened-serial version was introduced in April 2014.
- question: Has New Jersey changed its plate slogan?
  answer: No. New Jersey has redesigned its standard passenger plates, but the Garden State slogan has remained in use since 1959.

