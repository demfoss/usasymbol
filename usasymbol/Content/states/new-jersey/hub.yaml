seo_description: "New Jersey symbols include the eastern goldfinch, violet, northern red oak, Liberty and Prosperity motto, and Garden State nickname."
snippet_answer: New Jersey's eastern goldfinch and violet are the most familiar official state symbols in the Garden State, both tied to the natural and agricultural identity behind the nickname. The northern red oak, Liberty and Prosperity motto, Seeing Eye Dog, and Hadrosaurus foulkii — one of the first recognized dinosaurs in North America — make New Jersey's list unexpectedly diverse.
