name_meaning:
  heading: What Does New Jersey Mean?
  paragraphs:
  - New Jersey became the 3rd state in 1787, after beginning as one of the original thirteen colonies. It was named for Jersey, the Channel Island associated with Sir George Carteret, one of the colony's proprietors.
  - The state name comes from across the Atlantic, but the symbols are intensely local. The Garden State nickname, cranberry juice, horse, violet, and northern red oak all push back against the idea that New Jersey is only suburbs and highways.
  - New Jersey's postal abbreviation is NJ, and residents are New Jerseyans. The Garden State nickname gives many of the state's plant and agriculture symbols their frame.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named for Jersey, one of the Channel Islands.
    - label: Statehood
      text: New Jersey ratified the Constitution in 1787 and became the 3rd state.
    - label: Motto
      text: Liberty and Prosperity appears in New Jersey's seal tradition.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to New Jersey, a Mid-Atlantic state with urban, suburban, coastal, agricultural, and Pinelands regions.
    - label: People
      text: People from New Jersey are called New Jerseyans.
    - label: Garden State
      text: The nickname frames the state's farms, gardens, cranberries, violets, and red oak forests.
  - heading: Nicknames and Short Forms
    items:
    - label: The Garden State
      text: Main nickname and the strongest shorthand for New Jersey's official-symbol identity.
    - label: Jersey
      text: Common informal short name for the state.
    - label: Abbreviation
      text: NJ; older short form N.J.
editorial:
  heading: What New Jersey's Symbols Say About the State
  paragraphs:
  - New Jersey's [Garden State nickname](/states/new-jersey/nickname) is easy to underestimate because the state is so urbanized. But the [violet](/states/new-jersey/flower), [northern red oak](/states/new-jersey/tree), and [cranberry juice](/states/new-jersey/beverage/cranberry-juice) keep agriculture and plant life near the center of the story.
  - The animal symbols are unusually human-facing. The [horse](/states/new-jersey/mammal/horse) points to farms, racing, and equestrian culture, while the [Seeing Eye Dog](/states/new-jersey/mammal/seeing-eye-dog) turns independence and public access into a state symbol.
  - "[Hadrosaurus foulkii](/states/new-jersey/dinosaur) gives New Jersey a deeper claim than a novelty dinosaur pick. It ties the state to one of the most important early dinosaur discoveries in American science."
faq:
- question: What is New Jersey's most famous state symbol?
  answer: The [Garden State nickname](/states/new-jersey/nickname) remains New Jersey's most familiar public identity.
- question: What is New Jersey's state bird?
  answer: New Jersey's state bird is the [eastern goldfinch](/states/new-jersey/bird), adopted in 1935.
- question: What is New Jersey's state flower?
  answer: New Jersey's state flower is the [violet](/states/new-jersey/flower), adopted in 1971.
- question: Why is the Seeing Eye Dog a New Jersey symbol?
  answer: The [Seeing Eye Dog](/states/new-jersey/mammal/seeing-eye-dog) belongs in the New Jersey group because the state recognized its connection to independence, mobility, and the New Jersey-based Seeing Eye tradition.
- question: How many official state symbols does New Jersey have?
  answer: New Jersey's hub gathers the flag, goldfinch, violet, red oak, motto, nickname, colors, cranberry juice, horse, Seeing Eye Dog, and Hadrosaurus.
