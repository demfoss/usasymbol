faq:
  - question: "What is New Jersey's state dinosaur?"
    answer: "Every museum display of a bipedal dinosaur traces back to a New Jersey marl pit. When Hadrosaurus foulkii was mounted upright at the Academy of Natural Sciences in Philadelphia in 1868 — the first dinosaur skeleton ever displayed that way — it established the visual template that every museum dinosaur exhibit has used since. Hadrosaurus was excavated in Haddonfield in 1858, named by Joseph Leidy, and designated New Jersey's official state dinosaur in 1991."

  - question: "Who discovered Hadrosaurus foulkii?"
    answer: "William Parker Foulke organized the 1858 excavation after learning that bones had been found at the same site by John Hopkins in 1838. Foulke brought the bones to the Academy of Natural Sciences in Philadelphia, where Joseph Leidy described and named the species. The species name foulkii honors Foulke."

  - question: "Where is the Hadrosaurus fossil now?"
    answer: "The original bones are held at the Academy of Natural Sciences of Drexel University in Philadelphia. A cast of the specimen is mounted at the Haddonfield Public Library in New Jersey. The discovery site in Haddonfield is a National Historic Landmark."

  - question: "Why was the 1868 mounting historically significant?"
    answer: "The 1868 Hadrosaurus mount at the Academy of Natural Sciences was the first time a nearly complete dinosaur skeleton was publicly displayed in an upright, bipedal position. This visual model — an active, upright dinosaur — became the template for all subsequent dinosaur displays and public imagery. It established how people visualize dinosaurs to this day."

  - question: "Can I visit the Hadrosaurus discovery site?"
    answer: "Yes. The discovery site on Maple Avenue in Haddonfield, New Jersey, is a National Historic Landmark with a public monument. The Haddonfield Public Library holds a cast of the original skeleton. The town hosts an annual Dinosaur Celebration and has integrated its paleontological heritage into its public identity."

  - question: "Is Hadrosaurus still a valid genus?"
    answer: "Yes. Hadrosaurus foulkii remains a valid species, and the genus Hadrosaurus is monotypic — it contains only this one species. Without a complete skull, placing it precisely within the hadrosaur family tree is difficult. Most analyses treat it as a basal hadrosaurid, but its exact relationships are not fully resolved."

