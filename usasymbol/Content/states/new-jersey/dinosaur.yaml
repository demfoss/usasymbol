expert_quote:
  text: "In the proportions of its limbs, Hadrosaurus much resembled the Kangaroo, and, like that animal, had probably the power of using its hind-feet and tail to support the body in an erect posture."
  source: "Joseph Leidy, 1858, Proceedings of the Academy of Natural Sciences of Philadelphia — the inference that made the 1868 bipedal mount possible"

faq:
  - question: "What is New Jersey's state dinosaur?"
    answer: "New Jersey's state dinosaur is Hadrosaurus foulkii. It was adopted in 1991."

  - question: "Who discovered Hadrosaurus foulkii?"
    answer: "William Parker Foulke organized the 1858 excavation."

  - question: "Where is the Hadrosaurus fossil now?"
    answer: "The original bones are at the Academy of Natural Sciences in Philadelphia."

  - question: "Why was the 1868 mounting historically significant?"
    answer: "It was the first mounted dinosaur skeleton displayed upright to the public."

  - question: "Can I visit the Hadrosaurus discovery site?"
    answer: "Yes. The Haddonfield site has a public monument."

  - question: "Is Hadrosaurus still a valid genus?"
    answer: "Yes. Hadrosaurus foulkii is still treated as a valid species."

