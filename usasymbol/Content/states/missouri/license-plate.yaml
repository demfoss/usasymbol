seo_title: "Missouri License Plate Slogan | Bicentennial"
seo_description: "Bicentennial is Missouri's current standard license plate slogan, introduced in 2018 ahead of the state's 2021 anniversary."
hero_image: /images/license-plates/missouri/2018-bicentennial.png
hero_image_alt: Missouri Bicentennial license plate sample
hero_image_caption: Missouri's current standard Bicentennial plate was introduced on October 15, 2018, ahead of the state's 200th anniversary in 2021.
intro_text: "**\"Bicentennial\"** is the inscription associated with Missouri's current standard license plate design, which entered regular issue on October 15, 2018. The better-known Missouri plate slogan is still **\"Show Me State\"**, but that belongs to the previous standard-issue eras: the hyphenated \"SHOW-ME STATE\" began in 1980, and the bluebird base later used \"Show Me State\" without the hyphen. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "Missouri's current standard plate is the Bicentennial design introduced in 2018 for Missouri's 200th anniversary of statehood in 2021. Before that, Missouri used \"SHOW-ME STATE\" beginning in 1980, then \"Show Me State\" on the 2008/2009 bluebird plate."
