sections:
- id: current-plate
  icon: fa-solid fa-car-side
  title: Missouri's Current Bicentennial Plate
  paragraphs:
  - 'Missouri''s current standard plate is the Bicentennial design, not a Show Me State plate. The Department of Revenue introduced it on October 15, 2018, so regular renewals would gradually move drivers onto the new design before Missouri''s 200th anniversary of statehood on August 10, 2021.'
  - 'The plate uses the state seal in the center and red and blue waves for the Missouri and Mississippi rivers. Because the design was tied to statehood, its identity statement is the Bicentennial theme rather than the older "Show Me State" slogan.'
  - 'This is the main correction to watch: Missouri''s plate-slogan timeline does not run straight from "Show Me State" in 2009 to the present. The Bicentennial plate replaced the bluebird standard plate beginning in 2018.'

- id: show-me-origin
  icon: fa-solid fa-person-chalkboard
  title: Where "Show Me" Comes From
  paragraphs:
  - 'The phrase "Show Me" is most often tied to Missouri Congressman Willard Duncan Vandiver, who used the line in an 1899 speech in Philadelphia. The phrase became shorthand for a Missouri character: skeptical, practical, and interested in proof more than polish.'
  - 'Missouri never made "Show Me State" its official state motto, but the phrase became the state''s best-known informal identity. It appeared in tourism language, popular speech, and eventually on license plates.'
  - 'For context on Missouri''s formal state identity, see the [Missouri state nickname](/states/missouri/nickname) and [Missouri state motto](/states/missouri/motto).'

- id: plate-history
  icon: fa-solid fa-clock-rotate-left
  title: How the Plate Slogans Changed
  paragraphs:
  - 'Missouri used a national Bicentennial inscription in 1976, then moved to its own state identity in 1980 with "SHOW-ME STATE." That slogan stayed on standard plates for decades, first in the hyphenated form and later without the hyphen.'
  - 'The bluebird base introduced around 2008 is the transition point. License Plate Room records the slogan change as 2009, while plate collectors and image records often identify the bluebird base as a 2008 issue. For readers, the important point is that this was the era when the plate text changed from "SHOW-ME STATE" to "Show Me State."'
  - 'In 2018, Missouri changed the standard issue again for the statehood Bicentennial design. That made "Bicentennial" the current standard plate theme.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Missouri License Plate Slogans by Era
  paragraphs:
  - 'Missouri''s slogan sequence is easiest to read as four confirmed eras: U.S. Bicentennial, Show-Me State, Show Me State, and Missouri Bicentennial.'
  versions:
  - name: 200YRS
    years: '1976'
    image: /images/license-plates/missouri/1976-bicentennial-200yrs.jpg
    description: Missouri's U.S. Bicentennial plate used "200YRS" for the 1776-1976 national anniversary. It was a commemorative inscription, not a permanent Missouri identity slogan.
  - name: SHOW-ME STATE
    years: 1980-2008
    image: /images/license-plates/missouri/1980-show-me-state.png
    description: Missouri's long-running state-identity slogan appeared in hyphenated form as "SHOW-ME STATE." License Plate Room identifies 1980 as the first slogan year.
  - name: Show Me State
    years: 2009-2018
    image: /images/license-plates/missouri/2009-bluebird-show-me-state.jpg
    description: The bluebird standard plate era used "Show Me State" without the hyphen. Some plate references date the base to 2008, while License Plate Room records the slogan change under 2009.
  - name: Bicentennial
    years: 2018-present
    image: /images/license-plates/missouri/2018-bicentennial.png
    description: Missouri introduced the current Bicentennial standard plate on October 15, 2018, ahead of the August 10, 2021 statehood bicentennial.

timeline:
- year: '1976'
  description: Missouri issues a U.S. Bicentennial plate carrying "200YRS," marking the national 1776-1976 anniversary.
- year: '1980'
  description: '"SHOW-ME STATE" appears on Missouri standard plates, giving the state''s best-known informal identity a permanent plate presence.'
- year: '2008'
  description: Missouri introduces the bluebird plate base, the design associated with the later unhyphenated "Show Me State" wording.
- year: '2009'
  description: License Plate Room records Missouri's slogan as "Show Me State," without the hyphen used on earlier plates.
- year: '2018'
  description: The Department of Revenue introduces Missouri's Bicentennial standard plate on October 15, replacing the bluebird base through regular renewals.
- year: '2021'
  description: Missouri reaches its 200th anniversary of statehood on August 10, the anniversary the Bicentennial plate was designed to commemorate.

faq:
- question: What is Missouri's current license plate slogan?
  answer: Missouri's current standard plate is the Bicentennial design introduced in 2018. The older "Show Me State" slogan is historically important, but it is not the current standard plate inscription.
- question: When did "SHOW-ME STATE" first appear on Missouri plates?
  answer: License Plate Room identifies 1980 as the first year for Missouri's "SHOW-ME STATE" license plate slogan.
- question: When did Missouri remove the hyphen from "SHOW-ME STATE"?
  answer: The change is tied to the bluebird plate era. License Plate Room records "Show Me State" in 2009, while the bluebird base itself is commonly dated to 2008.
- question: Why did Missouri make a Bicentennial license plate?
  answer: Missouri introduced the Bicentennial plate in 2018 to commemorate the state's 200th anniversary of statehood, which occurred on August 10, 2021.
- question: Is "Show Me State" Missouri's official motto?
  answer: No. "Show Me State" is Missouri's informal nickname and former plate slogan. Missouri's official motto is "Salus populi suprema lex esto," commonly translated as "Let the welfare of the people be the supreme law."
- question: What did Missouri's 1976 license plate say?
  answer: Missouri's 1976 plate carried "200YRS" for the U.S. Bicentennial. It marked the national 1776-1976 anniversary, not Missouri statehood.

