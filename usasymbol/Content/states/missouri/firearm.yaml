faq:
  - question: "What is the official state rifle of Missouri?"
    answer: "The official state rifle of Missouri is the Hawken Rifle, designated by Senate Bill 139 (SB 139), signed by Governor Mike Parson on July 6, 2023, with an effective date of August 28, 2023."
  - question: "Why is the Hawken rifle famous?"
    answer: "The Hawken Rifle was the premier firearm for Mountain Men and fur trappers heading west from St. Louis in the 19th century, prized for its extreme stopping power (.50-.54 caliber), reliability in wilderness conditions, and the precision craftsmanship of the Hawken brothers' St. Louis shop. It was carried by legendary figures including Kit Carson and Jim Bridger, and is often called the 'Rocky Mountain Rifle' for its central role in the fur trade era."
  - question: "Who made the original Hawken rifles?"
    answer: "Original Hawken rifles were made by brothers Jacob Hawken (1786–1849) and Samuel Hawken (1792–1884) at their gun shop in St. Louis, Missouri, from approximately 1815 to 1859. After Samuel's retirement, the shop was sold to J.P. Gemmer, who continued operating under the Hawken name until 1915. An estimated 1,000 original Hawken rifles were produced over the shop's history."
  - question: "What is the difference between a Hawken rifle and a Kentucky long rifle?"
    answer: "The Hawken Rifle was specifically redesigned for the Western Plains and Rocky Mountains: shorter barrel (34-36 inches vs. 40+ inches) for mounted use, larger caliber (.50-.54 vs. .40-.45) for stopping bison and grizzly bears, heavier construction for durability, and percussion cap ignition rather than the flintlock used on most Kentucky rifles. The Kentucky rifle excelled in eastern forest hunting; the Hawken was engineered for the open frontier."
  - question: "What Missouri legislation designated the Hawken Rifle as the state rifle?"
    answer: "Missouri Senate Bill 139 (SB 139), sponsored by Representative Mazzie Boyd in the House and Senator Jason Bean in the Senate, was signed by Governor Mike Parson on July 6, 2023, effective August 28, 2023. The bill was championed by gunsmith Greg Grimes, who advocated for years for the designation as recognition of Missouri's frontier heritage as the Gateway to the West."
