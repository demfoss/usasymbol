seo_title: "Missouri State Rifle: The Legendary Hawken \"Plains Rifle\""
seo_description: "Discover why the Hawken Rifle became Missouri's official state rifle in 2023. History of SB 139, the Hawken brothers, and its role in the American West."

intro_text: "In 2023, Missouri became the latest addition to the [guide to official state firearms and legislation](/symbols/firearms) — designating the Hawken Rifle as the official state rifle. This was not a ceremonial choice. The Hawken is the rifle that armed the Mountain Men who explored and mapped the American West, built by two brothers in St. Louis, the city that served as the literal gateway to the frontier. It is Missouri's weapon — conceived here, perfected here, and carried west from here by the men who opened a continent."

big_stat:
  number: "~1,000"
  description: "Estimated original Hawken rifles produced over 40 years of operation at the St. Louis shop — an artisan output that made each rifle a rare, handcrafted instrument rather than a mass-produced commodity. Today, verified originals command six-figure prices at auction."

timeline:
  - year: "1815"
    description: "Jacob Hawken opens a gun shop in St. Louis — the outfitting capital for westward expeditions. Brother Samuel joins the business by 1822, and the partnership begins refining what will become the definitive Plains Rifle."
  - year: "circa 1825"
    description: "The Hawken brothers develop their distinctive heavy-barreled, half-stock design — shorter than the Kentucky long rifle for use on horseback, with a larger bore (.50-.54 caliber) for stopping power against bison and grizzly. It becomes the preferred weapon of Mountain Men heading up the Missouri River."
  - year: "1820s–1840s"
    description: "The height of the Rocky Mountain fur trade. Trappers and explorers outfitting in St. Louis carry Hawkens into the wilderness. Kit Carson, Jim Bridger, and William Henry Ashley all carry Hawken rifles. The weapon earns its reputation as the most reliable firearm in the Western wilderness."
  - year: "1849"
    description: "Jacob Hawken dies. Samuel continues the shop alone until 1859, when he sells to J.P. Gemmer, who operates it under the Hawken name until 1915 — making the St. Louis address the longest continuously operated gunsmith tradition in American frontier history."
  - year: "July 6, 2023"
    description: "Governor Mike Parson signs Senate Bill 139, officially designating the Hawken Rifle as Missouri's state rifle. The bill was championed by gunsmith Greg Grimes, sponsored by Representative Mazzie Boyd and Senator Jason Bean, effective August 28, 2023."

expert_quote:
  text: "The Hawken was not simply a rifle — it was the essential tool of Western expansion. Every Mountain Man who headed up the Missouri River from St. Louis carried the knowledge that his Hawken would not fail him. That confidence was built into every barrel, hand-filed at a shop two blocks from the river."
  source: "Missouri History Museum — historical interpretation of the Hawken Gun Shop legacy, St. Louis"

sections:
  - id: "st-louis-hawken-shop"
    icon: "fa-shop"
    title: "The St. Louis Hawken Shop: Where History Was Forged"
    paragraphs:
      - "In 1815, a young German-American gunsmith named Jacob Hawken opened a shop in St. Louis — the last major city before the American frontier dissolved into unmapped territory. His brother Samuel joined him, and together they began building rifles for a very specific customer: the Mountain Man, the trapper, the explorer heading into country where a rifle malfunction was a death sentence."
      - "The Hawken brothers were craftsmen of rare precision. Their rifles were not the long, elegant Pennsylvania-style flintlocks of the eastern frontier. They were heavier, shorter, built for the demands of mounted travel, extreme weather, and encounters with animals — grizzly bears and bison — that the lighter eastern rifles simply could not reliably stop. Each rifle was made to order, hand-fitted, test-fired, and adjusted until it met the exacting standards the Hawken name demanded."
      - "Over approximately 40 years of production, the Hawken shop produced an estimated 1,000 original rifles. This was not mass production — it was artisan manufacture at its finest. A Hawken rifle was the most expensive and most coveted personal firearm on the American frontier. Owning one was a statement of serious intent — not unlike the [1847 Colt Walker pistol](/states/texas/firearm/1847-colt-walker), which Texas Rangers carried as their own irreplaceable frontier weapon. The Mountain Men who headed west from St. Louis knew exactly what they were carrying."
    subsections:
      - subtitle: "Jacob and Samuel Hawken: The Brothers Who Armed the West"
        text: "Jacob Hawken (1786–1849) was the master craftsman; Samuel (1792–1884) was the business partner who outlived his brother by 35 years and kept the shop operating until 1859, when he sold to J.P. Gemmer. The Gemmer shop continued under the Hawken name until 1915 — giving the St. Louis address a century of continuous gunsmithing tradition rooted in the same craft the brothers established."

  - id: "sb-139"
    icon: "fa-scale-balanced"
    title: "Senate Bill 139: The 2023 Designation"
    paragraphs:
      - "Senate Bill 139 was signed into law by Governor Mike Parson on July 6, 2023, with an effective date of August 28, 2023. The designation made Missouri one of the most recent states to join the national trend of official firearm designations — and the first to honor a weapon so directly tied to the state's identity as the Gateway to the West, a narrative also visible on the [Missouri state flag](/states/missouri/flag/missouri-state-flag)."
      - "The driving force behind the legislation was not a politician but a gunsmith. Greg Grimes, a Missouri firearms craftsman and Hawken enthusiast, spent years lobbying state legislators to recognize the Hawken Rifle's unique claim to Missouri's heritage. His argument was simple: no other firearm is more inseparable from Missouri's history. The rifle was made in Missouri, sold in Missouri, and carried west by men who departed from Missouri. St. Louis was where the frontier began, and the Hawken was what you carried when you crossed it, with civic framing close to the [Missouri state motto](/states/missouri/motto/salus-populi-suprema-lex-esto)."
      - "The bill was sponsored in the House by Representative Mazzie Boyd and in the Senate by Senator Jason Bean. Its passage marked the culmination of years of advocacy by Grimes and the Missouri firearms community — correcting what many historians considered a long-overdue oversight. Most rival websites still reference earlier failed attempts or misattribute the bill's sponsorship; SB 139 and its July 2023 signing date is the definitive legal record."
    subsections:
      - subtitle: "Legislation Snapshot: SB 139"
        list:
          - "**Sponsor (House):** Representative Mazzie Boyd"
          - "**Sponsor (Senate):** Senator Jason Bean"
          - "**Signed:** July 6, 2023 by Governor Mike Parson"
          - "**Effective:** August 28, 2023"
          - "**Designation:** Official state rifle of Missouri"
          - "**Advocate:** Greg Grimes, Missouri gunsmith and Hawken historian"

  - id: "rocky-mountain-rifle"
    icon: "fa-gears"
    title: "Why \"The Rocky Mountain Rifle\"? Technical Superiority on the Plains"
    paragraphs:
      - "The Hawken Rifle is often called the 'Rocky Mountain Rifle' or the 'Plains Rifle' — and these names carry technical meaning, not just geography. The Hawken was a deliberate redesign of the Kentucky Long Rifle for an entirely different environment. Where the Kentucky rifle was optimized for the wooded Eastern forests — long barrel for accuracy, lighter caliber for small game — the Hawken was engineered for the open plains and the Rocky Mountain wilderness."
      - "The most critical differences were barrel length, caliber, and ignition system. The Hawken's barrel was shorter (34–36 inches versus 40+ inches for a typical Kentucky rifle) — essential for a weapon used on horseback, where a 48-inch barrel becomes a hazard in the saddle. The caliber was larger: .50 to .54, compared to the Kentucky's typical .40–.45. When your target might be a 1,500-pound bison or a charging grizzly bear, stopping power is not a luxury."
      - "Perhaps most importantly, the Hawken transitioned from flintlock to percussion cap ignition — the technological advancement that made mountain use practical. Flintlocks are sensitive to wet conditions; the frizzen and flint must be kept dry for reliable ignition. In the mountain wilderness, with river crossings, rain, and morning condensation, a flintlock's reliability was a genuine liability. The percussion cap — a small copper cap struck by the hammer — works in nearly all weather conditions, giving the Hawken a critical edge over older designs in the field."
    subsections:
      - subtitle: "Hawken Rifle vs. Kentucky Long Rifle: Two Philosophies"
        list:
          - "**Barrel length:** 34-36 inches (Hawken) vs. 40-48 inches (Kentucky) — shorter for mounted use"
          - "**Caliber:** .50-.54 (Hawken) vs. .40-.45 (Kentucky) — larger for big game stopping power"
          - "**Ignition:** Percussion cap (Hawken) vs. flintlock (Kentucky) — more reliable in wet mountain conditions"
          - "**Stock:** Half-stock walnut or maple (Hawken) vs. full-stock (Kentucky) — lighter, better balance on horseback"
          - "**Weight:** 10-12 lbs (Hawken) vs. 7-9 lbs (Kentucky) — heavier barrel for long-range accuracy"
          - "**Purpose:** Mountain and Plains hunting (Hawken) vs. Eastern forest hunting and warfare (Kentucky)"

  - id: "famous-owners"
    icon: "fa-person"
    title: "Famous Owners: From Kit Carson to Jeremiah Johnson"
    paragraphs:
      - "The Hawken Rifle was not merely popular among Mountain Men — it was the weapon of the legends who defined the Mountain Man era. Kit Carson, the most celebrated scout and trapper in American frontier history, is closely associated with the Hawken. Jim Bridger, who discovered the Great Salt Lake and established Fort Bridger, carried one. William Henry Ashley, the fur trade entrepreneur whose annual Rocky Mountain Rendezvous defined trapper culture in the 1820s, outfitted his men through St. Louis — often through the Hawken shop directly."
      - "The rifle's cultural legacy survived the Mountain Man era through a remarkable revival in popular consciousness. In 1972, Sydney Pollack directed 'Jeremiah Johnson' — a film starring Robert Redford as a fur trapper in the Rocky Mountain wilderness. The film's central image of a lone mountain man with his Hawken rifle introduced the weapon to a generation that had never heard of it. The movie sparked a wave of Hawken reproductions, muzzleloader clubs, and historical interest that continues today. The Jeremiah Johnson Hawken is arguably the most recognized depiction of the rifle in modern popular culture."
    subsections:
      - subtitle: "Kit Carson, Jim Bridger, and the Hawken Legacy"
        text: "The connection between the Hawken Rifle and the Mountain Men was not coincidence — it was geography and commerce. St. Louis was the departure point for every major expedition into the Rockies in the 1820s–1840s. The Hawken shop was on the outfitting circuit alongside equipment outfitters and food suppliers who prepared men for months in the wilderness. To leave St. Louis for the mountains without a Hawken was to leave with a lesser weapon."
      - subtitle: "Jeremiah Johnson: The Film That Revived the Hawken"
        text: "The 1972 film 'Jeremiah Johnson,' starring Robert Redford, introduced the Hawken Rifle to a mass audience unfamiliar with frontier history. Set in the Rocky Mountain wilderness of the 1840s, the film depicted the Mountain Man lifestyle with unusual authenticity — including the Hawken as the essential personal weapon. Its commercial success directly drove a 1970s boom in Hawken reproductions and black-powder shooting sports, creating an entire industry of custom-built Hawken-style rifles that persists to this day."

  - id: "comparison"
    icon: "fa-scale-balanced"
    title: "Missouri Hawken vs. West Virginia Hall 1819: Two Philosophies"
    paragraphs:
      - "Missouri's Hawken Rifle and West Virginia's Hall Model 1819 represent the two opposing philosophies of early 19th-century American firearms manufacturing — and they were built just 200 miles apart, in the same era, for entirely different visions of what a rifle should be."
    subsections:
      - subtitle: "West Virginia Hall Model 1819: The Industrial Answer"
        text: "While the Hawken brothers were perfecting their artisan approach in St. Louis, John H. Hall was developing the opposite philosophy at Harpers Ferry — industrial manufacturing with fully interchangeable parts, precision machine tools, and assembly-line production. The Hall Model 1819 was the first military rifle produced with true interchangeable parts, born in the same decade the Hawken shop opened. One philosophy believed the craftsman's touch was irreplaceable; the other believed the machine could exceed the craftsman. Both were right — for different purposes and different customers."
        link:
          label: "View West Virginia State Firearm"
          url: "/states/west-virginia/firearm/hall-model-1819"
      - subtitle: "Kentucky Long Rifle: The Shared Ancestor"
        text: "Both the Hawken and the Hall 1819 evolved from the same tradition: the Pennsylvania/Kentucky long rifle that defined American marksmanship in the 18th century. The Hawken was an artisan refinement of that tradition — heavier, more powerful, adapted for the Western frontier. The Hall was its industrial negation — standardized, machine-made, optimized for military logistics over individual craftsmanship. Three rifles, three philosophies, three states, all descended from the same American gunmaking tradition."
        link:
          label: "View Kentucky State Firearm"
          url: "/states/kentucky/firearm/kentucky-long-rifle"

  - id: "where-to-see"
    icon: "fa-building-columns"
    title: "Where to See an Original Hawken Rifle Today"
    paragraphs:
      - "Original Hawken rifles — produced at the St. Louis shop between approximately 1815 and 1859 — are among the most sought-after American frontier firearms in existence. With an estimated 1,000 total produced over four decades and nearly two centuries of attrition, verified originals are rare, valuable, and concentrated in a handful of major collections."
    subsections:
      - subtitle: "Missouri History Museum — St. Louis, MO"
        text: "The Missouri History Museum in Forest Park, St. Louis, holds the most significant collection of Hawken-related artifacts in the world — including documented original Hawken rifles, period shop tools, and historical records from the St. Louis outfitting era. The museum's collections document the full arc of St. Louis as the Gateway to the West, with the Hawken as the centerpiece firearm of that story. For anyone seeking the original Hawken in its historical context, Forest Park is the definitive destination."
      - subtitle: "Missouri State Capitol — Jefferson City, MO"
        text: "The Missouri State Capitol in Jefferson City occasionally displays original Hawken rifles and related firearms artifacts as part of its historical collections. The Capitol's galleries document Missouri's role in American westward expansion, providing context for the Hawken designation and its place in the state's broader heritage — the same heritage that motivated gunsmith Greg Grimes's decade-long campaign to see the rifle officially recognized."
      - subtitle: "St. Louis Mercantile Library — St. Louis, MO"
        text: "The St. Louis Mercantile Library, one of the oldest subscription libraries west of the Mississippi, holds extensive collections related to the fur trade, the Mountain Men, and St. Louis's role as the frontier gateway. Their archives include period documents, maps, and historical records that illuminate the Hawken's place in the city's commercial and exploration history — providing the documentary context that complements the physical artifacts at the Missouri History Museum. The same westward current that passed through St. Louis also reached Indiana Territory, where craftsman John Small built the [Grouseland Rifle](/states/indiana/firearm/grouseland-rifle) — Indiana's official state firearm — in that same era."

