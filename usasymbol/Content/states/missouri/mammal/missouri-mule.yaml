sections:
  - id: "official-designation"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor Mel Carnahan signed House Bill 84 on May 31, 1995, designating the Missouri Mule as the official state animal. The bill's passage ended a campaign that began in 1993 when military veteran Charles 'Woody' Woodford and his wife Lois rallied mule owners, American Legion posts, and agricultural groups to support the designation."
      - "The Missouri General Assembly debated the measure for four and a half months before approving it on May 10, 1995—just days before the legislative session ended. Some lawmakers initially worried the mule's association with the donkey (symbol of the Democratic Party) would make the designation political, but supporters emphasized the animal belonged to Missouri's history, not partisan politics."

    subsections:
      - subtitle: "How It Became the State Symbol"
        text: "Charles Woodford served in the U.S. Navy during World War II and later in the Air Force for 21 years. During his military service, he witnessed Missouri mules hauling equipment and supplies, which gave him lasting respect for the animals. After earlier unsuccessful attempts by other advocates, Woodford organized a systematic campaign in 1993. He worked with Dr. C. Melvin Bradley, a University of Missouri professor who had spent decades documenting mule history, and Sue Cole, editor of Mules and More magazine. The team wrote letters, published articles, and organized public events demonstrating the mule's historical importance to Missouri."

      - subtitle: "Why Chosen"
        text: "Representatives Jerry McBride and Mary Kasten sponsored the bill, arguing the mule had already represented Missouri in public consciousness for over a century. During legislative hearings, Professor Bradley testified about Missouri's dominance in mule production—the state held 80% of the national market at its peak. Veterans emphasized the animals' wartime service, calling them fellow contributors to national defense. Governor Carnahan recalled that a mule was the first animal he ever rode growing up in rural Shannon County. The designation recognized values Missourians saw in the mule: patience, strength, intelligence, and steady effort under pressure rather than flashy displays."

  - id: "state-symbolism"
    title: "What the Missouri Mule Represents"
    style: "highlight"
    paragraphs:
      - "The Missouri Mule embodies the Show-Me State's reputation for practical skepticism and reliable hard work. Missouri earned its nickname 'Show-Me State' from Congressman Willard Vandiver's 1899 declaration that Missourians required proof rather than eloquence. The mule demonstrates this same character—cautious, intelligent, unwilling to take foolish risks, yet capable of tremendous work when properly directed, as described on the [Missouri nickname page](/states/missouri/nickname/the-show-me-state)."
      - "For over a century before the official designation, the mule already represented Missouri to the world. When people said 'Missouri Mule,' they meant not just any mule but the finest working animal produced anywhere—large, strong, intelligent, and steady. Missouri breeders developed these characteristics deliberately by crossing massive draft horses with mammoth jacks, creating animals superior to both horses and ordinary mules, a legacy echoed on the [Missouri state flag](/states/missouri/flag/missouri-state-flag)."
      - "The designation honors generations who depended on mule labor to build Missouri's economy. Mules plowed fields, hauled freight, pulled streetcars in cities, dragged logs from forests, moved coal from mines, and carried supplies in two world wars. The mule represents unpretentious excellence—animals that performed essential work without requiring admiration or special care, in line with principles stated in the [Missouri state motto](/states/missouri/motto/salus-populi-suprema-lex-esto)."

    subsections:
      - subtitle: "Missouri's Mule Industry Dominance"
        text: "In 1870, Missouri emerged as the largest mule-holding state in the United States, a title the state held until 1900. At the industry's peak, Missouri produced roughly 200,000 mules annually and controlled 80% of the national market. Major mule markets operated in St. Joseph, Kansas City, and Columbia, where dealers shipped animals throughout North America and overseas. The term 'Missouri Mule' became recognized worldwide after W.A. Elgin's six-mule hitch from Platte County swept the competition at the 1904 St. Louis Exposition. Missouri's reputation for quality meant buyers paid premium prices specifically for mules bred in the state."

      - subtitle: "Santa Fe Trail and Westward Expansion"
        text: "Missouri's mule industry began in 1822 when William Becknell's trading party returned from the Santa Fe Trail with Mexican mules and donkeys. Missouri breeders recognized frontier settlers needed hardy animals capable of enduring the 900-mile journey to Santa Fe and beyond. The large, intelligent draft mules they developed efficiently pulled wagons west, making Missouri the 'Gateway to the West' for hundreds of thousands of pioneers. By 1840, the mule trade flourished as westward expansion accelerated. Missouri mules became essential to frontier life—hauling household goods, farm equipment, and commercial freight to the Pacific coast across routes connected to [states neighboring states](/rankings/geography/states-neighboring-states)."

      - subtitle: "World War I Service"
        text: "The Guyton and Harrington company of Lathrop, Missouri, won an exclusive contract with the British Army to supply over 350,000 Missouri mules and horses for service in World War I. The U.S. exported approximately 232,000 mules during the war, many from Missouri. These animals hauled artillery, transported ammunition, pulled supply wagons, and carried wounded soldiers across the battlefields of France and Belgium. Military commanders prized Missouri mules for their strength, endurance, and ability to work in harsh conditions. The animals' wartime service demonstrated Missouri's importance to national defense and established the mule as a patriotic symbol alongside its economic significance."

      - subtitle: "Harry Truman and the Missouri Mule"
        text: "President Harry Truman, born in Lamar, Missouri, and raised on a farm near Independence, grew up working with mules. His family's farm relied on mule teams for plowing and hauling, giving young Truman direct experience with the animals' reliability and strength. When Truman took office in 1949, he included a Missouri mule team in his inaugural parade—a choice that celebrated his rural Missouri roots and the animals that built the state. This moment placed the Missouri mule at the center of national attention, reinforcing the connection between Missouri identity and the patient, hardworking character the animal represented."

      - subtitle: "The 'Stubborn as a Missouri Mule' Reputation"
        text: "The expression 'stubborn as a Missouri Mule' emerged from the animal's intelligent caution rather than actual stubbornness. Mules possess superior cognitive intelligence compared to horses or donkeys—a result of hybrid vigor that produces heightened awareness and decision-making ability. Missouri mules developed a reputation for refusing foolish or dangerous commands, which handlers sometimes mistook for stubbornness. Farmers with clay soil found Missouri mules superior as plow animals because the animals worked steadily without the impatience horses showed under heavy loads. The phrase came to describe Missourians themselves—people who insisted on proof, resisted hasty decisions, but worked tirelessly once committed to a course of action."

  - id: "identification"
    title: "How to Identify the Missouri Mule"
    style: "default"

    subsections:
      - subtitle: "Physical Description"
        text: "The typical Missouri Mule results from breeding a mare of draft horse stock (such as Belgian, Percheron, or Clydesdale) with a mammoth jack (large male donkey). This cross produces a stout, powerful animal combining the horse's size and strength with the donkey's endurance, caution, and hardiness. Missouri breeders specifically selected for larger size, greater strength, and more manageable temperament than ordinary mules, creating animals that could handle the heaviest farm and industrial work."
        list_items:
          - "**Size**: Draft mules stand 15-17 hands (60-68 inches) at the shoulder; saddle mules 14-16 hands; miniature show mules 36-48 inches"
          - "**Weight**: Draft mules 900-1,200 pounds; saddle mules 600-900 pounds; weight distributed for power rather than speed"
          - "**Appearance**: Longer ears than horses but shorter than donkeys; straight back without prominent withers; thick neck; broad chest; powerful hindquarters"
          - "**Features**: Stronger, harder hooves than horses requiring less farrier work; skin more resistant to sun and rain; natural disease resistance; exceptional sure-footedness on rough terrain"

      - subtitle: "Behavior and Temperament"
        text: "Missouri mules display higher cognitive intelligence than either parent species. They exhibit caution rather than skittishness, evaluating situations before acting. This trait makes them safer workers than horses, as mules refuse commands that might result in injury. Missouri breeders selected for even temperament and willingness to work, producing animals that tolerate repetitive tasks without becoming sour. Mules show less tolerance toward dogs than horses do and can strike with any hoof in any direction, including sideways. Properly trained Missouri mules work steadily for hours without showing the impatience or nervous behavior horses display under heavy loads."

  - id: "in-the-state"
    title: "Missouri Mules Today"
    style: "default"
    paragraphs:
      - "Missouri's mule population declined sharply after World War II as tractors replaced animal power on farms. Widespread mechanization during the 1940s and 1950s eliminated most working roles mules had filled for over a century. The animals nearly vanished from Missouri agriculture except in Amish communities and among traditional farmers who preferred their reliability for small-scale operations."
      - "Today Missouri mules primarily serve recreational purposes and maintain cultural traditions. Mule shows at county fairs and the Missouri State Fair in Sedalia demonstrate the animals' enduring appeal. Saddle mules enjoy growing popularity for trail riding, competitive events, and ranch work. Draft mule enthusiasts preserve traditional farming techniques at historical demonstrations. The University of Missouri maintains its mule mascot tradition, and specialized breeders continue producing quality animals for domestic and foreign markets."

    facts:
      - "**Historical Centers**: St. Joseph, Kansas City, and Columbia operated major mule markets serving national and international buyers from 1870-1940"
      - "**Current Production**: Missouri maintains small but steady mule breeding industry; show animals command premium prices for confirmation and temperament"
      - "**Educational Role**: Agricultural colleges and historical societies use mules to teach traditional farming methods and Missouri's economic history"

  - id: "where-to-see"
    title: "Where to See Missouri Mules"
    style: "default"
    paragraphs:
      - "Missouri offers several opportunities to see and learn about the state animal. These locations provide insight into both historical and contemporary mule culture in the state."

    list_items:
      - "**Missouri State Fair (Sedalia)**: Held annually in August, featuring extensive mule shows including draft mule competition, saddle mule events, and miniature mule exhibitions. The fair draws exhibitors from across the state and nation."
      - "**University of Missouri (Columbia)**: Home of Truman the Mule, the university's live mascot since the 1920s. The mascot represents the state animal at football games and university events. Campus also houses historical exhibits about Missouri's mule industry."
      - "**Missouri State Capitol (Jefferson City)**: Features displays about state symbols including the mule's history and economic importance. Tour guides explain the animal's role in Missouri's development and its path to becoming the official state animal."

  - id: "current-status"
    title: "Current Status and Conservation"
    style: "default"
    paragraphs:
      - "The Missouri Mule faces no conservation concerns as a domestic hybrid animal. Mules cannot reproduce naturally—nearly all are sterile because horses (64 chromosomes) and donkeys (62 chromosomes) produce offspring with 63 chromosomes. Maintaining mule populations requires continuous breeding programs pairing horses and donkeys."
      - "Modern Missouri mule breeding focuses on quality over quantity. Specialized breeders produce animals for showing, trail riding, and working ranches. These operations maintain the Missouri reputation for superior mules by selecting parent stock for size, temperament, and conformation. Interest in traditional farming methods and competitive mule events supports a small but stable breeding industry."

    subsections:
      - subtitle: "Cultural Preservation Efforts"
        text: "Several organizations work to preserve Missouri's mule heritage and promote contemporary uses. The Missouri Mule Association organizes shows and educational events demonstrating the animals' capabilities and historical significance. Living history farms including the Watkins Woolen Mill State Historic Site near Excelsior Springs use mules for demonstrations of 19th-century farming techniques. The annual Missouri Mule Day celebration in various communities keeps mule culture alive through competitions, parades, and historical presentations. These efforts ensure new generations understand why the mule represents Missouri identity."

  - id: "symbol-connections"
    title: "Connections to Other Missouri Symbols"
    style: "default"
    paragraphs:
      - "The Missouri Mule connects deeply to the state's other symbols, each reinforcing Missouri's historical identity and values. The mule's selection as state animal reflected the same practical character expressed in Missouri's motto, nickname, and cultural traditions."

    subsections:
      - subtitle: "State Motto: 'Salus Populi Suprema Lex Esto'"
        text: "Missouri's motto translates as 'The welfare of the people shall be the supreme law.' The mule exemplifies this principle through generations of service improving Missourians' welfare. Mules plowed fields increasing food production, hauled goods creating commerce, powered industry generating employment, and served in wars protecting national security. The animal contributed to people's welfare not through symbolism but through actual daily work—exactly the practical approach Missouri's motto demands. The 1995 designation recognized that mules had served the people's welfare more consistently than perhaps any other single factor in Missouri's economic development."
        link:
          label: "See Missouri state motto"
          url: "/states/missouri/motto/salus-populi-suprema-lex-esto"

      - subtitle: "State Nickname: 'Show-Me State'"
        text: "Congressman Willard Vandiver coined Missouri's nickname in 1899, declaring 'I'm from Missouri. You've got to show me.' The mule embodies this skeptical, proof-demanding character. Mules refuse to follow commands that might cause injury, requiring handlers to show them safe paths rather than forcing obedience. Missouri breeders showed the world superior mules through actual performance rather than advertising—letting the animals prove their worth at competitions and through decades of reliable work. The connection between Missouri's nickname and the state animal's behavior reinforces shared values of intelligent caution and demonstrated competence over empty promises."

      - subtitle: "State Flag and Seal: Grizzly Bears"
        text: "Missouri's state flag and seal feature two grizzly bears representing courage and strength. While grizzlies never lived in Missouri (the seal's designers chose them for symbolic power), the mule actually demonstrated those qualities building the state. Both symbols celebrate strength, but the mule did so through work rather than ferocity. The bears stand on a scroll bearing the state motto about people's welfare—the same principle the mule served through generations of labor. Together, these symbols suggest Missouri values strength directed toward productive purposes rather than mere display of power."
        link:
          label: "See Missouri state flag"
          url: "/states/missouri/flag/missouri-state-flag"

      - subtitle: "State Horse: Missouri Fox Trotting Horse"
        text: "Missouri designated the Missouri Fox Trotting Horse as the official state horse in 2002, seven years after adopting the mule as state animal. Both animals demonstrate Missouri's historical expertise in equine breeding and the state's agricultural heritage. The Fox Trotter, developed in the Ozark Mountains during the 1820s-1830s, shares the mule's reputation for sure-footedness on rough terrain and steady, reliable temperament. Both animals represented practical solutions Missouri farmers and settlers needed rather than breeds developed purely for sport or show. The dual designation acknowledges Missouri's contributions to American equine culture through both horses and mules."
        link:
          label: "See Missouri state horse"
          url: "/states/missouri/mammal/missouri-fox-trotter-horse"

