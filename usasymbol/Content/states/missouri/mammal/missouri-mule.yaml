faq:
  - question: "What is Missouri's state animal?"
    answer: "Missouri's state animal is the Missouri Mule (Equus asinus x Equus caballus), designated in 1995. The mule is a hybrid offspring of a female horse (mare) and a male donkey (jack)."

  - question: "When did the Missouri Mule become the state animal?"
    answer: "Governor Mel Carnahan signed House Bill 84 on May 31, 1995, making the Missouri Mule the official state animal. The campaign for designation began in 1993, led by military veteran Charles Woodford and his wife Lois."

  - question: "Why did Missouri choose the mule as its state animal?"
    answer: "Missouri chose the mule to honor the animal's role building the state's economy and reputation. Missouri led the nation in mule production from 1870-1900 and supplied over 350,000 mules during World War I. The mule represents Missouri values of hard work, patience, and practical intelligence—the same qualities expressed in the state's 'Show-Me' nickname."

  - question: "Can mules reproduce?"
    answer: "Nearly all mules are sterile and cannot reproduce naturally. Mules result from crossing two species with different chromosome counts (horses have 64, donkeys have 62), producing offspring with 63 chromosomes. This odd number prevents proper cell division during reproduction. Maintaining mule populations requires continuous breeding programs pairing horses and donkeys."

  - question: "What is a Missouri Mule?"
    answer: "A Missouri Mule typically results from breeding a draft horse mare (such as Belgian, Percheron, or Clydesdale) with a mammoth jack (large male donkey). Missouri breeders developed larger, stronger mules with better temperament than ordinary mules, creating animals that could handle heavy farm and industrial work. The term 'Missouri Mule' became recognized worldwide as indicating superior quality."

  - question: "Why are Missouri Mules famous?"
    answer: "Missouri Mules became famous for their size, strength, intelligence, and reliability. W.A. Elgin's six-mule hitch from Platte County swept the competition at the 1904 St. Louis Exposition, bringing national attention to Missouri breeding superiority. Missouri controlled 80% of the national mule market at its peak and supplied hundreds of thousands of mules for military service in both World Wars."

  - question: "Where can I see Missouri Mules today?"
    answer: "You can see Missouri Mules at the Missouri State Fair in Sedalia (August), at the University of Missouri campus (home of Truman the Mule mascot), and at various county fairs throughout the state. Some working farms and historical sites also demonstrate traditional mule-powered farming techniques. Specialized breeders throughout Missouri continue producing show-quality mules."

  - question: "What does 'stubborn as a Missouri Mule' mean?"
    answer: "The expression 'stubborn as a Missouri Mule' actually describes intelligent caution rather than true stubbornness. Mules possess superior cognitive intelligence compared to horses or donkeys and refuse commands that might cause injury. This sensible self-preservation was sometimes mistaken for stubbornness by inexperienced handlers. The phrase came to describe Missourians' reputation for demanding proof and resisting hasty decisions—the same quality reflected in the state's 'Show-Me' nickname."

