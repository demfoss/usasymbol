seo_title: "Missouri State Flag | Bears, History & Meaning"
seo_description: "Missouri's flag features two grizzly bears and a tricolor echoing French Louisiana. The seal holds a rare neutrality declaration. What the 24 stars and bears mean."

intro_text: "The Missouri state flag was adopted in 1913 and features the state coat of arms on three horizontal stripes. Two grizzly bears support a shield in the center. Twenty-four stars surround the coat of arms representing Missouri as the twenty-fourth state. This page appears in the [list of U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Missouri State Flag Is Designed"
    paragraphs:
      - "The Missouri state flag is the official flag of Missouri. Three horizontal stripes cover the background. Red on top, white in the middle, blue on the bottom. The state coat of arms appears in the center with two bears supporting a shield."
      - "Twenty-four stars form a circle around the coat of arms. A ribbon with the state motto wraps below. State buildings, schools, and public venues across Missouri display this flag, with wording tied to the [Missouri state motto](/states/missouri/motto/salus-populi-suprema-lex-esto)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Missouri Flag Communicates"
    paragraphs:
      - "The flag represents Missouri through the coat of arms. The shield shows a grizzly bear and a crescent moon. The bear symbolizes strength. The crescent marks Missouri as frontier territory before statehood in a region visible in [states neighboring states](/rankings/geography/states-neighboring-states)."
      - "Two bears support the shield. They represent courage and bravery. Twenty-four stars circle the design. Missouri entered as the twenty-fourth state in 1821."
      - "Red, white, and blue honor the United States flag. Red represents valor. White symbolizes purity. Blue stands for vigilance and justice, matching the palette on the [Missouri state colors page](/states/missouri/color/missouri-traditional-state-colors-red-white-and-blue)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Missouri Flag History and Adoption"
    paragraphs:
      - "Missouri established its flag in 1913. Marie Elizabeth Oliver designed it. She lived in Cape Girardeau. Her husband R.B. Oliver had served as state senator. The state held a design competition. Lawmakers picked her submission from nearly one hundred entries, during the same era that shaped [The Show-Me State nickname](/states/missouri/nickname/the-show-me-state)."
      - "The coat of arms predated the flag. Missouri adopted it in 1822. That was one year after statehood. The 1913 flag incorporated this existing symbolism."
      - "The design has remained unchanged since adoption. Missouri standardized specifications for proportions and colors. The flag still uses the coat of arms created in the early nineteenth century."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Missouri Flag"
    symbols:
      - id: coat-of-arms
        name: "Missouri Coat of Arms"
        image: "symbols/coat-of-arms.svg"
        paragraphs:
          - "The coat of arms dominates the center. A shield displays a grizzly bear on the left. A crescent moon sits on the right. The bear represents courage and strength. The crescent symbolizes Missouri as a frontier state."
          - "Two grizzly bears stand on either side as supporters. They rest on a scroll with the motto Salus Populi Suprema Lex Esto. That's Latin. It means Let the welfare of the people be the supreme law."
          - "The national coat of arms appears above. An eagle holds arrows and an olive branch. Twenty-four stars surround everything in a circle. A cloud with more stars sits at the top. Those represent future states after Missouri."

      - id: bears
        name: "Grizzly Bears"
        image: "symbols/bears.svg"
        paragraphs:
          - "Two grizzly bears flank the shield. Bears symbolize strength in heraldic tradition. Missouri chose grizzlies to represent frontier character and wilderness."
          - "Grizzly bears weren't native to Missouri. They represented the untamed West beyond state borders. The bears connected Missouri to westward expansion."
          - "Missouri belongs to a small group of [states with bears on the flag](/collections/flags/states-with-bears-on-the-flag), each using the grizzly as a heraldic emblem of strength and frontier identity."

      - id: stars
        name: "Twenty-Four Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Twenty-four stars form a circle around the coat of arms. Missouri entered as the twenty-fourth state on August 10, 1821. The circle symbolizes unity among states."
          - "More stars appear in a cloud above the eagle. These represent states that joined after Missouri. The cloud suggests growth and the expanding nation."

      - id: stripes
        name: "Tricolor Stripes"
        image: "symbols/stripes.svg"
        paragraphs:
          - "Three horizontal stripes form the background. Red on top. White in the middle. Blue on the bottom. These match the United States flag colors."
          - "Equal width stripes emphasize balance. They create a patriotic foundation for the state coat of arms."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Missouri State Flag Colors"
    paragraphs:
      - "The flag uses red, white, and blue. Red represents valor and courage. White symbolizes purity and innocence. Blue stands for vigilance and justice. These meanings match the United States flag and align with the [official Missouri state tree](/states/missouri/tree/flowering-dogwood) as a companion natural symbol in civic materials."
    colors:
      - name: "Red"
