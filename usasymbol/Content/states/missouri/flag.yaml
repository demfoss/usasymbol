  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Missouri State Flag Facts"
    facts:
      - "Missouri adopted its state flag in 1913"
      - "Marie Elizabeth Oliver designed the flag"
      - "The flag features twenty-four stars for Missouri as the 24th state"
      - "Two grizzly bears support the state coat of arms"
      - "The state motto appears in Latin on the coat of arms"
      - "The coat of arms dates to 1822, predating the flag by 91 years"

faq:
  - question: "What is the official state flag of Missouri?"
    answer: "The Missouri state flag is the official banner of Missouri. It features the state coat of arms with two grizzly bears, a shield, and twenty-four stars on three horizontal stripes of red, white, and blue."

  - question: "How would you describe the design of the Missouri state flag?"
    answer: "The flag shows three horizontal stripes in red, white, and blue. The state coat of arms sits in the center with two bears supporting a shield. Twenty-four stars circle the coat of arms."

  - question: "How do historians explain the symbolism of Missouri's flag?"
    answer: "The flag represents Missouri's frontier heritage and position as the twenty-fourth state. The bears symbolize strength and courage. The stripes honor the United States flag."

  - question: "What symbols appear on the Missouri state flag?"
    answer: "Twenty-four stars appear in a circle around the coat of arms, representing Missouri as the twenty-fourth state admitted to the Union in 1821."

  - question: "Who is credited with the design of Missouri's flag?"
    answer: "Marie Elizabeth Oliver of Cape Girardeau designed the Missouri state flag. She won a design competition in 1913."

  - question: "When was the present Missouri flag approved in law?"
    answer: "Missouri adopted its state flag in 1913, though the coat of arms featured on it dates to 1822."

