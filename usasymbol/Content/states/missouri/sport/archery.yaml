sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Missouri State Sport
    paragraphs:
      - "Missouri designated archery its official state sport in 2022, and the choice rested on more than casual interest in bow hunting. The state produced the sport's most consequential modern invention and later built a permanent home for its history. Missouri is both the birthplace of the compound bow and the site of the sport's national hall of fame."

  - id: what-is
    icon: fa-solid fa-bullseye
    title: "Archery in Missouri"
    paragraphs:
      - "Archers draw a bow and release an arrow toward a target, scoring points based on how close each shot lands to the center rings. Competitive formats range from target archery on a marked range to field archery over uneven outdoor courses and 3D archery aimed at foam animal targets. Missouri's mix of forests, hills, and hunting land supports all three styles across the state."
      - "The Archery Hall of Fame and Museum sits inside the Bass Pro Shops flagship store in Springfield, spread across roughly 3,500 square feet on the building's fourth floor. Its collection includes about 1,500 artifacts tied to inducted archers, among them a bow and quiver once used by Geronimo. Visitors can walk the exhibit for free as part of the store."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Archery Represents Missouri
    paragraphs:
      - "Missouri's claim on archery starts with a single invention. Holless Wilbur Allen, a Missouri bowyer, spent the 1960s sawing the limbs off recurve bows and adding pulleys to each end, arriving at the compound bow design in 1966 and patenting it in 1969, the same era he moved to Billings, Missouri. That design replaced the traditional bow for most modern hunters and competitive archers within a generation."
      - "Springfield built on that connection by giving the sport a permanent home. The Archery Hall of Fame, founded in 1971, moved into a dedicated space inside Bass Pro Shops' Springfield headquarters in 2012, placing the sport's history inside one of the state's most visited attractions. Allen himself was inducted into the Hall of Fame in 2010."
      - "Archery also has practical roots in Missouri's outdoor culture. The state's hunting seasons draw heavily on bow hunters every fall, and 3D and field archery courses take advantage of the same forests and hill country that shaped Allen's original design work. That combination of invention, institution, and daily use made archery a distinct choice among the sports Missouri could have picked."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Archery Became Missouri's State Sport
    paragraphs:
      - "Archery's path to becoming Missouri's state sport began as a standalone bill from Representative Tim Taylor, a member of the Missouri Legislative Sportsmen's Caucus. In the final week of the 2022 session, the Senate attached the archery designation as a floor amendment to a broader bill, and Governor Mike Parson signed it into law on July 1, 2022. The move made Missouri the first and only state to name archery its official sport."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Archery Facts
    facts:
      - "Missouri designated archery its official state sport in 2022, the first and only state to do so."
      - "Governor Mike Parson signed the archery designation into law on July 1, 2022."
      - "Compound bow inventor Holless Wilbur Allen arrived at his design in 1966, patented it in 1969, and moved to Billings, Missouri, around the same time."
      - "The Archery Hall of Fame and Museum has occupied a dedicated space inside Bass Pro Shops in Springfield since 2012."
      - "Allen was inducted into the Archery Hall of Fame in 2010."

