faq:
  - question: What is Missouri's state sport?
    answer: "Missouri's official state sport is archery, adopted in 2022."
  - question: When did Missouri adopt archery as its state sport?
    answer: "Missouri adopted archery as its state sport on July 1, 2022, when Governor Mike Parson signed the bill into law."
  - question: Why did Missouri choose archery?
    answer: "Compound bow inventor Holless Wilbur Allen lived in Missouri, and the Archery Hall of Fame and Museum has been housed in Springfield since 2012. Missouri became the only state to name archery its official sport."
  - question: Is Missouri the only state with archery as its official sport?
    answer: "Yes. Missouri is the first and only state in the country to designate archery as its official state sport."

