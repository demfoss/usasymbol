seo_title: "Missouri State Motto | Salus Populi Suprema Lex Esto"
seo_description: "Missouri's state motto is \"Salus Populi Suprema Lex Esto,\" Latin for \"Let the welfare of the people be the supreme law.\" Adopted January 11, 1822."

intro_text: "Missouri's state motto is <strong>Salus Populi Suprema Lex Esto</strong>, a Latin phrase meaning <em>Let the Welfare of the People Be the Supreme Law</em>. The phrase comes from Cicero's <em>De Legibus</em> (On Laws), written in the final years of the Roman Republic, and was adopted as part of Missouri's state seal on January 11, 1822."

