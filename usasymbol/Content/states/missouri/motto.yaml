title: "Salus Populi Suprema Lex Esto"
language: "Latin"
english_translation: "The welfare of the people shall be the supreme law"
adopted_year: 1822

author: "USA Symbol Team"
date_published: "2025-12-03"
date_modified: "2026-03-27"
seo_title: "Missouri State Motto | Salus Populi Suprema Lex Esto! The welfare of the people shall be the supreme law!"
seo_description: "Missouri's motto comes from Cicero's De Legibus (50 BCE), and John Locke quoted the same phrase as the epigraph for his Second Treatise on Government — the book that directly shaped Jefferson's Declaration of Independence. Judge Robert William Wells chose it in 1822 and wrote a detailed explanation of his choices 25 years later."

intro_text: "Missouri's state motto is <strong>Salus Populi Suprema Lex Esto</strong> — Latin for <em>The welfare of the people shall be the supreme law</em>. The phrase comes from Cicero's <em>De Legibus</em>, written around 50 BCE. John Locke later used the same phrase as the epigraph for his Second Treatise on Government — the work that directly shaped Jefferson's Declaration of Independence. Judge Robert William Wells proposed the motto for the Missouri seal in 1822 and, unusually, left behind a detailed 1847 written explanation of why he chose each element — 25 years after the fact."

sections:
  - id: "cicero-to-locke-to-jefferson"
    icon: "fa-solid fa-book-open"
    title: "From Cicero to Locke to the Declaration of Independence"
    paragraphs:
      - "Cicero wrote the phrase 'Salus populi suprema lex esto' in <em>De Legibus</em> (On the Laws), Book III, around 50 BCE, in a discussion about the proper duties of magistrates. The maxim appeared in a context arguing that law exists to serve the people's welfare, not rulers' interests. The phrase was widely known among educated Europeans for two thousand years."
      - "John Locke chose the phrase as the epigraph for his Second Treatise of Government, published in 1689. The Second Treatise laid out the theory that governments derive their legitimacy from the consent of the governed, and that people have the right to overthrow a government that fails to serve their welfare. Thomas Jefferson read Locke extensively. The Declaration of Independence's central argument — that governments are instituted to secure the rights of the people, and can be altered or abolished when they fail — follows Locke's framework."
      - "Judge Robert William Wells, who designed Missouri's seal in 1822, was a classically educated lawyer who knew both Cicero and Locke. Choosing this particular maxim was not accidental: it placed Missouri's governing philosophy in a lineage running from Roman law through Enlightenment political theory to the founding documents of American democracy."

  - id: "wells-design-and-explanation"
    icon: "fa-solid fa-landmark"
    title: "Wells Designed the Seal in 1822 and Explained It 25 Years Later"
    paragraphs:
      - "Robert William Wells was born in Maryland in 1795 and moved to Missouri Territory in 1818, where he served as a state circuit judge. When Missouri's General Assembly needed a Great Seal in late 1821, Wells received the commission. He brought deep classical learning to the task and completed the design in early 1822. The legislature approved it on January 11, 1822."
      - "Wells designed a seal dense with symbolic meaning. A shield divided into two parts shows a grizzly bear on the right side (representing Missouri) and the U.S. coat of arms on the left (representing the Union). Two grizzly bears support the shield as heraldic supporters. A crescent moon above the shield represented Missouri as a new state. The helmet above indicated Missouri was a state of the Union, not a kingdom. A scroll beneath the bears carries the motto."
      - "In 1847 — 25 years after designing the seal — Wells wrote a detailed explanation of his design choices. He specifically addressed the motto, explaining that the foundation of state government rests on the public good and that citizens should understand this principle when viewing the seal. The explanation shows that Wells thought carefully about each element and wanted the motto to be understood as a governing philosophy, not decoration."

  - id: "missouri-compromise-context"
    icon: "fa-solid fa-scale-balanced"
    title: "A Motto About Public Welfare, Adopted During a Slavery Compromise"
    paragraphs:
      - "Missouri became the 24th state on August 10, 1821, after one of the most contentious congressional debates in American history. The question was whether Missouri would enter as a slave state. Northern congressmen objected that expanding slavery violated the nation's founding principles. The Missouri Compromise of 1820 resolved the deadlock: Missouri entered as a slave state while Maine entered as a free state, and slavery was prohibited north of the 36°30' parallel in remaining Louisiana Territory."
      - "The Missouri Compromise was itself a declaration about 'the welfare of the people' and whose welfare counted — a question the motto's Ciceronian origins did not resolve. Wells designed the seal within months of this politically charged admission. He chose a maxim about public welfare as the supreme law at a moment when Missouri's public had just achieved statehood through a compromise that maintained slavery."
      - "The motto's universalist language — 'the welfare of the people' — existed in tension with Missouri's actual legal structure. Missouri didn't abolish slavery until 1865. The phrase from Cicero and Locke, both of whom wrote about natural law and human rights, sat above the legal apparatus of a slave state for more than four decades."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Missouri State Motto Facts"
    style: "gradient"
    facts:
      - "The phrase comes from Cicero's De Legibus, Book III, written around 50 BCE."
      - "John Locke used the same phrase as the epigraph for his Second Treatise of Government — which directly shaped Jefferson's Declaration of Independence."
      - "Judge Robert William Wells designed the seal in 1822 and wrote a detailed explanation of his choices in 1847, 25 years later."
      - "Missouri became the 24th state on August 10, 1821, after the Missouri Compromise settled the slavery question."
      - "Two grizzly bears support the shield on Missouri's seal — the only state seal featuring grizzlies as heraldic supporters."
      - "The motto exists only within the Great Seal statute — Missouri never passed a standalone motto law."

faq:
  - question: "What is Missouri's state motto?"
    answer: "Missouri's state motto is 'Salus Populi Suprema Lex Esto,' a Latin phrase meaning 'The welfare of the people shall be the supreme law.' It was adopted on January 11, 1822, as part of Missouri's Great Seal."

  - question: "Where does Missouri's motto come from?"
    answer: "From Cicero's De Legibus (On the Laws), Book III, written around 50 BCE. John Locke later used the same phrase as the epigraph for his Second Treatise of Government — the foundational text behind the Declaration of Independence. Judge Robert William Wells chose the phrase when designing the Missouri seal in 1822."

  - question: "What language is Missouri's motto written in?"
    answer: "Latin. 'Salus Populi Suprema Lex Esto' is classical Latin from Cicero. 'Salus' means welfare or wellbeing, 'populi' means of the people, 'suprema' means supreme, 'lex' means law, and 'esto' is a command form meaning 'shall be' or 'let it be.'"

  - question: "When did Missouri adopt its motto?"
    answer: "January 11, 1822, when the General Assembly approved the Great Seal designed by Judge Robert William Wells. Missouri became a state on August 10, 1821 — the motto was adopted five months later."

  - question: "Why did Missouri choose that motto?"
    answer: "Judge Wells, a classically educated lawyer, chose the Ciceronian maxim to express that government's purpose is to serve the public welfare. He explained this explicitly in 1847, writing that the foundation of state government rests on public good. The phrase also appeared in Locke's Second Treatise, which Jefferson and Madison had read — placing Missouri's motto in a direct line from ancient Rome to American democracy."

  - question: "Where does Missouri's motto appear?"
    answer: "On Missouri's Great Seal (on a scroll beneath two grizzly bears supporting the state shield, with Roman numerals MDCCCXX below), on the state flag (adopted 1913, three horizontal stripes of red, white, and blue with the seal at center), and on official documents, letterhead, and government buildings."

