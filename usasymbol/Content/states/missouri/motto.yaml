sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Missouri State Motto"
    paragraphs:
      - "Missouri's state motto is <strong>Salus Populi Suprema Lex Esto</strong>, a Latin phrase meaning <em>Let the Welfare of the People Be the Supreme Law</em>. It was adopted as part of the Missouri state seal on January 11, 1822, about five months after Missouri became the 24th state on August 10, 1821."
      - "The phrase comes directly from Cicero's <em>De Legibus</em> (On Laws), Book III. Missouri is one of the few U.S. states whose motto quotes a specific classical author and work."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of \"Salus Populi Suprema Lex Esto\""
    paragraphs:
      - "<em>Salus</em> means <em>welfare</em>, <em>safety</em>, or <em>wellbeing</em>. <em>Populi</em> is the genitive of <em>populus</em>, meaning <em>of the people</em>. <em>Suprema</em> means <em>supreme</em> or <em>highest</em>. <em>Lex</em> means <em>law</em>. <em>Esto</em> is an imperative form of <em>to be</em>, translated as <em>let it be</em> or <em>shall be</em>."
      - "Together: <em>Let the welfare of the people be the supreme law</em>. The phrase states a governing principle: above all other laws and interests, the wellbeing of citizens comes first."

  - id: meaning
    icon: "fa-solid fa-scale-balanced"
    title: "Missouri State Motto Meaning"
    paragraphs:
      - "The motto sets a standard for government: the welfare of the people is the highest obligation. It does not describe courage or military strength, as many state mottos do. It describes a duty."
      - "In Cicero's original text, the full passage reads: <em>Ollis salus populi suprema lex esto</em>, where <em>ollis</em> is an archaic Latin dative meaning <em>for them</em>. Cicero was writing about the obligations of military commanders. Missouri dropped <em>ollis</em>, turning a conditional instruction into a universal statement."
      - "That small change shifts the meaning significantly. Cicero's version applied to a specific group. Missouri's version applies without qualification: the welfare of the people is the supreme law, for everyone."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Missouri's State Motto"
    paragraphs:
      - "Missouri was admitted to the Union on August 10, 1821, as the 24th state. The Missouri General Assembly began work on a state seal almost immediately. Judge Robert William Wells designed the seal, and the Assembly adopted it on January 11, 1822."
      - "Wells drew the motto from Cicero's <em>De Legibus</em> (On Laws), Book III, a work on Roman law and government. Educated lawyers of the early 19th century knew classical texts well, and Latin mottos from Cicero and Virgil were common choices for state seals. Wells's choice placed Missouri's founding principle in a tradition reaching back to the late Roman Republic."
      - "The motto has remained unchanged since 1822. Missouri has had no separate legislation designating it as the state motto — it exists as part of the state seal statute and has been recognized as the official motto through that connection."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Salus Populi Suprema Lex Esto\" on the Missouri State Seal"
    paragraphs:
      - "The motto appears on a scroll beneath two grizzly bears at the bottom of the state seal. The bears support a shield divided into two halves: the left side shows the U.S. coat of arms, and the right side shows a grizzly bear with a crescent moon above. Around the outer circle of the seal, another phrase reads <em>United We Stand, Divided We Fall</em>."
      - "Above the shield, a crest features a bald eagle with 24 stars, representing Missouri as the 24th state. The outer ring reads: <em>The Great Seal of the State of Missouri</em>."
      - "Missouri's state flag, officially approved in 1913, displays the state seal at center with the motto visible on the scroll beneath the bears."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Missouri State Motto Facts"
    style: "gradient"
    facts:
      - "\"Salus Populi Suprema Lex Esto\" means \"Let the Welfare of the People Be the Supreme Law.\""
      - "The phrase comes from Cicero's De Legibus (On Laws), Book III — written in the final years of the Roman Republic."
      - "Missouri dropped the word \"ollis\" from Cicero's original, turning a conditional instruction into a universal principle."
      - "The seal and motto were adopted on January 11, 1822 — about five months after Missouri became the 24th state on August 10, 1821."
      - "Judge Robert William Wells designed the state seal."
      - "The seal also carries a second phrase: \"United We Stand, Divided We Fall,\" encircling the shield above the motto scroll."

