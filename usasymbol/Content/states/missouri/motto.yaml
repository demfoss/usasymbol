faq:
  - question: "What is Missouri's state motto?"
    answer: "Missouri's state motto is \"Salus Populi Suprema Lex Esto,\" a Latin phrase meaning \"Let the Welfare of the People Be the Supreme Law.\" It was adopted as part of the state seal on January 11, 1822."

  - question: "What does \"Salus Populi Suprema Lex Esto\" mean?"
    answer: "It means \"Let the welfare of the people be the supreme law.\" The phrase states a governing principle: above all other considerations, the wellbeing of citizens is the highest law."

  - question: "Where does Missouri's motto come from?"
    answer: "From Cicero's De Legibus (On Laws), Book III, written in the final years of the Roman Republic. Missouri adapted the phrase by dropping the word \"ollis\" from Cicero's original, making it a universal statement rather than an instruction directed at a specific group."

  - question: "When did Missouri adopt its state motto?"
    answer: "On January 11, 1822, when the Missouri General Assembly adopted the state seal. Missouri became a state on August 10, 1821, so the seal and motto were adopted about five months after statehood."

  - question: "Where does the motto appear?"
    answer: "On a scroll beneath two grizzly bears at the bottom of the Missouri state seal. The seal also carries the phrase \"United We Stand, Divided We Fall\" around the shield above. The state flag, approved in 1913, shows the seal with the motto."

