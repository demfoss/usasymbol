- id: facts
  icon: fa-solid fa-lightbulb
  title: Channel Catfish Facts
  facts:
  - Adopted in 1997 by the Missouri Legislature.
  - Its scientific name is Ictalurus punctatus.
  - Adults are usually 12 to 32 inches long and weigh 1 to 15 pounds.
  - Missouri's state record channel catfish weighed 34 pounds 10 ounces and was caught in 1974.
  - Kansas, Iowa, Nebraska, and Tennessee also list the channel catfish as their state fish.
faq:
- question: What is Missouri's state fish?
  answer: Missouri's state fish is the channel catfish. It is a spotted catfish with long whiskers and a deeply forked tail.
- question: When did Missouri adopt the Channel Catfish?
  answer: Missouri made the channel catfish its official state fish in 1997. The governor signed the bill on May 23, 1997.
- question: Why did Missouri choose the Channel Catfish?
  answer: State law does not give a detailed reason. The channel catfish is the most common large catfish in Missouri, and anglers all over the state fish for it.
- question: How can you tell a channel catfish from a blue catfish?
  answer: A channel catfish often has dark spots on its sides, and its anal fin has a rounded edge. A blue catfish never has spots, and its anal fin has a straight edge.
- question: How big do channel catfish get in Missouri?
  answer: Most adults weigh 1 to 15 pounds. The Missouri state record weighed 34 pounds 10 ounces.
