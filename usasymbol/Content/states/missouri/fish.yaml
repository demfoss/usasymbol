seo_title: Missouri State Fish | Channel Catfish
seo_description: The Missouri state fish is the channel catfish, adopted in 1997. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/missouri/missouri-fish-hero.webp
hero_image_alt: A pale gray channel catfish with scattered dark spots, long whiskers around its mouth, and a deeply forked tail.
hero_image_caption: The channel catfish, Missouri's state fish, lives in rivers, lakes, and ponds across the state.
intro_text: Missouri's state fish is the channel catfish, a whiskered fish with a forked tail that lives in waters all over the state, adopted in 1997. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Missouri?
  paragraphs:
  - The channel catfish is the official fish of Missouri. State lawmakers passed the bill and Gov. Mel Carnahan signed it in 1997. Its scientific name is Ictalurus punctatus.
  - Missouri also has a separate state aquatic animal, the paddlefish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Channel Catfish
  paragraphs:
  - The channel catfish has a slender body with smooth skin and no scales. Its body is pale, often with scattered dark spots on the back and sides. The smallest young and large adults often have no spots.
  - It has a deeply forked tail and long whiskers, called barbels, around its mouth. The catfish uses these whiskers to find food instead of relying on its eyes.
  - Its anal fin, the fin on the belly near the tail, has a rounded outer edge. This helps people tell it apart from the blue catfish, which looks very similar.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Missouri Legislature passed a bill naming the channel catfish the official state fish. Gov. Mel Carnahan approved it on May 23, 1997, and the law took effect on August 28, 1997.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Missouri Chose the Channel Catfish
  paragraphs:
  - State law names the channel catfish as the official fish but does not give a detailed reason.
  - The fish is a natural fit, though. It is the most common and widespread large catfish in Missouri, and it is one of the fish Missouri anglers most want to catch.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Channel Catfish
  paragraphs:
  - Channel catfish live in almost every part of Missouri. They like large, muddy streams with slow or gentle currents, but they also live in reservoirs and lakes.
  - In the prairie streams of northwest Missouri, there are few other game fish, so the channel catfish is the top sport fish there. It is also stocked in many farm ponds.
