name_meaning:
  heading: What Does Missouri Mean?
  paragraphs:
  - Missouri entered statehood in 1821 as the 24th state. The name comes from the Missouri River and from the Missouri people, with many explanations connecting it to dugout canoes or people of the wooden canoe.
  - Missouri's official symbols do not settle into one simple image. The bluebird and hawthorn blossom are gentle emblems, but the mule, Fox Trotter, Hawken rifle, and dinosaur make the state feel practical, frontier-aware, and locally specific.
  - Missouri's postal abbreviation is MO, and residents are Missourians. The Show-Me State is the best-known nickname, while the Latin motto Salus Populi Suprema Lex Esto appears in the older seal tradition.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named from the Missouri River and the Missouri people.
    - label: Statehood
      text: Missouri became the 24th state in 1821.
    - label: Motto
      text: Salus Populi Suprema Lex Esto is commonly rendered as Let the welfare of the people be the supreme law.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Missouri, a central state shaped by the Mississippi and Missouri rivers, the Ozarks, and prairie country.
    - label: River
      text: Also refers to the Missouri River, a major tributary of the Mississippi River.
    - label: People
      text: People from Missouri are called Missourians.
  - heading: Nicknames and Short Forms
    items:
    - label: The Show-Me State
      text: Main nickname and one of Missouri's most recognizable public identities.
    - label: Mule State
      text: Older informal identity echoed by the official Missouri mule page.
    - label: Abbreviation
      text: MO; older short form Mo.
editorial:
  heading: What Missouri's Symbols Say About the State
  paragraphs:
  - Missouri's [Show-Me nickname](/states/missouri/nickname) gives the state a skeptical, plainspoken voice before any flower or bird enters the picture. The [state motto](/states/missouri/motto) adds a more formal legal ideal from the seal.
  - The [Missouri mule](/states/missouri/mammal/missouri-mule) and [Missouri Fox Trotting Horse](/states/missouri/mammal/missouri-fox-trotter-horse) make this hub unusually strong on working animals. They say more about movement, farms, trails, and local breeding than a generic wildlife list would.
  - The [Hawken rifle](/states/missouri/firearm) and [Hypsibema missouriensis](/states/missouri/dinosaur) pull Missouri in two different directions, one toward frontier St. Louis craft and one toward deep fossil time. That range keeps the hub from feeling polite or predictable.
faq:
- question: What is Missouri's most famous state symbol?
  answer: The [Show-Me State nickname](/states/missouri/nickname) travels farther than most of Missouri's formal emblems and is the state's clearest public shorthand.
- question: What is Missouri's state bird?
  answer: Missouri's state bird is the [eastern bluebird](/states/missouri/bird), adopted in 1927.
- question: What is Missouri's state flower?
  answer: Missouri's state flower is the [white hawthorn blossom](/states/missouri/flower), adopted in 1923.
- question: Why is the Missouri mule important?
  answer: The [Missouri mule](/states/missouri/mammal/missouri-mule) carries the state's agricultural and military working-animal history, while the Fox Trotter adds a separate Missouri horse-breeding tradition.
- question: How many official state symbols does Missouri have?
  answer: Missouri is represented here by pages for the flag, bluebird, hawthorn blossom, dogwood, motto, nickname, dinosaur, firearm, mule, and Fox Trotter.
