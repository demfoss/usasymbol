seo:
  title: "Most Common Last Names in Missouri"
  description: "The most common last names in Missouri are Smith, Johnson, and Williams, shaped by southern settlement in the Ozarks, German immigration to St. Louis and the Missouri Rhineland, and Black migration into the Bootheel and the state's largest cities."

page:
  h1: "Most Common Last Names in Missouri"
  intro: "Smith appears 95,001 times in Missouri, making it the state's most common last name in 2010-era surname data. Johnson and Williams follow close behind, in a ranking shaped by southern migration into the Ozarks, German immigration into St. Louis and the Missouri River valley, and Black movement into the Bootheel and the state's industrial cities. Missouri's top 20 is mostly English and Welsh, but surnames like Meyer and Mueller show how strongly German immigration still registers."
  heritage_title: "Ozark Uplands, German River Towns, and a Border State Mix"
  heritage_body: "Upland counties in the south and center were settled heavily by families moving west from Kentucky, Tennessee, and Virginia in the early 1800s, which helps explain the dominance of Smith, Johnson, Jones, Brown, and Davis. St. Louis began as a French town and became a major immigrant gateway, and between 1830 and 1840 more than 38,000 Germans settled the corridor from St. Louis to Hermann that later became known as the Missouri Rhineland. Missouri's border-state history also matters: slavery, the Dred Scott case in St. Louis, postwar Black communities, and later migration into St. Louis and Kansas City helped keep surnames such as Williams, Jackson, Harris, and Robinson high in the statewide ranking."
  fun_fact: "Meyer ranks 32nd in Missouri and Mueller 75th, both far above their national standing. That pairing is a visible remnant of the nineteenth-century German immigration that reshaped St. Louis and the Missouri River towns."

surnames:
  - rank: 1
    name: Smith
    count: 95001
    ratio: 107
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker or blacksmith. Smith became Missouri's top surname because it arrived early with settlers moving up the Mississippi and Missouri rivers after the Louisiana Purchase, then spread across both Ozark farm counties and the state's largest cities."

  - rank: 2
    name: Johnson
    count: 72550
    ratio: 140
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' (God is gracious). Johnson is common across Missouri because it belongs to both the southern migrant stream that filled the uplands and the Black communities that grew in St. Louis, Kansas City, and the southeast after the Civil War."

  - rank: 3
    name: Williams
    count: 71768
    ratio: 141
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Norman personal name 'Willahelm', meaning resolute protector. In Missouri, Williams is especially strengthened by African American naming patterns that took shape in slavery and emancipation, then expanded further with migration into St. Louis and Kansas City in the late nineteenth and early twentieth centuries."

  - rank: 4
    name: Jones
    count: 63932
    ratio: 159
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning son of John. Jones moved into Missouri with families from Kentucky and Tennessee in the early nineteenth century, making it one of the surnames most closely tied to the state's Upper South settlement pattern."

  - rank: 5
    name: Brown
    count: 61065
    ratio: 166
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', originally referring to hair color, complexion, or clothing. Brown is widespread in Missouri because it sits comfortably in every major stream of settlement, from early southern migrants to Black urban neighborhoods and older river towns."

  - rank: 6
    name: Davis
    count: 50085
    ratio: 202
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid' (beloved). Davis was already well established in the southern states before Missouri statehood in 1821, and it spread quickly through central Missouri and the western frontier counties as migration pushed toward the Santa Fe corridor."

  - rank: 7
    name: Miller
    count: 47220
    ratio: 215
    origin: english
    type: Occupational
    meaning: "A miller, the operator of a grain mill. Miller is especially strong in Missouri because English Miller and German Muller often converged here, particularly in St. Louis and the Missouri Rhineland after the German immigration wave of the 1830s and 1840s."

  - rank: 8
    name: Wilson
    count: 36769
    ratio: 276
    origin: english
    type: Patronymic
    meaning: "Son of Will, a short form of William. Wilson followed the same westward route as many other Upper South surnames, moving into the Ozarks and interior river counties with farm families from Tennessee, Kentucky, and Virginia."

  - rank: 9
    name: Moore
    count: 35235
    ratio: 288
    origin: english
    type: Habitational
    meaning: "From Old English 'mor', someone who lived near open moorland or rough ground. In Missouri the name came largely with southern migrants, but it also picked up Irish Moore lines in St. Louis, where immigration broadened the surname base beyond the uplands."

  - rank: 10
    name: Taylor
    count: 31915
    ratio: 318
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a cutter of cloth. Taylor appears across Missouri from the earliest years of American settlement, showing how durable English occupational surnames remained in a state built by both frontier farming and market towns."

  - rank: 11
    name: Jackson
    count: 30265
    ratio: 335
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval form of John. Jackson carries both frontier and Black Missouri associations, and its visibility rose in a state where Andrew Jackson's era reshaped western settlement while Black Missourians also carried the name into the twentieth century."

  - rank: 12
    name: Harris
    count: 29565
    ratio: 343
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry. Harris ranks high in Missouri partly because it traveled well across the state's regional divides, appearing among early southern settlers and later in St. Louis and Kansas City Black communities."

  - rank: 13
    name: Thomas
    count: 29380
    ratio: 345
    origin: welsh
    type: Patronymic
    meaning: "From the given name Thomas, from Aramaic 'toma', meaning twin. Thomas reflects the Welsh and border-English contribution to Missouri's early American population, especially in counties settled from Kentucky and the lower Ohio Valley."

  - rank: 14
    name: White
    count: 28758
    ratio: 353
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', describing someone with pale hair or complexion. White appears across old farming counties, river towns, and city neighborhoods, making it one of Missouri's most evenly distributed traditional English surnames."

  - rank: 15
    name: Anderson
    count: 27722
    ratio: 366
    origin: scottish
    type: Patronymic
    meaning: "Son of Andrew or Anders, from Greek 'Andreas'. Anderson in Missouri reflects both Scots-Irish naming carried into the uplands and northern European immigrant lines that entered St. Louis during the nineteenth century."

  - rank: 16
    name: Thompson
    count: 25592
    ratio: 396
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a shortened form of Thomas. Thompson is another surname rooted in the state's early migration from the Upper South, and it remained strong because Missouri's rural settlement spread through kin networks rather than a single immigrant surge."

  - rank: 17
    name: Clark
    count: 24005
    ratio: 422
    origin: english
    type: Occupational
    meaning: "From Old English 'clerc', originally a cleric or literate record keeper. Clark was common in frontier Missouri by the time St. Louis became the launching point for the Lewis and Clark expedition in 1804, and the name stayed prominent as county governments and trading towns multiplied."

  - rank: 18
    name: Robinson
    count: 23182
    ratio: 437
    origin: english
    type: Patronymic
    meaning: "Son of Robin, a medieval diminutive of Robert. Robinson is notably strong in Missouri because it appears in both old southern settler lines and Black communities shaped by emancipation, segregation, and twentieth-century migration into the state's industrial centers."

  - rank: 19
    name: Lewis
    count: 22537
    ratio: 450
    origin: welsh
    type: Patronymic
    meaning: "Usually derived from the personal name Lewis, an English form associated with both Germanic Ludwig and Welsh Llywelyn traditions. In Missouri it traveled west with early American settlers and gained extra visibility in a state whose best known exploration story begins in St. Louis with Meriwether Lewis."

  - rank: 20
    name: Allen
    count: 21455
    ratio: 473
    origin: english
    type: Patronymic
    meaning: "From the personal name Alan or Allen, probably of Celtic or Breton origin. Allen is one of the surnames that spread so widely with southern migration that it now reads as a general Missouri name rather than the marker of any single region."

unique_surnames:
  - name: Meyer
    state_rank: 32
    national_rank: 142
    origin: german
    why: "Meyer, from a German word for a steward or tenant farmer, ranks far higher in Missouri than it does nationally. The reason is straightforward: St. Louis and the Missouri Rhineland absorbed a major German immigration stream after 1829, and Meyer stayed visible because many of those communities kept German churches, schools, and newspapers well into the late nineteenth century."

  - name: Mueller
    state_rank: 75
    national_rank: 422
    origin: german
    why: "Mueller is the German equivalent of Miller, and Missouri is one of the states where many families kept the original spelling rather than fully anglicizing it. Its elevated rank reflects the same German belt that ran from St. Louis through St. Charles, Washington, and Hermann."

  - name: Schmidt
    state_rank: 80
    national_rank: 160
    origin: german
    why: "Schmidt means smith in German and points directly to Missouri's long German presence. It is especially telling alongside Smith because both versions remained common in the same state, a sign that immigrant families did not all merge linguistically at the same speed."

  - name: Weber
    state_rank: 112
    national_rank: 244
    origin: german
    why: "Weber, meaning weaver, is another Missouri surname lifted by nineteenth-century German settlement. Its statewide standing is higher than the national pattern would suggest because St. Louis was not just a port of entry, but also a place where German-speaking neighborhoods and institutions endured for generations."

  - name: Kemper
    state_rank: 1000
    national_rank: 3173
    origin: german
    why: "Kemper is a less common surname nationally but much more visible in Missouri, where the German surname tail runs unusually deep. Names like Kemper show that Missouri's German influence was not confined to a few famous families or a handful of river towns; it entered the broader statewide surname pool."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Occupational surnames sit near the center of Missouri's list, led by Smith at number one and reinforced by Miller, Taylor, and Clark. That mix reflects both English naming traditions from southern settlers and the German immigrant current that helped keep Miller, Meyer, Mueller, Schmidt, and Weber unusually visible."
    examples:
      - Smith (metalworker)
      - Miller (grain mill operator)
      - Taylor (tailor)
      - Clark (cleric or clerk)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Missouri's top 20. Johnson, Williams, Jones, Davis, Wilson, Jackson, Harris, Thomas, Anderson, Thompson, Robinson, Lewis, and Allen all descend from a father's given name, which fits a state settled heavily by English, Welsh, and Scots-Irish families moving west out of the Upper South."
    examples:
      - Johnson (son of John)
      - Williams (son of William)
      - Jones (son of John, Welsh form)
      - Thompson (son of Thom)

  - type: German Heritage Names
    icon: fa-solid fa-map-location-dot
    description: "Missouri's most distinctive surname layer is German. The 1830s and 1840s immigration surge into St. Louis and the Missouri River corridor raised surnames like Meyer, Mueller, Schmidt, and Weber far above what their national rank alone would predict, leaving a durable signature that many Southern states do not share."
    examples:
      - Meyer (steward or tenant farmer)
      - Mueller (miller)
      - Schmidt (smith)
      - Weber (weaver)

faq:
  - question: "Why are German last names so common in Missouri?"
    answer: "German last names are unusually common in Missouri because the state received a major wave of German immigration in the nineteenth century, especially in St. Louis and the Missouri River towns between St. Charles and Hermann. That is why surnames such as Meyer, Mueller, Schmidt, and Weber rank higher in Missouri than they do nationally."

