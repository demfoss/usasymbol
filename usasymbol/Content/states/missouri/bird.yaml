title: Eastern Bluebird
scientific_name: Sialia sialis
adopted_year: 1927
legislation: Mo. Rev. Stat. Sec. 10.010; 1927 S.B. 321
meaning: Missouri's state bird works less as a technical wildlife pick than as a ready-made public symbol. State sources describe the bluebird as a symbol of happiness, and its red, white, and blue coloring gave the 1927 choice an easy patriotic reading as well.
author: USA Symbol Team
date_published: '2025-11-15'
date_modified: "2026-05-02"
seo_title: "Missouri State Bird | Eastern Bluebird"
seo_description: Missouri's state bird is the Eastern Bluebird, adopted in 1927. It was chosen as the bluebird of happiness and for its red, white, and blue coloring.
intro_text: Missouri's state bird is the <strong>Eastern Bluebird</strong>, adopted in <strong>1927</strong> and now listed in <strong>Mo. Rev. Stat. Sec. 10.010</strong>. The key phrase behind the choice is the <strong>bluebird of happiness</strong>. Missouri did not need to invent a meaning for the bird from scratch; that cheerful association was already familiar. State sources also point to the bird's red, white, and blue coloring, which gave the symbol an easy patriotic reading.
shared_states:
- New York
quick_facts:
  - label: "Phrase behind the choice"
    value: "The bluebird of happiness"
  - label: "Current statute"
    value: "Mo. Rev. Stat. Sec. 10.010"
  - label: "Why it looked right in 1927"
    value: "State sources emphasized both happiness and red-white-blue coloring"
  - label: "Shared later"
