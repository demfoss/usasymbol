sections:
- id: why-did-missouri-choose-the-bluebird-of-happiness
  icon: fa-solid fa-circle-question
  title: Why Did Missouri Choose the Bluebird of Happiness?
  paragraphs:
  - Missouri's own symbol pages do not frame the bird as a rare species or a hard-to-explain regional emblem. They frame it as the bluebird of happiness — a cultural shorthand that lawmakers did not have to invent from scratch. The phrase was already in public circulation.
  - 'The same official description adds another layer: the bird''s red, white, and blue coloring made it a natural American symbol. The 1927 designation combined two ideas that were already legible to any Missourian — a cheerful cultural meaning and a patriotic color match.'
- id: what-does-missouri-law-actually-call-the-state-bird
  icon: fa-solid fa-scale-balanced
  title: What Does Missouri Law Actually Call the State Bird?
  paragraphs:
  - Missouri's current law does not just say Eastern Bluebird in isolation. Section 10.010 names the state's official bird as the native bluebird and identifies it scientifically as <em>Sialia sialis</em>.
  - That wording helps explain the history. Missouri adopted the bird in 1927, and the later statutory form made the identification more precise without changing the symbol itself.
  - 'Only one other state, New York (1970), shares the Eastern Bluebird — adopted more than four decades after Missouri. The later overlap doesn''t change what Missouri was doing in 1927: choosing a bird whose meaning was already settled before the law was written.'
faq:
- question: What is Missouri's state bird?
  answer: Missouri's state bird is the Eastern Bluebird.
- question: When did Missouri adopt the Eastern Bluebird?
  answer: Missouri first designated the Eastern Bluebird as its state bird in 1927.
- question: Why did Missouri choose the bluebird?
  answer: Missouri sources present the bluebird as a symbol of happiness, and they also note its red, white, and blue coloring. That made it a culturally familiar symbol, not just a bird-law entry.
- question: What does Missouri law call the state bird?
  answer: Missouri law identifies the official bird as the native bluebird, scientifically designated as Sialia sialis, in Section 10.010 of the Revised Statutes of Missouri.
- question: Does Missouri share the Eastern Bluebird with another state?
  answer: Yes. New York also uses the Eastern Bluebird as its state bird, but Missouri adopted it decades earlier.
