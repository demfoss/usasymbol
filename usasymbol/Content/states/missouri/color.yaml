timeline:
  - year: "1735"
    description: "Ste. Genevieve established as the first permanent European settlement in what is now Missouri, founded by French colonists from Illinois and Canada; French cultural and linguistic traditions take root in the Missouri territory that will eventually inform the state flag's French Tricolor palette"
  - year: "1764"
    description: "St. Louis founded on February 15 as a French fur-trading post by Pierre Laclède and Auguste Chouteau, establishing the city that will become the economic and cultural center of upper Louisiana and the future Gateway to the West"
  - year: "1803"
    description: "The Louisiana Purchase transfers Missouri territory from Napoleonic France to the United States for approximately 3 cents per acre on April 30; the French heritage embedded in Missouri's colonial history becomes the primary inspiration for the flag's Tricolor palette"
  - year: "1821"
    description: "Missouri admitted to the Union on August 10 as the 24th state under the Missouri Compromise; the 24 stars that encircle the state coat of arms on the flag — and appear in the blue band — commemorate this admission year"
  - year: "1908"
    description: "Marie Elizabeth Oliver of Cape Girardeau begins designing a Missouri state flag as chairperson of a Daughters of the American Revolution committee, choosing red, white, and blue horizontal stripes inspired by the French Tricolor to honor Missouri's Louisiana Purchase origins"
  - year: "1913"
    description: "Governor Elliot Woolfolk Major signs the State Flag Act on March 22, officially adopting the Oliver design with its red, white, and blue tricolor as the state flag under Missouri Revised Statutes § 10.020 — nearly a century after Missouri achieved statehood"

expert_quote:
  text: "By mingling the state coat-of-arms with the national colors of red, white, and blue, the flag signifies the harmony existing between the two — Missouri as the geographical center of the nation."
  source: "Missouri Secretary of State, Official State Flag Publication"

faq:
  - question: "What are the state colors of Missouri?"
    answer: "The traditional state colors of Missouri are Red, White, and Blue, derived from the state flag adopted March 22, 1913, under Missouri Revised Statutes § 10.020. Red represents valor, white represents purity, and blue represents vigilance, permanency, and justice. Missouri has no separate state color statute."
  - question: "What is the HEX code for Missouri Red?"
    answer: "The closest standard HEX code for Missouri Red is #BF0A30 (Pantone PMS 193). Missouri's Secretary of State does not specify official Pantone or HEX values; this is a standard approximation based on flag color conventions."
  - question: "What is the HEX code for Missouri Blue?"
    answer: "The closest standard HEX code for Missouri Blue is #002868 (Pantone PMS 281). Missouri's Secretary of State does not specify official Pantone or HEX values; this is a standard approximation."
  - question: "Why does Missouri use red, white, and blue?"
    answer: "Missouri's red, white, and blue honor two heritage connections: the French Tricolor, commemorating Missouri's origins as part of French Louisiana and the 1803 Louisiana Purchase; and the American flag, affirming Missouri's identity within the United States. The colors were chosen by designer Marie Elizabeth Oliver in 1908."
  - question: "When was Missouri's state flag adopted?"
    answer: "Missouri's state flag was officially adopted on March 22, 1913, when Governor Elliot Woolfolk Major signed the State Flag Act into law. The design was created by Marie Elizabeth Oliver of Cape Girardeau, who began working on it in 1908."
  - question: "What does Missouri's flag look like?"
    answer: "The Missouri state flag features three equal horizontal stripes of red (top), white (center), and blue (bottom). At the center of the white stripe is the Missouri state coat of arms, encircled by a blue band bearing 24 white five-pointed stars representing Missouri's admission as the 24th state in 1821."

