sections:
  - id: "official-designation"
    title: "Flag History and Legislative Basis"
    style: "default"
    paragraphs:
      - "Missouri's state colors have no separate statutory designation — the red, white, and blue are defined exclusively through the state flag, governed by Missouri Revised Statutes Title II, Chapter 10, § 10.020. The flag was adopted on March 22, 1913, when Governor Elliot Woolfolk Major signed the State Flag Act, making the Oliver design the official flag after a five-year legislative process. Missouri was one of the last contiguous states to adopt an official flag, having operated for nearly a century of statehood without one. The Missouri Secretary of State's office explicitly does not provide official Cable or Pantone color values for the flag, making the three colors defined by name and symbolic meaning in the statute rather than by precise technical specification; see the [Missouri state flag page](/states/missouri/flag/missouri-state-flag)."
      - "The flag's designer, Marie Elizabeth Oliver, was a resident of Cape Girardeau, Missouri, and wife of former state senator R. B. Oliver. She took on the flag project in 1908 as chairperson of a Daughters of the American Revolution committee tasked with designing a state flag. Oliver researched state flags extensively, writing to each state's secretary of state for information. Her design incorporated Missouri's coat of arms on a background of three horizontal stripes of red, white, and blue — chosen to honor Missouri's French colonial heritage while simultaneously affirming American identity through the familiar national color palette. A competing design by G. H. Holcomb was rejected because it too closely resembled the American flag without sufficient Missouri-specific symbolism. Oliver's original painted paper flag was destroyed in the 1911 Missouri State Capitol fire; she sewed a replacement in silk, which was adopted in 1913 and is now on display at the James C. Kirkpatrick State Information Center in Jefferson City, a heritage thread also reflected in [The Show-Me State nickname](/states/missouri/nickname/the-show-me-state)."
    subsections:
      - subtitle: "The French Tricolor Connection"
        text: "The most distinctive feature of Missouri's color choice is its explicit tribute to France through the French Tricolor palette. Missouri's red, white, and blue horizontal stripes are identical in arrangement to the flag of the Netherlands and closely resemble the French Tricolor, a resemblance that was not coincidental but deliberate. Marie Elizabeth Oliver designed the flag specifically to acknowledge that Missouri's land was acquired as part of the 1803 Louisiana Purchase, in which the United States purchased approximately 828,000 square miles of territory from Napoleonic France for 15 million dollars — the transaction that doubled the size of the United States and made Missouri's eventual statehood possible. French explorers and settlers had been present in what is now Missouri since the late 17th century; Ste. Genevieve, founded around 1735, is the oldest permanent European settlement in Missouri, and St. Louis, founded in 1764 as a French fur-trading post, became the economic and cultural center of the Upper Louisiana territory."
      - subtitle: "Missouri Revised Statutes § 10.020"
        text: "Missouri Revised Statutes Title II, Chapter 10, § 10.020 specifies that the official Missouri flag shall be rectangular in shape with a vertical width to horizontal length ratio of seven to twelve, composed of three equal horizontal stripes of red, white, and blue, and bearing at its center a circular blue band enclosing the state coat of arms on a white ground. The statute assigns the following meanings: the blue stripe represents the permanency, vigilance, and justice of the state; the red and white stripes represent valor and purity respectively. No Pantone, Cable, or HEX specifications are provided in the statute or by the Missouri Secretary of State's office, making Missouri one of several states where color values for official uses must be approximated from standard flag color conventions."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Missouri's red, white, and blue carry a dual layer of meaning that distinguishes the state's color palette from most other red-white-blue state flags. On one level, the colors echo the American national palette, affirming Missouri's identity as an American state with deep patriotic traditions. On another level, they deliberately reference the French Tricolor, commemorating the French colonial settlement that preceded American sovereignty in the Missouri region by more than a century and the Louisiana Purchase of 1803 that brought Missouri into the American republic. This dual tribute — to both French heritage and American identity — makes Missouri's color symbolism among the most historically layered of any U.S. state flag and complements ideas in the [Missouri state motto](/states/missouri/motto/salus-populi-suprema-lex-esto)."
    subsections:
      - subtitle: "Red: Valor and Missouri's Military Heritage"
        text: "Red represents valor in Missouri's flag statutory description, a meaning with particular weight in a state that experienced the Civil War with unusual intensity. Missouri was a border state that remained in the Union but sent significant numbers of soldiers to both sides; the Missouri State Guard under General Sterling Price fought for the Confederacy while other Missourians served in Union regiments. The state saw more than 1,000 Civil War engagements on its soil — more than all but Virginia and Tennessee — making valor a color meaning rooted in lived history rather than abstract principle. Missouri's red also connects to the valor of the Missouri Volunteers who served in every American conflict, and to the state's association with figures including General John Joseph Pershing, a Missouri native who commanded the American Expeditionary Forces in World War I, earning him the title General of the Armies."
      - subtitle: "White: Purity and the Gateway Ideal"
        text: "White represents purity in Missouri's flag and occupies the center stripe — the most visually prominent position, bearing the state coat of arms. The white stripe reflects Missouri's role as the Gateway to the West, a threshold state between the established eastern United States and the open western territories that drew hundreds of thousands of migrants west via the Oregon, Santa Fe, and California Trails, all of which began in Missouri. The purity symbolism carries associations with new beginnings and clean slates appropriate to a state that served as the starting point for generations of American westward expansion. The Gateway Arch in St. Louis, completed in 1965 and standing 630 feet tall as the nation's tallest man-made monument, commemorates this gateway identity in physical form."
      - subtitle: "Blue: Vigilance, Permanency, and the Rivers"
        text: "Blue represents vigilance, permanency, and justice in Missouri's flag — three virtues that the legislature encoded in the color through the flag's statutory description. Blue also evokes Missouri's defining geographic feature: the convergence of the Missouri River and the Mississippi River near St. Louis, the meeting of the two longest river systems in North America at a single point that made Missouri the natural gateway to both the continent's interior and the Gulf of Mexico. The Missouri River, called the Big Muddy, flows nearly 2,500 miles from Montana to its Missouri confluence, draining one-sixth of the continental United States. The Mississippi River, the Father of Waters, forms Missouri's entire eastern boundary. These rivers are not incidental to Missouri's color tradition — they are the reason Missouri became the launching point for westward exploration and the reason its blue represents permanency as much as virtue."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and State Identity"
    style: "default"
    paragraphs:
      - "Missouri's red, white, and blue appear across the state's governmental and cultural landscape with the consistency expected of a state whose color palette doubles as the national palette of both the United States and France. The state coat of arms, designed by Judge Robert William Wells in 1822 and appearing at the center of the state flag since 1913, is displayed against the white stripe with a blue circular band bearing 24 stars — incorporating all three state colors into a single heraldic composition. The Missouri State Capitol building in Jefferson City, completed in 1917, displays the state flag prominently throughout its public spaces, with the tricolor appearing alongside the American flag at official functions throughout the state. Missouri state agency websites, the Missouri Secretary of State's official publications, and state government materials consistently use red, white, and blue as the defining color palette, even without a formal color statute requiring specific Pantone or HEX values. The University of Missouri's school colors of black and gold are distinct from the state flag's palette but represent Missouri's most recognized institutional color tradition in athletic contexts, while the state's general governmental identity remains anchored in the patriotic red-white-blue of the 1913 flag in a national context tracked by [states by population](/rankings/demographics/states-by-population)."

