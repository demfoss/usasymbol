seo_title: "Missouri State Colors | Red White Blue"
seo_description: "Missouri state colors are Red, White, and Blue, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Missouri are **Red**, **White**, and **Blue**, derived from [the Missouri state flag](/states/missouri/flag/missouri-state-flag) adopted in 1913. Missouri has not enacted a separate state color statute; the colors are defined by the flag's statutory description under Missouri Revised Statutes § 10.020. The specifications below list HEX, RGB, CMYK, and Pantone values for Missouri color matching."

official_colors: "Red, White, and Blue"
official_since: "Traditional / State Flag (Missouri Revised Statutes § 10.020; flag adopted March 22, 1913)"
primary_use: "State flag, Missouri state government branding, state agency materials, state historical and cultural identity"
known_for: "Missouri's red, white, and blue tricolor was deliberately designed to echo the French Tricolor, honoring the state's French colonial origins at Ste. Genevieve (settled 1735) and St. Louis (settled 1764) and the 1803 Louisiana Purchase that brought Missouri into the United States; the flag was designed by a Daughters of the American Revolution volunteer in 1908 and took five years and multiple legislative attempts to be officially adopted"

