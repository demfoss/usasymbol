intro_text: "Missouri's state dessert is the ice cream cone, adopted in 2008 to mark its popularization at the 1904 World's Fair in St. Louis. This profile appears in the [list of U.S. state foods](/symbols/desserts)."

sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Missouri's State Dessert?"
    paragraphs:
      - "The ice cream cone is Missouri's official state dessert, designated by the Missouri General Assembly in 2008. It is a scoop of ice cream served in an edible baked cone."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Ice Cream Cone"
    paragraphs:
      - "An ice cream cone pairs a cone made from baked wafer or waffle batter with one or more scoops of ice cream, letting the dessert be eaten by hand without a bowl or spoon."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Ice Cream Cone Became Missouri's State Dessert"
    paragraphs:
      - "The Missouri General Assembly designated the ice cream cone the official state dessert in 2008, tying the honor to the cone's popularization in St. Louis more than a century earlier."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Missouri Chose the Ice Cream Cone"
    paragraphs:
      - "The edible ice cream cone became widely popular at the 1904 World's Fair in St. Louis, where vendors are commonly credited with rolling waffle-style pastries into cones to hold ice cream when nearby ice cream sellers ran short of dishes. That connection to the fair made the cone a natural symbol for Missouri."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Ice Cream Cone Comes From in Missouri"
    paragraphs:
      - "The 1904 World's Fair, officially the Louisiana Purchase Exposition, was held in St. Louis's Forest Park, where the ice cream cone's popularity spread nationally."
    sites:
      - name: Forest Park
        city: St. Louis
        lat: 38.6427
        lng: -90.2850
        note: "Site of the 1904 World's Fair"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Ice Cream Cone Facts"
    facts:
      - "Adopted as Missouri's state dessert in 2008."
      - "Popularized at the 1904 World's Fair in St. Louis, Missouri."
      - "The 1904 fair was officially named the Louisiana Purchase Exposition."

