intro_text: "Missouri's state grape is the Norton, also known as Cynthiana, adopted in 2003 to recognize a native American grape variety tied to the state's 19th century wine industry. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Missouri's State Grape?"
    paragraphs:
      - "The Norton, also called Cynthiana, is Missouri's official state grape, designated by the Missouri General Assembly in 2003. It is a native American grape variety, part of the species Vitis aestivalis."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Norton Grape"
    paragraphs:
      - "Norton is a small, dark purple grape that produces a deep red wine with an earthy, tart flavor. Unlike European grape varieties, it resists many of the diseases and pests that historically damaged vineyards in the eastern United States."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Norton Grape Became Missouri's State Grape"
    paragraphs:
      - "The Missouri General Assembly designated the Norton the official state grape in 2003."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Missouri Chose the Norton Grape"
    paragraphs:
      - "Missouri was a leading American wine producer in the mid to late 1800s, especially around Hermann, and the Norton grape was central to that early wine industry, which is now being revived by modern Missouri wineries."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Norton Grape Comes From in Missouri"
    paragraphs:
      - "Hermann, along the Missouri River, was the center of the state's 19th century wine industry and remains home to several wineries that grow Norton grapes today."
    sites:
      - name: Hermann
        city: Hermann
        lat: 38.70
        lng: -91.44
        note: "Historic center of Missouri's wine industry"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Norton Grape Facts"
    facts:
      - "Adopted as Missouri's state grape in 2003."
      - "The Norton grape is also known as Cynthiana."
      - "Hermann, Missouri was the historic center of the state's 19th century wine industry."

