sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Missouri?
    paragraphs:
      - "The American bullfrog is Missouri's official state amphibian, designated by the Missouri Legislature in 2005. Its scientific name is Rana catesbeiana, and it is the largest frog native to North America."
      - "It lives in ponds, lakes, and slow streams throughout Missouri and is one of the most familiar frogs in the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the American Bullfrog
    paragraphs:
      - "American bullfrogs are green to olive brown with a smooth back and a pale belly, and adults can grow to 8 inches long, making them much larger than most other frogs."
      - "They have a large eardrum on each side of the head, a wide mouth, and powerful hind legs built for jumping and swimming."
      - "Bullfrogs are best known for their deep, low call, often described as sounding like 'jug-o-rum,' which carries far across water on summer nights."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Missouri Legislature designated the American bullfrog the official state amphibian in 2005, after a push led by Missouri schoolchildren who researched and proposed the frog for the honor."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Missouri Chose the American Bullfrog
    paragraphs:
      - "The American bullfrog is common across Missouri's ponds and wetlands and is one of the most recognizable frogs in the state, making it a familiar choice tied to the state's outdoor life and waterways."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the American Bullfrog
    paragraphs:
      - "American bullfrogs live in ponds, lakes, marshes, and slow-moving streams throughout Missouri, from the Ozark region to the northern prairies."
