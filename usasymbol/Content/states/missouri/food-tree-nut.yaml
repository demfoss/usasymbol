    answer: "The Missouri Legislature designated the Eastern black walnut the official state tree nut in 1990."
  - question: "Why did Missouri choose the Eastern black walnut?"
    answer: "The tree is native to Missouri and grows wild across the state, and Missouri is home to a major black walnut processing industry centered in Stockton."
