sections:
  - id: overview
    icon: fa-solid fa-seedling
    title: "What Is Missouri's State Tree Nut?"
    paragraphs:
      - "The Eastern black walnut is Missouri's official state tree nut, designated by the Missouri Legislature in 1990. The tree grows wild across the state and is also harvested commercially for its nuts and wood."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Eastern Black Walnut"
    paragraphs:
      - "The Eastern black walnut grows inside a thick green husk that turns black as it ripens, covering a hard, deeply ridged shell. Cracking the shell takes more effort than a common English walnut, and the nutmeat inside has a strong, earthy flavor used in baking and candy making."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Eastern Black Walnut Became Missouri's State Tree Nut"
    paragraphs:
      - "The Missouri Legislature designated the Eastern black walnut the official state tree nut in 1990, recognizing a tree native to the state and important to its nut processing industry."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Missouri Chose the Eastern Black Walnut"
    paragraphs:
      - "Missouri is home to the world's largest black walnut processing facility, located in Stockton, and the tree grows wild throughout the state. That combination of a native tree and an established local industry made the black walnut a fitting choice for the state tree nut."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Eastern Black Walnut Comes From in Missouri"
    paragraphs:
      - "Eastern black walnut trees grow wild across Missouri, and the town of Stockton is home to a major black walnut hulling and processing plant that buys walnuts gathered by people across the region every fall."
    sites:
      - name: Stockton
        city: Stockton
        lat: 37.6942
        lng: -93.7985
        note: "Home to a major black walnut processing plant"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Eastern Black Walnut Facts"
    facts:
      - "Adopted as Missouri's state tree nut in 1990."
      - "Eastern black walnut trees are native to Missouri and grow wild statewide."
      - "Stockton, Missouri is home to a major black walnut processing facility."
      - "The nut's scientific name is Juglans nigra."

