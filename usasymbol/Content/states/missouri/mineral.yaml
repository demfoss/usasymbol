sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Missouri State Mineral
    paragraphs:
      - "Galena is Missouri's official state mineral, designated by the Missouri Legislature in 1967. It is the primary ore of lead, and mining it in southeast Missouri built an industry that once made the state the largest lead producer in the country."
      - "Missouri picked a mineral tied directly to one of its defining industries rather than a rare or decorative material, honoring the ore behind the state's long-running nickname, the Lead State."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Galena?"
    paragraphs:
      - "Galena is a lead sulfide mineral that forms in cubic crystals with a bright, metallic, steel-gray luster and a distinctive blocky, cube-shaped cleavage. Its high density makes even a small piece feel surprisingly heavy in the hand."
      - "The mineral typically forms in hydrothermal deposits, where hot, mineral-rich fluids deposited lead sulfide into cracks and cavities in surrounding rock. In southeast Missouri, galena occurs alongside dolomite in thick ore bodies that made large-scale underground mining practical for over a century."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Missouri Chose Galena as Its State Mineral"
    paragraphs:
      - "Continuous lead mining in southeast Missouri dates back to 1721, and the region's deposits eventually made Missouri the nation's top lead-producing state starting in 1907. Galena was the ore behind essentially all of that production, mined from what became known as the Old Lead Belt."
      - "That mining history ran deep enough into Missouri's identity that the state adopted the nickname the Lead State, and it still ranks among the top lead-producing states today from newer deposits further southeast. Naming galena the state mineral in 1967 formally tied the symbol to an industry that had shaped the region for generations."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Galena Became Missouri's State Mineral"
    paragraphs:
      - "The 74th Missouri General Assembly designated galena the official state mineral on July 21, 1967, recognizing the ore central to the state's lead mining industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Galena Is Found in Missouri"
    paragraphs:
      - "The Old Lead Belt of St. Francois County, centered on the Flat River and Bonne Terre area, was the historic heart of Missouri galena mining from the 1860s until the last mines closed in the early 1970s. Missouri Mines State Historic Site in Park Hills now preserves part of that mining history for visitors."
    sites:
      - name: Missouri Mines State Historic Site
        city: Park Hills
        lat: 37.8420
        lng: -90.4926
        note: "Preserved mill site in the historic Old Lead Belt"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Galena Facts"
    facts:
      - "Adopted as Missouri's state mineral on July 21, 1967."
      - "Missouri became the nation's leading lead producer in 1907, and galena was the ore behind that rank."
      - "Continuous lead mining in southeast Missouri dates back to 1721."
      - "Galena's cube-shaped crystals and heavy weight make it one of the easier minerals for beginners to identify."

