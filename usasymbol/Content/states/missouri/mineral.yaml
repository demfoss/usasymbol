faq:
  - question: What is Missouri's state mineral?
    answer: "Missouri's state mineral is galena, a lead sulfide mineral known for its cubic crystals and heavy, metallic gray appearance."
  - question: When did Missouri adopt galena as its state mineral?
    answer: "The Missouri General Assembly designated galena the official state mineral on July 21, 1967."
  - question: Why did Missouri choose galena?
    answer: "Galena is the ore behind Missouri's lead mining industry, which made the state the nation's top lead producer starting in 1907 and earned it the nickname the Lead State."
  - question: Where can you find galena in Missouri?
    answer: "The historic Old Lead Belt in St. Francois County, around Flat River, Bonne Terre, and Park Hills, was the center of Missouri galena mining for more than a century."

