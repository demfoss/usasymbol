intro_text: Missouri's state aquatic animal is the paddlefish, a big, sharklike fish with a long paddle-shaped snout, adopted in 1997. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Aquatic Animal of Missouri?
  paragraphs:
  - The paddlefish is Missouri's official state aquatic animal. State lawmakers gave it this title in 1997. Its scientific name is Polyodon spathula.
  - State law calls it the paddlefish or spoonbill. Missouri's separate state fish is the channel catfish.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Paddlefish
  paragraphs:
  - The paddlefish looks a bit like a shark with a long, flat snout shaped like a paddle. This snout is called a rostrum, and it gives the fish its nickname, spoonbill.
  - Its back is bluish gray to blackish, and its belly is white. It has almost no scales, a forked tail, and a huge mouth with no teeth in adults.
  - Its skeleton is made of cartilage instead of bone. Paddlefish in Missouri often grow longer than five feet and heavier than 60 pounds.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Aquatic Animal
  paragraphs:
  - The Missouri Legislature named the paddlefish the official state aquatic animal in 1997. It became official on May 23, 1997, which is the same day the channel catfish became the state fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Missouri Chose the Paddlefish
  paragraphs:
  - Official sources name the paddlefish without giving a detailed reason. The state does point out that it is one of Missouri's most unusual fish and easy to recognize by its paddle-shaped snout.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Paddlefish
  paragraphs:
  - Only three rivers in Missouri have large paddlefish populations. They are the Mississippi, the Missouri, and the Osage.
  - Paddlefish also live in some of the state's biggest lakes. Young paddlefish raised in a state hatchery are released into Lake of the Ozarks, Truman Lake, and Table Rock Lake.
