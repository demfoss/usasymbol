- id: facts
  icon: fa-solid fa-lightbulb
  title: Paddlefish Facts
  facts:
  - Adopted in 1997 by the Missouri Legislature.
  - Its scientific name is Polyodon spathula.
  - Often grows longer than five feet and can reach about seven feet.
  - Can live 30 years or more.
  - The state and world record paddlefish, caught in 2024, weighed 164 pounds 13 ounces.
faq:
- question: What is Missouri's state aquatic animal?
  answer: Missouri's state aquatic animal is the paddlefish, also called the spoonbill. State lawmakers made it official in 1997.
- question: When did Missouri adopt the Paddlefish?
  answer: Missouri adopted the paddlefish as its official aquatic animal on May 23, 1997.
- question: Why did Missouri choose the Paddlefish?
  answer: Official sources do not give a detailed reason. The paddlefish lives in Missouri's big rivers and lakes and is easy to recognize by its long snout.
- question: Is the paddlefish Missouri's state fish?
  answer: No. The paddlefish is the state aquatic animal. Missouri's state fish is the channel catfish, and both became official in 1997.
- question: Why is it called a spoonbill?
  answer: It gets the nickname spoonbill from its long, flat snout, which is shaped like a paddle or a spoon.
