sections:
  - id: overview
    icon: fa-solid fa-music
    title: Missouri State Dance
    paragraphs:
      - "Missouri designated square dance its official state American folk dance in 1995. The choice matched a dance already established across the state's rural grange halls, county fairs, and community dance clubs."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance sets four couples into a square, each pair facing the center, and a caller announces every figure just before it happens. Dancers respond to the live call rather than a memorized routine, so the same evening can produce many different sequences."
      - "A string band of fiddle, banjo, and guitar usually carries the music, holding a steady beat for eight dancers moving together. Figures send couples circling, crossing, and turning past one another before the square returns to its original spots."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples position themselves on the four sides of a square, partners side by side, facing in."
      - title: "Honor Your Partner"
        description: "Bow or nod to your partner before the caller begins the first figure."
      - title: "Circle Left as a Group"
        description: "All eight dancers join hands and move around the square together, then reverse on cue."
      - title: "Do-Si-Do Your Corner"
        description: "Pass the dancer on your left, the corner, right shoulder to right shoulder, circling back to back before returning."
      - title: "Promenade Back Home"
        description: "Take your partner's hands and walk together around the square to your starting position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Missouri
    paragraphs:
      - "Missouri's rural communities kept square dance active for generations at grange halls and county fairs, where local callers taught the figures to new dancers each season. That grassroots presence gave the legislature a dance already tied to everyday community life rather than a symbolic addition."
      - "Missouri's 1995 designation also followed the national campaign, active from the 1970s through the 1990s, in which square-dance callers' associations and dance clubs pushed state legislatures to name square dance an official folk dance. Missouri callers and clubs took part in that same effort."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Missouri's Dance
    paragraphs:
      - "Missouri designated square dance its official state American folk dance in 1995, part of the wider wave of states acting during the national square-dance callers' campaign of that period."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Missouri adopted square dance as its official state American folk dance in 1995."
      - "Missouri's grange halls and county fairs kept square dance active across the state for generations."
      - "A caller directs every figure live, so the same basic moves can be arranged into countless sequences."
      - "Square dance music is traditionally played by a string band of fiddle, banjo, and guitar."
      - "Dozens of U.S. states adopted square dance as an official folk dance between the 1970s and 1990s."

