faq:
  - question: What is Missouri's state dance?
    answer: "Missouri's official state American folk dance is square dance, adopted in 1995."
  - question: When did Missouri adopt square dance as its state dance?
    answer: "Missouri adopted square dance as its official state American folk dance in 1995."
  - question: Why did Missouri choose square dance?
    answer: "Square dance was already established in Missouri's grange halls and county fairs, and national callers' associations were pressing states to give it official status."
  - question: Is square dance the same in every state?
    answer: "The basic figures such as circling, do-si-do, and promenade are shared nationwide, but local clubs and callers develop their own regional calling style."

