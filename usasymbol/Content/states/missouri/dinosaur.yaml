  - year: "1942"
    description: "Fossil bones discovered near Leopold in Bollinger County, Missouri, on Pete Wyrrick's farm — among the northernmost Late Cretaceous dinosaur remains ever found east of the Great Plains"
  - year: "1979"
    description: "Donald Baird and John R. Horner formally name Hypsibema missouriensis, placing the Missouri material in Cope's genus as a distinct species"
