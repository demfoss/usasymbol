    description: "Missouri House Bill 1393 designates Hypsibema missouriensis as the official state dinosaur, following a student advocacy campaign"

expert_quote:
  text: "Hypsibema missouriensis is a large hadrosaurid dinosaur from sediments of Campanian or Maastrichtian age exposed in Bollinger County, Missouri."
  source: "Baird & Horner (1979), Notulae Naturae No. 357 — formal description establishing the species"

faq:
  - question: "What is Missouri's state dinosaur?"
    answer: "Missouri's state dinosaur is Hypsibema missouriensis. It was adopted in 2004."

  - question: "Is Hypsibema a valid genus?"
    answer: "Its validity is debated, and some researchers treat Hypsibema as uncertain."

  - question: "Where was Hypsibema missouriensis found?"
    answer: "It was found near Leopold in Bollinger County in 1942."

  - question: "Why are Late Cretaceous dinosaurs rare in Missouri?"
    answer: "Late Cretaceous rock exposures are limited in Missouri, so dinosaur fossils are uncommon."

  - question: "Who campaigned for Missouri's state dinosaur?"
    answer: "Missouri schoolchildren led the 2004 campaign."

