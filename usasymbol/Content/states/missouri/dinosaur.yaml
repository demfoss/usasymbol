faq:
  - question: "What is Missouri's state dinosaur?"
    answer: "Hypsibema is one of paleontology's older unresolved questions — the genus was established in 1869 from fragmentary material and has been disputed or ignored ever since. Hypsibema missouriensis, Missouri's official state dinosaur since House Bill 1393 in 2004, was found on a farm in Bollinger County in 1942 and formally described by Baird and Horner in 1979. Whether Hypsibema itself is a valid genus, or a wastebasket name that should be abandoned, hasn't been definitively settled."

  - question: "Is Hypsibema a valid genus?"
    answer: "The validity of the genus Hypsibema is debated. The original species, H. crassicauda, was named by Cope in 1869 from fragmentary North Carolina material and has been considered a nomen dubium by some researchers. Whether the Missouri species H. missouriensis represents the same genus as the North Carolina material, or whether Hypsibema itself is a valid distinct genus, has not been conclusively resolved."

  - question: "Where was Hypsibema missouriensis found?"
    answer: "The material was found near Leopold in Bollinger County, southeastern Missouri, in 1942. It was discovered during agricultural or construction activity on Pete Wyrrick's farm."

  - question: "Why are Late Cretaceous dinosaurs rare in Missouri?"
    answer: "Missouri's geology is dominated by older Paleozoic rocks in the Ozark region and Quaternary river deposits along its major rivers. Late Cretaceous rock exposures are limited and not as well-surveyed as equivalent formations in the Great Plains. The state's position near the eastern shoreline of the retreating Western Interior Seaway in the Late Cretaceous means hadrosaur remains are geographically possible but not frequently preserved."

  - question: "Who campaigned for Missouri's state dinosaur?"
    answer: "Missouri schoolchildren, working with educators and regional paleontologists, led the campaign for House Bill 1393 in 2004. The designation was geographically natural — the schools most involved were in southeastern Missouri, closest to Bollinger County where the bones were found."

