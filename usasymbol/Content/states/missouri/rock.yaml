sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Missouri State Rock
    paragraphs:
      - "Mozarkite is Missouri's official state rock, designated by the Missouri Legislature in 1967. It is a variety of chert, a hard, fine-grained sedimentary rock, prized less for any industrial use than for the range of bright colors it can show once cut and polished."
      - "The rock's name is itself a Missouri invention, blending Missouri, the Ozarks, and the suffix -ite into a single word coined for the material."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Mozarkite?"
    paragraphs:
      - "Mozarkite is a form of chert, a hard, dense sedimentary rock made mostly of microcrystalline quartz. What sets mozarkite apart from ordinary chert is its color: pieces can appear in shades of green, red, purple, and white, often mottled or banded together in a single stone."
      - "The rock formed within the Cotter Dolomite, a layer of bedrock roughly 450 million years old. Rough mozarkite can look like an unremarkable gray stone, but cutting and polishing it reveals the color patterns that make it popular with lapidary hobbyists."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Missouri Chose Mozarkite as Its State Rock"
    paragraphs:
      - "Interest in collecting mozarkite took off in Benton County in the early 1950s, as local rock hounds began finding and polishing the colorful chert found in the area's fields and creek beds. The name mozarkite was coined during this period specifically for the Missouri material, giving it an identity distinct from chert found elsewhere."
      - "Unlike Missouri's state mineral, galena, mozarkite was never a major industrial resource; its appeal is almost entirely aesthetic and recreational. Lawmakers recognized that hobbyist appeal in 1967, the same year they designated galena the state mineral."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Mozarkite Became Missouri's State Rock"
    paragraphs:
      - "The Missouri Legislature adopted mozarkite as the official state rock on July 21, 1967, the same day it named galena the state mineral, recognizing a stone already popular among Missouri rock collectors."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Mozarkite Is Found in Missouri"
    paragraphs:
      - "Benton County, in west-central Missouri, is the traditional center of mozarkite collecting, particularly around the town of Lincoln. Rock hounds still search fields and creek gravel in the area for pieces of the colorful chert today."
    sites:
