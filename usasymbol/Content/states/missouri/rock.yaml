  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Mozarkite Facts"
    facts:
      - "Adopted as Missouri's state rock on July 21, 1967, the same day galena became the state mineral."
      - "The name mozarkite blends Missouri, Ozarks, and the mineral suffix -ite."
      - "Mozarkite occurs within the Cotter Dolomite, bedrock roughly 450 million years old."
      - "Collecting interest in mozarkite began around Benton County in the early 1950s."

