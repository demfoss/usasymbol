faq:
  - question: What is Missouri's state rock?
    answer: "Missouri's state rock is mozarkite, a colorful variety of chert that can appear in shades of green, red, and purple when polished."
  - question: When did Missouri adopt mozarkite as its state rock?
    answer: "The Missouri Legislature designated mozarkite the official state rock on July 21, 1967."
  - question: Why did Missouri choose mozarkite?
    answer: "Rock hounds in Benton County had been collecting and polishing the colorful chert since the early 1950s, and lawmakers recognized that established hobbyist tradition with the 1967 designation."
  - question: Where can you find mozarkite in Missouri?
    answer: "Benton County, especially around the town of Lincoln, remains the traditional center for finding mozarkite in fields and creek gravel."

