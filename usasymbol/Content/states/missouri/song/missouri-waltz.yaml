faq:
  - question: What is Missouri's state song?
    answer: "Missouri's official state song is the \"Missouri Waltz,\" adopted in 1949."
  - question: Who wrote Missouri's state song?
    answer: "J.R. Shannon wrote the lyrics, with the melody arranged by Frederic K. Logan and credited to John V. Eppel."
  - question: When did Missouri adopt the "Missouri Waltz" as its state song?
    answer: "The Missouri General Assembly adopted it as the official state song on June 30, 1949."
  - question: Was the "Missouri Waltz" really President Truman's favorite song?
    answer: "It was widely reported as such, and the association boosted the song's sales, though Truman later downplayed the claim."

