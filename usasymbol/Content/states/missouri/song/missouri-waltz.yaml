sections:
  - id: overview
    icon: fa-solid fa-music
    title: Missouri State Song
    paragraphs:
      - "The \"Missouri Waltz\" is Missouri's official state song, first published in 1914 and adopted by the General Assembly on June 30, 1949. J.R. Shannon wrote the lyrics, and the melody was arranged by Frederic K. Logan from an earlier tune credited to John V. Eppel."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Missouri Waltz\" Explained"
    paragraphs:
      - "The song is a slow, sentimental waltz built around a lullaby remembered from childhood, set in three-quarter time typical of ballroom waltz music of its era. Its gentle, unhurried melody made it popular for both singing and instrumental performance."
      - "The tune's origins trace to ragtime pianist Lee Edgar Settle, whose melody was later arranged by Frederic Knight Logan and published with lyrics by J.R. Shannon in 1914. Early recordings by the Victor Military Band and other orchestras sold modestly at first, and the song did not become a hit for years."
      - "By 1939 the song had sold six million copies, and its fortunes rose again after Missourian Harry S. Truman became president, when it was widely reported as his favorite song, though Truman himself later downplayed the connection publicly."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Missouri Waltz" Represents Missouri
    paragraphs:
      - "By the late 1940s, the \"Missouri Waltz\" was already a nationally known standard with a strong, if partly coincidental, tie to the sitting president's home state. That combination of national familiarity and a Missouri connection made it a natural choice for lawmakers."
      - "The song's slow waltz style also gave Missouri an anthem distinct from the marches and patriotic hymns many other states had chosen, setting it apart in tone from typical state songs of the period."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Missouri Waltz\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Missouri Waltz" Became Missouri's State Song
    paragraphs:
      - "The Missouri General Assembly adopted the \"Missouri Waltz\" as the official state song on June 30, 1949, thirty-five years after its original 1914 publication. Its national popularity, boosted by its association with President Harry Truman, had already made it familiar to most Missourians before lawmakers acted."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Missouri Waltz\" Facts"
    facts:
      - "Missouri adopted the \"Missouri Waltz\" as its official state song in 1949."
      - "The song was first published in 1914, thirty-five years before its official adoption."
      - "By 1939 the song had sold six million copies of sheet music and recordings."
      - "President Harry S. Truman was widely reported to favor the song, boosting its national popularity."

