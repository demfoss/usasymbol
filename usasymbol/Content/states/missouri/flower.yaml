type: State Flower
state: Missouri
name: White Hawthorn Blossom
scientific_name: Crataegus punctata
adopted_year: 1923
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-23"
seo_title: "Missouri State Flower | White Hawthorn Blossom"
seo_description: "The White Hawthorn Blossom became Missouri's state flower in 1923. These fragrant white flowers bloom on hawthorn trees across Missouri each spring."

intro_text: "Missouri designated the White Hawthorn Blossom as its official state flower in 1923. These small white flowers bloom in clusters on hawthorn trees throughout Missouri. Fragrant blossoms appear across the state each spring transforming hawthorn trees into clouds of white. This profile appears in the [list of U.S. state flowers](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Missouri State Flower?"
    paragraphs:
      - "The White Hawthorn Blossom holds the position of Missouri's official state flower. Each flower displays five white petals arranged in a star shape. Pink stamens extend from the center. The blooms measure about half an inch across. Flowers grow in dense clusters containing 10 to 20 individual blossoms. A strong sweet fragrance attracts bees and other pollinators."
      - "Hawthorn trees bloom from April through May across Missouri. Peak flowering occurs in late April and early May. The blooming period lasts about two weeks. Trees produce thousands of white flower clusters. Small thorny branches characterize hawthorn trees. The trees grow 15 to 25 feet tall. Dark green serrated leaves appear after flowers bloom."
      - "Native hawthorn species grow wild throughout Missouri in various habitats. Open woodlands provide ideal growing conditions. The trees thrive along fence rows and field edges. Well-drained soil suits hawthorns best. Full sun produces the most abundant blooms. Red berries called haws develop after flowers fade in fall."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Missouri State Flower Name"
    paragraphs:
      - "Known as White Hawthorn Blossom, this flower's scientific designation is Crataegus punctata for one common Missouri species. The plant belongs to the Rosaceae family. This enormous family includes roses, apples, cherries, and thousands of other flowering species worldwide."
      - "The genus name Crataegus comes from Greek words meaning strength. It refers to the hard wood and strong thorns. The species name punctata means spotted, describing dots on the fruit. Common hawthorn and dotted hawthorn serve as alternative names. May tree appears in some older texts because of the May blooming period."
      - "Missouri never specified which hawthorn species represents the state. Over 20 native hawthorn species grow in Missouri. The 1923 designation simply said hawthorn blossom without naming a particular type. This allows all native Missouri hawthorn species to serve as state symbols. Most share similar white flowers and spring blooming habits."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the White Hawthorn Blossom Became the Missouri State Flower"
    paragraphs:
      - "Missouri adopted the White Hawthorn Blossom as its official state flower in 1923. The Missouri legislature made this choice following advocacy by women's clubs. School children throughout Missouri participated in voting for their favorite native flower. The hawthorn blossom won this informal vote among students and later reinforced [The Show-Me State nickname](/states/missouri/nickname/the-show-me-state)."
      - "Missouri wanted a native flower that grew abundantly across the entire state. Hawthorn trees met this requirement perfectly. The white blooms symbolized purity and spring renewal. Native status made hawthorn preferable to imported ornamental flowers. The trees required no special cultivation to thrive in Missouri."
      - "Some people suggested the wild rose or goldenrod instead. Supporters of the hawthorn argued its widespread distribution made it most representative. The dramatic spring display impressed legislators. The designation passed without significant opposition. Missouri formalized the White Hawthorn Blossom as state flower on March 16, 1923, in a civic tradition that also produced the [official Missouri state tree](/states/missouri/tree/flowering-dogwood)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Missouri State Flower Facts"
    facts:
      - "Over 20 species of hawthorn grow naturally in Missouri, all producing clusters of white flowers in spring"
      - "Hawthorn trees have long sharp thorns that can reach 3 inches in length, serving as protection against browsing animals"
      - "Missouri adopted the White Hawthorn Blossom on March 16, 1923, following an informal vote by school children across the state"
      - "Native Americans and early settlers used hawthorn berries for food and medicine, with the fruits remaining edible after frost"
      - "Hawthorn wood is extremely hard and dense, historically used for making tool handles, fence posts, and walking sticks"
      - "The trees provide important wildlife habitat with flowers feeding pollinators in spring and berries feeding birds through fall and winter"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Missouri State Flower and Bird"
    paragraphs:
      - "The Eastern Bluebird serves as Missouri's state bird, a small songbird with brilliant blue plumage and rusty red breast. Both symbols represent Missouri officially. Missouri adopted the White Hawthorn Blossom in 1923 and designated the Eastern Bluebird as state bird in 1927; compare with the [Missouri state bird page](/states/missouri/bird/eastern-bluebird)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the White Hawthorn Blossom Symbolizes"
    paragraphs:
      - "The White Hawthorn Blossom is often associated with hope and renewal in traditional flower symbolism. The flower has been linked to Missouri's rural heritage and agricultural landscapes. Its white blooms traditionally symbolize purity and new beginnings while the hardy tree carries connotations of strength and resilience across Missouri's varied terrain, with related civic language in the [Missouri state motto](/states/missouri/motto/salus-populi-suprema-lex-esto)."

  - id: "regional-context"
    icon: "fa-solid fa-map"
    title: "Regional Context"
    paragraphs:
      - "Missouri's hawthorn habitat stretches across uplands, farm edges, and riparian corridors that connect to neighboring states in multiple ecological zones. Regional variation in climate and soils shapes flowering timing and berry production from one county to the next, consistent with patterns shown in [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Missouri's state flower?"
    answer: "Missouri's state flower is the White Hawthorn Blossom, a small fragrant white flower that blooms in clusters on hawthorn trees throughout the state each spring."
  
  - question: "When did Missouri adopt the White Hawthorn Blossom as its state flower?"
    answer: "Missouri adopted the White Hawthorn Blossom on March 16, 1923. The designation followed an informal vote by school children who selected it as their favorite native flower."
  
  - question: "Why did Missouri choose the White Hawthorn Blossom?"
    answer: "Missouri chose the White Hawthorn Blossom because hawthorn trees grew abundantly across the entire state. School children voted for it by a wide margin. The white blooms symbolized purity and spring renewal. Native status made it preferable to imported ornamental flowers."
  
  - question: "Which species of hawthorn is Missouri's state flower?"
    answer: "Missouri never specified a particular hawthorn species as the state flower. Over 20 native hawthorn species grow in Missouri. The 1923 designation allows all native Missouri hawthorn species to serve as state symbols."
  
  - question: "When do hawthorn trees bloom in Missouri?"
    answer: "Hawthorn trees bloom from April through May in Missouri, with peak flowering occurring in late April and early May. The blooming period lasts about two weeks, with trees producing thousands of white flower clusters."

