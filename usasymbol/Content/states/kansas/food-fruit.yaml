sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Kansas's State Fruit?"
    paragraphs:
      - "The sandhill plum is Kansas's official state fruit, designated by the Kansas Legislature in 2022. It grows wild on shrubby thickets across the state's sandy prairie regions."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Sandhill Plum"
    paragraphs:
      - "Sandhill plums are small, round, red to purple fruits that grow wild on thorny shrubs across the Great Plains. They have a tart skin and sweet flesh, and are commonly gathered by hand in late summer for jams, jellies, and syrups."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Sandhill Plum Became Kansas's State Fruit"
    paragraphs:
      - "The Kansas Legislature designated the sandhill plum the official state fruit in 2022, following a campaign led by Kansas students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Kansas Chose the Sandhill Plum"
    paragraphs:
      - "The sandhill plum grows wild across the sandhill and prairie regions of central and western Kansas, and generations of families have gathered the fruit to make homemade jams and jellies, making it a genuinely native Kansas food."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Sandhill Plum Facts"
    facts:
      - "Adopted as Kansas's state fruit in 2022."
      - "Sandhill plums grow wild on thorny shrubs across the Great Plains."
      - "The fruit is commonly used to make jams, jellies, and syrups."

