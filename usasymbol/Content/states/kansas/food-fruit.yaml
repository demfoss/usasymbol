faq:
  - question: "What is Kansas's state fruit?"
    answer: "Kansas's state fruit is the sandhill plum, adopted by the Kansas Legislature in 2022."
  - question: "When did Kansas adopt the sandhill plum as its state fruit?"
    answer: "The Kansas Legislature designated the sandhill plum the official state fruit in 2022."
  - question: "Why did Kansas choose the sandhill plum?"
    answer: "The sandhill plum grows wild across Kansas's prairie and sandhill regions and has long been gathered by families for homemade jams and jellies."
  - question: "Is the sandhill plum grown or gathered in Kansas today?"
    answer: "Sandhill plums still grow wild across Kansas and are gathered by hand rather than farmed commercially."

