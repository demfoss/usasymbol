faq:
  - question: "What are the official colors of Kansas?"
    answer: "The traditional state colors of Kansas are Blue and Gold, derived from the Kansas state flag adopted in 1927. The deep blue field matches the blue of the United States flag as specified by Kansas Statute 73-702, while gold appears in the sunflower petals and the 'KANSAS' lettering."
  - question: "What is the HEX code for Kansas Blue?"
    answer: "The standard HEX code for Kansas Blue is #003082, corresponding to Pantone PMS 286, matching the blue of the United States flag as specified in Kansas Statute 73-702 governing the state flag."
  - question: "What is the HEX code for Kansas Gold?"
    answer: "The standard HEX code for Kansas Gold is #E8A825, corresponding to Pantone PMS 7549, representing the golden petals of the wild native sunflower on the Kansas state flag and the gold 'KANSAS' lettering."
  - question: "Why does Kansas use blue and gold?"
    answer: "Kansas uses blue to match the United States flag, honoring its identity as a Union state admitted in 1861, and gold to represent the wild native sunflower — the official state flower since 1903 — and the golden wheat fields that make Kansas the nation's leading wheat-producing state."
  - question: "What is the twisted bar on the Kansas flag?"
    answer: "The twisted bar of blue and gold beneath the sunflower in the Kansas state crest is a heraldic torse that explicitly represents the Louisiana Purchase of 1803, through which the United States acquired the Kansas territory from Napoleonic France. The bar's blue and gold colors mirror the flag's own color palette."
  - question: "Who designed the Kansas state flag?"
    answer: "The Kansas state flag was designed by Hazel Avery, a Kansas native and member of the Daughters of the American Revolution. The legislation adopting her design was pushed to passage by Kansas Adjutant General Milton R. McLean, and the flag was first flown at Fort Riley by Governor Ben Paulin on March 23, 1927."
  - question: "Why is Kansas called the Sunflower State?"
    answer: "Kansas is called the Sunflower State because the wild native sunflower (Helianthus annuus) has been the official state flower since 1903 and grows abundantly across the state's prairies and roadsides. The golden sunflower on the state flag is the primary source of gold in Kansas's traditional blue-and-gold color palette."

