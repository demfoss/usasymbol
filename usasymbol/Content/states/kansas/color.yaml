sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Kansas has not passed a separate state-colors law. Blue and gold are the traditional state colors through the Kansas state flag, adopted on March 23, 1927, and governed by Kansas Statute 73-702, which specifies the flag as a blue field matching the blue of the United States flag, bearing the state seal at center, the sunflower crest above, and from 1961 onward the word 'KANSAS' in gold block lettering below. Kansas Statute 73-702 is one of the more detailed state flag specifications in the United States, prescribing the relative dimensions of the sunflower — 'having a diameter of two-thirds of the space of the banner' — and the twisted blue-and-gold bar beneath it that represents the Louisiana Purchase, closely tied to [Kansas nickname history](/states/kansas/nickname/the-sunflower-state)."
      - "The path to the 1927 flag was a 13-year process of rancorous debate that began in 1914 following Kansas's semicentennial of statehood. Governor Arthur Capper initiated the flag discussion in 1915 by writing to other states to learn how they had selected their flags. A 1916 DAR design competition produced a winning entry by Esther Northrup of Lawrence featuring red, white, and blue stripes with a gold sunflower on a blue canton, but the Kansas Legislature rejected it in 1917. Further designs were proposed, including one by Topeka artist Albert T. Reid featuring a gold sunflower on blue that received popular acceptance. The legislature adopted a blue-field state banner in 1925 — designed to hang from a horizontal bar and unsuitable for display alongside other state flags — before finally adopting the vertical flag designed by Hazel Avery in 1927."
    subsections:
      - subtitle: "Hazel Avery and Kansas Statute 73-702"
        text: "The winning 1927 flag design was created by Hazel Avery, a Kansas native and member of the Daughters of the American Revolution, with the legislation pushed to passage by Kansas Adjutant General Milton R. McLean. The flag was first flown at Fort Riley by Governor Ben Paulin for the Kansas National Guard. Kansas Statute 73-702 defines the flag with precision unusual for state flag legislation: it specifies that the blue field must match 'the same tint as the color of the field of the United States flag,' that the sunflower diameter must be 'two-thirds of the space of the banner,' and that the sunflower must have 'petals of gold' and 'a brown center having a diameter of two-fifths the size of the sunflower.' The word 'KANSAS' in gold block lettering was added below the state seal on September 24, 1961, completing the flag's current design and reinforcing values linked to [Ad Astra per Aspera](/states/kansas/motto/ad-astra-per-aspera)."
      - subtitle: "The Louisiana Purchase Bar"
        text: "One of the most historically specific elements of the Kansas flag — and a direct source of its blue-and-gold color tradition — is the twisted bar of blue and gold beneath the sunflower in the state crest. This heraldic torse (a twisted wreath of silk) is explicitly described in Kansas tradition as representing the Louisiana Purchase of 1803, through which the United States acquired the Kansas territory from Napoleonic France for approximately $15 million. The bar's two colors — blue and gold — are the colors of the Kansas flag itself, creating a self-referential design in which the flag's own color palette is encoded into one of its symbolic elements. Kansas was part of the Louisiana Purchase territory that was divided among 13 modern states when the purchase was completed."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Kansas's blue and gold are rooted in two of the state's most defining natural and historical realities: the vast sky and the wild native sunflower. The deep blue that dominates the flag's field is the blue of the endless Kansas sky — the sky that arches unbroken over the Flint Hills tallgrass prairie, the High Plains wheat fields, and the Smoky Hills — while the gold of the sunflower is the color of the state's defining wildflower and its most important agricultural crop. Together, blue and gold function as a color shorthand for the Kansas landscape itself: the deep sky and the golden prairie that stretch from the Missouri River to the Colorado border."
    subsections:
      - subtitle: "Blue in Kansas History"
        text: "Kansas's association with blue is rooted both in the flag's explicit statutory requirement to match US-flag blue and in the state's deep Civil War identity. Kansas was admitted to the Union on January 29, 1861, as a free state, just months before the Civil War began — and its admission as the 34th state was itself a consequence of the bitter Bleeding Kansas conflict of the 1850s, in which pro-slavery and anti-slavery settlers fought a violent proxy war over whether Kansas would enter the Union as a free or slave state. Kansas supplied approximately 23,000 soldiers to the Union Army during the Civil War — a large number for a state with a total population of only about 107,000 in 1861 — and the state's blue flag reflects this deep identification with the Union cause. The blue of the Kansas flag sky also references the physical reality of the Great Plains landscape, where the sky dominates the visual experience of the flat terrain in a way unmatched by more topographically varied states."
      - subtitle: "Gold in Kansas History"
        text: "Gold on the Kansas flag derives its primary meaning from the sunflower — designated the official state flower in 1903 — whose brilliant golden-yellow petals make it the single most recognizable botanical symbol of Kansas. The wild native sunflower (Helianthus annuus) was a vital resource for the Indigenous peoples of the Great Plains long before European settlement, providing food, oil, dye, and medicine. Kansas tradition holds that the 'open frankness of the sunflower is indicative of the fearlessness with which Kansas meets her problems and solves them' — a philosophical interpretation that makes the gold of the sunflower both a color and a civic virtue. Gold also speaks to Kansas's dominant agricultural identity: Kansas harvests more winter wheat than any other state, and the golden expanses of ripening wheat in June — the primary harvest season — have given Kansas the informal designation of 'America's Breadbasket,' a landscape whose defining color is the same warm gold as the sunflower petals on the state flag."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Blue and gold dominate the Kansas state flag, governed by Kansas Statute 73-702, which flies at the Kansas State Capitol in Topeka and all state government buildings. Kansas also maintains a separate state banner — adopted June 30, 1953, and governed by its own statutory provision — featuring a single large sunflower with gold petals and a brown center on a solid blue field, providing a simplified blue-and-gold alternative to the more complex state flag for use by the Kansas National Guard and in the governor's office. The Kansas state seal, specified by the first Kansas Legislature in 1861 and depicting scenes of pioneer life including a farmer plowing, a steamboat on the Kansas River, a wagon train heading west, and Native Americans hunting bison, uses a broader palette of colors, but the flag's blue-and-gold framework remains the dominant public imagery for Kansas in official state communications, athletic contexts, and public branding. The University of Kansas uses crimson and blue as its official colors, while Kansas State University uses purple and silver-white — but the state government's official blue and gold, drawn directly from the 1927 flag, remain the foundation of Kansas's governmental public imagery and are cataloged in [U.S. state colors](/symbols/colors)."

      - "For comparative statehood context, this color history is often read with [states and capital cities reference data](/rankings/geography/states-capital-cities)."

