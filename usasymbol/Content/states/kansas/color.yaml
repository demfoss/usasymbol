seo_description: "Kansas state colors are Blue and Gold, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Kansas are **Blue** and **Gold**, derived from [the Kansas state flag](/states/kansas/flag/kansas-state-flag) adopted in 1927. No separate state-colors law exists, but blue and gold are widely recognized as the traditional colors of the Sunflower State through the state flag, state branding, and official insignia. For Kansas, the reference values cover HEX, RGB, CMYK, and Pantone for comparing palettes across [U.S. state colors](/symbols/colors)."

official_colors: "Blue and Gold"
official_since: "Traditional (based on 1927 state flag; Kansas Statute 73-702)"
primary_use: "State Flag, state banner, state government branding, Kansas state agency insignia"
known_for: "The deep blue field of the state flag bearing a golden sunflower — Kansas's official state flower since 1903 — alongside the twisted blue-and-gold Louisiana Purchase bar beneath the sunflower crest; the sunflower is described in Kansas tradition as emblematic of 'the open frankness and fearlessness with which Kansas meets her problems'"

