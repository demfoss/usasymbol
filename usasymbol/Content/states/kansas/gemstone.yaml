faq:
  - question: What is Kansas's state gemstone?
    answer: "Kansas's state gemstone is jelinite, a rare fossil amber formed from ancient conifer resin, adopted by the Kansas Legislature in 2018."
  - question: When did Kansas adopt jelinite as its state gemstone?
    answer: "The Kansas Legislature designated jelinite the official state gemstone in 2018."
  - question: Why did Kansas choose jelinite?
    answer: "Jelinite is a fossil amber unique to Kansas, first documented near the Smoky Hill River in the late 1930s by teacher George Jelinek, for whom it is named."
  - question: Where can you find jelinite in Kansas?
    answer: "The original site sat along the Smoky Hill River in Ellsworth County, but it was submerged when Kanopolis Reservoir was built between 1948 and 1951, making new specimens extremely hard to find."

