intro_text: "Kansas's state gemstone is jelinite, a rare fossil amber adopted in 2018 and named for the schoolteacher who first documented it along the Smoky Hill River in the 1930s. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Kansas State Gemstone
    paragraphs:
      - "Jelinite is Kansas's official state gemstone, designated by the Kansas Legislature in 2018. It is a fossilized tree resin, a form of amber, that formed roughly 100 million years ago during the Cretaceous period."
      - "Kansas has almost no gem-quality stones of its own, which makes jelinite unusual among state gemstones: it is genuinely rare, collected historically from a single small site that no longer exists above ground."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Jelinite?"
    paragraphs:
      - "Jelinite is fossilized conifer resin, butterscotch to brown in color, with a waxy shine and a cloudy-to-translucent appearance. It often shows faint concentric bands, somewhat like agate, and breaks with a smooth, shell-shaped fracture."
      - "The resin formed within the Kiowa Formation, trapped in a thin bed of pale clay between two layers of ancient lignite. Chemical testing found succinic acid inside it, consistent with amber produced by conifer trees."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Kansas Chose Jelinite as Its State Gemstone"
    paragraphs:
      - "Jelinite is named for George Jelinek, a teacher and amateur archaeologist who first documented the resin along the Smoky Hill River in Ellsworth County in 1937 and 1938. Kansas has few true gemstones, so a fossil amber unique to the state and tied to a specific local discovery stood out as a fitting choice."
      - "Its extreme rarity adds to the appeal. The original collecting site was flooded during construction of Kanopolis Reservoir between 1948 and 1951, so nearly all known jelinite specimens were gathered before the site disappeared underwater."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Jelinite Became Kansas's State Gemstone"
    paragraphs:
      - "The Kansas Legislature designated jelinite the official state gemstone in 2018, the same bill that named galena the state mineral and Greenhorn limestone the state rock."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Jelinite Is Found in Kansas"
    paragraphs:
      - "Jelinite came from a single locality along the Smoky Hill River in Ellsworth County, near present-day Kanopolis Reservoir. The site was submerged when the reservoir was built in the late 1940s, so the original source is no longer accessible."
    sites:
      - name: Kanopolis Reservoir
        city: Ellsworth
        lat: 38.6420
        lng: -98.1352
        note: "Near the original, now-submerged jelinite site"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Jelinite Facts"
    facts:
      - "Adopted as Kansas's state gemstone in 2018."
      - "Jelinite is named for George Jelinek, who first documented the fossil resin near the Smoky Hill River in 1937 to 1938."
      - "The formation of Kanopolis Reservoir between 1948 and 1951 submerged the original collecting site, making jelinite one of the rarest state gemstones in the country."
      - "Chemical analysis of jelinite found succinic acid, a marker typical of resin produced by ancient conifer trees."

