type: State Flag
state: Kansas
name: Kansas State Flag
adopted_year: 1927
standardized_year: 1961
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-05-01"

seo_title: "Kansas State Flag | Sunflower, Bison & Meaning"
seo_description: "Kansas's flag seal shows a bison herd stampede. The sunflower and the word KANSAS weren't added until 1963 — 36 years after the flag was adopted."

intro_text: "In 1927, Kansas adopted a flag that features the state seal and a sunflower. The design displays imagery from Kansas history on a dark blue field. The word Kansas appears in yellow letters beneath the seal, with language tied to [Kansas's state motto](/states/kansas/motto/ad-astra-per-aspera)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Kansas State Flag Is Designed"
    paragraphs:
      - "The Kansas state flag is the official banner of Kansas. A dark blue field covers the entire background. The state seal sits in the center. A sunflower rests on a twisted bar above the seal, and the design appears in the [list of U.S. state flags](/symbols/flags)."
      - "The word Kansas appears below in yellow block letters. The seal shows multiple elements from Kansas history. Government offices, schools, and public sites in Kansas display this flag."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Kansas Flag Communicates"
    paragraphs:
      - "The flag centers on the state seal. That seal summarizes Kansas history from settlement through statehood. Agriculture, westward expansion, and commerce appear in the imagery."
      - "The sunflower symbolizes Kansas itself. The state chose the sunflower as its official flower in 1903. That was two decades before the flag existed. The flower represents plains landscape and agricultural strength and anchors [Kansas's state flower page](/states/kansas/flower/sunflower)."
      - "Dark blue matches the color in the United States flag. It connects Kansas to the Union. The color reflects loyalty during and after the Civil War."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Kansas Flag History and Adoption"
    paragraphs:
      - "Kansas authorized its flag in 1927. The state had gone decades without an official banner. Legislators approved a design with the state seal on blue. No designer received official credit. The seal itself dated to 1861, with broader context in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "The 1927 flag had no state name on it. People couldn't identify it from a distance. Other states used similar blue backgrounds. Confusion was common."
      - "The legislature changed the design in 1961. Workers added the state name in yellow letters. The sunflower crest got written into the updated statute. This version remains official today."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Kansas Flag"
    versions:
      - name: "Original State Flag"
        years: "1927–1961"
        image: "versions/original-1927.webp"
        description: "The first official flag showed only the state seal and sunflower on blue. No state name appeared."

      - name: "Modified State Flag"
        years: "1961–present"
        image: "versions/modified-1961.webp"
        description: "The current flag adds Kansas in yellow letters below the seal."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Kansas Flag"
    symbols:
      - id: seal
        name: "Kansas State Seal"
        image: "symbols/seal.svg"
        paragraphs:
          - "The state seal depicts a sunrise over a prairie scene with a steamboat and covered wagons. Kansas adopted this seal in 1861 when it became a state. A landscape shows sunrise, a river, a steamboat, and settlers."
          - "Thirty-four stars form a semicircle above the landscape. Kansas entered as the thirty-fourth state. A bison and Native Americans on horseback appear in the middle ground. A farmer plows a field in the foreground."
          - "The motto Ad astra per aspera sits on a scroll at the top. The Latin translates to through hardships to the stars. It reflects Kansas history during the territorial period and Civil War."

      - id: sunflower
        name: "Kansas State Flag Sunflower"
        image: "symbols/sunflower.svg"
        paragraphs:
          - "A sunflower sits on a twisted bar above the seal. Kansas made the sunflower its state flower in 1903. The plant grows abundantly across Kansas and supports the identity of [the Sunflower State](/states/kansas/nickname/the-sunflower-state). It became a symbol of state identity."
          - "The sunflower ties the flag to natural landscape. It separates Kansas from other states using seal-on-blue layouts."

      - id: text
        name: "Kansas State Flag Text"
        image: "symbols/text.svg"
        paragraphs:
          - "Kansas appears in yellow capital letters below the seal. The legislature added this in 1961. The change made the flag easier to identify."
          - "The lettering uses bold sans-serif type. Yellow contrasts with dark blue. It matches the sunflower above."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Kansas State Flag Colors"
    paragraphs:
      - "The flag uses dark blue, yellow, green, brown, and white. Blue matches the shade in the United States flag. Yellow appears in the sunflower and state name. The seal contains multiple colors for landscape elements."
    colors:
      - name: "Dark Blue"
        hex: "#002868"
      - name: "Yellow"
        hex: "#FFD100"
      - name: "Green"
        hex: "#00843D"
      - name: "Brown"
        hex: "#6B4423"
      - name: "White"
        hex: "#FFFFFF"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Kansas State Flag Facts"
    facts:
      - "Kansas adopted its state flag in 1927"
      - "The state seal on the flag dates to 1861"
      - "Thirty-four stars mark Kansas as the 34th state"
      - "The word Kansas was added in 1961"
      - "A sunflower sits above the seal on a twisted bar"
      - "The motto Ad astra per aspera appears on the seal"

faq:
  - question: "What is the official state flag of Kansas?"
    answer: "The Kansas state flag is the official banner of Kansas. It features the state seal, a sunflower, and the word Kansas on a dark blue field."

  - question: "How would you describe the design of the Kansas state flag?"
    answer: "The flag shows the Kansas state seal centered on dark blue. A sunflower sits above. The word Kansas appears below in yellow letters."

  - question: "How do historians explain the symbolism of Kansas' flag?"
    answer: "The flag represents Kansas history through the state seal. That seal depicts agriculture, westward expansion, and settlement. The sunflower symbolizes the state's natural landscape."

  - question: "When did Kansas adopt its current state flag?"
    answer: "Kansas adopted its state flag in 1927 and modified it in 1961."

  - question: "Which emblems or icons are shown on Kansas' flag?"
    answer: "The thirty-four stars represent Kansas as the thirty-fourth state admitted to the Union in 1861."

  - question: "What are the key symbols on Kansas' flag?"
    answer: "A bison appears on the state seal in the center of the flag."

