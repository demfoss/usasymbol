unique_surnames:
  - name: Unruh
    state_rank: 450
    national_rank: 2000 # UNVERIFIED
    origin: german
    why: "Derived from German 'Unruhe' (restlessness), this Mennonite surname is concentrated in Harvey and Reno counties. German-Russian Mennonites from the Molotschna colony settled there in 1874, making central Kansas the US center of this name."

  - name: Friesen
    state_rank: 550
    national_rank: 2500 # UNVERIFIED
    origin: german
    why: "A Low German name denoting someone from Friesland, brought to Harvey and Reno counties by Mennonite settlers in 1874. Friesen appears far more frequently in Kansas than in any other state."

  - name: Hiebert
    state_rank: 650
    national_rank: 3000 # UNVERIFIED
    origin: german
    why: "A German variant of Hilbert, meaning 'bright sword,' concentrated in Harvey and McPherson counties. It arrived with the 1874 Mennonite migration from Russia and remains rare outside the Kansas-Oklahoma corridor."

  - name: Regier
    state_rank: 750
    national_rank: 4500 # UNVERIFIED
    origin: german
    why: "From Old High German 'Rüdiger,' meaning fame and spear, this surname is virtually exclusive to the Mennonite communities of Harvey and Marion counties. It is almost unknown outside the central Kansas Mennonite belt."

etymology_groups:
  - type: "English Occupational Surnames"
    icon: fa-solid fa-hammer
    description: "Kansas's frontier economy — smithing, milling, tailoring, and clerking — ensured occupational surnames dominated from the start. Names like Smith, Miller, and Clark arrived with Anglo-American settlers along the Santa Fe Trail and became fixtures in every eastern Kansas county."
    examples:
      - Smith (metalworker)
      - Miller (grain miller)
      - Taylor (tailor)
      - Clark (clerk or scholar)

  - type: "German-Russian Mennonite Surnames"
    icon: fa-solid fa-wheat-awn
    description: "In 1874, thousands of Mennonites fleeing Russian conscription settled in Harvey, Reno, and McPherson counties, introducing Low German surnames virtually unknown elsewhere in America. Their Turkey Red wheat transformed Kansas into the nation's breadbasket."
    examples:
      - Unruh (restlessness)
      - Friesen (from Friesland)
      - Hiebert (bright sword)
      - Regier (fame and spear)

  - type: "Hispanic Surnames"
    icon: fa-solid fa-sun
    description: "Southwest Kansas attracted Mexican and Central American workers after IBP opened its Garden City beef-processing plant in 1980. Garcia, Martinez, and related names are now among the most common surnames in Finney and Seward counties."
    examples:
      - Garcia (Basque habitational)
      - Martinez (son of Martin)
      - Lopez (son of Lope)
      - Hernandez (son of Hernando)

faq:
  - question: "What are the most common last names in Kansas?"
    answer: "The most common last names in Kansas are Smith, Johnson, Williams, Brown, and Jones, with Garcia and Martinez also reaching the top 20. The statewide list combines older frontier settlement with newer migration into southwest Kansas."

  - question: "What surnames reflect Kansas's Mennonite heritage?"
    answer: "Unruh, Friesen, Hiebert, and Regier are Low German Mennonite surnames concentrated in Harvey, Reno, and McPherson counties, where German-Russian settlers arrived in 1874. These popular last names in Kansas are rare almost everywhere else in the United States."

  - question: "Why are Garcia and Martinez so common in southwest Kansas?"
    answer: "Garcia and Martinez surged in southwest Kansas after IBP opened large beef-processing plants in Garden City and Liberal in the 1980s. The meatpacking industry drew workers from Mexico and Central America, making Finney and Seward counties among the most Hispanic-majority counties in the state."

