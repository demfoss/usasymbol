seo:
  title: "Most Common Last Names in Kansas"
  description: "Smith remains the most common last name in Kansas — but Unruh and Friesen also rank, brought by Mennonites from South Russia in 1874."

page:
  h1: "Most Common Last Names in Kansas"
  intro: "Unruh and Friesen appear in Kansas's top 50 and almost nowhere else in the United States — German-Russian Mennonites from the steppes of South Russia settled Harvey and McPherson counties in the 1874 wave, bringing winter wheat and a surname tradition unlike anything else on the plains. Garcia and Martinez now rank among the state's fastest-growing names, drawn by Garden City and Liberal meatpacking plants."
  heritage_title: "Pioneer Settlers, Mennonite Farmers & Meatpacking Communities"
  heritage_body: "German-Russian Mennonites arrived in Harvey, Reno, and McPherson counties in the 1870s, introducing distinctive surnames like Unruh and Friesen. English and Scots-Irish pioneers staked claims across eastern Kansas during the territorial era. Since the 1980s, Hispanic workers drawn to Garden City and Liberal meatpacking plants have made Garcia and Martinez fixtures of southwest Kansas."
  fun_fact: "Lindsborg in Saline County, settled by Swedish immigrants in 1869, earned the nickname 'Little Sweden' and remains the most concentrated Scandinavian surname community on the central plains."

