intro_text: "Kansas's state rock is Greenhorn limestone, adopted in 2018 for the chalky bed within it known as post rock, the stone that pioneers cut into fence posts across the treeless plains. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Kansas State Rock
    paragraphs:
      - "Greenhorn limestone is Kansas's official state rock, designated by the Kansas Legislature in 2018. A thin, especially workable layer near the top of the formation, known locally as post rock or fencepost limestone, is what settlers quarried by hand across north-central Kansas."
      - "Kansas chose this rock for a practical reason grounded in its own landscape: the prairie had almost no trees for fence posts, so early farmers turned to the stone bed under their feet instead."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Greenhorn Limestone?"
    paragraphs:
      - "Greenhorn limestone is a pale, chalky marine limestone laid down under a shallow inland sea roughly 94 million years ago, during the Cretaceous period. The post rock layer inside it runs only about 9 to 14 inches thick, sandwiched between shale below and chalk above."
      - "Freshly quarried, the stone is soft enough to saw, drill, and shape with hand tools, but it hardens after exposure to air, which made it durable once set upright as a fence post. The formation runs roughly 200 miles across north-central Kansas, from near the Nebraska border southwest toward Dodge City."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Kansas Chose Greenhorn Limestone as Its State Rock"
    paragraphs:
      - "Settlers moving onto the Kansas prairie in the late 1800s found almost no timber for fencing, a serious problem once barbed wire came into use. Post rock limestone solved it: farmers cut the stone into slabs weighing 250 to 450 pounds and set them as posts, some of which still stand more than a century later."
      - "Quarrying and setting post rock became a defining regional skill between 1884 and 1920, especially in Russell, Lincoln, Ellsworth, and Rush counties. That homegrown solution to prairie fencing, still visible along rural roads today, made Greenhorn limestone a natural choice for state rock."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Greenhorn Limestone Became Kansas's State Rock"
    paragraphs:
      - "The Kansas Legislature designated Greenhorn limestone the official state rock in 2018, the same bill that named galena the state mineral and jelinite the state gemstone."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Greenhorn Limestone Is Found in Kansas"
    paragraphs:
      - "The Post Rock Scenic Byway runs through Russell, Lincoln, and Ellsworth counties, where stone fence posts still line miles of rural roadside. The town of La Crosse, in Rush County, calls itself the Post Rock Capital of Kansas and is home to the Post Rock Museum."
    sites:
      - name: Post Rock Museum
        city: La Crosse
        lat: 38.5314
        lng: -99.3109
        note: "Museum dedicated to Kansas post rock limestone"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Greenhorn Limestone Facts"
    facts:
      - "Adopted as Kansas's state rock in 2018."
      - "The post rock layer of Greenhorn limestone is only about 9 to 14 inches thick, yet it supplied fence posts across roughly 200 miles of prairie."
      - "Pioneers quarried post rock between 1884 and 1920, mainly because the treeless plains offered no timber for fencing."
      - "La Crosse, Kansas, calls itself the Post Rock Capital of Kansas and houses the Post Rock Museum."

