faq:
  - question: What is Kansas's state rock?
    answer: "Kansas's state rock is Greenhorn limestone, a Cretaceous marine limestone adopted by the Kansas Legislature in 2018."
  - question: When did Kansas adopt Greenhorn limestone as its state rock?
    answer: "The Kansas Legislature designated Greenhorn limestone the official state rock in 2018."
  - question: Why did Kansas choose Greenhorn limestone?
    answer: "A workable layer inside Greenhorn limestone, known as post rock, gave treeless prairie settlers a stone substitute for wooden fence posts starting in the 1880s."
  - question: Where can you find Greenhorn limestone in Kansas?
    answer: "The formation runs across north-central Kansas, most visibly along the Post Rock Scenic Byway through Russell, Lincoln, and Ellsworth counties, and at the Post Rock Museum in La Crosse."

