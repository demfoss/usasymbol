title: Western Meadowlark
scientific_name: Sturnella neglecta
adopted_year: 1937
legislation: K.S.A. 73-901
meaning: Kansas's bird symbol preserves a public preference, not just a species name. State law remembers that the Western Meadowlark was chosen by Kansas schoolchildren, so the emblem still reads as the sound of the plains rather than a generic bird profile.
author: USA Symbol Team
date_published: '2025-11-25'
date_modified: "2026-05-02"
seo_title: "Kansas State Bird | Western Meadowlark"
seo_description: "Kansas adopted the Western Meadowlark in 1937, a choice tied to schoolchildren and the sound of the plains."
intro_text: 'Kansas''s official state bird is the <strong>Western Meadowlark</strong>, designated on <strong>June 30, 1937</strong>. The telling detail is that Kansas law says the bird was chosen <strong>"as preferred by a vote of Kansas school children"</strong>. That wording turns the symbol into more than a prairie bird: it preserves a public choice about what Kansas should sound like. By then the sunflower already gave Kansas its visual emblem, so the meadowlark added the state''s prairie voice. This profile appears in the [list of U.S. state birds](/symbols/birds).'
shared_states:
- Montana
- Nebraska
- North Dakota
- Oregon
- Wyoming
