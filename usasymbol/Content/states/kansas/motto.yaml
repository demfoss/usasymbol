title: "Ad Astra per Aspera"
language: "Latin"
english_translation: "To the Stars Through Difficulties"
adopted_year: 1861

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-04-16"
seo_title: "Kansas State Motto | Ad Astra per Aspera! To the Stars Through Difficulties!"
seo_description: "Kansas's state motto is 'Ad astra per aspera,' meaning 'To the stars through difficulties.' Learn why Kansas adopted the Latin phrase in 1861."

intro_text: "Kansas's state motto is <strong>Ad Astra per Aspera</strong> — Latin for <em>To the Stars Through Difficulties</em>. The phrase was proposed by John James Ingalls, a 26-year-old state senator from Atchison, who had seen it on a brass seal in Haverhill, Massachusetts four years earlier while studying law. The motto was adopted on May 25, 1861 — less than four months after Kansas became the 34th state, and just six weeks after the Civil War began at Fort Sumter. Ingalls later complained that the legislature had ruined his original design by adding too many landscape elements. The motto itself, however, he considered perfect for a state that had just survived the violence of Bleeding Kansas."

sections:
  - id: "ingalls-one-man"
    icon: "fa-solid fa-user"
    title: "One Man's Memory of a Brass Seal in Massachusetts"
    paragraphs:
      - "In 1857, John James Ingalls was 23 years old and reading law in Haverhill, Massachusetts. He saw a brass seal with the Latin phrase 'Ad Astra per Aspera' and wrote it down. He moved to Kansas Territory the following year, drawn by the free-state cause during the Bleeding Kansas conflict. By 1861 he was 26 years old and serving in the First Kansas Legislature as Secretary of the Kansas Senate."
      - "When a committee asked legislators to submit seal design ideas, Ingalls proposed a simple concept: a single star rising from clouds, surrounded by a constellation of 34 stars representing Kansas as the 34th state, with 'Ad Astra per Aspera' as the motto. The design was minimal by intention. Ingalls wanted the imagery to carry only as much weight as the phrase itself."
      - "The joint committee adopted Ingalls's motto but redesigned everything around it. They added mountains, a river with a steamboat, a settler plowing near a cabin, an ox wagon train, buffalo, and Indian hunters. Ingalls later said these additions were incongruous and destroyed the elegance he had intended. The motto he chose survived. His design did not."

  - id: "bleeding-kansas-context"
    icon: "fa-solid fa-fire"
    title: "Why 'Difficulties' Meant Something Specific in 1861"
    paragraphs:
      - "Kansas Territory was created on May 30, 1854 under the Kansas-Nebraska Act, which allowed settlers to vote on whether to permit slavery. Pro-slavery Missourians crossed the border during elections and installed a fraudulent legislature. Anti-slavery settlers refused to recognize it. Two rival governments claimed authority. Lawrence burned in 1856. John Brown led the Pottawatomie massacre. Federal troops couldn't stop the violence. The era earned the name Bleeding Kansas — more than 50 people died in political conflict before the territory achieved statehood."
      - "Kansas voters rejected the pro-slavery Lecompton Constitution twice: the second time by 11,300 to 1,788. They drafted the free-state Wyandotte Constitution in 1859 and approved it 10,421 to 5,530. Southern senators blocked admission until their states began seceding in December 1860. President James Buchanan signed the admission act on January 29, 1861."
      - "The difficulties in the motto weren't metaphorical when Ingalls proposed the phrase four months later. He had lived through the territorial violence. The phrase described the actual experience of a state that had reached statehood by surviving seven years of armed conflict."

  - id: "civil-war-most-per-capita"
    icon: "fa-solid fa-shield-halved"
    title: "Kansas and the Civil War: More Per Capita Than Any Other State"
    paragraphs:
      - "The Civil War began at Fort Sumter on April 12, 1861 — six weeks before Kansas adopted its motto on May 25. The First Legislature adopted the motto during a national emergency as southern states were actively seceding. The motto's timing was not coincidental: Kansas was already at war, practically speaking, when it formally joined the Union."
      - "Approximately 20,000 Kansans served in the Union army from a total state population of roughly 100,000. That means approximately one in five adult men enlisted — a higher proportion than any other Union state. About 8,500 died or were wounded. Kansas had been a state for less than five years when the war ended."
      - "The codified seal law passed on March 20, 1879, embedding the original 1861 motto permanently in statute. Ingalls went on to serve three full terms as a United States Senator from Kansas, from 1873 to 1891. His reputation as a writer and orator started, in part, with this five-word Latin phrase he borrowed from a brass seal in Massachusetts."

  - id: "virgil-and-seneca"
    icon: "fa-solid fa-scroll"
    title: "Where 'Ad Astra' Appears in Roman Literature"
    paragraphs:
      - "The phrase draws from two Roman authors. Virgil wrote in Aeneid Book IX: 'sic itur ad astra' — 'thus one journeys to the stars.' Seneca the Younger wrote in Hercules Furens: 'non est ad astra mollis e terris via' — 'there is no easy way from the earth to the stars.' Both express the same idea: exceptional achievement requires exceptional effort."
      - "Ingalls chose the version that combined both ideas most compactly: the aspiration (ad astra) and the path (per aspera). The phrase appears on the Great Seal above 34 stars arranged in a cluster — making the word 'stars' both metaphorical and literal on the same seal."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Kansas State Motto Facts"
    style: "gradient"
    facts:
      - "John James Ingalls was 23 years old when he saw the phrase on a brass seal in Massachusetts in 1857 — four years before proposing it for Kansas."
      - "Kansas adopted the motto on May 25, 1861, less than four months after becoming the 34th state and six weeks after Fort Sumter."
      - "Ingalls later complained that the legislature ruined his simple seal design by adding too many landscape elements."
      - "Bleeding Kansas violence between 1854 and 1859 killed more than 50 people before statehood."
      - "Kansas contributed more soldiers per capita to the Civil War than any other Union state — approximately 20,000 from a population of 100,000."
      - "The seal law was codified on March 20, 1879, with no changes to the motto wording since 1861."

faq:
  - question: "What is Kansas's state motto?"
    answer: "Kansas's state motto is 'Ad Astra per Aspera,' a Latin phrase meaning 'To the Stars Through Difficulties.' It was adopted on May 25, 1861, less than four months after Kansas became the 34th state."

  - question: "What does 'Ad Astra per Aspera' mean?"
    answer: "'Ad astra' means 'to the stars.' 'Per aspera' means 'through difficulties' or 'through hardships.' Together: 'To the Stars Through Difficulties.' It comes from Roman literature — Virgil used 'ad astra' in the Aeneid, and Seneca wrote that there is no easy way from earth to the stars."

  - question: "Who chose Kansas's motto?"
    answer: "John James Ingalls, a 26-year-old state senator from Atchison who was serving as Secretary of the Kansas Senate. He had seen the phrase on a brass seal in Haverhill, Massachusetts in 1857 while reading law, and proposed it for the new state's seal in 1861."

  - question: "What language is Kansas's motto written in?"
    answer: "Latin. The phrase 'Ad Astra per Aspera' is classical Latin, drawing from Roman literary sources including Virgil's Aeneid and Seneca's Hercules Furens."

  - question: "When did Kansas adopt its motto?"
    answer: "May 25, 1861 — adopted by the First Kansas Legislature as part of the state seal design. Kansas had become the 34th state on January 29, 1861, and the Civil War had begun six weeks before the motto was adopted."

  - question: "Why does Kansas's motto reference difficulties?"
    answer: "Kansas Territory experienced seven years of violent conflict known as Bleeding Kansas (1854–1861), during which pro-slavery and anti-slavery settlers fought for control. More than 50 people died before statehood. The phrase 'through difficulties' described the actual experience of a state that had reached the Union by surviving political violence."

