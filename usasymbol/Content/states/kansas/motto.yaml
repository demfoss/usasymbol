seo_description: "Kansas's state motto is \"Ad Astra per Aspera,\" Latin for \"To the Stars Through Difficulties.\" Adopted in 1861, it appears on the Kansas state seal."

intro_text: "Kansas's state motto is <strong>Ad Astra per Aspera</strong>, a Latin phrase meaning <em>To the Stars Through Difficulties</em>. It was adopted in 1861, the year Kansas became a state, and is credited to John James Ingalls. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

