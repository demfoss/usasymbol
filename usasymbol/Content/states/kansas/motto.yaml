faq:
  - question: "What is the Kansas state motto?"
    answer: "The Kansas state motto is \"Ad Astra per Aspera,\" a Latin phrase meaning \"To the Stars Through Difficulties.\" It was adopted in 1861 and appears on the Kansas state seal."

  - question: "What does \"Ad Astra per Aspera\" mean?"
    answer: "\"Ad Astra per Aspera\" is Latin for \"To the Stars Through Difficulties.\" The phrase means that something great is reached by pushing through hardship. For Kansas in 1861, it reflected the violent conflict the territory experienced before statehood."

  - question: "What is the English translation of \"Ad Astra per Aspera\"?"
    answer: "The standard English translation is \"To the Stars Through Difficulties.\" Some sources also use \"To the Stars Through Hardship\" — both are accurate translations of the Latin word aspera, which means rough or difficult conditions."

  - question: "When did Kansas adopt its state motto?"
    answer: "Kansas adopted Ad Astra per Aspera in 1861, the year it was admitted to the Union as the 34th state on January 29, 1861."

  - question: "Who created the Kansas state motto?"
    answer: "The motto is credited to John James Ingalls, a lawyer who moved to Kansas Territory in 1858 and proposed the phrase to the state legislature. He later served as a U.S. Senator from Kansas from 1873 to 1891."

