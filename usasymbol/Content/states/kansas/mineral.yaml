  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Galena Facts"
    facts:
      - "Adopted as Kansas's state mineral in 2018."
      - "The town of Galena, Kansas, founded in 1877, was named directly after the mineral found in its soil."
      - "Galena's cube-shaped crystals and heavy weight, nearly twice as dense as most rocks, make it easy for collectors to identify."
      - "Cherokee County was part of the Tri-State mining district, once one of the largest lead and zinc producing regions in the world."

