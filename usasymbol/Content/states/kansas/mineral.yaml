faq:
  - question: What is Kansas's state mineral?
    answer: "Kansas's state mineral is galena, a lead sulfide mineral adopted by the Kansas Legislature in 2018."
  - question: When did Kansas adopt galena as its state mineral?
    answer: "The Kansas Legislature designated galena the official state mineral in 2018."
  - question: Why did Kansas choose galena?
    answer: "Galena mining built the town of Galena in Cherokee County and drove a major lead and zinc boom in the Tri-State mining district during the late 1800s and early 1900s."
  - question: Where can you find galena in Kansas?
    answer: "Cherokee County, in the far southeast corner of the state, was the center of Kansas galena mining, especially around the town of Galena."

