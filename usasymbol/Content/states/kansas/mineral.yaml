intro_text: "Kansas's state mineral is galena, adopted in 2018 to honor the lead ore that named a town and powered a mining boom in the far southeast corner of the state. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Kansas State Mineral
    paragraphs:
      - "Galena is Kansas's official state mineral, designated by the Kansas Legislature in 2018. It is the primary ore of lead, and in southeast Kansas it drove one of the largest mining booms in state history."
      - "Lawmakers chose galena alongside two other 2018 designations, Greenhorn limestone as state rock and jelinite as state gemstone, giving Kansas a matched set of official geologic symbols in a single year."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Galena?"
    paragraphs:
      - "Galena is lead sulfide, a heavy, metallic mineral with a lead-gray color and a bright shine on fresh surfaces. It commonly forms in cube-shaped crystals and breaks along flat, mirror-like faces."
      - "Galena is one of the most widely mined lead ores on Earth, forming in hydrothermal veins where hot mineral-rich fluids deposited lead and zinc into cracks in limestone. In southeast Kansas those veins sat close enough to the surface that shallow mining could reach them."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Kansas Chose Galena as Its State Mineral"
    paragraphs:
      - "Southeast Kansas sits on the edge of the Tri-State mining district, a lead and zinc region spanning Kansas, Missouri, and Oklahoma. Galena was so abundant in Cherokee County that the mining town founded there in 1877 took the mineral's name."
      - "The town of Galena grew past 10,000 residents at its peak, and lead and zinc mining shaped the region's economy for nearly a century. Naming galena the state mineral in 2018 recognized that industrial history rather than any recent discovery."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Galena Became Kansas's State Mineral"
    paragraphs:
      - "The Kansas Legislature designated galena the official state mineral in 2018, the same bill that named Greenhorn limestone the state rock and jelinite the state gemstone."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Galena Is Found in Kansas"
    paragraphs:
      - "Cherokee County, in the far southeast corner of Kansas, was the center of the state's galena mining. The town of Galena sits atop the old Tri-State district, where hundreds of mine shafts once tapped lead and zinc ore before operations wound down in the mid-20th century."
    sites:
