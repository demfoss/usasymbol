type: State Coat of Arms
state: Kansas
name: Kansas State Coat of Arms
adopted_year: 1861
is_official: true
meaning: "The Kansas coat of arms presents the state at its founding moment: a frontier landscape under 34 stars with a rising sun, plowing farmer, river steamboat, westward wagon train, and distant bison hunt. Every element points to 1861 — the year Kansas entered the Union as the 34th state — and to the agricultural future its founders expected. The motto above, Ad Astra per Aspera, does not hide what came before: the decade of violent conflict over slavery in Kansas Territory known as Bleeding Kansas."
meaning_title: Meaning of the Kansas Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-19'
date_modified: '2026-05-19'
seo_title: 'Kansas Coat of Arms: Meaning, Symbols and History'
seo_description: "The Kansas coat of arms was adopted in 1861, showing a frontier landscape beneath 34 stars with the motto Ad Astra per Aspera."
hero_image: /images/coats-of-arms/kansas/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of Kansas, adopted 1861, showing a frontier landscape beneath 34 stars with the motto Ad Astra per Aspera
hero_image_caption: The Kansas Coat of Arms, adopted at statehood in 1861. The design shows a frontier panorama beneath 34 stars, with a farmer plowing, a steamboat on the Kansas River, a wagon train heading west, and a distant bison hunt. The motto Ad Astra per Aspera appears above.
intro_text: "The Kansas coat of arms was adopted in 1861 when Kansas entered the Union as the 34th state. The design shows a frontier landscape — a farmer plowing, a steamboat on the Kansas River, a wagon train heading west, and a bison hunt on the horizon — beneath 34 stars and the motto Ad Astra per Aspera."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Kansas Coat of Arms?
  paragraphs:
  - "The Kansas coat of arms is the heraldic image at the center of the state seal: a landscape shield under 34 stars, with the motto Ad Astra per Aspera above. It shows the same frontier panorama that appears inside the Great Seal of Kansas."
  - "The design was approved at the Wyandotte Constitutional Convention in July 1859 and became official with Kansas statehood on January 29, 1861. Thirty-four stars arch above the landscape, identifying Kansas as the 34th state in the Union."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Kansas Coat of Arms
  paragraphs:
  - "The Kansas coat of arms originated at the Wyandotte Constitutional Convention, which met in July 1859 to draft the state constitution. Delegates approved the shield design and the motto as part of the founding documents. The design has not changed since statehood."
  - "John J. Ingalls, a Massachusetts-born lawyer who had moved to Kansas and later served as a United States Senator, proposed the motto Ad Astra per Aspera at the convention. The phrase, Latin for 'To the Stars Through Difficulties,' was a direct acknowledgment of the violent territorial period known as Bleeding Kansas, during which pro-slavery and anti-slavery factions fought for control of the territory throughout the 1850s."
  - "Kansas became the 34th state on January 29, 1861, when President James Buchanan signed the statehood bill. The coat of arms became the official emblem of the new state at that moment. Kansas was the last state admitted before the Civil War; within months the war began, and the 34 stars on the coat of arms recorded a Union already fracturing."
  - "Before statehood, Kansas Territory used a separate territorial seal, also featuring a pioneer and Ceres as supporters, with the motto Populi Voce Nata — 'Born of the popular will.' The Wyandotte Convention replaced both the shield design and the motto when it drafted the state design in 1859."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Kansas Coat of Arms
  paragraphs:
  - "The Kansas coat of arms organizes a frontier panorama on the shield, with stars and the state motto completing the design. Each element was chosen to represent Kansas at the moment of statehood in 1861."
  elements:
  - id: shield
    name: The Frontier Shield
    image: /images/coats-of-arms/kansas/elements/shield.webp
    paragraphs:
    - "The shield shows a panoramic landscape of Kansas in 1861. In the foreground, a farmer plows with two horses and a log cabin stands behind him. In the middle distance, a steamboat moves along the Kansas River. On the right, a wagon train heads westward. In the far upper distance, two Native Americans on horseback pursue a bison herd."
    - "Thirty-four stars arch above the scene. Kansas was the 34th state admitted to the Union on January 29, 1861. A rising sun appears on the eastern horizon, placing the entire landscape at the start of a new day — and, by implication, at the beginning of Kansas's history as a state."
  - id: rising-sun
    name: Rising Sun
    image: /images/coats-of-arms/kansas/elements/rising-sun.webp
    paragraphs:
    - "A sun rises on the eastern horizon above the frontier landscape. The rising sun places the scene at dawn and represents the beginning of Kansas's history as a state."
    - "In the statehood context of 1861, the sunrise also suggested hope after the violence of Bleeding Kansas. The design points forward rather than backward."
  - id: farmer-and-plow
    name: Farmer and Plow
    image: /images/coats-of-arms/kansas/elements/farmer-and-plow.webp
    paragraphs:
    - "In the foreground, a farmer plows with a team of horses beside a log cabin. This is the clearest statement in the design that Kansas expected agriculture to define its future."
    - "The farmer represented free-labor settlement on the plains. In the political context of the late 1850s, that image mattered because Kansas had just emerged from the conflict over whether it would enter the Union as a free or slave state."
  - id: commerce-and-migration
    name: Steamboat, Wagon Train, and Bison Hunt
    image: /images/coats-of-arms/kansas/elements/commerce-and-migration.webp
    paragraphs:
    - "The middle and far distance combine three scenes into one frontier panorama: a steamboat on the Kansas River, a wagon train moving west, and a bison hunt on the plains. Together they show commerce, migration, and the older Indigenous and wildlife world the founders believed was receding."
    - "This layered landscape makes the Kansas coat of arms one of the most narrative state emblems in the country. It does not isolate one symbol at a time; it shows several histories happening in the same frame."
  - id: thirty-four-stars
    name: 34 Stars
    image: /images/coats-of-arms/kansas/elements/thirty-four-stars.webp
    paragraphs:
    - "Thirty-four stars arch above the shield, identifying Kansas as the 34th state admitted to the Union on January 29, 1861. The stars act as a timestamp for the exact moment of statehood."
    - "Kansas was the last state admitted before the Civil War. The 34 stars therefore record a Union that was already beginning to fracture."
  - id: motto
    name: Ad Astra per Aspera
    image: /images/coats-of-arms/kansas/elements/motto.webp
    paragraphs:
    - "The motto Ad Astra per Aspera appears below the shield. It is Latin for 'To the Stars Through Difficulties.' John J. Ingalls proposed it at the Wyandotte Constitutional Convention in 1859. The 'difficulties' referred directly to the Bleeding Kansas period — the violent conflict over slavery in Kansas Territory that preceded statehood."
    - "Ad Astra per Aspera is also Kansas's official state motto, adopted as part of the same founding documents that established the coat of arms in 1861."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Kansas Coat of Arms
  paragraphs:
  - "The Kansas coat of arms was designed in 1859 to describe what the founders expected Kansas to become: an agricultural state built by free settlers on the Great Plains. The landscape on the shield shows farming, commerce, and westward movement as the three pillars of that future."
  - "The design is not abstract heraldry. It is a frontier scene arranged as a political statement. A farmer breaking prairie sod stands in the foreground, trade moves by river behind him, and migration pushes westward across the plains."
  - "The 34 stars anchor the design to a specific historical moment: Kansas entering the Union on January 29, 1861, as the newest state. The coat of arms captures Kansas at its beginning, before the Civil War that followed statehood by only four months."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Kansas Coat of Arms Facts
  facts:
  - "Adopted: January 29, 1861, at Kansas statehood, when Kansas became the 34th state admitted to the Union."
  - "Design approved: July 1859, at the Wyandotte Constitutional Convention that drafted the Kansas constitution."
  - "Motto proposed by: John J. Ingalls at the Wyandotte Constitutional Convention, 1859. Ingalls later served as a United States Senator from Kansas."
  - "The motto Ad Astra per Aspera is Latin for 'To the Stars Through Difficulties,' referencing the violent Bleeding Kansas conflict over slavery in the 1850s."
  - "The shield includes a plowing farmer, a steamboat on the Kansas River, a westward wagon train, and a distant bison hunt, combining agriculture, commerce, migration, and frontier conflict in one scene."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Kansas Coat of Arms
  paragraphs:
  - "The Kansas state design has remained visually stable since statehood in 1861, but historical illustrated printings vary in engraving style, lettering, and the exact treatment of the landscape. The best-known nineteenth-century rendering is the 1876 illustrated coat of arms published by Henry Mitchell."
  - "The modern official state emblem is more commonly reproduced through the state seal, which preserves the same frontier panorama, the 34 stars, and the motto Ad Astra per Aspera."
  versions:
  - name: Illustrated Historical Print
    years: 1876
    image: /images/coats-of-arms/kansas/versions/1876-illustrated.jpg
    description: A nineteenth-century illustrated rendering published by Henry Mitchell in 1876. It preserves the established Kansas statehood design while showing the engraving and coloring style common in printed state-arm collections of the period.
  - name: Current Standard
    years: 1861-present
    image: /images/coats-of-arms/kansas/versions/current-standard.svg
    description: The modern official state emblem as preserved in contemporary seal artwork. It keeps the same frontier panorama, the 34 stars, and the motto Ad Astra per Aspera that Kansas adopted at statehood.

faq:
- question: What does the Kansas coat of arms show?
  answer: "The Kansas coat of arms shows a landscape shield with a farmer plowing, a steamboat on the Kansas River, a westward wagon train, and a bison hunt in the far distance, all beneath 34 stars and a rising sun. The motto Ad Astra per Aspera appears above the shield."
- question: When was the Kansas coat of arms adopted?
  answer: "The design was approved at the Wyandotte Constitutional Convention in July 1859 and became the official coat of arms when Kansas achieved statehood on January 29, 1861."
- question: What does Ad Astra per Aspera mean?
  answer: "Ad Astra per Aspera is Latin for 'To the Stars Through Difficulties.' It is Kansas's official state motto, proposed by John J. Ingalls at the 1859 Wyandotte Constitutional Convention. The phrase referenced the violent Bleeding Kansas conflict over slavery in Kansas Territory that preceded statehood."
- question: What do the 34 stars on the Kansas coat of arms mean?
  answer: "The 34 stars represent the number of states in the Union when Kansas was admitted on January 29, 1861. Kansas was the 34th state. The stars record the exact size of the United States at the moment Kansas joined it."
- question: Is the Kansas coat of arms different from the state seal?
  answer: "The landscape and motto are the same in both. The coat of arms is the heraldic image itself: the frontier shield under 34 stars with the motto Ad Astra per Aspera. The state seal places that same image inside a circular border carrying the words 'Great Seal of the State of Kansas' and the date 1861."

