- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Ranching on Harney Soil
  paragraphs:
  - "Winter wheat is the crop that defines Harney soil. Kansas leads the United States in winter wheat production, and the Harney series underlies more of that wheat than any other single soil. Farmers plant winter wheat in September and October, it goes dormant in winter, and it is harvested in June — a cycle perfectly matched to the Harney soil's ability to store water from winter precipitation and release it slowly through the dry spring growing season."
  - "Grain sorghum is the second major crop on Harney soil. Also called milo, it is more drought-tolerant than corn and thrives in the semi-arid conditions of western Kansas where irrigation is limited and summer rains are unreliable. Cattle ranching and hay production occupy the drier or more erodible Harney ground that is not planted to crops."
  - "Before European settlement and farming, the Harney soil landscape was covered by mixed-grass prairie — buffalo grass, blue grama, little bluestem, and sideoats grama. Bison grazed this prairie by the millions. The same soils that fed those bison herds now produce the wheat that supplies flour mills across the central United States."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Harney Soil Facts
  facts:
  - "Designated: the Kansas Legislature officially named the Harney series the state soil in 1990."
  - "Kansas leads the United States in winter wheat production, and the Harney series is the primary soil under that wheat — making it one of the most agriculturally significant state soils in the country."
  - "The calcic horizon in Harney soil forms because annual rainfall in the High Plains (typically 15 to 24 inches per year in this region) is low enough that calcium carbonate cannot wash out of the soil profile. In wetter climates, the same lime would leach away completely."
  - "Harney soil is a Mollisol — the same soil order as Iowa's Tama and Illinois's Drummer — but its USTIC moisture regime (semi-arid) means it is classified separately from the UDIC (humid) Mollisols of the wetter Corn Belt states."
  - "The loess parent material under Harney soil was blown in from exposed glacial outwash and river floodplains during and after the last ice age, the same wind-driven process that built the loess deposits of Iowa and Nebraska."
  - "Buffalo grass and blue grama, the dominant plants under which Harney soil formed, have roots less than 24 inches deep — much shallower than tallgrass prairie species. This is why the dark organic-rich surface of Harney soil is thinner than that of wetter Mollisols like the Tama series."

