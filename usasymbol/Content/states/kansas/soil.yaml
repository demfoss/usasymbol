faq:
- question: What is Kansas's state soil?
  answer: "Kansas's state soil is the Harney series, a deep silty clay loam of the central and western High Plains. The Kansas Legislature designated it the official state soil in 1990. It is the dominant soil under Kansas's winter wheat fields."
- question: Why is the Harney soil important?
  answer: "Harney soil grows more winter wheat than any other soil in America. Kansas leads the United States in winter wheat production, and the Harney series is the primary soil under that wheat. Its combination of dark, organic-rich topsoil, a water-holding clay subsoil, and a lime-rich lower horizon makes it nearly ideal for the crop."
- question: What is the calcic horizon in Harney soil?
  answer: "The calcic horizon is a layer in the subsoil — about 34 to 50 inches below the surface — packed with white calcium carbonate. It formed because rainfall on the Kansas High Plains is low enough that dissolved calcium carbonate cannot wash out of the soil. Instead, it re-deposits in the subsoil as filaments, coatings, and soft masses. If you drip acid on it, it fizzes."
- question: What color is Harney soil?
  answer: "The surface of Harney soil is very dark grayish brown — dark enough to show its prairie heritage, but not as jet black as the wetter Mollisols of Iowa and Illinois. The argillic subsoil is dark yellowish brown. The calcic horizon below it is lighter yellowish brown streaked with white calcium carbonate."
- question: Where is Harney soil found in Kansas?
  answer: "Harney soil covers millions of acres across central and western Kansas. Core counties include Ellis, Trego, Rooks, Ness, Ford, and the surrounding High Plains counties. It is the dominant upland soil of the region around Hays and Dodge City — the heart of Kansas's wheat country."
- question: How is Harney soil different from Iowa's Tama soil?
  answer: "Both Harney and Tama are Mollisols — dark prairie soils — but they formed in very different climates. Tama formed in humid Iowa under tallgrass prairie, so its surface is very dark and deep, and lime has washed completely out of the profile. Harney formed in semi-arid Kansas under mixed-grass prairie, so its surface is a bit lighter and thinner, and lime stays in the subsoil as a calcic horizon. Tama grows corn; Harney grows wheat. The climate difference is written into every inch of the soil profile."
- question: What grew on Harney soil before wheat farming?
  answer: "Harney soil was covered by mixed-grass prairie — buffalo grass, blue grama, little bluestem, and sideoats grama. Bison grazed this prairie by the millions before European settlement. The roots of these shortgrasses are much shallower than tallgrass prairie species, which is why Harney soil's dark surface layer is thinner than that of soils like Tama or Drummer."
- question: What is a Mollisol?
  answer: "A Mollisol is the soil order of the world's great grasslands. The name comes from the Latin word mollis, meaning soft. All Mollisols have a thick, dark, organic-rich surface horizon called a mollic epipedon, but they vary widely depending on climate. Harney is a semi-arid Mollisol (Ustoll) adapted to the dry High Plains. Tama and Drummer are humid Mollisols (Udolls and Aquolls) adapted to the wetter Corn Belt."

