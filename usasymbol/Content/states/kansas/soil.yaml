seo_title: "Kansas State Soil | Harney Series"
seo_description: "The Kansas state soil is the Harney series, adopted in 1990. It covers millions of acres of the central and western High Plains and grows winter wheat."
hero_image: /images/soils/kansas/kansas-state-soil-hero.webp
