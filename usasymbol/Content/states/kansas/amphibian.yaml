seo_description: "Kansas's state amphibian is the barred tiger salamander, adopted in 2005. Learn what it looks like and why it became official."
hero_image: /images/amphibians/kansas/kansas-state-amphibian-hero.webp
hero_image_alt: "A dark barred tiger salamander with yellow-green markings on damp ground."
hero_image_caption: "The barred tiger salamander, Kansas's state amphibian, is the largest salamander species found on land in North America."
intro_text: "Kansas's state amphibian is the barred tiger salamander, a large burrowing salamander with bold yellow bands, adopted in 2005. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Kansas?
    paragraphs:
      - "The barred tiger salamander is Kansas's official state amphibian, designated by the Kansas Legislature in 2005. Its scientific name is Ambystoma mavortium."
      - "It is one of the largest land salamanders in North America and is found across most of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Barred Tiger Salamander
    paragraphs:
      - "The barred tiger salamander has a thick body with a dark brown or black background and irregular yellow-green bars and spots running along its sides."
      - "Adults can grow to about a foot long, with a wide head and small eyes."
      - "It spends most of its life underground in burrows, often ones dug by other animals, and only becomes active on the surface at night or during rains."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "Kansas schoolchildren helped push for a state amphibian, and the Kansas Legislature designated the barred tiger salamander as the official choice in 2005."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Kansas Chose the Barred Tiger Salamander
    paragraphs:
      - "The barred tiger salamander is found in every county in Kansas, making it a familiar and easily recognized amphibian across the state."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Barred Tiger Salamander
    paragraphs:
      - "The barred tiger salamander lives throughout Kansas, favoring grasslands and prairie areas near ponds, ditches, and other still water where it can breed."
    sites:
