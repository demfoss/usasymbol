    answer: "Kansas's state amphibian is the barred tiger salamander, adopted by the Kansas Legislature in 2005."
  - question: When did Kansas adopt the barred tiger salamander?
    answer: "The Kansas Legislature designated the barred tiger salamander the official state amphibian in 2005."
  - question: Why did Kansas choose the barred tiger salamander?
    answer: "The barred tiger salamander is found across the entire state, making it a familiar amphibian for Kansans in every county."
