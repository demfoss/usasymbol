faq:
- question: What is Kansas's current license plate slogan?
  answer: Kansas's current license plate slogan is "to the stars," added with the 2024 plate base.
- question: What was Kansas's first license plate slogan?
  answer: Kansas first used "THE WHEAT STATE" on license plates in 1949. The slogan continued uninterrupted through 1959.
- question: What did "Midway USA" mean on Kansas plates?
  answer: '"MIDWAY USA" presented Kansas as the geographic middle of the country. It first appeared in 1965 and remained in place through 1970.'
- question: What was the Kansas "Wheat Centennial" plate?
  answer: Some 1974 and 1975 Kansas issues used "WHEAT CENTENNIAL," referring to the introduction of hard red winter wheat to the state.
- question: Why does the new Kansas plate say "to the stars"?
  answer: "\"to the stars\" comes from Kansas's tourism tagline and from the state motto \"Ad Astra per Aspera,\" meaning \"to the stars through difficulty.\""

