hero_image_caption: Kansas added "to the stars" to its plate in 2024, reviving plate-slogan use after nearly fifty years.
intro_text: '**"to the stars"** is Kansas''s newest license plate slogan, added with the 2024 base. The phrase connects the state''s tourism branding to **Ad Astra per Aspera,** the Kansas motto meaning "to the stars through difficulty." Earlier plates used "The Wheat State," "Midway USA," and other anniversary slogans.'
quick_answer: 'Kansas first used "The Wheat State" on license plates in 1949 and kept it through 1959. The 1960 and 1961 plates carried "Centennial 1961." "Midway USA" ran from 1965 through 1970, and some 1974–1975 issues used "Wheat Centennial." In 2024, Kansas added "to the stars," its first plate slogan in just under fifty years.'
