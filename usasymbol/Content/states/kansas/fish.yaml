- id: facts
  icon: fa-solid fa-lightbulb
  title: Channel Catfish Facts
  facts:
  - Adopted in 2018 by the Kansas Legislature.
  - Scientific name is Ictalurus punctatus.
  - The Kansas state record channel catfish weighed 36.5 pounds and was 38 inches long.
  - Has a forked tail, dark side spots, and whisker-like barbels.
  - Found in nearly every river, reservoir, and stream in Kansas.
faq:
- question: What is Kansas's state fish?
  answer: Kansas's state fish is the channel catfish. The Kansas Legislature adopted it in 2018.
- question: When did Kansas adopt the Channel Catfish?
  answer: The channel catfish became the official state fish in 2018. The law took effect on July 1, 2018.
- question: Why did Kansas choose the Channel Catfish?
  answer: Lawmakers heard that the channel catfish lives in every river and reservoir in Kansas, which makes it one of the state's most familiar fish.
- question: How can you tell a channel catfish from other Kansas catfish?
  answer: A channel catfish has a slender body, a deeply forked tail, and dark spots on its sides. Flathead catfish have a square tail, and bullheads have a rounded tail.
- question: How big was the biggest channel catfish caught in Kansas?
  answer: The Kansas state record channel catfish weighed 36.5 pounds and measured 38 inches long. It was caught in Cherokee County in 2003.
