intro_text: Kansas's state fish is the channel catfish, a whiskered fish with a forked tail that lives in waters all over the state. It became official in 2018. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Kansas?
  paragraphs:
  - The channel catfish is the official fish of Kansas. The Kansas Legislature made it the state fish in 2018.
  - Its scientific name is Ictalurus punctatus. It is one of the most common game fish in Kansas waters.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Channel Catfish
  paragraphs:
  - The channel catfish has a long, slender body with an olive or brown back and a whitish belly.
  - Like other catfish, it has whisker-like barbels around its mouth that help it find food.
  - Look for a deeply forked tail and dark spots on its sides. These help you tell it apart from other catfish in Kansas. The flathead catfish has a square tail, and the bullhead has a rounded tail.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In 2018, Kansas lawmakers took up a bill to name a state rock, a state mineral, and a state gemstone.
  - During a committee hearing, a state wildlife official asked lawmakers to add the channel catfish as the state fish. They agreed, and the law took effect on July 1, 2018.
  - The same law named greenhorn limestone the state rock, galena the state mineral, and jelinite amber the state gemstone.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Kansas Chose the Channel Catfish
  paragraphs:
  - Lawmakers heard that the channel catfish lives in every river and reservoir in Kansas. Few Kansas fish are as widespread or as familiar to anglers.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Channel Catfish
  paragraphs:
  - Channel catfish live in nearly all Kansas waters, from large rivers and reservoirs to small prairie streams and state fishing lakes.
  - Glen Elder, Perry, and Wilson reservoirs are some of the state's top channel catfish lakes. State fish hatcheries raise millions of channel catfish every year to stock Kansas waters.
