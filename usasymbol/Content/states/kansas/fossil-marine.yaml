faq:
- question: What is Kansas's state marine fossil?
  answer: "Kansas's state marine fossil is Tylosaurus (Tylosaurus kansasensis), a large mosasaur and the top predator of the Late Cretaceous sea that covered present-day Kansas. The Kansas legislature designated it in 2014."
- question: When did Kansas adopt its state marine fossil?
  answer: "Kansas designated Tylosaurus kansasensis as its state marine fossil in 2014, the same year it adopted Pteranodon longiceps as its state flying fossil."
- question: What did the Tylosaurus look like?
  answer: "Tylosaurus kansasensis was up to 45 feet long with a streamlined body, four paddle-like limbs, and a powerful side-flattened tail. Its most recognizable feature was a blunt, rounded projection at the tip of its snout called the tylus."
- question: Where are Tylosaurus fossils found in Kansas?
  answer: "Tylosaurus kansasensis fossils come from the Niobrara Chalk of western Kansas. Logan County is the type locality for the species. Monument Rocks in Gove County is the most prominent chalk exposure, and the Sternberg Museum of Natural History in Hays holds the largest Kansas collection."
- question: When did the Tylosaurus live?
  answer: "Tylosaurus kansasensis lived during the Late Cretaceous, roughly 85 to 80 million years ago. It went extinct about 66 million years ago at the end of the Cretaceous period."
- question: Who pushed to make Tylosaurus Kansas's state marine fossil?
  answer: "Kansas paleontologists, including those connected to the Sternberg Museum in Hays, supported the 2014 designations. The species had a direct Kansas connection. Its name, type locality, and most known specimens all come from the state's chalk beds."

