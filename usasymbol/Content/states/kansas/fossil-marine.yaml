- id: facts
  icon: fa-solid fa-lightbulb
  title: Tylosaurus Facts
  facts:
  - "Kansas designated Tylosaurus kansasensis as its state marine fossil in 2014, the same year it adopted a separate state flying fossil. It is the only state with both categories."
  - "The species name kansasensis means 'from Kansas'; the type specimen was found in Logan County and the species was formally described in 2005."
  - "Tylosaurus means 'knob lizard' in Greek, a reference to the rounded toothless projection at the tip of its snout, possibly used to ram prey."
  - "Tylosaurus was more closely related to modern monitor lizards and snakes than to any fish, whale, or dinosaur."
  - "Edward Drinker Cope described the genus Tylosaurus in 1872 from Kansas Niobrara Chalk material collected during the Bone Wars."

