      text: Official nickname tied to the wild native sunflower.
    - label: Wheat State
      text: Informal nickname tied to Kansas agriculture.
    - label: Jayhawker State
      text: Historical nickname connected with free-state fighters and border conflict.
    - label: Abbreviation
      text: KS; older short form Kans.
editorial:
  heading: What Kansas's Symbols Say About the State
  paragraphs:
  - "Kansas has one of the tightest symbol clusters in the country: the [sunflower](/states/kansas/flower) is the flower, the nickname, a flag crest, and the state's most recognizable visual cue."
  - The [western meadowlark](/states/kansas/bird) adds sound to that visual identity. Kansas law remembers that schoolchildren chose it, so the bird reads less like a wildlife-office selection and more like the prairie voice Kansans wanted to claim.
  - The [cottonwood](/states/kansas/tree) and [American bison](/states/kansas/mammal/american-bison) make the frontier story less decorative. One was tied to homesteader survival and water; the other carries the Great Plains story of near-loss and recovery.
faq:
- question: What is Kansas's most famous state symbol?
  answer: The [sunflower](/states/kansas/flower) is Kansas's most famous symbol because it is the state flower, the basis of the Sunflower State nickname, and a major part of the flag design.
- question: What is Kansas's state bird?
  answer: Kansas's state bird is the [western meadowlark](/states/kansas/bird), adopted in 1937 after a vote of Kansas schoolchildren.
- question: What is Kansas's state flower?
  answer: Kansas's state flower is the [sunflower](/states/kansas/flower), adopted in 1903.
- question: Why is the cottonwood important in Kansas?
  answer: The [cottonwood](/states/kansas/tree) mattered to homesteaders because fast-growing groves meant shade, fuel, and often a sign of water on the prairie.
- question: How many official state symbols does Kansas have?
  answer: Kansas's state symbols list here includes the sunflower, flag, meadowlark, cottonwood, motto, colors, nickname, and American bison.
