name_meaning:
  heading: What Does Kansas Mean?
  paragraphs:
  - Kansas is the 34th U.S. state, admitted to the Union on January 29, 1861. The name comes from the Kansa or Kaw people, whose name was applied to the Kansas River and then to the territory and state.
  - The Sunflower State nickname is unusually direct because the nickname, flower, and flag imagery all reinforce one another. Kansas made the sunflower its official state flower in 1903.
  - Kansas's postal abbreviation is KS, and residents are Kansans. Its Latin motto, Ad Astra per Aspera, means "To the Stars Through Difficulties" and was adopted in the same Civil War year as statehood.
