name_meaning:
  heading: What Does Indiana Mean?
  paragraphs:
  - Indiana is the 19th U.S. state, admitted to the Union on December 11, 1816. Its name means "land of the Indians" or "Indian land," a colonial-era name formed from Indian plus the place-name ending -ana.
  - The state nickname is less tidy than the state name. Hoosier has been used for Indiana residents since the 1820s, but the existing nickname page treats its origin as unresolved rather than solved by one folk story.
  - Indiana's postal abbreviation is IN, and residents are called Hoosiers. The official motto, The Crossroads of America, gives the state a transportation identity rather than a landscape one.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: A colonial place name meaning Indian land or land of the Indians.
    - label: Statehood
      text: Indiana became the 19th state on December 11, 1816.
    - label: Nickname caution
      text: Hoosier is widely used, but its exact origin remains uncertain.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Indiana, a Midwestern state whose identity is often framed around roads, farms, towns, and manufacturing.
    - label: People
      text: People from Indiana are commonly called Hoosiers.
    - label: Motto
      text: The Crossroads of America was adopted as both motto and slogan in 1937.
  - heading: Nicknames and Short Forms
    items:
    - label: Hoosier State
      text: Longstanding nickname built around the demonym Hoosier.
    - label: Hospitality State
      text: Older promotional nickname mentioned on the Indiana nickname page.
    - label: Mother of Vice Presidents
      text: Informal nickname tied to Indiana's unusually high number of vice presidents.
    - label: Abbreviation
      text: IN; older short form Ind.
editorial:
  heading: What Indiana's Symbols Say About the State
  paragraphs:
  - "Indiana's [state flag](/states/indiana/flag) does a lot with very little: a gold torch, nineteen stars, and a dark blue field. The design turns statehood order and civic light into the state's clearest visual shorthand."
  - The [tulip tree](/states/indiana/tree) is the most layered Indiana plant symbol. Its leaf appeared on the seal, its blossom briefly served as the state flower, and the tree itself became official in 1931 after Indiana moved on to other flowers.
  - "The [peony](/states/indiana/flower), [cardinal](/states/indiana/bird), and [water](/states/indiana/beverage/water) keep the set close to ordinary life: garden bloom, backyard bird, and the basic resource behind the state's official beverage designation."
faq:
- question: What is Indiana's most famous state symbol?
  answer: The [Indiana state flag](/states/indiana/flag) is one of the state's strongest symbols because its gold torch and nineteen stars turn Indiana's statehood number into a simple public image.
- question: What is Indiana's state bird?
  answer: Indiana's state bird is the [northern cardinal](/states/indiana/bird), adopted in 1933 under the older statutory wording "Red Bird or Cardinal."
- question: What is Indiana's state flower?
  answer: Indiana's state flower is the [peony](/states/indiana/flower), adopted in 1957 after earlier flower changes.
- question: Why is Indiana called the Hoosier State?
  answer: Indiana is called the Hoosier State because residents have been called Hoosiers since the 1820s, though the exact origin of the word remains uncertain. The [Indiana nickname](/states/indiana/nickname) page covers the competing theories.
- question: How many official state symbols does Indiana have?
  answer: Indiana's state symbols list here includes the flag, cardinal, peony, tulip tree, motto, colors, state firearm, and water.
