seo_description: "Indiana state symbols: official state symbols include the northern cardinal, peony, tulip tree, torch flag, Hoosier nickname, and Crossroads of America motto."
snippet_answer: Find out more about the official state symbols that represent Indiana, from the northern cardinal and peony to the torch flag and Crossroads of America motto. The Hoosier nickname and centennial flag contest give Indiana's list some of the more interesting origin stories in the Midwest.
