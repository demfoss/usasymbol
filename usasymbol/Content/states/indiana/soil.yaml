meaning: "Miami soil formed on the ridges and sideslopes of Indiana's central till plain, where the last glacier left a thick blanket of calcareous loam and clay. Wind-blown loess settled over that glacial surface, giving the soil a silky, fertile topsoil. The Miami people lived on this land for centuries. Today, the same soils grow corn and soybeans across one of the most productive farming regions in the United States."
