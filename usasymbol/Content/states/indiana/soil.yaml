faq:
- question: What is Indiana's state soil?
  answer: "Indiana's state soil is the Miami series, a silt loam over calcareous glacial till found across the central till plain. It is the most characteristic well-drained soil of Indiana's rolling agricultural heartland."
- question: Why is it called Miami soil?
  answer: "The Miami series was first described and established in Miami County, Indiana. Miami County was named for the Miami Nation, the Indigenous people who lived in this part of the Wabash River valley. USDA soil scientists follow the convention of naming soil series after the county or geographic feature where the series is first studied."
- question: What color is Miami soil?
  answer: "The surface of Miami soil is dark grayish brown — a moderately dark color typical of well-drained Midwestern soils. Below the surface, the argillic subsoil is yellowish brown to strong brown. The lowest layer, the calcareous glacial till, is pale light yellowish brown."
- question: What makes Miami soil calcareous?
  answer: "The lower layer of Miami soil is glacial till — material that the Laurentide ice sheet scraped, ground, and deposited as it moved across Indiana. That till contains crushed limestone and dolomite, which are rich in calcium carbonate. Soil with calcium carbonate is called calcareous; it fizzes slightly when dilute acid is applied, and it stays near neutral in pH even without lime applications from farmers."
- question: Where is Miami soil found in Indiana?
  answer: "Miami soil is found across the central till plain of Indiana — the broad, gently rolling landscape covering much of the state's midsection. Core counties include Miami, Hamilton, Tipton, Howard, Clinton, and the surrounding agricultural counties. The series is most common on ridges and gentle slopes where drainage is better than on adjacent flat or low ground."
- question: What grows in Miami soil?
  answer: "Corn and soybeans are the primary crops. Before European settlement, the same ridgetop landscape supported oak savanna and patches of tallgrass prairie, with sugar maple and beech forest on moister slopes. Almost all of that original vegetation was cleared for farming in the 1800s."
- question: How is Miami soil different from Drummer soil?
  answer: "Both Miami and Drummer soils are found across Indiana and Illinois's Corn Belt, but they sit in different landscape positions and have different drainage. Miami sits on ridges and slopes and is well drained to moderately well drained. Drummer sits in low, flat areas and is poorly drained — it has a much darker surface because organic matter built up under waterlogged conditions. Miami's surface is brown; Drummer's surface is jet black."
- question: How deep is Miami soil?
  answer: "Miami soil is moderately deep to deep. The loess-derived silt loam surface and argillic subsoil typically extend to about 36 inches before the calcareous glacial till begins. The till itself goes down many more feet — it is the thick glacial deposit that underlies most of Indiana's till plain."

