- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Miami Soil
  paragraphs:
  - "Corn and soybeans are the defining crops of Miami soil. Indiana is consistently among the top five states in corn production, and the Miami series — along with the wetter soils it neighbors on the till plain — underlies most of that production. The loess surface provides good tilth and fertility; the calcareous till below maintains a near-neutral pH that corn and soybeans prefer."
  - "Before European settlement, much of the Miami soil landscape was covered by a mix of tallgrass prairie and oak savanna — the transition zone between the eastern deciduous forests and the open grasslands to the west. Sugar maple, beech, oak, and hickory grew on the better-drained ridges. Prairie grass covered the flatter areas. Both were cleared for farming in the 1800s."
  - "Some Miami soil ground is used for hay, pasture, and winter wheat. Small grain production was historically more common in Indiana before corn-soybean rotation became standard, and Miami soil supported all of it. Orchards and vegetable operations occupy smaller acreages on the same ridgetop positions."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Miami Soil Facts
  facts:
  - "The Miami series was first established and described in Miami County, Indiana — a county named for the Miami Nation, the Indigenous people who inhabited this region of the Wabash River valley for centuries."
  - "The calcareous till in the C horizon fizzes when dilute acid is applied — a field test that soil scientists use to confirm the presence of calcium carbonate from ground-up limestone and dolomite."
  - "Miami soil sits on the ridge and slope positions of the till plain. The wetter soils in the adjacent low areas — Brookston and Crosby series — needed extensive tile drainage before they could be farmed. Miami required less drainage and was among the first land plowed by Indiana settlers."
  - "The Laurentide ice sheet that deposited the parent till under Miami soil reached its maximum extent in Indiana approximately 20,000 years ago and retreated from the central till plain roughly 14,000 years ago."
  - "The loess layer at the surface was blown in by wind from exposed glacial outwash plains after the ice retreated — a fine, uniform sediment that settled across the region and gives Miami soil its silky texture and good natural fertility."
  - "Indiana's central till plain, where Miami soil is most extensive, is sometimes called the Corn Belt's eastern anchor — a continuation of the same glaciated landscape that runs through Illinois, Iowa, and Ohio."

