seo_title: "Indiana State Flag: Torch and 19 Stars Explained"
seo_description: "Indiana's flag uses a torch and 19 stars — one for each state in the Union when Indiana joined. The centennial design by Paul Hadley won a 1916 contest."

intro_text: "Indiana adopted its state flag on May 31, 1917, featuring a gold torch surrounded by 19 stars on a blue field. The word Indiana appears above the torch. Paul Hadley of Mooresville designed the flag for Indiana's centennial celebration in 1916, and its symbolism aligns with [Indiana's state motto, The Crossroads of America](/states/indiana/motto/the-crossroads-of-america)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Indiana State Flag Is Designed"
    paragraphs:
      - "The Indiana state flag serves as the official flag of Indiana. A field of dark blue covers the entire flag. A gold torch appears at the center with rays radiating outward, and the design is included on the [list of U.S. state flags](/symbols/flags)."
      - "Nineteen five-pointed stars surround the torch. Thirteen stars form an outer ring. Five stars form an inner half-circle below the torch. One large star sits above the torch. The word Indiana appears in a half-circle above the large star."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Indiana Flag Communicates"
    paragraphs:
      - "The Indiana state flag represents liberty and enlightenment through the torch symbol. The rays around the torch represent the far-reaching influence of these ideals. The design celebrates Indiana's role in the Union and its values of freedom, themes also reflected in [Indiana's nickname history](/states/indiana/nickname/the-hoosier-state)."
      - "The 19 stars represent Indiana's position as the 19th state to join the United States. The 13 outer stars symbolize the original Thirteen Colonies. The five inner stars represent the next five states admitted: Vermont, Kentucky, Tennessee, Ohio, and Louisiana. The large star above the torch represents Indiana."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Indiana Flag History and Adoption"
    paragraphs:
      - "Indiana became the 19th state on December 11, 1816. The state had no official flag for its first 69 years. In 1885, each state was asked to dedicate a flag for the Washington Monument. Indiana lacked a state flag, so the government authorized Eliza Callis, the State Librarian, to produce the first Indiana state flag. This flag depicted the seal of Indiana wrapped in an oak leaf wreath, with statehood context also tracked in [states and capital cities reference data](/rankings/geography/states-capital-cities)."
      - "In 1901, the Indiana General Assembly passed Senate Bill 239, making the flag of the United States the official state flag of Indiana. Governor Winfield Durbin signed the bill into law on March 9, 1901. This arrangement remained in statute until it was superseded by standardization of the Indiana state flag in 1955."
      - "To commemorate Indiana's centennial in 1916, the Indiana General Assembly issued a resolution to adopt a new state flag. The Indiana Society of the Daughters of the American Revolution sponsored a design contest. The contest offered a $100 cash prize. More than 200 submissions were received."
      - "Paul Hadley of Mooresville won the contest. The General Assembly made one change to Hadley's original design: they added the word Indiana in a crescent shape over the top of the large star. The flag became the official state banner on May 31, 1917. In 1955, a statute designated the banner as the state flag and standardized the dimensions to 2 by 3 units or 3 by 5 units."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Indiana Flag"
    symbols:
      - id: torch
        name: "Indiana State Flag Torch"
        image: "symbols/torch.svg"
        paragraphs:
          - "A gold torch sits at the center of the flag. Rays radiate outward from the torch toward the surrounding stars. The torch represents liberty and enlightenment."
          - "The rays around the torch represent the far-reaching influence of these ideals. The torch design was central to Paul Hadley's winning contest entry in 1916 and connects visually to [Indiana's blue-and-gold color identity](/states/indiana/color)."

      - id: nineteen-stars
        name: "Indiana State Flag Stars"
        image: "symbols/stars.svg"
        paragraphs:
          - "Nineteen five-pointed stars appear on the flag. The stars represent Indiana as the 19th state to join the United States. The stars are arranged in three groups."
          - "Thirteen stars form an outer ring, symbolizing the original Thirteen Colonies. Five stars form an inner half-circle below the torch, representing Vermont, Kentucky, Tennessee, Ohio, and Louisiana. One large star above the torch represents Indiana."

      - id: indiana-text
        name: "Indiana State Flag Text"
        image: "symbols/indiana-text.svg"
        paragraphs:
          - "The word Indiana appears in a half-circle above the large star. This text was not part of Paul Hadley's original design."
          - "The General Assembly added the word Indiana when adopting the flag in 1917. The addition helps identify the flag as representing Indiana."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Indiana State Flag Colors"
    paragraphs:
      - "The Indiana state flag uses dark blue and gold. Indiana statute allows the torch and stars to be gold or buff. The statute does not provide exact color specifications. The Indiana Historical Bureau provides unofficial Pantone and hex values."
    colors:
      - name: "Blue"
        hex: "#000F5D"
        pantone: "072C"
      - name: "Gold"
        hex: "#D59F0F"
        pantone: "109C"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Indiana State Flag Facts"
    facts:
      - "Indiana adopted its flag on May 31, 1917"
      - "Paul Hadley of Mooresville designed the winning flag"
      - "The flag was created for Indiana's centennial in 1916"
      - "More than 200 designs were submitted to the contest"
      - "The flag was standardized in 1955"
      - "The flag ranked 32nd out of 72 in a 2001 NAVA survey"

faq:
  - question: "Which flag serves as Indiana's official banner?"
    answer: "The state flag of Indiana is the official banner of Indiana, featuring a gold torch surrounded by 19 stars on a dark blue field with the word Indiana above."

  - question: "What are the main visual elements on Indiana's flag?"
    answer: "The Indiana flag shows a dark blue background with a gold torch in the center. Nineteen stars surround the torch in three groups. The word Indiana appears in a half-circle above the torch."

  - question: "What does the Indiana state flag represent?"
    answer: "The torch represents liberty and enlightenment with far-reaching influence. The 19 stars represent Indiana as the 19th state. The design celebrates Indiana's role in the Union and its values of freedom."

  - question: "Which emblems or icons are shown on Indiana's flag?"
    answer: "There are 19 stars on the Indiana state flag. Thirteen stars form an outer ring, five stars form an inner half-circle, and one large star sits above the torch."

  - question: "How do historians explain the symbolism of Indiana's flag?"
    answer: "The 13 outer stars represent the original Thirteen Colonies. The five inner stars represent Vermont, Kentucky, Tennessee, Ohio, and Louisiana. The large star represents Indiana as the 19th state."

  - question: "What does Indiana's flag look like?"
    answer: "The torch represents liberty and enlightenment. The rays radiating from the torch represent the far-reaching influence of these ideals across Indiana and beyond."

