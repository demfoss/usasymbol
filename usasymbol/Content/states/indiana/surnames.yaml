seo:
  title: "Most Common Surnames in Indiana"
  description: "Smith, Johnson, and Williams lead Indiana's most common last names — Miller ranks sixth, anchored by German Catholic families in Dubois County."

page:
  h1: "Most Common Last Names in Indiana"
  intro: "Miller ranks sixth in Indiana, pushed by German Catholic families from Baden and Bavaria who settled Dubois County in the 1840s — one of the densest concentrations of German surnames in any rural U.S. county. Gary's U.S. Steel mills drew tens of thousands of Black families from Mississippi in the 1920s and 1930s, lifting Williams and Johnson into the state's top three."
  heritage_title: "German Settlers, Scots-Irish Pioneers, and the Great Migration"
  heritage_body: "German Catholics established close communities in Dubois County by the 1840s, leaving occupational surnames like Schaefer and Betz unusually concentrated there. Scots-Irish families from Kentucky and Tennessee moved north along the National Road into the south-central counties. During the Great Migration, Black families from Mississippi and Alabama transformed Indianapolis's near-north side and crowded into Gary, where U.S. Steel's Gary Works drew workers by the thousands."
  fun_fact: "Dubois County has one of the highest concentrations of German Catholic surnames outside Pennsylvania, a legacy of a mid-nineteenth-century Catholic mission settlement that drew families from Baden and Bavaria."

surnames:
  - rank: 1
    name: Smith
    count: 59600
    ratio: 109
    origin: english
    type: Occupational
    meaning: "Derived from Old English smið, denoting an ironworker or metalsmith. Smith leads Indiana surname lists statewide and was especially dense in the manufacturing corridor from Terre Haute through Indianapolis, where metalworking trades sustained large workforces through the early twentieth century."

  - rank: 2
    name: Johnson
    count: 45400
    ratio: 143
    origin: english
    type: Patronymic
    meaning: "Means 'son of John,' rooted in the Hebrew Yohanan. In Indiana, Johnson spread widely with Scots-English settlers who followed the National Road westward from the Ohio border during the early 1800s."

  - rank: 3
    name: Williams
    count: 38300
    ratio: 169
    origin: welsh
    type: Patronymic
    meaning: "Means 'son of William,' from the Norman-French given name Guillaume. Williams became one of the most common surnames in Indiana's Black communities during the Great Migration, when tens of thousands relocated to Indianapolis and Gary between 1910 and 1940."

  - rank: 4
    name: Jones
    count: 35700
    ratio: 182
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form of John, meaning 'God is gracious.' Jones arrived with early Quaker and Methodist settlers in east-central Indiana, with Richmond and Wayne County becoming notable concentrations by the mid-1800s."

  - rank: 5
    name: Brown
    count: 35000
    ratio: 185
    origin: english
    type: Descriptive
    meaning: "An Old English nickname for someone with brown hair or complexion. Brown is distributed broadly across Indiana and ranks among the most common surnames in both Indianapolis and the rural counties of the south."

  - rank: 6
    name: Miller
    count: 31100
    ratio: 208
    origin: english
    type: Occupational
    meaning: "Derives from Old English mylenweard, an operator of a grain mill. Miller ranks higher in Indiana than its national standing suggests, reflecting both English mill operators along early river settlements and German immigrants named Müller who anglicized the spelling after settling in the southwestern counties."

  - rank: 7
    name: Davis
    count: 27200
    ratio: 238
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning 'son of David.' Davis arrived early with Scots-Welsh migrants from Virginia and the Carolinas who settled along the Ohio River valley and the southern Indiana counties in the late 1700s and early 1800s."

  - rank: 8
    name: Wilson
    count: 21400
    ratio: 303
    origin: english
    type: Patronymic
    meaning: "Means 'son of Will,' a short form of William. Wilson is well represented in the farming communities of central and north-central Indiana, carried primarily by Scots-Irish settlers who entered the state from Ohio and Pennsylvania."

  - rank: 9
    name: Moore
    count: 20100
    ratio: 323
    origin: english
    type: Habitational
    meaning: "From Old English mōr, referring to someone living near open marshland or heath. Moore families settled broadly across Indiana's flat northern tier, where marshy prairies were drained for agriculture in the mid-nineteenth century."

  - rank: 10
    name: Taylor
    count: 18800
    ratio: 345
    origin: english
    type: Occupational
    meaning: "From Old French tailleur, meaning a cutter of cloth. Taylor spread through Indiana's early town centers — Vincennes, Madison, and Terre Haute — where artisan trades concentrated during the territorial and early statehood period."

  - rank: 11
    name: Anderson
    count: 18100
    ratio: 358
    origin: english
    type: Patronymic
    meaning: "Means 'son of Andrew,' from the Greek Andreas. Anderson is especially visible in northern Indiana, where Scottish and Scandinavian immigrants joined the farming communities around Fort Wayne and South Bend in the late 1800s."

  - rank: 12
    name: Thomas
    count: 16900
    ratio: 383
    origin: welsh
    type: Patronymic
    meaning: "From the Aramaic Toma, meaning twin. Thomas was carried into Indiana by Welsh-descended settlers and also figures prominently among Black families from Georgia and Alabama who arrived in Indianapolis during the first wave of the Great Migration."

  - rank: 13
    name: Martin
    count: 15600
    ratio: 416
    origin: french
    type: Patronymic
    meaning: "Derived from Latin Martinus, linked to the Roman god of war. Martin reflects Indiana's French colonial past along the Wabash River, where Vincennes was founded by French fur traders and missionaries in the early 1700s."

  - rank: 14
    name: Jackson
    count: 14900
    ratio: 435
    origin: english
    type: Patronymic
    meaning: "Means 'son of Jack,' a medieval nickname for John. Jackson is among the most frequent surnames in Indianapolis's historically Black neighborhoods on the near-east and near-north sides, reflecting families who arrived from Tennessee and Mississippi during the Great Migration."

  - rank: 15
    name: White
    count: 14900
    ratio: 435
    origin: english
    type: Descriptive
    meaning: "An Old English nickname for someone with light hair or pale complexion. White is evenly distributed across Indiana and was borne by both early Quaker settlers in the Richmond area and by Black families who adopted the name after emancipation."

  - rank: 16
    name: Harris
    count: 14300
    ratio: 453
    origin: english
    type: Patronymic
    meaning: "A contraction of 'Harry's son,' Harry being a medieval form of Henry. Harris is well represented in the southern counties of Indiana, carried by families from Virginia and Kentucky who crossed the Ohio River in the early 1800s."

  - rank: 17
    name: Thompson
    count: 13000
    ratio: 499
    origin: english
    type: Patronymic
    meaning: "Means 'son of Tom,' a short form of Thomas. Thompson is a signature Scots-Irish name in Indiana, present in force along the settlement corridors that followed the Whitewater and White rivers into the state's interior."

  - rank: 18
    name: Garcia
    count: 11000
    ratio: 589
    origin: spanish
    type: Habitational
    meaning: "A Basque-origin surname possibly meaning 'young' or linked to a place name. Garcia is now among Indiana's fastest-growing surnames, concentrated in Indianapolis's Latino neighborhoods on the west side and in meatpacking communities around Logansport."

  - rank: 19
    name: Martinez
    count: 10400
    ratio: 624
    origin: spanish
    type: Patronymic
    meaning: "Means 'son of Martín,' the Spanish form of Martin. Martinez grew sharply in Indiana from the 1990s onward as Mexican and Central American workers settled in Fort Wayne, Indianapolis, and agricultural towns across the northern counties."

  - rank: 20
    name: Robinson
    count: 9700
    ratio: 668
    origin: english
    type: Patronymic
    meaning: "Means 'son of Robin,' a medieval pet form of Robert. Robinson is a common surname across Indiana's urban counties and figures prominently in the Black community of Gary, where steel-mill workers from the Deep South settled in large numbers from the 1910s through the 1950s."

unique_surnames:
  - name: Studebaker
    state_rank: 1800 # UNVERIFIED
    national_rank: 4000 # UNVERIFIED
    origin: german
    why: "The Studebaker family emigrated from Germany to Pennsylvania and then to South Bend in the 1850s, where their wagon and later automobile company made the name synonymous with Indiana manufacturing. The surname remains disproportionately concentrated in St. Joseph County."

  - name: Hulman
    state_rank: 3500 # UNVERIFIED
    national_rank: 7000 # UNVERIFIED
    origin: german
    why: "The Hulman family of Terre Haute built a grocery and baking-powder empire in the late 1800s and purchased the Indianapolis Motor Speedway in 1945, making the name uniquely prominent in Indiana's commercial and motorsport history."

  - name: Vonnegut
    state_rank: 4500 # UNVERIFIED
    national_rank: 9000 # UNVERIFIED
    origin: german
    why: "A rare German surname brought to Indianapolis in the mid-1800s by hardware merchants and architects, it became internationally recognized through novelist Kurt Vonnegut but remains almost exclusively associated with the Indianapolis German community."

etymology_groups:
  - type: "German Occupational & Craft Names"
    icon: fa-solid fa-hammer
    description: "German settlers in Dubois County and Tell City brought occupational surnames that track craft trades — Schreiner (carpenter), Weber (weaver), Schmidt (blacksmith). Many anglicized spelling over generations, creating parallel Smith/Schmidt clusters unique to southwestern Indiana and distinguishing it from the rest of the Midwest."
    examples:
      - Schmidt (blacksmith)
      - Weber (weaver)
      - Zimmermann (carpenter)
      - Schreiner (joiner/carpenter)

  - type: "English & Scots-Irish Patronymics"
    icon: fa-solid fa-person-walking
    description: "Early settlers crossing the Ohio River from Kentucky, Tennessee, and Virginia brought the dense patronymic surnames — Johnson, Wilson, Thompson — that still dominate Indiana's rural south-central counties. Following the National Road and river valleys northward, they established these names across the state by 1840."
    examples:
      - Johnson (son of John)
      - Wilson (son of Will)
      - Thompson (son of Tom)
      - Harris (son of Harry)

  - type: "Great Migration Surnames"
    icon: fa-solid fa-train
    description: "Between 1910 and 1950, Black families from Mississippi, Alabama, and Georgia brought surnames like Williams, Jackson, and Robinson to Indianapolis and Gary. Gary's U.S. Steel plant was a defining draw, and the surnames of those founding generations remain characteristic of Lake County today."
    examples:
      - Williams (son of William)
      - Jackson (son of Jack)
      - Robinson (son of Robin)
      - Thomas (the twin)

  - type: "Spanish Surnames"
    icon: fa-solid fa-sun
    description: "Hispanic surnames entered Indiana primarily from the 1990s onward as Mexican and Central American families settled in Indianapolis, Fort Wayne, and towns like Logansport. Garcia and Martinez now rank in Indiana's top 20, reflecting one of the Midwest's faster-growing Latino populations."
    examples:
      - Garcia (Basque habitational origin)
      - Martinez (son of Martín)
      - Hernandez (son of Hernando)
      - Lopez (son of Lope)

faq:
  - question: "What are the most common last names in Indiana?"
    answer: "The most common last names in Indiana are Smith, Johnson, Williams, Jones, and Brown, with Miller also ranking unusually high. The top of the list reflects both early Anglo settlement and later industrial-era migration."

  - question: "Why is Miller such a common last name in Indiana?"
    answer: "Miller ranks higher in Indiana than its national position because of the large German immigrant community that settled Dubois County and Tell City in the 1840s and 1850s. Many German-born Müllers anglicized to Miller, boosting the name well beyond its English-only baseline."

  - question: "Why are Garcia and Martinez rising in Indiana?"
    answer: "Both surnames rose through Indiana's growing Hispanic population, especially in Indianapolis, Fort Wayne, Logansport, and other work-centered settlement areas from the 1990s onward. Their presence in the top 20 shows how much Indiana's surname map has changed beyond its older pioneer profile."

