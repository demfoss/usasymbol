seo_title: "Indiana State Beverage | Water"
seo_description: "Indiana made water its official state beverage in 2007 to emphasize water quality rather than a more marketable drink."
intro_text: Indiana's official state beverage is <strong>water</strong> — not spring water, not a specific aquifer, just water — designated in <strong>2007</strong> to spotlight water quality in one of the country's most productive farming states. Most states that named an official beverage chose milk. Indiana chose the one option with no lobby behind it. This profile appears in the [list of U.S. state beverages](/symbols/beverages).
