faq:
- question: What is Indiana's state beverage?
  answer: Indiana's official state beverage is water, designated in 2007.
- question: Why did Indiana choose water as its state beverage?
  answer: The designation was intended to highlight the importance of water quality to Indiana's agricultural economy, including soybean production and livestock farming.
- question: When did Indiana designate its official state beverage?
  answer: Indiana designated water as its official state beverage in 2007.
- question: Is milk Indiana's state beverage?
  answer: No. Despite the famous Indy 500 milk tradition dating to 1936, milk is not Indiana's official state beverage. Water was designated in 2007.
- question: What is the Indy 500 milk tradition?
  answer: Since 1936, the winner of the Indianapolis 500 has traditionally been given milk to drink in Victory Lane. The tradition is associated with the American Dairy Association and is one of the most recognizable sponsor traditions in motorsport. It is not an official Indiana state symbol.
- question: What is the Hoosier Heritage cocktail?
  answer: The Hoosier Heritage is an unofficial cocktail selected in a 2015 Indiana State Museum contest recognizing Indiana's craft spirits industry. It was never designated by legislation and has no official state symbol status.
- question: Is Indiana's state beverage unusual?
  answer: Yes. Most states that named an official beverage chose milk. Indiana's choice of water — made to highlight water quality rather than promote a product — is among the more distinctive entries on state beverage lists.
