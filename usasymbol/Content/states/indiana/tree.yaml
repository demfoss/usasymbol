type: State Tree
state: Indiana
name: Tulip Tree
scientific_name: Liriodendron tulipifera
adopted_year: 1931
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-03-15"
seo_title: "Indiana State Tree: Tulip Tree - From State Seal to Tree"
seo_description: "Indiana recognized the Tulip Tree as state tree in 1931. The tree appeared on the state seal since the 1800s and its blossom was state flower from 1923-1931."

intro_text: "Indiana recognized the Tulip Tree as its state tree in 1931. The tree had appeared on Indiana's state seal since the 1800s. From 1923 to 1931, the tulip tree blossom was Indiana's state flower. In 1931, the tree became state tree while zinnia became state flower, and this transition is often compared on the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Indiana State Tree?"
    paragraphs:
      - "The Tulip Tree is Indiana's official state tree. Also called yellow poplar, this deciduous hardwood grows throughout Indiana. The tree reaches heights of 100 feet or more with straight trunks and appears in habitats shared with [Indiana's state bird, the Northern Cardinal](/states/indiana/bird/northern-cardinal)."
      - "The leaf is distinctive with four lobes shaped like a tulip. Each leaf measures four to eight inches long. The bark is gray-brown with deep furrows on mature trees. Yellow-green flowers with orange centers bloom in May and June."
      - "Tulip Tree is the tallest eastern hardwood. Some specimens reach 165 feet in height. The tree grows rapidly and can live 300 to 500 years. Soft white wood has high commercial value."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Indiana State Tree Name"
    paragraphs:
      - "Common names include Tulip Tree, Tulip Poplar, Yellow Poplar, and Whitewood. The scientific name is Liriodendron tulipifera. Liriodendron means 'lily tree' in Greek. Tulipifera means 'tulip-bearing.'"
      - "Early settlers called it yellow poplar for the yellowish wood. The name tulip tree comes from the tulip-shaped flowers and leaves. It is not a true poplar despite the common name."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Indiana Chose the Tulip Tree"
    paragraphs:
      - "The Indiana General Assembly recognized Tulip Tree as official state tree on March 3, 1931. This designation came at the end of a complex history involving both tree and flower symbols."
      - "The tulip tree leaf appeared in the state seal border since the 1800s, before any official state symbol legislation. This early recognition showed the tree's importance to Indiana identity."
      - "From 1923 to 1931, the tulip tree blossom was Indiana's official state flower. In 1931, legislators wanted to adopt a different flower. The solution: make the tulip tree the state tree and adopt zinnia as state flower. This compromise honored both the historic tree and a new floral symbol, later extended by [Indiana's state flower, the Peony](/states/indiana/flower/peony)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Indiana State Tree Facts"
    facts:
      - "Tulip tree leaf appeared on Indiana's state seal since the 1800s, before official designation"
      - "The tulip tree blossom was Indiana's state flower from 1923 to 1931"
      - "In 1931, the tree became state tree while zinnia replaced it as state flower"
      - "Tulip Tree is also the state tree of Kentucky and Tennessee"
      - "It is the tallest eastern hardwood, reaching up to 165 feet"

  - id: triple-honor
    icon: "fa-solid fa-award"
    title: "Three Ways Indiana Honored the Tulip Tree"
    paragraphs:
      - "Indiana honored the tulip tree in three distinct ways across different periods. First, the distinctive four-lobed leaf appeared in the state seal border designed in the 1800s. This preceded any state symbol legislation."
      - "Second, the General Assembly designated the tulip tree blossom as official state flower in 1923. The yellow-green flowers with orange centers represented Indiana for eight years."
      - "Third, in 1931 the tree itself became the official state tree. This triple honor is unique among state symbols. No other state gave such layered recognition to a single tree species."

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Indiana State Tree and Flower"
    paragraphs:
      - "Indiana's current state flower is the Peony (Paeonia), designated in 1957. The peony replaced the zinnia, which had been state flower from 1931 to 1957. Before that, the tulip tree blossom was state flower from 1923 to 1931, and the carnation from 1913 to 1923. Indiana has changed its state flower multiple times but kept the same state tree since 1931."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Tulip Tree"
    paragraphs:
      - "The leaf shape is the clearest identification feature. Each leaf has four distinct lobes with a flat or slightly notched top. The shape looks like a tulip viewed from the side. No other native tree has this distinctive leaf shape."
      - "Flowers bloom high in the canopy from April to June. Each flower is two to three inches long with six yellow-green petals. An orange band marks the base of each petal. The flowers resemble tulips."
      - "Mature bark is gray-brown with deep vertical furrows. Young trees have smoother, lighter bark. The trunk grows very straight, often without branches for 80 to 100 feet in forest conditions."

  - id: uses
    icon: "fa-solid fa-hammer"
    title: "Uses and Importance"
    paragraphs:
      - "Native Americans carved tulip tree trunks into canoes. The light, easily worked wood created large dugout canoes from single trees. Some canoes measured over 40 feet long."
      - "Early settlers used tulip tree timber for houses, barns, and furniture. The soft white wood cuts and shapes easily. Today the wood substitutes for scarce softwoods in furniture frames and interior construction."
      - "The tree provides wildlife value. Flowers produce nectar for honey. Seeds feed songbirds, game birds, rabbits, squirrels, and mice. White-tailed deer browse on seedlings. The tall trunks offer nesting sites."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Tulip Tree is often associated with Indiana's pioneer heritage and natural resources. Early settlers depended on the abundant tulip tree forests for shelter and transportation. The tree's rapid growth and towering height suggest strength and aspiration. Its triple honor across seal, flower, and tree shows deep cultural significance in Indiana and reinforces themes found in [Indiana's state motto](/states/indiana/motto/the-crossroads-of-america)."

  - id: "regional-context"
    icon: "fa-solid fa-map"
    title: "Regional Context"
    paragraphs:
      - "Tulip tree range and forest conditions are easier to compare across nearby states using [States Neighboring States](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Indiana state tree?"
    answer: "The Tulip Tree (Liriodendron tulipifera) is Indiana's official state tree. The Indiana General Assembly recognized it on March 3, 1931, the same year the tulip tree blossom was replaced as state flower by the zinnia."
  
  - question: "What is the Indiana state tree called?"
    answer: "Indiana's state tree is called Tulip Tree, Tulip Poplar, Yellow Poplar, or Whitewood. The scientific name is Liriodendron tulipifera, meaning 'lily tree bearing tulips' in Greek and Latin. It is not a true poplar despite the common name."
  
  - question: "When did Indiana adopt the Tulip Tree as state tree?"
    answer: "Indiana recognized the Tulip Tree as state tree on March 3, 1931. Before this, the tulip tree blossom had been Indiana's state flower from 1923 to 1931. The tree leaf appeared on Indiana's state seal since the 1800s."
  
  - question: "Why is the Tulip Tree Indiana's state tree?"
    answer: "The tulip tree had deep historical significance in Indiana. Its leaf appeared on the state seal since the 1800s. From 1923 to 1931, the blossom was state flower. In 1931, legislators wanted to change the state flower while still honoring the tulip tree. They made the tree the official state tree and adopted zinnia as the new flower. This preserved the tulip tree's symbolic importance."
  
  - question: "Was the tulip tree ever Indiana's state flower?"
    answer: "Yes. The blossom of the tulip tree was Indiana's official state flower from 1923 to 1931. In 1931, the legislature changed the state flower to zinnia while simultaneously making the tulip tree the official state tree. This allowed Indiana to honor the historic tulip tree in a new way."
  
  - question: "What are some facts about the Indiana state tree?"
    answer: "The tulip tree leaf appeared on Indiana's state seal since the 1800s. Its blossom was state flower 1923-1931. In 1931, it became state tree when zinnia became state flower. Tulip Tree is also Kentucky and Tennessee's state tree. It's the tallest eastern hardwood at up to 165 feet."
  
  - question: "How tall does Tulip Tree grow in Indiana?"
    answer: "Tulip Tree commonly reaches 100 feet tall in Indiana. In optimal conditions, it can grow to 165 feet, making it the tallest eastern hardwood. The tree develops a straight trunk often without branches for 80 to 100 feet. It can live 300 to 500 years."
  
  - question: "What other states have Tulip Tree as their state tree?"
    answer: "Kentucky and Tennessee also have the Tulip Tree (Liriodendron tulipifera) as their official state tree. All three states are part of the tree's natural range across eastern North America. The tree grows from southern Ontario to central Florida."

