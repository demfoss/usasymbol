seo_title: "Indiana State Bird | Northern Cardinal"
seo_description: "Indiana adopted the cardinal in 1933 under an unusual name: state law calls it the Red Bird or Cardinal, not the Northern Cardinal. Indiana is one of seven cardinal states — the only one that kept folk language in the statute."

intro_text: "Indiana's state bird is the <strong>Northern Cardinal</strong>, adopted in <strong>1933</strong> and listed in <strong>Ind. Code 1-2-8-1</strong>. What makes Indiana's version distinct is the wording of the law itself: the statute does not say Northern Cardinal. It says <strong>Red Bird or Cardinal</strong> — a folk name preserved inside formal legislation, making Indiana's designation unusual even among the six other states that share the same species."

