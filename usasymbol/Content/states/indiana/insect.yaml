faq:
- question: What is Indiana's state insect?
  answer: "Indiana's state insect is Say's firefly, adopted in 2018."
- question: When did Indiana adopt Say's firefly?
  answer: "Indiana adopted Say's firefly as its official state insect on March 23, 2018."
- question: Why did Indiana choose Say's firefly?
  answer: "The firefly honors Indiana naturalist Thomas Say, who first described the species in 1825. Elementary school students led a four-year campaign for its designation."
- question: What does Say's firefly look like?
  answer: "Say's firefly is a soft-bodied beetle that glows amber or orange, unlike the yellow-green flash of many other fireflies."
- question: Who helped choose Indiana's state insect?
  answer: "Students at Cumberland Elementary School in West Lafayette, led by second grader Kayla Xu, researched and campaigned for Say's firefly over four years."
- question: Was Say's firefly Indiana's first state insect?
  answer: "Yes. Indiana had no official state insect until Say's firefly was adopted in 2018, making Indiana the first state to name this species as its state insect."

