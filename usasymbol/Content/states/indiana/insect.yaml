sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Indiana?
  paragraphs:
  - "Say's firefly, Pyractomena angulata, is Indiana's official state insect. Governor Eric Holcomb signed the designation into law on March 23, 2018."
  - "It was Indiana's first official state insect, and Indiana became the first state in the country to name Say's firefly as its state symbol."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About Say's Firefly
  paragraphs:
  - "Say's firefly is a soft-bodied beetle that produces light through a chemical reaction in special cells near the tip of its abdomen."
  - "Unlike many common fireflies that flash yellow or green, Say's firefly glows amber or orange, which makes its light shows easy to pick out at dusk."
  - "It is active from late spring through midsummer, flashing over croplands, roadsides, grasslands, and forests across Indiana."

- id: history
  icon: fa-solid fa-landmark
  title: How Indiana Chose Say's Firefly
  paragraphs:
  - "The idea for a state insect dates back to 1998, when a Purdue entomologist first proposed Say's firefly, though it did not become law at the time."
  - "Second grader Kayla Xu revived the idea during the 2014-15 school year after discovering Indiana had no state insect. Students at Cumberland Elementary School in West Lafayette researched the firefly, lobbied lawmakers, and testified before the state Senate over four years."
  - "State Representative Sally Siegrist sponsored the bill, and Governor Eric Holcomb signed it into law at Cumberland Elementary School on March 23, 2018. The firefly is named for naturalist Thomas Say, who first described it in 1825 while living in New Harmony, Indiana, and is known as the father of North American entomology."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Say's Firefly Facts
  facts:
  - "Adopted: 2018, Indiana's first official state insect."
  - "Scientific name: Pyractomena angulata."
  - "Named for naturalist Thomas Say, who first described the species in 1825 while living in New Harmony, Indiana."
  - "Glows amber or orange, unlike the yellow-green flash of many other fireflies."
  - "The campaign to name it was led by Cumberland Elementary School students in West Lafayette, following an idea first proposed by a Purdue entomologist in 1998."




