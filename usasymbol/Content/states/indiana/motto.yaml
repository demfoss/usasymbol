seo_title: "Indiana State Motto | The Crossroads of America"
seo_description: "Indiana's state motto is \"The Crossroads of America,\" adopted in 1937. It reflects Indiana's position at the center of major U.S. transportation routes."

intro_text: "Indiana's state motto is <strong>The Crossroads of America</strong>. Adopted in 1937, it refers to Indiana's place at the center of the U.S. road network, where major routes running east to west and north to south have crossed the state since the National Road was built through Indianapolis in the early 1800s."

