seo_title: "Indiana State Motto: The Crossroads of America"
seo_description: "Indiana's motto 'The Crossroads of America' was chosen by newspaper readers, not legislators — a columnist collected 324 suggestions from readers in 1937 and forwarded them to a 5-person legislative committee. Indiana also has more interstate highway miles per square mile than any other state."

intro_text: "Indiana's state motto is <strong>The Crossroads of America</strong>, officially adopted on March 2, 1937. The phrase was not coined by a committee or a statesman — it emerged from a newspaper reader campaign run by J. Roy Strickland, a columnist for the Evansville Courier who noticed Indiana had no motto and asked his readers to suggest one. The legislature adopted it through House Joint Resolution No. 6, designating it simultaneously as both the state motto and state slogan — an unusual dual designation."

sections:
  - id: "newspaper-readers-chose-it"
    icon: "fa-solid fa-newspaper"
    title: "Chosen by Newspaper Readers, Not Legislators"
    paragraphs:
      - "In the mid-1930s, J. Roy Strickland wrote a column called 'Paragraphy' for the Evansville Courier. He noticed that Indiana had no official state motto while other states did. Rather than petition legislators directly, he opened the question to readers: suggest a motto for Indiana. In two to three weeks, he received 324 submissions."
      - "Strickland compiled the suggestions, removed all names to anonymize the entries, and forwarded the complete list to the Indiana General Assembly. A five-member committee — three representatives and two senators — reviewed all 324 submissions and selected 'The Crossroads of America.' Historical records don't document who originally submitted the winning phrase. The committee didn't invent it; they chose it from what readers had offered."
      - "The General Assembly adopted it on March 2, 1937. House Joint Resolution No. 6 used both the word 'motto' and the word 'slogan' interchangeably in the same document — a usage that most states carefully separate. This makes Indiana's designation legally unusual: the same phrase carries both labels under the same resolution."

  - id: "highways-made-it-true"
    icon: "fa-solid fa-road"
    title: "The Geography That Made the Motto Accurate"
    paragraphs:
      - "The phrase was already in circulation before the state adopted it. Terre Haute pointed to the intersection of US Route 40 (east-west) and US Route 41 (north-south) in its downtown as the original crossroads. Indianapolis had claimed the same title based on its deliberately central location — Indiana's capital city was placed in 1821 by a commission specifically because it was near the state's geographic center."
      - "The interstate highway era that began in the 1950s made 'Crossroads of America' more literally true than the 1937 legislators could have known. I-65, I-69, I-70, and I-74 all converge on Indianapolis. Indiana now has more interstate highway miles per square mile than any other state in the country. The motto a newspaper columnist popularized in 1937 describes modern Indiana with more precision than it did when adopted."
      - "Indianapolis adopted 'The Crossroads of America' as its own official city slogan in 1988 — 51 years after the state claimed it. The city noted its position at the junction of four major interstate systems as justification. State and capital city now share the same identity phrase, which is uncommon."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Indiana State Motto Facts"
    style: "gradient"
    facts:
      - "The motto was chosen from 324 reader submissions collected by a newspaper columnist — not proposed by legislators."
      - "No historical record shows who submitted the winning phrase among the 324 entries."
      - "House Joint Resolution No. 6 (1937) designated the phrase as both the state motto and state slogan — unusual dual labeling."
      - "Indiana has more interstate highway miles per square mile than any other U.S. state."
      - "Indianapolis was placed at Indiana's geographic center by a commission in 1821 — the crossroads concept is built into the city's founding."
      - "Indianapolis adopted 'The Crossroads of America' as its city slogan in 1988, 51 years after state adoption."

faq:
  - question: "What is Indiana's state motto?"
    answer: "Indiana's state motto is 'The Crossroads of America,' adopted on March 2, 1937, through House Joint Resolution No. 6."

  - question: "How was Indiana's motto chosen?"
    answer: "Through a newspaper reader campaign. Columnist J. Roy Strickland of the Evansville Courier collected 324 reader submissions, anonymized them, and forwarded them to a five-member legislative committee, which selected 'The Crossroads of America.' No record identifies who originally submitted the winning phrase."

  - question: "What does 'The Crossroads of America' mean?"
    answer: "Indiana sits at the geographic center of the eastern United States, where major east-west and north-south routes intersect. The phrase captures Indiana's role as a transportation hub. Today, Indiana has more interstate highway miles per square mile than any other state."

  - question: "When was Indiana's motto officially adopted?"
    answer: "March 2, 1937, when the Eightieth Indiana General Assembly passed House Joint Resolution No. 6. The resolution designated the phrase as both the state motto and state slogan."

  - question: "Is Indiana's motto also a slogan?"
    answer: "Yes — unusually, the 1937 resolution used both terms. Most states keep 'motto' and 'slogan' distinct. Indiana's Joint Resolution No. 6 applied both labels to the same phrase, making 'The Crossroads of America' simultaneously the official state motto and official state slogan."

  - question: "Where does Indiana's motto appear?"
    answer: "On Indiana license plates (the most visible use), state documents, government buildings, tourist materials, and on the 2002 Indiana state quarter, which showed 'The Crossroads of America' across the top of the coin alongside an IndyCar and 19 stars."

