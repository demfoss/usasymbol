faq:
  - question: "What is Indiana's state motto?"
    answer: "Indiana's state motto is \"The Crossroads of America.\" It was adopted by the Indiana General Assembly in 1937 and refers to Indiana's central position in the U.S. road network, where major east-west and north-south routes have crossed the state since the early 1800s."

  - question: "What does \"The Crossroads of America\" mean?"
    answer: "The phrase describes Indiana's geographic position at the intersection of major American transportation routes. The National Road (later U.S. Route 40) ran east-west through Indianapolis, and multiple major interstates — including I-65, I-70, and I-74 — converge in the state. Indiana's flat terrain made it a natural corridor for roads running in every direction."

  - question: "When did Indiana adopt its state motto?"
    answer: "Indiana adopted \"The Crossroads of America\" as its official state motto in 1937. Indiana had no state motto before that date. The state itself was admitted to the Union on December 11, 1816."

  - question: "Where does Indiana's motto appear?"
    answer: "\"The Crossroads of America\" appears on Indiana license plates, where it has been carried for decades, and on official state documents and publications. It is not inscribed on the state seal or state flag."

