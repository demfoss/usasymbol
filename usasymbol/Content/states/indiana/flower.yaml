seo_title: "Indiana State Flower: Peony – History & Facts"
seo_description: "Indiana adopted the Peony as its state flower in 1957. These large fragrant flowers bloom in gardens across Indiana each late spring."

intro_text: "Year 1957 marked the adoption of the Peony as Indiana's state flower. These large showy flowers bloom in gardens throughout Indiana during late spring. The Peony replaced the zinnia which Indiana had used as its state flower since 1931, and it appears in seasonal contexts with [Indiana's state bird, the Northern Cardinal](/states/indiana/bird/northern-cardinal)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Indiana State Flower?"
    paragraphs:
      - "Indiana recognizes the Peony as its state flower. Each bloom displays dozens of ruffled petals arranged in a full, rounded shape. The flowers measure 3 to 6 inches across depending on variety. Colors range from white and pink to deep red and burgundy. A sweet fragrance attracts bees and other pollinators."
      - "Peonies bloom from late May through early June in Indiana. The flowering period lasts about two weeks for individual plants. Blooms appear on sturdy stems that reach 2 to 4 feet tall. Dark green compound leaves remain attractive throughout the growing season. Plants die back to the ground after frost in fall."
      - "Garden peonies thrive in Indiana's climate and soil conditions. The plants require winter cold to bloom properly. Well-drained soil suits peonies best. Full sun produces the most flowers. Established peony plants can live for decades in the same location. Many Indiana gardens feature peonies passed down through generations, often in landscapes that also support [Indiana's state tree, the Tulip Tree](/states/indiana/tree/tulip-tree)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Indiana State Flower Name"
    paragraphs:
      - "Known as Peony, this flower's scientific designation is Paeonia. The genus belongs to the Paeoniaceae family. This small family contains only one genus with about 35 species of herbaceous and tree peonies native to Asia, Europe, and western North America."
      - "The name Paeonia comes from Greek mythology. Paeon served as physician to the gods. He used peony roots to heal wounds. Ancient Greeks valued peonies for medicinal properties. The common name peony derives directly from this mythological connection."
      - "Indiana's designation does not specify which peony species or variety represents the state. Garden peonies cultivated in Indiana include hundreds of named varieties. Most belong to the species Paeonia lactiflora from China. Hybrid peonies combine multiple species. This flexible designation allows all peony types to represent Indiana."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Indiana Chose the Peony"
    paragraphs:
      - "Indiana proclaimed the Peony its official state flower in 1957. This change replaced the zinnia which had served as state flower since 1931. The Indiana General Assembly debated the switch for several years before making it official. Garden clubs throughout Indiana led the campaign for peonies, and similar histories are indexed on the [list of U.S. state flowers](/symbols/flowers)."
      - "Critics argued the zinnia deserved to remain as state flower. Supporters of the peony pointed out that zinnias are annuals native to Mexico. Peonies grow as perennials well-suited to Indiana gardens. The peony's long history in Indiana landscapes strengthened the case for change. Many pioneer families had brought peony roots to Indiana."
      - "The Indiana Federation of Garden Clubs lobbied legislators intensively. They presented petitions signed by thousands of Indiana residents. The organization argued that a perennial flower better represented Indiana than an annual. The General Assembly passed the designation on March 15, 1957. Indiana became one of few states to officially change its state flower."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Indiana State Flower Facts"
    facts:
      - "Peonies can live for over 100 years in the same location, with some historic Indiana gardens containing plants from the 1800s"
      - "The flowers attract ants which feed on nectar droplets produced by developing buds, though ants are not necessary for blooms to open"
      - "Indiana adopted the Peony on March 15, 1957, replacing the zinnia that had been the state flower since 1931"
      - "Peony roots were used in traditional medicine for over 2,000 years in China and Europe to treat various ailments"
      - "Cut peony flowers can last 7 to 10 days in a vase, making them popular for spring weddings and Memorial Day decorations in Indiana"
      - "Indiana does not specify a particular peony species or color as the official state flower, allowing all peony varieties to represent the state"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Indiana State Flower and Bird"
    paragraphs:
      - "The Northern Cardinal serves as Indiana's state bird, sharing this designation with several other states including Illinois and Ohio. Both symbols represent Indiana officially. Indiana adopted the Peony in 1957 and designated the Northern Cardinal as state bird in 1933."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Peony has become associated with Indiana through its long presence in home gardens and public landscapes across the state. Many peony plantings in Indiana date back decades, reflecting the plant’s durability and continued popularity in the region and complementing identity themes from [Indiana's state motto page](/states/indiana/motto/the-crossroads-of-america)."

  - id: "regional-context"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Context"
    paragraphs:
      - "Bloom timing and cultivar performance vary across the Midwest, so [States Neighboring States](/rankings/geography/states-neighboring-states) helps compare Indiana conditions with nearby climates."

faq:
  - question: "What is Indiana's state flower?"
    answer: "Indiana's state flower is the Peony, a large fragrant perennial flower that blooms in gardens throughout the state in late spring."
  
  - question: "When did Indiana adopt the Peony as its state flower?"
    answer: "Indiana adopted the Peony on March 15, 1957. This designation replaced the zinnia which had been Indiana's state flower since 1931."
  
  - question: "Why did Indiana choose the Peony?"
    answer: "Indiana chose the Peony to replace the zinnia because garden clubs argued that a perennial flower better represented the state than an annual. Peonies thrive in Indiana's climate and have a long history in the state's gardens. Many pioneer families brought peony roots to Indiana, and the plants can live for generations."
  
  - question: "What was Indiana's state flower before the Peony?"
    answer: "The zinnia was Indiana's state flower from 1931 to 1957. Indiana changed to the Peony after the Indiana Federation of Garden Clubs campaigned for a non-native annual flower but well-adapted to Indiana."
  
  - question: "When do peonies bloom in Indiana?"
    answer: "Peonies bloom from late May through early June in Indiana. The flowering period lasts about two weeks for individual plants. Cut flowers can last 7 to 10 days in a vase."

