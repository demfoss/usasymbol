seo_title: "Indiana State Firearm: The Historic Grouseland Rifle by John Small"
seo_description: "Indiana's official state firearm is the Grouseland Rifle — a handcrafted flintlock long rifle made by John Small in the early 1800s. Learn the history of SEA 209, John Small's legacy, and where to see this rare frontier artifact in Vincennes, Indiana."

intro_text: "Among the [states with official firearms](/symbols/firearms), Indiana's designation is unlike any other in the United States. While Arizona designated a brand, Alaska designated a manufacturing era, and Utah designated a pistol design — Indiana in 2012 designated a **specific surviving artifact**: a handcrafted flintlock long rifle made by a single gunsmith in the early 1800s. The **Grouseland Rifle**, crafted by John Small in Vincennes, is not a model or a type. It is an object. And only a handful of Small's rifles survive."

sections:
  - id: "unique-designation"
    icon: "fa-solid fa-fingerprint"
    title: "The Only State Symbol That Is a Specific Artifact, Not a Model"
    paragraphs:
      - "Every other state firearm designation in the United States names a type or model of weapon: the Colt Single Action Army (Arizona), the Browning M1911 pistol (Utah), the Pre-1964 Winchester Model 70 (Alaska), the Barrett M82 (Tennessee). Indiana is the only exception. Senate Enrolled Act 209 designated not a model, not a manufacturer, not an era — but a specific surviving rifle, crafted by a named individual, currently on display at a specific address in Vincennes, Indiana, and connected to the Hoosier State identity."
      - "The distinction matters enormously for what the designation communicates. Other state firearm laws honor engineering achievements, frontier mythology, or constitutional identity. Indiana's law honors a man. The Grouseland Rifle is inseparable from John Small — his hands, his tools, his workshop in Indiana Territory — and cannot be replicated, mass-produced, or purchased at a firearms dealer. There is only one."
      - "Fewer than six rifles made by John Small are known to survive. The Grouseland Rifle is the most historically significant of them, housed at the Grouseland Mansion in Vincennes — the former home of President William Henry Harrison, Indiana's most prominent early political figure. The collision of Small's craftsmanship with Harrison's legacy made the rifle an obvious candidate for official recognition."

  - id: "john-small"
    icon: "fa-solid fa-person"
    title: "Who Was John Small? The Maker Behind the Masterpiece"
    subsections:
      - subtitle: "Gunsmith and Frontier Craftsman"
        text: "John Small was one of the earliest skilled gunsmiths in Indiana Territory, operating in Vincennes — then the territorial capital — in the late 1700s and early 1800s. His rifles were made entirely by hand, using techniques carried westward from the Pennsylvania German gunsmithing tradition. A Small rifle was not a consumer product; it was a commission, built for a specific person, finished to a level of craftsmanship that reflected the maker's full skill."

      - subtitle: "First Sheriff of Knox County"
        text: "John Small was appointed the first sheriff of Knox County, Indiana Territory — the county that encompasses Vincennes. His role as sheriff was not administrative in the modern sense; in the territorial period, the county sheriff was the primary instrument of frontier law enforcement, responsible for maintaining order in a settlement surrounded by contested territory. Small held the position of gunsmith and lawman simultaneously — a combination that was not unusual on the frontier."

      - subtitle: "Designer of the Indiana Territorial Seal"
        text: "Among Small's most historically significant contributions was his design of the official seal of the Indiana Territory. The seal, which included a frontiersman, a buffalo, the rising sun, and a landscape representing the territorial domain, became the visual identity of Indiana's government during the territorial period from 1800 to 1816. Small's authorship of the seal means that Indiana's official state firearm and its territorial visual identity share the same creator — a coincidence that no other state symbol can claim."

      - subtitle: "The Rarity of Surviving Small Rifles"
        text: "John Small's working life predates industrial manufacturing. Each rifle he produced was handmade to order and built to the standards of frontier utility: accurate, reliable, and built to last. The survival rate for frontier-era long rifles is low — wood rots, metal rusts, and working firearms get used until they are no longer serviceable. Fewer than six rifles attributable to John Small are known to exist. The Grouseland Rifle is the most historically documented of them."

  - id: "legislation-sea209"
    icon: "fa-solid fa-scale-balanced"
    title: "Senate Enrolled Act 209: Preserving Indiana's Frontier Legacy"
    subsections:
      - subtitle: "The Sponsor: Senator John Waterman"
        text: "Senate Enrolled Act 209 was introduced by Indiana State Senator John Waterman in the 2012 legislative session. Waterman framed the bill as recognition of Indiana's frontier heritage and the role of the long rifle in the survival and defense of early Indiana settlements. The legislation was specific in its designation: not 'a flintlock rifle' or 'a Kentucky long rifle,' but the Grouseland Rifle — the specific artifact housed at the Grouseland Mansion in Vincennes."

      - subtitle: "What the Bill Said"
        text: "SEA 209 designated the Grouseland Rifle as Indiana's official state firearm, adding it to the official list of Indiana state symbols. The bill's language acknowledged the rifle's connection to the frontier period of Indiana's history and its preservation at Grouseland. By naming a specific object rather than a class of objects, the legislation created the most precisely defined state firearm designation in U.S. history."

      - subtitle: "Governor Mitch Daniels Signs"
        text: "Governor Mitch Daniels signed Senate Enrolled Act 209 into law in 2012. Indiana thus became the third state to designate an official firearm (after Utah in 2011 and Arizona in 2011), but the first — and so far only — state to base its designation on a named artifact rather than a weapon type or model."

      - subtitle: "Indiana in the State Firearm Timeline"
        text: "Indiana's 2012 designation came as part of a wave of state firearm legislation that ran from 2011 through 2014. Utah led in March 2011 (Browning M1911), Arizona followed in April 2011 (Colt SAA), Indiana designated the Grouseland Rifle in 2012, West Virginia designated the Hall Model 1819 Flintlock in 2013, Kentucky designated the Long Rifle in 2013, and Pennsylvania designated the Pennsylvania Long Rifle in 2014. Indiana's artifact-based approach was unique among all of them and aligns with the legal-symbol tradition on the [Indiana state flag](/states/indiana/flag/indiana-state-flag)."

  - id: "anatomy-long-rifle"
    icon: "fa-solid fa-ruler"
    title: "The Anatomy of a Frontier Long Rifle"
    paragraphs:
      - "The Grouseland Rifle belongs to the tradition of the American long rifle — sometimes called the Kentucky rifle or Pennsylvania rifle — a design that evolved in the German immigrant gunsmithing communities of Lancaster County, Pennsylvania in the early 1700s and spread westward with the frontier. Understanding the design explains why the long rifle defined American frontier life for over a century."
    subsections:
      - subtitle: "The Rifled Barrel"
        text: "The defining feature of the long rifle is its rifled barrel — a bore with helical spiral grooves that spin the ball as it travels, dramatically improving accuracy and effective range. A smoothbore musket of the same era was effective to roughly 50–75 yards. A rifled long rifle in skilled hands could engage targets accurately at 200 yards or more. In forest hunting and frontier defense, this range advantage was transformative."

      - subtitle: "Full-Stock Construction"
        text: "Frontier long rifles used a full-stock design — the wooden stock extended the full length of the barrel to the muzzle. The Grouseland Rifle's stock would have been made from curly maple (also called tiger maple or figured maple), the wood of choice for Pennsylvania-tradition gunsmiths. Curly maple was chosen for its beauty, density, and resistance to warping — qualities that suited both the craftsman's aesthetic and the frontier environment."

      - subtitle: "Flintlock Ignition"
        text: "The Grouseland Rifle uses a flintlock ignition system: a piece of flint held in a spring-loaded cock strikes a steel plate (the frizzen), generating sparks that ignite a priming charge in the pan, which in turn ignites the main propellant charge through a small hole in the barrel. The flintlock was the dominant ignition technology of the frontier era and required careful maintenance — wet weather and worn flints were constant reliability concerns for hunters and militia."

      - subtitle: "Silver Furniture and Inlays"
        text: "The decorative elements of a quality frontier long rifle — patch box covers, side plates, trigger guards, and inlaid designs — were typically made from silver or brass. Silver was preferred by skilled craftsmen for its workability and appearance. A rifle with silver furniture was not purely decorative; it signaled the maker's skill and the owner's status. The metalwork on a Small rifle would have been produced entirely by hand, fitted individually to each stock."

  - id: "comparison"
    icon: "fa-solid fa-trophy"
    title: "Indiana vs. Kentucky vs. Pennsylvania: The Long Rifle Rivalry"
    paragraphs:
      - "Three states have designated long rifles as their official firearm: Indiana (Grouseland Rifle), Kentucky (Kentucky Long Rifle), and Pennsylvania (Pennsylvania Long Rifle). All three designations reference the same underlying design tradition — the American long rifle developed by German immigrant gunsmiths in Pennsylvania and carried westward through Kentucky and into Indiana Territory. The differences between the three designations reveal how the same object can be claimed for entirely different reasons."
    subsections:
      - subtitle: "Indiana: A Specific Maker"
        text: "Indiana's designation centers entirely on John Small — a named craftsman in a named location at a named time. The Grouseland Rifle is legally defined by who made it and where it now sits, not by what type of gun it is. Indiana's approach treats the long rifle as biography: the object matters because of the person it came from."
        link:
          label: "Indiana State Firearm"
          url: "/states/indiana/firearm/grouseland-rifle"

      - subtitle: "Kentucky: A Battlefield Legend"
        text: "Kentucky's Kentucky Long Rifle designation honors a cultural legend built at the Battle of New Orleans in January 1815, where Kentucky sharpshooters using long rifles decimated British forces from behind earthworks. The rifle was already associated with Kentucky in popular imagination before the battle; the battle cemented it permanently. Kentucky's approach treats the long rifle as mythology: the object matters because of what it did."
        link:
          label: "See Kentucky State Firearm"
          url: "/states/kentucky/firearm/kentucky-long-rifle"

      - subtitle: "Pennsylvania: The Origin Story"
        text: "Pennsylvania's Pennsylvania Long Rifle designation claims the origin point. The design was developed by German immigrant gunsmiths in Lancaster County, Pennsylvania, in the early 1700s. Pennsylvania's case is historical and technical: this is where the long rifle was invented, refined, and first produced in quantity. Pennsylvania's approach treats the long rifle as heritage: the object matters because of where it came from."

      - subtitle: "Why Indiana's Version Is the Most Distinctive"
        text: "Of the three, Indiana's designation is the hardest to replicate and the most historically verifiable. Kentucky's 'Kentucky Long Rifle' and Pennsylvania's 'Pennsylvania Long Rifle' are both designations of a type — no specific rifle is named, no specific maker honored, no specific artifact identified. Indiana's Grouseland Rifle is physically located at a specific address, documented to a specific maker, and connected to a specific chapter of Indiana's territorial history. It is the only long rifle designation that refers to a single object you can visit."

  - id: "grouseland-connection"
    icon: "fa-solid fa-landmark"
    title: "The Grouseland Connection: William Henry Harrison's Indiana"
    paragraphs:
      - "The rifle is named for Grouseland — the 1804 Federal-style mansion built by William Henry Harrison in Vincennes, then the capital of Indiana Territory. Harrison served as the first governor of Indiana Territory from 1801 to 1812 and later became the 9th President of the United States. Grouseland was the center of territorial political life in Indiana for over a decade and fits the broader state identity described in [Indiana's state motto history](/states/indiana/motto/the-crossroads-of-america)."
      - "The connection between John Small and Harrison's Grouseland is not incidental. Vincennes was a small settlement in the early 1800s — perhaps a thousand residents at its peak during the territorial period. The gunsmith, the sheriff-gunsmith, and the territorial governor would have known each other. A rifle made by the man who designed the territorial seal and stored at the mansion of the territorial governor tells a specific and coherent story about a specific community at a specific historical moment."
      - "Grouseland was designated a National Historic Landmark in 1960 and is managed by the Daughters of the American Revolution. It remains open to visitors and houses artifacts and documents from the Harrison and territorial periods. The Grouseland Rifle is among the most historically significant objects in the collection — not because of what it is, but because of who made it and where it has been kept."

  - id: "where-to-see"
    icon: "fa-solid fa-location-dot"
    title: "Where to See the Grouseland Rifle"
    subsections:
      - subtitle: "Grouseland Mansion — Vincennes, Indiana"
        text: "The Grouseland Rifle is housed at Grouseland, William Henry Harrison's mansion at 3 W. Scott Street, Vincennes, Indiana 47591. The mansion is open to visitors and operated by the Daughters of the American Revolution. The house has been restored to its Federal-period appearance and includes period furniture, documents, and artifacts from the territorial era. The Grouseland Rifle is the only state firearm in the United States that a visitor can see at its permanent, designated home."

      - subtitle: "Indiana Territory Capitol (Old French House Area) — Vincennes"
        text: "Vincennes's historic district preserves several structures from the territorial period, including the Indiana Territory Capitol building where the territorial legislature met. The historic district provides context for understanding the Vincennes that John Small inhabited — a frontier settlement that was simultaneously a Native American trading post, a French colonial remnant, an American territorial capital, and the launching point for westward expansion into the Old Northwest."

      - subtitle: "Indiana State Museum — Indianapolis"
        text: "The Indiana State Museum in Indianapolis covers Indiana history from prehistoric times through the present. Its collections include artifacts from the territorial and early statehood periods, with exhibits that document the frontier culture that produced craftsmen like John Small. While the Grouseland Rifle itself remains in Vincennes, the Indianapolis museum provides the broader historical context for understanding Indiana's frontier heritage and why a specific rifle warranted legislative recognition."

  - id: "long-rifle-era"
    icon: "fa-solid fa-scroll"
    title: "The Long Rifle's Role in Frontier Indiana"
    paragraphs:
      - "The Indiana Territory of the early 1800s was not a peaceful agricultural settlement. It was a contested borderland — between American settlers moving westward, Native American confederacies resisting displacement, and British influence from Canada that periodically encouraged and supported Native resistance. The decade from 1800 to 1812, when Harrison governed from Grouseland and Small worked in Vincennes, was marked by ongoing conflict that culminated in the Battle of Tippecanoe (November 7, 1811)."
      - "In that environment, a reliable long rifle was not a luxury. Every male settler of military age was expected to be armed and capable of service in the territorial militia. The same rifle used for hunting — to supply the protein that kept frontier families fed through harsh winters — was the rifle carried to militia musters and frontier skirmishes. John Small's rifles served both purposes simultaneously."
      - "The long rifle's accuracy advantage over the smoothbore muskets more common in the British and French military traditions gave American frontier fighters a significant tactical advantage in the wooded terrain of the Old Northwest. A frontiersman with a Pennsylvania-tradition long rifle could engage an opponent at a range where the opponent's smoothbore musket was ineffective. This tactical asymmetry shaped the frontier conflicts of the period and contributed to American expansion across the territory that became Indiana, Illinois, Michigan, Wisconsin, and Ohio, with interstate framing in [States Neighboring States](/rankings/geography/states-neighboring-states)."

