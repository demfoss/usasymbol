faq:
  - question: "What is the official state firearm of Indiana?"
    answer: "Indiana's official state firearm is the Grouseland Rifle — a handcrafted flintlock long rifle made by John Small in the early 1800s in Vincennes, Indiana Territory. It was designated by Senate Enrolled Act 209, signed by Governor Mitch Daniels in 2012."

  - question: "Where is the Indiana state firearm kept?"
    answer: "The Grouseland Rifle is on permanent display at the Grouseland Mansion, located at 3 W. Scott Street in Vincennes, Indiana. Grouseland was the home of William Henry Harrison, Indiana's first territorial governor and the 9th President of the United States. It is managed by the Daughters of the American Revolution and is open to visitors."

  - question: "Who made the Grouseland Rifle?"
    answer: "The Grouseland Rifle was crafted by John Small, a gunsmith who worked in Vincennes, Indiana Territory in the early 1800s. Small was also the first sheriff of Knox County and the designer of the Indiana Territorial Seal — making him one of the most historically significant figures in Indiana's earliest years as an organized territory."

  - question: "Why is Indiana's state firearm different from other state firearms?"
    answer: "Indiana is the only state in the United States whose official state firearm is a specific surviving artifact rather than a model, brand, or type of weapon. While Arizona designated the Colt Single Action Army (a model produced by the millions), Indiana designated one specific rifle made by one specific craftsman, currently housed at one specific address. It cannot be purchased, reproduced, or replaced."

  - question: "What is the Grouseland Mansion and why is it connected to the rifle?"
    answer: "Grouseland is the 1804 Federal-style mansion built by William Henry Harrison in Vincennes, Indiana — the territorial capital at the time. Harrison was Indiana's first territorial governor and later the 9th President. The rifle's connection to Grouseland reflects the tight-knit nature of early Vincennes society: John Small, the gunsmith-sheriff who designed the territorial seal, moved in the same community as the territorial governor. The rifle is named for the mansion where it has been preserved."

  - question: "Is the Grouseland Rifle a Kentucky Long Rifle?"
    answer: "Yes, in the design tradition sense. The Grouseland Rifle belongs to the American long rifle tradition — sometimes called the Kentucky rifle or Pennsylvania rifle — which was developed by German immigrant gunsmiths in Pennsylvania and carried westward to Kentucky and Indiana. Kentucky and Pennsylvania have also designated long rifles as their state firearms, but their designations refer to a type of rifle. Indiana's designation refers specifically to this one rifle made by John Small."

  - question: "How many rifles made by John Small still exist?"
    answer: "Fewer than six rifles attributed to John Small are known to survive. The low survival rate reflects the realities of frontier material culture: working firearms were used until they were no longer serviceable, and organic materials like wooden stocks deteriorate over centuries without careful preservation. The Grouseland Rifle is the most historically documented of the surviving Small rifles."

  - question: "Who sponsored the Indiana state firearm bill?"
    answer: "Senate Enrolled Act 209 was introduced by Indiana State Senator John Waterman in 2012. Governor Mitch Daniels signed the bill into law, making Indiana the third state to designate an official state firearm (after Utah and Arizona in 2011)."

  - question: "What type of action does the Grouseland Rifle use?"
    answer: "The Grouseland Rifle uses a flintlock ignition system — the dominant firearm technology of the American frontier in the late 1700s and early 1800s. In a flintlock, a spring-loaded flint strikes a steel plate to generate sparks that ignite a priming charge, which then fires the main powder charge through a rifled barrel. The flintlock was gradually replaced by the percussion cap in the 1830s-1840s."

