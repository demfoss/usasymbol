    answer: "Indiana's state stone is Salem limestone, a fine-grained sedimentary building stone adopted by the Indiana General Assembly in 1971."
  - question: When did Indiana adopt Salem limestone as its state stone?
    answer: "The Indiana General Assembly designated limestone the official state stone in 1971."
  - question: Why did Indiana choose Salem limestone?
    answer: "Quarries around Bedford and Bloomington supplied roughly 80 percent of the country's building stone by 1920, and Indiana limestone was used in landmarks like the Empire State Building and the Pentagon."
  - question: Where can you find Salem limestone in Indiana?
    answer: "The Salem Limestone belt runs through Lawrence and Monroe counties in south-central Indiana, centered on Bedford, long known as the Limestone Capital of the World."

