seo_title: "Indiana State Stone | Salem Limestone"
seo_description: "Indiana's state stone is Salem limestone, adopted in 1971. Quarried around Bedford, it built the Empire State Building and the Pentagon."
hero_image: /images/rocks/indiana/indiana-state-stone-hero.webp
hero_image_alt: "A block of buff-colored, fine-grained Indiana limestone."
hero_image_caption: "Salem limestone, Indiana's official state stone, is quarried around Bedford and Bloomington in the state's limestone belt."
intro_text: "Indiana's state stone is Salem limestone, adopted in 1971 to recognize the fine-grained building stone quarried around Bedford that has supplied landmarks across the country for more than a century. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Indiana State Stone
    paragraphs:
      - "Salem limestone is Indiana's official state stone, designated by the Indiana General Assembly in 1971. It is a sedimentary rock quarried from a formation running through south-central Indiana, prized for its even texture and workability."
      - "Indiana was the obvious choice for this symbol. The state's limestone belt supplied a large share of the country's cut building stone for much of the 20th century."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Salem Limestone?"
    paragraphs:
      - "Salem limestone is a buff to gray sedimentary rock made almost entirely of calcium carbonate, formed from the shells and skeletal fragments of marine organisms that settled in a shallow tropical sea covering the region roughly 330 million years ago. Its grain is fine and remarkably even, which lets it be cut, carved, and polished cleanly in any direction."
      - "That consistency is what separates it from many other limestones, which often carry rough fossil chunks or uneven layering. Builders and sculptors have relied on that evenness for detailed carving on facades, columns, and monuments."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Indiana Chose Salem Limestone as Its State Stone"
    paragraphs:
      - "Indiana's limestone industry centers on Lawrence and Monroe counties, around Bedford and Bloomington, an area long called the Limestone Capital of the World. By 1920, Indiana limestone accounted for roughly 80 percent of all building stone used in the United States."
      - "The stone left a visible mark far beyond Indiana. Indiana limestone was used in the Empire State Building, the Pentagon, the Biltmore Estate, the National Cathedral, and about 35 of the 50 state capitol buildings, a reach that made it a natural fit for statewide recognition."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Salem Limestone Became Indiana's State Stone"
    paragraphs:
      - "The Indiana General Assembly designated limestone, specifically the Salem Limestone formation, the official state stone in 1971, formally recognizing an industry that had already defined the Bedford-Bloomington region for generations."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Salem Limestone Is Found in Indiana"
    paragraphs:
      - "The Salem Limestone belt runs through Lawrence and Monroe counties in south-central Indiana, with Bedford at its center. Quarries and mills in and around Bedford have supplied dimension stone for buildings nationwide since the 1800s."
    sites:
      - name: Bedford
        city: Bedford
