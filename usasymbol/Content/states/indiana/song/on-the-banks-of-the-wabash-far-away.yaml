sections:
  - id: overview
    icon: fa-solid fa-music
    title: Indiana State Song
    paragraphs:
      - "\"On the Banks of the Wabash, Far Away\" is Indiana's official state song, adopted in 1913. Songwriter Paul Dresser wrote and composed it in 1897, and its enormous popularity as sheet music made it an easy choice for the legislature just 16 years later."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"On the Banks of the Wabash, Far Away\" Explained"
    paragraphs:
      - "The song is a nostalgic ballad sung by someone far from home, remembering candlelight evenings on the porch and a lost love along the Wabash River. It follows the sentimental parlor-song style popular in the 1890s, meant to be played on piano in family living rooms."
      - "Paul Dresser, an Indiana-born songwriter, wrote and composed it in 1897. His brother, novelist Theodore Dreiser, later said he suggested the Wabash River as a subject and helped shape the opening lines, though the extent of his contribution has never been settled."
      - "The song became the best-selling piece of sheet music of its era and helped make Dresser one of the most successful Tin Pan Alley composers of the 1890s."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "On the Banks of the Wabash, Far Away" Represents Indiana
    paragraphs:
      - "Indiana adopted the song because it names the Wabash River, the waterway that runs the length of the state and gives Indiana its nickname as the Hoosier state along the Wabash. Few states had a song this specific to a single defining landmark."
      - "The song's massive national popularity in the 1890s also gave Indiana a rare chance to claim a genuine hit as its own, one written by a native son rather than borrowed from elsewhere."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"On the Banks of the Wabash, Far Away\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "On the Banks of the Wabash, Far Away" Became Indiana's State Song
    paragraphs:
      - "The Indiana General Assembly adopted \"On the Banks of the Wabash, Far Away\" as the official state song on March 14, 1913, only 16 years after Dresser wrote it. That short gap makes Indiana's song one of the earliest state songs formally adopted in the country, well ahead of most other states."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"On the Banks of the Wabash, Far Away\" Facts"
    facts:
      - "Indiana adopted the song as its official state song on March 14, 1913."
      - "Paul Dresser wrote and composed the song in 1897."
      - "It became the best-selling piece of sheet music of its time."
      - "Dresser's brother, novelist Theodore Dreiser, claimed to have helped write the opening verse."
      - "Indiana's adoption came just 16 years after the song was written, unusually fast for a state song."

