faq:
  - question: "What are the official colors of Indiana?"
    answer: "The traditional state colors of Indiana are Blue and Gold, derived from the Indiana state flag adopted on May 31, 1917. The deep blue field and golden torch-and-stars design have been the widely recognized palette of the Hoosier State for over a century."
  - question: "What is the HEX code for Indiana Blue?"
    answer: "The standard HEX code for Indiana Blue is #002D62, corresponding to Pantone PMS 281, representing the deep navy field of the Indiana state flag."
  - question: "What is the HEX code for Indiana Gold?"
    answer: "The standard HEX code for Indiana Gold is #CFA244, corresponding to Pantone PMS 7554, representing the gold torch, stars, and lettering on the Indiana state flag."
  - question: "Who designed the Indiana state flag?"
    answer: "The Indiana state flag was designed by Paul Hadley of Mooresville, Indiana, who won the 1916-1917 DAR design competition. Hadley reportedly won first, second, third, and all honorable mention prizes in the over-200-entry contest with multiple submissions."
  - question: "What does the torch on the Indiana flag represent?"
    answer: "The torch on the Indiana state flag represents liberty and enlightenment, with its radiating rays symbolizing their far-reaching influence. The torch was chosen as Indiana's central symbol because the DAR design committee wanted an emblem that expressed the state's high civic character rather than a geographic feature."
  - question: "Why was the Indiana flag called a 'banner' for 38 years?"
    answer: "Because the Indiana General Assembly had legally designated the US flag as Indiana's official state flag in 1901, Paul Hadley's 1917 design had to be called a 'state banner' to avoid legal conflict. The distinction was resolved in 1955 when the legislature formally designated Hadley's design as the official state flag."
  - question: "What do the 19 stars on the Indiana flag represent?"
    answer: "The 19 stars on the Indiana state flag represent Indiana's admission to the Union as the 19th state on December 11, 1816. The 13 outer stars represent the original thirteen colonies, the 5 inner stars represent the states admitted before Indiana, and the large star above the torch represents Indiana itself."

