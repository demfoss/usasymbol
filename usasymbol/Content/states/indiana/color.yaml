sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Indiana has not passed a separate state-colors law. Blue and gold are the traditional colors through the Indiana state flag — or, more precisely, the Indiana state banner — adopted on May 31, 1917, and formalized as the official state flag in 1955 under Indiana Code IC 1-2-2-1. The flag's deep blue field and gold torch-and-stars design established a clear two-color public imagery that has represented Indiana in official and cultural contexts for over a century. Indiana Code IC 1-2-2-1 specifies flag elements in 'gold or buff,' though gold has been the standard in official state practice since the flag's initial display and in narratives around [Indiana's nickname, the Hoosier State](/states/indiana/nickname/the-hoosier-state)."
      - "The path to the 1917 blue-and-gold banner involved an unusual quirk of Indiana legislative history. In 1901, the Indiana General Assembly had officially designated the flag of the United States as Indiana's official state flag — a decision reflecting a wave of post-Spanish-American War patriotic sentiment. This meant that when Paul Hadley's design was adopted in 1917, it could not legally be called a 'state flag' without conflicting with the 1901 act; it was therefore designated a 'state banner' instead. The banner distinction persisted until 1955, when the Indiana General Assembly amended the law to formally designate Hadley's design as the official state flag of Indiana. Throughout this 38-year period as a 'banner,' the blue and gold design was widely displayed and treated as Indiana's de facto state flag, firmly establishing the color tradition."
    subsections:
      - subtitle: "Paul Hadley and the 1916-1917 Design Contest"
        text: "The contest that produced Indiana's blue-and-gold flag originated with two Indiana Daughters of the American Revolution delegates — Mary Stewart Carey of Indianapolis and Mrs. William Gaar of Richmond — who attended the 1914 DAR Continental Congress in Washington, D.C. and noticed that Indiana was among the few states without a flag displayed in the Memorial Continental Hall. Returning to Indiana, they organized a state banner competition to coincide with Indiana's centennial of statehood in 1916. The contest offered a $100 prize and ultimately received over 200 submissions. Paul Hadley of Mooresville — born in Indianapolis in 1880 and trained at Emmerich Manual Training School under Hoosier Group artist Otto Stark and later at the Pennsylvania Museum and School of Industrial Art — submitted the winning design. His entry featured a gold torch on a blue field with a ring of thirteen stars for the original colonies, five inner stars for the states admitted before Indiana, and a large star above the torch for Indiana itself."
      - subtitle: "Indiana Code IC 1-2-2-1 and the 1955 Formalization"
        text: "The Indiana state flag's current legal standing is defined by Indiana Code IC 1-2-2-1, which specifies that 'the field of the flag shall be blue with nineteen (19) stars and a flaming torch in gold or buff.' The 1955 General Assembly act that transformed the banner into an official flag also standardized the flag's dimensions and confirmed the blue-and-gold palette as the definitive color tradition for Indiana's primary state symbol. Governor James P. Goodrich's famous indifference to the original 1917 banner — he allowed it to become law without his signature, reportedly considering it a minor matter — stands in contrast to the banner's eventual status as one of the most beloved and consistently displayed state flags in the United States, with related civic language on [Indiana's official motto page](/states/indiana/motto/the-crossroads-of-america)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Indiana's blue and gold carry a clarity of symbolic meaning that reflects the straightforward visual logic of Paul Hadley's 1917 design. The deep blue field functions as the night or twilight sky against which the torch of liberty burns golden, creating an immediate visual metaphor for enlightenment emerging from darkness — a theme consistent with Indiana's identity as a state that sent Abraham Lincoln to Washington and supplied critical Union forces in the Civil War. Gold, applied to the torch, its radiating rays, and the nineteen stars, represents both the physical light of the flame and the broader concepts of liberty, knowledge, and the forward-looking civic purpose of a state at the center of America's agricultural and industrial heartland."
    subsections:
      - subtitle: "Blue in Indiana History"
        text: "The deep navy blue of Indiana's flag was chosen by Paul Hadley to provide maximum visual contrast with the gold elements — a practical design decision that also carries symbolic weight. Blue in the heraldic tradition represents loyalty, perseverance, and vigilance, values that resonate strongly in Indiana's Civil War history. Indiana contributed approximately 208,000 soldiers to the Union Army — more per capita than most Northern states — and the state suffered significant losses at engagements including Shiloh, Chickamauga, and the Siege of Atlanta. The deep blue of the flag's field has been associated with this military heritage and civic steadfastness by Indiana historians and educators for over a century. Indiana's blue also connects to the state's Great Lakes geography, as Lake Michigan forms Indiana's northern border and its port at Gary has historically been a major industrial and commercial gateway."
      - subtitle: "Gold in Indiana History"
        text: "Gold on the Indiana flag carries its primary meaning through the torch — the flag's central and defining visual element. The torch of liberty has been a symbol of democratic enlightenment since the classical era, and Hadley's choice of a flaming torch as Indiana's central emblem was explicitly intended to represent the state's tradition of civic engagement and its role in American democratic life. The Indiana DAR committee, which oversaw the competition, noted that Indiana had 'no mountain peak, no great lake or river exclusively its own' and that the banner's symbolism must therefore express 'high character' rather than geographic features — making the golden torch of liberty a deliberate statement about Indiana's civic identity rather than its physical landscape. Gold also evokes Indiana's agricultural abundance: the state is consistently among the top national producers of corn, soybeans, and hogs, and the golden tones of a ripening Indiana cornfield are among the state's most iconic visual associations."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Blue and gold dominate the Indiana state flag, governed by Indiana Code IC 1-2-2-1, which flies at the Indiana State Capitol in Indianapolis and all state government buildings. The Indiana state seal, adopted in 1801 and revised most recently in 1963, features a different palette — including a woodsman, a bison, the sun, and a mountainous landscape rendered in multiple colors — but the state flag's blue-and-gold palette remains the dominant public imagery for Indiana in official state communications, athletic contexts, and public branding. Blue and gold appear consistently across Indiana state agency branding, Indiana Department of Tourism materials, Indiana State Police insignia, and official state publications. Indiana University uses crimson and cream as its official colors, while Purdue University uses old gold and black — both universities drawing on gold tones that echo the state flag's palette. The Indiana Pacers NBA franchise uses blue and gold in its team colors, further reinforcing the blue-and-gold identity as the dominant color tradition associated with Indiana statewide and cataloged in [U.S. state colors](/symbols/colors)."

      - "For geographic and political context around Indiana's identity development, readers often pair color history with [states and capital cities reference data](/rankings/geography/states-capital-cities)."

