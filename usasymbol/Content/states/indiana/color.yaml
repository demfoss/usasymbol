seo_title: "Indiana State Colors | Blue Gold"
seo_description: "Indiana state colors are Blue and Gold, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Indiana are **Blue** and **Gold**, derived from [the Indiana state flag](/states/indiana/flag/indiana-state-flag) adopted in 1917. No separate state-colors law exists, but blue and gold are widely recognized as the colors of the Hoosier State through the state flag, state branding, and civic culture. The color cards below list practical HEX, RGB, CMYK, and Pantone references for Indiana blue and gold."

official_colors: "Blue and Gold"
official_since: "Traditional (based on 1917 state flag / state banner)"
primary_use: "State Flag, state government branding, Indiana state agency insignia, Indiana University and Purdue University athletic traditions"
known_for: "The deep blue field and golden torch of liberty surrounded by nineteen gold stars — designed by Paul Hadley in 1917 to commemorate Indiana's centennial of statehood; the torch represents liberty and enlightenment, with its rays symbolizing their far-reaching influence across the 19th state"

