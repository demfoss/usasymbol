sections:
- id: changing-slogans
  icon: fa-solid fa-road
  title: Why Indiana Plates Changed Slogans So Often
  paragraphs:
  - 'Indiana plate history is unusually restless. Some states settled into a single plate slogan for decades; Indiana used the plate as a rotating public message board. Safety campaigns, anniversaries, tourism pushes, state identity phrases, and motto language all appeared at different points.'
  - "\"Hoosier State\" is still Indiana's most recognizable nickname, but it is not the whole plate story. The state also printed \"The Crossroads of America,\" the official motto adopted in 1937, and later offered \"In God We Trust\" as a no-cost optional plate."
  - 'That variety fits Indiana better than a single slogan would. The state has a strong demonym in "Hoosier," a transportation identity in "Crossroads," and a plate history full of commemorations and campaigns.'

- id: crossroads-of-america
  icon: fa-solid fa-map-signs
  title: The Crossroads of America on Indiana Plates
  paragraphs:
  - "\"The Crossroads of America\" is Indiana's official state motto, adopted in 1937. As a plate slogan, it points to Indiana's road and rail geography: the state sits where major east-west and north-south routes meet."
  - 'The phrase says something different from "Hoosier State." It identifies Indiana by location and movement rather than by residents. That made it a natural fit for license plates, which are themselves highway objects.'
  - 'For the broader context of the phrase, see the [Indiana state motto](/states/indiana/motto) page.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Indiana License Plate Slogans by Era
  paragraphs:
  - Indiana's plate slogans have moved through safety campaigns, commemorations, tourism branding, nickname language, motto language, and optional faith-based wording.
  versions:
  - name: Drive Safely
    years: '1956'
    image: /images/license-plates/indiana/1956-drive-safely.webp
    description: Indiana began a run of safety-conscious plate slogans in 1956. "DRIVE SAFELY" was one of the main messages, along with "SAFETY PAYS."
  - name: Lincoln Year
    years: '1959'
    image: /images/license-plates/indiana/1959-lincoln-year.webp
    description: '"LINCOLN YEAR" marked the sesquicentennial of Abraham Lincoln''s birth. Lincoln lived in Indiana from age seven to age twenty-one, giving the state a real claim to the commemoration.'
  - name: Safety Pays
    years: 1960s
    image: /images/license-plates/indiana/1960-safety-pays.webp
    description: '"SAFETY PAYS" continued Indiana''s safety-message period, which ran through much of the late 1950s and early 1960s except for special commemorative years.'
  - name: Statehood Sesquicentennial
    years: '1966'
    image: /images/license-plates/indiana/1966-statehood-sesquicentennial.webp
    description: Indiana's 1966 plate marked the state's 150th year of statehood with "150th Year."
  - name: Heritage State
    years: '1976'
    image: /images/license-plates/indiana/1976-heritage-state.webp
    description: Indiana's U.S. Bicentennial plate began a series of non-repeating slogans and commemorative themes, including "Heritage State."
  - name: George Rogers Clark
    years: 1979–1980
    image: /images/license-plates/indiana/1980-george-rogers-clark.webp
    description: The George Rogers Clark plate marked the bicentennial of the Clark expedition, one of several commemorative Indiana plate themes after 1976.
  - name: Hoosier State
    years: 1980s
    image: /images/license-plates/indiana/indiana-hoosier-state-plate.webp
    description: "\"HOOSIER STATE\" appeared as a traditional nickname slogan, but it was a single chapter in Indiana's rotating slogan history rather than a continuous long-term plate phrase."
  - name: Wander
    years: 1980s
    image: /images/license-plates/indiana/1986-wander-plate.webp
    description: '"WANDER" came from a tourism campaign and showed Indiana using the license plate as travel promotion.'
  - name: The Crossroads of America
    years: 2000s
    image: /images/license-plates/indiana/indiana-crossroads-plate.webp
    description: Indiana used its official motto, "The Crossroads of America," on a standard plate design, linking the plate to the state's highway and logistics identity.
  - name: In God We Trust
    years: 2008–present
    image: /images/license-plates/indiana/indiana-in-god-we-trust-plate.webp
    description: Indiana's no-cost optional "In God We Trust" plate first appeared in 2008 and was followed by a redesigned version in 2013.

- id: why-no-single-slogan
  icon: fa-solid fa-rotate
  title: Why Indiana Does Not Fit One Slogan
  paragraphs:
  - 'Indiana has several legitimate identities competing for plate space. "Hoosier" identifies the people. "Crossroads" describes the map. "Lincoln Year" and the statehood plates mark anniversaries. "Wander" sells tourism. "In God We Trust" reflects an optional plate choice rather than a nickname.'
  - "That mix makes Indiana different from states such as Illinois, which kept \"Land of Lincoln\" continuously, or Idaho, which held onto \"Famous Potatoes.\" Indiana's pattern is not slogan stability; it is slogan rotation."
  - 'For context on how other states handled plate identity, see [U.S. license plate slogans by state](/license-plates/slogans).'

