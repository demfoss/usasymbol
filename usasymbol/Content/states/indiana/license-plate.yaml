faq:
- question: What is Indiana's license plate slogan?
  answer: Indiana has used several plate slogans rather than one continuous phrase. Important examples include "Drive Safely," "Safety Pays," "Lincoln Year," "Hoosier State," "Wander," "The Crossroads of America," and "In God We Trust."
- question: Did Indiana use "Hoosier State" on license plates?
  answer: Yes. "Hoosier State" appeared on Indiana plates, but it was not a continuous long-running standard slogan. License Plate Room identifies it as the first and only use of the traditional "Hoosier State" slogan in Indiana's rotating slogan sequence after 1976.
- question: What does "The Crossroads of America" mean on Indiana plates?
  answer: "\"The Crossroads of America\" is Indiana's official state motto, adopted in 1937. On plates, it refers to Indiana's position at the junction of major highway and rail routes."
- question: What was "Lincoln Year" on Indiana plates?
  answer: "\"Lincoln Year\" appeared in 1959 for the sesquicentennial of Abraham Lincoln's birth. Lincoln lived in Indiana from age seven to age twenty-one."
- question: When did Indiana introduce the "In God We Trust" plate?
  answer: Indiana's no-cost optional "In God We Trust" plate first appeared in 2008. A redesigned version followed in 2013.

