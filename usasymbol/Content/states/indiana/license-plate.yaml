seo_title: "Indiana License Plate Slogan | In God We Trust"
seo_description: "In God We Trust is Indiana's current standard license plate slogan, offered as a no-extra-charge plate since 2007."
hero_image: /images/license-plates/indiana/indiana-in-god-we-trust-plate.webp
hero_image_alt: Indiana In God We Trust license plate
hero_image_caption: Indiana's no-cost "In God We Trust" plate began in 2008 and received a new design in 2013.
intro_text: '**Indiana license plate slogans** have changed often. Unlike states with one long-running phrase, Indiana used safety messages in the 1950s and 1960s, commemorative slogans for Lincoln and statehood anniversaries, tourism phrases, the traditional "Hoosier State" nickname, the official motto "The Crossroads of America," and the no-cost optional "In God We Trust" plate that began in 2008.'
quick_answer: 'Indiana does not have one uninterrupted standard plate slogan. Its plate history includes "Drive Safely," "Safety Pays," "Lincoln Year," "Hoosier State," "Wander," "The Crossroads of America," and "In God We Trust." The traditional "Hoosier State" slogan appears in this history, but it was not a continuous statewide plate slogan.'
