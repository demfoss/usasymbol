seo_title: "Indiana State Nickname | The Hoosier State"
seo_description: "Indiana is known as The Hoosier State, its official state nickname. Learn what Hoosier State means, why Indiana uses it, and what other nicknames the state has had."

intro_text: "Indiana’s nickname is <i>the Hoosier State</i>. Residents of Indiana are commonly called Hoosiers, a term that has been used for nearly two centuries. The word appeared in print as early as 1826, but its exact origin remains unknown. Several theories attempt to explain how the name began, though none has been definitively proven. By the 1830s, Hoosier had become closely associated with Indiana and continues to appear in state government materials, tourism references, and sports team names."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Hoosier State'"
    paragraphs:
      - "What is Indiana nickname? The Hoosier State is the commonly accepted answer. But what does Hoosier actually mean? That question still puzzles historians today. The word first showed up in the Indianapolis Journal in 1826. A year later, poet John Finley published a poem called 'The Hoosier's Nest.' His writing made the term popular across Indiana and neighboring states."
      - "Several theories try to explain where Hoosier came from. One idea suggests frontier settlers said 'Who's here?' when visitors knocked on cabin doors, and over time this phrase turned into Hoosier. Another theory connects the word to Samuel Hoosier, a contractor who preferred hiring Indiana workers. A third explanation links it to an old English word 'hoozer' meaning something large. None of these theories can be proven with documents from that time period. Across the Ohio River, Kentucky avoided all such debate — [the Bluegrass State nickname](/states/kentucky/nickname/the-bluegrass-state) takes its meaning directly from a visible natural feature that settlers could see and name on sight."
      - "How did Indiana get its nickname? People in Indiana simply started using Hoosier during the 1830s. The name spread quickly. By 1840, newspapers and books mentioned Hoosiers regularly when discussing Indiana residents. Nobody complained about the term. Indiana residents liked having a unique identity that made them different from their neighbors. The [history of the Buckeye State](/states/ohio/nickname/the-buckeye-state) next door followed a different path, with Ohio's identity rooted in a natural feature rather than an unexplained folk term. This makes the Hoosier State one of the more fascinating puzzles across the [all 50 state nicknames explained](/symbols/nicknames). While never formally adopted by the Indiana General Assembly, the nickname appears throughout state government materials and is recognized by the U.S. Government Publishing Office as the official demonym for Indiana residents."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Crossroads of America"
        text: "Indiana made Crossroads of America an official state motto in 1937. This name refers to Indiana's location in the middle of the country. Major highways cross through the state connecting different regions. Interstate 65 runs north to south. Interstate 70 goes east to west. These roads meet near Indianapolis, creating a natural crossroads. The National Road, built during the early 1800s as one of America's first major highways, passed directly through Indiana. This central position helped businesses grow because goods moved through the state constantly, and today's license plates still display this motto; full background is on [Indiana's official motto page](/states/indiana/motto/the-crossroads-of-america)."
      - subtitle: "The Hospitality State"
        text: "Some promotional materials from the early 1900s called Indiana the Hospitality State. This nickname came from the idea that Indiana residents treated travelers and newcomers kindly. States competed for tourists and new settlers during this time, so business leaders wanted visitors to remember Indiana as friendly. Indiana's central location meant many people passed through on trips to other places. The nickname never became official. Most people outside Indiana probably never heard it. Historical records show the name existed briefly but faded away when other nicknames proved more popular, while official visual identity consolidated around the [Indiana state flag](/states/indiana/flag/indiana-state-flag)."
      - subtitle: "Mother of Vice Presidents"
        text: "Indiana earned this unusual nickname because five men from the state became vice president. Schuyler Colfax served from 1869 to 1873. Thomas Hendricks held office from March to November 1885 before dying. Charles Fairbanks served from 1905 to 1909. Thomas Marshall was vice president from 1913 to 1921. Dan Quayle served from 1989 to 1993. No other state has produced five vice presidents. The nickname shows Indiana's influence in national politics during the 1800s and 1900s, and Indiana's position is often compared in [states and capital cities reference data](/rankings/geography/states-capital-cities), though people rarely use this name in everyday conversation."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The word Hoosier first appeared in print in 1826 in the Indianapolis Journal newspaper."
      - "John Finley wrote 'The Hoosier's Nest' in 1827, helping spread the term beyond Indiana's borders."
      - "Indiana University's sports teams call themselves the Hoosiers as their official nickname."
      - "Five vice presidents came from Indiana: Colfax, Hendricks, Fairbanks, Marshall, and Quayle."
      - "The state motto is The Crossroads of America, adopted in 1937 and printed on every license plate."
      - "Indiana became the 19th state on December 11, 1816, joining the Union over 200 years ago."
      - "Unlike other state symbols codified in Indiana Code Title 1 Article 2, the Hoosier State nickname has never been formally designated by legislation."

faq:
  - question: "What is Indiana’s nickname?"
    answer: "Indiana’s nickname is the Hoosier State. The name comes from the term Hoosier, which residents have used since the early 19th century."

  - question: "Why is Indiana called the Hoosier State?"
    answer: "Indiana is called the Hoosier State because residents began referring to themselves as Hoosiers during the 1820s. The term spread quickly and became closely associated with the state."

  - question: "Is the Hoosier State an official nickname?"
    answer: "Yes, the Hoosier State is Indiana’s official nickname. While it was not adopted by a specific statute, it has long been recognized and used by the state."

  - question: "What does the Indiana nickname Hoosier mean?"
    answer: "The meaning of Hoosier is unclear. Historians have proposed several theories, including frontier greetings, surnames of early settlers, and old English words, but none have been proven."

  - question: "When did Indiana start using the Hoosier State nickname?"
    answer: "Indiana began using the Hoosier nickname in the 1820s. By the 1830s, the term appeared regularly in newspapers and everyday speech."

  - question: "What is Indiana’s nickname and motto?"
    answer: "Indiana’s nickname is the Hoosier State, and its official motto is The Crossroads of America, adopted in 1937."

