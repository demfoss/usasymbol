sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Nevada State Gemstones
    paragraphs:
      - "Nevada named two separate official gemstones in 1987: the Virgin Valley black fire opal, designated the state precious gemstone, and Nevada turquoise, designated the state semiprecious gemstone. Nevada is one of only a few states to formally split its gem symbol into these two categories."
      - "Both stones come from Nevada's own deposits rather than imported gem material, giving the state a matched pair of symbols tied directly to its mining geology."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Are Black Fire Opal and Nevada Turquoise?"
    paragraphs:
      - "Virgin Valley black fire opal has a dark, often black body color that sets off flashes of red, orange, green, and blue as the stone is turned in the light, the play of color that gives opal its name. Unlike most opal, which has a white or clear body color, Virgin Valley's opal formed with a dark background that makes its color flashes stand out sharply."
      - "Nevada turquoise ranges from sky blue to blue-green and is often threaded with a brown or black matrix, the remnants of the host rock it grew within. It is a phosphate mineral that forms near the Earth's surface, where copper-rich groundwater reacts slowly with aluminum-bearing rock."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Nevada Chose Black Fire Opal and Turquoise as Its State Gemstones"
    paragraphs:
      - "Virgin Valley, in remote northern Humboldt County, is one of the only places in North America that produces black fire opal in real quantity, and its opal has been dug from claims there since the early 1900s. That rarity and a century of small-scale mining made it a natural choice for Nevada's precious gemstone."
      - "Nevada turquoise, by contrast, has been mined at multiple sites across the state's central mining districts and has long gone into jewelry, including work by Nevada's Native American silversmiths. Naming it the semiprecious gemstone recognized a material more widely collected and worn across the state than the rarer black fire opal."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Black Fire Opal and Turquoise Became Nevada's State Gemstones"
    paragraphs:
      - "The Nevada Legislature designated the Virgin Valley black fire opal the state precious gemstone and Nevada turquoise the state semiprecious gemstone in 1987, adopting the two as separate categories rather than choosing a single state gem."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Black Fire Opal and Turquoise Are Found in Nevada"
    paragraphs:
      - "Virgin Valley, in the extreme northwest corner of Humboldt County near the Oregon border, is the source of Nevada's black fire opal, mined at claims such as the Royal Peacock and Rainbow Ridge. Nevada turquoise comes from a number of mining districts across the central part of the state, including the Royston district near Tonopah in Nye County."
    sites:
