faq:
  - question: What are Nevada's state gemstones?
    answer: "Nevada has two official state gemstones: the Virgin Valley black fire opal, the state precious gemstone, and Nevada turquoise, the state semiprecious gemstone."
  - question: When did Nevada adopt black fire opal and turquoise as its state gemstones?
    answer: "The Nevada Legislature designated both stones in 1987, naming the Virgin Valley black fire opal the state precious gemstone and Nevada turquoise the state semiprecious gemstone."
  - question: Why did Nevada choose black fire opal and turquoise?
    answer: "Virgin Valley is one of the only places in North America that produces black fire opal in quantity. Nevada turquoise mining and jewelry work span generations across the state's central mining districts."
  - question: Where can you find black fire opal and turquoise in Nevada?
    answer: "Virgin Valley in Humboldt County is the source of Nevada's black fire opal. Nevada turquoise comes from several districts, including Royston near Tonopah in Nye County."

