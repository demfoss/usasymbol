  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Black Fire Opal and Turquoise Facts"
    facts:
      - "The Virgin Valley black fire opal and Nevada turquoise were both adopted as Nevada's state gemstones in 1987, as separate precious and semiprecious designations."
      - "Virgin Valley in Humboldt County is one of the only places in North America that produces black fire opal in commercial quantity."
      - "Some Virgin Valley opal formed by replacing buried wood with silica, occasionally preserving the wood's original grain pattern in solid opal."
      - "Nevada turquoise has been mined from multiple districts across the state, including Royston in Nye County, for over a century."

