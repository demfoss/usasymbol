name_meaning:
  heading: What Does Nevada Mean?
  paragraphs:
  - Nevada reached statehood in 1864 as the 36th state. The name comes from Spanish and means snowy or snow-covered, a reference connected with the Sierra Nevada.
  - The snowy name can surprise people who picture only desert. Nevada's symbols keep both ideas in view through mountain bluebird, sagebrush, pinyon pine, desert bighorn sheep, and a Silver State identity rooted in mining.
  - Nevada's postal abbreviation is NV, and residents are Nevadans. The Silver State is the main nickname, while Battle Born remains strongly associated with the state flag.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: From Spanish, meaning snowy or snow-covered.
    - label: Statehood
      text: Nevada became the 36th state in 1864.
    - label: Motto
      text: All for Our Country is Nevada's state motto.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Nevada, a Great Basin state known for desert valleys, mountain ranges, mining, and rapid modern growth.
    - label: Flag phrase
      text: Battle Born appears on the state flag and refers to Nevada's Civil War-era statehood.
    - label: People
      text: People from Nevada are called Nevadans.
  - heading: Nicknames and Short Forms
    items:
    - label: The Silver State
      text: Main nickname tied to Nevada's mining history.
    - label: Battle Born State
      text: Popular identity connected with the flag and Civil War-era admission.
    - label: Abbreviation
      text: NV; older short form Nev.
editorial:
  heading: What Nevada's Symbols Say About the State
  paragraphs:
  - Nevada's [Silver State nickname](/states/nevada/nickname) and [state motto](/states/nevada/motto) keep mining and Civil War-era identity close to the surface. The [flag](/states/nevada/flag) adds Battle Born, which may be more famous than the motto itself.
  - The [sagebrush](/states/nevada/flower) and [single-leaf pinyon pine](/states/nevada/tree) are a better guide to Nevada's actual landscape than neon shorthand. They point to Great Basin valleys, mountain slopes, pine nuts, and dry-country adaptation.
  - The [desert bighorn sheep](/states/nevada/mammal/desert-bighorn-sheep) brings recovery and desert wildlife into the official set, while [Picon Punch](/states/nevada/beverage/picon-punch) gives Nevada a foodways symbol with Basque-American roots.
faq:
- question: What is Nevada's most famous state symbol?
  answer: The [Silver State nickname](/states/nevada/nickname) is Nevada's clearest shorthand, carrying the state's mining history in just two words.
- question: What is Nevada's state bird?
  answer: Nevada's state bird is the [mountain bluebird](/states/nevada/bird), adopted in 1967.
- question: What is Nevada's state flower?
  answer: Nevada's state flower is [sagebrush](/states/nevada/flower), adopted in 1959.
- question: What does Battle Born mean on Nevada's flag?
  answer: Battle Born on the [Nevada state flag](/states/nevada/flag) refers to Nevada becoming a state during the Civil War era.
- question: How many official state symbols does Nevada have?
  answer: The Nevada collection here includes the flag, mountain bluebird, sagebrush, pinyon pine, motto, nickname, colors, desert bighorn sheep, and Picon Punch.
