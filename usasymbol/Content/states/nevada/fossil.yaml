- id: facts
  icon: fa-solid fa-lightbulb
  title: Ichthyosaur Facts
  facts:
  - "Nevada designated Shonisaurus popularis as its state fossil in 1977, just one year after the species was formally described."
  - "Shonisaurus popularis reached up to 50 feet in length, making it one of the largest animals of the Triassic period."
  - "Berlin-Ichthyosaur State Park preserves 37 Shonisaurus specimens in place — one of the densest concentrations of large marine reptile fossils anywhere in the world."
  - "The species name popularis means common in Latin, reflecting how frequently the fossils were found at the Berlin site."
  - "Adult Shonisaurus had a toothless beak, unlike most ichthyosaurs, suggesting it fed on soft-bodied prey such as squid."

