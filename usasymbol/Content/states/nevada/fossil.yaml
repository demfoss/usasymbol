faq:
- question: What is Nevada's state fossil?
  answer: "Nevada's state fossil is the ichthyosaur Shonisaurus popularis, a massive marine reptile up to 50 feet long that lived during the Late Triassic period, about 225 million years ago."
- question: When did Nevada adopt its state fossil?
  answer: "Nevada designated Shonisaurus popularis as its state fossil in 1977 and amended the designation in 1988."
- question: What did the ichthyosaur look like?
  answer: "Shonisaurus popularis was up to 50 feet long with four broad paddle flippers, a tall dorsal fin, and a long toothless beak. Its body was shaped like a large dolphin but belonged to the reptile lineage."
- question: Where are ichthyosaur fossils found in Nevada?
  answer: "Fossils are found at Berlin-Ichthyosaur State Park in Nye County, about 23 miles east of Gabbs. A shelter covers the quarry where 37 specimens are preserved in the original rock."
- question: When did the ichthyosaur live?
  answer: "Shonisaurus popularis lived during the Late Triassic period, about 225 million years ago, when a deep ocean covered central Nevada. It went extinct about 200 million years ago at the end of the Triassic."
- question: Who discovered Nevada's state fossil?
  answer: "University of California, Berkeley paleontologist Charles Camp led excavations at the Berlin site in the 1950s and formally described the species as Shonisaurus popularis in 1976."

