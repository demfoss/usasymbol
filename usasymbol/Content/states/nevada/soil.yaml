- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Orovada Soil
  paragraphs:
  - "Orovada soil is primarily rangeland. Big sagebrush is the dominant plant across uncultivated areas, along with shadscale, winterfat, bottlebrush squirreltail, and Nevada bluegrass. Cattle and sheep ranching have operated on this landscape since the 1860s, when the Great Basin's sagebrush flats became the Nevada ranching industry's foundation."
  - "Where valley water rights allow irrigation — in the Humboldt River valley, Paradise Valley, and Ruby Valley — farmers grow alfalfa hay as the main irrigated crop. Onions and garlic are grown in limited areas of Elko and Humboldt counties where water and soils allow."
  - "The durinode layer in Orovada soil can restrict root depth and reduce productivity for crops, making irrigation management more careful than in deeper agricultural soils. For rangeland purposes, the soil's low organic content and open texture are well suited to drought-adapted desert plants."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Orovada Soil Facts
  facts:
  - "The Orovada series is named for Orovada, Nevada, a ranching community in northern Humboldt County near the Oregon border — the high desert country where the soil was first studied."
  - "Orovada is classified as a Durinodic Xeric Haplocambid — an aridisol with silica-cemented nodules (durinodes), a Mediterranean-type dry summer moisture pattern, and a cambic subsoil horizon."
  - "Durinodes form when silica dissolved from volcanic rocks in the mountains is carried downslope by water and re-precipitates in the subsoil as the water evaporates. This cementation process is unique to arid and semi-arid regions."
  - "Nevada is the driest state in the country, receiving an average of about 9 inches of precipitation per year. Orovada soil reflects this: its pale color, thin surface, and silica chemistry are all products of a climate where water evaporates faster than it soaks in."
  - "The Orovada series extends beyond Nevada into southern Oregon, where the Great Basin's alluvial fan landscape continues north of the state border."

