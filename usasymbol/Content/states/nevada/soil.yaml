faq:
- question: What is Nevada's state soil?
  answer: "Nevada's state soil is the Orovada series, a pale desert soil formed on alluvial fans across the Great Basin. It covers the sagebrush rangeland of northern and central Nevada and is defined by silica-cemented nodules called durinodes in its subsoil."
- question: Why is it called Orovada soil?
  answer: "The Orovada series is named for Orovada, Nevada, a small ranching community in northern Humboldt County near the Oregon border. USDA soil scientists name soil series after nearby towns, creeks, or geographic features where the soil was first described."
- question: What color is Orovada soil?
  answer: "Orovada soil is pale throughout. The surface is pale brown with very little dark organic matter. Below it, the horizons are light yellowish brown and then very pale brown. The pale color comes from the dry climate, which limits plant growth and organic matter buildup."
- question: Where is Orovada soil found in Nevada?
  answer: "Orovada soil is found on alluvial fans and fan piedmonts across northern and central Nevada. It is most common in Humboldt, Pershing, Elko, Lander, and Churchill counties, where Basin and Range mountains create long aprons of fan deposits along every mountain front."
- question: What grows in Orovada soil?
  answer: "Big sagebrush is the main plant, along with shadscale, winterfat, and native grasses like Nevada bluegrass and bottlebrush squirreltail. Where irrigation is available, alfalfa is the primary crop. The soil also supports cattle and sheep ranching across millions of acres."
- question: What is a durinode?
  answer: "A durinode is a small, hard nodule cemented by silica in the subsoil. Silica dissolved from volcanic rocks in Nevada's mountains is carried by water into the alluvial fan and hardens as the water evaporates. Durinodes are common in Great Basin soils and are one of Orovada's most distinctive features."
- question: How does Orovada soil differ from soils in farming states?
  answer: "Orovada is a pale desert soil with little organic matter and a hard silica layer in the subsoil. Farming state soils like Nebraska's Holdrege or Iowa's Tama are dark mollisols — built by centuries of tall-grass prairie and rich in organic matter. Nevada's dry climate produces a very different kind of soil."

