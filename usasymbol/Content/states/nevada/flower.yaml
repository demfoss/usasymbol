type: State Flower
state: Nevada
name: Sagebrush
scientific_name: Artemisia tridentata
adopted_year: 1959
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-11"
seo_title: "Nevada State Flower | Sagebrush"
seo_description: "The Sagebrush became Nevada's state flower in 1959. This aromatic desert shrub covers vast areas of Nevada's high desert landscape."

intro_text: "Nevada chose the Sagebrush as its state flower in 1959. This aromatic gray-green shrub dominates Nevada's high desert landscape. Small yellow flower clusters bloom on sagebrush plants across millions of acres throughout the state. This profile appears in the [list of U.S. state flowers](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Nevada"
    paragraphs:
      - "Nevada recognizes the Sagebrush as its state flower. Tiny yellow flowers grow in dense clusters along branch tips. Each individual flower measures only an eighth of an inch across. The blooms appear inconspicuous compared to traditional garden flowers. Hundreds of flowers combine to form showy displays in late summer. A distinctive sage-like aroma fills the air around blooming plants."
      - "Sagebrush blooms from August through October across Nevada. Peak flowering occurs in September throughout most desert regions. The shrubs reach heights of 2 to 7 feet depending on growing conditions. Multiple woody stems branch from the base. Small wedge-shaped leaves with three-lobed tips cover the branches. Silver-gray foliage remains on plants year-round."
      - "Native sagebrush covers vast expanses of Nevada's high desert. The plants thrive in dry alkaline soil. Cold winters and hot summers create ideal conditions. Sagebrush tolerates extreme temperature fluctuations. Annual rainfall of 7 to 12 inches suits this drought-adapted shrub. Over 70 percent of Nevada's land area supports sagebrush ecosystems."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Sagebrush"
    paragraphs:
      - "Known as Sagebrush, this plant's scientific designation is Artemisia tridentata. The species belongs to the Asteraceae family. This enormous family includes sunflowers, daisies, and thousands of other flowering species found worldwide."
      - "The genus name Artemisia honors the Greek goddess Artemis. The species name tridentata means three-toothed in Latin. It describes the three-lobed leaf tips characteristic of this species. Big sagebrush serves as another common name. Great Basin sagebrush appears in some botanical texts."
      - "Sagebrush is not related to culinary sage used in cooking. True sage belongs to the mint family. The common name sagebrush came from the aromatic leaves that smell similar to garden sage. Several sagebrush subspecies exist across western North America. Nevada's designation includes all native sagebrush varieties."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Nevada Chose the Sagebrush"
    paragraphs:
      - "Nevada established the Sagebrush as its official state flower in 1959. The state legislature voted for this designation after Nevada achieved statehood in 1864. Nevada operated without an official flower for 95 years. Several attempts to select a state flower failed during the early 1900s, before identity around [The Silver State nickname](/states/nevada/nickname/the-silver-state) was fully standardized."
      - "Nevada residents debated various flower choices for decades. Some people suggested desert wildflowers like Indian paintbrush. Others advocated for cultivated garden flowers. Sagebrush supporters argued that no plant better represented Nevada. The shrub covered more Nevada land than any other plant. Its distinctive aroma and appearance symbolized the state."
      - "Critics complained that sagebrush lacked showy flowers. Supporters countered that Nevada should honor its natural landscape honestly. The silver-gray shrub defined the Nevada desert. Ranchers and miners associated sagebrush with Nevada territory. The legislature finally passed the designation on March 21, 1959. Nevada became one of the last western states to adopt an official flower, and the plant later appeared on the [Nevada state flag](/states/nevada/flag/nevada-state-flag)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Nevada State Flower Facts"
    facts:
      - "Sagebrush covers over 70 percent of Nevada's land area, making it the most dominant plant across the state's landscape"
      - "The plant's deep taproot can extend 10 feet or more into the ground, allowing it to survive extreme drought conditions"
      - "Nevada adopted the Sagebrush on March 21, 1959, after operating without an official state flower for 95 years following statehood"
      - "Sagebrush leaves contain aromatic oils that give the plant its distinctive smell and help reduce water loss in the desert environment"
      - "Greater sage-grouse and other wildlife species depend on sagebrush ecosystems for food and shelter across Nevada"
      - "Native Americans used sagebrush for medicinal purposes, basketry, and ceremonial fires, with the aromatic smoke considered purifying"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Nevada State Flower and Bird"
    paragraphs:
      - "The Mountain Bluebird serves as Nevada's state bird, a small songbird with brilliant blue plumage. Both symbols represent Nevada officially. Nevada adopted the Sagebrush in 1959 and designated the Mountain Bluebird as state bird in 1967; compare with the [Nevada state bird page](/states/nevada/bird/mountain-bluebird)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Cultural Significance"
    paragraphs:
      - "The Sagebrush commonly represents Nevada's desert character and pioneer heritage. The plant has been linked to the Old West and frontier spirit. Its hardy nature frequently represents survival and resilience in harsh conditions while carrying connotations of Nevada's wide open spaces and distinctive high desert landscape across regions shown in [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Nevada's state flower?"
    answer: "Nevada's state flower is the Sagebrush, an aromatic gray-green desert shrub that covers over 70 percent of the state's land area."
  
  - question: "When did Nevada adopt the Sagebrush as its state flower?"
    answer: "Nevada adopted the Sagebrush on March 21, 1959. The state operated without an official flower for 95 years after achieving statehood in 1864."
  
  - question: "Why did Nevada choose the Sagebrush?"
    answer: "Nevada chose the Sagebrush because it covers more Nevada land than any other plant and represents the state's natural desert landscape. The shrub's distinctive aroma and appearance symbolized Nevada better than any wildflower or cultivated variety. Ranchers and miners strongly associated sagebrush with Nevada territory."
  
  - question: "Is sagebrush the same as cooking sage?"
    answer: "No, sagebrush is not related to culinary sage used in cooking. True sage belongs to the mint family. The common name sagebrush came from aromatic leaves that smell similar to garden sage."
  
  - question: "When does sagebrush bloom in Nevada?"
    answer: "Sagebrush blooms from August through October in Nevada, with peak flowering occurring in September. The tiny yellow flowers grow in dense clusters along branch tips throughout the desert regions."

