sections:
- id: answer
  icon: fa-solid fa-circle-info
  title: What Is the Official Drink of Nevada?
  paragraphs:
  - Nevada's official state drink is the <strong>Picon Punch</strong>. Gov. Joe Lombardo signed the designation on <strong>June 9, 2025</strong>. The bill turned one of Northern Nevada's oldest community drinking traditions — a Basque-American cocktail served in ranching towns and Reno restaurants for more than a century — into a statewide symbol.
- id: law
  icon: fa-solid fa-landmark
  title: Nevada's 2025 State Drink Law — and the Attempts That Came Before
  paragraphs:
  - The 2025 designation did not happen on the first try. Multiple earlier efforts to make Picon Punch Nevada's official state drink had failed in the legislature, which means the 2025 law represented persistence rather than an easy symbolic vote. Someone had to keep bringing it back.
  - Nevada became one of the very few states to designate a drink tied to a specific immigrant community — not a regional crop, not a commercial brand. The [Nevada state symbols](/states/nevada) list now includes a cocktail that most residents south of Reno have likely never ordered.
- id: nevada-fit
  icon: fa-solid fa-people-group
  title: Basque Immigration and the Northern Nevada Roots of Picon Punch
  paragraphs:
  - The drink's origin is uncertain — the most plausible evidence points to late-1800s Basque-American boardinghouses in California, not Nevada. But origin is not the same as identity. Picon Punch traveled with Basque immigrants who came to the American West as sheepherders, farmers, and laborers, and it put down roots in Northern Nevada in ways it never did elsewhere.
  - The Basque community settled in a ranching corridor running through Elko, Winnemucca, and the Reno area. Boardinghouses in those towns became social anchors — places where Basque workers could eat communally, speak their language, and drink. Picon Punch was the drink at the bar. Over generations, it became inseparable from the institutions that served it.
  - The legislature was not selecting a drink with statewide penetration. Picon Punch is far more established in Elko than in Las Vegas, far more at home in a Winnemucca restaurant than on the Strip. What it carries in Northern Nevada is depth — a community history that predates every cocktail menu in Las Vegas.
- id: drink
  icon: fa-solid fa-martini-glass-citrus
  title: 'Picon Punch Recipe: What Goes Into Nevada''s State Drink'
  paragraphs:
  - 'The standard Picon Punch is built in a tall glass: <strong>Amer Picon</strong> or a substitute bitter orange liqueur, a splash of <strong>grenadine</strong>, topped with <strong>club soda</strong>, finished with a <strong>brandy float</strong> and a <strong>lemon twist</strong>. The grenadine softens the bitter base; the brandy float sits on top and hits first. It is not a complex cocktail, but the balance between bitter, sweet, and spirit is specific enough that variations read as different drinks.'
  - The original French Amer Picon was not widely available in the United States, which forced Basque bartenders to substitute other bitter orange liqueurs for decades. That changed in April 2025, when Ferino Distillery in Reno began producing its own Amer version after acquiring the Torani recipe — giving Nevada-made Picon Punch a locally produced base for the first time.
  - Northern Nevada versions are generally poured stronger than anything a visitor might encounter at a tourist-facing bar. The brandy float is not decorative.
- id: places
  icon: fa-solid fa-map-pin
  title: The Northern Nevada Basque Restaurants That Kept Picon Punch Alive
  paragraphs:
  - '<strong>Louis'' Basque Corner</strong> in Reno has been one of the best-known Basque restaurants in the state for decades — a family-run institution that has served Picon Punch alongside communal Basque meals long enough to outlast multiple cocktail trends. <strong>The Martin Hotel</strong> in Winnemucca and <strong>The Star Hotel</strong> in Elko occupy the same position in their communities: long-running operations in ranching towns where Basque history and Picon Punch tradition have overlapped for generations.'
  - <strong>J.T. Basque Bar & Dining Room</strong> in Gardnerville marks the southern end of this corridor. Together, these four establishments trace the geography of Basque Nevada — a strip of ranching and farming communities in the northern half of the state where the drink never required official recognition to stay relevant.
  - 'Las Vegas has none of this history. The 2025 law made Picon Punch a symbol for the entire state, but the culture behind it belongs to the north: to the towns where Basque surnames still appear on ranch gates and restaurant menus, and where ordering a Picon Punch requires no explanation.'
