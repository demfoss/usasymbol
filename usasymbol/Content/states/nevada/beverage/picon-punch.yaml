faq:
- question: What is Nevada's official state drink?
  answer: Nevada's official state drink is the Picon Punch, designated in 2025.
- question: When did Nevada adopt Picon Punch as its state drink?
  answer: Gov. Joe Lombardo signed the bill on June 9, 2025.
- question: Why did Nevada choose Picon Punch as its state drink?
  answer: Picon Punch has been tied to Northern Nevada's Basque immigrant communities for over a century, served in Basque boardinghouses and restaurants in Elko, Winnemucca, Reno, and Gardnerville. The legislature chose it to recognize that specific cultural tradition.
- question: Did Nevada invent Picon Punch?
  answer: No. The drink's exact origin is uncertain, but the most plausible evidence points to late-1800s Basque-American boardinghouses in California, not Nevada. It became closely identified with Nevada through Basque immigrant communities who settled in the state's Northern ranching regions.
- question: What is in a Picon Punch?
  answer: A standard Picon Punch contains Amer Picon or a bitter orange substitute, grenadine, club soda, a brandy float, and a lemon twist.
- question: Is Picon Punch popular across all of Nevada?
  answer: No. Picon Punch is far more established in Northern Nevada — in Reno, Elko, Winnemucca, and Gardnerville — than in Las Vegas. The drink reflects Basque ranching communities in the northern half of the state, not the state as a whole.
- question: Was Amer Picon available in the United States?
  answer: The original French Amer Picon was not widely available in the U.S. In April 2025, Ferino Distillery in Reno began producing an Amer version after acquiring the Torani recipe, giving Nevada a locally made base for the drink.
- question: Where is Picon Punch associated with Nevada culture?
  answer: The most notable Nevada venues include Louis' Basque Corner in Reno, The Martin Hotel in Winnemucca, The Star Hotel in Elko, and J.T. Basque Bar & Dining Room in Gardnerville.
