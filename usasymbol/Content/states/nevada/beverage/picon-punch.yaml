seo_title: 'Nevada Official State Drink: Picon Punch — Basque-American Cocktail'
seo_description: Nevada's official state drink is the Picon Punch, signed into law June 9, 2025. Learn why this Basque-American cocktail became Nevada's state symbol, its standard recipe, and the Northern Nevada restaurants where it has been poured for over a century.
intro_text: Nevada's official state drink is the <strong>Picon Punch</strong>, signed into law by Gov. Joe Lombardo on <strong>June 9, 2025</strong>. The designation elevated a cocktail that most Nevada visitors have never encountered — because Picon Punch belongs to Northern Nevada, to its Basque restaurants and old boardinghouses, not to the Strip.
