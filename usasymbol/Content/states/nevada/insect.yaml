sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Nevada?
  paragraphs:
  - "The vivid dancer damselfly, Argia vivida, is Nevada's official state insect. The Nevada Legislature designated it in 2009."
  - "It lives near streams and spring-fed waters, including desert oases across Nevada."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Vivid Dancer Damselfly
  paragraphs:
  - "The vivid dancer is a slender damselfly. Mature males have a bright blue body marked with black bands along the abdomen."
  - "Females are usually duller, often blue-gray or brown, with similar dark markings."
  - "Like other dancer damselflies, it has a fluttering, uneven flight pattern and rests with its wings folded along its body."

- id: history
  icon: fa-solid fa-landmark
  title: How Nevada Chose the Vivid Dancer Damselfly
  paragraphs:
  - "The Nevada Legislature named the vivid dancer damselfly the official state insect in 2009."
  - "The species was recognized for living near Nevada's streams and desert spring habitats."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Vivid Dancer Damselfly in Nevada
  paragraphs:
  - "The vivid dancer is found near streams, springs, and other flowing water sources across Nevada, including desert oases."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Vivid Dancer Damselfly Facts
  facts:
  - "Adopted in 2009 by the Nevada Legislature."
  - "Scientific name: Argia vivida."
  - "Mature males have a bright blue body with black-banded markings."
  - "Lives near streams and spring-fed water, including desert oases."
  - "Flies with a fluttering, uneven pattern typical of dancer damselflies."




