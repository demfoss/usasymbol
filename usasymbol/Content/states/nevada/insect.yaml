faq:
- question: What is Nevada's state insect?
  answer: "Nevada's state insect is the vivid dancer damselfly, adopted by the Nevada Legislature in 2009."
- question: When did Nevada adopt the vivid dancer damselfly?
  answer: "Nevada adopted the vivid dancer damselfly as its official state insect in 2009."
- question: What does Nevada's state insect look like?
  answer: "Mature males are bright blue with black-banded markings on the abdomen. Females are usually duller, blue-gray or brown, with similar markings."
- question: Is the vivid dancer a dragonfly or a damselfly?
  answer: "The vivid dancer is a damselfly, a close relative of dragonflies. Damselflies are generally slimmer and fold their wings along their body at rest."
- question: Where is the vivid dancer damselfly found in Nevada?
  answer: "It is found near streams, springs, and other flowing water sources across Nevada, including desert oases."

