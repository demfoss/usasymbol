sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Nevada State Metal
    paragraphs:
      - "Silver is Nevada's official state metal, designated by the Nevada Legislature in 1977. The metal is inseparable from Nevada's identity. The state's nickname, the Silver State, comes directly from the 19th-century silver mining boom that built its earliest towns."
      - "Nevada chose silver not because it is unique to the state, but because mining it shaped Nevada's economy, population, and even its path to statehood."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Silver?"
    paragraphs:
      - "Silver is a soft, dense metal with a bright, silvery white luster that gradually tarnishes to gray or black when exposed to air. It is one of the most reflective and electrically conductive metals, which is why it is used in mirrors, electronics, and jewelry as well as coinage."
      - "In Nevada, silver formed in hydrothermal veins deep underground, often alongside gold, where hot mineral-rich fluids deposited the metal in cracks and fractures in the rock. Miners then extracted it by tunneling into the surrounding rock, most famously at the Comstock Lode."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Nevada Chose Silver as Its State Metal"
    paragraphs:
      - "The discovery of the Comstock Lode near Virginia City in 1859 triggered Nevada's first major mining boom, drawing tens of thousands of prospectors and financing much of San Francisco's growth as well as Nevada's own. The boom was large enough that it helped push Nevada toward statehood in 1864, years ahead of many neighboring territories."
      - "Silver mining continued to shape Nevada's economy long after the Comstock's peak, and the nickname the Silver State stuck. Naming silver the state metal in 1977 formalized an identity Nevada had already claimed for over a century."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Silver Became Nevada's State Metal"
    paragraphs:
      - "The Nevada Legislature designated silver the official state metal in 1977, matching a nickname, the Silver State, that Nevada had used since the Comstock Lode era of the 1860s."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Silver Is Found in Nevada"
    paragraphs:
      - "The Comstock Lode, under Mount Davidson in Virginia City, was the site of Nevada's first and most famous silver strike, discovered in 1859. Virginia City remains a historic mining town today, with old mine workings still visible around the district."
    sites:
      - name: Comstock Lode
        city: Virginia City
        lat: 39.3097
        lng: -119.6499
        note: "Site of Nevada's 1859 silver discovery"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Silver Facts"
    facts:
      - "Adopted as Nevada's state metal in 1977."
      - "The Comstock Lode, discovered near Virginia City in 1859, was the first major silver strike in the United States."
      - "Nevada's nickname, the Silver State, predates the official state metal designation by more than a century."
      - "During its peak years from 1860 to 1880, the Comstock district produced more precious metal than the rest of the United States combined."

