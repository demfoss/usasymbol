faq:
  - question: What is Nevada's state mineral?
    answer: "Nevada's state metal is silver, adopted by the Nevada Legislature in 1977."
  - question: When did Nevada adopt silver as its state metal?
    answer: "The Nevada Legislature designated silver the official state metal in 1977."
  - question: Why did Nevada choose silver?
    answer: "Silver mining at the Comstock Lode built Nevada's earliest towns and helped drive the territory to statehood in 1864, and it later gave Nevada its nickname, the Silver State."
  - question: Where can you find silver in Nevada?
    answer: "The Comstock Lode near Virginia City, discovered in 1859, was the site of Nevada's first and most famous silver strike."

