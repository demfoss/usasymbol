    answer: "Nevada's state rock is sandstone, a sedimentary rock adopted by the Nevada Legislature in 1987."
  - question: When did Nevada adopt sandstone as its state rock?
    answer: "The Nevada Legislature designated sandstone the official state rock in 1987."
  - question: Why did Nevada choose sandstone?
    answer: "Fifth-grade students at a Las Vegas elementary school campaigned for sandstone, pointing to the red rock formations at Valley of Fire State Park as a reason lawmakers agreed with in 1987."
  - question: Where can you find sandstone in Nevada?
    answer: "Valley of Fire State Park, northeast of Las Vegas, has Nevada's best-known sandstone formations, along with Red Rock Canyon National Conservation Area to the west."

