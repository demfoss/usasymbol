sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Nevada State Rock
    paragraphs:
      - "Sandstone is Nevada's official state rock, designated by the Nevada Legislature in 1987. It is a sedimentary rock made of cemented sand grains, and in Nevada it forms the red, orange, and white banded formations found across the state's southern desert."
      - "Nevada is known for dramatic sandstone landscapes, and the designation gave a name students already associated with some of the state's most visited scenery."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Sandstone?"
    paragraphs:
      - "Sandstone is a sedimentary rock formed from grains of sand, mostly quartz, that were compacted and cemented together over long spans of time. Nevada's sandstone often shows bands of red, orange, pink, and white, colors produced by iron oxide staining and by variations in how the sand was originally deposited."
      - "Much of Nevada's most visible sandstone, including the Aztec Sandstone at Valley of Fire, began as wind-blown desert sand dunes roughly 150 million years ago, later buried, compacted, and lifted back to the surface by geologic uplift and erosion."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Nevada Chose Sandstone as Its State Rock"
    paragraphs:
      - "The push for a state rock came from a Las Vegas classroom: fifth graders at Gene Ward Elementary School researched Nevada's geology and lobbied lawmakers to name sandstone the official state rock, pointing to the red formations at Valley of Fire State Park as a reason. The Legislature agreed in 1987."
      - "Sandstone was a fitting choice beyond the students' campaign, since its red rock formations at Valley of Fire and Red Rock Canyon are among the state's best-known natural landmarks and draw visitors from across the country."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Sandstone Became Nevada's State Rock"
    paragraphs:
      - "A class of fifth graders at Gene Ward Elementary School in Las Vegas researched and proposed sandstone as Nevada's state rock, and the Nevada Legislature adopted the designation in 1987."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Sandstone Is Found in Nevada"
    paragraphs:
      - "Valley of Fire State Park, in the Mojave Desert northeast of Las Vegas, is Nevada's best-known sandstone landscape, named for the fiery red glow its Aztec Sandstone formations take on at sunrise and sunset. Similar sandstone formations are also visible at Red Rock Canyon National Conservation Area, west of Las Vegas."
    sites:
      - name: Valley of Fire State Park
        city: Overton
        lat: 36.4269
        lng: -114.5261
        note: "Nevada's namesake red Aztec Sandstone formations"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Sandstone Facts"
    facts:
      - "Adopted as Nevada's state rock in 1987."
      - "The designation followed a campaign by fifth-grade students at Gene Ward Elementary School in Las Vegas."
      - "Valley of Fire State Park takes its name from the fiery red color its sandstone formations show at sunrise and sunset."
      - "Nevada's red sandstone formations, including those at Valley of Fire, began as desert sand dunes roughly 150 million years ago."

