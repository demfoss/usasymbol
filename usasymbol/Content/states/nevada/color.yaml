  - name: "Silver"
    hex: "#A8A9AD"
    rgb: "168, 169, 173"
    cmyk: "3, 2, 0, 32"
    pantone: "PMS 877"
    symbolism: "Represents the silver ore that transformed Nevada from an unsettled territory into a rapidly growing mining powerhouse following the discovery of the Comstock Lode in 1859; the Comstock Lode, discovered near Virginia City in the western Nevada mountains, was one of the richest silver deposits ever found in the United States, producing more than 400 million dollars in silver and gold over several decades and directly financing the Union cause during the Civil War; silver is simultaneously Nevada's official state color (NRS 235.025) and Nevada's official state metal (NRS 235.090), making it the most formally recognized mineral in Nevada state law; on the state flag, silver appears as the five-pointed star in the canton, representing Nevada's natural silver resources and its status as The Silver State"
  - name: "Blue"
    hex: "#0033AB"
    rgb: "0, 51, 171"
    cmyk: "100, 70, 0, 33"
    pantone: "PMS 286"
    symbolism: "Represents the cobalt blue of the Nevada state flag, specified as Pantone PMS 286 in Nevada's official flag specifications under NRS 235.020, which describes the flag field as solid cobalt blue; blue also evokes Lake Tahoe, the large alpine lake straddling the Nevada-California border whose intense cobalt blue surface — caused by the notable clarity and depth of its water — has made it one of the most visually recognizable natural features in Nevada; the mountain bluebird (Sialia currucoides), Nevada's official state bird designated under NRS 235.060, adds a further natural dimension to the blue identity; blue has appeared as Nevada's dominant institutional color since the state's flag was redesigned in 1926 by Reno museum curator Louis Schellback III"

sections:
  - id: "official-designation"
    title: "Official Designation and Legislative History"
    style: "default"
    paragraphs:
      - "Nevada designated silver and blue as the official state colors in 1983 under Nevada Revised Statutes Chapter 235, Section 235.025. The statute states simply: 'The colors silver and blue are hereby designated as the official state colors of the State of Nevada.' Nevada thus joined a relatively small group of states that have formally codified color identities through legislative statute, giving legal standing to a color pairing that had long been associated with the Silver State through its mining history and flag design; see the [Nevada state flag page](/states/nevada/flag/nevada-state-flag)."
      - "The 1983 designation formalized a color association that predated the state itself. Silver had been the defining economic force in Nevada's settlement since the Comstock Lode discovery of 1859, and the state's flag had featured a cobalt blue field since 1929 when the current flag design by Louis Schellback III was adopted. Silver is also designated Nevada's official state metal under NRS 235.090, making it the only Nevada state symbol to hold two simultaneous official designations — both as a state color and as a state metal. The Nevada state flag's specifications under NRS 235.020 provide Pantone values for the flag's colors, designating the field as cobalt blue (Pantone PMS 286) and the central star as silver (white)."
    subsections:
      - subtitle: "NRS 235.025 and the Silver Symbolism"
        text: "Nevada Revised Statutes 235.025 was enacted in 1983 as part of a broader codification of Nevada's state symbols during a period when the Nevada Legislature systematically designated official emblems. The silver designation directly references Nevada's most economically defining natural resource — the Comstock Lode silver discovery of 1859 that drove the creation of Nevada Territory in 1861 and statehood in 1864. Nevada's admission to the Union on October 31, 1864, was accelerated by President Lincoln's need for pro-Union states to ratify the 13th Amendment abolishing slavery, making Nevada 'Battle Born' — admitted during the Civil War — a distinction commemorated in the motto on the state flag. The silver mined from the Comstock financed Union military operations during the war, adding a patriotic dimension to the silver color's historical resonance that extends beyond mere mining economics."
      - subtitle: "The Nevada State Flag and Official Color Values"
        text: "Nevada's state flag, codified under NRS 235.020, provides the most authoritative official color specifications for Nevada's blue. The statute specifies a solid cobalt blue field, and Nevada's official flag specifications designate this as Pantone PMS 286 (HEX #0033AB). The flag was designed in 1926 by Reno museum curator Louis Schellback III as the winning entry in a design contest sponsored by Lieutenant Governor Maurice J. Sullivan. It was adopted in 1929, but with an error — the word 'Nevada' was incorrectly placed between the points of the star instead of below it as Schellback intended. This error went unnoticed in the legislative text for 60 years before being corrected; the corrected version was approved by the governor on June 8, 1991, and implemented in October of the same year."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Nevada's silver and blue are among the most historically grounded state color choices in America. Silver names the mineral that created Nevada — not as an abstract color symbol but as a direct reference to the actual ore that brought tens of thousands of miners, merchants, and settlers to the Nevada mountains in the late 1850s and early 1860s, transforming a virtually uninhabited territory into a state in less than a decade. Blue names the color most immediately associated with Nevada's most dramatic natural feature — the cobalt surface of Lake Tahoe and the cobalt blue sky of Nevada's Great Basin high desert. Together, silver and blue capture the two defining realities of the Silver State: the mineral wealth underground and the clarity of the natural environment above, reinforcing [The Silver State nickname](/states/nevada/nickname/the-silver-state)."
    subsections:
      - subtitle: "Silver: The Metal That Made Nevada"
        text: "The story of silver in Nevada begins with the Comstock Lode, discovered in the spring of 1859 near present-day Virginia City on the eastern slopes of Mount Davidson. The Comstock proved to be one of the richest ore bodies ever found in the United States, ultimately producing more than 400 million dollars in silver and gold between its discovery and the end of major mining operations in the 1880s. The discovery triggered a migration to Nevada comparable in scale to the California Gold Rush of 1849, drawing miners, entrepreneurs, and eventually the newspapers, financiers, and politicians — including a young journalist named Samuel Clemens, later known as Mark Twain, who covered Nevada's Comstock era for the Territorial Enterprise — whose presence transformed the territory into a politically viable candidate for statehood. The silver from the Comstock financed a significant portion of Union military operations during the Civil War, contributing directly to the Union's ability to sustain the war effort and influencing President Lincoln's decision to expedite Nevada's admission to the Union in October 1864."
      - subtitle: "Blue: Lake Tahoe, Sky, and the State Flag"
        text: "Blue's association with Nevada operates on both geographic and institutional levels. Lake Tahoe, the large alpine lake straddling the Nevada-California border at an elevation of 6,225 feet above sea level, has a surface color described by observers since the earliest European exploration as an notable deep cobalt blue. The lake's color results from the combination of its great depth — reaching 1,645 feet at its maximum — and the exceptional clarity of its water, which transmits blue wavelengths while absorbing others. The Tahoe blue has become one of Nevada's most recognized natural images, appearing in tourism materials, landscape photography, and state promotional campaigns. The state flag's cobalt blue field, specified as Pantone PMS 286, mirrors this natural blue and connects Nevada's governmental public imagery to the lake that has defined the state's western boundary since statehood. The mountain bluebird, Nevada's official state bird since 1967, provides a third natural blue reference — the vivid cerulean of the male mountain bluebird's plumage is a color specific to the high-altitude environments of the Great Basin that Nevada occupies; compare with the [Nevada state bird page](/states/nevada/bird/mountain-bluebird)."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and State Identity"
    style: "default"
    paragraphs:
      - "Nevada's silver and blue appear with clear consistency across the state's official symbols. The state flag's cobalt blue field (PMS 286) and silver star represent the two official state colors in direct visual form. The Nevada state seal incorporates silver through the silver-toned elements of the mining machinery depicted in the foreground — the quartz mill and the tunnel penetrating the silver leads of the mountain — and through the metallic quality of the seal's overall engraved composition. Silver is designated Nevada's official state metal under NRS 235.090, creating a cluster of related official designations that makes silver Nevada's most formally recognized natural resource in state law. The University of Nevada, Las Vegas (UNLV) uses scarlet and gray rather than silver and blue, while the University of Nevada, Reno (UNR) uses blue and silver — directly echoing the official state colors and connecting the state's flagship northern university to Nevada's formal color tradition. Nevada's tourism marketing consistently features the cobalt blue of Lake Tahoe alongside silver-toned desert imagery, creating a promotional palette that reinforces the official state colors across Nevada's most visible public-facing communications in a national context shown by [states by population](/rankings/demographics/states-by-population)."

