seo_title: "Nevada State Colors | Silver Blue"
seo_description: "Nevada state colors are Silver and Blue, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of Nevada are **Silver** and **Blue**, formally designated by the Nevada Legislature in 1983 under Nevada Revised Statutes § 235.025. Silver honors Nevada's identity as the Silver State — admitted to the Union in 1864 partly to deliver silver revenue to the Union war effort — and both colors appear on [the Nevada state flag](/states/nevada/flag/nevada-state-flag) and throughout official state branding. The specifications below list HEX, RGB, CMYK, and Pantone values for Nevada color matching."

official_colors: "Silver and Blue"
official_since: "1983 (Nevada Revised Statutes Chapter 235, Section 235.025)"
primary_use: "State government branding, Nevada state flag (cobalt blue field with silver star), state agency communications, Nevada state seal"
known_for: "Nevada is called The Silver State because of the Comstock Lode silver discovery of 1859, one of the richest silver deposits in American history, which drove the explosive population growth that led to Nevada Territory being created in 1861 and Nevada achieving statehood in 1864, the only state admitted to the Union during the Civil War; silver is also Nevada's official state metal under NRS 235.090"

