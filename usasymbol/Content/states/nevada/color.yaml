faq:
  - question: "What are the official colors of Nevada?"
    answer: "The official state colors of Nevada are Silver and Blue, formally designated in 1983 under Nevada Revised Statutes Chapter 235, Section 235.025. Silver represents the state's silver mining heritage and The Silver State nickname; blue represents the cobalt blue of the state flag and Lake Tahoe."
  - question: "What is the HEX code for Nevada Blue?"
    answer: "The official HEX code for Nevada Blue is #0033AB, corresponding to Pantone PMS 286, specified as the cobalt blue field of the Nevada state flag under NRS 235.020."
  - question: "What is the HEX code for Nevada Silver?"
    answer: "The closest standard HEX code for Nevada Silver is #A8A9AD, corresponding to Pantone PMS 877 (metallic silver), representing the silver state color designated under NRS 235.025. On the state flag, silver appears as a white star (HEX #FFFFFF)."
  - question: "When were Nevada's state colors officially adopted?"
    answer: "Nevada's state colors were officially designated in 1983 under Nevada Revised Statutes 235.025."
  - question: "Why is Nevada called the Silver State?"
    answer: "Nevada is called the Silver State because of the Comstock Lode, one of the richest silver deposits in American history, discovered near Virginia City in 1859. The silver wealth triggered Nevada's rapid settlement, territorial status in 1861, and statehood in 1864. Silver is also Nevada's official state metal under NRS 235.090."
  - question: "What does the Nevada flag's cobalt blue represent?"
    answer: "The cobalt blue field of the Nevada state flag (PMS 286, HEX #0033AB) is the flag's most visually dominant element and represents Nevada Blue, one of the state's two official colors. Blue is associated with Lake Tahoe's notable deep blue surface and the Nevada state bird, the mountain bluebird."

