sections:
  - id: overview
    icon: fa-solid fa-music
    title: Nevada State Song
    paragraphs:
      - "\"Home Means Nevada\" is Nevada's official state song, adopted in 1933. Bertha Rafetto, a Reno composer and civic leader, wrote both the words and the music herself, a rare case of a state song coming entirely from one person's hand."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Home Means Nevada\" Explained"
    paragraphs:
      - "The song describes the desert mountains, sagebrush, and open spaces of Nevada as a personal home rather than a general state portrait. It reads as a simple, affectionate parlor song, built for a solo or group voice rather than an orchestral arrangement."
      - "Bertha Rafetto was a Reno-based composer, poet, and women's club leader. In the summer of 1932, the Nevada Native Daughters asked her to write a Nevada-themed song for their annual picnic at Bowers Mansion, and she completed the words and melody in a single overnight sitting, finishing around four in the morning."
      - "She performed the song that same afternoon at the picnic. Former Nevada Governor Roswell K. Colcord heard it and reportedly told her it was the prettiest Nevada song he had ever heard and should become the official state song."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Home Means Nevada" Represents Nevada
    paragraphs:
      - "Nevada adopted the song because it came from a Nevadan writing about her own home, not a commissioned or contest entry. Rafetto's description of the desert landscape matched how Nevadans of the era pictured their own state."
      - "The song also carried the backing of a former governor and a list of public endorsements by the time it reached the legislature. That groundswell of local support, arriving during the hardship of the Great Depression, made the choice an easy one for lawmakers in 1933."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Home Means Nevada\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Home Means Nevada" Became Nevada's State Song
    paragraphs:
      - "The Nevada Legislature passed an act on February 6, 1933 designating \"Home Means Nevada\" the official state song, less than a year after Rafetto first wrote it. Rafetto never asked for payment for the song, writing that she wrote it during the Depression when many families were struggling."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Home Means Nevada\" Facts"
    facts:
      - "Nevada adopted \"Home Means Nevada\" as its official state song in 1933."
      - "Bertha Rafetto wrote both the words and the music herself, finishing the song overnight in the summer of 1932."
      - "She first performed the song at a Nevada Native Daughters picnic at Bowers Mansion."
      - "Former Nevada Governor Roswell K. Colcord publicly championed the song for state adoption after hearing it."
      - "Rafetto never accepted payment for writing the song."

