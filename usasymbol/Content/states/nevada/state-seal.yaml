hero_image_caption: The Great Seal of Nevada, adopted in 1866. The design shows a mountain mining scene with a mine tunnel, quartz stamp mill, agricultural tools, a railroad, and 36 stars marking Nevada's admission as the 36th state during the Civil War. The motto on the seal reads All for Our Country.
intro_text: "Nevada's state seal shows the Comstock Lode era in one image: a mine shaft and ore carts, a quartz stamp mill, a plow and wheat sheaf, a railroad, and the motto 'All for Our Country.' Nevada entered the Union on October 31, 1864, as the 36th state, while the Civil War was still being fought. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
