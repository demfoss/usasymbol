timeline:
- year: '1859'
  description: The Comstock Lode is discovered near present-day Virginia City. The massive silver and gold deposit triggers a population rush into the Nevada territory.
- year: '1863'
  description: Nevada's territorial population is large enough to begin statehood proceedings. Congress passes an enabling act allowing Nevada to form a state government.
- year: '1864'
  description: Nevada is admitted to the Union on October 31 as the 36th state, eight days before the presidential election. The state constitution was transmitted to Washington by telegraph, then the longest telegram ever sent.
- year: '1866'
  description: On February 24, the legislature adopts the Great Seal of Nevada and changes the motto from the territorial "Volens et Potens" to "All for Our Country." The design records the mining, agricultural, and transportation industries of the early state.
- year: '1869'
  description: The transcontinental railroad is completed at Promontory Summit, Utah. Nevada, whose seal had already depicted the railroad, becomes a key link in the first continental rail route.

faq:
- question: What does the Nevada state seal show?
  answer: Nevada's state seal shows a mountain mining scene with a tunnel and ore carts, a quartz stamp mill with smoke, a plow and sheaf of wheat in the foreground, a railroad and telegraph poles, 36 stars along the upper border, and the motto "All for Our Country" on the ribbon below.
- question: What does "All for Our Country" mean on the Nevada state seal?
  answer: '"All for Our Country" is the motto on Nevada''s state seal. The legislature adopted it on February 24, 1866, replacing the territorial motto "Volens et Potens." It reflects Nevada''s Union loyalty during the Civil War era and the political context of its 1864 admission.'
- question: When was the Nevada state seal adopted?
  answer: The Great Seal of Nevada was adopted in 1866, two years after Nevada achieved statehood on October 31, 1864.
- question: Why does the Nevada state seal have 36 stars?
  answer: The 36 stars represent the number of states in the Union when Nevada was admitted on October 31, 1864. Nevada was the 36th state, and the stars count Nevada itself in the total.
- question: What does the mine on the Nevada state seal represent?
  answer: The mine tunnel and ore carts represent the Comstock Lode, a massive silver and gold deposit discovered in 1859 near present-day Virginia City. The Comstock Lode was the primary reason Nevada's population grew large enough to justify statehood, and silver mining remained the state's dominant industry through the 1870s.
- question: Why is a railroad on the Nevada state seal?
  answer: The railroad represents Nevada's commercial future and its role in the transcontinental railroad, which was under active construction through Nevada when the seal was designed in 1866. The Central Pacific completed its crossing of Nevada in 1869, connecting the Pacific coast to the East by rail for the first time.

