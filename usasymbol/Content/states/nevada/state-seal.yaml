name: Great Seal of Nevada
adopted_year: 1866
is_official: true
legislation: Nevada Revised Statutes § 235.010
meaning: "Nevada's state seal was built around the industries that made statehood possible: silver mining, agriculture, and the transcontinental railroad under construction. The Comstock Lode discovery in 1859 flooded the territory with population almost overnight. By 1864, the Union government needed Nevada's silver and its electoral votes. The seal records that moment through its mine, quartz mill, railroad, and 36 stars, while the motto 'All for Our Country' reflects the Civil War loyalty politics behind Nevada's rushed admission."
