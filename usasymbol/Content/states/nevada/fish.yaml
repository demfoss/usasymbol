intro_text: Nevada's state fish is the Lahontan cutthroat trout, a large native trout known for the red slash under its jaw, adopted in 1981. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Nevada?
  paragraphs:
  - The Nevada Legislature made the Lahontan cutthroat trout the official state fish in 1981. Its scientific name is Oncorhynchus clarkii henshawi.
  - It is one of the few trout species native to Nevada. It is also the largest inland cutthroat trout in the world.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Lahontan Cutthroat Trout
  paragraphs:
  - The easiest way to spot a cutthroat trout is the bright red slash under its lower jaw. That mark gives the fish its name.
  - Trout that live in streams often have copper or lemon-yellow sides, an olive-copper back, a white belly, and lots of dark spots. Trout that live in lakes are often more silvery.
  - Most adults are 7 to 33 inches long and weigh 1 to 25 pounds. Lake trout grow much bigger than stream trout.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Nevada Legislature named the Lahontan cutthroat trout the official state fish in 1981. State law calls it the official state fish of the State of Nevada.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Nevada Chose the Lahontan Cutthroat Trout
  paragraphs:
  - Official sources name the fish without giving a detailed reason. It is a native Nevada trout, and the federal government lists it as a threatened species.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Lahontan Cutthroat Trout
  paragraphs:
  - This trout first lived in ancient Lake Lahontan, a huge Ice Age lake. Around 7,000 years ago the lake shrank into smaller waters such as Pyramid Lake and Walker Lake.
  - Today Pyramid Lake, north of Reno, is the best-known place to find it. The fish had died out there by the 1940s, but restocking brought it back. Biologists also work to restore it in the Truckee River, which flows into the lake.
  sites:
  - name: Pyramid Lake
    city: Sutcliffe
    lat: 40.05
    lng: -119.55
    note: Home of the world record cutthroat trout
    type: primary
  - name: Truckee River
