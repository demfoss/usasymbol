    note: River that flows into Pyramid Lake
    type: secondary
- id: facts
  icon: fa-solid fa-lightbulb
  title: Lahontan Cutthroat Trout Facts
  facts:
  - Adopted in 1981 by the Nevada Legislature.
  - Scientific name is Oncorhynchus clarkii henshawi.
  - Most adults are 7 to 33 inches long.
  - The world record weighed 41 pounds and was caught in Pyramid Lake in 1925.
  - It is listed as a threatened species.
faq:
- question: What is Nevada's state fish?
  answer: Nevada's state fish is the Lahontan cutthroat trout. It is a native trout with a red slash under its jaw.
- question: When did Nevada adopt the Lahontan cutthroat trout?
  answer: The Nevada Legislature made the Lahontan cutthroat trout the official state fish in 1981.
- question: Why did Nevada choose the Lahontan cutthroat trout?
  answer: Official sources do not give a detailed reason. The fish is native to Nevada and is the largest inland cutthroat trout in the world.
- question: Why is it called a cutthroat trout?
  answer: It has a bright red slash under its lower jaw, which looks like a cut on its throat.
- question: How big can a Lahontan cutthroat trout get?
  answer: Most adults weigh 1 to 25 pounds. The world record fish weighed 41 pounds and came from Pyramid Lake in 1925.
