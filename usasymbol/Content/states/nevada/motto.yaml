seo_title: "Nevada State Motto | All for Our Country"
seo_description: "Nevada's state motto is \"All for Our Country,\" adopted in 1866. It encircles the Great Seal with 36 stars. Battle Born is the state slogan, not the motto."

intro_text: "Nevada's state motto is <strong>All for Our Country</strong>. The Nevada Legislature adopted it on February 24, 1866, replacing the territorial motto of <em>Volens et Potens</em>, a Latin phrase meaning <em>Willing and Able</em>. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

