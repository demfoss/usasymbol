seo_title: "Nevada State Motto | All for Our Country"
seo_description: "Nevada's constitution was transmitted to Washington by telegraph at a cost of $4,303.27 — the most expensive telegram on record at the time. Nevada was admitted with only 40,000 residents (the normal requirement was 60,000) because Lincoln needed electoral votes 8 days before his reelection. The motto replaced a Latin territorial phrase and is commonly confused with 'Battle Born,' which is Nevada's nickname, not its motto."

intro_text: "Nevada's state motto is <strong>All for Our Country</strong>, adopted on February 24, 1866, replacing the territorial Latin phrase <em>Volens et Potens</em> (Willing and Able). Nevada became the 36th state on October 31, 1864 — just eight days before Lincoln's reelection. Lincoln admitted Nevada with only 40,000 residents (far below the standard 60,000 requirement) because he needed the electoral votes and congressional support. Nevada's constitution was transmitted to Washington by telegraph at a cost of $4,303.27 — the most expensive telegram on record at the time. The motto is commonly confused with 'Battle Born,' which is Nevada's nickname, not its motto."

sections:
  - id: "most-expensive-telegram"
    icon: "fa-solid fa-bolt"
    title: "The Most Expensive Telegram on Record"
    paragraphs:
      - "Governor James W. Nye needed to send Nevada's constitution to Washington for approval before the November 8, 1864 election. Previous attempts via overland mail and sea routes had failed to meet the deadline. On October 26, 1864, Nye sent the full text of the Nevada constitution by telegraph. The transmission took more than seven hours. The cost was $4,303.27 — the most expensive single telegram on file at the time."
      - "The response came from Washington on October 31, 1864: Nevada was admitted as the 36th state. Lincoln signed the proclamation the same day. Eight days later, on November 8, Lincoln won reelection. Nevada delivered three electoral votes and its Republican congressmen supported the Union cause in Congress."
      - "Lincoln had admitted Nevada despite the territory having only about 40,000 residents — significantly below the 60,000 required by the Northwest Ordinance. The political calculation was explicit: Lincoln needed electoral votes and congressional support for the 13th Amendment ending slavery. Statehood served those immediate needs. Critics noted the population requirement had been waived for purely political reasons."

  - id: "motto-not-nickname"
    icon: "fa-solid fa-tags"
    title: "Nevada's Most Common Motto Confusion: 'Battle Born' Is the Nickname"
    paragraphs:
      - "Nevada's state motto 'All for Our Country' is regularly confused with 'Battle Born,' which appears on the Nevada state flag. Former state archivist Guy Rocha noted that 'Battle Born is about as old as All for Our Country, and the confusion is probably just as old.'"
      - "Thomas Fitch, who later represented Nevada in Congress, coined 'Battle Born' during the 1864 Constitutional Convention. The term referred to Nevada achieving statehood during the Civil War — 'born in battle.' The phrase appears prominently on the state flag's upper left canton, making it visually more prominent than the actual motto, which appears on the state seal."
      - "The actual motto 'All for Our Country' appears on a yellow band near the bottom of the Great Seal, surrounded by 36 stars. The motto replaced the territorial motto 'Volens et Potens' (Willing and Able) in 1866, after statehood. No historical records document the exact reasoning behind the choice — the legislature kept no proceedings about seal design decisions."

  - id: "civil-war-loyalty"
    icon: "fa-solid fa-flag-usa"
    title: "A Loyalty Statement From a Wartime State"
    paragraphs:
      - "Nevada Territory was created on March 2, 1861, just as Southern states were seceding. The Comstock Lode's 1859 silver discoveries had made the region economically important. Silver from Nevada helped fund the Union war effort — hundreds of millions of dollars in mineral wealth flowed to the federal government during the conflict."
      - "The territorial motto 'Volens et Potens' — 'Willing and Able' — had a neutral, capability-focused tone. The 1866 replacement 'All for Our Country' was direct in its patriotic allegiance. State archivist Jeff Kintop noted that founding fathers had considered other options, including the more overtly political 'The Union Must and Shall Be Preserved.' The final choice was warmer and less confrontational while still expressing unconditional loyalty."
      - "The Constitutional Convention in 1864 had attempted to establish the seal and motto, but those actions had no legal force because they weren't incorporated into the constitution itself. The Second Legislative Session had to formally adopt the seal description in 1866, making the motto's actual adoption date 16 months after statehood."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Nevada State Motto Facts"
    style: "gradient"
    facts:
      - "Nevada's constitution was transmitted to Washington by telegraph for $4,303.27 — the most expensive telegram on record at the time."
      - "Nevada became the 36th state on October 31, 1864 — just 8 days before Lincoln's reelection on November 8."
      - "Nevada had only 40,000 residents at statehood, far below the standard 60,000 requirement."
      - "The motto replaced the territorial Latin phrase 'Volens et Potens' (Willing and Able) on February 24, 1866."
      - "No historical records document why 'All for Our Country' was chosen over competing proposals."
      - "'Battle Born' — Nevada's nickname — is commonly confused with the actual motto 'All for Our Country.'"

faq:
  - question: "What is Nevada's state motto?"
    answer: "Nevada's state motto is 'All for Our Country,' adopted on February 24, 1866. It replaced the territorial Latin motto 'Volens et Potens' (Willing and Able). It appears on a yellow band near the bottom of Nevada's Great Seal, surrounded by 36 stars."

  - question: "Is Nevada's motto 'Battle Born'?"
    answer: "No. 'Battle Born' is Nevada's nickname, not its motto. The confusion is common because 'Battle Born' appears prominently on the state flag. The actual motto 'All for Our Country' appears on the state seal. Former archivist Guy Rocha noted the confusion is 'about as old as' both phrases."

  - question: "When did Nevada adopt its motto?"
    answer: "February 24, 1866, when the Second Legislative Session formally adopted the seal description including the motto. This was 16 months after Nevada became a state on October 31, 1864. The 1864 Constitutional Convention had attempted to establish the seal, but those actions had no legal force."

  - question: "Why did Nevada become a state so quickly?"
    answer: "Lincoln admitted Nevada in 1864 despite its having only 40,000 residents — far below the standard 60,000 requirement. He needed Nevada's electoral votes for his November 1864 reelection and congressional support for the 13th Amendment ending slavery. Nevada's constitution was transmitted to Washington by telegraph at a cost of $4,303.27 — the most expensive single telegram on record at the time."

  - question: "What language is Nevada's motto written in?"
    answer: "English. Nevada replaced its Latin territorial motto 'Volens et Potens' (Willing and Able) with the plain English phrase 'All for Our Country' in 1866, making the allegiance statement more direct and accessible."

  - question: "Where does Nevada's motto appear?"
    answer: "On Nevada's Great Seal, on a yellow band surrounded by 36 stars (Nevada was the 36th state), below scenes showing a quartz mill, miner, and railroad passing through mountain gorges. The seal appears on official documents and government buildings. The motto does not appear on the state flag — 'Battle Born,' the state's nickname, appears there instead."

