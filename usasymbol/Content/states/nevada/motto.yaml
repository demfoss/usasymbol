faq:
  - question: "What is Nevada's state motto?"
    answer: "Nevada's state motto is \"All for Our Country.\" It was adopted February 24, 1866, and encircles the Great Seal of Nevada alongside 36 stars."

  - question: "Is \"Battle Born\" Nevada's state motto?"
    answer: "No. \"Battle Born\" appears on Nevada's state flag and is the official state slogan, adopted in 1937. The official state motto, designated by law and on the seal since 1866, is \"All for Our Country.\""

  - question: "When did Nevada adopt its state motto?"
    answer: "The Nevada Legislature adopted \"All for Our Country\" on February 24, 1866, through Statutes of 1866, Chapter XLI, during the second legislative session after statehood."

  - question: "What was Nevada's motto before \"All for Our Country\"?"
    answer: "Nevada's territorial motto was \"Volens et Potens,\" a Latin phrase meaning \"Willing and Able.\" The Legislature replaced it with \"All for Our Country\" in 1866."

