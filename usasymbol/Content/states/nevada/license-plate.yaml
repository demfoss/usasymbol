faq:
- question: What is Nevada's license plate slogan?
  answer: Nevada's current standard license plate slogan is "Home Means Nevada."
- question: When did Home Means Nevada start on license plates?
  answer: Nevada debuted the Home Means Nevada plate on November 1, 2016. It phased in as older sunset plates were exhausted.
- question: Where does Home Means Nevada come from?
  answer: The phrase comes from Nevada's official state song, written by Bertha Raffetto and adopted in 1933.
- question: What was Nevada's previous plate slogan?
  answer: The previous standard slogan was "The Silver State," used on the bighorn sheep base from 1984 to 2000 and the sunset base from 2001 into 2017.
- question: Did Nevada change its plate slogan in 2024?
  answer: No. Nevada changed serial formats on the Home Means Nevada base in March 2024, but the slogan stayed the same.
- question: What was the 1963 Nevada Centennial plate?
  answer: It was a statehood centennial treatment on the 1963 base, marking 1864-1964. It was not a permanent recurring slogan.

