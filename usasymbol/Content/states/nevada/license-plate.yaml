hero_image_caption: Nevada's current standard plate says "Home Means Nevada," a line from the state song, across a stylized mountain range.
intro_text: "**\"Home Means Nevada\"** is the slogan on Nevada's current standard license plate. The DMV debuted the design on November 1, 2016, and it phased in as older sunset plates were exhausted. Before it, Nevada standard plates used **\"The Silver State\"** from the bighorn sheep base in 1984 through the sunset base that remained in issue into 2017."
quick_answer: "\"Home Means Nevada\" is Nevada's current standard license plate slogan. It debuted on November 1, 2016 and comes from Nevada's official state song. The earlier standard slogan, \"The Silver State,\" appeared on the 1984-2000 bighorn sheep plate and the 2001-2017 sunset plate."
