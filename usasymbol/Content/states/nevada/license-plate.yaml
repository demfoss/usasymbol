    description: The bighorn sheep base introduced "THE SILVER STATE" at the bottom. It began in 1984 and won ALPCA Plate of the Year honors for 1985.
  - name: THE SILVER STATE
    years: 2001-2017
    image: /images/license-plates/nevada/2001-silver-state-sunset.jpg
    description: The sunset base kept "THE SILVER STATE" in white at the bottom. It remained in issue while Home Means Nevada phased in.
  - name: Home Means Nevada
    years: 2016-present
    image: /images/license-plates/nevada/2016-home-means-nevada.png
    description: Nevada's current standard slogan, debuted November 1, 2016. The same slogan continued after the March 2024 serial-format change.

