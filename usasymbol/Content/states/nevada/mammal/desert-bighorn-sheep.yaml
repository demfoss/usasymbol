weight: "Rams (males): 120-200 pounds; Ewes (females): 75-115 pounds; smaller and lighter than Rocky Mountain bighorn subspecies"
coloration: "Tan, light brown, or gray-brown coat; white rump patch; lighter in color than Rocky Mountain bighorn sheep; coat provides camouflage against desert rocks"
distinctive_traits: "Massive curved horns on rams (up to 30 lbs, 3+ feet long); smaller, slightly curved horns on ewes; specialized cloven hooves with rubbery pads for gripping rocks; can balance on 2-inch ledge and leap 20 feet"

habitat: "Rugged, rocky mountain ranges with escape terrain; desert mountains from 2,500-8,500 feet elevation; requires proximity to water sources"
range_in_state: "Southern Nevada mountains including Spring Mountains, Sheep Range, Desert Range, River Mountains; scattered northern populations; reintroduced to Pyramid Lake area 2019"
