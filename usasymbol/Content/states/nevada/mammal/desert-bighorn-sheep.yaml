faq:
  - question: "What is Nevada's state animal?"
    answer: "Nevada's state animal is the desert bighorn sheep (Ovis canadensis nelsoni), designated in 1973 through Assembly Bill 139. The species was chosen because it embodies Nevada's character—tough, rugged, and capable of thriving in extreme desert conditions."

  - question: "When was the desert bighorn sheep designated as Nevada's state animal?"
    answer: "The desert bighorn sheep became Nevada's official state animal in 1973, recognizing the species' representation of Nevada's rugged desert character and ongoing conservation recovery from near-extinction in the 1960s."

  - question: "Why did Nevada choose the desert bighorn sheep as its state animal?"
    answer: "Nevada chose the desert bighorn sheep because it perfectly represents the state's character and environment. As the driest and most mountainous state, Nevada needed a symbol capable of surviving extreme conditions. Desert bighorn sheep climb sheer cliffs, survive weeks without water, and endure temperatures exceeding 120°F—mirroring the resilience required of Nevadans. The species also represents successful grassroots conservation, recovering from 2,000-3,000 sheep in the 1960s to approximately 14,000 today through volunteer efforts."

  - question: "Where can I see desert bighorn sheep in Nevada?"
    answer: "The most reliable location is Hemenway Park in Boulder City, where sheep frequently graze on park lawns, especially mornings from April through November. Valley of Fire State Park offers excellent viewing opportunities as sheep cross roads and climb red rock formations. Other prime locations include Lake Mead National Recreation Area, Red Rock Canyon National Conservation Area, and Desert National Wildlife Refuge. Early morning and late afternoon provide the best viewing times."

  - question: "How many desert bighorn sheep live in Nevada?"
    answer: "Nevada currently has approximately 12,000-14,000 desert bighorn sheep—the largest population in the lower 48 states. This represents a remarkable recovery from a crisis low of only 2,000-3,000 sheep in the 1960s, achieved through water development projects, habitat protection, and disease management."

  - question: "How much do desert bighorn sheep horns weigh?"
    answer: "Desert bighorn ram horns can weigh up to 30 pounds—as much as all the bones in the ram's body combined. These massive, curved horns grow continuously throughout the ram's life and can exceed three feet in length. The horns serve multiple purposes: establishing dominance through head-butting contests, breaking open cacti for moisture, and displaying status. Female horns are much smaller, typically under one pound."

  - question: "Did desert bighorn sheep almost go extinct?"
    answer: "Yes—desert bighorn sheep nearly went extinct in Nevada. From an estimated 30,000+ sheep historically, populations crashed to only 2,000-3,000 by the 1960s due to unregulated hunting, disease transmission from domestic livestock, and competition for water at springs. The species recovered through volunteer-led conservation efforts, particularly water development projects. The Fraternity of the Desert Bighorn, founded in Las Vegas in 1964, built 115 water developments providing 732,000 gallons of storage capacity."

  - question: "What threatens desert bighorn sheep today?"
    answer: "The most serious current threat is bacterial pneumonia transmitted from domestic sheep, which caused outbreaks starting in 2012 with high lamb mortality. Other threats include habitat loss from development, climate change reducing water availability, fragmentation of wildlife corridors preventing genetic mixing between herds, and loss of natural springs. Despite these challenges, Nevada's population remains relatively stable at 12,000-14,000 sheep under active management."

