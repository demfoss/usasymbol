title: "Nevada State Animal | Desert Bighorn Sheep"
scientific_name: "Ovis canadensis nelsoni"
adopted_year: 1973

seo_title: "Nevada State Animal | Desert Bighorn Sheep"
seo_description: "Nevada's state animal is the Desert Bighorn Sheep, adopted in 1973. Learn why this official Nevada symbol was chosen and what it represents."

intro_text: "The Desert Bighorn Sheep is the official Nevada state animal, designated in 1973. This page gives the direct answer for searches like 'nevada state animal', 'nevada state animal', and 'nevada state mammal' while explaining how the symbol fits the state's official animal designations. Massive curved horns weighing up to 30 pounds, ability to survive without water for weeks, climbing sheer rock faces with specialized hooves. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Desert Bighorn Sheep"
official_since: "1973"
status: "Recovered from near-extinction; approximately 12,000-14,000 in Nevada (most in lower 48 states); threatened by disease, habitat loss, and climate change"
habitat_in_state: "Rocky mountain ranges throughout Nevada's deserts; requires steep cliffs for predator escape and access to water sources"
