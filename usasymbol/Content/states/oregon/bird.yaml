title: Western Meadowlark
scientific_name: Sturnella neglecta
adopted_year: 1927
legislation: 1927 gubernatorial proclamation; SCR 18 (2017)
meaning: Oregon's meadowlark matters because it entered public life by an unusual route. Schoolchildren chose it in 1927, Governor Isaac L. Patterson proclaimed it the state bird, and decades later lawmakers kept it by giving it a more specific role as Oregon's official state songbird rather than replacing it.
author: USA Symbol Team
date_published: '2024-11-27'
date_modified: "2026-05-02"
seo_title: "Oregon State Bird | Western Meadowlark"
seo_description: "Oregon chose the Western Meadowlark in 1927 through a schoolchildren vote and later reaffirmed it as the state songbird."
intro_text: Oregon's official state bird is the <strong>Western Meadowlark</strong>, chosen by schoolchildren in <strong>1927</strong> and proclaimed by Governor <strong>Isaac L. Patterson</strong> rather than adopted by statute. The meadowlark became the only Oregon symbol not originally chosen by the Legislature. In <strong>2017</strong>, when lawmakers considered replacing it with the osprey, they did not. Instead they kept the meadowlark and gave it a more specific title — <strong>official state songbird</strong> — while naming the osprey the official state raptor.
