sections:
- id: why-is-oregons-state-bird-unusual-among-oregon-symbols
  icon: fa-solid fa-circle-question
  title: Why Is Oregon's State Bird Unusual Among Oregon Symbols?
  paragraphs:
  - Most Oregon symbols came from the Legislature. The meadowlark did not. In 1927 the Oregon Audubon Society organized a statewide election among schoolchildren, and the Western Meadowlark won by a large margin.
  - Governor Isaac L. Patterson then proclaimed the bird official. Oregon sources say that made the meadowlark the only Oregon symbol not originally chosen by the Legislature.
  - Oregon's state bird began as a public school vote carried into office by proclamation, not as one more item in a statute book — a different origin than any other Oregon symbol.
- id: why-did-schoolchildren-pick-the-meadowlark-in-1927
  icon: fa-solid fa-school
  title: Why Did Schoolchildren Pick the Meadowlark in 1927?
  paragraphs:
  - The choice made sense to the children who voted on it. Oregon sources say the bird won roughly 40,000 of 75,000 ballots, which suggests it was more than a narrow favorite.
  - The reason was not exclusivity alone. The meadowlark was already easy to hear and recognize in Oregon's open country, especially in farm regions where its song was part of ordinary spring and summer life.
  - The bird worked because schoolchildren could already connect it to the Oregon they knew — not because lawmakers needed a rare or technical species.
- id: why-did-oregon-keep-the-meadowlark-in-2017
  icon: fa-solid fa-gavel
  title: Why Did Oregon Keep the Meadowlark in 2017?
  paragraphs:
  - By 2017 the meadowlark was no longer politically untouchable. Lawmakers considered replacing it with the osprey, arguing that the osprey felt more distinctive and more familiar to modern Oregon.
  - Oregon did not settle that debate by throwing the old bird out. Instead, Senate Concurrent Resolution 18 kept the Western Meadowlark and named it the official state songbird, while also designating the osprey as the official state raptor.
  - The meadowlark survived not by inertia, but as the bird whose 1927 schoolchildren story was still worth keeping — retitled rather than replaced.
faq:
- question: What is Oregon's state bird?
  answer: Oregon's state bird is the Western Meadowlark.
- question: When did Oregon choose the Western Meadowlark?
  answer: Oregon schoolchildren chose the Western Meadowlark in 1927, and Governor Isaac L. Patterson proclaimed it the state bird that year.
- question: Did the Oregon Legislature originally adopt the state bird?
  answer: No. The meadowlark first became official by gubernatorial proclamation after a schoolchildren vote, not by a legislative statute.
- question: Why did Oregon schoolchildren pick the meadowlark?
  answer: The bird was already familiar in Oregon's open country, and its song was widely recognized. It won by a large margin in the 1927 school vote, suggesting that it already felt like a natural Oregon emblem.
- question: Did Oregon try to replace the meadowlark?
  answer: Yes. In 2017 lawmakers considered replacing it with the osprey, but instead kept the meadowlark and named it the official state songbird while designating the osprey as the official state raptor.
- question: What does the Western Meadowlark mean for Oregon now?
  answer: The meadowlark represents the only Oregon symbol that originated outside the Legislature — chosen by schoolchildren in 1927, proclaimed by a governor, and retained in 2017 as the official state songbird rather than replaced by the osprey.
