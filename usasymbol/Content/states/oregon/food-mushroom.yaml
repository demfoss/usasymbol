sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Oregon's State Mushroom?"
    paragraphs:
      - "The Pacific golden chanterelle is Oregon's official state mushroom, designated by the Oregon Legislature in 1999. It grows wild in the state's Douglas fir forests, especially along the coast and in the Coast Range."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Pacific Golden Chanterelle"
    paragraphs:
      - "The Pacific golden chanterelle is a trumpet-shaped, deep yellow to orange mushroom with a fruity aroma often compared to apricots. It grows on the ground near Douglas fir trees, forming an underground partnership with the tree's roots that helps both organisms take up nutrients. Foragers gather it during the wet fall season, when it pushes up through the forest floor."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Golden Chanterelle Became Oregon's State Mushroom"
    paragraphs:
      - "The Oregon Legislature designated the Pacific golden chanterelle the official state mushroom in 1999, recognizing a species central to the state's forests and its commercial mushroom industry."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oregon Chose the Golden Chanterelle"
    paragraphs:
      - "Oregon's wet, mild fall climate and extensive Douglas fir forests make it one of the best places in the country to find golden chanterelles. Commercial and recreational foraging for the mushroom supports a significant part of the state's wild mushroom industry, particularly in the Coast Range and along the Pacific coast."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Pacific Golden Chanterelle Facts"
    facts:
      - "Adopted as Oregon's state mushroom in 1999."
      - "It grows near Douglas fir trees in Oregon's coastal and Coast Range forests."
      - "Foragers gather it during the wet fall season."
      - "Its aroma is often compared to apricots."

