faq:
  - question: "What is Oregon's state mushroom?"
    answer: "Oregon's state mushroom is the Pacific golden chanterelle, adopted by the Oregon Legislature in 1999."
  - question: "When did Oregon adopt the golden chanterelle as its state mushroom?"
    answer: "The Oregon Legislature designated the Pacific golden chanterelle the official state mushroom in 1999."
  - question: "Why did Oregon choose the golden chanterelle?"
    answer: "Oregon's wet fall climate and extensive Douglas fir forests make it a leading place to forage golden chanterelles, which support part of the state's wild mushroom industry."
  - question: "Is the golden chanterelle found in Oregon today?"
    answer: "Yes. It is commonly foraged each fall in Oregon's coastal and Coast Range forests."

