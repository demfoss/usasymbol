faq:
- question: What is Oregon's state soil?
  answer: "Oregon's state soil is the Jory series, a deep, dark-red Ultisol found on the basalt-capped hillsides of the Willamette Valley. It was designated the official state soil by the Oregon Legislature in 2011 and is best known for producing Pinot Noir grapes and hazelnuts."
- question: Why is it called Jory soil?
  answer: "The series is named after Jory Hill, a prominent basaltic hill in Marion County in the northern Willamette Valley, where USDA soil scientists first formally described and mapped the series. The type location remains in Marion County."
- question: What color is Jory soil?
  answer: "The surface is very dark reddish brown — almost burgundy — from organic matter mixed with iron-rich basalt-derived material. The argillic subsoil is vivid dark red to dusky red, becoming deeper in color with depth. The red comes from hematite and goethite, iron oxide minerals formed as ancient basalt lava flows weathered over hundreds of thousands of years."
- question: Where is Jory soil found in Oregon?
  answer: "Jory soil is found on the basalt-capped hills and ridges at the margins of the Willamette Valley, mainly in Yamhill, Polk, Marion, and Washington counties. It grows at elevations of 200 to 1,800 feet on slopes ranging from nearly flat to steep, in areas that receive 40 to 60 inches of rain per year."
- question: What grows in Jory soil?
  answer: "Pinot Noir grapes and hazelnuts are the most famous crops. Oregon produces 99 percent of the nation's commercial hazelnuts, most of them on Jory soil. Grass seed, winter wheat, and Christmas trees also grow on flatter Jory sites. Douglas fir and Oregon white oak are the native trees on Jory hillsides that were never farmed."
- question: Who chose Jory as Oregon's state soil?
  answer: "The Oregon Legislature designated Jory as the state soil in 2011, following a campaign organized by the Soil Science Society of America. The Oregon Department of Agriculture and the USDA Natural Resources Conservation Service supported the designation."
- question: How deep is Jory soil?
  answer: "Jory is one of the deepest soils in Oregon. The argillic horizon alone — the clay-rich red subsoil — runs from about 14 to 65 inches below the surface. The full soil profile often extends well beyond five feet before reaching weathered or fresh basalt."

