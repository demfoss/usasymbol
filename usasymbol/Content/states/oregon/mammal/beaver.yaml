title: "Beaver"
scientific_name: "Castor canadensis"
adopted_year: 1969

seo_title: "Oregon State Animal - Beaver | Official State Mammal"
seo_description: "The beaver is Oregon's state animal since 1969. This ecosystem engineer represents Oregon's fur trade heritage and The Beaver State identity."

intro_text: "Oregon's state animal is the American beaver, designated in 1969 to honor the species that gave Oregon its nickname and shaped the state's settlement history, and it is included in the [U.S. state mammals guide](/symbols/mammals). The legislature chose this ecological engineer to recognize the fur trade era when beaver pelts drove westward expansion and the animal's appearance on Oregon's state flag since 1859. The beaver represents frontier commerce, ecological transformation, and recovery from near-extinction."

common_name: "American Beaver"
official_since: "1969"
status: "Recovered from near-extinction; population estimated 400,000-600,000 statewide; managed as furbearing species"
habitat_in_state: "Rivers, streams, ponds, wetlands throughout Oregon; from coastal watersheds to high Cascade lakes; absent only from driest southeastern regions"
known_for: "Oregon's nickname 'The Beaver State'; appears on state flag reverse; ecosystem engineer creating wetland habitat; drove 1800s fur trade settlement"

size: "25 to 35 inches body length; 9 to 13 inches tail length (paddle-shaped)"
weight: "35 to 70 pounds; Oregon's largest rodent; exceptional individuals exceed 80 pounds"
coloration: "Rich brown fur with dense underfur; darker on back, lighter on belly; black leathery tail"
distinctive_traits: "Flat, paddle-shaped tail; webbed hind feet; orange incisors continuously growing throughout life; valves seal ears and nose underwater; transparent eyelid membranes"

habitat: "Streams and rivers with year-round water flow; ponds and lakes; requires trees for food and dam construction materials"
range_in_state: "Present in suitable aquatic habitats statewide; most abundant in Willamette Valley, Coast Range, and Cascade foothills; sparse in arid southeastern Oregon"
conservation_status: "Recovered species; nearly extinct by early 1900s from fur trapping; restored through protection and natural recolonization; now abundant and managed through regulated trapping"
where_to_find: "Tualatin River National Wildlife Refuge; Sauvie Island Wildlife Area; numerous state parks along rivers; visible at dawn and dusk constructing dams and lodges"
symbol_connections: "Oregon flag features beaver on reverse since 1859; state nickname 'The Beaver State' predates statehood; represents fur trade era that established Oregon Trail migration"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Oregon Legislative Assembly designated the beaver as the official state animal in 1969, formalizing Oregon's longtime identity as The Beaver State. The designation recognized the animal already featured on the reverse of Oregon's state flag since 1859 and reinforced [the Beaver State nickname page](/states/oregon/nickname/the-beaver-state)."
      - "The legislation came after more than a century of the beaver serving as Oregon's unofficial symbol. Educators, historians, and conservation groups advocated for formal designation to honor the fur trade heritage that drove Oregon's settlement and economic development during territorial days."
    
    subsections:
      - subtitle: "How It Became Symbol"
        text: "The beaver's association with Oregon predates statehood by decades. During the early 1800s, the Oregon Country gained international attention when fur traders discovered extraordinarily abundant beaver populations throughout the region's rivers and streams. British and American fur companies competed fiercely for access to Oregon beaver pelts commanding premium prices in European and Asian markets. The Hudson's Bay Company established Fort Vancouver on the Columbia River in 1825, creating headquarters for systematic beaver exploitation throughout the Pacific Northwest. American mountain men and trappers followed, trapping beavers along tributaries of the Columbia, Willamette, and Snake Rivers. This fur trade economy attracted settlers who traveled the Oregon Trail seeking opportunities in beaver-rich territories. When Oregon achieved statehood in 1859, legislators placed a beaver on the flag's reverse, acknowledging the animal's role in Oregon's development."
      
      - subtitle: "Why Chosen"
        text: "Legislators selected the beaver because no animal better represented Oregon's transformation from wilderness to settled territory. The quest for beaver pelts brought the first European-American traders and trappers to Oregon decades before agricultural settlers arrived. The fur trade established Oregon's first industries, transportation networks, and commercial connections to global markets. The animal symbolized both economic opportunity and environmental transformation—beaver populations declined from intensive trapping while the industry created wealth that funded further settlement. The beaver also represented ecological processes shaping Oregon landscapes. Beaver dams created wetlands throughout valleys, influenced stream flows, and modified habitats in ways affecting all subsequent land use. By designating the beaver, Oregon acknowledged complex history involving both exploitation and the ecological engineering that made the species worthy of protection and admiration."

  - id: "state-symbolism"
    icon: "fa-water"
    title: "What the Beaver Represents"
    style: "highlight"
    paragraphs:
      - "The beaver symbolizes Oregon's identity as The Beaver State and the fur trade era that established European-American presence in the Pacific Northwest. Beaver pelts drove the first wave of westward expansion into Oregon decades before agricultural settlement began."
      - "The species embodies ecological engineering at a scale matched by few other animals. Beavers transform landscapes through dam construction, creating wetlands that support diverse wildlife communities and influence watershed hydrology throughout Oregon."
      - "The designation in 1969 recognized both historical exploitation and modern conservation achievement. Beavers nearly vanished from Oregon through unregulated fur trapping but recovered to abundance through protective regulations and natural recolonization, in line with themes from [Oregon's state motto](/states/oregon/motto/alis-volat-propriis)."
    
    subsections:
      - subtitle: "The Fur Trade Era and Oregon Settlement"
        text: "The Pacific Northwest fur trade began when European ships exploring the coast in the late 1700s discovered that sea otter pelts commanded extraordinary prices in China. This maritime trade led to overland exploration seeking beaver populations in interior rivers. Lewis and Clark's 1805-1806 expedition documented abundant beavers throughout Oregon watersheds. Within two decades, British and American fur companies launched systematic trapping operations. The Hudson's Bay Company dominated Oregon's fur trade from Fort Vancouver (established 1825 near present-day Portland), employing hundreds of trappers who harvested beavers throughout the Columbia River basin. American traders and independent mountain men competed despite British territorial claims. Annual fur brigades traveled from Fort Vancouver to distant trapping territories, returning with thousands of pelts. This commerce established Oregon's first economy, created trails and settlements, and generated international diplomatic conflicts ultimately resolved through the Oregon Treaty of 1846 establishing the 49th parallel as the U.S.-Canada border."
      
      - subtitle: "From Abundance to Near-Extinction"
        text: "Oregon's beaver populations declined catastrophically during the 1800s through intensive commercial trapping. Early accounts describe beavers inhabiting virtually every suitable stream and river throughout western Oregon. Trappers found beaver dams and lodges along mountain creeks, valley rivers, and even small urban streams where Portland and other cities later developed. By the 1840s, beaver populations had crashed in accessible areas as trappers removed breeding adults faster than reproduction could replace losses. The Hudson's Bay Company's deliberate strategy involved trapping Snake River country to exhaustion, creating a fur desert that would discourage American trappers from moving into Oregon Territory. By the late 1800s, beavers had become scarce throughout Oregon. Fashion changes in Europe and Asia reduced demand for beaver fur felt hats, ending the commercial trade before complete extinction occurred. By the early 1900s, Oregon's beaver populations reached their lowest point, with the animals absent from large portions of their former range."
      
      - subtitle: "Ecological Engineering and Wetland Creation"
        text: "Beavers function as keystone species in Oregon ecosystems through dam construction fundamentally altering stream ecology and landscape hydrology. Individual beaver families build dams using branches, logs, mud, and rocks, creating ponds that flood upstream areas. These ponds slow water flow, trap sediment, raise water tables, and create wetland habitats supporting diverse communities of fish, amphibians, birds, and aquatic invertebrates. Oregon streams modified by beaver activity show increased habitat complexity, cooler summer water temperatures, and greater survival rates for juvenile salmon and trout. The dams force streams to spread across floodplains rather than cutting deep channels, reconnecting rivers with riparian zones. This process creates meadows in mountain valleys, recharges groundwater, and moderates flood peaks by storing water that releases slowly over time. Scientists increasingly recognize beaver engineering as essential to maintaining healthy watersheds throughout Oregon."
      
      - subtitle: "Salmon Habitat and Watershed Relationships"
        text: "Beaver-created habitats benefit Oregon's iconic salmon populations despite common misconceptions that dams block fish migration. Research demonstrates that beaver ponds provide critical rearing habitat for juvenile salmon, offering refuge from predators, abundant food sources, and cooler water temperatures during summer drought periods. Juvenile coho salmon particularly depend on beaver-modified habitats for overwinter survival. The complex channel patterns created by multiple beaver dams increase stream habitat diversity far beyond what exists in simple channelized streams. Sediment trapped behind dams creates spawning gravels downstream when dams naturally breach during floods. This process mimics the natural disturbance regimes that historically maintained Oregon's productive salmon streams before logging, agriculture, and development simplified watersheds. Modern conservation efforts increasingly incorporate beaver restoration as strategy for recovering threatened salmon populations, reversing previous policies that removed beavers as fish passage obstacles."
      
      - subtitle: "Oregon Flag and State Identity"
        text: "The beaver's appearance on Oregon's state flag since 1859 makes Oregon one of only two states with different images on flag obverse and reverse (the other being Massachusetts). The flag's front displays Oregon's state seal with a covered wagon symbolizing Oregon Trail migration. The reverse shows a gold beaver on blue background, representing the animal that drew the first settlers westward. This design choice reflected Oregon founders' recognition that beaver trapping preceded and enabled agricultural settlement. The beaver image remained on the flag through multiple design modifications, including the current version adopted in 1925. Oregon's nickname The Beaver State emerged during territorial days, appearing in newspapers and promotional materials encouraging migration. The nickname predated The Beaver State appearing on vehicle license plates, state highway signs, and tourism materials. The beaver's presence in state symbolism for over 165 years demonstrates enduring recognition of the animal's role in Oregon history."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify Beavers"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Beavers display unmistakable appearance combining large size, distinctive tail, and aquatic adaptations. Oregon beavers rank among North America's largest rodents."
        list_items:
          - "**Size**: Body length 25-35 inches; tail length 9-13 inches; total length up to 48 inches"
          - "**Weight**: Typically 35-70 pounds; exceptional individuals exceed 80 pounds; second-largest rodent in North America after capybara"
          - "**Appearance**: Dense brown fur with waterproof qualities; darker on back and head, lighter on belly; prominent orange incisors visible when mouth open; flat, black, scaly tail shaped like paddle"
          - "**Features**: Webbed hind feet for swimming; hand-like front feet for carrying materials and manipulating objects; valves close ears and nostrils underwater; transparent eyelid membranes protect eyes while swimming; split claw on second hind toe for grooming"
      
      - subtitle: "Aquatic Adaptations"
        text: "Beavers possess remarkable anatomical specializations for aquatic life. The famous flat tail serves multiple functions—a rudder for swimming, a prop when sitting upright, a fat storage organ, and a slapping alarm signal warning family members of danger. Dense underfur traps air providing insulation and buoyancy, while guard hairs shed water. Oil glands near the tail secrete waterproofing material beavers spread through their fur during grooming. Their lungs and liver store oxygen allowing dives lasting 15 minutes. Heart rate slows during dives conserving oxygen. Transparent membranes cover eyes underwater, functioning like built-in goggles. Lips close behind incisors allowing beavers to gnaw underwater without swallowing water. These adaptations enable beavers to work effectively in Oregon's cold mountain streams and coastal rivers throughout the year."
      
      - subtitle: "Behavior and Engineering"
        text: "Beavers live in family groups typically consisting of adult pair, current year's kits, and previous year's juveniles totaling 4-8 individuals. Families occupy territories along streams, defending them from neighboring beaver families. They construct two types of structures—dams that create ponds and lodges that provide shelter. Dams range from small structures a few feet long to massive constructions exceeding 100 feet requiring years to build. Beavers work primarily at night, cutting trees by gnawing around trunks until they fall. They prefer willows, cottonwoods, and alders but will use various tree species available in Oregon habitats. Their continuously growing incisors require constant gnawing to prevent overgrowth. Beavers cache food for winter by sinking branches in deep water near lodges where they remain accessible beneath ice. Oregon's mild coastal winters reduce this caching behavior compared to colder regions."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "Beavers in Oregon"
    style: "default"
    paragraphs:
      - "Beavers inhabit suitable aquatic habitats throughout Oregon from coastal streams to high Cascade Mountain lakes. Population recovery from near-extinction has restored beavers to most of their historic range within the state."
      - "Oregon supports an estimated 400,000-600,000 beavers, representing dramatic increase from early 1900s when populations reached critically low levels. This recovery ranks among Oregon's most successful wildlife restoration achievements."
    
    facts:
      - "**Statewide Distribution**: Present in all Oregon counties with suitable aquatic habitat; most abundant in Willamette Valley, Coast Range, and Cascade foothills"
      - "**Population Estimate**: 400,000-600,000 beavers statewide; exact numbers uncertain due to nocturnal habits and widespread distribution"
      - "**Habitat Preference**: Perennial streams with adjacent trees; ponds and lakes; wetland complexes; found from sea level to approximately 7,000 feet elevation in Cascades"
      - "**Urban Populations**: Substantial beaver numbers in Portland metro area, Eugene, Corvallis, and other cities utilizing urban streams and wetlands"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Beavers"
    style: "default"
    paragraphs:
      - "Observing beavers requires visiting active colonies during dawn or dusk when animals emerge to feed and work. Fresh-cut stumps, dams, and lodges indicate beaver presence even when animals remain hidden."
    
    list_items:
      - "**Tualatin River National Wildlife Refuge (Sherwood)**: Extensive wetlands support abundant beaver populations; viewing platforms and trails provide observation opportunities; interpretive programs explain beaver ecology"
      - "**Sauvie Island Wildlife Area (Portland Metro)**: Large island at Columbia-Willamette confluence hosts numerous beaver colonies; accessible by vehicle and on foot; dawn and dusk patrols yield sightings"
      - "**William L. Finley National Wildlife Refuge (Corvallis)**: Wetland habitats feature active beaver engineering; trails pass dams and lodges; educational programs highlight beaver role in habitat creation"
      - "**Smith and Bybee Wetlands Natural Area (Portland)**: Urban wetland complex includes beaver-modified areas; viewing from trails and overlooks; demonstrates beaver adaptation to metropolitan environments"
      - "**Cascade Lakes Highway**: Numerous high-elevation lakes show beaver activity; dams visible at lake outlets; camping areas provide observation opportunities"
      - "**State Parks**: Many Oregon state parks including Silver Falls, Milo McIver, and L.L. Stub Stewart feature beaver colonies along streams; fresh cuttings indicate recent activity"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Population Status and Management"
    style: "default"
    paragraphs:
      - "Beavers maintain stable, abundant populations throughout Oregon under management by the Oregon Department of Fish and Wildlife. The species recovered from near-extinction through protective regulations established in the early 1900s."
      - "Management focuses on balancing beaver population benefits including wetland creation and salmon habitat with conflicts including flooding of agricultural land, roads, and timber damage. Modern approaches increasingly recognize beaver engineering as asset rather than problem."
    
    subsections:
      - subtitle: "Recovery and Current Management"
        text: "Oregon banned beaver trapping in 1899 after populations crashed from commercial harvest. This protection allowed natural recovery through the early 1900s as surviving beavers recolonized former habitats and expanded into new areas. The state reopened regulated trapping seasons once populations recovered sufficiently to sustain harvest. Modern management classifies beavers as furbearing mammals with annual trapping seasons during winter months when pelts reach prime condition. Annual harvests typically range from 10,000-15,000 beavers statewide, primarily on private lands where landowners request removal to prevent damage. Public lands including national forests, Bureau of Land Management holdings, and state wildlife areas generally protect beavers except where specific conflicts require management intervention. The Oregon Department of Fish and Wildlife monitors populations through trapper surveys and field observations rather than intensive population studies."
      
      - subtitle: "Human-Beaver Conflicts and Solutions"
        text: "Oregon's abundant beaver populations create conflicts requiring management responses. Farmers experience crop damage and flooding when beaver dams raise water tables inundating agricultural fields. Road managers face culvert blockages causing highway flooding and undermining. Timber companies document tree losses where beavers cut commercially valuable species. Urban areas deal with flooding of parks, trails, and residential areas. Traditional responses involved removing problem beavers through trapping or lethal control, though populations quickly recolonized from surrounding areas. Modern approaches emphasize non-lethal solutions including pond levelers that maintain water levels while preventing excessive flooding, protective wrapping around valuable trees, and exclusion fencing. Some Oregon jurisdictions now recognize beaver activity as beneficial, accepting minor flooding in exchange for enhanced wetland habitat, groundwater recharge, and water quality improvements."
      
      - subtitle: "Beaver Restoration for Conservation Goals"
        text: "Conservation agencies increasingly use beaver restoration as strategy for achieving multiple ecological objectives. The Oregon Department of Fish and Wildlife, U.S. Forest Service, and conservation organizations including The Nature Conservancy now deliberately introduce beavers into degraded watersheds to restore wetland functions and salmon habitat. These programs transport beavers from areas where they cause conflicts to locations where their engineering provides benefits. Monitoring shows that beaver-restored streams develop complex channels, increased water storage, and improved conditions for salmon and other aquatic species within years of colonization. This approach proves more cost-effective than mechanical stream restoration requiring heavy equipment and ongoing maintenance. Beaver restoration projects in eastern Oregon's high desert have created wetlands in historically dry landscapes, benefiting sage-grouse, waterfowl, and other species while providing water for livestock."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The beaver connects to other Oregon symbols through shared themes of frontier heritage, natural resource economies, and ecological relationships. The animal's engineering activities influence habitats supporting Oregon's state bird, fish, and plant communities."
      - "The beaver's presence on Oregon's state flag since 1859 makes it arguably Oregon's most visually prominent symbol, appearing on the flag that represents the state at all official functions and ceremonies; see [the Oregon flag profile](/states/oregon/flag/oregon-state-flag)."
    
    subsections:
      - subtitle: "Oregon Flag and Pioneer Heritage"
        text: "Oregon's state flag features a beaver on the reverse side, making it one of only two U.S. state flags with different designs on front and back. The front displays Oregon's state seal showing a covered wagon representing Oregon Trail pioneers, a plow symbolizing agriculture, and ships indicating maritime commerce. The reverse side's beaver represents the fur trade economy that preceded agricultural settlement. This dual imagery acknowledges that beaver trapping brought the first European-American residents to Oregon before wagon trains carried farming families westward. The flag design adopted in 1925 maintained the beaver from earlier flag versions, demonstrating continuous recognition of the animal's historical significance. The beaver's prominent placement on the state flag ensures that Oregon's state animal receives visual representation at all official state functions."
        
      - subtitle: "Western Meadowlark and Riparian Habitat"
        text: "Oregon's state bird, the western meadowlark (designated 1927), inhabits grasslands and meadows throughout the state including those created or maintained by beaver activity. Beaver dams flooding valleys create meadow habitats when ponds eventually fill with sediment, providing nesting and foraging areas for meadowlarks and other grassland birds. Riparian zones surrounding beaver ponds support diverse bird communities benefiting from wetland habitats. The relationship between state animal and state bird illustrates ecological connections—beaver engineering creates conditions supporting the bird populations that characterize Oregon's landscape. Both symbols represent working landscapes where wildlife thrives alongside human land use, reflecting Oregon's identity as place where nature and development coexist."
        link:
          label: "See Oregon state bird"
          url: "/states/oregon/bird/western-meadowlark"
      

