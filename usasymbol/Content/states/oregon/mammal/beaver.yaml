faq:
  - question: "What is Oregon's state animal?"
    answer: "Oregon's state animal is the American beaver (Castor canadensis), designated in 1969. The beaver appears on the reverse of Oregon's state flag since 1859 and represents the fur trade era that established Oregon's settlement and economy. Oregon's nickname, The Beaver State, acknowledges the animal's central role in state history."
  
  - question: "When was the beaver designated as Oregon's state animal?"
    answer: "The beaver became Oregon's official state animal in 1969. This designation formalized Oregon's longtime identity as The Beaver State and recognized the animal already featured on the state flag reverse since 1859. The beaver's association with Oregon predates statehood, originating in the fur trade era of the early 1800s."
  
  - question: "Why is Oregon called The Beaver State?"
    answer: "Oregon earned the nickname The Beaver State because the fur trade in beaver pelts drove the region's first European-American settlement and economy. During the 1820s-1840s, the Hudson's Bay Company and American fur traders competed for access to Oregon's extraordinarily abundant beaver populations. The quest for beaver pelts brought trappers and traders to Oregon decades before agricultural settlers arrived via the Oregon Trail."
  
  - question: "Why did Oregon choose the beaver as its state animal?"
    answer: "Oregon chose the beaver because no animal better represented the state's settlement history. The fur trade in beaver pelts attracted the first European-American residents and established Oregon's first industries and commercial connections. The beaver already appeared on Oregon's flag since 1859, reflecting founders' recognition of its historical importance. The designation also acknowledged beavers' ecological role as engineers creating wetland habitats throughout Oregon watersheds."
  
  - question: "What happened to Oregon's beaver population?"
    answer: "Oregon's beaver population crashed during the 1800s from intensive commercial fur trapping. By the late 1800s, beavers had become scarce throughout Oregon. The state banned trapping in 1899, allowing populations to recover naturally through the early 1900s. Today, Oregon supports an estimated 400,000-600,000 beavers, representing one of the state's most successful wildlife restoration achievements."
  
  - question: "Why is there a beaver on Oregon's flag?"
    answer: "The beaver appears on the reverse of Oregon's state flag (adopted 1859) to represent the fur trade economy that brought the first settlers to Oregon. The flag's front shows a covered wagon symbolizing Oregon Trail agricultural settlement, while the reverse beaver acknowledges that fur trappers preceded farmers. Oregon is one of only two U.S. states with different designs on flag front and back."
  
  - question: "Where can I see beavers in Oregon?"
    answer: "Beavers inhabit rivers, streams, and wetlands throughout Oregon. Best viewing locations include Tualatin River National Wildlife Refuge near Sherwood, Sauvie Island Wildlife Area in Portland metro, William L. Finley National Wildlife Refuge near Corvallis, and numerous state parks. Look for fresh-cut stumps, dams, and lodges indicating beaver presence. Dawn and dusk provide optimal viewing times when beavers emerge from lodges to feed."
  
  - question: "How do beavers help salmon in Oregon?"
    answer: "Beaver dams create pond habitats that provide crucial rearing areas for juvenile salmon. These ponds offer refuge from predators, abundant food sources, and cooler summer water temperatures. Beaver-modified streams show greater habitat complexity and higher salmon survival rates than simple channelized streams. Oregon salmon recovery efforts increasingly incorporate beaver restoration as cost-effective strategy for improving watershed conditions."
  
  - question: "Are beavers protected in Oregon?"
    answer: "Beavers receive management as furbearing mammals in Oregon with regulated trapping seasons during winter months. The Oregon Department of Fish and Wildlife oversees population management balancing conservation with addressing conflicts. Landowners experiencing beaver damage can obtain permits for removal. Public lands generally protect beavers except where specific conflicts require intervention. Annual harvest of 10,000-15,000 beavers does not threaten population stability."

