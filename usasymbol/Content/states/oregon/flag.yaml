seo_title: "Oregon State Flag: Meaning, Beaver Symbol, History & Facts"
seo_description: "Review how Oregon's flag was adopted in law, what its main symbols refer to, and how officials describe the flag of Oregon today."

intro_text: "Oregon adopted its state flag in 1925, featuring different designs on each side and standing out in the [list of U.S. state flags](/symbols/flags). The front displays the state coat of arms in gold on a navy blue field. The reverse shows a gold beaver. Oregon remains the only U.S. state with a two-sided flag."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Oregon State Flag Is Designed"
    paragraphs:
      - "The Oregon state flag is the official flag of the state of Oregon. A navy blue field holds the state coat of arms in gold on the front. The words State of Oregon appear above the emblem. The year 1859 sits below."
      - "The flag's reverse side shows a gold beaver standing on a log. Oregon is the only U.S. state flag with different images on each side. This design requires more expensive manufacturing than single-sided flags."
      - "The Oregon legislature adopted the flag on February 26, 1925. Meier & Frank department store produced the first official flag that year. Employees Marjorie Kennedy and Blanche Cox sewed it by hand."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Oregon Flag Communicates"
    paragraphs:
      - "The Oregon state flag meaning connects to the state's settlement history and natural resources. The coat of arms represents Oregon's journey from frontier territory to statehood."
      - "The beaver on the reverse symbolizes Oregon's fur trade heritage. Beaver pelts drove early European settlement in the region. The animal became Oregon's official state mammal and inspired the nickname The Beaver State; see [the Oregon beaver page](/states/oregon/mammal/beaver)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Oregon Flag History and Adoption"
    paragraphs:
      - "Oregon used unofficial regimental flags before adopting an official state banner. In 1888, the Oregon State Guard ordered three blue silk flags bearing the state seal. Each flag cost two hundred fifty dollars. Similar flags appeared at various events through the early 1900s."
      - "A banner represented Oregon at the Panama-Pacific International Exposition in 1915. The front showed a white field with the state seal and the words Exposition 1915. The American flag appeared on the back."
      - "The legislature authorized an official state flag on February 26, 1925. The design featured navy blue and gold, Oregon's state colors. Meier & Frank made the first flag in Portland. The flag showed the state coat of arms on one side and a beaver on the other, reinforcing [the Beaver State identity](/states/oregon/nickname/the-beaver-state)."
      - "Early versions sometimes used a multicolored state seal instead of all gold. The design has remained essentially unchanged since 1925. Two-sided flags cost more to manufacture than standard flags. Paraguay is the only country with a similar two-sided national flag."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Oregon Flag"
    symbols:
      - id: coat-of-arms
        name: "Oregon State Flag Coat of Arms"
        image: "symbols/coat-of-arms.svg"
        paragraphs:
          - "The state coat of arms dominates the flag's front. An eagle perches atop a shield. Thirty-three stars surround the shield representing Oregon as the thirty-third state admitted to the Union."
          - "The shield shows Oregon's landscape and economy. Mountains rise in the background. A covered wagon and ox team cross the foreground representing the Oregon Trail. An elk with branching antlers stands on the left."
          - "Two ships appear on the water. A British man-of-war sails away while an American merchant vessel arrives. The Pacific Ocean stretches beneath a setting sun. These images mark the transition from British to American control."

      - id: agricultural-symbols
        name: "Oregon State Flag Agricultural Symbols"
        image: "symbols/agriculture.svg"
        paragraphs:
          - "A plow, pickax, and sheaf of wheat appear on the coat of arms. These tools represent Oregon's major industries during settlement. The plow stands for farming. The pickax represents mining. The wheat shows agricultural production."
          - "A banner reading The Union wraps beneath these elements. It declares Oregon's place in the United States."

      - id: beaver
        name: "Oregon State Flag Beaver"
        image: "symbols/beaver.svg"
        paragraphs:
          - "A gold beaver stands on a log on the flag's reverse. The beaver faces right. This animal appears only on the back of the flag."
          - "The beaver represents Oregon's fur trade history. Beaver pelts attracted trappers and traders to Oregon in the early 1800s. The state adopted the beaver as its official animal. Oregon earned the nickname The Beaver State from this heritage."

      - id: text
        name: "Oregon State Flag Text"
        image: "symbols/text.svg"
        paragraphs:
          - "The words State of Oregon appear in gold letters above the coat of arms. The year 1859 sits below. This marks when Oregon joined the Union as the thirty-third state."
          - "All lettering and symbols use gold against the navy blue field. These are Oregon's official state colors."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Oregon State Flag Colors"
    paragraphs:
      - "The Oregon state flag uses navy blue and gold. These are Oregon's official state colors. Oregon statute describes the colors but does not provide Cable or Pantone values, and broader comparisons appear in [the U.S. state colors guide](/symbols/colors)."
      - "Navy blue forms the background field on both sides. Gold appears in all lettering and symbols including the coat of arms and the beaver, with details matched on [Oregon's official colors page](/states/oregon/color/oregon-official-state-colors-navy-blue-and-gold)."

  - id: context
    icon: "fa-solid fa-chart-column"
    title: "Modern Context"
    paragraphs:
      - "For demographic context, review [U.S. states by population](/rankings/demographics/states-by-population)."
    colors:
      - name: "Navy Blue"
        hex: "#002a86"
      - name: "Gold"
        hex: "#ffea0f"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Oregon State Flag Facts"
    facts:
      - "Oregon approved its double-sided state flag on February 26, 1925"
      - "The flag is the only U.S. state flag with different designs on each side"
      - "Meier & Frank department store made the first official flag in 1925"
      - "The front shows the state coat of arms with 33 stars"
      - "The back displays a gold beaver on a log"
      - "Navy blue and gold are Oregon's official state colors"

faq:
  - question: "What is the official state flag of Oregon?"
    answer: "The state flag of Oregon is the official banner of Oregon, featuring the state coat of arms on a navy blue field on the front and a gold beaver on the reverse."

  - question: "How would you describe the design of the Oregon state flag?"
    answer: "The front shows a navy blue field with the state coat of arms in gold, with State of Oregon above and 1859 below. The back shows a gold beaver on a log against navy blue."

  - question: "How do historians explain the symbolism of Oregon's flag?"
    answer: "The flag represents Oregon's settlement history and natural resources. The coat of arms shows the Oregon Trail, agriculture, and maritime history. The beaver represents the fur trade."

  - question: "What does the Oregon state flag represent?"
    answer: "The flag means Oregon's journey from frontier territory to statehood. The symbols show farming, mining, the Oregon Trail, and the transition from British to American control."

  - question: "How is Oregon's flag usually described?"
    answer: "A gold beaver standing on a log appears on the back of the Oregon state flag."

  - question: "What stands out most about Oregon's flag?"
    answer: "The flag is two-sided to display both the state coat of arms and the beaver, Oregon's state animal. This design distinguishes Oregon from all other U.S. states."

  - question: "When did Oregon adopt its current state flag?"
    answer: "Oregon adopted its state flag on February 26, 1925."

