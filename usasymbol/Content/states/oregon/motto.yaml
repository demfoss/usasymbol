sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Oregon State Motto"
    paragraphs:
      - "Oregon's state motto is <strong>Alis Volat Propriis</strong>, a Latin phrase meaning <em>She Flies With Her Own Wings</em>. It is the official motto under Oregon Revised Statutes 186.040, adopted by the 1987 Legislature."
      - "Oregon's motto is one of the few in the United States written in English first and then translated into Latin — the reverse of how most Latin state mottos began. Judge Jesse Quinn Thornton composed the English phrase in 1854, and a Latin rendering was placed on the Oregon Territorial Seal that year."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of \"Alis Volat Propriis\""
    paragraphs:
      - "The three Latin words each carry a specific meaning. <em>Alis</em> is the ablative plural of <em>ala</em>, meaning wings. <em>Volat</em> means she flies — the subject is implied in the verb ending. <em>Propriis</em> comes from <em>proprius</em>, meaning one's own. Together: <em>She flies with her own wings.</em>"
      - "The \"she\" refers to Oregon itself. Countries, states, and territories were traditionally treated as feminine in Latin and in English writing of the era, so the motto speaks of Oregon as an entity flying on its own power."

  - id: meaning
    icon: "fa-solid fa-lightbulb"
    title: "Oregon State Motto Meaning"
    paragraphs:
      - "The phrase describes self-reliance — flying by your own means, without depending on others for lift. For early Oregon, this was not an abstract idea. The territory developed largely without federal support, built by settlers who had crossed the Oregon Trail at their own risk and expense."
      - "Thornton chose the phrase with that history in mind. He had traveled the Oregon Trail himself in 1846 and had personally lobbied Congress in Washington, D.C., to give Oregon official territorial status. He had watched the region grow through its own effort before it had any formal recognition from the federal government."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Oregon's State Motto"
    paragraphs:
      - "Jesse Quinn Thornton (1810–1888) was a judge who arrived in Oregon in 1846 after traveling the Oregon Trail. He served as a Supreme Judge of the Provisional Government of Oregon and worked to establish the territory through Congress. In 1854, he wrote the English phrase <em>She Flies With Her Own Wings</em> for Oregon Territory."
      - "On January 18, 1854, the Oregon Territorial Legislature adopted the Latin translation, <em>Alis Volat Propriis</em>, as the motto of Oregon Territory and placed it on the territorial seal."
      - "When Oregon became a state in 1859, the new state seal carried the words <em>The Union</em> — not the territorial motto. In 1957, the Oregon Legislative Assembly formally codified <em>The Union</em> as the official state motto in ORS 186.040."
      - "In 1987, the legislature reversed that decision. Chapter 848, enacted July 20, 1987, amended ORS 186.040 and restored <em>Alis Volat Propriis</em> as the official motto. One unusual result: the Great Seal of Oregon still displays <em>The Union</em> and has not been updated to match the statutory motto."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Oregon State Motto Facts"
    style: "gradient"
    facts:
      - "\"Alis Volat Propriis\" means \"She Flies With Her Own Wings\" in Latin."
      - "Oregon's motto was written in English first by Judge Jesse Quinn Thornton in 1854, then translated into Latin — the reverse of most Latin state mottos."
      - "The Latin motto appeared on the Oregon Territorial Seal on January 18, 1854."
      - "\"The Union\" replaced it as the official motto in 1957 when Oregon codified its state symbols."
      - "The 1987 Legislature restored \"Alis Volat Propriis\" as the official motto through Chapter 848, enacted July 20, 1987."
      - "The Great Seal of Oregon still displays \"The Union\" and has not been changed since 1859."

