faq:
  - question: "What is Oregon's state motto?"
    answer: "Oregon's state motto is \"Alis Volat Propriis,\" a Latin phrase meaning \"She Flies With Her Own Wings.\" It is the official motto under ORS 186.040, restored by the legislature in 1987."

  - question: "What does \"Alis Volat Propriis\" mean?"
    answer: "It means \"She Flies With Her Own Wings.\" Alis means wings, volat means she flies, and propriis means her own. The phrase describes self-reliance — moving forward on your own power, without outside support."

  - question: "What is the English translation of \"Alis Volat Propriis\"?"
    answer: "The English translation is \"She Flies With Her Own Wings.\" The \"she\" refers to Oregon itself. The phrase was actually written in English first by Judge Jesse Quinn Thornton in 1854, then translated into Latin for the territorial seal."

  - question: "When did Oregon adopt its state motto?"
    answer: "Oregon adopted \"Alis Volat Propriis\" as the official state motto in 1987. The phrase first appeared on the Oregon Territorial Seal in 1854. It was replaced by \"The Union\" in 1957 and then restored in 1987."

  - question: "Why does the Oregon state seal say \"The Union\" instead of the official motto?"
    answer: "The Great Seal of Oregon has displayed \"The Union\" since statehood in 1859 and has never been updated. When the legislature restored \"Alis Volat Propriis\" as the official motto in 1987, the seal design was not changed. The motto exists in statute, but the seal still shows the older phrase."

