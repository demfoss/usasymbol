seo_title: "Oregon State Motto | Alis Volat Propriis"
seo_description: "Oregon's state motto is \"Alis Volat Propriis,\" Latin for \"She Flies With Her Own Wings.\" The phrase was coined in 1854 and officially restored in 1987."

intro_text: "Oregon's state motto is <strong>Alis Volat Propriis</strong>, a Latin phrase meaning <em>She Flies With Her Own Wings</em>. Judge Jesse Quinn Thornton wrote it in English in 1854 and the Oregon Territorial Legislature added it to the territorial seal that same year."

