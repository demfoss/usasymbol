title: "Alis Volat Propriis"
language: "Latin"
english_translation: "She Flies With Her Own Wings"
adopted_year: 1987

author: "USA Symbol Team"
date_published: "2025-12-04"
date_modified: "2026-03-27"
seo_title: "Oregon State Motto | Alis Volat Propriis! She Flies With Her Own Wings!"
seo_description: "Oregon's motto was written in English first, then translated into Latin — the opposite of every other Latin state motto. Oregon replaced it with 'The Union' in 1957, then restored it in 1987 — the only state to readopt its original territorial motto after dropping it. The state seal still shows 'The Union'; the motto and the seal display different phrases."

intro_text: "Oregon's state motto is <strong>Alis Volat Propriis</strong> — Latin for <em>She Flies With Her Own Wings</em>. The phrase was written in English first by Jesse Quinn Thornton in 1854, then translated into Latin — the reverse of how most Latin state mottos originated. Oregon replaced it with 'The Union' in 1957, then restored it in 1987, making Oregon the only U.S. state to readopt its original territorial motto after officially replacing it. A quirk remains: the state seal, unchanged since 1859, still bears 'The Union' inscription, while the law adopted in 1987 establishes 'Alis Volat Propriis' as the official motto."

sections:
  - id: "english-first-latin-second"
    icon: "fa-solid fa-language"
    title: "Written in English First, Then Translated Into Latin"
    paragraphs:
      - "Every other Latin state motto began as a Latin phrase selected from classical texts or composed directly in Latin. Oregon reversed the process. Jesse Quinn Thornton wrote the English phrase 'She Flies With Her Own Wings' first, then translated it into Latin for the 1854 territorial seal. This makes Oregon's motto unusual in both origin and direction — it is a translation into Latin rather than a translation from it."
      - "The grammatical result has provoked debate. Classical Latin might favor <em>alis suis volat</em> for explicit possession, and some linguists note the construction is slightly informal. But Thornton's intent was clear: Oregon Territory had established a functioning government in 1843 — years before Congress officially recognized it — without substantial help from Washington. The motto described that historical fact directly."
      - "Thornton served as Supreme Judge of the Provisional Government of Oregon. He had traveled the Oregon Trail in 1846, arrived in Oregon City after a punishing journey through the uncharted Applegate Trail, and had personally lobbied Congress in Washington D.C. to establish Oregon as a territory. His 1854 motto documented what he had already witnessed: Oregon had flown on its own wings before it was officially permitted to."

  - id: "replaced-and-restored"
    icon: "fa-solid fa-rotate-left"
    title: "Replaced in 1957. Restored in 1987. The Only State to Do Both."
    paragraphs:
      - "In 1957, the Oregon legislature replaced <em>Alis Volat Propriis</em> with 'The Union' — codifying language that had appeared on the state seal since statehood in 1859. The change fit the Cold War emphasis on national unity. The original territorial phrase had never appeared on the state seal; the seal had always displayed 'The Union' below the shield with its 33 stars."
      - "For 30 years, Oregon's official motto was 'The Union.' But the Latin phrase remained in informal use on some state documents, and Oregonians with historical knowledge of the territorial period continued associating it with the state. By the 1980s, the Oregon Trail had become a point of cultural pride, and Barbara Roberts — then serving as Oregon Secretary of State, later to become governor — championed restoring the original motto."
      - "The 1987 legislature introduced restoration legislation with former Senate President Jason Boe and Senate historian Cecil Edwards as co-sponsors. The bill passed without recorded opposition. Governor Neil Goldschmidt signed it on July 20, 1987. Oregon became the only U.S. state to officially replace its original territorial motto and then officially restore it — a 30-year interruption bracketed by two legislative votes."

  - id: "seal-vs-motto"
    icon: "fa-solid fa-shield-halved"
    title: "The State Seal and the State Motto Say Different Things"
    paragraphs:
      - "After the 1987 restoration, Oregon arrived at an unusual situation: the state seal still displays 'The Union' — it has been unchanged since 1859 — while Oregon Revised Statutes 186.040 establishes 'Alis Volat Propriis' as the official motto. The motto and the seal bear different phrases simultaneously."
      - "Oregon's state seal design includes a shield depicting a sunset over the Pacific Ocean with mountains, an eagle above, and 33 stars representing Oregon as the 33rd state. 'The Union' appears in a banner below the shield. This seal design has appeared on official documents since statehood, and no legislature has moved to change it."
      - "Oregon's state flag is the only two-sided U.S. state flag: the front shows the seal design with 'State of Oregon 1859,' while the reverse shows a gold beaver. The motto 'Alis Volat Propriis' appears on official publications and government letterhead but not on the seal or flag — it exists in statute without appearing on the primary state symbols."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Oregon State Motto Facts"
    style: "gradient"
    facts:
      - "Oregon's motto was written in English first, then translated into Latin — the reverse of how other Latin state mottos originated."
      - "Oregon replaced 'Alis Volat Propriis' with 'The Union' in 1957, then restored the original in 1987 — the only state to do both."
      - "The state seal still displays 'The Union' from 1859; the motto and the seal show different phrases."
      - "Jesse Quinn Thornton proposed the motto in 1854; he had personally lobbied Congress to create Oregon Territory in 1848."
      - "Barbara Roberts, who sponsored the 1987 restoration bill as Secretary of State, later became Oregon's governor."
      - "Marvel Comics published a Captain Marvel collection titled 'Alis Volat Propriis' in 2015."

faq:
  - question: "What is Oregon's state motto?"
    answer: "Oregon's state motto is 'Alis Volat Propriis,' a Latin phrase meaning 'She Flies With Her Own Wings.' It was first adopted for the territorial seal in 1854, replaced with 'The Union' in 1957, and restored as the official motto on July 20, 1987."

  - question: "What does 'Alis Volat Propriis' mean?"
    answer: "'She Flies With Her Own Wings' — expressing independence and self-reliance. 'Alis' means wings (ablative plural of 'ala'), 'volat' means she flies (from 'volare'), and 'propriis' means one's own. Jesse Quinn Thornton wrote the English phrase first, then translated it into Latin — the reverse of how most Latin state mottos were created."

  - question: "What language is Oregon's motto written in?"
    answer: "Latin, though the English version came first. Jesse Quinn Thornton wrote 'She Flies With Her Own Wings' in English in 1854, then translated it into Latin for the territorial seal. This makes it unusual among state mottos: it is a translation into Latin rather than from it."

  - question: "When did Oregon officially adopt its motto?"
    answer: "Oregon first adopted 'Alis Volat Propriis' for the territorial seal in January 1854. The legislature replaced it with 'The Union' in 1957. The current official adoption date is July 20, 1987, when Governor Neil Goldschmidt signed the restoration legislation."

  - question: "Why did Oregon replace its motto with 'The Union' in 1957?"
    answer: "The legislature codified 'The Union,' which had appeared on the state seal since 1859 statehood, as the official motto. The change fit the Cold War era's emphasis on national unity. The original Latin phrase had never appeared on the seal itself — only in territorial statutes and some official documents."

  - question: "Where does Oregon's motto appear?"
    answer: "On official state documents, government publications, and legislative building inscriptions. It does not appear on the state seal (which still shows 'The Union' from 1859) or on the state flag. Oregon law establishes the motto in Title 19, Chapter 186 of the Oregon Revised Statutes."

