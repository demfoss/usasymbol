- id: facts
  icon: fa-solid fa-lightbulb
  title: Chinook Salmon Facts
  facts:
  - Adopted in 1961 by the Oregon Legislature.
  - Its scientific name is Oncorhynchus tshawytscha.
  - It is the largest of all Pacific salmon and can top 50 pounds.
  - It is also called the king salmon.
  - It is also the state fish of Alaska.
faq:
- question: What is Oregon's state fish?
  answer: Oregon's state fish is the Chinook salmon, also called the king salmon. The Oregon Legislature adopted it in 1961.
- question: When did Oregon adopt the Chinook salmon?
  answer: The Oregon Legislature named the Chinook salmon the official state fish in 1961.
- question: Why did Oregon choose the Chinook salmon?
  answer: Official sources don't give a detailed reason. The Chinook is the largest Pacific salmon and one of the best-known fish in Oregon's rivers and coastal waters.
- question: How big can a Chinook salmon get?
  answer: A Chinook salmon can weigh more than 50 pounds. Most weigh between 10 and 25 pounds.
- question: Why do Chinook salmon turn red?
  answer: When Chinook salmon leave the ocean and swim back up rivers to spawn, their bodies get darker and their bellies and fins turn red.
