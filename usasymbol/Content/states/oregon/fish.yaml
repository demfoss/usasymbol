seo_title: Oregon State Fish | Chinook Salmon
seo_description: The Oregon state fish is the Chinook salmon, adopted in 1961. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/oregon/oregon-fish-hero.webp
hero_image_alt: A large silver Chinook salmon with black spots on its back and tail swimming upstream in a river.
hero_image_caption: The Chinook salmon, Oregon's state fish, is the largest of the Pacific salmon.
intro_text: Oregon's state fish is the Chinook salmon, the largest of the Pacific salmon, adopted in 1961. Many people also call it the king salmon. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Oregon?
  paragraphs:
  - The Chinook salmon became Oregon's official state fish when the Oregon Legislature named it in 1961. Its scientific name is Oncorhynchus tshawytscha.
  - Chinook salmon hatch in rivers and streams, swim out to the Pacific Ocean, and later return to fresh water to spawn.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Chinook Salmon
  paragraphs:
  - The Chinook salmon is the biggest of the Pacific salmon. It can weigh more than 50 pounds, but most fish weigh 10 to 25 pounds.
  - In the ocean, it has a purple tint on its back and silvery sides and belly. Large black spots cover its back, and round black spots dot both halves of its tail.
  - When it returns to rivers to spawn, its body gets darker and its belly and fins turn red.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Oregon Legislature declared the Chinook salmon the official state fish in 1961. It did this with a joint resolution, and state law still lists the salmon among Oregon's official emblems.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Oregon Chose the Chinook Salmon
  paragraphs:
  - Official sources name the Chinook salmon as the state fish but don't give a detailed reason.
  - It is the largest Pacific salmon in the Northwest and has long been the most valuable to commercial fishing. Many of its runs are now protected as threatened or endangered.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Chinook Salmon
  paragraphs:
  - Chinook salmon live along the Oregon coast and swim up the Columbia River, the Willamette River and its tributaries, and dozens of coastal rivers and bays.
  - Spring Chinook start arriving in late winter. The fall run is the biggest of the year, and more than one million fish can return to fresh water.
