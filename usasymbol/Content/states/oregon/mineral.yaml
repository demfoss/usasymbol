faq:
  - question: What are Oregon's state minerals?
    answer: "Oregon's state minerals are oregonite and josephinite, a pair of rare nickel-iron minerals adopted together as the state's official twin minerals in 2013."
  - question: When did Oregon adopt oregonite and josephinite as its state minerals?
    answer: "The Oregon Legislature designated oregonite and josephinite the official state twin minerals in 2013."
  - question: Why did Oregon choose oregonite and josephinite?
    answer: "Both minerals were first identified together in the gravel of Josephine Creek, one of the only places on Earth where they occur, giving Oregon a scientifically distinctive pair to recognize."
  - question: Where can you find oregonite and josephinite in Oregon?
    answer: "Both were first found as nuggets in Josephine Creek near Kerby, in Josephine County, which remains their best-documented source."

