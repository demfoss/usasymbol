seo_title: "Oregon State Twin Minerals | Oregonite & Josephinite"
seo_description: "Oregon's state twin minerals are oregonite and josephinite, adopted in 2013. Both are rare nickel-iron minerals from Josephine Creek."
hero_image: /images/minerals/oregon/oregon-state-mineral-hero.webp
hero_image_alt: "Small, water-worn metallic nuggets of josephinite and oregonite from Josephine Creek, Oregon."
hero_image_caption: "Oregonite and josephinite, Oregon's official state twin minerals, occur as nuggets in Josephine Creek gravel."
intro_text: "Oregon's official state twin minerals are oregonite and josephinite, adopted together in 2013 to recognize two rare nickel-iron minerals found as water-worn nuggets in the gravel of Josephine Creek in southwestern Oregon. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Oregon State Twin Minerals
    paragraphs:
      - "Oregonite and josephinite are Oregon's official state twin minerals, adopted together by the Oregon Legislature in 2013. Both are rare nickel-iron minerals found as small, water-worn nuggets in the gravel of Josephine Creek in southwestern Oregon, and almost nowhere else in the country."
      - "Oregon paired the two rather than naming one because they were discovered together in the same creek gravels and share an unusual origin that scientists still study."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Are Oregonite and Josephinite?"
    paragraphs:
      - "Oregonite is a nickel-iron-arsenic mineral with a bronze to silvery gray color, while josephinite, also called awaruite, is a natural alloy of nickel and iron with a duller silvery white to gray metallic look. Both occur as small, rounded nuggets and grains rather than large crystals, worn smooth by the creek water that carried them."
      - "Naturally occurring nickel-iron combinations like these are unusual at Earth's surface; most nickel-iron alloys found in nature come from meteorites. Oregon's examples instead formed within ancient ultramafic rock and were later freed by erosion into the creek gravel."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Oregon Chose Oregonite and Josephinite as Its State Twin Minerals"
    paragraphs:
      - "Josephine Creek, in the far southwestern corner of the state, is one of the only places on the planet where oregonite and josephinite are found together. That rarity gave Oregon lawmakers a scientifically distinctive pair of minerals to name, rather than a single common material found in many states."
      - "The Oregon Legislature adopted the joint designation in 2013 to highlight earth science education, pairing a mineral named for the state itself, oregonite, with one named for Josephine County, josephinite, where both were first identified."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Oregonite and Josephinite Became Oregon's State Twin Minerals"
    paragraphs:
      - "The Oregon Legislature passed a resolution in 2013 naming oregonite and josephinite the state's official twin minerals, recognizing two rare minerals first identified in the same southwestern Oregon creek gravels."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Oregonite and Josephinite Are Found in Oregon"
    paragraphs:
      - "Both minerals were first found as nuggets in the gravel of Josephine Creek, near Kerby in Josephine County. The drainage remains the primary known source of oregonite and one of the few documented sources of josephinite anywhere."
    sites:
      - name: Josephine Creek
        city: Kerby
        lat: 42.1965
        lng: -123.6567
        note: "Source of oregonite and josephinite nuggets"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Oregonite and Josephinite Facts"
    facts:
      - "Adopted as Oregon's official state twin minerals in 2013."
      - "Oregonite is named for the state of Oregon; josephinite is named for Josephine County."
      - "Both minerals were first identified as nuggets in the gravel of Josephine Creek."
      - "Naturally occurring nickel-iron minerals like these are far more commonly associated with meteorites than with rock formed on Earth."

