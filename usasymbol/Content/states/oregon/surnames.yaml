seo:
  title: "Most Common Last Names in Oregon"
  description: "The most common last names in Oregon are Smith, Johnson, and Brown, with Scandinavian surnames ranking unusually high beside newer Latino growth."

page:
  h1: "Most Common Last Names in Oregon"
  intro: "The most common last names in Oregon in 2010 were Smith, Johnson, and Brown, a top three shaped first by Oregon Trail settlement and later by strong Scandinavian and Latino migration. The state's top 20 still carries the mark of Willamette Valley land claims, Astoria's fishing coast, and farmworker communities from Hood River to Woodburn."
  heritage_title: "Trail Claims, Salmon Ports, and Valley Fields"
  heritage_body: "Oregon's surname map begins with the Oregon Trail and the Donation Land Law of 1850, which drew white settlers into the Willamette, Umpqua, and Rogue valleys and fixed an Anglo-American core led by Smith, Johnson, Brown, and Miller. From the 1880s into the early twentieth century, Swedes and other Scandinavians settled Portland, Astoria, Coos Bay, and Columbia County towns such as Warren and Mayger, helping lift Anderson, Nelson, Peterson, Jensen, and Olsen higher than in many states. Astoria's salmon industry made that coastal layer especially visible; in 1896, Finnish and Scandinavian fishermen there built the Union Fishermen's Cooperative Packing Company after a strike. A later Mexican and Mexican American labor stream, centered in Hood River, Woodburn, and the broader Willamette Valley, pushed Garcia, Martinez, Lopez, Hernandez, and Rodriguez into Oregon's upper surname ranks by 2010."
  fun_fact: "Applegate, the surname of the family behind the Applegate Trail of 1846, still ranks inside Oregon's top 200 and remains unusually visible in southern Oregon place names as well as in the state's surname list."

surnames:
  - rank: 1
    name: Smith
    count: 32907
    ratio: 129
    origin: english
    type: Occupational
    meaning: "From Old English 'smiþ', a metalworker or blacksmith. Smith reached Oregon with trail-era settlers and stayed common as the Donation Land Law filled the Willamette Valley with farm, mill, and town families after 1850."

  - rank: 2
    name: Johnson
    count: 27264
    ratio: 155
    origin: scandinavian
    type: Patronymic
    meaning: "Son of John, often carried in Oregon through Scandinavian forms such as Johansson and Jonsson that were simplified in American records. Its high rank reflects both early Anglo settlement and the strong Nordic presence in Portland and the coast from the late nineteenth century onward."

  - rank: 3
    name: Brown
    count: 19997
    ratio: 212
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', originally a nickname for brown hair, complexion, or clothing. Brown is one of Oregon's broad pioneer surnames, common in the Willamette Valley and later just as at home in timber, railroad, and urban communities."

  - rank: 4
    name: Miller
    count: 19110
    ratio: 221
    origin: english
    type: Occupational
    meaning: "An occupational surname for a grain miller. Oregon's early farming valleys depended on sawmills and gristmills, so Miller fits both the pioneer economy of places such as Oregon City and the later farm belt of the interior valleys."

  - rank: 5
    name: Anderson
    count: 17763
    ratio: 238
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Anders or Andrew. Anderson ranks especially high in Oregon because Scandinavian immigrants settled Portland, Astoria, Coos Bay, and lower Columbia communities in large numbers between the 1880s and the early 1900s."

  - rank: 6
    name: Jones
    count: 16744
    ratio: 253
    origin: welsh
    type: Patronymic
    meaning: "A Welsh patronymic meaning son of John. Jones came west with migrants from the Ohio and Mississippi valleys, the same overland stream that fed the Great Migration to Oregon in the 1840s."

  - rank: 7
    name: Williams
    count: 16099
    ratio: 263
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic personal name Willahelm. In Oregon, Williams belongs to the durable British surname layer planted by settlers who claimed land west of the Cascades and later spread into towns and logging districts."

  - rank: 8
    name: Davis
    count: 15659
    ratio: 270
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from the Hebrew name Dawid, meaning beloved. Davis followed the same pioneer routes into Oregon and remained common because it fit both valley farm country and twentieth-century urban growth."

  - rank: 9
    name: Wilson
    count: 12551
    ratio: 337
    origin: scottish
    type: Patronymic
    meaning: "Son of Will, a short form of William. Wilson appears across Oregon's older settlement belt, from the lower Columbia and Portland to inland counties shaped by farming, timber, and rail connections."

  - rank: 10
    name: Thompson
    count: 10451
    ratio: 405
    origin: english
    type: Patronymic
    meaning: "Son of Thomas, with the inserted 'p' becoming standard in late medieval spelling. Thompson's Oregon rank reflects broad Anglo-American migration rather than one enclave, which is why it appears in both old valley settlements and newer metro counties."

  - rank: 11
    name: Nelson
    count: 10280
    ratio: 411
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Nels or Nils. Nelson sits unusually high in Oregon because Scandinavian settlement was unusually strong on the coast and in Portland, where Nordic churches, businesses, and fishing families stayed visible well into the twentieth century."

  - rank: 12
    name: Taylor
    count: 10153
    ratio: 417
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a cutter of cloth. Taylor is one of the trade surnames that traveled easily from trail camps and courthouse towns into Oregon's later suburbs and cities."

  - rank: 13
    name: Martin
    count: 10033
    ratio: 422
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', associated with Mars. In Oregon, Martin belongs to several streams at once, including older Anglo-American settlement, French Catholic roots in the Pacific Northwest, and later Latino migration."

  - rank: 14
    name: Clark
    count: 9853
    ratio: 429
    origin: english
    type: Occupational
    meaning: "From clerk, originally a literate or clerical worker. Clark fits Oregon's early administrative geography, where land offices, ports, and county seats expanded quickly after U.S. control and organized settlement."

  - rank: 15
    name: Moore
