    meaning: "A place-based surname for someone who lived near a moor or open ground, from Old English 'mor'. In Oregon it is another broad settler surname, found across the Willamette Valley and later inland ranching and timber communities."

  - rank: 16
    name: White
    count: 9485
    ratio: 446
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', usually a nickname for light hair or complexion. White remained common in Oregon because it was carried by multiple migration streams, from overland pioneers to later workers in mills, shipyards, and farms."

  - rank: 17
    name: Lee
    count: 9285
    ratio: 456
    origin: english
    type: Habitational
    meaning: "In English, Lee comes from Old English 'leah', a clearing or meadow, but in Oregon it also overlaps with Chinese and Korean surname traditions. That mixed origin helps explain why Lee ranks high in a state where Portland and the Willamette Valley added Asian communities long after the pioneer era."

  - rank: 18
    name: Thomas
    count: 8068
    ratio: 524
    origin: welsh
    type: Patronymic
    meaning: "From the Aramaic word for twin, carried into English and Welsh naming traditions. Thomas is typical of the older British surname pool that entered Oregon through overland settlement and never disappeared from the statewide top tier."

  - rank: 19
    name: Peterson
    count: 7988
    ratio: 530
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Peter, often anglicized from Petersen. Peterson's Oregon rank is a strong clue to the state's Nordic history, especially in coastal fishing towns and Portland-area Scandinavian neighborhoods."

  - rank: 20
    name: Baker
    count: 7857
    ratio: 538
    origin: english
    type: Occupational
    meaning: "An occupational surname for a maker of bread, from Old English 'baecere'. Baker fits a state whose first enduring Euro-American settlements were practical farm and market communities, not old colonial cities."

unique_surnames:
  - name: Applegate
    state_rank: 192
    national_rank: 1594
    origin: english
    why: "Applegate is an English habitational surname, usually explained as someone who lived near an apple orchard or gateway. In Oregon it stays unusually visible because Jesse Applegate helped open the Applegate Trail in 1846, and the family name still marks the Applegate Valley, Applegate River, and pioneer memory of southern Oregon."

  - name: Jensen
    state_rank: 56
    national_rank: 229
    origin: scandinavian
    why: "Jensen means son of Jens, the Danish form of John. Its Oregon rank is much higher than nationally because Scandinavian settlers clustered in Portland, Astoria, and lower Columbia communities after rail links, coastal industry, and new farmland drew them west in the late nineteenth and early twentieth centuries."

  - name: Christensen
    state_rank: 104
    national_rank: 372
    origin: scandinavian
    why: "Christensen means son of Christen or Christian. Oregon's unusually high rank reflects the same Nordic settlement belt that stretched from Portland neighborhoods to Columbia County and the coast, where Scandinavian churches, fishing crews, and lumber communities kept the name locally durable."

  - name: Olsen
    state_rank: 157
    national_rank: 497
    origin: scandinavian
    why: "Olsen means son of Ole or Olav. Oregon ranks it far above the national norm because Astoria's salmon economy and Portland's Scandinavian enclaves gave Norwegian and Danish surnames a stronger foothold here than in most Western states."

  - name: Nguyen
    state_rank: 21
    national_rank: 53
    origin: vietnamese
    why: "Nguyen is the most common Vietnamese surname and carries a modern Oregon story rather than a trail-era one. Refugees began settling in Oregon after 1975, and the Portland area became one of the state's main Vietnamese centers, helping push Nguyen to the edge of the top 20 by 2010."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Five of Oregon's top 20 are classic work names: Smith, Miller, Taylor, Clark, and Baker. That is a good fit for a state built by farm valleys, mill towns, ports, and practical frontier trades rather than by an older colonial elite."
    examples:
      - Smith (metalworker)
      - Miller (grain miller)
      - Taylor (tailor)
      - Clark (clerical worker)
      - Baker (bread maker)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Eleven of Oregon's top 20 are patronymics, including Johnson, Anderson, Jones, Williams, Davis, Wilson, Thompson, Nelson, Martin, Thomas, and Peterson. The category dominates because Oregon inherited a large British surname base from overland settlers and then added a strong Scandinavian layer that kept son-names unusually high."
    examples:
      - Johnson (son of John)
      - Anderson (son of Anders)
      - Williams (son of William)
      - Nelson (son of Nels)
      - Peterson (son of Peter)

  - type: Descriptive or Place-Based Names
    icon: fa-solid fa-map-location-dot
    description: "Brown, Moore, White, and Lee show Oregon's less specialized side, with broad surnames that could travel almost anywhere in the English-speaking world. Lee is the most revealing here, because in Oregon it can point either to an old English place-name surname or to later Chinese and Korean family lines in the Portland metro."
    examples:
      - Brown (brown hair or complexion)
      - Moore (near a moor)
      - White (fair hair or complexion)
      - Lee (clearing or meadow)

faq:
  - question: "What is the most common last name in Oregon?"
    answer: "Smith is the most common last name in Oregon in this dataset, followed by Johnson and Brown. The ranking reflects Oregon's large Anglo-American pioneer base, even though Scandinavian and Latino surnames are more visible here than in many other Western states."

  - question: "Why are Scandinavian last names so common in Oregon?"
    answer: "They are so common because Oregon drew large numbers of Swedish and other Scandinavian immigrants between the late 1800s and early 1900s. Portland, Astoria, Coos Bay, and lower Columbia communities gave surnames such as Anderson, Nelson, Peterson, Jensen, and Olsen a stronger foothold than they have in most states."

  - question: "Why are Hispanic surnames like Garcia and Martinez common in Oregon?"
    answer: "Mexican and Mexican American workers had been present in Oregon since the early twentieth century, and wartime labor programs brought many more between 1942 and 1947. Long-settled farmworker communities in places such as Hood River, Woodburn, and other Willamette Valley towns helped lift Garcia, Martinez, Lopez, Hernandez, and Rodriguez into the state's upper surname ranks."

