name_meaning:
  heading: What Does Oregon Mean?
  paragraphs:
  - Oregon joined the United States in 1859 as the 33rd state. The origin of the name Oregon is debated, with explanations tied to older maps, Indigenous languages, French usage, or Spanish references.
  - The uncertainty around the name contrasts with the clarity of the symbols. Beaver, Douglas fir, Oregon grape, and the two-sided flag make the state feel forested, riverine, and Pacific-facing.
  - Oregon's postal abbreviation is OR, and residents are Oregonians. The Beaver State nickname matches both the animal page and the reverse side of the state flag.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: The origin of Oregon is debated, with no single explanation universally accepted.
    - label: Statehood
      text: Oregon became the 33rd state in 1859.
    - label: Motto
      text: Alis Volat Propriis means She Flies With Her Own Wings.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Oregon, a Pacific Northwest state with coast, mountains, forests, high desert, and river valleys.
    - label: Territory
      text: Oregon also recalls the larger Oregon Country and Oregon Territory of the nineteenth century.
    - label: People
      text: People from Oregon are called Oregonians.
  - heading: Nicknames and Short Forms
    items:
    - label: The Beaver State
      text: Oregon's dominant nickname, tied to fur-trade history and the official state animal.
    - label: Pacific Northwest
      text: Oregon is one of the core states of the Pacific Northwest.
    - label: Abbreviation
      text: OR; older short form Ore.
editorial:
  heading: What Oregon's Symbols Say About the State
  paragraphs:
  - Oregon's [beaver](/states/oregon/mammal/beaver) is not a side detail. It connects the [Beaver State nickname](/states/oregon/nickname) to fur-trade history and to the reverse of the [state flag](/states/oregon/flag).
  - The [Douglas fir](/states/oregon/tree) and [Oregon grape](/states/oregon/flower) make the hub feel native to the Pacific Northwest instead of interchangeable with other western states.
  - The motto [Alis Volat Propriis](/states/oregon/motto) gives Oregon a self-governing tone, while the two-sided flag gives it one of the most unusual state-flag stories in the country.
faq:
- question: Does Oregon have a national park?
  answer: Yes. [Crater Lake National Park](/parks/national/crater-lake-national-park) is Oregon's national park, managed by the National Park Service.
- question: What is the Oregon state abbreviation?
  answer: The Oregon postal abbreviation is [OR](/states/oregon/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: What is Oregon's most famous state symbol?
  answer: The [beaver](/states/oregon/mammal/beaver) is Oregon's clearest symbol because it appears as the state animal, drives the Beaver State nickname, and appears on the flag's reverse.
- question: What is Oregon's state bird?
  answer: The [western meadowlark](/states/oregon/bird) has been Oregon's bird symbol since 1927.
- question: What is Oregon's state flower?
  answer: Oregon adopted the [Oregon grape](/states/oregon/flower) in 1899 as its flower emblem.
- question: Why is Oregon's flag unusual?
  answer: The [Oregon state flag](/states/oregon/flag) is known for having different designs on its two sides, including a beaver on the reverse.
- question: How many official state symbols does Oregon have?
  answer: Oregon's pages here include the flag, western meadowlark, Oregon grape, Douglas fir, motto, nickname, colors, milk, and beaver.
