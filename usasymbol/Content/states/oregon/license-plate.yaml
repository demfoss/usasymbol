- id: why-it-matters
  icon: fa-solid fa-circle-info
  title: Why the Dates Look Different
  paragraphs:
  - Sources describe the original Pacific Wonderland period in two slightly different ways. Oregon historical and legislative sources describe it as a centennial plate issued during 1959 and continuing to 1964.
  - Registration-plate chronology tables usually list the specific passenger base as 1960-1963, because that is the undated baseplate format used and revalidated with stickers.
  - The safest wording is that Pacific Wonderland was Oregon's centennial-era slogan, created for 1959 and used through 1964, with the standard passenger base commonly cataloged as 1960-1963.

timeline:
