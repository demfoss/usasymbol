sections:
- id: pacific-wonderland
  icon: fa-solid fa-mountain
  title: What "Pacific Wonderland" Means
  paragraphs:
  - '"Pacific Wonderland" was Oregon''s scenic tourism phrase for the state''s centennial period. It matched Oregon''s Pacific coastline, Cascade volcanoes, forests, rivers, high desert, and recreation identity.'
  - The Oregon Historical Society notes that Oregon schoolchildren helped create the original design for the 100th birthday of statehood. The plate used Oregon flag colors: a blue background with yellow lettering.
  - The phrase also became an unofficial Oregon nickname alongside the better-known Beaver State identity, but it did not stay on Oregon's regular passenger plates after the early 1960s.

- id: current-status
  icon: fa-solid fa-car-side
  title: Current Status
  paragraphs:
  - Oregon's current regular no-fee standard passenger design is the Standard Tree plate, not a Pacific Wonderland slogan plate. The tree plate is a visual identity design and does not carry a text slogan.
  - Pacific Wonderland returned as a special registration plate after the legislature authorized the program in 2009. DMV materials describe it as a re-creation of Oregon's historic OR 150 Pacific Wonderland plate, with surcharge money supporting the Oregon Historical Society and the Oregon State Capitol Foundation.
  - 'This distinction matters for accuracy: "Pacific Wonderland" is Oregon''s classic and available special-plate slogan, but Oregon''s current regular standard plate is slogan-free.'

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Oregon License Plate Slogans by Era
  paragraphs:
  - Oregon has a very short standard-slogan history compared with states that rotate slogans every few years. The main correction is separating the original general-issue slogan from the modern special plate.
