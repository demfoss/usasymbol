faq:
- question: What is Oregon's license plate slogan?
  answer: Oregon's classic license plate slogan is "Pacific Wonderland." The current regular Standard Tree plate has no text slogan, but Pacific Wonderland is available as a special plate.
- question: Is Pacific Wonderland Oregon's current standard plate slogan?
  answer: No. Oregon's regular no-fee Standard Tree plate has no slogan. Pacific Wonderland is a historic slogan and a modern special plate design.
- question: When did Oregon first use Pacific Wonderland?
  answer: Oregon created the Pacific Wonderland design for its 1959 statehood centennial. The original plates are generally described as issued from 1959 to 1964, with registration tables listing the passenger base as 1960-1963.
- question: Why did Pacific Wonderland return?
  answer: Oregon re-released the Pacific Wonderland plate for the state sesquicentennial/OR 150 program. The modern plate supports the Oregon Historical Society and Oregon State Capitol Foundation through surcharge revenue.
- question: What does Pacific Wonderland mean?
  answer: It refers to Oregon's Pacific coastline and varied landscapes, including forests, Cascade mountains, rivers, and high desert.

