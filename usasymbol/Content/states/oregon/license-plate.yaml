intro_text: '**"Pacific Wonderland"** is Oregon''s classic license plate slogan, created for the 1959 statehood centennial and used on blue-and-gold plates through the early 1960s. Oregon''s regular Standard Tree plate has no slogan, but Pacific Wonderland returned as a special plate tied to Oregon''s 150th anniversary and historical fundraising.'
quick_answer: 'Oregon''s historic license plate slogan is "Pacific Wonderland." The original blue-and-gold plates were issued around Oregon''s 1959 centennial and continued to 1964. Oregon''s current regular Standard Tree plate has no slogan, but Pacific Wonderland is available as a special plate re-released for the 2009 sesquicentennial/OR 150 program.'
