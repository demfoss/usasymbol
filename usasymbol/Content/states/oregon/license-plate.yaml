seo_title: 'Oregon License Plate Slogan: Pacific Wonderland History & Meaning'
seo_description: Oregon's classic license plate slogan is "Pacific Wonderland," first issued for Oregon's 1959 centennial and re-released as a special plate in 2009/2010. The current standard Tree plate has no slogan.
