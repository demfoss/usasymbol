sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Oregon's State Steak?"
    paragraphs:
      - "The T-bone is Oregon's official state steak, designated by the Oregon Legislative Assembly in 2025. It gets its name from the T-shaped bone that separates two cuts of meat, a strip steak and a piece of tenderloin, in a single steak."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the T-bone Steak"
    paragraphs:
      - "A T-bone steak is cut from the short loin of the cow and includes a T-shaped section of backbone that separates a strip steak on one side from a smaller piece of tenderloin on the other. Because it combines two different cuts in one steak, it is often grilled or pan-seared and served whole."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the T-bone Became Oregon's State Steak"
    paragraphs:
      - "The Oregon Legislative Assembly designated the T-bone the official state steak in 2025."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oregon Chose the T-bone"
    paragraphs:
      - "Cattle ranching is a major part of Oregon's agricultural economy, particularly in the state's eastern and central rangelands. The T-bone designation reflects that ranching industry rather than a single restaurant or recipe."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "T-bone Steak Facts"
    facts:
      - "Adopted as Oregon's state steak in 2025."
      - "The T-bone is cut from the short loin and includes both strip steak and tenderloin."
      - "Cattle ranching is concentrated in eastern and central Oregon."
      - "Beef cattle remain one of Oregon's leading agricultural products."

