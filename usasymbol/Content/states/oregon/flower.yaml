seo_title: "Oregon State Flower: Oregon Grape"
seo_description: "The Oregon Grape became Oregon's state flower in 1899. This evergreen shrub with yellow flowers and blue berries grows wild across Oregon forests."

intro_text: "Oregon designated the Oregon Grape as its official state flower in 1899, making it part of the [list of U.S. state flowers](/symbols/flowers). This native evergreen shrub produces clusters of bright yellow flowers in spring. Dark blue berries follow the blooms creating food for wildlife throughout Oregon's forests and mountains."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Oregon State Flower?"
    paragraphs:
      - "Oregon recognizes the Oregon Grape as its state flower. Bright yellow flowers bloom in dense clusters. Each cluster contains 25 to 75 individual flowers. The blooms measure about a quarter inch across. A sweet fragrance attracts early spring pollinators. Shiny evergreen leaves resemble holly with spiny edges."
      - "Oregon Grape blooms from March through May across the state. Peak flowering occurs in April in most regions. Coastal areas see earlier blooms than mountain elevations. The shrub grows 3 to 6 feet tall in typical conditions. Some specimens reach 10 feet in ideal locations. Dark blue berries ripen in late summer resembling small grapes. The berries have a waxy coating."
      - "This native shrub grows wild throughout Oregon forests from the Coast Range to the Cascade Mountains. The plant thrives in partial shade under Douglas fir and oak canopies. Well-drained acidic soil suits Oregon Grape best. The species appears in the Columbia River Gorge, Willamette Valley, and throughout western Oregon lowlands. Eastern Oregon's drier regions support the shrub in protected canyons. The evergreen foliage provides year-round habitat for birds and small mammals, especially in forests tied to [the Douglas Fir state tree](/states/oregon/tree/douglas-fir)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Oregon State Flower Name"
    paragraphs:
      - "This plant carries the common name Oregon Grape and the scientific name Mahonia aquifolium. The species belongs to the Berberidaceae family. This family includes barberries and about 700 species of shrubs found worldwide."
      - "The genus name Mahonia honors Irish-American horticulturist Bernard McMahon. The species name aquifolium means holly-leaved in Latin. It describes the spiny evergreen leaves. Common names include tall Oregon grape and holly-leaved barberry. The name Oregon grape confuses some people since the plant is not a true grape."
      - "The berries look like small grapes but taste quite tart. Native Americans harvested the berries for food and medicine. They used the yellow roots to make dye. Lewis and Clark documented Oregon Grape during their expedition. David Douglas collected specimens for European botanical gardens in the 1820s. The plant became popular in England before Oregonians recognized its value."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Oregon Chose the Oregon Grape"
    paragraphs:
      - "Oregon made the Oregon Grape its official state flower in 1899. This designation came only 40 years after Oregon achieved statehood. The legislature acted without organizing a formal public vote. The plant's name already connected it strongly to Oregon in people's minds and to what became [the Beaver State identity](/states/oregon/nickname/the-beaver-state)."
      - "Oregon Grape grew abundantly in forests throughout western Oregon. Settlers found the yellow flowers brightening spring woodlands. The evergreen leaves provided winter color. The berries fed wildlife and could be eaten by humans. The plant served medicinal purposes for Native Americans and pioneers."
      - "Some people suggested roses or wild rhododendrons instead. Oregon Grape supporters argued no plant bore Oregon's name more prominently. The shrub grew naturally only in the Pacific Northwest. Its widespread distribution throughout Oregon made it representative. The legislature agreed. Lawmakers passed the designation on February 13, 1899. Oregon became one of the earliest states to adopt an official floral emblem."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Oregon State Flower Facts"
    facts:
      - "Oregon Grape grows wild throughout Oregon forests from the Coast Range to the Cascade Mountains, thriving under Douglas fir and oak canopies"
      - "The yellow flowers contain berberine, the same compound that gives the roots their bright yellow color used for dye by Native Americans"
      - "Oregon adopted the Oregon Grape on February 13, 1899, becoming one of the earliest states to designate an official state flower"
      - "Despite its name, Oregon Grape is not related to true grapes but belongs to the barberry family with tart edible berries rich in vitamin C"
      - "Lewis and Clark documented Oregon Grape during their expedition, and botanist David Douglas later collected specimens for European gardens in the 1820s"
      - "The evergreen leaves turn bronze or purple in winter, providing year-round visual interest in Oregon landscapes and gardens"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Oregon State Flower and Bird"
    paragraphs:
      - "The Western Meadowlark serves as Oregon's state bird, a grassland songbird with bright yellow breast and melodious song. Both symbols represent Oregon officially. Oregon adopted the Oregon Grape in 1899 and designated the Western Meadowlark as state bird in 1927; compare [the meadowlark profile](/states/oregon/bird/western-meadowlark)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Oregon Grape commonly represents Oregon's Pacific Northwest identity and native plant heritage. The flower has been linked to resilience and adaptation through its ability to thrive in deep forest shade. Its evergreen nature traditionally symbolizes endurance while the bright yellow spring blooms carry connotations of renewal in Oregon's temperate rainforests and themes found in [Oregon's state motto](/states/oregon/motto/alis-volat-propriis)."

  - id: context
    icon: "fa-solid fa-chart-line"
    title: "Modern Context"
    paragraphs:
      - "Broader demographic context can be compared in [U.S. states by population](/rankings/demographics/states-by-population)."

faq:
  - question: "What is Oregon's state flower?"
    answer: "Oregon's state flower is the Oregon Grape, a native evergreen shrub that produces clusters of bright yellow flowers in spring followed by dark blue berries."
  
  - question: "When did Oregon adopt the Oregon Grape as its state flower?"
    answer: "Oregon adopted the Oregon Grape on February 13, 1899. This designation came only 40 years after Oregon achieved statehood."
  
  - question: "Why did Oregon choose the Oregon Grape?"
    answer: "Oregon chose the Oregon Grape because the plant bore Oregon's name prominently and grew naturally only in the Pacific Northwest. The shrub's widespread distribution throughout Oregon forests made it representative of the state. No other plant had such a strong connection to Oregon's identity."
  
  - question: "Is Oregon Grape really a grape?"
    answer: "No, Oregon Grape is not related to true grapes despite its name. The plant belongs to the barberry family. The common name comes from the dark blue berries that resemble small grapes, though they taste quite tart."
  
  - question: "When does Oregon Grape bloom in Oregon?"
    answer: "Oregon Grape blooms from March through May across Oregon, with peak flowering occurring in April. Coastal areas see earlier blooms than mountain elevations. The bright yellow flowers attract early spring pollinators."

