faq:
- question: What is Oregon's state beverage?
  answer: Oregon's official state beverage is milk, designated in 1997.
- question: Why did Oregon choose milk as its state beverage?
  answer: The choice honored Oregon's dairy industry, which has been central to the state's agricultural economy — particularly in Tillamook County and the Willamette Valley — for more than a century.
- question: When did Oregon designate milk as its state beverage?
  answer: Oregon designated milk as its official state beverage in 1997.
- question: Who proposed making milk Oregon's official state beverage?
  answer: Elementary school students from the Oregon Coast proposed the designation as part of a civics initiative. The legislature took up the proposal and passed it.
- question: Does Oregon have an official state beer or wine?
  answer: No. Oregon has never designated an official state beer, wine, or spirit. Milk is the only officially recognized state beverage.
- question: Is Oregon the only state with milk as its official beverage?
  answer: No. More than twenty U.S. states have designated milk as their official state beverage, reflecting the importance of dairy agriculture across much of the country.
- question: Why does Oregon's choice of milk feel surprising?
  answer: Oregon is better known culturally for its craft beer scene and Willamette Valley wine country than for its dairy industry. But dairy farming is older in Oregon than either of those industries, and the state's official symbol list reflects agriculture rather than cultural identity.
