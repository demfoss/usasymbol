seo_title: 'Oregon State Beverage: Why Oregon Chose Milk, Not Beer or Wine'
seo_description: Oregon's official state beverage is milk, designated in 1997 to honor the state's dairy industry — a surprise given Oregon's craft beer and wine culture. Learn who pushed for it and why.
intro_text: Oregon's official state beverage is <strong>milk</strong>, designated in <strong>1997</strong> to recognize the dairy industry's role in the state's agricultural economy. Not Pinot Noir. Not craft beer. Milk — and the choice came not from legislators making a political calculation but from elementary school students on the Oregon Coast who decided their state needed an official drink and knew exactly which one to nominate.
