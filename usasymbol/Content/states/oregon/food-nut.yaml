faq:
  - question: "What is Oregon's state nut?"
    answer: "Oregon's state nut is the hazelnut, also called the filbert, adopted by the Oregon Legislature in 1989."
  - question: "When did Oregon adopt the hazelnut as its state nut?"
    answer: "The Oregon Legislature designated the hazelnut the official state nut in 1989."
  - question: "Why did Oregon choose the hazelnut?"
    answer: "Oregon's Willamette Valley grows the large majority of the hazelnuts produced in the United States, making the hazelnut a natural choice for the state nut."
  - question: "Where does the hazelnut come from in Oregon?"
    answer: "Almost all of Oregon's hazelnut orchards are located in the Willamette Valley, which runs from the Portland area south past Eugene."

