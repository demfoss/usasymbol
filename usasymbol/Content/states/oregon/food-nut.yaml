date_modified: '2026-07-30'
seo_title: "Oregon State Nut | Hazelnut"
seo_description: "Oregon's state nut is the hazelnut, adopted in 1989. The state grows most of the country's hazelnut crop."
hero_image: /images/foods/oregon/oregon-state-nut-hero.webp
hero_image_alt: "A pile of whole hazelnuts, also called filberts, in their smooth round shells."
hero_image_caption: "The hazelnut, Oregon's official state nut, is grown mainly in the Willamette Valley."
intro_text: "Oregon's state nut is the hazelnut, also called the filbert, adopted in 1989 to recognize a crop grown almost entirely in Oregon's Willamette Valley. This profile appears in the [list of U.S. state foods](/symbols/nuts)."

sections:
  - id: overview
    icon: fa-solid fa-seedling
    title: "What Is Oregon's State Nut?"
    paragraphs:
      - "The hazelnut, also known as the filbert, is Oregon's official state nut, designated by the Oregon Legislature in 1989. Oregon grows the large majority of the hazelnuts produced in the United States, most of them in the Willamette Valley."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Hazelnut"
    paragraphs:
      - "Hazelnuts grow on small trees or shrubs, with each nut encased in a smooth round shell surrounded by a leafy husk. The trees thrive in the Willamette Valley's mild, wet climate. Oregon hazelnuts are sold roasted and raw, and used in baking, chocolate, and coffee flavoring."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Hazelnut Became Oregon's State Nut"
    paragraphs:
      - "The Oregon Legislature designated the hazelnut the official state nut in 1989, recognizing an industry that had been established in the Willamette Valley for decades."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oregon Chose the Hazelnut"
    paragraphs:
      - "Oregon's Willamette Valley produces the large majority of the hazelnuts grown in the United States, thanks to a climate well suited to the trees. That dominant share of the national crop made the hazelnut a clear choice for the state nut designation."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Hazelnut Comes From in Oregon"
    paragraphs:
      - "Nearly all of Oregon's hazelnut orchards are located in the Willamette Valley, which stretches from the Portland area south past Eugene and provides the mild winters and rainfall the trees need."
    sites:
      - name: Willamette Valley
        city: Salem
        lat: 44.9429
        lng: -123.0351
        note: "Center of Oregon's hazelnut growing region"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Hazelnut Facts"
    facts:
      - "Adopted as Oregon's state nut in 1989."
      - "Oregon grows the large majority of the hazelnuts produced in the United States."
      - "Almost all Oregon hazelnut orchards are in the Willamette Valley."
      - "The hazelnut is also commonly called the filbert."

