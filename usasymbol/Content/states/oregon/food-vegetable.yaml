sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Oregon's State Vegetable?"
    paragraphs:
      - "The potato is Oregon's official state vegetable, designated by the Oregon Legislative Assembly in 2023. Oregon grows a significant share of the nation's potatoes, concentrated in the irrigated farmland of the Columbia Basin."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Potato"
    paragraphs:
      - "Potatoes are starchy root vegetables grown underground and harvested in the fall. Oregon's Columbia Basin, with its irrigated volcanic soil, produces large amounts of russet potatoes used for fresh eating and processing into fries and other potato products."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Potato Became Oregon's State Vegetable"
    paragraphs:
      - "The Oregon Legislative Assembly designated the potato the official state vegetable in 2023, recognizing the crop's long-standing importance to farmers in eastern Oregon."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oregon Chose the Potato"
    paragraphs:
      - "Oregon chose the potato because the state is one of the top potato producers in the country, with the Columbia Basin region providing ideal irrigated growing conditions for the crop."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Potato Comes From in Oregon"
    paragraphs:
      - "Most Oregon potatoes are grown in the Columbia Basin in the northeastern part of the state, around towns like Hermiston and Ontario, where irrigation supports large-scale farming."
    sites:
      - name: Columbia Basin
        city: Hermiston
