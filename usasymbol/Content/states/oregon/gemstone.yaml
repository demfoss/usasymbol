    answer: "Oregon's state gemstone is Oregon sunstone, a copper-bearing variety of labradorite feldspar adopted in 1987."
  - question: When did Oregon adopt sunstone as its state gemstone?
    answer: "The Oregon Legislature designated Oregon sunstone the official state gemstone in 1987."
  - question: Why did Oregon choose sunstone?
    answer: "Oregon's high desert deposits are the only known source of transparent, gem-quality, copper-bearing sunstone in the world."
  - question: Where can you find Oregon sunstone in Oregon?
    answer: "The main deposits sit in the Rabbit Basin of Lake County near Plush, where the Bureau of Land Management runs a free public collection area."

