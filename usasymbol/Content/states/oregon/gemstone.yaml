intro_text: "Oregon's state gemstone is Oregon sunstone, adopted in 1987 to recognize a copper-bearing labradorite feldspar mined in the state's high desert and found in gem quality almost nowhere else. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Oregon State Gemstone
    paragraphs:
      - "Oregon sunstone is the state's official gemstone, adopted by the Oregon Legislature in 1987. It is a variety of labradorite feldspar found in gem quality almost nowhere else, prized for copper flecks inside that flash and sparkle as the stone turns."
      - "Oregon named the stone its gem symbol because the state's high desert deposits produce a color range and clarity not matched by sunstone from other parts of the world."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Oregon Sunstone?"
    paragraphs:
      - "Oregon sunstone is a feldspar mineral that can appear clear, pale yellow, pink, green, or a deep red, sometimes shifting between two colors in the same stone. Tiny copper platelets scattered through the crystal catch and reflect light, producing a glittering effect called schiller that gives sunstone its name."
      - "Oregon sunstone belongs to the labradorite family, a common feldspar, but its copper-bearing material is unusually transparent and rarely needs heating or treatment before cutting. Rough stones form as small, flattened crystals scattered through basalt lava flows in the state's high desert."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Oregon Chose Oregon Sunstone as Its State Gemstone"
    paragraphs:
      - "Oregon's sunstone deposits, concentrated in the high desert of Lake and Harney counties, are the only known source of gem-quality, copper-bearing sunstone in the world. That rarity, combined with the stone's natural, untreated color, set it apart from gemstones mined elsewhere."
      - "Lawmakers named sunstone the state gemstone in 1987 to recognize a stone unique to Oregon's own geology rather than an imported gem. Public collecting areas opened later let visitors dig their own sunstone for free, building the gem into the state's rockhounding tourism."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Oregon Sunstone Became Oregon's State Gemstone"
    paragraphs:
      - "The Oregon Legislature designated sunstone the official state gemstone in 1987, recognizing the state's copper-bearing labradorite deposits as a resource unmatched elsewhere."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Oregon Sunstone Is Found in Oregon"
    paragraphs:
      - "The main deposits lie in the Rabbit Basin of Lake County, near the small community of Plush. The Bureau of Land Management maintains a public collection area there where visitors can search for sunstone on the surface, often without digging."
    sites:
      - name: Oregon Sunstone Public Collection Area
        city: Plush
        lat: 42.5057
        lng: -119.8973
        note: "Public collecting area for Oregon sunstone"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Oregon Sunstone Facts"
    facts:
      - "Adopted as Oregon's state gemstone in 1987."
      - "Copper inclusions, not a different mineral, cause the glittering schiller effect inside Oregon sunstone."
      - "Oregon is the only place known to produce transparent, gem-quality sunstone with copper inclusions."
      - "The Bureau of Land Management runs a free public collection area near Plush, in Lake County."

