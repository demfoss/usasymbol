- id: facts
  icon: fa-solid fa-lightbulb
  title: Mammoth Facts
  facts:
  - "Nebraska designated the mammoth as its state fossil in 1967, one of the first states to create this designation."
  - "Three species are recognized: the woolly mammoth (M. primigenius), Columbian mammoth (M. columbi), and imperial mammoth (M. imperator)."
  - "The imperial mammoth stood up to 14 feet at the shoulder and could weigh 10 tons, making it one of the largest land mammals ever."
  - "Archie, the University of Nebraska State Museum's mounted Columbian mammoth, is one of the largest mounted mammoth skeletons on public display in the world."
  - "Mammoth molars have flat ridged surfaces for grinding grass — easy to distinguish from mastodon teeth, which have sharp cone-shaped cusps for chewing branches."

