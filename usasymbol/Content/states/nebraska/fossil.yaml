faq:
- question: What is Nebraska's state fossil?
  answer: "Nebraska's state fossil is the mammoth, covering three Ice Age species: the woolly mammoth (Mammuthus primigenius), the Columbian mammoth (Mammuthus columbi), and the imperial mammoth (Mammuthus imperator), designated in 1967."
- question: When did Nebraska adopt its state fossil?
  answer: "Nebraska designated the mammoth as its state fossil in 1967, one of the earliest state fossil designations in the country."
- question: What did the mammoth look like?
  answer: "Nebraska's mammoths ranged from the woolly mammoth at about 9 to 11 feet tall to the imperial mammoth at up to 14 feet tall and 10 tons. All had long curved tusks and high-ridged teeth for grinding grass."
- question: Where are mammoth fossils found in Nebraska?
  answer: "Mammoth fossils have been found across Nebraska, with the highest density in the Platte and Republican river valleys. The University of Nebraska State Museum in Lincoln displays Archie, one of the world's largest mounted Columbian mammoth skeletons."
- question: When did the mammoth live?
  answer: "Nebraska's mammoths lived during the Pleistocene epoch, from about 2.6 million years ago until their extinction about 10,000 years ago at the end of the last Ice Age."
- question: Why does Nebraska have three mammoth species as its state fossil?
  answer: "All three species — woolly, Columbian, and imperial — have been found in Nebraska's Pleistocene deposits, and the state's designation covers the genus broadly rather than singling out one species."

