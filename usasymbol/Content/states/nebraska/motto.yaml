faq:
  - question: "What is Nebraska's state motto?"
    answer: "Nebraska's state motto is \"Equality Before the Law.\" It was adopted on June 14, 1867, as part of the state seal legislation signed by Governor David Butler."

  - question: "What does Nebraska's motto mean?"
    answer: "It means that every person is subject to the same laws and entitled to the same legal protections, regardless of race or background. In 1867, this carried a specific meaning: extending legal equality to Black Americans after the Civil War."

  - question: "When did Nebraska adopt its state motto?"
    answer: "On June 14, 1867, just 105 days after Nebraska became the 37th state on March 1, 1867. Governor David Butler signed it into law under H.R. 41."

  - question: "Who proposed Nebraska's state motto?"
    answer: "Isaac Wiles, a state House member from Plattsmouth, proposed the motto. He consulted Nebraska Supreme Court Justice Elmer Dundy, who preferred \"Equality Before the Law\" over the other option, \"Equal Rights for All.\""

  - question: "Why did Nebraska choose this motto?"
    answer: "Congress had required Nebraska to remove racial voting restrictions as a condition of statehood. The phrase reflected the Republican position on legal equality after the Civil War and came directly from the Nebraska Republican platform of April 12, 1866."

  - question: "Where does Nebraska's motto appear?"
    answer: "In capital letters around the upper arc of the Nebraska state seal. The seal appears on the state flag, adopted by statute in 1963, which shows the seal in gold and silver on a blue field."

