seo_title: "Nebraska State Motto | Equality Before the Law"
seo_description: "Nebraska's state motto is \"Equality Before the Law.\" Adopted June 14, 1867, it came from the post-Civil War debate over voting rights and equal treatment."

intro_text: "Nebraska's state motto is <strong>Equality Before the Law</strong>. Adopted on June 14, 1867, just 105 days after Nebraska became the 37th state, it was proposed by legislator Isaac Wiles in the context of the post-Civil War fight over equal voting rights."

