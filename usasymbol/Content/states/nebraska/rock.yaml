faq:
  - question: What is Nebraska's state rock?
    answer: "Nebraska's state rock is prairie agate, a rounded, multicolored variety of chalcedony adopted by the Nebraska Legislature in 1967."
  - question: When did Nebraska adopt prairie agate as its state rock?
    answer: "The Nebraska Legislature designated prairie agate the official state rock in 1967."
  - question: Why did Nebraska choose prairie agate?
    answer: "Prairie agate is common in the badlands of Nebraska's panhandle and remains popular with the state's rockhounding community, making it a stone Nebraskans can readily find and collect."
  - question: Where can you find prairie agate in Nebraska?
    answer: "The Oglala National Grassland in Sioux and Dawes counties, in Nebraska's far northwest panhandle, is the state's best-known source of prairie agate."

