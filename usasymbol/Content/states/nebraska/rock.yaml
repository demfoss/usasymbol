sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Nebraska State Rock
    paragraphs:
      - "Prairie agate is Nebraska's official state rock, designated by the Nebraska Legislature in 1967. It is a variety of chalcedony, a form of quartz, gathered as loose, weathered pebbles rather than quarried from solid rock."
      - "Nebraska chose prairie agate because it is genuinely common in the state's northwest panhandle, where generations of rockhounds have collected it from the eroded badlands of the Oglala National Grassland."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Prairie Agate?"
    paragraphs:
      - "Prairie agate is a rounded, irregularly shaped stone in shades of red, orange, yellow, and white. Unlike most agates, it rarely shows the concentric banding that gives agate its name, which is one reason collectors can pick it out from other stones in the same gravel."
      - "Prairie agate formed when silica-rich groundwater filled cavities in ancient volcanic ash and gravel deposits, hardening into chalcedony over millions of years. Erosion later freed the nodules from the surrounding rock, leaving them scattered across the ground as loose pebbles."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Nebraska Chose Prairie Agate as Its State Rock"
    paragraphs:
      - "Prairie agate is abundant in the badlands of Nebraska's panhandle, particularly within the Oglala National Grassland, making it a stone that ordinary Nebraskans could actually go out and find. That accessibility, rather than any rarity or commercial value, made it a natural fit for a state symbol."
      - "State lawmakers named prairie agate the official state rock in 1967 without recording an elaborate reason beyond its local abundance and its long popularity with the state's rockhounding hobbyists."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Prairie Agate Became Nebraska's State Rock"
    paragraphs:
      - "The Nebraska Legislature designated prairie agate the official state rock in 1967, the same year it named blue chalcedony the state gemstone, formally recognizing two stones already well known to the state's rock collectors."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Prairie Agate Is Found in Nebraska"
    paragraphs:
      - "The Oglala National Grassland, spanning Sioux and Dawes counties in Nebraska's far northwest panhandle, is the state's best-known source of prairie agate. Collectors search the eroded badlands terrain around sites like Toadstool Geologic Park, where erosion regularly exposes fresh gravel."
    sites:
      - name: Toadstool Geologic Park
        city: Crawford
        lat: 42.8578
        lng: -103.5839
        note: "Badlands site within the Oglala National Grassland"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Prairie Agate Facts"
    facts:
      - "Adopted as Nebraska's state rock in 1967."
      - "Unlike most agates, prairie agate rarely shows the ringed banding typical of the stone, which helps collectors tell it apart from other agates."
      - "The Oglala National Grassland in Nebraska's panhandle is considered the state's most productive public rockhounding area."
      - "Prairie agate is a variety of chalcedony, the same quartz family as onyx and carnelian."

