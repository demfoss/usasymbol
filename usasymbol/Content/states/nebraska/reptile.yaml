sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Nebraska?
    paragraphs:
      - "The ornate box turtle is Nebraska's official state reptile, designated by the Nebraska Legislature in 1986. Its scientific name is Terrapene ornata ornata, and it is a land-dwelling turtle adapted to dry prairie habitat."
      - "It is found across much of Nebraska's grasslands and sandy prairie regions."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Ornate Box Turtle
    paragraphs:
      - "The ornate box turtle has a dark brown to black domed shell marked with bright yellow radiating lines, which gives the species its name."
      - "Like other box turtles, it has a hinged lower shell that closes tightly to protect its head and legs from predators."
      - "Adults usually grow to about 4 to 5 inches long and are well suited to dry, open grassland rather than wet or forested areas."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Nebraska Legislature designated the ornate box turtle the official state reptile in 1986, recognizing a turtle closely tied to the state's prairie landscape."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Nebraska Chose the Ornate Box Turtle
    paragraphs:
      - "The ornate box turtle is well adapted to Nebraska's dry grasslands and sandhills, making it one of the reptiles most closely associated with the state's native prairie habitat."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Ornate Box Turtle
    paragraphs:
      - "Ornate box turtles are found across Nebraska's prairies and sandy grasslands, including the Sandhills region in the north-central part of the state."
