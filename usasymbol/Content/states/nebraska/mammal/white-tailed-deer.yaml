faq:
  - question: "What is Nebraska's state mammal?"
    answer: "Nebraska's state mammal is the white-tailed deer (Odocoileus virginianus), designated in 1981 through Legislative Bill 27. The species was chosen to honor its recovery from near-extinction and importance to Nebraska's hunting heritage and outdoor recreation economy."

  - question: "When was the white-tailed deer designated as Nebraska's state mammal?"
    answer: "The white-tailed deer became Nebraska's official state mammal in 1981, recognizing the species' successful population recovery and cultural importance to the state's hunting traditions that generate hundreds of millions in annual economic activity."

  - question: "Why did Nebraska choose the white-tailed deer as its state mammal?"
    answer: "Nebraska chose the white-tailed deer because it represents one of American wildlife conservation's greatest success stories—recovering from near-zero populations in the 1890s to healthy numbers supporting sustainable hunting. The species embodies Nebraska's outdoor heritage, with deer hunting contributing $848 million annually to the state's economy. The designation celebrated both historical abundance and modern conservation achievements."

  - question: "Where can I see white-tailed deer in Nebraska?"
    answer: "You can see white-tailed deer at virtually any Nebraska state park, particularly Ponca State Park, Indian Cave State Park, Niobrara State Park, and Platte River State Park. Deer are most visible at dawn and dusk along wooded streams, river valleys, and agricultural edges throughout the state. Look for them in cottonwood forests and shelterbelts during evening hours."

  - question: "How many white-tailed deer live in Nebraska?"
    answer: "Nebraska maintains healthy white-tailed deer populations throughout the state, with densities reaching 30 deer per square mile in prime eastern habitat. Annual hunting harvests typically include 15,000-25,000 white-tailed bucks plus managed antlerless harvest, suggesting populations in the hundreds of thousands statewide. The Nebraska Game and Parks Commission monitors populations and adjusts hunting regulations to maintain sustainable numbers."

  - question: "Did white-tailed deer almost go extinct?"
    answer: "Yes—white-tailed deer nearly went extinct across North America, including in Nebraska. By 1890, market hunting had reduced North American white-tailed deer populations from approximately 30 million to only 300,000. Nebraska was among 14 states that counted whitetail herds at near-zero. Recovery began in the early 1900s through hunting regulations, habitat restoration, and wildlife management funding from hunting license fees and equipment taxes."

  - question: "Why are there so many white-tailed deer in Nebraska now?"
    answer: "White-tailed deer populations recovered through regulated hunting seasons protecting breeding populations, habitat management improving food and cover, and the 1937 Pittman-Robertson Act funding wildlife restoration through hunting equipment taxes. Deer also adapted well to Nebraska's agricultural landscape, thriving in the mix of cornfields, woodlots, and shelterbelts. By the 1960s, populations supported modern hunting seasons, and numbers have remained stable since."

  - question: "How do white-tailed deer and mule deer differ in Nebraska?"
    answer: "White-tailed deer and mule deer inhabit different Nebraska regions—whitetails dominate eastern river valleys and forested areas while mule deer prefer western grasslands and open terrain. Whitetails are identified by their large white tail raised when alarmed, smaller ears, and branched antlers. Mule deer have large mule-like ears, white rump patch, black-tipped tail, and antlers that fork rather than branch from a main beam. Whitetails are generally more abundant in Nebraska."

