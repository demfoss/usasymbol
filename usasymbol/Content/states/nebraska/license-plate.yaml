seo_title: 'Nebraska License Plate Slogan: Cornhusker State, Beef State & Plate History'
seo_description: Nebraska's traditional plate slogans were "The Beef State" and "Cornhusker State." The current 2023-present standard plate has no slogan and uses the Genius of Creative Energy design.
hero_image: /images/license-plates/nebraska/2023-genius-creative-energy.jpg
hero_image_alt: Nebraska 2023 standard license plate with Genius of Creative Energy mosaic background
hero_image_caption: Nebraska's 2023-present standard plate has no slogan; its pale mosaic background comes from the State Capitol artwork "Genius of Creative Energy."
intro_text: '**"Cornhusker State"** was Nebraska''s last traditional license plate slogan, used on the 1969-1975 standard plate base. Before that, Nebraska plates said **"The Beef State"** from 1956 through 1965. The current Nebraska standard plate, issued for the 2023-present cycle, has no slogan at all; it uses artwork based on the Nebraska State Capitol mosaic "Genius of Creative Energy."'
quick_answer: 'Nebraska does not currently have a traditional slogan on its standard license plate. Its last traditional plate slogan was "Cornhusker State," used from 1969 through 1975. Earlier, plates used "The Beef State" from 1956 through 1965.'
