  - name: CORNHUSKER STATE
    years: 1969-1975
    image: /images/license-plates/nebraska/1969-cornhusker-state.jpg
    description: Nebraska's last traditional standard-plate slogan. The 1969-1971 and 1972-1975 bases both used "Cornhusker State."
  - name: 1776 BICENTENNIAL 1976
    years: 1976-1983
    image: /images/license-plates/nebraska/1976-bicentennial.jpg
    description: A U.S. Bicentennial inscription replaced the state nickname slogan on the 1976-1983 base.
  - name: www.state.ne.us
    years: 2002-2004
    image: /images/license-plates/nebraska/2002-state-website.jpg
    description: Nebraska began using website text on standard plates in 2002.
  - name: www.Nebraska.gov
    years: 2005-2010
    image: /images/license-plates/nebraska/2005-nebraska-gov.jpg
    description: The next base continued the website approach with the Nebraska.gov address.
  - name: Nebraska.gov
    years: 2011-2016
    image: /images/license-plates/nebraska/2011-nebraska-gov.jpg
    description: The 2011-2016 base shortened the web address to "Nebraska.gov."
  - name: 1867 and 2017
    years: 2017-2022
    image: /images/license-plates/nebraska/2017-sesquicentennial.jpg
    description: Nebraska's sesquicentennial plate used statehood dates and The Sower statue from the State Capitol, not a traditional slogan.
  - name: No slogan / Genius of Creative Energy
    years: 2023-present
    image: /images/license-plates/nebraska/2023-genius-creative-energy.jpg
