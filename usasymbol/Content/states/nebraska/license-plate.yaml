timeline:
- year: '1956'
  description: Nebraska begins using "THE BEEF STATE" on standard plates.
- year: '1966'
  description: Nebraska issues a Statehood Centennial base for the 100th anniversary of statehood in 1867.
- year: '1969'
  description: '"CORNHUSKER STATE" appears on the standard plate base and continues through the 1975 registration cycle.'
- year: '1976'
  description: Nebraska switches to a U.S. Bicentennial base carrying "1776 BICENTENNIAL 1976."
- year: '2002'
  description: Nebraska begins the website era with "www.state.ne.us" on standard plates.
- year: '2005'
  description: The website text changes to "www.Nebraska.gov."
- year: '2011'
  description: The website text shortens to "Nebraska.gov" on the 2011-2016 base.
- year: '2017'
  description: Nebraska issues the 2017-2022 sesquicentennial plate with "1867" and "2017" and The Sower image.
- year: '2023'
  description: Nebraska introduces the current no-slogan standard plate using the Genius of Creative Energy mosaic.

faq:
- question: What is Nebraska's current license plate slogan?
  answer: Nebraska's current 2023-present standard plate has no traditional slogan. It uses the Genius of Creative Energy mosaic from the Nebraska State Capitol.
- question: What was Nebraska's last traditional plate slogan?
  answer: Nebraska's last traditional standard-plate slogan was "Cornhusker State," used from 1969 through 1975.
- question: When did Nebraska use "The Beef State"?
  answer: Nebraska used "The Beef State" on standard plates from 1956 through 1965.
- question: Did Nebraska use "Cornhusker State" for only one year?
  answer: No. The slogan began with the 1969 base and continued through the 1975 plate cycle.
- question: What did Nebraska plates say during the website era?
  answer: Nebraska used "www.state.ne.us" from 2002 to 2004, "www.Nebraska.gov" from 2005 to 2010, and "Nebraska.gov" from 2011 to 2016.
- question: What was on the 2017 Nebraska plate?
  answer: The 2017-2022 plate commemorated Nebraska's 150th anniversary of statehood with "1867" and "2017" and an image of The Sower from the Nebraska State Capitol.

