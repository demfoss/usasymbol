seo_description: "Nebraska named Kool-Aid its state soft drink in 1998, honoring Edwin Perkins and the Hastings invention story."
intro_text: '<strong>Kool-Aid is the official state soft drink of Nebraska</strong>, designated in <strong>1998</strong> because the drink was invented there — in Hastings, by Edwin Perkins, in 1927. That origin story is the whole reason for the designation: Nebraska is not claiming a popular drink; it is claiming an invention. Nebraska also designates [milk as its state beverage](/states/nebraska/beverage/milk) — a separate symbol in a separate category. This profile appears in the [list of U.S. state beverages](/symbols/beverages).'
