sections:
- id: answer-fast
  icon: fa-solid fa-circle-info
  title: What Is the Official State Soft Drink of Nebraska?
  paragraphs:
  - Nebraska's official state soft drink is <strong>Kool-Aid</strong>, designated in <strong>1998</strong> because the drink was invented in Hastings by Edwin Perkins — giving Nebraska a rare soft drink designation with an unambiguous, homegrown origin story. Most states that designate a soft drink are simply endorsing a regional preference. Nebraska is marking a birthplace.
  - The state already designates milk as its official state beverage. Kool-Aid is a separate symbol in a separate category.
- id: why-kool-aid
  icon: fa-solid fa-bullseye
  title: The Nebraska Origin That Made Kool-Aid a State Symbol
  paragraphs:
  - The reason is geographic and historical, not promotional. Edwin Perkins was a Hastings resident when he converted Fruit Smack into a powdered drink mix in 1927. He named it Kool-Aid, launched it from his home, and built its early distribution through a mail-order catalog he ran out of the same Nebraska town. The product's entire formative period — the invention, the reformulation, the Depression-era pricing strategy — took place in Nebraska.
  - The [Nebraska Legislature](https://nebraskalegislature.gov/) treated the 1998 designation as a record, not a marketing decision — a statement that a globally distributed product has a specific Nebraska address at its origin. That kind of clean provenance is uncommon for an official state symbol. Most symbols recognize something abundant or native. Kool-Aid recognizes something invented.
- id: edwin-perkins
  icon: fa-solid fa-person
  title: 'Edwin Perkins: The Hastings Inventor Behind Kool-Aid'
  paragraphs:
  - Edwin Perkins was not a laboratory scientist — he was a self-taught entrepreneur who had been developing mail-order products since his teens. By the early 1920s, he was operating out of Hastings, running a catalog that included food products, flavoring extracts, and household goods. One of those products was Fruit Smack, a bottled liquid concentrate designed to be mixed with water and served as a soft drink.
  - 'Fruit Smack had a fundamental problem: it was heavy, expensive to ship, and fragile in transit. For a mail-order business dependent on reliable, low-cost delivery, glass bottles were a liability.'
- id: fruit-smack-to-kool-aid
  icon: fa-solid fa-flask
  title: 'How Fruit Smack Became Kool-Aid: The 1927 Invention in Hastings'
  paragraphs:
  - In <strong>1927</strong>, Perkins eliminated the liquid from Fruit Smack entirely. He concentrated the flavoring into a dry powder, packed it in a paper envelope, and produced something that weighed almost nothing, survived shipping without breakage, and cost a fraction of the bottled version to store and deliver. He called the first version <strong>Kool-Ade</strong> — the spelling shifted to Kool-Aid not long after.
  - The original product launched in <strong>six flavors</strong> and sold for <strong>ten cents per packet</strong>. That price point turned out to be decisive. Through the Great Depression, as household budgets collapsed across the country, Perkins kept the dime price intact. Families who could no longer afford bottled soda could still afford Kool-Aid. A practical packaging decision made in Hastings, Nebraska, in the late 1920s ended up shaping the drink habits of a generation.
- id: hastings-connection
  icon: fa-solid fa-map-pin
  title: Why Kool-Aid Still Belongs to Nebraska
  paragraphs:
  - Perkins eventually moved his operation to Chicago as the brand scaled beyond what Hastings could support. Kool-Aid passed through corporate ownership, became a mass-market staple, and long ago lost any operational connection to Nebraska. What Hastings kept was the origin story — and it has never been shy about it.
  - The city holds an annual <strong>Kool-Aid Days</strong> festival, not as a tribute to a forgotten local product but as an acknowledgment that the drink served globally was formulated on a residential street in south-central Nebraska. The 1998 [state soft drink designation](/states/nebraska) made that connection official. Its invention happened in Hastings.
timeline:
- year: Early 1920s
  description: Edwin Perkins operates a mail-order catalog business from Hastings, Nebraska, selling food products and household goods including Fruit Smack, a bottled liquid soft drink concentrate
- year: '1927'
  description: Perkins removes the liquid from Fruit Smack and creates a dry powdered concentrate, initially called Kool-Ade; product launches in six flavors at ten cents per packet
- year: 1927–1930s
  description: Perkins holds the ten-cent price through the Great Depression; the accessible price drives national adoption and turns Kool-Aid into a household staple across the country
- year: '1998'
  description: Nebraska designates Kool-Aid the official state soft drink, citing its invention in Hastings by Edwin Perkins as the basis for the recognition
faq:
- question: What is the official state soft drink of Nebraska?
  answer: Nebraska's official state soft drink is Kool-Aid, designated in 1998.
- question: Who invented Kool-Aid and where?
  answer: Edwin Perkins invented Kool-Aid in Hastings, Nebraska in 1927. He developed it by converting an earlier product called Fruit Smack — a bottled liquid concentrate — into a dry powdered mix that was cheaper to produce and easier to ship.
- question: Why did Nebraska choose Kool-Aid as its state soft drink?
  answer: Nebraska chose Kool-Aid because it was invented in Hastings by Edwin Perkins. The 1998 designation recognized a specific Nebraska invention — not just a popular drink, but a product whose entire origin belongs to the state.
- question: Is Kool-Aid Nebraska's state beverage?
  answer: No. Nebraska's official state beverage is milk. Kool-Aid is the official state soft drink — a separate category with a separate designation.
- question: What was Fruit Smack?
  answer: Fruit Smack was a bottled liquid soft drink concentrate sold by Edwin Perkins before Kool-Aid existed. In 1927, Perkins removed the liquid and reformulated it as a dry powder to reduce shipping costs and fragility. He renamed the result Kool-Ade, later Kool-Aid.
- question: When was Kool-Aid invented?
  answer: 1927, in Hastings, Nebraska, by Edwin Perkins.
- question: When did Nebraska designate Kool-Aid as its state soft drink?
  answer: Nebraska designated Kool-Aid as its official state soft drink in 1998.
- question: What is Kool-Aid Days?
  answer: Kool-Aid Days is an annual festival held in Hastings, Nebraska, celebrating the drink's invention in the city by Edwin Perkins in 1927.
