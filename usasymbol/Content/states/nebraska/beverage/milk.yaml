seo_title: "Nebraska State Beverage | Milk"
seo_description: "Nebraska made milk its state beverage in 1998, pairing it with Kool-Aid as the state's other official drink."
intro_text: '<strong>Milk is Nebraska''s official state beverage</strong>, designated in <strong>1998</strong> by the Nebraska Legislature. Nebraska is cattle country, and milk is what cattle — and Nebraska farms — produce. In the same session, the legislature also designated [Kool-Aid as the official state soft drink](/states/nebraska/beverage/kool-aid), giving the state two drink symbols that could not be more different: one is a product of the prairie farm, the other is a product of a Hastings inventor''s garage. Milk is the older story.'
