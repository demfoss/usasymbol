author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-16"
seo_title: "Nebraska State Nickname: The Cornhusker State"
seo_description: "Nebraska is called the Cornhusker State because corn farming played a central role in the state’s agricultural history and identity."

intro_text: "Nebraska became known as <i>the Cornhusker State</i> when the legislature officially adopted this name in 1945. The Nebraska nickname came from the University of Nebraska athletic teams, who started using Cornhuskers in 1900. Before machines existed to harvest corn, workers removed husks from corn ears by hand, a job called cornhusking, while formal civic wording remained in the [Nebraska state motto](/states/nebraska/motto/equality-before-the-law)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Cornhusker State'"
    paragraphs:
      - "A cornhusker was someone who picked and husked corn in fields before mechanical harvesters existed. Early Nebraska settlers grew massive amounts of corn across the plains after the Homestead Act of 1862 brought farmers westward. Workers could earn up to five dollars per day husking corn in the early 1900s, which was significant money for rural farmworkers at that time and is still reflected in the [Nebraska state colors tradition](/states/nebraska/color/nebraska-traditional-state-colors-scarlet-and-cream)."
      - "Sportswriter Charles S. Sherman from the Lincoln newspaper created the Cornhuskers name in 1900 for University of Nebraska teams. Sherman disliked the previous team nickname Bugeaters and wanted something better. Iowa had used Cornhuskers occasionally, but Iowans preferred Hawkeyes — the [Iowa state nickname](/states/iowa/nickname/the-hawkeye-state) was already firmly established — so Sherman adopted Cornhuskers for Nebraska instead. The name caught on with fans immediately."
      - "What is Nebraska nickname in official terms? The 1945 Legislature repealed the previous Tree Planters' State designation and made Cornhusker State the legal name. Nebraska license plates displayed Cornhusker State from 1969 to 1975. Corn remains Nebraska's most important crop today, with more farmland dedicated to it than any other produce, and the state ranks third nationally for corn production — an interesting journey from Bugeaters to Cornhuskers worth tracing across the [origins of all state nicknames](/symbols/nicknames)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Tree Planters' State"
        text: "Nebraska carried Tree Planters' State as its official name from 1895 until 1945. Early settlers planted millions of trees as windbreaks to protect crops, reduce soil erosion, and shelter livestock from harsh prairie winds. When settlers arrived in the mid-1800s, Nebraska had about one million acres of trees. That number doubled to two million acres thanks to extensive planting efforts. J. Sterling Morton of Nebraska City founded Arbor Day on April 10, 1872, and residents planted over one million trees on that first celebration. John MacMurphy, secretary of the Nebraska Territorial Pioneers Association, led a successful campaign to make Tree Planters' State the official designation because he wanted to replace less flattering nicknames like Bugeaters, and that legacy continues on the [Nebraska state tree page](/states/nebraska/tree/cottonwood)."
      - subtitle: "Beef State"
        text: "Nebraska earned this name because of its enormous cattle industry. The state maintains about two million head of beef cows, making beef production one of Nebraska's largest economic activities. Nebraska license plates carried Beef State from the mid-1950s through the mid-1960s, though the legislature never made it an official nickname. Corn and cattle work together in Nebraska's economy because corn feeds the beef cattle that graze across the state. Ranchers appreciate the nickname because it recognizes agriculture beyond just crops, alongside wildlife traditions represented by the [Nebraska state mammal](/states/nebraska/mammal/white-tailed-deer)."
      - subtitle: "Bugeater State"
        text: "This was Nebraska's most common nickname during the late 1800s before Cornhuskers replaced it. The name probably started during the grasshopper invasions of the 1870s, when massive swarms destroyed crops across the plains and reshaped Great Plains agriculture for years. According to historical accounts, an easterner visited Nebraska and joked that residents were eating bugs to survive after grasshoppers ate all the crops. The story spread through newspapers as humor. The University of Nebraska football teams used Bugeaters throughout the 1890s. Bull bats that ate insects across the prairie at night may have also contributed to the nickname. Most Nebraskans disliked being called Bugeaters despite appreciating its rugged character."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The Nebraska nickname and motto both appear on the state seal, which was adopted on June 15, 1867."
      - "Nebraska's state motto is Equality Before the Law, adopted in 1867 when Congress required equal voting rights as a condition for statehood."
      - "Cy Sherman later became a prominent sports journalist whose nickname creation helped shape college sports branding."
      - "Nebraska became the 37th state on March 1, 1867, during the post-Civil War period of westward expansion."
      - "The University of Nebraska teams were called Old Gold Knights in 1890-91 before switching to Bugeaters in 1892."
      - "Herbie Husker became the official University of Nebraska mascot in 1974, designed by artist Dirk West from Texas."

faq:

  - question: "What is the Nebraska nickname?"
    answer: "The Nebraska nickname is the Cornhusker State, which refers to workers who husked corn by hand before mechanical harvesters existed in the early 1900s."

  - question: "What does the Nebraska nickname mean?"
    answer: "What Nebraska nickname means is a person who removes husks from corn ears. The name came from University of Nebraska athletic teams who adopted Cornhuskers in 1900."

  - question: "Why is Nebraska called the Cornhusker State?"
    answer: "Nebraska is called the Cornhusker State because corn is the most important crop. Sportswriter Cy Sherman created the name for university teams in 1900, and it became official in 1945."

  - question: "What is the Nebraska nickname and motto?"
    answer: "The Nebraska nickname and motto are the Cornhusker State and Equality Before the Law. Both appear on Nebraska's state seal adopted in 1867."

  - question: "What is Nebraska nickname history?"
    answer: "Nebraska nickname history started with Bugeaters in the 1890s, changed to Tree Planters' State in 1895, then became Cornhusker State officially in 1945 after university teams used it."

