sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Nebraska?
  paragraphs:
  - "The European honey bee, Apis mellifera, is Nebraska's official state insect. The Nebraska Legislature designated it in 1975."
  - "Honey bees are a common sight across Nebraska's farms, orchards, and gardens throughout the growing season."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee has a fuzzy, golden-brown and black striped body built for collecting pollen and nectar from flowers."
  - "Honey bees live in colonies made up of one queen, thousands of worker bees, and a smaller number of drones. Workers are the bees most often seen visiting flowers."
  - "Not native to North America, honey bees were brought over by European colonists and have since become essential to pollinating crops across Nebraska."

- id: history
  icon: fa-solid fa-landmark
  title: How Nebraska Chose the European Honey Bee
  paragraphs:
  - "The Nebraska Legislature designated the European honey bee as the official state insect in 1975."
  - "The designation recognizes the value of honey bees to Nebraska agriculture, since bees pollinate a wide range of the state's fruit, vegetable, and orchard crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1975, by the Nebraska Legislature."
  - "Scientific name: Apis mellifera."
  - "Colonies are made up of one queen, thousands of worker bees, and a smaller number of drones."
  - "Not native to North America, honey bees were introduced by European colonists."
  - "Nebraska's official designation recognizes the bee's role in pollinating the state's crops."




