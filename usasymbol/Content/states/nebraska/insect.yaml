faq:
- question: What is Nebraska's state insect?
  answer: "Nebraska's state insect is the European honey bee, adopted by the Nebraska Legislature in 1975."
- question: When did Nebraska adopt the European honey bee?
  answer: "Nebraska adopted the European honey bee as its official state insect in 1975."
- question: Why did Nebraska choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to Nebraska agriculture and crop pollination."
- question: What does a European honey bee look like?
  answer: "It has a fuzzy, golden-brown and black striped body. Colonies include one queen, thousands of worker bees, and a smaller number of drones."
- question: Is the European honey bee a butterfly, bee, beetle, or dragonfly?
  answer: "It is a bee. The European honey bee is not native to North America and was brought over by European colonists."

