faq:
  - question: "What are the state colors of Nebraska?"
    answer: "The traditional state colors of Nebraska are Scarlet and Cream, established as the official colors of the University of Nebraska-Lincoln by students in 1892. Nebraska has no separate state color statute; scarlet and cream function as de facto state colors through the cultural dominance of the Cornhuskers athletic program."
  - question: "What is the HEX code for Nebraska Scarlet?"
    answer: "The official HEX code for Nebraska Scarlet (Husker Red) is #E41C38, corresponding to Pantone PMS 186 C, as specified by the University of Nebraska-Lincoln Brand Guide."
  - question: "What is the HEX code for Nebraska Cream?"
    answer: "The official HEX code for Nebraska Cream is #FDF2D9, corresponding to Pantone 7401 C at 35 percent, as specified by the University of Nebraska-Lincoln Brand Guide."
  - question: "Why did Nebraska choose scarlet and cream?"
    answer: "Nebraska chose scarlet and cream in 1892 after abandoning its original color of old gold, which was dropped when the university discovered that the University of Iowa had already claimed old gold as its school color. Chancellor James Hulme Canfield led the committee that selected scarlet and cream as replacements."
  - question: "What is the difference between Nebraska's scarlet and ordinary red?"
    answer: "The University of Nebraska-Lincoln Brand Guide explicitly states that 'red and white are generics, scarlet is a particular hue of red.' Nebraska's scarlet (PMS 186 C, HEX #E41C38) has a warmer, more saturated tone with stronger orange undertones than generic red, distinguishing it from the palettes of other institutions."
  - question: "How long has Memorial Stadium been selling out games?"
    answer: "Memorial Stadium in Lincoln has sold out every home game since 1994, a streak of more than 300 consecutive sellouts — the longest in college football history. On game days, the filled stadium with a capacity exceeding 87,000 constitutes one of the largest gatherings of people in Nebraska."

