sections:
  - id: "official-designation"
    title: "Origins and Color Selection History"
    style: "default"
    paragraphs:
      - "Nebraska has not enacted a separate legislative statute designating official state colors. Scarlet and cream function as Nebraska's de facto state colors through the cultural dominance of the University of Nebraska-Lincoln, founded in 1869 as the state's land-grant university and flagship public institution, whose athletic teams have made the Cornhusker scarlet-and-cream palette one of the most recognized color combinations in the Midwest. The UNL Brand Guide designates Scarlet as Pantone PMS 186 C (HEX #E41C38) and Cream as Pantone 7401 C at 35 percent (HEX #FDF2D9), providing the most authoritative color specifications available for Nebraska's traditional state colors and reinforcing [The Cornhusker State nickname](/states/nebraska/nickname/the-cornhusker-state)."
      - "The colors were chosen by University of Nebraska students in 1892 and are described in the UNL Brand Guide as the official colors of the university, mentioned in three school songs dating to the early 20th century. The selection of scarlet and cream involved a notable reversal of an earlier color choice. Nebraska's original school color, established informally around 1882, was old gold, selected by Clem Chase, former editor of The Hesperian (predecessor to the Daily Nebraskan), and Roscoe Pound, who later became dean of UNL's law school and a distinguished jurisprudential scholar. Old gold was abandoned in 1892 or 1893 when Nebraska played Iowa and discovered that Iowa had already claimed old gold as its school color. Chancellor James Hulme Canfield led a committee that replaced old gold with scarlet and cream — a palette that has remained unchanged for more than 130 years and now appears across the [Nebraska state flag page](/states/nebraska/flag/nebraska-state-flag)."
    subsections:
      - subtitle: "The Old Gold Rejection and the 1892 Choice"
        text: "The story of how Nebraska came to scarlet and cream is one of the more charming episodes in American collegiate color history. The University of Nebraska's original school color of old gold was abandoned after the discovery that the University of Iowa had a prior claim to the color — a matter of institutional honor in the competitive landscape of late-19th-century collegiate sports, where distinctive colors served as essential markers of team identity at a time before logos and branding became standardized. Chancellor James Hulme Canfield, who served at UNL from 1891 to 1895 before becoming president of Ohio State University and later a Columbia librarian, led the committee that selected scarlet as the replacement primary color and paired it with cream as the secondary color. The committee's choice of cream rather than white gave Nebraska a warmer, more distinctive combination than the red-and-white palettes common across collegiate athletics."
      - subtitle: "UNL Brand Guide Color Specifications"
        text: "The University of Nebraska-Lincoln Brand Guide, maintained by the University Communication and Marketing office, specifies Scarlet as Pantone PMS 186 C with HEX value #E41C38 and Cream as Pantone 7401 C at 35 percent with HEX value #FDF2D9. The guide explicitly notes that scarlet and cream were chosen by students in 1892 and are mentioned in three school songs from the early 20th century. The guide also states that 'red and white are generics, scarlet is a particular hue of red' — a distinction that the university treats as a matter of brand identity, emphasizing that the specific warmth and saturation of Husker Scarlet distinguishes it from the red of other institutions. These specifications govern all official university athletics, institutional communications, and licensed merchandise across the University of Nebraska system."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Scarlet and cream carry a cultural weight in Nebraska that exceeds what any formal state color statute could generate. The University of Nebraska's Cornhuskers football program, playing in Memorial Stadium in Lincoln since 1923, has won five national championships and produced more than 50 All-Americans, making Nebraska football one of the premier programs in the history of the sport. The scarlet-and-cream identity is embedded in Nebraska's civic culture at a level that is difficult to overstate in a state where the Cornhuskers are effectively the state's professional sports team — Nebraska is one of the few states with no major professional sports franchise, making the university's athletic program the primary focus of statewide sporting allegiance and complementing the [Nebraska state motto](/states/nebraska/motto/equality-before-the-law)."
    subsections:
      - subtitle: "Scarlet: The Husker Identity"
        text: "Scarlet is the dominant color of Nebraska's identity and the most immediately recognized element of the Cornhusker brand. The UNL Brand Guide's insistence on calling it scarlet rather than red reflects the university's awareness that its specific shade — warm, saturated, and distinct from the brighter reds of institutions like Ohio State or the cooler crimsons of Harvard — is the actual brand asset. The specificity matters: Nebraska's Pantone PMS 186 C is a particular red with strong orange undertones that reads as distinctly different from generic red under various lighting and printing conditions. Memorial Stadium, known as the Sea of Red when filled to its capacity of more than 87,000, is the most visible expression of scarlet's dominance in Nebraska's civic landscape. The stadium has sold out every home game since 1994 — a streak of more than 300 consecutive sellouts — making it the longest such streak in college football history."
      - subtitle: "Cream: The Agricultural Connection"
        text: "Cream's selection as scarlet's partner is significant precisely because it avoids the generic red-and-white combination that characterizes many collegiate palettes. The warm off-white of cream evokes the color of corn silk, dried corn husks, and the interior of harvested grain — visual connections to Nebraska's agricultural identity as one of the leading corn-producing states in the United States. Nebraska ranks consistently among the top five states in corn production, and the Cornhuskers nickname itself directly references the agricultural labor of husking corn by hand that defined Nebraska's rural economy in the 19th century. Cream's warmth against scarlet creates a more visually distinctive combination than white would produce, and the specificity of the shade — the way it ages with uniforms and stadium materials — has become a brand characteristic that Nebraska's athletic program treats with the same care as any major sports franchise."

  - id: "state-emblems"
    title: "Usage Across Nebraska Institutions"
    style: "default"
    paragraphs:
      - "Scarlet and cream dominate Nebraska's institutional and civic landscape in ways that reflect the state's unusual demographic relationship with its flagship university. Nebraska is among the states most thoroughly identified with a single university's athletic program; the Cornhuskers' five national football championships — in 1970, 1971, 1994, 1995, and 1997 — created generations of statewide identification with scarlet and cream that extends into every county of the state regardless of any other institutional affiliation. Memorial Stadium in Lincoln, with a capacity exceeding 87,000, has sold out every home game since 1994, producing on every game day one of the largest gatherings of people in Nebraska — the stadium's filled capacity exceeds the population of the state's second-largest city, Grand Island. Nebraska state government, business, and civic organizations across the state incorporate scarlet and cream into unofficial branding and promotional materials, even without a formal state color statute requiring them to do so. The Nebraska Department of Economic Development and the Nebraska Tourism Commission frequently use the scarlet-and-cream palette in materials associating state identity with the Cornhusker tradition. The Husker Sports Network, Nebraska's radio broadcast network, carries game broadcasts to nearly every county in the state, reinforcing the color tradition in the audio brand of Nebraska's most widely shared cultural experience and a statewide scale visible in [states by population](/rankings/demographics/states-by-population)."

