seo_title: "Nebraska State Colors | Scarlet Cream"
seo_description: "Nebraska state colors are Scarlet and Cream, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Nebraska are **Scarlet** and **Cream**, selected by University of Nebraska students in 1892 and recognized as the state's informal color tradition. While Nebraska has not enacted a separate state color law, scarlet and cream are synonymous with Nebraska identity statewide — visible on [the Nebraska state flag](/states/nebraska/flag/nebraska-state-flag) and across state branding. The specifications below list HEX, RGB, CMYK, and Pantone values for Nebraska color matching."

official_colors: "Scarlet and Cream"
official_since: "Semi-official / Traditional (University of Nebraska-Lincoln, adopted by students 1892)"
primary_use: "University of Nebraska-Lincoln athletics (Cornhuskers), UNL institutional branding, Nebraska state identity across government, business, and civic contexts"
known_for: "Scarlet and cream were chosen after Nebraska abandoned old gold in 1892 because the University of Iowa had already claimed that color — one of the few instances in American collegiate history where a university changed its colors specifically to avoid duplication; Nebraska's Memorial Stadium in Lincoln consistently sells out for every home game, making it annually one of the largest 'cities' in Nebraska by game-day attendance and bringing scarlet and cream before national audiences more than 100,000 at a time"

