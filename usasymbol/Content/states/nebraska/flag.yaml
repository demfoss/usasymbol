  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Nebraska State Flag Facts"
    facts:
      - "Nebraska adopted its state flag in 1925"
      - "The state seal on the flag dates to 1867 — Nebraska's year of statehood"
      - "The flag was standardized with color specifications in 1963"
      - "The motto Agriculture and Commerce appears on the seal"
      - "The Missouri River is depicted on the state seal"
      - "A blacksmith, steamboat, and train all appear on the seal"
      - "No individual designer is credited for the flag"

faq:
  - question: "What does the Nebraska state flag look like?"
    answer: "The Nebraska state flag shows the state seal in silver and gold on a national blue background. The seal depicts a blacksmith at an anvil, a log cabin with wheat and corn, a steamboat on the Missouri River, and a train heading toward the Rocky Mountains."

  - question: "What does the Nebraska state flag mean?"
    answer: "The flag's imagery reflects Nebraska's economy at statehood in 1867. The blacksmith represents industry. The agricultural scene shows farming. The steamboat and train represent commerce and transportation. The distant mountains point toward westward expansion."

  - question: "When did Nebraska adopt its state flag?"
    answer: "Nebraska adopted its state flag in 1925. The state then standardized the seal's colors and proportions in 1963. The seal itself dates to 1867, when Nebraska entered the Union."

  - question: "Why does Nebraska's flag show a blacksmith?"
    answer: "The blacksmith appears on the state seal, which was designed in 1867. He represents mechanical arts and industry — and is notable as a working craftsman rather than the allegorical figures common on other state seals of the era."

  - question: "What is the motto on the Nebraska state seal?"
    answer: "The motto is Agriculture and Commerce. It curves on a ribbon at the top of the seal and was adopted alongside the seal in 1867."

  - question: "In what year did Nebraska's current flag become official?"
    answer: "Nebraska adopted its state flag in 1925 and standardized it in 1963."

