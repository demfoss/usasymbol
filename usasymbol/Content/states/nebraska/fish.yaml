- id: facts
  icon: fa-solid fa-lightbulb
  title: Channel Catfish Facts
  facts:
  - Declared the state fish in 1997 by Governor Ben Nelson.
  - Scientific name is Ictalurus punctatus.
  - Most weigh 2 to 4 pounds, but some top 50 pounds.
  - Its whiskers are covered with taste buds.
  - It is the most common catfish species in North America.
faq:
- question: What is Nebraska's state fish?
  answer: Nebraska's state fish is the channel catfish. It is a whiskered fish found in rivers, lakes, and ponds across the state.
- question: When did Nebraska adopt the Channel Catfish?
  answer: Governor Ben Nelson declared the channel catfish Nebraska's state fish on September 13, 1997.
- question: Why did Nebraska choose the Channel Catfish?
  answer: A class of fourth graders from Valley picked it after researching fish. The state calls it a popular sport fish, but official sources do not give a detailed reason.
- question: Who helped make the channel catfish Nebraska's state fish?
  answer: Seventeen fourth graders from Valley Elementary School led the effort. They met with lawmakers and the governor at the State Capitol.
- question: Can a channel catfish sting you with its whiskers?
  answer: No. The whiskers are soft and harmless. The sharp spines in the top fin and side fins can poke you if you handle the fish carelessly.
