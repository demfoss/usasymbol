intro_text: Nebraska's state fish is the channel catfish, a whiskered fish found in rivers and lakes all over the state. It became official in 1997. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Nebraska?
  paragraphs:
  - The channel catfish is Nebraska's official state fish. Governor Ben Nelson declared it the state fish in 1997. Its scientific name is Ictalurus punctatus.
  - It is a popular sport fish that many Nebraskans also catch for food.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Channel Catfish
  paragraphs:
  - The channel catfish has smooth skin with no scales and a chubby body. Its color is usually gray or olive.
  - Long barbels, often called whiskers, grow around its mouth. They are covered with taste buds that help the fish find food.
  - Young channel catfish often have black spots, but most adults lose them. The forked tail and the rounded edge of the bottom fin near the tail help people tell it apart from the blue catfish.
  - Most channel catfish weigh about 2 to 4 pounds, but some grow to 50 pounds or more.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - In late 1996, a fourth grader at Valley Elementary School in Valley asked his class why Nebraska did not have a state fish. The class looked into different fish and picked the channel catfish.
  - The 17 students took their idea to the State Capitol. They met lawmakers and the governor. The bill their state senator carried was changed so that the governor alone would name state symbols.
  - Governor Ben Nelson then declared the channel catfish the state fish on September 13, 1997.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Nebraska Chose the Channel Catfish
  paragraphs:
  - Official sources do not give a detailed reason for the choice. The fourth graders who pushed for a state fish chose the channel catfish after researching it themselves.
  - The state calls it a popular sport fish. It is also the most common and widespread large catfish in Nebraska.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Channel Catfish
  paragraphs:
  - Channel catfish live all across Nebraska. You can find them in rivers, lakes, reservoirs, and even city ponds.
  - The Platte River and Missouri River hold many catfish. So do lakes near Lincoln, such as Branched Oak Lake and Pawnee Lake.
