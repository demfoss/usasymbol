title: Western Meadowlark
scientific_name: Sturnella neglecta
adopted_year: 1929
legislation: Neb. Rev. Stat. Sec. 90-107; Laws 1929, c. 139
meaning: Nebraska's state bird came out of a deliberate prairie-minded campaign. Supporters wanted a bird that was both typical of the prairies and abundant across the whole state, so the symbol could stand for Nebraska broadly rather than for one corner of it.
author: USA Symbol Team
date_published: '2024-11-27'
date_modified: '2026-03-28'
seo_title: 'Nebraska State Bird: Western Meadowlark'
seo_description: Nebraska adopted the Western Meadowlark as its state bird in 1929. The stronger story is that supporters wanted a bird typical of the prairies and abundant across the whole state.
intro_text: Nebraska's official state bird is the <strong>Western Meadowlark</strong>, adopted in <strong>1929</strong> and now listed in <strong>Neb. Rev. Stat. Sec. 90-107</strong>. The campaign behind the designation did not ask only for a bird people liked. It asked for one that was <strong>typical of the prairies</strong> and <strong>abundant in all parts of the state</strong>. That standard turned the meadowlark into more than a grassland favorite. It turned it into a statewide Nebraska symbol.
