sections:
- id: why-did-nebraska-want-a-bird-typical-of-the-prairies
  icon: fa-solid fa-circle-question
  title: Why Did Nebraska Want a Bird Typical of the Prairies?
  paragraphs:
  - The strongest Nebraska detail is not just that the state chose a meadowlark. It is how supporters described the right kind of state bird before the law passed. They wanted one that was typical of the prairies and abundant across Nebraska.
  - Nebraska was not looking for rarity or exclusivity. It wanted a bird broad enough to represent the whole state and recognizable enough to feel native to daily life on the plains.
  - That choice also explains why the symbol still works. The meadowlark did not stand for one scenic pocket of Nebraska. It stood for the state's larger prairie identity.
- id: how-did-nebraska-turn-the-meadowlark-into-a-state-symbol
  icon: fa-solid fa-landmark
  title: How Did Nebraska Turn the Meadowlark Into a State Symbol?
  paragraphs:
  - The 1928-1929 campaign was not just a one-day legislative act. Historical summaries say the Nebraska Federation of Women's Clubs pushed for a state bird, schoolchildren voted on finalists, and the Nebraska Ornithologists' Union backed the same choice.
  - That coalition matters because it made the bird symbol look educational as well as civic. The campaign was tied to encouraging interest in Nebraska birds and in the state's natural life, not just to naming a decorative emblem.
  - Nebraska's current statute is brief. It simply declares the Western Meadowlark the state bird. But the short law only makes full sense once you see the broader campaign that led up to it.
faq:
- question: What is Nebraska's state bird?
  answer: Nebraska's state bird is the Western Meadowlark.
- question: When did Nebraska adopt the Western Meadowlark?
  answer: Nebraska adopted the Western Meadowlark as its state bird in 1929.
- question: Why did Nebraska choose the Western Meadowlark?
  answer: Supporters wanted a bird that was typical of the prairies and abundant across the state. That made the meadowlark a better statewide symbol than a bird tied to only one region or one narrow meaning.
- question: Who helped push the meadowlark into law in Nebraska?
  answer: Historical accounts point to a coalition that included the Nebraska Federation of Women's Clubs, schoolchildren who voted on finalists, and the Nebraska Ornithologists' Union.
- question: What did the meadowlark mean for Nebraska?
  answer: For Nebraska, the meadowlark meant more than a familiar songbird. It represented a prairie identity broad enough to stand for the state as a whole.
- question: What law names Nebraska's state bird?
  answer: Nebraska's state bird is listed in Neb. Rev. Stat. Sec. 90-107.
