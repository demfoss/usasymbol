faq:
  - question: What is Nebraska's state gemstone?
    answer: "Nebraska's state gemstone is blue chalcedony, a pale blue variety of quartz adopted by the Nebraska Legislature in 1967."
  - question: When did Nebraska adopt blue chalcedony as its state gemstone?
    answer: "The Nebraska Legislature designated blue chalcedony the official state gemstone in 1967."
  - question: Why did Nebraska choose blue chalcedony?
    answer: "Blue chalcedony is found in the same panhandle badlands gravel as prairie agate, and naming both gave Nebraska's rockhounding community two official quartz-family symbols from the same collecting grounds."
  - question: Where can you find blue chalcedony in Nebraska?
    answer: "The Oglala National Grassland in Sioux and Dawes counties, in Nebraska's far northwest panhandle, is the state's best-known source of blue chalcedony."

