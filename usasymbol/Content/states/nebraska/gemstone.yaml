sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Nebraska State Gemstone
    paragraphs:
      - "Blue chalcedony is Nebraska's official state gemstone, designated by the Nebraska Legislature in 1967, the same year lawmakers named prairie agate the state rock. It is a pale, milky blue variety of quartz found scattered through the eroded badlands of the state's panhandle."
      - "Nebraska picked blue chalcedony because it turns up alongside prairie agate in the same collecting grounds, giving the state a matched pair of quartz-family symbols rooted in the same landscape."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Blue Chalcedony?"
    paragraphs:
      - "Blue chalcedony is a pale blue to blue-gray stone, sometimes showing faint internal bands of blue and white and a colorless streak. It is translucent rather than transparent, with a smooth, waxy surface once polished."
      - "Chalcedony is a fine-grained, cryptocrystalline form of quartz, meaning it is made of quartz crystals too small to see without magnification. Nebraska's blue color comes from trace mineral impurities that formed as silica-rich water filled cavities in ancient volcanic ash and gravel."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Nebraska Chose Blue Chalcedony as Its State Gemstone"
    paragraphs:
      - "Blue chalcedony is found in the same badlands gravel as prairie agate, in the Oglala National Grassland of Nebraska's panhandle, giving the state's rockhounding community two related stones to collect on the same trip. Naming both a state rock and a state gemstone in the same year gave that hobby formal recognition."
      - "State lawmakers named blue chalcedony the official state gemstone in 1967 without recording a more specific reason beyond its local abundance and appeal to collectors."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Blue Chalcedony Became Nebraska's State Gemstone"
    paragraphs:
      - "The Nebraska Legislature designated blue chalcedony the state gemstone in 1967, pairing it with prairie agate as the state rock in the same legislation."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Blue Chalcedony Is Found in Nebraska"
    paragraphs:
      - "Blue chalcedony turns up in the same badlands gravel as prairie agate across the Oglala National Grassland in Sioux and Dawes counties, in Nebraska's far northwest panhandle. Collectors typically find both stones together while searching the same eroded slopes and creek beds."
    sites:
      - name: Oglala National Grassland
        city: Crawford
        lat: 42.8578
        lng: -103.5839
        note: "Panhandle badlands source of blue chalcedony"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Blue Chalcedony Facts"
    facts:
      - "Adopted as Nebraska's state gemstone in 1967, the same year prairie agate became the state rock."
      - "Blue chalcedony often leaves a colorless streak, unlike many other colored quartz varieties."
      - "Blue chalcedony is a cryptocrystalline form of quartz, made of crystals too small to see without magnification."
      - "Nebraska's blue chalcedony is gathered from the same panhandle badlands gravel that produces prairie agate."

