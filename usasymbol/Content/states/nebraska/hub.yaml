seo_description: "Nebraska symbols include the western meadowlark, goldenrod, cottonwood, Cornhusker nickname, and Equality Before the Law motto."
snippet_answer: "Nebraska's western meadowlark and cottonwood are familiar official state symbols of the Great Plains, each chosen to reflect the state's prairie and river-valley character. The goldenrod, Equality Before the Law motto, Cornhusker nickname, and a Kool-Aid designation from Hastings complete a list grounded in agricultural identity and plains landscape."
