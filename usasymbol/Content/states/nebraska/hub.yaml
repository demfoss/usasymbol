name_meaning:
  heading: What Does Nebraska Mean?
  paragraphs:
  - Nebraska became a state in 1867, entering as the 37th state. The name comes from an Indigenous name for the Platte River, commonly interpreted as flat water.
  - That river meaning suits a guide built around prairie, plains agriculture, and cottonwood-lined waterways. The goldenrod and western meadowlark feel like open-country symbols, while Kool-Aid gives the hub a very specific Hastings, Nebraska connection.
  - Nebraska's postal abbreviation is NE, and residents are Nebraskans. The Cornhusker State is the main nickname, tied to the state's agricultural identity.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Commonly connected with an Indigenous name for the Platte River meaning flat water.
    - label: Statehood
      text: Nebraska became the 37th state in 1867.
    - label: Motto
      text: Equality Before the Law appears in Nebraska's state seal tradition.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Nebraska, a Great Plains state shaped by the Platte River, agriculture, and prairie landscapes.
    - label: River setting
      text: The name's water meaning points back to the Platte rather than to the later Cornhusker nickname.
    - label: People
      text: People from Nebraska are called Nebraskans.
  - heading: Nicknames and Short Forms
    items:
    - label: The Cornhusker State
      text: Main nickname tied to corn agriculture and University of Nebraska identity.
    - label: Tree Planters State
      text: Older identity connected with Arbor Day and plains tree planting.
    - label: Abbreviation
      text: NE; older short form Neb.
editorial:
  heading: What Nebraska's Symbols Say About the State
  paragraphs:
  - Nebraska's [motto](/states/nebraska/motto), Equality Before the Law, gives the state a civic symbol that feels more pointed than many mottoes. It reads less like scenery and more like a public principle.
  - The [western meadowlark](/states/nebraska/bird), [goldenrod](/states/nebraska/flower), and [cottonwood](/states/nebraska/tree) make a plains trio. They are not flashy symbols, but they are accurate ones for grassland, river corridors, and farm country.
  - The beverage pages add a different kind of local texture. [Milk](/states/nebraska/beverage/milk) reflects dairy agriculture, while [Kool-Aid](/states/nebraska/beverage/kool-aid) points to a specific Nebraska invention rather than a broad natural emblem.
faq:
- question: Is Lincoln named after a president?
  answer: Yes. Lincoln is one of [four U.S. state capitals named after presidents](/collections/capitals/state-capitals-named-after-presidents), alongside Madison (WI), Jackson (MS), and Jefferson City (MO).
- question: What is Nebraska's most famous state symbol?
  answer: The [Cornhusker State nickname](/states/nebraska/nickname) is Nebraska's most recognizable symbol because it is used widely in state identity and sports culture.
- question: What is Nebraska's state bird?
  answer: Nebraska's state bird is the [western meadowlark](/states/nebraska/bird), adopted in 1929.
- question: What is Nebraska's state flower?
  answer: Nebraska's state flower is [goldenrod](/states/nebraska/flower), adopted in 1895.
- question: Why is Kool-Aid listed for Nebraska?
  answer: "[Kool-Aid](/states/nebraska/beverage/kool-aid) appears here because Nebraska recognizes it as a state soft drink, with the story tied to Hastings."
- question: How many official state symbols does Nebraska have?
  answer: Nebraska's hub covers the flag, meadowlark, goldenrod, cottonwood, motto, nickname, milk, Kool-Aid, colors, and white-tailed deer.
