intro_text: "South Carolina's state stone is blue granite, adopted in 1969 to recognize the gray, mica-flecked granite quarried around Winnsboro that takes on a distinctive blue cast when polished. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: South Carolina State Stone
    paragraphs:
      - "Blue granite is South Carolina's official state stone, designated by the South Carolina General Assembly in 1969. It is a gray granite flecked with mica, feldspar, and quartz that takes on a blue tint once cut and polished, best known from quarries near Winnsboro."
      - "South Carolina chose it for the scale of its granite industry, one of the largest in the country, centered on a stone recognizable enough to carry the state's name in building and monument projects nationwide."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Blue Granite?"
    paragraphs:
      - "Blue granite is an igneous rock made mostly of interlocking crystals of quartz, feldspar, and mica. In its rough state it looks gray, but polishing brings out a subtle blue-gray sheen, along with the sparkle of mica flecks scattered through the stone."
      - "Blue granite forms as molten rock cools slowly deep underground, giving the mineral grains time to grow large enough to see with the naked eye. The Winnsboro deposits are prized for their even grain and consistent color across large blocks."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why South Carolina Chose Blue Granite as Its State Stone"
    paragraphs:
      - "Winnsboro blue granite has been quarried commercially in Fairfield County for well over a century, and the stone has been shipped out for use in buildings, bridges, and monuments across the United States. That reach made it a natural choice to represent the state."
      - "South Carolina is one of the country's leading granite producers, and blue granite in particular built a regional industry and workforce around Winnsboro. Naming it the state stone in 1969 recognized both the geology and the industry it supported."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Blue Granite Became South Carolina's State Stone"
    paragraphs:
      - "Governor Robert McNair signed the law naming blue granite the official state stone on June 24, 1969, the same bill that named amethyst the state gemstone."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Blue Granite Is Found in South Carolina"
    paragraphs:
      - "South Carolina's best-known blue granite deposits lie around Winnsboro, in Fairfield County, where commercial quarrying has continued for generations. The Winnsboro name is used in the stone industry specifically for granite cut from this district."
    sites:
      - name: Winnsboro
        city: Winnsboro
