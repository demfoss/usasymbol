faq:
  - question: What is South Carolina's state stone?
    answer: "South Carolina's state stone is blue granite, a gray, mica-flecked granite that takes on a blue tint when polished, adopted in 1969."
  - question: When did South Carolina adopt blue granite as its state stone?
    answer: "The South Carolina General Assembly designated blue granite the official state stone in 1969."
  - question: Why did South Carolina choose blue granite?
    answer: "Winnsboro's quarries built a major state granite industry, shipping blue granite for buildings and monuments across the country."
  - question: Where can you find blue granite in South Carolina?
    answer: "The best-known deposits lie around Winnsboro, in Fairfield County, where commercial quarrying has continued for generations."

