        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Blue Granite Facts"
    facts:
      - "Adopted as South Carolina's state stone in 1969."
      - "Winnsboro, in Fairfield County, gives its name to the state's best-known blue granite quarries."
      - "South Carolina ranks among the leading granite-producing states in the country."
      - "Polished blue granite is used in buildings, bridges, and monuments across the United States."

