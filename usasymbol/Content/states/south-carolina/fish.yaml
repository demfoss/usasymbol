intro_text: South Carolina's state fish is the striped bass, a large striped game fish of the state's rivers and lakes, adopted in 1972. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of South Carolina?
  paragraphs:
  - The striped bass is the official fish of South Carolina. State law calls it the striped bass or rockfish, and it became official in 1972.
  - Its scientific name is Morone saxatilis. Many anglers simply call it a striper.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Striped Bass
  paragraphs:
  - The striped bass has an olive-green back, silvery sides, and a silvery-white belly.
  - Its best-known feature is the row of seven or eight thin, dark stripes that run along each side from head to tail.
  - It is a big, strong fish. Adult stripers often weigh 25 to 30 pounds, but most fish in lakes and rivers are smaller.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - State lawmakers made the striped bass South Carolina's official fish in 1972. Governor John C. West signed the bill on June 2, 1972.
  - State law still uses both of its common names and calls it the striped bass or rockfish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why South Carolina Chose the Striped Bass
  paragraphs:
  - The state law names the striped bass but does not give a detailed reason.
  - The fish does have strong ties to South Carolina. It is one of the state's most popular game fish, and the Santee Cooper lakes are known as the original home of landlocked striped bass.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Striped Bass
  paragraphs:
  - Striped bass are best known in Lake Marion and Lake Moultrie, which together are called the Santee Cooper lakes. When dams created these lakes in the early 1940s, stripers swimming upriver from the ocean got trapped. They survived in fresh water and kept reproducing.
  - The state also stocks stripers in other large lakes, such as Lake Murray, Lake Hartwell, Lake Wateree, Lake Greenwood, and Lake Thurmond. Wild striped bass also live in coastal rivers like the Savannah, Edisto, and Pee Dee.
