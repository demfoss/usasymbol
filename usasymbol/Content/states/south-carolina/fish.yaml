- id: facts
  icon: fa-solid fa-lightbulb
  title: Striped Bass Facts
  facts:
  - Adopted in 1972 by the South Carolina Legislature.
  - Scientific name is Morone saxatilis.
  - Also called rockfish or striper.
  - Has seven or eight dark stripes along each silvery side.
  - Native to Atlantic coastal rivers from Canada to Florida.
faq:
- question: What is South Carolina's state fish?
  answer: South Carolina's state fish is the striped bass, also called the rockfish. Its scientific name is Morone saxatilis.
- question: When did South Carolina adopt the Striped bass?
  answer: The South Carolina Legislature made the striped bass the official state fish in 1972. The governor signed the bill on June 2 of that year.
- question: Why did South Carolina choose the Striped bass?
  answer: The state law does not give a detailed reason. The striped bass is one of South Carolina's most popular game fish, and the Santee Cooper lakes are known as the original home of landlocked stripers.
- question: How did ocean striped bass end up in South Carolina lakes?
  answer: When dams created Lake Marion and Lake Moultrie in the early 1940s, striped bass that had swum upriver from the ocean got trapped. They survived in fresh water and kept reproducing, and biologists later raised them in hatcheries to stock other lakes.
- question: How can you tell a striped bass apart from other fish?
  answer: Look for the seven or eight thin, dark stripes that run the length of its silvery sides. It also has an olive-green back and a whitish belly.
