name_meaning:
  heading: What Does South Carolina Mean?
  paragraphs:
  - South Carolina ratified the Constitution in 1788, becoming the 8th state. Carolina comes from Carolus, the Latin form of Charles, and was used in honor of English kings named Charles.
  - South Carolina's official symbols pull in two directions at once. The palmetto, crescent, and motto carry older state imagery, while tea, the Boykin spaniel, Marsh Tacky, dolphins, and whales bring the guide down into Lowcountry land and water.
  - South Carolina's postal abbreviation is SC, and residents are South Carolinians. Palmetto State works because the cabbage palmetto is central to the flag and state identity.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Carolina comes from Carolus, the Latin form of Charles.
    - label: Statehood
      text: South Carolina ratified the Constitution in 1788 and became the 8th state.
    - label: Motto
      text: Dum Spiro Spero means While I Breathe, I Hope.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to South Carolina, a southeastern state with Upstate, Midlands, and coastal Lowcountry regions.
    - label: Palmetto
      text: The cabbage palmetto appears as both a tree symbol and the visual core of the flag identity.
    - label: People
      text: People from South Carolina are called South Carolinians.
  - heading: Nicknames and Short Forms
    items:
    - label: The Palmetto State
      text: South Carolina's everyday shorthand, rooted in the cabbage palmetto and state flag.
    - label: Lowcountry
      text: Regional identity that helps explain the tea, dolphin, whale, and Marsh Tacky pages.
    - label: Abbreviation
      text: SC; older short form S.C.
editorial:
  heading: What South Carolina's Symbols Say About the State
  paragraphs:
  - The [cabbage palmetto](/states/south-carolina/tree) is the symbol that organizes much of South Carolina's public image. It is tree, flag mark, and nickname source at the same time.
  - The beverage pages are unusually revealing. [Milk](/states/south-carolina/beverage/milk) reflects a statewide agricultural argument, while [tea](/states/south-carolina/beverage/tea) points to Wadmalaw Island and South Carolina-grown tea rather than sweet tea in general.
  - "The animal pages widen the map: [Boykin spaniel](/states/south-carolina/mammal/boykin-spaniel), [Marsh Tacky](/states/south-carolina/mammal/marsh-tacky), [bottlenose dolphin](/states/south-carolina/mammal/bottlenose-dolphin), and [northern right whale](/states/south-carolina/mammal/northern-right-whale) make this one of the more place-specific hubs."
faq:
- question: What is South Carolina's most famous state symbol?
  answer: The [cabbage palmetto](/states/south-carolina/tree) is the symbol that carries both the Palmetto State nickname and the state flag.
- question: What is South Carolina's state bird?
  answer: South Carolina named the [Carolina wren](/states/south-carolina/bird) its bird symbol in 1948.
- question: What is South Carolina's state flower?
  answer: "[Yellow jessamine](/states/south-carolina/flower) has been South Carolina's flower symbol since 1924."
- question: Is tea South Carolina's state beverage?
  answer: "[Tea](/states/south-carolina/beverage/tea) is South Carolina's state hospitality beverage, while [milk](/states/south-carolina/beverage/milk) is the state beverage."
- question: How many official state symbols does South Carolina have?
  answer: South Carolina's collection includes the flag, Carolina wren, yellow jessamine, cabbage palmetto, motto, nickname, colors, milk, tea, deer, mule, Boykin spaniel, Marsh Tacky, bottlenose dolphin, and northern right whale.
