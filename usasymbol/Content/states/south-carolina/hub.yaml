seo_description: "South Carolina symbols include the palmetto-crescent flag, Carolina wren, yellow jessamine, cabbage palmetto, and Dum Spiro Spero motto."
snippet_answer: "The palmetto-and-crescent flag is South Carolina's most recognized official state symbol and one of the most visually distinctive flags in the Southeast. The Carolina wren, yellow jessamine, cabbage palmetto, and Dum Spiro Spero motto anchor the Palmetto State's core identity, alongside Lowcountry wildlife like the bottlenose dolphin and the Boykin spaniel."
