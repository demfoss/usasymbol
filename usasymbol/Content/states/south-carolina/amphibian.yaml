intro_text: "South Carolina's state amphibian is the spotted salamander, a black salamander with bright yellow spots, adopted in 1999. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of South Carolina?
    paragraphs:
      - "The spotted salamander is South Carolina's official state amphibian, designated by the South Carolina General Assembly in 1999. Its scientific name is Ambystoma maculatum."
      - "It is a large, secretive salamander that spends most of the year underground and only appears at the surface to breed."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Spotted Salamander
    paragraphs:
      - "The spotted salamander has smooth, dark bluish-black to black skin with two uneven rows of round yellow or orange spots running from its head to the tip of its tail."
      - "It can grow to about 6 to 10 inches long, making it one of the larger salamanders found in South Carolina."
      - "It spends most of its life hidden underground or under logs and leaf litter, coming out mainly on rainy winter and early spring nights to migrate to breeding ponds."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The South Carolina General Assembly designated the spotted salamander the official state amphibian in 1999, giving South Carolina's amphibians their own dedicated state symbol."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why South Carolina Chose the Spotted Salamander
    paragraphs:
      - "Official sources name the spotted salamander as the state amphibian but do not give a detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Spotted Salamander
    paragraphs:
      - "The spotted salamander lives in moist deciduous forests throughout South Carolina, especially near vernal pools and other temporary woodland ponds used for breeding."
    sites:
      - name: Congaree National Park
        city: Hopkins
        lat: 33.80
        lng: -80.80
        note: "Forested wetland habitat"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Spotted Salamander Facts
    facts:
      - "Adopted in 1999 by the South Carolina General Assembly."
      - "Has two rows of yellow or orange spots along its dark body."
      - "Can grow to about 6 to 10 inches long."
      - "Spends most of the year underground and migrates to ponds to breed."
      - "Can live for 20 years or more in the wild."

