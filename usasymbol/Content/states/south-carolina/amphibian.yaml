seo_title: "South Carolina State Amphibian | Spotted Salamander"
seo_description: "South Carolina's state amphibian is the spotted salamander, adopted in 1999. Learn what it looks like and why it became official."
hero_image: /images/amphibians/south-carolina/south-carolina-state-amphibian-hero.webp
hero_image_alt: "A black spotted salamander with two rows of yellow spots on a forest floor."
