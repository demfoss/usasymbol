intro_text: "South Carolina's state gemstone is amethyst, adopted in 1969 to recognize a purple variety of quartz mined in Abbeville County that has produced some of the finest specimens found in the United States. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: South Carolina State Gemstone
    paragraphs:
      - "Amethyst is South Carolina's official state gemstone, designated by the South Carolina General Assembly in 1969. It is a purple variety of quartz, and South Carolina is one of only a few states where gem-quality amethyst has been mined in real quantity."
      - "Lawmakers recognized a stone already tied to a working local industry rather than naming a gem with no South Carolina connection."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Amethyst?"
    paragraphs:
      - "Amethyst is quartz colored purple by trace amounts of iron within its crystal structure, ranging from pale lavender to deep violet. It typically forms as six-sided crystals, often clustered together in points, and clear, richly colored material is cut into faceted gems."
      - "As a variety of quartz, it shares that mineral's hardness and durability, which is why it holds up well in rings and other jewelry worn daily. South Carolina's amethyst has been noted for its rich, even color in some of the state's larger historic finds."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why South Carolina Chose Amethyst as Its State Gemstone"
    paragraphs:
      - "Abbeville County's mines produced amethyst specimens significant enough to draw national attention, including a large early specimen that a Smithsonian Institution mineralogist rated among the finest found anywhere in the country. That reputation gave South Carolina a gemstone with a documented claim to quality."
      - "South Carolina is one of only a few states where amethyst of good gem quality occurs at all, making it a natural, locally sourced choice rather than an imported stone."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Amethyst Became South Carolina's State Gemstone"
    paragraphs:
      - "Governor Robert McNair signed the bill naming amethyst the official state gemstone on June 24, 1969, the same law that named blue granite the state stone."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Amethyst Is Found in South Carolina"
    paragraphs:
      - "Abbeville County holds South Carolina's best-documented amethyst deposits, including the Ellis-Jones Mine near Due West, site of one of the finest amethyst discoveries in the United States in 1965. Smaller finds have also come from nearby areas around Lowndesville and Antreville."
    sites:
      - name: Ellis-Jones Amethyst Mine
        city: Due West
        lat: 34.3385
        lng: -82.3823
        note: "Site of a major 1965 amethyst discovery"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Amethyst Facts"
    facts:
      - "Adopted as South Carolina's state gemstone in 1969."
      - "A large amethyst specimen from South Carolina was graded by a Smithsonian Institution mineralogist as among the finest found in the country."
      - "The Ellis-Jones Mine near Due West, in Abbeville County, produced a major amethyst discovery in 1965."
      - "South Carolina is one of only a handful of states known to produce gem-quality amethyst."

