intro_text: "South Carolina's state seal was authorized on April 2, 1776, months before the Declaration of Independence. Its obverse shows a palmetto tree standing over a fallen oak, recording the June 28, 1776 Battle of Fort Sullivan, where palmetto-log walls absorbed British cannon fire. The reverse shows the goddess Spes walking over discarded British weapons at dawn."
