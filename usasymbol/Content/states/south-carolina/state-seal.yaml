timeline:
- year: '1776 (Apr)'
  description: The South Carolina General Assembly authorizes the Great Seal on April 2. William Henry Drayton is assigned the obverse; Arthur Middleton takes the reverse.
- year: '1776 (Jun)'
  description: The Battle of Fort Sullivan takes place on June 28. Palmetto-log walls of the fort absorb British cannon fire; the fleet withdraws. Drayton incorporates the victory into the obverse design.
- year: '1777'
  description: An engraver in Charles Town completes the coin-silver seal. President John Rutledge uses it officially for the first time on May 22.
- year: '1780'
  description: British forces capture Charles Town (Charleston) in May. South Carolina operates under British occupation until 1782, but the seal remains the symbol of the state government in exile.
- year: '1861'
  description: South Carolina becomes the first state to secede from the Union on December 20. The seal continues in official use through the Civil War period and Reconstruction.

faq:
- question: What does the South Carolina state seal show?
  answer: The South Carolina state seal has two sides. The obverse shows a palmetto tree with a fallen oak at its base, twelve spears bound to the trunk, and the motto "Animis Opibusque Parati." The reverse shows the goddess Spes walking over discarded British weapons at dawn, holding a laurel branch, with the motto "Dum Spiro Spero."
- question: What does the palmetto tree mean on South Carolina's seal?
  answer: The palmetto represents Fort Sullivan on Sullivan's Island, where palmetto-log walls absorbed British cannon fire during the Battle of June 28, 1776. The dense wood held, and the British fleet withdrew. That victory made the palmetto South Carolina's primary military symbol and gave the state its nickname, the Palmetto State.
- question: Why is there a fallen oak on South Carolina's seal?
  answer: The fallen oak represents the British warships that attacked Fort Sullivan on June 28, 1776. British naval vessels of the era were built from oak. Showing the oak broken and fallen beneath the standing palmetto directly records the British fleet's defeat.
- question: What do the two mottos on South Carolina's seal mean?
  answer: '"Animis Opibusque Parati" means "Prepared in mind and resources" in Latin and appears on the obverse with the palmetto tree. "Dum Spiro Spero," attributed to Cicero, means "While I breathe, I hope" and appears on the reverse with the goddess Spes. Both were adopted together in 1776.'
- question: Who designed South Carolina's state seal?
  answer: Two designers created the seal. William Henry Drayton, a delegate to the Continental Congress and later Chief Justice of South Carolina, designed the obverse with the palmetto and the motto "Animis Opibusque Parati." Arthur Middleton, who later signed the Declaration of Independence, designed the reverse with Spes and "Dum Spiro Spero." The General Assembly authorized the design on April 2, 1776.
- question: When was the South Carolina state seal first used?
  answer: The General Assembly authorized the seal on April 2, 1776. The original coin-silver seal was completed by a Charles Town engraver and first used by President John Rutledge on May 22, 1777, more than a year after authorization.
- question: What do the twelve spears on the seal mean?
  answer: The twelve spears bound to the palmetto trunk represent the other twelve American colonies allied with South Carolina during the Revolution. At the time of the seal's design in 1776, thirteen colonies were fighting together, and the spears show South Carolina's twelve partners bound to the central palmetto.

