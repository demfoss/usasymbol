name: Great Seal of South Carolina
adopted_year: 1776
is_official: true
legislation: South Carolina Code § 1-1-610
meaning: "The Great Seal of South Carolina has two sides, each with its own designer, its own motto, and its own visual argument. William Henry Drayton designed the obverse with a palmetto tree standing over a defeated enemy, tied to the twelve spears of colonial unity and the motto 'Prepared in mind and resources.' Arthur Middleton designed the reverse with the goddess Spes walking over discarded British weapons, carrying a laurel branch and the motto 'While I breathe, I hope.' The complete seal is a paired statement: military readiness on one face, and perseverance through adversity on the other."
