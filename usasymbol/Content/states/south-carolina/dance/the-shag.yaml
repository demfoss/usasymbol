sections:
  - id: overview
    icon: fa-solid fa-music
    title: South Carolina State Dance
    paragraphs:
      - "South Carolina named the shag its official state dance in 1984. The designation recognized a partner dance that grew out of the beach music scene along the Grand Strand, the stretch of coast around Myrtle Beach."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "The Shag Explained"
    paragraphs:
      - "The shag is a smooth, swing-family partner dance danced in a slot, meaning the two dancers travel back and forth along an imaginary line rather than circling each other. The footwork is close to the floor and unhurried compared to faster swing styles."
      - "The dance is typically set to beach music, a regional genre blending rhythm and blues and soul influences at a mid-tempo pace. The look on the floor is relaxed and glide-like, with partners trading turns and footwork patterns without breaking the slot."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Shag
    steps:
      - title: "Set Up the Slot"
        description: "Face your partner and establish an imaginary line between you, since both dancers travel along this slot rather than around each other."
      - title: "Learn the Six-Count Basic"
        description: "Step through a six-count pattern of quick and slow steps, keeping the footwork small and close to the floor."
      - title: "Keep the Upper Body Relaxed"
        description: "Let your shoulders and arms stay loose while the feet carry the rhythm, matching the dance's smooth, unhurried feel."
      - title: "Trade Turns Along the Slot"
        description: "Lead or follow simple turns while staying within the slot, returning to the basic step between figures."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why the Shag Represents South Carolina
    paragraphs:
      - "The shag developed along the Grand Strand starting in the mid-twentieth century, growing directly out of the region's beach music clubs and pavilions. That coastal origin gave South Carolina a homegrown dance tied to a specific stretch of its own shoreline rather than a national tradition shared by many states."
      - "The 1984 designation came a decade before the state separately adopted square dance as its official folk dance. That order makes the shag South Carolina's original dance symbol and its most distinctly regional one."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How the Shag Became the State Dance
    paragraphs:
      - "The South Carolina General Assembly designated the shag the state's official dance in 1984, a decade before lawmakers separately named square dance the state's official American folk dance in 1994."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: The Shag Facts
    facts:
      - "South Carolina adopted the shag as its official state dance in 1984."
      - "The shag developed along the Grand Strand, the Myrtle Beach area of South Carolina's coast, starting in the mid-twentieth century."
      - "South Carolina separately recognizes square dance as its state American folk dance, adopted in 1994."
      - "The shag is danced in a slot, with partners traveling along a line rather than circling each other."

