sections:
- id: designation
  icon: fa-solid fa-landmark
  title: Why the General Assembly Created a Hospitality Beverage Category for Tea
  paragraphs:
  - 'The General Assembly''s 1995 rationale turned on two claims: tea is the most consumed beverage in the world after water, and South Carolina is the only state in the country where tea is grown commercially. Millions of states serve sweet tea. Only one grows it. The official language was deliberate — <em>South Carolina-grown tea</em>, not sweet tea broadly, not tea as a regional habit, but tea cultivated in South Carolina soil. That specificity is what separates the hospitality beverage title from a cultural gesture and makes it an agricultural claim grounded in the same logic as the 1984 milk designation.'
- id: south-carolina-connection
  icon: fa-solid fa-leaf
  title: 'Wadmalaw Island: The Only Commercial Tea Farm in the Continental U.S.'
  paragraphs:
  - The Charleston Tea Garden on Wadmalaw Island — about thirty miles southwest of Charleston — is the only large-scale commercial tea farm in the continental United States, which gives South Carolina's hospitality beverage designation an agricultural foundation that most state symbol titles never have to earn.
  - Wadmalaw Island sits in the South Carolina Lowcountry, where warm temperatures, high humidity, acidic soil, and long growing seasons closely mirror the tea-growing zones of Asia. The coastal environment that made the region hospitable to rice and indigo cultivation in the colonial era turns out to suit Camellia sinensis — the tea plant — just as well. South Carolina's coastal geography is not incidental to the tea story. It is the reason the story happened here at all.
  - The plantation operated under several names over its history, including a period as the Lipton American Classic Tea farm, before becoming the Charleston Tea Garden. Whatever the name on the sign, the land and the climate stayed the same — and the harvest kept going.
- id: from-plant-to-symbol
  icon: fa-solid fa-clock-rotate-left
  title: André Michaux's 1799 Tea Plant and the Path to Official Recognition
  paragraphs:
  - Tea's South Carolina story starts in 1799, when French botanist André Michaux brought a tea plant to North America and gave it to Henry Middleton at Middleton Barony in Dorchester County. Michaux was not thinking about beverage production. He was a botanical collector, and the tea plant arrived as a curiosity — an ornamental specimen, not a crop. For decades the leaves were not brewed. The plant grew, and that was largely the point.
  - What Michaux introduced, though, was proof of concept. South Carolina's climate and soil could support Camellia sinensis. That early plant was not commercially exploited, but it demonstrated that the Lowcountry was capable of growing tea if anyone tried seriously enough. More than a century and a half later, someone did.
- id: sweet-tea-context
  icon: fa-solid fa-mug-hot
  title: 'Sweet Tea in South Carolina: A Reflex, Not a Preference'
  paragraphs:
  - Sweet tea is not a beverage in the South so much as a reflex. It arrives at the table before you ask. It is poured in church halls and funeral parlors and front porches and diners with equal confidence. The 1995 hospitality beverage designation did not create that tradition — it named what was already true.
  - The word 'hospitality' in the title is doing real work. Tea in South Carolina is not a preference — it is a given. Naming it the hospitality beverage rather than simply a state drink places it in the social role it has always occupied. It is the drink you offer because not offering it would feel like a statement. The [South Carolina General Assembly's legislation](https://www.scstatehouse.gov/) frames it exactly that way.
timeline:
- year: '1799'
  description: Botanist André Michaux introduces a tea plant to North America and gives it to Henry Middleton at Middleton Barony in Dorchester County, South Carolina. The plant is grown as an ornamental, not brewed.
- year: 20th century
  description: Commercial tea cultivation takes hold on Wadmalaw Island in the South Carolina Lowcountry, eventually becoming the only large-scale commercial tea farm in the continental United States.
- year: '1984'
  description: South Carolina designates milk as the official state beverage — a separate designation that tea would not replace.
- year: '1995'
  description: The South Carolina General Assembly designates South Carolina-grown tea as the official state hospitality beverage under Act Number 31 of 1995, citing the state's unique commercial cultivation and tea's role in Southern hospitality.
faq:
- question: What is South Carolina's official hospitality beverage?
  answer: South Carolina-grown tea, designated in 1995 under Act Number 31. The designation is specifically for tea cultivated in South Carolina, not sweet tea as a cultural category.
- question: Is tea South Carolina's state beverage?
  answer: No. Tea is the official hospitality beverage. Milk is the official state beverage, designated in 1984. The two titles are separate and both remain active.
- question: Why is it called a hospitality beverage instead of a state beverage?
  answer: When the General Assembly recognized tea in 1995, milk was already the official state beverage from 1984. Rather than displace that designation, lawmakers created a distinct category — the hospitality beverage — that acknowledged tea's cultural and agricultural significance on its own terms.
- question: Who introduced tea to South Carolina?
  answer: French botanist André Michaux brought a tea plant to North America in 1799 and gave it to Henry Middleton at Middleton Barony in Dorchester County. The plant was originally grown as an ornamental and its leaves were not brewed.
- question: Where is tea grown commercially in South Carolina?
  answer: On Wadmalaw Island, about thirty miles southwest of Charleston, at the Charleston Tea Garden. It is the only large-scale commercial tea farm in the continental United States.
- question: Is South Carolina the only state that grows tea commercially?
  answer: Yes. South Carolina is the only state in the country where tea is grown commercially — which is the central argument behind the hospitality beverage designation.
