seo_title: "South Carolina State Hospitality Beverage | Tea"
seo_description: "South Carolina made tea its state hospitality beverage in 1995, leaning on Wadmalaw Island's commercial tea legacy."
intro_text: '<strong>South Carolina-grown tea is the state''s official hospitality beverage</strong>, designated in <strong>1995</strong> — a title built on something few states can say: South Carolina actually grows tea commercially, on Wadmalaw Island near Charleston, making it the only state in the continental United States where tea is cultivated at scale. The designation is separate from the state beverage, which is milk. The legislature created the hospitality category specifically for tea rather than displacing the older dairy title.'
