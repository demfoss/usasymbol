seo_title: "South Carolina State Beverage | Milk"
seo_description: "South Carolina made milk its state beverage in 1984. Tea later got a separate hospitality-beverage title."
intro_text: '<strong>Milk</strong> is South Carolina''s official state beverage — named in <strong>1984</strong>, years before the legislature got around to sweet tea. The reasoning was purely economic: dairy was running in nearly every county in the state, generating close to a hundred million dollars a year. Tea came later, in 1995, but not as a replacement — the legislature invented a new category for it.'
