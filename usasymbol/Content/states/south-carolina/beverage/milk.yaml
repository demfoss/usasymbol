sections:
- id: why-milk
  icon: fa-solid fa-cow
  title: Why South Carolina Named Milk Its Official State Beverage
  paragraphs:
  - In 1984, the [South Carolina General Assembly](https://www.scstatehouse.gov/) did not ask what the state drank — it catalogued what the state grew. Dairy farmers were working across nearly every county, and the industry had reached roughly a hundred million dollars. The case for milk was a count of counties and a dollar figure, not a cultural claim.
- id: two-beverages
  icon: fa-solid fa-mug-hot
  title: How South Carolina Ended Up With Two Official Beverages
  paragraphs:
  - 'The tea question arrived eleven years later, and it came from a specific place: Wadmalaw Island, a barrier island about twenty miles south of Charleston. The Charleston Tea Garden there is the only large-scale commercial tea farm in the United States. No other state can make that claim.'
  - In 1995, the legislature created a new category — official state hospitality beverage — and awarded it to [South Carolina-grown tea](/states/south-carolina/beverage/tea) rather than reopen the question of milk. Two titles, two separate stories, one state.
- id: hospitality-beverage
  icon: fa-solid fa-handshake
  title: South Carolina's Hospitality Beverage — a Category With One Member
  paragraphs:
  - South Carolina did not inherit this category — it created it. No standard list of state symbol types includes hospitality beverage. The legislature invented the title because milk and tea do not belong in the same argument. Milk was named for an industry that touched every county. Tea was named for a single island and a single farm.
  - Naming milk as state beverage was not unusual in 1984. Oregon did it in 1969, Wisconsin followed, then Nebraska, Vermont, Delaware — dairy states across the country made the same economic case in the same era. South Carolina was part of that pattern. The hospitality beverage category is not a pattern. No other state has one. The legislature, by creating a category with a single occupant, made a stronger statement about Wadmalaw Island than any shared designation could have.
timeline:
- year: '1984'
  description: South Carolina General Assembly designates milk as the official state beverage under Act Number 360, citing dairy farmers operating in nearly every county and an industry worth roughly one hundred million dollars.
- year: '1995'
  description: South Carolina-grown tea designated as the official state hospitality beverage — a new category the legislature created to recognize the Charleston Tea Garden on Wadmalaw Island, the only large-scale commercial tea farm in the United States.
faq:
- question: What is South Carolina's official state beverage?
  answer: Milk is the official state beverage of South Carolina, designated in 1984. The General Assembly cited dairy farms operating in nearly every county and a hundred-million-dollar industry.
- question: Is sweet tea South Carolina's state drink?
  answer: No. South Carolina-grown tea is the official state hospitality beverage — a separate category designated in 1995. Milk has been the official state beverage since 1984 and was never replaced.
- question: Why did South Carolina choose milk and not sweet tea?
  answer: The 1984 designation was economic. Dairy was operating in nearly every county in the state, generating close to a hundred million dollars annually. Sweet tea was recognized in 1995 through a separate category tied to the Charleston Tea Garden on Wadmalaw Island — the only large-scale commercial tea farm in the United States.
- question: Why does South Carolina have two official beverages?
  answer: The two designations cover different things. Milk was named in 1984 for the dairy industry's statewide economic reach. Tea was named in 1995 for the Charleston Tea Garden on Wadmalaw Island — the only large-scale commercial tea farm in the United States. Rather than replace milk, the legislature created a new category for tea.
- question: What is a state hospitality beverage?
  answer: A category South Carolina invented. No standard state symbol classification includes it. The legislature created the title in 1995 to recognize South Carolina-grown tea alongside the existing state beverage rather than replace it. No other state uses this designation.
- question: What is the South Carolina state hospitality beverage?
  answer: South Carolina-grown tea, designated in 1995. It recognizes the Charleston Tea Garden on Wadmalaw Island — the only large-scale commercial tea farm in the United States.
