intro_text: '**"Where the Revolutionary War Was Won"** is South Carolina''s current regular license plate slogan, issued beginning January 1, 2026. It replaced the long-running **"While I Breathe, I Hope"** base and joined **"In God We Trust"** as a standard-issue choice after decades of iodine, anniversary, tourism, and motto-era plate text.'
quick_answer: 'South Carolina''s current regular plate slogan is "Where the Revolutionary War Was Won," issued beginning January 1, 2026. The previous regular slogan was "While I Breathe, I Hope" (February 2016-December 2025), after "Travel2SC.com" (July 2008-January 2016) and "Smiling Faces. Beautiful Places." (January 1998-June 2008).'
