sections:
- id: revolutionary-war
  icon: fa-solid fa-landmark
  title: '"Where the Revolutionary War Was Won" - The 2026 Regular Plate'
  paragraphs:
  - South Carolina began issuing the "Where the Revolutionary War Was Won" regular plate on January 1, 2026. The design marks the state's role in the American Revolution and the semiquincentennial period rather than using the state motto or a tourism slogan.
  - The change also reset the standard-plate lineup. South Carolina DMV materials describe the Revolutionary War plate and the "In God We Trust" plate as the state's two standard-issue choices, with the "While I Breathe, I Hope" base ending its regular-issue run at the close of 2025.
  - The wording is deliberately historical: South Carolina had more Revolutionary War battles and skirmishes than any other state, and the plate ties that claim directly to everyday registration rather than reserving it for a specialty design.

- id: motto-era
  icon: fa-solid fa-anchor
  title: '"While I Breathe, I Hope" - The State Motto Era'
  paragraphs:
  - '"While I Breathe, I Hope" appeared on South Carolina''s regular plate beginning in February 2016 and continued through December 2025. The phrase is the English translation of Dum Spiro Spero, one of the state mottos adopted in 1776 during the Revolutionary era.'
  - The 2016 base replaced the sunset-colored "Travel2SC.com" plate and moved the plate message away from tourism marketing toward civic identity. A refreshed version with a new serial font appeared in October 2023, but it kept the same motto slogan until the 2026 Revolutionary War plate replaced it.
  - South Carolina also offers "In God We Trust" plates. The older versions were optional/requested plates, but under the 2026 regular-plate lineup the "In God We Trust" design is treated as one of the standard-issue options.

- id: tourism-era
  icon: fa-solid fa-sun
  title: Tourism Slogans Before the Motto Plate
  paragraphs:
  - '"Smiling Faces. Beautiful Places." began in January 1998 on a white plate with a light blue mountain graphic and palmetto. It is still one of South Carolina''s most recognizable plate slogans because it read as both a welcome and a tourism pitch.'
  - In late 2007 the same slogan continued briefly on a screened-serial version before the state moved to the sunset-background "Travel2SC.com" base in July 2008. That web-address slogan ran until January 2016, when "While I Breathe, I Hope" took over.'
  - The sequence matters because the old file skipped "Travel2SC.com" and stretched "Smiling Faces. Beautiful Places." too far. The regular-issue chain is Smiling Faces, then Travel2SC.com, then While I Breathe, I Hope, then Where the Revolutionary War Was Won.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: South Carolina License Plate Slogans by Era
  paragraphs:
  - South Carolina's license plate slogan history mixes agricultural promotion, anniversaries, tourism branding, state-motto language, and Revolutionary War commemoration.
