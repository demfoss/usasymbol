    description: The current regular-issue slogan, introduced January 1, 2026, recognizes South Carolina's Revolutionary War history and the 250th-anniversary period.

- id: iodine-era
  icon: fa-solid fa-flask
  title: The Iodine Plates of 1930-1933
  paragraphs:
  - South Carolina's early iodine slogans are easy to misdate because the phrase changed across short annual issues. The clean sequence is "IODINE" in 1930, "THE IODINE STATE" in 1931 and 1932, and "THE IODINE PRODUCTS STATE" during the January-October 1933 issue.
  - The wording promoted the high iodine content associated with South Carolina produce. After 1933 the iodine identity disappeared from regular plates, and no regular slogan returned until the 1970 "300 YEARS" commemorative.
  - These plates are historically interesting because they behave more like an advertising campaign than a permanent state nickname. Each version pushes the iodine message a little differently, then the whole idea vanishes from the plate record.

timeline:
- year: '1930'
  description: South Carolina uses "IODINE" vertically on the right side of the plate.
- year: '1931'
  description: The slogan changes to "THE IODINE STATE."
- year: '1932'
  description: '"THE IODINE STATE" continues for a second year.'
- year: '1933'
  description: The short January-October issue uses "THE IODINE PRODUCTS STATE," the final iodine slogan.
- year: '1970'
  description: The state marks 300 years of settlement with a "300 YEARS" plate.
- year: '1976'
  description: A "1776 Bicentennial 1976" base commemorates the U.S. Bicentennial and Revolutionary War history.
- year: '1998'
  description: '"Smiling Faces. Beautiful Places." debuts on the regular passenger plate.'
- year: '2008'
  description: The sunset-background "TRAVEL2SC.COM" base replaces the Smiling Faces slogan.
- year: '2016'
  description: '"While I Breathe, I Hope" appears on the regular plate as the English translation of the state motto.'
- year: '2023'
  description: South Carolina refreshes the motto plate with a new serial font while retaining "While I Breathe, I Hope."
- year: '2026'
  description: Beginning January 1, the DMV issues "Where the Revolutionary War Was Won" as the regular plate and keeps "In God We Trust" as the other standard-issue option.

faq:
- question: What is South Carolina's current license plate slogan?
  answer: South Carolina's current regular license plate slogan is "Where the Revolutionary War Was Won," issued beginning January 1, 2026.
- question: Is "While I Breathe, I Hope" still the current South Carolina plate?
  answer: No. "While I Breathe, I Hope" was the regular plate slogan from February 2016 through December 2025. It was replaced by the Revolutionary War plate on January 1, 2026.
- question: What does "While I Breathe, I Hope" mean?
  answer: It is the English translation of Dum Spiro Spero, one of South Carolina's official state mottos adopted in 1776.
- question: What was South Carolina's plate slogan before "While I Breathe, I Hope"?
  answer: The previous regular-issue slogan was "TRAVEL2SC.COM," used from July 2008 through January 2016. Before that, the regular plate used "Smiling Faces. Beautiful Places."
- question: When did "Smiling Faces. Beautiful Places." run on South Carolina plates?
  answer: It began in January 1998 and continued through the short 2007-2008 screened-serial update, ending when the "TRAVEL2SC.COM" base arrived in July 2008.
- question: What were South Carolina's iodine license plate slogans?
  answer: The iodine sequence was "IODINE" in 1930, "THE IODINE STATE" in 1931-1932, and "THE IODINE PRODUCTS STATE" during the January-October 1933 issue.
- question: Is "In God We Trust" a South Carolina standard plate?
  answer: Yes. Earlier "In God We Trust" plates were optional/requested designs, but South Carolina DMV's 2026 lineup treats "In God We Trust" as one of the two standard-issue choices alongside "Where the Revolutionary War Was Won."

