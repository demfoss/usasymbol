seo_title: 'South Carolina License Plate Slogans: Revolutionary War, While I Breathe & Iodine Plates'
seo_description: South Carolina's current regular license plate slogan is "Where the Revolutionary War Was Won," introduced January 1, 2026. Learn the full sequence from the iodine plates through Smiling Faces, Travel2SC.com, While I Breathe I Hope, and In God We Trust.
hero_image: /images/license-plates/south-carolina/2026-revolutionary-war.png
hero_image_alt: South Carolina Where the Revolutionary War Was Won license plate
hero_image_caption: South Carolina's regular plate introduced January 1, 2026, uses the slogan "Where the Revolutionary War Was Won" for the state's 250th anniversary and Revolutionary War commemoration.
intro_text: '**"Where the Revolutionary War Was Won"** is South Carolina''s current regular license plate slogan, issued beginning January 1, 2026. It replaced the long-running state-motto base, "While I Breathe, I Hope," and joined "In God We Trust" as one of the state''s standard-issue plate choices. South Carolina''s slogan history is unusually varied: an iodine-promotion run in 1930-1933, a 1970 tercentennial plate, a 1976 Bicentennial plate, the tourism phrases "Smiling Faces. Beautiful Places." and "Travel2SC.com," and then the motto-era plates.'
quick_answer: 'South Carolina''s current regular plate slogan is "Where the Revolutionary War Was Won," issued beginning January 1, 2026. The previous regular slogan was "While I Breathe, I Hope" (February 2016-December 2025), after "Travel2SC.com" (July 2008-January 2016) and "Smiling Faces. Beautiful Places." (January 1998-June 2008).'
