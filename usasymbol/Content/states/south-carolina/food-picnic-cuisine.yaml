sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is South Carolina's State Picnic Cuisine?"
    paragraphs:
      - "Barbecue is South Carolina's official state picnic cuisine, designated by the South Carolina General Assembly in 2014. It centers on slow-cooked pork, most often served pulled or chopped."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About South Carolina Barbecue"
    paragraphs:
      - "South Carolina barbecue is built around whole hogs or pork shoulders cooked low and slow over wood or charcoal until tender enough to pull apart by hand. What sets the state apart is its sauce: South Carolina is the only state where all four major American barbecue sauce styles are found, mustard-based, light tomato, heavy tomato, and vinegar and pepper based, often varying by region."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Barbecue Became South Carolina's State Picnic Cuisine"
    paragraphs:
      - "The South Carolina General Assembly designated barbecue the official state picnic cuisine in 2014."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why South Carolina Chose Barbecue"
    paragraphs:
      - "Barbecue has a long history in South Carolina, tracing back to German and English settlers who brought mustard-based sauces to the Midlands region, alongside vinegar-based traditions elsewhere in the state. South Carolina's mix of sauce styles, more varied than any other state, makes barbecue a fitting symbol of the state's regional food identity, often served at picnics and community gatherings."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Barbecue Facts"
    facts:
      - "Adopted as South Carolina's state picnic cuisine in 2014."
      - "South Carolina is the only state with all four major American barbecue sauce styles."
      - "Mustard-based barbecue sauce in South Carolina traces back to German settlers in the Midlands."
      - "Barbecue is traditionally cooked low and slow over wood or charcoal."

