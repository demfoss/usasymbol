seo_title: "South Carolina State Flower: Yellow Jessamine"
seo_description: "The Yellow Jessamine became South Carolina's state flower in 1924. This fragrant yellow vine blooms across South Carolina forests and coastal areas."

intro_text: "The Yellow Jessamine serves as South Carolina's state flower, a position it has held since 1924 and a featured entry in the [list of U.S. state flowers](/symbols/flowers). This fragrant yellow flowering vine climbs trees and fences throughout South Carolina. Bright tubular blooms appear across the state from coastal lowlands to upstate regions each spring."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the South Carolina State Flower?"
    paragraphs:
      - "South Carolina officially recognizes the Yellow Jessamine as its state flower. Each bloom displays five petals fused into a trumpet shape. The flowers measure 1 to 2 inches long. Bright golden yellow petals create striking displays. A sweet fragrance fills the air around blooming vines. The scent intensifies during warm sunny days."
      - "Yellow Jessamine blooms from February through April across South Carolina. Coastal areas see the earliest flowers in late winter. Upstate regions bloom several weeks later in early spring. Peak flowering occurs in March throughout most of the state. The vine climbs using twining stems. Plants can reach 20 feet or more. Glossy evergreen leaves remain on the vine year-round providing continuous color."
      - "This native vine grows wild throughout South Carolina from Hilton Head to the mountains. The plant thrives in pine forests, hardwood edges, and along fence rows. Full sun to partial shade suits Yellow Jessamine. The species appears in Francis Marion National Forest, Congaree National Park, and throughout the Lowcountry. Roadside displays attract attention during spring bloom. The vine tolerates South Carolina's hot summers and mild winters perfectly."

  - id: name
    icon: "fa-solid fa-tag"
    title: "South Carolina State Flower Name"
    paragraphs:
      - "This flower carries the common name Yellow Jessamine and the scientific name Gelsemium sempervirens. The plant belongs to the Gelsemiaceae family. This small family includes only about 12 species of flowering vines found primarily in warm regions."
      - "The genus name Gelsemium comes from the Italian word for jasmine. Early botanists noted the similar fragrance. The species name sempervirens means evergreen in Latin. It describes the persistent leaves. Carolina jessamine serves as another common name. Some people spell it yellow jasmine though true jasmines belong to a different plant family."
      - "Confusion exists because Yellow Jessamine is not related to true jasmine despite the similar name and fragrance. The common name stuck due to the sweet scent. All parts of Yellow Jessamine are highly toxic if ingested. Native Americans knew about the plant's poisonous properties. Early settlers learned to avoid consuming any part of the vine."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Yellow Jessamine Became the South Carolina State Flower"
    paragraphs:
      - "South Carolina selected the Yellow Jessamine as its official state flower in 1924. The South Carolina Federation of Women's Clubs led the campaign for this designation. They organized activities promoting native plants across the state. School children studied South Carolina wildflowers during this period, alongside broader civic themes on [South Carolina state symbols](/states/south-carolina)."
      - "Yellow Jessamine bloomed abundantly throughout South Carolina. The bright yellow flowers signaled spring's arrival across the state. Vines draped over pine trees creating golden curtains. The sweet fragrance delighted residents and visitors. The evergreen nature represented South Carolina's mild climate and complemented [the Palmetto State nickname](/states/south-carolina/nickname/the-palmetto-state). Native status made it preferable to imported ornamental plants."
      - "Some people suggested magnolia or Cherokee rose instead. Yellow Jessamine supporters emphasized the vine's statewide distribution. The plant grew from coastal islands to upstate counties. Its February blooms made it one of South Carolina's first wildflowers each year. The legislature agreed. Lawmakers passed the designation on February 26, 1924."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "South Carolina State Flower Facts"
    facts:
      - "Yellow Jessamine grows wild throughout South Carolina from Hilton Head coastal areas to mountain regions, thriving in Francis Marion National Forest and Congaree National Park"
      - "All parts of the Yellow Jessamine are highly toxic if ingested, containing alkaloids that affect the nervous system and can cause serious poisoning"
      - "South Carolina adopted the Yellow Jessamine on February 26, 1924, following advocacy by the South Carolina Federation of Women's Clubs"
      - "The vine blooms as early as February in coastal areas, making it one of South Carolina's first wildflowers to announce spring's arrival"
      - "Despite its common name, Yellow Jessamine is not related to true jasmine plants but was named for its similar sweet fragrance"
      - "The evergreen vine can climb 20 feet or more using twining stems that wrap around trees, fences, and other supports"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "South Carolina State Flower and Bird"
    paragraphs:
      - "The [Carolina Wren](/states/south-carolina/bird/carolina-wren) serves as South Carolina's state bird, a small energetic songbird with a distinctive loud song. Both symbols represent South Carolina officially. South Carolina adopted the Yellow Jessamine in 1924 and designated the Carolina Wren as state bird in 1948."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Yellow Jessamine Symbolizes"
    paragraphs:
      - "The Yellow Jessamine is commonly seen as representing South Carolina's natural beauty and mild climate. The flower traditionally symbolizes grace and elegance in flower language. Its early spring blooms frequently represent renewal and hope while the evergreen nature carries connotations of endurance and the Lowcountry's distinctive character with its warm winters and long growing season, including regions outlined in [States That Border South Carolina](/states/south-carolina/borders)."

faq:
  - question: "What is South Carolina's state flower?"
    answer: "South Carolina's state flower is the Yellow Jessamine, a fragrant yellow flowering vine that climbs trees and fences throughout the state."
  
  - question: "When did South Carolina adopt the Yellow Jessamine as its state flower?"
    answer: "South Carolina adopted the Yellow Jessamine on February 26, 1924. The South Carolina Federation of Women's Clubs led the campaign for this designation."
  
  - question: "Why did South Carolina choose the Yellow Jessamine?"
    answer: "South Carolina chose the Yellow Jessamine because it bloomed abundantly throughout the state and signaled spring's arrival. The bright yellow flowers and sweet fragrance delighted residents. The vine's statewide distribution from coastal islands to upstate counties and its February blooms made it representative of South Carolina's mild climate."
  
  - question: "Is Yellow Jessamine toxic?"
    answer: "Yes, all parts of the Yellow Jessamine are highly toxic if ingested. The plant contains alkaloids that affect the nervous system and can cause serious poisoning. Despite its beauty and fragrance, no part of the vine should be consumed."
  
  - question: "When does Yellow Jessamine bloom in South Carolina?"
    answer: "Yellow Jessamine blooms from February through April in South Carolina, with coastal areas seeing the earliest flowers in late winter. Peak flowering occurs in March, making it one of South Carolina's first wildflowers each spring."

