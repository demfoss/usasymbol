title: "Dum Spiro Spero"
language: "Latin"
english_translation: "While I Breathe, I Hope"
adopted_year: 1776

author: "USA Symbol Team"
date_published: "2025-12-05"
date_modified: "2026-03-27"
seo_title: "South Carolina State Motto | Dum Spiro Spero! While I Breathe, I Hope!"
seo_description: "South Carolina's motto 'Dum spiro spero' means 'While I breathe, I hope.' See its 1776 seal origin, second motto, translation, and official meaning."

intro_text: "South Carolina has two official state mottos, both adopted on April 2, 1776 — months before the Declaration of Independence. The primary motto is <strong>Dum Spiro Spero</strong> (<em>While I Breathe, I Hope</em>), which appears on the reverse of the Great Seal with the Roman goddess Spes walking over discarded British weapons. The second motto, <em>Animis Opibusque Parati</em> (<em>Prepared in Mind and Resources</em>), appears on the obverse. Arthur Middleton designed the reverse and later signed the Declaration of Independence. The phrase was not invented for South Carolina — King Charles I had inscribed it in a Shakespeare folio during his imprisonment in the 1640s, and over fifty British families already bore it as a family motto."

sections:
  - id: "two-mottos-1776"
    icon: "fa-solid fa-shield-halved"
    title: "Two Official Mottos, Both Adopted in 1776"
    paragraphs:
      - "South Carolina's General Assembly passed a resolution on April 2, 1776 — more than three months before the Declaration of Independence — authorizing President John Rutledge and the Privy Council to design a Great Seal. Two designers divided the work: William Henry Drayton designed the obverse with the palmetto tree and the motto <em>Animis Opibusque Parati</em> (Prepared in Mind and Resources); Arthur Middleton designed the reverse with the goddess Spes and <em>Dum Spiro Spero</em> (While I Breathe, I Hope)."
      - "Both mottos received simultaneous adoption and carry equal legal standing. The two phrases together describe complementary virtues: readiness before battle and perseverance through it. South Carolina's decision to create a two-sided seal with two distinct mottos — rather than one phrase — was unusual among colonial states designing seals in 1776."
      - "An engraver in Charles Town crafted the original seal as a four-inch circle, four-tenths of an inch thick, made from coin silver. President Rutledge first used the completed seal on May 22, 1777, more than a year after authorization."

  - id: "king-charles-and-the-phrase"
    icon: "fa-solid fa-crown"
    title: "King Charles I Used This Motto During Captivity"
    paragraphs:
      - "The phrase 'Dum spiro spero' predates South Carolina by over a century. King Charles I of England used it as a personal motto during his imprisonment by Parliament in the 1640s, and inscribed the words in a Shakespeare folio. The phrase expressed his determination to maintain hope as long as he lived — which ended with his execution in January 1649."
      - "Over fifty families in the British Isles bore 'Dum spiro spero' as their family motto before South Carolina adopted it. The phrase had also appeared in classical literature — Greek poet Theocritus wrote a similar sentiment in the 3rd century BC: 'While there's life there's hope, and only the dead have none.' Cicero used the Latin phrasing in his letters."
      - "Arthur Middleton, who chose the phrase for South Carolina's seal, would have known its royal history. A Charleston planter and member of the Provincial Congress, Middleton received a classical education that included both the classical sources and the British heraldic tradition. He selected a phrase that carried centuries of meaning about perseverance under duress."

  - id: "spes-on-the-seal"
    icon: "fa-solid fa-person-walking"
    title: "The Goddess Walking Over British Weapons"
    paragraphs:
      - "The reverse of South Carolina's Great Seal shows the Roman goddess Spes — the personification of hope — walking on a beach at dawn. She holds a laurel branch in one hand. At her feet lie discarded British weapons: swords, muskets, and military equipment. The image translates the motto's abstract concept into a specific historical scene."
      - "Spes was a standard figure in Roman religious practice, often depicted carrying flowers or reaching toward the future. South Carolina's version places her in a Revolutionary War context: dawn represents the new beginning of independence, the beach setting anchors the scene in the Atlantic coast, and the discarded weapons represent the specific enemy being defeated. The goddess is not avoiding weapons — she is stepping over them."
      - "The two elliptical areas of the seal are linked by palmetto branches, connecting both mottos and both sides of the seal design. 'Dum Spiro Spero' appears on a ribbon above the Spes scene on the reverse, while 'Animis Opibusque Parati' appears on the obverse above the palmetto tree."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "South Carolina State Motto Facts"
    style: "gradient"
    facts:
      - "South Carolina has two official state mottos — both adopted on April 2, 1776, months before the Declaration of Independence."
      - "King Charles I inscribed 'Dum Spiro Spero' in a Shakespeare folio during his captivity in the 1640s."
      - "Over fifty British families bore 'Dum Spiro Spero' as a family motto before South Carolina adopted it."
      - "Arthur Middleton, who designed the seal's reverse with this motto, later signed the Declaration of Independence."
      - "President Rutledge first used the completed seal on May 22, 1777 — more than a year after authorization."
      - "The original seal was made from coin silver, four inches in diameter, four-tenths of an inch thick."

faq:
  - question: "What is South Carolina's state motto?"
    answer: "South Carolina has two official state mottos, both adopted in 1776. 'Dum Spiro Spero' means 'While I Breathe, I Hope' and appears on the reverse of the Great Seal. 'Animis Opibusque Parati' means 'Prepared in Mind and Resources' and appears on the obverse."

  - question: "What does 'Dum Spiro Spero' mean?"
    answer: "'While I Breathe, I Hope.' 'Dum' means while, 'spiro' means I breathe (from 'spirare'), and 'spero' means I hope (from 'sperare'). The phrase links the act of living with the persistence of hope — as long as one is alive, one continues to hope."

  - question: "What language are South Carolina's mottos written in?"
    answer: "Both are Latin. 'Dum Spiro Spero' (While I Breathe, I Hope) and 'Animis Opibusque Parati' (Prepared in Mind and Resources) were both adopted on April 2, 1776, when the General Assembly authorized the Great Seal design."

  - question: "Who designed the seal with 'Dum Spiro Spero'?"
    answer: "Arthur Middleton, a Charleston planter and member of the Provincial Congress, designed the reverse of the Great Seal featuring the goddess Spes and the motto. Middleton later signed the Declaration of Independence. William Henry Drayton designed the obverse with the palmetto tree and the second motto."

  - question: "Was 'Dum Spiro Spero' invented for South Carolina?"
    answer: "No. The phrase had been used for centuries before South Carolina adopted it. King Charles I used it as a personal motto during his imprisonment in the 1640s and inscribed it in a Shakespeare folio. Over fifty British families bore it as a family motto. The Latin phrasing appears in Cicero's letters, and the same idea appears in Greek writing from the 3rd century BC."

  - question: "Where does South Carolina's motto appear?"
    answer: "On the reverse of the Great Seal, on a ribbon above the image of the goddess Spes walking over discarded British weapons. The seal appears on official state documents, government letterhead, and in the State House in Columbia. 'Animis Opibusque Parati' appears on the obverse of the same seal."

