seo_title: "South Carolina State Flag: Palmetto Tree & History"
seo_description: "Trace the design history of South Carolina's flag from 1861 onward, including the symbols and color language attached to South Carolina."

intro_text: "South Carolina adopted its state flag on January 28, 1861, displaying a white palmetto tree and a white crescent on an indigo field, and it is listed in the [U.S. state flags collection](/symbols/flags). Colonel William Moultrie designed the original version in 1775 for Revolutionary War troops. The palmetto was added in 1861 to honor Fort Moultrie's defense."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the South Carolina State Flag Is Designed"
    paragraphs:
      - "The South Carolina state flag is the official banner of the state of South Carolina. An indigo field holds a white palmetto tree at the center. A white crescent appears in the upper left corner."
      - "The design traces to 1775 when Colonel William Moultrie created a flag for South Carolina militia troops. The original flag showed only the crescent on a blue field. The palmetto tree was added when South Carolina adopted the official state flag on January 28, 1861, tying directly to [South Carolina's state tree](/states/south-carolina/tree/cabbage-palmetto)."
      - "South Carolina law does not specify exact colors, sizes, or placement of the symbols. This has led to variations in flag designs from different manufacturers. Attempts to standardize the design have faced opposition, especially in regional contexts covered by [States That Border South Carolina](/states/south-carolina/borders)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the South Carolina State Flag Means"
    paragraphs:
      - "The South Carolina state flag meaning connects to the state's Revolutionary War history. Each element honors South Carolina's military defense and independence."
      - "The palmetto tree represents Fort Moultrie's defense against British attack. The fort's walls were built with palmetto logs over sand. These soft logs absorbed British cannon fire during the Battle of Sullivan's Island on June 28, 1776. The crescent comes from the silver insignia worn on militia caps, and the legacy is central to [the Palmetto State nickname](/states/south-carolina/nickname/the-palmetto-state)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "South Carolina Flag History and Adoption"
    paragraphs:
      - "In 1775, Colonel William Moultrie designed a flag for South Carolina troops fighting in the American Revolutionary War. The Council of Safety asked him to create the design. Moultrie chose blue to match the militia's uniforms. He added a white crescent taken from the silver insignia on their caps. The flag was first flown at Fort Johnson and later aligned with [South Carolina's official indigo blue color standard](/states/south-carolina/color/indigo-blue)."
      - "The flag gained fame during the Battle of Sullivan's Island on June 28, 1776. British forces attacked a fortress defended by Moultrie. During the sixteen-hour battle, British cannon fire shot down the flag. Sergeant William Jasper ran into the open and raised it again. He rallied the troops until the flag could be mounted properly. This act saved Charleston from conquest for four years."
      - "The flag became known as the Moultrie Flag or Liberty Flag. It served as the standard of South Carolina militia throughout the war. Major General Nathanael Greene presented it in Charleston when the city was liberated. Greene called it the first American flag to fly over the South."
      - "South Carolina seceded from the Union in December 1860. The state needed a new flag for its independence. An unofficial draft showed a white field with a green palmetto and a blue canton bearing a white crescent. The state debated designs through January 1861."
      - "On January 26, 1861, the South Carolina General Assembly adopted a flag with a gold palmetto inside a white circle on a blue field. The crescent appeared in the upper left. This design lasted only two days. On January 28, 1861, the state changed the gold palmetto to white and removed the circle. This version remains the official flag today."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the South Carolina Flag"
    versions:
      - name: "Moultrie Flag"
        years: "1775"
        image: "versions/south-carolina-moultrie.webp"
        description: "A blue field with a white crescent in the upper left. Sometimes inscribed with the word Liberty."

      - name: "Unofficial Draft"
        years: "c. 1861"
        image: "versions/south-carolina-draft.webp"
        description: "A white field with a green palmetto tree off-center. Blue canton in the upper left with a white crescent. Design credited to Alexander S. Salley and Ellen Heyward Jervey."

      - name: "Two-Day Flag"
        years: "January 26–28, 1861"
        image: "versions/south-carolina-two-day.webp"
        description: "An indigo field with a gold palmetto tree inside a white oval. White crescent in the upper left."

      - name: "Modern State Flag"
        years: "January 28, 1861–present"
        image: "versions/south-carolina-1861.webp"
        description: "An indigo field with a white palmetto tree centered and a white crescent in the upper left corner."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the South Carolina Flag"
    symbols:
      - id: palmetto-tree
        name: "South Carolina State Flag Palmetto Tree"
        image: "symbols/palmetto.svg"
        paragraphs:
          - "A white palmetto tree stands at the center of the flag. The palmetto is South Carolina's state tree. It appears as a sabal palmetto with a distinctive trunk and fronds."
          - "The palmetto honors Fort Moultrie's defense during the Revolutionary War. The fort's walls were constructed with palmetto logs laid over sand. The soft wood absorbed British cannon fire without shattering. This allowed the fort to withstand the British attack on June 28, 1776."

      - id: crescent
        name: "South Carolina State Flag Crescent"
        image: "symbols/crescent.svg"
        paragraphs:
          - "A white crescent appears in the upper left corner of the flag. The crescent faces right with its points directed upward. William Moultrie's original 1775 design placed the crescent vertically. Alexander Samuel Salley Jr. changed the orientation in 1910."
          - "The crescent comes from the silver insignia worn on Revolutionary War militia caps. It represents military service and South Carolina's troops. Some sources call it a gorget though gorgets were typically worn around the throat."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "South Carolina State Flag Colors"
    paragraphs:
      - "The South Carolina state flag uses indigo and white. The indigo matches the color of militia uniforms from the Revolutionary War. South Carolina law does not provide official color specifications."
      - "Various shades of indigo appear on flags from different manufacturers. A proposed standardization would make Pantone 282 C the official shade. White appears on the palmetto tree and crescent."
    colors:
      - name: "Indigo"
        hex: "#003366"
      - name: "White"
        hex: "#ffffff"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "South Carolina State Flag Facts"
    facts:
      - "South Carolina adopted its state flag on January 28, 1861"
      - "The original Moultrie Flag was designed in 1775 by Colonel William Moultrie"
      - "The palmetto tree represents Fort Moultrie's defense in 1776"
      - "A version with a gold palmetto lasted only two days in January 1861"
      - "The flag ranked 10th best out of 72 in a 2001 NAVA survey"
      - "South Carolina law does not specify exact colors or symbol placement"

faq:
  - question: "What is the official state flag of South Carolina?"
    answer: "The state flag of South Carolina is the official banner of South Carolina, featuring a white palmetto tree and a white crescent on an indigo field."

  - question: "How would you describe the design of the South Carolina state flag?"
    answer: "The flag shows an indigo field with a white palmetto tree centered and a white crescent in the upper left corner."

  - question: "How do historians explain the symbolism of South Carolina's flag?"
    answer: "The flag represents South Carolina's Revolutionary War history. The palmetto represents Fort Moultrie's defense against British attack. The crescent represents the militia's cap insignia."

  - question: "What does the South Carolina state flag represent?"
    answer: "The flag means independence and military strength. The palmetto honors Fort Moultrie which withstood British cannon fire in 1776. The crescent honors South Carolina's Revolutionary War troops."

  - question: "How is South Carolina's flag usually described?"
    answer: "A palmetto tree appears on the South Carolina state flag. Specifically, it is a sabal palmetto, which is South Carolina's state tree."

  - question: "What meaning is attached to South Carolina's flag?"
    answer: "The crescent is a white symbol in the upper left corner taken from the silver insignia worn on Revolutionary War militia caps. It represents military service and South Carolina's troops."

  - question: "What colors are used on South Carolina's flag?"
    answer: "A white palmetto tree and a white crescent appear on the South Carolina state flag."

