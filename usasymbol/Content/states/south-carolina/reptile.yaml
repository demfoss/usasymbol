faq:
  - question: What is South Carolina's state reptile?
    answer: "South Carolina's state reptile is the loggerhead sea turtle, adopted by the South Carolina General Assembly in 1988."
  - question: When did South Carolina adopt the loggerhead sea turtle?
    answer: "The South Carolina General Assembly designated the loggerhead sea turtle the official state reptile in 1988."
  - question: Why did South Carolina choose the loggerhead sea turtle?
    answer: "The loggerhead sea turtle nests on South Carolina's beaches in large numbers every summer, making it a natural symbol of the state's coast."
  - question: Is the loggerhead sea turtle endangered?
    answer: "The loggerhead sea turtle is federally listed as threatened, and its nests on South Carolina beaches are protected by conservation programs."

