sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of South Carolina?
    paragraphs:
      - "The loggerhead sea turtle is South Carolina's official state reptile, designated by the South Carolina General Assembly in 1988. Its scientific name is Caretta caretta."
      - "It is a large marine turtle that nests on South Carolina's beaches every year, making it one of the most recognizable sea turtles on the Atlantic coast."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Loggerhead Sea Turtle
    paragraphs:
      - "The loggerhead sea turtle has a reddish-brown, heart-shaped shell and a notably large head with powerful jaws that let it crush hard-shelled prey like crabs and whelks."
      - "Adults can weigh over 200 pounds and grow to about 3 feet in shell length, making them one of the largest hard-shelled sea turtles in the world."
      - "Female loggerheads return to nesting beaches near where they hatched to dig nests and lay eggs in the sand during the summer."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The South Carolina General Assembly designated the loggerhead sea turtle the official state reptile in 1988, recognizing a species that nests along the state's coastline every year."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why South Carolina Chose the Loggerhead Sea Turtle
    paragraphs:
      - "The loggerhead sea turtle nests on South Carolina's beaches in significant numbers each summer, making it a natural choice to represent the state's coastal wildlife."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Loggerhead Sea Turtle
    paragraphs:
      - "Loggerhead sea turtles nest along South Carolina's barrier islands and beaches each summer, from the Grand Strand down to Hilton Head Island."
