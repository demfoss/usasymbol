faq:
- question: What is South Carolina's state insect?
  answer: "South Carolina's state insect is the Carolina mantid, adopted by the South Carolina General Assembly in 1988."
- question: When did South Carolina adopt the Carolina mantid?
  answer: "South Carolina adopted the Carolina mantid as its official state insect in 1988."
- question: Why did South Carolina choose the Carolina mantid?
  answer: "Lawmakers pointed to the mantid's role as a native, beneficial predator of harmful insects and called it a useful specimen of living science for schoolchildren."
- question: What does the Carolina mantid look like?
  answer: "It is a slender insect with a triangular head, colored green to grayish brown. Females grow to about 2.5 inches long, and males are smaller and can fly."
- question: Where is the Carolina mantid found in South Carolina?
  answer: "It is found throughout the state, most often in gardens, fields, and tall grass from summer into early fall."
- question: Is the Carolina mantid the same as a praying mantis?
  answer: "Yes. The Carolina mantid is a species of praying mantis and the only one native to South Carolina."

