sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of South Carolina?
  paragraphs:
  - "The Carolina mantid, Stagmomantis carolina, is South Carolina's official state insect. The South Carolina General Assembly designated it in 1988."
  - "Lawmakers chose the mantid because it is a native, beneficial insect found across the state and easy for people to recognize."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Carolina Mantid
  paragraphs:
  - "The Carolina mantid is a slender insect with a triangular head and a long neck that lets it turn and look over its shoulder."
  - "Its color ranges from green to grayish brown, often matching the plants where it hides. Females grow to about 2.5 inches long, while males are smaller and can fly."
  - "Its front legs fold like blades and snap forward to grab insect prey, a hunting pose that makes it easy to spot in gardens and fields."

- id: history
  icon: fa-solid fa-landmark
  title: How South Carolina Chose the Carolina Mantid
  paragraphs:
  - "The South Carolina General Assembly named the Carolina mantid the official state insect in 1988."
  - "Lawmakers pointed to the mantid's usefulness as a predator of harmful insects and called it a good specimen of living science for the state's schoolchildren to study."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Carolina Mantid in South Carolina
  paragraphs:
  - "The Carolina mantid is found throughout South Carolina, most active from summer into early fall."
  - "Look for it in gardens, fields, and tall grass, where it waits motionless for insects to pass within reach."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Carolina Mantid Facts
  facts:
  - "Adopted: 1988, by the South Carolina General Assembly."
  - "Scientific name: Stagmomantis carolina."
  - "Length: females grow to about 2.5 inches, males are smaller and can fly."
  - "Color ranges from green to grayish brown, blending with surrounding plants."
  - "Preys on harmful garden and crop insects."




