seo:
  title: "Most Common Last Names in South Carolina"
  description: "The most common last names in South Carolina are Smith, Williams, and Brown, with Lowcountry, Gullah Geechee, Huguenot, and Upcountry roots shaping the top 20."

page:
  h1: "Most Common Last Names in South Carolina"
  intro: "The most common last names in South Carolina are Smith, Williams, Brown, Johnson, and Davis, led by English surnames reshaped by the Lowcountry plantation world and Upcountry migration. Names such as Green, Jackson, Robinson, and Washington rank especially high because South Carolina's post-1865 surname map was deeply influenced by formerly enslaved families in the rice coast, Sea Islands, and cotton counties."
  heritage_title: "Lowcountry Freedmen, Huguenot Charleston, and Upcountry Settlers"
  heritage_body: "South Carolina's surname profile begins on the coast, where English colonists founded Charles Town in 1670 and built a rice economy that depended on enslaved Africans from the West African rice coast. After emancipation in 1865, freed families across Beaufort, Charleston, Georgetown, Orangeburg, and the Sea Islands fixed legal surnames that still make Williams, Brown, Green, Jackson, Robinson, and Washington unusually visible statewide. The Upcountry added a second stream as Scots-Irish and German-speaking families moved down the Great Wagon Road into the Piedmont during the 1700s, leaving names such as Miller, Wilson, Anderson, and Thompson in the same top 20."
  fun_fact: "Shealy is one of South Carolina's most concentrated surnames: more than half of Americans with the name are counted in the state, a marker of the German-Swiss communities that settled the Dutch Fork between the Broad and Saluda rivers in the colonial period."

surnames:
  - rank: 1
    name: Smith
    count: 64997
    ratio: 76
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Smith ranks first because it crossed every South Carolina boundary: English colonial Charleston, Upcountry farms, African American communities after 1865, and later mill towns all carried the name."

  - rank: 2
    name: Williams
    count: 49152
    ratio: 101
    origin: english
    type: Patronymic
    meaning: "Son of William, from Norman 'Willahelm', will plus helm. Williams ranks second in South Carolina because it was common among English settlers and became one of the most widely adopted surnames by freed families after emancipation."

  - rank: 3
    name: Brown
    count: 47414
    ratio: 104
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', meaning brown hair, complexion, or clothing. Brown ranks ahead of Johnson in South Carolina, a signal of the surname's strength in African American families across the Lowcountry and the inland cotton belt."

  - rank: 4
    name: Johnson
    count: 43864
    ratio: 113
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' (God is gracious). Johnson appears throughout the state, but its strongest cultural weight comes from post-emancipation naming in counties where plantation agriculture had shaped family life for generations."

  - rank: 5
    name: Davis
    count: 35891
    ratio: 138
    origin: english
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid' (beloved). Davis sits unusually high in South Carolina because Welsh and English settlers brought it early, and freed families later reinforced it across Orangeburg, Sumter, and the Pee Dee."

  - rank: 6
    name: Jones
    count: 33594
    ratio: 147
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form meaning son of John, from 'Ioan'. Jones entered South Carolina through British colonial settlement and expanded inland with farming families who moved from the coast into the Piedmont."

  - rank: 7
    name: Wilson
    count: 22762
    ratio: 217
    origin: english
    type: Patronymic
    meaning: "Son of Will, a shortened form of William. Wilson is one of the clearer Upcountry names in the top 20, carried by Scots-Irish families who settled the Piedmont and foothills during the eighteenth century."

  - rank: 8
    name: Jackson
    count: 20600
    ratio: 240
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval diminutive of John. Jackson ranks higher in South Carolina than it does nationally, reflecting its adoption by many African American families after 1865 and its durability in Lowcountry and Midlands counties."

  - rank: 9
    name: Miller
    count: 19289
    ratio: 256
    origin: english
    type: Occupational
    meaning: "From Middle English 'miller', a grain grinder. Miller has both English and German roots in South Carolina, especially in the Dutch Fork and Piedmont communities where grain mills anchored rural settlement."

  - rank: 10
    name: Taylor
    count: 18641
    ratio: 265
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', one who cuts cloth. Taylor spread early through English colonial families and later through African American communities that chose familiar occupational surnames after emancipation."

  - rank: 11
    name: Robinson
    count: 18215
    ratio: 271
    origin: english
    type: Patronymic
    meaning: "Son of Robin, a medieval form of Robert. Robinson is especially prominent in South Carolina's African American surname pattern, where it stands far above its national ranking and appears strongly in the Lowcountry and Midlands."

  - rank: 12
    name: Thompson
    count: 17341
    ratio: 285
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a short form of Thomas. Thompson came with English and Scots-Irish settlers into the Upcountry and also appears in Lowcountry freedmen's records after the Civil War."

  - rank: 13
    name: Anderson
    count: 16880
    ratio: 293
    origin: scottish
    type: Patronymic
    meaning: "Son of Andrew, from Greek 'Andreas' (manly). Anderson followed the Scots-Irish route from Ulster into the Carolina Piedmont, making it one of the state's clearest Upcountry patronymics."

  - rank: 14
    name: White
    count: 16654
    ratio: 297
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwīt', meaning white hair or pale complexion. White appears in both coastal and inland records, but in South Carolina it also became a common legal surname among freed families after 1865."

  - rank: 15
    name: Thomas
    count: 16342
    ratio: 302
    origin: english
    type: Patronymic
    meaning: "From Aramaic 'Toma', meaning twin. Thomas is common in South Carolina through Welsh and English settlement, then reinforced by African American families in the rice coast, the Pee Dee, and the Midlands."

  - rank: 16
    name: Green
    count: 15622
    ratio: 316
    origin: english
    type: Descriptive
    meaning: "From Middle English 'grene', someone who lived near a village green or was associated with the color green. Green ranks much higher in South Carolina than nationally, a pattern tied to African American families in Lowcountry and Black Belt counties."

  - rank: 17
    name: Wright
    count: 14128
    ratio: 350
    origin: english
    type: Occupational
    meaning: "From Old English 'wyrhta', a craftsman who worked with wood. Wright entered the colony with English-speaking settlers and remained common in inland farming districts where carpenters, wheelwrights, and builders were essential trades."

  - rank: 18
    name: Scott
    count: 13548
    ratio: 365
    origin: scottish
    type: Descriptive
    meaning: "Originally a name for a Scot or Gaelic speaker. Scott reflects the stream of Scots and Scots-Irish migrants who moved into South Carolina's interior before the Revolution and later spread through the Piedmont."

  - rank: 19
    name: Lee
    count: 13437
    ratio: 368
    origin: english
    type: Habitational
    meaning: "From Old English 'leah', a clearing or meadow. Lee is broad enough to include English, African American, and Asian American bearers, but in South Carolina its deep presence comes mainly from colonial and post-emancipation naming."

  - rank: 20
    name: Harris
    count: 13375
    ratio: 369
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry. Harris appears in early South Carolina records and remains common across Charleston, the Midlands, and the Upcountry, giving it one of the widest regional spreads in the top 20."

unique_surnames:
  - name: Shealy
    state_rank: 183
    national_rank: 7009 # UNVERIFIED
    origin: german
    why: "Shealy is one of the strongest South Carolina markers in the surname table, with more than half of the national total found in the state. The name is closely associated with the Dutch Fork, the German-Swiss settlement zone between the Broad and Saluda rivers northwest of Columbia."

  - name: Smalls
    state_rank: 129
    national_rank: 3303 # UNVERIFIED
    origin: english
    why: "Smalls is heavily concentrated in South Carolina, especially in the Lowcountry. The name is inseparable from Robert Smalls of Beaufort, who escaped slavery by piloting the Confederate steamer Planter to Union lines in 1862 and later served in Congress."

  - name: Singleton
    state_rank: 100
    national_rank: 619 # UNVERIFIED
    origin: english
    why: "Singleton ranks far higher in South Carolina than nationally. Its strength reflects old Lowcountry plantation surnames and the African American families who carried or adopted the name in coastal and Midlands counties after emancipation."

  - name: Rivers
    state_rank: 135
    national_rank: 922 # UNVERIFIED
    origin: english
    why: "Rivers is unusually common in South Carolina, where waterways such as the Ashley, Cooper, Santee, Edisto, and Savannah shaped settlement, plantation geography, and family movement. The name has both English habitational roots and strong African American presence in Lowcountry counties."

  - name: Brunson
    state_rank: 222
    national_rank: 2056 # UNVERIFIED
    origin: english
    why: "Brunson is rare nationally but prominent in South Carolina and neighboring Georgia. It clusters in the southern part of the state, including Hampton County, where Brunson also survives as a place name."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Four of South Carolina's top 20 surnames come from trades: Smith, Miller, Taylor, and Wright. Their survival across coastal cities, Piedmont farms, and mill villages shows how practical English occupational names became statewide family names rather than markers of one region."
    examples:
      - Smith (metalworker)
      - Miller (grain grinder)
      - Taylor (tailor)
      - Wright (woodworker)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate South Carolina's top 20, with Williams, Johnson, Davis, Jones, Wilson, Jackson, Robinson, Thompson, Anderson, Thomas, and Harris all meaning descent from a male given name. The same naming pattern served different communities: British settlers used inherited family names, while freed families after 1865 often fixed these names as legal surnames for the first time."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Davis (son of David)
      - Robinson (son of Robin)

  - type: Descriptive and Place Names
    icon: fa-solid fa-map-location-dot
    description: "Descriptive names such as Brown, White, Green, and Scott sit beside place-based names such as Lee and Rivers. In South Carolina, these names gained extra force because they appear in both old colonial records and African American communities shaped by the Lowcountry, the Sea Islands, and the inland plantation belt."
    examples:
      - Brown (brown hair or complexion)
      - Green (near a village green)
      - Scott (a Scot)
      - Lee (clearing or meadow)

faq:
  - question: "What are the most common last names in South Carolina?"
    answer: "The most common last names in South Carolina are Smith, Williams, Brown, Johnson, and Davis. Smith ranks first statewide, while Williams and Brown rank unusually high because of the state's English colonial and African American surname history."

  - question: "Why are Williams, Brown, and Green so common in South Carolina?"
    answer: "Williams, Brown, and Green are especially common in South Carolina because they were used by English-speaking settlers and widely carried or adopted by African American families after emancipation in 1865. Their strength is most visible in Lowcountry, Sea Islands, Midlands, and historic plantation counties."

