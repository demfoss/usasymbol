type: State Coat of Arms
state: South Carolina
name: South Carolina State Coat of Arms
adopted_year: 1776
is_official: true
meaning: "The South Carolina coat of arms is built from a single moment: the June 28, 1776 battle at Sullivan's Island, where a palmetto-log fort stopped a British fleet. The standing palmetto over the fallen oak shows the outcome of that battle. The second scene, with the goddess Hope walking past scattered weapons toward a rising sun, shows what the founders believed would follow: a future built on hope after the cost of war."
meaning_title: Meaning of the South Carolina Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'South Carolina Coat of Arms: Meaning, Symbols and History'
seo_description: "The South Carolina coat of arms was adopted in 1776 and shows a palmetto over a fallen oak and the goddess Hope, symbols from the Revolutionary War."
hero_image: /images/coats-of-arms/south-carolina/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of South Carolina, adopted 1776, showing a palmetto tree over a fallen oak and the goddess Hope on the shore
hero_image_caption: The South Carolina Coat of Arms, adopted in 1776. On the left, a palmetto stands over a fallen oak, recording the Battle of Sullivan's Island. On the right, the goddess Hope walks toward a rising sun past scattered weapons.
intro_text: "The South Carolina coat of arms was adopted in 1776 and shows a palmetto tree standing upright over a fallen oak. That image records the June 28, 1776 Battle of Sullivan's Island, where a fort built of palmetto logs held off a British fleet whose ships were built of oak."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the South Carolina Coat of Arms?
  paragraphs:
  - "The arms use two oval scenes rather than a divided heraldic shield. The left scene shows the battle: a palmetto tree rising above a broken oak, with twelve spears bound to the trunk. The right scene shows what followed: the goddess Spes, Roman symbol of hope, walking along a shore past scattered weapons as the sun rises behind her."
  - "Two figures stand on either side as supporters. On the left, a figure representing Liberty holds a Phrygian cap and a laurel wreath. On the right, a Continental soldier stands in uniform. Above, a figure representing Fame appears as the crest."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the South Carolina Coat of Arms
  paragraphs:
  - "The South Carolina General Assembly authorized the coat of arms on April 2, 1776. The American colonies had not yet declared independence. The design was created in the same year South Carolina faced its first major military test."
  - "That test came on June 28, 1776, at Fort Sullivan on Sullivan's Island near Charleston. Colonel William Moultrie and his men defended a fort built of palmetto logs against a British naval bombardment that lasted about ten hours. The palmetto logs absorbed cannon fire instead of splintering. The fort held and the British fleet withdrew."
  - "The fallen oak in the design represents the British ships, which were built of oak. The standing palmetto over the fallen oak captures the battle's outcome in a single image. No specific designer for the coat of arms is identified in the historical record."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the South Carolina Coat of Arms
  paragraphs:
  - "The arms divide their story into two scenes: a record of battle on the left and a vision of the future on the right."
  elements:
  - id: palmetto
    name: The Palmetto Tree and Fallen Oak
    image: /images/coats-of-arms/south-carolina/elements/palmetto.webp
    paragraphs:
    - "A tall palmetto tree stands at the center of the left scene. Beneath it lies a fallen oak, uprooted and broken. The palmetto represents Fort Sullivan, whose walls were built of palmetto logs, and the oak represents the British fleet, whose ships were made of oak."
    - "The palmetto's usefulness in the battle was structural. Cannon balls fired at palmetto logs embedded in the soft, fibrous wood rather than shattering the walls. Ordinary wooden fort construction would have splintered on impact. The palmetto held, and the fort survived."
  - id: spears
    name: The Twelve Spears
    image: /images/coats-of-arms/south-carolina/elements/spears.webp
    paragraphs:
    - "Twelve spears are bound to the palmetto trunk. They represent the twelve other colonies standing alongside South Carolina in 1776. Together with South Carolina, they made thirteen."
  - id: hope
    name: The Goddess Spes
    image: /images/coats-of-arms/south-carolina/elements/hope.webp
    paragraphs:
    - "On the right side of the arms, a female figure walks along a shore. She is Spes, the Roman goddess of hope. She holds a laurel branch in one hand, and scattered weapons lie on the ground near her feet. The sun rises behind her on the horizon."
    - "The scene reads as a sequence: the weapons on the ground belong to a conflict that has passed. The goddess walks forward, away from them, toward the rising sun. The word Spes appears below the figure."
  - id: mottoes
    name: The Mottoes
    image: /images/coats-of-arms/south-carolina/elements/mottoes.webp
    paragraphs:
    - "The arms carry two official state mottoes. Dum Spiro Spero means While I Breathe, I Hope. Animis Opibusque Parati means Prepared in Mind and Resources. Both appear on the design with the year 1776."
    - "Two additional phrases appear within the scenes. Quis Separabit, meaning Who Will Separate Us, appears beside the palmetto. Meliorem Lapsa Locavit, meaning Having Fallen, She Has Set Up a Better One, appears with the date 1776, a reference to what replaced British colonial rule."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the South Carolina Coat of Arms
  paragraphs:
  - "The two scenes work as a before and after. The left scene shows what happened in 1776: a palmetto fort defeated a British fleet. The right scene shows what the founders believed would follow: a future guided by hope, with the weapons of war left on the ground behind the goddess."
  - "The twelve spears connect the state to the rest of the new nation. South Carolina did not act alone. The spears acknowledge the other colonies as part of the same cause."
  - "Both mottoes reflect the same pairing. Dum Spiro Spero ties breathing to hope, a statement of persistence. Animis Opibusque Parati is a statement of readiness. Together they describe a state that was prepared for war and still oriented toward hope."

- id: facts
  icon: fa-solid fa-lightbulb
  title: South Carolina Coat of Arms Facts
  facts:
  - "Adopted: Authorized by the South Carolina General Assembly on April 2, 1776."
  - "Battle reference: The design records the June 28, 1776 Battle of Sullivan's Island, where a palmetto-log fort held off a British naval attack lasting about ten hours."
  - "The palmetto logs absorbed British cannon fire instead of splintering, which is why the fort survived. An oak-log fort would have shattered."
  - "The twelve spears bound to the palmetto represent the twelve other colonies alongside South Carolina in 1776."
  - "The two official state mottoes are Dum Spiro Spero (While I Breathe, I Hope) and Animis Opibusque Parati (Prepared in Mind and Resources), both adopted in 1776."
  - "No specific designer of the coat of arms is named in the historical record."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the South Carolina Coat of Arms
  paragraphs:
  - "No coat of arms for South Carolina predates the 1776 design. Before independence, South Carolina operated as a British colony under the Crown's authority and did not maintain a separate state coat of arms."
  - "The 1776 design has remained in use without a documented major redesign. Historical renderings from the eighteenth and nineteenth centuries show the same basic composition."
