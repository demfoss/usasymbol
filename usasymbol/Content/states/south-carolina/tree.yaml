seo_title: "South Carolina State Tree | Cabbage Palmetto"
seo_description: 'South Carolina made cabbage palmetto its state tree in 1939, linking the living symbol to Fort Moultrie, the flag, and the Palmetto State nickname.'

intro_text: "South Carolina adopted the Cabbage Palmetto as its state tree in 1939. Few symbols are more deeply woven into the state's identity: the palmetto gave South Carolina its nickname, appears on the flag, and points back to the 1776 defense of Charleston."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of South Carolina"
    paragraphs:
      - "South Carolina's official state tree is the Cabbage Palmetto, a palm species native to the southeastern coastal United States. This palm grows 40 to 50 feet tall along South Carolina's coast, occasionally reaching 60 feet. The trunk measures one to two feet in diameter and appears smooth or covered with old leaf bases creating a crosshatch pattern. Technically, palmetto is not a tree in the botanical sense - palms are monocots more closely related to grasses than to true trees. Yet South Carolina designated palmetto as its state tree because the species defines coastal landscapes and state character more completely than any traditional tree could. The palm grows slowly, adding only a few inches per year, but can live 100 to 150 years in South Carolina. Unlike true trees, palms grow from a single terminal bud at the crown. If this bud is damaged or destroyed, the entire palm dies."
      - "The leaves provide instant recognition with their distinctive fan shape. Each leaf measures four to six feet across, composed of many leaflets radiating from a central point creating a circular fan. The leaflets are stiff and fold slightly along their length. A long stem or petiole measuring three to six feet attaches the leaf to the trunk. These stems lack teeth or spines, distinguishing Cabbage Palmetto from saw palmetto. The leaves emerge bright green and darken with age. Old leaves turn brown and droop against the trunk before eventually falling. The common name 'cabbage' comes from the edible terminal bud at the crown, called palm cabbage or hearts of palm, though harvesting this bud kills the palm."
      - "Cabbage Palmetto grows naturally along South Carolina's coast and coastal plain, thriving within roughly 50 miles of the ocean. The species tolerates salt spray, sandy soils, and coastal storms that would kill most trees. Palmettos line South Carolina beaches, grow in maritime forests, and populate coastal cities from Myrtle Beach to Hilton Head Island. The palm reaches inland along rivers and in protected low-country areas but cannot survive the colder winters of South Carolina's piedmont and mountain regions. Charleston contains thousands of palmettos creating the quintessential low-country landscape. The palm's salt tolerance and storm resistance made it essential for stabilizing South Carolina's barrier islands and coastal areas."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Cabbage Palmetto"
    paragraphs:
      - "The official name is Cabbage Palmetto, with 'cabbage' referring to the edible terminal bud. South Carolinians often call it simply palmetto. The scientific name Sabal palmetto combines Sabal (possibly from a Central American word for palm) with palmetto (Spanish for little palm). Early South Carolina colonists called it cabbage tree or Carolina palmetto. The genus Sabal includes about 15 species of palms native to the Americas."
      - "Some references use cabbage palm, though this name also applies to other palms. The species belongs to the Arecaceae family, the palm family. South Carolina's Cabbage Palmetto is the same species found along the Atlantic and Gulf coasts from North Carolina to Florida and west to Texas. The palm reaches its northern limit just beyond South Carolina in North Carolina. The species defines the South Carolina coast so completely that 'Palmetto State' became the official nickname, appearing on license plates and in countless state references."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Cabbage Palmetto Became the South Carolina State Tree"
    paragraphs:
      - "South Carolina adopted the Cabbage Palmetto as its official state tree in 1939. The South Carolina General Assembly passed Act No. 63 during the 1939 session. The designation formalized a connection between South Carolina and palmetto that dated to the Revolutionary War. By 1939, the palmetto had appeared on South Carolina's flag and seal for over 160 years and defined the state's coastal character. The adoption simply made official what South Carolinians had long considered their symbolic tree."
      - "South Carolina selected Cabbage Palmetto because the species played a legendary role in state history. On June 28, 1776, British warships attacked a fort on Sullivan's Island defending Charleston Harbor. Colonel William Moultrie commanded the American garrison stationed at a fort built from palmetto logs. British cannons fired over 7,000 rounds at the fort. The spongy, flexible palmetto logs absorbed the cannonballs instead of shattering like oak or pine would. Cannonballs either bounced off or embedded harmlessly in the soft wood. The fort withstood the bombardment and the British fleet withdrew in defeat. This victory became one of the first American successes of the Revolutionary War and proved crucial for southern patriot morale, later reflected in [the South Carolina state flag](/states/south-carolina/flag/south-carolina-state-flag)."
      - "The palmetto instantly became South Carolina's symbol of resistance and independence. The first South Carolina state flag, adopted in 1776, featured a white palmetto tree on blue background - the same flag design used today. The crescent in the flag's upper left corner represents the silver crescents worn on patriot caps during the Sullivan's Island battle. Fort Moultrie, named for the American commander, still stands on Sullivan's Island with palmetto logs incorporated into its structure. The tree defined South Carolina's coastal character beyond the Revolutionary War symbolism. Palmetto forests lined South Carolina beaches and coastal cities, creating landscapes found nowhere else in the state. The palm marked the boundary between inland piedmont culture and coastal low-country culture. Charleston's elegant palmetto-lined streets embodied South Carolina sophistication. The distinctive silhouette appeared in South Carolina art, literature, and architecture. The 1939 designation recognized that Cabbage Palmetto represented South Carolina more completely than any other species. The tree gave the state its nickname, appeared on its flag, saved Charleston from British attack, and defined the coastal landscapes that shaped South Carolina symbolism and culture across corridors shown in [States That Border South Carolina](/states/south-carolina/borders)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "South Carolina State Tree Facts"
    facts:
      - "South Carolina adopted Cabbage Palmetto in 1939, formalizing a symbol that appeared on the state flag since 1776"
      - "Palmetto logs at Fort Moultrie absorbed British cannonballs during the June 28, 1776 Revolutionary War battle, helping defend Charleston"
      - "The palmetto appears on South Carolina's state flag and seal, making it the only state tree featured on its state flag"
      - "South Carolina's official nickname is the 'Palmetto State' - the tree literally named the state"
      - "Palmetto is not technically a tree but a palm (monocot), more closely related to grasses than to oak or pine trees"
      - "The edible terminal bud called 'palm cabbage' or hearts of palm gives the species its common name, though harvesting kills the palm"
      - "Cabbage Palmetto tolerates salt spray and coastal storms that would kill most trees, making it essential for South Carolina's barrier islands"
      - "The palm grows from a single terminal bud - if this bud dies, the entire palm dies since palms cannot regrow from side branches"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "South Carolina State Tree and Flower"
    paragraphs:
      - "South Carolina's state flower is the [Yellow Jessamine](/states/south-carolina/flower/yellow-jessamine) (Gelsemium sempervirens), designated in 1924. The state adopted its floral symbol 15 years before choosing palmetto. Both symbols thrive in South Carolina's warm climate and represent the state's southern character. The yellow jessamine vine produces fragrant golden flowers in late winter and early spring as palmettos begin new growth. Yellow jessamine climbs trees and fences across South Carolina, while palmetto towers along the coast. The pair shows South Carolina from vine-covered forests to palm-lined beaches, representing the state's diverse landscapes and distinctive southern ecology."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a South Carolina Cabbage Palmetto"
    paragraphs:
      - "The leaf shape provides instant identification. Look for enormous fan-shaped leaves measuring four to six feet across. The leaf consists of many stiff leaflets radiating from a central point, creating a circular or semicircular fan. Each leaflet folds slightly along its length. The leaf stem or petiole measures three to six feet long and attaches to the trunk. The stem is smooth without teeth or spines - this distinguishes Cabbage Palmetto from saw palmetto which has spiny stems. The fan-shaped leaf immediately identifies this as a palm rather than a traditional tree."
      - "The trunk shows distinctive characteristics. Young palmettos often retain old leaf bases creating a crosshatch or boot pattern on the trunk. As palms mature, these bases may fall off leaving a smooth gray-brown trunk. The trunk appears remarkably uniform in diameter from base to crown, unlike trees that taper. The top of the palm shows a crown of 15 to 25 living leaves. Old brown dead leaves often hang below the green crown before eventually falling. In summer, look for branched flower clusters emerging from among the leaves. These creamy white flowers develop into small black berries by fall."
      - "The overall form shows a single unbranched trunk topped with a spherical crown of fan-shaped leaves. Young palmettos develop short trunks or remain trunkless for years before growing upward. Mature palms stand 40 to 50 feet tall with crowns spreading 10 to 15 feet across. Unlike trees with branches, palms produce leaves only from the single terminal bud at the top. The trunk never increases in diameter after the palm reaches full height. Storm damage may cause the trunk to lean, but palms rarely blow over due to flexible trunks and deep root systems. The uniform trunk and spherical crown create the recognizable silhouette that defines South Carolina's coast."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the South Carolina State Tree Symbolizes"
    paragraphs:
      - "Cabbage Palmetto represents South Carolina's revolutionary heritage and coastal character. The tree recalls resilience through the story of absorbing British cannonballs at Fort Moultrie just as South Carolinians absorbed hardships throughout history. For South Carolinians, palmetto evokes coastal low-country culture, Charleston elegance, and beach landscapes that define the state. The species reflects South Carolina's distinctiveness - the only state where palms rather than oaks or pines define landscapes and character. The palmetto on the state flag reminds residents of Revolutionary War courage and independence. The tree represents how South Carolina's coast differs from inland regions and from other states. Few state trees are tied so directly to a flag, nickname, and Revolutionary War story."

faq:
  - question: "What is the South Carolina state tree?"
    answer: "The Cabbage Palmetto (Sabal palmetto) is South Carolina's official state tree. The South Carolina General Assembly adopted it in 1939, formalizing a symbol that appeared on the state flag since 1776."
  
  - question: "What is the South Carolina state tree called?"
    answer: "South Carolina's state tree is called Cabbage Palmetto or simply palmetto. The scientific name is Sabal palmetto. It's also been called cabbage tree or Carolina palmetto. The 'cabbage' refers to the edible terminal bud at the crown."
  
  - question: "When was the South Carolina state tree adopted?"
    answer: "South Carolina adopted the Cabbage Palmetto as its official state tree in 1939. The General Assembly passed Act No. 63 during the 1939 session, formalizing a symbol that dated to the Revolutionary War."
  
  - question: "Why is the Cabbage Palmetto South Carolina's state tree?"
    answer: "South Carolina chose Cabbage Palmetto because palmetto logs at Fort Moultrie absorbed British cannonballs on June 28, 1776, helping defend Charleston in a crucial Revolutionary War victory. The tree immediately became South Carolina's symbol, appearing on the state flag adopted in 1776 - the same design used today. The palmetto gave South Carolina its 'Palmetto State' nickname. The species defines South Carolina's coastal landscapes and low-country culture. No tree connects more closely to any state than palmetto connects to South Carolina."
  
  - question: "What is the South Carolina state tree name?"
    answer: "The name is Cabbage Palmetto - 'cabbage' refers to the edible terminal bud, and 'palmetto' is Spanish for little palm. The scientific name is Sabal palmetto. South Carolinians often call it simply palmetto."
  
  - question: "Where does the South Carolina state tree grow?"
    answer: "The Cabbage Palmetto grows naturally along South Carolina's coast and coastal plain within about 50 miles of the ocean. It thrives on beaches, maritime forests, and coastal cities from Myrtle Beach to Hilton Head Island. The palm tolerates salt spray and sandy soils. It grows naturally along the Atlantic and Gulf coasts from North Carolina to Texas."
  
  - question: "What are some facts about the South Carolina state tree?"
    answer: "The Cabbage Palmetto grows 40 to 50 feet tall and appears on South Carolina's state flag since 1776. Palmetto logs at Fort Moultrie absorbed British cannonballs in 1776. The tree gave South Carolina its 'Palmetto State' nickname. Palmetto is technically a palm, not a tree - it's a monocot related to grasses. The edible terminal bud is called palm cabbage. The palm tolerates salt spray and coastal storms. It grows from a single bud - if the bud dies, the entire palm dies."
  
  - question: "How do you recognize the South Carolina state tree?"
    answer: "Look for enormous fan-shaped leaves (four to six feet across) with stiff leaflets radiating from a central point. The leaf stem is smooth without spines. The trunk is uniform in diameter, often with old leaf bases creating a crosshatch pattern. The palm produces a single unbranched trunk with a spherical crown of 15 to 25 leaves at the top. Small black berries develop from white flowers. The distinctive silhouette is unmistakable on South Carolina's coast."

