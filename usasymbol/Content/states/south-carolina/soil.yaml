seo_title: "South Carolina State Soil | Orangeburg Series"
seo_description: "The South Carolina state soil is the Orangeburg series. It covers millions of acres in the Coastal Plain and grows tobacco, cotton, and soybeans."
hero_image: /images/soils/south-carolina/south-carolina-state-soil-hero.webp
