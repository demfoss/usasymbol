seo_title: "South Carolina State Soil | Bohicket Series"
seo_description: "The South Carolina state soil is the Bohicket series, a gray tidal marsh soil of the Lowcountry where smooth cordgrass grows along the coast."
hero_image: /images/soils/south-carolina/south-carolina-state-soil-hero.webp
