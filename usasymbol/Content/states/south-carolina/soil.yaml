faq:
- question: What is South Carolina's state soil?
  answer: "South Carolina's state soil is the Bohicket series, a gray tidal marsh soil found along the coast where smooth cordgrass grows."
- question: Why is Bohicket soil gray?
  answer: "Bohicket soil is underwater or saturated most of the time, so it has very little oxygen. Without oxygen, iron does not rust red or brown, and the soil stays gray and greenish gray."
- question: Where is Bohicket soil found?
  answer: "Bohicket soil lies on level tidal flats along the Atlantic coast, usually less than 3 feet above sea level. It occurs in South Carolina and other Southeastern coastal states."
- question: Can you farm Bohicket soil?
  answer: "No. Bohicket soil is flooded by the tides and very poorly drained. It is used as wetland wildlife habitat."
- question: What lives on Bohicket soil?
  answer: "Smooth cordgrass is the main plant. The marsh also shelters young fish and shellfish, fiddler crabs, oysters, and many wading birds."

