intro_text: "South Carolina's state soil is the Bohicket series, a soft gray soil of the tidal salt marshes. It is not a farm soil at all. Twice a day the tide floods it, and it supports the cordgrass marshes that make the Lowcountry coast famous. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-water
  title: South Carolina State Soil
  paragraphs:
  - "Bohicket soil is an Entisol, a very young soil that is still being built. Each tide carries in fine silt and clay from the ocean and rivers, and the marsh grasses trap it, adding new layers bit by bit."
  - "Because it stays waterlogged, the soil has almost no oxygen. Instead of brown and red colors, it is dark gray and greenish gray, and it contains sulfur compounds that give marsh mud its rotten-egg smell."

- id: history
  icon: fa-solid fa-landmark
  title: Why South Carolina Chose the Bohicket Soil
  paragraphs:
  - "The Bohicket series was established in 1974, and its official reference profile was described in Beaufort County, South Carolina."
  - "South Carolina picked a soil that celebrates the coast rather than the farm field. Salt marshes are nurseries for shrimp, crabs, oysters, and fish, and they are one of the defining landscapes of the Lowcountry."

- id: profile
  icon: fa-solid fa-layer-group
  title: Bohicket Soil Profile and Horizons
  paragraphs:
  - "A Bohicket profile is gray almost from top to bottom. The surface is dark gray silty clay loam full of fibrous cordgrass roots. Below that lies thick, sticky silty clay, and deeper down the soil turns greenish gray clay. The gray and green colors are a sign of soil that has been underwater for a very long time."
  layers:
  - horizon: Ag
    name: Root mat
    depth_in: "0–10"
    color_hex: "#5E5E56"
    color_name: dark gray
    texture: silty clay loam
    note: packed with fibrous roots of marsh grasses
  - horizon: Cg1
    name: Marsh mud
    depth_in: "10–49"
    color_hex: "#5E5E56"
    color_name: dark gray
    texture: silty clay
    note: soft, sticky sediment laid down by the tides
  - horizon: Cg2
    name: Mixed layer
    depth_in: "49–55"
    color_hex: "#4E463C"
    color_name: dark gray and very dark grayish brown
    texture: silty clay and fine sandy loam
    note: thin sandy streaks between clay layers
  - horizon: Cg3
    name: Greenish clay
    depth_in: "55–68"
    color_hex: "#6E7A70"
    color_name: greenish gray
    texture: clay
    note: green-gray color shows long-term saturation
  - horizon: Cg4
    name: Deep clay
    depth_in: "68–80"
    color_hex: "#55625A"
    color_name: dark greenish gray
    texture: clay
    note: the oldest marine sediment in the profile

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Bohicket Soil Is Found
  paragraphs:
  - "Bohicket soil lies on broad, level tidal flats along the Atlantic coast, usually less than 3 feet above mean sea level. It is very poorly drained, and water barely moves through it."
  - "Besides South Carolina, Bohicket soil is mapped along the coasts of North Carolina, Virginia, Georgia, Florida, Alabama, and Louisiana. It is an extensive soil of the Southeast's salt marshes."
  counties:
  - Beaufort

- id: agriculture
  icon: fa-solid fa-fish
  title: Wildlife on Bohicket Soil
  paragraphs:
  - "Bohicket soil is used as wetland wildlife habitat. Smooth cordgrass, the tall grass of the low marsh, is the main plant growing on it."
  - "The marsh is a feeding ground for wading birds and a shelter for young fish and shellfish. Fiddler crabs dig burrows in the mud, and oysters grow along the tidal creeks that wind through it."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Bohicket Soil Facts
  facts:
  - "Bohicket soil is classified as a fine Typic Sulfaquent, an Entisol that forms in waterlogged, sulfur-rich sediment."
  - "The series was established in 1974, with its reference profile in Beaufort County, South Carolina."
  - "Bohicket soil sits less than about 3 feet above mean sea level and is flooded by the tides."
  - "Its gray and greenish colors come from iron in a low-oxygen environment, the opposite of the rusty reds found in well-drained soils."
  - "Smooth cordgrass is the main plant on Bohicket soil."

