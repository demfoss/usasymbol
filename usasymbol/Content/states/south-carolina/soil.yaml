faq:
- question: What is South Carolina's state soil?
  answer: "South Carolina's state soil is the Orangeburg series, a deep, yellowish-red to red soil found on the sandy uplands of the inner Coastal Plain. It is recognized by the USDA Natural Resources Conservation Service as South Carolina's representative state soil and supports tobacco, cotton, soybeans, and loblolly pine across the middle of the state."
- question: Why is it called Orangeburg soil?
  answer: "The series is named after Orangeburg County in central South Carolina, where USDA soil scientists first formally described and mapped the soil. Orangeburg County has been a center of Coastal Plain farming since the 1730s and sits in the heart of the soil's distribution."
- question: What color is Orangeburg soil?
  answer: "The surface is a pale sandy brown — light-colored and gritty. Below a pale eluvial layer, the argillic subsoil is yellowish red to red, stained by iron oxide minerals that formed as ancient marine sediments weathered over millions of years. The vivid contrast between pale surface and red subsoil is visible in road cuts across the inner Coastal Plain."
- question: Where is Orangeburg soil found in South Carolina?
  answer: "Orangeburg soil covers the gently rolling uplands of the inner Coastal Plain — the broad terrain running across the middle of South Carolina between the Fall Line and the tidewater coast. It is most concentrated in Orangeburg, Calhoun, Bamberg, Barnwell, and Lexington counties at elevations of 100 to 400 feet."
- question: What crops grow in Orangeburg soil?
  answer: "Tobacco, cotton, corn, soybeans, and peanuts are the main crops. Flue-cured tobacco has grown on Orangeburg soil for nearly 300 years, favored by the fast-draining sandy surface. Soybeans now cover more acres than tobacco. Sweet potatoes grow on the sandier sites. Loblolly pine plantations cover retired farmland."
- question: Who chose Orangeburg as South Carolina's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Orangeburg series to represent South Carolina. It was chosen because it is the most extensive and agriculturally significant soil on the inner Coastal Plain — the landscape at the center of South Carolina's farming history."
- question: How deep is the red clay layer in Orangeburg soil?
  answer: "The argillic horizon — the red clay subsoil — runs from about 18 to 44 inches below the surface. Below that, a transition zone grades back into the pale parent material around 44 to 65 inches. The full soil profile is typically more than five feet deep before reaching unweathered marine sediment."

