sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is South Carolina's State Snack Food?"
    paragraphs:
      - "Boiled peanuts are South Carolina's official state snack food, designated by the South Carolina General Assembly in 2006. They are made by simmering raw peanuts in salted water until soft."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Boiled Peanuts"
    paragraphs:
      - "Boiled peanuts are made by cooking raw, unroasted peanuts in their shells in salted water for one to several hours, until the shells soften and the peanuts inside take on a soft, almost bean-like texture. They are sold across South Carolina from roadside stands, often out of large pots kept simmering along highways."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Boiled Peanuts Became South Carolina's State Snack Food"
    paragraphs:
      - "The South Carolina General Assembly designated boiled peanuts the official state snack food in 2006."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why South Carolina Chose Boiled Peanuts"
    paragraphs:
      - "Peanuts are grown widely across South Carolina, and boiling them fresh from the field is a long-standing tradition in the state, especially in rural areas where roadside stands sell them by the bag. The designation reflects both the state's peanut farming and a snack habit tied specifically to the South."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Boiled Peanuts Facts"
    facts:
      - "Adopted as South Carolina's state snack food in 2006."
      - "Boiled peanuts are cooked raw and unshelled in salted water."
      - "South Carolina is one of the leading peanut growing states in the country."
      - "Roadside stands selling boiled peanuts are common across rural South Carolina."

