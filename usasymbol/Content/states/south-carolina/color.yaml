intro_text: "The official state color of South Carolina is **Indigo Blue**, formally designated by the South Carolina General Assembly in 2008 under the South Carolina Code of Laws. Officially designated in 2008, it appears on [the South Carolina state flag](/states/south-carolina/flag/south-carolina-state-flag) and throughout official state branding and government communications. All technical color values — HEX, RGB, CMYK, and Pantone — are in the specifications below, suitable for print, web, and official South Carolina state branding."

