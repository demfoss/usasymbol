faq:
  - question: "What is the official state color of South Carolina?"
    answer: "The official state color of South Carolina is Indigo Blue, designated in 2008 under the South Carolina Code of Laws. The precise shade is Pantone 282 C (Coated), determined through forensic analysis of Revolutionary War artifacts from Colonel Moultrie's 2nd South Carolina Regiment."
  - question: "What is the HEX code for South Carolina Indigo Blue?"
    answer: "The standard HEX code for South Carolina Indigo Blue is #003167, corresponding to Pantone PMS 282 C. This shade was confirmed by the South Carolina State Flag Study Committee based on surviving Revolutionary War artifacts."
  - question: "Is white also an official state color of South Carolina?"
    answer: "No. South Carolina's official state color is only Indigo Blue. White appears on the state flag as the color of the palmetto tree and crescent but is not designated as an official state color in the South Carolina Code of Laws."
  - question: "Why is South Carolina's state color called Indigo Blue?"
    answer: "Indigo Blue refers both to the deep blue color itself and to the indigo plant (Indigofera tinctoria) — a major South Carolina colonial cash crop that produced the dye used to create the blue of Colonel Moultrie's regiment's uniforms. The color is historically inseparable from South Carolina's indigo agriculture and its Revolutionary War military heritage."
  - question: "When was the South Carolina state flag first designed?"
    answer: "Colonel William Moultrie designed the first South Carolina flag in 1775, using the deep blue of his militia's uniforms and a white crescent from their cap insignia. The palmetto tree was added in 1861. The flag's design has remained substantially unchanged for 250 years, making it one of the oldest continuously used state flag designs in America."

