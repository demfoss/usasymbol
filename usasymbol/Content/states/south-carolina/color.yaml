sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "South Carolina designated Indigo Blue as its official state color in 2008 under the South Carolina Code of Laws, specifying the precise shade as Pantone 282 C (Coated). This was the result of extensive historical research by the South Carolina State Flag Study Committee, which was established in 2018 to propose an official, uniform design for the state flag based on historically accurate details and legislative adoptions. The committee — working with archaeologists, historians, and conservation scientists — traced the original indigo blue of Moultrie's Revolutionary War uniforms to surviving regimental cap badges recovered from archaeological sites, ultimately confirming Pantone 282 C as the closest match to the historical color and reinforcing [the Palmetto State identity](/states/south-carolina/nickname/the-palmetto-state)."
      - "The South Carolina state flag itself is one of the oldest continuously used state symbols in American history. In 1775, Colonel William Moultrie was commissioned by the Revolutionary Council of Safety to design a flag for South Carolina's troops. He chose deep blue to match his militia's uniforms and added a white crescent from the silver insignia on their caps. This design was first flown at Fort Johnson and subsequently became the standard of the South Carolina militia throughout the Revolutionary War. On June 28, 1776, the flag flew over Fort Moultrie during the Battle of Sullivan's Island — one of the first major American victories of the Revolutionary War — where British cannon fire failed to breach the fort's palmetto-log walls. The palmetto tree was later added to the flag in 1861 in honor of this victory, tying color history to [South Carolina's state tree](/states/south-carolina/tree/cabbage-palmetto)."
    subsections:
      - subtitle: "Pantone 282 C and the Archaeological Color Standard"
        text: "The South Carolina State Flag Study Committee's determination of Pantone 282 C as the official indigo shade represents one of the most scientifically rigorous state color determinations in American history. The committee worked with Dr. Emerson of the South Carolina Department of Archives and History to locate surviving Revolutionary War artifacts, ultimately finding two surviving cap badges from Moultrie's 2nd South Carolina Regiment at Old Jacksonboro and Fort Johnson on James Island. A regimental flag from 1776, purchased by the National Museum of American History (Smithsonian) in 1989, also informed the color analysis. Pantone 282 C Coated was approved as both a visual reference and a spectrophotometric standard, with the committee noting that 'a spectral reference curve may be constructed from sample data measured in 10nm intervals' for objective comparisons."
      - subtitle: "South Carolina's Indigo Economy and the Color's Historical Roots"
        text: "The connection between indigo blue and South Carolina runs deeper than military history. Eliza Lucas Pinckney, a planter's daughter, successfully cultivated indigo (Indigofera tinctoria) in South Carolina's lowcountry beginning in 1744, developing the crop into one of the colony's most valuable exports. By the 1770s, South Carolina was exporting over 1.1 million pounds of indigo annually to Britain, making it the principal supplier of indigo dye for the British textile industry. The indigo trade — which also enabled the blue uniform color of Moultrie's soldiers — thus contributed both economically and visually to the Revolutionary War, creating a remarkable loop of history in which South Carolina's own export product colored the uniforms that inspired the state's defining official color."
  - id: "symbolism"
    title: "What the Color Represents"
    style: "highlight"
    paragraphs:
      - "Indigo Blue in South Carolina carries a singular depth of historical meaning. It is simultaneously the color of Revolutionary War bravery, of colonial agricultural enterprise, and of the palmetto-defended liberty that defines South Carolina's proudest historical moment. No other state has tied its official color so precisely to a specific military uniform shade documented through forensic archaeological analysis."
    subsections:
      - subtitle: "The Battle of Sullivan's Island (June 28, 1776)"
        text: "The Battle of Sullivan's Island was one of the most consequential American victories of the Revolutionary War. A British fleet under Admiral Peter Parker attacked Fort Moultrie, the palmetto-log fort guarding Charleston Harbor, with a squadron of warships on June 28, 1776. The soft palmetto wood of the fort's walls proved uniquely effective at absorbing cannon fire — unlike the stone and brick of conventional forts — and the fort held through a sixteen-hour bombardment. At one point during the battle, a cannon shot knocked the flag from its staff. Sergeant William Jasper ran into the open fire, retrieved the flag, and raised it again on his lance — rallying the troops and becoming one of the Revolution's most celebrated acts of individual heroism. Charleston was saved from British occupation for four more years."
      - subtitle: "Colonel Moultrie and the Origins of the Indigo Flag"
        text: "Colonel William Moultrie's decision to base the South Carolina flag on the color of his regiment's uniforms was practical as well as symbolic — the flag needed to be instantly identifiable in the confusion of battle as belonging to South Carolina's forces. The blue he chose was indigo blue, the most available deep blue dye in colonial South Carolina precisely because of the thriving indigo cultivation industry that Eliza Lucas Pinckney had established three decades earlier. The crescent on the flag — taken from the silver gorget insignia worn on the front of the soldiers' caps — completed a design that would endure with minimal changes from 1775 through the present day, a period of 250 years."
  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Indigo Blue (Pantone 282 C) defines the entire field of the South Carolina state flag — a white palmetto tree centered on an indigo blue field, with a white crescent in the upper left. The simplicity and boldness of this design — two colors, two symbols, 250 years of continuous use — has made the South Carolina flag one of the most recognizable state flags in the nation, ranked 10th in the 2001 NAVA survey. Indigo Blue appears in South Carolina government branding, the South Carolina State House architectural color scheme, South Carolina National Guard insignia, and the official materials of the South Carolina Secretary of State. The flag has become a cultural icon far beyond state government, appearing on clothing, home goods, and souvenirs throughout the Southeast as a symbol of South Carolina's distinctive heritage, including neighboring corridors in [States That Border South Carolina](/states/south-carolina/borders)."

