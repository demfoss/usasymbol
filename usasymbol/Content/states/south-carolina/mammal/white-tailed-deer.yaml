faq:
  - question: "What is South Carolina's state animal?"
    answer: "South Carolina's state animal is the white-tailed deer (Odocoileus virginianus), designated in 1972. The designation recognized dramatic population recovery from fewer than 1,000 animals in the early 1900s to several hundred thousand through restocking programs and habitat recovery. The deer represents South Carolina's conservation success and hunting heritage."
  
  - question: "When was the white-tailed deer designated as South Carolina's state animal?"
    answer: "The white-tailed deer became South Carolina's official state animal in 1972. The designation honored successful restoration through Department of Natural Resources management and the species' importance to South Carolina's hunting culture and rural economy. The deer population had recovered spectacularly from depletion by the 1970s."
  
  - question: "Why did South Carolina choose the white-tailed deer as its state animal?"
    answer: "South Carolina chose the white-tailed deer because it represented environmental transformation from agricultural exhaustion to forest recovery. Cotton agriculture depleted soils and destroyed habitat by the early 1900s, causing deer near-extinction. Agricultural collapse and land abandonment allowed reforestation creating deer habitat. The deer also adapted to South Carolina's diverse geography from coastal swamps to mountain foothills, representing Low Country to Up Country ecological diversity."
  
  - question: "How many white-tailed deer live in South Carolina?"
    answer: "South Carolina's white-tailed deer population is approximately 750,000 animals as of the 2020s. This represents dramatic recovery from fewer than 1,000 in the early 1900s. Despite annual harvest exceeding 200,000 deer, populations remain stable due to high reproductive rates and abundant habitat created by agricultural land conversion to forests."
  
  - question: "Where can I see white-tailed deer in South Carolina?"
    answer: "White-tailed deer appear throughout South Carolina in all 46 counties. Best viewing locations include Francis Marion National Forest north of Charleston, Congaree National Park near Columbia, ACE Basin in the coastal plain, Sumter National Forest in Up Country, and Santee Cooper lakes region. Suburban areas in Columbia and Greenville also support visible deer populations. Dawn and dusk provide optimal viewing times."
  
  - question: "What is the ACE Basin?"
    answer: "The ACE Basin is a protected ecosystem encompassing the Ashepoo, Combahee, and Edisto Rivers in South Carolina's coastal plain. This 350,000-acre area includes rivers, wetlands, and forests supporting abundant wildlife including white-tailed deer. The basin represents one of the largest undeveloped estuaries on the Atlantic coast, providing critical habitat for deer and numerous other species."
  
  - question: "Does South Carolina allow hunting with dogs?"
    answer: "Yes, South Carolina uniquely allows deer hunting with dogs in certain coastal counties, maintaining traditional Low Country hunting methods. This practice dates to plantation-era hunts and remains popular in counties where habitat and cultural traditions support it. The Department of Natural Resources regulates dog hunting with specific seasons and requirements distinct from still-hunting and stand-hunting regulations."
  
  - question: "What is chronic wasting disease and does it affect South Carolina deer?"
    answer: "Chronic wasting disease (CWD) is a fatal prion disease affecting deer with no treatment or vaccine. As of 2024, South Carolina had not detected CWD in wild deer populations, though the disease occurs in nearby states. The Department of Natural Resources conducts surveillance testing and restricts deer importation to prevent CWD introduction. Preventing CWD remains critical for protecting South Carolina's deer herd and hunting economy."
  
  - question: "How did cotton agriculture affect South Carolina's deer?"
    answer: "Cotton agriculture devastated white-tailed deer populations by destroying habitat and depleting soils. Cotton cultivation peaked in South Carolina during the late 1800s and early 1900s, clearing forests for cropland and exhausting soils through intensive farming. By 1900, deer had nearly vanished from most of South Carolina. The boll weevil infestation starting around 1917 collapsed cotton agriculture, forcing land abandonment. Abandoned cotton fields reverted to forests, inadvertently creating habitat allowing deer recovery."

