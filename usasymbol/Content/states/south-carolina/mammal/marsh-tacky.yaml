faq:
  - question: "What is South Carolina's state heritage horse?"
    answer: "South Carolina's state heritage horse is the marsh tacky (Equus caballus), designated in 2010. The marsh tacky is a rare colonial Spanish horse breed unique to South Carolina that developed from horses Spanish explorers abandoned on Sea Islands in the 1500s, remaining relatively isolated for over 400 years."
  
  - question: "When was the marsh tacky designated as South Carolina's heritage horse?"
    answer: "The marsh tacky became South Carolina's official state heritage horse on June 11, 2010, when Governor Mark Sanford signed Act Number 240 into law. This was the same legislation that designated the mule as state heritage work animal, creating complementary symbols representing different aspects of South Carolina's equine heritage—the marsh tacky honoring Revolutionary War military service and Lowcountry settlement, while the mule represents post-Civil War agricultural labor."
  
  - question: "Why is the horse called a 'marsh tacky'?"
    answer: "The name 'marsh tacky' reflects the breed's habitat and historical commonness. 'Marsh' refers to the coastal marshes and Sea Islands where these horses lived for centuries. 'Tacky' comes from old English meaning 'common' or 'cheap'—marsh tackies were the most common and affordable horses in Lowcountry South Carolina from colonial times through the 1950s, owned by rich and poor families alike. Despite being 'common,' their abilities in swamp terrain were anything but ordinary."
  
  - question: "How did marsh tackies help win the Revolutionary War?"
    answer: "Marsh tackies gave General Francis Marion's irregular forces decisive tactical advantages during the Revolutionary War's Southern campaigns (1780-1781). These small horses (13-15 hands) navigated dense Lowcountry swamps where British cavalry mounted on larger European breeds could not follow. Marsh tackies traveled long distances on minimal forage without requiring supply wagons, maintained stability in pluff mud and marshes, and remained calm when tangled in undergrowth or crossing water obstacles. Marion's troops struck British forces with surprise attacks, then vanished into swamps on marsh tackies, frustrating British attempts to control South Carolina's countryside. This guerrilla warfare proved so effective that Colonel Banastre Tarleton allegedly declared Marion uncatchable after pursuing him 26 miles through swamps."
  
  - question: "Are marsh tackies endangered?"
    answer: "Yes, marsh tackies are critically endangered. Only approximately 400 horses remain worldwide, up from about 100 discovered during 2005-2006 surveys but still far below the 1,000 horses needed for permanent survival. Both the Livestock Conservancy and Equus Survival Trust classify marsh tackies as critical, indicating fewer than 200 annual registrations and fewer than 100 breeding mares. The breed nearly went extinct between 1950-2000 when automobiles and tractors eliminated practical need for horses. Conservation efforts since 2007 have stabilized population, but ongoing work remains essential."
  
  - question: "What is the Swamp Fox Trot?"
    answer: "The Swamp Fox Trot is the marsh tacky's distinctive four-beat ambling gait, officially named in 2010 by the Carolina Marsh Tacky Association to honor General Francis Marion. Research at Mississippi State University confirmed marsh tackies as naturally gaited horses, with movement biomechanics similar to Brazil's Mangalarga Marchador (another Colonial Spanish breed). This smooth, comfortable gait allows riders to cover long distances without fatigue while maintaining better balance on uneven swamp terrain. The gait proved tactically valuable during Revolutionary War operations requiring extended patrols through swamps and provided the comfort that made marsh tackies favored hunting mounts for generations of Lowcountry residents."
  
  - question: "How can I see a marsh tacky in South Carolina?"
    answer: "Marsh tackies can be seen at several locations in South Carolina: The Coastal Discovery Museum on Hilton Head maintains horses on historic Honey Horn property with free public access. The Daufuskie Marsh Tacky Society offers living history tours on Daufuskie Island (accessible by boat) combining breed education with island exploration. The Carolina Marsh Tacky Association organizes demonstrations at fairs, festivals, and historical sites throughout South Carolina. Several marsh tackies participate in Revolutionary War reenactments. Some private breeding farms welcome visitors by appointment—contact the Carolina Marsh Tacky Association for referrals."
  
  - question: "What makes marsh tackies different from other horses?"
    answer: "Marsh tackies possess unique characteristics resulting from 400+ years of isolation on South Carolina Sea Islands: They are naturally gaited with a distinctive Swamp Fox Trot providing exceptional smoothness and stability. They exhibit remarkable temperament—remaining calm when tangled in briars, mired in mud, or facing unexpected obstacles rather than panicking like most horses. They have built-in 'woods sense' for navigating swamps and finding safe footing in marshes. They have thicker hides than most breeds, providing superior protection from biting insects and thorns. They are smaller (13-15 hands, 700-900 lbs) but possess strength disproportionate to size. They display primitive markings (dorsal stripes, zebra leg bars) inherited from Spanish ancestors. DNA testing confirms them as genetically distinct from other Colonial Spanish breeds including Florida Cracker Horses and North Carolina Banker Horses."
  
  - question: "Can marsh tackies be purchased or adopted?"
    answer: "Yes, marsh tackies can be purchased from breeders participating in the official registry maintained by the Carolina Marsh Tacky Association. However, potential owners should understand that marsh tackies are critically endangered horses requiring special commitment. All marsh tackies should be registered with the breed registry to ensure genetic diversity is maintained through coordinated breeding programs. Prices reflect the breed's rarity and conservation value. The Carolina Marsh Tacky Association can connect interested buyers with reputable breeders and provides guidance on proper care and breeding protocols. Prospective owners should be prepared to: participate in breed conservation efforts, register any foals produced, consider the horse's genetic value in breeding decisions, and support the association's preservation mission. Because only 400 horses exist worldwide, each individual marsh tacky represents irreplaceable genetic heritage that owners help preserve for future generations."

