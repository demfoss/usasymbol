faq:
  - question: "What is South Carolina's state heritage work animal?"
    answer: "South Carolina's state heritage work animal is the mule (Equus asinus × Equus caballus), designated in 2010. The mule represents the agricultural backbone of South Carolina from the 1860s through the 1950s, particularly in cotton cultivation that defined the state's economy during Reconstruction and the sharecropping era."
  
  - question: "When was the mule designated as South Carolina's heritage work animal?"
    answer: "The mule became South Carolina's official state heritage work animal on June 11, 2010, when Governor Mark Sanford signed Act Number 240 into law. The designation originated as a House amendment to Senate Bill 1030, which simultaneously designated the marsh tacky as state heritage horse, creating separate honors for transportation and agricultural heritage."
  
  - question: "What is a mule and how is it created?"
    answer: "A mule is a hybrid animal created by breeding a male donkey (jack) with a female horse (mare). Mules inherit 63 chromosomes—an odd number resulting from their parents' different chromosome counts (donkeys have 62, horses have 64). This chromosome mismatch renders mules sterile, unable to produce offspring. The reverse cross—male horse with female donkey—produces a hinny, which is rarer and exhibits different characteristics."
  
  - question: "Why did South Carolina choose the mule as heritage work animal?"
    answer: "South Carolina chose the mule to honor the animal that powered the state's agricultural economy from the end of the Civil War through the mid-20th century. Mules dominated cotton farming, tobacco cultivation, and general agriculture during the sharecropping era that characterized rural South Carolina for nearly a century. The designation recognizes both the animal's practical contributions and the agricultural labor system it supported, acknowledging working-class heritage and agricultural transformation following emancipation."
  
  - question: "What advantages do mules have over horses for agricultural work?"
    answer: "Mules offer multiple advantages over horses for agricultural work, particularly in Southern climates. They tolerate heat better, require approximately 25 percent less feed than horses of comparable size, live longer (35-40 years versus 25-30 for horses), and demonstrate superior intelligence and self-preservation instincts. Mules have harder, more durable hooves requiring less farrier attention, resist diseases better, and exhibit more patient temperament for repetitive agricultural tasks. These advantages made mules economically superior for poor farmers during South Carolina's sharecropping era."
  
  - question: "What does 'forty acres and a mule' mean?"
    answer: "The phrase 'forty acres and a mule' refers to Union General William T. Sherman's Special Field Order No. 15, issued January 16, 1865, which redistributed 400,000 acres of coastal land from Charleston, South Carolina, to Florida among newly freed families in 40-acre plots. Sherman later ordered the Army to lend mules to these settlers. By June 1865, approximately 40,000 freedmen had settled on this land. President Andrew Johnson revoked the order that fall, returning the land to former Confederate owners and breaking the promise of land ownership and mule access that would have provided economic independence for formerly enslaved families."
  
  - question: "Who was George Washington's 'Royal Gift' and why is it significant?"
    answer: "Royal Gift was a prize Andalusian jack donkey sent to George Washington by King Charles III of Spain in 1785. Standing over 15 hands high, Royal Gift was the first Spanish donkey in North America and revolutionized American mule breeding. Washington used Royal Gift to breed superior mules at Mount Vernon, advertising stud services throughout Virginia and Maryland. His breeding program transformed American agriculture by producing larger, stronger mules than previously available. Washington is called the 'Father of the American Mule' for establishing mule breeding as a standard practice. By 1799, Mount Vernon had 58 mules and only 25 horses, demonstrating the transformation Washington's program created."
  
  - question: "How did mules contribute to South Carolina's cotton economy?"
    answer: "Mules powered South Carolina's cotton economy from the 1860s through the 1950s, serving as the primary draft animals for plowing, planting, cultivating, and hauling cotton to market. A typical cotton farm operated entirely on mule power, with one farmer and two mules capable of working a 40-acre sharecropping plot—plowing 16 acres per day during spring preparation, maintaining crops through summer, and transporting harvested cotton in fall. Mule ownership provided economic leverage for tenant farmers, who negotiated better sharecropping terms (half the crop instead of one-third) when they supplied their own mule and plow rather than relying entirely on landowner resources."
  
  - question: "Are there still working mules in South Carolina today?"
    answer: "Yes, working mules still exist in South Carolina but in far smaller numbers than during the agricultural era before mechanization. Today, mules serve primarily on small family farms maintaining traditional practices, in Amish communities using animal power instead of mechanized equipment, for trail riding and recreational purposes, in historical demonstrations at heritage sites and agricultural festivals, and occasionally in mounted patrol units. The South Carolina Donkey and Mule Association, formed in 1981, maintains knowledge about mule husbandry and organizes demonstrations showing traditional farming techniques. However, commercial agriculture no longer depends on mule power, with tractors and harvesting machines having replaced animal labor throughout South Carolina by the 1970s."

