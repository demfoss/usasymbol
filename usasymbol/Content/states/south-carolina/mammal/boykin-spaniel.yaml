faq:
  - question: "What is South Carolina's state dog?"
    answer: "South Carolina's state dog is the Boykin Spaniel, designated through legislative action signed by Governor Richard Riley on March 26, 1985."
  
  - question: "When was the Boykin Spaniel designated as South Carolina's state dog?"
    answer: "The Boykin Spaniel became South Carolina's official state dog on March 26, 1985, exactly one year after the South Carolina Wildlife and Marine Resources Commission endorsed the breed for this honor on April 20, 1984."
  
  - question: "Why did South Carolina choose the Boykin Spaniel as its state dog?"
    answer: "South Carolina chose the Boykin Spaniel because it is the only dog breed developed entirely in South Carolina. The breed originated near Camden in the early 1900s when sportsman Whit Boykin bred a small, versatile retriever specifically for hunting waterfowl and wild turkeys in the Wateree River Swamp. The compact size made Boykins perfect for small section boats used by hunters navigating narrow swamp channels, solving practical problems unique to South Carolina hunting conditions."
  
  - question: "Where did the Boykin Spaniel breed originate?"
    answer: "The Boykin Spaniel originated near Camden in Kershaw County, South Carolina, around 1905-1910. The breed traces to a stray dog named Dumpy that befriended Spartanburg banker Alexander L. White, who sent the dog to his hunting partner L. Whitaker 'Whit' Boykin near Camden. Boykin developed this stray into a superb hunting dog and used selective breeding to create the Boykin Spaniel breed specifically adapted to South Carolina's Wateree River Swamp hunting conditions."
  
  - question: "What makes Boykin Spaniels unique as hunting dogs?"
    answer: "Boykin Spaniels were specifically bred for South Carolina's hot, humid climate and small boat requirements. Their compact size (25-40 pounds) fits perfectly in section boats used for navigating narrow swamp channels without risking capsizing. Boykins possess exceptional heat tolerance for sustained work in September dove fields and October marshes where temperatures often exceed 90 degrees. The breed serves dual purposes as both waterfowl retriever and turkey hunting dog, with webbed feet for swimming efficiency and calm temperament during turkey calling sequences."
  
  - question: "Are Boykin Spaniels good family pets?"
    answer: "Yes, Boykin Spaniels make excellent family pets while maintaining hunting abilities. The breed transitions easily between field work and home life, demonstrating friendly, affectionate behavior with children and other pets when properly socialized. Boykins are intelligent and eager to please but require regular exercise and mental stimulation to prevent boredom. They thrive on human companionship and generally should not be kept exclusively outdoors. Their versatility as working dogs and family companions makes them ideal for active families who appreciate the breed's South Carolina heritage."
  
  - question: "Is the Boykin Spaniel recognized by major kennel clubs?"
    answer: "Yes, the Boykin Spaniel enjoys full recognition from major kennel organizations. The Boykin Spaniel Society formed in 1977 and maintains the original closed registry established in 1980. The United Kennel Club recognized the breed in 1985, the same year as South Carolina's state dog designation. The American Kennel Club granted full recognition in 2009 after decades of breed documentation, making Boykins eligible for all AKC events including conformation shows, hunt tests, agility, obedience, and rally competitions."
  
  - question: "What is Boykin Spaniel Day?"
    answer: "Boykin Spaniel Day occurs annually on September 1 in South Carolina, established by Governor Richard Riley's proclamation on September 1, 1984. This date celebrates the breed's contributions to South Carolina's hunting traditions and outdoor heritage. September 1 coincides with early dove hunting season, when many Boykin owners take their dogs afield for the first hunts of autumn, continuing traditions established by Whit Boykin more than a century ago. The day promotes awareness of South Carolina's only native dog breed."

