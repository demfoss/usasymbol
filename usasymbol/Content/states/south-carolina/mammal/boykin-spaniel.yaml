title: "Boykin Spaniel"
scientific_name: "Canis lupus familiaris"
adopted_year: 1985

seo_title: "South Carolina State Dog - Boykin Spaniel | Official Breed"
seo_description: "The Boykin Spaniel is South Carolina's state dog, designated in 1985. This breed originated in Camden around 1900 and remains the only dog breed developed in SC."

intro_text: "South Carolina's state dog is the Boykin Spaniel, designated through legislative action signed by Governor Richard Riley on March 26, 1985. The legislature chose this small brown hunting dog because it is the only dog breed developed entirely in South Carolina, originating near Camden in the early 1900s when sportsman Whit Boykin bred a versatile retriever small enough to fit in the section boats used for hunting waterfowl in the Wateree River Swamp. See [South Carolina symbol pages](/states/south-carolina) and the [U.S. state mammals guide](/symbols/mammals)."

common_name: "Boykin Spaniel"
official_since: "1985"
status: "Recognized by American Kennel Club since 2009; healthy breed population throughout United States; September 1 designated as Boykin Spaniel Day in South Carolina"
habitat_in_state: "Domestic companion dogs found throughout South Carolina; originally developed for hunting waterfowl and wild turkey in Wateree River Swamp near Camden"
known_for: "Only dog breed developed in South Carolina; versatile hunting abilities; friendly temperament; compact size perfect for small boats; heat tolerance for Southern climate"

size: "Males: 15.5-17 inches tall at withers; Females: 14-16.5 inches tall"
weight: "Males: 30-40 pounds; Females: 25-35 pounds"
coloration: "Solid liver, brown, or chocolate coat; feathering may show sun-bleached golden to tawny color on ears"
distinctive_traits: "Long, curly, liver-brown coat; floppy spaniel ears; webbed feet for swimming; docked tail (traditional); golden to amber eyes"

habitat: "Domestic companion dogs in homes throughout South Carolina and United States; historically used for hunting in swamps, marshes, upland fields"
range_in_state: "Found statewide as family pets and hunting dogs; highest concentration in Midlands and Lowcountry regions; breed heritage centered around Camden in Kershaw County"
conservation_status: "Healthy breed population; recognized by American Kennel Club (2009), United Kennel Club (1985), and Boykin Spaniel Society (1977)"
where_to_find: "Boykin Spaniel Society headquarters in Camden; breed rescue organizations; homes throughout South Carolina; Southeastern Wildlife Expo in Charleston annually"
symbol_connections: "Represents South Carolina hunting heritage; connects to Wateree River Swamp ecosystems; complements wild turkey (state wild game bird) as turkey hunting dog; reflects state's outdoor traditions"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Governor Richard W. Riley signed legislation making the Boykin Spaniel South Carolina's official state dog on March 26, 1985, exactly one year after the South Carolina Wildlife and Marine Resources Commission endorsed the breed for this honor on April 20, 1984. The ceremony marked the culmination of efforts by breed enthusiasts to recognize South Carolina's only native dog breed, reinforcing [the Palmetto State identity](/states/south-carolina/nickname/the-palmetto-state)."
      - "The 1985 designation occurred during a period when South Carolina accelerated official recognition of state symbols. The legislature had designated the white-tailed deer as state animal in 1972, the wild turkey as state wild game bird in 1976, and would later add the Carolina wren as state bird in 1948, creating a comprehensive celebration of South Carolina's wildlife heritage that also connects to the [state dogs guide](/symbols/dogs)."
    
    subsections:
      - subtitle: "September 1: Boykin Spaniel Day"
        text: "Governor Riley proclaimed September 1, 1984, as the first Boykin Spaniel Day in South Carolina, establishing an annual celebration that continues today. This date recognizes the breed's contributions to South Carolina's hunting traditions and outdoor heritage while promoting awareness of the state's only native dog breed. The September date coincides with early dove hunting season, when many Boykin owners take their dogs afield for the first hunts of autumn, continuing traditions established by Whit Boykin more than a century ago."
      
      - subtitle: "Why South Carolina Chose the Boykin"
        text: "South Carolina selected the Boykin Spaniel because it represents a unique contribution to American dog breeds developed nowhere else. Unlike many state dogs chosen for historical presence or popularity, the Boykin originated specifically in South Carolina through deliberate breeding efforts by Kershaw County residents in the early 1900s. The designation honored both the breed's creators and the distinctive environmental challenges of South Carolina waterfowl hunting that necessitated a small, versatile retriever. By 1985, Boykin Spaniels had spread throughout the United States, but South Carolina claimed special pride in the breed's Camden origins and continued importance to state hunting culture."
      
      - subtitle: "Recognition by National Organizations"
        text: "The Boykin Spaniel Society formed in 1977 with headquarters in Camden, beginning official breed registry in 1979 and closing the studbook in 1980 to maintain breed standards. The United Kennel Club recognized the Boykin Spaniel in 1985, the same year as the state dog designation. Full American Kennel Club recognition came in 2009 after decades of efforts by breed enthusiasts to document breed history, establish health standards, and demonstrate consistent breeding practices. By 2000, the Boykin Spaniel Society registry included 16,285 dogs across forty-nine states and several foreign countries, testimony to the breed's expansion from South Carolina origins to national and international popularity."

  - id: "state-symbolism"
    icon: "fa-paw"
    title: "What the Boykin Spaniel Represents"
    style: "highlight"
    paragraphs:
      - "The Boykin Spaniel captures the resourcefulness, adaptability, and loyalty deeply valued in South Carolina's outdoor traditions. This small brown dog solved practical problems facing early twentieth-century hunters navigating narrow Wateree River Swamp channels in boats too small for larger retrievers."
      - "The breed's origins reflect South Carolina's innovative spirit and agricultural expertise. Just as state farmers developed superior rice strains and cotton varieties, sportsmen like Whit Boykin experimented with selective dog breeding to create animals perfectly suited to local conditions and needs."
      - "The designation recognizes not just a hunting dog but a living connection to South Carolina's heritage of self-sufficiency and regional identity. The Boykin represents South Carolinians' willingness to develop local solutions rather than importing breeds developed elsewhere, creating something distinctly their own."
    
    subsections:
      - subtitle: "The Legend of Dumpy"
        text: "The Boykin Spaniel breed traces to a small stray spaniel-type dog that befriended Spartanburg banker Alexander L. White around 1905-1910 while White walked to First Presbyterian Church on Sunday morning. The dog followed White into church, where he was ejected, then waited patiently outside until services ended, wagging his tail in greeting. White took the stray home and named him Dumpy, soon discovering the dog's natural retrieving aptitude. White sent Dumpy by train to his hunting partner L. Whitaker 'Whit' Boykin near Camden, who transformed the foundling into a superb turkey dog and waterfowl retriever, establishing the foundation for an entire breed."
      
      - subtitle: "Bred for South Carolina Conditions"
        text: "Whit Boykin developed his spaniel specifically to address challenges posed by hunting in the Wateree River Swamp, a vast wetland complex near Camden with narrow waterways winding through tupelo and cypress forests. Hunters navigated these channels in section boats—small, flat-bottomed craft barely wide enough for a man, his gun, and decoys. Larger retriever breeds like Chesapeake Bay Retrievers proved too heavy and bulky for these boats, risking capsizing in unstable craft. Boykin experimented with selective breeding, likely incorporating Chesapeake Bay Retriever, Springer Spaniel, Cocker Spaniel, American Water Spaniel, and pointing breeds to create a compact dog with retrieving drive, swimming ability, and turkey-hunting instincts, all in a 25-40 pound package that wouldn't 'rock the boat.'"
      
      - subtitle: "Turkey Hunting Heritage"
        text: "The Boykin Spaniel earned its reputation initially as a turkey dog rather than waterfowl retriever. Wild turkeys thrived in South Carolina's forests and swamps in the early 1900s, providing sport for hunters who called birds within range using mouth calls and slate strikers. Boykins learned to lie motionless at their master's feet during calling sequences, avoiding sudden movements that might spook approaching turkeys. The breed's traditional docked tail—leaving only one-third length—originated from turkey hunting practices, preventing tail movement from alerting wary birds. This dual-purpose capability as both upland game dog and waterfowl retriever distinguished Boykins from specialist breeds, making them ideal for South Carolina hunters pursuing varied quarry across different seasons."
      
      - subtitle: "Heat Tolerance for Southern Climate"
        text: "Boykin Spaniels developed exceptional heat tolerance, making them ideal hunting companions for South Carolina's hot, humid climate where September dove season temperatures often exceed 90 degrees Fahrenheit. While many sporting breeds struggle in sustained heat, Boykins maintain stamina through long September afternoons in dove fields and October days pursuing waterfowl in coastal marshes. This heat adaptation reflects careful breeding by Boykin and his successors, who selected dogs that performed reliably in conditions that would exhaust northern-bred retrievers. The breed's shorter, moderately wavy coat sheds water quickly while providing less insulation than thicker-coated retrievers bred for frigid Atlantic or Great Lakes conditions."
      
      - subtitle: "Family Companions and Working Dogs"
        text: "The Boykin Spaniel transitions seamlessly between hunting companion and family pet, a versatility captured in the breed saying: 'You can take a Boykin dove hunting in the morning, and then have them home at night as a family dog.' This dual nature made Boykins practical for South Carolina families who needed dogs that worked in the field but lived peacefully in homes with children and other pets. The breed's friendly, eager-to-please temperament comes from generations of selection for trainability and social stability. Unlike some working breeds that remain aloof or hyperactive indoors, Boykins demonstrate affectionate, calm behavior with family members while maintaining high drive and focus during hunting activities."

  - id: "identification"
    icon: "fa-dog"
    title: "How to Identify Boykin Spaniels"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Boykin Spaniels display the classic spaniel appearance with long, curly ears and solid liver-brown coloring that distinguishes them from similarly sized breeds. The coat ranges from flat and slightly wavy to moderately curly, with feathering on ears, chest, legs, and belly that may take on golden or tawny sun-bleached color. Males typically stand 15.5-17 inches at the withers (shoulder height), while females measure 14-16.5 inches, making Boykins noticeably smaller than Springer Spaniels but larger than Cocker Spaniels."
        list_items:
          - "**Size**: Males 30-40 pounds and 15.5-17 inches tall; females 25-35 pounds and 14-16.5 inches tall"
          - "**Coat**: Solid liver, brown, or chocolate; flat to moderately curly texture; water-repellent; feathering on ears, chest, and legs"
          - "**Eyes**: Golden to amber colored; almond-shaped; express intelligence and alertness"
          - "**Distinctive Features**: Webbed feet for swimming efficiency; traditionally docked tail (one-third length); long, curly ears; white chest markings occasionally present but discouraged in breed standard"
      
      - subtitle: "Temperament and Behavior"
        text: "Boykin Spaniels exhibit friendly, enthusiastic personalities with strong desire to please their owners. The breed demonstrates high intelligence combined with occasional stubbornness, described by breeders as having 'hard heads and soft hearts'—they learn quickly but question commands unless convinced of purpose. Boykins require mental stimulation and physical activity to prevent boredom, which can lead to destructive behavior. They thrive on human companionship and develop strong bonds with family members, making them unsuitable for prolonged outdoor kennel living. The breed generally shows good behavior around children and other dogs when properly socialized, though individual temperaments vary based on breeding lines and early training."
      
      - subtitle: "Distinguishing from Similar Breeds"
        text: "Boykin Spaniels most closely resemble American Water Spaniels but show key differences in size, coat, and coloring. American Water Spaniels weigh 25-45 pounds with marcel (uniform waves) to tight curly coats, often with brown markings on lighter base colors, while Boykins maintain solid liver coloring with looser waves and slightly smaller overall size. Field Spaniels appear longer and heavier-boned than Boykins, standing 17-18 inches tall with predominantly black or liver coats. Cocker Spaniels, while similar in height, display more profuse feathering, heavier bone structure, and come in multiple color patterns beyond the Boykin's solid brown. The Boykin's webbed feet, heat tolerance, and eagerness for water work distinguish it from most spaniel breeds developed for temperate climates."

  - id: "in-the-state"
    icon: "fa-home"
    title: "Boykin Spaniels in South Carolina"
    style: "default"
    paragraphs:
      - "Boykin Spaniels appear throughout South Carolina as both hunting dogs and family pets, with highest concentrations in Midlands and Lowcountry regions where the breed originated. Camden in Kershaw County remains the breed's spiritual home, hosting the Boykin Spaniel Society headquarters and attracting breed enthusiasts from across the nation."
      - "The breed's popularity has grown steadily since the 1985 state dog designation. While exact population numbers within South Carolina remain untracked, the Boykin Spaniel Society registry includes thousands of dogs nationwide, with substantial representation in the Palmetto State where many breeders maintain kennels and hunting bloodlines established by descendants of Whit Boykin's original dogs."
    
    facts:
      - "**Camden Area**: Original breeding center; Boykin Spaniel Society headquarters; multiple established kennels maintaining working bloodlines"
      - "**Lowcountry**: Popular among waterfowl hunters in coastal marshes and ACE Basin; used for dove hunting in agricultural areas"
      - "**Statewide Presence**: Found as family pets and hunting companions throughout South Carolina; participating in AKC hunt tests, field trials, and agility competitions"
      - "**Charleston**: Prominent during annual Southeastern Wildlife Expo; breed rescue organizations active in coastal region"

  - id: "where-to-see"
    icon: "fa-map-marked-alt"
    title: "Where to Encounter Boykin Spaniels"
    style: "default"
    paragraphs:
      - "Boykin Spaniels appear frequently throughout South Carolina at dog parks, outdoor events, and sporting dog competitions. The breed's distinctive solid brown coloring and spaniel appearance make individual dogs recognizable, particularly in Midlands and Lowcountry areas where Boykin ownership remains highest."
    
    list_items:
      - "**Boykin Spaniel Society (Camden)**: Headquarters location for breed registry and information; connects visitors with breeders and breed history resources"
      - "**Southeastern Wildlife Expo (Charleston)**: Annual February event featuring prominent Boykin Spaniel presence; breed demonstrations and owner gatherings"
      - "**South Carolina State Parks**: Common sighting at dog-friendly parks throughout state; particularly Francis Marion National Forest and Congaree National Park during hunting seasons"
      - "**Boykin Spaniel Rescue**: Organization headquartered in Boiling Springs providing adoption opportunities for rescued Boykins; operates throughout South Carolina"
      - "**AKC Hunt Tests**: Boykins participate in spaniel hunt tests at locations throughout South Carolina during fall and spring seasons; spectator-friendly events"

  - id: "current-status"
    icon: "fa-heartbeat"
    title: "Breed Health and Recognition"
    style: "default"
    paragraphs:
      - "The Boykin Spaniel maintains healthy breed status with recognition from major kennel clubs and strong breeder networks maintaining genetic diversity and health standards. The breed faces typical spaniel health concerns including hip dysplasia, eye disorders, and exercise-induced collapse, but responsible breeding programs screen for these conditions."
      - "The Boykin Spaniel Club and Breeders Association of America oversees breed standards, health testing recommendations, and breeder ethics. Multiple breed clubs throughout the United States promote responsible breeding, training resources, and competition opportunities while maintaining connections to the breed's South Carolina origins."
    
    subsections:
      - subtitle: "Breed Preservation Efforts"
        text: "The Boykin Spaniel Society closed its studbook in 1980, meaning only dogs from BSS-registered parents may receive BSS registration, protecting breed purity and maintaining lines traceable to original foundation stock. This closed registry contrasts with American Kennel Club and United Kennel Club policies that allow broader registration based on conformation to breed standards. The closed studbook preserves genetic connections to Whit Boykin's original dogs while raising concerns about genetic bottlenecks and limited genetic diversity for health and temperament. Breeders balance preservation of traditional hunting abilities with modern demands for family-friendly temperaments and competitive performance in field trials and hunt tests."
      
      - subtitle: "Modern Roles Beyond Hunting"
        text: "Contemporary Boykin Spaniels excel in multiple canine sports beyond their original hunting purpose, including AKC agility, obedience, rally, and tracking competitions. The breed's intelligence, athletic ability, and eager-to-please attitude make Boykins successful therapy dogs visiting hospitals and nursing homes throughout South Carolina. Some Boykins work as detection dogs for conservation organizations, using their exceptional noses to locate endangered species scat for research purposes. This versatility demonstrates the breed's adaptability while maintaining hunting instincts that defined its original development in Wateree River Swamp environments."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Boykin Spaniel connects to South Carolina's other official symbols through shared themes of outdoor heritage, wildlife conservation, and state identity. The dog's development as a turkey hunting breed directly links to the wild turkey, designated as state wild game bird in 1976, nine years before the Boykin received official recognition."
      - "South Carolina's wildlife symbols collectively represent the state's diverse ecosystems from mountains to coast. The Boykin Spaniel, developed for Midlands swamp hunting, complements the [white-tailed deer](/states/south-carolina/mammal/white-tailed-deer) (state animal, 1972) representing upland forests and the bottlenose dolphin (state marine mammal, 2009) representing coastal waters, creating comprehensive recognition of terrestrial, aquatic, and marine environments."
    
    subsections:
      - subtitle: "Partnership with Wild Turkey"
        text: "The Boykin Spaniel's original purpose as a turkey hunting dog creates direct connection to South Carolina's state wild game bird, the wild turkey (Meleagris gallopavo), designated in 1976. Whit Boykin developed his spaniels specifically to assist in wild turkey hunting, training dogs to remain motionless during calling sequences and retrieve shot birds. Turkey populations thrived in South Carolina's forests during the breed's development in the early 1900s, declined drastically by mid-century, then recovered through conservation efforts beginning in the 1950s. Today, South Carolina maintains healthy turkey populations supporting recreational hunting that continues traditions established when Boykin created his breed. The dog and bird symbols together represent South Carolina's hunting heritage and successful wildlife management programs."
        link:
          label: "See South Carolina state wild game bird"
          url: "/states/south-carolina/bird/carolina-wren"
      
      - subtitle: "Complementing Other Mammal Symbols"
        text: "The Boykin Spaniel represents domestic animals bred for specific purposes, contrasting with South Carolina's wild mammal symbols: the white-tailed deer (state animal) and bottlenose dolphin (state marine mammal). This three-part mammal recognition acknowledges that South Carolina's identity encompasses wild terrestrial species, marine life, and domesticated breeds developed through human expertise. The Boykin shares with the deer a connection to hunting traditions, while the dolphin represents coastal ecosystems largely absent from the Boykin's inland swamp origins. Together, these three mammals span South Carolina's geographic and cultural diversity from Wateree River bottomlands to Atlantic coastal waters."
        link:
          label: "See South Carolina state marine mammal"
          url: "/states/south-carolina/mammal/bottlenose-dolphin"
      
      - subtitle: "Wateree River Swamp Heritage"
        text: "The Boykin Spaniel's development in the Wateree River Swamp connects to South Carolina's wetland ecosystems represented indirectly in multiple state symbols. The sabal palmetto (state tree, designated 1939) thrives in coastal wetlands, while the spotted salamander (state amphibian, 1999) depends on vernal pools and bottomland forests similar to Wateree habitats. The yellow jessamine (state flower, 1924) climbs through swamp edge vegetation where Boykins originally hunted. These symbols collectively acknowledge that South Carolina's identity includes extensive wetland systems that shaped agriculture, wildlife populations, and human activities including the hunting traditions that necessitated development of the Boykin breed."
        link:
          label: "See South Carolina state tree"
          url: "/states/south-carolina/tree/sabal-palmetto"

