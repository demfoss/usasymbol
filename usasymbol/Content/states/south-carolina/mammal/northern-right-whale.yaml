faq:
  - question: "What is South Carolina's state migratory marine mammal?"
    answer: "South Carolina's state migratory marine mammal is the northern right whale (Eubalaena glacialis), designated in 2009. The northern right whale represents South Carolina's role as critical calving habitat and symbolizes transformation from historical exploitation to modern conservation efforts."
  
  - question: "When was the northern right whale designated as South Carolina's state migratory marine mammal?"
    answer: "The northern right whale became South Carolina's official state migratory marine mammal on June 3, 2009, when Act Number 58 was signed into law. The same legislation also designated the bottlenose dolphin as state marine mammal and the wood duck as state duck, creating both resident and migratory marine mammal symbols."
  
  - question: "Why did South Carolina choose the northern right whale?"
    answer: "South Carolina chose the northern right whale to recognize the state's coastal waters as essential habitat for one of the world's most endangered large whale species. South Carolina's nearshore waters form part of the only known calving grounds where northern right whales give birth and nurse their young. The designation honors both South Carolina's maritime heritage and conservation responsibility for protecting critically endangered species during their most vulnerable life stage."
  
  - question: "When do northern right whales visit South Carolina?"
    answer: "Northern right whales visit South Carolina coastal waters seasonally from November through April, with peak presence occurring December through March during calving season. Pregnant females arrive in late November or early December, give birth in warm shallow water, and remain with nursing calves for approximately three months before beginning the northward migration to feeding grounds off New England and Canada."
  
  - question: "How many northern right whales remain?"
    answer: "Approximately 370-384 northern right whales remain worldwide, making them one of the most endangered large whale species on Earth. The population includes only about 70 reproductively active females. An Unusual Mortality Event ongoing since 2017 has documented 41 right whale deaths, primarily from vessel strikes and fishing gear entanglement."
  
  - question: "Why are northern right whales called 'right' whales?"
    answer: "Northern right whales received their name from commercial whalers who considered them the 'right' whale to hunt. Right whales swim slowly, stay close to shore, and float when dead due to thick blubber, making them easy targets for hunters using rowboats and hand-thrown harpoons. A single right whale could yield up to 1,400 gallons of oil and 650 pounds of baleen, making each kill enormously profitable. This tragic name reflects centuries of exploitation that nearly drove the species to extinction."
  
  - question: "What should I do if I see a northern right whale off South Carolina?"
    answer: "If you see a northern right whale from a boat or beach, immediately report the sighting by calling 877-WHALE-HELP (877-942-5343), hailing the U.S. Coast Guard on VHF channel 16, or using the Whale Alert smartphone app. Maintain at least 500 yards distance if on a vessel—federal law prohibits approaching, pursuing, or harassing right whales, with violations punishable by fines up to $100,000. Look for the distinctive V-shaped blow, broad black back without dorsal fin, and white callosities on the head. Every sighting provides valuable data helping scientists track population movements."
  
  - question: "Are there speed restrictions to protect right whales in South Carolina?"
    answer: "Yes, federal regulations require vessels 65 feet or longer to travel at 10 knots or less in designated Seasonal Management Areas along the South Carolina coast from November 1 through April 30 when right whales use these waters for calving. NOAA encourages all vessels, including those under 65 feet, to slow to 10 knots or less in these areas, as vessels of any size can strike and kill right whales. Reduced speeds give ship operators more time to detect whales and significantly reduce collision severity if strikes occur."
  
  - question: "What threats do northern right whales face in South Carolina waters?"
    answer: "Northern right whales in South Carolina waters face two primary threats: vessel strikes and fishing gear entanglement. Mothers and calves spend extended periods near the surface during calving season, making them vulnerable to collision with ships transiting Port of Charleston and recreational boats. Whales may also encounter commercial fishing gear as they migrate through South Carolina coastal waters. The Unusual Mortality Event ongoing since 2017 has documented vessel strikes and entanglement as the leading causes of right whale deaths throughout their range."

