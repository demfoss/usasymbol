title: "South Carolina State Migratory Marine Mammal | Northern Right Whale"
scientific_name: "Eubalaena glacialis"
adopted_year: 2009

seo_title: "South Carolina Migratory Marine Mammal | Right Whale"
seo_description: "South Carolina's state migratory marine mammal is the Northern Right Whale, adopted in 2009. Learn why the symbol fits the coast."

intro_text: "The Northern Right Whale is the official South Carolina state migratory marine mammal, designated in 2009. This page gives the direct answer for searches like 'south carolina state migratory marine mammal', 'south carolina state animal', and 'south carolina state mammal' while explaining how the symbol fits the state's official animal designations. Migratory journey exceeding 1,000 miles from northern feeding grounds; mothers calving in warm South Carolina waters; tragic history as target of commercial whaling; ongoing recovery efforts."

common_name: "North Atlantic Right Whale"
official_since: "2009"
status: "Critically endangered; approximately 370-384 individuals remaining worldwide; protected under Endangered Species Act and Marine Mammal Protection Act"
habitat_in_state: "Seasonal visitor to coastal waters November through April; shallow continental shelf waters from Cape Fear NC through South Carolina to northern Florida serve as only known calving grounds"
known_for: "Migratory journey exceeding 1,000 miles from northern feeding grounds; mothers calving in warm South Carolina waters; tragic history as target of commercial whaling; ongoing recovery efforts"

size: "45 to 55 feet in length for adults; newborn calves measure approximately 14 feet at birth"
weight: "40 to 70 tons for adults; exceptional females reach 100 tons; calves weigh approximately 1 ton at birth"
coloration: "Dark gray to black body; occasional white patches on belly or throat; distinctive white callosities on head covered with whale lice appear cream-colored"
distinctive_traits: "No dorsal fin; broad back; V-shaped blowhole producing heart-shaped blow; large head comprising one-quarter of body length; 200-270 baleen plates per side measuring up to 10 feet long"

habitat: "Shallow coastal waters of continental shelf; prefer depths of 10-25 meters during calving season; cooler water temperatures of 12-16°C"
range_in_state: "Migratory corridor through South Carolina coastal waters November-April; critical habitat extends from Cape Fear NC to Cape Canaveral FL"
conservation_status: "Critically endangered with population estimated at 370-384 individuals; fewer than 70 reproductively active females; Unusual Mortality Event ongoing since 2017"
where_to_find: "Aerial surveys by NOAA and partners document whales offshore from November-April; public sightings rare but possible from beaches during migration; report sightings to 877-WHALE-HELP"
symbol_connections: "Represents seasonal connections and migration in contrast to resident bottlenose dolphin; embodies conservation transformation from exploitation to protection; mirrors hope theme in [state motto](/states/south-carolina/motto/dum-spiro-spero) 'Dum Spiro Spero'"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The South Carolina General Assembly designated the northern right whale as the official state migratory marine mammal through Act Number 58, signed into law on June 3, 2009. The same legislation simultaneously designated the bottlenose dolphin as state marine mammal and the wood duck as state duck. This also aligns with [the Palmetto State nickname](/states/south-carolina/nickname/the-palmetto-state)."
      - "The designation recognized South Carolina's coastal waters as essential habitat for one of the world's most endangered large whale species. Northern right whales travel more than 1,000 miles from feeding grounds off New England and Canada to calving grounds that include South Carolina's nearshore waters, making the state a critical link in the species' annual migration."
    
    subsections:
      - subtitle: "Recognition of Critical Calving Habitat"
        text: "South Carolina lawmakers chose the northern right whale because the state's coastal waters provide irreplaceable habitat for this critically endangered species during its most vulnerable life stage. Pregnant females migrate to the shallow, warm waters off South Carolina, Georgia, and northern Florida each winter—the only known location worldwide where northern right whales give birth and nurse newborn calves. These calving grounds represent the species' last refuge for reproduction, making protection of these waters essential for species survival. The designation came after decades of scientific research documenting right whale migration patterns, calving behavior, and population decline despite protection from hunting since 1935."
      
      - subtitle: "Why This Species"
        text: "Legislators selected the northern right whale to highlight both South Carolina's natural heritage and conservation responsibility. The migratory nature of right whales connects South Carolina to the broader Atlantic ecosystem, linking northern feeding grounds in Canadian and New England waters to southern calving areas through the state's coastal zone. By choosing a critically endangered species as state symbol, South Carolina elevated public awareness about marine conservation and the threats facing large whales. The designation also recognized the contrast between historical exploitation—when commercial whalers nearly drove the species to extinction—and modern conservation efforts working to prevent its disappearance. This transformation from commodity to protected species mirrors broader changes in how humans relate to ocean wildlife."

  - id: "state-symbolism"
    icon: "fa-anchor"
    title: "What the Northern Right Whale Represents"
    style: "highlight"
    paragraphs:
      - "The northern right whale embodies seasonal connections and migratory cycles that link South Carolina to distant waters across the Atlantic Ocean. Unlike year-round residents like the bottlenose dolphin, right whales appear as winter visitors, traveling thousands of miles to reach South Carolina's calving grounds."
      - "The species represents conservation commitment and the possibility of redemption after centuries of exploitation. Commercial whalers hunted right whales to the brink of extinction, valuing them for oil and baleen that fueled industrial economies. Modern conservation efforts demonstrate how protection and awareness can sustain species even when populations reach critically low levels."
      - "The designation honors both natural cycles and human responsibility for marine stewardship. Right whale mothers journey to South Carolina waters to give birth and nurse calves during their first months of life, trusting these shallow coastal waters to provide safe refuge from predators and harsh northern winter conditions."
    
    subsections:
      - subtitle: "The 'Right' Whale to Hunt—Historical Exploitation"
        text: "Northern right whales received their common name from commercial whalers who considered them the 'right' whale to kill. Right whales swim slowly near the surface, stay close to shorelines, and float when dead due to their thick blubber layer—characteristics that made them easy targets for rowboat-based hunters operating centuries before modern whaling technology. A single right whale could yield up to 1,400 gallons of oil and 650 pounds of baleen, making each animal enormously valuable. Basque whalers began hunting right whales in European waters during the 11th century, continuing until whale populations there collapsed. They then crossed the Atlantic, establishing whaling stations in Labrador and Newfoundland from 1520 to 1630, where they killed thousands of right and bowhead whales. Colonial American whalers operating from Nantucket, New Bedford, and Long Island took up to one hundred right whales annually during the 1700s, with records documenting 29 whales killed in Cape Cod Bay during a single day in January 1700."
      
      - subtitle: "Oil and Baleen—Products That Built Industries"
        text: "Whale oil lit homes, businesses, and city streets throughout the 18th and 19th centuries, providing brighter and cleaner light than tallow candles made from animal fat. The Industrial Revolution relied on whale oil to lubricate machinery, keep gears turning smoothly, and maintain clocks and other precision instruments. Manufacturers used whale oil in textile production, soap making, and steel tempering. Baleen—the keratin plates right whales use to filter food from seawater—served similar functions to modern plastic before petroleum-based materials existed. Artisans fashioned baleen into corset stays that shaped Victorian fashion, buggy whips that controlled horses, umbrella ribs that kept rain away, hairbrush bristles, fishing rods, carriage springs, and countless other products. Women wearing corsets, riding in carriages, and carrying umbrellas participated unknowingly in an economic system built on whale death. By the late 1800s, right whale populations had crashed so severely that hunting them became unprofitable—not because whalers developed conservation ethics, but because too few whales remained to sustain commercial operations."
      
      - subtitle: "From Exploitation to Extinction's Edge"
        text: "Scientists estimate that thousands of northern right whales inhabited western North Atlantic waters before European colonization. Genetic evidence suggests the population may have numbered between 12,000 and 15,000 individuals during the 16th century. By 1935, when international protection finally arrived, right whales had become so rare that many researchers believed extinction was inevitable. The species never recovered from centuries of commercial hunting. Today's population of approximately 370-384 individuals represents a fraction of historical abundance, with genetic diversity so low that recovery remains uncertain. The whales' slow reproduction—females typically give birth to a single calf every three to six years after reaching maturity at age ten—means populations cannot rebound quickly even with complete protection from hunting."
      
      - subtitle: "Migration and the Only Known Calving Grounds"
        text: "Northern right whales undertake one of the most predictable and perilous migrations in the animal kingdom. Each fall, pregnant females and some other whales travel more than 1,000 miles from feeding areas in the Gulf of Maine, Bay of Fundy, and Canadian waters southward along the Atlantic coast. They pass through ship traffic lanes, fishing grounds, and coastal development zones before reaching the shallow, warm waters between Cape Fear, North Carolina, and Cape Canaveral, Florida—the only place in the world where northern right whales are known to give birth. South Carolina's coastal waters form a critical segment of this calving ground, with mothers and newborn calves spending their first weeks together in nearshore areas. Mothers arrive between November and early December, give birth in warm shallow water, and remain with their nursing calves for approximately three months before beginning the northward migration in March or April. The predictability of this migration pattern, which once made right whales easy targets for whalers, now allows scientists to monitor population health and implement protective measures."
      
      - subtitle: "Hope and Resilience—The Motto Connection"
        text: "The northern right whale connects naturally to South Carolina's state motto 'Dum Spiro Spero' (While I Breathe, I Hope), which appears on the Great Seal beneath the goddess Spes (Hope). Right whales surface every few minutes to breathe through paired blowholes that produce a distinctive V-shaped blow, creating a visible rhythm of respiration that has sustained the species through ice ages and near-extinction. Their continued existence—breathing, calving, and migrating despite human-caused mortality—embodies hope that conservation can succeed even when populations reach critically low levels. The goddess Spes on the state seal holds a laurel branch while standing on a shore scattered with weapons, symbolizing hope after conflict. Modern right whale conservation represents a similar transformation from conflict to cooperation, as shipping companies, fishermen, scientists, and policymakers work together to reduce vessel strikes and fishing gear entanglements that continue threatening the species. The whales' resilience despite 85 percent of the population bearing scars from fishing gear entanglement demonstrates the same enduring hope celebrated in South Carolina's founding motto."

  - id: "identification"
    icon: "fa-binoculars"
    title: "How to Identify Northern Right Whales"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Northern right whales rank among the largest animals on Earth, with massive stocky bodies lacking the streamlined appearance of most other whale species. Their most distinctive feature—the complete absence of a dorsal fin—creates a smooth, broad back that appears as a dark hump rising from the ocean surface. The head comprises roughly one-quarter of total body length, creating proportions unlike any other whale. Individual whales can be identified by callosities, rough patches of thickened skin appearing white or cream-colored due to infestations of whale lice (cyamids) and barnacles."
        list_items:
          - "**Size**: Adults reach 45-55 feet in length; record individuals measured 60 feet; newborn calves average 14 feet at birth and grow rapidly on nutrient-rich mother's milk"
          - "**Weight**: Adult females (larger than males) weigh 40-70 tons; exceptional individuals exceed 100 tons; up to 45 percent of body weight consists of blubber insulating against cold water"
          - "**Head**: Enormous head with strongly arched jawline creating distinctive profile; V-shaped blowhole produces heart-shaped blow visible from miles away; callosities arranged in unique patterns used by researchers for individual identification"
          - "**Baleen**: 200-270 dark baleen plates per side of upper jaw; plates measure up to 10 feet long and 12 inches wide; covered in fine hairs that filter tiny copepods (primary food) from seawater"
          - "**Coloration**: Dark gray to black body; some individuals show white patches on belly or throat; newborn calves occasionally appear lighter gray, darkening with age"
          - "**Features**: No dorsal fin; short, broad pectoral flippers; narrow tail stock connecting to wide flukes that can span 20 feet; barnacles and whale lice create distinctive white patterns on head"
      
      - subtitle: "Behavior and Life Cycle"
        text: "Northern right whales spend most of their time at or near the surface, where they feed by swimming slowly with mouths open to strain copepods through baleen plates. This surface-feeding behavior, combined with their slow swimming speed of only 6 knots, makes them exceptionally vulnerable to vessel strikes. Right whales are relatively social, often traveling in small groups called surface active groups (SAGs) during breeding season, when multiple males compete for access to a single female. Mothers and calves maintain close contact, with calves nursing for up to one year while learning migration routes and feeding techniques. Whales communicate through low-frequency calls, moans, and pulses that travel long distances underwater. Researchers identify individual whales by photographing callosity patterns, which remain stable throughout each whale's life. Some documented individuals have been tracked for over four decades, providing scientists with life-history data spanning multiple generations."

  - id: "in-the-state"
    icon: "fa-map-marked-alt"
    title: "Right Whales in South Carolina Waters"
    style: "default"
    paragraphs:
      - "Northern right whales appear in South Carolina's coastal waters seasonally from November through April, with peak presence occurring December through March during calving season. The state's nearshore waters from the North Carolina border south to Georgia form part of the only known calving grounds for the entire species."
      - "South Carolina's continental shelf provides ideal conditions for mother-calf pairs. Water depths of 10-25 meters offer protection from large predators while remaining warm enough (12-16°C) for newborn calves lacking thick blubber layers. The proximity to shore allows mothers to rest and nurse in relatively calm conditions."
    
    facts:
      - "**Critical Habitat**: Federal designation protects waters from Cape Fear NC to Cape Canaveral FL; South Carolina waters comprise essential middle section of this calving ground"
      - "**Seasonal Presence**: Whales typically arrive late November/early December; mothers with newborn calves remain through March or April before beginning northward migration"
      - "**Population Status**: Entire worldwide population numbers only 370-384 individuals; approximately 11-21 calves born annually across entire calving grounds during recent years"
      - "**Monitoring**: Aerial surveys funded by U.S. Army Corps of Engineers, Coast Guard, Navy, NOAA, and Georgia DNR track whale locations and alert mariners; boat-based teams collect biopsy samples for genetic analysis"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Observing Northern Right Whales"
    style: "default"
    paragraphs:
      - "Seeing northern right whales from South Carolina beaches or boats represents a rare wildlife encounter, as the species remains critically endangered with fewer than 400 individuals worldwide. Unlike common dolphins frequently visible from shore, right whales typically remain several miles offshore in depths preferred for calving and nursing."
      - "Boaters and beachgoers can support right whale conservation by learning to identify the species, reporting all sightings immediately, and following federal protection regulations. Every sighting provides valuable data helping researchers track population movements and calving success."
    
    list_items:
      - "**Federal Law Requirements**: Maintain 500-yard distance from any right whale by vessel; never approach, pursue, or attempt to swim near right whales; violations carry fines up to $100,000 and potential criminal charges under Marine Mammal Protection Act and Endangered Species Act"
      - "**Reporting Sightings**: Call 877-WHALE-HELP (877-942-5343) immediately upon sighting; hail U.S. Coast Guard on VHF channel 16; use Whale Alert smartphone app (whalealert.org) to report location with GPS coordinates and photos"
      - "**Identification Features**: Look for V-shaped blow visible from miles away; broad black back without dorsal fin; white callosities on head; slow swimming speed at surface; mothers often accompanied by calf swimming close alongside"
      - "**Best Viewing Opportunities**: Aerial survey teams from NOAA, Clearwater Marine Aquarium, and other organizations conduct flights throughout calving season; occasional whale-watching tours operating under special permits may encounter right whales during migration but cannot approach closely"
      - "**Public Awareness**: South Carolina Department of Natural Resources and partner organizations conduct educational programs about right whale biology, threats, and conservation; South Carolina Aquarium in Charleston offers exhibits explaining right whale ecology and ongoing research"

  - id: "current-status"
    icon: "fa-shield-alt"
    title: "Conservation Status and Ongoing Threats"
    style: "default"
    paragraphs:
      - "Northern right whales remain one of the most endangered large whale species on Earth despite protection from commercial hunting since 1935. The population has hovered around 350-400 individuals for decades, unable to recover to sustainable levels."
      - "Vessel strikes and fishing gear entanglement cause the majority of right whale deaths and serious injuries, creating an Unusual Mortality Event that has persisted since 2017. Scientists estimate that over 85 percent of right whales have been entangled in fishing gear at least once, with chronic entanglements contributing to reduced reproduction rates and increased mortality."
    
    subsections:
      - subtitle: "Vessel Strike Risk in South Carolina Waters"
        text: "Vessel collisions remain a primary threat to right whales in South Carolina coastal waters, where mothers and calves spend extended periods near the surface during calving season. Right whales' slow swimming speed, dark coloration, lack of dorsal fin, and frequent surface presence make them difficult for ship crews to spot in time to avoid collisions. The Port of Charleston ranks among the busiest on the Atlantic coast, with large container ships, cargo vessels, and tankers transiting waters where right whales calve and nurse. Recreational boating adds thousands of additional vessels during winter months when tourists and residents enjoy South Carolina's coastal waters. Federal regulations require vessels 65 feet or longer to travel at 10 knots or less in designated Seasonal Management Areas along the South Carolina coast from November 1 through April 30. NOAA has proposed expanding these restrictions to vessels 35-65 feet in length and enlarging protected areas based on new scientific data about right whale distribution. Studies demonstrate that vessel speeds above 10 knots dramatically increase both collision likelihood and lethality—whales struck at higher speeds suffer fatal injuries, while those hit at slower speeds may survive with injuries."
      
      - subtitle: "Fishing Gear Entanglement Crisis"
        text: "Commercial fishing gear poses an existential threat to northern right whales, with rope from lobster traps, gillnets, and other fixed fishing equipment causing chronic injuries, infections, starvation, and death. Entangled whales drag heavy gear for months or years, expending enormous energy to swim and surface while ropes cut into skin, muscle, and bone. Severe entanglements prevent whales from feeding effectively, leading to emaciation and eventual death. Female right whales show particular vulnerability to entanglement impacts—chronic stress from carrying gear appears to reduce reproductive success, causing females to calve less frequently (every 7-10 years instead of the normal 3-year interval) or not at all. Only about 70 reproductively active females remain in the population, making each breeding female's survival essential for species persistence. Disentanglement teams from NOAA and partner organizations attempt to remove gear from entangled whales when conditions allow, but these operations prove extremely dangerous for both whales and rescuers. Many entanglements occur in Canadian waters during summer feeding season, requiring international cooperation between U.S. and Canadian authorities."
      
      - subtitle: "Climate Change and Shifting Habitats"
        text: "Ocean warming drives changes in copepod distribution, forcing right whales to search for food in new areas outside historically protected waters. Right whales feed almost exclusively on dense aggregations of copepods, tiny crustaceans that thrive in cold, nutrient-rich waters. As ocean temperatures rise, copepod populations shift northward and eastward, pulling right whales into areas with higher vessel traffic, more active fishing operations, and less regulatory protection. Scientists have documented right whales appearing in the Gulf of St. Lawrence during recent years, a region where right whales were historically uncommon but where copepod concentrations now attract feeding whales. This area lacks the comprehensive protection measures established for traditional right whale habitats, resulting in multiple deaths from vessel strikes and entanglements. Climate change may also affect calving grounds, though waters off South Carolina, Georgia, and Florida currently maintain suitable temperatures for newborn calves. Long-term warming could eventually push calving areas northward, forcing whales to use new habitats without established protection."
      
      - subtitle: "Population Decline and Reproductive Challenges"
        text: "The northern right whale population declined from an estimated 481 individuals in 2010 to approximately 370-384 in recent years, representing a loss of more than 20 percent of the species over just 15 years. The Unusual Mortality Event declared in 2017 has documented 41 dead right whales, with vessel strikes and entanglements identified as primary causes. Scientists warn that the species faces extinction within 20-30 years unless human-caused mortality decreases immediately and substantially. Female right whales now give birth every 7-10 years on average instead of the healthy 3-year interval observed before 2010, likely due to chronic stress from entanglement, reduced food availability, and overall population decline. With only about 70 reproductively active females remaining and annual calf production ranging from zero (in 2018) to 21 (in 2026), the species requires near-perfect calf survival and female longevity to avoid extinction. Every death of a reproductive-age female reduces the species' chance of recovery, making conservation of South Carolina's calving grounds absolutely critical for species survival."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The northern right whale connects to South Carolina's other state symbols through shared themes of maritime heritage, seasonal cycles, and transformation from exploitation to conservation. The whale's migratory nature contrasts with the year-round residency of the [bottlenose dolphin](/states/south-carolina/mammal/bottlenose-dolphin), creating complementary symbols representing both permanent coastal inhabitants and seasonal visitors."
      - "South Carolina designated both marine mammals simultaneously in 2009, recognizing different relationships between humans and ocean wildlife. The bottlenose dolphin represents daily coastal life and accessible marine experiences, while the northern right whale embodies broader ocean connections, international migration, and the possibility of redemption after historical exploitation."
    
    subsections:
      - subtitle: "Dual Marine Mammal Symbols"
        text: "Act Number 58 of 2009 created two marine mammal symbols for South Carolina, distinguishing between resident and migratory species. The bottlenose dolphin, designated as state marine mammal, represents year-round presence in South Carolina's tidal rivers and estuaries, where approximately 350 individual dolphins maintain permanent territories. The northern right whale, designated as state migratory marine mammal, represents seasonal connections linking South Carolina to the broader Atlantic Ocean and distant waters where right whales feed during summer months. This dual designation acknowledges both kinds of marine wildlife relationships—intimate daily connections with resident species and seasonal encounters with migrants traveling thousands of miles. The contrast between dolphin and whale also reflects different scales of conservation challenge: resident dolphins face primarily local threats like boat traffic and habitat degradation, while migratory right whales confront threats spanning their entire range across multiple jurisdictions and international boundaries."
        link:
          label: "See South Carolina state marine mammal"
          url: "/states/south-carolina/mammal/bottlenose-dolphin"
      
      - subtitle: "State Motto and Perseverance"
        text: "South Carolina's state motto 'Dum Spiro Spero' (While I Breathe, I Hope) appears on the Great Seal's right oval alongside the goddess Spes holding a laurel branch as the sun rises. Northern right whales embody this motto through their continued survival despite centuries of exploitation that brought them within sight of extinction. The act of breathing—which right whales must perform every few minutes at the ocean surface—becomes a literal manifestation of hope and life continuing against difficult odds. Each whale surfacing to breathe through paired blowholes represents persistence and the possibility that protection and awareness can prevent extinction even for critically endangered species. The motto's accompanying image shows the goddess Spes standing on a shore littered with weapons, symbolizing hope after conflict and the possibility of peace. Modern right whale conservation similarly represents transformation from conflict to cooperation, as former adversaries—shipping companies, fishing industries, and conservation groups—work together to reduce vessel strikes and entanglement deaths threatening the species' survival."
        link:
          label: "See South Carolina state motto"
          url: "/states/south-carolina/motto/dum-spiro-spero"
      

