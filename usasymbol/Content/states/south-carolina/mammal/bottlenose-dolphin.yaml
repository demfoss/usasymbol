faq:
  - question: "What is South Carolina's state marine mammal?"
    answer: "South Carolina's state marine mammal is the bottlenose dolphin (Tursiops truncatus), designated in 2009. The bottlenose dolphin represents South Carolina's coastal heritage and the unique strand feeding behavior practiced by Lowcountry dolphins."
  
  - question: "When was the bottlenose dolphin designated as South Carolina's state marine mammal?"
    answer: "The bottlenose dolphin became South Carolina's official state marine mammal on June 3, 2009, when Governor Mark Sanford signed Act Number 58 into law. The same legislation also designated the wood duck as state duck and the northern right whale as state migratory marine mammal."
  
  - question: "Why did South Carolina choose the bottlenose dolphin as its state marine mammal?"
    answer: "South Carolina chose the bottlenose dolphin to honor the species' year-round residence in coastal estuaries and its role as a cultural symbol of the Lowcountry. Bottlenose dolphins inhabit South Carolina's tidal rivers throughout their lives, practicing unique strand feeding behavior found nowhere else on the Atlantic Coast. The designation recognized the dolphins' intelligence, social cooperation, and connection to South Carolina's maritime identity."
  
  - question: "What is strand feeding and why is it unique to South Carolina?"
    answer: "Strand feeding is a cooperative hunting behavior where dolphins work together to herd fish onto shorelines, temporarily beaching themselves to catch prey before returning to water. South Carolina and Georgia are the only places on the Atlantic Coast where dolphins practice this technique, and Kiawah Island ranks among the most accessible locations worldwide to observe the behavior. Only about 25 of Charleston's 350 resident dolphins know how to strand feed, learning the dangerous technique from their mothers during the calf period."
  
  - question: "Where can I see bottlenose dolphins in South Carolina?"
    answer: "Your best opportunity to see bottlenose dolphins is at Kiawah Island's Beachwalker Park, where dolphins strand feed regularly at low tide. Seabrook Island, Folly Beach, Charleston Harbor, and the ACE Basin estuaries also provide excellent viewing locations. Dolphins inhabit the Ashley, Cooper, Stono, Wando, and Edisto Rivers year-round. Kayak tours through tidal creeks offer close encounters while respecting the required 50-yard distance from vessels."
  
  - question: "How many bottlenose dolphins live in South Carolina?"
    answer: "Approximately 350 bottlenose dolphins maintain permanent residence in the Charleston-area estuaries, with additional populations inhabiting coastal waters throughout South Carolina's 187-mile coastline. These resident dolphins spend their entire lives within specific river territories, rarely venturing into open ocean. Researchers identify individual dolphins through dorsal fin photographs, tracking some animals for decades."
  
  - question: "Are bottlenose dolphins endangered in South Carolina?"
    answer: "Bottlenose dolphins are not endangered but receive protection under the Marine Mammal Protection Act of 1972. South Carolina's resident dolphin population remains stable, though individual dolphins face threats from boat strikes, fishing gear entanglement, pollution, and disease. Federal law prohibits harassing, feeding, touching, or approaching dolphins closer than 50 yards by vessel or 15 yards on foot, with violations punishable by fines up to $100,000."
  
  - question: "What should I do if I see a stranded or injured dolphin?"
    answer: "If you encounter a stranded, injured, or dead dolphin, immediately contact the South Carolina Department of Natural Resources Wildlife stranding hotline at 1-800-922-5431 or the Lowcountry Marine Mammal Network. Do not approach, touch, or attempt to push the dolphin back into the water—stranded animals may be sick, and dolphins are wild animals capable of inflicting serious bites. Maintain distance and keep other people and pets away until trained responders arrive."
  
  - question: "Can I feed or swim with wild dolphins in South Carolina?"
    answer: "No. Federal law under the Marine Mammal Protection Act strictly prohibits feeding, touching, swimming with, or harassing wild dolphins in any way. These activities disrupt natural behaviors, teach dolphins to approach boats and people (increasing boat strike risk), and can result in fines up to $100,000 and criminal charges. Dolphins are wild predators with powerful jaws and unpredictable behavior. Observe from legal distances: 50 yards by vessel, 15 yards on foot."

