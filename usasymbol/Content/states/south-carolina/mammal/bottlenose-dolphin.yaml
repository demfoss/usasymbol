title: "South Carolina State Marine Mammal | Bottlenose Dolphin"
scientific_name: "Tursiops truncatus"
adopted_year: 2009

seo_title: "South Carolina State Marine Mammal | Bottlenose Dolphin"
seo_description: "South Carolina's state marine mammal is the Bottlenose Dolphin, adopted in 2009. Learn why this official South Carolina symbol was chosen and what it represents."

intro_text: "The Bottlenose Dolphin is the official South Carolina state marine mammal, designated in 2009. This page gives the direct answer for searches like 'south carolina state marine mammal', 'south carolina state animal', and 'south carolina state mammal' while explaining how the symbol fits the state's official animal designations. Unique strand feeding behavior practiced nowhere else on Atlantic Coast; year-round residence in brackish Lowcountry waters; coastal cultural symbol."

common_name: "Bottlenose Dolphin"
official_since: "2009"
status: "Protected under Marine Mammal Protection Act; stable resident population of approximately 350 in Charleston area estuaries"
habitat_in_state: "Coastal estuaries, tidal rivers, nearshore Atlantic waters; permanent residents in Ashley, Cooper, Stono, Wando, and Edisto Rivers"
known_for: "Unique strand feeding behavior practiced nowhere else on Atlantic Coast; year-round residence in brackish Lowcountry waters; coastal cultural symbol"

size: "8 to 12 feet in length"
weight: "400 to 600 pounds on average; exceptional individuals reach 1,430 pounds"
coloration: "Gray upper body darkening along back; lighter gray sides; white to pale pink belly; smooth skin"
distinctive_traits: "Short beak-like rostrum; sickle-shaped dorsal fin; 80-100 conical teeth; single blowhole; streamlined torpedo-shaped body"

habitat: "Shallow coastal estuaries, tidal creeks, salt marshes, nearshore ocean waters within continental shelf"
range_in_state: "Year-round residents of five major Lowcountry river systems; Atlantic coastal waters from North Carolina border south to Georgia border"
conservation_status: "Protected under Marine Mammal Protection Act since 1972; federally managed through NOAA Bottlenose Dolphin Take Reduction Plan"
where_to_find: "Kiawah Island (Beachwalker Park), Seabrook Island, Folly Beach, Charleston Harbor, ACE Basin estuaries; strand feeding visible at low tide"
symbol_connections: "Represents coastal heritage parallel to palmetto tree and crescent on [state flag](/states/south-carolina/flag/south-carolina-state-flag); embodies resilience and hope reflected in state motto 'Dum Spiro Spero'"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The South Carolina General Assembly designated the bottlenose dolphin as the official state marine mammal through Act Number 58, which Governor Mark Sanford signed on June 3, 2009. The same legislation also designated the wood duck as state duck and the northern right whale as state migratory marine mammal. This also aligns with [the Palmetto State nickname](/states/south-carolina/nickname/the-palmetto-state)."
      - "The designation recognized dolphins as year-round residents of South Carolina's coastal estuaries and cultural ambassadors for the Lowcountry region. Bottlenose dolphins had already become symbols of coastal South Carolina through tourism, marine education programs, and their daily visibility along beaches and tidal creeks."
    
    subsections:
      - subtitle: "Recognition of Coastal Heritage"
        text: "South Carolina lawmakers chose the bottlenose dolphin because no marine animal better represented the state's 187-mile coastline and extensive estuary systems. Dolphins inhabit the Ashley, Cooper, Stono, Wando, and Edisto Rivers throughout the year, unlike migratory species that only visit seasonally. Their permanent residence in South Carolina's brackish waters made them true coastal natives rather than transient visitors. The designation came during a period when South Carolina formalized recognition of marine and coastal symbols, building on earlier adoptions of the sabal palmetto (state tree, 1939) and lettered olive shell (state shell, 1984)."
      
      - subtitle: "Why This Species"
        text: "Legislators selected the bottlenose dolphin specifically because this species demonstrates remarkable intelligence and social complexity while remaining accessible to observation by residents and visitors. Bottlenose dolphins practice cooperative hunting strategies, maintain multi-generational family structures, and exhibit problem-solving abilities that scientists continue to study. The species' protected status under the Marine Mammal Protection Act of 1972 aligned with South Carolina's growing environmental conservation efforts. By choosing a federally protected species, the state reinforced its commitment to marine stewardship and coastal habitat preservation."

  - id: "state-symbolism"
    icon: "fa-water"
    title: "What the Bottlenose Dolphin Represents"
    style: "highlight"
    paragraphs:
      - "The bottlenose dolphin embodies South Carolina's coastal identity and the Lowcountry's distinctive maritime culture. Dolphins appear in daily life throughout coastal communities, swimming alongside boats in tidal creeks, surfacing in harbors, and practicing their unique feeding behaviors near shorelines."
      - "The species represents intelligence, cooperation, and adaptability—traits that mirror the resourcefulness celebrated in South Carolina's motto 'Animis Opibusque Parati' (Prepared in Mind and Resources). Dolphins work together in coordinated groups to find food, protect young, and navigate complex tidal environments."
      - "The designation honors both natural heritage and conservation achievement. South Carolina dolphins live relatively stress-free lives compared to populations elsewhere, facing few natural predators in the state's shallow coastal waters and benefiting from federal protection that prohibits harassment, feeding, or harm."
    
    subsections:
      - subtitle: "Strand Feeding: A Lowcountry Phenomenon"
        text: "South Carolina bottlenose dolphins practice strand feeding, a cooperative hunting behavior found in only a handful of locations worldwide. During this technique, groups of three to five dolphins work in perfect synchronization to herd mullet and other fish toward muddy banks or sandy shores. The dolphins create a powerful bow wave that pushes fish onto land while the dolphins themselves temporarily beach. They grab fish in their mouths, then shimmy back into the water before the tide can strand them. First documented by researchers in Georgia marshes in 1971, strand feeding has become one of South Carolina's most distinctive wildlife spectacles. Only about 25 of Charleston's 350 resident dolphins know how to strand feed, learning the dangerous technique from their mothers during the three-to-five-year calf period."
      
      - subtitle: "Year-Round Coastal Residents"
        text: "South Carolina's bottlenose dolphins differ from ocean-dwelling populations because they remain in the same estuarine territories throughout their lives. Charleston-area dolphins spend ninety percent of their time in the five major river systems, rarely venturing into open ocean. The brackish water of these tidal rivers provides ideal habitat—enough salinity for dolphins to thrive, ample fish populations for food, and protection from larger predators like sharks and orcas that prefer deeper waters. Individual dolphins maintain home ranges within specific river sections:, creating multi-generational communities that occupy the same territories across decades. Some resident dolphins live to sixty years or longer, about fifteen years beyond the lifespan of their ocean-dwelling relatives, thanks to abundant food resources and relatively low predation risk."
      
      - subtitle: "A Symbol of Hope and Resilience"
        text: "The bottlenose dolphin connects naturally to South Carolina's state motto 'Dum Spiro Spero' (While I Breathe, I Hope), which appears on the Great Seal along with the goddess Spes (Hope). Dolphins surface regularly to breathe, creating a visible rhythm of life that mirrors the motto's message about maintaining hope through persistence. Their adaptation to South Carolina's estuaries demonstrates resilience—populations have persisted despite historical threats from pollution, boat traffic, and fishing gear entanglement. Conservation efforts through organizations like the Lowcountry Marine Mammal Network show how education and protection can sustain wildlife populations even as coastal development accelerates."
      
      - subtitle: "Coastal Cultural Identity"
        text: "Dolphins have shaped Lowcountry culture for generations, appearing in Native American traditions, colonial-era accounts, and modern tourism experiences. The Gullah Geechee people of South Carolina's Sea Islands developed stories and observations about dolphins passed down through oral history. Modern residents consider dolphin sightings routine parts of coastal life—fishermen know dolphins follow shrimp trawlers, boaters adjust speed in shallow waters to avoid collisions, and beachgoers watch for the distinctive curved dorsal fins breaking the surface. Tourism centered on dolphin-watching tours, kayak expeditions, and educational programs generates economic activity while raising awareness about marine mammal protection."
      
      - subtitle: "Conservation and Coexistence"
        text: "The state marine mammal designation elevated public awareness about responsible interaction with wild dolphins. Federal law prohibits feeding, touching, swimming with, or harassing dolphins in any way, with fines reaching $100,000 for violations. The Lowcountry Marine Mammal Network, Charleston's only marine mammal response team, trains volunteers in first aid for injured or stranded dolphins and educates residents about safe viewing practices. Organizations conduct annual dolphin counts, photograph individuals to track population health, and advocate for no-wake zones in critical habitat areas. Between fifty-five and seventy marine mammals strand along South Carolina's coast each year, many suffering from boat strikes, fishing line entanglement, or disease, making conservation efforts essential for population stability."

  - id: "identification"
    icon: "fa-binoculars"
    title: "How to Identify Bottlenose Dolphins"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Bottlenose dolphins display a robust, streamlined body built for efficient swimming through tidal currents and coastal waters. Their skin feels smooth and rubbery to touch (though touching wild dolphins violates federal law), with coloration providing camouflage against predators viewing from above or below. The dorsal fin curves backward in a distinctive sickle shape, with individual dolphins showing unique nicks, scars, and patterns researchers use for identification."
        list_items:
          - "**Size**: Adults measure 8 to 12 feet from rostrum tip to tail flukes; newborn calves average 3.5 feet at birth"
          - "**Weight**: Coastal adults typically weigh 400-600 pounds; larger individuals in some populations exceed 1,400 pounds"
          - "**Coloration**: Dark gray along the back (dorsal surface), lighter gray on sides, white to pale pink on belly (ventral surface)"
          - "**Head**: Short, stubby beak-like rostrum with 80-100 conical teeth designed for grasping fish, not chewing; rounded melon (forehead) containing fatty tissue for echolocation"
          - "**Features**: Single blowhole on top of head for breathing; horizontal tail flukes for propulsion; flippers for steering and stability"
      
      - subtitle: "Behavior and Communication"
        text: "Bottlenose dolphins communicate through signature whistles unique to each individual, functioning like names that help pod members maintain contact. They produce clicks for echolocation, using sound waves to navigate murky estuarine waters and locate prey hidden in mud. Social behavior revolves around pod structures—nursery pods of mothers with calves where females share childcare duties, and juvenile pods of young dolphins who have left their mothers but not yet reached sexual maturity. Males sometimes form pair bonds that last years, cooperating in mating competition and food acquisition. Dolphins sleep by shutting down one brain hemisphere at a time, allowing them to surface for air every five to seven minutes even while resting."

  - id: "in-the-state"
    icon: "fa-map-marked-alt"
    title: "Dolphins in South Carolina"
    style: "default"
    paragraphs:
      - "Approximately 350 bottlenose dolphins maintain permanent residence in Charleston-area estuaries, with additional populations inhabiting coastal waters from the North Carolina border to Georgia. These dolphins rarely leave their home territories, spending entire lifetimes within specific river systems."
      - "South Carolina's estuarine dolphins benefit from geography and ecology that create ideal habitat. The state's extensive salt marsh systems filter nutrients and support fish populations that feed dolphins. Tidal fluctuations create feeding opportunities as fish concentrate in shallow waters during tide changes."
    
    facts:
      - "**Charleston Rivers**: Five major systems (Ashley, Cooper, Stono, Wando, Edisto) support year-round dolphin populations with distinct home ranges"
      - "**Population Stability**: Resident dolphin numbers remain relatively stable, though boat strikes, fishing gear, and disease cause 55-70 annual marine mammal deaths statewide"
      - "**Estuarine Advantage**: Brackish water mixing fresh and salt provides optimal conditions—dolphins adapted to salinity levels that would stress pure ocean populations"
      - "**Individual Identification**: Researchers catalog individual dolphins through dorsal fin photographs, tracking some animals across decades"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Bottlenose Dolphins"
    style: "default"
    paragraphs:
      - "South Carolina offers exceptional dolphin viewing opportunities throughout the coastal zone, with Kiawah Island recognized worldwide as one of the most accessible places to observe strand feeding. The key to successful viewing involves understanding tidal cycles, respecting federal protection laws, and visiting locations where dolphins regularly hunt."
      - "Timing matters greatly for dolphin observation. Low tide creates optimal conditions for strand feeding as fish concentrate in shallow areas. Dawn and dusk typically show highest dolphin activity, though resident populations may surface at any hour. Patience rewards observers—dolphins move through territories on schedules dictated by tides, fish movements, and social activities."
    
    list_items:
      - "**Kiawah Island (Beachwalker Park)**: Walk southwest along the beach toward where the Kiawah River meets the Atlantic Ocean to witness strand feeding dolphins, especially during low tide; maintain 15-yard distance from shore to avoid disturbing feeding behavior; year-round viewing opportunities make this location exceptional"
      - "**Seabrook Island**: One of the few places worldwide where dolphins strand feed nearly daily; Captain Sam's Inlet provides excellent vantage points; local dolphins like Step (estimated 28+ years old) demonstrate matriarchal pod structures during feeding"
      - "**Charleston Harbor and Rivers**: Dolphins surface regularly throughout Ashley, Cooper, and Wando Rivers; kayak tours in tidal creeks offer close (but respectful distance) encounters; Morris Island and Folly Beach provide beach-based viewing"
      - "**ACE Basin National Estuarine Research Reserve**: Dolphins inhabit this 350,000-acre reserve encompassing Ashepoo, Combahee, and Edisto Rivers; pristine habitat supports hunting and nursery activities viewable from boats and observation platforms"
      - "**South Carolina Aquarium (Charleston)**: Offers educational programs about local dolphin populations, though the aquarium does not house live dolphins; viewing windows overlook Charleston Harbor where wild dolphins frequently pass"

  - id: "current-status"
    icon: "fa-shield-alt"
    title: "Conservation Status and Protection"
    style: "default"
    paragraphs:
      - "Bottlenose dolphins receive federal protection under the Marine Mammal Protection Act of 1972, which makes it illegal to harass, hunt, capture, feed, or kill any marine mammal. Violations carry fines up to $100,000 and potential criminal charges."
      - "South Carolina dolphin populations remain stable but face ongoing threats from human activities. Boat strikes rank among the leading causes of dolphin injury and death in state waters. Entanglement in fishing line, crab pot lines, and commercial fishing gear causes additional mortality and serious injury."
    
    subsections:
      - subtitle: "Management in South Carolina"
        text: "The National Oceanic and Atmospheric Administration (NOAA) manages bottlenose dolphin populations through the Bottlenose Dolphin Take Reduction Plan, which restricts certain commercial fishing gear in critical dolphin habitat. The South Carolina Department of Natural Resources partners with NOAA to monitor populations, enforce protection laws, and respond to strandings. State wildlife officials promote BearWise-style dolphin coexistence practices: operating boats at minimum wake speeds in shallow waters and no-wake zones, removing fishing line from waters, reporting injured or dead dolphins immediately, and never approaching within 50 yards by vessel or 15 yards on foot. The Lowcountry Marine Mammal Network serves as South Carolina's primary marine mammal response organization, the only such team in a state where most coastal states maintain five to fifteen response teams."
      
      - subtitle: "Threats and Challenges"
        text: "Dolphins in South Carolina face multiple pressures despite legal protection. Coastal development reduces natural shoreline and increases boat traffic in dolphin habitat. Water pollution from agricultural runoff, industrial discharge, and stormwater introduces contaminants that accumulate in dolphin tissues over decades. Climate change alters fish distributions and may affect the timing of seasonal prey availability. Human interaction remains problematic—people attempting to feed dolphins teach animals to approach boats and docks, increasing collision risk and creating dependency that mothers pass to calves. Viral infections spread through populations, with dolphin morbillivirus causing periodic die-offs throughout the Atlantic coast. Noise pollution from boat engines, construction, and military exercises may interfere with echolocation and communication that dolphins depend on for survival."
      
      - subtitle: "Viewing Responsibly"
        text: "Responsible dolphin viewing protects both animals and observers while preserving South Carolina's strand feeding phenomenon for future generations. Federal guidelines require vessels to maintain 50-yard distance from dolphins and individuals on foot or beach to stay 15 yards away. When dolphins approach boats out of curiosity, operators should place engines in neutral and allow animals to pass. Swimmers and waders must exit the water if dolphins approach—dolphins are wild predators with powerful jaws and unpredictable behavior. Never attempt to feed dolphins human food, fish scraps, or bait; feeding creates dangerous associations between humans and food. During strand feeding events, observers should remain quiet, avoid sudden movements, and give dolphins clear paths back to water. Photographers can capture spectacular images while maintaining legal distances using telephoto lenses. Report violations of Marine Mammal Protection Act to NOAA enforcement at 1-800-853-1964."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The bottlenose dolphin connects to South Carolina's other state symbols through shared themes of coastal heritage, resilience, and maritime identity. The dolphin's permanent residence in tidal rivers and estuaries mirrors the importance of waterways shown on South Carolina's Great Seal, adopted in 1776."
      - "South Carolina's selection of marine symbols expanded dramatically in the late 20th and early 21st centuries. The state designated the lettered olive as state shell in 1984, recognizing Dr. Edmund Ravenel's discovery and documentation of this species. The bottlenose dolphin joined as state marine mammal in 2009, with the northern right whale simultaneously designated as state migratory marine mammal, acknowledging both resident and seasonal marine wildlife."
    
    subsections:
      - subtitle: "The Palmetto and Crescent Connection"
        text: "South Carolina's state flag features a white palmetto tree and white crescent on indigo blue, adopted in its current form in 1861. The flag's symbolism connects to the bottlenose dolphin through coastal geography and Revolutionary War heritage. Colonel William Moultrie's palmetto-log fort on Sullivan's Island successfully defended Charleston Harbor in 1776 using the same tidal waters where dolphins hunt today. The crescent symbol came from Revolutionary soldiers' caps and represents either a military gorget or a waxing moon symbolizing hope and increasing prosperity. Dolphins surface to breathe in coastal waters surrounding Sullivan's Island, Fort Moultrie, and Charleston Harbor, swimming through the same maritime environment that shaped the flag's creation. The indigo blue background references South Carolina's colonial indigo industry, which thrived in coastal plantation regions where dolphins still inhabit tidal creeks."
        link:
          label: "See South Carolina state flag"
          url: "/states/south-carolina/flag/south-carolina-state-flag"
      
      - subtitle: "State Mottoes and the Spirit of Hope"
        text: "South Carolina's Great Seal displays two Latin mottoes that resonate with the bottlenose dolphin's symbolism. 'Dum Spiro Spero' (While I Breathe, I Hope) appears on the seal's right oval alongside the goddess Spes (Hope) holding a laurel branch as the sun rises. Dolphins embody this motto through their regular surfacing to breathe—their presence in Lowcountry waters represents hope that conservation and coexistence can succeed even as coastal development accelerates. The seal's left motto, 'Animis Opibusque Parati' (Prepared in Mind and Resources), reflects the intelligence and cooperative hunting strategies dolphins demonstrate. Dolphin mothers spend years teaching calves complex behaviors like strand feeding, echolocation techniques, and social navigation—preparation in mind that ensures survival across generations. The goddess Spes stands on a shore littered with weapons, symbolizing hope after conflict, much as modern dolphins thrive in waters where commercial pressures once threatened their populations."
        link:
          label: "See South Carolina state motto"
          url: "/states/south-carolina/motto"
      
      - subtitle: "Coastal Ecosystem Symbols"
        text: "The bottlenose dolphin exists within South Carolina's coastal ecosystem alongside other state symbols. The Carolina loggerhead sea turtle (state reptile, 1988) nests on the same barrier island beaches where dolphins strand feed. Both species face similar threats from beach development, boat traffic, and fishing gear. The lettered olive shell (state shell, 1984) inhabits shallow coastal waters within dolphin feeding territories. The sabal palmetto (state tree, 1939) dominates the same Sea Islands and coastal regions where dolphins live, with palmetto-lined shores providing nesting habitat for birds that follow dolphin feeding activities to catch fleeing fish. These symbols collectively represent South Carolina's maritime character and the interdependence of coastal species and habitats."
        link:
          label: "See South Carolina state tree"
          url: "/states/south-carolina/tree/sabal-palmetto"

