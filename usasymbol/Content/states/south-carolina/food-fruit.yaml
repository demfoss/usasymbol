seo_title: "South Carolina State Fruit | Peach"
seo_description: "South Carolina's state fruit is the peach, adopted in 1984, a top peach-producing state on the East Coast."
hero_image: /images/foods/south-carolina/south-carolina-state-fruit-hero.webp
hero_image_alt: "Ripe peaches on a tree branch."
