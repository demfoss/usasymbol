intro_text: "South Carolina's state fruit is the peach, adopted in 1984 to recognize a crop that makes the state one of the top peach producers on the East Coast. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is South Carolina's State Fruit?"
    paragraphs:
      - "The peach is South Carolina's official state fruit, designated by the South Carolina General Assembly in 1984. South Carolina grows more peaches than any state besides California, with major orchards in the Upstate and the Ridge region."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Peach"
    paragraphs:
      - "Peaches are round, fuzzy-skinned tree fruits with sweet, juicy flesh. South Carolina's peach season runs from May through August, with orchards across the state selling fresh peaches at roadside stands."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Peach Became South Carolina's State Fruit"
    paragraphs:
      - "The South Carolina General Assembly designated the peach the official state fruit in 1984."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why South Carolina Chose the Peach"
    paragraphs:
      - "South Carolina's Ridge region and Upstate counties have grown peaches commercially for more than a century, and the state consistently ranks among the top peach producers in the country."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Peach Comes From in South Carolina"
    paragraphs:
      - "The Ridge region around Edgefield and Saluda counties, along with orchards in the Upstate near Gaffney, are South Carolina's best-known peach-growing areas."
    sites:
      - name: The Ridge
        city: Edgefield
        lat: 33.79
        lng: -81.93
        note: "Historic South Carolina peach-growing region"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Peach Facts"
    facts:
      - "Adopted as South Carolina's state fruit in 1984."
      - "South Carolina grows more peaches than any state except California."
      - "The Ridge region and Upstate counties are the state's leading peach areas."

