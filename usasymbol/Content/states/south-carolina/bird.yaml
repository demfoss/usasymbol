sections:
- id: why-did-south-carolina-finally-choose-the-carolina-wren
  icon: fa-solid fa-circle-question
  title: Why Did South Carolina Finally Choose the Carolina Wren?
  paragraphs:
  - The Carolina Wren already looked and sounded more specific to South Carolina than the bird it eventually replaced.
  - Its common name mattered. A state looking for a public bird symbol could hardly miss the appeal of a bird that already said <strong>Carolina</strong> out loud.
  - Officials also described the wren as a year-round bird heard across the state. That gave South Carolina a symbol residents could recognize in ordinary life instead of a bird tied only to one season or one corner of the map.
- id: why-was-the-1948-law-more-of-a-correction-than-a-first-choice
  icon: fa-solid fa-rotate-left
  title: Why Was the 1948 Law More of a Correction Than a First Choice?
  paragraphs:
  - South Carolina sources say the Carolina Wren had already been unofficially recognized before 1939. The state then interrupted that path by making the mockingbird the official bird.
  - Act No. 693 of 1948 reversed that earlier decision. So the wren story is not just a clean first adoption. It is a delayed ratification of the bird that many supporters had wanted the state to formalize all along.
  - The Carolina Wren arrived not as a novelty, but as the bird South Carolina eventually decided fit better than the more generic Southern choice it had briefly put in law.
- id: how-did-the-carolina-wren-stay-visible-after-1948
  icon: fa-solid fa-coins
  title: How Did the Carolina Wren Stay Visible After 1948?
  paragraphs:
  - The wren did not disappear into one old act. South Carolina kept using it as a public symbol long after the 1948 designation.
  - The clearest later example came in <strong>2000</strong>, when the Carolina Wren appeared on the state's quarter alongside the palmetto tree and yellow jessamine — placed inside a larger official set of South Carolina symbols rather than left as a line in the code.
faq:
- question: What is South Carolina's state bird?
  answer: South Carolina's state bird is the Carolina Wren.
- question: When did South Carolina adopt the Carolina Wren?
  answer: South Carolina adopted the Carolina Wren on April 3, 1948.
- question: Did South Carolina have a different state bird first?
  answer: Yes. The state named the mockingbird in 1939 before replacing it with the Carolina Wren in 1948.
- question: Why did the Carolina Wren fit South Carolina better than the mockingbird?
  answer: The Carolina Wren felt more state-specific because its common name already carried Carolina and officials described it as a permanent resident heard across South Carolina year-round.
- question: Was the Carolina Wren already connected to South Carolina before 1948?
  answer: Yes. South Carolina sources say the bird had already been unofficially recognized before the 1939 mockingbird designation interrupted that path.
- question: What does the Carolina Wren mean for South Carolina?
  answer: The Carolina Wren represents a delayed correction — a bird that had been unofficially associated with South Carolina before the state briefly put the mockingbird into law in 1939, then replaced it with the wren in 1948.
- question: Did the Carolina Wren appear in any later South Carolina symbol?
  answer: Yes. The Carolina Wren appeared on South Carolina's 2000 state quarter with the palmetto tree and yellow jessamine.
