title: Carolina Wren
scientific_name: Thryothorus ludovicianus
adopted_year: 1948
legislation: Act No. 693 of 1948; S.C. Code Ann. Sec. 1-1-630
meaning: South Carolina did not discover the Carolina Wren in 1948. It finally ratified a bird that already felt more South Carolina-specific than the mockingbird it had briefly named in 1939 — because the wren's common name carried Carolina and officials described it as a year-round bird heard across the state.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: '2026-03-28'
seo_title: 'South Carolina State Bird: Carolina Wren'
seo_description: South Carolina adopted the Carolina Wren in 1948 after first naming the mockingbird in 1939. The stronger story is that the state eventually ratified the bird whose name already carried Carolina.
intro_text: South Carolina's official state bird is the <strong>Carolina Wren</strong>, adopted on <strong>April 3, 1948</strong> and now listed in <strong>S.C. Code Ann. Sec. 1-1-630</strong>. The 1948 law did not create a brand-new symbol out of nowhere. It replaced the <strong>mockingbird</strong>, which had been named in 1939, and put the Carolina Wren into a role many supporters had already pushed for. South Carolina ended up ratifying the bird that already sounded local, stayed in the state year-round, and carried Carolina in its own name.
