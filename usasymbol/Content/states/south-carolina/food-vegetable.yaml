sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is South Carolina's State Vegetable?"
    paragraphs:
      - "Collard greens are South Carolina's official state vegetable, designated by the South Carolina General Assembly in 2011. Collards are a leafy green vegetable long grown and eaten across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Collard Greens"
    paragraphs:
      - "Collard greens are large, dark green leafy vegetables in the cabbage family, grown in cool weather and known for their slightly bitter, earthy flavor. In South Carolina they are traditionally cooked slowly with seasoning meat and served as a side dish, especially around the New Year."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Collard Greens Became South Carolina's State Vegetable"
    paragraphs:
      - "The South Carolina General Assembly designated collard greens the official state vegetable in 2011, following a campaign backed by school students and agricultural groups to give the state an official vegetable."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why South Carolina Chose Collard Greens"
    paragraphs:
      - "South Carolina chose collard greens because the leafy vegetable has deep roots in the state's African American culinary traditions and Lowcountry cooking, and remains a common home garden crop across the state."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Collard Greens Facts"
    facts:
      - "Adopted as South Carolina's state vegetable in 2011."
      - "Collard greens are part of the cabbage family."
      - "Collards are traditionally served in South Carolina around the New Year."
      - "The designation followed a campaign supported by school students."

