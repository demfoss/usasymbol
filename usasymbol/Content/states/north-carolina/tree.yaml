type: State Tree
state: North Carolina
name: Pine
scientific_name: Pinus spp.
adopted_year: 1963
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: '2026-05-07'
seo_title: "North Carolina State Tree | Pine"
seo_description: 'North Carolina adopted pine in 1963, honoring the genus behind Tar Heel naval stores, lumber history, and native species across the state.'

intro_text: "The North Carolina state tree is <strong>Pine</strong> (<em>Pinus</em> species), adopted in <strong>1963</strong>. Unlike many states, North Carolina honored the pine genus rather than one single species, so the answer to 'what is the state tree of North Carolina?' is Pine. The choice reflects the state's long history with lumber and naval stores - tar, pitch, and turpentine - that helped create the 'Tar Heel' character. Longleaf pine, loblolly pine, shortleaf pine, and white pine all help connect the symbol to North Carolina's coast, Piedmont, and mountains, and the page appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the North Carolina State Tree?"
    paragraphs:
      - "North Carolina's official state tree is Pine, making the state unique for designating an entire genus rather than a specific species. Eight native pine species grow in North Carolina - loblolly pine, longleaf pine, shortleaf pine, Virginia pine, pitch pine, pond pine, Table Mountain pine, and eastern white pine. Loblolly and longleaf pines dominate commercially and historically. Loblolly pine covers more North Carolina acreage than any other tree, growing 60 to 100 feet tall across the coastal plain and piedmont. Longleaf pine once dominated but now grows on a fraction of its historical range. These pines provided the raw materials that built North Carolina's colonial and early American economy."
      - "Pine needles grow in bundles called fascicles, with the number of needles per bundle helping identify species. Loblolly pine has three needles per bundle measuring six to nine inches long. Longleaf pine shows three needles measuring eight to eighteen inches - the longest of any eastern pine. White pine produces five needles per bundle. The bark varies by species but generally appears reddish-brown to gray with plated or scaly texture. Pine cones range from two inches to over ten inches depending on species. All North Carolina pines are evergreen conifers that keep needles year-round, unlike deciduous trees that drop leaves in fall."
      - "Pines grow throughout North Carolina from the coast to the mountains. Loblolly pine thrives across the coastal plain and piedmont on a variety of soils. Longleaf pine historically dominated the sandhills and coastal plain, preferring well-drained sandy soils and fire-prone habitats. Virginia pine and pitch pine grow in the piedmont and mountains. White pine occupies mountain coves and slopes in western North Carolina. Pine forests cover approximately 60 percent of North Carolina's forestland - over 18 million acres. This extensive pine coverage makes North Carolina one of America's leading timber-producing states. The state's forest products industry employs over 140,000 people and generates billions in economic activity annually, with pine timber forming the foundation, while broader growth context is shown in [U.S. states by population](/rankings/demographics/states-by-population)."

  - id: name
    icon: "fa-solid fa-tag"
    title: "North Carolina State Tree Name"
    paragraphs:
      - "The official designation simply states 'Pine' without specifying a species, making North Carolina unique among state tree designations. The genus name Pinus includes about 115 species worldwide. North Carolinians use common names for specific species - loblolly pine, longleaf pine, shortleaf pine, and others. The word pine comes from Latin pinus. Early North Carolina colonists called various species yellow pine, pitch pine, or heart pine depending on wood characteristics and resin content."
      - "The nickname 'Tar Heel State' connects directly to North Carolina's pine heritage. Colonial workers produced tar and pitch by burning longleaf pine wood in kilns. This sticky work left workers' heels covered in tar, creating the enduring nickname. All pine species belong to the Pinaceae family. North Carolina's decision to honor all pines rather than one species recognized that multiple pine species contributed to the state's economy and landscape; see [the Tar Heel State history](/states/north-carolina/nickname/the-tar-heel-state). The designation acknowledges loblolly pine's modern commercial dominance while respecting longleaf pine's historical importance and other species' ecological roles."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Pine Became the North Carolina State Tree"
    paragraphs:
      - "North Carolina made Pine its official state tree on March 14, 1963. The North Carolina General Assembly passed the designation during the 1963 session. The legislation recognized pine's central role in North Carolina's history, economy, and landscape without limiting the honor to a single species. By 1963, North Carolina had established itself as a leading timber-producing state, with pine forests forming the backbone of the industry. The designation acknowledged both historical and contemporary importance of multiple pine species to the state and to values reflected in [North Carolina's motto](/states/north-carolina/motto/esse-quam-videri)."
      - "North Carolina selected pine because the genus defined the state's economic development for over 300 years. Colonial North Carolina became the world's leading producer of naval stores - tar, pitch, and turpentine extracted from longleaf pine. These products waterproofed wooden ships and preserved rope, making them essential to maritime commerce and naval power. North Carolina's vast longleaf pine forests supplied most naval stores for British and later American ships. This industry employed thousands of North Carolinians from the 1700s through early 1900s. The work gave North Carolina its 'Tar Heel' nickname, now worn with pride. Pine tar production involved heating pine wood in earthen kilns, causing resin to flow out as tar. Turpentine came from tapping living trees for raw resin called oleoresin, then distilling it."
      - "The lumber industry followed naval stores as North Carolina's economic driver. Longleaf pine lumber built much of the eastern United States during the 1800s and early 1900s. The straight-grained, durable wood constructed homes, churches, businesses, and infrastructure across growing America. North Carolina sawmills processed billions of board feet of pine. As longleaf forests declined from logging, loblolly pine plantations replaced them. Modern North Carolina leads the nation in furniture manufacturing, with much furniture built from pine. The state ranks among the top timber producers nationally, with pine comprising the majority of harvest. Christmas tree farming, concentrated in North Carolina's mountains, makes the state the nation's second-largest Christmas tree producer - primarily Fraser fir but continuing the evergreen tree tradition. The multi-species designation honored all pines' contributions while recognizing that loblolly pine had become the dominant commercial species by 1963. The choice reflected North Carolina's practical approach - honoring historical longleaf pine importance while acknowledging modern loblolly pine dominance, and respecting the ecological diversity of all eight native pine species."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "North Carolina State Tree Facts"
    facts:
      - "North Carolina made Pine its state tree on March 14, 1963, designating the entire genus rather than a single species"
      - "Eight native pine species grow in North Carolina - loblolly, longleaf, shortleaf, Virginia, pitch, pond, Table Mountain, and eastern white pine"
      - "Pine forests cover approximately 60 percent of North Carolina's forestland - over 18 million acres statewide"
      - "Colonial North Carolina was the world's leading producer of naval stores (tar, pitch, turpentine) from longleaf pine, earning the 'Tar Heel' nickname"
      - "North Carolina's forest products industry employs over 140,000 people with pine timber forming the economic foundation"
      - "Loblolly pine now covers more North Carolina acreage than any other tree species after replacing logged longleaf forests"
      - "Longleaf pine once covered 90 million acres in the Southeast, with vast stands across North Carolina, but declined by over 97 percent due to logging"
      - "North Carolina ranks as one of America's top timber-producing states, with the majority of harvest coming from pine species"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "North Carolina State Tree and Flower"
    paragraphs:
      - "North Carolina's state flower is the Flowering Dogwood (Cornus florida), designated in 1941. The state adopted its floral symbol 22 years before choosing pine. Both symbols represent North Carolina's native flora and economic importance. The flowering dogwood blooms white in spring across North Carolina forests and landscapes, while pine trees tower overhead year-round. Dogwood flowers appear in April as pines begin new growth. The pair shows North Carolina's diverse forest ecosystems from understory flowering trees to pine canopy. Dogwood and pine often grow together in North Carolina's mixed forests from the piedmont to the mountains; compare [the state flower page](/states/north-carolina/flower/flowering-dogwood)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize North Carolina Pines"
    paragraphs:
      - "Count the needles in each bundle for species identification. Loblolly, longleaf, and shortleaf pines have three needles per bundle. Virginia and pitch pines show two needles per bundle. Eastern white pine produces five needles per bundle. Needle length varies dramatically - longleaf pine needles reach eight to eighteen inches, the longest of any pine in North Carolina. Loblolly pine needles measure six to nine inches. White pine needles are two to five inches long. The needles appear stiff on most species but soft and flexible on white pine. All North Carolina pines keep needles year-round, distinguishing them from deciduous trees."
      - "The bark varies by species but shares common pine characteristics. Loblolly pine bark appears reddish-brown with irregular flat plates separated by deep furrows. Longleaf pine develops orange-brown plated bark on mature trees. White pine shows smoother bark with horizontal breaks and a somewhat scaly texture. Virginia pine and pitch pine have darker, rougher bark. Young pines generally show darker, smoother bark that develops plates and furrows as trees age. Bark thickness increases with age, with longleaf pine developing particularly thick bark that protects against fire."
      - "The overall form depends on growing conditions and species. Loblolly pine develops a straight trunk with a rounded crown, growing rapidly in plantations to 60 to 100 feet. Longleaf pine shows a distinctive grass stage - seedlings remain short for years, looking like grass clumps, before shooting upward. Mature longleaf pines form tall straight trunks with high crowns. White pine creates a more conical shape with horizontal branching. Virginia pine often develops a scrubby, irregular form. Cones vary from small two-inch cones on Virginia pine to large ten-inch longleaf pine cones. All pines produce woody cones with scales that protect seeds until maturity. Pine seeds have papery wings that catch wind for dispersal across North Carolina landscapes."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the North Carolina State Tree Symbolizes"
    paragraphs:
      - "Pine represents North Carolina's economic foundation and natural heritage. The trees symbolize the state's transformation from colonial naval stores producer to modern timber leader. For many North Carolinians, pine forests evoke the state's rural character and connection to forestry. The 'Tar Heel' nickname connects modern residents to the pine tar industry that defined early North Carolina. The multi-species designation reflects North Carolina's biodiversity and practical recognition that different pines serve different ecological and economic roles, including habitat for [the Northern Cardinal state bird](/states/north-carolina/bird/northern-cardinal). Pine reflects North Carolina's ability to sustain forest industries while maintaining millions of acres of working forests that provide timber, recreation, wildlife habitat, and working forests throughout the state."

