    answer: "Count needles per bundle - loblolly, longleaf, and shortleaf have three; Virginia and pitch have two; white pine has five. Longleaf needles are extremely long (eight to eighteen inches). The bark is reddish-brown to gray with plates and furrows. All pines are evergreen with woody cones. Loblolly grows 60 to 100 feet tall with straight trunk. Pines keep needles year-round unlike deciduous trees."

