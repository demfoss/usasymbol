seo:
  title: "Most Common Last Names in North Carolina"
  description: "North Carolina's most common last names are Smith, Williams, and Johnson, shaped by Great Wagon Road and Cape Fear settlement."

page:
  h1: "Most Common Last Names in North Carolina"
  intro: "In 2010, Smith, Williams, and Johnson were the most common last names in North Carolina, a ranking shaped by early English settlement on the coast, Great Wagon Road migration into the Piedmont, and large Black communities rooted in the coastal plain. The list also carries a sharper North Carolina marker farther down, where Lumbee surnames from Robeson County rise far above their national ranks."
  heritage_title: "Coastal Colonists, Wagon Road Families, and Lumbee Strongholds"
  heritage_body: "English families first anchored the Albemarle and lower Cape Fear, while Highland Scots settled the upper Cape Fear around Cross Creek, now Fayetteville, after 1739. From the 1730s through the Revolution, Scot-Irish and German settlers came down the Great Wagon Road into Rowan, Orange, Guilford, and the Yadkin-Catawba country, reinforcing names such as Johnson, Jones, Miller, and Wilson. In Robeson County, Lumbee communities kept surnames such as Locklear, Oxendine, Chavis, Bullard, and Lowery unusually concentrated, giving North Carolina one of the sharpest local surname clusters in the South."
  fun_fact: "Locklear is one of North Carolina's clearest signature surnames. Forebears places it 67th statewide, yet 71 percent of all Locklears in the United States live in North Carolina, and Robeson County alone reports more than 9,200 of them."

surnames:
  - rank: 1
    name: Smith
    count: 130234
    ratio: 81
    origin: english
    type: Occupational
    meaning: "From Old English 'smith', a metalworker or blacksmith. Smith became North Carolina's most common surname because it was carried by early coastal settlers, then reinforced by migration into the Piedmont and mountains, making it common in nearly every region of the state."

  - rank: 2
    name: Williams
    count: 92275
    ratio: 115
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic personal name 'Willahelm'. In North Carolina, Williams rose through both older British settlement and its wide use among Black families in the coastal plain, the Cape Fear, and later urban counties such as Mecklenburg and Wake."

  - rank: 3
    name: Johnson
    count: 88407
    ratio: 120
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan', meaning God is gracious. Johnson spread with English and Scots-Irish families moving down the Great Wagon Road into the backcountry, then became equally prominent in eastern counties with long African American settlement."

  - rank: 4
    name: Jones
    count: 86281
    ratio: 123
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form meaning son of John. Jones has deep roots in North Carolina from the colonial coast to the western Piedmont, and its high statewide rank reflects how thoroughly Welsh and border-British naming traditions blended into the colony's early population."

  - rank: 5
    name: Brown
    count: 70699
    ratio: 150
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', originally describing brown hair, complexion, or clothing. Brown became one of North Carolina's most evenly distributed surnames, appearing strongly in both plantation-era eastern counties and the inland farming belt."

  - rank: 6
    name: Davis
    count: 67997
    ratio: 156
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid', meaning beloved. Davis came early into North Carolina through British settlers and remained especially common in the Piedmont and coastal plain, where it appears in county records from the colonial period onward."

  - rank: 7
    name: Moore
    count: 44416
    ratio: 239
    origin: english
    type: Topographic
    meaning: "From Old English 'mor', meaning moor or open upland. Moore fits North Carolina's geography well, and the name took hold across both the sandy coastal plain and the upland counties settled from Virginia and Pennsylvania."

  - rank: 8
    name: Miller
    count: 40683
    ratio: 260
    origin: english
    type: Occupational
    meaning: "From Middle English 'miller', a grain-mill operator. The surname grew in North Carolina's mill-heavy Piedmont, where German and Scots-Irish settlers followed creeks and rivers suitable for gristmills in Rowan, Guilford, and Forsyth counties."

  - rank: 9
    name: Taylor
    count: 40171
    ratio: 264
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', a cutter of cloth. Taylor appears in North Carolina's oldest courthouse and land records and spread with both coastal settlers and inland farming families during the eighteenth century."

  - rank: 10
    name: Wilson
    count: 39408
    ratio: 269
    origin: english
    type: Patronymic
    meaning: "Son of Will, a shortened form of William. Wilson was carried south by Great Wagon Road migrants and became especially at home in the Piedmont, where Presbyterian Scots-Irish communities helped preserve English and Scottish patronymics."

  - rank: 11
    name: Harris
    count: 39071
    ratio: 271
    origin: english
    type: Patronymic
    meaning: "Son of Harry, a medieval form of Henry. Harris ranks higher in North Carolina than nationally, which fits the state's long continuity of English colonial families in the east and older farm communities in the Piedmont."

  - rank: 12
    name: White
    count: 35103
    ratio: 302
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwit', originally a descriptive name for someone fair-haired or pale. White appears across North Carolina from the Albemarle to the Blue Ridge, showing how early English surnames stayed durable despite later migration streams."

  - rank: 13
    name: Thomas
    count: 33599
    ratio: 315
    origin: welsh
    type: Patronymic
    meaning: "From Aramaic 'Ta'oma', meaning twin. Thomas entered North Carolina through Welsh and English settlers and stayed common in both the old eastern counties and the inland Piedmont church communities that grew in the mid-1700s."

  - rank: 14
    name: Thompson
    count: 31332
    ratio: 338
    origin: english
    type: Patronymic
    meaning: "Son of Thomas, with the inserted 'p' reflecting later English spelling. Thompson followed Scots-Irish and English families into the backcountry, especially along the Yadkin and Catawba corridors that opened during eighteenth-century settlement."

  - rank: 15
    name: Jackson
    count: 29955
    ratio: 354
    origin: english
    type: Patronymic
    meaning: "Son of Jack, a medieval form of John. Jackson became common in North Carolina through older British settlement and later African American surname patterns, and the name is visible from the eastern counties to the western mountain county that bears it."

  - rank: 16
    name: Edwards
    count: 29761
    ratio: 356
    origin: english
    type: Patronymic
    meaning: "Son of Edward, from Old English elements meaning wealth and guard. Edwards ranks strikingly high in North Carolina, especially compared with its national standing, suggesting the persistence of older English family lines in both the coastal plain and south-central Piedmont."

  - rank: 17
    name: Parker
    count: 29162
    ratio: 363
    origin: english
    type: Occupational
    meaning: "Originally a keeper of a park or enclosed hunting ground, from Old French 'parchier'. In North Carolina the name became detached from its aristocratic origin and spread widely through rural counties settled from Virginia and the coastal plain."

  - rank: 18
    name: Hall
    count: 29147
    ratio: 363
    origin: english
    type: Habitational
    meaning: "From Old English 'heall', someone who lived or worked at a hall or manor. Hall is common across the state, but it has special strength in the western half of North Carolina, where long-settled Appalachian and foothill families kept older British surnames locally dense."

  - rank: 19
    name: Martin
    count: 28751
    ratio: 368
    origin: latin
    type: Patronymic
    meaning: "From Latin 'Martinus', meaning of Mars. Martin entered North Carolina through English, Welsh, and some French Protestant lines, and it remained durable in both the coast and the Piedmont as families spread south from Virginia."

  - rank: 20
    name: Allen
    count: 28496
    ratio: 372
    origin: celtic
    type: Patronymic
    meaning: "From the personal name Alan or Allen, likely from a Breton and wider Celtic root. Allen is common in North Carolina's Piedmont counties settled by Great Wagon Road migrants, then remains visible in eastern counties with much older colonial records."

unique_surnames:
  - name: Locklear
    state_rank: 67
    national_rank: 2377
    origin: english
    why: "Likely a variant of Lockyer, an English occupational surname for a locksmith. In North Carolina it is inseparable from Lumbee history in Robeson County, where Pembroke, Saddletree, and surrounding communities turned Locklear into a true state-signature name. Robeson County alone lists more than 9,200 Locklears, and Forebears says 71 percent of all U.S. bearers live in North Carolina."

  - name: Oxendine
    state_rank: 317
    national_rank: 5795
    origin: english
    why: "Oxendine is usually linked to British place-name forms such as Oxenden or Oxendean. In North Carolina it is another classic Lumbee surname centered on Robeson County communities near Pembroke and Bear Swamp. The name ranks only 5,795th nationally but 317th in North Carolina, and Forebears reports that 61 percent of U.S. Oxendines live in the state."

  - name: Chavis
    state_rank: 244
    national_rank: 2717
    origin: other
    why: "Chavis is one of the traditional surnames associated with Lumbee families in southeastern North Carolina. Robeson County ranks it fifth locally, with more than 2,200 bearers in Forebears' county table, which helps explain why it sits far higher in North Carolina than in the national list. The name also appears in nineteenth-century North Carolina records involving Lumbee people under the spelling Chavers."

  - name: Bullard
    state_rank: 334
    national_rank: 1413
    origin: english
    why: "Bullard is an English occupational surname meaning a bull-herd. In North Carolina it has a strong Robeson County and Lumbee association, where it ranks ninth locally and sits much higher than it does in the nation as a whole. That concentration makes Bullard feel far more southeastern North Carolina than generically American."

  - name: Lowery
    state_rank: 246
    national_rank: 785
    origin: scottish
    why: "Lowery is a Scottish surname related to Lowrie or Laurie. In North Carolina it connects both to the Lumbee community and to the Lowry family made famous by Henry Berry Lowry during Reconstruction in Robeson County. Even though the surname is nationally broader than Locklear or Oxendine, its historical weight in southeastern North Carolina gives it a distinct state identity."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Four of North Carolina's top 20 surnames are occupational: Smith, Miller, Taylor, and Parker. That mix reflects a state settled early by English speakers and then reinforced by mill-centered Piedmont communities, where trade names stayed common long after their literal job meanings faded."
    examples:
      - Smith (metalworker)
      - Miller (mill operator)
      - Taylor (tailor)
      - Parker (park keeper)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate North Carolina's top 20, including Williams, Johnson, Jones, Davis, Wilson, Thomas, Thompson, Jackson, Edwards, Martin, and Allen. That heavy share matches the state's settlement history, since English, Welsh, and Scots-Irish migrants brought father-name surnames through both the coastal colonies and the Great Wagon Road."
    examples:
      - Williams (son of William)
      - Johnson (son of John)
      - Jones (son of John, Welsh form)
      - Thompson (son of Thomas)

  - type: Habitational and Descriptive Names
    icon: fa-solid fa-map-location-dot
    description: "A smaller but important group comes from landscape terms or nicknames, including Brown, Moore, White, and Hall. These names stayed strong in North Carolina because the colony filled early and grew locally for generations, allowing very old British surname forms to persist from the Albemarle to the mountains."
    examples:
      - Brown (brown hair or complexion)
      - Moore (near a moor)
      - White (fair hair or complexion)
      - Hall (dweller at a hall)

faq:
  - question: "What is the most common last name in North Carolina?"
    answer: "Smith is the most common last name in North Carolina in this 2010-based dataset. Forebears lists 130,234 Smiths in the state, or about 1 in every 81 residents. Williams and Johnson rank second and third."

  - question: "Why are Locklear and Oxendine so common in North Carolina?"
    answer: "Both surnames are strongly tied to the Lumbee community of Robeson County in southeastern North Carolina. That local concentration is intense enough that Locklear ranks 67th statewide and Oxendine 317th, even though both are far rarer nationally. Robeson County alone lists Locklear first and Oxendine third among all county surnames."

