intro_text: "North Carolina's state cookie is listed as the Moravian cookie in 2026, a paper-thin spiced cookie brought to the state by Moravian settlers in Winston-Salem. This profile appears in the [list of U.S. state foods](/symbols/desserts)."

sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is North Carolina's State Cookie?"
    paragraphs:
      - "The Moravian cookie is listed as North Carolina's state cookie in 2026. It is a very thin, crisp cookie flavored with spices such as ginger, cinnamon, and molasses."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Moravian Cookie"
    paragraphs:
      - "Moravian cookies are rolled paper thin before baking, giving them a delicate, snap-like texture unlike thicker American spice cookies. They are most often made in ginger, sugar, or chocolate varieties and are traditionally sold in tightly packed tins."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Moravian Cookie Became North Carolina's State Cookie"
    paragraphs:
      - "A proposal to adopt the Moravian cookie as North Carolina's official state cookie passed the state House in 2025. The cookie appears in compiled state food lists with a 2026 designation."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why North Carolina Chose the Moravian Cookie"
    paragraphs:
      - "Moravian settlers established the community of Salem, now part of Winston-Salem, in the 1700s and brought their thin spiced cookie recipes with them. Bakeries in Old Salem still make the cookies using traditional methods, giving North Carolina a documented, place-based connection to the cookie."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Moravian Cookie Comes From in North Carolina"
    paragraphs:
      - "Old Salem, the historic Moravian settlement in Winston-Salem, is the traditional home of the Moravian cookie, where bakeries still roll and bake them using recipes passed down from the original settlers."
    sites:
      - name: Old Salem
        city: Winston-Salem
