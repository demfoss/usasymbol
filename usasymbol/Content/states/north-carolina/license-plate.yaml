seo_title: "North Carolina License Plate Slogan | First in Flight"
seo_description: "First in Flight has been North Carolina's main license plate slogan since 1982, honoring the Wright brothers' Kitty Hawk flight."
hero_image: /images/license-plates/north-carolina/standard-plates-official.jpg
hero_image_alt: North Carolina standard license plate designs
hero_image_caption: 'North Carolina DMV lists three standard plate designs: First in Flight, First in Freedom, and the National/State Motto plate.'
intro_text: "**\"First in Flight\"** is North Carolina's best-known license plate slogan and has been the main standard slogan since 1982. It honors the Wright brothers' 1903 flights at Kitty Hawk. Current standard choices also include **\"First in Freedom\"** and the National/State Motto plate with **\"In God We Trust.\"** This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "North Carolina's main license plate slogan is \"First in Flight,\" introduced in 1982. Current standard designs also include \"First in Freedom,\" issued as an alternative standard plate from July 1, 2015, and the National/State Motto plate, issued from July 1, 2019. Earlier slogans include \"Drive Safely\" on some 1953-1954 plates and standard 1956-1963 plates, and \"First in Freedom\" on the 1975-1978 base."
