faq:
- question: What is North Carolina's license plate slogan?
  answer: North Carolina's main standard plate slogan is "First in Flight," introduced in 1982. Current standard designs also include "First in Freedom" and the National/State Motto plate.
- question: What does "First in Flight" mean on North Carolina plates?
  answer: It refers to the Wright brothers' first successful powered airplane flights at Kitty Hawk, North Carolina, on December 17, 1903.
- question: Is "First in Freedom" a current North Carolina plate?
  answer: Yes. "First in Freedom" is a current alternative standard plate design issued from July 1, 2015. It is separate from the earlier 1975-1978 First in Freedom base.
- question: Was the 1975 First in Freedom plate only a one-year issue?
  answer: No. The First in Freedom base began in 1975 and ran through 1978.
- question: When did North Carolina use "Drive Safely"?
  answer: '"Drive Safely" appeared on some 1953 and 1954 plates and was the regular passenger plate slogan from 1956 through 1963.'
- question: Is the In God We Trust plate a specialty plate?
  answer: North Carolina DMV lists the National/State Motto design among the three standard plate designs. It carries "IN GOD WE TRUST" and "To Be Rather Than to Seem."

