expert_quote:
  text: "North Carolina's choice to anchor its official colors to both the state flag and the American flag was a deliberate statement of dual identity — proud state sovereignty and deep national patriotism expressed in the same two colors."
  source: "NCpedia, State Library of North Carolina, State Symbols Documentation"

faq:
  - question: "What are the official colors of North Carolina?"
    answer: "The official state colors of North Carolina are Red and Blue, formally designated in 1945 under G.S. § 145-3 as the shades 'appearing in the North Carolina State flag and the American flag' — Old Glory Blue and Old Glory Red."
  - question: "What is the HEX code for North Carolina Blue?"
    answer: "The standard HEX code for North Carolina Blue (Old Glory Blue) is #002868, corresponding to Pantone PMS 2757 C. This is the same shade of blue as the canton of the United States flag."
  - question: "What is the HEX code for North Carolina Red?"
    answer: "The standard HEX code for North Carolina Red (Old Glory Red) is #BF0A30, corresponding to Pantone PMS 200 C. This is the same shade of red as the stripes of the United States flag."
  - question: "When were North Carolina's state colors officially adopted?"
    answer: "North Carolina's state colors were officially adopted in 1945 when the General Assembly passed Session Laws Chapter 878, ratified on March 19, 1945, now codified as G.S. § 145-3."
  - question: "Why does North Carolina use the same colors as the American flag?"
    answer: "The 1945 legislation explicitly selected red and blue to match both the North Carolina state flag and the American flag. Representative Billy Arthur, who introduced the bill, noted that these colors combined with white paper produce the three colors of both flags simultaneously, reflecting North Carolina's dual pride in state and national identity."

