title: "Official and Traditional Colors of North Carolina"
state: "North Carolina"
adopted_year: 1945

seo_title: "North Carolina State Colors: Official HEX Codes & Meaning"
seo_description: "North Carolina state colors are Red and Blue, officially designated in 1945. Full HEX, RGB, CMYK, and Pantone values with historical context for designers and researchers."

intro_text: "The official state colors of North Carolina are **Red** and **Blue**, formally designated by the North Carolina General Assembly in 1945 under Session Laws 1945, Chapter 878. Adopted to match the flag's red and blue horizontal bands flanking the blue hoist's gold star and Revolutionary War dates, these colors appear on [the North Carolina state flag](/states/north-carolina/flag/north-carolina-state-flag) and throughout official state branding. Use the color codes below for accurate North Carolina branding in any medium — HEX, RGB, CMYK, and Pantone values all included."

official_colors: "Red and Blue"
official_since: "1945 (N.C. General Statute § 145-3, Session Laws 1945, c. 878)"
primary_use: "State flag, official state documents, state government branding, ceremonial ribbons and insignia"
known_for: "The same shades as the American flag — Old Glory Blue and Old Glory Red — reflecting North Carolina's dual identity as both a proud state and a founding member of the Union; red and blue also match the North Carolina state flag's design unchanged since 1885"

