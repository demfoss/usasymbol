sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "North Carolina formally designated red and blue as its official state colors through the General Assembly of 1945, ratified on March 19, 1945, under Session Laws Chapter 878 and now codified as G.S. § 145-3. The legislation was introduced by Billy Arthur of Onslow County and passed with the explicit intent of selecting colors that matched both the North Carolina state flag and the American flag. The bill noted that when red and blue are combined with the white paper of official state documents, they produce the three colors of both flags simultaneously — a symbolically unified rationale for the selection that is visible on [the North Carolina flag page](/states/north-carolina/flag/north-carolina-state-flag)."
      - "Prior to the 1945 legislation, the colors of the University of North Carolina — blue and white — were generally accepted as the unofficial state colors, a practice that had been in place since at least the early 1940s. The 1945 act replaced this informal tradition with a formal statutory designation and shifted the identity away from any single institution's colors toward the patriotic palette shared by both the state and national flags, reinforcing [the Tar Heel State identity](/states/north-carolina/nickname/the-tar-heel-state)."
    subsections:
      - subtitle: "North Carolina General Statute § 145-3"
        text: "G.S. § 145-3 reads: 'The colors red and blue, of the shades as adopted and appearing in the North Carolina State flag and the American flag, shall be the official State colors.' The statute does not specify Cable or Pantone values, but the reference to the state and American flags anchors the colors to the well-established standards of Old Glory Blue (Cable No. 70075) and Old Glory Red (Cable No. 70180), the color standards used for the United States flag. These correspond to Pantone PMS 2757 C for blue and PMS 200 C for red in contemporary specifications and align with [North Carolina's state motto context](/states/north-carolina/motto/esse-quam-videri)."
      - subtitle: "The North Carolina State Flag and the 1885 Design"
        text: "The current North Carolina state flag was adopted in 1885 and features a vertical blue canton on the left, containing a white star flanked by the letters 'N' and 'C' and two scrolls with the dates 'May 20th, 1775' (the Mecklenburg Declaration of Independence) and 'April 12th, 1776' (the Halifax Resolves). Two horizontal stripes — red above and white below — occupy the right portion of the flag. The 1885 design reshaped the earlier Civil War-era flag to its current 2:3 proportions and established the red-and-blue combination that would become the official state colors 60 years later."
  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "North Carolina's red and blue carry both heraldic and patriotic significance rooted in the traditions of the American founding. Blue represents vigilance, perseverance, and justice — qualities associated with the canton of the United States flag and with North Carolina's distinguished record as a defender of colonial liberties. Red represents valor and hardiness, reflecting the military courage of North Carolina's Continental Army regiments and the state's proud martial history from the Revolutionary War through subsequent national conflicts."
    subsections:
      - subtitle: "Blue: Vigilance and the Revolutionary Legacy"
        text: "North Carolina played a pivotal role in the American independence movement. The Mecklenburg Declaration of Independence of May 20, 1775, is claimed by North Carolina as one of the first formal declarations of independence from British rule in the colonies, predating the national Declaration of Independence by over a year. The Halifax Resolves of April 12, 1776 — the first official action by a colonial government calling for independence — were passed by the North Carolina Provincial Congress. Blue represents the vigilance and foresight of North Carolina's revolutionary leadership, enshrined in both the state flag's canton and the official state color."
      - subtitle: "Red: Valor in the Continental and Union Armies"
        text: "North Carolina raised significant military forces during the Revolutionary War, contributing regiments to the Continental Army that fought at battles including Guilford Court House (March 15, 1781), where the North Carolina militia played a crucial role in inflicting unsustainable losses on General Cornwallis's army — losses that led directly to the Yorktown campaign and British defeat. The red of North Carolina's official colors honors this tradition of martial valor, connecting the state to the red stripes of the American flag that represent the same qualities of courage and sacrifice in all thirteen original states."
  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Red and blue dominate the North Carolina state flag in its primary visual bands — the blue canton and the red upper horizontal stripe define the flag's immediate visual impression. The North Carolina state seal, while incorporating a broader range of colors in its detailed imagery, uses blue and red as the primary colors of the ribbon and border elements. G.S. § 145-3 specifically authorizes the use of state colors on ribbons attached to state documents bearing the Great Seal and seals of state departments, noting that such use is 'permissive and discretionary but not mandatory.' Red and blue appear in North Carolina state government communications, the insignia of the North Carolina National Guard, and the official branding of the North Carolina Department of State Treasurer and other state agencies, while broader growth patterns are tracked in [U.S. states by population](/rankings/demographics/states-by-population)."

