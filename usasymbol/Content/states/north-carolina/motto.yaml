      - "Clark also compiled the sixteen-volume State Records of North Carolina (1886–1897)."

faq:
  - question: "What is North Carolina's state motto?"
    answer: "North Carolina's state motto is 'Esse Quam Videri,' a Latin phrase meaning 'To Be Rather Than to Seem.' It was adopted on February 21, 1893, making North Carolina the last of the original 13 states to formally adopt a motto — 104 years after statehood."

  - question: "Where does North Carolina's motto come from?"
    answer: "From Cicero's De Amicitia (On Friendship), written in 44 BC. The relevant line: 'Not nearly so many people want actually to be endowed with virtue as want to seem to be endowed with it.' The same idea appeared in Aeschylus's Seven Against Thebes (467 BC), 400 years before Cicero."

  - question: "Who chose North Carolina's motto?"
    answer: "Judge Walter Clark, a North Carolina Supreme Court justice who later served as Chief Justice (1902–1924). Clark drafted the bill, Senator Jacob Battle introduced it, and Governor Elias Carr ratified it. Clark had fought in the Confederate Army at age 14 and spent his career as a judge and historian."

  - question: "When did North Carolina adopt its motto?"
    answer: "February 21, 1893 — 104 years after North Carolina ratified the U.S. Constitution on November 21, 1789. This made North Carolina the last of the original 13 colonies to adopt a state motto."

  - question: "What does 'Esse Quam Videri' mean?"
    answer: "'To Be Rather Than to Seem' — the philosophical contrast between genuine character and performed virtue. 'Esse' is 'to be,' 'quam' is 'than,' and 'videri' is 'to seem.' Cicero used the phrase to criticize those who perform virtue for social advantage rather than actually possessing it."

  - question: "Where does North Carolina's motto appear?"
    answer: "On the state coat of arms (curving along the bottom edge below the shield), on the Great Seal (used on official documents and government letterhead), and on the state flag (which features the coat of arms on a blue field with red stripe). Many North Carolina schools and organizations have also adopted 'Esse Quam Videri' as their institutional motto."

