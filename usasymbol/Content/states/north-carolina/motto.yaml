title: "Esse Quam Videri"
language: "Latin"
english_translation: "To Be Rather Than to Seem"
adopted_year: 1893

author: "USA Symbol Team"
date_published: "2025-12-04"
date_modified: "2026-03-27"
seo_title: "North Carolina State Motto: Esse Quam Videri"
seo_description: "North Carolina was the last of the original 13 colonies to adopt a state motto — waiting 104 years after statehood. The phrase 'Esse Quam Videri' comes from Cicero's essay on friendship (44 BC), but the same idea appeared in Aeschylus 400 years earlier. The man who chose it, Judge Walter Clark, had fought in the Confederate Army at age 14."

intro_text: "North Carolina's state motto is <strong>Esse Quam Videri</strong> — Latin for <em>To Be Rather Than to Seem</em>. North Carolina was the last of the original 13 states to adopt a motto, waiting 104 years after statehood. The phrase was selected by Judge Walter Clark, who drafted the bill in 1893. Clark was 46 years old when he chose it; he had joined the Confederate Army at 14 and fought at Antietam. The phrase comes from Cicero's <em>De Amicitia</em> (On Friendship, 44 BC), though the same idea appeared in Aeschylus's play <em>Seven Against Thebes</em> more than 400 years earlier."

sections:
  - id: "last-original-colony-to-adopt"
    icon: "fa-solid fa-clock"
    title: "Last of the Original 13 States to Get a Motto — 104 Years After Statehood"
    paragraphs:
      - "North Carolina became the 12th state when it ratified the U.S. Constitution on November 21, 1789. For the next 104 years, it had no official state motto. Virginia chose 'Sic Semper Tyrannis' in 1776. Massachusetts adopted its motto in 1775. Delaware had one in 1777. North Carolina waited until 1893 — the last of the original thirteen colonies to formally adopt a motto."
      - "The delay wasn't the result of indifference. North Carolina had a state seal with design elements but no motto inscribed on it. Judge Walter Clark, serving on the North Carolina Supreme Court, decided to address the gap. He selected a phrase from Cicero, drafted a bill, and had Senator Jacob Battle of Nash County introduce it to the General Assembly in 1893. The legislature debated with no recorded opposition. Governor Elias Carr ratified it on February 21, 1893."
      - "Clark later became Chief Justice of the North Carolina Supreme Court, serving from 1902 to 1924. He compiled the sixteen-volume <em>State Records of North Carolina</em> between 1886 and 1897. A man with deep investment in North Carolina's history chose a motto about authenticity — substance over show."

  - id: "cicero-and-aeschylus"
    icon: "fa-solid fa-scroll"
    title: "Cicero Wrote It — But Aeschylus Had the Same Idea 400 Years Earlier"
    paragraphs:
      - "Marcus Tullius Cicero wrote <em>De Amicitia</em> (On Friendship) in 44 BC, the year of Julius Caesar's assassination. The essay explores the nature of true friendship and genuine virtue. The relevant line reads: 'Virtute enim ipsa non tam multi praediti esse quam videri volunt' — 'Not nearly so many people want actually to be endowed with virtue as want to seem to be endowed with it.' North Carolina adopted the last three words of the core contrast: 'esse quam videri' — to be rather than to seem."
      - "But Aeschylus had expressed the same idea in <em>Seven Against Thebes</em> around 467 BC — more than 400 years before Cicero. Aeschylus describes a character who wishes 'to be just, not to seem just.' Sallust later used similar language to describe Cato the Younger. The idea of authentic character versus performed virtue ran through ancient Mediterranean philosophy from the Greeks through the Romans."
      - "The grammar is straightforward: 'esse' is the Latin infinitive for 'to be,' 'quam' is the conjunction 'than' (used in comparisons), and 'videri' is the passive infinitive of 'video' meaning 'to seem' or 'to appear.' The comparison creates the philosophical contrast between genuine reality and performed appearance."

  - id: "walter-clark-confederate-to-chief-justice"
    icon: "fa-solid fa-user"
    title: "The Man Who Chose the Motto: Confederate at 14, Chief Justice at 56"
    paragraphs:
      - "Walter Clark was born on August 19, 1846, in Halifax County, North Carolina. He joined the Confederate Army at age 14, serving with the 35th North Carolina Regiment. He fought at Antietam and Fredericksburg — two of the bloodiest battles of the Civil War — as a teenager. He graduated from the University of North Carolina in 1864 while the war was still ongoing."
      - "After the war, Clark studied law and built a legal career. He was appointed to the superior court in 1885 and to the North Carolina Supreme Court in 1889. When he selected 'Esse Quam Videri' in 1893, he had spent his adult life in a legal culture that demanded the appearance of justice alongside its substance. A motto about being rather than seeming reflected a jurist's daily confrontation with that gap."
      - "Clark compiled the sixteen-volume <em>State Records of North Carolina</em> as a parallel pursuit — a meticulous effort to preserve what actually happened rather than what was convenient to remember. His selection of 'esse quam videri' was consistent with a life's work oriented toward authentic record over comfortable appearance."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "North Carolina State Motto Facts"
    style: "gradient"
    facts:
      - "North Carolina was the last of the original 13 states to adopt a motto — 104 years after statehood."
      - "The phrase comes from Cicero's De Amicitia (44 BC), but Aeschylus expressed the same idea in Seven Against Thebes (467 BC), 400 years earlier."
      - "Judge Walter Clark, who selected the motto, had served in the Confederate Army at age 14."
      - "Senator Jacob Battle of Nash County introduced the bill; Governor Carr ratified it February 21, 1893."
