seo_title: "North Carolina State Nickname | The Tar Heel State"
seo_description: "North Carolina is known as The Tar Heel State, its official state nickname. Learn what Tar Heel State means, why North Carolina uses it, and what other nicknames the state has had."

intro_text: "North Carolina is known as <i>the Tar Heel State</i>, a nickname that gained prominence during the Civil War, when soldiers embraced the term with pride. For centuries, the state’s extensive pine forests supported a major naval stores industry that produced tar, pitch, and turpentine. Today, the Tar Heel State remains North Carolina’s most widely recognized and established state nickname through long-standing public and governmental use and close alignment with [North Carolina's state motto](/states/north-carolina/motto/esse-quam-videri)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Tar Heel State'"
    paragraphs:
      - "North Carolina led the world in naval stores production from approximately 1720 to 1870, extracting tar, pitch, rosin, and turpentine from vast pine forests. Workers collected sticky sap from pine trees and burned pine boughs to produce tar and pitch used for waterproofing ships. During hot summer months, barefoot laborers often stepped in tar, which led people to call them tar heels. The term originally described difficult manual labor and carried a negative meaning."
      - "The Civil War played a major role in spreading the Tar Heel nickname. In a diary entry dated February 6, 1863, Lieutenant William B. A. Lowrance of the 46th Regiment North Carolina Troops noted the connection between soldiers and the piney woods region. Troops from other states initially used Tar Heel as an insult toward North Carolina soldiers. North Carolinians quickly responded with humor and pride, turning the label into a positive identity. Virginia's soldiers faced similar identity battles throughout the same conflict — the [Old Dominion history](/states/virginia/nickname/the-old-dominion) shows how the Civil War cemented Virginia's most enduring nickname just as it did North Carolina's, with forest heritage reflected in [North Carolina's state tree](/states/north-carolina/tree/longleaf-pine)."
      - "After the Civil War, Tar Heel became widely accepted across the state. General Robert E. Lee reportedly praised North Carolina troops after their actions at the Battle of Reams Station on August 25, 1864. One of the earliest postwar printed uses appeared in 1866 sheet music titled <i>Wearin' of the Grey</i>, written by Tar Heel. The town of Tar Heel in Bladen County was settled in 1874. The University of North Carolina adopted Tar Heels as its athletic nickname in the late 1800s as organized sports developed. The Tar Heel story ranks among the more distinctive entries in the [discover every state's nickname](/symbols/nicknames) collection, where few labels transformed from insult to badge of honor as completely as this one did."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "The Old North State"
        text: "This was North Carolina's earliest nickname and remains the title of the state song and state toast. The name dates to 1710, when the Carolina colony divided into North Carolina and South Carolina. The northern settlement became North Carolina, while the southern portion formed South Carolina. As the older of the two colonies, North Carolina became known as the Old North State. The nickname appears in documents and writings throughout the 1700s and 1800s before Tar Heel became more common after the Civil War. South Carolina followed a very different path after the split — the [history of the Palmetto State](/states/south-carolina/nickname/the-palmetto-state) traces how the colony's southern portion built its own distinctive identity around the tree that famously helped defend Charleston Harbor."
      - subtitle: "The Turpentine State"
        text: "North Carolina earned this nickname because turpentine production from pine trees formed a major industry alongside tar and pitch manufacturing. Longleaf pine forests supplied raw materials for naval stores that supported shipping worldwide. Workers distilled turpentine through a labor-intensive process. Writers sometimes referred to North Carolina residents as Tarboilers because of this industry. The Turpentine State and similar names appeared in 19th-century publications but declined after naval stores production fell in the late 1800s, while long-term growth shifts are visible in [U.S. states by population](/rankings/demographics/states-by-population)."
      - subtitle: "Land of the Sky"
        text: "Western North Carolina's mountain region inspired this nickname because of its high elevations and sweeping views. The Blue Ridge and Great Smoky Mountains include peaks rising above 6,000 feet. Tourism promoters used Land of the Sky in the late 1800s and early 1900s to attract visitors to mountain resorts. The phrase remains closely associated with the Asheville area and surrounding mountains."
      - subtitle: "The Rip Van Winkle State"
        text: "This critical nickname appeared in the early 1800s when North Carolina lagged behind neighboring states in transportation and industrial development. The name compared the state to Washington Irving's fictional character Rip Van Winkle, who slept through decades of change. Poor roads, limited railroads, and slow industrial growth contributed to the image. The nickname faded as North Carolina modernized during the late 19th and early 20th centuries."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "The North Carolina nickname and motto both emphasize authenticity and character: Tar Heel reflects pride in hard work, while Esse quam videri means To be rather than to seem."
      - "Jurist and historian Walter Clark selected Esse quam videri from Cicero's writings and helped secure its adoption as the state motto in 1893."
      - "North Carolina was the last of the original thirteen colonies to adopt an official state motto."
      - "The University of North Carolina adopted Tar Heels as its athletic nickname in the late 1800s, and the name is used by all university sports teams today."
      - "North Carolina became the 12th state when it ratified the U.S. Constitution on November 21, 1789."
      - "Tar Heel is traditionally written as two words rather than one."

faq:
  - question: "What is North Carolina nickname?"
    answer: "North Carolina nickname is the Tar Heel State. The name comes from the state's naval stores industry and from Civil War soldiers who proudly adopted the term."

  - question: "What is the North Carolina nickname Tar Heel State?"
    answer: "The Tar Heel State nickname refers to North Carolina workers who produced tar from pine trees and soldiers who turned an insult into a symbol of pride."

  - question: "Why is North Carolina called the Tar Heel State?"
    answer: "North Carolina is called the Tar Heel State because of its long history producing tar and turpentine and the way Civil War soldiers embraced the nickname."

  - question: "What is the North Carolina nickname meaning?"
    answer: "The nickname Tar Heel reflects North Carolina's naval stores industry and the courage of its soldiers during the Civil War."

  - question: "When did North Carolina get the Tar Heel nickname?"
    answer: "North Carolina began using the Tar Heel nickname during the Civil War in the early 1860s, with documented references appearing in 1863."

  - question: "What is the North Carolina nickname and motto?"
    answer: "The North Carolina nickname is the Tar Heel State, and the state motto is Esse quam videri, meaning To be rather than to seem."

  - question: "Is Tar Heel State the official nickname?"
    answer: "Tar Heel State is not an official nickname adopted by law, but it is widely recognized and used throughout North Carolina."

