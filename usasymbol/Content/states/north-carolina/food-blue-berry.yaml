sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is North Carolina's State Blue Berry?"
    paragraphs:
      - "The blueberry is North Carolina's official state blue berry, designated by the North Carolina General Assembly in 2001. Blueberries are grown commercially across Bladen, Pender, and Duplin counties in the southeastern part of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Blueberry"
    paragraphs:
      - "Blueberries are small, round, deep blue berries that grow in clusters on bushes. North Carolina's coastal plain climate favors early-ripening highbush varieties, and the state's blueberry harvest typically begins earlier than in most other blueberry-growing states."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Blueberry Became North Carolina's State Blue Berry"
    paragraphs:
      - "The North Carolina General Assembly designated the blueberry the official state blue berry in 2001, alongside several other food symbols adopted the same year."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why North Carolina Chose the Blueberry"
    paragraphs:
      - "North Carolina's southeastern coastal plain, especially Bladen and Pender counties, produces a large share of the blueberries grown on the East Coast, making the crop an important part of the region's farm economy."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Blueberry Comes From in North Carolina"
    paragraphs:
      - "Bladen County, in southeastern North Carolina, is one of the state's top blueberry-producing counties and hosts the North Carolina Blueberry Festival each summer."
    sites:
      - name: Bladen County
        city: Elizabethtown
        lat: 34.63
        lng: -78.61
        note: "Leading North Carolina blueberry county"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Blueberry Facts"
    facts:
      - "Adopted as North Carolina's state blue berry in 2001."
      - "Bladen and Pender counties are top blueberry-producing areas."
