faq:
- question: What is the official state drink of North Carolina?
  answer: Milk is the official state beverage of North Carolina. It was designated on June 12, 1987 by the North Carolina General Assembly at the request of the North Carolina Milk Commission.
- question: Why did North Carolina choose milk as its state drink?
  answer: The designation was driven by the North Carolina Milk Commission, which argued that dairy was a foundational part of the state's agricultural economy. In 1987, North Carolina produced approximately 179 million gallons of milk annually. The bill passed with overwhelming bipartisan support — 93–3 in the House and 39–3 in the Senate.
- question: Is Pepsi the state drink of North Carolina?
  answer: No. Pepsi-Cola was invented in New Bern, North Carolina in 1893, but it has never been the state's official beverage. Milk was designated the official state drink in 1987. Pepsi, Cheerwine, and sweet tea are all culturally associated with North Carolina but hold no official state symbol status.
- question: Is Cheerwine a North Carolina drink?
  answer: Yes — Cheerwine was created in Salisbury, North Carolina in 1917 and has remained a regionally beloved soft drink with strong Carolina identity. But it has never been an official state symbol. North Carolina's official state beverage is milk.
- question: Is sweet tea the state drink of North Carolina?
  answer: No. Sweet tea is strongly associated with Southern culture broadly and with North Carolina specifically, but it has never been designated as an official state symbol. North Carolina's only official state beverage is milk.
- question: When was milk adopted as North Carolina's state beverage?
  answer: June 12, 1987. The designation was signed into law on that date following passage by both chambers of the North Carolina General Assembly.
- question: How much milk does North Carolina produce?
  answer: At the time of the 1987 designation, North Carolina produced approximately 179 million gallons of milk annually. As of 2023, production stands at over 100 million gallons per year — a significant decline from the peak but still a meaningful part of the state's agricultural output.
