seo_title: 'North Carolina State Drink: Why Milk Beat Pepsi and Sweet Tea'
seo_description: Milk is the official state beverage of North Carolina, adopted June 12, 1987. Learn why the legislature chose dairy over Pepsi (invented in NC), Cheerwine, and sweet tea — and what that decision says about the state's agricultural identity.
intro_text: '**Milk is the official state beverage of North Carolina**, designated on **June 12, 1987** at the request of the North Carolina Milk Commission. In a state that gave the world Pepsi-Cola and Cheerwine, the legislature looked past its most famous commercial drinks and chose the one that sustained the state''s farm economy — passing the designation by a vote that was never close.'
