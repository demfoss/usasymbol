sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is North Carolina's State Vegetable?"
    paragraphs:
      - "The sweet potato is North Carolina's official state vegetable, designated by the North Carolina General Assembly in 1995. North Carolina grows more sweet potatoes than any other state in the country."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Sweet Potato"
    paragraphs:
      - "Sweet potatoes are starchy, orange-fleshed root vegetables grown in sandy soil through the summer and harvested in the fall. In North Carolina they are grown on a large commercial scale and shipped nationwide, as well as used in home cooking for pies, casseroles, and side dishes."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Sweet Potato Became North Carolina's State Vegetable"
    paragraphs:
      - "The North Carolina General Assembly designated the sweet potato the official state vegetable in 1995, recognizing a crop that had already made the state the country's top sweet potato producer."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why North Carolina Chose the Sweet Potato"
    paragraphs:
      - "North Carolina chose the sweet potato because the state consistently leads the nation in sweet potato production, with farms concentrated in the eastern part of the state around towns like Wilson and Nash County."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Sweet Potato Comes From in North Carolina"
    paragraphs:
      - "Most of North Carolina's sweet potatoes are grown in the eastern part of the state, particularly around Nash, Wilson, and Johnston counties, which have sandy, well-drained soil suited to the crop."
    sites:
      - name: Eastern North Carolina Sweet Potato Belt
