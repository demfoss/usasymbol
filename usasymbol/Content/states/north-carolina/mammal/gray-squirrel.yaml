faq:
  - question: "What is North Carolina's state animal?"
    answer: "North Carolina's state animal is the gray squirrel (Sciurus carolinensis), designated as the official state mammal on May 20, 1969. This made North Carolina the first state in the United States to adopt an official state mammal."
  
  - question: "When was the gray squirrel designated as North Carolina's state mammal?"
    answer: "The gray squirrel became North Carolina's state mammal in 1969. This designation established a precedent that dozens of other states followed by adopting their own state mammals during the 1970s and beyond."
  
  - question: "Why did North Carolina choose the gray squirrel as its state mammal?"
    answer: "North Carolina chose the gray squirrel because it embodied qualities valued by North Carolinians: adaptability, resourcefulness, industriousness, and persistence. The species lives in all 100 North Carolina counties and thrives in diverse environments from coastal forests to mountain hardwoods. The scientific name carolinensis honors the Carolina colony, creating a special connection between the animal and the state's scientific heritage."
  
  - question: "Where can I see gray squirrels in North Carolina?"
    answer: "Gray squirrels appear throughout North Carolina in any location with mature trees. Great Smoky Mountains National Park, Duke Forest, Umstead State Park, and Raven Rock State Park offer excellent viewing opportunities. Urban parks in cities like Raleigh, Charlotte, and Durham have large, habituated populations. Brevard hosts a special white squirrel population celebrated with an annual festival."
  
  - question: "Why is the gray squirrel's scientific name Sciurus carolinensis?"
    answer: "Swedish naturalist Carl Linnaeus assigned the name Sciurus carolinensis in 1758 based on specimens and descriptions from the Carolina colony. English naturalist Mark Catesby documented gray squirrels in Carolina from 1722 to 1726, providing detailed observations that influenced Linnaeus's classification. The epithet carolinensis permanently links this species to North Carolina and South Carolina."
  
  - question: "Was North Carolina the first state to have a state mammal?"
    answer: "Yes, North Carolina became the first state in the United States to designate an official state mammal when it adopted the gray squirrel in 1969. This pioneering action established state mammals as a recognized category of official symbols, inspiring numerous other states to follow North Carolina's example during the 1970s and subsequent decades."
  
  - question: "Are gray squirrels endangered or threatened in North Carolina?"
    answer: "No, gray squirrels maintain stable, abundant populations throughout North Carolina with no conservation concerns. The species ranks among the most numerous mammals in the state, appearing in all 100 counties from sea level to elevations exceeding 6,000 feet. North Carolina manages gray squirrels as a small game species with regulated hunting seasons."
  
  - question: "What do gray squirrels eat in North Carolina?"
    answer: "Gray squirrels in North Carolina primarily eat acorns from various oak species, hickory nuts, walnuts, and beechnuts. They supplement this diet with tree buds, flowers, fungi, insects, and occasionally bird eggs. Urban squirrels exploit human-provided food sources including bird feeders and ornamental plantings. Squirrels cache thousands of nuts each autumn by burying them individually for winter consumption."
  
  - question: "How does the gray squirrel connect to other North Carolina state symbols?"
    answer: "The gray squirrel shares habitat with North Carolina's state tree (longleaf pine) and state flower (flowering dogwood). The scientific name carolinensis links the squirrel to North Carolina's role in American natural history. Early naturalists like Mark Catesby documented Carolina wildlife during the colonial period, establishing scientific connections that influenced Carl Linnaeus's classification system. These historical and ecological connections make the gray squirrel authentically representative of North Carolina's natural heritage."

