title: "Gray Squirrel"
scientific_name: "Sciurus carolinensis"
adopted_year: 1969

seo_title: "North Carolina State Mammal - Gray Squirrel | Official Animal"
seo_description: "The gray squirrel is North Carolina's state mammal since 1969, the first state mammal designation in US history. It symbolizes adaptability and resourcefulness."

intro_text: "North Carolina's state mammal is the gray squirrel (Sciurus carolinensis), designated in 1969 as the first state mammal in United States history. The legislature chose this adaptable species to represent North Carolina's pioneering conservation spirit and the resourcefulness of its people. The squirrel's scientific name honors the Carolina colony where naturalists first documented the species in the early 1700s, and the designation is part of the broader [list of U.S. state mammals](/symbols/mammals)."

common_name: "Gray Squirrel"
official_since: "1969"
status: "Abundant; thriving population throughout state; one of North America's most successful mammals"
habitat_in_state: "All 100 counties; hardwood forests, mixed woodlands, urban parks, residential areas"
known_for: "Being the first state mammal designation in US history; representing adaptability and North Carolina's conservation leadership"

size: "9 to 10 inches body length; 7.5 to 10 inches tail length"
weight: "14 to 21 ounces (approximately 1 to 1.3 pounds)"
coloration: "Gray fur on back and sides; white to cream underside; bushy gray tail with white-tipped guard hairs"
distinctive_traits: "Large bushy tail used for balance and communication; sharp curved claws for tree climbing; strong hind legs for jumping up to 20 feet between trees"

habitat: "Hardwood and mixed forests rich in oak, hickory, beech, and walnut trees; readily adapts to urban and suburban environments"
range_in_state: "Present in all 100 North Carolina counties from coastal plains through Piedmont to mountain regions; most abundant in oak-hickory forests"
conservation_status: "Stable; among the most abundant mammals in North Carolina; population estimated in millions statewide"
where_to_find: "Great Smoky Mountains National Park, Duke Forest, Umstead State Park, Raven Rock State Park, virtually any wooded area or city park statewide"
symbol_connections: "Scientific name carolinensis honors North Carolina; pine tree state symbol shares habitat with squirrel in mixed forests; dogwood state tree provides cover and nesting sites"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The North Carolina General Assembly designated the gray squirrel as the official state mammal on May 20, 1969. This legislative action made North Carolina the first state in the nation to adopt an official state mammal, establishing a precedent that dozens of other states would follow and reinforcing [the Tar Heel State identity](/states/north-carolina/nickname/the-tar-heel-state)."
      - "The designation came during a period when North Carolina lawmakers sought to celebrate the state's natural heritage through official symbols. The state had adopted numerous symbols during the 1960s, including the cardinal as state bird in 1943 and the dogwood as state flower in 1941; see [North Carolina's state bird page](/states/north-carolina/bird/northern-cardinal)."
    
    subsections:
      - subtitle: "How It Became Symbol"
        text: "The gray squirrel designation emerged from growing public interest in wildlife conservation and state identity during the late 1960s. Citizens and conservation groups advocated for recognizing an animal that represented North Carolina's character. The General Assembly chose the gray squirrel without significant opposition because the species lived in every county and required no special protection or management. The designation demonstrated North Carolina's willingness to honor common native wildlife rather than rare or exotic species."
      
      - subtitle: "Why Chosen"
        text: "Legislators selected the gray squirrel because it embodied qualities North Carolinians valued: adaptability, resourcefulness, industriousness, and persistence. The squirrel thrived in diverse environments from coastal forests to mountain hardwoods. North Carolina could claim special connection through the scientific name Sciurus carolinensis, assigned by Swedish naturalist Carl Linnaeus in 1758 based on specimens from the Carolina colony. The designation honored both the animal and North Carolina's role in American natural history, as early naturalists like Mark Catesby documented Carolina wildlife during the colonial period."

  - id: "state-symbolism"
    icon: "fa-tree"
    title: "What the Gray Squirrel Represents"
    style: "highlight"
    paragraphs:
      - "The gray squirrel symbolizes North Carolina's adaptability and resourcefulness in changing times. Just as the squirrel thrives in ancient forests and modern suburbs alike, North Carolina built prosperity through adapting traditional strengths to new opportunities, values that align with [North Carolina's motto](/states/north-carolina/motto/esse-quam-videri)."
      - "Early Carolina colonists respected gray squirrels for their industriousness and preparation habits. Squirrels gathering and storing nuts for winter became a model for prudent resource management that colonists applied to agriculture and commerce."
      - "The designation in 1969 represented North Carolina's conservation leadership. Becoming the first state to adopt an official mammal sent a message that wildlife deserved formal recognition alongside political and cultural symbols."
    
    subsections:
      - subtitle: "Pioneer in Wildlife Recognition"
        text: "North Carolina's 1969 designation established state mammals as a category of official symbols. Within five years, more than a dozen states followed North Carolina's example by adopting their own state mammals. This leadership reflected North Carolina's broader approach to conservation during the 1960s and 1970s. The state expanded wildlife management programs, established new protected areas, and promoted outdoor education. By honoring a common species rather than an endangered one, North Carolina emphasized that all native wildlife merited appreciation regardless of rarity or economic value."
      
      - subtitle: "The Carolina Connection"
        text: "The gray squirrel's scientific name forever links the species to North Carolina and South Carolina. When Swedish botanist Carl Linnaeus established the modern system of biological nomenclature in the mid-1700s, he used specimens and descriptions from the Carolina colony to name hundreds of species. The epithet carolinensis appears in dozens of scientific names for plants and animals first documented in the Carolinas. Mark Catesby, working in Carolina from 1722 to 1726, produced detailed illustrations and descriptions of gray squirrels that influenced Linnaeus. This historical connection makes the gray squirrel authentically Carolinian in a way few state symbols can claim."
      
      - subtitle: "Adaptability Across Landscapes"
        text: "Gray squirrels demonstrate remarkable ability to thrive across North Carolina's diverse geography. The same species lives in maritime forests near Cape Hatteras, mixed hardwood forests in the Piedmont, and high-elevation cove forests in the Great Smoky Mountains. Population densities remain high in urban Raleigh, Charlotte, and Durham, where squirrels treat power lines like forest branches and navigate traffic with the same agility they use avoiding hawks. This adaptability mirrors North Carolina's economic transformation from tobacco and textiles to technology and research, maintaining prosperity through changing circumstances."
      
      - subtitle: "Agricultural Impact and Human Interaction"
        text: "Throughout North Carolina history, gray squirrels occupied an ambiguous position between wildlife and agricultural pest. Colonial farmers occasionally held organized squirrel hunts to protect corn crops, yet many families relied on squirrel meat as a protein source. By the late 1800s, North Carolina established hunting regulations that protected squirrels during breeding seasons while permitting harvest at other times. This balanced approach recognized the squirrel's ecological value while acknowledging human interests. Modern North Carolina maintains hunting seasons that allow recreational harvest without threatening populations—a management model that respects both wildlife and human traditions."
      
      - subtitle: "Symbol of Forest Health"
        text: "The gray squirrel's abundance indicates healthy hardwood forests throughout North Carolina. Squirrels depend on oak and hickory mast production, burying thousands of nuts each autumn as winter food stores. Their imperfect memory means many buried nuts sprout into new trees, making squirrels essential forest regenerators. When Mark Catesby explored Carolina forests in the 1720s, he noted that squirrels existed in vast numbers, moving through continuous tree canopy for miles. Modern forest fragmentation has reduced connectivity, yet gray squirrels persist wherever mature hardwoods produce reliable nut crops, serving as indicators of forest ecosystem quality."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify Gray Squirrels"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Gray squirrels measure 18 to 20 inches from nose to tail tip, with the tail accounting for nearly half that length. Adult weights range from 14 to 21 ounces, though well-fed urban squirrels occasionally exceed this range."
        list_items:
          - "**Size**: Body length 9-10 inches; tail length 7.5-10 inches; total length 16.5-20 inches"
          - "**Weight**: 14-21 ounces (0.9-1.3 pounds); urban populations sometimes heavier"
          - "**Appearance**: Gray fur on back and sides; white to cream underside; bushy tail with white-tipped guard hairs; small rounded ears without tufts"
          - "**Features**: Large dark eyes provide excellent vision; sharp curved claws on all four feet; strong hind legs longer than front legs for jumping and climbing"
      
      - subtitle: "Behavior and Habits"
        text: "Gray squirrels display highly active behavior during morning and late afternoon hours, spending midday resting in tree cavities or leaf nests called dreys. They communicate through tail movements, vocalizations including chucks and barks, and scent marking. Squirrels exhibit remarkable memory for cache locations, recovering buried nuts months after hiding them. Breeding occurs twice annually in North Carolina, with litters born in late winter and mid-summer."
      
      - subtitle: "Color Variations"
        text: "While gray predominates, North Carolina's gray squirrel population includes color variations from nearly black to pale blonde. Melanistic (black) individuals appear throughout the state, sometimes comprising 10 to 15 percent of local populations in certain areas. These black squirrels carry the same genetic traits as gray individuals and belong to the same species. Albino and leucistic (white) squirrels occur rarely, with a famous white squirrel population established in Brevard, North Carolina, where the town celebrates them with annual festivals."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "Gray Squirrels in North Carolina"
    style: "default"
    paragraphs:
      - "Gray squirrels inhabit all 100 North Carolina counties from coastal maritime forests to mountain cove hardwoods at elevations exceeding 6,000 feet. Population densities reach highest levels in oak-hickory forests of the Piedmont and mountain regions."
      - "Historical records suggest gray squirrel populations remained relatively stable since colonial times, unlike many wildlife species that declined during settlement and industrialization. Squirrels adapted to landscape changes including forest clearing, agricultural expansion, and urbanization, while statewide growth trends are tracked in [U.S. states by population](/rankings/demographics/states-by-population)."
    
    facts:
      - "**Geographic Range**: Present in all 100 counties; most abundant in hardwood forests; thriving urban populations in all major cities"
      - "**Population**: Estimated several million individuals statewide; among North Carolina's most numerous mammals"
      - "**Habitat Preference**: Oak-hickory forests, beech-maple stands, pine-hardwood mixtures, urban parks, residential areas with mature trees"
      - "**Elevation Range**: Sea level coastal forests to 6,600 feet in Great Smoky Mountains; adaptable to all elevations within state"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Gray Squirrels"
    style: "default"
    paragraphs:
      - "Gray squirrels appear so commonly throughout North Carolina that observing them requires minimal effort. Any location with mature trees typically supports resident squirrel populations."
    
    list_items:
      - "**Great Smoky Mountains National Park**: Abundant in hardwood cove forests; frequently seen at Cades Cove, along nature trails, and near picnic areas throughout park"
      - "**Duke Forest (Durham and Orange Counties)**: Well-studied population provides excellent viewing in research forests; multiple trails offer close observation opportunities"
      - "**Umstead State Park (Wake County)**: Large populations inhabit park's 5,599 acres of mixed pine-hardwood forest near Raleigh-Durham; visible along all trail systems"
      - "**Raven Rock State Park (Harnett County)**: Gray squirrels common in mature hardwoods along Cape Fear River; observation opportunities on Fish Traps and Campbell Creek Loop trails"
      - "**Urban Parks**: City parks in Charlotte, Raleigh, Durham, Greensboro, Winston-Salem, and Asheville provide reliable viewing locations with habituated, approachable squirrels"
      - "**Brevard**: Special population includes white squirrels descended from animals introduced in the 1950s; town celebrates them with annual White Squirrel Festival in May"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Population Status and Management"
    style: "default"
    paragraphs:
      - "Gray squirrels maintain stable, abundant populations throughout North Carolina with no conservation concerns. The species ranks among the most successful mammals in the state."
      - "North Carolina manages gray squirrels as a small game species with regulated hunting seasons. Annual harvest numbers in the tens of thousands do not significantly impact overall population levels."
    
    subsections:
      - subtitle: "Management in North Carolina"
        text: "The North Carolina Wildlife Resources Commission oversees gray squirrel populations through hunting season regulations and habitat conservation. The state maintains liberal bag limits and long hunting seasons reflecting the species' abundance and reproductive capacity. Squirrels reproduce twice annually with litters averaging three to four young, enabling populations to sustain harvest pressure. The Wildlife Resources Commission monitors populations through hunter surveys and field observations rather than intensive population studies, as the species' stable status requires minimal management intervention. Urban squirrel populations receive no active management unless conflicts with humans require intervention."
      
      - subtitle: "Ecological Role"
        text: "Gray squirrels serve essential functions in North Carolina forest ecosystems as both seed dispersers and prey species. They cache thousands of acorns, hickory nuts, and walnuts each autumn, burying them individually throughout their home ranges. Imperfect memory and predation mean many cached seeds escape recovery, germinating into new trees. Research indicates squirrels contribute significantly to oak and hickory regeneration in North Carolina forests. As prey, squirrels support populations of hawks, owls, foxes, bobcats, and other predators. Their abundance makes them a primary food source for many predatory species."
      
      - subtitle: "Human-Wildlife Coexistence"
        text: "North Carolina's large urban centers have learned to coexist with gray squirrels despite occasional conflicts. Squirrels sometimes damage buildings by gnawing entry holes to attic spaces for nesting or winter shelter. They raid bird feeders, dig in gardens, and strip bark from ornamental trees. Most North Carolinians accept these minor inconveniences as the price of living alongside adaptable wildlife. Urban parks and university campuses often feature unusually tame squirrels accustomed to human presence. These populations demonstrate the species' behavioral flexibility and ability to thrive in human-dominated landscapes."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The gray squirrel connects to multiple North Carolina state symbols through shared habitat and complementary meanings. The scientific name Sciurus carolinensis creates a direct linguistic link between the animal and the state itself."
      - "North Carolina's forest-related symbols—including the longleaf pine (state tree) and flowering dogwood (state flower)—share ecosystems with gray squirrels throughout the state. The squirrel depends on mature hardwoods for food and shelter, making forest conservation essential to the state mammal's continued abundance."
    
    subsections:
      - subtitle: "The Pine Tree Connection"
        text: "North Carolina designated the longleaf pine as the official state tree in 1963, six years before adopting the gray squirrel as state mammal. While gray squirrels prefer hardwood forests for their nut-producing trees, they commonly inhabit pine-hardwood mixtures throughout the Piedmont and Coastal Plain. The longleaf pine once dominated these regions before extensive logging and conversion to agriculture. Modern forest management increasingly recognizes the value of mixed pine-hardwood stands that benefit both the state tree and state mammal. The combination of longleaf pine restoration and hardwood conservation represents North Carolina's commitment to diverse, healthy forest ecosystems."
        link:
          label: "See North Carolina state tree"
          url: "/states/north-carolina/tree/longleaf-pine"
      
      - subtitle: "Dogwood as Understory Habitat"
        text: "The flowering dogwood, North Carolina's state flower since 1941, provides important cover and nesting habitat for gray squirrels. Dogwoods grow as understory trees in hardwood forests, creating the mid-level structure squirrels use for travel and escape from predators. The dogwood's spring flowers and fall berries contribute to the diverse forest ecosystem supporting squirrel populations. Both symbols represent North Carolina's appreciation for native species that thrive in mature forest communities rather than open, disturbed landscapes."
        link:
          label: "See North Carolina state flower"
          url: "/states/north-carolina/flower/flowering-dogwood"
      
      - subtitle: "Scientific Heritage"
        text: "The gray squirrel's scientific name commemorates the Carolina colony's role in American natural history. When European naturalists explored the Carolina colony during the 1700s, they documented hundreds of species previously unknown to science. Mark Catesby's Natural History of Carolina, Florida and the Bahama Islands (1731-1743) included detailed illustrations and descriptions of Carolina wildlife. Carl Linnaeus used Catesby's work and other Carolina specimens to name numerous species in his Systema Naturae. The epithet carolinensis appears in scientific names for plants, birds, reptiles, and mammals first described from the Carolinas. This scientific legacy connects North Carolina to the foundations of modern biology and taxonomy."

