faq:
  - question: "What is North Carolina's state horse?"
    answer: "North Carolina's state horse is the Colonial Spanish mustang, designated on June 5, 2010. These rare horses descended from Spanish colonial stock live wild on Outer Banks barrier islands, where they have survived for over 400 years since Spanish exploration of Carolina coasts in the early 1500s."
  
  - question: "When was the Colonial Spanish mustang designated as North Carolina's state horse?"
    answer: "The Colonial Spanish mustang became North Carolina's official state horse in 2010 through Session Law 2010-113. The designation recognized wild horse herds on the Outer Banks as living historical connections to North Carolina's earliest European contacts and honored coastal maritime heritage."
  
  - question: "Why did North Carolina choose the Colonial Spanish mustang as its state horse?"
    answer: "North Carolina chose the Colonial Spanish mustang because wild herds on the Outer Banks represent the state's oldest continuous large mammal population descended from European introduction. These horses arrived with Spanish explorers in the early 1500s, decades before English colonization attempts. Genetic testing confirmed Spanish colonial ancestry, validating centuries of local tradition. The endangered status of this rare heritage breed added conservation significance to the designation."
  
  - question: "Where can I see wild Colonial Spanish mustangs in North Carolina?"
    answer: "You can see wild Colonial Spanish mustangs on three primary Outer Banks locations: Shackleford Banks (accessible by ferry from Beaufort), Corolla beaches in northern Outer Banks (requires 4WD vehicle access), and Ocracoke Island (National Park Service maintains viewing areas). Shackleford Banks offers the most natural viewing experience with horses roaming a 9-mile uninhabited barrier island."
  
  - question: "Are the Outer Banks wild horses really descended from Spanish horses?"
    answer: "Yes, genetic testing in the 1990s and 2000s confirmed that Outer Banks wild horses descended from Spanish colonial stock. DNA analysis revealed genetic markers consistent with Spanish horses from the Iberian Peninsula, matching authenticated Spanish mustang populations elsewhere. Physical characteristics including compact build, primitive markings, and specific skeletal measurements support Spanish ancestry. Testing showed minimal modern breed influence, indicating centuries of genetic isolation."
  
  - question: "How did Spanish horses get to the Outer Banks?"
    answer: "Spanish explorers brought horses to Carolina coasts during early 1500s expeditions, decades before English colonization. Lucas Vázquez de Ayllón's 1526 expedition attempted settlement on Carolina shores and included horses that likely escaped or were abandoned when colonists retreated. Other Spanish expeditions throughout the 1500s also brought horses. These animals adapted to barrier island conditions and established wild populations that survived for over 400 years."
  
  - question: "Can I ride or touch the wild horses on the Outer Banks?"
    answer: "No, wild Colonial Spanish mustangs are protected by North Carolina law making it illegal to touch, feed, chase, or harass them. These are wild animals, not tame horses, and can kick or bite if approached. Visitors must maintain minimum 50-foot distance for safety and horse welfare. Violating wild horse protection laws results in significant fines. Some domesticated Colonial Spanish mustangs at private farms offer riding experiences for those interested in the breed."
  
  - question: "How many wild Colonial Spanish mustangs live in North Carolina?"
    answer: "Approximately 250-280 wild Colonial Spanish mustangs live on North Carolina's Outer Banks across three primary herds: Shackleford Banks (110-130 horses), Corolla (100 horses), and Ocracoke (25 horses). Additional registered Colonial Spanish mustangs live at private preservation farms throughout the state. Worldwide, fewer than 3,000 Colonial Spanish mustangs exist, making them critically rare."
  
  - question: "What do the wild horses eat on the Outer Banks?"
    answer: "Wild Colonial Spanish mustangs graze on salt marsh grasses, sea oats, cordgrass, and other maritime vegetation adapted to coastal conditions. They dig for fresh water beneath dunes during droughts and drink from rainwater pools and brackish sources. Their digestive systems efficiently extract nutrition from plants that would provide insufficient nutrition for most domestic horses. The horses' compact size and efficient metabolism help them thrive on sparse coastal vegetation."

