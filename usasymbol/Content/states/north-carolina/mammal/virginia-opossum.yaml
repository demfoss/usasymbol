faq:
  - question: "What is North Carolina's state marsupial?"
    answer: "North Carolina's state marsupial is the Virginia opossum (Didelphis virginiana), designated in 2013. The Virginia opossum is North America's only native marsupial and represents one of the oldest surviving mammal lineages on the continent with ancestors dating back 70 million years."
  
  - question: "When was the Virginia opossum designated as North Carolina's state marsupial?"
    answer: "The Virginia opossum became North Carolina's official state marsupial in 2013. The designation recognized this often-misunderstood species for its ecological benefits, ancient evolutionary heritage, and successful adaptation to modern landscapes throughout the state."
  
  - question: "Why did North Carolina choose the Virginia opossum as its state marsupial?"
    answer: "North Carolina chose the Virginia opossum because it represents biological uniqueness as North America's only native marsupial. The species demonstrates remarkable adaptability and resilience, surviving for 70 million years through environmental changes that eliminated thousands of other species. The designation also provided educational opportunity to correct negative perceptions and highlight opossums' beneficial qualities including pest control and disease reduction."
  
  - question: "Are opossums dangerous to humans or pets?"
    answer: "No, Virginia opossums pose minimal danger to humans or pets. They display non-aggressive temperament, preferring escape or playing dead over confrontation. Opossums rarely carry rabies due to low body temperature incompatible with virus survival. They may hiss or show teeth when threatened but seldom bite. Their primary defensive behavior involves death-feigning rather than aggression."
  
  - question: "What does 'playing possum' mean?"
    answer: "Playing possum refers to the Virginia opossum's involuntary death-feigning behavior. When threatened and unable to escape, opossums enter a catatonic state resembling death—falling on their side, becoming rigid, staring blankly, and emitting foul odor. This physiological response lasts minutes to hours and evolved as defense against predators that prefer live prey. The behavior is involuntary, similar to fainting, not a conscious decision."
  
  - question: "What do opossums eat in North Carolina?"
    answer: "Virginia opossums are omnivores eating diverse foods including insects, ticks, snails, rodents, bird eggs, fruits, nuts, carrion, and garbage. They consume venomous snakes including copperheads and cottonmouths due to natural venom immunity. Research shows individual opossums eat thousands of ticks per season, helping reduce Lyme disease transmission. Urban opossums also eat cockroaches, beetles, and food scraps."
  
  - question: "How many babies do opossums have?"
    answer: "Female opossums typically give birth to 15-20 babies after only 12-13 days of gestation. However, females have only 13 teats, creating natural selection as more babies are born than can attach to teats. Newborns measure barely half an inch long and crawl unaided from birth canal to pouch. Young remain in the pouch approximately two months before emerging to ride on mother's back."
  
  - question: "Do opossums hang by their tails?"
    answer: "Young opossums can hang briefly by their prehensile tails, but adult opossums are too heavy for sustained suspension despite popular belief. The tail functions as a fifth limb providing balance and grasping ability for climbing. Opossums use their tails to help stabilize while climbing trees and to carry nesting materials, but they do not sleep hanging by tails as often depicted."
  
  - question: "Why do I see so many dead opossums on roads?"
    answer: "Opossums commonly die as roadkill due to slow movement, nocturnal activity during traffic hours, and ineffective defensive behavior. When threatened by approaching vehicles, opossums often freeze or play dead—strategies that work against natural predators but prove fatal with automobiles. Poor eyesight also contributes to roadway deaths. Their abundance and adaptability to human areas increase exposure to vehicle traffic."

