intro_text: "North Carolina's state fruit is the muscadine grape, renamed in 2023 to include the native grape group that contains the historic Scuppernong variety. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is North Carolina's State Fruit?"
    paragraphs:
      - "The muscadine grape is North Carolina's official state fruit, designated under that broader name by the North Carolina General Assembly in 2023. The state originally named the Scuppernong, a bronze muscadine variety, as its official fruit in 2001."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Muscadine Grape"
    paragraphs:
      - "Muscadine grapes are native to the southeastern United States and grow on vigorous vines suited to North Carolina's warm, humid climate. The grapes have thick skins and may be bronze, purple, or nearly black. They are eaten fresh and used to make juice, jelly, and wine."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Muscadine Grape Became North Carolina's State Fruit"
    paragraphs:
      - "The North Carolina General Assembly named the Scuppernong grape the official state fruit in 2001. In 2023, lawmakers changed the official name to muscadine grape, a broader group that includes Scuppernong."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why North Carolina Chose the Muscadine Grape"
    paragraphs:
      - "Muscadine grapes grow naturally in North Carolina and have a documented connection to the state's coast. Early English explorers reported abundant wild grapes in the region, and the Scuppernong variety took its name from North Carolina's Scuppernong River."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Muscadine Grape Comes From in North Carolina"
    paragraphs:
      - "Roanoke Island is home to the Mother Vine, a centuries-old muscadine vine associated with North Carolina's early grape history."
    sites:
      - name: Mother Vine
        city: Manteo
        lat: 35.85
        lng: -75.71
        note: "Home of the historic Mother Vine"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Muscadine Grape Facts"
    facts:
      - "Named North Carolina's state fruit in 2023."
      - "The state fruit was originally listed as the Scuppernong grape in 2001."
