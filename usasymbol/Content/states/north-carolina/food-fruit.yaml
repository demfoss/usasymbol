faq:
  - question: "What is North Carolina's state fruit?"
    answer: "North Carolina's state fruit is the muscadine grape, named under that broader designation by the General Assembly in 2023."
  - question: "When did North Carolina adopt the muscadine grape as its state fruit?"
    answer: "North Carolina renamed its official state fruit the muscadine grape in 2023. The state had originally designated the Scuppernong variety in 2001."
  - question: "Is Scuppernong a muscadine grape?"
    answer: "Yes. Scuppernong is a bronze variety of muscadine grape with a long history in North Carolina."
  - question: "Where is the historic Mother Vine?"
    answer: "The Mother Vine grows on Roanoke Island near Manteo, North Carolina."

