sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is North Carolina's State Red Berry?"
    paragraphs:
      - "The strawberry is North Carolina's official state red berry, designated by the North Carolina General Assembly in 2001. Strawberries are grown on farms across the state, with the Piedmont region a particular center of production."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Strawberry"
    paragraphs:
      - "Strawberries are small red fruits with seeds on the outside of their flesh, grown on low plants. North Carolina's strawberry season runs mainly through April and May, when many farms open for pick-your-own picking."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Strawberry Became North Carolina's State Red Berry"
    paragraphs:
      - "The North Carolina General Assembly designated the strawberry the official state red berry in 2001, alongside several other food symbols adopted the same year."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why North Carolina Chose the Strawberry"
    paragraphs:
      - "North Carolina ranks among the top strawberry-producing states, and towns in the Piedmont region, including Chadbourn and Faison, have long marketed themselves around their spring strawberry harvest."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Strawberry Facts"
    facts:
      - "Adopted as North Carolina's state red berry in 2001."
      - "North Carolina ranks among the top strawberry-producing states."
      - "North Carolina's strawberry season runs mainly through April and May."

