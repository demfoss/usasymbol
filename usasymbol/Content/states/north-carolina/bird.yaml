sections:
- id: why-did-north-carolina-replace-the-chickadee-with-the-cardinal
  icon: fa-solid fa-circle-question
  title: Why Did North Carolina Replace the Chickadee With the Cardinal?
  paragraphs:
  - North Carolina's bird story starts with an official choice that did not last. In 1933 the General Assembly named the Carolina Chickadee as state bird, but repealed the designation almost immediately.
  - The problem was not that the chickadee was unknown. The problem was how the choice sounded in public. Contemporary accounts say lawmakers did not want North Carolina mocked as the Tomtit State, using an old nickname for the chickadee.
  - That failed first attempt changed the terms of the later decision. By 1943 the state was not simply picking a bird. It was trying to land on one that people would accept without embarrassment or instant second-guessing.
- id: how-did-the-cardinal-finally-stick
  icon: fa-solid fa-check-to-slot
  title: How Did the Cardinal Finally Stick?
  paragraphs:
  - The 1943 cardinal campaign came with broader backing than the earlier chickadee episode. The North Carolina Bird Club organized a statewide vote, and reports at the time said more than 23,000 ballots came in from schools, garden clubs, and other groups.
  - The cardinal led the field with about 5,000 votes, ahead of the mourning dove and a long list of other candidates. The new symbol no longer looked like a small insider choice — it looked publicly tested.
  - Residents already knew the cardinal across the state, and the vote made it easier to treat the bird as a shared everyday symbol rather than a clever or arguable pick — the exact problem the chickadee had run into ten years earlier.
faq:
- question: What is North Carolina's state bird?
  answer: North Carolina's state bird is the Northern Cardinal.
- question: When did North Carolina adopt the cardinal?
  answer: North Carolina adopted the cardinal as its official state bird on March 8, 1943.
- question: Did North Carolina have a different state bird first?
  answer: Yes. In 1933 North Carolina briefly designated the Carolina Chickadee before repealing that choice.
- question: Why was the chickadee dropped?
  answer: Historical accounts say lawmakers did not want North Carolina associated with the nickname Tomtit State, which helped sink the chickadee designation.
- question: Why did the cardinal win in 1943?
  answer: The cardinal won after a large statewide vote organized by the North Carolina Bird Club. It had broader public backing and looked like a safer statewide symbol than the failed 1933 choice.
- question: What does the cardinal mean for North Carolina?
  answer: The cardinal is the symbol that resolved a decade of failed attempts — replacing the Carolina Chickadee that lawmakers repealed in 1933 and surviving as North Carolina's lasting designation because it came with a real public mandate behind it.
