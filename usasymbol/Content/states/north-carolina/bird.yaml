title: Northern Cardinal
scientific_name: Cardinalis cardinalis
adopted_year: 1943
legislation: G.S. 145-2; 1943, c. 595
meaning: North Carolina's state bird makes the most sense as the symbol that settled a bad first attempt. The state had briefly designated the Carolina Chickadee in 1933, then repealed it. In 1943 the cardinal finally stuck because it came with broader public backing and a cleaner statewide fit.
author: USA Symbol Team
