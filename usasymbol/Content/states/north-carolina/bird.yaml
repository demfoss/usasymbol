seo_title: "North Carolina State Bird | Northern Cardinal"
seo_description: "North Carolina adopted the Northern Cardinal in 1943 after briefly naming the Carolina Chickadee a decade earlier."
intro_text: "North Carolina's official state bird is the <strong>Northern Cardinal</strong>, adopted on <strong>March 8, 1943</strong> and now listed in <strong>G.S. 145-2</strong>. The cardinal was not the state's first try. In <strong>1933</strong> lawmakers briefly designated the <strong>Carolina Chickadee</strong>, then quickly repealed it. The cardinal became the symbol that finally stuck: a second choice backed by more than 23,000 statewide ballots and a much stronger sense that this bird could stand for North Carolina without embarrassment."
