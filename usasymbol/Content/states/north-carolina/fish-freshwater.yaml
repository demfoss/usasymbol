intro_text: North Carolina's state freshwater trout is the Southern Appalachian brook trout, a small, colorful trout of cold mountain streams, adopted in 2005. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Trout of North Carolina?
  paragraphs:
  - The Southern Appalachian brook trout became North Carolina's official freshwater trout in 2005. Its scientific name is Salvelinus fontinalis.
  - State law names the Southern Appalachian strain, a local group of brook trout. Genetic studies show that the brook trout native to North Carolina belong to this strain.
  - North Carolina's state saltwater fish is the channel bass, also called red drum.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Southern Appalachian Brook Trout
  paragraphs:
  - The brook trout has an olive-green back with dark, wavy, worm-like markings that run onto its tail.
  - Its lower sides are lighter, with yellow spots and a few bright red spots ringed in blue. Many people call it a speck because of these spots.
  - The easiest way to spot one is by its lower fins. They are orange, with a bright white front edge and a thin black stripe behind it.
  - Wild brook trout in North Carolina are small. Most are 6 to 8 inches long and weigh a quarter to half a pound.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Trout
  paragraphs:
  - The North Carolina General Assembly adopted the Southern Appalachian brook trout as the official freshwater trout in 2005.
  - An early version of the bill called the brook trout the state freshwater fish. The final law named the Southern Appalachian strain and used the title freshwater trout.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why North Carolina Chose the Southern Appalachian Brook Trout
  paragraphs:
  - The state law names the fish but doesn't give a detailed reason.
  - The brook trout is the only trout native to southern Appalachian mountain streams. Rainbow trout and brown trout were brought into the region from other places.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Southern Appalachian Brook Trout
  paragraphs:
  - This trout lives in the mountains of western North Carolina.
  - Wild brook trout are most common in small, high-elevation headwater streams. They need water that is cold, clean, and full of oxygen.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Southern Appalachian Brook Trout Facts
  facts:
  - Adopted in 2005 by the North Carolina General Assembly.
  - Its scientific name is Salvelinus fontinalis.
  - Wild fish are usually 6 to 8 inches long and rarely grow longer than 10 inches.
  - Brook trout seldom live longer than four years in the wild.
  - Its orange lower fins have a white front edge and a thin black stripe.
faq:
- question: What is North Carolina's state fish?
  answer: North Carolina's state freshwater trout is the Southern Appalachian brook trout. Its state saltwater fish is the channel bass, also called red drum.
- question: When did North Carolina adopt the Southern Appalachian brook trout?
  answer: The North Carolina General Assembly made it the official freshwater trout in 2005.
- question: Why did North Carolina choose the Southern Appalachian brook trout?
  answer: The law doesn't give a detailed reason. The brook trout is the only trout native to southern Appalachian mountain streams.
- question: Why is it called the Southern Appalachian brook trout?
  answer: Genetic studies show that the brook trout native to North Carolina are a separate strain. Scientists call it the Southern Appalachian brook trout.
- question: How can you tell a brook trout apart from other trout?
  answer: Look for wavy, worm-like markings on its back and red spots ringed in blue on its sides. Its orange lower fins also have bright white front edges.
