faq:
  - question: What is North Carolina's state gemstone?
    answer: "North Carolina's official state precious stone is emerald, a green variety of beryl adopted by the General Assembly in 1973."
  - question: When did North Carolina adopt emerald as its state precious stone?
    answer: "The North Carolina General Assembly designated emerald the state precious stone in 1973."
  - question: Why did North Carolina choose emerald?
    answer: "The deposits around Hiddenite in Alexander County are the only significant source of emerald in North America, making the gemstone a natural fit for the state symbol."
  - question: Where can you find emerald in North Carolina?
    answer: "Hiddenite in Alexander County is the center of North Carolina's emerald country, with several mines open for visitors to dig their own stones."

