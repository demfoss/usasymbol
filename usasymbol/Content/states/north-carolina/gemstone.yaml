sections:
  - id: overview
    icon: fa-solid fa-gem
    title: North Carolina State Precious Stone
    paragraphs:
      - "Emerald is North Carolina's official state precious stone, designated by the General Assembly in 1973. It is a green variety of beryl, and North Carolina's deposits around Hiddenite in Alexander County are the only significant emerald source anywhere in North America."
      - "Legislators chose emerald because of that geological rarity, a resource no neighboring state can claim in comparable quality or quantity."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Emerald?"
    paragraphs:
      - "Emerald is a green variety of beryl, colored by traces of chromium and vanadium within its crystal structure. It typically forms as six-sided prisms and ranks among the harder gemstones, though natural inclusions often make emerald more brittle than its hardness alone suggests."
      - "North Carolina emerald grows inside pockets in quartz veins, alongside minerals like hiddenite, a related but distinct green gemstone. Crystals range from small fragments to museum-sized specimens weighing hundreds of carats."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why North Carolina Chose Emerald as Its State Precious Stone"
    paragraphs:
      - "North Carolina holds the only significant emerald deposits in North America, concentrated around Hiddenite in Alexander County since their discovery in 1874, with later finds in Mitchell and Cleveland counties. That distinction alone set the state apart from every other emerald-producing region in the country."
      - "Some of the largest emeralds found in North America have come from Alexander County, including a 1,869-carat crystal unearthed near Statesville in 2003. Cut stones from the area, including the Carolina Emperor and the Carolina Prince, have sold for hundreds of thousands of dollars."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Emerald Became North Carolina's State Precious Stone"
    paragraphs:
      - "Representative Margaret Keesee of Guilford County introduced the bill in January 1973, and the General Assembly passed it that April with little opposition, formally recognizing a gemstone already well known among the state's mineral collectors."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Emerald Is Found in North Carolina"
    paragraphs:
      - "Hiddenite, in Alexander County, sits at the center of North Carolina's emerald country, where several mines allow visitors to dig and keep what they find. Emerald has also turned up in Mitchell and Cleveland counties, but Alexander County remains the most productive and best documented source."
    sites:
