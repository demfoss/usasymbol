  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Emerald Facts"
    facts:
      - "Adopted as North Carolina's state precious stone in 1973."
      - "Alexander County's emerald deposits were first discovered in 1874."
      - "A 1,869-carat emerald crystal found near Statesville in 2003 is believed the largest ever found in North America."
      - "North Carolina is the only state in the country with significant, gem-quality emerald deposits."

