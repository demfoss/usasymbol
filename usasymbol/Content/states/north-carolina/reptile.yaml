    answer: "North Carolina's state reptile is the eastern box turtle, adopted by the North Carolina General Assembly in 1979."
  - question: When did North Carolina adopt the eastern box turtle?
    answer: "The North Carolina General Assembly designated the eastern box turtle the official state reptile in 1979."
  - question: Why did North Carolina choose the eastern box turtle?
    answer: "Official sources name the eastern box turtle as the state reptile but do not give a detailed reason for the choice."
  - question: Is the eastern box turtle a turtle, snake, lizard, or alligator?
