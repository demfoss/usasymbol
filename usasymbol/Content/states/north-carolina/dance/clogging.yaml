sections:
  - id: overview
    icon: fa-solid fa-music
    title: North Carolina State Dance
    paragraphs:
      - "Clogging is North Carolina's official state folk dance, adopted in 2005. The designation put a name on a mountain tradition that had already defined the state's old-time and bluegrass dance scene for generations."
      - "North Carolina also recognizes the Carolina shag as a separate state popular dance, so the state carries two distinct official dance designations rather than one."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Clogging Explained"
    paragraphs:
      - "Clogging is a percussive step dance built around rhythmic footwork that strikes the floor in time with the music, similar in spirit to tap dance but rooted in older Appalachian and Southern mountain tradition. Dancers keep their upper body relatively relaxed while the feet carry the rhythm, often dancing in a loose, bouncing style close to the ground."
      - "Team or precision clogging arranges dancers in lines or squares who perform synchronized step patterns together, while freestyle or buck dancing lets an individual improvise footwork over the music. Both styles are usually danced to old-time or bluegrass string-band music built around fiddle, banjo, and guitar."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Clogging
    steps:
      - title: "Find the Downbeat"
        description: "Stand with knees slightly bent and listen for the steady pulse of the fiddle and banjo before starting any footwork."
      - title: "Learn the Basic Shuffle Step"
        description: "Brush the ball of one foot forward and back against the floor, then step down, keeping the motion low and close to the ground."
      - title: "Add the Double Toe"
        description: "Tap the toe of the working foot twice in quick succession before stepping, building the layered percussive sound clogging is known for."
      - title: "Move as a Team"
        description: "In precision clogging, dancers line up in rows or squares and repeat the same step pattern together, staying locked to the same beat."
      - title: "Freestyle Over the Tune"
        description: "In buck dancing, an individual dancer improvises steps over the music instead of following a set team pattern."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Clogging Represents North Carolina
    paragraphs:
      - "Clogging developed in North Carolina's Appalachian mountain communities out of a blend of English, Scots-Irish, and German step-dance traditions, layered with rhythmic and percussive influence from African American dance. That mix produced a style distinct enough from square dance that the legislature named it separately."
      - "The Green Grass Cloggers, a precision clogging team founded in Boone in 1971, helped popularize team clogging as a performance art beyond its mountain roots and remain active today. Western North Carolina's old-time and bluegrass festival circuit gave clogging a stage that kept the tradition visible generation after generation."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Clogging Became North Carolina's State Dance
    paragraphs:
      - "North Carolina designated clogging its official state folk dance in 2005, formally separating it from square dance, which many other states adopted as their folk dance during the 1970s through 1990s. The designation recognized clogging as a distinct Appalachian tradition rather than grouping it with the broader national square-dance movement."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Clogging Facts
    facts:
      - "North Carolina adopted clogging as its official state folk dance in 2005."
      - "North Carolina separately recognizes the Carolina shag as its state popular dance."
      - "The Green Grass Cloggers, founded in Boone in 1971, helped popularize precision team clogging."
      - "Clogging developed from a blend of English, Scots-Irish, German, and African American step-dance traditions in the Appalachian mountains."
      - "Clogging is traditionally danced to old-time and bluegrass string-band music."

