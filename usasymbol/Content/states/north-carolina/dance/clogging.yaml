faq:
  - question: What is North Carolina's state dance?
    answer: "North Carolina's official state folk dance is clogging, adopted in 2005."
  - question: When did North Carolina adopt clogging as its state dance?
    answer: "North Carolina adopted clogging as its official state folk dance in 2005."
  - question: Why did North Carolina choose clogging?
    answer: "Clogging grew directly out of the state's Appalachian mountain communities, blending English, Scots-Irish, German, and African American step traditions into a style unique to the region."
  - question: What is the difference between clogging and square dance?
    answer: "Clogging is a percussive footwork style danced solo, in teams, or as an accompaniment to other dances, while square dance is a partnered formation dance built around a caller's instructions. North Carolina recognizes clogging specifically rather than grouping it with square dance."

