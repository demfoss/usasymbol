sections:
  - id: overview
    icon: fa-solid fa-music
    title: North Carolina State Song
    paragraphs:
      - "\"The Old North State\" is North Carolina's official state song, adopted in 1927. Judge William Gaston wrote the words in 1835, and Mrs. E.E. Randolph arranged the tune North Carolinians know today nearly a century later, shortly before the General Assembly made it official."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"The Old North State\" Explained"
    paragraphs:
      - "The song is a proud, defiant tribute to North Carolina, praising the state's independence and rejecting outside mockery of it. Its chorus repeats \"Hurrah! Hurrah!\" for the Old North State, giving it the energy of a march more than a quiet ballad."
      - "William Gaston, a North Carolina Supreme Court justice, wrote the lyrics in Raleigh in 1835 after reportedly overhearing young girls singing a tune they had picked up from a Swiss bell-ringers' concert. He set new words to that borrowed melody."
      - "The arrangement familiar to North Carolinians today comes from Mrs. E.E. Randolph, who prepared it in Raleigh in 1926, shortly before the state adopted the song."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "The Old North State" Represents North Carolina
    paragraphs:
      - "North Carolina adopted the song because it had already circulated as an unofficial anthem for nearly a century, written by one of the state's own judges rather than an outside songwriter. Its defiant, proud tone matched the state's self-image as a place unbothered by outsiders' opinions."
      - "By the time the General Assembly acted in 1927, the song was already taught in schools and sung at civic events across the state. Formal adoption simply confirmed a status the song had held informally for generations."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"The Old North State\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "The Old North State" Became North Carolina's State Song
    paragraphs:
      - "The North Carolina General Assembly adopted \"The Old North State\" as the official state song on February 18, 1927, using the arrangement Mrs. E.E. Randolph had prepared the year before. The words themselves dated back to 1835, making the gap between writing and official adoption nearly a century long."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"The Old North State\" Facts"
    facts:
      - "North Carolina adopted \"The Old North State\" as its official state song in 1927."
      - "William Gaston, a North Carolina Supreme Court justice, wrote the lyrics in 1835."
      - "Gaston reportedly based the melody on a tune he heard from a Swiss bell-ringers' concert."
      - "Mrs. E.E. Randolph arranged the modern tune in 1926, just before the song's official adoption."
      - "Nearly a century passed between the song's writing and its formal adoption as state song."

