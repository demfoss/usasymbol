faq:
  - question: What is North Carolina's state song?
    answer: "North Carolina's official state song is \"The Old North State,\" adopted in 1927."
  - question: Who wrote North Carolina's state song?
    answer: "William Gaston wrote the lyrics in 1835, and Mrs. E.E. Randolph arranged the current tune in 1926."
  - question: When did North Carolina adopt "The Old North State" as its state song?
    answer: "The North Carolina General Assembly adopted the song on February 18, 1927."
  - question: Was North Carolina's state song written by a judge?
    answer: "Yes. William Gaston was a sitting North Carolina Supreme Court justice when he wrote the lyrics in 1835."

