hero_image_caption: The red drum, also called channel bass, is North Carolina's state saltwater fish.
intro_text: North Carolina's state saltwater fish is the red drum, also called the channel bass. This copper-colored coastal fish became official in 1971. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of North Carolina?
  paragraphs:
  - The red drum is North Carolina's official state saltwater fish. The North Carolina Legislature named it in 1971, and state law calls it the channel bass (red drum).
  - Its scientific name is Sciaenops ocellatus. North Carolina also has a state freshwater trout, the Southern Appalachian brook trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Red Drum
  paragraphs:
  - Most red drum are a reddish bronze color. Some look dark and coppery, and others are almost completely silver.
  - The easiest way to spot one is the round black spot near the base of the tail. Many red drum have one spot, and some have two or more.
  - Biologists think the spot may trick predators into attacking the tail instead of the head, which gives the fish a chance to escape.
  - The fish gets its name partly from its color. During spawning season, males also make a drumming sound by vibrating a muscle on their swim bladder.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - The North Carolina Legislature passed a law in 1971 naming the channel bass, or red drum, the official state saltwater fish.
  - State law still lists the fish under both names.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why North Carolina Chose the Red Drum
  paragraphs:
  - The law does not give a reason for the choice. A newspaper story from that time pointed out the black spots on the fish's tail, which fit North Carolina's Tar Heel nickname.
  - North Carolina is also famous for its trophy red drum, which can weigh more than 40 pounds.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Red Drum
  paragraphs:
  - Red drum live in coastal waters and estuaries along North Carolina's coast. Large adults stay in the state's coastal waters all year.
  - Anglers usually catch big red drum in the surf and sounds between Oregon Inlet and Cape Lookout.
