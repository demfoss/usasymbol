- id: facts
  icon: fa-solid fa-lightbulb
  title: Red Drum Facts
  facts:
  - Adopted in 1971 by the North Carolina Legislature.
  - Its scientific name is Sciaenops ocellatus. The word ocellatus means "eye-like colored spot."
  - A red drum caught off Hatteras Island in 1984 weighed 94 pounds, 2 ounces. It is the world record.
  - It is also called channel bass, redfish, and spottail bass. Young fish are called puppy drum.
  - It lives along the coast from Massachusetts to Mexico.
faq:
- question: What is North Carolina's state fish?
  answer: North Carolina's state saltwater fish is the red drum, which is also called the channel bass. The state freshwater trout is the Southern Appalachian brook trout.
- question: When did North Carolina adopt the Red Drum?
  answer: The North Carolina Legislature named the red drum the official state saltwater fish in 1971.
- question: Why did North Carolina choose the Red Drum?
  answer: The law does not give a reason. A newspaper story from 1971 linked the black spots on its tail to the Tar Heel nickname. The state is also famous for very large red drum.
- question: What was the biggest red drum ever caught in North Carolina?
  answer: In 1984, an angler caught a red drum from the surf at Avon on Hatteras Island that weighed 94 pounds, 2 ounces. It is still the world record.
- question: Why does the red drum have a black spot on its tail?
  answer: Biologists think the spot looks like an eye and confuses predators. They may attack the tail instead of the head, which lets the fish escape.
