name_meaning:
  heading: What Does North Carolina Mean?
  paragraphs:
  - North Carolina became the 12th state in 1789, after its colonial history as part of Carolina. Carolina comes from Carolus, the Latin form of Charles, and honors English kings named Charles.
  - The official imagery feels older than the state name alone. Pine and Tar Heel identity point to naval stores and longleaf landscapes, while the cardinal, dogwood, gray squirrel, and milk keep the guide close to everyday yards, woods, and farms.
  - North Carolina's postal abbreviation is NC, and residents are North Carolinians. Tar Heel remains the state's strongest informal identity.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Carolina comes from Carolus, the Latin form of Charles.
    - label: Statehood
      text: North Carolina ratified the Constitution in 1789, becoming the 12th state.
    - label: Motto
      text: Esse Quam Videri means To Be Rather Than To Seem.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to North Carolina, a state spanning the Atlantic coast, Piedmont, and Appalachian mountains.
    - label: People
      text: People from North Carolina are called North Carolinians.
    - label: Regions
      text: The guide reaches from Outer Banks horses to mountain hounds and statewide pine identity.
  - heading: Nicknames and Short Forms
    items:
    - label: The Tar Heel State
      text: Main nickname, tied to North Carolina's pine products and state identity.
    - label: Old North State
      text: Older nickname still used in state culture and music.
    - label: Abbreviation
      text: NC; older short form N.C.
editorial:
  heading: What North Carolina's Symbols Say About the State
  paragraphs:
  - North Carolina's [Tar Heel nickname](/states/north-carolina/nickname) and [pine tree](/states/north-carolina/tree) belong together. The tree is not just scenery; it points toward the resin, tar, pitch, and timber history behind the nickname.
  - The [dogwood](/states/north-carolina/flower) and [northern cardinal](/states/north-carolina/bird) give the state familiar eastern woodland symbols, but the mammal pages make the hub more local. The [Colonial Spanish Mustang](/states/north-carolina/mammal/colonial-spanish-mustang) belongs to the Outer Banks, and the [Plott Hound](/states/north-carolina/mammal/plott-hound) belongs to North Carolina mountain dog history.
  - "[Esse Quam Videri](/states/north-carolina/motto) gives the state one of the sharper mottoes in the series. To Be Rather Than To Seem sounds like a standard the rest of the page has to live up to."
faq:
- question: What is North Carolina's most famous state symbol?
  answer: The [Tar Heel State nickname](/states/north-carolina/nickname) is the one most people encounter first, especially in state identity, sports culture, and history.
- question: What is North Carolina's state bird?
  answer: North Carolina's state bird is the [northern cardinal](/states/north-carolina/bird), adopted in 1943.
- question: What is North Carolina's state flower?
  answer: North Carolina's state flower is the [dogwood](/states/north-carolina/flower), adopted in 1941.
- question: Why are the Outer Banks horses listed for North Carolina?
  answer: The [Colonial Spanish Mustang](/states/north-carolina/mammal/colonial-spanish-mustang) is part of this North Carolina hub because of the wild horse herds associated with the Outer Banks.
- question: How many official state symbols does North Carolina have?
  answer: North Carolina's hub gathers the flag, cardinal, dogwood, pine, motto, nickname, colors, milk, gray squirrel, Plott Hound, Virginia opossum, and Colonial Spanish Mustang.
