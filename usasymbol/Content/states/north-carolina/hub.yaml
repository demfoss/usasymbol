seo_description: "North Carolina state symbols: official state symbols include the cardinal, dogwood, longleaf pine, Tar Heel nickname, and Esse Quam Videri motto."
snippet_answer: North Carolina's cardinal and dogwood are among the most familiar official state symbols in the Southeast. The Tar Heel nickname, longleaf pine, Esse Quam Videri motto, Colonial Spanish Mustang, and Plott Hound give the state's list more range than the woodland symbols alone suggest — from Outer Banks horses to mountain dog history.
