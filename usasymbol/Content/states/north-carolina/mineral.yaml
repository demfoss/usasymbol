faq:
  - question: What is North Carolina's state mineral?
    answer: "North Carolina's state mineral is gold, a soft, bright yellow metal adopted by the General Assembly in 2011."
  - question: When did North Carolina adopt gold as its state mineral?
    answer: "The North Carolina General Assembly designated gold the official state mineral in 2011."
  - question: Why did North Carolina choose gold?
    answer: "A 1799 gold discovery in Cabarrus County made North Carolina the nation's first gold-producing state, and the designation was pushed by a fourth-grade class studying that history."
  - question: Where can you find gold in North Carolina?
    answer: "Reed Gold Mine in Midland, Cabarrus County, marks the site of the state's first gold discovery and is now open to the public for gold panning."

