sections:
  - id: overview
    icon: fa-solid fa-cube
    title: North Carolina State Mineral
    paragraphs:
      - "Gold is North Carolina's official state mineral, designated by the General Assembly in 2011. The discovery of a 17-pound gold nugget on a Cabarrus County farm in 1799 made North Carolina the country's first gold-producing state, decades before the famous rushes out west."
      - "Lawmakers recognized gold not as a modern industry but as a piece of the state's early economic history, one that predates California's gold rush by half a century."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Gold?"
    paragraphs:
      - "Gold is a soft, dense, bright yellow metal that does not tarnish or corrode, which is why prospectors could recognize it easily among ordinary stream gravel. It is one of the few metals found in nature in a nearly pure form, as flakes, grains, and nuggets rather than locked into hard ore."
      - "North Carolina's gold formed both in hydrothermal veins underground and as placer deposits, where erosion washed free gold into streambeds. Early miners in the state panned and sluiced these stream deposits before large-scale underground mining began."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why North Carolina Chose Gold as Its State Mineral"
    paragraphs:
      - "North Carolina's gold history starts with a twelve-year-old, Conrad Reed, who found a 17-pound nugget in Little Meadow Creek on his family's farm in 1799. The discovery led to the opening of Reed Gold Mine and made North Carolina the country's only gold-producing state until 1828, and its top producer until the California gold rush of 1848."
      - "A bill to designate gold as the state mineral was introduced in 2011 at the request of a fourth-grade class studying North Carolina history. The vote passed despite some opposition from lawmakers representing counties with competing quartz and feldspar mining interests."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Gold Became North Carolina's State Mineral"
    paragraphs:
      - "Senator Harry Brown introduced the bill on behalf of a fourth-grade class at Clyde Erwin Magnet Elementary School, and Governor Bev Perdue signed it into law in 2011, more than two centuries after Conrad Reed's discovery started the state's gold rush."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Gold Is Found in North Carolina"
    paragraphs:
      - "Reed Gold Mine, in Midland in Cabarrus County, sits on the site of Conrad Reed's 1799 discovery and operated as a working gold mine for more than a century afterward. The site is now a state historic site where visitors can pan for gold."
    sites:
      - name: Reed Gold Mine
        city: Midland
        lat: 35.2854
        lng: -80.4700
        note: "Site of the first documented U.S. gold find"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Gold Facts"
    facts:
      - "Adopted as North Carolina's state mineral in 2011."
      - "Conrad Reed, age twelve, found a 17-pound gold nugget in Cabarrus County in 1799."
      - "North Carolina was the only gold-producing state in the country until 1828, and its top producer until 1848."
      - "The bill naming gold the state mineral began with a fourth-grade class studying state history."

