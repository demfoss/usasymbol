faq:
- question: What is North Carolina's state insect?
  answer: "North Carolina's state insect is the European honey bee, adopted by the North Carolina General Assembly in 1973."
- question: When did North Carolina adopt the European honey bee?
  answer: "North Carolina adopted the European honey bee as its official state insect in 1973."
- question: Why did North Carolina choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to North Carolina agriculture and crop pollination."
- question: What does a European honey bee look like?
  answer: "It has a fuzzy, golden-brown and black striped body. Colonies include one queen, thousands of worker bees, and a smaller number of drones."
- question: Is the European honey bee the same as North Carolina's state butterfly?
  answer: "No. North Carolina's state butterfly is the eastern tiger swallowtail, adopted in 2012. The European honey bee is a separate designation, the state insect, adopted in 1973."

