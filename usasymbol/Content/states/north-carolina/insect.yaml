sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of North Carolina?
  paragraphs:
  - "The European honey bee, Apis mellifera, is North Carolina's official state insect. The North Carolina General Assembly designated it in 1973."
  - "North Carolina also has a separate state butterfly, the eastern tiger swallowtail, adopted decades later in 2012."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee has a fuzzy, golden-brown and black striped body built for collecting pollen and nectar from flowers."
  - "Honey bees live in colonies made up of one queen, thousands of worker bees, and a smaller number of drones. Workers are the bees most often seen visiting flowers."
  - "Not native to North America, honey bees were brought over by European colonists and have since become essential to pollinating crops across North Carolina."

- id: history
  icon: fa-solid fa-landmark
  title: How North Carolina Chose the European Honey Bee
  paragraphs:
  - "The North Carolina General Assembly designated the European honey bee as the official state insect in 1973."
  - "The designation recognizes the value of honey bees to North Carolina agriculture, since bees pollinate a wide range of the state's fruit, vegetable, and orchard crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1973, by the North Carolina General Assembly."
  - "Scientific name: Apis mellifera."
