sections:
  - id: overview
    icon: fa-solid fa-carrot
    title: "What Is Oklahoma's State Vegetable?"
    paragraphs:
      - "The watermelon is Oklahoma's official state vegetable, designated by the Oklahoma Legislature in 2007. Watermelon is grown on farms throughout the state and is a common sight at summer festivals and roadside stands."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Watermelon"
    paragraphs:
      - "Watermelons are large, sweet fruits with green rinds and juicy red flesh, though botanically classified with squash and cucumbers in the same plant family. They grow on sprawling vines in warm weather and are harvested in mid to late summer."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Watermelon Became Oklahoma's State Vegetable"
    paragraphs:
      - "The Oklahoma Legislature designated the watermelon the official state vegetable in 2007, recognizing a crop long grown by Oklahoma farmers and celebrated at community festivals across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oklahoma Chose the Watermelon"
    paragraphs:
      - "Oklahoma chose the watermelon because it grows well in the state's warm summers and sandy soils, and towns such as Rush Springs have built local festivals and economies around the crop."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Watermelon Comes From in Oklahoma"
    paragraphs:
      - "Rush Springs in Grady County is known as Oklahoma's watermelon capital, hosting an annual watermelon festival each August that draws visitors from across the state."
    sites:
      - name: Rush Springs
        city: Rush Springs
        lat: 34.7823
