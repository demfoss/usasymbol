    description: Current Iconic Oklahoma base with "IMAGINE THAT" at the bottom.

- id: 2024-transition
  icon: fa-solid fa-rotate
  title: The 2024 Transition
  paragraphs:
  - The Iconic Oklahoma plate became the standard issue on September 1, 2024. Buyers without an existing scissortail plate to transfer receive the new design unless they choose another eligible plate.
  - Older scissortail plates remain valid, so Oklahoma roads can show multiple active slogan eras at once.
  - For article accuracy, the headline slogan should be "Imagine That" now, while "Native America" should be described as a major historical slogan rather than the current standard slogan.

