faq:
- question: What is Oklahoma's current license plate slogan?
  answer: Oklahoma's current standard plate slogan is "Imagine That," introduced on the Iconic Oklahoma plate on September 1, 2024.
- question: Is "Native America" still Oklahoma's current license plate slogan?
  answer: No. "Native America" was a major Oklahoma plate slogan from 1994 through 2016, but the current new-issue standard plate uses "Imagine That." Older valid plates may still display older slogans.
- question: When did Oklahoma use "Native America"?
  answer: Oklahoma used "Native America" on standard plates from 1994 through December 2016, including the 2009 Sacred Rain Arrow base.
- question: What did "Oklahoma Is OK" mean?
  answer: "\"Oklahoma Is OK\" played on the state's postal abbreviation, OK, while acting as a tourism-friendly endorsement of the state."
- question: When did Oklahoma use "Explore Oklahoma"?
  answer: Oklahoma used "EXPLORE OKLAHOMA" on the scissor-tailed flycatcher standard plate from January 2017 through March 2022.
- question: Can Oklahoma drivers still have the scissortail plate?
  answer: Yes. The 2024 Iconic Oklahoma design replaced it for new standard issue, but existing scissortail plates can still be used, renewed, and transferred.

