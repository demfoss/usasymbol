seo_title: "Oklahoma License Plate Slogan | Imagine That"
seo_description: "Imagine That became Oklahoma's standard license plate slogan in 2024, replacing the long-running Native America."
hero_image: /images/license-plates/oklahoma/2024-iconic-oklahoma.png
hero_image_alt: Oklahoma Iconic Oklahoma license plate with Imagine That slogan
hero_image_caption: Oklahoma's current Iconic Oklahoma plate uses the tourism slogan "Imagine That."
intro_text: "**\"Imagine That\"** is Oklahoma's current standard license plate slogan. It appears on the red **Iconic Oklahoma** plate introduced September 1, 2024. Earlier standard slogans include \"Native America,\" \"Explore Oklahoma,\" \"Oklahoma Is OK,\" \"OK!,\" and \"Visit Oklahoma.\" Older valid plates can still show earlier designs on Oklahoma roads. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "Oklahoma's current standard plate slogan is \"Imagine That,\" introduced September 1, 2024 on the Iconic Oklahoma plate. Earlier standard slogans include \"Visit Oklahoma\" from 1955-1962, \"Oklahoma Is OK\" from 1967-1978 and again in 1981-1988, \"OK!\" from 1989-1994, \"Native America\" from 1994-2016, \"Explore Oklahoma\" from 2017-March 2022, and TravelOK.com-only scissortail plates from March 2022-August 2024."
