sections:
- id: current-plate
  icon: fa-solid fa-star
  title: Current Iconic Oklahoma Plate
  paragraphs:
  - Oklahoma's current plate is the Iconic Oklahoma design, introduced September 1, 2024. It uses a red background, white serials, a white star separator, blue icon artwork along the bottom, and the slogan "IMAGINE THAT."
  - Service Oklahoma describes the plate as the state's new standard design, but it is not automatically forced on every existing vehicle. Existing scissor-tailed flycatcher plates can still be used, renewed, and transferred.
  - This means the current new-issue slogan is "Imagine That," while older valid plates may still show "Explore Oklahoma," "TravelOK.com," or earlier "Native America" wording.

- id: native-america
  icon: fa-solid fa-feather
  title: The Native America Era
  paragraphs:
  - "\"Native America\" began on Oklahoma plates in 1994, replacing the shorter \"OK!\" slogan. The phrase fit a plate design built around the Osage battle shield and Oklahoma's Native heritage."
  - In January 2009, Oklahoma introduced a screened plate featuring Allan Houser's "Sacred Rain Arrow" sculpture and continued "NATIVE AMERICA" in a blue bar at the bottom. That base won ALPCA's Plate of the Year for 2009.
  - The older file treated "Native America" as current since 1994, but that is no longer accurate. It was replaced as a standard plate slogan when the 2017 scissortail design introduced "Explore Oklahoma."

- id: oklahoma-is-ok
  icon: fa-solid fa-comment
  title: Oklahoma Is OK
  paragraphs:
  - Oklahoma first used "OKLAHOMA IS OK" in 1967. The phrase played on the state abbreviation while making a tourism-friendly self-endorsement.
  - The slogan ran on annual passenger plates from 1967 through 1975, paused for the 1976 Bicentennial plate, then appeared again in 1977 and 1978. It returned on the 1981-1982 base and evolved into "Oklahoma is OK!" on the 1983-1988 sunbelt plate.
  - In 1989, Oklahoma reduced the idea to just "OK!" on a plate with the Osage battle shield. That 1989 base won ALPCA's Plate of the Year.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Oklahoma License Plate Slogans by Era
  paragraphs:
  - Oklahoma's plate slogans move from a simple tourism invitation to abbreviation wordplay, then to Native identity, then to modern tourism branding.
