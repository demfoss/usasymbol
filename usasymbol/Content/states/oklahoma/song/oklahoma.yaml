lyrics_verses:
  - |-
    Brand new state, Brand new state, gonna treat you great!
    Gonna give you barley, carrots and pertaters,
    Pasture fer the cattle, Spinach and Termayters!
    Flowers on the prairie where the June bugs zoom,
    Plen'y of air and plen'y of room,
    Plen'y of room to swing a rope!
    Plen'y of heart and plen'y of hope!
  - |-
    Oklahoma, where the wind comes sweepin' down the plain,
    And the wavin' wheat can sure smell sweet
    When the wind comes right behind the rain.
    Oklahoma, ev'ry night my honey lamb and I
    Sit alone and talk and watch a hawk makin' lazy circles in the sky.
  - |-
    We know we belong to the land
    And the land we belong to is grand!
    And when we say, Yeeow! A-yip-i-o-ee ay!
    We're only sayin' You're doin' fine, Oklahoma!
    Oklahoma, O.K.
lyrics_note: "The song celebrates the excitement of Oklahoma statehood and frontier life, built around the refrain of the state's name spelled out in the melody, and remains under copyright through the Rodgers and Hammerstein organization."
