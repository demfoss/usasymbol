sections:
  - id: overview
    icon: fa-solid fa-music
    title: Oklahoma State Song
    paragraphs:
      - "\"Oklahoma\" is the state's official song, adopted in 1953. Richard Rodgers wrote the music and Oscar Hammerstein II wrote the words for the title number of their 1943 musical \"Oklahoma!,\" and a decade later state lawmakers claimed the song as their own."

  - id: what-is
    icon: fa-solid fa-compact-disc
    title: "\"Oklahoma\" Explained"
    paragraphs:
      - "The song is a fast, brassy march built around the phrase \"Oklahoma, O-K-L-A-H-O-M-A,\" spelled out note by note near the end. It captures a sense of wide-open land and fresh beginnings, sung in the musical by a group of settlers celebrating the territory's future as a state."
      - "Richard Rodgers composed the melody and Oscar Hammerstein II wrote the lyrics for the 1943 Broadway production, which was itself based on the play \"Green Grow the Lilacs\" by Oklahoma-born playwright Lynn Riggs. The show became one of the most successful musicals in Broadway history and later a 1955 film."
      - "Performances of \"Oklahoma!\" have been recorded by cast albums, film soundtracks, and orchestras for decades, and the song remains a fixture of Oklahoma football games and state ceremonies."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why "Oklahoma" Represents Oklahoma
    paragraphs:
      - "Lawmakers replaced an earlier, more solemn state song with \"Oklahoma\" because the show's title number matched the state's own name and carried an upbeat, forward-looking energy. The song's lyrics reference the state directly, something few borrowed show tunes can claim."
      - "The switch had a local champion in young state representative George Nigh, who argued the musical's song fit Oklahoma's identity better than the song it replaced. He arranged for an Oklahoma College for Women chorus and Ridge Bond, an Oklahoman who had played the lead role of Curly on Broadway, to perform the song for skeptical lawmakers."
      - "The demonstration won over the legislature, and \"Oklahoma\" passed into law as the state song later that year."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "\"Oklahoma\" Lyrics"

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How "Oklahoma" Became Oklahoma's State Song
    paragraphs:
      - "Oklahoma's original 1935 state song, \"Oklahoma, A Toast\" by Harriet Parker Camden, struck many as too slow and formal. George Nigh, then the youngest member of the state House, pushed to replace it with \"Oklahoma\" from the hit musical, and after a live performance won over holdout lawmakers, the legislature adopted the change in 1953."

  - id: other-state-songs
    icon: fa-solid fa-list
    title: Other Official Songs of Oklahoma

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "\"Oklahoma\" Facts"
    facts:
      - "Oklahoma adopted \"Oklahoma\" as its state song in 1953."
      - "The song comes from the 1943 Rodgers and Hammerstein musical \"Oklahoma!,\" first performed a decade before its state adoption."
      - "It replaced an earlier state song, \"Oklahoma, A Toast,\" adopted in 1935."
      - "State representative George Nigh led the push to adopt the song when he was just 23 years old."
      - "The musical was based on \"Green Grow the Lilacs,\" a play by Oklahoma native Lynn Riggs."

