title: Scissor-tailed Flycatcher
scientific_name: Tyrannus forficatus
adopted_year: 1951
legislation: 25 O.S. Sec. 98
meaning: Oklahoma's state bird works best as the bird the state chose instead of settling for a more ordinary winner. Historical summaries say the bobwhite had won a 1932 popularity contest, but lawmakers ultimately chose the Scissor-tailed Flycatcher because it was more distinctly tied to Oklahoma and had not been claimed by any other state.
author: USA Symbol Team
date_published: '2024-11-27'
date_modified: "2026-05-02"
seo_title: "Oklahoma State Bird | Scissor-tailed Flycatcher"
seo_description: Oklahoma adopted the Scissor-tailed Flycatcher in 1951 after passing over the bobwhite. The stronger story is why lawmakers chose a more distinctively Oklahoma bird.
intro_text: Oklahoma's official state bird is the <strong>Scissor-tailed Flycatcher</strong>, adopted on <strong>May 26, 1951</strong> and now listed in <strong>25 O.S. Sec. 98</strong>. Oklahoma did <strong>not</strong> settle for the more ordinary choice already sitting on the table. Historical summaries say the <strong>bobwhite quail</strong> had won a 1932 popularity contest, but lawmakers ultimately chose the scissortail instead — a bird centered in the state's nesting range and one no other state had claimed.
