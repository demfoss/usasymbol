sections:
  - id: overview
    icon: fa-solid fa-music
    title: Oklahoma State Dance
    paragraphs:
      - "Oklahoma named square dance its official state folk dance in 1988. The choice matched a set dance that already filled grange halls and county fairgrounds across the state's rural communities."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance arranges four couples into a square, each pair facing the center of the set. A caller directs the group through a changing sequence of figures, so no two dances play out exactly the same way."
      - "String-band music built around fiddle, guitar, and banjo drives the tempo. Dancers circle, exchange places, and reunite with their partners in patterns that always resolve back to the original square."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Line up four couples in a square, each pair facing the center with partners side by side."
      - title: "Honor Your Partner"
        description: "Bow or nod to your partner as the music begins, a traditional opening courtesy."
      - title: "Circle Right and Left"
        description: "Join hands with the full square and step together in a circle, reversing direction on the caller's cue."
      - title: "Allemande Left with Your Corner"
        description: "Turn and take your corner's left hand, walking a full turn before releasing."
      - title: "Promenade Home"
        description: "Take your partner's hands and walk together around the set back to your starting position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Oklahoma
    paragraphs:
      - "A national campaign by square-dance callers' associations and dance organizations pushed states through the 1970s and 1980s to name square dance an official state folk dance. Oklahoma's 1988 adoption followed that same wave."
      - "Rural Oklahoma communities had already built a dance culture around grange halls and county fairs, where square dance was a regular feature of local gatherings. The 1988 designation gave that existing custom an official place among the state's symbols."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Oklahoma's Dance
    paragraphs:
      - "The Oklahoma Legislature designated square dance the state's official folk dance in 1988."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Oklahoma adopted square dance as its official state folk dance in 1988."
      - "Oklahoma's designation followed a national campaign by square-dance callers' organizations urging states to adopt the dance officially."
      - "Square dance was already common at Oklahoma grange halls and county fairs before the state made it official."
      - "The dance is led by a caller and danced in sets of four couples to string-band music."

