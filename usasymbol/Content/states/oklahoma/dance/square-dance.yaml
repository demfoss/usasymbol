faq:
  - question: What is Oklahoma's state dance?
    answer: "Oklahoma's official state dance is square dance, adopted in 1988 as the state folk dance."
  - question: When did Oklahoma adopt square dance as its state dance?
    answer: "Oklahoma adopted square dance in 1988."
  - question: Why did Oklahoma choose square dance?
    answer: "Square dance already filled Oklahoma's rural grange halls and county fairs, and its 1988 adoption followed a national campaign by callers' associations urging states to name it an official folk dance."
  - question: Is square dance the same in every state?
    answer: "The basic formation and calls are shared nationally, though Oklahoma and many other states each adopted the dance separately as their own official folk dance."

