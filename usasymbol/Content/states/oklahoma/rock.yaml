faq:
  - question: What is Oklahoma's state rock?
    answer: "Oklahoma's state rock is the rose rock, a rosette of barite crystals shaped like a blooming rose, adopted in 1968."
  - question: When did Oklahoma adopt rose rock as its state rock?
    answer: "The Oklahoma Legislature designated rose rock the official state rock in 1968."
  - question: Why did Oklahoma choose rose rock?
    answer: "Rose rocks form in only a narrow band of central Oklahoma sandstone, and local collectors campaigned through the 1960s for the designation."
  - question: Where can you find rose rock in Oklahoma?
    answer: "Rose rocks form in Garber Sandstone outcrops from southern Lincoln County through Cleveland County, with the heaviest concentration around Noble."

