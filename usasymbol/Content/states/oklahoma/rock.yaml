intro_text: "Oklahoma's state rock is the rose rock, also called the barite rose, adopted in 1968 to recognize a barite crystal formation shaped like a blooming rose that grows almost exclusively around Noble, in Cleveland County. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Oklahoma State Rock
    paragraphs:
      - "Rose rock, also called barite rose, is Oklahoma's official state rock, designated by the Oklahoma Legislature in 1968. It is a cluster of reddish-brown barite crystals that grew into a shape resembling a blooming rose, found almost entirely around Noble, in Cleveland County."
      - "Oklahoma picked a formation nearly unique to its own red sandstone country rather than a rock traded widely elsewhere, giving the state a genuinely local symbol."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Rose Rock?"
    paragraphs:
      - "A rose rock is not a single mineral but a rosette of barite crystals that grew together as flat, petal-like blades radiating from a center point. Sand grains trapped between the blades give the formation its reddish-brown color and grainy texture, and finished specimens closely resemble the layered petals of a rose."
      - "Formations range from smaller than a coin to clusters spanning a foot or more across. Most grew inside the Garber Sandstone, a rock layer laid down roughly 250 million years ago during the Permian period."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Oklahoma Chose Rose Rock as Its State Rock"
    paragraphs:
      - "Rose rocks form almost entirely within a narrow band of Garber Sandstone running through Cleveland and Noble counties, making the formation close to unique in the world. Collectors campaigned through the 1960s for state recognition, and Noble grew into a local center for rose rock hunting."
      - "Lawmakers responded to that grassroots collecting culture, not a mining industry, when they named rose rock the state rock in 1968. Noble still holds an annual festival built around the stone."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Rose Rock Became Oklahoma's State Rock"
    paragraphs:
      - "Rock and mineral collectors petitioned the Oklahoma Legislature through the 1960s, and lawmakers passed the bill naming rose rock the official state rock in 1968."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Rose Rock Is Found in Oklahoma"
    paragraphs:
      - "Rose rocks form in outcrops of Garber Sandstone stretching from southern Lincoln County through Cleveland County, with the heaviest concentration around Noble. Diggers still find them in fields and road cuts near town, typically just a foot or two below the surface."
    sites:
      - name: Noble
        city: Noble
        lat: 35.1364
        lng: -97.3908
        note: "Center of Oklahoma rose rock formations"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Rose Rock Facts"
    facts:
      - "Adopted as Oklahoma's state rock in 1968."
      - "Formed inside the Garber Sandstone, laid down about 250 million years ago."
      - "Noble, Oklahoma holds an annual Rose Rock Festival celebrating the stone."
      - "Genuine rose rocks form in only a narrow band of central Oklahoma, making the state's deposits close to one of a kind."

