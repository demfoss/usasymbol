sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Oklahoma?
    paragraphs:
      - "The American bullfrog is Oklahoma's official state amphibian, designated by the Oklahoma Legislature in 1997. Its scientific name is Rana catesbeiana."
      - "It is the largest frog species native to North America and is common in ponds and lakes across the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the American Bullfrog
    paragraphs:
      - "The American bullfrog has smooth green to olive-brown skin, a large rounded body, and powerful hind legs built for jumping and swimming."
      - "Adults can grow to about 8 inches long and are known for their deep, booming call, which sounds like a low 'jug-o-rum' and can be heard from a distance."
      - "It spends most of its time in or near permanent water such as ponds, lakes, and slow streams."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Oklahoma Legislature designated the American bullfrog the official state amphibian in 1997, recognizing a frog familiar to people across the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Oklahoma Chose the American Bullfrog
    paragraphs:
      - "Official sources name the American bullfrog as the state amphibian but do not give a detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the American Bullfrog
    paragraphs:
      - "The American bullfrog lives in ponds, lakes, and slow-moving streams throughout Oklahoma, from the eastern forests to the western plains."
