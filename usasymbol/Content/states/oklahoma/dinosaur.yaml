seo_title: "Oklahoma State Dinosaur: Acrocanthosaurus atokensis"
seo_description: "Oklahoma's state dinosaur Acrocanthosaurus atokensis was named from Atoka County specimens in 1950. One of North America's largest predators, it left trackways from Texas to Wyoming. Learn the discovery story, the distinctive tall neural spines, and where to see specimens."

intro_text: "**Acrocanthosaurus atokensis** is Oklahoma's official state dinosaur, designated by Senate Bill 1048 in 2006. The name encodes two facts simultaneously: *Acrocanthosaurus* means 'high-spined lizard' — elongated neural spines along the vertebrae, up to 2.5 times the height of the bone centra, give the animal its distinctive silhouette — and *atokensis* means 'of Atoka,' the Oklahoma county where J. Willis Stovall and Wann Langston Jr. found the first specimens in 1950. The species name is a geographic record in the taxonomic literature, not just a label. One of the largest predators of Early Cretaceous North America, Acrocanthosaurus left tracks across Texas and Arkansas that are still visible today."

sections:

  - id: "the-tracks"
    icon: "fa-solid fa-shoe-prints"
    title: "Oklahoma's Dinosaur Left Tracks in Texas"
    paragraphs:
      - "Acrocanthosaurus is one of the few North American theropods whose footprints have been attributed with reasonable confidence. The large three-toed trackways at Dinosaur Valley State Park in Glen Rose, Texas — along the Paluxy River — are widely attributed to Acrocanthosaurus based on size and Early Cretaceous age. These are the most-visited Early Cretaceous theropod tracks in North America. Additional trackways in Arkansas and possibly Wyoming extend the attribution further. Oklahoma designated an animal whose physical presence — even the impression of its feet — reached across state lines."

  - id: "key-specimens"
    icon: "fa-solid fa-location-dot"
    title: "Where the Specimens Came From and Where They Are Now"
    subsections:
      - subtitle: "The Atoka County Specimens — Original Type Material"
        text: "The specimens Stovall and Langston described from Atoka County in 1950 came from the Antlers Formation — an Early Cretaceous deposit in southeastern Oklahoma and adjacent Texas. This material established the genus, named the species for the county, and provided the anatomical data for the original description. The type material that gave Acrocanthosaurus its name is from Oklahoma."
      - subtitle: "The McCurtain County Specimen — 'Fran'"
        text: "In 1983, amateur collectors Sid and Cephis Hall found a much more complete Acrocanthosaurus specimen in McCurtain County, Oklahoma. This specimen, nicknamed 'Fran,' spent years in private hands before being acquired by the North Carolina Museum of Natural Sciences in Raleigh, where it was prepared and is now mounted on display. Fran is the most complete Acrocanthosaurus specimen known and the basis for most modern reconstructions."
  - id: "2006-designation"
    icon: "fa-solid fa-scale-balanced"
    title: "Senate Bill 1048: Why Oklahoma Chose This Animal"
    paragraphs:
      - "Oklahoma Senate Bill 1048 designated Acrocanthosaurus atokensis as the state dinosaur in 2006. The case rested on something no other state can claim about its designated dinosaur: the species name is a permanent geographic record of the discovery county. *Atokensis* — 'of Atoka' — was assigned by Oklahoma paleontologists in 1950 and has never changed. Every citation in the scientific literature carries Oklahoma's county name."
      - "Oklahoma also chose a predator. Most state dinosaurs are herbivores — hadrosaurs, sauropods, ceratopsians. Acrocanthosaurus was the apex predator of its world: 11–12 meters, roughly 6,000 kilograms, with no competitor of comparable size in Early Cretaceous North America. The designation was a deliberate choice, not a default."
      - "There is one awkward detail the designation created. The most complete Acrocanthosaurus specimen — 'Fran,' found by Oklahoma collectors Sid and Cephis Hall in McCurtain County in 1983 — was acquired by the North Carolina Museum of Natural Sciences in Raleigh, where it is now mounted on display. Oklahoma's state dinosaur is best seen in North Carolina. The original type material, however, remains at the Sam Noble Museum in Norman — the specimens that gave the animal its name and its county."

