title: "Acrocanthosaurus atokensis"
adopted_year: 2006
legislation: "Oklahoma Senate Bill 1048 (2006)"
meaning: "Oklahoma's state dinosaur carries the county of its discovery in its species name — Atoka County, Oklahoma. This is not a generic honorific but a geographic record embedded in taxonomy: the name tells you where to look. And the animal itself left footprints across Texas and other states, making it one of the most geographically traceable large predators of Early Cretaceous North America."
