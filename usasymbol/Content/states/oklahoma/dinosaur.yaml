faq:
  - question: "What is Oklahoma's state dinosaur?"
    answer: "The county is in the name permanently. When Stovall and Langston named Acrocanthosaurus atokensis in 1950, they embedded Atoka County, Oklahoma in the species name — every scientific paper citing this animal carries that Oklahoma geography in its taxonomy. Oklahoma designated it as the official state dinosaur by Senate Bill 1048 in 2006. One of the largest predators of Early Cretaceous North America, at 11–12 meters, it left footprints visible in Texas today."

  - question: "What does Acrocanthosaurus mean?"
    answer: "Acrocanthosaurus means 'high-spined lizard' — from the Greek for high (akros), spine (akantha), and lizard (sauros). The name refers to the tall neural spines along the dorsal vertebrae that distinguish the genus."

  - question: "What were the tall spines for?"
    answer: "The function of Acrocanthosaurus's tall neural spines is debated. The most widely accepted interpretation is that they supported a muscular hump or ridge along the animal's back — too thick for a thin skin sail, but appropriate for anchoring large muscles. Thermoregulatory or fat-storage functions have also been proposed but not confirmed."

  - question: "Where can I see an Acrocanthosaurus skeleton?"
    answer: "The most complete specimen, 'Fran,' is mounted at the North Carolina Museum of Natural Sciences in Raleigh. The original type material — the Oklahoma specimens that gave the species its name — is at the Sam Noble Oklahoma Museum of Natural History in Norman."

  - question: "Did Acrocanthosaurus make the tracks at Glen Rose, Texas?"
    answer: "The large three-toed theropod tracks at Dinosaur Valley State Park in Glen Rose, Texas (Paluxy River tracksite), are widely attributed to Acrocanthosaurus based on their size and Early Cretaceous age. This attribution is well-supported but circumstantial — no direct skeletal association with the tracks exists. Acrocanthosaurus is the best-known large theropod from the correct time period in the region."

