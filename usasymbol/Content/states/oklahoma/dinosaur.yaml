faq:
  - question: "What is Oklahoma's state dinosaur?"
    answer: "Oklahoma's state dinosaur is Acrocanthosaurus atokensis. It was adopted in 2006."

  - question: "What does Acrocanthosaurus mean?"
    answer: "Acrocanthosaurus means 'high-spined lizard.'"

  - question: "What were the tall spines for?"
    answer: "They likely supported a muscular ridge or hump along the back."

  - question: "Where can I see an Acrocanthosaurus skeleton?"
    answer: "The Sam Noble Museum in Norman is the main Oklahoma site to see related material."

  - question: "Did Acrocanthosaurus make the tracks at Glen Rose, Texas?"
    answer: "Possibly. It is the leading candidate for those large Early Cretaceous tracks."

