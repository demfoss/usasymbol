type: State Coat of Arms
state: Oklahoma
name: Oklahoma State Coat of Arms
adopted_year: 1907
is_official: true
legislation: Oklahoma Statutes Title 25, § 91
meaning: "The Oklahoma coat of arms is built around a single structural argument: two peoples and two territories became one state. A five-pointed star holds the seal of each of the Five Civilized Tribes in its points, and a Native American warrior and a frontiersman shake hands at its center. Forty-six stars around the border fix the design to a specific moment: the day Oklahoma entered the Union as the 46th state on November 16, 1907."
meaning_title: Meaning of the Oklahoma Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Oklahoma Coat of Arms: Meaning, Symbols and History'
seo_description: "The Oklahoma coat of arms was adopted in 1907 and shows a five-pointed star with five tribal seals, representing Oklahoma as the 46th state."
hero_image: /images/coats-of-arms/oklahoma/coat-of-arms.webp
