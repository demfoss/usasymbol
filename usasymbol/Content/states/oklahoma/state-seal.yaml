name: Great Seal of Oklahoma
adopted_year: 1907
revised_year: null
is_official: true
legislation: Oklahoma Statutes Title 25, § 91
meaning: "The Great Seal of Oklahoma is built around a single structural argument: that two peoples and two territories became one state. A five-pointed star occupies the center, with each point carrying the seal of one of the Five Civilized Tribes (the Cherokee, Choctaw, Chickasaw, Creek, and Seminole nations) who had governed eastern Indian Territory before statehood. At the star's center, a Native American warrior and a frontiersman shake hands in the seal's most direct image. Forty-six small stars around the outer border confirm Oklahoma's place as the 46th state, admitted to the Union on November 16, 1907."
