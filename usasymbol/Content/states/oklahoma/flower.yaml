seo_title: "Oklahoma State Flower: Oklahoma Rose"
seo_description: "The Oklahoma Rose became Oklahoma's state flower in 2004. This designation replaced the mistletoe and allows all rose varieties to represent the state."

intro_text: "Oklahoma officially recognized the Oklahoma Rose as its state flower in 2004, adding it to the [list of U.S. state flowers](/symbols/flowers). This designation replaced mistletoe which had served since 1893. The broad classification allows all rose varieties to represent Oklahoma from wild native species to cultivated garden roses."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Oklahoma State Flower?"
    paragraphs:
      - "Oklahoma's floral emblem, the Oklahoma Rose, dates back to 2004. The designation encompasses all rose varieties growing in the state. Each bloom displays layers of petals arranged in circular patterns. Flower colors range from white and pink to red, yellow, and orange. The blooms measure 2 to 5 inches across depending on variety. Sharp thorns line the stems."
      - "Roses bloom from May through October across Oklahoma. Peak flowering occurs in June for most varieties. Some modern roses produce flowers continuously throughout the growing season. Plants grow as shrubs ranging from 2 to 8 feet tall. Compound leaves with serrated edges cover the canes. Rose hips form after flowers fade in fall providing food for wildlife."
      - "Wild roses native to Oklahoma include Rosa arkansana, known as prairie rose, and Rosa foliolosa, called white prairie rose. These species grow naturally in Oklahoma's prairies, woodlands, and rocky hillsides. The Arbuckle Mountains, Wichita Mountains, and Tallgrass Prairie areas support native populations. Cultivated garden roses thrive in Oklahoma gardens from the panhandle to the Red River. Both wild and domestic varieties tolerate Oklahoma's variable climate with hot summers and occasional droughts."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Oklahoma State Flower Name"
    paragraphs:
      - "Known as Oklahoma Rose, this designation uses the scientific genus name Rosa. The genus belongs to the Rosaceae family. This enormous family includes over 3,000 species of roses, apples, cherries, and other flowering plants worldwide."
      - "The genus name Rosa comes from the Latin word for rose. Over 300 species exist in the genus Rosa worldwide. Wild roses native to Oklahoma include Rosa arkansana, which grows in prairies, and Rosa foliolosa, found in rocky areas. Garden roses trace ancestry to species from multiple continents through centuries of hybridization."
      - "Oklahoma intentionally chose a broad designation. The 2004 legislation specified Oklahoma Rose without naming a particular species, color, or variety. This allows all roses growing in Oklahoma to serve as state symbols. Native wild roses and cultivated ornamental varieties equally represent the state. The inclusive approach differs from states that designated specific rose colors."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Oklahoma Rose Became the State Flower"
    paragraphs:
      - "Oklahoma adopted the Oklahoma Rose as its official state flower in 2004. This change replaced mistletoe, which Oklahoma had used since 1893 during territorial days. Mistletoe created controversy because the parasitic plant damages trees. Many Oklahomans considered it an inappropriate symbol for the state."
      - "State Representative Don Ross introduced legislation to change the state flower. He argued roses better represented Oklahoma's beauty and agricultural heritage. Roses grew successfully throughout Oklahoma. The state's rose growers supported the change. Oklahoma's climate suited rose cultivation from Tulsa to Oklahoma City, in the same statewide tradition reflected by [the Sooner State nickname](/states/oklahoma/nickname/the-sooner-state)."
      - "Some legislators initially resisted changing a symbol that had represented Oklahoma for over a century. Supporters emphasized that mistletoe was never popular and many residents didn't know it was the state flower. The rose enjoyed universal recognition and positive associations. The Oklahoma Legislature passed the new designation on April 27, 2004. Oklahoma became one of few states to officially replace its state flower, while keeping civic continuity with [Oklahoma's state motto](/states/oklahoma/motto/labor-omnia-vincit)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Oklahoma State Flower Facts"
    facts:
      - "Oklahoma replaced mistletoe with the rose in 2004 because mistletoe is a parasitic plant that damages trees and was considered an inappropriate state symbol"
      - "Wild roses native to Oklahoma include Rosa arkansana in prairies and Rosa foliolosa in the Arbuckle and Wichita Mountains rocky areas"
      - "Oklahoma adopted the Oklahoma Rose on April 27, 2004, after mistletoe had served as the territorial and state flower since 1893"
      - "The designation intentionally uses a broad classification allowing all rose varieties to represent Oklahoma rather than specifying one color or species"
      - "Oklahoma's rose industry benefits from the state's climate which supports both commercial rose production and extensive home gardening"
      - "Representative Don Ross championed the change, arguing roses better represented Oklahoma's beauty and agricultural heritage than a parasitic plant"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Oklahoma State Flower and Bird"
    paragraphs:
      - "The Scissor-tailed Flycatcher serves as Oklahoma's state bird, a distinctive bird with an extremely long forked tail. Both symbols represent Oklahoma officially. Oklahoma adopted the Oklahoma Rose in 2004 and designated the Scissor-tailed Flycatcher as state bird in 1951; compare [the flycatcher profile](/states/oklahoma/bird/scissor-tailed-flycatcher)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Oklahoma Rose Symbolizes"
    paragraphs:
      - "The Oklahoma Rose is often associated with beauty, resilience, and Oklahoma's diverse landscapes. Different rose colors traditionally symbolize different emotions. Red represents love. White symbolizes purity. Yellow indicates friendship. The flower carries connotations of Oklahoma's agricultural heritage and the state's ability to cultivate beauty despite challenging climate conditions, together with native spring displays of [the redbud state tree](/states/oklahoma/tree/redbud)."

  - id: context
    icon: "fa-solid fa-chart-column"
    title: "Modern Context"
    paragraphs:
      - "Broader demographic context for symbol adoption eras appears in [U.S. states by population](/rankings/demographics/states-by-population)."

faq:
  - question: "What is Oklahoma's state flower?"
    answer: "Oklahoma's state flower is the Oklahoma Rose, a designation that encompasses all rose varieties growing in the state from wild native species to cultivated garden roses."
  
  - question: "When did Oklahoma adopt the Oklahoma Rose as its state flower?"
    answer: "Oklahoma adopted the Oklahoma Rose on April 27, 2004. This designation replaced mistletoe which had served as the state flower since 1893."
  
  - question: "Why did Oklahoma change its state flower?"
    answer: "Oklahoma changed from mistletoe to the rose because mistletoe is a parasitic plant that damages trees. Many Oklahomans considered it an inappropriate symbol. Representative Don Ross argued roses better represented Oklahoma's beauty and agricultural heritage. Roses grow successfully throughout the state and enjoy universal recognition."
  
  - question: "Which roses are native to Oklahoma?"
    answer: "Wild roses native to Oklahoma include Rosa arkansana, known as prairie rose, which grows in prairies, and Rosa foliolosa, called white prairie rose, found in rocky areas of the Arbuckle and Wichita Mountains."
  
  - question: "What was Oklahoma's state flower before the rose?"
    answer: "Mistletoe was Oklahoma's state flower from 1893 until 2004. Oklahoma adopted mistletoe during territorial days, but the parasitic plant created controversy and was eventually replaced by the rose."

