- id: facts
  icon: fa-solid fa-lightbulb
  title: White Bass Facts
  facts:
  - Adopted in 1974 by the Oklahoma Legislature.
  - Its scientific name is Morone chrysops.
  - Oklahomans often call it the sand bass.
  - Most weigh half a pound to a pound and a half.
  - Longtime anglers say the spring run starts when redbud trees bloom.
faq:
- question: What is Oklahoma's state fish?
  answer: Oklahoma's state fish is the white bass, also known as the sand bass. The Oklahoma Legislature adopted it in 1974.
- question: When did Oklahoma adopt the White bass?
  answer: The white bass became the state fish in 1974. The law took effect on April 13 of that year.
- question: Why did Oklahoma choose the White bass?
  answer: State law does not give a detailed reason. The white bass is native to Oklahoma and is one of the most popular fish with the state's anglers.
- question: Why is the white bass called the sand bass in Oklahoma?
  answer: Sand bass is the local nickname for the white bass in Oklahoma. State law lists both names. Adult white bass often move onto shallow, sandy shoals at night.
- question: How can you tell a white bass from a striped bass?
  answer: A white bass has a high, arched back just behind its head. A striped bass has a flatter back and grows much larger.
