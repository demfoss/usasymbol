seo_title: Oklahoma State Fish | White Bass
seo_description: The Oklahoma state fish is the white bass, adopted in 1974. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/oklahoma/oklahoma-fish-hero.webp
