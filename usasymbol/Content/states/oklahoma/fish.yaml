intro_text: Oklahoma's state fish is the white bass, a silver, striped game fish that Oklahomans often call the sand bass, adopted in 1974. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Oklahoma?
  paragraphs:
  - The white bass became Oklahoma's official state fish in 1974. State law also calls it by its local nickname, the sand bass.
  - Its scientific name is Morone chrysops. It lives in lakes and rivers all across Oklahoma.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the White Bass
  paragraphs:
  - The white bass is a silver fish with thin, dark stripes running along its sides.
  - The easiest way to recognize it is the high, arched back just behind its head. It looks a lot like the striped bass and the hybrid striped bass, but those fish have flatter backs.
  - Most white bass weigh between half a pound and a pound and a half. They can grow up to five pounds, but they rarely get bigger than three and a half pounds.
  - White bass usually swim in large schools and stay on the move as they chase schools of small fish called shad.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Oklahoma Legislature named the white bass the official state fish in 1974. The law took effect on April 13, 1974.
  - The law names both the scientific name and the nickname sand bass, so both names are part of the official record.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Oklahoma Chose the White Bass
  paragraphs:
  - State law names the white bass without giving a detailed reason.
  - The fish is native to Oklahoma and very popular with anglers. Biologists estimate that anglers catch about one and a half million pounds of white bass in Oklahoma every year.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the White Bass
  paragraphs:
  - The white bass is native to Oklahoma, but it was not common until people built large reservoirs. Now it lives in lakes statewide.
  - In spring, white bass swim up creeks and rivers to spawn. Grand Lake and the Spring and Neosho rivers in northeast Oklahoma are well-known spots. Lake Altus-Lugert near Quartz Mountain State Park is a popular spot in the southwest.
