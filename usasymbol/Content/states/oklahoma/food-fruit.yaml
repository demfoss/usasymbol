sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Oklahoma's State Fruit?"
    paragraphs:
      - "The strawberry is Oklahoma's official state fruit, designated by the Oklahoma Legislature in 2005. Strawberry farming has deep roots in Adair County, especially around the town of Stilwell."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Strawberry"
    paragraphs:
      - "Strawberries are small red fruits with seeds on the outside of their flesh, grown on low plants. In Oklahoma they ripen in late spring, and are grown both commercially and in home gardens across the state."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Strawberry Became Oklahoma's State Fruit"
    paragraphs:
      - "The Oklahoma Legislature designated the strawberry the official state fruit in 2005."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Oklahoma Chose the Strawberry"
    paragraphs:
      - "Stilwell, in Adair County, was once known as the Strawberry Capital of the World for its large strawberry shipments in the mid 1900s, and the town still holds the Stilwell Strawberry Festival each May."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Strawberry Comes From in Oklahoma"
    paragraphs:
      - "Stilwell, in northeastern Oklahoma's Adair County, is historically the center of the state's strawberry farming and hosts the annual Stilwell Strawberry Festival."
