title: "Labor Omnia Vincit"
language: "Latin"
english_translation: "Labor Conquers All Things"
adopted_year: 1907

author: "USA Symbol Team"
date_published: "2025-12-04"
date_modified: "2026-04-16"
seo_title: "Oklahoma State Motto | Labor Omnia Vincit! Labor Conquers All Things!"
seo_description: "Oklahoma's motto comes from Virgil's Georgics (29 BC), written to support Augustus Caesar's farming campaign. The man who put it on the territorial seal in 1893 was himself a 'sooner' — he illegally entered the territory the day before the land run. Oklahoma's state seal is the only one depicting tribal symbols from all Five Civilized Tribes inside a five-pointed star."

intro_text: "Oklahoma's state motto is <strong>Labor Omnia Vincit</strong> — Latin for <em>Labor Conquers All Things</em>. The phrase comes from Virgil's <em>Georgics</em> (29 BC), a poem written to support Emperor Augustus's Back to the Land farming campaign. Frank Hilton Greer placed it on the territorial seal in 1893 — the same man who had illegally entered Oklahoma Territory the day before the April 22, 1889 land run by hiding in a freight car, becoming a sooner himself. The motto carried forward unchanged when Gabe Parker's committee designed the state seal at statehood in 1907, incorporating symbols from all five of the Civilized Tribes."

sections:
  - id: "virgil-and-augustus"
    icon: "fa-solid fa-scroll"
    title: "From Virgil's Farming Poem to an Oklahoma Land-Run Territory"
    paragraphs:
      - "Virgil wrote <em>Georgics</em> in 29 BC as a four-book poem on agriculture, commissioned to support Emperor Augustus's campaign to encourage Romans back to farming after decades of civil war. Book I, lines 145-146, contains the passage: <em>Labor omnia vicit improbus</em> — 'relentless toil conquered all things.' The word <em>improbus</em> means persistent or relentless; Oklahoma dropped that word and uses the shortened <em>Labor Omnia Vincit</em>."
      - "Frank Greer selected the phrase for the Oklahoma territorial seal in 1893 because the territory's entire economy rested on agricultural settlement. Settlers arriving in land runs broke prairie sod, drilled wells, and built farms through physical labor. The motto's agricultural origin matched the territory's reality: success required exactly the relentless toil Virgil had described."
      - "The phrase also had a second life in the American labor movement. The American Federation of Labor and other early unions adopted 'Labor omnia vincit' as a rallying phrase in the late 19th century — the same era Greer proposed it for Oklahoma. Whether Greer drew from Virgil directly or from contemporary labor organizing is unclear; both currents fed the phrase's cultural meaning in 1893."

  - id: "greer-the-sooner"
    icon: "fa-solid fa-person-running"
    title: "The Man Who Chose the Motto Was Himself a Sooner"
    paragraphs:
      - "Frank Hilton Greer arrived in the Unassigned Lands on April 21, 1889 — the day before the official land run opening — by hiding in a freight car loaded with telephone poles. He jumped off the train ten minutes after noon on April 22, staked a claim, and started a newspaper called the <em>Daily State Capital</em> with twenty-nine dollars. This made Greer himself a sooner: someone who entered the territory illegally before the starting gun."
      - "Greer won election to the Territorial Legislature in 1892. When the Second Territorial Legislature convened in Guthrie in January 1893, he drafted House Bill 66 describing a Great Seal for Oklahoma Territory. His design included the five-pointed star, agricultural imagery, and the motto <em>Labor Omnia Vincit</em>. The legislature passed the bill and the seal became official on March 10, 1893."
      - "The same man who broke the rules to enter Oklahoma Territory then chose a motto about the virtue of hard work and honest labor. Greer's later career as editor and civic booster in Guthrie never publicly acknowledged his sooner status, but his seal design — featuring a motto about labor conquering all — became the territory's official statement of values."

  - id: "five-tribes-seal"
    icon: "fa-solid fa-star"
    title: "The Seal That Combined Two Territories"
    paragraphs:
      - "When Oklahoma Territory and Indian Territory merged at statehood in 1907, the seal committee faced a problem: Indian Territory had proposed its own seal for the State of Sequoyah, a separate statehood bid that Congress had rejected in 1905. Gabriel Edward Parker, one-eighth Choctaw and chairman of the seal committee, resolved it by combining both."
      - "Parker sketched a design placing the territorial motto inside a five-pointed star, with each of the star's five rays dedicated to one of the Five Civilized Tribes: Cherokee, Chickasaw, Choctaw, Creek, and Seminole. Each ray holds the nation's specific seal symbol. Forty-five small stars surround the central design, representing the existing states when Oklahoma entered as the 46th. Parker earned the nickname 'Great Seal Parker' for the work."
      - "The Curtis Act of 1898 had already abolished tribal courts and governments, and the Dawes Commission had replaced communal tribal land ownership with individual allotments — systematically dismantling the political sovereignty of the Five Civilized Tribes before statehood. The 1907 seal incorporated their symbols prominently even as the federal process that made Oklahoma statehood possible had stripped the tribes of their governmental authority."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Oklahoma State Motto Facts"
    style: "gradient"
    facts:
      - "Frank Greer, who put the motto on the territorial seal, was himself a sooner — he entered Oklahoma Territory illegally the day before the April 22, 1889 land run."
      - "The phrase comes from Virgil's Georgics (29 BC), written to support Emperor Augustus Caesar's Back to the Land farming campaign."
      - "Oklahoma dropped the word 'improbus' (relentless/persistent) from Virgil's full phrase 'Labor omnia vicit improbus.'"
      - "Gabe Parker earned the nickname 'Great Seal Parker' for designing the 1907 state seal that combined territorial and Sequoyah symbols."
      - "Oklahoma became the 46th state on November 16, 1907 — the 45 small stars on the seal represent the existing states at admission."
      - "The American Federation of Labor used 'Labor omnia vincit' as a labor movement rallying phrase in the same era Greer proposed it for Oklahoma."

faq:
  - question: "What is Oklahoma's state motto?"
    answer: "Oklahoma's state motto is 'Labor Omnia Vincit,' a Latin phrase meaning 'Labor Conquers All Things.' It has appeared on the Oklahoma seal since 1893, when the territorial legislature adopted it, and carried forward unchanged at statehood in 1907."

  - question: "Where does Oklahoma's motto come from?"
    answer: "From Virgil's Georgics, Book I, written in 29 BC. The full line is 'Labor omnia vicit improbus' — 'relentless toil conquered all things.' Oklahoma uses the shortened form without 'improbus' (relentless). Frank Hilton Greer selected the phrase when designing the territorial seal in 1893, drawing on the phrase's agricultural associations and its use by American labor unions of the era."

  - question: "What language is Oklahoma's motto written in?"
    answer: "Latin. 'Labor' means work or toil, 'omnia' means all things, and 'vincit' comes from 'vincere' meaning to conquer or overcome. The phrase was common in classical Latin literature before Greer adapted it for Oklahoma Territory."

  - question: "When did Oklahoma adopt its motto?"
    answer: "The territorial legislature adopted it on March 10, 1893, as part of Frank Greer's territorial seal design (House Bill 66). It carried forward unchanged when the constitutional convention designed the state seal in 1907. Oklahoma became a state on November 16, 1907, when President Theodore Roosevelt signed the admission proclamation."

  - question: "Where does Oklahoma's motto appear?"
    answer: "In the center of the five-pointed star on Oklahoma's Great Seal. The star's five rays each hold symbols from one of the Five Civilized Tribes — Cherokee, Chickasaw, Choctaw, Creek, and Seminole. The seal appears on official state documents, government letterhead, and state agency materials."

  - question: "Why did Oklahoma choose a motto about labor?"
    answer: "Frank Greer selected it in 1893 because Oklahoma Territory's economy was entirely agricultural — settlers arriving through land runs depended on physical labor to break prairie sod and build farms. The phrase also resonated with the American labor movement of the 1890s, which used 'Labor omnia vincit' as a rallying phrase. The Virgilian reference connected frontier farming culture to Roman agricultural ideals."

