seo_title: "Oklahoma State Tree | Redbud"
seo_description: 'Oklahoma adopted redbud in 1937, choosing a small native tree whose pink spring flowers were associated with renewal after Dust Bowl years.'

intro_text: "Oklahoma adopted the Redbud as its state tree in 1937. Its early pink spring bloom made it a natural symbol in a state where seasonal change arrives dramatically and visibly across roadsides, woodlands, and hillsides."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Oklahoma"
    paragraphs:
      - "Oklahoma's official state tree is the Redbud, also called Eastern Redbud. This small deciduous tree grows 20 to 30 feet tall in Oklahoma, rarely exceeding 35 feet. The trunk measures six to twelve inches in diameter on mature trees. Redbud grows at a moderate pace, adding 12 to 18 inches per year in favorable conditions. The tree typically lives 50 to 70 years in Oklahoma. Unlike many state trees valued for timber, redbud's importance lies in its ornamental beauty and symbolic significance. The wood has no commercial value and the tree is too small for lumber. Yet redbud earned state tree status because its brilliant spring blooms create one of Oklahoma's most anticipated natural events each year."
      - "The flowers provide the tree's main attraction and give redbud its common name. Small pink to purple pea-like flowers appear in dense clusters directly on branches and even the trunk before leaves emerge. This unusual flowering pattern, called cauliflory, makes blooming redbuds especially dramatic. The flowers measure about half an inch long and cover branches so densely they hide the bark. Individual trees show color variations from deep magenta to light pink. The blooming period lasts two to three weeks in March and April depending on weather. After flowering, heart-shaped leaves emerge, measuring three to five inches across. The leaves appear glossy dark green in summer and turn yellow in fall before dropping. By late summer, flat brown seed pods develop, measuring two to four inches long."
      - "Redbud grows throughout Oklahoma in every county. The species thrives in Oklahoma's diverse environments from moist eastern forests to drier western prairies. The tree grows naturally along woodland edges, in forest understories, and on rocky hillsides. Redbud tolerates Oklahoma's temperature extremes, surviving both summer heat exceeding 110°F and occasional winter cold near zero. The tree adapts to various soils from clay to sand, though it prefers well-drained sites. Redbud requires minimal water once established, making it well-suited to Oklahoma's variable rainfall. The tree grows alongside Oklahoma's mix of oak, hickory, and pine in eastern counties, and persists as an isolated understory tree even in the state's grassland regions. Wildlife value includes nectar for early-season bees and seeds for birds."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Redbud"
    paragraphs:
      - "The official name is Redbud, though Eastern Redbud distinguishes this species from western and other redbud species. The common name refers to the reddish flower buds that appear before blooming. The scientific name Cercis canadensis combines Cercis (Greek for weaver's shuttle, describing the seed pod shape) with canadensis (meaning of Canada), though the tree grows far south of Canada throughout Oklahoma and the eastern United States. Early Oklahomans called it Judas tree, a name brought from Europe based on legend that Judas hanged himself from a redbud relative."
      - "Some references use spicewood or salad tree, the latter from young flowers and pods being edible. Native American tribes had various names - the Cherokee made dye from the bark. The genus Cercis includes about 10 species worldwide. The species belongs to the Fabaceae family, the pea or legume family, evident in the pea-like flowers and seed pods. Oklahoma's redbud is the same species found throughout the eastern United States, though Oklahoma trees show greater drought tolerance than those in wetter climates. The tree's adaptability to Oklahoma's variable conditions made it an ideal state symbol representing resilience."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Redbud Became the Oklahoma State Tree"
    paragraphs:
      - "Oklahoma proclaimed the Redbud as its official state tree on February 16, 1937. The Oklahoma Legislature passed Senate Concurrent Resolution No. 8 during the 1937 session. The designation came during Oklahoma's recovery from the Dust Bowl years when spring bloom carried extra weight. By 1937, redbud had become closely associated with Oklahoma spring and the renewal that followed harsh prairie winters and devastating dust storms. The tree's ability to thrive despite difficult conditions resonated with Oklahomans rebuilding their state, consistent with [the Sooner State story](/states/oklahoma/nickname/the-sooner-state)."
      - "Oklahoma selected redbud because it grows naturally throughout the entire state, from the Ozark hills in the northeast to the shortgrass prairie in the Panhandle. This statewide distribution meant every Oklahoma county could claim the state tree. The spring blooms provided a cultural touchstone - the appearance of pink redbud flowers signaled winter's end and spring's arrival across Oklahoma. For pioneers settling Oklahoma Territory in the late 1800s, redbud blooms marked the time for planting crops and starting farm work. Native American tribes including the Cherokee, Choctaw, and Creek had long recognized redbud as a spring indicator plant, with similar civic framing in [Oklahoma's state motto](/states/oklahoma/motto/labor-omnia-vincit)."
      - "The tree held practical and symbolic importance for Oklahoma communities. Native Americans used redbud bark to make fiber for weaving and extracted red-brown dye for coloring textiles. Settlers learned these uses and added their own - the young flowers and seed pods are edible and were eaten as spring greens when other food was scarce. Oklahoma children played with the flat seed pods as whistles. The tree's modest size made it perfect for Oklahoma homesteads where it provided spring beauty without growing large enough to interfere with buildings or power lines. During the Dust Bowl, redbud's survival when other vegetation died represented hope and persistence. The 1937 designation honored a tree that had witnessed Oklahoma's transformation from Indian Territory to state, survived the Dust Bowl alongside Oklahomans, and announced each year's renewal with spectacular blooms. Unlike state trees chosen for timber value, redbud earned its status through spring bloom, local use, and the shared experience of its spring display connecting all Oklahomans regardless of where they lived. The tree represented Oklahoma's resilience and the democratic principle that a state symbol should be accessible to everyone."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Oklahoma State Tree Facts"
    facts:
      - "Oklahoma proclaimed Redbud as state tree on February 16, 1937, during recovery from Dust Bowl years"
      - "The pink to purple flowers bloom directly on branches and trunk before leaves emerge - this unusual pattern is called cauliflory"
      - "Redbud grows naturally in all 77 Oklahoma counties, making it truly representative of the entire state"
      - "Young flowers and immature seed pods are edible and were eaten as spring greens by Native Americans and settlers"
      - "The tree belongs to the pea family (Fabaceae), evident in its pea-like flowers and flat seed pods"
      - "Native American tribes including the Cherokee used redbud bark to make red-brown dye for coloring textiles"
      - "Redbud tolerates Oklahoma's extreme climate, surviving 110°F summer heat and near-zero winter cold with minimal water"
      - "The heart-shaped leaves and pink spring blooms make redbud one of Oklahoma's most recognizable native trees"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Oklahoma State Tree and Flower"
    paragraphs:
      - "Oklahoma's state flower is the Oklahoma Rose, designated in 2004 after replacing mistletoe. The state chose its tree symbol decades earlier. Both symbols feature seasonal color - redbud's pink to purple blooms and rose varieties spanning red, white, yellow, and pink. The pair covers Oklahoma's landscapes from woodland edges where redbud grows to gardens and prairies where roses thrive; compare [the Oklahoma rose profile](/states/oklahoma/flower/oklahoma-rose)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize an Oklahoma Redbud"
    paragraphs:
      - "The spring flowers create the most distinctive identification feature. Look for small pink to purple pea-like flowers covering bare branches in March and April. The flowers grow in dense clusters directly on branches and even on the trunk - this trunk-flowering pattern is unusual among Oklahoma trees. Each flower measures about half an inch long with a typical pea flower shape. Color ranges from deep magenta to light pink depending on the individual tree. The flowers appear before any leaves, making blooming redbuds highly visible. After two to three weeks, petals fall and leaves begin emerging."
      - "The leaves provide identification after flowering ends. Each leaf has a distinctive heart shape measuring three to five inches across. The leaf appears glossy green on top with a lighter underside. Leaves attach to twigs in an alternate pattern with one leaf per node. The leaf edges are completely smooth without teeth or lobes. In fall, leaves turn yellow before dropping. By late summer, flat seed pods develop, hanging in clusters from branches. Each pod measures two to four inches long and half an inch wide, turning from green to brown as it matures. The pods persist through winter."
      - "The overall form shows a small tree or large shrub with a rounded, spreading crown. Young redbuds often grow as multi-trunked shrubs. Mature trees develop a single trunk or multiple trunks dividing near the ground. The crown spreads nearly as wide as the tree is tall, creating a rounded silhouette. Branches grow in a somewhat irregular, zigzagging pattern. The bark appears smooth and gray on young trees, developing shallow furrows and a slightly scaly texture with age. Old redbuds show dark brown bark with vertical furrows. Twigs are slender and zigzag slightly. Winter buds are tiny and reddish-brown, barely visible."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Oklahoma State Tree Symbolizes"
    paragraphs:
      - "Redbud represents Oklahoma's resilience and renewal. The tree symbolizes hope and survival - blooming spectacularly each spring despite Oklahoma's harsh conditions. For Oklahomans, redbud blooms signal winter's end and new beginnings. The tree reflects Oklahoma's pioneer spirit, thriving where conditions challenge most plants. Redbud's statewide presence makes it a democratic symbol - every Oklahoman can experience the state tree regardless of location. The spring display creates shared experience across Oklahoma's diverse regions and populations. The tree represents how beauty and meaning can come from modest sources - a small tree with no timber value but enormous cultural significance through its annual gift of color and hope, including habitat for [the Scissor-tailed Flycatcher](/states/oklahoma/bird/scissor-tailed-flycatcher)."

  - id: context
    icon: "fa-solid fa-chart-line"
    title: "Statewide Context"
    paragraphs:
      - "Long-term scale and growth comparisons can be reviewed in [U.S. states by population](/rankings/demographics/states-by-population)."

faq:
  - question: "What is the Oklahoma state tree?"
    answer: "The Redbud (Cercis canadensis) is Oklahoma's official state tree. The Oklahoma Legislature proclaimed it on February 16, 1937, during the state's recovery from the Dust Bowl years."
  
  - question: "What is the Oklahoma state tree called?"
    answer: "Oklahoma's state tree is called Redbud or Eastern Redbud. The scientific name is Cercis canadensis. It's also been called Judas tree, spicewood, or salad tree. The name redbud comes from the reddish flower buds that appear before blooming."
  
  - question: "When was the Oklahoma state tree adopted?"
    answer: "Oklahoma proclaimed the Redbud as its official state tree on February 16, 1937. The Legislature passed Senate Concurrent Resolution No. 8 during the 1937 session, choosing a tree that had survived the Dust Bowl alongside Oklahomans."
  
  - question: "Why is the Redbud Oklahoma's state tree?"
    answer: "Oklahoma chose Redbud because it grows naturally in all 77 counties - truly representing the entire state. The spectacular pink to purple spring blooms announce winter's end and spring's arrival across Oklahoma. Pioneers and Native Americans recognized redbud blooms as markers for planting crops. The tree survived the Dust Bowl, symbolizing resilience. Unlike timber trees, redbud earned status through beauty and cultural significance. The tree is small enough for every homestead and creates a shared spring experience connecting all Oklahomans."
  
  - question: "What is the Oklahoma state tree name?"
    answer: "The name is Redbud, referring to reddish flower buds. The scientific name is Cercis canadensis - Cercis means weaver's shuttle (describing seed pods), and canadensis means 'of Canada' though the tree grows throughout Oklahoma and the South."
  
  - question: "Where does the Oklahoma state tree grow?"
    answer: "The Redbud grows throughout Oklahoma in all 77 counties. It thrives in diverse environments from moist eastern forests to drier western prairies. The tree grows along woodland edges, in forest understories, and on rocky hillsides. Redbud grows naturally throughout the eastern United States."
  
  - question: "What are some facts about the Oklahoma state tree?"
    answer: "The Redbud grows 20 to 30 feet tall with pink to purple flowers blooming directly on branches and trunk before leaves emerge. Oklahoma adopted it in 1937 during Dust Bowl recovery. It grows in all 77 Oklahoma counties. Young flowers and pods are edible. Native Americans used bark for red-brown dye. The tree belongs to the pea family. It tolerates extreme Oklahoma climate with minimal water. Heart-shaped leaves turn yellow in fall."
  
  - question: "How do you recognize the Oklahoma state tree?"
    answer: "Look for pink to purple pea-like flowers covering bare branches in March and April. Flowers bloom directly on branches and trunk - unusual among trees. Heart-shaped leaves (three to five inches) emerge after flowering. Flat brown seed pods (two to four inches long) hang from branches in late summer. The tree forms a small, rounded crown spreading as wide as it is tall. Smooth gray bark becomes slightly furrowed with age."

