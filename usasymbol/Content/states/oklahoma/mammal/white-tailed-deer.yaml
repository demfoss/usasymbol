faq:
  - question: "What is Oklahoma's state game animal?"
    answer: "Oklahoma's state game animal is the white-tailed deer (Odocoileus virginianus), designated in 1990. The designation recognizes deer hunting as central to Oklahoma's outdoor heritage and economy. The white-tailed deer represents successful wildlife restoration from early 1900s depletion to approximately 500,000 animals today through science-based management and regulated harvest."
  
  - question: "When was the white-tailed deer designated as Oklahoma's state game animal?"
    answer: "The white-tailed deer became Oklahoma's official state game animal in 1990. The designation honored the species' recovery from severe depletion and its importance to Oklahoma's hunting culture. Over 100,000 hunters participate in deer hunting annually, generating over $300 million in economic impact."
  
  - question: "Why did Oklahoma choose the white-tailed deer as its state game animal?"
    answer: "Oklahoma chose the white-tailed deer because it represents successful wildlife restoration and the state's commitment to sustainable use of natural resources. Deer populations crashed in the early 1900s but recovered through protective regulations, restocking programs, and habitat management funded by hunters. The deer also demonstrates exceptional adaptability across Oklahoma's ecological gradient from humid eastern forests to semi-arid western prairies."
  
  - question: "What is the difference between Oklahoma's state animal and state game animal?"
    answer: "Oklahoma has separate designations: the American bison as state animal (1972) and the white-tailed deer as state game animal (1990). The bison represents conservation, restoration from near-extinction, and preservation. The deer represents sustainable harvest, hunting heritage, and active population management. These paired symbols acknowledge different wildlife management approaches—preservation for some species, regulated harvest for others."
  
  - question: "How many white-tailed deer live in Oklahoma?"
    answer: "Oklahoma's white-tailed deer population is approximately 500,000 animals as of the 2020s. The population recovered from severe depletion in the early 1900s through restoration efforts. Despite annual harvest exceeding 100,000 deer, populations remain stable due to high reproductive rates and abundant habitat created by Oklahoma's mixed agricultural and forest landscapes."
  
  - question: "Where can I see white-tailed deer in Oklahoma?"
    answer: "White-tailed deer appear throughout Oklahoma in all 77 counties. Best viewing locations include Wichita Mountains Wildlife Refuge near Lawton, Ouachita National Forest in southeastern Oklahoma, Sequoyah National Wildlife Refuge near Sallisaw, and wildlife management areas statewide. Suburban areas in Oklahoma City, Tulsa, and Norman also support visible deer populations. Dawn and dusk provide optimal viewing times."
  
  - question: "What is chronic wasting disease and does it affect Oklahoma deer?"
    answer: "Chronic wasting disease (CWD) is a fatal prion disease affecting deer, elk, and moose with no treatment or vaccine. Oklahoma detected its first CWD case in 2002. The disease spreads through contaminated environments and direct contact. The Oklahoma Department of Wildlife Conservation conducts extensive surveillance testing and implements restrictions including bans on baiting and carcass transport from CWD zones to slow disease spread."
  
  - question: "Can deer hunting fund wildlife conservation?"
    answer: "Yes, deer hunting provides primary funding for wildlife conservation in Oklahoma. Hunters pay license fees supporting Department of Wildlife Conservation operations. The federal Pittman-Robertson Act imposes excise taxes on firearms, ammunition, and archery equipment, distributing funds to states based on hunting license sales. Oklahoma receives millions annually supporting habitat work, research, and management for all wildlife species including non-game animals. This user-pays, user-benefits model funds conservation."
  
  - question: "Why does Oklahoma have deer hunting seasons?"
    answer: "Oklahoma uses regulated hunting seasons to manage deer populations sustainably while providing recreational opportunity. Hunting removes surplus animals that would otherwise die from starvation, disease, or vehicle collisions. Season timing during the November rut maximizes hunter success while protecting vulnerable spring and summer periods when does raise fawns. Harvest regulations including bag limits and antlerless permits allow wildlife managers to increase or decrease populations based on habitat conditions and management goals."

