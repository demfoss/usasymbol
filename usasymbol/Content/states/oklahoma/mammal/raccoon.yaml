title: "Oklahoma State Furbearer | Raccoon"
scientific_name: "Procyon lotor"
adopted_year: 1989

seo_title: "Oklahoma State Furbearer | Raccoon"
seo_description: "Oklahoma's state furbearer is the Raccoon, adopted in 1989. Learn why this official Oklahoma symbol was chosen and what it represents."

intro_text: "The Raccoon is the official Oklahoma state furbearer, designated in 1989. This page gives the direct answer for searches like 'oklahoma state furbearer', 'oklahoma state animal', and 'oklahoma state mammal' while explaining how the symbol fits the state's official animal designations. Distinctive black mask and ringed tail; intelligent problem-solving abilities; washing food behavior; symbol of fur trapping heritage."

common_name: "Raccoon"
official_since: "1989"
status: "Abundant; thriving population throughout Oklahoma; one of most successful mammals adapting to human development"
habitat_in_state: "All 77 counties; riparian woodlands, forests, prairies, urban areas; prefers habitats near water"
known_for: "Distinctive black mask and ringed tail; intelligent problem-solving abilities; washing food behavior; symbol of fur trapping heritage"

size: "16 to 28 inches body length; 8 to 12 inches tail length"
weight: "10 to 30 pounds; urban raccoons sometimes exceed 40 pounds due to abundant food"
coloration: "Grayish-brown fur with black mask across eyes; bushy tail with 4 to 6 black rings; white face markings"
distinctive_traits: "Black facial mask resembling burglar's mask; sensitive front paws with finger-like dexterity; bushy ringed tail; excellent climbing and swimming abilities"

habitat: "Riparian woodlands along rivers and streams; hardwood forests; prairie edges; agricultural areas; urban and suburban environments"
range_in_state: "Present in all 77 Oklahoma counties from Red River bottomlands to Ozark forests; highest densities near water sources"
conservation_status: "Stable; abundant population estimated in hundreds of thousands statewide; successfully adapted to human modification of landscapes"
where_to_find: "Nocturnal species visible after dark near water sources; common in state parks, wildlife management areas, urban parks, and residential neighborhoods"
symbol_connections: "Represents Oklahoma's frontier heritage including fur trapping economy; connects to diverse ecosystems from Cross Timbers forests to prairie streams; symbolizes rural livelihoods"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Oklahoma Legislature designated the raccoon as the official state furbearer on May 26, 1989, recognizing the species' importance to Oklahoma's fur trapping heritage and rural economy. The designation honored a traditional livelihood that supplemented farm income for generations within [the Sooner State tradition](/states/oklahoma/nickname/the-sooner-state)."
      - "The legislation came during a period when Oklahoma celebrated rural traditions and wildlife management achievements. Trappers, conservation groups, and wildlife managers advocated for recognition of fur harvesting as legitimate wildlife use alongside hunting and fishing."
    
    subsections:
      - subtitle: "How It Became Symbol"
        text: "The campaign for raccoon designation emerged from Oklahoma's trapping community and the Department of Wildlife Conservation. Trappers wanted recognition for their role in wildlife management and economic contributions to rural communities. They emphasized that regulated fur harvesting provided income for farm families, controlled wildlife populations, and represented frontier skills passed through generations. The raccoon emerged as obvious choice because it ranked as Oklahoma's most harvested furbearing species, with annual trapper harvests reaching tens of thousands. Wildlife managers supported the designation as opportunity to educate the public about regulated trapping as conservation tool. Legislators from rural districts championed the measure, viewing fur trapping as authentic Oklahoma heritage deserving formal recognition."
      
      - subtitle: "Why Chosen"
        text: "Legislators selected the raccoon because it embodied Oklahoma's relationship with wildlife as both resource and responsibility. The species thrived throughout the state in diverse habitats from river bottoms to prairie woodlands. Raccoon fur provided income for rural families during the early 1900s when fur prices peaked and trapping supplemented agricultural income. The designation acknowledged that Oklahomans historically viewed wildlife as renewable resource to be managed sustainably rather than either exploited carelessly or preserved without use. The raccoon also represented successful wildlife management—populations remained healthy despite harvest, demonstrating that regulated take didn't threaten species survival. By designating a furbearer rather than just an animal, Oklahoma honored practical utilitarian relationships with wildlife alongside aesthetic appreciation."

  - id: "state-symbolism"
    icon: "fa-water"
    title: "What the Raccoon Represents"
    style: "highlight"
    paragraphs:
      - "The raccoon symbolizes Oklahoma's diverse ecosystems bridging eastern forests and western prairies. These adaptable mammals thrive in riparian corridors threading through varied landscapes, connecting different ecological regions across the state."
      - "The species embodies resourcefulness and adaptability valued in frontier culture. Raccoons solve problems, exploit varied food sources, and adjust to changing conditions—qualities Oklahomans recognized in themselves as they settled diverse lands."
      - "The designation in 1989 recognized traditional rural livelihoods including fur trapping that sustained families before mechanized agriculture and industrial employment. The furbearer designation honored practical relationships with wildlife rooted in necessity rather than sentiment, aligned with [Oklahoma's state motto values](/states/oklahoma/motto/labor-omnia-vincit)."
    
    subsections:
      - subtitle: "Fur Trapping Heritage and Rural Economy"
        text: "Fur trapping provided essential supplemental income for Oklahoma farm families from territorial days through the mid-1900s. During winter when agricultural work slowed, farmers and their sons ran traplines along creeks and rivers, harvesting raccoons, muskrats, opossums, and other furbearers. Raw pelts sold to fur buyers who traveled rural routes, providing cash income during economically challenging seasons. During the 1920s and 1930s when fur prices peaked, a single high-quality raccoon pelt might sell for several dollars—substantial income when farm commodities brought low prices. Trapping taught woodcraft skills, wildlife knowledge, and self-reliance. Families processed pelts using traditional methods—stretching hides on wooden boards, fleshing away fat and tissue, drying pelts properly for sale. This intimate knowledge of wildlife behavior and seasonal patterns created conservation ethic among trappers who understood that overharvest would eliminate future income."
      
      - subtitle: "The Cross Timbers and Eastern Forests"
        text: "Oklahoma's eastern regions including the Cross Timbers and Ozark forests provided prime raccoon habitat. The Cross Timbers—a distinctive belt of post oak and blackjack oak woodland stretching from Kansas through Oklahoma to Texas—created ideal conditions for raccoons with numerous hollow trees for denning and acorn mast for food. Rivers including the Illinois, Verdigris, Grand, and Arkansas supported dense riparian forests with abundant raccoon populations. These eastern Oklahoma ecosystems contrasted sharply with the state's western prairies, yet raccoons adapted to both through association with water courses. Even in shortgrass prairie regions, raccoons followed creek corridors providing trees for denning and water-edge foraging opportunities. This ability to inhabit diverse ecosystems from humid forests to semi-arid prairies made raccoons representative of Oklahoma's ecological diversity."
      
      - subtitle: "Intelligence and Problem-Solving Abilities"
        text: "Raccoons display exceptional intelligence among North American mammals, demonstrating complex problem-solving abilities that captured trappers' respect and frustration. They learn to open latches, remember solutions to puzzles, and modify behavior based on experience. Researchers found that raccoons possess more neurons in their cerebral cortex relative to brain size than most mammals, explaining their cognitive abilities. These mental capacities help raccoons exploit diverse food sources including insects, crayfish, frogs, bird eggs, fruits, nuts, and human garbage. Their sensitivity to manipulation through front paws approaches primate dexterity. Trappers developed sophisticated techniques to outwit raccoons, who quickly learned to avoid obvious trap sets. This intelligence created respect among rural Oklahomans who viewed raccoons as worthy adversaries requiring skill and knowledge to harvest successfully."
      
      - subtitle: "Water Association and Washing Behavior"
        text: "Raccoons show strong association with water, preferring habitats near streams, rivers, ponds, and wetlands. Their scientific name Procyon lotor means 'before-dog washer,' reflecting the distinctive behavior of manipulating food items in water before eating. Contrary to popular belief, raccoons don't wash food to clean it but rather wet their sensitive front paws to enhance tactile sensation, helping them better assess food quality and remove inedible portions. In Oklahoma's riparian zones, raccoons forage extensively along water edges, catching crayfish, frogs, and mussels. They search under rocks and in shallow water using their sensitive fingers to locate prey by touch. This water-edge foraging makes raccoons ecological indicators of healthy stream and wetland systems. Their presence suggests functioning riparian corridors with adequate water quality and diverse prey populations."
      
      - subtitle: "Urban Wildlife Success Story"
        text: "Raccoons demonstrate exceptional ability to thrive in urban and suburban environments, increasing in abundance as Oklahoma developed. Cities including Oklahoma City, Tulsa, and smaller municipalities support substantial raccoon populations exploiting human-provided resources. Urban raccoons den in attics, chimneys, sheds, and drainage systems instead of hollow trees. They raid garbage bins, pet food dishes, and gardens rather than hunting wild prey. Population densities in urban areas often exceed those in natural habitats due to abundant food and reduced predation. This urban success creates conflicts when raccoons damage property, threaten pets, or carry rabies. The Oklahoma Department of Wildlife Conservation provides guidance for peaceful coexistence including securing garbage and removing attractants. The species' urban adaptation demonstrates that wildlife management in modern Oklahoma involves city parks and neighborhoods as much as wilderness areas."

  - id: "identification"
    icon: "fa-paw"
    title: "How to Identify Raccoons"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Raccoons display distinctive appearance making them unmistakable among Oklahoma mammals. The black facial mask and ringed tail create recognition even at distance or in poor lighting."
        list_items:
          - "**Size**: Body length 16-28 inches; tail length 8-12 inches; total length up to 40 inches; size varies considerably by age, sex, and food availability"
          - "**Weight**: Typically 10-30 pounds; urban individuals sometimes exceed 40 pounds; weights peak in fall before winter, drop through spring"
          - "**Appearance**: Grayish-brown fur on body; distinctive black mask across eyes edged with white; bushy tail with 4-6 alternating black and light rings; white muzzle and eye markings"
          - "**Features**: Sensitive front paws with five fingers showing remarkable dexterity; hunched posture when walking; plantigrade foot posture (walks on soles like bears); excellent climbing ability using sharp claws"
      
      - subtitle: "Remarkable Front Paws"
        text: "Raccoon front paws rank among the most sensitive and dexterous of any mammal. Each front paw possesses five finger-like digits with considerable independent movement. Thousands of sensory receptors in the paws provide tactile information allowing raccoons to identify objects without looking. The fingers lack webbing, providing flexibility for manipulation. Raccoons show nearly opposable thumbs enabling them to grip and turn objects. These abilities allow complex manipulations including opening containers, untying knots, turning doorknobs, and removing lids. Research shows that wetting the paws enhances sensory input—the skin softens and becomes more sensitive, explaining why raccoons often manipulate food items in water. This tactile sophistication evolved for foraging along stream banks where raccoons search underwater crevices and under rocks for prey."
      
      - subtitle: "Behavior and Activity Patterns"
        text: "Raccoons lead primarily nocturnal lives, emerging after dusk to forage through night hours before returning to dens near dawn. They prove most active during first hours after sunset and hours before sunrise. Daylight activity occasionally occurs, particularly during breeding season, when feeding young, or when food resources prove scarce. Raccoons typically den in hollow trees, though they readily use rock crevices, abandoned burrows, brush piles, and human structures. They don't hibernate but remain inactive during severe winter weather, surviving on stored body fat. Multiple raccoons sometimes share dens during winter for warmth. Home ranges vary from 20 acres to several square miles depending on habitat quality and population density. Males range more widely than females, particularly during breeding season."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "Raccoons in Oklahoma"
    style: "default"
    paragraphs:
      - "Raccoons inhabit all 77 Oklahoma counties, from Red River bottomlands to Ozark highlands. Population densities reach highest levels in riparian woodlands with mature trees providing den sites and water providing foraging opportunities."
      - "Oklahoma's diverse landscapes create varied raccoon habitats. Eastern forests with oak-hickory stands and numerous water courses support dense populations. Central Cross Timbers regions provide ideal conditions. Even western prairies support raccoons along creek corridors and around farm ponds."
    
    facts:
      - "**Statewide Range**: Present in all 77 counties; no area of Oklahoma lacks resident raccoon populations"
      - "**Population**: Estimated several hundred thousand raccoons statewide; exact numbers unknown but populations remain stable and abundant"
      - "**Highest Densities**: River bottomlands and riparian forests in eastern Oklahoma; Cross Timbers regions; urban and suburban areas with abundant food and shelter"
      - "**Habitat Diversity**: Successfully occupies forests, prairies, wetlands, agricultural areas, suburbs, and cities; adaptability allows presence in nearly all Oklahoma ecosystems"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Raccoons"
    style: "default"
    paragraphs:
      - "Observing raccoons requires nocturnal viewing or visiting areas where habituation reduces wariness. Urban parks and campgrounds provide best opportunities due to human-acclimated populations."
    
    list_items:
      - "**Urban Parks and Greenways**: City parks in Oklahoma City, Tulsa, Norman, and other municipalities support visible raccoon populations; Lake Hefner, Myriad Gardens, and River Parks attract habituated animals"
      - "**State Parks**: Beavers Bend State Park, Robbers Cave State Park, and Roman Nose State Park offer campground viewing opportunities; raccoons often visit campsites after dark seeking food"
      - "**Wildlife Management Areas**: Thousands of acres of public hunting land support healthy raccoon populations; nighttime visits to boat ramps and parking areas may yield sightings"
      - "**Residential Areas**: Suburban neighborhoods throughout Oklahoma host raccoon populations; spotlight or motion-activated camera reveals nocturnal visitors to yards"
      - "**Safety Considerations**: Never approach or feed raccoons; they carry rabies at higher rates than most mammals; bites and scratches require immediate medical attention; secure garbage and remove pet food to discourage habituation"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Population Status and Management"
    style: "default"
    paragraphs:
      - "Raccoons maintain stable, abundant populations throughout Oklahoma with no conservation concerns. The species represents one of few native mammals increasing in numbers alongside human development."
      - "The Oklahoma Department of Wildlife Conservation manages raccoons as furbearing game animals with regulated trapping and hunting seasons. Modern harvest levels remain far below historical peaks but continue providing recreational and economic opportunities."
    
    subsections:
      - subtitle: "Modern Fur Trapping and Market Changes"
        text: "Fur trapping declined dramatically from its peak during the early and mid-1900s. International fur markets collapsed during the 1980s and 1990s as fashion preferences shifted and anti-fur campaigns reduced demand. Raccoon pelt prices dropped from over $20 in peak years to often less than $5 by the 2000s. These low prices eliminated economic incentive for most trappers. Oklahoma's annual raccoon harvest declined from tens of thousands in peak years to far lower numbers by the 2010s. The Department of Wildlife Conservation maintains regulated trapping seasons and licensing requirements, though participation continues declining. Modern trappers pursue the activity primarily for recreation, wildlife management, and tradition rather than income. Some trappers donate raccoon meat to food banks or use it as bait for predator trapping. The decline in trapping reduced pressure on furbearer populations but also eliminated a monitoring tool wildlife managers once used to track population trends."
      
      - subtitle: "Rabies and Public Health Concerns"
        text: "Raccoons serve as primary rabies reservoir species in much of the eastern United States, though Oklahoma's rabies situation differs from eastern patterns. The eastern United States experienced a rabies epidemic in raccoon populations starting in the 1970s, spreading south and west from the mid-Atlantic states. Oklahoma has recorded relatively few raccoon rabies cases compared to states farther east, though the disease remains present at low levels. Raccoons also carry raccoon roundworm (Baylisascaris procyonis), a parasite potentially dangerous to humans if eggs are ingested. The parasite doesn't make raccoons sick but their feces contain eggs that remain infectious for years in soil. Children playing in areas contaminated by raccoon latrines face greatest risk. Public health authorities recommend avoiding contact with raccoons, never keeping them as pets, and removing raccoon latrines from yards and play areas using proper protective equipment."
      
      - subtitle: "Human-Wildlife Conflict Management"
        text: "Urban and suburban raccoon populations create conflicts requiring wildlife management responses. Raccoons damage property by tearing open roofing to access attics, destroying gardens and koi ponds, overturning garbage bins, and defecating in swimming pools and on decks. They occasionally injure or kill pet cats and small dogs, particularly when defending young or competing for food. The Department of Wildlife Conservation provides extensive guidance for non-lethal conflict resolution including securing potential food sources, excluding animals from structures, and using deterrents. Licensed nuisance wildlife control operators offer removal services for situations requiring intervention. Oklahoma law allows property owners to remove raccoons causing damage without special permits during open seasons. The prevalence of urban raccoon conflicts reflects the species' successful adaptation to human environments and raises questions about how Oklahomans will manage abundant wildlife in developed areas."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The raccoon connects to other Oklahoma symbols through shared themes of adaptability, ecological diversity, and practical relationships with nature. The furbearer designation represents different values than the American bison state animal—utility rather than majesty, adaptation rather than wildness—and coexists with habitats tied to [the redbud state tree](/states/oklahoma/tree/redbud)."
      - "The raccoon's water association links it to Oklahoma's rivers and riparian ecosystems. The state's major waterways including the Arkansas, Red, Canadian, and Cimarron Rivers provide essential raccoon habitat threading through diverse landscapes."
    
    subsections:
      - subtitle: "Redbud Tree and Riparian Corridors"
        text: "Oklahoma's state tree, the redbud (designated 1937), grows prolifically along stream banks and river corridors where raccoons concentrate. Eastern redbud thrives in moist soils near water, creating understory color during early spring with brilliant pink-purple flowers. Raccoons frequent these same riparian zones, foraging along water edges and denning in larger trees above flood levels. Both the state tree and state furbearer depend on Oklahoma's network of rivers, streams, and creeks. Riparian forests support Oklahoma's highest wildlife diversity, providing habitat for dozens of mammal species, hundreds of bird species, and numerous reptiles and amphibians. The redbud and raccoon together symbolize the ecological importance of water corridors in a state where water availability shapes all natural communities."
        link:
          label: "See Oklahoma state tree"
          url: "/states/oklahoma/tree/redbud"
      
      - subtitle: "Scissor-Tailed Flycatcher and Ecological Coexistence"
        text: "Oklahoma's state bird, the scissor-tailed flycatcher (designated 1951), shares habitats with raccoons in open woodlands and edge environments. Both species benefit from Oklahoma's mixed landscape of forests, prairies, and agricultural areas. Flycatchers nest in scattered trees in open country, while raccoons use these same trees for denning and travel corridors. The relationship isn't always harmonious—raccoons prey on bird eggs and nestlings when opportunity arises, demonstrating that ecological communities include both cooperation and predation. Together, the state bird and state furbearer represent Oklahoma's diverse wildlife adapted to working landscapes modified by human activity yet still supporting abundant native species."
        link:
          label: "See Oklahoma state bird"
          url: "/states/oklahoma/bird/scissor-tailed-flycatcher"
      
      - subtitle: "American Bison and Wildlife Use Philosophy"
        text: "The contrast between Oklahoma's state animal (American bison) and state furbearer (raccoon) illustrates different approaches to wildlife symbolism. The bison represents wildness, indigenous culture, near-extinction, and conservation triumph—a symbol of preservation and restoration. The raccoon represents utility, rural livelihoods, sustainable harvest, and adaptation—a symbol of practical wildlife management. Both designations honor authentic Oklahoma relationships with wildlife, but from different philosophical positions. The bison designation acknowledges that some species require protection and restoration. The furbearer designation acknowledges that other species remain abundant enough to provide sustainable harvest supporting traditional livelihoods. Together, these symbols present nuanced view of wildlife management balancing preservation, sustainable use, and human needs."
        link:
          label: "See Oklahoma state animal"
          url: "/states/oklahoma/mammal/american-bison"

