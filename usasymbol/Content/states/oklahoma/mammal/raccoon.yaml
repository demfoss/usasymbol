faq:
  - question: "What is Oklahoma's state furbearer?"
    answer: "Oklahoma's state furbearer is the raccoon (Procyon lotor), designated on May 26, 1989. The designation honors Oklahoma's fur trapping heritage and recognizes the raccoon as the state's most important furbearing species. The raccoon represents traditional rural livelihoods that supplemented farm income for generations through regulated fur harvest."
  
  - question: "When was the raccoon designated as Oklahoma's state furbearer?"
    answer: "The raccoon became Oklahoma's official state furbearer in 1989. The designation recognized the species' importance to Oklahoma's rural economy and fur trapping traditions. Trappers and wildlife managers advocated for recognition of fur harvesting as legitimate wildlife use and conservation tool."
  
  - question: "Why did Oklahoma choose the raccoon as its state furbearer?"
    answer: "Oklahoma chose the raccoon because it represented the state's fur trapping heritage and ranked as the most harvested furbearing species. Raccoon fur provided supplemental income for farm families from territorial days through the mid-1900s. The designation honored practical utilitarian relationships with wildlife and acknowledged that regulated harvest could coexist with healthy populations. The raccoon also thrives in Oklahoma's diverse ecosystems from eastern forests to western prairies."
  
  - question: "What is the difference between Oklahoma's state animal and state furbearer?"
    answer: "Oklahoma has two official mammal symbols: the American bison as state animal (1972) and the raccoon as state furbearer (1989). The bison represents conservation, indigenous heritage, and restoration from near-extinction. The raccoon represents sustainable harvest, rural livelihoods, and fur trapping traditions. These separate designations honor different relationships with wildlife—preservation versus sustainable use."
  
  - question: "Is fur trapping still practiced in Oklahoma?"
    answer: "Yes, fur trapping continues in Oklahoma but at much lower levels than historical peaks. International fur markets collapsed during the 1980s-1990s, causing raccoon pelt prices to drop from over $20 to often less than $5. These low prices eliminated economic incentive for most trappers. Modern trappers pursue the activity primarily for recreation, wildlife management, and tradition rather than income. The Oklahoma Department of Wildlife Conservation maintains regulated trapping seasons."
  
  - question: "Where can I see raccoons in Oklahoma?"
    answer: "Raccoons inhabit all 77 Oklahoma counties and are commonly seen after dark. Best viewing locations include urban parks in Oklahoma City and Tulsa, state park campgrounds including Beavers Bend and Robbers Cave, and suburban neighborhoods statewide. Raccoons are nocturnal, so viewing requires evening or nighttime observation. Never approach or feed raccoons as they can carry rabies and become aggressive."
  
  - question: "Why do raccoons wash their food?"
    answer: "Raccoons don't actually wash food to clean it. Their scientific name Procyon lotor means 'before-dog washer,' but the behavior serves a different purpose. Raccoons wet their sensitive front paws to enhance tactile sensation, helping them better assess food quality and remove inedible portions. The water softens their paw skin and improves their remarkable sense of touch, which they use extensively for underwater foraging."
  
  - question: "Are raccoons dangerous to humans?"
    answer: "Raccoons can pose dangers including rabies transmission, raccoon roundworm parasites, and physical aggression when cornered or defending young. Rabies remains present in Oklahoma raccoon populations at low levels. Raccoon roundworm (Baylisascaris procyonis) in their feces can cause serious illness if eggs are ingested. Never approach, feed, or attempt to pet raccoons. Bites and scratches require immediate medical attention. Secure garbage and remove pet food to discourage habituation."
  
  - question: "How intelligent are raccoons?"
    answer: "Raccoons rank among the most intelligent North American mammals, demonstrating complex problem-solving abilities and memory. Research shows raccoons possess more neurons in their cerebral cortex relative to brain size than most mammals. They learn to open latches, remember solutions to puzzles, and modify behavior based on experience. This intelligence helped them adapt successfully to urban environments and contributed to their historical reputation among trappers as worthy adversaries requiring skill to harvest."

