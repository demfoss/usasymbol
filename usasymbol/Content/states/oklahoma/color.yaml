title: "Official and Traditional Colors of Oklahoma"
state: "Oklahoma"
adopted_year: 1915

seo_title: "Oklahoma State Colors: Official HEX Codes & Meaning"
seo_description: "Oklahoma state colors are Green and White, officially designated in 1915. Full HEX, RGB, CMYK, and Pantone values with historical context for designers and researchers."

intro_text: "The official state colors of Oklahoma are **Green** and **White**, formally designated by the Oklahoma Legislature in 1915 under House Concurrent Resolution No. 9. Proposed by the Ohoyohoma Circle — a women's civic club whose Choctaw name means 'women's circle' — to represent mistletoe's green leaves and white berries, these colors appear on [the Oklahoma state flag](/states/oklahoma/flag/oklahoma-state-flag) and throughout official state branding. Use the color codes below for accurate Oklahoma branding in any medium — HEX, RGB, CMYK, and Pantone values all included."

official_colors: "Green and White"
official_since: "February 2, 1915 (Oklahoma Statutes § 25-93, House Concurrent Resolution No. 9)"
primary_use: "Official state government branding, ceremonial contexts, state document designations"
known_for: "Green representing the foliage of mistletoe, Oklahoma's original state flower, and the state's agricultural wealth; white representing the berries of mistletoe and the purity of civic life; the colors were championed by the Ohoyohoma Circle, a women's civic organization whose Choctaw-named club honored Oklahoma's Native American heritage"

