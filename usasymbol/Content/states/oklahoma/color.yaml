expert_quote:
  text: "Oklahoma's green and white were proposed by the Ohoyohoma Circle — a name drawn from Choctaw — honoring in the very act of naming the profound Native American heritage that defines Oklahoma's identity more than almost any other state."
  source: "Oklahoma Historical Society, Encyclopedia of Oklahoma History and Culture, State Symbols"

faq:
  - question: "What are the official colors of Oklahoma?"
    answer: "The official state colors of Oklahoma are Green and White, designated in 1915 through House Concurrent Resolution No. 9, now codified in Oklahoma Statutes § 25-93. The colors were chosen to represent the green leaves and white berries of mistletoe, Oklahoma's original state flower."
  - question: "When were Oklahoma's state colors adopted?"
    answer: "Oklahoma's state colors were adopted on February 2, 1915, when Governor R.L. Williams approved House Concurrent Resolution No. 9, proposed by the Ohoyohoma Circle."
  - question: "Who chose Oklahoma's state colors?"
    answer: "The Ohoyohoma Circle — a civic club of the wives of members of the Fifth Oklahoma Legislature — proposed green and white. The name Ohoyohoma is a Choctaw phrase meaning 'women's circle,' honoring Oklahoma's Native American heritage."
  - question: "Why green and white for Oklahoma?"
    answer: "Green and white were chosen to represent the green leaves and white berries of mistletoe, Oklahoma's official state flower at the time. A 1915 newspaper also noted that all rugs and tapestries in Oklahoma's state offices were green, making the selection 'unusually suitable.'"

