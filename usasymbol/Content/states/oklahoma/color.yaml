sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Oklahoma formally adopted green and white as its official state colors on February 2, 1915, through House Concurrent Resolution No. 9 — one of the earliest formal state color designations in the nation and among the first acts of cultural symbol-making in a state that had only been admitted to the Union in 1907. The resolution was passed by the House on January 21, 1915 and by the Senate on January 22, 1915. Governor R.L. Williams signed it with notable speed — reportedly within minutes of the resolution reaching his office — on February 2, 1915, in the same civic period reflected by [Oklahoma's state motto](/states/oklahoma/motto/labor-omnia-vincit)."
      - "The driving force behind the color selection was the Ohoyohoma Circle, a civic club composed of the wives of members of the Fifth Oklahoma Legislature. The club's name derived from a Choctaw phrase meaning 'women's circle,' honoring Oklahoma's deep Native American heritage — the state was home to the Five Civilized Tribes relocated from the southeastern United States during the Trail of Tears (1830-1850), and Indigenous peoples constitute a higher percentage of Oklahoma's population than almost any other state. The Ohoyohoma Circle recommended green and white to complement mistletoe, then the official state flower, specifically referencing the plant's green leaves and white berries as the basis for the color selection, a trajectory linked to [the Sooner State identity](/states/oklahoma/nickname/the-sooner-state)."
    subsections:
      - subtitle: "Oklahoma Statutes § 25-93 and the Resolution Text"
        text: "Oklahoma Statutes Title 25, Section 25-93 reads simply: 'The said colors of green and white be adopted as permanent and appropriate colors for the State of Oklahoma. Laws 1915, House Concurrent Resolution, No. 9.' The resolution text itself stated that the Ohoyohoma Circle composed of the wives of the Fifth Legislature's members recommended green and white 'as permanent and appropriate colors.' The Standard Sentinel newspaper observed at the time that 'the fact that all rugs, carpets and tapestries in all Oklahoma state offices are green makes the selection unusually suitable.' No Pantone or Cable color values are specified in the legislation, as precise color specification systems were not yet in wide use in 1915."
      - subtitle: "Connection to Mistletoe and Oklahoma's Botanical Heritage"
        text: "Mistletoe (Phoradendron serotinum) was Oklahoma's official state flower at the time of the 1915 color adoption and remained so until 2004, when the Oklahoma rose replaced it. The plant — a semi-parasitic evergreen with distinctive green leaves and white berries — grows extensively on the deciduous trees of eastern and central Oklahoma. The Ohoyohoma Circle's explicit connection of green and white to mistletoe's botanic colors gave the state colors a direct botanical grounding unusual among U.S. state color designations. Even after the rose replaced mistletoe as state flower, the green and white colors remained designated by statute; see [the Oklahoma rose page](/states/oklahoma/flower/oklahoma-rose)."
  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Oklahoma's green and white carry both botanical and civic meaning that reflects the state's unique position at the intersection of Native American heritage, pioneer settlement history, and agricultural abundance. Green speaks to the rolling plains and forests of the Sooner State — a landscape where the tallgrass prairie, eastern deciduous forest, and western shortgrass plains converge in a state of remarkable ecological diversity. White represents civic purity and the peace symbolized in Oklahoma's state motto, Labor Omnia Vincit ('Work Conquers All Things'), adopted in 1893, and with visual identity details on [the Oklahoma state flag page](/states/oklahoma/flag/oklahoma-state-flag)."
    subsections:
      - subtitle: "Green: Agriculture, Forests, and the Sooner Spirit"
        text: "Oklahoma's agricultural heritage runs as deep as any state's. The Land Run of 1889 — in which nearly 50,000 settlers raced to claim the Unassigned Lands of central Oklahoma — earned Oklahomans the nickname 'Sooners' for those who jumped the starting gun. The green of Oklahoma's state colors evokes the 93,000 square miles of the state's landscape: the Cross Timbers forests of central Oklahoma, the Ouachita Mountains of the southeast, the Ozark Plateau of the northeast, and the vast wheat-growing plains of the central and western regions. Oklahoma produces substantial quantities of wheat, beef cattle, broiler chickens, and cotton, with agriculture contributing significantly to the state's economy."
      - subtitle: "White and the Native American Peace Tradition"
        text: "White in Oklahoma's official palette also connects to the peace traditions embedded in the Oklahoma state flag, adopted in 1925. The flag features an Osage warrior's shield on a blue field, with an olive branch and a calumet (peace pipe) laid across the shield — symbols of peace and unity between peoples. The word 'Oklahoma' appears in white letters beneath the shield. White's association with peace in Native American ceremonial traditions resonates with a state whose territory was designated 'Indian Territory' for decades and which today is home to 39 federally recognized tribal nations, including the Cherokee, Choctaw, Chickasaw, Creek, and Seminole nations."
  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Oklahoma's official state colors of green and white do not directly correspond to the Oklahoma state flag's primary visual palette, which uses blue and features a range of colors in the Osage shield, olive branch, calumet, and eagle feathers. This unusual disjunction between state flag colors and state colors reflects the fact that the colors were adopted in 1915, a decade before the 1925 flag. Green and white appear in Oklahoma state government seal details, in the branding of state institutions, and in the interiors of state buildings. The Oklahoma State Capitol, which was under construction when the colors were adopted, features green interior elements consistent with the Ohoyohoma Circle's observation about the prevalence of green in state office furnishings. Oklahoma State University's institutional colors are orange and black, while the University of Oklahoma uses crimson and cream, neither of which matches the official state colors — a common divergence between flagship university colors and state colors, while broader trend context appears in [U.S. states by population](/rankings/demographics/states-by-population)."

