faq:
  - question: What is Oklahoma's state reptile?
    answer: "Oklahoma's state reptile is the common collared lizard, adopted by the Oklahoma Legislature in 1969."
  - question: When did Oklahoma adopt the common collared lizard?
    answer: "The Oklahoma Legislature designated the common collared lizard the official state reptile in 1969, the first such designation by any U.S. state."
  - question: Why did Oklahoma choose the common collared lizard?
    answer: "Official sources name the common collared lizard as the state reptile but do not give a detailed reason for the choice."
  - question: Is the common collared lizard a turtle, snake, lizard, or alligator?
    answer: "The common collared lizard is a lizard known for its colorful skin, its black neck bands, and its ability to run on its hind legs."

