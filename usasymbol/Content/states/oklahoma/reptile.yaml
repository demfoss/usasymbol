seo_title: "Oklahoma State Reptile | Common Collared Lizard"
seo_description: "Oklahoma's state reptile is the common collared lizard, adopted in 1969, the first state reptile in the U.S."
hero_image: /images/reptiles/oklahoma/oklahoma-state-reptile-hero.webp
hero_image_alt: "A brightly colored collared lizard with a black-and-white neck band resting on a rock."
hero_image_caption: "The common collared lizard, Oklahoma's state reptile, was the first official state reptile in the United States."
intro_text: "Oklahoma's state reptile is the common collared lizard, a colorful rock-dwelling lizard, adopted in 1969. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Oklahoma?
    paragraphs:
      - "The common collared lizard is Oklahoma's official state reptile, designated by the Oklahoma Legislature in 1969. Its scientific name is Crotaphytus collaris."
      - "It was the first lizard, and the first reptile of any kind, to be named an official state reptile by any U.S. state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Common Collared Lizard
    paragraphs:
      - "The common collared lizard has a large head, a long tail, and skin that can appear in shades of green, blue, yellow, or brown, often with light spots."
      - "It gets its name from the two bold black bands around its neck that look like a collar."
      - "It is a fast, agile lizard that can run on its hind legs alone when moving quickly across rocky ground."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Oklahoma Legislature designated the common collared lizard the official state reptile in 1969, making it the first reptile named a state symbol by any U.S. state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Oklahoma Chose the Common Collared Lizard
    paragraphs:
      - "Official sources name the common collared lizard as the state reptile but do not give a detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Common Collared Lizard
    paragraphs:
      - "The common collared lizard lives among rocky outcrops and open, rugged terrain in western and southwestern Oklahoma, including the Wichita Mountains."
    sites:
      - name: Wichita Mountains Wildlife Refuge
        city: Lawton
        lat: 34.72
        lng: -98.63
        note: "Rocky habitat known for this species"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Common Collared Lizard Facts
    facts:
      - "Adopted in 1969 by the Oklahoma Legislature."
      - "Was the first official state reptile designated by any U.S. state."
      - "Has two black bands around its neck that look like a collar."
      - "Can run on its hind legs alone at high speed."
      - "Lives among rocky outcrops in western Oklahoma."

