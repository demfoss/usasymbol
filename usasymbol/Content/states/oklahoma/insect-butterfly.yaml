faq:
- question: What is Oklahoma's state butterfly?
  answer: "Oklahoma's state butterfly is the black swallowtail, adopted by the Oklahoma Legislature in 1996."
- question: When did Oklahoma adopt the black swallowtail?
  answer: "Oklahoma adopted the black swallowtail as its official state butterfly in 1996."
- question: What does the black swallowtail look like?
  answer: "It has mostly black wings with two rows of yellow spots, a blue patch, and an orange spot near the tail on each hindwing."
- question: Is the black swallowtail the same as Oklahoma's state insect?
  answer: "No. Oklahoma's state insect is the European honey bee, adopted in 1992. The black swallowtail is a separate designation, the official state butterfly, adopted in 1996."
- question: Where can you find the black swallowtail in Oklahoma?
  answer: "It is common throughout Oklahoma, especially in gardens and fields with plants like parsley, dill, and fennel."

