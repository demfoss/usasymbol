sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Oklahoma?
  paragraphs:
  - "The black swallowtail, Papilio polyxenes, is Oklahoma's official state butterfly. The Oklahoma Legislature designated it in 1996."
  - "It is common across Oklahoma and is a familiar sight in gardens, especially where plants like parsley, dill, and fennel grow."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Black Swallowtail
  paragraphs:
  - "The black swallowtail has mostly black wings marked with two rows of yellow spots. A patch of blue appears near the tail on the hindwings, along with a single orange spot."
  - "Each hindwing ends in a narrow tail, a common feature of swallowtail butterflies."
  - "Caterpillars are green with black bands dotted with yellow spots and feed on plants in the carrot family, including parsley, dill, fennel, and Queen Anne's lace."

- id: history
  icon: fa-solid fa-landmark
  title: How Oklahoma Chose the Black Swallowtail
  paragraphs:
  - "The Oklahoma Legislature named the black swallowtail the official state butterfly in 1996."
  - "The designation recognized the butterfly as a common and easily recognized species found throughout Oklahoma."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Black Swallowtail in Oklahoma
  paragraphs:
  - "The black swallowtail is found throughout Oklahoma, in gardens, fields, and open areas wherever its host plants grow."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Black Swallowtail Facts
  facts:
  - "Adopted in 1996 by the Oklahoma Legislature."
  - "Scientific name: Papilio polyxenes."
  - "Black wings with two rows of yellow spots, a blue patch, and an orange spot near the tail."
  - "Caterpillars feed on carrot-family plants like parsley, dill, and fennel."
  - "Oklahoma also has a separate state insect, the European honey bee, adopted in 1992."




