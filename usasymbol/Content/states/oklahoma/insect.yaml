sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Oklahoma?
  paragraphs:
  - "The honey bee, Apis mellifera, is Oklahoma's official state insect. The Oklahoma Legislature designated it in 1992."
  - "Honey bees are widely kept across Oklahoma and play a major role in pollinating the state's crops."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
  - "Honey bees live in large colonies built around a single queen. Worker bees gather nectar and pollen, build wax honeycomb, and produce honey."
  - "A single hive can hold thousands of bees, all working together to feed and grow the colony."

- id: history
  icon: fa-solid fa-landmark
  title: How Oklahoma Chose the European Honey Bee
  paragraphs:
  - "The Oklahoma Legislature named the European honey bee the official state insect in 1992."
  - "Lawmakers recognized the honey bee for its role pollinating Oklahoma crops and its value to the state's beekeeping industry."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted in 1992 by the Oklahoma Legislature."
  - "Scientific name: Apis mellifera."
  - "Body is golden-brown and black with fuzzy stripes and two pairs of clear wings."
  - "Honey bees live in large colonies built around one queen."
  - "Oklahoma also has a separate state butterfly, the black swallowtail, adopted in 1996."




