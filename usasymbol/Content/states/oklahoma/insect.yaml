faq:
- question: What is Oklahoma's state insect?
  answer: "Oklahoma's state insect is the European honey bee, adopted by the Oklahoma Legislature in 1992."
- question: When did Oklahoma adopt the European honey bee?
  answer: "Oklahoma adopted the European honey bee as its official state insect in 1992."
- question: Why did Oklahoma choose the European honey bee?
  answer: "Lawmakers recognized the honey bee for its role pollinating Oklahoma crops and its value to the state's beekeeping industry."
- question: What does Oklahoma's state insect look like?
  answer: "The European honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
- question: Does Oklahoma have a separate state butterfly?
  answer: "Yes. Oklahoma named the black swallowtail its official state butterfly in 1996, separate from the honey bee's designation as state insect."

