sections:
- id: official-answer
  icon: fa-solid fa-circle-info
  title: Oklahoma's Official State Drink
  paragraphs:
  - Oklahoma has two overlapping designations for the same thing. In 1985, the state named milk its official state beverage. In 2002, the legislature returned and named milk the official state drink. Both titles are current. Both apply to the same product. The duplication reflects how legislatures sometimes revisit and reframe symbols rather than any genuine distinction between the two categories. The [Oklahoma Secretary of State](https://www.sos.ok.gov/) lists both on the official state symbols page.
- id: why-milk
  icon: fa-solid fa-cow
  title: 'Dairy in the Shadow of Beef: Why Oklahoma Chose Milk'
  paragraphs:
  - The push behind the original 1985 designation came from Daniel Howard, a 4-H member who lobbied for milk as a symbol of Oklahoma's dairy industry. The designation was not driven by nostalgia for a particular drink or a beloved local recipe — it was a deliberate signal that dairy farming deserved recognition alongside the cattle ranching and wheat production that dominate Oklahoma's agricultural identity.
  - Oklahoma's dairy sector has always operated in the shadow of beef. The state is cattle country by reputation, and that image runs deep. Designating milk as the official drink was, in part, a way of putting dairy on the map — officially, at least — as a contributor to the state economy and rural life.
- id: unofficial-drinks
  icon: fa-solid fa-glass-water
  title: Roy Rogers, the Lunchbox, and the Official Line
  paragraphs:
  - The Roy Rogers — ginger ale or cola with grenadine and a maraschino cherry — is non-alcoholic, named after the Hollywood Western star whose clean-cut cowboy persona made him a natural fit for a family-friendly drink. Roy Rogers was born in Ohio and built his career in California, but his Western image resonates in a state with deep cowboy identity. The drink itself has no traceable Oklahoma origin; it's a nationally known menu item that carries his name everywhere, not just here.
  - The Lunchbox is a different story. This Oklahoma City cocktail — orange juice, amaretto, and beer — developed a genuine local following and spread through word of mouth across the state's bar scene. It is genuinely Oklahoma City in character, but it is a regional staple, not an officially recognized state symbol.
  - Both drinks have cultural traction. Neither has official status. The legislature designated milk; everything else is local culture.
- id: context
  icon: fa-solid fa-map
  title: 'Oklahoma Isn''t Alone: Over 20 States Chose Milk'
  paragraphs:
  - Oklahoma is one of more than twenty states that have designated milk as an official beverage or state drink — part of a national pattern driven by dairy industry advocates and agricultural groups, often working through 4-H chapters and farm bureaus. Some states made the designation in the 1980s at the height of that lobbying push; others followed later. Oklahoma's dual designations in 1985 and 2002 land squarely in that tradition. The choice is not distinctive to Oklahoma; the cattle-country context that shaped it is.
timeline:
- year: '1985'
  description: Oklahoma designates milk as the official state beverage, spurred by 4-H member Daniel Howard's campaign to recognize the state's dairy industry.
- year: '2002'
  description: Oklahoma legislature designates milk as the official state drink — a second title reinforcing the 1985 beverage designation.
faq:
- question: What is Oklahoma's official state drink?
  answer: Milk. Oklahoma designated milk as the official state drink in 2002. It was also designated the official state beverage in 1985. Both titles apply to milk.
- question: Is the Roy Rogers Oklahoma's state drink?
  answer: No. The Roy Rogers is a nationally known non-alcoholic drink named after the Hollywood Western star Roy Rogers. It has no official Oklahoma designation and no traceable origin in the state.
- question: Is the Lunchbox Oklahoma's state drink?
  answer: No. The Lunchbox is a well-known Oklahoma City cocktail — orange juice, amaretto, and beer — but it holds no official state designation. It is a local cultural favorite, not an official symbol.
- question: Why did Oklahoma choose milk as its state drink?
  answer: The designation was driven by an effort to recognize the importance of the dairy industry to Oklahoma agriculture. 4-H member Daniel Howard promoted the cause, leading to the 1985 state beverage designation.
- question: What is the difference between Oklahoma's state beverage and state drink?
  answer: There is no functional difference. Oklahoma designated milk as the state beverage in 1985 and as the state drink in 2002. Both designations are current and both refer to milk.
- question: How many states have chosen milk as their official drink?
  answer: More than twenty states have designated milk as an official state beverage or drink, most following dairy industry advocacy campaigns in the 1980s and later.
