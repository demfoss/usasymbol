seo_description: "Oklahoma first named milk state beverage in 1985 and recast it as state drink in 2002."
intro_text: '**Milk is Oklahoma''s official state drink** — designated first as the official state beverage in **1985**, then confirmed as the official state drink in **2002**. The Roy Rogers and the Lunchbox are drinks people associate with Oklahoma, but neither holds any official status. The title belongs to milk, placed there specifically to recognize what dairy means to Oklahoma agriculture. This profile appears in the [list of U.S. state beverages](/symbols/beverages).'
