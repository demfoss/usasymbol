seo_title: "Oklahoma State Nickname | The Sooner State"
seo_description: "Oklahoma is known as The Sooner State, its official state nickname. Learn what Sooner State means, why Oklahoma uses it, and what other nicknames the state has had."

intro_text: "Oklahoma is known as <i>the Sooner State</i>, a nickname rooted in the events surrounding the Land Run of 1889 and cataloged in the [list of U.S. state nicknames](/symbols/nicknames). Sooners were settlers who entered Oklahoma Territory ahead of the official start time to claim land, often in violation of the rules. The term later spread in popular and institutional use, including its adoption by the University of Oklahoma for its athletic teams in 1908, and remains the state’s most widely recognized and established nickname."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Sooner State'"
    paragraphs:
      - "President Benjamin Harrison opened the Unassigned Lands for settlement on April 22, 1889 at exactly noon. Nearly 50,000 people waited along the borders for the signal. Some settlers crossed early and hid in ditches or brush so they could stake claims ahead of everyone else. The Indian Appropriations Act included a sooner clause that said anyone entering before the designated time would forfeit their right to claim land. People called these rule breakers Sooners. The name was an insult at first."
      - "Legal settlers despised Sooners because they cheated the system. These early entrants grabbed the best farmland and town lots before honest participants even crossed the border. Railroad workers and surveyors who had legitimate work in the territory also used their access to claim prime locations illegally. Disputes between legal claimants and Sooners ended up in court for decades. The United States Department of the Interior finally had to step in and settle most cases. During an 1895 land run, Sooners took nearly half the available land before the official start."
      - "The University of Oklahoma changed everything in 1908. The football team needed a nickname and chose Sooners after trying Rough Riders and Boomers first. Negative feelings about the name gradually faded over the next twenty years. By the 1920s, Oklahomans embraced Sooner as a mark of boldness and pioneer determination. The state of oklahoma nickname caught on during this period without any legislative action. License plates, university fight songs, and tourist materials now use the Sooner name throughout Oklahoma, alongside formal symbolism on [Oklahoma's state motto page](/states/oklahoma/motto/labor-omnia-vincit)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Boomer State"
        text: "Boomers operated differently from Sooners. David L. Payne organized the Boomer Movement in the late 1870s to pressure the government into opening the Unassigned Lands. His followers believed the Homestead Act of 1862 gave them the right to settle on public land. Federal troops repeatedly expelled Boomers from Indian Territory before 1889. Dr. Morrison Munford of the Kansas City Times coined the terms Boom and Boomer to describe the settlement campaign. The Santa Fe Railway Company backed their efforts because the railroad wanted to develop the region. When the land run finally happened, many Boomers who waited for the legal signal discovered Sooners had already claimed the choice sections, in the same civic era represented by [Oklahoma's state flag history](/states/oklahoma/flag/oklahoma-state-flag)."
      - subtitle: "Native America"
        text: "Thirty-nine federally recognized Native American tribes have headquarters in Oklahoma today. Congress created Indian Territory in the 1830s as a permanent homeland for tribes forced to relocate from the Southeast. The Cherokee, Chickasaw, Choctaw, Creek, and Seminole nations endured the Trail of Tears to reach this designated land. These groups became known as the Five Civilized Tribes. Following the Civil War, the federal government renegotiated treaties and took back portions of tribal territory, labeling them Unassigned Lands. Indian Territory and Oklahoma Territory merged in 1907 to form the state. Oklahoma comes from two Choctaw words meaning red people. Museums, cultural centers, and events like the Red Earth Festival keep tribal traditions alive across the state. Texas shares a similar history of displaced tribal nations along its borders — the [history behind the Lone Star State](/states/texas/nickname/the-lone-star-state) includes the same era of federal Indian policy that reshaped the entire southern plains."
      - subtitle: "Land of the Red Man"
        text: "This earlier nickname acknowledged both the state's name meaning and its Native American population. Before 1907, the entire region was Indian Territory where relocated tribes governed themselves. Each nation maintained its own courts, schools, and laws. The Five Civilized Tribes attempted to create an independent state called Sequoyah in 1905, but Congress rejected their proposal. Federal lawmakers instead combined Indian Territory with Oklahoma Territory when granting statehood. Oklahoma's state seal includes symbols from all Five Tribes arranged in a star pattern. The nickname appears less often now, though it recognizes the forced removal that brought Native peoples here and their continued presence, while modern scale can be compared in [U.S. states by population](/rankings/demographics/states-by-population)."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "Approximately 50,000 people participated in the Land Rush of 1889, racing to claim portions of nearly 2 million acres."
      - "People sometimes called Sooners moonshiners because they crossed into the territory illegally at night by moonlight."
      - "The University of Oklahoma's football team tried using Rough Riders and Boomers before finally adopting Sooners in 1908."
      - "Oklahoma's state motto Labor Omnia Vincit comes from Roman poet Virgil's Georgics and means work conquers all things."
      - "Oklahoma became the 46th state on November 16, 1907 when Congress merged Indian Territory with Oklahoma Territory."
      - "Sooners illegally claimed about half of all available land during the 1895 land run before the official noon start time."
      - "Under the Homestead Act of 1862, settlers could claim 160 acres of public land by living on it five years and making improvements."

faq:

  - question: "What is oklahoma nickname?"
    answer: "The oklahoma nickname is The Sooner State. People started using this name in the 1920s, though state lawmakers never officially adopted it through legislation."

  - question: "Why is oklahoma nickname the sooner state?"
    answer: "Oklahoma got this name from Sooners who entered the territory illegally before the noon start of the 1889 Land Rush to grab the best land."

  - question: "What is the state of oklahoma nickname?"
    answer: "The state of oklahoma nickname is The Sooner State. The University of Oklahoma adopted Sooners for its football team in 1908, helping spread the name statewide."

  - question: "What is the oklahoma nickname meaning?"
    answer: "The oklahoma nickname meaning comes from settlers who arrived too soon, before land runs officially started. The term was negative originally but became a positive identity."

  - question: "What is the oklahoma nickname and motto?"
    answer: "The oklahoma nickname and motto are The Sooner State and Labor Omnia Vincit. The Latin motto means work conquers all and comes from Roman poet Virgil."

  - question: "When did Oklahoma get the Sooner State nickname?"
    answer: "Oklahoma gained the Sooner State nickname during the 1920s after the University of Oklahoma adopted Sooners in 1908. No legislation ever made it official."

  - question: "What does Boomer State mean?"
    answer: "Boomer State refers to activists who campaigned for legal access to Oklahoma lands during the 1870s and 1880s before the government opened settlement."

