faq:
  - question: What is Oklahoma's state mineral?
    answer: "Oklahoma's mineral symbol is the hourglass selenite crystal, a form of gypsum officially named the state crystal in 2005."
  - question: When did Oklahoma adopt hourglass selenite crystal as its state crystal?
    answer: "The Oklahoma Legislature designated hourglass selenite crystal the official state crystal in 2005."
  - question: Why did Oklahoma choose hourglass selenite crystal?
    answer: "The Great Salt Plains is the only documented site where selenite forms this hourglass pattern, and Oklahoma schoolchildren petitioned lawmakers to recognize it."
  - question: Where can you find hourglass selenite crystal in Oklahoma?
    answer: "Crystals form beneath the Great Salt Plains near Jet, where a public dig area within the Great Salt Plains National Wildlife Refuge is open each year from April through October."

