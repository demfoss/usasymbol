intro_text: "Oklahoma's state crystal is hourglass selenite, adopted in 2005 to recognize a gypsum crystal that forms an hourglass-shaped band of trapped sand, found only beneath the Great Salt Plains near Jet. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Oklahoma State Crystal
    paragraphs:
      - "Hourglass selenite crystal is Oklahoma's official state crystal, designated by the Oklahoma Legislature in 2005. It is a form of gypsum that grows an hourglass-shaped band of trapped sand through its center, found beneath the Great Salt Plains in northwestern Oklahoma."
      - "Lawmakers chose it because no other place on Earth is known to produce this exact hourglass formation, giving Oklahoma a mineral genuinely its own."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Hourglass Selenite Crystal?"
    paragraphs:
      - "Selenite is a clear to smoky, glassy form of gypsum, a soft mineral that crystallizes when saline groundwater evaporates and leaves calcium sulfate behind. At the Great Salt Plains, the crystal grows around grains of trapped sand and clay, and those particles form a pinched band through the middle that gives the crystal its hourglass shape."
      - "Individual crystals can reach several inches long and usually sit just a few inches below the salt flat's surface. No two hourglass patterns match exactly, since each depends on how sand settled around the crystal as it grew."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Oklahoma Chose Hourglass Selenite Crystal as Its State Crystal"
    paragraphs:
      - "The Great Salt Plains is the only documented place where selenite crystals form with this particular hourglass inclusion, giving Oklahoma a mineral no other state can claim. That rarity, not any industrial use, drove the 2005 designation."
      - "The push for the symbol came from Oklahoma schoolchildren rather than a mining company or collector group, giving the crystal a grassroots origin unusual among state mineral symbols."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Hourglass Selenite Crystal Became Oklahoma's State Crystal"
    paragraphs:
      - "Students from schools in Bryant and Red Oak petitioned state lawmakers for the honor, and the Oklahoma Legislature passed the bill naming hourglass selenite crystal the official state crystal in 2005."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Hourglass Selenite Crystal Is Found in Oklahoma"
    paragraphs:
      - "Hourglass selenite crystals form only beneath the Great Salt Plains near Jet, in Alfalfa County. A public digging area within the Great Salt Plains National Wildlife Refuge opens each year from April through October, letting visitors dig their own crystals with a small shovel."
    sites:
      - name: Great Salt Plains Selenite Crystal Dig Area
        city: Jet
        lat: 36.6892
        lng: -98.1361
        note: "Only known hourglass selenite site"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Hourglass Selenite Crystal Facts"
    facts:
      - "Adopted as Oklahoma's state crystal in 2005."
      - "The Great Salt Plains near Jet is the only place on Earth known to produce hourglass-shaped selenite crystals."
      - "The hourglass pattern comes from sand and clay grains trapped inside the gypsum as it grew."
      - "Oklahoma schoolchildren petitioned state lawmakers for the designation."

