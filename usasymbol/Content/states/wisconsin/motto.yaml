sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Wisconsin State Motto"
    paragraphs:
      - "Wisconsin's state motto is <strong>Forward</strong>, adopted in 1851 and codified in Wisconsin Statutes §1.10. It is one of the shortest state mottos in the country — a single word with no Latin or translation required."
      - "The word replaced the territorial motto <em>Civilitas Successit Barbarum</em>, a Latin phrase meaning <em>Civilization Succeeds Barbarism</em>. The new motto dropped the Latin entirely and pointed ahead rather than backward."

  - id: meaning
    icon: "fa-solid fa-star"
    title: "Wisconsin State Motto Meaning"
    paragraphs:
      - "\"Forward\" means exactly what it says: keep moving, keep progressing. The people who chose it in 1851 picked an English word over Latin specifically because every Wisconsin citizen — farmer, immigrant, laborer — could read it and understand it without a classical education."
      - "The word appears on the state coat of arms on a banner above the badger, which is Wisconsin's state animal. It also appears in Wisconsin's state song, \"On, Wisconsin\": <em>\"Champion of the right, Forward, our motto — God will give thee might!\"</em>"

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Wisconsin's State Motto"
    paragraphs:
      - "In 1851, Governor Nelson Dewey asked University of Wisconsin Chancellor John H. Lathrop to redesign the state seal. Lathrop's design included the Latin motto <em>Excelsior</em> — the same word used by New York state."
      - "According to Wisconsin tradition recorded in the Wisconsin Blue Book, Dewey took the design to New York City to be engraved. There he met Edward Ryan, a prominent Wisconsin lawyer who would later become Chief Justice of the Wisconsin Supreme Court. Ryan objected to <em>Excelsior</em>. The two men sat together, reconsidered the seal, and chose <em>Forward</em> over other candidates including <em>Upward</em> and <em>Onward</em>."
      - "They chose <em>Forward</em> because it was the strongest and most decisive of the options. The 1851 seal introduced the word, and it has remained the state motto ever since."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Forward\" on the Wisconsin State Seal"
    paragraphs:
      - "\"Forward\" appears on Wisconsin's coat of arms on a scroll above the badger at the crest of the shield. The coat of arms is used on both the state seal and the state flag."
      - "The Great Seal of Wisconsin shows a sailor and a miner supporting a central shield divided into four quarters representing agriculture, mining, manufacturing, and navigation. The badger at the crest holds the scroll with the motto. A cornucopia and a pyramid of lead ingots flank the shield below."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Wisconsin State Motto Facts"
    style: "gradient"
    facts:
      - "\"Forward\" is one of the shortest state mottos in the U.S. — a single English word."
      - "Wisconsin adopted it in 1851, replacing the Latin territorial motto Civilitas Successit Barbarum."
      - "Governor Nelson Dewey and lawyer Edward Ryan chose it over Upward and Onward as stronger alternatives."
      - "Edward Ryan later became Chief Justice of the Wisconsin Supreme Court."
      - "The motto is codified in Wisconsin Statutes §1.10."
      - "\"Forward\" appears in the Wisconsin state song \"On, Wisconsin\" as part of the lyrics."

