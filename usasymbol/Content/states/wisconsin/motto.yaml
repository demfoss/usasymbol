seo_title: "Wisconsin State Motto | Forward"
seo_description: "Wisconsin's state motto is \"Forward,\" adopted in 1851. The English word replaced a Latin territorial motto and is codified in Wisconsin Statutes §1.10."

intro_text: "Wisconsin's state motto is <strong>Forward</strong>, a single English word adopted in 1851 when the state seal was redesigned. Governor Nelson Dewey and future Wisconsin Supreme Court Chief Justice Edward Ryan chose it over a proposed Latin motto because they wanted every citizen to understand the motto without knowing Latin. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

