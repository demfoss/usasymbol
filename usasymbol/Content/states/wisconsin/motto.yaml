faq:
  - question: "What is Wisconsin's state motto?"
    answer: "Wisconsin's state motto is \"Forward,\" adopted in 1851 and codified in Wisconsin Statutes §1.10. It replaced the Latin territorial motto Civilitas Successit Barbarum."

  - question: "What does Wisconsin's motto \"Forward\" mean?"
    answer: "It means to keep moving and progressing. The word was chosen in 1851 because it is English — every citizen could read and understand it without knowing Latin. It was picked over other candidates including Upward and Onward."

  - question: "When did Wisconsin adopt its state motto?"
    answer: "In 1851, when the state seal was redesigned. Governor Nelson Dewey and lawyer Edward Ryan chose \"Forward\" over the proposed Latin motto Excelsior and other English alternatives."

  - question: "Where does Wisconsin's motto appear?"
    answer: "\"Forward\" appears on a scroll above the badger on Wisconsin's coat of arms, which is used on both the state seal and the state flag. It also appears in the lyrics of the state song \"On, Wisconsin.\""

