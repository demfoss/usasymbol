seo_title: "Wisconsin State Motto: Forward"
seo_description: "Wisconsin's motto was chosen on the steps of a Wall Street bank in 1851 when Governor Dewey and attorney Ryan rejected the designer's Latin proposal — 'Excelsior,' already New York's motto. Wisconsin's territorial motto had been 'Civilization Succeeds Barbarism.' The state song includes the line 'Forward our motto, God will give thee might.'"

intro_text: "Wisconsin's state motto is <strong>Forward</strong> — a single English word chosen in 1851 when Governor Nelson Dewey and Milwaukee attorney Edward Ryan sat on the steps of a Wall Street bank and redesigned the state seal themselves. The seal's designer, University Chancellor John Lathrop, had proposed the Latin motto <em>Excelsior</em> — already New York's motto. Dewey and Ryan rejected it, considered 'Upward' and 'Onward,' and settled on 'Forward' as the strongest choice. The previous territorial motto had been <em>Civilitas Successit Barbarum</em> — 'Civilization Succeeds Barbarism.' 'Forward' was a complete break from that condescending phrase."

sections:
  - id: "wall-street-bank-steps"
    icon: "fa-solid fa-stairs"
    title: "Chosen on the Steps of a Wall Street Bank"
    paragraphs:
      - "Wisconsin became the 30th state on May 29, 1848. Governor Nelson Dewey needed an official state seal. He asked University Chancellor John Lathrop to design one. Lathrop created a design incorporating the Latin motto <em>Excelsior</em> — meaning 'Ever Upward' or 'Higher.' Dewey took the design to New York City to have it engraved."
      - "In New York, Dewey encountered Milwaukee attorney Edward Ryan. When Dewey showed Ryan the Lathrop design, both men objected to <em>Excelsior</em> immediately — it was already New York's motto. They also rejected the Latin itself as pretentious. According to traditional accounts, they sat down on the steps of a Wall Street bank and redesigned the seal on the spot, adding a badger to the design and discussing English alternatives to replace the Latin motto."
      - "They considered 'Upward' and 'Onward' before settling on 'Forward.' Ryan apparently argued that 'Forward' sounded more decisive — it implied movement that had already begun rather than aspiration. Both men agreed. The engraver received revised specifications. Wisconsin's motto was chosen not by a legislative committee or a formal design process but by two men improvising on a Manhattan sidewalk."

  - id: "replacing-barbarism"
    icon: "fa-solid fa-rotate-left"
    title: "Replacing 'Civilization Succeeds Barbarism'"
    paragraphs:
      - "Wisconsin's territorial motto had been <em>Civilitas Successit Barbarum</em> — 'Civilization Succeeds Barbarism.' This phrase expressed a common 19th-century attitude toward Indigenous peoples and frontier settlement: the idea that European-American civilization was displacing something savage and inferior. By 1851, the new state's governor found this both grandiose and retrograde."
      - "Dewey and Ryan's choice of 'Forward' represented a clean break. Where the territorial motto looked backward — defining the new state against what it had replaced — 'Forward' pointed ahead. It made no claim about what Wisconsin was moving away from, only about the direction it was heading. The word was simpler, more democratic, and entirely focused on future possibility."
      - "Edward Ryan later became Chief Justice of the Wisconsin Supreme Court (1874-1880), one of the more influential judicial figures in Wisconsin history. His role in the Wall Street improvisation — if the account is accurate — means that a future Chief Justice helped design the state motto while sitting on bank steps with the governor. Ryan reportedly remained proud of the choice throughout his career."

  - id: "state-song-and-use"
    icon: "fa-solid fa-music"
    title: "'Forward Our Motto' — In the State Song"
    paragraphs:
      - "Wisconsin's state song 'On, Wisconsin!' (adopted 1959) includes the line 'Forward our motto, God will give thee might.' The song is also the University of Wisconsin-Madison's fight song, written in 1909. The motto appears in the lyrics in a way that few state mottos do — embedded in a song performed at sporting events, graduation ceremonies, and civic occasions."
      - "The coat of arms displays 'Forward' on a white banner directly above a badger — the animal that gives Wisconsin its 'Badger State' nickname. Below the badger, a shield contains symbols for agriculture (a plow), mining (a pick and shovel), manufacturing (an arm and hammer), and navigation (an anchor). A sailor and miner flank the shield. The American sailor and miner represent the two industries that built Wisconsin's early economy."
      - "Wisconsin's first official state flag was created in 1863 when Civil War regiments needed battlefield flags. The legislature adopted a dark blue flag with the coat of arms, which included 'Forward' on the banner above the badger. The flag received modifications in 1979 — 'Wisconsin' and '1848' (the statehood year) were added in white letters — taking effect May 1, 1981."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Wisconsin State Motto Facts"
    style: "gradient"
    facts:
      - "Governor Dewey and attorney Ryan chose the motto on the steps of a Wall Street bank while in New York to have the seal engraved."
      - "The designer's proposal — 'Excelsior' (Latin: Ever Upward) — was already New York's motto."
      - "Wisconsin's previous territorial motto was 'Civilitas Successit Barbarum' — 'Civilization Succeeds Barbarism.'"
      - "Edward Ryan, who helped choose 'Forward,' later became Chief Justice of the Wisconsin Supreme Court (1874–1880)."
      - "The state song 'On, Wisconsin!' includes the line 'Forward our motto, God will give thee might.'"
      - "Wisconsin is one of only two states with a one-word English motto — the other is Maine ('Dirigo') and Rhode Island ('Hope'). Actually, Rhode Island also has a one-word motto."

faq:
  - question: "What is Wisconsin's state motto?"
    answer: "Wisconsin's state motto is 'Forward,' a single English word adopted in 1851. Governor Nelson Dewey and Milwaukee attorney Edward Ryan chose it when redesigning the state seal in New York City, rejecting the designer's Latin proposal of 'Excelsior' (already New York's motto)."

  - question: "How was Wisconsin's motto chosen?"
    answer: "Governor Dewey and attorney Edward Ryan reportedly sat on the steps of a Wall Street bank in 1851 and redesigned the state seal themselves, after rejecting Chancellor Lathrop's 'Excelsior' proposal as pretentious and already taken by New York. They considered 'Upward' and 'Onward' before settling on 'Forward' as the most decisive-sounding option."

  - question: "What replaced Wisconsin's old territorial motto?"
    answer: "Wisconsin's territorial motto was 'Civilitas Successit Barbarum' — 'Civilization Succeeds Barbarism.' The 1851 adoption of 'Forward' was a deliberate break from this phrase, shifting from a backward-looking definition of Wisconsin against what it had displaced to a forward-looking statement about future progress."

  - question: "What language is Wisconsin's motto written in?"
    answer: "English. Dewey and Ryan chose English specifically because they wanted every citizen to understand the motto without classical education. They rejected a Latin proposal ('Excelsior') as pretentious, preferring a single plain English word over Latin ornamentation."

  - question: "When did Wisconsin officially adopt its motto?"
    answer: "In 1851, when Governor Dewey and Edward Ryan selected 'Forward' during their New York City seal redesign. The motto appeared on the state seal and has been in official use since then."

  - question: "Where does Wisconsin's motto appear?"
    answer: "On a white banner above the badger on the state coat of arms. The coat of arms appears on the state flag (dark blue, with 'Wisconsin' and '1848' added in 1981) and official state documents. The state song 'On, Wisconsin!' includes the line 'Forward our motto, God will give thee might.'"

