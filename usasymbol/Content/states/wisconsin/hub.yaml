name_meaning:
  heading: What Does Wisconsin Mean?
  paragraphs:
  - Wisconsin became the 30th state in 1848. The state name comes through French spelling from an Indigenous name for the Wisconsin River, though the exact original meaning has been debated.
  - The symbols on this page are easier to read than the name origin. Wisconsin's public identity leans on the Badger State nickname, dairy farming, Northwoods forests, schoolchildren selections, and the short motto Forward.
  - Wisconsin's postal abbreviation is WI, and residents are Wisconsinites. The Badger State nickname comes from lead miners who lived in hillside dugouts rather than from the animal being unusually common.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Comes through French spelling from an Indigenous name associated with the Wisconsin River.
    - label: Statehood
      text: Wisconsin became the 30th state in 1848.
    - label: Nickname source
      text: Badger State refers to 1820s and 1830s lead miners who dug shelters into hillsides.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Wisconsin, a Great Lakes state with dairy country, hardwood forests, lake country, and mining memory.
    - label: People
      text: People from Wisconsin are called Wisconsinites.
    - label: Agriculture
      text: Milk and the dairy cow make dairy farming central to the state's symbol set.
  - heading: Nicknames and Short Forms
    items:
    - label: The Badger State
      text: Wisconsin's best-known nickname, rooted in early lead-mining history.
    - label: Abbreviation
      text: WI; older short form Wis.
editorial:
  heading: What Wisconsin's Symbols Say About the State
  paragraphs:
  - The [Badger State nickname](/states/wisconsin/nickname) and [badger](/states/wisconsin/mammal/badger) are really a mining story. The animal became official long after miners had already turned dugout living into a state identity.
  - Wisconsin's dairy symbols are much more literal. [Milk](/states/wisconsin/beverage/milk) and the [dairy cow](/states/wisconsin/mammal/dairy-cow) put the state's farm economy in the same guide as the [state flag](/states/wisconsin/flag) and [Forward motto](/states/wisconsin/motto).
  - "The [American robin](/states/wisconsin/bird), [wood violet](/states/wisconsin/flower), and [sugar maple](/states/wisconsin/tree) share a 1949 adoption year, while the [Brandy Old Fashioned](/states/wisconsin/beverage/brandy-old-fashioned) page gives the hub an honest Wisconsin footnote: culturally unmistakable, but not legally official."
faq:
- question: What is Wisconsin's most famous state symbol?
  answer: The [Badger State nickname](/states/wisconsin/nickname) is Wisconsin's most famous symbol because it explains both the official badger and the state's long-running public identity.
- question: What is Wisconsin's state bird?
  answer: Wisconsin's state bird is the [American robin](/states/wisconsin/bird), made official in 1949 after schoolchildren had selected it decades earlier.
- question: What is Wisconsin's state flower?
  answer: Wisconsin's state flower is the [wood violet](/states/wisconsin/flower), adopted in 1949.
- question: Is the Brandy Old Fashioned Wisconsin's official state cocktail?
  answer: No. The [Brandy Old Fashioned](/states/wisconsin/beverage/brandy-old-fashioned) has a strong Wisconsin identity, but the attempted 2023-2024 resolution did not become law.
- question: How many official state symbols does Wisconsin have?
  answer: Wisconsin's state symbols list here includes the flag, robin, wood violet, sugar maple, Forward motto, Badger State nickname, colors, milk, dairy cow, badger, white-tailed deer, American water spaniel, and Brandy Old Fashioned page.
