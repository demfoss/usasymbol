seo_description: "Wisconsin state symbols: official state symbols include the American robin, wood violet, sugar maple, badger, Forward motto, and Badger State nickname."
snippet_answer: Find out more about the official state symbols that represent Wisconsin, from the American robin and wood violet to the badger, Forward motto, and Badger State nickname. The dairy cow, blue coat-of-arms flag, American water spaniel, and Brandy Old Fashioned page make Wisconsin's list one of the more food-and-drink-conscious in the Midwest.
