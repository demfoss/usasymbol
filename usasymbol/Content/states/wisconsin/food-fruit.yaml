seo_title: "Wisconsin State Fruit | Cranberry"
seo_description: "Wisconsin's state fruit is the cranberry, adopted in 2003, grown in bogs across central Wisconsin."
hero_image: /images/foods/wisconsin/wisconsin-state-fruit-hero.webp
hero_image_alt: "Ripe red cranberries floating in a bog."
hero_image_caption: "The cranberry, Wisconsin's official state fruit."
intro_text: "Wisconsin's state fruit is the cranberry, adopted in 2003 to recognize a crop that makes the state the nation's leading cranberry producer. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    icon: fa-solid fa-apple-whole
    title: "What Is Wisconsin's State Fruit?"
    paragraphs:
      - "The cranberry, Vaccinium macrocarpon, is Wisconsin's official state fruit, designated by the Wisconsin Legislature in 2003. Wisconsin grows more cranberries than any other state, mainly in the central part of the state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Cranberry"
    paragraphs:
      - "Cranberries are small, tart red berries that grow on low vines in wetland bogs called marshes in Wisconsin. Growers flood the marshes at harvest time each fall, letting the buoyant berries float to the surface for gathering."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Cranberry Became Wisconsin's State Fruit"
    paragraphs:
      - "The Wisconsin Legislature designated the cranberry the official state fruit in 2003."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Wisconsin Chose the Cranberry"
    paragraphs:
      - "Wisconsin has been the top cranberry-producing state in the country since the 1990s, with marshes concentrated in Wood, Monroe, and Jackson counties, making the fruit central to the state's agricultural identity."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Cranberry Comes From in Wisconsin"
    paragraphs:
      - "Wisconsin Rapids and the surrounding Wood County area are at the center of the state's cranberry industry, home to many working cranberry marshes."
    sites:
      - name: Wisconsin Rapids cranberry marshes
        city: Wisconsin Rapids
        lat: 44.38
        lng: -89.82
        note: "Center of Wisconsin's cranberry industry"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Cranberry Facts"
    facts:
      - "Adopted as Wisconsin's state fruit in 2003."
      - "Wisconsin has been the nation's top cranberry producer since the 1990s."
      - "Wood, Monroe, and Jackson counties are the state's leading cranberry areas."

