- id: facts
  icon: fa-solid fa-lightbulb
  title: Muskellunge Facts
  facts:
  - Adopted in 1955 by the Wisconsin Legislature.
  - Scientific name is Esox masquinongy.
  - It is the largest predatory fish in Wisconsin.
  - Wisconsin's record musky weighed 69 pounds, 11 ounces and was 63.5 inches long.
  - The name probably comes from an Ojibwe word meaning "ugly pike."
faq:
- question: What is Wisconsin's state fish?
  answer: Wisconsin's state fish is the muskellunge, often called the musky. It is the largest predatory fish in the state.
- question: When did Wisconsin adopt the Muskellunge?
  answer: The Wisconsin Legislature made the muskellunge the official state fish in 1955. The vote was unanimous.
- question: Why did Wisconsin choose the Muskellunge?
  answer: The musky is one of Wisconsin's most valued trophy fish. Lawmakers named it the state fish because it was so highly prized.
- question: How big was the biggest musky caught in Wisconsin?
  answer: Wisconsin's record musky was caught in 1949 on the Chippewa Flowage near Hayward. It weighed 69 pounds, 11 ounces and measured 63.5 inches long.
- question: Where do muskies live in Wisconsin?
  answer: Muskies live in lakes and large rivers with plenty of underwater plants. Most of them are found in northern Wisconsin.
