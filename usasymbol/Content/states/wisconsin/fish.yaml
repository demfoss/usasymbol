seo_title: Wisconsin State Fish | Muskellunge
seo_description: The Wisconsin state fish is the muskellunge, adopted in 1955. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/wisconsin/wisconsin-fish-hero.webp
hero_image_alt: A long, torpedo-shaped muskellunge with a light body, dark markings, and a wide, toothy mouth.
hero_image_caption: The muskellunge, or musky, is Wisconsin's state fish and the largest predatory fish in the state.
intro_text: Wisconsin's state fish is the muskellunge, a huge predatory fish of the state's northern lakes, adopted in 1955. Anglers usually call it the musky. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Wisconsin?
  paragraphs:
  - The muskellunge is Wisconsin's official state fish. The Wisconsin Legislature named it in 1955.
  - Its scientific name is Esox masquinongy. Many people shorten its name to musky or muskie.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Muskellunge
  paragraphs:
  - The muskellunge has a long, sleek body shaped like a torpedo. It is usually light green, brown, or silver with darker bars or spots along its sides.
  - It has a long, flat snout and a big mouth full of sharp teeth. Its back fin sits far back on its body, close to the tail.
  - The musky is the largest predatory fish in Wisconsin. The state record fish was more than five feet long.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Wisconsin Legislature voted unanimously in 1955 to make the muskellunge the official state fish.
  - Today it is listed in state law alongside other Wisconsin symbols, such as the robin and the badger.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Wisconsin Chose the Muskellunge
  paragraphs:
  - State biologists describe the musky as one of Wisconsin's most important and unique trophy fish. It was so highly valued that lawmakers made it the state fish.
  - Wisconsin is also famous for giant muskies. The state record, caught near Hayward in 1949, weighed 69 pounds, 11 ounces.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Muskellunge
  paragraphs:
  - Muskies live in lakes of all sizes and in large rivers, usually where lots of underwater plants grow.
  - Their main range is in north central Wisconsin, and almost 90 percent of the state's musky waters are in the north. The Hayward area is well known for big muskies.
