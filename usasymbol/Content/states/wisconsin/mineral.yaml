intro_text: "Wisconsin's state mineral is galena, adopted in 1971 to recognize the lead ore mined around Mineral Point that gave the state its Badger nickname and its earliest mining economy. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Wisconsin State Mineral
    paragraphs:
      - "Galena is Wisconsin's official state mineral, designated by the state legislature in 1971. It is a lead sulfide mineral, heavy and metallic gray, and it was the ore that drove Wisconsin's first major mining boom in the 1820s and 1830s."
      - "Lawmakers picked galena on the recommendation of the Kenosha Gem and Mineral Society, choosing a mineral that met criteria for abundance, economic value, and historical significance to the state."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Galena?"
    paragraphs:
      - "Galena is lead sulfide, a heavy, brittle mineral with a bright metallic luster and a lead-gray color. It typically forms cube-shaped crystals with flat, mirror-like faces, and it breaks along smooth, perfectly flat surfaces called cleavage planes."
      - "The mineral forms in hydrothermal veins, where hot, mineral-rich fluids deposit lead and sulfur in cracks and cavities within surrounding rock, often alongside zinc ore. Wisconsin's galena formed this way in dolomite bedrock across the state's southwestern counties."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Wisconsin Chose Galena as Its State Mineral"
    paragraphs:
      - "Galena drew the first large wave of settlers to southwestern Wisconsin in the late 1820s, when miners flocked to the area now covering Iowa, Lafayette, and Grant counties to dig lead ore out of shallow deposits. By 1829 more than 4,000 miners worked the district, and some lived in dugouts burrowed into hillsides, a habit that earned them the nickname Badgers and gave Wisconsin its state nickname."
      - "Mineral Point became the center of that lead rush, and Cornish immigrants who arrived in the 1830s built the small stone homes that still mark the town today. Naming galena the state mineral in 1971 tied the designation directly to the industry that shaped Wisconsin's earliest population and identity."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Galena Became Wisconsin's State Mineral"
    paragraphs:
      - "The Kenosha Gem and Mineral Society proposed galena and red granite as Wisconsin's state mineral and state rock, and the state legislature adopted both in 1971."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Galena Is Found in Wisconsin"
    paragraphs:
      - "Wisconsin's galena deposits are concentrated in the Upper Mississippi Valley lead-zinc district in the southwestern part of the state, centered on Mineral Point in Iowa County. Lead ore discovered there in 1827 and 1828 drew the district's first wave of miners and gave the town its name."
    sites:
