  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Galena Facts"
    facts:
      - "Adopted as Wisconsin's state mineral in 1971."
      - "Wisconsin's Badger State nickname comes from lead miners who lived in dugouts burrowed into hillsides near Mineral Point."
      - "By 1829, more than 4,000 miners worked Wisconsin's lead district, producing about 13 million pounds of lead a year."
      - "Galena's chemical formula is PbS, lead sulfide, and it typically forms cube-shaped crystals."

