faq:
  - question: What is Wisconsin's state mineral?
    answer: "Wisconsin's state mineral is galena, a lead sulfide mineral with a metallic gray color, adopted in 1971."
  - question: When did Wisconsin adopt galena as its state mineral?
    answer: "The Wisconsin Legislature designated galena the official state mineral in 1971."
  - question: Why did Wisconsin choose galena?
    answer: "Galena mining drew Wisconsin's first large wave of settlers to the Mineral Point area in the late 1820s and gave the state its Badger nickname."
  - question: Where can you find galena in Wisconsin?
    answer: "Wisconsin's galena is concentrated in the Upper Mississippi Valley lead-zinc district in the southwest, centered on Mineral Point in Iowa County."

