sections:
- id: history
  icon: fa-solid fa-landmark
  title: Wisconsin State Seal History and Origin
  paragraphs:
  - "Wisconsin entered the Union as the 30th state on May 29, 1848. The original Great Seal was adopted that same year to mark the new state's identity: a quartered shield naming its four economic sectors, flanked by supporting figures and topped by a badger. The seal was designed to reflect the specific economic geography of the Wisconsin Territory."
  - "The original 1848 seal served the state for more than three decades, but its design was inconsistently reproduced across different official uses. In 1881, the Wisconsin legislature substantially revised and standardized the seal's design, fixing the composition and proportions that remain in use today."
  - "The 1881 revision did not change the seal's fundamental argument: four industries, a badger, a motto, and a date. It sharpened and standardized the design so that every official use would produce the same image. The current authoritative description is codified in Wis. Stat. §14.47."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Wisconsin State Seal Symbols Mean
  paragraphs:
  - "The Wisconsin state seal is dense with specific imagery. The quartered shield, supporting figures, crest, and subsidiary symbols each carry a distinct meaning tied to the state's founding economy and geography."
  elements:
  - id: quartered-shield
    name: The Quartered Shield
    image: /images/state-seals/wisconsin/elements/shield.png
    paragraphs:
    - "The central shield is divided into four equal quarters, each containing a symbol of one of Wisconsin's four founding industries. The upper left shows a plow, representing agriculture. The upper right shows a crossed pick and shovel, representing mining. The lower left shows an arm and hammer, representing manufacturing. The lower right shows an anchor, representing navigation on Wisconsin's rivers and Great Lakes shoreline."
    - "The choice to use a quartered shield rather than a single dominant image was deliberate. Wisconsin in 1848 was not defined by one industry, as California was by gold or West Virginia by coal. The shield treated agriculture, mining, manufacturing, and navigation as equally important, which matched the territorial economy of the upper Midwest at mid-century."
  - id: badger
    name: The Badger
    image: /images/state-seals/wisconsin/elements/badger.png
    paragraphs:
    - "A badger sits above the shield as the crest of the coat of arms. The badger is Wisconsin's state animal and the source of the state's oldest nickname. Lead miners in southwestern Wisconsin during the 1820s and 1830s were known as badgers because they dug into hillsides for shelter rather than building conventional homes."
    - "Placing the badger above the shield rather than inside one of its quarters gave it a position of prominence over the four industries. The badger did not represent mining specifically; it represented the character of the people who had settled the territory."
  - id: sailor-and-yeoman
    name: The Sailor and the Yeoman
    image: /images/state-seals/wisconsin/elements/supporters.png
    paragraphs:
    - "A sailor stands to the left of the shield and a yeoman stands to the right, functioning as heraldic supporters. The sailor represents navigation and Wisconsin's commerce on the Great Lakes and its river systems. The yeoman represents the agricultural labor that defined most of the state's settled land."
  - id: cornucopia-and-lead
    name: Horn of Plenty and Lead Ingots
    image: /images/state-seals/wisconsin/elements/cornucopia-lead.png
    paragraphs:
    - "Below the shield, a horn of plenty and a pyramid of lead ingots appear as subsidiary symbols. The horn of plenty represents agricultural abundance. The pyramid of lead ingots directly references Wisconsin's lead mining industry, which made the southwestern part of the state one of the most economically active regions in the upper Midwest before the Civil War."
  - id: motto-forward
    name: Forward
    image: /images/state-seals/wisconsin/elements/motto.png
    paragraphs:
    - "'Forward' is Wisconsin's official state motto and appears on the seal on a banner below the shield. Wisconsin adopted the motto in 1851, three years after statehood. At one word, it is the shortest state motto in the United States."
    - "The motto was chosen to express a progressive orientation rather than a historical claim. Unlike mottos that reference the state's geography or Latin traditions, 'Forward' is a direction. It has appeared on the seal in every version since the 1881 revision."
  - id: thirteen-stars
    name: 13 Stars
    image: /images/state-seals/wisconsin/elements/stars.png
    paragraphs:
    - "Thirteen stars appear across the top of the seal, representing the 13 original states that formed the Union. Wisconsin was the 30th state admitted; the 13 stars placed it in the lineage of the original republic rather than counting its own position in the order of admission."
  - id: year-1848
    name: The Year 1848
    image: /images/state-seals/wisconsin/elements/year.png
    paragraphs:
    - "The year 1848 appears on the seal, marking Wisconsin's admission to the Union on May 29, 1848. The date was retained through the 1881 revision, anchoring the current design to the original year of statehood."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: 'Previous Versions of the Wisconsin State Seal'
  paragraphs:
  - "Wisconsin's seal history is more layered than a simple before-and-after between 1848 and 1881. The territory used one seal before statehood, the new state used an early state seal before adopting the motto Forward, and the familiar badger-and-shield design itself went through a pre-1881 and post-1881 form."
  - "What remained consistent after the early statehood period was the seal's central argument: Wisconsin defined itself through multiple industries rather than a single emblem. The 1881 revision standardized proportions and details rather than changing that broader idea."
