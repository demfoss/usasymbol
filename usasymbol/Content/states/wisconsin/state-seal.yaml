name: Great Seal of the State of Wisconsin
adopted_year: 1848
revised_year: 1881
is_official: true
legislation: Wis. Stat. §14.47
meaning: "The Great Seal of the State of Wisconsin uses a quartered heraldic shield to name the new state's four economic pillars. Each quarter identifies one industry: agriculture, mining, manufacturing, and navigation. The badger above the shield, the 13 stars, the supporting figures, and the motto 'Forward' complete a design that encodes Wisconsin's founding moment in the visual vocabulary of 19th-century statecraft. The current version was standardized in 1881."
