sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "Wisconsin designated the American badger as the official state wildlife animal in 1957 through legislation signed by Governor Vernon Thomson. The designation occurred 130 years after Wisconsin acquired the 'Badger State' nickname, formalizing through law what had been cultural identity since the 1820s lead mining boom."
      - "Wisconsin created a unique distinction by designating the badger as the state wildlife animal while maintaining the domestic dairy cow as the state domesticated animal, designated in 1971. This dual animal recognition acknowledges both wild heritage connected to frontier mining and agricultural economy based on dairy farming."
    
    subsections:
      - subtitle: "Formalizing Historical Nickname"
        text: "The 1957 badger designation made official what Wisconsinites already understood—the badger represented state identity more completely than any other animal could. Wisconsin earned the 'Badger State' nickname in the 1820s when lead miners flooded into the southwestern region around Mineral Point, Platteville, and Shullsburg, creating temporary housing by digging horizontal tunnels into hillsides rather than building cabins. These dugout shelters resembled badger burrows, leading observers to compare miners to badgers and giving Wisconsin its enduring nickname. By the time Wisconsin achieved territorial status in 1836 and statehood in 1848, the Badger State identity was firmly established despite the mining boom ending. The 1957 designation acknowledged this historical connection and prevented the nickname from becoming meaningless if residents forgot its mining origins. Unlike states that designated animals based purely on wildlife abundance or beauty, Wisconsin chose the badger specifically to preserve the link between animal behavior and human history."
      
      - subtitle: "Why It Took 130 Years"
        text: "Wisconsin's delay in designating the badger as official state animal until 1957 reflects the fact that the nickname already provided adequate symbolic recognition. From the 1820s forward, Wisconsin was universally known as the Badger State, making formal designation seem unnecessary for over a century. The 1950s saw increased interest nationwide in formalizing state symbols, with many states designating official birds, flowers, and animals during this period as part of civic identity movements. Wisconsin's 1957 badger designation occurred during this broader trend toward codifying informal symbols through legislation. The University of Wisconsin had already adopted 'Badgers' as its athletic teams' nickname by 1889 and introduced Bucky Badger as mascot in 1940, demonstrating that the badger symbolized Wisconsin identity long before legal recognition. The 1957 designation simply formalized what residents, businesses, and institutions had recognized for generations—the badger represented Wisconsin more distinctly than any other animal."
      
      - subtitle: "Domestic vs Wildlife Animal Categories"
        text: "Wisconsin's creation of separate wildlife animal and domesticated animal categories in 1957 and 1971 acknowledged the state's dual identity as both wild frontier and agricultural powerhouse. The badger designation as wildlife animal emphasized Wisconsin's natural heritage, frontier history, and wild character associated with the 'Badger State' nickname. Fourteen years later, the dairy cow's designation as domesticated animal recognized Wisconsin's transformation into America's leading dairy producer, acknowledging economic reality that dairy farming defines modern Wisconsin more than lead mining or frontier wildness. These complementary designations avoided choosing between competing identities—Wisconsin could honor both frontier past through the badger and agricultural present through the dairy cow. This dual recognition distinguished Wisconsin from states that designated single animals forcing choice between symbolic and economic importance. The badger represents who Wisconsin was during territorial and early statehood periods; the dairy cow represents who Wisconsin became during late nineteenth and twentieth centuries."

  - id: "state-symbolism"
    icon: "fa-flag"
    title: "What the Badger Represents"
    style: "highlight"
    paragraphs:
      - "The badger symbolizes Wisconsin's frontier mining heritage and the resourcefulness of 1820s lead miners who dug temporary shelters into hillsides rather than building permanent structures. This practical adaptation to immediate needs over long-term planning captured Wisconsin's pioneer spirit and gave the state its enduring Badger State identity, later echoed in [Wisconsin's motto Forward](/states/wisconsin/motto/forward)."
      - "Badger symbolism represents determination, tenacity, and fierce independence—qualities Wisconsinites associate with frontier character and mining-era self-reliance. The badger's aggressive defense when cornered mirrors Wisconsin's historical resistance to outside pressure and its independent political tradition mixing progressive reform with conservative fiscal policy."
      - "The badger connects Wisconsin's past as lead mining frontier to present identity through continuous cultural recognition spanning nearly two centuries. Few state symbols maintain such direct links between historical events and modern state character, making the badger uniquely powerful as representation of Wisconsin's evolution from rough mining territory to agricultural and industrial economy."
    
    subsections:
      - subtitle: "Lead Mining Heritage and Frontier Identity"
        text: "Wisconsin's Badger State nickname emerged during the lead mining boom of the 1820s and 1830s when thousands of miners flooded southwestern Wisconsin seeking fortunes in galena (lead sulfide) deposits near the Mississippi River. The region around Mineral Point, Platteville, and Shullsburg became Wisconsin's first major population center, predating Milwaukee's growth. Miners arriving in spring and summer prioritized extracting ore over building permanent housing, instead digging horizontal tunnels into hillsides creating crude shelters that resembled badger burrows. These dugouts provided quick shelter allowing miners to begin work immediately, embodying frontier practicality over comfort. Observers compared these burrowing miners to badgers, and the nickname stuck even after the lead boom ended in the 1840s. The badger symbolizes this pragmatic, resource-focused mentality that characterized early Wisconsin—do what works, ignore conventions, and adapt to circumstances. Modern Wisconsin maintains elements of this identity through independent political tradition and resistance to partisan conformity."
      
      - subtitle: "University of Wisconsin Connection"
        text: "The University of Wisconsin-Madison adopted 'Badgers' as its athletic teams' nickname in 1889, creating symbolic link between state identity and higher education. The choice acknowledged Wisconsin's Badger State nickname and reinforced the animal's association with state character. In 1940, the university introduced Bucky Badger as an official mascot, giving the abstract Badger State concept a concrete, personified representation. Bucky Badger became one of America's most recognizable college mascots, appearing at athletic events, on merchandise, and in university marketing, spreading Wisconsin's badger identity nationally. The mascot's pugnacious attitude, striped head pattern, and combative stance embody traits Wisconsinites associate with state character—toughness, tenacity, and refusal to back down. University athletics broadcast Wisconsin's badger identity beyond state borders, making the animal symbol familiar to Americans who never visited Wisconsin. The university's adoption of the badger connected academic achievement to frontier heritage, suggesting that intellectual pursuit requires the same determination that characterized 1820s miners."
      
      - subtitle: "Tenacity and Fighting Spirit"
        text: "The badger's reputation for aggressive defense when threatened symbolizes Wisconsin's political independence and resistance to outside pressure. Badgers are famously fierce fighters despite small size, using powerful claws and jaws to defend burrows against much larger predators. This disproportionate fighting ability relative to size mirrors Wisconsin's historical willingness to challenge larger forces through progressive political movements, labor organizing, and environmental protection despite being a mid-sized state. Robert La Follette's progressive movement in early 1900s Wisconsin exemplified badger-like tenacity in fighting corporate power and political corruption. The badger's solitary nature and territorial defense resonate with Wisconsin's independent streak in national politics, often refusing to follow predictable partisan patterns. Wisconsin voters' unpredictability—swinging between progressive and conservative candidates, splitting tickets, and defying national trends—reflects badger-like refusal to conform to expectations. The symbol acknowledges that Wisconsin's strength comes not from size or population but from determination and willingness to fight for principles."

  - id: "identification"
    icon: "fa-paw"
    title: "Identifying Badgers"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "American badgers are medium-sized carnivores with distinctive appearance making identification straightforward. Their most recognizable feature is the white stripe running from nose over the head to shoulders, contrasting sharply with grizzled gray-brown body fur. Badgers have flattened, wedge-shaped bodies built for pushing through tight underground spaces, with powerful front limbs adapted for digging."
        list_items:
          - "**Size**: 20-30 inches body length; tail adds 4-6 inches; shoulder height 9-11 inches; males larger and heavier than females; flattened profile allows passage through burrows"
          - "**Weight**: Males 15-25 pounds; females 12-18 pounds; weight fluctuates seasonally, increasing before winter dormancy and decreasing through winter"
          - "**Appearance**: Grizzled gray-brown back; white dorsal stripe from nose to shoulders; black facial markings create mask; white cheeks; yellowish-white belly; short legs with black feet; small rounded ears"
          - "**Features**: Front claws extremely long (up to 2 inches) and curved for digging; rear claws shorter; small eyes positioned high on head; powerful jaw muscles; musky scent from anal glands"
      
      - subtitle: "Distinguishing from Other Wisconsin Mammals"
        text: "Wisconsin hosts no other mammals with similar appearance to badgers, making identification certain when animals are clearly visible. The white dorsal stripe is diagnostic—no other Wisconsin carnivore displays this pattern. Groundhogs (woodchucks) are sometimes confused with badgers by casual observers, but groundhogs lack white facial markings, have longer tails, and show brown coloration without grizzled gray. Groundhogs also sit upright frequently while badgers remain low to ground. Raccoons have facial masks but lack dorsal stripes and have ringed tails. Skunks have white stripes but are smaller, have prominent bushy tails, and move differently. Badgers' extremely low, flattened profile and distinctively powerful front claws separate them from all other Wisconsin mammals when observed closely. Fresh badger diggings provide identification even when animals aren't visible—excavations are much larger and deeper than those created by other Wisconsin mammals, with soil piles sometimes several feet across."
      
      - subtitle: "Behavior and Activity Patterns"
        text: "Badgers are primarily nocturnal in Wisconsin, emerging from burrows after sunset to hunt ground squirrels, pocket gophers, and other burrowing rodents. They spend most active time digging—excavating prey from burrows, creating new dens, or enlarging existing tunnels. Badgers are solitary animals outside breeding season, with adults maintaining separate territories that overlap minimally. They are not social diggers like prairie dogs but rather lone hunters that locate prey through keen sense of smell and then dig rapidly to capture animals in their burrows. Badgers can dig extremely fast, capable of excavating themselves out of sight within minutes when threatened. During winter, Wisconsin badgers enter periods of torpor (reduced activity and metabolism) but do not true hibernate, emerging periodically during warm spells to hunt. Most Wisconsin badgers reduce activity dramatically from November through March, spending extended periods underground and living on accumulated fat reserves."
      
      - subtitle: "Vocalizations and Defense"
        text: "Badgers produce hissing, growling, and snarling sounds when threatened, warning potential predators to maintain distance. When cornered or attacked, badgers fight ferociously despite small size, using powerful jaws that can crush bone and claws that can inflict serious wounds. Their aggressive defense has earned them reputation as animals to avoid despite their size being less than most large dogs. Badgers will back into burrows when threatened, presenting only their head and claws to attackers while protecting their body from assault. This defensive strategy makes badgers extremely difficult to dislodge from burrows and nearly impossible for most predators to kill. Adult badgers have few natural predators in Wisconsin—occasionally coyotes or domestic dogs may kill young or sick individuals, but healthy adults can drive off most attackers. Humans and automobiles represent the primary mortality factors for Wisconsin badgers, with road mortality particularly high in agricultural areas where badgers cross roads while hunting."

  - id: "in-the-state"
    icon: "fa-map-marked-alt"
    title: "Badgers in Wisconsin"
    style: "default"
    paragraphs:
      - "Badgers occur throughout Wisconsin except in heavily forested northern counties where dense tree cover and poor soil conditions limit populations. Southern Wisconsin's agricultural landscape provides ideal habitat, with abundant prey populations and soils suitable for digging creating high badger densities."
      - "Population trends remain stable across Wisconsin, with annual harvest of 500 to 800 animals through regulated trapping indicating sustainable populations. Badgers adapt well to agricultural landscapes, often benefiting from habitat modifications that favor ground squirrels and other prey species."
    
    facts:
      - "**Southern Wisconsin**: Highest badger densities in agricultural counties; grassland and pasture habitat abundant; prairie remnants support prey populations; most road-killed badgers documented in southern tier counties"
      - "**Central Wisconsin**: Moderate populations in mixed agricultural and woodland areas; sandy soils ideal for digging; ground squirrel populations support badger numbers"
      - "**Northern Wisconsin**: Sparse populations in heavily forested counties; badgers restricted to grassland openings, forest edges, and agricultural clearings; rocky, acidic soils less suitable for burrowing"
      - "**Urban Areas**: Occasionally observed in suburban grasslands and parks; golf courses, cemeteries, and large lawns attract prey species; human activity generally discourages badger establishment"
    
    subsections:
      - subtitle: "Habitat Preferences in Wisconsin"
        text: "Wisconsin badgers strongly prefer open habitats with loose, well-drained soils that allow rapid digging. Agricultural fields, pastures, prairie remnants, and grassy roadsides provide ideal conditions combining abundant prey with suitable soils for burrow construction. Badgers avoid areas with high water tables, heavy clay soils, or bedrock near surface because these conditions impede digging. Southern Wisconsin's glacial till soils and prairie-agricultural landscapes create optimal badger habitat, explaining higher densities in that region. Badgers require habitats supporting healthy populations of ground squirrels, pocket gophers, or thirteen-lined ground squirrels, their primary prey species. As agriculture converted Wisconsin prairies to cropland in the 1800s and 1900s, badger habitat changed dramatically but remained suitable because ground squirrels adapted to agricultural landscapes. Modern Wisconsin badgers thrive in edge habitats between crop fields and grassy areas, demonstrating adaptability to human land use changes."
      
      - subtitle: "Prey Base and Hunting Behavior"
        text: "Wisconsin badgers primarily hunt Franklin's ground squirrels, thirteen-lined ground squirrels, and pocket gophers, digging these animals from their burrows with powerful front claws. A single badger may excavate dozens of burrows nightly while searching for prey, creating distinctive digging signs across agricultural fields and grasslands. Badgers also consume mice, voles, ground-nesting birds, bird eggs, insects, and occasionally carrion when available. During summer, insects including grasshoppers and beetle larvae supplement the diet, though mammals remain primary food source. Badgers hunt almost exclusively through excavation rather than pursuing prey across ground surface, making their hunting technique distinct from other Wisconsin carnivores. This specialized hunting creates significant landscape impacts—badger diggings aerate soil, mix soil layers, and create microhabitats used by other species. Farmers sometimes view badger digging as nuisance when burrows create hazards for livestock or agricultural equipment, though badgers provide pest control services by reducing crop-damaging rodent populations."
      
      - subtitle: "Seasonal Activity and Winter Dormancy"
        text: "Wisconsin badgers modify activity patterns seasonally, remaining active year-round but reducing winter activity dramatically. During spring through fall, badgers hunt nightly across home ranges spanning one to three square miles, digging extensively for prey and maintaining multiple burrows. As temperatures drop in November, badgers spend increasing time underground, accumulating fat reserves that sustain them through periods of reduced hunting. Wisconsin badgers enter torpor during coldest winter months—a state of reduced body temperature and metabolism that conserves energy but differs from true hibernation because badgers can rouse quickly if disturbed. During mild winter periods, badgers emerge to hunt, taking advantage of temporary warm spells. By March, most Wisconsin badgers resume normal activity patterns, with breeding occurring in summer and delayed implantation ensuring young are born the following spring when prey is abundant. This reproductive strategy ensures cubs emerge when hunting conditions are optimal for rapidly growing young."

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Badgers in Wisconsin"
    style: "default"
    paragraphs:
      - "Observing wild badgers in Wisconsin is challenging because they are nocturnal, solitary, and secretive. Most Wisconsin residents never see live badgers despite living in areas with healthy populations. Evidence of badger presence through digging signs is far more common than actual animal sightings."
      - "The best opportunities for badger observation occur in southern Wisconsin grasslands during spring and early summer when adults with young cubs may be active near dawn. However, patience and luck are required—badgers do not appear predictably like deer or turkeys visible during specific times or locations."
    
    list_items:
      - "**Badger State Trail**: Former railroad corridor converted to recreational trail between Madison and Illinois border; grassland habitat along trail supports badgers; look for fresh diggings indicating recent activity; occasional sightings reported by early morning cyclists; best sections: near Belleville and New Glarus"
      - "**Prairie Remnants**: State natural areas preserving prairie habitat including Avoca Prairie-Savanna State Natural Area, Schluckebier Sand Prairie, and Prairie du Sac riverbanks; ground squirrel populations attract badgers; permission required for some sites; search for large excavations with soil piles several feet across"
      - "**Agricultural Areas**: Southern Wisconsin counties including Iowa, Grant, Lafayette, and Richland; drive gravel roads at dawn or dusk during spring and summer; badgers occasionally cross roads while traveling between hunting areas; road-killed badgers indicate active populations though this is unfortunate confirmation method"
      - "**University of Wisconsin-Madison Campus**: Bucky Badger statue at Camp Randall Stadium provides guaranteed badger viewing though not the wild variety; Bucky appears at athletic events and university functions; represent state symbol in controlled setting"
    
    subsections:
      - subtitle: "Identifying Badger Sign"
        text: "Fresh badger diggings provide clear evidence of presence even when animals remain unseen. Badger excavations are distinctive—much larger than other Wisconsin mammal diggings, with soil piles sometimes three to four feet across and excavations extending two feet or more into ground. Unlike small rodent burrows with neat circular entrances, badger digging creates irregular openings with soil scattered widely. Badgers excavate in pursuit of prey, creating series of holes across fields as they dig out ground squirrel burrows. Fresh diggings show loose, recently disturbed soil contrasting with vegetation-covered older excavations. Den entrances differ from hunting excavations, typically showing oval openings approximately ten to twelve inches wide and eight inches high, often beneath brush piles, rock outcrops, or field edges. Worn paths leading to den entrances indicate repeated use. Badger tracks show five toes on front and rear feet with long claw marks extending far forward of toe prints on front tracks, creating distinctive pattern in soft soil or snow."

  - id: "current-status"
    icon: "fa-shield-alt"
    title: "Conservation Status and Management"
    style: "default"
    paragraphs:
      - "American badgers maintain stable populations throughout Wisconsin with no conservation concerns currently identified. The Wisconsin Department of Natural Resources classifies badgers as furbearers subject to regulated harvest through trapping, with annual harvests of 500 to 800 animals indicating sustainable population levels."
      - "Habitat loss from urban development poses the primary long-term threat to Wisconsin badgers, particularly in southeastern counties where suburban expansion eliminates grassland and agricultural lands. However, badgers' adaptability to modified landscapes and ability to thrive in agricultural areas provides resilience against moderate habitat loss."
    
    subsections:
      - subtitle: "Population Monitoring and Harvest Management"
        text: "Wisconsin monitors badger populations through trapper harvest reports, road mortality data, and incidental observations during wildlife surveys. Annual harvest of 500 to 800 badgers through regulated trapping indicates healthy populations capable of sustaining moderate mortality from human activities. Trappers must possess valid licenses and follow season dates and equipment restrictions designed to ensure sustainable harvest. Most Wisconsin badgers are trapped incidentally while trappers target more valuable furbearers like raccoons and foxes, as badger pelts have limited commercial value. The regulated harvest provides population control benefits while generating revenue through license sales. Wisconsin DNR analyzes harvest data for trends indicating population changes, though badger populations show relatively stable patterns without dramatic fluctuations documented for some other furbearer species. Current management approach maintains sustainable populations while allowing traditional furbearer harvest."
      
      - subtitle: "Road Mortality and Human Conflicts"
        text: "Road mortality represents significant badger mortality source in agricultural Wisconsin, with animals commonly struck while crossing roads between hunting areas or dens. Southern Wisconsin's extensive road network intersects badger habitat, creating frequent vehicle-wildlife encounters particularly during breeding season when badgers travel farther. Dead badgers along roadsides demonstrate population presence and provide tissue samples for disease monitoring and genetic studies. Some farmers view badgers negatively because burrow excavations create hazards for livestock and agricultural equipment, and tunneling occasionally damages earthen dams on farm ponds. However, badgers provide valuable pest control services by reducing crop-damaging rodent populations, potentially saving farmers economic losses from rodent damage. Conflicts are generally minor compared to issues with crop-raiding deer or predation on livestock by other carnivores. Most landowners tolerate badgers despite occasional nuisance digging, recognizing their role in rodent control."
      
      - subtitle: "Habitat Conservation Challenges"
        text: "Long-term badger conservation in Wisconsin depends on maintaining grassland and agricultural habitats that support prey populations. Urban development in southeastern Wisconsin eliminates badger habitat through conversion of agricultural lands and grasslands to residential and commercial uses. Madison's expanding suburbs, Milwaukee's growth, and development along Interstate 94 corridor reduce available habitat in historically high-density badger areas. Prairie conservation efforts benefit badgers by preserving and restoring grassland ecosystems, though prairie remnants cover less than 0.1 percent of Wisconsin's landscape compared to presettlement extent. Agricultural practices affect badger habitat quality—intensification reducing fence rows, field edges, and grassland strips potentially decreases prey abundance and hunting efficiency. Climate change may shift vegetation patterns favoring woody encroachment into grasslands, reducing open habitat badgers require. Despite these concerns, Wisconsin's agricultural landscape likely will continue supporting badger populations for foreseeable future, as the state maintains extensive farmland providing suitable habitat."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Wisconsin's Symbols"
    style: "default"
    paragraphs:
      - "The badger connects directly to Wisconsin's state mineral, galena (lead ore), through the 1820s lead mining boom that created the Badger State nickname. Miners digging for galena deposits in southwestern Wisconsin lived in hillside dugouts resembling badger burrows, creating the symbolic link between animal and mineral extraction that defines state identity."
      - "The badger designation as wildlife animal complements the dairy cow's designation as domesticated animal, representing dual heritage of frontier wildness and agricultural development. These animals symbolize Wisconsin's transformation from mining territory to dairy powerhouse, acknowledging both historical and modern identities."
    
    subsections:
      - subtitle: "Mining Heritage and State Mineral"
        text: "Wisconsin designated galena (lead sulfide) as the state mineral in 1971, creating formal recognition for the ore that drew 1820s miners who inspired the Badger State nickname. The badger and galena designations together commemorate southwestern Wisconsin's lead mining district centered on Mineral Point, Platteville, and Shullsburg. Mining operations from 1820s through 1840s made Wisconsin territory the nation's leading lead producer, attracting thousands of miners and creating Wisconsin's first population boom. The badger-miner comparison arose directly from galena extraction techniques—miners dug horizontal adits (tunnels) into hillsides to access lead deposits, creating shelters identical in concept to badger burrows. The symbolic connection runs deeper than superficial similarity because both animal and human modified Wisconsin's landscape through digging, creating burrows that persist as archaeological features today. Preserved lead mine sites in southwestern Wisconsin interpret this heritage, explaining how human digging behavior inspired animal metaphor that became state identity."
      
      - subtitle: "Relationship to Dairy Cow Symbol"
        text: "Wisconsin's designation of both wildlife animal (badger) and domesticated animal (dairy cow) acknowledges the state's dual character as frontier heritage and agricultural economy. The badger represents Wisconsin's past—the rough mining territory of the 1820s-1840s characterized by temporary settlements, resource extraction, and frontier conditions. The [dairy cow](/states/wisconsin/mammal/dairy-cow) represents Wisconsin's present and recent past—the agricultural transformation beginning in mid-1800s that made Wisconsin America's leading dairy producer by 1920s. Together, these animals tell Wisconsin's economic history from lead mining through dairy farming. The symbols do not compete but rather complement, showing evolution from extractive frontier economy to productive agricultural economy. The badger maintains cultural resonance despite dairy farming's greater economic importance because the Badger State nickname predates dairy development and because frontier heritage holds romantic appeal that agricultural labor lacks in popular imagination. Wisconsin chose not to replace badger symbolism with dairy cow symbolism but rather added the cow while preserving the badger, demonstrating that multiple symbols can coexist when they represent different aspects of state character."
      
      - subtitle: "University Connection and Youth Education"
        text: "The University of Wisconsin-Madison's adoption of the badger as mascot and nickname creates educational connections between state symbol and higher learning. Bucky Badger serves as ambassador for Wisconsin identity among students from across America and internationally, spreading recognition of Wisconsin's badger association beyond state borders. Athletic events broadcast Wisconsin's badger identity nationally through team uniforms, merchandise, and media coverage, making casual sports fans aware of Wisconsin's nickname and symbol. The mascot's presence at youth sporting events and school visits connects younger generations to state heritage, teaching children about badger symbolism and Wisconsin history. Elementary schools throughout Wisconsin teach state symbols curriculum including the badger, often using Bucky Badger as familiar reference point. This educational role ensures transmission of badger symbolism to successive generations who might otherwise lose connection to 1820s mining heritage that created the nickname. The university's embrace of the badger elevated what could have been forgotten historical reference into living cultural icon maintained through institutional commitment and athletic tradition."

