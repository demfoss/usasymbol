expert_quote:
  text: "The American water spaniel represents Wisconsin's hunting heritage and innovative spirit. As our only native dog breed, it embodies the resourcefulness of Wisconsin hunters who created a versatile gun dog perfectly adapted to our lakes and marshes."
  source: "American Water Spaniel Club"

faq:
  - question: "What is Wisconsin's state dog?"
    answer: "Wisconsin's state dog is the American water spaniel, designated in 1985. The American water spaniel is the only dog breed developed entirely in Wisconsin, originating in the Fox River Valley and Wolf River regions during the mid-1800s. This medium-sized brown sporting dog was bred specifically for retrieving waterfowl from Wisconsin's cold lakes, marshes, and rivers. The breed stands 15-18 inches tall, weighs 25-45 pounds, and has a distinctive curly brown water-resistant coat. Despite state dog designation, the American water spaniel remains rare with approximately 3,000 dogs nationwide and is listed as a vulnerable breed by the American Kennel Club."
  
  - question: "Where did the American water spaniel originate?"
    answer: "The American water spaniel originated entirely in Wisconsin, specifically in the Fox River Valley and Wolf River regions during the mid-1800s. Wisconsin hunters selectively bred various spaniels and possibly other breeds to create a versatile gun dog adapted to Wisconsin's waterfowl hunting conditions. The breed developed through practical breeding focused on working ability rather than formal breeding programs with documented pedigrees. Dr. Fred J. Pfeifer of New London, Wisconsin played a crucial role in preserving and standardizing the breed in the early 1900s, maintaining breeding records and promoting the American water spaniel as a distinct breed. This Wisconsin origin makes the American water spaniel unique among state dog symbols—most state dogs represent breeds associated with states but developed elsewhere, while Wisconsin can claim the American water spaniel as entirely its own creation."
  
  - question: "How rare is the American water spaniel?"
    answer: "The American water spaniel is quite rare, with approximately 3,000 dogs existing nationwide and only 200-300 puppies registered annually with the American Kennel Club. The breed is listed as vulnerable by the AKC due to consistently low registration numbers. This rarity persists despite Wisconsin state dog designation in 1985 and conservation efforts by the American Water Spaniel Club. Several factors contribute to the breed's rarity including competition from more popular retrievers (Labrador and golden retrievers), lack of public awareness about the breed, small breeding population limiting puppy availability, and niche appeal to specific hunters and breed enthusiasts. Finding American water spaniel puppies typically requires contacting breeders directly through the American Water Spaniel Club, with waiting lists often extending months or years. The rarity makes American water spaniels prized among enthusiasts but also creates challenges for breed preservation."
  
  - question: "What was the American water spaniel bred to do?"
    answer: "The American water spaniel was bred specifically for retrieving waterfowl from Wisconsin's cold lakes, marshes, and rivers during hunting season. Wisconsin hunters in the Fox River Valley and Wolf River regions needed versatile gun dogs that could retrieve ducks and geese from near-freezing water, navigate dense marsh vegetation, fit in small hunting boats, and also hunt upland game including ruffed grouse and woodcock. The breed's physical characteristics reflect these purposes—curly water-resistant coat provides insulation in cold water, webbed feet aid swimming, compact size fits small boats, brown coloration camouflages in marsh vegetation, and gentle mouth retrieves game without damage. The American water spaniel's versatility hunting both waterfowl and upland game made it particularly valuable to Wisconsin hunters who couldn't afford separate specialized dogs for different hunting types."
  
  - question: "Are American water spaniels good family pets?"
    answer: "American water spaniels can make excellent family pets for active households that provide adequate exercise and mental stimulation. The breed exhibits friendly, eager-to-please temperament, bonds strongly with families, and generally displays affection toward children when properly socialized. American water spaniels demonstrate high intelligence and trainability, learning commands quickly. However, the breed requires regular exercise including swimming opportunities where their natural abilities can be expressed. They need mental stimulation through training, hunting, or dog sports to prevent boredom-related behavioral problems. American water spaniels can be reserved with strangers initially but rarely show aggression. Their moderate energy levels make them active enough for outdoor activities but calm indoors when exercised adequately. The breed's hunting instincts mean they may chase wildlife unless trained. American water spaniels are unsuitable for sedentary households or apartments without access to water and outdoor activities."
  
  - question: "How can I find an American water spaniel puppy in Wisconsin?"
    answer: "Finding an American water spaniel puppy requires patience due to the breed's rarity and small breeding population. The American Water Spaniel Club maintains a breeder referral service on their website (americanwaterspanielclub.org) listing reputable breeders who follow club breeding standards and health testing requirements. Most Wisconsin breeders produce only one or two litters annually given limited demand, so waiting lists often extend months or years. Prospective owners should expect breeder applications and interviews—responsible breeders carefully screen potential homes to ensure puppies go to committed owners who understand the breed's needs. Prices typically exceed popular breeds due to limited availability and health testing expenses. Avoid puppy mills or internet sellers offering immediate availability, as American water spaniels' rarity makes such sources likely to be irresponsible breeders. Attending American Water Spaniel Club events including the annual gathering in New London, Wisconsin provides opportunities to meet breeders and learn about the breed before committing to ownership."
  
  - question: "When was the American water spaniel designated as Wisconsin's state dog?"
    answer: "The American water spaniel became Wisconsin's official state dog in 1985 when Governor Anthony Earl signed the designation legislation. Wisconsin became the ninth state to designate an official state dog, choosing the American water spaniel because it represents the only dog breed developed entirely within Wisconsin's borders. The designation acknowledged Wisconsin's hunting heritage and the breed's unique status as Wisconsin's only native dog breed. The American Water Spaniel Club advocated for state dog designation beginning in the early 1980s, arguing that Wisconsin should honor its native breed through official recognition. The designation aimed to raise public awareness about the breed and encourage Wisconsinites to consider American water spaniels when selecting hunting dogs, though the breed has remained relatively unknown despite state dog status."
  
  - question: "What is the difference between an American water spaniel and an Irish water spaniel?"
    answer: "American water spaniels and Irish water spaniels are distinct breeds despite similar names. Irish water spaniels are significantly larger, standing 21-24 inches tall compared to American water spaniels' 15-18 inches. Irish water spaniels have a distinctive smooth 'rat tail' that lacks the curly coat covering their body, while American water spaniels have curly or wavy tails consistent with body coat. Irish water spaniels typically appear liver-colored with purple tint and weigh 55-68 pounds, much heavier than American water spaniels' 25-45 pounds. The breeds originated in different countries—Irish water spaniels developed in Ireland during the 1800s, while American water spaniels developed in Wisconsin. Temperamentally, both breeds are intelligent and trainable, but Irish water spaniels may be more reserved with strangers. Both excel at waterfowl retrieving, but the American water spaniel's smaller size makes it more practical for small boats and versatile for both waterfowl and upland hunting."

