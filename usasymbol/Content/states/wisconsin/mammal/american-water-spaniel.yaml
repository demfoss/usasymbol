title: "Wisconsin State Dog | American Water Spaniel"
scientific_name: "Canis lupus familiaris"
adopted_year: 1985

seo_title: "Wisconsin State Dog | American Water Spaniel"
seo_description: "Wisconsin's state dog is the American Water Spaniel, adopted in 1985. Learn why this official Wisconsin symbol was chosen and what it represents."

intro_text: "The American Water Spaniel is the official Wisconsin state dog, designated in 1985. This page gives the direct answer for searches like 'wisconsin state dog', 'wisconsin state animal', and 'wisconsin state mammal' while explaining how the symbol fits the state's official animal designations. Being Wisconsin's only native dog breed; versatile hunting ability retrieving ducks, geese, and upland game; brown curly coat water-resistant for cold Wisconsin waters; friendly temperament as family companion; rarity making them prized among enthusiasts."

common_name: "American Water Spaniel (often abbreviated AWS)"
official_since: "1985"
status: "Rare breed with approximately 3,000 registered dogs nationwide; listed as vulnerable by American Kennel Club; small breeding population concentrated in Wisconsin and Midwest; not endangered in conservation sense but uncommon compared to popular breeds"
habitat_in_state: "Domestic companion and hunting dogs kept by Wisconsin families; working dogs on hunting properties; present throughout state with concentrations in areas with waterfowl hunting traditions; adaptable to various living situations from farms to suburban homes"
known_for: "Being Wisconsin's only native dog breed; versatile hunting ability retrieving ducks, geese, and upland game; brown curly coat water-resistant for cold Wisconsin waters; friendly temperament as family companion; rarity making them prized among enthusiasts"

size: "Medium-sized sporting dog; males 15 to 18 inches shoulder height; females 15 to 18 inches; compact, muscular build"
weight: "Males 30 to 45 pounds; females 25 to 40 pounds; sturdy build despite moderate size; heavier than appearance suggests due to dense muscle"
coloration: "Solid brown ranging from dark chocolate to liver brown; occasional small white markings on chest or toes acceptable but not preferred; curly or wavy coat texture; no other color patterns permitted in breed standard"
distinctive_traits: "Dense, water-resistant double coat with tight curls or waves; webbed feet for swimming; long, curled ears covered with curls; tail typically docked to working length; muscular build for swimming in cold water; friendly, eager expression; versatile hunting ability in water and upland terrain"

habitat: "Domestic homes throughout Wisconsin; hunting camps in northern counties; farms and rural properties; adaptable to urban and suburban environments with adequate exercise"
range_in_state: "Found throughout Wisconsin with concentrations in areas with strong waterfowl hunting traditions; Fox River Valley and Wolf River regions where breed originated; northern lake districts; Mississippi River flyway counties"
