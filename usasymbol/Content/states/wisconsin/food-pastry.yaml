sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Wisconsin's State Pastry?"
    paragraphs:
      - "The kringle is Wisconsin's official state pastry, designated by the Wisconsin Legislature in 2013. It is a large, oval, flaky pastry filled with fruit, nuts, or other sweet fillings and topped with icing."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Kringle"
    paragraphs:
      - "A kringle is made from many thin layers of buttery dough folded around a filling such as almond paste, pecan, cherry, or raspberry, then shaped into a large oval and topped with a thin icing glaze. The many folded layers give it a flaky, tender texture."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Kringle Became Wisconsin's State Pastry"
    paragraphs:
      - "The Wisconsin Legislature designated the kringle the official state pastry in 2013, recognizing a baking tradition brought to the state by Danish immigrants."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Wisconsin Chose the Kringle"
    paragraphs:
      - "Danish immigrants settled in Racine, Wisconsin, in the 1800s and brought the kringle recipe with them, and Racine bakeries have made the pastry ever since, earning the city a reputation as the Kringle Capital of the World. That documented, place-based history made the kringle a fitting state pastry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Kringle Comes From in Wisconsin"
    paragraphs:
      - "Racine, Wisconsin, home to several Danish bakeries dating back generations, is widely known as the center of kringle baking in the United States."
    sites:
      - name: Racine
        city: Racine
        lat: 42.7261
        lng: -87.7829
        note: "Known as the Kringle Capital of the World"
        type: primary

  - id: facts
