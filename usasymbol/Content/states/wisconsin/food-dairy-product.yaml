sections:
  - id: overview
    icon: fa-solid fa-utensils
    title: "What Is Wisconsin's State Dairy Product?"
    paragraphs:
      - "Cheese is Wisconsin's official state dairy product, designated by the Wisconsin Legislature in 2017. Wisconsin produces more cheese than any other U.S. state."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Wisconsin Cheese"
    paragraphs:
      - "Cheese is made by curdling milk, separating the curds from the liquid whey, and processing the curds into blocks, wheels, or wedges, sometimes aged for months or years. Wisconsin produces hundreds of cheese varieties, including cheddar, mozzarella, and colby, a style that originated in the Wisconsin town of Colby in the 1880s."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Cheese Became Wisconsin's State Dairy Product"
    paragraphs:
      - "The Wisconsin Legislature designated cheese the official state dairy product in 2017."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Wisconsin Chose Cheese"
    paragraphs:
      - "Wisconsin has long been known as America's Dairyland, a nickname printed on the state's license plates, and it consistently leads the country in cheese production. The state is home to hundreds of licensed cheesemakers and a deep tradition of cheesemaking brought by German, Swiss, and Scandinavian immigrant dairy farmers in the 1800s."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Cheese Facts"
    facts:
      - "Adopted as Wisconsin's state dairy product in 2017."
      - "Wisconsin produces more cheese than any other U.S. state."
      - "Colby cheese originated in the town of Colby, Wisconsin, in the 1880s."
      - "Wisconsin is nicknamed America's Dairyland."

