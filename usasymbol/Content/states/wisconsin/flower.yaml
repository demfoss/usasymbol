type: State Flower
state: Wisconsin
name: Wood Violet
scientific_name: Viola sororia
adopted_year: 1949
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-10"
seo_title: "Wisconsin State Flower | Wood Violet"
seo_description: "The wood violet became Wisconsin's state flower in 1949. It spreads widely across woods and meadows each spring."

intro_text: "1949 marked the adoption of the Wood Violet as Wisconsin's state flower, and it is included in the [list of U.S. state flowers](/symbols/flowers). Purple to blue five-petaled flowers bloom on low-growing plants 3 to 8 inches tall. These native wildflowers spread across woodlands, meadows, and lawns throughout Wisconsin from April through June."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is Wisconsin's State Flower?"
    paragraphs:
      - "Wisconsin recognizes the Wood Violet as its official state flower. Each blossom displays five petals in shades of purple, blue, or violet. The lower petal shows white at the base with dark purple veins. Flowers measure half an inch to one inch across. Heart-shaped leaves rise directly from underground stems. Plants spread through rhizomes forming dense colonies."
      - "Wood Violets bloom from April through June across Wisconsin. Peak flowering occurs in May throughout most regions. Northern hardwood forests, prairie remnants, and Door County meadows showcase abundant displays. Individual flowers last several days. Plants prefer moist well-drained soil. Partial shade to full sun suits wood violets depending on moisture levels."
      - "Native violet populations grow wild throughout Wisconsin in forests, meadows, roadsides, and residential lawns. The plants tolerate diverse conditions from deep woods to sunny gardens. Bees and small butterflies pollinate the showy spring flowers. Later in summer the plants produce closed self-pollinating flowers called cleistogamous flowers that never open but still produce seeds."

  - id: name
    icon: "fa-solid fa-tag"
    title: "What Is Wisconsin's State Flower Called?"
    paragraphs:
      - "Wisconsin's state flower goes by the common name Wood Violet, scientifically classified as Viola sororia. The plant belongs to the Violaceae family. This family includes pansies, violas, and about 900 species of flowering plants worldwide."
      - "The genus name Viola comes from the Latin word for violet. Ancient Romans cultivated violets for perfume and medicine. Modern taxonomists sometimes classify this species as Viola sororia, though the historical name Viola papilionacea also appears in older references. Both names refer to the same plant. The species grows naturally throughout eastern North America."
      - "Common regional names include common blue violet, meadow violet, and purple violet. The term wood violet distinguishes it from other violet species. Over 60 violet species grow in North America. Wisconsin's designation allows any native violet species to represent the state, though Viola sororia appears most commonly."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "History of Wisconsin's State Flower Selection"
    paragraphs:
      - "Through a statewide vote by school children, Wisconsin established the Wood Violet as its state flower in 1949. The state had operated without an official flower for decades. Garden clubs and women's organizations sponsored the campaign. Over 40,000 students participated in selecting their favorite wildflower, similar to the civic process behind [Wisconsin's state bird](/states/wisconsin/bird/american-robin)."
      - "Wood violets bloomed abundantly across Wisconsin each spring. The purple flowers appeared in nearly every habitat from forests to lawns. Native violets required no cultivation or special care. Their hardy nature and widespread distribution made them accessible to all Wisconsin residents. The flowers symbolized spring's arrival after harsh winters."
      - "The designation allowed all native violet species to represent Wisconsin equally. This broad approach prevented disputes about which specific violet deserved recognition. Blue violets, yellow violets, and white violets all qualified as state flowers. The inclusive designation reflected Wisconsin's botanical diversity and democratic selection process tied to [the Forward motto tradition](/states/wisconsin/motto/forward)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Wisconsin State Flower Facts"
    facts:
      - "Over 40,000 Wisconsin school children participated in voting for the state flower in 1949, with the wood violet winning overwhelmingly over other candidates"
      - "Wood violets produce two types of flowers: showy spring blooms for insect pollination and closed summer flowers that self-pollinate without ever opening"
      - "The designation includes all native violet species in Wisconsin, allowing blue, yellow, and white violets to represent the state equally"
      - "Violet leaves and flowers are edible and rich in vitamins A and C, historically used in salads, teas, and traditional medicines by Native Americans"
      - "Wisconsin's wood violets spread primarily through underground rhizomes rather than seeds, allowing single plants to form large colonies covering several square feet"
      - "Door County, the Kettle Moraine State Forest, and areas around Devil's Lake feature some of Wisconsin's most spectacular violet displays each spring"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Wisconsin's Flower and Bird Symbols"
    paragraphs:
      - "The American Robin serves as Wisconsin's state bird, a familiar red-breasted songbird that signals spring's arrival with its cheerful song. Both symbols represent Wisconsin officially. Wisconsin adopted the Wood Violet in 1949, the same year the American Robin became state bird; see [Wisconsin's state flag context](/states/wisconsin/flag/wisconsin-state-flag)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Wood Violet Symbolizes"
    paragraphs:
      - "The Wood Violet is often associated with modesty, resilience, and the arrival of spring in Wisconsin. The flower traditionally symbolizes faithfulness and humility through its low-growing habit and simple beauty. Its ability to thrive in diverse conditions from deep forests to sunny lawns frequently represents adaptability and perseverance, reflecting Wisconsin's changing seasons and hardy character, especially in habitats with [Wisconsin's sugar maple](/states/wisconsin/tree/sugar-maple)."

faq:
  - question: "What is the Wisconsin state flower?"
    answer: "The Wisconsin state flower is the Wood Violet. This native wildflower produces purple to blue five-petaled blooms and grows throughout Wisconsin in woodlands, meadows, and lawns from April through June."
  
  - question: "When did Wisconsin adopt the Wood Violet?"
    answer: "Wisconsin adopted the Wood Violet in 1949 following a statewide vote by over 40,000 school children. Garden clubs and women's organizations sponsored the campaign that led to this designation."
  
  - question: "Why did Wisconsin choose the Wood Violet?"
    answer: "Wisconsin chose the Wood Violet because it bloomed abundantly across the state each spring in nearly every habitat. The flowers required no special care and were accessible to all residents. School children voted overwhelmingly for the violet over other candidates."
  
  - question: "Are all violet species Wisconsin's state flower?"
    answer: "Yes, Wisconsin's designation includes all native violet species. Blue violets, yellow violets, and white violets all qualify as state flowers. This inclusive approach prevented disputes about which specific violet deserved recognition and reflected the state's botanical diversity."
  
  - question: "Are wood violet flowers edible?"
    answer: "Yes, wood violet flowers and leaves are edible and nutritious. They contain vitamins A and C and can be used in salads, teas, and candied as decorations. Native Americans and early settlers used violets in traditional medicines and cooking."

