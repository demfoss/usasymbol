seo_title: "Wisconsin State Flag: Meaning, Badger Symbol, History & Facts"
seo_description: "Review how Wisconsin's flag was adopted in law, what its main symbols refer to, and how officials describe the flag of Wisconsin today."

intro_text: "Wisconsin adopted its state flag in 1863, featuring the state coat of arms on a navy blue field. The legislature modified the flag in 1979 by adding the word Wisconsin above the coat of arms and the year 1848 below it. The date marks Wisconsin's admission to the Union, and the design appears in the [list of U.S. state flags](/symbols/flags)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Wisconsin State Flag Is Designed"
    paragraphs:
      - "The Wisconsin state flag is the official flag of the state of Wisconsin. A navy blue field forms the background. The coat of arms depicts a sailor, a miner, a shield, and a badger at the crest. The word WISCONSIN appears in white capital letters above the coat of arms. The year 1848 appears below in white."
      - "A badger sits on top of the coat of arms with the state motto Forward. The shield shows symbols of farming, mining, manufacturing, and navigation. A sailor and a yeoman support the shield on either side. A cornucopia and thirteen lead ingots appear at the bottom."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Wisconsin State Flag Means"
    paragraphs:
      - "The Wisconsin state flag meaning comes from symbols depicting Wisconsin's core industries, agriculture, and civic heritage. Each element on the coat of arms reflects an important aspect of Wisconsin's identity and industries."
      - "The motto Forward expresses Wisconsin's progressive spirit. The badger represents the state nickname and mining heritage. The shield symbols show the state's major industries. The sailor and yeoman represent labor on water and land, linking directly to [Wisconsin's state motto page](/states/wisconsin/motto/forward)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Wisconsin Flag History and Adoption"
    paragraphs:
      - "Wisconsin adopted its first state flag in 1863. Civil War regiments requested a battlefield flag. The legislature formed a committee to choose specifications. The design featured the state coat of arms centered on a dark blue field. This matched designs already used by Wisconsin regiments."
      - "The legislature formally added the flag to Wisconsin Statutes in 1913. The design remained unchanged for decades. Astronaut James Lovell carried Wisconsin flags on Gemini 7 in 1965 and Apollo 13 in 1970. Critics noted the flag lacked distinction from other blue state flags."
      - "The legislature modified the flag in 1979. The new design added WISCONSIN and 1848 in white text. These additions helped distinguish Wisconsin's flag from other state flags. The modification took effect on May 1, 1981. All flags manufactured after that date required the new design and strengthened [the Badger State branding](/states/wisconsin/nickname/the-badger-state)."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Wisconsin Flag"
    versions:
      - name: "Original State Flag"
        years: "1863–1981"
        image: "versions/original-1863.webp"
        description: "Navy blue field with state coat of arms in the center, no text added."

      - name: "Modified State Flag"
        years: "1981–present"
        image: "versions/modified-1981.webp"
        description: "Navy blue field with coat of arms, WISCONSIN added above and 1848 below in white text."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Wisconsin Flag"
    symbols:
      - id: badger
        name: "Wisconsin State Flag Badger"
        image: "symbols/badger.svg"
        paragraphs:
          - "A badger sits on top of the coat of arms. The badger is Wisconsin's state animal. Early miners in Wisconsin lived in temporary dugouts resembling badger burrows; see [Wisconsin's badger symbol profile](/states/wisconsin/mammal/badger)."
          - "The badger gave Wisconsin its nickname the Badger State. The animal represents the mining heritage that shaped early Wisconsin settlement."

      - id: shield
        name: "Wisconsin State Flag Shield"
        image: "symbols/shield.svg"
        paragraphs:
          - "The central shield displays four symbols representing Wisconsin's principal industries. A plow represents farming. A pick and shovel represent mining. An arm and hammer represent manufacturing. An anchor represents navigation."
          - "The United States coat of arms sits in the center of the shield. This shows Wisconsin's place in the nation. The shield summarizes the state's economic foundations."

      - id: coat-of-arms
        name: "Wisconsin State Flag Coat of Arms"
        image: "symbols/coat-of-arms.svg"
        paragraphs:
          - "The state coat of arms forms the central element of the flag. A sailor and a yeoman support the shield on either side. The sailor stands on the left. The yeoman stands on the right. These figures represent labor on water and on land."
          - "A cornucopia appears at the bottom left of the coat of arms. The horn of plenty represents prosperity and agricultural wealth. Thirteen lead ingots appear at the bottom right. The number thirteen represents the original thirteen colonies. The ingots also symbolize Wisconsin's mineral wealth."

      - id: motto
        name: "Wisconsin State Flag Motto"
        image: "symbols/motto.svg"
        paragraphs:
          - "The motto Forward appears on a banner above the shield. The word expresses Wisconsin's progressive spirit. It reflects the state's commitment to moving ahead and aligns with [Wisconsin's state bird timeline](/states/wisconsin/bird/american-robin)."
          - "Forward became the state motto when the coat of arms was designed. The motto captures Wisconsin's optimistic character."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Wisconsin State Flag Colors"
    paragraphs:
      - "The Wisconsin state flag uses navy blue as the background. The coat of arms contains multiple colors including gold, red, white, and flesh tones. The text WISCONSIN and 1848 appear in white, with palette overlap explained in [Wisconsin's state colors overview](/states/wisconsin/color/wisconsin-state-colors-red-and-white)."
    colors:
      - name: "Navy Blue"
        hex: "#003F87"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Gold"
        hex: "#FFD700"
      - name: "Red"
        hex: "#BF0A30"
      - name: "Blue"
        hex: "#005EB8"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Wisconsin State Flag Facts"
    facts:
      - "Wisconsin adopted its state flag in 1863"
      - "The flag was modified in 1979 to add WISCONSIN and 1848"
      - "Civil War regiments requested the original flag design"
      - "Astronaut James Lovell carried Wisconsin flags to space"
      - "The flag was ranked 65th out of 72 in a 2001 NAVA survey"
      - "The modified design took effect on May 1, 1981"

faq:
  - question: "What is the official state flag of Wisconsin?"
    answer: "The Wisconsin state flag is the official banner of Wisconsin, featuring the state coat of arms on a navy blue field with WISCONSIN above and 1848 below."

  - question: "How would you describe the design of the Wisconsin state flag?"
    answer: "The flag shows a navy blue background with the state coat of arms in the center. The word WISCONSIN appears in white above the coat of arms, and the year 1848 appears below."

  - question: "What are the key symbols on Wisconsin's flag?"
    answer: "The flag displays the state coat of arms showing a badger, shield with symbols of farming, mining, manufacturing, and navigation, a sailor and yeoman, a cornucopia, thirteen lead ingots, and the motto Forward."

  - question: "What should readers know first about Wisconsin's flag?"
    answer: "A badger appears on top of the coat of arms on the Wisconsin state flag. The badger is Wisconsin's state animal."

  - question: "In what year did Wisconsin's current flag become official?"
    answer: "Wisconsin adopted its state flag in 1863. The flag was modified in 1979 to add text, with changes taking effect on May 1, 1981."

  - question: "How do historians explain the symbolism of Wisconsin's flag?"
    answer: "The flag represents Wisconsin's economic foundations through symbols of farming, mining, manufacturing, and navigation. The motto Forward expresses the state's progressive spirit."

  - question: "How is Wisconsin's flag usually described?"
    answer: "Wisconsin flags fly at half-staff for federal observances like Memorial Day and Peace Officers Memorial Day, deaths of government officials, or by governor's proclamation. Check the governor's office website for current half-staff orders."

