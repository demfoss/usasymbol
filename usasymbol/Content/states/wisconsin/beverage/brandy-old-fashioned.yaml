seo_title: 'Wisconsin Brandy Old Fashioned: State Cocktail Status, Recipe Differences, and Milk Confusion'
seo_description: The Wisconsin Brandy Old Fashioned is the state's defining cocktail — but the 2023 resolution to make it official failed to adopt. Here's what happened, how the drink differs from a standard old fashioned, and why milk is still the codified state beverage.
intro_text: The <strong>Brandy Old Fashioned</strong> is Wisconsin's most culturally distinctive cocktail — and it almost became the official state cocktail in 2024. The Wisconsin Assembly approved a bipartisan resolution in November 2023, but the measure failed to adopt before the session ended. The drink has no statute behind it. What it has instead is a specific, unambiguous Wisconsin identity that no other state can plausibly claim.
