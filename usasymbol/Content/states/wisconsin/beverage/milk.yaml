seo_title: 'Wisconsin State Beverage: Milk vs. the Brandy Old Fashioned Explained'
seo_description: Wisconsin's official state beverage is milk, designated in 1987 under Wisconsin statute. The Brandy Old Fashioned resolution passed the Assembly in 2023 but failed to adopt — it is not a codified state symbol. Here's the difference.
intro_text: Wisconsin's official state beverage is <strong>milk</strong>, designated by statute in <strong>1987</strong>. The Brandy Old Fashioned came close to joining the list in 2023 — a bipartisan Assembly resolution passed but stalled in the Senate, and the measure lapsed without becoming law. Milk holds the statutory spot. The cocktail holds a toast.
