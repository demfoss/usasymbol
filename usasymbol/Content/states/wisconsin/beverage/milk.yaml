sections:
- id: adoption
  icon: fa-solid fa-landmark
  title: 'Wisconsin State Beverage Milk: The 1987 Designation'
  paragraphs:
  - Milk became Wisconsin's official state beverage in 1987, when the legislature passed 1987 Wisconsin Act 279 and placed the designation in [Wisconsin Statutes § 1.10](https://docs.legis.wisconsin.gov/statutes/statutes/1/10) alongside the state's other codified symbols. This was not a sentimental gesture — Wisconsin led the country in milk production at the time, the dairy industry employed a significant share of the agricultural workforce, and naming milk the state beverage was a statement about what Wisconsin built its economy on and what it wanted permanently on the books.
- id: why-milk
  icon: fa-solid fa-cow
  title: 'Wisconsin''s Dairy Identity: Why Milk Was the Only Real Choice'
  paragraphs:
  - Wisconsin's claim to dairy leadership is not a marketing line. The state has led or ranked near the top in U.S. milk production for most of the twentieth century, and that dominance shaped the economy of hundreds of rural communities across the state.
  - The 1987 act grounded the designation explicitly in economics. Milk was not chosen because it photographed well on a license plate — it was chosen because it represented the state's agricultural identity in a way few other products could. Corn is grown across the Midwest. Hogs and cattle are raised in dozens of states. But Wisconsin's dominance in dairy, and especially in specialty cheese production, gave milk a specificity that the legislature found worth enshrining.
  - The timing matters too. The 1987 designation came during a decade of real pressure on Wisconsin dairy farmers — the kind that made legislative recognition feel like more than ceremony. Naming milk the state beverage was solidarity with the industry the state depended on most.
- id: milk-vs-cocktail
  icon: fa-solid fa-circle-question
  title: Is Wisconsin's Official Drink Milk or a Brandy Old Fashioned?
  paragraphs:
  - Milk is Wisconsin's official state beverage. The Brandy Old Fashioned is the drink the legislature tried to designate as the state cocktail — the Assembly passed a bipartisan resolution in 2023, but the Senate did not advance it, and the measure lapsed. They were never in the same legal category to begin with.
  - The two don't carry the same weight. Milk was enacted through legislation and codified in the Wisconsin Statutes. The Brandy Old Fashioned was backed by a 2023 joint resolution that never completed the process. One has a legal address. The other has a legislative shout-out and an unfinished vote. Only one is a codified [state beverage](/symbols/beverages).
- id: cocktail-context
  icon: fa-solid fa-glass-martini-alt
  title: 'Wisconsin State Cocktail: The Brandy Old Fashioned and What the 2023 Vote Actually Means'
  paragraphs:
  - The Brandy Old Fashioned is unmistakably Wisconsin's drink in a cultural sense. While most of the country makes an Old Fashioned with whiskey, Wisconsin's version uses brandy — the sweet, fruit-forward style popularized by Korbel — with a splash of soda and muddled fruit. No other state has the same attachment to this particular variation, and the style is inseparable from the supper club culture that still runs through Wisconsin's smaller cities and resort towns.
  - The 2023 resolution tried to give that cultural reality an official name — and cleared the Assembly before stalling in the Senate. The [Brandy Old Fashioned](/states/wisconsin/beverage/brandy-old-fashioned) never made it into state code. Milk holds the statute. One marks an industry. The other marks a tradition deep enough to earn a bipartisan vote, even if not a line in state law.
timeline:
- year: '1987'
  description: Wisconsin Legislature passes 1987 Wisconsin Act 279, designating milk as the official state beverage. The designation is codified in Wisconsin Statutes § 1.10.
- year: November 2023
  description: Wisconsin Assembly passes a bipartisan resolution (SJR84 / AJR88) declaring the Brandy Old Fashioned the state cocktail. The Senate does not advance the measure.
- year: April 2024
  description: Joint resolution SJR84 fails to adopt. The Brandy Old Fashioned does not become a codified state symbol.
faq:
- question: What is Wisconsin's official state beverage?
  answer: Milk. Wisconsin designated milk as the official state beverage in 1987 through 1987 Wisconsin Act 279, codified in Wisconsin Statutes § 1.10.
- question: Is the Brandy Old Fashioned Wisconsin's official state beverage?
  answer: No. The Brandy Old Fashioned was the subject of a 2023 joint resolution to create a state cocktail category, but that resolution failed to adopt in April 2024. Milk is the only codified state beverage under Wisconsin statute.
- question: What is the difference between Wisconsin's state beverage and state cocktail?
  answer: Milk is a statutory designation codified in Wisconsin Statutes § 1.10 through legislation passed in 1987. The Brandy Old Fashioned was the subject of a 2023 joint resolution that passed the Assembly but stalled in the Senate and lapsed. The two were never legally equivalent.
- question: Why did Wisconsin choose milk as the state beverage?
  answer: The 1987 act cited Wisconsin's status as a leading milk-producing state and milk's importance to the state economy. Wisconsin has consistently ranked at or near the top in U.S. milk production, and the dairy industry is central to its agricultural identity.
- question: What makes Wisconsin's Brandy Old Fashioned distinct?
  answer: Most Old Fashioned cocktails use whiskey. Wisconsin's version uses brandy — typically Korbel — with sweet or sour soda, muddled fruit, and a cherry. The style is closely tied to Wisconsin supper clubs and is almost unknown outside the state.
