faq:
- question: What is Wisconsin's state soil?
  answer: "Wisconsin's state soil is the Antigo series, a fine-loamy Alfisol found across the glaciated outwash plains of northern Wisconsin. It was designated official in 1983, making Wisconsin one of the first states to establish a state soil, and is named after the city of Antigo in Langlade County."
- question: Why is it called Antigo soil?
  answer: "The series is named after the city of Antigo, the county seat of Langlade County in northern Wisconsin, where USDA soil scientists first formally described and mapped the series. The type location remains in Langlade County."
- question: What color is Antigo soil?
  answer: "The surface is very dark grayish brown from organic matter. Below that is a pale, light brownish gray layer where rain has leached out the iron. The argillic subsoil is reddish brown, colored by concentrated iron oxides. Between the pale and reddish layers is the glossic horizon — gray fingers of leached material extending down into the red clay."
- question: Where is Antigo soil found in Wisconsin?
  answer: "Antigo soil covers the flat to gently rolling outwash plains of northern Wisconsin, from Marathon County north through Langlade, Lincoln, Taylor, Price, and Oneida counties to the Michigan border. It is most concentrated in Langlade and Lincoln counties, the core of Wisconsin's northern dairy region."
- question: What grows in Antigo soil?
  answer: "Corn for silage, alfalfa, and mixed hay are the main crops — the feed base for northern Wisconsin's dairy herds. Potatoes and snap beans grow on faster-draining Antigo sites. On uncleared land, sugar maple, yellow birch, white spruce, and balsam fir form the northern hardwood and boreal forests of the region."
- question: Who chose Antigo as Wisconsin's state soil?
  answer: "The Wisconsin Legislature designated Antigo as the state soil in 1983, after a campaign by soil scientists and the Wisconsin Association of Conservation Districts. Wisconsin was among the first states in the country to name an official soil, years before the Soil Science Society of America organized a national state soil initiative."
- question: How deep is Antigo soil?
  answer: "The full profile runs about five and a half feet to coarse glacial outwash. The dark surface layer is roughly nine inches deep. The pale albic zone extends to about nineteen inches. The glossic horizon runs from nineteen to twenty-seven inches. The argillic clay layer continues to about forty-three inches, below which is coarse sand and gravel from the glacier."

