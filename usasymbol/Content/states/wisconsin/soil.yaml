seo_title: "Wisconsin State Soil | Antigo Series"
seo_description: "The Wisconsin state soil is the Antigo series, adopted in 1983. It covers northern Wisconsin's glaciated plains and grows corn, hay, and dairy forage."
hero_image: /images/soils/wisconsin/wisconsin-state-soil-hero.webp
hero_image_alt: "River valley with wooded bluffs and broad water channels seen from a high overlook in Wisconsin"
hero_image_caption: "A wide valley of water, forest, and upland bluffs reflects the glaciated landscapes where Antigo and other productive Wisconsin soils support farms and forests."
intro_text: "Wisconsin's state soil is the Antigo series — a fine-loamy Alfisol designated official in 1983, covering the glaciated outwash plains of northern Wisconsin and named after the city of Antigo in Langlade County, where USDA soil scientists first mapped the series. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Wisconsin State Soil
  paragraphs:
  - "Antigo soil is defined by a feature called the glossic horizon — a zone where the pale, leached E layer sends finger-like tongues down into the reddish-brown clay subsoil below it. This distinctive pattern, visible when you cut a trench, is rare enough in U.S. soils that it gives Antigo its taxonomic identity as a Glossudalf."
  - "The soil formed from glacial outwash — sand and gravel washed ahead of the Wisconsin Glacier as it retreated about 10,000 years ago. The flat to gently rolling terrain it left behind gave northern Wisconsin its broad, farmable plains, and Antigo soil is the ground those farms sit on."

- id: history
  icon: fa-solid fa-landmark
  title: Why Wisconsin Chose the Antigo Soil
  paragraphs:
  - "Wisconsin designated the Antigo series as the state soil in 1983, making it one of the first states in the country to establish an official soil. The push came from soil scientists and the Wisconsin Association of Conservation Districts, who wanted a symbol that reflected the state's glacial landscape and agricultural identity."
  - "Antigo was selected because it covers hundreds of thousands of acres across northern Wisconsin's dairy and forest belt and because its glacial origin connects directly to the landscape history that shaped the state. No other series combines that reach with the distinctive glossic profile."
  - "The series is named after the city of Antigo in Langlade County, the county seat of Wisconsin's northern forest region. USDA soil scientists established the type location in Langlade County, where the series was first formally described."

- id: profile
  icon: fa-solid fa-layer-group
  title: Antigo Soil Profile and Horizons
  paragraphs:
  - "Dig into Antigo soil and you move through several distinct worlds. The surface is dark and spongy from organic matter. Below that is a pale, almost colorless layer where rain has stripped the iron away. Then comes the most unusual part: a zone where pale gray fingers reach down into the reddish-brown clay — the glossic horizon. Deeper still is a firm clay layer, and beneath everything is the coarse sand and gravel the glacier left behind."
  layers:
  - horizon: Ap
    name: Surface layer
    depth_in: "0–9"
    color_hex: "#4A3E2C"
    color_name: very dark grayish brown
    texture: loamy sand to sandy loam
    note: darkened by organic matter from root turnover
  - horizon: E
    name: Albic layer
    depth_in: "9–19"
    color_hex: "#B0A28A"
    color_name: light brownish gray
    texture: sandy loam
    note: iron and clay leached downward; bleached pale gray
  - horizon: E/B
    name: Glossic horizon
    depth_in: "19–27"
    color_hex: "#7E6A50"
    color_name: brown
    texture: sandy loam to sandy clay loam
    note: pale E fingers penetrate reddish Bt — Antigo's signature layer
  - horizon: Bt
    name: Argillic horizon
    depth_in: "27–43"
    color_hex: "#8A4E2A"
    color_name: reddish brown
    texture: sandy clay loam
    note: clay films on ped faces; iron concentrated here
  - horizon: C
    name: Glacial outwash
    depth_in: "43–65"
    color_hex: "#9A7E55"
    color_name: yellowish brown
    texture: gravelly loamy sand
    note: coarse sand and gravel deposited by meltwater

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Antigo Soil Grows in Wisconsin
  paragraphs:
  - "Antigo soil covers the flat to gently rolling glaciated outwash plains of northern Wisconsin, roughly from Marathon County northward through the lake-dotted forest belt to Vilas and Forest counties near the Michigan border. It grows at elevations of 1,200 to 1,800 feet in a frigid climate with cold winters and short summers."
  - "Langlade County holds the type location and some of the highest concentrations of the series. Lincoln, Taylor, Price, and Oneida counties also have extensive Antigo soil — the core of Wisconsin's northern dairy and timber region."
  counties:
  - Langlade
  - Lincoln
  - Taylor
  - Price
  - Oneida
  - Forest
  - Vilas
  - Marathon
  - Shawano
  - Waupaca
  - Portage

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Antigo Soil
  paragraphs:
  - "Dairy farming is the dominant use of Antigo soil. The well-drained, deep profile supports corn for silage, alfalfa, and mixed hay — the three crops that feed Wisconsin's dairy herds. Langlade and Lincoln counties sit in the heart of the state's milk-producing region, and Antigo soil underlies most of their farmland."
  - "Potatoes grow on Antigo soil in central Wisconsin where the sandy outwash texture drains fast and the loose structure makes harvest easy. Snap beans and sweet corn also grow on flatter Antigo sites with good drainage."
  - "Where Antigo soil has not been cleared, sugar maple, yellow birch, white spruce, and balsam fir form the northern hardwood and boreal forests characteristic of Langlade and Vilas counties. Maple syrup production and timber harvesting occur on forested Antigo hillsides."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Antigo Soil Facts
  facts:
  - "Wisconsin designated the Antigo series as the official state soil in 1983 — one of the first state soil designations in the United States, years before a national campaign formalized the practice."
  - "The series is named after the city of Antigo, the county seat of Langlade County in northern Wisconsin, where USDA soil scientists first described and mapped the series."
  - "Antigo soil is classified as a Typic Glossudalf — an Alfisol defined by a glossic horizon, the zone where pale, iron-depleted E-horizon material tongues downward into the reddish clay argillic horizon below."
  - "The glossic horizon is Antigo's most distinctive feature. Cut a trench through Antigo soil and the pale gray fingers reaching into the reddish-brown clay are visible to the naked eye — a pattern caused by water moving unevenly through the profile over thousands of years."
  - "Antigo soil formed from glacial outwash — coarse sand and gravel washed southward ahead of the Wisconsin Glacier and deposited in broad, flat sheets as the ice melted around 10,000 years ago."
  - "The frigid soil temperature regime — average annual soil temperature below 47°F — limits Antigo soil to a growing season short enough that only cold-tolerant crops and northern tree species thrive on it."

