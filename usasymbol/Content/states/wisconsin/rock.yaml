intro_text: "Wisconsin's state rock is red granite, adopted in 1971 alongside the state mineral galena, recognizing the deep red stone quarried around Wausau for over a century. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Wisconsin State Rock
    paragraphs:
      - "Red granite is Wisconsin's official state rock, designated by the state legislature in 1971. It is a coarse-grained igneous rock colored by feldspar that crystallized more than a billion years ago, and it has been quarried around Wausau in Marathon County since the late 1800s."
      - "The Kenosha Gem and Mineral Society proposed the designation the same year it proposed galena as the state mineral, giving Wisconsin a matched pair of geological symbols."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Red Granite?"
    paragraphs:
      - "Granite is a coarse-grained igneous rock made mainly of quartz, feldspar, and mica, and its color depends largely on the feldspar it contains. Wisconsin's red granite gets its deep red to pink color from potassium feldspar crystals large enough to see without a magnifying glass."
      - "Red granite forms deep underground as molten rock cools slowly over thousands of years, allowing individual mineral crystals to grow large before the rock solidifies. That slow cooling creates a visibly speckled, crystalline texture rather than the smooth surface of rocks that cooled quickly."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Wisconsin Chose Red Granite as Its State Rock"
    paragraphs:
      - "Marathon County's granite deposits, formed roughly 1.8 billion years ago, have supplied building and monument stone since commercial quarrying began there in the 1880s. Wausau granite has been used in structures across the country, including work on the Wisconsin State Capitol."
      - "The rock's distinct red color, abundance, and long quarrying history matched the criteria the Kenosha Gem and Mineral Society set for a state rock. Its selection alongside galena in 1971 gave Wisconsin geological symbols tied to two different regions and industries within the state."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Red Granite Became Wisconsin's State Rock"
    paragraphs:
      - "The Wisconsin Legislature adopted red granite as the official state rock in 1971, the same year it designated galena the state mineral, both proposed by the Kenosha Gem and Mineral Society."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Red Granite Is Found in Wisconsin"
    paragraphs:
      - "Wisconsin's red granite is quarried in and around Wausau in Marathon County, part of the Wausau Intrusive Complex that has supplied building stone since the 1880s. Quarries in the area have shipped granite for use in monuments and buildings across the country."
