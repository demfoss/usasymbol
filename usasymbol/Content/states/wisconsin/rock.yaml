faq:
  - question: What is Wisconsin's state rock?
    answer: "Wisconsin's state rock is red granite, a coarse-grained igneous rock colored deep red by potassium feldspar, adopted in 1971."
  - question: When did Wisconsin adopt red granite as its state rock?
    answer: "The Wisconsin Legislature designated red granite the official state rock in 1971."
  - question: Why did Wisconsin choose red granite?
    answer: "Marathon County's red granite quarries, active since the 1880s, supplied building and monument stone across the country, including the Wisconsin State Capitol."
  - question: Where can you find red granite in Wisconsin?
    answer: "Wisconsin's red granite is quarried in and around Wausau in Marathon County, part of the Wausau Intrusive Complex."

