seo:
  title: "Most Common Last Names in Wisconsin"
  description: "Wisconsin's most common last names are Johnson, Smith, and Anderson, with German and Scandinavian names high statewide."

page:
  h1: "Most Common Last Names in Wisconsin"
  intro: "The most common last names in Wisconsin are Johnson, Smith, and Anderson, led by Scandinavian patronymics and a large German surname layer. Miller, Nelson, Olson, Peterson, Schmidt, Schultz, Larson, Meyer, Krueger, Hanson, and Mueller all rank in the top 20, showing how nineteenth-century immigration still shapes everyday family names across the state."
  heritage_title: "German Farms, Norwegian Churches, and Upper Midwest Towns"
  heritage_body: "Wisconsin's modern surname map began on Ho-Chunk, Menominee, Ojibwe, Potawatomi, Oneida, and other Native homelands, then changed rapidly after statehood in 1848. The Wisconsin Historical Society notes that by 1850 one-third of the state's population was foreign-born, and later state promotion reached Europe in German, Norwegian, Dutch, and English. German settlement made Schmidt, Schultz, Meyer, Krueger, and Mueller unusually strong, while Norwegian, Swedish, and Danish families helped Johnson, Anderson, Olson, Peterson, Nelson, Larson, and Hanson outrank many standard English names."
  fun_fact: "Krueger ranks eighteenth in Wisconsin but 817th nationally, one of the clearest signs that the state's German settlement history still shows up in ordinary phone-book surnames."

surnames:
  - rank: 1
    name: Johnson
    count: 46246
    ratio: 130
    origin: scandinavian
    type: Patronymic
    meaning: "Johnson means 'son of John,' but in Wisconsin it was reinforced by Scandinavian forms such as Johansen, Johansson, and Jonsson. Its first-place rank reflects both broad American use and the state's strong Norwegian, Swedish, and Danish settlement."

  - rank: 2
    name: Smith
    count: 31351
    ratio: 191
    origin: english
    type: Occupational
    meaning: "Smith comes from Old English for a metalworker or blacksmith. In Wisconsin it remained common through Yankee settlement, town-building, mining, farming, and later industrial work in Milwaukee and the Fox River valley."

  - rank: 3
    name: Anderson
    count: 27968
    ratio: 214
    origin: scandinavian
    type: Patronymic
    meaning: "Anderson means 'son of Anders' or Andrew. Wisconsin's Scandinavian communities made the name much more prominent than a purely English settlement pattern would have done."

  - rank: 4
    name: Miller
    count: 26624
    ratio: 225
    origin: english
    type: Occupational
    meaning: "Miller is an occupational name for a grain miller. In Wisconsin it also captures German Mueller and Muller families who anglicized their spelling after settling in a state known for wheat, dairy, breweries, and small-town mills."

  - rank: 5
    name: Nelson
    count: 19412
    ratio: 309
    origin: scandinavian
    type: Patronymic
    meaning: "Nelson means 'son of Nels' or Nils, the Scandinavian form of Nicholas. Its high rank points to Norwegian and Swedish settlement across southern, western, and northern Wisconsin."

  - rank: 6
    name: Olson
    count: 19326
    ratio: 310
    origin: scandinavian
    type: Patronymic
    meaning: "Olson means 'son of Ole' or Olof. Few names in Wisconsin's top 20 signal Norwegian and Swedish farm settlement as clearly, especially because Olson ranks far higher here than it does nationally."

  - rank: 7
    name: Brown
    count: 18548
    ratio: 323
    origin: english
    type: Descriptive
    meaning: "Brown began as a nickname for brown hair, complexion, or clothing. In Wisconsin it belongs to the broad English-language layer that remained visible beneath later German and Scandinavian immigration."

  - rank: 8
    name: Peterson
    count: 18463
    ratio: 325
    origin: scandinavian
    type: Patronymic
    meaning: "Peterson means 'son of Peter,' often from Scandinavian Petersen or Petersson. Wisconsin's rank reflects the same Nordic migration that lifted Johnson, Anderson, Nelson, and Olson."

  - rank: 9
    name: Williams
    count: 17113
    ratio: 350
    origin: welsh
    type: Patronymic
    meaning: "Williams means 'son of William,' from the Germanic Willahelm. It is common across the United States, but in Wisconsin it sits below several immigrant surnames that became unusually strong in the Upper Midwest."

  - rank: 10
    name: Schmidt
    count: 14979
    ratio: 400
    origin: german
    type: Occupational
    meaning: "Schmidt is the German equivalent of Smith, meaning a blacksmith. Its top-10 position is a direct marker of Wisconsin's German-speaking settlement, especially in Milwaukee, eastern farm counties, and central Wisconsin."

  - rank: 11
    name: Jones
    count: 14924
    ratio: 402
    origin: welsh
    type: Patronymic
    meaning: "Jones is the classic Welsh form meaning 'son of John.' In Wisconsin it remains common, but the names around it show how German and Scandinavian immigration altered the usual national ranking."

  - rank: 12
    name: Schultz
    count: 14000
    ratio: 428
    origin: german
    type: Occupational
    meaning: "Schultz comes from a German term for a village official, constable, or steward. Its high Wisconsin rank reflects German communities that kept the original surname form rather than translating it into English."

  - rank: 13
    name: Thompson
    count: 12560
    ratio: 477
    origin: english
    type: Patronymic
    meaning: "Thompson means 'son of Thomas.' It fits both British-American settlement and Scandinavian families whose similar patronymic habits made -son names familiar in Wisconsin records."

  - rank: 14
    name: Davis
    count: 12433
    ratio: 482
    origin: welsh
    type: Patronymic
    meaning: "Davis means 'son of David,' from a Hebrew name meaning beloved. In Wisconsin it represents general American migration rather than the state's most distinctive German or Scandinavian stream."

  - rank: 15
    name: Martin
    count: 11840
    ratio: 506
    origin: latin
    type: Patronymic
    meaning: "Martin comes from Latin Martinus, connected to Mars. Wisconsin's Martin families include English, German, Irish, and French-Canadian lines, which helped the name remain common across ethnic communities."

  - rank: 16
    name: Larson
    count: 11466
    ratio: 523
    origin: scandinavian
    type: Patronymic
    meaning: "Larson means 'son of Lars.' It ranks high because Norwegian and Swedish immigrants brought Larsen, Larsson, and similar spellings into Wisconsin, where many families settled into the simplified -son form."

  - rank: 17
    name: Meyer
    count: 11398
    ratio: 526
    origin: german
    type: Occupational
    meaning: "Meyer comes from a German word for a steward, tenant farmer, or estate manager. In Wisconsin it belongs to the large German rural and small-town surname layer that remained visible long after German-language schools and newspapers faded."

  - rank: 18
    name: Krueger
    count: 10352
    ratio: 579
    origin: german
    type: Occupational
    meaning: "Krueger, often Krüger in German, referred to an innkeeper, tavern keeper, or potter depending on region. Its top-20 rank is unusually Wisconsin-specific and points to the state's dense German settlement."

  - rank: 19
    name: Hanson
    count: 10154
    ratio: 590
    origin: scandinavian
    type: Patronymic
    meaning: "Hanson means 'son of Hans,' a Scandinavian and German form of John. Wisconsin's rank reflects both Nordic settlement and the broader Germanic naming patterns that shaped the state."

  - rank: 20
    name: Mueller
    count: 10031
    ratio: 598
    origin: german
    type: Occupational
    meaning: "Mueller, often Müller in German, means miller. Its place beside Miller in Wisconsin's top 20 shows how the state preserved both the translated English form and the German spelling."

