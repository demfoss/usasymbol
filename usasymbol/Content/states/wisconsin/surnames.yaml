seo:
  title: "Most Common Last Names in Wisconsin"
  description: "The most common last names in Wisconsin are Johnson, Smith, and Anderson, with German and Scandinavian settlement pushing names like Schmidt, Schultz, Olson, and Krueger high statewide."

page:
  h1: "Most Common Last Names in Wisconsin"
  intro: "The most common last names in Wisconsin are Johnson, Smith, and Anderson, led by Scandinavian patronymics and a large German surname layer. Miller, Nelson, Olson, Peterson, Schmidt, Schultz, Larson, Meyer, Krueger, Hanson, and Mueller all rank in the top 20, showing how nineteenth-century immigration still shapes everyday family names across the state."
  heritage_title: "German Farms, Norwegian Churches, and Upper Midwest Towns"
  heritage_body: "Wisconsin's modern surname map began on Ho-Chunk, Menominee, Ojibwe, Potawatomi, Oneida, and other Native homelands, then changed rapidly after statehood in 1848. The Wisconsin Historical Society notes that by 1850 one-third of the state's population was foreign-born, and later state promotion reached Europe in German, Norwegian, Dutch, and English. German settlement made Schmidt, Schultz, Meyer, Krueger, and Mueller unusually strong, while Norwegian, Swedish, and Danish families helped Johnson, Anderson, Olson, Peterson, Nelson, Larson, and Hanson outrank many standard English names."
  fun_fact: "Krueger ranks eighteenth in Wisconsin but 817th nationally, one of the clearest signs that the state's German settlement history still shows up in ordinary phone-book surnames."

