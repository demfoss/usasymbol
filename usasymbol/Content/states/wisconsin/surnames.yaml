unique_surnames:
  - name: Krueger
    state_rank: 18
    national_rank: 817
    origin: german
    why: "Krueger is one of Wisconsin's strongest signature surnames because German-speaking families arrived in large numbers during the nineteenth century and often kept German spellings. The name's top-20 rank in Wisconsin, compared with 817th nationally, makes it far more state-specific than Smith or Johnson."

  - name: Mueller
    state_rank: 20
    national_rank: 422
    origin: german
    why: "Mueller survives in Wisconsin at high volume alongside the anglicized Miller. That pairing reflects a German settlement pattern strong enough to preserve original spellings across churches, farms, breweries, and urban neighborhoods."

  - name: Schroeder
    state_rank: 25
    national_rank: 426
    origin: german
    why: "Schroeder is common in Wisconsin because German settlement extended beyond Milwaukee into rural eastern and central counties. The name means tailor or cloth-cutter in German, and its statewide rank shows how many families kept the German form."

  - name: Schmitz
    state_rank: 72
    national_rank: 1373
    origin: german
    why: "Schmitz is a compact German form related to Schmidt, meaning smith. Its Wisconsin concentration fits the same German Catholic and Lutheran settlement belt that made Schmidt, Schultz, Schneider, Weber, and Meyer so visible."

  - name: Vang
    state_rank: 86
    national_rank: 1742
    origin: hmong
    why: "Vang is a Hmong clan name that ranks far higher in Wisconsin than nationally because Hmong refugees and their families built lasting communities after the Vietnam War era. Wausau, Green Bay, Eau Claire, La Crosse, Sheboygan, and Milwaukee all became important Hmong centers."

etymology_groups:
  - type: German Occupational Names
    icon: fa-solid fa-hammer
    description: "Wisconsin's top 20 contains a striking German work-name cluster: Schmidt, Schultz, Meyer, Krueger, and Mueller all come from trades, offices, or rural roles. Their rank reflects nineteenth-century German immigration and the persistence of German spellings in family, church, and land records."
    examples:
      - Schmidt (blacksmith)
      - Mueller (miller)
      - Krueger (innkeeper or potter)
      - Meyer (steward or tenant farmer)

  - type: Scandinavian Patronymics
    icon: fa-solid fa-person
    description: "Johnson, Anderson, Nelson, Olson, Peterson, Larson, and Hanson show the Scandinavian patronymic pattern of naming a child after a father's given name. Wisconsin's Norwegian, Swedish, and Danish communities made these names strong enough to outrank many standard English surnames."
    examples:
      - Johnson (son of John/Johan)
      - Anderson (son of Anders)
      - Olson (son of Ole/Olof)
      - Larson (son of Lars)

  - type: English and Welsh Baseline Names
    icon: fa-solid fa-map-location-dot
    description: "Smith, Brown, Williams, Jones, Thompson, Davis, and Martin form Wisconsin's broad English-language baseline. They arrived through older American migration and later city growth, but the state's top 20 is distinctive because German and Scandinavian names interrupt the usual national order."
    examples:
      - Smith (metalworker)
      - Williams (son of William)
      - Jones (son of John)
      - Brown (brown-haired or brown-clothed)

faq:
  - question: "What are the most common last names in Wisconsin?"
    answer: "The most common last names in Wisconsin are Johnson, Smith, Anderson, Miller, and Nelson. The top 20 is unusually shaped by Scandinavian and German surnames, including Olson, Peterson, Schmidt, Schultz, Larson, Meyer, Krueger, Hanson, and Mueller."

  - question: "Why is Johnson the most common last name in Wisconsin?"
    answer: "Johnson ranks first in Wisconsin because it is both a common American surname and a common anglicized form for Scandinavian patronymics such as Johansen, Johansson, and Jonsson. Norwegian, Swedish, and Danish settlement helped push it above Smith statewide."

  - question: "Why are German last names so common in Wisconsin?"
    answer: "German last names are common in Wisconsin because German-speaking immigrants were one of the state's largest nineteenth-century settlement groups. Names such as Schmidt, Schultz, Meyer, Krueger, Mueller, Schroeder, Schneider, Weber, and Wagner remain visible because many families preserved German spellings across generations."

