timeline:
  - year: "1848"
    description: "Wisconsin admitted to the Union on May 29 as the 30th state; the University of Wisconsin-Madison is chartered in the same year, beginning the institution's evolution into the dominant cultural force behind Wisconsin's red-and-white color identity"
  - year: "1894"
    description: "University of Wisconsin officially adopts cardinal red and white as its institutional colors, standardizing the pairing that will become Wisconsin's most recognizable state color identity over the following century"
  - year: "1917"
    description: "Camp Randall Stadium opens in Madison, beginning the tradition of massive cardinal-red-clad crowds at Wisconsin football that will make UW's colors among the most recognized in Big Ten athletics"
  - year: "1939"
    description: "Wisconsin license plates begin featuring the America's Dairyland motto, reinforcing the dairy heritage connection that makes white — the color of milk — an essential element of Wisconsin's identity alongside cardinal red"
  - year: "1993"
    description: "University of Wisconsin standardizes cardinal red as PMS 200 in its official brand identity guidelines, establishing the Pantone specification that serves as the de facto standard for Wisconsin's traditional state color"

expert_quote:
  text: "In Wisconsin, cardinal red is not just a university color — it is the color of game day, of cheese curds, of the State Fair, and of the fierce pride that connects Badger fans from Milwaukee to Superior. The University of Wisconsin made red synonymous with Wisconsin, and the dairy farms made white inseparable from the Badger State's identity."
  source: "Wisconsin Historical Society, Madison, State Identity and Cultural Heritage Documentation"

faq:
  - question: "What are the state colors of Wisconsin?"
    answer: "Wisconsin's traditional state colors are Red and White, originating from the University of Wisconsin-Madison. They have not been formally designated by legislative statute but function as Wisconsin's de facto color identity, embraced statewide across commerce, tourism, dairy industry branding, and civic culture."
  - question: "What is the HEX code for Wisconsin Red?"
    answer: "The official HEX code for Wisconsin Cardinal Red is #C5050C, corresponding to Pantone PMS 200 as standardized by the University of Wisconsin-Madison's official brand identity program."
  - question: "Why is Wisconsin associated with red and white?"
    answer: "Wisconsin's red-and-white association originates from the University of Wisconsin-Madison Badgers, who adopted cardinal red and white as official colors in 1894. The Badgers' sustained success in Big Ten athletics and their statewide cultural influence spread the color pairing across all 72 counties of Wisconsin, where it is reinforced by the dairy industry's white and the sports culture's cardinal red."
  - question: "Are red and white Wisconsin's official state colors?"
    answer: "Red and white are considered semi-official state colors in Wisconsin. The Wisconsin Legislature has not formally codified state colors by statute, but red and white are universally recognized as Wisconsin's color identity through the University of Wisconsin Badgers' statewide cultural dominance and the dairy industry's association with white."
  - question: "What Pantone color is Wisconsin Red?"
    answer: "Wisconsin Cardinal Red is officially standardized as Pantone PMS 200 by the University of Wisconsin-Madison's brand identity program — a deep, crimson-leaning red that distinguishes Wisconsin's cardinal from the brighter reds used by other institutions."

