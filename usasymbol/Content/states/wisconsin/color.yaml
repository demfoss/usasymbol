title: "Official and Traditional Colors of Wisconsin"
state: "Wisconsin"
adopted_year: null

seo_title: "Wisconsin State Colors: Official HEX Codes & Meaning"
seo_description: "Wisconsin state colors are Red and White, based on University of Wisconsin Cardinal Red and state branding. Full HEX, RGB, CMYK, and Pantone values with historical context for designers and researchers."

intro_text: "The traditional state colors of Wisconsin are **Red** and **White**, originating from the University of Wisconsin-Madison and now the de facto color identity of the Badger State. Although Wisconsin has not formally designated official state colors by legislative statute, red and white are visible across state tourism materials, [the Wisconsin state flag](/states/wisconsin/flag/wisconsin-state-flag), and the branding of Wisconsin's most prominent industries and sports. All technical color values — HEX, RGB, CMYK, and Pantone — are in the specifications below, suitable for print, web, and official Wisconsin state branding."

official_colors: "Red and White"
official_since: "Semi-official (no formal legislative designation; University of Wisconsin tradition broadly embraced statewide)"
primary_use: "University of Wisconsin athletics and branding, Wisconsin state tourism identity, dairy industry branding, civic celebrations and commercial applications statewide"
known_for: "Cardinal Red — one of the most recognizable colors in Big Ten and NCAA athletics — representing the University of Wisconsin Badgers whose statewide cultural influence has made red and white synonymous with Wisconsin identity from Milwaukee to Madison to Green Bay"

color_data:
  - name: "Cardinal Red"
    hex: "#C5050C"
    rgb: "197, 5, 12"
    cmyk: "0, 97, 94, 23"
    pantone: "PMS 200"
    symbolism: "Represents the spirit, passion, and competitive excellence of the University of Wisconsin Badgers — whose cardinal red has been a constant across more than a century of Big Ten athletics — and the robust, hardworking character of Wisconsin's dairy farming heritage; the deep cardinal shade, distinct from the brighter reds used by many other institutions, conveys the seriousness and staying power of Wisconsin's academic and athletic traditions"
  - name: "White"
    hex: "#FFFFFF"
    rgb: "255, 255, 255"
    cmyk: "0, 0, 0, 0"
    pantone: "White"
    symbolism: "Represents the dairy heritage that defines Wisconsin's agricultural identity as America's Dairyland — the white of fresh milk, of aged cheddar, and of the 1.27 million dairy cattle whose milk production makes Wisconsin the nation's leading cheese-producing state; white also evokes the winter snowcover that blankets Wisconsin's landscape for five months each year and the clean, austere quality of Wisconsin's Reformed Protestant and Scandinavian agricultural heritage"

sections:
  - id: "official-designation"
    title: "Status and History of Wisconsin's State Colors"
    style: "default"
    paragraphs:
      - "Wisconsin has not formally designated official state colors by legislative statute, placing red and white in the category of semi-official color identities driven by institutional cultural dominance rather than legal codification. Wisconsin's Legislature has designated numerous official state symbols — including the [state bird](/states/wisconsin/bird/american-robin), [state flower](/states/wisconsin/flower/wood-violet), sugar maple (state tree), and dairy cow (state domestic animal) — but has not enacted a state colors statute. The red-and-white association develops from the University of Wisconsin-Madison's cardinal red color identity, which has achieved statewide saturation through the Badgers' prominent role in Big Ten and national athletics over more than a century."
      - "The University of Wisconsin-Madison, founded in 1848 the same year Wisconsin achieved statehood, adopted cardinal red as its primary color in the 1890s, creating an institutional color identity that has proven extraordinarily durable. The Badgers' success in football at Camp Randall Stadium — one of the most historically significant college football venues in the Midwest — basketball at the Kohl Center, and numerous other Big Ten sports has maintained continuous national visibility for Wisconsin's cardinal red across multiple generations of fans. The color's dominance in the state is reinforced by the Wisconsin Alumni Association's extensive statewide network and by Wisconsin's tradition of strong public university pride across all 72 counties, alongside iconic visuals from [the Wisconsin state flag](/states/wisconsin/flag/wisconsin-state-flag)."
    subsections:
      - subtitle: "University of Wisconsin and Cardinal Red"
        text: "The University of Wisconsin adopted cardinal red and white as its official colors in 1894, following a period of institutional color experimentation in the university's early decades. The 1894 adoption standardized the color as cardinal — a deep, crimson-leaning red distinct from the brighter scarlets used by some other institutions — and white as the complementary color that provides clean contrast on uniforms, banners, and printed materials. The University of Wisconsin brand identity program has since standardized cardinal red as PMS 200, a specification that has been consistently applied across all official university applications since the development of the Pantone Matching System in the 1960s."
      - subtitle: "Statewide Embrace Beyond the University"
        text: "Red and white's reach in Wisconsin extends well beyond the University of Wisconsin-Madison into commercial, civic, and industrial contexts that reflect the color's deep integration into Wisconsin identity. Wisconsin's dairy industry — the state produces approximately 26 percent of all cheese manufactured in the United States — uses red and white in product packaging, marketing, and industry branding in ways that connect the university's colors to Wisconsin's most foundational economic identity. The Milwaukee Bucks NBA franchise and the Green Bay Packers NFL franchise use different color palettes (green and gold for the Packers, green and cream for the Bucks), but the UW Badgers' cardinal red remains the dominant sports color in Wisconsin's statewide consciousness."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Red and white in Wisconsin carry a symbolism that blends the passionate fan culture of the University of Wisconsin with the agricultural and cultural heritage of America's Dairyland. Red speaks to the energy, determination, and fierce loyalty that characterize Wisconsin's sporting culture — the packed stadiums, the legendary tailgating traditions, and the statewide unity that surrounds Badgers athletics on game days from Kenosha to Superior. White speaks to the dairy heritage that is Wisconsin's most fundamental economic and cultural identity: the milk that built the cheese industry, the clean fields of the winter-snow landscape, and the bright, honest quality that Wisconsin's agricultural communities have associated with their way of life since the nineteenth century, including the legacy of [Wisconsin's dairy cow symbol](/states/wisconsin/mammal/dairy-cow)."
    subsections:
      - subtitle: "Red and the Badger State's Sporting Culture"
        text: "Wisconsin's red is specifically cardinal — a deep, serious red with blue undertones that distinguishes it from the brighter reds of some other institutions. The name cardinal references the northern cardinal bird, whose deep red plumage is one of the most vivid color experiences in Wisconsin's winter landscape, when the bright red of cardinals against white snow creates one of the Midwest's most iconic seasonal images. Camp Randall Stadium in Madison, which opened in 1917 and has a capacity of over 80,000, fills with cardinal-red-clad fans on football Saturdays, creating one of the most visually striking spectacles in Big Ten athletics. The stadium itself sits on the grounds of Camp Randall, a Civil War training camp where over 70,000 Wisconsin soldiers mustered before deploying, giving Wisconsin's red an additional layer of historical association with sacrifice and service."
      - subtitle: "White and America's Dairyland"
        text: "Wisconsin's designation as America's Dairyland — a nickname that appears on Wisconsin license plates and is among the most accurate of any state's unofficial monikers — makes white the most economically meaningful color in the state's palette. Wisconsin's 6,500 dairy farms produce over 30 billion pounds of milk annually, supporting an $18.5 billion dairy industry that manufactures approximately 600 varieties of cheese — more cheese varieties than any other state and more than any country except France and Italy. The white of fresh milk, of mozzarella, of aged cheddar fresh from the cave, and of the Holstein dairy cattle visible on every rural Wisconsin roadside gives white a grounding in Wisconsin's agricultural reality that no other color can claim in the Badger State."

  - id: "state-emblems"
    title: "Usage in Tourism, Agriculture, and Institutional Branding"
    style: "default"
    paragraphs:
      - "Red and white pervade Wisconsin's commercial and civic landscape in ways that give the semi-official color pairing a depth of market penetration that exceeds many legally designated state color programs. Wisconsin Tourism, the state's official travel promotion division, uses red extensively in campaigns leveraging the Badger State's sports culture, dairy heritage, and outdoor recreation economy. Wisconsin's dairy marketing campaigns — particularly those promoting Wisconsin cheese through the Wisconsin Milk Marketing Board — use red and white in packaging and promotional materials that appear in grocery stores across all fifty states, giving Wisconsin's color identity national retail visibility. The Wisconsin State Fair, one of the largest in the nation with attendance exceeding 1 million annually, is festooned in red and white during its eleven-day August run. Red and white also appear in the branding of Wisconsin's craft brewing industry — the state has over 200 craft breweries — whose marketing frequently references Wisconsin's sports culture and the red-and-white palette associated with it and the broader [Badger State identity](/states/wisconsin/nickname/the-badger-state)."

