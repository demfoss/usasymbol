sections:
  - id: "official-designation"
    title: "Wisconsin State Colors History"
    style: "default"
    paragraphs:
      - "Wisconsin has not designated official state colors by statute. Red and white are a semi-official tradition that began at the University of Wisconsin-Madison."
      - "The pairing was broadly embraced statewide and now serves as the informal palette of the Badger State."
  - id: "symbolism"
    title: "What Wisconsin Red and White Mean"
    style: "highlight"
    paragraphs:
      - "No law assigns a meaning here. Cardinal Red is one of the most recognizable colors in Big Ten and NCAA athletics, and it stands for the University of Wisconsin Badgers."
      - "Their influence made red and white synonymous with Wisconsin identity from Milwaukee to Madison to Green Bay."
  - id: "state-emblems"
    title: "Where Wisconsin Colors Appear"
    style: "default"
    paragraphs:
      - "Red and white appear in University of Wisconsin athletics and branding, state tourism materials and dairy industry branding. They also show up on the Wisconsin state flag and at civic celebrations and commercial uses statewide."
