seo_title: "Wisconsin State Colors | Red White"
seo_description: "Wisconsin state colors are Red and White, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Wisconsin are **Red** and **White**, originating from the University of Wisconsin-Madison and now the informal color tradition of the Badger State. Although Wisconsin has not formally designated official state colors by legislative statute, red and white are visible across state tourism materials, [the Wisconsin state flag](/states/wisconsin/flag/wisconsin-state-flag), and the branding of Wisconsin's most prominent industries and sports. The specifications below list HEX, RGB, CMYK, and Pantone values for Wisconsin color matching. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Red and White"
official_since: "Semi-official (no formal legislative designation; University of Wisconsin tradition broadly embraced statewide)"
primary_use: "University of Wisconsin athletics and branding, Wisconsin state tourism identity, dairy industry branding, civic celebrations and commercial applications statewide"
known_for: "Cardinal Red — one of the most recognizable colors in Big Ten and NCAA athletics — representing the University of Wisconsin Badgers whose statewide cultural influence has made red and white synonymous with Wisconsin identity from Milwaukee to Madison to Green Bay"

