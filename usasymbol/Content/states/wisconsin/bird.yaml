title: American Robin
scientific_name: Turdus migratorius
adopted_year: 1949
legislation: Wis. Stat. Sec. 1.10(3)(f)
meaning: Wisconsin's robin page works best as a delayed-ratification story. Schoolchildren chose the robin during the 1926-27 school year, but the bird did not become official until 1949. The important part is not spring folklore or lawn biology. It is that the original school choice stayed alive for twenty-two years through the work of the State Federation of Women's Clubs and its conservation leaders until lawmakers finally put the robin into Wisconsin law.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: '2026-03-28'
seo_title: 'Wisconsin State Bird: American Robin'
seo_description: Wisconsin adopted the American Robin in 1949, twenty-two years after schoolchildren first chose it. The stronger story is the long push that turned a classroom favorite into a state symbol.
intro_text: Wisconsin's official state bird is the <strong>American Robin</strong>, made official on <strong>June 4, 1949</strong> and now carried in <strong>Wis. Stat. Sec. 1.10(3)(f)</strong>. The better story is that Wisconsin did not choose the robin quickly. Schoolchildren had already picked it during the <strong>1926-27</strong> school year, but the designation sat for twenty-two more years before it reached the statute book. That delay is what gives the symbol its shape. Wisconsin's robin was not just a familiar bird of spring. It was a schoolroom winner that the State Federation of Women's Clubs kept pushing until the state finally turned the old choice into law.
shared_states:
- Connecticut
- Michigan
