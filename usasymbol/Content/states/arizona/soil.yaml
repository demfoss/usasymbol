faq:
- question: What is Arizona's state soil?
  answer: "Arizona's state soil is the Casa Grande series, a pale, salty desert soil found on the basin floors and fan terraces of southern Arizona. It is recognized by the USDA Natural Resources Conservation Service as Arizona's representative state soil. The Arizona Legislature has not passed a formal law to make it official."
- question: Why is it called Casa Grande soil?
  answer: "The series is named after the city of Casa Grande and the nearby Casa Grande National Monument in Pinal County. Casa Grande means 'Big House' in Spanish — a reference to a large earthen structure built by the Hohokam people there roughly 700 years ago. The series was first described in the area in 1936."
- question: What color is Casa Grande soil?
  answer: "The surface is pale — light yellowish brown or pale brown, almost tan. The subsoil layers are a warmer yellowish brown to strong brown. The overall appearance is typical of desert soils: dry, pale, and dusty at the surface, becoming slightly darker and more compact in the clay-rich subsoil."
- question: Where is Casa Grande soil found in Arizona?
  answer: "Casa Grande soil is found on the flat basin floors and fan terraces of southern and central Arizona, mainly in Maricopa, Pinal, and Pima counties. About 260,000 acres have been mapped, but there are likely several million additional acres across central and southwestern Arizona."
- question: What crops grow in Casa Grande soil?
  answer: "With irrigation, Casa Grande soil grows cotton, small grains, and vegetables. Without irrigation, the high salt and sodium content makes it suitable mainly for desert shrubs like saltbush, wolfberry, and mesquite."
- question: Who chose Casa Grande as Arizona's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Casa Grande series as Arizona's representative state soil. The Arizona Legislature has not passed a formal law making it an official state symbol."
- question: How salty is Casa Grande soil?
  answer: "Very salty by crop standards. The subsoil has a natric horizon — a layer high in sodium — and the pH can reach 9.6 in the calcium carbonate zone. Most crops need a pH below 8 to grow well. Irrigation is used to flush excess salts downward and make the soil productive."

