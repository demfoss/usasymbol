seo_title: "Arizona State Tree | Blue Palo Verde"
seo_description: "Arizona's state tree is the blue palo verde, a green-barked Sonoran Desert tree adopted in 1954 and common around washes and desert cities."

intro_text: "Blue Palo Verde became Arizona's state tree in 1954. Its green bark, drought tolerance, and bright yellow spring bloom made it a natural symbol for the Sonoran Desert landscape most closely associated with Arizona."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Arizona"
    paragraphs:
      - "Arizona recognizes the Blue Palo Verde as its official state tree. This small deciduous tree typically grows 15 to 25 feet tall in Arizona's desert valleys, spreading 20 to 30 feet wide. The trunk and branches appear blue-green year-round due to chlorophyll in the bark. This green bark allows the tree to photosynthesize through its trunk and branches—an adaptation that sets palo verde apart from nearly all other trees. When summer temperatures exceed 110°F and soil moisture disappears, palo verde drops its leaves but continues producing energy through its green bark. This survival strategy makes palo verde perfectly suited to Arizona's harsh Sonoran Desert environment."
      - "The trunk develops rough, scaly bark on older specimens, but young branches maintain smooth blue-green surfaces. Sharp spines grow at branch nodes, providing protection from browsing animals. The leaves appear tiny and compound, with multiple small leaflets along each stem. These leaves emerge after winter rains and drop during drought periods. Bright yellow flowers cover the entire tree in April and May, creating spectacular displays visible for miles across Arizona deserts. Each flower measures about one inch across with five petals. The blooms attract native bees and other pollinators emerging from winter dormancy."
      - "Blue palo verde grows throughout southern and central Arizona below 4,000 feet elevation. The species thrives in the Sonoran Desert from Phoenix south to the Mexican border and west toward Yuma. The tree grows naturally along desert washes, on bajadas—the gently sloping plains below mountains—and across creosote flats. Palo verde requires no supplemental water once established, surviving on Arizona's scant 7 to 12 inches of annual rainfall. The species dominates the desert landscape around Phoenix, Tucson, and Casa Grande, making it familiar to most Arizona residents. These trees create the characteristic appearance of Arizona's low desert ecosystems."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Blue Palo Verde"
    paragraphs:
      - "The common name is Blue Palo Verde, though many Arizonans simply say palo verde. The name comes from Spanish, meaning 'green stick' or 'green tree,' directly describing the distinctive bark color. The scientific name is Parkinsonia florida. Parkinsonia honors English botanist John Parkinson. Florida means flowering, referring to the abundant spring blooms. This species belongs to the Fabaceae family, the legume or pea family."
      - "Arizona has two native palo verde species—Blue Palo Verde and Foothills Palo Verde. Blue palo verde grows in lower desert valleys and washes. Foothills palo verde prefers rocky slopes and higher elevations. The blue species has blue-green bark and larger flowers, while foothills palo verde shows yellow-green bark and smaller blooms. Arizona's state tree designation specifies blue palo verde. The tree fixes nitrogen in desert soils through root nodules, improving soil fertility like other legumes. Desert landscapers also use the hybrid 'Desert Museum' palo verde, bred from both native species."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Blue Palo Verde Became the Arizona State Tree"
    paragraphs:
      - "Arizona designated the Palo Verde as its official state tree on March 15, 1954. The Arizona Legislature passed House Bill 291 during the 1954 session. Governor Howard Pyle signed the legislation establishing palo verde as Arizona's arboreal symbol. The bill specified 'palo verde' without naming which species, though blue palo verde was clearly intended as the most widespread and recognizable form. The designation came during Arizona's rapid growth period when new residents were learning about desert plants that differed dramatically from trees in other regions, much like [the Arizona state flag](/states/arizona/flag/arizona-state-flag) taught flag imagery."
      - "Arizona picked palo verde because it embodied desert survival and beauty. No other tree represented Arizona's Sonoran Desert environment so completely. The species thrives in conditions that kill most trees—extreme heat, scarce water, intense sun, and alkaline soils. Palo verde demonstrates that Arizona's desert supports diverse life despite harsh conditions. The tree's photosynthesizing bark fascinated botanists and the public, showcasing unique desert adaptations. Palo verde's ability to bloom spectacularly during drought years symbolized resilience and hope in challenging environments."
      - "The spring bloom influenced the selection significantly. Each April and May, palo verde trees explode with yellow flowers that transform Arizona's brown desert landscape into seas of gold. These mass blooming events occur when winter rains provide adequate moisture, sometimes covering entire hillsides with yellow. The visual impact impressed Arizona residents and visitors alike. Travelers on highways between Phoenix and Tucson drove through tunnels of yellow as blooming palo verdes lined the roads. This annual spectacle made palo verde Arizona's most visible and celebrated native tree. The 1954 designation honored a tree that brought beauty to the desert and represented Arizona's unique ecological character to the nation."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Arizona State Tree Facts"
    facts:
      - "Arizona designated Palo Verde as state tree on March 15, 1954, through House Bill 291 signed by Governor Howard Pyle"
      - "The blue-green bark contains chlorophyll and photosynthesizes, allowing the tree to produce energy even after dropping leaves during drought"
      - "Palo verde flowers bloom for only 3 to 4 weeks each spring, typically in April and May, creating brief but spectacular displays"
      - "The tree can survive multiple years without rainfall by relying on bark photosynthesis and deep taproots reaching groundwater"
      - "Blue palo verde is the most common large native tree in the Sonoran Desert, outnumbering mesquite and ironwood in many areas"
      - "The seeds remain viable in desert soil for decades, germinating only when sufficient rainfall occurs"
      - "As a legume, palo verde fixes atmospheric nitrogen through root nodules, enriching desert soils that typically lack nitrogen"
      - "The dense yellow flowers produce high-quality nectar, making palo verde honey a prized Arizona product"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Arizona State Tree and Flower"
    paragraphs:
      - "Arizona's state flower is the Saguaro Cactus Blossom (Carnegiea gigantea), designated in 1931. The state adopted its floral symbol 23 years before selecting the blue palo verde. Both the Blue Palo Verde and Saguaro represent Arizona's signature Sonoran Desert plants; see [Arizona's state flower page](/states/arizona/flower/saguaro-cactus-blossom) for the flower timeline. The white saguaro blossoms open at night in late May and June, attracting bats and bees. Palo verde trees bloom earlier in spring with masses of yellow flowers. Both species thrive in identical desert habitats throughout southern Arizona. Young saguaros often grow beneath palo verde branches where the tree provides protective shade. The pair shows the Sonoran Desert that defines Arizona's landscape—towering saguaros standing above spreading palo verdes covered in gold blooms each spring."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize an Arizona Blue Palo Verde"
    paragraphs:
      - "The bark provides instant identification throughout the year. Look for distinctive blue-green coloring on the trunk and all branches. Young branches show the brightest blue-green, smooth and almost glowing in Arizona sunlight. Older trunk bark becomes rougher and develops scales, but the underlying blue-green color remains visible. No other Arizona tree displays this characteristic color. The bark feels cool to touch even in summer heat because the chlorophyll reflects rather than absorbs infrared radiation. Sharp spines protrude at branch joints, typically one to two inches long."
      - "The leaves offer confirmation when present but only grow during favorable conditions. Each leaf consists of multiple tiny leaflets along a central stem, measuring just one-quarter inch long. The leaves appear sparse and wispy, never creating dense shade. After monsoon rains begin in July, new leaves may emerge briefly. The tree drops leaves quickly when drought returns, sometimes remaining leafless for months. This deciduous behavior in a desert climate surprises people unfamiliar with Arizona trees. During leafless periods, the blue-green bark performs all photosynthesis."
      - "The overall form shows a spreading, irregular crown with multiple trunks emerging from the base. The canopy appears open and airy rather than dense. Branches grow in zigzag patterns, creating angular silhouettes against Arizona skies. In April and May, the entire tree transforms into a mass of yellow flowers. Each flower has five bright yellow petals with orange markings. The blooms cover branches so completely that green bark disappears behind gold. After flowering, flat seed pods develop, measuring two to three inches long. These pods turn brown and dry, eventually splitting to release hard seeds. The combination of blue-green bark, sparse foliage, and spring gold blooms creates an unmistakable appearance typical of Arizona's Sonoran Desert."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Arizona State Tree Symbolizes"
    paragraphs:
      - "The Blue Palo Verde reflects survival through adaptation in Arizona culture. Its ability to photosynthesize through bark represents innovative solutions to extreme challenges. The tree symbolizes Arizona's desert environment and the specialized life forms that thrive in seemingly inhospitable conditions. For many Arizonans, palo verde's spring blooms represent renewal and hope, showing that beauty emerges even from harsh landscapes. The tree's transformation from bare blue-green branches to masses of gold flowers captures the dramatic changes that characterize desert life. Modern Arizona landscaping increasingly features palo verde as residents embrace native plants suited to the desert climate. This shift reflects Arizona's growing understanding that desert ecosystems possess inherent value rather than needing transformation into lawns and exotic trees requiring precious water, especially across zones summarized in [States That Border Arizona](/states/arizona/borders)."
      - "From a national geography lens, Arizona's tree habitats are commonly analyzed with [U.S. states by land area](/rankings/geography/states-by-land-area)."

faq:
  - question: "What is the Arizona state tree?"
    answer: "The Blue Palo Verde (Parkinsonia florida) is Arizona's official state tree. It was designated by the Arizona Legislature on March 15, 1954."

  - question: "What is the Arizona state tree called?"
    answer: "Arizona's state tree is called the Blue Palo Verde, or simply palo verde. The name comes from Spanish and means 'green stick.'"

  - question: "When was the Arizona state tree adopted?"
    answer: "Arizona designated the palo verde as its official state tree on March 15, 1954, when Governor Howard Pyle signed House Bill 291."

  - question: "Why is the Blue Palo Verde Arizona's state tree?"
    answer: "Arizona chose the Blue Palo Verde because it symbolizes survival in the harsh Sonoran Desert. Its green bark photosynthesizes, allowing it to live through extreme heat and drought, and its bright yellow blooms bring color to the desert each spring."

  - question: "Where does the Arizona state tree grow?"
    answer: "The Blue Palo Verde grows throughout southern and central Arizona, especially in the Sonoran Desert around Phoenix, Tucson, and Casa Grande. It thrives below 4,000 feet along washes and desert plains."

  - question: "What are some facts about the Arizona state tree?"
    answer: "The Blue Palo Verde has blue-green bark that produces energy, blooms with yellow flowers in April and May, fixes nitrogen in the soil, and can survive years of drought. It typically grows 15 to 25 feet tall."

  - question: "How do you recognize the Arizona state tree?"
    answer: "You can recognize the Blue Palo Verde by its blue-green trunk and branches, small leaves that drop during drought, sharp spines, bright yellow spring flowers, and flat seed pods."

