name_meaning:
  heading: What Does Arizona Mean?
  paragraphs:
  - Arizona is a state in the American Southwest, admitted to the Union on February 14, 1912 as the 48th state. The origin of the name is debated more than many state names, and several explanations have circulated.
  - One common explanation connects Arizona to O'odham words translated as "place of the little spring." Another major explanation, supported by historical research cited by Arizona state references, connects the name to a Basque phrase meaning "good oak tree." Both explanations point to place-name history in the Spanish colonial borderlands.
  - Arizona is best known as the Grand Canyon State, but Copper State and Valentine State also appear in historical and promotional use. Its postal abbreviation is AZ, and residents are Arizonans.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Debated; often explained through O'odham place-name language or through a Basque phrase used in Spanish colonial records.
    - label: Common meanings
      text: Place of the little spring and good oak tree are the two best-known explanations.
    - label: Statehood
      text: Arizona became the 48th state on February 14, 1912.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Arizona, a Southwestern state known for the Grand Canyon and the Sonoran Desert.
    - label: Territory
      text: Arizona Territory was created in 1863, almost half a century before statehood.
    - label: Given name
      text: Arizona is sometimes used as a modern place-inspired given name.
    - label: People
      text: People from Arizona are called Arizonans.
  - heading: Nicknames and Short Forms
    items:
    - label: Grand Canyon State
      text: Official nickname tied to the Grand Canyon in northern Arizona.
    - label: Copper State
      text: Refers to Arizona's long role as the leading copper-producing state.
    - label: Valentine State
      text: Informal nickname from Arizona's February 14, 1912 statehood date.
    - label: Abbreviation
      text: AZ; older short form Ariz.
editorial:
  heading: What Arizona's Symbols Say About the State
  paragraphs:
  - Arizona's [cactus wren](/states/arizona/bird) and [saguaro cactus blossom](/states/arizona/flower) were adopted together in 1931, which makes the desert connection unusually clear. The bird nests among thorny cactus plants, and the flower belongs to the saguaro, the plant most people picture when they imagine southern Arizona.
  - The [state flag](/states/arizona/flag) adds the mining story through its copper star and the Spanish-borderlands story through its red and gold rays. The [motto Ditat Deus](/states/arizona/motto) keeps that mineral theme in words, since "God Enriches" made sense in a territory built around copper, silver, and gold.
  - The [ringtail](/states/arizona/mammal/ringtail), [blue palo verde](/states/arizona/tree), and [lemonade](/states/arizona/beverage/lemonade) are quieter symbols, but they make the same point from different angles. They are about night movement through canyons, drought-adapted trees, and citrus grown in irrigated desert heat.
faq:
- question: What is Arizona's most famous state symbol?
  answer: The [saguaro cactus blossom](/states/arizona/flower) is one of Arizona's most famous symbols because the saguaro is closely tied to the Sonoran Desert landscape.
- question: What is Arizona's state bird?
  answer: Arizona's state bird is the [cactus wren](/states/arizona/bird), adopted in 1931 in the same act that named the saguaro blossom as the state flower.
- question: What is Arizona's state flower?
  answer: Arizona's state flower is the [saguaro cactus blossom](/states/arizona/flower), adopted in 1931.
- question: What do Arizona's state colors represent?
  answer: Arizona's official state colors are blue and old gold. They are covered on the [Arizona colors](/states/arizona/color) page and connect to the state flag, statehood identity, and mining history.
- question: How many official state symbols does Arizona have?
  answer: The Arizona hub gathers the symbol pages now available on USA Symbol, including the desert bird-and-flower pair, flag, colors, mammal, dinosaur, and state drink.
