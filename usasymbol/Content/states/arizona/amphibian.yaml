sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Arizona?
    paragraphs:
      - "The Arizona tree frog is Arizona's official state amphibian, designated by the Arizona Legislature in 1986. Its scientific name is Hyla eximia."
      - "It is a small tree frog found in isolated mountain ranges across central and eastern Arizona, far from most other tree frog populations in North America."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Arizona Tree Frog
    paragraphs:
      - "The Arizona tree frog is small, usually under two inches long, with smooth green to olive skin and a dark stripe running from its nose through its eye."
      - "It has rounded toe pads that let it grip leaves, rocks, and bark, and it is often heard more than seen thanks to its loud, duck-like call during the spring breeding season."
      - "It stays close to water during breeding season but can be found in nearby woodlands and grassy areas the rest of the year."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Arizona Legislature designated the Arizona tree frog the official state amphibian in 1986, giving the state its first amphibian symbol."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Arizona Chose the Arizona Tree Frog
    paragraphs:
      - "Official sources name the Arizona tree frog as the state amphibian but do not give a detailed reason for the choice. Its name and its limited range within the state's mountain ranges likely made it a fitting symbol."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Arizona Tree Frog
    paragraphs:
      - "The Arizona tree frog lives in scattered mountain ranges across central and eastern Arizona, including areas near the Mogollon Rim, where it breeds in ponds and slow streams."
    sites:
      - name: Mogollon Rim area
        city: Payson
        lat: 34.23
        lng: -111.32
        note: "Mountain habitat where the frog breeds"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Arizona Tree Frog Facts
    facts:
      - "Adopted in 1986 by the Arizona Legislature."
      - "Scientific name is Hyla eximia."
      - "Grows to less than two inches long."
      - "Has a dark eye stripe and rounded toe pads for climbing."
      - "Known for a loud, duck-like breeding call heard in spring."

