- id: facts
  icon: fa-solid fa-lightbulb
  title: Petrified Wood Facts
  facts:
  - "Arizona designated Petrified Wood as its state fossil in 1988, one of the few states to honor a plant fossil rather than an animal."
  - "Some petrified logs in the park measure over 170 feet long, with the original tree structure intact down to growth rings and bark texture."
  - "The colors in Arizona's petrified wood come from minerals: iron oxides for reds and yellows, manganese for purples and blacks, and pure silica for white and gray."
  - "President Theodore Roosevelt designated the Petrified Forest as a national monument in 1906 specifically to stop large-scale removal of logs by collectors and industry."
  - "Araucarioxylon arizonicum grew in a tropical lowland near the equator. Arizona's paleolatitude during the Late Triassic was about 10 degrees north, roughly where Central America is today."

