faq:
- question: What is Arizona's state fossil?
  answer: "Arizona's state fossil is Petrified Wood, specifically Araucarioxylon arizonicum, a Triassic conifer whose logs are preserved as colorful stone. The state legislature designated it in 1988."
- question: When did Arizona adopt its state fossil?
  answer: "Arizona adopted Petrified Wood as its state fossil in 1988."
- question: What does the Petrified Wood look like?
  answer: "Arizona's petrified logs are colorful stone, with reds, oranges, yellows, purples, and whites produced by different minerals in the original groundwater. The logs preserve the original tree structure, including bark and growth rings. Some measure over 170 feet long."
- question: Where is Petrified Wood found in Arizona?
  answer: "Most of Arizona's petrified wood is found in Petrified Forest National Park in Navajo and Apache counties. The park has several log concentration areas including Rainbow Forest, Crystal Forest, and Jasper Forest. Petrified wood from the same Chinle Formation also occurs across the broader northeastern Arizona plateau."
- question: When did the trees that became Arizona's petrified wood live?
  answer: "Araucarioxylon arizonicum grew during the Late Triassic, about 225 to 210 million years ago. The trees went extinct at the end of the Triassic period, about 201 million years ago."
- question: How does wood turn into stone?
  answer: "When the trees were buried in sediment, silica dissolved from volcanic ash seeped into the wood through groundwater. Over millions of years, silica replaced each wood cell with mineral, preserving the original structure while turning the organic material into stone."

