title: "Ditat Deus"
language: "Latin"
english_translation: "God Enriches"
adopted_year: 1912

author: "USA Symbol Team"
date_published: "2025-12-01"
date_modified: "2026-03-27"
seo_title: "Arizona State Motto | Ditat Deus! God Enriches!"
seo_description: "Arizona's state motto is 'Ditat Deus,' Latin for 'God enriches.' Learn why it appears on the territorial seal, who chose it, and what it means."

intro_text: "Arizona's official motto is <strong>Ditat Deus</strong> — Latin for <em>God Enriches</em>. It is one of the oldest mottoes still in use from a state that started as a Civil War-era territory. Richard Cunningham McCormick, Arizona's territorial secretary, wrote it in 1863 when he personally designed the first territorial seal. The phrase survived 49 years of territorial status before Arizona became a state in 1912. At two words, it is also the shortest God-referencing motto among all 50 states."

sections:
  - id: "one-man-one-phrase"
    icon: "fa-solid fa-pen-nib"
    title: "One Man Invented This Motto in 1863"
    paragraphs:
      - "Most state mottos come from legislative committees, historical documents, or public contests. Arizona's came from one journalist with a printing press. Richard Cunningham McCormick arrived in Arizona Territory in 1863 after President Lincoln appointed him territorial secretary. He was 26 years old and had worked as a New York journalist and newspaper editor before heading west."
      - "McCormick designed Arizona's first territorial seal himself — no committee, no competition. He placed a miner with a pick, mountains in the background, and the two-word Latin phrase <em>Ditat Deus</em> (God Enriches) above the scene. Critics weren't impressed. Contemporary observers said the original seal looked like a label for Pioneer Baking Soda powder. The design changed repeatedly over the decades. The motto did not."
      - "McCormick later served as Arizona's second territorial governor (1866–1869) and then as a delegate to Congress. His two-word phrase outlasted every version of the seal it originally appeared on and became Arizona's official state motto when statehood arrived in 1912."

  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "What 'Ditat Deus' Means — and Where It May Come From"
    paragraphs:
      - "The translation is <strong>God Enriches</strong>. 'Ditat' is the third-person singular of <em>ditare</em>, 'to enrich or make wealthy.' 'Deus' is God. Simple Latin, no ambiguity in the translation."
      - "The possible scriptural source is Genesis 14:23 in the Latin Vulgate Bible. In that passage, Abraham refuses the king of Sodom's offer of riches, saying he will not take wealth from any man — that enrichment comes from God alone. The exact phrase doesn't appear verbatim in the Vulgate, but the concept maps directly. Whether McCormick made that reference intentionally or coined the phrase independently isn't documented."
      - "The practical context matters as much as the theological one. Arizona in 1863 was a harsh desert territory dependent on mining. Copper, silver, and gold were the economy. A motto about God-given enrichment fit both the religious sensibility of 19th-century settlers and the very literal fact that Arizona's wealth came out of the ground."

  - id: "49-years-as-territory"
    icon: "fa-solid fa-landmark"
    title: "A Motto That Waited 49 Years for Statehood"
    paragraphs:
      - "Arizona Territory was established February 24, 1863 — splitting off from New Mexico Territory during the Civil War. McCormick designed the seal and motto that same year. The phrase appeared on Arizona's territorial documents from 1863 onward."
      - "Arizona's road to statehood was long. Congress rejected applications multiple times, partly over concerns about the territory's population size and partly over political calculations in Washington. When Arizona finally became the 48th state on February 14, 1912 — Valentine's Day — the 1863 motto carried over automatically as part of the state seal."
      - "That 49-year span from territorial motto to state motto is longer than most. The Arizona Constitution (Article 22, Section 20) describes the state seal and locks in 'Ditat Deus' as part of the official design. The phrase McCormick wrote at 26 years old is still in use today."

  - id: "five-god-mottos"
    icon: "fa-solid fa-cross"
    title: "Arizona Among the Five States With God in Their Motto"
    paragraphs:
      - "Five U.S. states mention God or divine authority in their official mottos: Arizona ('God Enriches'), Colorado ('Nothing Without the Deity'), Florida ('In God We Trust'), Ohio ('With God, All Things Are Possible'), and South Dakota ('Under God the People Rule'). Arizona's is the shortest — just two words — and the oldest, predating Ohio's by nearly a century."
      - "Florida's motto is identical to the U.S. national motto. Ohio's is a New Testament reference (Matthew 19:26). South Dakota's positions God above government. Colorado's uses 'Deity' rather than 'God.' Arizona's stands apart for its simplicity and for its direct connection to one man's 1863 design decision rather than a legislative debate."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Arizona State Motto Facts"
    style: "gradient"
    facts:
      - "McCormick was 26 years old when he designed the territorial seal and motto in 1863."
      - "He later became Arizona's second territorial governor (1866–1869)."
      - "The original 1863 seal was mocked as resembling a baking soda label."
      - "Arizona is one of only 5 states with a motto that references God — and has the shortest of the five."
      - "The motto appeared on territorial documents for 49 years before Arizona became a state."
      - "Arizona became the 48th state on February 14, 1912 — Valentine's Day."

faq:
  - question: "What is Arizona's state motto?"
    answer: "Arizona's state motto is 'Ditat Deus,' a Latin phrase meaning 'God Enriches.' It was created in 1863 and became the official state motto when Arizona achieved statehood in 1912."

  - question: "What does 'Ditat Deus' mean in English?"
    answer: "'God Enriches.' 'Ditat' comes from the Latin verb meaning to enrich or make wealthy; 'Deus' means God. At two words, it is the shortest of the five U.S. state mottos that reference God."

  - question: "Who created Arizona's motto?"
    answer: "Richard Cunningham McCormick, a journalist appointed as Arizona's first territorial secretary by President Lincoln in 1863. He designed the entire territorial seal himself and included 'Ditat Deus' in the design. He later became Arizona's territorial governor."

  - question: "When did Arizona officially adopt its motto?"
    answer: "The motto was first used in 1863 on the territorial seal. It became the official state motto in 1912 when Arizona became the 48th state. The Arizona Constitution (Article 22, Section 20) codifies it as part of the state seal."

  - question: "Is 'Ditat Deus' from the Bible?"
    answer: "Possibly. Scholars have linked it to the concept in Genesis 14:23, where Abraham declines the king of Sodom's offer and states that enrichment comes from God alone. The exact Latin phrase doesn't appear verbatim in the Vulgate, and whether McCormick intended the reference is not documented."

  - question: "Where does Arizona's motto appear today?"
    answer: "On Arizona's state seal, which shows a miner, mountains, a reservoir, irrigated fields, and a rising sun — with 'Ditat Deus' above the scene. The seal appears on government documents, official letterhead, and state buildings."

