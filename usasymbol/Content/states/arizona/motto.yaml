seo_title: "Arizona State Motto | Ditat Deus"
seo_description: "Arizona's state motto is \"Ditat Deus,\" a Latin phrase meaning \"God Enriches.\" It has appeared on Arizona's state seal since the territorial period began in 1863."

intro_text: "Arizona's state motto is <strong>Ditat Deus</strong>, a Latin phrase meaning <em>God Enriches</em>. It appeared on the Arizona territorial seal in 1863, nearly fifty years before Arizona became a state, and has been part of Arizona's official identity ever since."

