faq:
  - question: "What is Arizona's state motto?"
    answer: "Arizona's state motto is \"Ditat Deus,\" a Latin phrase meaning \"God Enriches.\" It has appeared on Arizona's seal since the territorial period in 1863."

  - question: "What does \"Ditat Deus\" mean?"
    answer: "\"Ditat Deus\" means \"God Enriches\" in Latin. Ditat comes from the verb ditare, meaning to enrich or make wealthy. Deus means God."

  - question: "What is the English translation of Arizona's motto?"
    answer: "The English translation is \"God Enriches.\" The phrase refers to Arizona's natural wealth. Copper, silver, fertile river valleys, and grazing land are what the territorial founders believed had been given to them."

  - question: "When did Arizona adopt its state motto?"
    answer: "\"Ditat Deus\" appeared on the Arizona territorial seal in 1863. When Arizona became a state on February 14, 1912, the motto carried over unchanged to the official state seal."

  - question: "Where does Arizona's motto appear?"
    answer: "The motto appears at the top of the Arizona state seal, which is displayed on official documents, government buildings, and the state flag."

