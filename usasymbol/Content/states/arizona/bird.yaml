sections:
- id: official-designation
  icon: fa-solid fa-scale-balanced
  title: One 1931 Bill, Two Desert Symbols
  paragraphs:
  - Arizona made the Cactus Wren official through House Bill 128, approved on March 16, 1931. The same act also designated the saguaro blossom as the state flower.
  - The pairing was deliberate. Both symbols belong to the same Sonoran Desert environment, and choosing them together in a single bill signaled something specific about how Arizona wanted to define itself — not through a bird or flower that could belong to any state, but through species tied to the cactus landscape.
- id: why-arizona
  icon: fa-solid fa-sun
  title: A Bird Built for the Desert Arizona Already Had
  paragraphs:
  - The Cactus Wren is the largest wren in North America, and it is a year-round resident of the Sonoran Desert — not a migratory bird that passes through. It stays through the heat, the dry seasons, and the summers that define Arizona's climate. That permanence mattered for a symbol meant to represent the place itself.
  - The nesting behavior reinforced the association. Cactus Wrens build in cholla, saguaro, and other thorny desert plants, using the spines as natural protection. The bird is physically embedded in the same landscape that the 1931 bill also honored with the saguaro blossom. Choosing it alongside that flower was not coincidental.
- id: name-in-law
  icon: fa-solid fa-book
  title: What the Statute Preserves
  paragraphs:
  - Arizona's current statute does not stop at a short common name. It designates the cactus wren <em>otherwise known as Coues' cactus wren</em> and carries the older scientific label <em>heleodytes brunneicapillus couesi (Sharpe)</em>, which predates the modern classification <em>Campylorhynchus brunneicapillus</em>.
  - The Coues' reference points to Elliott Coues, a 19th-century Army surgeon and naturalist who documented bird species across the American Southwest, including in what was then Arizona Territory. The subspecies name <em>couesi</em> honors his work. Arizona keeping that wording in statute is a specific nod to the natural-history record of the region — not a clerical oversight, but territorial-era vocabulary that the state chose not to update.
faq:
- question: When did Arizona adopt the Cactus Wren as its state bird?
  answer: Arizona adopted the Cactus Wren on March 16, 1931, through House Bill 128.
- question: Why does Arizona law call it Coues' cactus wren?
  answer: Because the statute preserves older common and scientific wording. Modern bird guides usually use Cactus Wren and Campylorhynchus brunneicapillus, but Arizona law still keeps the older legal form.
- question: Did Arizona adopt its state bird and state flower at the same time?
  answer: Yes. House Bill 128 designated both the Cactus Wren as the state bird and the saguaro blossom as the state flower in 1931.
