seo_title: "Arizona State Bird | Cactus Wren"
seo_description: Arizona's state bird is the Cactus Wren, adopted in 1931. Learn why it was chosen, how Arizona law describes it, and why the symbol fits the Sonoran Desert.
intro_text: The official state bird of Arizona is the <strong>Cactus Wren</strong>, adopted on <strong>March 16, 1931</strong>, in the same act that also designated the [Saguaro Blossom](/states/arizona/flower/saguaro-cactus-blossom) as the state flower. What makes the page more interesting is the language Arizona kept in law. Current statute still preserves the wording <strong>Coues' cactus wren</strong> and the older scientific name <em>heleodytes brunneicapillus couesi (Sharpe)</em>, even though modern field guides usually list the species as <em>Campylorhynchus brunneicapillus</em>.
