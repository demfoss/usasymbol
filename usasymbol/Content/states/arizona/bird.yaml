title: Cactus Wren
scientific_name: Campylorhynchus brunneicapillus
adopted_year: 1931
legislation: A.R.S. 41-854; House Bill 128 (1931)
meaning: Arizona's bird symbol does more than point to a desert species. The law preserves the older wording Coues' cactus wren and an older scientific label, so the symbol carries both Sonoran Desert identity and a piece of the state's earlier natural-history vocabulary.
