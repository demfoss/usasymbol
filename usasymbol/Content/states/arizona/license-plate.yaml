seo_title: 'Arizona License Plate Slogan: "Grand Canyon State" Since 1940'
seo_description: Arizona's license plate slogan is "Grand Canyon State," first used in 1940. The year before, a one-year commemorative plate carried "Marcos de Niza." Here's the full story.
intro_text: >
  Arizona's standard license plate slogan is "Grand Canyon State," a phrase that has appeared on the state's plates since 1940 and remains on the current ADOT-issued plate today. The slogan entered use the year after Arizona issued a one-year commemorative plate honoring Spanish explorer Fray Marcos de Niza, which carried "Marcos de Niza" at the bottom. "Grand Canyon State" replaced that commemorative design and has been Arizona's plate identity ever since — more than eight decades and counting.

quick_answer: >
  Arizona's license plate slogan is "Grand Canyon State." According to ADOT, it first appeared on Arizona plates in 1940. The year before, the 1939 plate was a commemorative issue honoring Fray Marcos de Niza and carried "Marcos de Niza" as its tagline instead.

