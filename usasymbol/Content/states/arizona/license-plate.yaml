faq:
  - question: What is the slogan on Arizona license plates?
    answer: Arizona's license plate slogan is "Grand Canyon State." It has appeared on the state's standard plates since 1940 and remains on the current ADOT-issued plate.
  - question: When did "Grand Canyon State" first appear on Arizona plates?
    answer: According to ADOT, "Grand Canyon State" first appeared on Arizona license plates in 1940.
  - question: What slogan came before "Grand Canyon State" on Arizona plates?
    answer: The year before "Grand Canyon State" was introduced, Arizona issued a one-year commemorative plate in 1939 that carried "Marcos de Niza" at the bottom, honoring Spanish explorer Fray Marcos de Niza.
  - question: Was "Marcos de Niza" a standard Arizona plate slogan?
    answer: No. "Marcos de Niza" appeared only on a single commemorative plate issued in 1939 to mark the 400th anniversary of Fray Marcos de Niza's exploration of the Southwest. It was never a standard or long-running Arizona plate slogan.
  - question: Does Arizona still use "Grand Canyon State" on its license plates?
    answer: Yes. ADOT's current standard Arizona plate still carries the "Grand Canyon State" tagline.

