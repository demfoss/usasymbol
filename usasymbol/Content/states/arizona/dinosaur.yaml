faq:
  - question: "What is Arizona's state dinosaur?"
    answer: "A student hiker, not a professional paleontologist, found it. Richard Thompson spotted bones eroding from a hillside in Graham County in 1994, reported them to the Arizona-Sonora Desert Museum, and set off a multi-year excavation. The animal he found — Sonorasaurus thompsoni, a large Late Cretaceous brachiosaurid — was formally named in 1998 and designated Arizona's official state dinosaur by House Bill 2419 in 2018."

  - question: "Who discovered Sonorasaurus?"
    answer: "Richard Thompson, a student, discovered the bones while hiking near the Aravaipa Canyon area of Graham County in 1994. The find was reported to the Arizona-Sonora Desert Museum, which organized the excavation and eventual scientific description by Ron Ratkevich."

  - question: "What does 'Sonorasaurus thompsoni' mean?"
    answer: "Sonorasaurus means 'lizard of Sonora,' referring to the Sonoran Desert region of the American Southwest and northwestern Mexico. The species name thompsoni honors Richard Thompson, the hiker who discovered the bones."

  - question: "How big was Sonorasaurus?"
    answer: "Sonorasaurus was a large sauropod — estimated at roughly 15 meters in length and possibly 20,000–30,000 kg in weight. Like other brachiosaurids, it had forelimbs longer than its hindlimbs, giving it an upward-slanting neck suited for browsing high vegetation."

  - question: "Why is Sonorasaurus scientifically significant?"
    answer: "Sonorasaurus is one of the few brachiosaurid sauropods known from the Late Cretaceous of North America. Most North American brachiosaurids are from the Jurassic. Sonorasaurus lived roughly 93 million years ago — when its family had become rare on the continent — making it an important data point for understanding brachiosaurid survival and the poorly-documented Turonian interval of Southwest dinosaur history."

  - question: "Where can I see Sonorasaurus in Arizona?"
    answer: "The Arizona-Sonora Desert Museum in Tucson, which led the original excavation, is the best starting point. The Arizona Museum of Natural History in Mesa also has relevant exhibits on Southwest dinosaurs. The Turney Ranch Formation discovery site is in remote terrain in Graham County near the Galiuro Mountains."

