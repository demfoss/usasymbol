seo_title: "Arizona State Dinosaur | Sonorasaurus thompsoni"
seo_description: "The official state dinosaur of Arizona is Sonorasaurus thompsoni, adopted in 2018. This long-necked dinosaur was discovered in Graham County in 1994."

intro_text: "**Sonorasaurus thompsoni** was adopted as Arizona's official state dinosaur in **2018**. A long-necked, plant-eating sauropod from the Late Cretaceous, it was discovered in Graham County in 1994 and remains one of Arizona's most important fossil finds."

sections:

  - id: "the-discovery"
    icon: "fa-solid fa-person-hiking"
    title: "How a Weekend Hike Changed Arizona Paleontology"
    paragraphs:
      - "Richard Thompson's 1994 find set off years of careful excavation in difficult terrain. The Aravaipa Canyon region of Graham County — remote, deeply eroded desert in southeastern Arizona — is exactly the kind of landscape where bones erode unnoticed for millions of years before someone happens to walk past at the right moment. Thompson understood what he was seeing and made the call that started everything."
      - "Ron Ratkevich of the Arizona-Sonora Desert Museum led the scientific work and formally described the new species in 1998. The genus name Sonorasaurus honors the Sonoran Desert — a region shared between the American Southwest and northwestern Mexico. The species name thompsoni is a direct acknowledgment that a student hiker, not a professional paleontologist, is responsible for one of Arizona's most significant fossil discoveries."

  - id: "designation-2018"
    icon: "fa-solid fa-scale-balanced"
    title: "Twenty Years Between Naming and Recognition"
    subsections:
      - subtitle: "A Long Wait"
        text: "Sonorasaurus was formally described in 1998 — but Arizona didn't designate it as the state dinosaur until 2018. For twenty years, the state had its own named dinosaur and no official recognition of it. House Bill 2419 closed that gap. Arizona is not unusual in this regard; many states spent years with undocumented state fauna before school campaigns or individual legislators pushed designation bills through."
      - subtitle: "The Only Named Dinosaur from Arizona"
        text: "There was no competition for the designation. Sonorasaurus was the only dinosaur species formally described and named from Arizona with a documented type specimen. The state's Triassic and Jurassic formations have produced fossil material, but nothing approaching the documentation of Sonorasaurus. The legislature designated the one animal Arizona's record had produced."

  - id: "scientific-importance"
    icon: "fa-solid fa-flask"
    title: "Why the Timing Matters: A Late Survivor"
    paragraphs:
      - "By 93 million years ago — the Turonian stage of the Late Cretaceous — brachiosaurid sauropods had become rare across North America. Most dinosaur faunas of that era on the continent were dominated by hadrosaurs and ceratopsians. Sonorasaurus represents a lineage persisting in the American Southwest long after its family had declined elsewhere on the continent. That's the scientific value: not just that it's big, but that it was still here when it probably shouldn't have been."
      - "The Turonian is also one of the less-documented intervals of North American dinosaur history. There's a well-known gap in the fossil record between the Morrison Formation faunas of the Jurassic and the better-understood latest Cretaceous — Tyrannosaurus, Triceratops, and their contemporaries. Sonorasaurus, recovered from the Turney Ranch Formation of southeastern Arizona, is one of the few animals that fills any part of that gap for the Southwest specifically."
      - "The Turney Ranch Formation itself has not been extensively excavated. Sonorasaurus remains its most significant find. Its presence suggests that the Cretaceous Southwest hosted a distinct dinosaur community — one that preserved conditions allowing late-surviving sauropods to persist — but the picture is still fragmentary."

  - id: "comparison"
    icon: "fa-solid fa-arrows-left-right"
    title: "Same Year, Same Region, Different World"
    subsections:
      - subtitle: "Arizona and Utah Both Designated in 2018"
        text: "Utah designated Utahraptor ostrommaysorum the same year Arizona designated Sonorasaurus — two Southwestern states formalizing state dinosaurs simultaneously. The animals could hardly be more different: Sonorasaurus was a 15-meter plant-eating sauropod from ~93 million years ago; Utahraptor was a half-ton predatory dromaeosaurid from ~126 million years ago. They are separated by 33 million years of evolution and opposite ecological roles. The shared designation year is coincidence. The shared geography reflects how much of the Southwest's Mesozoic dinosaur record remains poorly documented — two states legislating recognition for animals that science is still piecing together."
        link:
          label: "See Utah State Dinosaur"
          url: "/states/utah/dinosaur/utahraptor"

