    description: "Student hiker Richard Thompson spots dinosaur bones eroding from a hillside in Graham County, Arizona, and reports the find to the Arizona-Sonora Desert Museum"
  - year: "1994–1997"
    description: "Arizona-Sonora Desert Museum teams conduct multi-season excavation of the Sonorasaurus site in the Turney Ranch Formation"
  - year: "1998"
    description: "Ron Ratkevich formally names and describes Sonorasaurus thompsoni — 'Thompson's lizard of Sonora' — honoring both the region and the discoverer"
  - year: "2018"
    description: "Arizona House Bill 2419 designates Sonorasaurus thompsoni as the official state dinosaur of Arizona, twenty years after its scientific naming"

faq:
  - question: "What is Arizona's state dinosaur?"
    answer: "Arizona's state dinosaur is Sonorasaurus thompsoni. It was adopted in 2018."

  - question: "Who discovered Sonorasaurus?"
    answer: "Richard Thompson found the bones in 1994 while hiking in Graham County."

  - question: "What does 'Sonorasaurus thompsoni' mean?"
    answer: "Sonorasaurus means 'lizard of Sonora.' The species name thompsoni honors Richard Thompson."

  - question: "How big was Sonorasaurus?"
    answer: "It was about 15 meters long and may have weighed 20,000 to 30,000 kg."

  - question: "Why is Sonorasaurus scientifically significant?"
    answer: "It is one of the few Late Cretaceous brachiosaurids known from North America."

  - question: "Where can I see Sonorasaurus in Arizona?"
    answer: "Start with the Arizona-Sonora Desert Museum in Tucson."

