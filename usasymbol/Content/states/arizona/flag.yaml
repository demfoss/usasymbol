faq:
- question: Who designed the Arizona state flag?
  answer: Colonel Charles W. Harris designed the Arizona flag in 1910 for the Arizona National Guard rifle team. He sketched the design on an envelope at Camp Perry, Ohio. Carl Hayden, Arizona's first U.S. Representative, also contributed to the design.
- question: What does the copper star on Arizona's flag mean?
  answer: The copper star represents Arizona's copper mining industry. Arizona produces more copper than any other U.S. state. The star sits at the center of the flag, where the rays meet the blue field.
- question: Why does Arizona's flag have 13 rays?
  answer: The thirteen rays represent the original thirteen colonies. They also symbolize the setting sun, spread across the western half of the flag. The rays alternate red and gold — seven red and six gold.
- question: Why are the rays red and gold?
  answer: The red and gold colors were taken from the Spanish flag to honor the Spanish explorers who traveled through Arizona in the 1500s, including Francisco Vázquez de Coronado.
- question: Did Arizona's governor sign the flag into law?
  answer: No. Governor Thomas Campbell received the bill in 1917 but never signed it. He also never vetoed it. The flag became law without his signature under Arizona's legislative procedure. He never publicly explained his decision.
