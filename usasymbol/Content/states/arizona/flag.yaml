- id: facts
  icon: fa-solid fa-lightbulb
  title: Quick Facts
  facts:
  - 'Origin: designed in 1910 at Camp Perry, Ohio, for the Arizona National Guard rifle team — not for the state'
  - 'First sketch: drawn on an envelope by Colonel Charles W. Harris'
  - 'First flag sewn: by Mae Stewart, wife of W.R. Stewart of Mesa, from the envelope sketch'
  - "First official state flag sewn: by Nan Hayden, wife of Carl Hayden, Arizona's first U.S. Representative"
  - 'Adopted: February 27, 1917 — seven years after the rifle team first used it'
  - Governor Thomas Campbell never signed the flag bill — it became law without his signature
  - The copper star reflects Arizona's status as the largest copper-producing state in the U.S.
  - 13 rays = 13 original colonies; also represent the setting sun
  - 'Ray count: 7 red, 6 gold — not an equal split'
  - Red and gold reference the Spanish flag and Coronado's 1540s expeditions through Arizona
  - Ranked 6th among all North American flags in the 2001 NAVA design quality survey
