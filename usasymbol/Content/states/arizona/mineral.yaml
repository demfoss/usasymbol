faq:
  - question: What is Arizona's state mineral?
    answer: "Arizona's state mineral is wulfenite, a lead molybdate mineral known for its thin, bright orange-red crystals."
  - question: When did Arizona adopt wulfenite as its state mineral?
    answer: "The Arizona Legislature designated wulfenite the official state mineral in 2017."
  - question: Why did Arizona choose wulfenite?
    answer: "Arizona mines, especially the Red Cloud Mine in La Paz County, have produced world-famous wulfenite specimens since the 1880s, and mineral researchers pushed for the state to formally recognize it."
  - question: Where can you find wulfenite in Arizona?
    answer: "The Red Cloud Mine in La Paz County is the most famous source, and wulfenite also occurs in oxidized lead deposits in Pima, Maricopa, and Gila counties."

