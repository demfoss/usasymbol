intro_text: "Arizona's state mineral is wulfenite, adopted by the Arizona Legislature in 2017 to recognize a mineral whose vivid orange-red crystals from Arizona mines are prized by collectors worldwide. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Arizona State Mineral
    paragraphs:
      - "Wulfenite is Arizona's official state mineral, designated by the Arizona Legislature in 2017. It is a lead molybdate mineral best known for its thin, flat, brightly colored crystals, and Arizona mines have produced some of the finest wulfenite specimens in the world."
      - "Arizona was a fitting choice for this designation because the state's oxidized lead deposits have made it one of the most productive wulfenite-collecting regions on Earth, drawing mineral collectors and museums to its historic mines."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Wulfenite?"
    paragraphs:
      - "Wulfenite forms thin, tabular, square-edged crystals, often no thicker than a fingernail, in colors ranging from deep orange-red to yellow, brown, or gray. Its bright color and glassy to resinous shine make it a favorite among mineral collectors even though the mineral itself is soft and brittle."
      - "Wulfenite is a secondary mineral, meaning it forms when weathering, oxygen, and water alter lead-bearing ore deposits near the surface. Arizona's arid climate and long history of lead and silver mining created ideal conditions for wulfenite to crystallize in mine workings across the state."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Arizona Chose Wulfenite as Its State Mineral"
    paragraphs:
      - "Arizona mines, especially the Red Cloud Mine in La Paz County, have produced wulfenite crystals considered among the best in the world since the 1880s. Collectors and museums around the globe seek out Red Cloud specimens for their size and color."
      - "The designation came from outside the mining industry itself; a University of Arizona researcher proposed the idea to a state representative, who sponsored the bill that became law in 2017. Arizona had no official state mineral before then, despite the state's deep mining history and wulfenite's international reputation."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Wulfenite Became Arizona's State Mineral"
    paragraphs:
      - "Governor Doug Ducey signed the bill making wulfenite Arizona's state mineral on March 22, 2017, following a push from mineral collectors and researchers rather than the mining industry."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Wulfenite Is Found in Arizona"
    paragraphs:
      - "The Red Cloud Mine, in the Trigo Mountains of La Paz County, is the world's best-known source of fine wulfenite crystals, producing specimens on and off since the 1880s. Wulfenite also occurs in oxidized lead deposits in Pima, Maricopa, and Gila counties."
    sites:
      - name: Red Cloud Mine
        city: Yuma
        lat: 33.10045
        lng: -114.59984
        note: "World-famous wulfenite locality"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Wulfenite Facts"
    facts:
      - "Adopted as Arizona's state mineral in 2017, after being signed into law by Governor Doug Ducey."
      - "Wulfenite is named after Austrian mineralogist Franz Xaver von Wulfen."
      - "The Red Cloud Mine in La Paz County has produced some of the most prized wulfenite specimens in the world since the 1880s."
      - "Arizona had no official state mineral until 2017, despite over a century of mining history."

