intro_text: "Arizona's state reptile is the Arizona ridge-nosed rattlesnake, a small rattlesnake found only in a few mountain ranges in the state's far southeast, adopted in 1986. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Arizona?
    paragraphs:
      - "The Arizona ridge-nosed rattlesnake is Arizona's official state reptile, designated by the Arizona Legislature in 1986. Its scientific name is Crotalus willardi willardi."
      - "It is a small, secretive rattlesnake found in the pine and oak forests of a few isolated mountain ranges near the Arizona-Mexico border."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Arizona Ridge-nosed Rattlesnake
    paragraphs:
      - "This rattlesnake is small compared to most rattlesnakes, usually growing to less than two feet long, with a reddish-brown to gray body marked by pale, narrow crossbands."
      - "It gets its name from a raised ridge of scales along the edge of its snout, which is unique among Arizona's rattlesnakes."
      - "It is shy and rarely seen, spending much of its time hidden under logs, rocks, and leaf litter in cool, wooded mountain canyons."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Arizona Legislature designated the Arizona ridge-nosed rattlesnake the official state reptile in 1986, giving Arizona its first official reptile symbol."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Arizona Chose the Ridge-nosed Rattlesnake
    paragraphs:
      - "The ridge-nosed rattlesnake lives in only a small number of mountain ranges within Arizona and nowhere else in the United States, making it a distinctive native species for the state to recognize."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Ridge-nosed Rattlesnake
    paragraphs:
      - "In Arizona, the ridge-nosed rattlesnake is limited to a handful of forested mountain ranges in the state's far southeast, including the Huachuca and Santa Rita Mountains near the Mexican border."
    sites:
      - name: Huachuca Mountains
        city: Sierra Vista
        lat: 31.42
        lng: -110.29
        note: "Core Arizona range of this rattlesnake"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Arizona Ridge-nosed Rattlesnake Facts
    facts:
      - "Adopted in 1986 by the Arizona Legislature."
      - "Scientific name is Crotalus willardi willardi."
      - "Named for the raised ridge of scales along its snout."
      - "Usually grows to less than two feet long, small for a rattlesnake."
      - "Found only in a few mountain ranges in far southeastern Arizona."

