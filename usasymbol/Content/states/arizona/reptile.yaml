faq:
  - question: What is Arizona's state reptile?
    answer: "Arizona's state reptile is the Arizona ridge-nosed rattlesnake, adopted by the Arizona Legislature in 1986."
  - question: When did Arizona adopt the ridge-nosed rattlesnake?
    answer: "The Arizona Legislature designated the Arizona ridge-nosed rattlesnake the official state reptile in 1986."
  - question: Why did Arizona choose the ridge-nosed rattlesnake?
    answer: "It lives in only a small number of mountain ranges within Arizona and nowhere else in the country, making it a distinctive species tied to the state."
  - question: Is the Arizona ridge-nosed rattlesnake a turtle, snake, lizard, or alligator?
    answer: "It is a snake, specifically a small rattlesnake subspecies found in Arizona's mountains."

