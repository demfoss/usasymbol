seo_title: "Arizona State Colors | Blue Old Gold"
seo_description: "Arizona state colors are Blue and Old Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of Arizona are **Blue** and **Old Gold**, formally designated by the Arizona Legislature in 1915 under Laws 1915, Chapter 30. Adopted two years before the 1917 Arizona flag, blue and old gold appear on [the Arizona state flag](/states/arizona/flag/arizona-state-flag) — blue representing the Colorado River and lower flag half, old gold the copper star's sunburst rays. The color cards below give practical HEX, RGB, CMYK, and Pantone references for Arizona blue and old gold."

