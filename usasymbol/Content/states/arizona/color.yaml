faq:
  - question: "What are the official colors of Arizona?"
    answer: "The official state colors of Arizona are Blue and Old Gold, formally designated by the Arizona Legislature in 1915 under Laws 1915, Chapter 30."
  - question: "What is the HEX code for Arizona Blue?"
    answer: "The standard HEX code for Arizona's official blue is #003087, corresponding to Pantone PMS 281, matching the blue of the United States flag."
  - question: "What is the HEX code for Arizona Old Gold?"
    answer: "The standard HEX code for Arizona's official old gold is #A28130, corresponding to Pantone PMS 4525, drawn from Arizona's copper and gold mining heritage."
  - question: "When were Arizona's state colors officially adopted?"
    answer: "Arizona's state colors were officially adopted in 1915 under Laws 1915, Chapter 30, three years after Arizona achieved statehood in 1912."
  - question: "Why did Arizona choose blue and old gold?"
    answer: "Blue was chosen to match the blue of the United States flag, reflecting Arizona's national loyalty, while old gold represents the copper and gold mining industry that defined Arizona's territorial economy and drove its path to statehood."

