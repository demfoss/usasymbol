sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Arizona is one of the few states that formally designated its state colors by legislative act. The Arizona Legislature adopted blue and old gold as the official state colors in 1915 under Laws 1915, Chapter 30, just three years after Arizona achieved statehood on February 14, 1912. This early codification reflects the importance placed on establishing distinct state symbols during the formative years following statehood and aligns with [the Arizona state flag](/states/arizona/flag/arizona-state-flag)."
      - "The selection of these two specific colors was deliberate and grounded in both national loyalty and regional economic identity. Blue was chosen to align directly with the blue of the United States flag, affirming Arizona's place within the Union following decades as a territory. Old gold, rather than a brighter or more saturated yellow, was selected to represent the muted, earthy tones of the mineral wealth that had attracted settlers, prospectors, and industry to the Arizona Territory since the mid-19th century."
    subsections:
      - subtitle: "Laws 1915, Chapter 30"
        text: "The 1915 legislative act establishing Arizona's state colors predates the formal adoption of the Arizona state flag, which was adopted on February 17, 1917. The early codification of blue and old gold provided a color foundation that would later directly influence the flag's design, where the lower half features a blue field matching the US flag and the central copper star references the gold and copper tones of the state's mining identity."
      - subtitle: "Arizona Statehood Context"
        text: "Arizona became the 48th and last of the contiguous states to join the Union on February 14, 1912, earning the nickname 'The Valentine State' for its admission date. The rapid legislative action in 1915 to codify state symbols including the state colors reflects the young state government's effort to establish a formal identity. The choice of blue and old gold mirrored the color palettes already in use by Arizona territorial institutions and the University of Arizona, which had adopted navy and cardinal in 1893 but whose broader state branding aligned with the 1915 legislative colors."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "The blue and old gold combination represents two foundational pillars of Arizona's identity: national unity and economic heritage. Blue, matching the precise shade of the US flag, was a common color choice among states admitted in the post-Civil War era to signal loyalty to the federal government. Old gold carries a more locally specific meaning, evoking the copper and gold ore that made Arizona economically viable as a territory and drove immigration, infrastructure development, and eventual statehood campaigns, a message also embedded in [Arizona's motto, Ditat Deus](/states/arizona/motto/ditat-deus)."
    subsections:
      - subtitle: "Blue in Arizona History"
        text: "The use of US-flag blue by Arizona placed the state within a tradition of patriotic state symbolism common in the late 19th and early 20th centuries. Arizona's blue appears prominently on the lower half of the state flag, where it occupies the same position as the blue canton of the Stars and Stripes. This visual continuity between state and national flags was intentional, reinforcing Arizona's identity as a loyal and proud member of the Union after 49 years as a territory from 1863 to 1912."
      - subtitle: "Old Gold in Arizona History"
        text: "Old gold is a historically specific shade, warmer and more subdued than bright yellow gold, that in Arizona's context directly references the copper and gold mining operations that shaped the entire territorial period. Arizona was the leading copper-producing state in the nation for much of the 20th century, and the copper star at the center of the state flag reinforces this same symbolism. The muted character of old gold distinguishes it from pure yellow and evokes the patina of metal ore, the desert landscape's ochre tones, and the warm light of the Sonoran Desert sun."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "The blue and old gold colors appear most prominently on the Arizona state flag, adopted in 1917, which features thirteen alternating red and gold rays on the upper half, a blue field on the lower half, and a large copper star at the center. The blue of the flag's lower field directly corresponds to the official state color, while the copper star and gold rays reference the old gold and copper tones of the state's mining heritage. The Arizona state seal, adopted at statehood in 1912, incorporates these same colors alongside imagery of mountains, a rising sun, irrigated fields, and a miner — further reinforcing the blue-and-gold identity. State government agencies, the Arizona Department of Transportation, and state university system branding programs consistently apply the 1915 color designations in official communications and signage, often together with [the Grand Canyon State nickname](/states/arizona/nickname/the-grand-canyon-state)."
      - "From a national geography perspective, Arizona's visual brand is frequently compared within [U.S. states by land area](/rankings/geography/states-by-land-area)."

