# verification: designation, species and 1986 adoption confirmed. The scientific name is changed from Oncorhynchus gilae apache to Oncorhynchus apache, the name used by the state wildlife agency, the state library and federal wildlife biologists. State law still uses the older name "Arizona trout, or Salmo apache." Exact code section not confirmed in an official source.
