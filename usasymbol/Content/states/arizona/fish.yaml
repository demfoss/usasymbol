intro_text: Arizona's state fish is the Apache trout, a golden-yellow trout found only in the White Mountains of eastern Arizona, adopted in 1986. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Arizona?
  paragraphs:
  - The Apache trout became Arizona's official state fish in 1986, when the Arizona Legislature named it. Its scientific name is Oncorhynchus apache.
  - State law uses an older name for it, the Arizona trout. It is one of only two trout species native to Arizona. The other is the Gila trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Apache Trout
  paragraphs:
  - The Apache trout has an olive-yellow body and a yellow or golden belly. Small black spots are spread evenly over its body and fins.
  - The tips of its head and fins are white or orange. A black spot sits in front of and behind each pupil, so it looks like a dark band runs through the eye.
  - Most wild Apache trout are less than nine inches long because they live in small streams. In hatcheries they can grow to more than 20 inches.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Arizona Legislature made the Apache trout the state fish in 1986. It was listed as an endangered species at the time.
  - The trout's recovery had started earlier. In 1955, the White Mountain Apache Tribe closed fishing in reservation waters where the last native Apache trout lived.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Arizona Chose the Apache Trout
  paragraphs:
  - Official sources name the fish without giving a detailed reason. The Apache trout is native only to Arizona, and it was close to dying out when it became the state fish.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Apache Trout
  paragraphs:
  - Apache trout live in cold-water streams and lakes in the White Mountains of eastern Arizona.
  - They are found on national forest land and on the White Mountain Apache Tribe's reservation. Wild Apache trout live nowhere else in the world.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Apache Trout Facts
  facts:
  - Adopted in 1986 by the Arizona Legislature.
  - Scientific name is Oncorhynchus apache.
  - The heaviest Apache trout ever reported weighed 5 pounds, 4 ounces.
  - It was one of the first species listed as endangered by the federal government, in 1969.
  - In 2024, it became the first sport fish and the first trout removed from the endangered list because it recovered.
faq:
- question: What is Arizona's state fish?
  answer: Arizona's state fish is the Apache trout. It is a golden-yellow trout with black spots that lives in the White Mountains.
- question: When did Arizona adopt the Apache trout?
  answer: The Arizona Legislature made the Apache trout the official state fish in 1986.
- question: Why did Arizona choose the Apache trout?
  answer: Official sources do not give a detailed reason. The fish is native only to Arizona, and it was endangered when it became the state fish.
- question: Is the Apache trout still endangered?
  answer: No. After more than 50 years of work by the White Mountain Apache Tribe, the state and other groups, the Apache trout was removed from the endangered species list in 2024.
- question: How can you recognize an Apache trout?
  answer: Look for an olive-yellow body, a golden belly and evenly spaced black spots. It also has white or orange fin tips and a dark band through the eye.
