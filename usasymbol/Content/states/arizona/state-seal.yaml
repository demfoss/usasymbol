meaning: "The Great Seal of Arizona was designed at the state's Constitutional Convention in 1910 and adopted on February 14, 1912, the day Arizona became the 48th state. The central image is a landscape that reads as a working inventory of Arizona's economy at statehood: a miner with a pick and shovel, a rancher with cattle, irrigated farmland fed by a reservoir, and the sun rising over mountain peaks. The Latin motto *Ditat Deus* — \"God enriches\" — ties the entire image to a theology of natural abundance."
