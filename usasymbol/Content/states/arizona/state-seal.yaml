intro_text: 'Arizona adopted its state seal on February 14, 1912 — the same day it became the 48th state — encoding its three economic pillars directly into the design: copper mining, cattle ranching, and irrigation agriculture, under the motto *Ditat Deus*, "God enriches." This profile appears in the [list of U.S. state seals](/symbols/state-seals).'
