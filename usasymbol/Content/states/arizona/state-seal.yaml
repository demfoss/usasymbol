timeline:
- year: '1863'
  description: Arizona Territory is created by Congress on February 24, carved out of the western portion of New Mexico Territory.
- year: '1864'
  description: Arizona Territory adopts the motto Ditat Deus ("God enriches"), which will be carried into the state seal 48 years later.
- year: '1910'
  description: Arizona's Constitutional Convention meets in Phoenix and designs the state seal, including the miner, rancher, reservoir, mountains, and motto.
- year: '1911'
  description: Roosevelt Dam on the Salt River — the world's largest masonry dam — is completed on March 18, transforming the Salt River Valley's agricultural capacity just before statehood.
- year: '1912'
  description: Arizona is admitted to the Union as the 48th state on February 14, 1912. The seal designed at the 1910 convention is formally adopted at statehood.

faq:
- question: What does the Arizona state seal show?
  answer: Arizona's state seal shows a miner with a pick and shovel and a rancher with cattle in the foreground, irrigated fields and a reservoir in the middle ground, and mountain peaks with a rising sun in the background. The Latin motto Ditat Deus ("God enriches") appears at the bottom.
- question: What does Ditat Deus mean on the Arizona state seal?
  answer: Ditat Deus is Latin for "God enriches." It is Arizona's official state motto and has appeared on Arizona's official emblems since 1864, when it was adopted as the motto of Arizona Territory. The phrase attributes the state's natural wealth — copper, fertile soil, open rangeland — to divine provision through the land.
- question: When was the Arizona state seal adopted?
  answer: The Arizona state seal was adopted on February 14, 1912, the day Arizona was admitted to the Union as the 48th state. The design was created two years earlier at the Arizona Constitutional Convention in Phoenix in 1910.
- question: Why is a miner on the Arizona state seal?
  answer: The miner represents Arizona's copper mining industry, which was already the most important part of the territorial economy by 1912. Arizona became the leading copper-producing state in the U.S., and mines at Bisbee, Globe, and Jerome were among the world's most productive when the seal was designed.
- question: What does the reservoir on the Arizona state seal represent?
  answer: The reservoir represents irrigation agriculture, the third pillar of Arizona's territorial economy alongside mining and ranching. Roosevelt Dam, completed in 1911 just before statehood, was the largest masonry dam in the world and made large-scale farming possible in the desert Salt River Valley.
- question: Has the Arizona state seal changed since 1912?
  answer: The Great Seal of Arizona has remained essentially unchanged in its composition since it was adopted at statehood in 1912. Arizona Revised Statutes § 41-851 governs the current authorized design.
- question: What do the mountains and sun mean on the Arizona state seal?
  answer: The mountains in the background reflect Arizona's characteristic high terrain and its copper-rich mountain ranges. The rising sun above them reinforces the motto Ditat Deus — the idea that Arizona's wealth is a natural gift — and also marks Arizona's historical position as the last of the 48 contiguous states to enter the Union.

