etymology_groups:
  - type: Patronymic Names
    icon: fa-person
    description: "Garcia, Martinez, Johnson, and Hernandez are all 'son of' names — Spanish patronymics from Sonoran mission-era settlement alongside English ones carried by Mormon and Anglo homesteaders."
    examples:
      - Garcia (young man)
      - Martinez (son of Martin)
      - Johnson (son of John)
      - Hernandez (son of Hernando)

  - type: Occupational Names
    icon: fa-hammer
    description: "Smith, Miller, and Taylor all derive from medieval trades — metalworking, milling grain, and cutting cloth — brought to Arizona by territorial-era miners and Salt River Project farmers."
    examples:
      - Smith (metalworker)
      - Miller (mill operator)
      - Taylor (cloth cutter)

  - type: Descriptive Names
    icon: fa-palette
    description: "Brown and White both describe physical appearance rather than lineage, and each entered Arizona with Anglo ranching families in Maricopa and Cochise counties."
    examples:
      - Brown (brown hair/complexion)
      - White (fair hair/complexion)

