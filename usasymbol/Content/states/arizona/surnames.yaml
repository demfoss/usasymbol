seo:
  title: "Most Common Arizona Surnames — Garcia Leads by 60%"
  description: "Garcia is the most common last name in Arizona, outranking Smith by 60% — the result of 250 years of Spanish settlement in the Santa Cruz Valley."

page:
  h1: "Most Common Last Names in Arizona"
  intro: "Garcia leads the most common last names in Arizona by a 60 percent margin — the Santa Cruz Valley had 250 years of Spanish settlement before American sovereignty. The Navajo Nation adds Begay, a surname absent from the other 49 states."
  heritage_title: "Tucson's 1775 Presidio and the Navajo Nation"
  heritage_body: "Tucson's Barrio Histórico traces Spanish-speaking settlement to 1775, when the presidio relocated from Tubac, placing Garcia at Arizona's top while the region was still Mexican territory. Mormon pioneers colonized the Little Colorado River valley (Snowflake, Navajo County) between 1876 and 1885, adding the English patronymics that fill Arizona's middle ranks. The Navajo Nation's Apache and Navajo counties produced Begay — a surname virtually absent from the other 49 states."
  fun_fact: "Begay — derived from the Navajo particle 'biyé' (his son) — is shared by more than 8,000 Arizona residents, a count that exceeds the combined Begay population of all other 49 states." # UNVERIFIED: 8,000 not backed by count data in this file

surnames:
  - rank: 1
    name: Garcia
    count: 77000
    ratio: 83
    origin: spanish
    type: Patronymic
    meaning: "Basque 'Gartzea' — possibly 'young man' — entered Castilian via Navarre in the 9th century and became Iberia's most widely recorded medieval patronymic. Jesuit missionaries and presidio soldiers carried Garcia north from Sonora into the Santa Cruz Valley by the 1690s; it anchored Tucson's Barrio Histórico and the Mexican-American labor communities of South Phoenix through the cotton and railroad migrations of the 1900s–1920s."

  - rank: 2
    name: Smith
    count: 48000
    ratio: 133
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Arizona Territory silver camps at Tombstone (Cochise County, 1879) and copper mines at Bisbee (1880s) planted Smith across southeastern Arizona; the name reached every county as Phoenix's postwar suburban expansion drew Midwestern families through the 1950s and 1960s."

  - rank: 3
    name: Martinez
    count: 46000
    ratio: 139
    origin: spanish
    type: Patronymic
    meaning: "Son of Martin, from Latin 'Martinus' (of Mars) — the feast of Saint Martin of Tours made the given name standard across Catholic Europe. Martinez families worked the copper smelters of Clifton and Morenci (Greenlee County) from the 1880s through the mid-20th century, forming the oldest continuous Mexican-American mining community in Arizona."

  - rank: 4
    name: Johnson
    count: 36000
    ratio: 178
    origin: english
    type: Patronymic
    meaning: "Hebrew 'Yohanan' (God is gracious) traveled through Greek and Latin before John became the dominant given name in medieval English parishes — and Johnson its expected patronymic. Midwestern homesteaders arriving on Salt River Project land grants in Maricopa County after Roosevelt Dam opened irrigation in 1911 brought Johnson in disproportionate numbers from Kansas."

  - rank: 5
    name: Williams
    count: 33000
    ratio: 194
    origin: english
    type: Patronymic
    meaning: "Norman 'Willahelm' — will plus helm — made William the dominant post-Conquest English given name, and Williams its patronymic heir. Williams families settled the ponderosa plateau of Yavapai and Coconino counties in the 1880s–1900s as the Atlantic and Pacific Railroad opened northern Arizona to Anglo ranching and timber operations."

  - rank: 6
    name: Hernandez
    count: 32000
    ratio: 200
    origin: spanish
    type: Patronymic
    meaning: "Germanic 'Friðunanð' (bold journey) filtered through Visigothic Spain as Fernando and Hernando before becoming a standard Castilian patronymic by the 16th century. Hernandez concentrations peak in Yuma County — where Mexican farmworker families arrived with the All-American Canal's agricultural expansion in the 1930s–1950s — making it the highest-density Hernandez county in Arizona."

  - rank: 7
    name: Brown
    count: 30000
    ratio: 213
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', brown hair or complexion. Brown families appear in Maricopa County's earliest tax rolls in the 1870s–1880s, tied to the Anglo ranching and freighting operations that preceded Phoenix's 1881 incorporation, and remain concentrated in the East Valley suburbs of Mesa and Gilbert."

  - rank: 8
    name: Jones
    count: 28000
    ratio: 228
    origin: english
    type: Patronymic
    meaning: "The defining Welsh surname — son of John via 'Ioan'. Mormon settlers from Welsh-origin Utah communities brought Jones to the Little Colorado River valley (Navajo and Apache counties) in the 1876–1885 colonization wave, giving northeastern Arizona a Jones concentration that still exceeds the national per-capita rate."

  - rank: 9
    name: Davis
    count: 26000
    ratio: 246
    origin: english
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dāwīḏ' (beloved). Davis families established citrus and alfalfa farms in the Salt River Project (Maricopa County) in the 1910s–1920s, drawn by the federal reclamation works that converted the Phoenix basin from desert scrub into irrigated farmland."

  - rank: 10
    name: Miller
    count: 23000
    ratio: 278
    origin: english
    type: Occupational
    meaning: "From Middle English 'milnere', one who operates a grain mill. Miller families concentrated in Maricopa County's canal-fed farming towns — Chandler — in the 1910s–1930s, many of them arriving after relatives had already settled the Imperial Valley on the California side of the Colorado River."

  - rank: 11
    name: Wilson
    count: 21000
    ratio: 304
    origin: english
    type: Patronymic
    meaning: "Son of Will, a contraction of William. Wilson appears in territorial Arizona court records from Prescott (Yavapai County) in the 1860s–1870s, carried by Anglo miners and merchants who followed the Army's Fort Whipple garrison into what became the territorial capital in 1863."

  - rank: 12
    name: Lopez
    count: 20500
    ratio: 312
    origin: spanish
    type: Patronymic
    meaning: "Latin 'Lupus' (wolf) gave Iberia the given name Lope and its patronymic Lopez across the medieval kingdoms of Castile and León. Lopez families settled Pinal County's Gila River valley agricultural labor camps in the 1920s–1940s as cotton farming expanded east of Phoenix, giving Pinal County one of the highest Lopez densities outside Tucson's Pima County."

  - rank: 13
    name: Moore
    count: 20000
    ratio: 320
    origin: english
    type: Habitational
    meaning: "From Old English 'mōr', someone near open uncultivated moorland. Moore families arrived with the Southern Pacific Railroad's construction through Pima and Pinal counties in the 1870s–1880s and settled along the Tucson-to-Yuma corridor in the years before statehood in 1912."

  - rank: 14
    name: Anderson
    count: 19000
    ratio: 337
    origin: scottish
    type: Patronymic
    meaning: "Son of Anders (Andrew), from Greek 'Andreas' (manly). Scandinavian-origin Anderson families from Utah colonized the White Mountain plateau (Snowflake, Taylor, Show Low in Navajo and Apache counties) in the 1880s–1890s, giving northeastern Arizona a disproportionate Anderson presence relative to the state's population center."

  - rank: 15
    name: Taylor
    count: 18500
    ratio: 346
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', one who cuts cloth. Taylor, Arizona (Navajo County) was co-founded by LDS settlers in 1878 and named to honor Church President John Taylor — the name's concentration across the White Mountain corridor directly reflects that original Mormon colonization."

  - rank: 16
    name: Thomas
    count: 17000
    ratio: 376
    origin: english
    type: Patronymic
    meaning: "Aramaic 'Tʼōmā' (twin) — the apostle's name spread across medieval Christendom. Thomas families arrived with Arizona's defense industry buildup of the 1940s–1950s — Goodyear Aircraft (Litchfield Park) drew Anglo workers from the Midwest who concentrated the name in Maricopa County."

  - rank: 17
    name: Robinson
    count: 15500
    ratio: 412
    origin: english
    type: Patronymic
    meaning: "Son of Robin, a medieval diminutive of Robert (Germanic 'Hrōdbert', fame-bright). Robinson families appear in Tucson's African American community records from the 1880s–1920s, concentrated in the south-side railroad district that grew around the Southern Pacific shops and the Dunbar School neighborhood."

  - rank: 18
    name: White
    count: 15000
    ratio: 426
    origin: english
    type: Descriptive
    meaning: "From Old English 'hwīt', white hair or pale complexion. White families settled the Sulphur Springs Valley (Cochise County) in the 1880s–1890s as cattle ranching replaced Apache conflicts in southeastern Arizona, and the name remains overrepresented in the ranching communities east of Bisbee relative to Phoenix's metro core."

  - rank: 19
    name: Thompson
    count: 14500
    ratio: 441
    origin: english
    type: Patronymic
    meaning: "Son of Thom, with the 'p' inserted as a 15th-century scribal spelling convention. Thompson families homesteaded the San Pedro River valley (Graham and Cochise counties) in the late 1880s–1890s after the Army's pacification of the Chiricahua Apache in 1886 opened southeastern Arizona to Anglo ranching."

  - rank: 20
    name: Jackson
    count: 14000
    ratio: 457
    origin: english
    type: Patronymic
    meaning: "Medieval 'Jack' — a diminutive of John so common it briefly served as a generic English word for any common man — produced Jackson as a patronymic throughout the British Isles. Jackson families arrived with Phoenix's wartime and postwar expansion in the 1940s–1950s, drawn by Luke Field and the aviation manufacturing corridor, and concentrated in the African American community of the South Mountain district."

