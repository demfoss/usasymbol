intro_text: "Arizona's state gemstone is turquoise, adopted by the Arizona Legislature in 1974 to recognize a blue-green stone mined across the state and used in Southwest jewelry for centuries. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Arizona State Gemstone
    paragraphs:
      - "Turquoise is Arizona's official state gemstone, designated by the Arizona Legislature in 1974. It is an opaque blue to blue-green mineral that forms near the surface in arid regions, and Arizona is one of the most productive turquoise-mining areas in the world."
      - "Arizona fit this symbol closely because the stone has been mined and worked in the state for centuries, first by Native peoples of the Southwest and later by commercial mining operations that made Arizona turquoise famous nationally."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Turquoise?"
    paragraphs:
      - "Turquoise is an opaque mineral ranging from sky blue to blue-green, sometimes marked with veins of darker matrix rock running through it. It has a smooth, slightly waxy surface when polished, and the purest blue material, without matrix, is generally the most prized."
      - "Turquoise forms as a secondary mineral when weathering alters copper-bearing rock in dry climates, which is why deposits are common in the arid Southwest but rare in wetter regions. Arizona's copper mining districts, where copper ore sits close to the surface, created ideal conditions for turquoise to form nearby."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Arizona Chose Turquoise as Its State Gemstone"
    paragraphs:
      - "Native peoples of the Southwest, including the Ancestral Puebloan and later Navajo and Hopi communities, have used Arizona turquoise for beads, carvings, and inlay for close to two thousand years. That long tradition gave the stone deep cultural ties to the region well before Arizona became a state."
      - "By the 20th century, mines like the Sleeping Beauty Mine near Globe had made Arizona turquoise, especially its pure sky-blue material without matrix, known worldwide. That combination of ancient craft tradition and modern commercial mining made turquoise a clear choice for state gemstone in 1974."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Turquoise Became Arizona's State Gemstone"
    paragraphs:
      - "The Arizona Legislature designated turquoise the official state gemstone in 1974, formalizing a status the stone had held in the region's culture and economy for generations."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Turquoise Is Found in Arizona"
    paragraphs:
      - "The Sleeping Beauty Mine, near Globe in Gila County, produced some of Arizona's most recognizable turquoise, prized for its pure sky-blue color with little to no matrix, until mining operations there ended in 2012."
    sites:
      - name: Sleeping Beauty Mine
        city: Globe
        lat: 33.4051
        lng: -110.8768
        note: "Noted source of pure blue turquoise, closed 2012"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Turquoise Facts"
    facts:
      - "Adopted as Arizona's state gemstone in 1974."
      - "Native peoples of the Southwest have worked Arizona turquoise for close to two thousand years."
      - "The Sleeping Beauty Mine near Globe, closed since 2012, produced turquoise prized for its pure blue color without matrix."
      - "Arizona is one of the largest turquoise-producing states in the country, alongside Nevada and New Mexico."

