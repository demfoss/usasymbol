faq:
  - question: What is Arizona's state gemstone?
    answer: "Arizona's state gemstone is turquoise, an opaque blue to blue-green mineral adopted by the Arizona Legislature in 1974."
  - question: When did Arizona adopt turquoise as its state gemstone?
    answer: "The Arizona Legislature designated turquoise the official state gemstone in 1974."
  - question: Why did Arizona choose turquoise?
    answer: "Turquoise has been mined and worked in Arizona for centuries, first by Native Southwest peoples and later by commercial mines like the Sleeping Beauty Mine that made Arizona turquoise famous nationally."
  - question: Is Arizona turquoise valuable?
    answer: "High-grade Arizona turquoise, especially pure blue material without matrix from mines like Sleeping Beauty, is considered among the most valuable turquoise in the world."

