seo_title: 'Wyoming State Flag: History, Design, and What the Bison Means'
seo_description: Wyoming's state flag shows a white bison with the state seal on its side, centered on a blue field with a red border. Designed by Verna Keays in 1916, adopted January 31, 1917 — and quietly changed after passage without a single legislative vote.
intro_text: Wyoming's state flag is the only one in the country that places a state seal on an animal. A white bison stands at the center of a blue field bordered in red, carrying the Great Seal of Wyoming on its side. Verna Keays, a 23-year-old Art Institute of Chicago graduate, won the 1916 DAR design contest with that arrangement. The legislature adopted it on January 31, 1917. Then a University of Wyoming professor suggested changing the bison's direction — and the manufacturing line just did it, without a vote.
