faq:
- question: What does the Wyoming state flag look like?
  answer: A white silhouette of an American bison centered on a blue field, with a red border framing the entire flag. The Great Seal of Wyoming appears on the bison's body. The bison faces the hoist (toward the pole).
- question: What does the Wyoming state flag mean?
  answer: The bison represents Wyoming's wildlife heritage and references the open-range branding tradition — the seal is placed on the animal as cattle were branded on the range. The seal carries the 'Equal Rights' motto, a reference to Wyoming's 1869 women's suffrage law. Blue represents sky and fidelity, white stands for purity, and the red border honors both Native American peoples and pioneer settlers.
- question: Who designed the Wyoming state flag?
  answer: Verna Keays of Buffalo, Wyoming. She won the 1916 Daughters of the American Revolution design contest at age 23, shortly after graduating from the Art Institute of Chicago. The prize was $20.
- question: When was the Wyoming state flag adopted?
  answer: January 31, 1917. Governor Robert D. Carey signed the flag bill into law. The design has not been formally amended since.
- question: Why does the Wyoming flag bison face left (toward the pole)?
  answer: It wasn't in the original design. Verna Keays's winning entry showed the bison facing right (toward the fly). After adoption, University of Wyoming professor Grace Raymond Hebard recommended reversing the direction for better visual balance. The manufacturing instructions were changed, but the legislature never formally voted on the change. The current orientation became standard without ever being written into law.
- question: What is unique about the Wyoming state flag?
  answer: Wyoming's flag is the only U.S. state flag that places a state seal on an animal rather than a shield or plain background. The Great Seal sits on the bison's body, referencing the livestock branding tradition of the open range.
- question: What do the colors on the Wyoming state flag mean?
  answer: 'Blue represents the sky and mountains, along with fidelity and justice. White stands for purity. The red border carries two meanings: it honors Native American peoples of Wyoming and represents the blood of pioneers who settled the territory.'
