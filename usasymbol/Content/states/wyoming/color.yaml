seo_title: "Wyoming State Colors | Brown Gold"
seo_description: "Wyoming state colors are Brown and Gold, a palette tied to the state flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Wyoming are **Brown** and **Gold**, derived from the University of Wyoming — the state's only four-year public university — and prominently featured on [the Wyoming state flag](/states/wyoming/flag/wyoming-state-flag). Wyoming has not passed a separate state-colors law, but brown and gold are used statewide through the University of Wyoming and state branding. The specifications below list HEX, RGB, CMYK, and Pantone values for Wyoming color matching."

official_colors: "Brown and Gold"
official_since: "Semi-official (no formal legislative designation; University of Wyoming tradition used statewide)"
primary_use: "University of Wyoming athletics and branding, Wyoming state tourism identity, commercial applications statewide, civic celebrations"
known_for: "Wyoming's brown and gold is one of the most distinctive color combinations in American collegiate athletics — no other state shares this palette as its leading institutional palette; brown reflects Wyoming's high plains and ranching heritage, while gold reflects the state's mineral wealth and the golden light of its famous big sky country"

color_data:
  - name: "Brown"
    hex: "#492F24"
    rgb: "73, 47, 36"
    cmyk: "0, 36, 51, 71"
    pantone: "PMS 4625"
    symbolism: "Represents the earth tones of Wyoming's high plains and semi-arid rangeland — the brown grasses of the Bighorn Basin, the clay soils of the Powder River Country, the rust-brown hide of the American bison that once grazed Wyoming's ranges in herds numbering in the tens of millions and remain a defining symbol of the state's natural heritage through the Yellowstone herd; brown also evokes the log and timber architecture of Wyoming's frontier settlements, the brown trout of the Snake and Green Rivers that anchor Wyoming's world-class fly fishing economy, and the earth palette of the badlands and painted hills formations that mark Wyoming's landscape"
  - name: "Gold"
    hex: "#FFC425"
    rgb: "255, 196, 37"
    cmyk: "0, 23, 86, 0"
    pantone: "PMS 7549"
    symbolism: "Represents the mineral wealth encoded in Wyoming's notable geology — the state is the nation's largest coal producer, a top natural gas producer, and home to significant uranium, trona, and bentonite deposits — and the golden light that bathes Wyoming's high-altitude landscape, where the combination of elevation and clear, dry air creates some of the most luminous natural light in North America; gold also reflects the harvest of Wyoming's agricultural economy, including the hay and grain fields of the river valleys, and the warm amber tones of Wyoming's iconic autumn aspen groves in the mountain ranges"

sections:
  - id: "official-designation"
    title: "Why Wyoming Has No Official State Colors"
    style: "default"
    paragraphs:
      - "Wyoming has not formally designated official state colors by legislative statute, making brown and gold a traditional rather than legally codified color tradition. Wyoming's Legislature has designated a range of official state symbols — including the [western meadowlark](/states/wyoming/bird/western-meadowlark), [Indian paintbrush](/states/wyoming/flower/indian-paintbrush), plains cottonwood (state tree), and cutthroat trout (state fish) — but has not enacted a state colors statute. The brown-and-gold association derives entirely from the University of Wyoming, Wyoming's only four-year public university — a distinction that concentrates the state's entire higher education color tradition in a single institution."
      - "That monopoly is what makes brown and gold genuinely universal here. In states like California or Texas, competing public universities produce competing color identities that dilute any single institution's dominance. In Wyoming, every citizen who attends a four-year public university attends UW — creating a generational accumulation of loyalty across all 23 counties and a population of roughly 580,000 that no statute could manufacture. Brown and gold don't need a law. They have something more durable: the Equality State's only public university, wearing the same colors for over a century."
    subsections:
      - subtitle: "University of Wyoming: The Only Public University"
        text: "The University of Wyoming, founded in Laramie in 1886 — three years before Wyoming achieved statehood in 1890 — adopted brown and gold as its official colors in the institution's early years. The combination was unusual in American collegiate athletics, where blues, reds, and greens dominate, and that distinctiveness has compounded over time: Wyoming's Cowboys are never visually confused with other programs in national broadcasts. The university has maintained brown and gold consistently for over a century, a record of stability that few institutions of any size can match."
      - subtitle: "Wyoming Cowboys in the Mountain West"
        text: "The University of Wyoming Cowboys wear brown and gold across all Mountain West Conference sports, with the highest visibility in football at War Memorial Stadium in Laramie — situated at 7,220 feet, one of the highest-elevation Division I football venues in the United States. The unusual color combination ensures that Wyoming is immediately identifiable in any national broadcast context, giving the Cowboy State a visual presence that far exceeds what its small population might otherwise warrant."

  - id: "symbolism"
    title: "Brown and Gold: What Wyoming's Colors Mean"
    style: "highlight"
    paragraphs:
      - "Brown and gold in Wyoming are grounded in the state's physical landscape more directly than most state color pairings. Wyoming's terrain — the high plains of the east, the mountain ranges of the center and west, the badlands of the northeast, the geothermal landscape of Yellowstone — presents a palette dominated by earth tones: the brown of grass and soil, the gold of mineral deposits and autumn aspens, the sienna and ochre of canyon walls. The University of Wyoming's adoption of brown and gold was not an arbitrary institutional decision; it was a reflection of the natural environment of Laramie, at 7,165 feet on the high plains of the Laramie Range, where earth-toned grassland stretches to every horizon — the same iconography carried on [Wyoming's state flag](/states/wyoming/flag/wyoming-state-flag)."
    subsections:
      - subtitle: "Brown: The Earth of Wyoming's High Plains"
        text: "Wyoming's landscape is defined by elevation and aridity — the state's average elevation of 6,700 feet makes it the second-highest state in the nation, and its semi-arid climate creates the sparse, earth-toned vegetation that characterizes the high plains and intermontane basins. The brown grasses of the Great Plains transition, the tan and sienna soils of the Wind River Basin, and the rust-brown rocky outcroppings of the Bighorn Mountains create a landscape where brown is the dominant natural color for much of the year. Wyoming's ranching heritage — cattle and sheep operations covering millions of acres — further embeds brown in the state's economy and culture. The American bison, whose brown hide makes it one of the most visually iconic animals of Wyoming's natural heritage and whose presence in Yellowstone's northern herd represents the largest free-roaming bison population in the United States, adds a powerful symbolic dimension that no legislature needed to write down."
      - subtitle: "Gold: Minerals, Aspens, and Wyoming's Big Sky"
        text: "Wyoming's gold reflects the mineral wealth that underlies the state's economy. Wyoming is the nation's largest coal producer, supplying approximately 40 percent of U.S. coal production from the Powder River Basin — the world's largest coal-producing region — and ranks among the nation's top producers of natural gas, uranium, trona, and bentonite. The gold of Wyoming's energy economy is literal as well as symbolic: the state's mineral severance taxes and federal mineral royalties fund state government without a personal income tax or corporate income tax, making Wyoming one of only nine states with no income tax. Gold also appears in Wyoming's autumn landscape, when the high-altitude aspen groves of the Wind River Range, the Tetons, and the Bighorns turn brilliant gold — one of the most spectacular fall foliage displays in the American West."

  - id: "state-emblems"
    title: "How Brown and Gold Became Wyoming's Identity"
    style: "default"
    paragraphs:
      - "Brown and gold appear throughout Wyoming's public landscape primarily through the University of Wyoming's brand identity, which functions as the state's de facto official color program given UW's singular position in Wyoming's higher education landscape. The Cowboys' brown and gold uniforms, logos, and institutional branding appear in every Wyoming community — on high school banners, business storefronts, and restaurant menus on game days. Wyoming's tourism marketing, led by the [Wyoming Office of Tourism](https://travelwyoming.com), uses the warm earth tones of brown and gold in campaigns built around Yellowstone, Grand Teton, and the Wind River Range — landscapes whose natural palette reinforces the color pairing without any artifice. The combination's rarity in national collegiate athletics gives Wyoming disproportionate visual recognition in broadcast markets, effectively serving as ongoing state advertising well beyond what a population of 580,000 would otherwise generate — a visibility Wyoming shares through symbols like [the American bison](/states/wyoming/mammal/american-bison)."

