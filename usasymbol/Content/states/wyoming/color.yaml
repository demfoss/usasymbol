timeline:
  - year: "1869"
    description: "Wyoming Territory becomes the first government in U.S. history to grant women the right to vote, on December 10 — establishing Wyoming's tradition of forward-thinking governance that will earn it the nickname the Equality State"
  - year: "1872"
    description: "Yellowstone established as the world's first national park on March 1, anchoring Wyoming's identity as a state of large natural heritage — whose earth-toned landscapes of geothermal basins, high plains, and mountain ranges reinforce brown and gold as the natural colors of Wyoming"
  - year: "1886"
    description: "University of Wyoming founded in Laramie, three years before statehood; the university adopts brown and gold as its official colors, creating the pairing that will become Wyoming's most widely recognized palette"
  - year: "1890"
    description: "Wyoming admitted to the Union on July 10 as the 44th state; the University of Wyoming's brown and gold, already four years established, begins its transition from institutional color to de facto state identity"
  - year: "2023"
    description: "Wyoming's Powder River Basin continues to produce approximately 40 percent of U.S. coal, and Wyoming operates without a personal income tax — funded by mineral severance taxes that make the gold of Wyoming's mineral wealth the literal foundation of the state's fiscal model"

expert_quote:
  text: "Wyoming's brown and gold is one of the most genuinely distinctive color combinations in American state identity — no other state shares it, no other program quite replicates it, and it reflects the earth and mineral wealth of Wyoming's landscape more accurately than most state colors reflect their states. In Wyoming, you don't need a law to know what the state's colors are."
  source: "University of Wyoming Athletics Department, Laramie, Brand Identity Documentation"

faq:
  - question: "What are the state colors of Wyoming?"
    answer: "Wyoming's traditional state colors are Brown and Gold, derived from the University of Wyoming Cowboys — the state's only four-year public university. They have not been formally designated by statute, but the University of Wyoming has made them familiar across all 23 counties of the Cowboy State."
  - question: "What is the HEX code for Wyoming Brown?"
    answer: "The official HEX code for Wyoming Brown is #492F24, corresponding to Pantone PMS 4625 as standardized by the University of Wyoming's official brand guidelines."
  - question: "What is the HEX code for Wyoming Gold?"
    answer: "The official HEX code for Wyoming Gold is #FFC425, corresponding to Pantone PMS 7549 as standardized by the University of Wyoming's official brand guidelines."
  - question: "Why is Wyoming associated with brown and gold?"
    answer: "Wyoming's brown and gold association comes entirely from the University of Wyoming Cowboys, founded in 1886 and the state's only four-year public university. Because all Wyoming citizens who attend a four-year public university attend UW, the brown-and-gold association has built up across generations statewide. Brown reflects Wyoming's earth-toned high plains landscape and ranching heritage; gold reflects the mineral wealth of Wyoming's energy economy."
  - question: "Is Wyoming's brown and gold unique among states?"
    answer: "Yes. Wyoming's brown and gold is one of the most distinctive color combinations in American collegiate athletics — no other state has this pairing as its dominant institutional color tradition. The uniqueness of the combination gives Wyoming immediate visual recognition in national sports media that far exceeds what the state's small population of approximately 580,000 might otherwise produce."
  - question: "Are brown and gold Wyoming's official state colors?"
    answer: "Brown and gold are traditional rather than officially designated state colors in Wyoming. The Wyoming Legislature has not formally codified state colors by statute, but the University of Wyoming's monopoly on public four-year higher education in the state ensures that brown and gold are truly universal across Wyoming's civic life."

