sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Wyoming?
    paragraphs:
      - "The blotched tiger salamander is Wyoming's official state amphibian, designated by the Wyoming Legislature in 2019. Its scientific name is Ambystoma mavortium melanostictum."
      - "It is one of the largest land-dwelling salamanders in North America and is found in ponds and grasslands across Wyoming."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Blotched Tiger Salamander
    paragraphs:
      - "The blotched tiger salamander has a stout body with dark olive or brown blotches over a lighter background, giving it an irregular, mottled pattern."
      - "It can grow up to about 8 to 10 inches long, making it one of the largest salamanders found in Wyoming."
      - "It spends much of its adult life underground in burrows, only becoming active on the surface at night or during wet weather."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Wyoming Legislature designated the blotched tiger salamander the official state amphibian in 2019, recognizing a species found in nearly every county in the state."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Wyoming Chose the Blotched Tiger Salamander
    paragraphs:
      - "Official sources name the blotched tiger salamander as Wyoming's state amphibian because it is the state's largest and most widespread salamander, but they do not give a more detailed reason for the choice."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Blotched Tiger Salamander
    paragraphs:
      - "Blotched tiger salamanders live in ponds, wetlands, and burrows across Wyoming's plains and foothills, including areas around the Laramie Plains."
    sites:
