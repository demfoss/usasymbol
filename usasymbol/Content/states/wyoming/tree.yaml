type: State Tree
state: Wyoming
name: Plains Cottonwood
scientific_name: Populus deltoides
adopted_year: 1947
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-03-23"
seo_title: "Wyoming State Tree: Plains Cottonwood – Prairie Survivor"
seo_description: "Wyoming named the Plains Cottonwood as state tree in 1947. Learn why this riverside tree represents survival and water in Wyoming's high plains."

intro_text: "The Plains Cottonwood (*Populus deltoides*) is Wyoming's official state tree, designated January 31, 1947. In a state that is largely treeless — high plains, sagebrush basins, desert shrublands — the cottonwood is one of the only large deciduous trees at lower elevations, and it marks water the way a mile marker marks distance. Every cottonwood grove in Wyoming indicates a permanent water source. That connection between tree and water shaped where Wyoming's settlements, trails, and ranches formed, making the cottonwood less an ornamental symbol than a functional one."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Plains Cottonwood: Wyoming's River Tree"
    paragraphs:
      - "The Plains Cottonwood is a fast-growing deciduous hardwood that reaches 50 to 80 feet along Wyoming's rivers and streams, with some protected specimens near permanent water exceeding 100 feet. The trunk measures two to four feet in diameter at maturity. Young cottonwoods grow rapidly — sometimes five feet per year — which made them valuable to Wyoming pioneers who needed building materials and shade quickly, in a landscape where hauling timber from distant mountains was often impractical. The wood is soft and prone to warping, but when nothing else was available, cottonwood built cabins, barns, and corrals across the Wyoming Territory."
      - "Cottonwood grows exclusively near water in Wyoming's arid landscape. The species lines the North Platte, Green, Snake, Powder, Bighorn, and Yellowstone rivers along with countless smaller streams, creating green corridors through Wyoming's otherwise brown plains and sagebrush basins. Cottonwood groves are visible for miles across Wyoming's open country — a green smear on the horizon that tells anyone reading the landscape: water is here. The trees require permanent groundwater, making them reliable indicators that guided settlement patterns, emigrant routes, and livestock drives across the high plains."
      - "Most of Wyoming consists of high plains, sagebrush basins, and mountain ranges where conifers dominate above 7,000 feet. Cottonwood is one of the only large deciduous trees that thrives at Wyoming's lower elevations — and it does so across brutal temperature swings, surviving winter lows below -40°F and summer highs above 100°F. That combination of water-marking and climate tolerance made the cottonwood the obvious candidate for state tree in a landscape with few competitors."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Why It's Called Plains Cottonwood"
    paragraphs:
      - "*Populus deltoides* encodes the tree's look: *Populus* is Latin for poplar, and *deltoides* describes the distinctive delta-shaped, triangular leaves. The subspecies found in Wyoming is typically *monilifera*, the plains form common across the Great Plains and Rocky Mountain West. The tree belongs to the Salicaceae family — the willows. Early settlers used \"sweet cottonwood\" to distinguish it from the bitter or black cottonwood found in Wyoming's mountain zones."
      - "The common name comes from what happens each June. Female trees produce capsules that split open and release thousands of tiny seeds attached to white cottony fibers, designed to float on wind and water. The cotton accumulates in drifts along Wyoming streets and buildings, creating snowlike conditions during peak seed release. It's one of the most recognizable seasonal events in any Wyoming town — and one of the most complained-about. Male trees produce reddish catkins in spring but no cotton, which is why planting guides for Wyoming towns often specify male cottonwoods for urban settings."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Plains Cottonwood Became the Wyoming State Tree"
    paragraphs:
      - "Wyoming named the Plains Cottonwood as its official state tree on January 31, 1947, through House Bill No. 56, signed by Governor Lester C. Hunt. The bill passed with broad support from legislators across Wyoming's rural counties — representatives who understood what cottonwood meant to the ranchers and farmers who lived along Wyoming's rivers."
      - "Wyoming picked plains cottonwood because it represented survival in a landscape where survival was not given. The tree provided pioneers with lumber, shade, and water-finding in a region that offered none of those things readily. Oregon Trail travelers carved their names in cottonwood bark at Fort Laramie and other Wyoming landmarks; some of those carvings are still visible. The vivid autumn gold of cottonwood stands along river corridors became one of Wyoming's most recognized seasonal images, later reinforced by [Wyoming's state flag symbolism](/states/wyoming/flag/wyoming-state-flag)."
      - "The tree's long history in Wyoming predated the state itself. Native Americans peeled cottonwood bark to feed horses during winter, when grasses were buried under snow — the cambium layer contains nutrients and remains accessible even in severe cold. The inner bark served as emergency food for humans during harsh stretches. By 1947, cottonwood had been sustaining life in Wyoming for thousands of years. The designation acknowledged what Wyoming's residents already knew: the cottonwood wasn't ornamental. It was infrastructure."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Plains Cottonwood Facts"
    facts:
      - "Wyoming named Plains Cottonwood as state tree on January 31, 1947, through House Bill No. 56 signed by Governor Lester C. Hunt"
      - "Cottonwood is Wyoming's most abundant large deciduous tree, growing along virtually every permanent stream and river in the state"
      - "The tree can grow five feet per year when young, making it one of North America's fastest-growing native trees"
      - "Female cottonwoods produce millions of cottony seeds each June that can travel miles on wind, creating snowlike drifts in Wyoming towns"
      - "Cottonwood groves provide critical habitat for Wyoming wildlife, with over 100 bird species using riparian cottonwood forests"
      - "The trees can live 70 to 100 years in Wyoming's harsh climate, with some protected specimens exceeding 150 years"
      - "Native Americans peeled cottonwood bark to feed horses during winter, as the cambium layer contains nutrients and remains accessible under snow"
      - "Oregon Trail emigrants carved messages and names into cottonwood bark at Wyoming landmarks, with some historic carvings still visible today"

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Identify Plains Cottonwood"
    paragraphs:
      - "The bark is the clearest identifier on mature trees. Young cottonwood bark is smooth and yellowish-green to light gray. As trees age, the bark develops deep furrows and thick ridges that form a distinctive diamond or rectangular pattern — gray to gray-brown, heavily fissured. The thickness is not incidental: the bark evolved to protect against the prairie fires that historically swept Wyoming's grasslands adjacent to river corridors."
      - "The leaves offer definitive identification during Wyoming's growing season, May through September. Each leaf has the distinctive triangular or delta shape that gives the species its scientific name, with a pointed tip and coarsely toothed edges measuring two to four inches across. The flattened leaf stalk causes leaves to flutter and shimmer in Wyoming's constant wind — that movement creates the rustling sound that makes cottonwood groves immediately recognizable even before you see the tree. Upper surfaces are shiny bright green; lower surfaces are paler. In autumn, cottonwood leaves turn clear yellow along Wyoming's river corridors in late September and October."
      - "The overall form is a broad, spreading crown with massive horizontal branches when growing in open riverside locations. Trunks often lean at angles, reflecting Wyoming's persistent winds and periodic flooding. Ice damage from spring breakup, when floes batter trees along riverbanks, leaves scars and wounds that are common on mature specimens. In June, female trees are covered with cottony seed masses drifting through the air — unmistakable, and impossible to miss if you're standing near one."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What Plains Cottonwood Means in Wyoming"
    paragraphs:
      - "In most states, a state tree is decorative — a nod to natural beauty or regional character. In Wyoming, the Plains Cottonwood symbolizes something more functional: the location of water. Before roads and surveys, cottonwood groves were the map. Where cottonwoods grew, Wyoming's emigrants, ranchers, and Native Americans knew they could find water for people and livestock. The tree did not represent the landscape; it decoded it."
      - "Modern Wyomingites recognize the cottonwood primarily through its riparian corridors — the green ribbons that run through Wyoming's otherwise brown and gray basin landscapes along rivers like the North Platte and the Bighorn. These corridors support over 100 bird species and anchor Wyoming's fly fishing economy. Conservation of riverside cottonwood groves has become a concrete measure of Wyoming's environmental health, and the debate over water rights that drives much of Wyoming's political life runs directly through these stands of trees. The cottonwood is still infrastructure — just in a different century."

faq:
  - question: "What is the Wyoming state tree?"
    answer: "The Plains Cottonwood (Populus deltoides) is Wyoming's official state tree, named by the Legislature on January 31, 1947. Early settlers also called it sweet cottonwood to distinguish it from the black cottonwood found in Wyoming's mountains."

  - question: "When was the Wyoming state tree adopted?"
    answer: "Wyoming named the Plains Cottonwood as its official state tree on January 31, 1947. Governor Lester C. Hunt signed House Bill No. 56 establishing the designation."

  - question: "Why is the Plains Cottonwood Wyoming's state tree?"
    answer: "Wyoming chose the Plains Cottonwood because it was one of few trees that could survive the state's harsh climate and represented essential resources for pioneers. The tree provided shade, lumber, and marked reliable water sources across Wyoming's treeless plains. Its fast growth and adaptation to extreme temperatures — from below -40°F to above 100°F — made it invaluable in a landscape with almost no other large deciduous trees at lower elevations."

  - question: "Is Indian paintbrush a parasitic plant?"
    answer: "Yes, Indian paintbrush is hemiparasitic, meaning it connects its roots to neighboring plants and steals water and nutrients from host grasses and wildflowers. However, it also performs photosynthesis and produces its own energy, unlike fully parasitic plants."

  - question: "Where does the Wyoming state tree grow?"
    answer: "The Plains Cottonwood grows exclusively along rivers and streams in Wyoming. It lines the North Platte, Green, Snake, Powder, Bighorn, and Yellowstone rivers plus countless smaller streams. The tree requires permanent groundwater and creates green corridors through Wyoming's plains and basins. It is Wyoming's most abundant large deciduous tree at lower elevations."

  - question: "What are some facts about the Wyoming state tree?"
    answer: "The Plains Cottonwood was named state tree January 31, 1947. It grows five feet per year when young — one of North America's fastest-growing native trees. Female trees produce millions of cottony seeds each June. Over 100 bird species use cottonwood riparian forests. Trees can live 70 to 100 years. Native Americans fed cottonwood bark to horses during winter. Oregon Trail emigrants carved messages into cottonwood bark at Wyoming landmarks."

  - question: "How do you recognize the Wyoming state tree?"
    answer: "Look for mature bark with deep furrows in a diamond pattern, gray to gray-brown. Leaves are triangular or delta-shaped with coarsely toothed edges and flattened stalks that cause them to flutter in the wind. Fall colors are clear yellow. Female trees produce cottony seeds in June. The tree grows 50 to 80 feet tall with a broad, spreading crown and grows only along rivers and streams."

