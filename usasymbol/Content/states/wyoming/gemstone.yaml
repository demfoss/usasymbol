faq:
  - question: What is Wyoming's state gemstone?
    answer: "Wyoming's state gemstone is nephrite jade, a dense, tough green mineral, adopted in 1967."
  - question: When did Wyoming adopt nephrite jade as its state gemstone?
    answer: "The Wyoming Legislature designated nephrite jade the official state gemstone on January 25, 1967."
  - question: Why did Wyoming choose nephrite jade?
    answer: "A jade rush that began in the Granite Mountains in the 1930s made Wyoming one of the country's leading sources of high-quality nephrite."
  - question: Where can you find nephrite jade in Wyoming?
    answer: "Wyoming's main jade deposits sit in the Granite Mountains around Crooks Mountain near Jeffrey City, with additional loose jade historically found along the Sweetwater River."

