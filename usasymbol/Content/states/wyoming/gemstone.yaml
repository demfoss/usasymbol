    title: "Nephrite Jade Facts"
    facts:
      - "Adopted as Wyoming's state gemstone on January 25, 1967."
      - "A sheepherder made the first documented Wyoming jade discovery on Crooks Mountain in 1931."
      - "A 1945 Popular Science article touched off a jade rush that lasted into the 1980s."
      - "Wyoming has produced some of the largest nephrite jade boulders ever found in the United States."

