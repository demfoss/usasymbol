intro_text: "Wyoming's state gemstone is nephrite jade, adopted in 1967 after a jade rush that began in the Granite Mountains in the mid-1930s made the state one of the country's leading sources of the stone. This profile appears in the [list of U.S. state gemstones](/symbols/gemstones)."

sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Wyoming State Gemstone
    paragraphs:
      - "Nephrite jade is Wyoming's official state gemstone, designated by the state legislature in 1967. It is a dense, tough mineral prized for carving and jewelry, and Wyoming became one of the world's major sources of it after large deposits turned up in the Granite Mountains in the 1930s."
      - "Wyoming's jade stands out for its size and quality. Some of the largest jade boulders ever recorded in the United States came out of the state's central mountains."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Nephrite Jade?"
    paragraphs:
      - "Nephrite jade is a dense, fine-grained mineral made of tightly interlocking fibrous crystals, which is what gives it exceptional toughness for a stone of its hardness. Wyoming jade ranges in color from pale apple green through dark olive to nearly black, and polished pieces often show an oily, waxy luster rather than a glassy shine."
      - "The mineral forms where hot fluids alter serpentinite rock, replacing it with the tightly woven crystal structure that makes jade so resistant to cracking. That toughness is why jade has been carved into tools and ornaments by cultures worldwide for thousands of years."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Wyoming Chose Nephrite Jade as Its State Gemstone"
    paragraphs:
      - "A sheepherder found jade on Crooks Mountain in 1931, but the discovery drew little attention until prospectors found more in the Jeffrey City area in 1936. A 1945 Popular Science article describing fortunes lying loose on the ground touched off a jade rush across central Wyoming's Granite Mountains that lasted into the 1980s."
      - "Wyoming jade earned a reputation for size and quality rare among American deposits, and rockhounds and lapidaries built a real industry around cutting and polishing it. Naming it the state gemstone in 1967 recognized a resource that had already put Wyoming on the map for collectors nationwide."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Nephrite Jade Became Wyoming's State Gemstone"
    paragraphs:
      - "The Wyoming Legislature designated nephrite jade the official state gemstone on January 25, 1967, more than three decades after the first Granite Mountains discoveries and near the peak of the state's jade rush."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Nephrite Jade Is Found in Wyoming"
    paragraphs:
      - "Wyoming's primary jade deposits lie in the Granite Mountains of central Wyoming, in and around Crooks Mountain near the town of Jeffrey City, where prospectors found jade in place within serpentinite rock. Loose boulders and pebbles washed downstream also turned up for decades in the gravels of the Sweetwater River."
    sites:
