faq:
  - question: "What is Wyoming's state flower?"
    answer: "Wyoming's state flower is the Indian Paintbrush. This native wildflower displays brilliant red-orange spikes and grows throughout Wyoming in prairies, foothills, and mountain meadows from June through September at elevations ranging from 4,000 to 11,000 feet."

  - question: "When did Wyoming adopt the Indian Paintbrush?"
    answer: "Wyoming adopted the Indian Paintbrush on January 31, 1917. School children across Wyoming had campaigned for this designation, recognizing the flower's abundance and its red-orange color that matched the state's rugged character."

  - question: "Why did Wyoming choose the Indian Paintbrush?"
    answer: "Wyoming chose the Indian Paintbrush because it bloomed abundantly across the state's diverse elevations from prairies to mountain peaks. The brilliant wildflower was easily recognized by ranchers and homesteaders, and the campaign came from the state's school children rather than from legislators."

  - question: "Is Indian paintbrush a parasitic plant?"
    answer: "Yes, Indian paintbrush is hemiparasitic, meaning it connects its roots to neighboring plants and steals water and nutrients from host grasses and wildflowers. However, it also performs photosynthesis and produces its own energy, unlike fully parasitic plants."

  - question: "Where does the name Indian paintbrush come from?"
    answer: "The name comes from Native American legend about a young artist trying to paint sunset colors. Frustrated, he asked the Great Spirit for help. Brushes already dipped in sunset colors appeared, and where he left them on the ground, these brilliant flowers grew — resembling brushes dipped in paint."

