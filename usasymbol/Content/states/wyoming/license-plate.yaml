title: "That's WY"
symbol_type: License Plate Slogan
state: Wyoming
author: USA Symbol Team
date_published: '2026-04-29'
date_modified: '2026-04-30'
seo_title: "Wyoming License Plate Slogan | That's WY"
seo_description: "That's WY is Wyoming's current standard license plate slogan, introduced on the 2025 State Flag plate."
hero_image: /images/license-plates/wyoming/wyoming-state-flag-plate.jpg
hero_image_alt: Wyoming 2025 State Flag passenger license plate with Bucking Horse and Rider and That's WY text
hero_image_caption: "Wyoming's 2025 State Flag passenger plate keeps the Bucking Horse and Rider while adding travelwyoming.com and the tourism phrase That's WY."
intro_text: "Wyoming's plate identity is still the Bucking Horse and Rider, but the current plate no longer has no text at all. Earlier standard designs used Bicentennial and statehood-centennial wording, and the 2025 State Flag series now carries tourism text: travelwyoming.com and \"That's WY.\ This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "Wyoming does not have a permanent traditional slogan like \"America's Dairyland\" or \"Green Mountain State\" on its standard plate. Historically, its key slogans were \"THE SPIRIT OF '76 - In the American West!\" (1975-1977) and \"1890 Centennial 1990\" (1988-1992). The current 2025 State Flag plate adds travelwyoming.com and \"That's WY,\" but the Bucking Horse and Rider remains the main plate identity."
