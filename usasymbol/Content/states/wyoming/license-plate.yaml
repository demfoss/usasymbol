sections:
- id: bucking-horse
  icon: fa-solid fa-horse
  title: Why the Bucking Horse Matters More Than a Slogan
  paragraphs:
  - "Wyoming is unusual because its strongest plate identifier is a graphic. The Bucking Horse and Rider first appeared on Wyoming license plates in 1936 and has become the state's plate signature. It does the work that a phrase does in many other states: it tells drivers, collectors, and travelers exactly where the plate belongs."
  - "The figure is commonly associated with Steamboat, the legendary Wyoming bronco, and the symbol is protected by the state as a trademark. That visual continuity explains why Wyoming did not need a permanent nickname slogan on the plate for most of its modern history."
  - "Wyoming's official nickname is [The Equality State](/states/wyoming/nickname), and its motto is [Equal Rights](/states/wyoming/motto). Those are real state identities, but they are not the standard plate's long-running slogan. On plates, Wyoming has usually led with the western horse-and-rider mark instead."

- id: current-plate
  icon: fa-solid fa-flag
  title: The Current State Flag Plate
  paragraphs:
  - "The current passenger series is the 2025 Wyoming State Flag plate. It uses the state flag as the central design, keeps the Bucking Horse and Rider in the serial format, and prints travelwyoming.com along the bottom with \"That's WY\" at the lower right."
  - "That matters for accuracy: Wyoming can no longer be described as having no text on its current standard plate. A better distinction is that Wyoming has no permanent old-style state nickname slogan on the standard plate. Its current wording is tourism branding and a web address, not the historic identity phrase found on many other states' plates."

- id: spirit-of-76
  icon: fa-solid fa-flag-usa
  title: "\"THE SPIRIT OF '76 - In the American West!\""
  paragraphs:
  - "Wyoming's Bicentennial base ran from 1975 through 1977 and carried one of the more distinctive U.S. Bicentennial plate slogans: \"THE SPIRIT OF '76 - In the American West!\" The first half tied the plate to the national 200th-anniversary celebration, while the second half localized the message to Wyoming's western identity."
  - "The slogan did not become permanent. After the Bicentennial period, Wyoming returned to designs that depended more on the Bucking Horse and Rider than on a printed phrase."

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Wyoming License Plate Slogans by Era
  paragraphs:
  - "Wyoming's standard plate slogans are best read as short-purpose texts: one national anniversary, one statehood anniversary, and a modern tourism mark."
  versions:
  - name: "THE SPIRIT OF '76 - In the American West!"
    years: 1975-1977
    image: /images/license-plates/wyoming/1975-spirit-of-76.jpg
    description: U.S. Bicentennial base with the slogan screened across the top. The wording connects the national 1776-1976 celebration to Wyoming's western identity.
  - name: 1890 Centennial 1990
    years: 1988-1992
    image: /images/license-plates/wyoming/1988-centennial.png
    description: Statehood Centennial base marking Wyoming's 1890 admission to the Union and the 1990 centennial year.
  - name: "travelwyoming.com / That's WY"
    years: 2025-present
    image: /images/license-plates/wyoming/wyoming-state-flag-plate.jpg
    description: Current State Flag base with tourism website text and the phrase "That's WY" at the lower right. It is current plate text, but not a long-running nickname slogan.

- id: anniversary-pattern
  icon: fa-solid fa-rotate
  title: Anniversaries, Then Tourism Branding
  paragraphs:
  - "The historical pattern is clear: Wyoming added text when a particular occasion needed it. The Bicentennial slogan belonged to 1975-1977, and the Centennial wording belonged to the 1988-1992 statehood design."
  - "The 2025 State Flag plate changes the present-tense answer because it includes travelwyoming.com and \"That's WY.\" Still, the state's durable plate identity remains visual. The Bucking Horse and Rider is the piece that has carried Wyoming from the 1930s into the current series."
  - "For a look at how other states chose their plate slogans, see [U.S. license plate slogans by state](/license-plates)."

timeline:
- year: '1890'
  description: Wyoming is admitted to the Union on July 10 as the 44th state, the date later commemorated by the statehood centennial plate.
- year: '1936'
  description: The Bucking Horse and Rider first appears on Wyoming license plates, establishing the visual identity still associated with the state.
- year: '1975'
  description: "Wyoming begins the 1975-1977 Bicentennial base with the slogan \"THE SPIRIT OF '76 - In the American West!\""
- year: '1988'
  description: "Wyoming begins the 1988-1992 statehood centennial base, which reads \"1890 Centennial 1990.\""
- year: '2025'
  description: "Wyoming's State Flag plate series appears with travelwyoming.com and \"That's WY\" on the standard passenger format."

faq:
- question: What is Wyoming's license plate slogan?
  answer: "Wyoming's current standard plate includes travelwyoming.com and \"That's WY.\" Historically, its best-known plate slogans were \"THE SPIRIT OF '76 - In the American West!\" on the 1975-1977 Bicentennial base and \"1890 Centennial 1990\" on the 1988-1992 statehood centennial base."
- question: Does Wyoming use The Equality State on its standard license plate?
  answer: "No. Wyoming's nickname is The Equality State, but that nickname has not been the standard plate's long-running slogan. The plate identity is built mostly around the Bucking Horse and Rider."
- question: What was Wyoming's first major license plate slogan?
  answer: "Wyoming's first major slogan on a modern standard plate was \"THE SPIRIT OF '76 - In the American West!\" on the 1975-1977 U.S. Bicentennial base."
- question: What does the 1988 Wyoming plate commemorate?
  answer: "The 1988-1992 base commemorated Wyoming's statehood centennial. Its wording was \"1890 Centennial 1990,\" marking the 100th anniversary of Wyoming's admission to the Union."
- question: What is the bucking horse on Wyoming's license plate?
  answer: "The Bucking Horse and Rider is Wyoming's best-known plate symbol. It first appeared on Wyoming plates in 1936 and remains the state's main license plate identity."

