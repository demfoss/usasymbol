sections:
- id: why-was-wyoming-the-first-meadowlark-state
  icon: fa-solid fa-circle-question
  title: Why Was Wyoming the First Meadowlark State?
  paragraphs:
  - Because Wyoming made the choice before the symbol became crowded. When lawmakers adopted the meadowlark in February 1927, they were not copying a bird already claimed across the Plains. Oregon, Nebraska, Montana, Kansas, and North Dakota all followed later.
  - Today that can be easy to miss. Once five more states adopted the same bird, Wyoming's original claim got buried under the shared-symbol map. But the direction of influence ran outward from Wyoming, not toward it.
  - Even the current statute wording reflects the early stage. Wyoming law says <em>meadowlark, genus Sturnella</em> rather than committing to the specific Western Meadowlark name — a broader claim that fits a state staking the first position rather than slotting into a category someone else defined.
- id: how-did-a-thermopolis-school-essay-reach-the-legislature
  icon: fa-solid fa-school
  title: Grace Raymond Hebard and the Thermopolis Essay That Made Wyoming First
  paragraphs:
  - Wyoming Game and Fish traces the first push to an essay by a Thermopolis schoolgirl who argued Wyoming should honor the meadowlark — a real local beginning rather than a vague statewide mood.
  - The idea did not stay in the classroom. Grace Raymond Hebard, one of the best-known public figures at the University of Wyoming, took up the cause, and Senator Robert Hale introduced the bill.
  - That route into law gives Wyoming a different civic texture from a mass referendum story. The bird moved from one school essay to one determined advocate and then into the Legislature.
- id: why-did-five-other-states-later-choose-the-same-bird
  icon: fa-solid fa-map-location-dot
  title: The Six-State Meadowlark Map — and the State That Said No
  paragraphs:
  - Kansas, Montana, Nebraska, North Dakota, and Oregon all adopted the meadowlark after Wyoming. The bird works as a symbol for open-country, grassland-and-plains identity — the landscape those states share. Wyoming's 1927 choice demonstrated that the connection held, and later states reached the same conclusion independently.
  - 'None of them cited Wyoming as a precedent. But the pattern shows what Wyoming''s early adoption did in practice: it established the meadowlark as the default bird for a particular kind of western identity before that identity had been formally named.'
  - The clearest sign of how far that spread went is the state that eventually said no. When Washington ran its own bird selection, lawmakers backed away from the meadowlark specifically because too many other states already used it. By then Wyoming had been holding the original claim for decades.
faq:
- question: What is Wyoming's state bird?
  answer: Wyoming's state bird is the meadowlark, understood in practice as the Western Meadowlark.
- question: When did Wyoming adopt the meadowlark?
  answer: Wyoming adopted the meadowlark on February 5, 1927.
- question: Was Wyoming the first meadowlark state?
  answer: Yes. Wyoming adopted the meadowlark before Oregon, Nebraska, Montana, Kansas, and North Dakota made the same bird official.
- question: Who helped make the meadowlark Wyoming's state bird?
  answer: State history points especially to Grace Raymond Hebard and Senator Robert Hale, with Wyoming Game and Fish tracing the original spark to a Thermopolis school essay.
- question: Why does Wyoming's meadowlark page differ from the other meadowlark states?
  answer: Because Wyoming did not adopt the bird after it had already become a shared Plains symbol. It was the first state to make that choice.
- question: What does Wyoming law actually call the state bird?
  answer: Current Wyoming law uses the broader wording meadowlark and identifies the genus as Sturnella.
- question: What does the meadowlark mean for Wyoming?
  answer: Wyoming's meadowlark is the origin of a pattern, not a copy of one. The state made the choice in 1927 before the bird became a six-state symbol, and the specific path — a Thermopolis school essay, Grace Raymond Hebard, Senator Robert Hale — gives it a more personal story than most shared-symbol pages carry.
