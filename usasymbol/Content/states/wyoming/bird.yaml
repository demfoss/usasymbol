title: Western Meadowlark
scientific_name: Sturnella neglecta
adopted_year: 1927
legislation: Wyo. Stat. Sec. 8-3-105
meaning: Wyoming's meadowlark page works best as an origin story. The state did not join an already crowded symbol pattern. It started one. Wyoming adopted the meadowlark in 1927 before the bird became a six-state emblem, and state history ties the push to Grace Raymond Hebard, Senator Robert Hale, and a school essay from Thermopolis. That makes Wyoming less a follower than the place where the meadowlark pattern began.
author: USA Symbol Team
date_published: '2025-01-15'
date_modified: "2026-05-02"
seo_title: "Wyoming State Bird | Western Meadowlark"
seo_description: Wyoming adopted the Western Meadowlark in 1927 — before Kansas, Montana, Nebraska, North Dakota, or Oregon made the same choice. The bird moved from a Thermopolis school essay to Grace Raymond Hebard to the legislature, making Wyoming's meadowlark story more specific than the shared-symbol map suggests.
intro_text: 'Wyoming''s official state bird is the <strong>meadowlark</strong>, adopted on <strong>February 5, 1927</strong>. Wyoming chose the bird before the meadowlark became a crowded Plains symbol — five other states would follow, but Wyoming was first. State history also preserves a more personal route into law: Grace Raymond Hebard championed the measure, Senator Robert Hale carried it, and Wyoming Game and Fish traces the original spark to a school essay written in Thermopolis. That gives Wyoming a cleaner, more specific meadowlark story than the shared-symbol map suggests.'
