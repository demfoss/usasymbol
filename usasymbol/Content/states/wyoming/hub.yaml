name_meaning:
  heading: What Does Wyoming Mean?
  paragraphs:
  - Wyoming became the 44th state in 1890. The name was borrowed from Wyoming Valley in Pennsylvania and comes from a Munsee Delaware place-name often explained as referring to a broad plain or large flat.
  - "The state-symbol story is less about the borrowed eastern place-name and more about Wyoming's own claims: Equal Rights, the Equality State nickname, the bison flag, Yellowstone bison survival, and symbols of high plains and mountain country."
  - Wyoming's postal abbreviation is WY, and residents are Wyomingites. The Equality State nickname points to the territory's 1869 women's suffrage law.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Borrowed from Wyoming Valley in Pennsylvania, from a Munsee Delaware place-name.
    - label: Statehood
      text: Wyoming became the 44th state in 1890.
    - label: Suffrage identity
      text: Wyoming Territory granted women full voting rights in 1869, giving the state its Equality State identity.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Wyoming, a western state of high plains, mountains, sagebrush basins, ranching, and Yellowstone country.
    - label: People
      text: People from Wyoming are called Wyomingites.
    - label: Flag
      text: The state flag places the Great Seal on a white bison.
  - heading: Nicknames and Short Forms
    items:
    - label: The Equality State
      text: Wyoming's official nickname, tied to women's political rights in the territory.
    - label: Abbreviation
      text: WY; older short form Wyo.
editorial:
  heading: What Wyoming's Symbols Say About the State
  paragraphs:
  - The [American bison](/states/wyoming/mammal/american-bison) is the hub's anchor because it appears on the [state flag](/states/wyoming/flag) and reaches back to the Yellowstone herd story before the mammal designation became law in 1985.
  - Wyoming's civic symbols are just as direct. [Equal Rights](/states/wyoming/motto) and the [Equality State nickname](/states/wyoming/nickname) are tied to the territory's early women's suffrage law rather than to a vague ideal.
  - "The [western meadowlark](/states/wyoming/bird), [Indian paintbrush](/states/wyoming/flower), and [plains cottonwood](/states/wyoming/tree) keep the guide close to open ground. The cottonwood is especially Wyoming: in a largely treeless state, it marks water, settlement, and ranch life."
faq:
- question: What is Wyoming's most famous state symbol?
  answer: The [American bison](/states/wyoming/mammal/american-bison) is Wyoming's strongest symbol because it appears on the state flag and had been central to Wyoming imagery long before it became the official state mammal.
- question: What is Wyoming's state bird?
  answer: Wyoming's state bird is the [western meadowlark](/states/wyoming/bird), adopted in 1927.
- question: What is Wyoming's state flower?
  answer: Wyoming's state flower is the [Indian paintbrush](/states/wyoming/flower), adopted in 1917.
- question: Why is Wyoming called the Equality State?
  answer: Wyoming is called the [Equality State](/states/wyoming/nickname) because Wyoming Territory granted women full political rights in 1869, decades before the 19th Amendment.
- question: How many official state symbols does Wyoming have?
  answer: Wyoming's state symbols list here includes the flag, western meadowlark, Indian paintbrush, plains cottonwood, Equal Rights motto, Equality State nickname, colors, and American bison.
