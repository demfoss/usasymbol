seo_description: "Wyoming symbols include the western meadowlark, Indian paintbrush, plains cottonwood, American bison, and Equality State nickname."
snippet_answer: "The bison flag and Indian paintbrush are Wyoming's most recognized official state symbols — the bison tied to Yellowstone conservation history, the paintbrush to high-prairie wildflowers. The western meadowlark, plains cottonwood, Equal Rights motto, and Equality State nickname complete a list built around open country and women's suffrage history."
