intro_text: "Wyoming's state seal places a woman holding 'Equal Rights' at its center, recognizing the 1869 territorial law that made Wyoming the first jurisdiction in the United States to grant women equal voting rights. A miner and a rancher flank her, the dates 1869 and 1890 mark territory and statehood, and an eagle crowns the design."
