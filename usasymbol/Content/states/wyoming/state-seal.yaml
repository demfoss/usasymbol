name: Great Seal of the State of Wyoming
adopted_year: 1893
is_official: true
legislation: Wyo. Stat. §8-3-101
meaning: "The Great Seal of the State of Wyoming places a woman at its center to make a direct political statement. Wyoming Territory was the first jurisdiction in the United States to grant women equal voting rights, signing that law on December 10, 1869. The seal encodes that fact in its central figure, its motto, and its dates. The 1869 and 1890 columns record the two most significant years in Wyoming's history: the suffrage act and statehood."
