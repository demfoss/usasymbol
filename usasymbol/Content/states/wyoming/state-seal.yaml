timeline:
- year: '1869'
  description: Wyoming Territory is established. On December 10, 1869, Governor John A. Campbell signs the women's suffrage act, making Wyoming the first jurisdiction in the United States to grant women equal voting rights.
- year: '1870'
  description: Wyoming Territory seats the first female jurors in U.S. history. Esther Hobart Morris is appointed the first female justice of the peace in the country.
- year: '1890'
  description: Congress admits Wyoming to the Union as the 44th state on July 10, 1890. Wyoming enters with its 1869 suffrage law intact after refusing to remove it as a condition of admission.
- year: '1893'
  description: The Wyoming state legislature adopts the Great Seal of the State of Wyoming. The design places the equal rights woman at the center, flanked by the dates 1869 and 1890.
- year: '1955'
  description: Wyoming formally adopts "Equal Rights" as the official state motto, codifying the phrase that had appeared on the seal since 1893.

faq:
- question: What does the Wyoming state seal show?
  answer: The Wyoming state seal shows a woman holding a banner reading "Equal Rights" at its center, flanked by a miner and a rancher. Two pillars display the dates 1869 and 1890, marking Wyoming's women's suffrage law and statehood. An eagle crowns the top of the design.
- question: Why is a woman on the Wyoming state seal?
  answer: The woman represents Wyoming's equal rights law of 1869, when Wyoming Territory became the first jurisdiction in the United States to grant women equal voting rights. She holds a banner reading "Equal Rights" and occupies the center of the seal, making the suffrage claim the dominant message of the design.
- question: What do the dates 1869 and 1890 mean on the Wyoming state seal?
  answer: The date 1869 marks December 10, 1869, when Wyoming Territory signed the women's suffrage act into law. The date 1890 marks July 10, 1890, when Wyoming entered the Union as the 44th state. The two dates appear on pillars flanking the central equal rights figure, recording both events as equally foundational.
- question: What is Wyoming's state motto on the seal?
  answer: Wyoming's state motto is "Equal Rights," the same phrase carried on the banner of the central woman on the seal. The phrase appeared on the seal since its adoption in 1893 and was formally designated the official state motto in 1955. It is the only U.S. state motto that directly references civil equality.
- question: When was the Wyoming state seal adopted?
  answer: The Wyoming state seal was adopted in 1893, three years after Wyoming entered the Union as the 44th state on July 10, 1890. The current authoritative description is in Wyo. Stat. §8-3-101.
- question: Why did Wyoming refuse to remove women's suffrage when applying for statehood?
  answer: When Congress resisted Wyoming's admission because of its women's suffrage provisions, the territorial legislature refused to remove them, reportedly stating it would remain out of the Union for a hundred years rather than enter without women. Wyoming entered in 1890 with its 1869 suffrage law intact, and the seal adopted in 1893 recorded that stance permanently.

