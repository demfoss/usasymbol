intro_text: Wyoming's state fish is the cutthroat trout, the state's only native trout, adopted in 1987. It gets its name from the orange-red mark under its lower jaw. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Wyoming?
  paragraphs:
  - The cutthroat trout became Wyoming's official state fish in 1987. Its scientific name is Oncorhynchus clarkii. State law still lists it by an older scientific name, Salmo clarki.
  - It lives in cold mountain streams and lakes in many parts of the state.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Cutthroat Trout
  paragraphs:
  - The cutthroat trout is named for the orange or red mark behind its lower jaw. It looks like a small slash under the throat.
  - Its body has black spots, which are often thickest toward the tail. Unlike rainbow trout, it has no white tips on the fins along its belly.
  - There are several kinds of cutthroat trout, and they can look quite different from each other. Some have large spots and others have very fine spots.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - The Wyoming Legislature named the cutthroat trout the official state fish in 1987. It is listed in state law next to Wyoming's other symbols, such as the state mammal and the state fossil.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Wyoming Chose the Cutthroat Trout
  paragraphs:
  - Official sources name the cutthroat trout as the state fish but do not give a detailed reason. It is the only trout species native to Wyoming.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Cutthroat Trout
  paragraphs:
  - Cutthroat trout live in cold, clean water in Wyoming's mountains. The Snake River near Jackson is home to the Snake River cutthroat.
  - Yellowstone cutthroat live in the Yellowstone area and in the East Fork Wind River drainage. Colorado River cutthroat live in headwater streams and lakes in the southern part of the state.
