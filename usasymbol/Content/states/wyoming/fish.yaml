- id: facts
  icon: fa-solid fa-lightbulb
  title: Cutthroat Trout Facts
  facts:
  - Adopted in 1987 by the Wyoming Legislature.
  - Its scientific name is Oncorhynchus clarkii.
  - It is the only trout native to Wyoming.
  - Four kinds live across the state. They are the Bonneville, Colorado River, Snake River, and Yellowstone cutthroat.
  - Wyoming's record cutthroat weighed 15 pounds and was 32 inches long. It was caught in 1959.
faq:
- question: What is Wyoming's state fish?
  answer: Wyoming's state fish is the cutthroat trout. It is the only trout native to the state.
- question: When did Wyoming adopt the cutthroat trout?
  answer: The Wyoming Legislature made the cutthroat trout the official state fish in 1987.
- question: Why did Wyoming choose the cutthroat trout?
  answer: Official sources do not give a detailed reason. The cutthroat trout is the only trout species native to Wyoming.
- question: Why is it called a cutthroat trout?
  answer: It has an orange or red mark behind its lower jaw. The mark looks like a slash across the throat.
- question: How many kinds of cutthroat trout live in Wyoming?
  answer: Four kinds live across Wyoming. They are the Bonneville, Colorado River, Snake River, and Yellowstone cutthroat. A fifth kind, the westslope cutthroat, lives only in the far northwest corner of the state inside Yellowstone National Park.
