# verification: confirmed with notes. The state law confirms Wyoming's "State Fish" is the cutthroat trout. The law uses the older scientific name Salmo clarki, and the state wildlife agency's species list uses the current name, Oncorhynchus clarkii. The 1987 adoption year comes from secondary references that agree with each other, but the official statute text I checked does not show the year.
