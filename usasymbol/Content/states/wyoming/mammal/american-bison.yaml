seo_title: "Wyoming State Mammal | American Bison"
seo_description: "Wyoming's state mammal is the American Bison, adopted in 1985. Learn why this official Wyoming symbol was chosen and what it represents."
intro_text: "The American Bison is the official Wyoming state mammal, designated in 1985. This page gives the direct answer for searches like 'wyoming state mammal', 'wyoming state animal', and 'wyoming state mammal' while explaining how the symbol fits the state's official animal designations. Appearing on Wyoming state flag and seal; Yellowstone as last stronghold during near-extinction; only continuously wild, genetically pure herd in North America; cultural significance to Eastern Shoshone and Northern Arapaho tribes."
common_name: American Bison (often called Buffalo)
official_since: '1985'
status: Recovered from near-extinction; Yellowstone herd approximately 4,900 animals (2024); Grand Teton herd approximately 500–700; additional herds on Wind River Reservation and state-managed lands; overall population stable
habitat_in_state: Grasslands, sagebrush plains, river valleys, mountain meadows; Yellowstone National Park contains largest wild bison population in continuous existence since prehistoric times; herds also in Jackson Hole valley
known_for: Appearing on Wyoming state flag and seal; Yellowstone as last stronghold during near-extinction; only continuously wild, genetically pure herd in North America; cultural significance to Eastern Shoshone and Northern Arapaho tribes
size: Males 10 to 12.5 feet head to tail; females 7 to 10 feet; shoulder height 5 to 6.5 feet for males, 4 to 5 feet for females
weight: Males 1,000 to 2,000 pounds; exceptional males exceed 2,500 pounds; females 800 to 1,200 pounds
coloration: Dark brown to almost black; lighter brown on head, shoulders, and forelegs during summer; calves born reddish-orange, darkening to brown by fall
distinctive_traits: Massive head with curved horns; pronounced shoulder hump composed of muscle and vertebrae; thick winter coat; calves can run within hours of birth; both sexes have horns
habitat: Open grasslands, sagebrush plains, river valleys, aspen groves, mountain meadows up to 8,000 feet elevation; seasonal movements between high-elevation summer ranges and lower-elevation winter ranges
range_in_state: Yellowstone National Park; Grand Teton National Park and National Elk Refuge (Jackson Hole valley); Wind River Reservation; some movement outside park boundaries creates management conflicts
conservation_status: Ecologically extinct across most historic range; genetically pure wild herds limited to Yellowstone, Grand Teton, and few other locations; most North American bison carry cattle genes; Yellowstone herd represents purest genetic stock
where_to_find: Yellowstone's Hayden Valley and Lamar Valley year-round; Grand Teton National Park's Mormon Row and Antelope Flats; National Elk Refuge in Jackson during winter; maintain 25-yard minimum distance
symbol_connections: Central image on Wyoming state flag (white bison on blue background, adopted 1917); appears on state seal since 1890; no other Wyoming animal appears on both flag and seal
