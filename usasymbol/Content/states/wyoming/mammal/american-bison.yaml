sections:
- id: official-designation
  icon: fa-solid fa-landmark
  title: Wyoming's 1985 Bison Designation — and the Flag That Came First
  paragraphs:
  - 'Governor Ed Herschler signed the American bison into law as Wyoming''s state mammal in 1985 — sixty-eight years after the bison appeared on the state flag and ninety-five years after it appeared on the state seal. The [Wyoming official state symbols](https://sos.wyo.gov/Services/StateInfo_Symbols.aspx) list now includes the bison in both roles: flag centerpiece and state mammal. No other Wyoming animal occupies both positions.'
  - The 1985 designation was not ceremonial. Wyoming had spent the previous eight decades as the only state actively protecting a continuously wild bison herd during and after the species' near-extinction. The mammal designation formalized conservation history, not just cultural identity.
- id: near-extinction
  icon: fa-solid fa-person-rifle
  title: 'The Last 23 Bison: How Yellowstone Saved the Species'
  paragraphs:
  - In 1800, an estimated twenty-five to thirty million bison ranged across North America. By 1889, fewer than one thousand remained — a ninety-nine point nine seven percent collapse in less than a century. Commercial hide hunters killed millions between 1870 and 1883. The U.S. Army actively encouraged the slaughter as military strategy, calculating that destroying the bison would sever Plains tribes from the resource their economies, cultures, and spiritual life depended on. Extinction was both commercial objective and policy.
  - By 1902, twenty-three wild bison survived in Yellowstone's remote Pelican Valley — the only population in North America that remained free-ranging throughout the entire crisis without captivity or private ownership. While other states let their bison vanish, Wyoming's Yellowstone kept these animals alive. Park authorities protected the survivors, supplemented the herd with animals purchased from private ranches, and rebuilt what is now the most important bison population on the continent — approximately 4,900 animals today.
  - That unbroken lineage has a material consequence. DNA studies confirm the absence of cattle genes in Yellowstone's herd, distinguishing it from roughly ninety-five percent of North American bison, which carry cattle DNA from nineteenth-century crossbreeding experiments. Yellowstone's herd is one of fewer than twelve in North America confirmed genetically pure. No other state can point to a continuously wild, genetically uncontaminated bison population descended directly from prehistoric animals.
- id: management-controversy
  icon: fa-solid fa-scale-balanced
  title: 'Wyoming Bison Management: Wild Animal or Livestock?'
  paragraphs:
  - Wyoming's state mammal holds two contradictory legal identities depending on its location. Inside Yellowstone and Grand Teton, bison are wild animals protected from hunting. When the same animals cross park boundaries — following ancient migration routes that predate the park lines by thousands of years — Wyoming law reclassifies them as livestock subject to capture, disease testing, and slaughter.
  - 'The stated reason is brucellosis, a bacterial disease causing reproductive failure in cattle. Approximately fifty percent of Yellowstone bison carry brucellosis antibodies. Wyoming participates in management agreements with Montana and federal agencies restricting bison movements outside park boundaries to prevent potential transmission. What those agreements rarely lead with: no documented case exists of wild bison transmitting brucellosis to cattle under field conditions. All confirmed transmissions occurred in captive or feedground situations. The disease concern is real; the specific transmission pathway from free-ranging bison to cattle has not been documented.'
  - Conservation groups argue Wyoming's state mammal deserves wild status and tolerance for the movements that define wild animals. Ranching communities counter that disease risk justifies strict boundary enforcement. Wyoming manages this contradiction through agreements that satisfy neither side — treating the same animal as icon and livestock depending on which side of an invisible boundary line it stands on.
- id: tribal-significance
  icon: fa-solid fa-people-group
  title: 'Bison and Wyoming''s Tribes: A Relationship the State Didn''t Create'
  paragraphs:
  - The Eastern Shoshone and Northern Arapaho tribes on Wyoming's Wind River Reservation hold a relationship with bison that predates the state of Wyoming by thousands of years. Plains tribes depended on bison for food, shelter, clothing, tools, and spiritual practice. The animal's near-extinction was not simply an ecological event — it was a deliberate cultural disruption, executed in part as federal policy to sever tribal communities from the resource that organized their entire way of life.
  - 'Wind River''s bison herd restores elements of that relationship: meat for traditional ceremonies, teaching for youth learning ancestral practices, and a living presence that no museum exhibit replaces. Tribal members hunt Yellowstone bison leaving park boundaries under treaty rights, connecting modern descendants to practices that predate Wyoming statehood by centuries.'
  - Wyoming's 1985 mammal designation occurred without substantial tribal consultation. The same animal is simultaneously a state symbol, a conservation priority, a disease vector to ranchers, and a sacred relative to tribal members. These competing claims — state symbol, wild icon, livestock, sacred relative — define the bison's place in Wyoming more completely than any official designation can.
timeline:
- year: Prehistoric–1800
  description: Bison populations estimated at 25–30 million across North America; Plains tribes develop cultures centered on bison; Wyoming's grasslands support vast seasonal herds
- year: 1870–1883
  description: Commercial hide hunting decimates bison; U.S. Army encourages slaughter to weaken Plains tribes; continental population collapses from millions to fewer than 1,000 by 1889
- year: '1872'
  description: Yellowstone established as first national park; provides refuge for last wild bison, though illegal hunting continues inside the park
- year: '1890'
  description: Wyoming achieves statehood; state seal adopted featuring bison as central image
- year: '1902'
  description: Census counts only 23 wild bison in Yellowstone's Pelican Valley — the continental nadir of the species
- year: '1907'
  description: Yellowstone begins supplementing the wild herd with bison from private ranches; captive and wild lineages eventually merge into the modern herd
- year: '1917'
  description: Wyoming adopts state flag centered on a white bison silhouette — the primary visual identity of the state
- year: 1964–1969
  description: Grand Teton National Park receives Yellowstone bison to establish Jackson Hole herd; animals adapt to seasonal migrations with the National Elk Refuge
- year: '1985'
  description: Governor Ed Herschler signs legislation designating the American bison as Wyoming's official state mammal
- year: 2000s
  description: Genetic studies confirm Yellowstone bison as one of fewer than 12 herds in North America without cattle gene contamination
- year: '2024'
  description: Yellowstone herd at approximately 4,900; Grand Teton herd 500–700; ongoing debates over management, brucellosis transmission, and wild status outside park boundaries
faq:
- question: What is Wyoming's state mammal?
  answer: Wyoming's state mammal is the American bison (Bison bison), designated in 1985. The bison also appears on Wyoming's state flag (since 1917) and state seal (since 1890), making it Wyoming's primary visual symbol. Yellowstone National Park holds approximately 4,900 bison — the only continuously wild, genetically pure herd in North America.
- question: Why is the bison Wyoming's state mammal?
  answer: Wyoming designated the bison in 1985 to formalize the animal's already central role in state identity and conservation history. When the species collapsed from thirty million to twenty-three wild survivors in 1902, those survivors were in Yellowstone — in Wyoming. No other state can claim continuous protection of wild bison through the entire near-extinction crisis.
- question: Are Yellowstone bison really wild or managed like livestock?
  answer: Bison inside Yellowstone and Grand Teton are managed as wild animals. When the same bison cross park boundaries, Wyoming law reclassifies them as livestock subject to capture and culling. This dual legal status — wild inside parks, livestock outside — is the central contradiction of bison management in Wyoming and the primary source of conflict between conservation groups and ranching interests.
- question: What is brucellosis and why does it affect Wyoming bison policy?
  answer: Brucellosis is a bacterial disease causing reproductive failure in cattle. About fifty percent of Yellowstone bison carry antibodies. Wyoming and Montana restrict bison movements outside Yellowstone to prevent potential cattle transmission. No documented case exists of wild bison transmitting brucellosis to cattle under field conditions — all confirmed transmissions involved captive situations. The disease drives management policy despite this gap between stated risk and documented evidence.
- question: How many bison live in Wyoming?
  answer: Yellowstone National Park holds approximately 4,900 bison (2024 census). Grand Teton National Park and the National Elk Refuge support 500–700 in the Jackson Hole valley. The Eastern Shoshone Tribe maintains a small herd on the Wind River Reservation. Numerous private ranches raise bison commercially, but these are managed as livestock and most carry cattle genes.
- question: Are bison and buffalo the same animal?
  answer: Americans commonly call bison 'buffalo,' though true buffalo are different species native to Africa and Asia. The term likely derives from French fur traders' 'les boeufs.' Both terms are widely used in common speech; scientific and wildlife management contexts prefer 'bison' for precision.
- question: When did the bison first appear on Wyoming's flag and seal?
  answer: The bison appeared on Wyoming's state seal in 1890 at statehood, and on the state flag in 1917. The 1985 mammal designation came sixty-eight years after the flag — making the bison Wyoming's de facto primary symbol long before the legislature voted on it.
