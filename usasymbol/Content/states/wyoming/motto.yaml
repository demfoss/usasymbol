faq:
- question: What is Wyoming's state motto?
  answer: Wyoming's state motto is 'Equal Rights,' adopted in 1893 on the Great Seal. It honors Wyoming's 1869 law granting women the right to vote — the first place in the United States to do so, 51 years before the 19th Amendment.
- question: Why did Wyoming choose 'Equal Rights' as its state motto?
  answer: The motto was adopted in 1893, three years after statehood, as a direct acknowledgment of Wyoming's history. Wyoming had granted women the right to vote in 1869, successfully defended that right in 1871 against a repeal attempt, and refused to remove women's suffrage when Congress demanded it as a statehood condition in 1890. The phrase described something Wyoming had already done and defended, not a goal it was still working toward.
- question: When and where does Wyoming's motto appear?
  answer: On a banner held by a female figure at the center of Wyoming's Great Seal, adopted in 1893. The seal appears on official state documents, government letterhead, and the state flag — where it sits on the side of a white bison against a blue field. Wherever the flag or seal appears, the motto appears with it.
- question: What do the dates 1869 and 1890 on Wyoming's seal mean?
  answer: 1869 is the year Wyoming Territory granted women the right to vote — the first in the nation. 1890 is the year Wyoming entered the Union as a state, with women's suffrage intact despite Congressional pressure to remove it. Both dates appear on the pillar in the Great Seal design, tying the motto directly to those two events.
- question: Who was the first woman to vote in the United States?
  answer: Louisa Gardner Swain of Laramie, Wyoming, who cast her ballot on September 6, 1870, in a general election — less than a year after Wyoming passed its women's suffrage law. She is widely identified as the first woman to vote in a U.S. general election under equal suffrage laws.
- question: Who was Esther Morris?
  answer: Esther Morris was appointed justice of the peace in South Pass City, Wyoming, in 1870 — making her the first female judge in the United States. She is one of the figures most closely associated with Wyoming's early women's suffrage history and the practical meaning of the state's 'Equal Rights' motto.
- question: Who was Nellie Tayloe Ross?
  answer: Nellie Tayloe Ross was elected governor of Wyoming in 1924, taking office in January 1925 — making her the first female governor in United States history. She later served as director of the United States Mint from 1933 to 1953.
- question: What language is Wyoming's motto in?
  answer: English. Wyoming chose plain English rather than Latin, which most 19th-century states used for their mottos. The choice makes the phrase immediately readable by any citizen — consistent with the democratic principles it declares.
