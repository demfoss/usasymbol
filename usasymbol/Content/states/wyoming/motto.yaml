faq:
  - question: "What is Wyoming's state motto?"
    answer: "Wyoming's state motto is \"Equal Rights,\" codified in Wyoming Statutes §8-3-107. It has appeared on the state seal since the Second Legislature adopted it in 1893."

  - question: "What does \"Equal Rights\" mean as Wyoming's motto?"
    answer: "It refers to equal political rights — specifically the right of women to vote. Wyoming Territory granted women the right to vote on December 10, 1869, the first government in the United States to do so. The motto placed that achievement at the center of the state's identity."

  - question: "When did Wyoming adopt its state motto?"
    answer: "The motto appeared on Wyoming's state seal when the Second Legislature adopted it in 1893. The seal was designed by Philadelphia artist Edmund Stewardson and submitted to Governor Amos W. Barber in 1892."

  - question: "Why is Wyoming called the Equality State?"
    answer: "Because Wyoming Territory was the first government in the United States to grant women the right to vote, on December 10, 1869. That history is reflected in both the state motto \"Equal Rights\" and the nickname \"The Equality State.\""

