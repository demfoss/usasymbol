seo_title: "Wyoming State Motto | Equal Rights"
seo_description: "Wyoming's state motto is \"Equal Rights,\" adopted on the state seal in 1893. Wyoming was the first U.S. territory to grant women the right to vote."

intro_text: "Wyoming's state motto is <strong>Equal Rights</strong>, adopted when the state seal was created by the Second Legislature in 1893. The motto connects directly to December 10, 1869, when Wyoming Territory became the first government in the United States to grant women the right to vote and hold office. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

