seo_title: "Wyoming State Motto | Equal Rights"
seo_description: Wyoming's state motto is 'Equal Rights' — adopted in 1893 and rooted in the 1869 law that made Wyoming the first place in the United States to grant women the vote. Learn its meaning, where it appears, and the women who made it real.
intro_text: 'Wyoming''s official state motto is <strong>Equal Rights</strong> — two words chosen not as aspiration but as record. When the territorial legislature extended voting rights to women in 1869, fifty-one years before the 19th Amendment, Wyoming staked out a position it then refused to abandon: it kept women''s suffrage through a repeal attempt in 1871, fought Congress over it during statehood negotiations, and in 1893 placed the phrase at the center of its Great Seal. The motto was earned, not borrowed.'
