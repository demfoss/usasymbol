seo:
  title: "Most Common Last Names in Wyoming"
  description: "The most common last names in Wyoming are Smith, Johnson, and Miller, a ranking shaped by frontier settlement, Scandinavian names, railroads, ranching, and mining towns."

page:
  h1: "Most Common Last Names in Wyoming"
  intro: "The most common last names in Wyoming are Smith, Johnson, and Miller, followed by Anderson and Brown in a top five shaped by frontier settlement, railroads, ranching, mining, and LDS communities. Wyoming's surname mix looks strongly northern European, but Martinez at No. 13 and names such as Hansen, Jensen, Christensen, and Larson just below the top 20 show how Hispanic, Scandinavian, and western migration streams still stand out in a small population."
  heritage_title: "Railroad Towns, Ranch Country, and Western Settlements"
  heritage_body: "Wyoming's naming map was built along travel corridors: the Oregon, California, and Mormon trails crossed the state before the Union Pacific made southern Wyoming a chain of railroad and coal towns. English and Scots-Irish names such as Smith, Brown, Jones, Clark, Taylor, and Hill spread through ranching counties, while Johnson, Anderson, Nelson, Peterson, Hansen, Jensen, Christensen, and Larson reflect Scandinavian settlement across the northern Plains and the Intermountain West. Martinez entered the top 20 through the long Hispanic presence in the Rocky Mountain region and through agricultural, railroad, and energy work in towns tied to sugar beets, coal, oil, and gas."
  fun_fact: "Wyoming has only about 11 people per unique surname in the Forebears dataset, which means uncommon family names can become visible statewide with just a few hundred bearers."

surnames:
  - rank: 1
    name: Smith
    count: 4706
    ratio: 127
    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker. Smith leads Wyoming because it traveled easily with English, Scottish, Irish, and American-born migrants who moved through trail, railroad, ranching, and mining communities."

  - rank: 2
    name: Johnson
    count: 4331
    ratio: 138
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' (God is gracious). Johnson ranks unusually high in Wyoming because it fits both English-language settlement and Scandinavian patronymic traditions common across the northern Plains."

  - rank: 3
    name: Miller
    count: 3323
    ratio: 179
    origin: english
    type: Occupational
    meaning: "A grain mill worker, from Middle English 'miller'. Miller rose with farming and small-town settlement, and in Wyoming it also overlaps with German Mueller families whose name was often anglicized."

  - rank: 4
    name: Anderson
    count: 2860
    ratio: 209
    origin: scottish
    type: Patronymic
    meaning: "Son of Andrew, from Greek 'Andreas' (manly). Anderson is common in Wyoming because it came through both Scots-Irish migration and Scandinavian Andersson or Andersen families who settled across the West."

  - rank: 5
    name: Brown
    count: 2780
    ratio: 215
    origin: english
    type: Descriptive
    meaning: "From Old English 'brún', a nickname for brown hair, brown clothing, or complexion. Brown spread widely with American-born settlers and became a durable ranch-country surname because it required no single ethnic channel."

  - rank: 6
    name: Jones
    count: 2228
    ratio: 268
    origin: welsh
    type: Patronymic
    meaning: "From John, via the Welsh form 'Ioan'. Jones came west with families from older American settlement zones, and its presence in Wyoming mirrors the movement of English and Welsh names into mining, railroad, and livestock towns."

  - rank: 7
    name: Williams
    count: 2211
    ratio: 270
    origin: english
    type: Patronymic
    meaning: "Son of William, from a Norman personal name meaning will plus helmet or protection. Williams ranks below Jones and Brown in Wyoming, a contrast with many Southern states where post-Civil War naming made it even more dominant."

  - rank: 8
    name: Davis
    count: 2032
    ratio: 293
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid' (beloved). Davis is one of the Welsh-origin names that became broadly American before Wyoming statehood in 1890, then moved west with settlers and workers rather than one narrow immigrant group."

  - rank: 9
    name: Nelson
    count: 1747
    ratio: 341
    origin: english
    type: Patronymic
    meaning: "Son of Nell or Neil, though in the American West it often also reflects Scandinavian Nelsen or Nielsen forms. Nelson's top-10 position is one of the clearest signs of northern European settlement in Wyoming."

  - rank: 10
    name: Clark
    count: 1671
    ratio: 357
    origin: english
    type: Occupational
    meaning: "From Latin 'clericus', a clerk, cleric, or literate official. Clark fits Wyoming's frontier paper trail because clerks, merchants, surveyors, and ranch families carried the name into county seats and railroad towns."

  - rank: 11
    name: Taylor
    count: 1669
    ratio: 357
    origin: english
    type: Occupational
    meaning: "From Old French 'tailleur', one who cuts cloth. Taylor spread through Wyoming as a common American surname, with no need for a large textile trade in the state itself."

  - rank: 12
    name: Thompson
    count: 1592
    ratio: 375
    origin: english
    type: Patronymic
    meaning: "Son of Thom, a short form of Thomas. Thompson sits high in Wyoming because it overlaps English, Scottish, and Scandinavian naming patterns, including families whose original name was closer to Thomson or Thomsen."

  - rank: 13
    name: Martinez
    count: 1447
    ratio: 412
    origin: spanish
    type: Patronymic
    meaning: "Son of Martín, from Latin 'Martinus', connected to Mars. Martinez is Wyoming's highest-ranking Spanish surname, tied to Hispanic families in the broader Rocky Mountain region and to work in agriculture, railroads, coal, and energy towns."

  - rank: 14
    name: Martin
    count: 1431
    ratio: 417
    origin: french
    type: Patronymic
    meaning: "From Latin 'Martinus', of Mars. Martin in Wyoming can be English, French, Irish, or German in family history, which helps explain why it ranks just behind the Spanish patronymic Martinez."

  - rank: 15
    name: Peterson
    count: 1415
    ratio: 421
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Peter, from Greek 'Petros' (rock). Peterson is a signature Intermountain West surname, especially in communities influenced by Scandinavian converts to the LDS Church and northern Plains migration."

  - rank: 16
    name: Thomas
    count: 1219
    ratio: 489
    origin: english
    type: Patronymic
    meaning: "From Aramaic 'Toma', meaning twin. Thomas came west as a fully national surname, carried by English, Welsh, and American-born families into Wyoming's county towns and ranch districts."

  - rank: 17
    name: Baker
    count: 1142
    ratio: 522
    origin: english
    type: Occupational
    meaning: "A bread baker, from Old English 'baecere'. Baker is one of the practical trade names in Wyoming's top 20, a reminder that common surnames often preserve medieval occupations rather than local frontier jobs."

  - rank: 18
    name: Allen
    count: 1120
    ratio: 532
    origin: english
    type: Patronymic
    meaning: "From the personal name Alan, possibly Celtic in origin and often glossed as little rock or harmony. Allen arrived in Wyoming through many American migration routes, which makes it common without being tied to one county or ethnic settlement."

  - rank: 19
    name: Roberts
    count: 1082
    ratio: 551
    origin: english
    type: Patronymic
    meaning: "Son of Robert, from a Germanic name meaning bright fame. Roberts is strongly Welsh and English in American use, matching the older Anglo-American stream that supplied many Wyoming ranching and town families."

  - rank: 20
    name: Hill
    count: 1077
    ratio: 554
    origin: english
    type: Habitational
    meaning: "A person who lived by or on a hill, from Old English 'hyll'. Hill is a landscape surname that reads naturally in Wyoming, but its meaning comes from medieval England rather than the state's mountains and basins."

unique_surnames:
  - name: Legerski
    state_rank: 253
    national_rank: 65593
    origin: polish
    why: "Forebears counts 250 people named Legerski in Wyoming and reports that most U.S. bearers of the name are in the state. Its visibility fits the Polish thread in Wyoming coal communities, especially in Sheridan and Rock Springs area mining history."

  - name: Vigil
    state_rank: 115
    national_rank: 1329
    origin: spanish
    why: "Vigil ranks only 115th in Wyoming, but it is far more concentrated here than many nationally common surnames. The name points toward Hispanic family networks reaching north from New Mexico and Colorado into Wyoming's agricultural, railroad, and energy towns."

  - name: Allred
    state_rank: 236
    national_rank: 1738
    origin: english
    why: "Allred is not a top-100 Wyoming surname, but it appears strongly enough to mark LDS-linked settlement in western Wyoming. Star Valley and the Big Horn Basin both drew Latter-day Saint families from Utah and Idaho in the late 19th and early 20th centuries."

  - name: Christensen
    state_rank: 44
    national_rank: 372
    origin: danish
    why: "Christensen sits just outside Wyoming's top 40 while ranking much lower nationally. Its Danish patronymic form reflects Scandinavian migration into LDS and northern Plains communities."

  - name: Hansen
    state_rank: 28
    national_rank: 174
    origin: scandinavian
    why: "Hansen ranks 28th in Wyoming, well above its national rank. The name is a compact clue to Danish and Norwegian settlement patterns that also lift Jensen, Larson, Petersen, and Rasmussen in the state list."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Five of Wyoming's top 20 are occupational names: Smith, Miller, Clark, Taylor, and Baker. Their meanings come from medieval trades, but in Wyoming they spread through ranching towns, railroad stops, county seats, and mining camps rather than through the original jobs alone."
    examples:
      - Smith (metalworker)
      - Miller (grain mill worker)
      - Clark (clerk or cleric)
      - Baker (bread baker)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Wyoming's ranking, from Johnson and Anderson to Martinez, Peterson, Thomas, and Roberts. The pattern is especially northern European: English '-son' names overlap with Scandinavian forms, which is why Johnson, Anderson, Nelson, Thompson, and Peterson all rank high."
    examples:
      - Johnson (son of John)
      - Anderson (son of Andrew)
      - Martinez (son of Martin)
      - Peterson (son of Peter)

  - type: Habitational Names
    icon: fa-solid fa-map-location-dot
    description: "Hill is the only clearly habitational surname in Wyoming's top 20, but place and landscape names become more visible farther down the list. Names such as Wood, Wells, Mills, and Berg show how English and northern European place-based surnames survived westward migration."
    examples:
      - Hill (near a hill)
      - Wood (near a wood)
      - Wells (near a spring or well)

faq:
  - question: "What are the most common last names in Wyoming?"
    answer: "The most common last names in Wyoming are Smith, Johnson, Miller, Anderson, and Brown. In the Forebears ranking, Smith leads with 4,706 bearers, followed by Johnson with 4,331 and Miller with 3,323."

  - question: "Why are Scandinavian last names so common in Wyoming?"
    answer: "Scandinavian last names are common in Wyoming because Danish, Norwegian, and Swedish families moved through the northern Plains and the Intermountain West, including LDS settlements in places such as Star Valley and the Big Horn Basin. That history helps explain high-ranking names such as Johnson, Anderson, Nelson, Peterson, Hansen, Jensen, Christensen, and Larson."

