hero_image_caption: The striped bass is Virginia's state saltwater fish and is common in the Chesapeake Bay. Photo by PlanespotterA320, CC BY-SA 4.0.
intro_text: Virginia's state saltwater fish is the striped bass, a silvery fish with dark stripes, adopted in 2011. Many people in Virginia call it rockfish. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Saltwater Fish of Virginia?
  paragraphs:
  - The striped bass is the official saltwater fish of Virginia. The Virginia General Assembly gave it this title in 2011.
  - Its scientific name is Morone saxatilis. Virginia's state freshwater fish is the brook trout.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Striped Bass
  paragraphs:
  - The striped bass has a long, streamlined body. Several bold black stripes run along each side from the gill cover to the tail.
  - Its back is dark olive, its sides are silvery and its belly is white. Some fish have a shiny purple or bluish tint along the back and fins.
  - In Virginia's tidal rivers, striped bass can grow longer than 5 feet. They can live up to 30 years.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Saltwater Fish
  paragraphs:
  - In 2011, a state senator from Newport News introduced a bill to make the striped bass Virginia's state saltwater fish.
  - The bill passed both houses of the General Assembly and the governor signed it. In the same year, the brook trout's title was changed to state freshwater fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Virginia Chose the Striped Bass
  paragraphs:
  - Official sources name the striped bass without giving a detailed reason. The fish is native to Virginia's coastal waters, and the Chesapeake Bay is well known for its striped bass.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Striped Bass
  paragraphs:
  - Striped bass are native to the Chesapeake Bay, the Atlantic Ocean and rivers that flow into the bay and into Albemarle Sound. They spend most of their adult lives in salt water but swim up rivers into fresh water to spawn.
  - The state has also stocked striped bass in many freshwater lakes across Virginia. Look for them in schools near channel edges, sandy flats and underwater grass beds.
