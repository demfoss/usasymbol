seo_title: Virginia State Saltwater Fish | Striped Bass
seo_description: The Virginia state saltwater fish is the striped bass, adopted in 2011. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/virginia/virginia-fish-saltwater-hero.webp
