- id: facts
  icon: fa-solid fa-lightbulb
  title: Striped Bass Facts
  facts:
  - Adopted in 2011 by the Virginia General Assembly.
  - Its scientific name is Morone saxatilis.
  - Many people in Virginia call it rockfish.
  - Can grow longer than 5 feet in Virginia's tidal rivers.
  - Can live up to 30 years.
faq:
- question: What is Virginia's state fish?
  answer: Virginia's state saltwater fish is the striped bass. The state freshwater fish is the brook trout.
- question: When did Virginia adopt the Striped bass?
  answer: The Virginia General Assembly made the striped bass the state saltwater fish in 2011.
- question: Why did Virginia choose the Striped bass?
  answer: Official sources do not give a detailed reason. The striped bass is native to Virginia's coast, and the Chesapeake Bay is famous for it.
- question: Why is the striped bass called rockfish in Virginia?
  answer: Rockfish is a common local nickname for the striped bass in Virginia and around the Chesapeake Bay. Some people also call it striper or linesider.
- question: Does the striped bass live in fresh water or salt water?
  answer: It lives in both. Adults spend most of their lives in salt water and swim up rivers into fresh water to spawn. Some striped bass also live in Virginia's freshwater lakes.
