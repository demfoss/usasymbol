        note: "Common stream habitat in Virginia"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Red Salamander Facts
    facts:
      - "Adopted in 2018 by the Virginia General Assembly."
      - "Chosen after an effort led by students to name a state amphibian."
      - "Bright orange-red skin with black spots and yellow eyes."
