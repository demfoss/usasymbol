seo_title: "Virginia State Amphibian | Red Salamander"
seo_description: "Virginia's state amphibian is the red salamander, adopted in 2018. Learn what it looks like and why it became official."
hero_image: /images/amphibians/virginia/virginia-state-amphibian-hero.webp
hero_image_alt: "A bright orange-red salamander with black spots on damp forest ground."
hero_image_caption: "The red salamander, Virginia's state amphibian, is known for its bright reddish-orange color."
intro_text: "Virginia's state amphibian is the red salamander, a bright orange-red salamander found in streams and springs across the state, adopted in 2018. This profile appears in the [list of U.S. state amphibians](/symbols/amphibians)."

sections:
  - id: overview
    icon: fa-solid fa-frog
    title: What Is the State Amphibian of Virginia?
    paragraphs:
      - "The red salamander is Virginia's official state amphibian, designated by the Virginia General Assembly in 2018. Its scientific name is Pseudotriton ruber."
      - "It is a stream-dwelling salamander found across most of Virginia, from the mountains to the coastal plain."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Red Salamander
    paragraphs:
      - "The red salamander has bright orange-red to reddish-brown skin covered in irregular black spots, with a stout body and short legs."
      - "It grows to about 4 to 7 inches long and has small eyes with yellow irises."
      - "It lives near clean springs, seeps, and small streams, hiding under rocks and logs during the day."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Amphibian
    paragraphs:
      - "The Virginia General Assembly designated the red salamander the official state amphibian in 2018, following an effort led by students to give Virginia an official state amphibian."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Virginia Chose the Red Salamander
    paragraphs:
      - "The red salamander was chosen for its bright, easily recognized coloring and because it is found throughout Virginia, from the mountains to the coast, making it a fitting statewide symbol."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Red Salamander
    paragraphs:
      - "Red salamanders live near clean, cool springs and streams throughout Virginia, including the Blue Ridge Mountains and the Piedmont region."
    sites:
      - name: Shenandoah Valley streams
        city: Staunton
        lat: 38.15
