seo_title: "Virginia State Flower | Dogwood"
seo_description: "The Dogwood became Virginia's state flower in 1918. These white-bloomed trees display showy flowers across Virginia forests and gardens each spring creating spectacular displays."

intro_text: "Since 1918, the Dogwood has served as Virginia's state flower. White four-petaled blooms cover small trees reaching 15 to 30 feet tall. These native flowering trees bloom across Virginia forests, woodlands, and gardens from April through May, and are featured in the [U.S. state flowers collection](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Virginia State Flower?"
    paragraphs:
      - "Official since 1918, the Dogwood represents Virginia. Each bloom displays four white petal-like bracts surrounding a cluster of tiny yellow-green flowers. The bracts measure 2 to 4 inches across. Trees grow 15 to 30 feet tall with spreading branches. Smooth gray bark develops blocky patterns on mature trunks. Oval leaves turn red to purple in autumn."
      - "Dogwoods bloom from mid-April through May across Virginia. Peak flowering occurs in late April throughout most regions. The Blue Ridge Mountains, Shenandoah Valley, and Piedmont region showcase abundant displays. Individual blooms last two to three weeks. Trees prefer partial shade and moist well-drained soil. Understory positions in deciduous forests suit dogwoods naturally."
      - "Native dogwood populations grow wild throughout Virginia in forests, woodland edges, and stream banks. The trees thrive in acidic soil common across the state. Birds eat the bright red berries that form in fall. White-tailed deer browse twigs and foliage. Dogwoods provide important food and habitat for Virginia wildlife throughout the year."

  - id: name
    icon: "fa-solid fa-tag"
    title: "What Is Virginia's State Flower Called?"
    paragraphs:
      - "Virginia's state flower goes by the common name Dogwood, scientifically classified as Cornus florida. The plant belongs to the Cornaceae family. This family includes about 85 species of shrubs and small trees found primarily in temperate regions."
      - "The genus name Cornus comes from the Latin word for horn. The hard dense wood resembles horn in strength and texture. The species name florida means flowering or blooming in Latin. Early colonists used the term to describe the tree's spectacular spring display."
      - "The common name dogwood has uncertain origins. Some sources suggest it comes from dagwood, referring to the wood's use for making sharp skewers called dags. Others trace it to European dogberry trees with similar bark. Regional names include flowering dogwood and American dogwood to distinguish it from Asian species."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Dogwood Became the Virginia State Flower"
    paragraphs:
      - "In 1918, Virginia chose the Dogwood as its state flower following a campaign by garden clubs and women's organizations. The General Assembly passed legislation establishing the dogwood blossom as Virginia's floral emblem. School children across Virginia had participated in informal voting that showed strong support for the dogwood."
      - "Dogwood trees bloomed abundantly throughout Virginia each spring. The white flowers appeared across forests from the mountains to the Tidewater region. Thomas Jefferson planted dogwoods at Monticello. George Washington transplanted wild dogwoods to Mount Vernon. The tree connected deeply to Virginia's colonial heritage and natural landscape, later formalized in [Virginia's state tree designation](/states/virginia/tree/flowering-dogwood)."
      - "The flower represented Virginia's beauty and natural resources. Artists featured dogwood blooms in paintings and photographs. The trees grew naturally in nearly every Virginia county. Their spring display attracted attention from residents and visitors alike. Virginia became the first state to designate a tree flower rather than a herbaceous plant as its official emblem, aligning with themes in [the Old Dominion nickname](/states/virginia/nickname/the-old-dominion)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Quick Facts About Virginia's State Flower"
    facts:
      - "Virginia designated the Dogwood blossom on March 6, 1918, becoming the first state to choose a tree flower rather than a herbaceous wildflower"
      - "What appears as four white petals are actually modified leaves called bracts, while the true flowers form the small yellow-green cluster at the center"
      - "Dogwood trees produce bright red berries in fall that provide essential food for over 35 species of birds including cardinals, blue jays, and mockingbirds"
      - "The dense hard wood was historically used to make shuttles for weaving, tool handles, and golf club heads because it resists splitting"
      - "Both Thomas Jefferson at Monticello and George Washington at Mount Vernon planted dogwood trees in their landscapes, valuing the species for its beauty"
      - "Dogwood anthracnose, a fungal disease first identified in the 1970s, has significantly reduced native dogwood populations across Virginia's forests"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Virginia State Flower and Bird"
    paragraphs:
      - "The [Northern Cardinal](/states/virginia/bird/northern-cardinal) serves as Virginia's state bird, a brilliant red songbird common in gardens and woodlands year-round. Both symbols represent Virginia officially. Virginia adopted the Dogwood in 1918, while the Northern Cardinal became state bird in 1950."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Dogwood Symbolizes"
    paragraphs:
      - "The Dogwood is often associated with Virginia's natural beauty, resilience, and historical heritage. The flower has been linked to durability and strength despite its delicate appearance, reflecting the tree's hard wood and ability to thrive in forest understories. Its white blooms traditionally symbolize purity and renewal while carrying connotations of Virginia's spring landscapes and colonial gardens at Mount Vernon and Monticello, as well as civic symbolism on [Virginia's flag and seal](/states/virginia/flag/virginia-state-flag)."

faq:
  - question: "What is the Virginia state flower?"
    answer: "The Virginia state flower is the Dogwood blossom from the flowering dogwood tree. These white four-petaled blooms appear on small native trees that grow 15 to 30 feet tall throughout Virginia forests and gardens."
  
  - question: "When was the Dogwood adopted as Virginia's state flower?"
    answer: "Virginia adopted the Dogwood blossom on March 6, 1918. The General Assembly passed this designation following campaigns by garden clubs and informal voting among school children that showed strong support for the dogwood."
  
  - question: "Why did Virginia choose the Dogwood?"
    answer: "Virginia chose the Dogwood because the trees bloomed abundantly across the state each spring and connected to Virginia's colonial heritage. Thomas Jefferson and George Washington both planted dogwoods on their estates. The white flowers appeared naturally in nearly every Virginia county from mountains to coast."
  
  - question: "Is the dogwood native to Virginia?"
    answer: "Yes, the flowering dogwood is native to Virginia. The trees grow wild throughout Virginia forests, woodland edges, and stream banks. They thrive in the acidic soil common across the state and provide important habitat for wildlife."
  
  - question: "Are the white parts of dogwood flowers actually petals?"
    answer: "No, the white parts are modified leaves called bracts, not true petals. The actual flowers form the small yellow-green cluster at the center. These tiny true flowers bloom surrounded by the four showy white bracts."

