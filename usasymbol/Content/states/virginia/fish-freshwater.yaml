intro_text: Virginia's state freshwater fish is the brook trout, a colorful native trout of cold mountain streams. It was named the state freshwater fish in 2011. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Freshwater Fish of Virginia?
  paragraphs:
  - The brook trout is the official freshwater fish of Virginia. State lawmakers gave it this title in 2011. Its scientific name is Salvelinus fontinalis.
  - Virginia also has a state saltwater fish, which is the striped bass.
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Brook Trout
  paragraphs:
  - The brook trout has a dark olive body covered with pale spots. Wavy, worm-like lines run along its back.
  - Small red spots dot its sides, and many of them are circled by a blue ring. Its lower fins are red-orange with bright white front edges, which makes it easy to tell apart from other trout.
  - In Virginia, most brook trout are 6 to 12 inches long. They usually live about 3 to 4 years.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Freshwater Fish
  paragraphs:
  - The Virginia General Assembly first named the brook trout the state fish in 1993.
  - In 2011, state law listed it as the official freshwater fish. Its new title set it apart from the state saltwater fish.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Virginia Chose the Brook Trout
  paragraphs:
  - Official sources name the brook trout without giving a detailed reason. The brook trout is the only trout species native to Virginia.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Brook Trout
  paragraphs:
  - Brook trout need clean, cold water. In Virginia, they live in high mountain streams in the Blue Ridge and the Alleghany Plateau in the western and southwestern parts of the state.
  - Wild brook trout live in more than 600 Virginia streams, adding up to more than 2,000 miles of water. Shenandoah National Park has many brook trout streams, including the North Fork of the Moormans River.
- id: facts
  icon: fa-solid fa-lightbulb
  title: Brook Trout Facts
  facts:
  - Named the state freshwater fish in 2011 by the Virginia Legislature, after first becoming the state fish in 1993.
  - Its scientific name is Salvelinus fontinalis.
  - It is the only trout native to Virginia.
  - Brook trout make up about 80 percent of Virginia's wild trout.
  - Virginia has more native brook trout streams than all other southeastern states combined.
faq:
- question: What is Virginia's state fish?
  answer: Virginia's state freshwater fish is the brook trout. The state saltwater fish is the striped bass.
- question: When did Virginia adopt the Brook trout?
  answer: The brook trout first became Virginia's state fish in 1993. State law named it the official freshwater fish in 2011.
- question: Why did Virginia choose the Brook trout?
  answer: Official sources do not give a detailed reason. The brook trout is the only trout native to Virginia.
- question: Is the brook trout native to Virginia?
  answer: Yes. The brook trout has lived in Virginia's cold mountain streams since the end of the last ice age. Rainbow trout and brown trout were brought in by people.
- question: How can you tell a brook trout from other trout?
  answer: Look for wavy, worm-like lines on its back and red spots circled in blue. Its lower fins are red-orange with white front edges.
