name: Great Seal of Virginia
adopted_year: 1776
is_official: true
legislation: Va. Code Ann. § 1-500
meaning: "The Great Seal of Virginia makes an argument rather than a description: Virtus, a Roman warrior goddess, stands over a fallen tyrant under the motto 'Sic Semper Tyrannis' (Thus Always to Tyrants). Designed in June 1776, weeks before the Declaration of Independence, the seal was a statement about what had just happened and what always happens to tyranny."
