hero_image_caption: The Great Seal of Virginia (obverse), adopted by the Virginia Convention in 1776. Virtus stands in Roman armor over a prostrate tyrant whose crown has fallen. The motto reads "Sic Semper Tyrannis," meaning Thus Always to Tyrants.
intro_text: "Virginia's state seal shows Virtus, a Roman warrior goddess, standing over a defeated tyrant whose crown has fallen to the ground, under the motto 'Sic Semper Tyrannis' (Thus Always to Tyrants). The seal was designed in June 1776, weeks before the Declaration of Independence, making it one of the oldest state seals in the country."
