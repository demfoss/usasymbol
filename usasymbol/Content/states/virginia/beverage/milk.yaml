seo_title: 'Virginia State Beverage: Milk, Designated 1982'
seo_description: Virginia's official state beverage is milk, designated in 1982 and codified in the Code of Virginia. Learn why Senator Virgil Goode pushed the measure, what Franklin County's dairy industry had to do with it, and how Virginia's choice compares to other states.
intro_text: Virginia's official state beverage is **milk**, designated in **1982** and codified in the Code of Virginia. The push came from state Senator Virgil Goode and was tied directly to the dairy heritage of Franklin County in the state's southwestern corner — making this one of the more grounded state beverage designations on record, not a feel-good gesture but a specific agricultural argument that cleared the full General Assembly.
