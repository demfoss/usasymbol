sections:
- id: adoption
  icon: fa-solid fa-landmark
  title: 'Virginia''s Official State Beverage: The 1982 Designation'
  paragraphs:
  - The Virginia General Assembly designated milk as the official state beverage in 1982. It is written into the [Code of Virginia](https://law.lis.virginia.gov/vacode) — not a one-session resolution, not a governor's proclamation. It carries the same formal standing as the state bird or the state tree, and it has not been revisited or modified since.
  - State beverage designations are more deliberate than they look. Legislatures choose them selectively, and when one passes it usually means someone made a sustained political case for it. In Virginia's case, that someone was Virgil Goode, and the case rested on Franklin County.
- id: why-milk
  icon: fa-solid fa-cow
  title: Virginia's Dairy Heritage and Why Milk Made Sense
  paragraphs:
  - Virginia's dairy industry is concentrated in the Shenandoah Valley and the southwestern plateau — the kind of territory where farms are multigenerational and the county fair still draws a working crowd. Franklin County, wedged between the Blue Ridge and the North Carolina line, was one of the more productive dairy regions in the state when the legislation passed.
  - 'Virginia already had [state symbols](/states/virginia) for its natural world — a bird, a flower, a tree. Agricultural production is harder to pin to a single species. Milk was the legislature''s way of naming an economic reality: not a single farm or a single county but a system of production that had run through the state for generations. The designation said what the other symbols could not.'
- id: virgil-goode
  icon: fa-solid fa-person
  title: Senator Virgil Goode and the Franklin County Connection
  paragraphs:
  - Virgil Goode represented a district anchored in Franklin County, in southwestern Virginia. That geography gave the bill both its rationale and its credibility. Franklin County sits in a part of the state where dairy farming was culturally embedded — not just an industry line item but a way the region identified itself. Goode did not need to make a nutritional argument or a marketing pitch. He made a local one.
  - The designation was not a statewide lobbying push from a dairy trade group. It had a specific county behind it, a specific senator carrying it, and a legislative record that tied the two together. Goode later moved to Congress, representing Virginia's fifth congressional district in the U.S. House. But the milk designation came first, in 1982, when he was a state senator turning a regional identity into official Virginia law.
- id: common-question
  icon: fa-solid fa-circle-question
  title: 'Milk as State Beverage: Virginia Among 20 States'
  paragraphs:
  - 'Milk is the most common state beverage in the country — twenty states have chosen it, Virginia included. The political logic is consistent: dairy farming crosses regional lines, and milk carries no controversy. It does not name a brand, a region, or an alcohol category. For a legislature looking to acknowledge agriculture without picking a fight, it is a reliable choice.'
  - But common does not mean identical. Wisconsin's designation is inseparable from a state identity built almost entirely on cheese and dairy co-ops. California's tracks the scale of the Central Valley's industrial dairy operations. Virginia's tracks a specific southwestern county and a specific senator. The symbol is shared; the story is not. The full [state beverages list](/symbols/beverages) shows how differently the same choice can read across fifty states.
faq:
- question: What is Virginia's state beverage?
  answer: Virginia's official state beverage is milk, designated in 1982 and codified in the Code of Virginia.
- question: Who sponsored Virginia's state beverage legislation?
  answer: State Senator Virgil Goode sponsored the measure. Goode represented a district centered on Franklin County, a southwestern Virginia region with a strong dairy farming heritage. He later served in the U.S. House of Representatives.
- question: Why did Virginia choose milk as its state beverage?
  answer: The designation was rooted in the dairy farming heritage of Franklin County and the surrounding southwestern Virginia region. Senator Virgil Goode championed the bill, framing it as recognition of an agricultural identity that had defined that part of the state for generations.
- question: Is Virginia's state beverage designation legally official?
  answer: Yes. Milk is codified in the Code of Virginia as the official state beverage — not a resolution or gubernatorial proclamation. It has the same standing as other official Virginia state symbols.
- question: How many states have milk as their state beverage?
  answer: Twenty states have designated milk as their official state beverage, including Virginia. It is the most common state beverage choice in the country.
- question: When did Virginia designate milk as its state beverage?
  answer: Virginia designated milk as the official state beverage in 1982.
