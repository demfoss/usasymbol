sections:
- id: designation
  icon: fa-solid fa-landmark
  title: What Virginia's State Spirit Designation Actually Named
  paragraphs:
  - "The legislature did not name a category — rye whiskey, Virginia whiskey, American whiskey. It named a product: the whiskey produced at George Washington's restored distillery at Mount Vernon, made from his documented 18th-century recipe. That specificity is the point. The designation sits in [Virginia's official symbol list](/states/virginia) alongside the state bird and the state tree — codified, not commemorative."
- id: why-this-spirit
  icon: fa-solid fa-bullseye
  title: How Washington Became America's Largest Whiskey Producer
  paragraphs:
  - George Washington began distilling at Mount Vernon in 1797, on the recommendation of his Scottish farm manager James Anderson, who recognized that the estate's grain surplus and water supply made it well-suited to whiskey production. Within two years, the operation had scaled to approximately 11,000 gallons annually — making Washington, at that moment, one of the largest whiskey producers in the United States.
  - 'This was not a founder who happened to own land in Virginia. It was an active, commercially significant operation that Washington tracked in his own account books — production volumes, grain purchases, revenue. The distillery ran until 1814, then went dark for nearly two centuries. When the Virginia General Assembly acted in 2017, it was staking a claim on something real: a specific site, a documented process, a producer whose output dwarfed most of his contemporaries.'
- id: mount-vernon
  icon: fa-solid fa-warehouse
  title: How Mount Vernon Rebuilt Washington's Distillery
  paragraphs:
  - Mount Vernon reconstructed Washington's distillery to full operational capacity in 2007, using archaeological evidence from the original site and period documentation to rebuild the structure and its equipment. The restored operation uses a water-powered gristmill — also reconstructed on the grounds — to mill the grain before distilling, following 18th-century methods as closely as surviving records allow.
  - The whiskey produced there is unaged in the style Washington made — clear, sharp, and heavier on rye than most American whiskeys today. Mount Vernon also produces a limited aged version. For current production details, Mount Vernon's distillery materials remain the authoritative source.
- id: recipe
  icon: fa-solid fa-wheat-awn
  title: 'George Washington''s Rye Whiskey Grain Bill: 60% Rye, 35% Corn, 5% Barley'
  paragraphs:
  - Washington's documented recipe calls for **60% rye, 35% corn, and 5% malted barley**. That grain bill makes it rye-dominant by a significant margin — rye-forward in a way that predates the corn-heavy bourbon tradition that came to define American whiskey in the 19th century. The malted barley drives fermentation; the corn rounds out the rye's edge.
  - The recipe is not a reconstruction or an approximation. Mount Vernon's distillers work from Washington's farm records, which logged grain purchases, mash proportions, and production volumes with the same precision Washington applied to his military logistics. The grain bill has not been adjusted for modern palates or commercial appeal.
- id: availability
  icon: fa-solid fa-store
  title: Where to Buy George Washington's Rye Whiskey
  paragraphs:
  - The whiskey is sold exclusively on-site at Mount Vernon in Fairfax County, Virginia — not through retail liquor distribution. Visitors can purchase both the unaged and the limited aged versions at the estate shop while supplies last. Stock is not guaranteed; production quantities are small.
  - The Virginia state spirit is, in practice, one of the harder official state symbols to obtain — by design rather than by accident.
timeline:
- year: '1797'
  description: George Washington begins distilling at Mount Vernon on the recommendation of farm manager James Anderson.
- year: '1799'
  description: Washington's distillery produces approximately 11,000 gallons annually — among the highest output of any producer in the United States at the time.
- year: '1814'
  description: The distillery ceases operation. The site falls into disuse for nearly two centuries.
- year: '2007'
  description: Mount Vernon opens the fully reconstructed distillery, rebuilt from archaeological evidence and period records. Small-batch whiskey production resumes.
- year: '2017'
  description: Virginia General Assembly designates George Washington's Rye Whiskey as the official state spirit on March 16. Sponsored by Senator Adam Ebbin, signed by Governor Terry McAuliffe.
faq:
- question: What is Virginia's official state spirit?
  answer: Virginia's official state spirit is George Washington's Rye Whiskey, designated on March 16, 2017 by the Virginia General Assembly.
- question: When did Virginia designate its state spirit?
  answer: March 16, 2017. Sponsored by Senator Adam Ebbin, signed by Governor Terry McAuliffe.
- question: What is the recipe for George Washington's Rye Whiskey?
  answer: Washington's farm records call for 60% rye, 35% corn, and 5% malted barley. Mount Vernon produces the whiskey from this grain bill without modification.
- question: Where is George Washington's Rye Whiskey made?
  answer: At the reconstructed distillery at Mount Vernon in Fairfax County, Virginia, rebuilt in 2007 from archaeological evidence and period records.
- question: Can you buy George Washington's Rye Whiskey?
  answer: Only on-site at Mount Vernon. It is not sold through retail distribution. Both unaged and limited aged versions are available at the estate shop while supplies last.
- question: Why did Virginia choose George Washington's Rye Whiskey as its state spirit?
  answer: Because Washington ran one of the largest whiskey operations in the United States from Mount Vernon — producing around 11,000 gallons a year by 1799. The designation recognized both that documented history and the fact that the distillery is still producing in Virginia today.
- question: Does Virginia have an official state beverage as well?
  answer: Yes. Virginia's official state beverage is milk, designated in 1982. The state spirit and state beverage are separate designations.
