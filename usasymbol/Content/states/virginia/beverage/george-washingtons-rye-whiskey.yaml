seo_title: "Virginia State Spirit | George Washington's Rye Whiskey"
seo_description: "Virginia named George Washington's Rye Whiskey its state spirit in 2017, tying the symbol to Mount Vernon's distillery."
intro_text: Virginia's official state spirit is **George Washington's Rye Whiskey**, designated on **March 16, 2017** by the Virginia General Assembly. The choice was not a branding exercise. It was a direct acknowledgment that the most famous Virginian in American history ran one of the most productive whiskey operations of his era — and that the distillery at Mount Vernon is still running today, producing from his original recipe. This profile appears in the [list of U.S. state beverages](/symbols/beverages).
