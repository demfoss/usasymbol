title: "Virginia State Bat | Virginia Big-Eared Bat"
scientific_name: "Corynorhinus townsendii virginianus"
adopted_year: 2005

seo_title: "Virginia State Bat | Virginia Big-Eared Bat"
seo_description: "Virginia's state bat is the Virginia Big-Eared Bat, adopted in 2005. Learn why this official Virginia symbol was chosen and what it represents."

intro_text: "The Virginia Big-Eared Bat is the official Virginia state bat, designated in 2005. This page gives the direct answer for searches like 'virginia state bat', 'virginia state animal', and 'virginia state mammal' while explaining how the symbol fits the state's official animal designations. Ears exceeding one inch long on four-inch body; federally endangered status; cave conservation symbol; possible natural immunity to White Nose Syndrome fungus."

common_name: "Virginia Big-Eared Bat"
official_since: "2005"
status: "Federally endangered since 1979; state endangered; approximately 20,000 individuals remain, most in West Virginia; population increased 30% from 2008 to 2018"
habitat_in_state: "Limestone caves exclusively in Highland, Bland, and Tazewell counties; requires specific microclimates with cool hibernation caves and warmer maternity colony caves"
known_for: "Ears exceeding one inch long on four-inch body; federally endangered status; cave conservation symbol; possible natural immunity to White Nose Syndrome fungus"

size: "3.5 to 4.5 inches total body length; wingspan 11 to 12 inches"
weight: "0.25 to 0.5 ounces (7 to 12 grams); very lightweight for body size"
coloration: "Light to dark brown fur depending on age; long, soft fur uniform from base to tip; lighter colored belly"
distinctive_traits: "Exceptionally large ears exceeding 1 inch (2.5 cm) length, reaching halfway down body when at rest; ears curl backward during hibernation; globular-shaped muzzle with elongated nostrils; pinkish wing membranes"

habitat: "Obligate cave-dweller requiring undisturbed limestone karst systems year-round; cool stable caves for winter hibernation, warmer cave rooms for summer maternity colonies"
range_in_state: "Isolated populations in western Virginia mountains (Highland, Bland, Tazewell counties); part of broader range including West Virginia, Kentucky, North Carolina"
conservation_status: "Federally endangered (1979); state endangered; critical habitat designated; most population hibernates in single West Virginia cave (Hellhole); three known maternity colonies in Virginia"
where_to_find: "Not publicly accessible due to disturbance threats; caves gated to protect hibernating and breeding colonies; educational programs at Virginia Cave Board and natural heritage centers"
symbol_connections: "Represents underground natural heritage parallel to cardinal (above-ground wildlife); cave conservation tied to Virginia's limestone karst geology; protection values reflect state motto's defense of natural rights"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Virginia Legislature designated the Virginia big-eared bat as the official state bat when Governor Mark Warner signed House Bill 2579 on March 22, 2005, with the designation becoming effective July 1, 2005. The bill received unanimous support after passing the House Committee on General Laws and approval by both the House of Delegates and the Senate."
      - "Virginia joined Texas (1995) and preceded Oklahoma (2006) in recognizing bats as official state symbols. The designation created educational opportunities for explaining cave ecosystems, endangered species protection, and the specialized adaptations required for underground life in Virginia's limestone karst regions, while complementing public-facing state symbols."
    
    subsections:
      - subtitle: "Virginia Cave Board's Educational Initiative"
        text: "The Virginia Cave Board conceived the state bat idea as an educational tool for teaching Virginians about caves and cave-dwelling creatures. Board member Clair Ward explained that the Virginia big-eared bat made an ideal candidate because its name directly connects to the Commonwealth and its federally endangered status highlights conservation urgency. The Cave Board, formed by legislative act in 1979, carries responsibilities for protecting rare minerals, archaeological resources, cave life, groundwater flow, and unique cave characteristics throughout Virginia. The state bat designation extended the Board's educational mission by creating a recognizable symbol for broader public engagement with cave conservation issues and by reinforcing statewide identity themes associated with [the Old Dominion](/states/virginia/nickname/the-old-dominion)."
      
      - subtitle: "Delegate Jackie T. Stump's Sponsorship"
        text: "Delegate Jackie T. Stump filed House Bill 2579 on January 12, 2005, initiating the legislative process for bat designation. The bill moved efficiently through the legislative calendar, receiving first reading in the House of Delegates on January 26, 2005, and gaining approval from both chambers by February 26. On that date, both the Speaker of the House and the President of the Senate signed the bill, sending it to Governor Warner for final approval. The swift passage reflected legislators' recognition that designating an endangered species as a state symbol could raise conservation awareness without controversial policy implications or fiscal impact."
      
      - subtitle: "Governor Warner's Humorous Signing Statement"
        text: "Governor Mark Warner signed the state bat legislation with characteristic humor, composing a poem acknowledging Virginia's growing collection of official symbols. His signing statement noted existing designations for state bird (northern cardinal), flower and tree (dogwood), dog (American foxhound), boat (Chesapeake Bay deadrise), dance (square dance), insect (tiger swallowtail butterfly), fish (brook trout), shell (oyster), fossil (Chesapecten jeffersonius), and beverage (milk). Warner wrote: 'Therefore, I see no harm in designating a state bat, no matter how odd-looking the Virginia Big-Eared bat might be.' His poem included the lines: 'We have a state dog and a fish and a bird / And of the fossil I'm sure you have heard / So why not a bat? / What's wrong with that? / The state beverage is no more absurd.' Warner concluded by referencing Batman, suggesting: 'I think our bat's up to the test / If you doubt it, just ask Adam West.' This lighthearted approach humanized environmental legislation and generated media attention for cave conservation."

  - id: "state-symbolism"
    icon: "fa-mountain"
    title: "What the Virginia Big-Eared Bat Represents"
    style: "highlight"
    paragraphs:
      - "The Virginia big-eared bat embodies Virginia's underground natural heritage, representing the hidden ecosystems within limestone mountains that most Virginians never see. Cave systems create unique habitats supporting specialized species adapted to darkness, stable temperatures, and isolation from surface conditions."
      - "Designating an endangered species as state bat acknowledges Virginia's responsibility for protecting declining wildlife populations. The Commonwealth made a deliberate choice selecting a bat requiring active conservation rather than a common, secure species, signaling that official symbols can advance environmental protection alongside cultural identity and values represented in [Sic Semper Tyrannis](/states/virginia/motto/sic-semper-tyrannis)."
      - "The bat's survival depends entirely on undisturbed caves, connecting its fate to human behavior and land management decisions. Every person entering a hibernation cave potentially threatens the species by forcing bats awake and depleting stored energy reserves necessary for winter survival when no insects fly."
    
    subsections:
      - subtitle: "Symbol of Cave Conservation"
        text: "Virginia possesses extensive limestone cave systems formed over millions of years through groundwater dissolving bedrock in the Appalachian Mountains. These caves support unique ecosystems including blind fish, cave crickets, salamanders, and multiple bat species that evolved specialized adaptations for subterranean existence. The Virginia big-eared bat designation draws attention to cave protection urgency and the fragility of underground habitats vulnerable to human disturbance, groundwater pollution, and development impacts. Protecting this bat requires protecting entire cave ecosystems including surrounding forests where bats forage, maintaining groundwater quality, and preventing disturbance during critical hibernation and maternity periods. The symbolic designation translates abstract conservation concepts into concern for a specific, named species Virginians can visualize and value."
      
      - subtitle: "Endangered Species as State Symbol"
        text: "Most state animals represent abundant, successful species celebrating regional wildlife. Virginia chose differently by designating a bat listed as federally endangered since 1979, with fewer than 20,000 individuals remaining and most population concentrated in a single West Virginia cave. This choice acknowledges that state identity includes responsibility for declining species, not merely pride in thriving populations. The Virginia big-eared bat faces extinction without active protection including cave gating, habitat preservation, education reducing human disturbance, and research tracking population trends. Making an endangered bat the official state symbol commits Virginia to conservation action, not passive appreciation. The designation affirms that Virginia's natural heritage includes fragile, threatened ecosystems deserving protection equal to historical monuments or cultural landmarks."
      
      - subtitle: "Underground Natural Heritage"
        text: "Virginia's geology creates extensive karst landscapes where limestone bedrock weathers into caves, sinkholes, and underground streams. These karst regions in the Appalachian Mountains support unique biological communities found nowhere else on Earth. The Virginia big-eared bat represents this hidden natural heritage invisible to surface-dwelling humans who rarely consider underground ecosystems when thinking about Virginia wildlife. Most Virginians encounter cardinals, dogwoods, and other above-ground symbols daily, but few ever see the state bat or enter the cave systems supporting specialized subterranean life. The bat designation reminds Virginians that natural heritage extends below ground and that protecting surface environments alone leaves critical ecosystems vulnerable. Cave conservation requires different approaches than forest or river protection because disturbance impacts are less visible but potentially catastrophic for species with no escape routes or alternative habitats."
      
      - subtitle: "Echolocation and Adaptation"
        text: "The Virginia big-eared bat's exceptionally large ears evolved specifically for detecting moth wingbeats through echolocation in dark cave environments and forest canopies. These ears function as sophisticated sound receivers, allowing bats to emit ultrasonic calls, detect echoes bouncing off insects and obstacles, and construct three-dimensional mental maps of surroundings while flying in complete darkness. The ears curl backward during hibernation to conserve heat and reduce energy expenditure during months-long periods without feeding. This specialized adaptation represents millions of years of evolution creating animals perfectly suited for ecological niches unavailable to other species. The bat symbolizes biological diversity and the complexity of natural systems where species evolve remarkable capabilities solving specific survival challenges through genetic adaptation rather than learned behavior or technological innovation."
      
      - subtitle: "Possible White Nose Syndrome Immunity"
        text: "White Nose Syndrome, a fungal disease caused by Pseudogymnoascus destructans, has killed millions of bats across North America since 2006, causing population crashes exceeding 90 percent for some species. The fungus infects bats during hibernation, disrupting their sleep cycles and causing them to burn critical fat reserves before insects return in spring, leading to starvation. Virginia big-eared bats have shown possible natural immunity to this devastating disease. While the fungus has been detected on Virginia big-eared bats, they display no symptoms and suffer no mortality from infection as of recent observations. This potential immunity makes the species particularly valuable for genetic research that might reveal protective mechanisms applicable to other bat species facing extinction from White Nose Syndrome. The Virginia big-eared bat thus represents hope for bat conservation through understanding natural disease resistance developed through evolutionary processes."

  - id: "identification"
    icon: "fa-binoculars"
    title: "How to Identify Virginia Big-Eared Bats"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "The Virginia big-eared bat measures 3.5 to 4.5 inches in total body length with a wingspan reaching 11 to 12 inches. Weight ranges from 0.25 to 0.5 ounces, making them very lightweight despite being among the largest cave-dwelling bats in their geographic range. The most distinctive feature consists of ears exceeding one inch (2.5 centimeters) in length—extraordinarily large proportional to body size. When at rest, these ears reach halfway down the bat's back, and during hibernation they curl backward against the body for heat conservation. The muzzle shows globular shape with elongated nostrils. Fur coloring varies from light brown to dark brown depending on individual age, with uniformly colored soft, long fur from base to tip. The belly shows lighter coloration than the back. Wing membranes appear pinkish when backlit."
        list_items:
          - "**Size**: 3.5-4.5 inches body length; 11-12 inch wingspan; 0.25-0.5 ounces weight"
          - "**Ears**: Exceptionally large, exceeding 1 inch length; reach halfway down body when extended; curl backward during hibernation"
          - "**Fur**: Light to dark brown; long, soft, uniform coloring; lighter belly"
          - "**Features**: Globular muzzle; elongated nostrils; pinkish wing membranes; lightweight frame"
      
      - subtitle: "Echolocation and Hunting Behavior"
        text: "Virginia big-eared bats hunt using sophisticated echolocation, emitting ultrasonic calls inaudible to humans and detecting echoes reflecting off flying insects. The large ears function as highly sensitive receivers, allowing detection of moth wingbeats and precise localization of prey in complete darkness. Bats forage primarily over open pastures, corn and alfalfa fields, and around tree crowns, typically within a few miles of cave roosts. They hunt nocturnally during evening and dawn periods when moths and other flying insects are most active. The specialized diet consists of over 90 percent moths (Lepidoptera), with analysis of fecal pellets showing 97 percent moth content. Secondary prey includes beetles, flies, termites, mosquitoes, lacewings, bees, and wasps. Each bat consumes approximately one-third its body weight in insects nightly, providing natural pest control services benefiting agriculture and reducing mosquito populations around human communities."
      
      - subtitle: "Reproduction and Life Cycle"
        text: "Virginia big-eared bats mate during fall and winter, but females employ delayed fertilization, storing sperm until spring when they emerge from hibernation. Ovulation and fertilization occur in late winter or early spring after hibernation ends. Gestation lasts approximately 55 to 100 days, with females giving birth to single pups in late spring or early summer (early June through mid-July). Mothers form maternity colonies in warmer cave rooms separate from males during the birthing and nursing period. Young bats begin flying at approximately three weeks of age and achieve weaning by six weeks. The rapid development allows pups to become independent before late summer when maternity colonies disperse. Lifespan reaches approximately 16 years in the wild, with some sources suggesting potential longevity up to 30 years under favorable conditions. The relatively long lifespan and slow reproductive rate (one pup per year) make populations vulnerable to disturbance-related mortality that reduces breeding adults faster than reproduction can replace losses."

  - id: "in-the-state"
    icon: "fa-map-location-dot"
    title: "Virginia Big-Eared Bats in Virginia"
    style: "default"
    paragraphs:
      - "Virginia big-eared bats occur in three caves in Tazewell County during summer maternity season and five caves (Highland, Bland, and Tazewell counties) during winter hibernation. These limestone caves in Virginia's western mountains provide essential habitat within the species' limited geographic range extending into West Virginia, Kentucky, and North Carolina."
      - "Virginia represents the southern and eastern edge of the subspecies' distribution. The bats remain non-migratory, staying within the same limestone karst region year-round and moving between summer maternity caves and winter hibernation caves as seasonal temperature and humidity requirements change."
    
    facts:
      - "**Summer Caves**: Three known maternity colony sites in Tazewell County; females gather in warm cave rooms for birthing"
      - "**Winter Caves**: Five known hibernation sites in Highland, Bland, and Tazewell counties; require cool, stable temperatures"
      - "**Virginia Population**: Small fraction of total population; most bats (approximately 70%) hibernate in Hellhole cave, West Virginia"
      - "**Habitat Requirements**: Exclusively limestone caves with specific microclimate conditions; foraging areas within few miles of cave roosts including mixed hardwood forests and open agricultural fields"
    
    subsections:
      - subtitle: "Cave Microclimate Requirements"
        text: "Virginia big-eared bats require caves providing specific temperature and humidity conditions varying by season. Winter hibernation caves must maintain cool, stable temperatures allowing bats to enter torpor and reduce metabolic rates, conserving fat reserves accumulated during fall feeding. Summer maternity caves need warmer temperatures promoting pup growth and development, with stable humidity preventing dehydration of naked newborn bats and nursing mothers. These microclimate requirements severely limit suitable cave options, concentrating populations in a few sites meeting precise environmental parameters. Disturbance to even one critical cave can impact significant portions of the entire population, making habitat protection urgent for species survival. Caves must also connect to suitable foraging habitat including mature forests and agricultural areas supporting abundant moth populations."

  - id: "current-status"
    icon: "fa-triangle-exclamation"
    title: "Conservation Status and Threats"
    style: "default"
    paragraphs:
      - "The Virginia big-eared bat has been federally endangered since 1979, with current population estimates around 20,000 individuals. Despite low numbers, the population showed approximately 30 percent increase from 2008 to 2018, representing positive conservation trend though the species remains critically vulnerable."
      - "The primary threat consists of human disturbance in caves during hibernation and maternity periods. When people enter caves containing hibernating bats, noise, lights, and physical presence wake bats from torpor, forcing them to burn stored fat reserves. Just two hibernation disruptions can deplete energy reserves sufficiently that bats starve before insects return in spring."
    
    subsections:
      - subtitle: "Cave Protection Measures"
        text: "Conservation efforts focus on protecting critical caves through gating and access restrictions. Cave gates prevent human entry while allowing bat passage, reducing disturbance during vulnerable hibernation and maternity periods. Many caves used by Virginia big-eared bats have received long-term protection status through land acquisition by conservation organizations and government agencies, ensuring management prioritizes bat conservation. Public education programs teach cavers and recreationalists about disturbance impacts and encourage voluntary avoidance of bat caves during sensitive seasons. The Virginia Cave Board provides oversight and recommendations for cave management, working with state agencies including the Department of Wildlife Resources and Department of Conservation and Recreation to coordinate protection strategies across jurisdictions."
      
      - subtitle: "Additional Conservation Threats"
        text: "Beyond direct disturbance, Virginia big-eared bats face habitat loss and fragmentation from development reducing forest cover around caves and eliminating foraging areas. Wind turbine collisions kill bats during migration and nightly foraging flights, though Virginia big-eared bats are non-migratory and may face lower turbine risk than migratory species. Tall communication towers also cause bat mortality through collisions. Pesticide use reducing insect populations potentially limits food availability, though specific impacts on Virginia big-eared bats remain uncertain. Climate change may alter cave microclimates, potentially making currently suitable caves too warm or too cold for hibernation or maternity colony formation. Protecting the species requires addressing these multiple threats through integrated conservation approaches combining habitat protection, disturbance reduction, and landscape-scale planning maintaining connectivity between summer and winter roost sites."

  - id: "where-to-see"
    icon: "fa-graduation-cap"
    title: "Learning About Virginia's State Bat"
    style: "default"
    paragraphs:
      - "Virginia big-eared bats are not publicly accessible because disturbance threatens their survival. Caves containing bat colonies are gated and off-limits to prevent human intrusion during critical hibernation and maternity periods. Virginians can learn about the state bat through educational programs and natural heritage centers rather than direct observation."
      - "The Virginia Cave Board, Virginia Department of Wildlife Resources, and natural heritage programs offer educational materials, programs, and exhibits explaining bat biology, cave ecosystems, and conservation challenges. These resources allow Virginians to appreciate the state bat without endangering the species through cave visitation."
    
    list_items:
      - "**Virginia Department of Wildlife Resources**: Educational materials, species profile database, bat conservation information; guides available for purchase"
      - "**Virginia Cave Board**: Educational programs about caves and cave-dwelling creatures; conservation recommendations and cave protection initiatives"
      - "**Virginia Natural Heritage Program**: Information on rare species and habitats; conservation planning resources"
      - "**Educational Materials**: School curricula including echolocation activities; bat houses as alternative observation opportunities for common bat species"

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Virginia big-eared bat connects to other state symbols through themes of natural heritage protection and Virginia identity. The northern cardinal, designated state bird in 1950, represents above-ground wildlife visible in backyards and forests throughout Virginia. The bat represents hidden underground wildlife requiring specialized knowledge and protection."
      - "Both bat and cardinal consume insects, providing ecosystem services controlling agricultural pests and disease-carrying mosquitoes. Together they symbolize Virginia's biodiversity spanning visible and invisible ecosystems, common and rare species, thriving and endangered populations requiring different conservation approaches."
    
    subsections:
      - subtitle: "Dogwood and Habitat Connection"
        text: "Virginia designated the American dogwood (Cornus florida) as both state flower (1918) and state tree (1956), making Virginia one of only two states with the same plant as flower and tree. Dogwoods grow throughout Virginia's forests, including the mixed hardwood forests surrounding limestone caves where Virginia big-eared bats forage. The dogwood's red berries provide food for birds and small mammals, supporting forest ecosystem health that indirectly benefits bats by maintaining insect populations. Both dogwood and bat represent Virginia's Appalachian Mountain heritage, with dogwoods blooming in spring forests above caves where bats emerge from hibernation to resume hunting insects in the warming season. The connection emphasizes that protecting Virginia's natural heritage requires considering above-ground and underground ecosystems as integrated systems."
        link:
          label: "See Virginia state tree"
          url: "/states/virginia/tree/flowering-dogwood"
      - subtitle: "Cardinal and Visible Wildlife Heritage"
        text: "While the state bat lives in restricted caves that most residents never enter, Virginia's state bird is visible year-round in neighborhoods and forest edges. Pairing these two animals helps frame conservation at two scales: everyday habitat stewardship above ground and specialized cave protection below ground. This pairing also helps educators explain why common species and endangered species both matter in a complete state biodiversity strategy."
        link:
          label: "See Virginia state bird"
          url: "/states/virginia/bird/northern-cardinal"
      
      - subtitle: "State Motto and Natural Rights"
        text: "Virginia's state motto 'Sic Semper Tyrannis' (Thus Always to Tyrants), adopted with the state seal in 1776, emphasizes resistance to oppression and defense of rights. Extending this principle to environmental protection, Virginia's designation of an endangered bat symbolizes defending the natural world's right to exist against human actions causing species decline. The Virginia Cave Board's mission includes protecting rare minerals, archaeological resources, cave life, and groundwater, treating underground natural heritage as worthy of defense similar to human rights and freedoms. The bat designation reflects values consistent with Virginia's founding principles applied to conservation—that some things deserve protection regardless of immediate economic utility, and that future generations have rights to inherit natural heritage as Virginians inherited it from previous generations."
        link:
          label: "See Virginia state motto"
          url: "/states/virginia/motto/sic-semper-tyrannis"
      
      - subtitle: "Chesapeake Bay Deadrise and Natural Resources"
        text: "Virginia designated the Chesapeake Bay deadrise as the official state boat, recognizing the distinctive boat design used by watermen harvesting oysters, crabs, and fish from the Chesapeake Bay. Both deadrise and bat designations honor Virginia's natural resource heritage and the importance of sustainable management. The deadrise represents human adaptation to aquatic environments and traditional livelihoods dependent on healthy ecosystems. The bat represents natural adaptation to cave environments and ecological services supporting agriculture through insect control. Both symbols acknowledge that Virginia's economy and culture rest on maintaining healthy natural systems, whether coastal waters supporting fisheries or cave ecosystems supporting specialized species that evolved over millions of years, a civic story also visible in [Virginia's official flag imagery](/states/virginia/flag/virginia-state-flag)."

