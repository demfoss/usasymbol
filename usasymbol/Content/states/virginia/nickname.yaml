seo_title: "Virginia State Nickname | The Old Dominion"
seo_description: "Virginia is known as The Old Dominion, its official state nickname. Learn what Old Dominion means, why Virginia uses it, and what other nicknames the state has had."

intro_text: "Virginia's nickname is <i>The Old Dominion</i>. King Charles II of England gave Virginia this title around 1660 after his restoration to the throne. The colony had remained loyal to the monarchy during England's civil war and period without a king, and the name appears in the [U.S. state nicknames guide](/symbols/nicknames)."

sections:
  - id: "meaning"
    icon: "fa-solid fa-language"
    title: "Meaning of 'The Old Dominion'"
    paragraphs:
      - "The Old Dominion Virginia nickname comes from Virginia's relationship with the English monarchy during the 1600s. England experienced a civil war from 1642 to 1651 that ended with King Charles I being executed. Oliver Cromwell then ruled England without a king until 1660. Virginia colonists supported the royal family throughout this period, even proclaiming Charles II as their king while he lived in exile. Virginia's tradition of collective loyalty to government outlasted most colonial-era institutions and became part of the Commonwealth's long political identity."
      - "The nickname reflects royal gratitude after the monarchy returned to power. Charles II rewarded Virginia's loyalty by adding the colony to his royal coat of arms alongside England, Scotland, Ireland, and France. The word 'dominion' meant a territory under the king's direct control. Virginia became known as His Majesty's Old Dominion, emphasizing both its age as England's first permanent colony and its faithful service."
      - "The state of Virginia nickname stuck even after American independence ended royal rule. Virginians kept using Old Dominion because it represented their long history and original position among the colonies. Jamestown was founded in 1607, making Virginia the oldest permanent English settlement in North America. The nickname appears on Virginia license plates, in the state song, and across official documents. Old Dominion University in Norfolk carries this historical name today, while formal state identity is codified in [Sic Semper Tyrannis](/states/virginia/motto/sic-semper-tyrannis)."

  - id: "other_nicknames"
    icon: "fa-solid fa-list"
    title: "Other Nicknames"
    subsections:
      - subtitle: "Mother of Presidents"
        text: "Virginia earned the Mother of Presidents nickname because eight U.S. presidents were born within its borders. George Washington, Thomas Jefferson, James Madison, and James Monroe all came from Virginia and served during the nation's first 40 years. William Henry Harrison, John Tyler, Zachary Taylor, and Woodrow Wilson were also Virginia natives. Four of the first five presidents grew up in Virginia, giving the state enormous political influence in early American government. These leaders helped shape the Constitution, expanded the country westward, and guided the nation through its founding decades. No other state has produced as many presidents. Virginians used this nickname proudly throughout the 1800s and into the 1900s. The phrase still appears in history books and tourism materials highlighting Virginia's role in creating American democracy, including symbols highlighted on [Virginia's state flag](/states/virginia/flag/virginia-state-flag)."
      - subtitle: "Mother of States"
        text: "People called Virginia the Mother of States because its original colonial territory was massive. The 1609 charter granted Virginia land stretching from the Atlantic coast west to the Pacific Ocean. Parts of modern West Virginia, Kentucky, Ohio, Indiana, Illinois, Wisconsin, Minnesota, and Michigan were all carved from Virginia's original boundaries. West Virginia broke away during the Civil War in 1863 when western counties refused to join the Confederacy. The Northwest Territory, organized in 1787, came entirely from Virginia's land claims. Virginia donated this huge region to the federal government to help pay Revolutionary War debts. The Mother of States nickname recognized how Virginia's territory gave birth to numerous other states as the nation expanded westward and remained tied to heritage symbols such as [Virginia's flowering dogwood](/states/virginia/tree/flowering-dogwood)."
      - subtitle: "The Cavalier State"
        text: "Virginia gained the Cavalier State nickname during colonial times because many English Cavaliers settled there. Cavaliers were supporters of King Charles I during the English Civil War who fought against Oliver Cromwell's Parliamentary forces. After the king's execution in 1649, numerous Cavaliers fled England to avoid persecution. Many came to Virginia where colonial leaders shared their royalist sympathies. These aristocratic families brought wealth, education, and strong ties to English nobility. They established plantations along Virginia's rivers and dominated colonial politics. The Cavalier image shaped how Virginians saw themselves for generations. Some historians debate how many actual Cavaliers really came to Virginia, suggesting the number was smaller than tradition claims. The nickname appears less frequently today than Old Dominion but still shows up in sports team names and historical discussions, often alongside symbols like [Virginia's Northern Cardinal](/states/virginia/bird/northern-cardinal)."

  - id: "interesting_facts"
    icon: "fa-solid fa-lightbulb"
    title: "Interesting Facts"
    facts:
      - "King Charles II added Virginia to his royal coat of arms around 1660 to honor the colony's loyalty during England's civil war."
      - "Eight U.S. presidents were born in Virginia, more than any other state, including four of the first five presidents."
      - "Jamestown, founded in 1607, was England's first permanent settlement in North America, making Virginia the oldest colony."
      - "Virginia's original 1609 charter granted land stretching from the Atlantic Ocean to the Pacific Ocean across the continent."
      - "The state motto is 'Sic Semper Tyrannis,' which means 'Thus Always to Tyrants' in Latin, adopted in 1776."
      - "West Virginia separated from Virginia in 1863 during the Civil War when western counties opposed secession from the Union."

faq:

  - question: "What is the Virginia nickname?"
    answer: "The Virginia nickname is the Old Dominion. King Charles II of England gave Virginia this title around 1660 to reward the colony's loyalty during the English Civil War."

  - question: "Why is Virginia nickname Old Dominion?"
    answer: "Virginia earned this nickname because colonists supported the royal family during England's civil war. Charles II honored Virginia's loyalty by calling it his Old Dominion and adding it to his coat of arms."

  - question: "What does Old Dominion mean for Virginia?"
    answer: "Old Dominion meant Virginia was a territory under the king's direct control. The word emphasized Virginia's age as England's first permanent colony and its faithful service to the monarchy."

  - question: "What is the state of Virginia nickname history?"
    answer: "The state of Virginia nickname history begins around 1660 when Charles II rewarded colonial loyalty. Virginia kept the Old Dominion nickname after independence because it represented the state's long history."

  - question: "What is the Virginia nickname and motto?"
    answer: "The Virginia nickname is the Old Dominion. The state motto is 'Sic Semper Tyrannis,' which means 'Thus Always to Tyrants' in Latin, adopted in 1776."

  - question: "When did Virginia get the Old Dominion nickname?"
    answer: "Virginia received the Old Dominion nickname around 1660 from King Charles II. The title honored Virginia's support for the monarchy during England's civil war and Commonwealth period."

  - question: "What other nicknames does Virginia have?"
    answer: "Virginia has been called Mother of Presidents, Mother of States, and the Cavalier State. These nicknames referred to eight presidents born there, territorial size, and Cavalier settlers."

