seo_description: "Virginia state symbols: official state symbols include the cardinal, dogwood, Sic Semper Tyrannis motto, Old Dominion nickname, and American foxhound."
snippet_answer: "The cardinal and dogwood are Virginia's most familiar official state symbols, but they carry extra historical weight here — tied to colonial natural history and the oldest continuously settled English colony in America. The Sic Semper Tyrannis motto, Old Dominion nickname, American foxhound, and George Washington's Rye Whiskey designation give Virginia's list a founding-era depth few other states can match."
