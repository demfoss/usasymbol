name_meaning:
  heading: What Does Virginia Mean?
  paragraphs:
  - Virginia is named for Queen Elizabeth I of England, the Virgin Queen. The colony's English name long predates Virginia statehood and helps explain why the Old Dominion nickname still matters.
  - Virginia became one of the original states after independence. Its symbol set keeps returning to that older Commonwealth identity through the motto, flag seal, cardinal-and-dogwood pairing, George Washington's Rye Whiskey, and the American foxhound.
  - Virginia's postal abbreviation is VA, and residents are Virginians. The state is formally a commonwealth, a usage it shares with only a few U.S. states.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named for Queen Elizabeth I of England, often called the Virgin Queen.
    - label: Statehood
      text: Virginia was one of the original states after American independence.
    - label: Commonwealth
      text: Virginia uses Commonwealth in its formal state style.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to Virginia, a Mid-Atlantic and Southern commonwealth with Tidewater, Piedmont, Blue Ridge, and Appalachian regions.
    - label: People
      text: People from Virginia are called Virginians.
    - label: Nickname
      text: Old Dominion points back to Virginia's colonial and royal history.
  - heading: Nicknames and Short Forms
    items:
    - label: The Old Dominion
      text: Virginia's long-running nickname tied to its colonial status and older English history.
    - label: Abbreviation
      text: VA; older short form Va.
editorial:
  heading: What Virginia's Symbols Say About the Commonwealth
  paragraphs:
  - The [state motto](/states/virginia/motto) and [state flag](/states/virginia/flag) put Virginia's revolutionary language at the center. Virtus over the fallen tyrant is not soft symbolism; it is the Commonwealth turning political theory into a seal.
  - The [Northern Cardinal](/states/virginia/bird), [dogwood flower](/states/virginia/flower), and [flowering dogwood tree](/states/virginia/tree) give Virginia a public nature image that is unusually tight because one species is both flower and tree.
  - The newer symbols widen the old story without breaking it. [George Washington's Rye Whiskey](/states/virginia/beverage/george-washingtons-rye-whiskey) ties the list to Mount Vernon, the [American foxhound](/states/virginia/mammal/american-foxhound) to Washington-era breeding and countryside sport, and the [Virginia big-eared bat](/states/virginia/mammal/virginia-big-eared-bat) to Appalachian cave conservation.
faq:
- question: What is Virginia's most famous state symbol?
  answer: The blue [Virginia state flag](/states/virginia/flag) and its seal are among the most recognizable because they carry the motto Sic Semper Tyrannis and the figure of Virtus.
- question: What is Virginia's state bird?
  answer: Virginia's state bird is the [Northern Cardinal](/states/virginia/bird), adopted in 1950.
- question: What is Virginia's state flower?
  answer: Virginia's state flower is the [dogwood](/states/virginia/flower), adopted in 1918. The flowering dogwood is also Virginia's [state tree](/states/virginia/tree).
- question: What does Sic Semper Tyrannis mean?
  answer: "[Sic Semper Tyrannis](/states/virginia/motto) means Thus Always to Tyrants, and Virginia adopted it with the state seal in 1776."
- question: How many official state symbols does Virginia have?
  answer: Virginia's state symbols list here includes the flag, cardinal, dogwood flower and tree, motto, nickname, colors, milk, George Washington's Rye Whiskey, American foxhound, and Virginia big-eared bat.
