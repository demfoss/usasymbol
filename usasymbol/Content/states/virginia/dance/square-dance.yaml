sections:
  - id: overview
    icon: fa-solid fa-music
    title: Virginia State Dance
    paragraphs:
      - "Virginia designated square dance its official state folk dance in 2011. The timing set Virginia apart, since most states that recognized square dance had done so decades earlier during the 1970s through 1990s."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance organizes four couples into a square facing the center. A caller names each figure just before it happens, so dancers respond in real time rather than following a fixed routine."
      - "In Virginia's Blue Ridge and Appalachian communities, square dance is often paired with old-time fiddle music, sometimes danced alongside flatfoot or clogging steps at the same gathering. Couples rotate through the set, briefly partnering with others before returning to their own partner."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Stand with your partner on one side of the square, facing the center, with three other couples on the remaining sides."
      - title: "Circle Left with the Group"
        description: "Join hands with the full square and step together in the direction the caller announces."
      - title: "Do-Si-Do Your Corner"
        description: "Walk toward the dancer beside you and pass back to back without turning, then return to place."
      - title: "Allemande Left"
        description: "Take your corner's hand, walk a full turn together, then release and face back toward the square."
      - title: "Promenade Back to Place"
        description: "Take your partner's hands and walk together around the set until you reach your original spot."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Virginia
    paragraphs:
      - "Square dance calling organizations pushed states nationwide to adopt the dance as an official folk symbol from the 1970s onward. Virginia's Blue Ridge and Appalachian counties had already kept square dance alive for generations alongside old-time fiddle music and clogging."
      - "Virginia's old-time music and dance scene, centered in its western mountain communities, gave lawmakers a living tradition to point to when the designation finally passed in 2011."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became Virginia's Dance
    paragraphs:
      - "Virginia designated square dance its official state folk dance in 2011, one of the last states to do so after most others had already adopted it decades earlier."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Virginia adopted square dance as its official state folk dance in 2011."
      - "Virginia's designation came decades after most states had already named square dance an official folk dance."
      - "Virginia's Blue Ridge and Appalachian communities pair square dance with old-time fiddle music and clogging at the same gatherings."
      - "A caller directs each figure aloud, so dancers do not need to memorize a set routine."
      - "The dance is performed in a set of four couples arranged in a square."

