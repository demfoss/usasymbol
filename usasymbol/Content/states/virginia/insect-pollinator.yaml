faq:
- question: What is Virginia's state pollinator?
  answer: "Virginia's state pollinator is the European honey bee, adopted in 2024."
- question: When did Virginia adopt the European honey bee?
  answer: "Virginia adopted the European honey bee as its official state pollinator effective July 1, 2024."
- question: Why did Virginia choose the European honey bee?
  answer: "Lawmakers pointed to the honey bee's role pollinating Virginia's crops, fruits, and vegetables, and its long history in the state dating back to 1622."
- question: What does the European honey bee look like?
  answer: "The European honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
- question: Who helped choose Virginia's state pollinator?
  answer: "Delegate Patrick Hope worked with the Virginia State Beekeepers Association to introduce the bill, which passed with bipartisan support."
- question: Is the European honey bee the same as Virginia's state insect?
  answer: "No. Virginia's state insect is the eastern tiger swallowtail, adopted in 1991. The European honey bee is a separate designation, the official state pollinator, adopted in 2024."

