sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Pollinator of Virginia?
  paragraphs:
  - "The honey bee, Apis mellifera, is Virginia's official state pollinator. Governor Glenn Youngkin signed the designation into law, effective July 1, 2024."
  - "The honey bee joins the eastern tiger swallowtail, Virginia's separate state insect, as one of the state's official symbols."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
  - "Honey bees live in large colonies built around a single queen. Worker bees gather nectar and pollen, build wax honeycomb, and produce the honey the colony eats and stores."
  - "A single hive can hold tens of thousands of bees, all working together to keep the colony fed and growing."

- id: history
  icon: fa-solid fa-landmark
  title: How Virginia Chose the European Honey Bee
  paragraphs:
  - "Delegate Patrick Hope worked with the Virginia State Beekeepers Association to introduce the bill naming the honey bee Virginia's official state pollinator."
  - "The General Assembly passed the bill with bipartisan support, and Governor Glenn Youngkin signed it into law in March 2024, effective July 1, 2024."

- id: reason
  icon: fa-solid fa-circle-question
  title: Why Virginia Chose the European Honey Bee
  paragraphs:
  - "Lawmakers pointed to the honey bee's role pollinating crops, fruits, and vegetables across Virginia as the reason for the designation."
  - "Supporters also noted that honey bees have been part of Virginia's history since 1622, when colonists at Jamestown had them shipped from England to help pollinate crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 2024, effective July 1, 2024, signed by Governor Glenn Youngkin."
  - "Scientific name: Apis mellifera."
  - "Championed by Delegate Patrick Hope and the Virginia State Beekeepers Association."
  - "Honey bees have been present in Virginia since colonists shipped them from England in 1622."
  - "Virginia also has a separate state insect, the eastern tiger swallowtail, adopted in 1991."




