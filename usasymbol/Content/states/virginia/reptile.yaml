    answer: "The Virginia General Assembly designated the eastern garter snake the official state reptile in 2016."
  - question: Why did Virginia choose the Eastern Garter Snake?
    answer: "The eastern garter snake was chosen because it is common and familiar across Virginia and is harmless to people."
