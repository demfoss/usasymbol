intro_text: "Virginia's state reptile is the eastern garter snake, a striped, harmless snake found in yards and fields across the state, adopted in 2016. This profile appears in the [list of U.S. state reptiles](/symbols/reptiles)."

sections:
  - id: overview
    icon: fa-solid fa-turtle
    title: What Is the State Reptile of Virginia?
    paragraphs:
      - "The eastern garter snake is Virginia's official state reptile, designated by the Virginia General Assembly in 2016. Its scientific name is Thamnophis sirtalis sirtalis."
      - "It is a common, harmless snake found in yards, gardens, fields, and woodlands throughout Virginia."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: About the Eastern Garter Snake
    paragraphs:
      - "The eastern garter snake has a dark body with three light stripes running the length of it, usually yellow or greenish, one down the back and one along each side."
      - "It grows to about 2 to 3 feet long and is not venomous, making it one of the safest snakes to encounter."
      - "It is active during the day and often seen near gardens, streams, and grassy areas hunting for worms, insects, and small amphibians."

  - id: selection
    icon: fa-solid fa-landmark
    title: How It Became the State Reptile
    paragraphs:
      - "The Virginia General Assembly designated the eastern garter snake the official state reptile in 2016, following an effort led by students to give Virginia an official state reptile."

  - id: reason
    icon: fa-solid fa-circle-question
    title: Why Virginia Chose the Eastern Garter Snake
    paragraphs:
      - "The eastern garter snake was chosen because it is common and familiar across Virginia and is harmless to people, making it a friendly ambassador for the state's reptile life."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: Where You Can Find the Eastern Garter Snake
    paragraphs:
      - "Eastern garter snakes live throughout Virginia, from mountain woodlands to coastal marshes, and are frequently seen in yards and gardens."
