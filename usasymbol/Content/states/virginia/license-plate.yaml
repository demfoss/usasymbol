sections:
- id: current-slogan
  icon: fa-solid fa-heart
  title: Current Standard Slogan
  paragraphs:
  - '"Virginia is for Lovers" is the slogan on Virginia''s current standard passenger plate. The plate is a plain blue-on-white design with a red heart standing in for the second V in "LOVERS."'
  - The current standard design began in March 2014. Virginia DMV media materials identify the design as the Standard Passenger Plate, and passenger plate chronology tables list March 2014 as the start of the "Virginia is for Lovers" standard base.
  - This was not the first time the phrase appeared on a Virginia plate. A "Virginia is for Lovers" specialty/revenue-sharing plate was authorized in 2003, more than a decade before the slogan became the default standard passenger plate text.

- id: campaign-origin
  icon: fa-solid fa-bullhorn
  title: Campaign Origin
  paragraphs:
  - The tourism slogan was created after the Richmond advertising firm Martin and Woltz won the Virginia State Travel Service account in 1968. Early ideas used categories such as history lovers, beach lovers, and mountain lovers.
  - The agency dropped the qualifiers and kept the broader phrase "Virginia is for Lovers." That made the slogan flexible enough to cover history, beaches, mountains, romance, food, music, and ordinary travel without rewriting the campaign for each audience.
  - The slogan launched publicly in 1969 and became one of America's longest-running state tourism campaigns before it moved onto the standard plate.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Virginia License Plate Slogans by Era
  paragraphs:
  - Virginia's standard passenger slogan history is shorter than the state's tourism history. The important correction is that "Old Dominion" is Virginia's nickname, but it is not the verified long-running standard passenger plate slogan in the plate tables.
  versions:
  - name: 400th Anniversary
    years: 2003-2007
    image: /images/license-plates/virginia/2003-400th-anniversary.png
    description: Virginia's standard passenger plate added "400th Anniversary" at the bottom as the state prepared to commemorate Jamestown's 1607 founding.
  - name: Jamestown 1607-2007
    years: 2006-March 2014
    image: /images/license-plates/virginia/2006-jamestown-400th-anniversary.png
    description: Standard plate wording changed to "Jamestown 1607-2007," while the top carried "400th Anniversary." This commemorative base remained standard until the Lovers plate replaced it.
  - name: Virginia is for Lovers
    years: March 2014-present
    image: /images/license-plates/virginia/2014-virginia-is-for-lovers.jpg
    description: Current standard passenger plate slogan, adapted from the long-running tourism campaign.

- id: old-dominion-note
  icon: fa-solid fa-landmark
  title: Old Dominion Is Separate
  paragraphs:
  - '"The Old Dominion" is Virginia''s official nickname, and it belongs in Virginia identity history. It should not be treated as the main standard passenger plate slogan unless a specific plate design/source shows it for that base.'
  - The older draft described an "Old Dominion" plate era in broad mid-century terms. That is too loose for a license-plate chronology page, because the passenger plate tables list those standard bases as no-slogan plates.
  - The clean distinction is: Old Dominion is the state nickname; Virginia is for Lovers is the current standard plate slogan; Jamestown/400th Anniversary were the immediate standard plate predecessors.

timeline:
- year: '1968'
  description: Martin and Woltz develops the Virginia tourism campaign concept after winning the state travel account.
- year: '1969'
  description: '"Virginia is for Lovers" launches as Virginia''s tourism slogan.'
- year: '2003'
  description: Virginia authorizes a "Virginia is for Lovers" specialty/revenue-sharing license plate; standard passenger plates also begin using "400th Anniversary."
- year: '2006'
  description: The Jamestown 1607-2007 commemorative standard plate begins, continuing the 400th anniversary theme.
- year: '2009'
  description: '"Virginia is for Lovers" is recognized on the Madison Avenue Advertising Walk of Fame after decades of continuous tourism use.'
- year: '2014'
  description: In March, Virginia makes "Virginia is for Lovers" the standard passenger plate slogan.
- year: '2015'
  description: The tourism slogan also begins appearing on Virginia welcome signs, extending the same brand beyond license plates.

faq:
- question: What is Virginia's license plate slogan?
  answer: Virginia's current standard license plate slogan is "Virginia is for Lovers." It became the standard passenger plate slogan in March 2014.
- question: When did Virginia is for Lovers first appear on license plates?
  answer: Virginia authorized a "Virginia is for Lovers" specialty/revenue-sharing plate in 2003. The slogan became the standard passenger plate slogan in March 2014.
- question: What slogan did Virginia use before Virginia is for Lovers?
  answer: The immediate standard-plate predecessors were "400th Anniversary" beginning in 2003 and "Jamestown 1607-2007" beginning in 2006.
- question: Was Old Dominion Virginia's standard license plate slogan?
  answer: '"The Old Dominion" is Virginia''s official nickname, but verified passenger plate chronologies do not support treating it as the long-running standard passenger plate slogan. Many earlier standard plates had no slogan.'
- question: Who created Virginia is for Lovers?
  answer: The phrase was created by the Richmond advertising firm Martin and Woltz after it won the Virginia State Travel Service account in 1968. The campaign launched in 1969.
- question: What does Virginia is for Lovers mean?
  answer: The slogan was designed to be open-ended. Early concepts included history lovers, beach lovers, and mountain lovers, but the qualifiers were dropped so the phrase could represent all kinds of Virginia travel.

