seo_title: 'Virginia License Plate Slogan: Virginia is for Lovers, Jamestown & 400th Anniversary'
seo_description: Virginia's current standard license plate slogan is "Virginia is for Lovers," introduced on the standard plate in March 2014. Learn the corrected timeline from no-slogan plates to 400th Anniversary, Jamestown 1607-2007, and the modern tourism slogan.
hero_image: /images/license-plates/virginia/2014-virginia-is-for-lovers.jpg
hero_image_alt: Virginia standard passenger license plate with Virginia is for Lovers slogan
hero_image_caption: Virginia's current standard passenger plate uses "Virginia is for Lovers." DMV media identifies it as the Standard Passenger Plate.
intro_text: '**"Virginia is for Lovers"** is Virginia''s current standard license plate slogan. The phrase began as a tourism campaign in 1969, appeared on a specialty plate authorized in 2003, and became the standard passenger plate slogan in March 2014. Earlier Virginia passenger plates should not be summarized as an "Old Dominion" slogan era: verified passenger plate chronologies list no slogan on standard Virginia plates through much of the twentieth century.'
quick_answer: '"Virginia is for Lovers" is Virginia''s current standard license plate slogan. It became the standard passenger plate slogan in March 2014. Before that, Virginia used no-slogan standard plates for long periods, then "400th Anniversary" beginning in 2003 and "Jamestown 1607-2007" beginning in 2006. "Virginia is for Lovers" first reached plates as a specialty/revenue-sharing plate authorized in 2003.'
