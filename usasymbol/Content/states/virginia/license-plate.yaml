hero_image_caption: Virginia's current standard passenger plate uses "Virginia is for Lovers." DMV media identifies it as the Standard Passenger Plate.
intro_text: "**\"Virginia is for Lovers\"** is Virginia's current standard license plate slogan. The tourism phrase began in 1969, reached a specialty plate authorized in 2003, and became the standard passenger plate slogan in March 2014. Earlier Virginia standard plates mostly had no slogan, not an \"Old Dominion\" slogan era. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"Virginia is for Lovers\" is Virginia's current standard license plate slogan. It became the standard passenger plate slogan in March 2014. Before that, Virginia used no-slogan standard plates for long periods, then \"400th Anniversary\" beginning in 2003 and \"Jamestown 1607-2007\" beginning in 2006. \"Virginia is for Lovers\" first reached plates as a specialty/revenue-sharing plate authorized in 2003."
