intro_text: "Virginia's state rock is nelsonite, adopted in 2016 and named for Nelson County, where the igneous rock was first identified and later mined near Roseland for titanium and phosphate ore. This profile appears in the [list of U.S. state rocks](/symbols/rocks)."

sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Virginia State Rock
    paragraphs:
      - "Nelsonite is Virginia's official state rock, designated by the Virginia General Assembly in 2016. It is an igneous rock made up mostly of the minerals ilmenite and apatite, and it takes its name from Nelson County, where geologists first identified it in the early 1900s."
      - "Few other rocks anywhere carry a Virginia county's name into geology textbooks, which made nelsonite a distinctive choice for the state's first official rock."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Nelsonite?"
    paragraphs:
      - "Nelsonite is a medium-grained igneous rock with a speckled black-and-white appearance. Dark, metallic ilmenite grains sit against lighter, non-metallic apatite, sometimes with small amounts of rutile mixed in."
      - "The rock forms when iron-titanium-phosphorus-rich magma separates from a larger granitic or anorthositic magma body and slowly crystallizes underground. Virginia's nelsonite occurs as dikes and layers within billion-year-old granitic gneiss in the Blue Ridge region."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Virginia Chose Nelsonite as Its State Rock"
    paragraphs:
      - "Nelsonite's type locality, the place where a rock is first formally described, sits in Nelson County near Roseland, making it one of relatively few rocks named for a Virginia county rather than a person or a foreign locale. Mining companies worked ilmenite and apatite deposits in the Roseland district from around 1900 into the early 1970s, extracting titanium for paint pigment and steel alloys and phosphate for fertilizer."
      - "Lawmakers recognized that history when they named nelsonite the state rock, giving Virginia a symbol tied to an industry that no longer operates in the state but once employed a large share of Nelson County workers. The designation also gave Virginia a rock name rarely used anywhere outside the region, tying the symbol directly to a single Virginia county."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Nelsonite Became Virginia's State Rock"
    paragraphs:
      - "Students at Piedmont Virginia Community College, led by Michelle Stanislaus, launched a campaign in fall 2015 to give Virginia an official state rock and settled on nelsonite for its local geological significance. Governor Terry McAuliffe signed the bill on July 1, 2016, making nelsonite the first rock Virginia had ever formally designated."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Nelsonite Is Found in Virginia"
    paragraphs:
      - "Nelsonite's type locality lies near Roseland in Nelson County, in the Blue Ridge foothills of central Virginia. Mining companies worked ilmenite and apatite deposits there for titanium and phosphate from about 1900 until operations ended in 1971."
    sites:
