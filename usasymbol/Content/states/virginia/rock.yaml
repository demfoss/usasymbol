faq:
  - question: What is Virginia's state rock?
    answer: "Virginia's state rock is nelsonite, a speckled igneous rock made mostly of the minerals ilmenite and apatite, adopted in 2016."
  - question: When did Virginia adopt nelsonite as its state rock?
    answer: "Governor Terry McAuliffe signed the bill making nelsonite Virginia's state rock on July 1, 2016."
  - question: Why did Virginia choose nelsonite?
    answer: "Nelsonite was first identified in Nelson County near Roseland, where it was mined for titanium and phosphate from about 1900 to 1971, and Piedmont Virginia Community College students campaigned for its designation."
  - question: Is nelsonite valuable?
    answer: "Nelsonite is not valuable as a gem or building stone today. Its historic value came from the titanium and phosphate minerals inside it, which are no longer mined in Virginia."

