  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Nelsonite Facts"
    facts:
      - "Adopted as Virginia's state rock in 2016, the first rock the state has ever officially designated."
      - "Nelsonite is named for Nelson County, Virginia, where it was first identified near Roseland."
      - "Mining companies worked Nelson County's ilmenite and apatite deposits for titanium and phosphate from about 1900 to 1971."
      - "Piedmont Virginia Community College students campaigned for the designation as a political science and geology class project."

