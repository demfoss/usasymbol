  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Virginia State Flag Facts"
    facts:
      - "Virginia officially adopted its state flag on April 30, 1861"
      - "The seal was designed by George Wythe in 1776"
      - "The flag was readopted in 1912 and standardized in 1950"
      - "Virginia is the only U.S. state flag depicting nudity"
      - "The motto Sic semper tyrannis means Thus always to tyrants"
      - "The first unofficial state flag was raised in 1833"

faq:
  - question: "What is the official state flag of Virginia?"
    answer: "The Virginia state flag is the official banner of Virginia, featuring the state seal on a deep blue field with a white circle."

  - question: "How would you describe the design of the Virginia state flag?"
    answer: "The flag shows a blue background with the state seal in a white circle. The seal depicts a female figure standing over a fallen male figure, with the motto Sic semper tyrannis below."

  - question: "What are the key symbols on Virginia's flag?"
    answer: "The Virginia state seal appears on the flag, showing Virtus standing over Tyranny, along with a spear, sword, fallen crown, and the motto Sic semper tyrannis. Tyranny holds a broken chain and whip."

  - question: "What does the Virginia state flag represent?"
    answer: "The female figure on the flag represents Virtus, the Roman personification of virtue and courage. The fallen male figure represents Tyranny."

  - question: "What meaning is attached to Virginia's flag?"
    answer: "Virginia's flag communicates triumph over tyranny. Virtus — a female figure personifying Roman virtue and courage — stands over a defeated Tyranny with her foot on his chest. The broken chain in Tyranny's hand represents freedom from British trade restrictions; the fallen crown represents the end of monarchical rule. The motto Sic semper tyrannis — Thus always to tyrants — declares Virginia's opposition to all forms of oppressive government."

  - question: "When was the present Virginia flag approved in law?"
    answer: "Virginia officially adopted its state flag on April 30, 1861. The flag was readopted in 1912 and standardized in 1950."

  - question: "How do historians explain the symbolism of Virginia's flag?"
    answer: "The flag represents Virginia's victory over tyranny and British rule. Virtus standing over Tyranny symbolizes the triumph of virtue and freedom over oppression."

