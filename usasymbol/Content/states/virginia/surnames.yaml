etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Smith, Miller, Taylor, and Clark are Virginia's occupational names, carried in by early English colonists and reinforced by Shenandoah Valley settlers who built farms and mills in the 1700s."
    examples:
      - Smith (metalworker)
      - Miller (mill operator)
      - Taylor (cutter of cloth)
      - Clark (clerk or literate official)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Virginia's top 20, blending old colonial English and Welsh son-names such as Johnson, Williams, Jones, and Davis with Scots-Irish arrivals like Wilson, Anderson, and Thompson from the Shenandoah Valley."
    examples:
      - Johnson (son of John)
      - Williams (son of William)
      - Wilson (son of Will)
      - Anderson (son of Andrew)

  - type: Descriptive Names
    icon: fa-solid fa-palette
    description: "Brown and White both began as English nicknames describing hair or complexion, and both remained common across Virginia from the Tidewater coast to the western valley counties."
    examples:
      - Brown (brown hair or complexion)
      - White (fair hair or complexion)

