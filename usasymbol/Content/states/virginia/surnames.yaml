    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan', meaning God is gracious. Johnson became especially common in Virginia after 1865, when many formerly enslaved families across the Tidewater and Piedmont chose it as a new legal surname."

