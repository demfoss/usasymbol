    origin: english
    type: Occupational
    meaning: "From Old English 'smið', a metalworker or blacksmith. Smith arrived with the earliest English colonists at Jamestown and remained Virginia's most common surname through centuries of Tidewater settlement, Piedmont farming, and post-emancipation adoption."

