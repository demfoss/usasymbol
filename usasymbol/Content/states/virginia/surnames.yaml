seo:
  title: "Most Common Last Names in Virginia"
  description: "Virginia's most common last names are Smith, Johnson, and Williams, shaped by Jamestown-era English settlement, Shenandoah Valley Scots-Irish families, and post-emancipation naming."

page:
  h1: "Most Common Last Names in Virginia"
  intro: "Smith, Johnson, and Williams are the most common last names in Virginia, a ranking rooted in the state's status as the first permanent English colony. Tidewater plantation records, Shenandoah Valley Scots-Irish settlement, and a large African American population that chose surnames after emancipation all left their mark on today's list."
  heritage_title: "Jamestown Roots, Valley Settlers, and Emancipation-Era Naming"
  heritage_body: "English colonists founded Jamestown in 1607, and the Tidewater region's early plantation economy built a deep base of English surnames that spread along the James and York rivers. Through the 1700s, Scots-Irish and German families moved down the Great Wagon Road into the Shenandoah Valley, adding names like Wilson, Thompson, and Miller to the western counties. After emancipation in 1865, formerly enslaved Virginians across the Tidewater and Piedmont widely adopted common English surnames such as Johnson, Williams, and Jackson. More recently, Northern Virginia's growth as a Washington, D.C. suburb since the 1970s and 1980s has added Vietnamese, Korean, and Hispanic surnames to the state's demographic mix, though they have not yet broken into the statewide top 20."
  fun_fact: "Virginia was home to the first permanent English colony in North America, and its oldest surviving surnames trace directly to the Jamestown settlers of 1607, four centuries before Northern Virginia's modern immigrant communities began reshaping the state's names."

