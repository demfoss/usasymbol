    symbolism: "Represents the deep blue field of the Virginia state flag, against which the figure of Virtus stands in the state seal — the blue of colonial-era heraldic tradition, of the Continental Army's uniforms, and of the Atlantic Ocean and Chesapeake Bay that define Virginia's eastern geography; blue also reflects Virginia's monarchical heritage as the first American colony to bear the title Old Dominion, bestowed by King Charles II in recognition of Virginia's loyalty during the English Civil War"
  - name: "White"
    hex: "#FFFFFF"
    rgb: "255, 255, 255"
    cmyk: "0, 0, 0, 0"
    pantone: "White"
    symbolism: "Represents the purity of civic virtue embodied by Virtus, the female warrior figure at the center of Virginia's state seal, who stands victorious over a fallen tyrant — an image adopted in 1776 that directly references Virginia's revolutionary break from British authority; white also evokes the white columns of Virginia's historic plantation architecture, the white sand beaches of the Virginia Beach coastline, and the snow-covered peaks of the Allegheny Mountains in winter"
  - name: "Red"
    hex: "#CE1126"
    rgb: "206, 17, 38"
    cmyk: "0, 92, 82, 19"
    pantone: "PMS 186"
    symbolism: "Represents the bravery and sacrifice of Virginia's soldiers across multiple centuries of American military history — from the Continental Army to the Civil War, in which Virginia served as the primary theater of conflict and home of the Confederate capital at Richmond — and the red of colonial-era heraldic emblems that appear on the state seal's decorative border; red also reflects the blood-red clay of Virginia's Piedmont soils, one of the most distinctive geological features of the Virginia landscape"

sections:
  - id: "official-designation"
    title: "Status and History of Virginia's State Colors"
    style: "default"
    paragraphs:
      - "Virginia has not formally designated official state colors by legislative statute, making red, white, and blue an unofficial designation rooted in the Commonwealth's historical heritage rather than legal codification. Virginia's General Assembly has designated a range of official state symbols — including [the Northern Cardinal](/states/virginia/bird/northern-cardinal), dogwood (state flower and state tree), and Chesapeake Bay retriever (state dog) — but has not enacted a state colors statute. The association of red, white, and blue with Virginia derives instead from the state's foundational role in American history and the visual language of the national colors that Virginia helped create."
      - "The Commonwealth of Virginia's historical identity is more completely intertwined with the founding of the United States than any other state. Virginia hosted the first permanent English settlement in North America at Jamestown in 1607, produced the Virginia Declaration of Rights in 1776 (which directly influenced the U.S. Bill of Rights), and contributed more signers of the Declaration of Independence and framers of the U.S. Constitution than any other colony. Eight U.S. presidents were born in Virginia — more than any other state — including George Washington, Thomas Jefferson, James Madison, and James Monroe. For Virginia, red, white, and blue are more than the national palette — they are the colors of the state's direct contribution to American democracy, alongside symbolism from the Commonwealth motto."
    subsections:
      - subtitle: "The Virginia State Flag and Its Color Heritage"
        text: "The Virginia state flag, which features the Commonwealth's seal on a blue field, uses blue and white as its primary visual elements, with red appearing in the Latin motto 'Sic Semper Tyrannis' (Thus Always to Tyrants) scroll and decorative elements of the seal. The seal was designed in 1776 by a committee that included George Wythe, George Mason, and Robert Carter Nicholas — revolutionary founders who deliberately chose classical imagery to represent the new Commonwealth's rejection of monarchical tyranny. The blue field of the flag reflects the heraldic tradition of the English colonial period, while the overall blue-dominant design positions Virginia within the same color heritage as the Continental Congress's national colors and the values described on [Virginia's motto page](/states/virginia/motto/sic-semper-tyrannis)."
      - subtitle: "Old Dominion: A Royal Heritage in Colonial Colors"
        text: "Virginia earned the title Old Dominion from King Charles II of England, who bestowed the designation in recognition of Virginia's loyalty to the Crown during the English Civil War of the 1640s. This royal heritage embedded Virginia in the blue-and-red heraldic tradition of the British Crown centuries before American independence. The colonial blue-and-red palette of Virginia's English period transitioned naturally into the patriot colors of the American Revolution, in which Virginia played a central role under the leadership of Patrick Henry, George Washington, and Thomas Jefferson. The continuity of blue and red across Virginia's colonial and revolutionary periods, with white added through the Continental Army's standard colors, gives the red-white-and-blue association a depth of historical layering unique among American states and aligns with [the Old Dominion nickname history](/states/virginia/nickname/the-old-dominion)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Red, white, and blue carry specific historical weight in Virginia that the national colors alone cannot convey. Virginia is the state where American democracy was incubated — in the colonial assemblies of Williamsburg, in the revolutionary conventions of 1775 and 1776, in the constitutional debates that produced the framework of American government. The colors of the American republic are, in a direct historical sense, Virginia's colors: shaped by Virginia thinkers, carried by Virginia soldiers, and first articulated in Virginia documents. The Virginia Declaration of Rights, drafted by George Mason in 1776, preceded and informed the national Declaration of Independence and the eventual Bill of Rights — giving Virginia a claim on the meaning of American liberty that no other state can match."
    subsections:
      - subtitle: "Blue: Continuity, Governance, and the Chesapeake"
        text: "Blue in Virginia's color tradition reflects both the colonial and revolutionary heritage of the Commonwealth and the defining physical geography of its eastern landscape. The Chesapeake Bay — at 200 miles the largest estuary in North America — forms the dominant geographic feature of eastern Virginia, and the Atlantic Ocean defines the state's southeastern boundary at Virginia Beach, the most populous city in the Commonwealth. The blue of Virginia's governance heritage runs from the colonial Capitol at Williamsburg through the Federal buildings of Washington, D.C., most of whose original territory was ceded by Virginia in 1789 (though returned in 1846). The blue field of the state flag, consistent with PMS 287, embodies this tradition of stable, institutionalized governance stretching from 1607 to the present."
      - subtitle: "Red and White: Revolution, Sacrifice, and Virtue"
        text: "Red and white in Virginia's color tradition are directly connected to the Commonwealth's revolutionary heritage and its long military history. Virginia was the birthplace of the Continental Army's commander, George Washington, and provided more Continental officers than any other colony. The Revolutionary War's decisive battle was fought at Yorktown, Virginia, in October 1781, where British General Cornwallis surrendered to Washington — effectively ending the war for independence and validating the red, white, and blue of the new nation's colors. Virginia's red also carries the memory of the Civil War, in which Virginia served as the Confederacy's most important state militarily and economically, and whose battlefields — Manassas, Fredericksburg, Chancellorsville, Spotsylvania, Cold Harbor, and Petersburg — saw some of the bloodiest fighting in American history."

  - id: "state-emblems"
    title: "Usage in State Emblems, Tourism, and Civic Identity"
    style: "default"
    paragraphs:
      - "Red, white, and blue pervade Virginia's public and ceremonial life through both the state flag and the deep association of Virginia's historical sites with the national founding narrative. Virginia Tourism's branding consistently employs the national color palette to reference the state's identity as the birthplace of America — a marketing position formalized in campaigns promoting Colonial Williamsburg, Jamestown Settlement, the American Revolution Museum at Yorktown, and the network of presidential birthplaces and homes that dot the Virginia Piedmont and Tidewater. The Virginia Military Institute in Lexington, the oldest state-supported military college in the United States, uses the red-white-and-blue palette in its institutional identity, reinforcing the color's association with Virginia's military heritage. State government ceremonial contexts, official commemorations, and the Virginia General Assembly's formal occasions all draw on the red-white-and-blue palette that connects the Commonwealth to its founding role in American democracy and to the legacy of the Old Dominion nickname."

