timeline:
  - year: "1607"
    description: "English settlers establish Jamestown on May 14 — the first permanent English settlement in North America — beginning Virginia's foundational role in American history and embedding the colonial English color heritage of red, white, and blue in Virginia's identity"
  - year: "1776"
    description: "Virginia adopts the Declaration of Rights on June 12, drafted by George Mason — the first such declaration in American history and the direct predecessor of the U.S. Bill of Rights; the state seal, designed in the same year, establishes blue and white as the primary colors of Virginia's official imagery"
  - year: "1781"
    description: "British General Cornwallis surrenders to George Washington at Yorktown, Virginia on October 19, effectively ending the Revolutionary War and cementing Virginia as the decisive theater of the American independence struggle"
  - year: "1788"
    description: "Virginia ratifies the U.S. Constitution on June 25, becoming the tenth state and the critical swing vote that ensured ratification — with Virginia's founders James Madison (father of the Constitution) and George Washington (its most important advocate) driving the process"
  - year: "1861"
    description: "Virginia secedes from the Union on April 17 and becomes the central Confederate state; Richmond is the Confederate capital from May 1861 through April 1865, and Virginia's fields absorb more Civil War casualties than any other state"

expert_quote:
  text: "Virginia did not simply adopt the national colors — Virginia helped create them. The red, white, and blue of the American republic were shaped by Virginia thinkers, carried by Virginia soldiers, and first articulated in Virginia documents. No state has a stronger claim on what those colors mean."
  source: "Virginia Museum of History and Culture, Richmond, State Identity and Founding Heritage Documentation"

faq:
  - question: "What are the state colors of Virginia?"
    answer: "Virginia's traditional state colors are Red, White, and Blue, reflecting the Commonwealth's foundational role in American colonial history, the Revolutionary War, and the formation of the United States government. Virginia has not formally designated official state colors by legislative statute."
  - question: "What is the HEX code for Virginia Blue?"
    answer: "The standard HEX code for Virginia Blue is #003777, corresponding to Pantone PMS 287, consistent with the deep blue field of the Virginia state flag as specified in official flag standards."
  - question: "What is the HEX code for Virginia Red?"
    answer: "The standard HEX code for Virginia Red is #CE1126, corresponding to Pantone PMS 186, consistent with the red elements appearing in the Virginia state seal's decorative border."
  - question: "Why is Virginia associated with red, white, and blue?"
    answer: "Virginia's association with red, white, and blue reflects its founding role in American democracy — as host of Jamestown (1607), birthplace of eight U.S. presidents, author of the Virginia Declaration of Rights (1776), and the state whose delegates drafted and ratified the U.S. Constitution. Virginia's deep connection to the national founding gives the national colors a specifically Virginian historical resonance."
  - question: "What is Virginia's state motto?"
    answer: "Virginia's state motto is 'Sic Semper Tyrannis,' Latin for 'Thus Always to Tyrants,' adopted in 1776 and featured on the state seal as a scroll beneath the figure of Virtus standing over a fallen tyrant. The motto reflects the revolutionary spirit of Virginia's founding generation and their rejection of monarchical authority."

