title: Northern Cardinal
scientific_name: Cardinalis cardinalis
adopted_year: 1950
legislation: Code of Virginia Sec. 1-510
meaning: Virginia's cardinal page works best as a formalization story rather than an invention story. By the time the Commonwealth named the Northern Cardinal in 1950, earlier Virginia natural-history writing had already tied the bird to Virginia for its beauty and singing. Later Virginia law and public symbolism kept the cardinal close to the dogwood, giving the state a bird-and-flower pairing that feels more specific than the usual bright-red-year-round explanation.
author: USA Symbol Team
date_published: '2025-11-27'
date_modified: "2026-05-02"
seo_title: "Virginia State Bird | Northern Cardinal"
seo_description: Virginia adopted the Northern Cardinal in 1950. The stronger story is that the law formalized an older Virginia attachment to the bird and later kept it publicly paired with the dogwood.
intro_text: Virginia's official state bird is the <strong>Northern Cardinal</strong>, adopted in <strong>1950</strong> and now listed in <strong>Code of Virginia Sec. 1-510</strong>. The useful part of the story is that the law did not have to invent a brand-new Virginia connection. Earlier Virginia natural-history writing already treated the cardinal as a bird brought from Virginia for its beauty and agreeable singing, and later Commonwealth law even authorized license plates incorporating the official bird and floral emblem together. That gives Virginia a more specific cardinal story than the generic red-bird-in-winter version.
shared_states:
- Illinois
- Indiana
- Kentucky
- North Carolina
- Ohio
- West Virginia
