sections:
- id: why-did-the-cardinal-already-feel-virginian-before-1950
  icon: fa-solid fa-book
  title: Why Did the Cardinal Already Feel Virginian Before 1950?
  paragraphs:
  - Virginia's cardinal story reaches back further than the 1950 designation. The Virginia Museum of History & Culture's page on Mark Catesby reproduces his account of the bird as one frequently brought from Virginia and other parts of North America for its beauty and agreeable singing.
  - That is not the same as saying Virginia had an official bird in the colonial period. It does show that the cardinal already lived inside a Virginia way of describing local nature long before the code named it.
  - So when Virginia later adopted the cardinal, the Commonwealth was not building the symbol from nothing. It was giving legal force to a bird that already sounded at home in Virginia writing and memory.
- id: what-did-the-1950-law-actually-formalize
  icon: fa-solid fa-scale-balanced
  title: What Did the 1950 Law Actually Formalize?
  paragraphs:
  - 'Section 1-510 now states the point plainly: the Northern Cardinal (<em>Cardinalis cardinalis</em>) is the official bird of the Commonwealth. The code history traces Virginia''s emblem provisions back to the Code of 1950.'
  - The short wording is revealing. Virginia did not attach a long argument to the symbol or try to justify it through bird-guide facts. It simply placed the cardinal among the Commonwealth's official emblems.
  - By 1950 the bird appears to have needed little defense. Virginia was formalizing a choice that already felt settled enough to enter the emblem list without an argument.
- id: why-does-virginia-keep-the-cardinal-with-the-dogwood
  icon: fa-solid fa-tags
  title: Why Does Virginia Keep the Cardinal With the Dogwood?
  paragraphs:
  - Virginia later gave the cardinal a public partner instead of leaving it alone in one line of code. Section 46.2-728.1 authorizes special license plates incorporating the official bird and the floral emblem of the Commonwealth.
  - In practice that means the cardinal is easy to read beside the dogwood. The pairing turns the bird into part of a fuller Virginia image rather than a standalone wildlife label.
  - The pairing is not the source of the state bird law, but it matters for what the symbol became. Six other states also use the cardinal. Virginia's recurring cardinal-and-dogwood combination is one reason the bird reads as specifically Virginian rather than just a widely shared choice.
faq:
- question: What is Virginia's state bird?
  answer: Virginia's state bird is the Northern Cardinal.
- question: When did Virginia adopt the Northern Cardinal?
  answer: Virginia adopted the Northern Cardinal in 1950, and the current designation appears in Code of Virginia Sec. 1-510.
- question: Did the cardinal already have a Virginia connection before 1950?
  answer: Yes. Earlier Virginia natural-history writing already treated the cardinal as a bird associated with Virginia for its beauty and singing, which helps explain why the later designation feels more like a formalization than a sudden invention.
- question: What did the 1950 law actually do?
  answer: It made the Northern Cardinal the Commonwealth's official bird by placing it in Virginia's list of official emblems.
- question: Why does Virginia pair the cardinal with the dogwood?
  answer: Virginia later authorized special license plates incorporating the official bird and the floral emblem together. That public pairing helps the cardinal read as part of a broader Virginia image rather than as a lone bird symbol.
- question: Does Virginia share the cardinal with other states?
  answer: 'Yes. Illinois, Indiana, Kentucky, North Carolina, Ohio, and West Virginia also use the Northern Cardinal, but Virginia''s stronger angle is different: the Commonwealth treated the bird as something already familiar and later kept it close to the dogwood in public symbolism.'
- question: What does the cardinal mean for Virginia?
  answer: Virginia's cardinal is less about the bird's appearance and more about a long-standing local attachment that was eventually put into law. The recurring pairing with the dogwood in Virginia public symbolism reinforces that — the bird reads as part of a broader Virginia image, not just a wildlife label.
