title: "Sic Semper Tyrannis"
language: "Latin"
english_translation: "Thus Always to Tyrants"
adopted_year: 1776

author: "USA Symbol Team"
date_published: "2025-12-05"
date_modified: "2026-03-27"
seo_title: "Virginia State Motto: Sic Semper Tyrannis"
seo_description: "Virginia's motto was adopted July 5, 1776 — the same day it ratified its first constitution and elected Patrick Henry governor. Workers in Paris had to engrave the original seal because no craftsmen in Virginia could do it. John Wilkes Booth shouted 'Sic Semper Tyrannis!' when he shot Lincoln at Ford's Theatre in 1865."

intro_text: "Virginia's state motto is <strong>Sic Semper Tyrannis</strong> — Latin for <em>Thus Always to Tyrants</em>, adopted on July 5, 1776, the same day Virginia ratified its first state constitution and elected Patrick Henry as governor. George Wythe, America's first law professor and mentor to Thomas Jefferson, designed the Great Seal with the image of Virtus standing over a fallen crowned king. No craftsmen in Virginia could engrave the dies; workers in Paris eventually completed them. John Wilkes Booth shouted the phrase when he shot Abraham Lincoln at Ford's Theatre on April 14, 1865 — and in doing so, permanently attached Virginia's Revolutionary motto to one of American history's darkest moments."

sections:
  - id: "july-5-1776"
    icon: "fa-solid fa-calendar-day"
    title: "The Day Virginia Made It Official: Constitution, Governor, and Motto"
    paragraphs:
      - "July 5, 1776 was the most consequential single day in Virginia's founding history. The Virginia Convention ratified the state's first constitution. Delegates elected Patrick Henry as the first Governor of Virginia. And they approved the Great Seal — with 'Sic Semper Tyrannis' beneath the figure of Virtus standing over a fallen king. Three founding acts, one day."
      - "The Convention had been working on all three for weeks. A committee including George Wythe, George Mason, Richard Henry Lee, and Robert Carter Nicholas designed the seal. Wythe — who had signed the Declaration of Independence the month before, on June 1 — handled most of the seal design, bringing his deep knowledge of Roman republican history to the imagery and motto."
      - "Getting the seal engraved proved nearly impossible. No suitable craftsmen were available in Virginia. Thomas Jefferson assisted in finding engravers in Philadelphia. William and Arthur Lee searched in Europe. Workers in Paris eventually completed the seal dies and shipped them to Virginia. The Commonwealth was using a motto it couldn't yet engrave."

  - id: "george-wythe-designer"
    icon: "fa-solid fa-person-chalkboard"
    title: "George Wythe: America's First Law Professor Designed the Motto"
    paragraphs:
      - "George Wythe became the first professor of law in America when he took the chair at the College of William and Mary in 1779 — three years after designing Virginia's seal and motto. He had already been teaching law informally for years. His law students included Thomas Jefferson, John Marshall (who became the longest-serving Chief Justice in Supreme Court history), and Henry Clay (who served as Secretary of State and was called the 'Great Compromiser')."
      - "Wythe selected imagery from Roman republicanism for the seal. Virtus — the Roman goddess of virtue, courage, and excellence — stands as the central figure, identified by her spear and the helmet beneath her foot. Beneath her lies Tyranny: a crowned figure on the ground, scepter fallen, chain broken. The motto 'Sic Semper Tyrannis' runs below the scene."
      - "The phrase is attributed in some sources to Brutus at Julius Caesar's assassination in 44 BC, though historians debate whether the words were actually spoken. Wythe, who had read Roman history extensively, would have known the attribution. Whether the phrase came from that moment or from the broader Latin republican tradition, Wythe placed it beneath a scene that echoed the Brutus story: a virtuous figure defeating a crowned ruler."

  - id: "booth-shouted-it"
    icon: "fa-solid fa-triangle-exclamation"
    title: "John Wilkes Booth Shouted It When He Shot Lincoln"
    paragraphs:
      - "On April 14, 1865 — five days after Lee's surrender at Appomattox — John Wilkes Booth shot President Abraham Lincoln at Ford's Theatre in Washington, D.C. As Booth jumped from the presidential box to the stage, breaking his leg on landing, witnesses reported he shouted 'Sic Semper Tyrannis!' — Virginia's state motto. Then: 'The South is avenged.'"
      - "Booth was a Maryland-born actor with Confederate sympathies. His use of Virginia's motto at that moment was deliberate — he was casting himself as Brutus striking down a tyrant, using the same classical framework that George Wythe had embedded in Virginia's founding seal. The phrase Virginia had chosen to express Revolutionary triumph over British tyranny was now associated with a Confederate assassin's act."
      - "The phrase's history split permanently at that moment. Before 1865, 'Sic Semper Tyrannis' meant Virginia's defiance of King George III. After 1865, it carried the additional weight of Lincoln's assassination. Virginia kept the motto unchanged. Today it appears on the state seal, the state flag, and official government documents — still meaning what it meant in 1776, while remaining permanently entangled with what happened at Ford's Theatre."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Virginia State Motto Facts"
    style: "gradient"
    facts:
      - "Virginia adopted the motto on July 5, 1776 — the same day it ratified its first constitution and elected Patrick Henry governor."
      - "George Wythe, who designed the seal, was America's first law professor; his students included Jefferson, Marshall, and Clay."
      - "Workers in Paris engraved the original seal dies because no suitable craftsmen existed in Virginia."
      - "John Wilkes Booth shouted 'Sic Semper Tyrannis!' when he shot Lincoln at Ford's Theatre on April 14, 1865."
      - "The phrase is attributed to Brutus at Caesar's assassination in 44 BC, though historians debate whether it was actually spoken."
      - "Virginia's flag is one of only six U.S. state flags depicting a woman — Virtus, the goddess of virtue."

faq:
  - question: "What is Virginia's state motto?"
    answer: "Virginia's state motto is 'Sic Semper Tyrannis,' a Latin phrase meaning 'Thus Always to Tyrants.' It was adopted on July 5, 1776, as part of the Great Seal designed by a committee that included George Wythe and George Mason."

  - question: "What does 'Sic Semper Tyrannis' mean?"
    answer: "'Thus Always to Tyrants' — a declaration that tyrants will always meet defeat. 'Sic' means thus, 'semper' means always, and 'tyrannis' means tyrants. The seal reinforces the motto visually: Virtus (the Roman goddess of virtue) stands victorious over a crowned, fallen king."

  - question: "What language is Virginia's motto written in?"
    answer: "Latin. George Wythe and his committee chose Latin in 1776 to connect Virginia's founding to Roman republican ideals. The phrase is attributed in some sources to Brutus at the assassination of Julius Caesar in 44 BC, though historians debate whether it was actually spoken at that moment."

  - question: "When did Virginia adopt its motto?"
    answer: "July 5, 1776, the same day Virginia ratified its first state constitution and elected Patrick Henry as governor. Wythe's committee had been working on the seal design for weeks; the motto and seal were formally approved that day."

  - question: "Is Virginia's motto associated with Lincoln's assassination?"
    answer: "Yes. John Wilkes Booth shouted 'Sic Semper Tyrannis!' when he shot Lincoln at Ford's Theatre on April 14, 1865 — casting himself as Brutus striking down a tyrant. The phrase Virginia chose in 1776 to express Revolutionary triumph was permanently associated with the assassination. Virginia kept the motto unchanged."

  - question: "Where does Virginia's motto appear?"
    answer: "Beneath the central figures on the Great Seal — Virtus standing over a fallen crowned king with a broken chain and fallen scepter. The seal appears on the state flag (blue field with seal centered), official state documents, and government letterhead. The Secretary of the Commonwealth keeps the seal and affixes it to documents signed by the governor."

