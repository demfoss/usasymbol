type: State Coat of Arms
state: Virginia
name: Virginia State Coat of Arms
adopted_year: 1776
is_official: true
meaning: "The Virginia coat of arms was designed in the summer of 1776 to say one thing: a free people have defeated the tyrant who once ruled them. Virtus, the Roman goddess at the center, is not a figure of war in progress but of a war already won. The motto Sic Semper Tyrannis beneath her gives the design a direct voice that has carried the same meaning for 250 years."
meaning_title: Meaning of the Virginia Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Virginia Coat of Arms: Meaning, Symbols and History'
seo_description: "The Virginia coat of arms was adopted in 1776 and shows Virtus, a Roman goddess, standing on a fallen tyrant with the motto Sic Semper Tyrannis."
hero_image: /images/coats-of-arms/virginia/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of Virginia, adopted July 5, 1776, showing the Roman goddess Virtus standing on a prostrate tyrant with the motto Sic Semper Tyrannis
hero_image_caption: The Virginia Coat of Arms, adopted July 5, 1776. The Roman goddess Virtus stands with her left foot on a defeated tyrant, her spear pointing down and a sheathed sword in her other hand. The motto Sic Semper Tyrannis, meaning Thus always to tyrants, appears below.
intro_text: "The Virginia coat of arms was adopted on July 5, 1776, one day after the Continental Congress adopted the Declaration of Independence. It shows Virtus, the Roman goddess of virtue, standing in full armor with her left foot on a fallen tyrant, and carries the motto Sic Semper Tyrannis, meaning 'Thus always to tyrants.'"

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Virginia Coat of Arms?
  paragraphs:
  - "The coat of arms is the central design on the obverse, or front side, of the Great Seal of Virginia. The Great Seal has two sides: the front shows Virtus and the fallen tyrant; the back shows three Roman goddesses. The coat of arms is the front image that appears on the state flag and most official documents."
  - "The design has looked essentially the same since July 5, 1776. It was standardized in 1950 when the General Assembly resolved decades of inconsistencies that had accumulated across different printings, engravings, and manufacturers."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Virginia Coat of Arms
  paragraphs:
  - "On July 1, 1776, the Virginia Convention appointed a committee of four to design a seal for the Commonwealth: Richard Henry Lee, George Mason, George Wythe, and Robert Carter Nicholas Sr. Four days later, the committee presented a design. The Convention voted on it and approved it that same day, July 5, 1776."
  - "The design is generally believed to be principally the work of George Wythe, a lawyer, classical scholar, and signer of the Declaration of Independence. Wythe and the committee drew on their knowledge of Roman mythology and the political ideals of ancient republics to create a design that rejected all European royal symbolism."
  - "The original seal was ordered from Paris. On October 4, 1779, the General Assembly passed an act to procure a new seal based on the 1776 design. The same act changed the motto on the reverse side from the original Latin phrase to Perseverando, meaning 'by persevering.'"
  - "By the mid-1800s, different artists, engravers, and manufacturers had produced varying versions of the seal without a single authoritative rendering to follow. On February 1, 1950, the General Assembly formally standardized the design, establishing precise specifications for the figures' proportions, dress, and colors."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Virginia Coat of Arms
  paragraphs:
  - "The coat of arms places all its action in a single scene: a Roman goddess standing over a defeated man. The word 'Virginia' appears above, and the motto appears below."
  elements:
  - id: virtus
    name: Virtus
    image: /images/coats-of-arms/virginia/elements/virtus.webp
    paragraphs:
    - "A woman dressed as an Amazon warrior stands at the center of the coat of arms. Her right hand rests on a long spear with the point downward, touching the earth; her left hand holds a sheathed sword called a parazonium, pointing upward. Her head is erect and her face is turned upward. She is Virtus, the Roman goddess of virtue, described in the statute as the genius of the Commonwealth."
    - "The spear pointing down and the sheathed sword together signal that the battle is already won. She is not fighting but standing guard over a defeated enemy."
  - id: fallen_tyrant
    name: The Fallen Tyrant
    image: /images/coats-of-arms/virginia/elements/tyrant.webp
    paragraphs:
    - "A man lies prostrate on the ground beneath Virtus's left foot. His crown has fallen from his head. In his left hand he holds a broken chain, and in his right hand he holds a scourge, a type of whip used for punishment."
    - "Each detail was chosen to represent the tools of tyranny laid low: the crown for royal authority, the chain for enslavement, and the scourge for the power to punish. The Virginia Convention designed this figure in 1776 as a direct image of what the colonists believed they had just thrown off."
  - id: motto
    name: Sic Semper Tyrannis
    image: /images/coats-of-arms/virginia/elements/motto.webp
    paragraphs:
    - "The motto Sic Semper Tyrannis appears on a scroll beneath the main scene. It is Latin for 'Thus always to tyrants.' Virginia's state motto has carried this same text since the original 1776 adoption, and the phrase has been part of every official version of the coat of arms since."
    - "The motto is attributed to the broader republican tradition of 18th-century colonial leaders who admired the Roman Republic. It states not what Virginia is, but what always happens to those who rule by force."
  - id: reverse
    name: Reverse: Three Goddesses
    image: /images/coats-of-arms/virginia/elements/reverse.webp
    paragraphs:
    - "The back of the Great Seal shows three Roman goddesses standing together. Libertas stands at the center holding a wand topped by a Phrygian liberty cap. Ceres stands to her left holding a cornucopia and a stalk of wheat. Aeternitas stands to the right holding a golden globe topped by a phoenix."
    - "The reverse side carries the word Perseverando, meaning 'by persevering.' This motto replaced the original reverse motto in 1779. The three goddesses represent the blessings that flow from freedom: individual liberty, agricultural abundance, and the endurance of the state."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Virginia Coat of Arms
  paragraphs:
  - "The coat of arms was designed in 1776 by men who had just declared independence and expected war with Britain. They chose to show the war's outcome rather than its beginning: Virtus stands over the tyrant, not fighting him. The past tense is the message."
  - "The broken chain, fallen crown, and scourge on the defeated figure are not abstract warnings but a specific indictment: this is what colonial rule looked like, and the Revolution had ended it. The motto names the outcome: tyrants fall, always."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Virginia Coat of Arms Facts
  facts:
  - "Adopted: July 5, 1776, by the Virginia Convention. The design committee was appointed just four days earlier, on July 1, 1776."
  - "The design committee included Richard Henry Lee, George Mason, George Wythe, and Robert Carter Nicholas Sr. The design is generally credited to George Wythe."
  - "On October 4, 1779, the General Assembly authorized the official production of the seal and changed the reverse motto to Perseverando, meaning 'by persevering.'"
  - "By the 19th century, dozens of inconsistent versions of the coat of arms were in use. The General Assembly standardized the design on February 1, 1950."
  - "The motto Sic Semper Tyrannis, Latin for 'Thus always to tyrants,' has appeared on every official version of the coat of arms since 1776 and is also Virginia's state motto."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Virginia Coat of Arms
  paragraphs:
  - "The design of the coat of arms has not changed since 1776. What changed over time was how different engravers and printers interpreted the design, since no single standardized rendering existed for most of the seal's history."
  - "The only formal design change after 1776 came in 1779, when the General Assembly changed the motto on the reverse side of the Great Seal from the original Latin phrase to Perseverando. The obverse, which forms the coat of arms, was not altered. The 1950 standardization did not change the design but fixed how it was drawn."
  versions:
  - name: Original Convention Design (1776)
    years: 1776
    image: /images/coats-of-arms/virginia/versions/1851-engraved.png
    description: A mid-nineteenth-century engraved rendering that preserves the original 1776 design adopted by the Virginia Convention. It shows Virtus, the fallen tyrant, and the motto Sic Semper Tyrannis in a pre-standardized historical form descended from the original Commonwealth seal.
  - name: Commonwealth Rendering
    years: 1904
    image: /images/coats-of-arms/virginia/versions/1904-commonwealth-seal.png
    description: An early twentieth-century Commonwealth rendering associated with Virginia's 1904 flag era. The 1776 symbolism remains unchanged, but the figure proportions and ornamental treatment differ from both earlier engravings and the later standardized form.
  - name: Pre-Keck Rendering
    years: 1928
    image: /images/coats-of-arms/virginia/versions/1928-pre-keck.png
    description: A 1928 rendering from the last major pre-standardization phase. It documents how the arms were commonly drawn just before Virginia moved to the modern official standard.
  - name: Standardized Rendering (1950)
    years: 1950-present
    image: /images/coats-of-arms/virginia/versions/current-standard.svg
    description: The official standardized design adopted by the General Assembly on February 1, 1950. It resolved proportional and coloring inconsistencies that had accumulated across different engravings and printings since the 18th century. The design itself was not changed, only fixed to a single authoritative version.

faq:
- question: What does the Virginia coat of arms show?
  answer: "The Virginia coat of arms shows the Roman goddess Virtus standing with her left foot on a defeated tyrant. She holds a spear pointing down in her right hand and a sheathed sword in her left. The fallen man's crown lies nearby, and he holds a broken chain and a scourge. The word 'Virginia' appears above, and the motto Sic Semper Tyrannis appears below."
- question: What does Sic Semper Tyrannis mean?
  answer: "Sic Semper Tyrannis is Latin for 'Thus always to tyrants.' It is Virginia's state motto and has appeared on the coat of arms since it was adopted in 1776. The phrase means that tyrants will always be defeated or overthrown."
- question: Who designed the Virginia coat of arms?
  answer: "A four-person committee was appointed on July 1, 1776: Richard Henry Lee, George Mason, George Wythe, and Robert Carter Nicholas Sr. The design is generally credited to George Wythe, a classical scholar and later a signer of the Declaration of Independence."
- question: When was the Virginia coat of arms adopted?
  answer: "The Virginia coat of arms was adopted on July 5, 1776, by the Virginia Convention. The committee had been appointed only four days earlier. The design was formally codified by the General Assembly in 1779 and standardized in 1950."
- question: What does the fallen tyrant represent on the Virginia coat of arms?
  answer: "The man lying beneath Virtus's foot represents tyranny. His fallen crown represents royal authority, his broken chain represents the power to enslave, and his scourge represents the power to punish. Together they represent what the colonists believed they had overthrown in 1776."
- question: What is on the back of the Virginia seal?
  answer: "The reverse of the Great Seal shows three Roman goddesses: Libertas at the center with a liberty cap on a wand, Ceres to the left with a cornucopia and wheat, and Aeternitas to the right with a globe topped by a phoenix. The word Perseverando, meaning 'by persevering,' appears as the reverse motto."

