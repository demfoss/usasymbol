    origin: english
    type: Habitational
    meaning: "Originally a surname for someone who lived near a woodland clearing, from Old English \"leah.\" In Massachusetts, Lee also benefits from later Chinese and Korean immigration, giving one short surname multiple historical tracks into the state's top tier."

