    ratio: 746
    origin: irish
    type: Patronymic
    meaning: "Often from Irish \"O Coileain,\" descendant of Coilean, though Collins also exists in English usage. In Massachusetts, the name reads mainly as part of the state's broad Irish surname layer rather than its colonial English one."

unique_surnames:
  - name: Sullivan
    state_rank: 1
    national_rank: 83
    origin: irish
    why: "Sullivan is the clearest Massachusetts outlier: it ranks first in the state but much lower nationally. That pattern tracks the scale of Irish settlement in Boston, where the Irish-born population surged during the famine years and remained central to city politics and neighborhood life for generations."

  - name: McCarthy
    state_rank: 10
    national_rank: 320
    origin: irish
    why: "McCarthy reaches the Massachusetts top 10 while sitting far lower nationally. The name is strongly associated with southern Ireland, and its rise in Massachusetts reflects the state's unusually deep Irish urban settlement in Boston, Worcester, and other industrial centers."

  - name: Medeiros
    state_rank: 43
    national_rank: 2024
    origin: portuguese
    why: "Medeiros is one of the state's most distinctive Portuguese surnames. Azorean migration tied to whaling and later factory work made the South Coast a rare American zone where names like Medeiros became common enough to stand out statewide."

  - name: Cabral
    state_rank: 108
    national_rank: 1956
    origin: portuguese
    why: "Cabral is far more visible in Massachusetts than in the country as a whole because New Bedford and Fall River became long-running centers of Portuguese and Cape Verdean settlement. Those Lusophone communities kept family names like Cabral rooted in Bristol County across multiple generations."

  - name: Cote
    state_rank: 117
    national_rank: 1619
    origin: french
    why: "Cote signals the French-Canadian side of Massachusetts immigration history. Starting in the 1860s, thousands of migrants from Quebec moved into Lowell and other mill cities, where French surnames persisted alongside the better-known Irish layer."

etymology_groups:
  - type: Irish Patronymic and Clan Names
    icon: fa-solid fa-person
    description: "Massachusetts is one of the most Irish-coded surname landscapes in the United States. Sullivan, Murphy, McCarthy, Walsh, Kelly, Burke, Collins, Ryan, Donovan, Shea, and Doherty all rank unusually high because famine-era migration to Boston was followed by decades of chain migration into nearby cities and mill towns."
    examples:
      - Sullivan (descendant of Suileabhan)
      - Murphy (descendant of Murchadh)
      - McCarthy (son of Carthach)
      - Kelly (descendant of Ceallach)

  - type: Colonial English and Welsh Names
    icon: fa-solid fa-hammer
    description: "Johnson, Brown, Williams, White, Davis, Miller, Jones, Clark, and Taylor reflect the older New England surname base laid down long before the immigrant era. These names stayed common because Massachusetts never replaced its colonial layer; it simply added Irish, French-Canadian, Portuguese, and later Hispanic and Asian layers on top of it."
    examples:
      - Johnson (son of John)
      - Brown (brown-haired or brown-clad)
      - Miller (grain miller)
      - Clark (clerk or scholar)

  - type: Portuguese and Lusophone Names
    icon: fa-solid fa-ship
    description: "Silva in the top 20, along with Medeiros, Costa, Ferreira, Pereira, Sousa, Cabral, Oliveira, and Gomes nearby, gives Massachusetts a South Coast signature that most states lack. That cluster comes from maritime and industrial migration connecting New Bedford and Fall River to the Azores, Madeira, and Cape Verde from the 19th century into the 20th."
    examples:
      - Silva (forest or woodland)
      - Medeiros (from meadow or pastureland)
      - Cabral (place-based Portuguese surname)
      - Oliveira (olive tree grove)

faq:
  - question: "What are the most common surnames in Massachusetts?"
    answer: "The most common surnames in Massachusetts are Sullivan, Johnson, Brown, Murphy, and Williams. Massachusetts stands out because an Irish surname, Sullivan, ranks first statewide instead of Smith."

  - question: "Why is Sullivan the most common last name in Massachusetts?"
    answer: "Sullivan is the most common last name in Massachusetts because the state, especially Boston, absorbed a very large Irish population in the 1840s and 1850s and kept dense Irish family networks afterward. That history pushed several Irish surnames to the top of the statewide ranking, with Sullivan finishing first."

