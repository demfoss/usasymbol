    ratio: 682
    origin: english
    type: Occupational
    meaning: "From Latin \"clericus,\" meaning clerk or scholar. Clark fits Massachusetts especially well because the name belongs to old English settlement and to a state long defined by churches, schools, and record-keeping towns."

