seo:
  title: "Most Common Surnames in Massachusetts"
  description: "The most common surnames in Massachusetts are Sullivan, Johnson, and Brown, with Irish migration to Boston and Portuguese settlement on the South Coast giving the state a surname profile unlike most of America."

page:
  h1: "Most Common Surnames in Massachusetts"
  intro: "Sullivan is the most common surname in Massachusetts, followed by Johnson and Brown, and the list is unusually Irish from top to bottom. Boston's famine-era Irish migration, Lowell's and Worcester's mill-city growth, and Portuguese settlement in New Bedford and Fall River pushed names like Murphy, McCarthy, Walsh, Silva, and Kelly far higher here than in most states."
  heritage_title: "Irish Boston, Mill Cities, and the Portuguese South Coast"
  heritage_body: "Massachusetts absorbed one of the country's largest Irish inflows during and after the Great Famine; in 1847 alone Boston's Irish-born population jumped by more than 13,000, and by 1855 the city had more than 50,000 Irish residents. Textile cities such as Lowell, Lawrence, and Worcester then layered on French-Canadian and other immigrant surnames during the late 19th century. On the South Coast, whaling and later factory work tied New Bedford and Fall River to the Azores, Madeira, and Cape Verde, which helps explain why Silva ranks in the top 20 and names like Medeiros and Cabral are so visible statewide."
  fun_fact: "Massachusetts is one of the few states where Smith does not make the top 20 at all; seven clearly Irish surnames, including Sullivan, Murphy, McCarthy, Walsh, Kelly, Burke, and Collins, rank ahead of it."

surnames:
  - rank: 1
    name: Sullivan
    count: 24964
    ratio: 297
    origin: irish
    type: Patronymic
    meaning: "From Irish \"O Suileabhain,\" usually glossed as descendant of Suileabhan, a personal name associated with dark eyes. It leads Massachusetts because Boston became one of the main destinations for Irish migration during and after the Great Famine, turning an already familiar Irish surname into the state's most common one."

  - rank: 2
    name: Johnson
    count: 23404
    ratio: 317
    origin: english
    type: Patronymic
    meaning: "Son of John, from the Hebrew name Yohanan, meaning God is gracious. Johnson stays near the top in Massachusetts because it belongs to the older English naming stock of New England and also crossed easily into later Scandinavian and African American populations."

  - rank: 3
    name: Brown
    count: 22700
    ratio: 327
    origin: english
    type: Descriptive
    meaning: "From Old English \"brun,\" usually referring to brown hair, complexion, or clothing. Brown is one of the durable colonial New England surnames, common long before the 19th-century immigrant waves changed the rest of the Massachusetts list."

  - rank: 4
    name: Murphy
    count: 20129
    ratio: 368
    origin: irish
    type: Patronymic
    meaning: "From Irish \"O Murchadha,\" descendant of Murchadh, a personal name often interpreted as sea warrior. Murphy's high rank fits a state where Boston, Charlestown, and later mill cities drew large Irish Catholic communities in the 19th century."

  - rank: 5
    name: Williams
    count: 16876
    ratio: 439
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic Willahelm. Williams is common across the United States, and in Massachusetts it sits below the Irish surnames that rose faster in Boston and the industrial cities."

  - rank: 6
    name: Anderson
    count: 14293
    ratio: 519
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Anders or Andrew, from Greek Andreas, meaning manly. Anderson reflects both old Anglo-Scottish settlement and later northern European immigration into Massachusetts factory cities."

  - rank: 7
    name: White
    count: 14195
    ratio: 522
    origin: english
    type: Descriptive
    meaning: "From Old English \"hwit,\" a nickname for someone fair-haired or pale. White is another deep-rooted Massachusetts surname that reaches back to the colony era and stayed common through every later migration wave."

  - rank: 8
    name: Martin
    count: 13583
    ratio: 546
    origin: french
    type: Patronymic
    meaning: "From Latin Martinus, meaning of Mars. In Massachusetts, Martin works as both an old English-family surname and a French-Canadian surname, which helped it travel well in mill communities tied to Quebec migration."

  - rank: 9
    name: Davis
    count: 13548
    ratio: 547
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew Dawid, meaning beloved. Davis has the same older New England staying power as Brown and White, even though the state's headline surname story is more Irish than Welsh."

  - rank: 10
    name: McCarthy
    count: 13217
    ratio: 561
    origin: irish
    type: Patronymic
    meaning: "From Irish \"Mac Carthaigh,\" son of Carthach. McCarthy ranks much higher in Massachusetts than nationally because Irish settlement from counties Cork and Kerry fed Boston's neighborhoods and later spread through eastern Massachusetts and the mill belt."

  - rank: 11
    name: Miller
    count: 12922
    ratio: 574
    origin: english
    type: Occupational
    meaning: "An occupational surname for a miller, from medieval English and Scottish usage. It remains common in Massachusetts, but unlike the Irish names around it, Miller reflects general Anglo-American surname continuity rather than one dominant migration episode."

  - rank: 12
    name: Jones
    count: 12869
    ratio: 576
    origin: welsh
    type: Patronymic
    meaning: "A Welsh form meaning son of John. Jones has been common in southern New England since the colonial period, though in Massachusetts it is pushed downward by the unusual strength of Irish surnames."

