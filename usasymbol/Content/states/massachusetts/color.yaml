sections:
  - id: "official-designation"
    title: "Official Designation and Legislative History"
    style: "default"
    paragraphs:
      - "Massachusetts designated blue, green, and cranberry as the official colors of the Commonwealth under General Laws of Massachusetts, Part I, Title I, Chapter 2, Section 53, which states simply: 'Blue, green and cranberry shall be the official colors of the commonwealth.' The legislation was signed by Governor Mitt Romney on February 21, 2005, following a five-year journey from classroom proposal to enacted law that began with a third-grade civics project at the Elm Street School in Gardner, Massachusetts, in the year 2000, in the same symbolic framework as the [Massachusetts state bird](/states/massachusetts/bird/black-capped-chickadee)."
      - "The Massachusetts Design System, the official digital brand framework maintained by the Commonwealth at mass.gov, has since standardized specific HEX values for each state color: Bay Blue (#14558F), Berkshires Green (#388557), and Independence Cranberry (#680A1D). These values represent the most authoritative digital color specifications available for Massachusetts's official colors, as they are published and maintained by the Commonwealth's own digital services office for use across all state agency websites and digital communications."
    subsections:
      - subtitle: "The Gardner Third-Grade Civics Project"
        text: "The origin of Massachusetts's official state colors is unique in American state symbol history. In 2000, teacher Judith Marceau's third-grade class at the Elm Street School in Gardner, Massachusetts, undertook a civics project to propose official state colors for the Commonwealth, which at the time had none. The students debated color choices based on historical significance, rejecting black — which some associated with the Salem witchcraft trials of 1692 — as insufficiently positive. They settled on cranberry because Massachusetts once produced 70 percent of the world's cranberry crop; blue for Cape Cod Bay, which the Pilgrims crossed in 1620; and green for the Connecticut River Valley and the Berkshire Mountains. The class then pursued the legislative process for five years, working with state legislators to introduce and advance a bill that was ultimately signed into law in 2005, making the Gardner students directly responsible for one of the Commonwealth's official state symbols."
      - subtitle: "General Laws Chapter 2, Section 53"
        text: "The state color designation appears in Chapter 2 of the General Laws of Massachusetts, which governs the Arms, Great Seal, and other emblems of the Commonwealth. Section 53, added in 2005, places the color designation alongside other official emblems including the state flag, the state seal, the state flower (mayflower), and the state bird (black-capped chickadee). The statute does not specify Pantone or HEX values; the Massachusetts Design System published by mass.gov provides the authoritative digital color specifications used by state agencies for all official communications, including pages about the [official Massachusetts state flower](/states/massachusetts/flower/mayflower)."

  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Massachusetts's three official colors map directly onto the state's most defining geographic and economic identities. Blue speaks to the Atlantic Ocean and the bay waters that shaped the Commonwealth's entire colonial and post-colonial history, from the Pilgrim landing at Plymouth in 1620 to the maritime commerce that made Boston one of the most important port cities in 18th-century North America. Green speaks to the interior landscape of the Commonwealth — the river valleys and mountain ranges that define western Massachusetts and stand in geographic contrast to the densely urbanized eastern corridor. Cranberry speaks to a native crop so historically dominant that Massachusetts's share of global production once approached three-quarters of the entire world supply."
    subsections:
      - subtitle: "Blue in Massachusetts History"
        text: "Blue's association with Massachusetts begins with the Atlantic crossing of the Mayflower in 1620, when 102 passengers spent 66 days at sea before making landfall at what is now Provincetown on Cape Cod. Cape Cod Bay, the body of water enclosed by the curved arm of Cape Cod, was the first Massachusetts water the Pilgrims navigated, and it remains one of the most historically significant bodies of water in American history. Blue also represents Boston Harbor, where the Boston Tea Party of December 16, 1773 — in which colonists dumped 342 chests of British East India Company tea into the harbor — became one of the pivotal acts of American colonial resistance. The state flag's navy blue field, which bears the Massachusetts coat of arms, has further embedded blue in the Commonwealth's visual identity since the adoption of the current flag design in 1971 and in the [Massachusetts flag history](/states/massachusetts/flag/massachusetts-state-flag)."
      - subtitle: "Green in Massachusetts History"
        text: "Green represents the forested inland Massachusetts that remains ecologically distinct from the state's eastern coastal zone. The Connecticut River, which flows south through the Pioneer Valley of western Massachusetts before crossing into Connecticut, created some of the most fertile farmland in colonial New England and supported agricultural communities from the earliest decades of English settlement. The Berkshire Mountains in the far west of the Commonwealth reach elevations above 3,400 feet at Mount Greylock, the state's highest point, and support forests of sugar maple, beech, and yellow birch whose fall foliage draws hundreds of thousands of visitors annually. Gardner, the city where the state colors were proposed, sits in Worcester County in north-central Massachusetts, surrounded by the mixed hardwood forests that the third-grade students associated with the green of the Berkshires."
      - subtitle: "Cranberry in Massachusetts History"
        text: "The cranberry (Vaccinium macrocarpon) is native to the acidic peat bogs of southeastern Massachusetts and Cape Cod, where it has been harvested by the Wampanoag people for centuries before European settlement. Commercial cranberry cultivation in Massachusetts began in the early 19th century, and by the late 1800s the state had established itself as the dominant global producer of the fruit. At its peak, Massachusetts produced approximately 70 percent of the world's cranberry supply, with the bogs of Plymouth, Barnstable, and Bristol counties covering thousands of acres of the southeastern coastal plain. Ocean Spray, the agricultural cooperative founded in 1930 in Hanson, Massachusetts, and now headquartered in Lakeville, grew into North America's leading producer of cranberry juice with annual sales exceeding two billion dollars. Massachusetts has since been overtaken by Wisconsin as the leading cranberry-producing state, but remains the largest producer of cranberry juice concentrate in North America."

  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Digital Identity"
    style: "default"
    paragraphs:
      - "Massachusetts's official state colors do not appear in the state flag, which predates the 2005 color designation and features a navy blue field with the state coat of arms in white and gold — a palette distinct from the legislated blue, green, and cranberry. The official colors have found their most visible institutional expression in the Massachusetts Design System, the Commonwealth's digital brand framework published and maintained at mass.gov, which specifies Bay Blue (#14558F), Berkshires Green (#388557), and Independence Cranberry (#680A1D) as the primary, accent, and supporting brand colors respectively for all Commonwealth digital services. This framework governs the visual identity of hundreds of state agency websites serving millions of Massachusetts residents. Cranberry's presence in the official color palette reinforces a cluster of related state symbols: the cranberry is also designated the official state berry under Massachusetts law, and cranberry juice is designated the official state beverage under a separate statute, making the cranberry the only item in Massachusetts state law to hold three simultaneous official designations as part of [The Bay State identity](/states/massachusetts/nickname/the-bay-state)."

