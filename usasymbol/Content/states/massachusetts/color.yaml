timeline:
  - year: "1620"
    description: "The Mayflower crosses Cape Cod Bay in November, landing Pilgrim settlers at what is now Provincetown; Cape Cod Bay becomes the symbolic origin of Massachusetts Blue as proposed by the Gardner students nearly 400 years later"
  - year: "1773"
    description: "The Boston Tea Party on December 16 sees colonists dump 342 chests of British tea into Boston Harbor, cementing blue Atlantic waters as a backdrop to Massachusetts's most defining acts of historical significance"
  - year: "1816"
    description: "Henry Hall of Dennis, Massachusetts, begins the first deliberate commercial cultivation of cranberries, establishing the southeastern Massachusetts bog industry that would grow to dominate global cranberry production within a century"
  - year: "1930"
    description: "Ocean Spray Cranberries cooperative founded in Hanson, Massachusetts, by a group of cranberry growers seeking to process and market their crop collectively; Ocean Spray grows into North America's leading cranberry juice producer"
  - year: "2000"
    description: "Teacher Judith Marceau's third-grade class at the Elm Street School in Gardner, Massachusetts, proposes blue, green, and cranberry as official state colors as part of a civics project; students begin the legislative process to have the colors formally adopted"
  - year: "2005"
    description: "Governor Mitt Romney signs legislation on February 21 designating blue, green, and cranberry as the official colors of the Commonwealth under General Laws of Massachusetts, Chapter 2, Section 53, five years after the Gardner students first proposed them"

expert_quote:
  text: "Massachusetts's state colors are the only ones in the nation proposed by elementary school students through the full legislative process — from classroom debate to governor's signature — making them a civics lesson as much as a color palette."
  source: "Massachusetts Secretary of the Commonwealth, State Symbols Documentation"

faq:
  - question: "What are the official colors of Massachusetts?"
    answer: "The official colors of Massachusetts are Blue, Green, and Cranberry, designated under General Laws of Massachusetts, Chapter 2, Section 53, signed into law by Governor Mitt Romney on February 21, 2005. Blue represents Cape Cod Bay; green represents the Connecticut River Valley and the Berkshire Mountains; cranberry represents the state's historic cranberry industry. For broader context, compare Massachusetts with [states by population](/rankings/demographics/states-by-population)."
  - question: "What is the HEX code for Massachusetts Blue?"
    answer: "The official HEX code for Massachusetts Blue is #14558F, designated as 'Bay Blue' in the Massachusetts Design System published by mass.gov. This corresponds approximately to Pantone PMS 301."
  - question: "What is the HEX code for Massachusetts Green?"
    answer: "The official HEX code for Massachusetts Green is #388557, designated as 'Berkshires Green' in the Massachusetts Design System published by mass.gov. This corresponds approximately to Pantone PMS 7727."
  - question: "What is the HEX code for Massachusetts Cranberry?"
    answer: "The official HEX code for Massachusetts Cranberry is #680A1D, designated as 'Independence Cranberry' in the Massachusetts Design System published by mass.gov. This corresponds approximately to Pantone PMS 7421."
  - question: "Who chose Massachusetts's state colors?"
    answer: "Massachusetts's state colors were originally proposed by a third-grade civics class taught by Judith Marceau at the Elm Street School in Gardner, Massachusetts, in 2000. The students pursued the legislative process for five years before Governor Mitt Romney signed the colors into law in 2005."
  - question: "When were Massachusetts's state colors officially adopted?"
    answer: "Massachusetts's state colors were officially adopted on February 21, 2005, when Governor Mitt Romney signed the bill into law, adding Section 53 to Chapter 2 of the General Laws of Massachusetts."
  - question: "Why is cranberry a Massachusetts state color?"
    answer: "Cranberry was chosen because Massachusetts once produced 70 percent of the world's annual cranberry crop. The cranberry is also simultaneously the official state berry and the official state beverage (cranberry juice) of Massachusetts, making it the most legislatively recognized symbol in the Commonwealth's state symbol framework."

