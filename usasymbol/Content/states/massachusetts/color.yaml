title: "Official and Traditional Colors of Massachusetts"
state: "Massachusetts"
adopted_year: 2005

seo_title: "Massachusetts State Colors: Official HEX Codes & Meaning"
seo_description: "Massachusetts state colors are Blue, Green, and Cranberry, officially designated in 2005. Get HEX, RGB, and Pantone specs plus the story behind each color choice."

intro_text: "The official state colors of Massachusetts are **Blue**, **Green**, and **Cranberry**, formally designated by the Massachusetts General Court on February 21, 2005, under General Laws of Massachusetts, Chapter 2, Section 53. Blue represents Cape Cod Bay, green represents the Connecticut River Valley and the Berkshires, and cranberry represents the state's historic cranberry industry — all visible across [the Massachusetts state flag](/states/massachusetts/flag/massachusetts-state-flag) and state branding. For designers and print professionals, exact HEX, RGB, CMYK, and Pantone codes are in the specifications below, alongside the full [U.S. state colors reference](/symbols/colors)."

official_colors: "Blue, Green, and Cranberry"
official_since: "2005 (General Laws of Massachusetts, Chapter 2, Section 53)"
primary_use: "Commonwealth of Massachusetts state branding, Massachusetts Design System (mass.gov), state agency digital and print communications"
known_for: "The only U.S. state colors originally proposed by a third-grade civics class; cranberry is simultaneously the official state berry and the official state beverage (cranberry juice), making it the most multifaceted symbol in Massachusetts state law"

