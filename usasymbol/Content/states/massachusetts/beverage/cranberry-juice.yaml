seo_description: Massachusetts's official state beverage is cranberry juice, designated May 4, 1970. Learn why cranberry juice was chosen, the history of cranberry growing in Massachusetts, and how it connects to the state's broader symbol system.
intro_text: '**Cranberry juice** is the official state beverage of Massachusetts, designated on **May 4, 1970**. Massachusetts is one of the country''s leading cranberry-producing states, with a farming tradition on the bogs of Plymouth County and Cape Cod that stretches back more than two centuries. When the legislature picked a drink to represent the Commonwealth, the answer was growing in fields a short drive from the State House.'
