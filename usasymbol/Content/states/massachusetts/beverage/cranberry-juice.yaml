faq:
- question: What is the official state drink of Massachusetts?
  answer: Massachusetts's official state beverage is cranberry juice. It was designated on May 4, 1970, in recognition of the Commonwealth's cranberry industry.
- question: When did Massachusetts adopt cranberry juice as its state beverage?
  answer: May 4, 1970. The Massachusetts Legislature designated cranberry juice the official state beverage on that date.
- question: Why was cranberry juice chosen as Massachusetts's state beverage?
  answer: The designation honored the Massachusetts cranberry industry, which has been farming in Plymouth County and on Cape Cod for more than two hundred years. Cranberries are one of the state's most geographically specific and historically significant crops.
- question: Is cranberry also a Massachusetts state symbol?
  answer: Yes. The cranberry is also the official state berry of Massachusetts. The same plant holds two separate positions in the state's official symbol system — the berry for the fruit itself, and cranberry juice for the beverage.
- question: Where is Ocean Spray headquartered?
  answer: Ocean Spray Cranberries, Inc. is headquartered in Middleborough, Massachusetts. The cooperative was founded in 1930 by Massachusetts and New Jersey cranberry growers.
- question: Is Massachusetts a major cranberry producer?
  answer: Yes. Massachusetts is consistently one of the top cranberry-producing states in the country, alongside Wisconsin. The crop is concentrated in Plymouth County and the upper Cape Cod area.
- question: What cocktails use cranberry juice?
  answer: Cranberry juice is an ingredient in the Cape Codder (cranberry juice and vodka, named for Cape Cod) and the Cosmopolitan. Both cocktails are culturally associated with the region, though the state beverage designation covers cranberry juice itself — not any specific cocktail.
