  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Babingtonite Facts"
    facts:
      - "Adopted as Massachusetts's state mineral in 1971."
      - "Babingtonite was first described in 1824 from Arendal, Norway, but Massachusetts has produced some of the finest crystals found anywhere."
      - "Early specimens came from 19th-century quarries around Somerville and Charlestown, sites now built over by the city."
      - "Crystals form inside gas cavities in basalt, growing as glassy, radiating clusters rarely larger than a few centimeters."

