intro_text: "Massachusetts's state mineral is babingtonite, adopted in 1971 to honor a dark, glassy mineral that has produced some of the finest crystal specimens found anywhere from the state's own traprock quarries. This profile appears in the [list of U.S. state minerals](/symbols/minerals)."

sections:
  - id: overview
    icon: fa-solid fa-cube
    title: Massachusetts State Mineral
    paragraphs:
      - "Babingtonite is the official state mineral of Massachusetts, designated by the Massachusetts General Court in 1971. It is a calcium-iron silicate that grows as small, glassy black crystals inside cavities in basalt, and specimens from Massachusetts rank among the best the mineral has produced anywhere in the world."
      - "Lawmakers chose a mineral tied to the Commonwealth's own quarries rather than a widely traded gem, giving the state a symbol rooted in its own bedrock."

  - id: what-is
    icon: fa-solid fa-cube
    title: "What Is Babingtonite?"
    paragraphs:
      - "Babingtonite forms as small, shiny, dark greenish-black to black crystals with a glassy to submetallic luster, often growing in radiating clusters inside gas pockets within basalt. Individual crystals rarely grow larger than a few centimeters, but their sharp, glassy faces catch light distinctly against the surrounding gray rock."
      - "Babingtonite is a calcium-iron silicate in a mineral group called inosilicates. Massachusetts is not known for mineral wealth generally, which makes its traprock ridges an unexpected source of some of the world's finer babingtonite crystals."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Massachusetts Chose Babingtonite as Its State Mineral"
    paragraphs:
      - "Babingtonite crystals were collected in Massachusetts as early as the 1830s from old quarries around Somerville and Charlestown, just outside Boston, and mineralogists later confirmed the specimens closely matched the mineral's original description from Norway. That early, well-documented American occurrence gave Massachusetts a direct claim to the mineral."
      - "Quarrying of the local basalt, known regionally as traprock, continued well into the 20th century, and quarries in Westfield kept producing fine babingtonite crystals long after the old Boston-area sites were built over. Naming babingtonite the state mineral in 1971 recognized a material mineral collectors already associated closely with Massachusetts."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Babingtonite Became Massachusetts's State Mineral"
    paragraphs:
      - "State lawmakers designated babingtonite the official state mineral in 1971, formally recognizing a mineral already prized by collectors for its strong association with Massachusetts quarries."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Babingtonite Is Found in Massachusetts"
    paragraphs:
      - "Westfield, in the western part of the state, has been a leading modern source of Massachusetts babingtonite, with crystals recovered from active traprock quarries there. Earlier specimens came from 19th-century quarries around Somerville and Charlestown, though urban development has since covered most of those original sites."
    sites:
      - name: Westfield traprock quarries
        city: Westfield
