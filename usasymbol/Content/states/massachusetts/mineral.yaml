faq:
  - question: What is Massachusetts's state mineral?
    answer: "Massachusetts's state mineral is babingtonite, a dark greenish-black to black calcium-iron silicate that forms glassy crystals inside cavities in basalt."
  - question: When did Massachusetts adopt babingtonite as its state mineral?
    answer: "The Massachusetts General Court designated babingtonite the official state mineral in 1971."
  - question: Why did Massachusetts choose babingtonite?
    answer: "Massachusetts quarries, first around Somerville and Charlestown and later in Westfield, produced some of the finest babingtonite crystals ever found, giving the state a strong claim to the mineral."
  - question: Is babingtonite valuable?
    answer: "Babingtonite is not cut as a gemstone or mined for industrial use; its value is to mineral collectors, who prize well-formed Massachusetts crystals as some of the best examples of the species."

