intro_text: "Massachusetts's state seal shows a Wampanoag figure on a blue shield, an armored arm holding a sword above, and the motto \"Ense petit placidam sub libertate quietem\" (\"By the sword we seek peace, but peace only under liberty\"), a phrase attributed to Algernon Sidney and first incorporated by Paul Revere in 1775."
