meaning: 'The Great Seal of the Commonwealth of Massachusetts centers on a Wampanoag figure with a downward bow on a blue shield, paired with the motto "Ense petit placidam sub libertate quietem." Paul Revere first designed the seal in 1775; the motto is attributed to Algernon Sidney, an English theorist executed in 1683, and translates as "By the sword we seek peace, but peace only under liberty." The traditional composition remains the official seal while the Massachusetts Seal, Flag, and Motto Advisory Commission continues work on possible future replacements.'
