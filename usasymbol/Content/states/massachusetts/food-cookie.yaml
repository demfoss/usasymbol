sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Massachusetts's State Cookie?"
    paragraphs:
      - "The chocolate chip cookie is Massachusetts's official state cookie, designated by the Massachusetts General Court in 1997. It is a butter cookie studded with pieces of chocolate."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Chocolate Chip Cookie"
    paragraphs:
      - "The chocolate chip cookie is made from a butter and sugar dough mixed with chunks or chips of chocolate, then baked until the edges turn golden brown while the center stays soft. It is one of the most widely made cookies in the United States."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Chocolate Chip Cookie Became Massachusetts's State Cookie"
    paragraphs:
      - "The Massachusetts General Court designated the chocolate chip cookie the official state cookie in 1997, following a campaign by Massachusetts elementary school students."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Massachusetts Chose the Chocolate Chip Cookie"
    paragraphs:
      - "The chocolate chip cookie was invented in the 1930s by Ruth Wakefield at the Toll House Inn in Whitman, Massachusetts, when she added chopped chocolate to a butter cookie recipe. That documented origin in the state made it a natural choice for state cookie."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where the Chocolate Chip Cookie Comes From in Massachusetts"
    paragraphs:
      - "The Toll House Inn in Whitman, Massachusetts, where Ruth Wakefield created the recipe, is recognized as the birthplace of the chocolate chip cookie, though the original building no longer stands."
    sites:
      - name: Toll House Inn site
        city: Whitman
        lat: 42.0793
        lng: -70.9370
        note: "Birthplace of the chocolate chip cookie"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Chocolate Chip Cookie Facts"
    facts:
      - "Adopted as Massachusetts's state cookie in 1997."
      - "Invented by Ruth Wakefield at the Toll House Inn in Whitman, Massachusetts, in the 1930s."
      - "The Toll House brand name comes directly from the inn where the cookie was created."

