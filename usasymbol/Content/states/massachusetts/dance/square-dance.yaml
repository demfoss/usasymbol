sections:
  - id: overview
    icon: fa-solid fa-music
    title: Massachusetts State Dance
    paragraphs:
      - "Massachusetts designated square dance the folk dance of the Commonwealth in 1990. The choice placed square dance beside New England's older contra dance tradition rather than replacing it, since the two forms had long shared halls, callers, and musicians across the state."

  - id: what-is
    icon: fa-solid fa-people-arrows
    title: "Square Dance Explained"
    paragraphs:
      - "Square dance sets four couples in a square, facing the center, and a caller announces each figure just before dancers perform it. Because the calls come live, the same basic figures can be arranged into many different sequences from one dance to the next."
      - "A string band of fiddle, banjo, and guitar typically carries the music, with a steady tempo that keeps all eight dancers moving together. In New England halls, square dance and contra dance often shared the same evening, the same callers, and the same musicians."

  - id: how-to-dance
    icon: fa-solid fa-shoe-prints
    title: How to Dance the Square Dance
    steps:
      - title: "Form a Square of Four Couples"
        description: "Four couples take positions on the four sides of a square, each partner beside the other, facing the middle."
      - title: "Circle Left with the Group"
        description: "All eight dancers join hands and move together around the square, then reverse direction on the caller's cue."
      - title: "Allemande Left with Your Corner"
        description: "Turn to the dancer on your left, the corner, take hands, and walk a small circle around each other."
      - title: "Do-Si-Do Your Partner"
        description: "Walk forward and pass your partner right shoulder to right shoulder, circling back to back before returning to place."
      - title: "Promenade Home"
        description: "Take your partner's hands and walk together around the square back to your starting position."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Square Dance Represents Massachusetts
    paragraphs:
      - "New England town halls and grange buildings had hosted contra and barn dances since the colonial era, and square dance folded naturally into that same circuit of callers and community gatherings. The two dance forms shared enough figures and etiquette that square dance felt like an extension of an existing local practice rather than an outside addition."
      - "Massachusetts also acted during the national campaign, active from the 1970s through the 1990s, in which square-dance callers' associations and dance clubs pressed state legislatures to name square dance an official folk dance. Massachusetts callers and clubs joined that same movement, framing the Commonwealth designation as recognition of a dance already active statewide."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Square Dance Became the State Dance
    paragraphs:
      - "Massachusetts designated square dance the folk dance of the Commonwealth in 1990, part of the wider wave of state legislatures acting during the national square-dance callers' campaign of that period."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Square Dance Facts
    facts:
      - "Massachusetts adopted square dance as the folk dance of the Commonwealth in 1990."
      - "Massachusetts uses the term Commonwealth in its official designation rather than State."
      - "Square dance shared halls, callers, and musicians with New England's older contra dance tradition."
      - "A caller announces every figure live, so no two square dances follow an identical sequence."
      - "Square dance music is traditionally carried by a string band of fiddle, banjo, and guitar."

