faq:
  - question: What is Massachusetts's state dance?
    answer: "Massachusetts designates square dance as the official folk dance of the Commonwealth, adopted in 1990."
  - question: When did Massachusetts adopt square dance as its state dance?
    answer: "Massachusetts adopted square dance as its folk dance of the Commonwealth in 1990."
  - question: Why did Massachusetts choose square dance?
    answer: "Square dance had grown alongside the state's existing contra and barn dance tradition, sharing halls and callers, while national callers' associations were also pressing states to give it official status."
  - question: Why does Massachusetts say Commonwealth instead of State?
    answer: "Massachusetts is one of four states that officially call themselves a Commonwealth in their state constitution, so its symbol designations use that word in place of State."

