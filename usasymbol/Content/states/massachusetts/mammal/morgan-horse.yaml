faq:
  - question: "What is Massachusetts' state horse?"
    answer: "Massachusetts' state horse is the Morgan horse (Equus caballus), designated in 1970 through Chapter 587 of the Acts of 1970. The Morgan is America's first documented horse breed, named for Justin Morgan, a Massachusetts-born schoolteacher."
  
  - question: "When was the Morgan horse designated as Massachusetts' state horse?"
    answer: "The Morgan horse became Massachusetts' official state horse in 1970. Vermont had previously designated the Morgan as its state animal in 1961. Both states claim the breed through different historical connections."
  
  - question: "Why did Massachusetts choose the Morgan horse as its state horse?"
    answer: "Massachusetts chose the Morgan horse because the breed is named for Justin Morgan, who was born in West Springfield, Massachusetts, in 1747. The Morgan is America's first documented horse breed, with all members tracing back to a single foundation stallion that belonged to Justin Morgan. The breed represents American innovation during the Revolutionary period and embodies New England values of versatility and determination."
  
  - question: "Who was Justin Morgan?"
    answer: "Justin Morgan was a Massachusetts schoolteacher, composer, and businessman born in West Springfield in 1747. He lived in various Massachusetts towns before moving to Vermont around 1788. He acquired the foundation stallion of the Morgan breed in the 1790s. When Justin Morgan died in 1798, his remarkable horse became known as 'Justin Morgan's horse' and eventually gave the breed its name. Morgan also composed hymns that appeared in early American tunebooks."
  
  - question: "How is the Morgan horse connected to Massachusetts if the breed developed in Vermont?"
    answer: "The Morgan horse connects to Massachusetts through Justin Morgan himself, who was born and educated in the Commonwealth. Although the foundation stallion lived in Vermont and the breed developed there, the horse and all his descendants carry the name of a Massachusetts man. Massachusetts claimed the Morgan as state horse in 1970, nine years after Vermont designated it as state animal, with both states honoring different aspects of the breed's history."
  
  - question: "What makes Morgan horses special?"
    answer: "Morgan horses are America's first documented horse breed, with all members tracing to a single foundation sire born around 1789. They are known for exceptional versatility—the same horse can pull a carriage, work on a farm, compete in shows, and serve as a pleasure riding mount. Morgan horses are compact, powerful, and intelligent, with refined beauty and willing temperaments. They played important roles in American history, including serving as Union cavalry horses during the Civil War."
  
  - question: "What is the connection between the Morgan horse and Massachusetts' other symbols?"
    answer: "The Morgan horse shares connections with other Massachusetts symbols through themes of American innovation and Revolutionary-era achievement. Like the Boston Terrier (state dog), the Morgan is an American first—the first horse breed versus the first dog breed. Both were designated as state symbols in the 1970s. Justin Morgan lived during the Revolutionary period, connecting the breed to the same era that produced Massachusetts' state motto about seeking peace and liberty."
  
  - question: "Where can I see Morgan horses in Massachusetts?"
    answer: "Morgan horses can be seen at the annual New England Morgan Horse Show in Northampton, at the Big E (Eastern States Exposition) in West Springfield each September, and at UMass Amherst's equine programs. Numerous Morgan breeding farms throughout Massachusetts welcome visitors by appointment. Contact the American Morgan Horse Association for a breeder directory and event calendar."

