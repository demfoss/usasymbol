faq:
  - question: "What is Massachusetts' state dog?"
    answer: "Massachusetts' state dog is the Boston Terrier (Canis lupus familiaris), designated in 1979 through Chapter 374 of the Acts of 1979. The Boston Terrier is the first dog breed created in the United States."
  
  - question: "When was the Boston Terrier designated as Massachusetts' state dog?"
    answer: "The Boston Terrier became Massachusetts' official state dog in 1979. The legislature chose this breed because it was developed in Boston during the 1870s and represents the first major dog breed created in America."
  
  - question: "Why did Massachusetts choose the Boston Terrier as its state dog?"
    answer: "Massachusetts chose the Boston Terrier because the breed was created in Boston in the 1870s, making it the first dog breed developed in the United States. The breed is named for its birthplace and has been recognized by the American Kennel Club since 1893. The Boston Terrier represents American innovation, Boston's identity, and Massachusetts' role in creating something distinctly American."
  
  - question: "Where did the Boston Terrier originate?"
    answer: "The Boston Terrier was developed in Boston, Massachusetts, around 1870. Breeders in Boston's Hay Market district crossed English Bulldogs with white English Terriers to create a new companion breed. The careful breeding program took place entirely in the Boston area through the 1870s and 1880s. The American Kennel Club recognized the breed in 1893."
  
  - question: "Why are Boston Terriers called 'American Gentlemen'?"
    answer: "Boston Terriers are nicknamed 'American Gentlemen' because of their distinctive tuxedo-like coat pattern and refined demeanor. The breed has white markings on a dark coat that resemble formal evening wear, with a white chest blaze, white muzzle band, and white blaze between the eyes. The nickname also reflects the breed's friendly, dignified temperament."
  
  - question: "Are Boston Terriers good family dogs?"
    answer: "Yes, Boston Terriers make excellent family dogs. They are friendly, intelligent, and adaptable to various living situations including apartments. The breed generally gets along well with children and other pets. Their moderate size (12-25 pounds) and moderate energy level make them suitable for families in urban, suburban, or rural settings. They require moderate daily exercise and minimal grooming."
  
  - question: "Is the Boston Terrier related to any other state symbols?"
    answer: "The Boston Terrier shares thematic connections with Massachusetts' other state symbols. Like the state motto about seeking liberty, the Boston Terrier represented American independence from European breeding traditions—it was the first major dog breed created in America rather than imported from Europe. The breed emerged from Boston during the same era when the city was becoming a center of education, culture, and innovation."
  
  - question: "How big do Boston Terriers get?"
    answer: "Boston Terriers are small to medium-sized dogs standing 15-17 inches tall at the shoulder. The breed standard recognizes three weight classes: under 15 pounds, 15-20 pounds, and 20-25 pounds. Boston Terriers should never exceed 25 pounds according to American Kennel Club standards. The breed is compact and muscular despite its relatively small size."

