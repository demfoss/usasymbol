title: "Boston Terrier"
scientific_name: "Canis lupus familiaris"
adopted_year: 1979

seo_title: "Massachusetts State Dog: Boston Terrier | Official Breed"
seo_description: "The Boston Terrier is Massachusetts' state dog, designated in 1979. This breed was created in Boston in the 1870s and represents American innovation and character."

intro_text: "Massachusetts' state dog is the Boston Terrier, designated in 1979. Developed in Boston during the 1870s, this breed stands as the first dog breed created in the United States. The legislature chose the Boston Terrier to honor a distinctly American dog that captures the determination and friendly spirit Massachusetts values. It is also included in the [list of U.S. state dogs](/symbols/dogs)."

