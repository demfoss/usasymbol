faq:
  - question: "What is Massachusetts' state cat?"
    answer: "Massachusetts' state cat is the tabby cat (Felis catus), designated on July 11, 1988, through Chapter 195 of the Acts of 1988. Tabby is a coat pattern, not a specific breed, characterized by distinctive stripes, spots, or swirls and an 'M' marking on the forehead."
  
  - question: "When was the tabby cat designated as Massachusetts' state cat?"
    answer: "The tabby cat became Massachusetts' official state cat on July 11, 1988. The designation came in response to a campaign by schoolchildren throughout the Commonwealth who wanted Massachusetts to recognize an official feline symbol."
  
  - question: "Why did Massachusetts choose the tabby pattern instead of a specific cat breed?"
    answer: "Massachusetts chose the tabby pattern rather than a specific breed to honor ordinary working cats rather than expensive purebreds. Tabby cats arrived on colonial ships like the Mayflower as working animals that protected grain stores from rodents. The pattern appears in approximately 60-70% of domestic cats, making it democratic and accessible—most Massachusetts families already had tabby cats in their homes. This choice reflected Massachusetts values of practicality and accessibility over aristocratic exclusivity."
  
  - question: "What is a tabby cat?"
    answer: "A tabby is any domestic cat displaying a coat pattern with distinctive stripes, spots, swirls, or ticked coloring, usually with an 'M' marking on the forehead. Tabby is not a breed but a pattern that appears in many breeds and mixed-breed cats. The pattern comes from the African wildcat, the ancestor of all domestic cats. There are four main tabby patterns: mackerel (vertical stripes), classic (swirled markings), spotted, and ticked."
  
  - question: "What does the 'M' on a tabby's forehead mean?"
    answer: "The 'M' marking on a tabby cat's forehead results from the same genes that create tabby stripes. It helps break up the cat's outline when viewed from above, providing camouflage inherited from wild ancestors. Various legends claim the 'M' stands for different things, but scientifically it's simply a natural consequence of tabby genetics. The marking appears consistently enough to serve as a reliable identifier of tabby heritage."
  
  - question: "Did cats come to Massachusetts on the Mayflower?"
    answer: "While no records specifically document cats aboard the original Mayflower in 1620, ship cats were standard on vessels of that era for rodent control. The 1957 recreation voyage of Mayflower II from England to Plymouth, Massachusetts, included a famous tabby cat named Felix who became a national celebrity. Cats were definitely present in Massachusetts by the early colonial period, with written records from 1609 mentioning cats in Jamestown."
  
  - question: "How is the tabby cat connected to other Massachusetts state symbols?"
    answer: "The tabby cat shares maritime heritage with the state fish (cod)—both represent working animals essential to Massachusetts' early economy. Like the Boston Terrier (state dog), the tabby was designated following a student-led campaign. The choice of a coat pattern rather than a purebred reflects Massachusetts' democratic values and preference for accessible, working-class symbols over aristocratic ones."
  
  - question: "What is the difference between tabby cats and other cats?"
    answer: "Tabby describes a coat pattern, not a breed or type of cat. All cats carry tabby genes inherited from the African wildcat ancestor, but other genes may hide the pattern in solid-colored cats. Tabby cats display visible stripes, spots, swirls, or ticked patterns in their fur, while non-tabby cats have solid colors or other patterns like calico or pointed. Tabbies don't have different personalities or characteristics based solely on their pattern—temperament depends on breed, individual genetics, and socialization."

