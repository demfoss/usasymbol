faq:
  - question: "What is Massachusetts' state marine mammal?"
    answer: "Massachusetts' state marine mammal is the North Atlantic right whale (Eubalaena glacialis), designated in 1980 through Chapter 155 of the Acts of 1980."
  
  - question: "When was the right whale designated as Massachusetts' state marine mammal?"
    answer: "The North Atlantic right whale became Massachusetts' official state marine mammal in 1980. The legislature chose this critically endangered species to honor the state's maritime history and commitment to marine conservation."
  
  - question: "Why did Massachusetts choose the right whale as its state marine mammal?"
    answer: "Massachusetts chose the North Atlantic right whale because it represents the state's transformation from the world's whaling capital to a leader in marine conservation. The state's whalers hunted right whales nearly to extinction from the 1600s through 1800s. By selecting this endangered species as its symbol in 1980, Massachusetts acknowledged its role in the species' decline and committed to protecting right whales in state waters."
  
  - question: "Where can I see right whales in Massachusetts?"
    answer: "The best places to see right whales in Massachusetts are whale watching cruises from Provincetown, Gloucester, or Boston that visit Stellwagen Bank National Marine Sanctuary. Right whales are most commonly seen from January through May. Cape Cod Bay beaches occasionally offer shore-based viewing opportunities, particularly from February through April when right whales concentrate in the bay to feed."
  
  - question: "How many right whales are left?"
    answer: "Approximately 350 North Atlantic right whales remain in the entire population, with fewer than 70 breeding females. The species is critically endangered. Scientists estimate the original population before commercial whaling was 10,000 to 20,000 individuals. The population has declined since 2010 despite decades of protection efforts."
  
  - question: "Why are they called right whales?"
    answer: "Colonial whalers named them 'right' whales because they were the right whale to hunt. Right whales swim slowly, often at the surface, making them easy to approach. When killed, their bodies float due to thick blubber, making them easy to retrieve. These characteristics that made them valuable to Massachusetts whalers also nearly caused their extinction."
  
  - question: "Is the right whale on Massachusetts' flag or seal?"
    answer: "No, the right whale does not appear on Massachusetts' flag or seal. The state coat of arms features a Native American holding a bow and arrow, with a star representing Massachusetts as one of the original thirteen colonies. The right whale was designated separately as the state marine mammal to honor Massachusetts' maritime heritage."
  
  - question: "What threatens right whales in Massachusetts waters?"
    answer: "The two biggest threats to right whales in Massachusetts waters are vessel strikes and fishing gear entanglement. Large ships traveling to and from Boston Harbor can collide with feeding whales. Fishing lines and nets can wrap around whales, causing injury or death. Massachusetts implements vessel speed restrictions and works with the fishing industry to reduce these threats to the state marine mammal."

