title: "North Atlantic Right Whale"
scientific_name: "Eubalaena glacialis"
adopted_year: 1980

seo_title: "Massachusetts State Marine Mammal: Right Whale | Official"
seo_description: "The North Atlantic right whale is Massachusetts' state marine mammal, designated in 1980. It represents the state's journey from whaling center to whale protector."

intro_text: "Massachusetts' state marine mammal is the North Atlantic right whale (Eubalaena glacialis), designated in 1980. The legislature chose this critically endangered species to honor the state's transformation from the world's whaling capital to a leader in marine conservation. The right whale symbolizes both Massachusetts' maritime heritage and its commitment to protecting the oceans that shaped its history, and it appears in the [list of U.S. state marine mammals](/symbols/marine-mammals)."

common_name: "North Atlantic Right Whale"
official_since: "1980"
status: "Critically Endangered (approximately 350 individuals remain)"
habitat_in_state: "Cape Cod Bay, Massachusetts Bay, Stellwagen Bank, coastal waters from Cape Ann to Nantucket"
known_for: "Symbolizing Massachusetts' evolution from whaling industry dominance to marine conservation leadership"

size: "45 to 55 feet in length"
weight: "Adults: 50,000–70,000 pounds (25–35 tons)"
coloration: "Black overall with irregular white patches on belly; distinctive callosities (rough white patches) on head"
distinctive_traits: "No dorsal fin, broad back, V-shaped blow (spout), callosities colonized by whale lice creating unique identification patterns"

habitat: "Coastal waters, particularly productive feeding grounds in bays and along continental shelf"
range_in_state: "Cape Cod Bay (winter-spring critical habitat), Massachusetts Bay, Stellwagen Bank National Marine Sanctuary, waters off Cape Ann"
conservation_status: "Critically endangered under federal Endangered Species Act; population approximately 350 whales with fewer than 70 breeding females"
where_to_find: "Stellwagen Bank National Marine Sanctuary (whale watching cruises from Provincetown, Gloucester, Boston); Cape Cod Bay (visible from shore January–April); New England Aquarium exhibits"
symbol_connections: "Connects to state fish (cod) through shared maritime heritage; parallels state motto's theme of seeking peace after conflict—Massachusetts once hunted right whales to near-extinction and now leads protection efforts"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The Massachusetts Legislature designated the North Atlantic right whale as the official state marine mammal in 1980 through Chapter 155 of the Acts of 1980. The law recognized the species' historical and ecological significance to the Commonwealth and reinforced [The Bay State maritime identity](/states/massachusetts/nickname/the-bay-state)."
      - "The designation came during a period when scientists had just begun understanding how perilously close right whales had come to extinction. The species received federal endangered status in 1970, and Massachusetts residents increasingly recognized their waters as critical right whale habitat."
    
    subsections:
      - subtitle: "How Massachusetts Chose Its Symbol"
        text: "The push to designate a state marine mammal began in the late 1970s as environmental awareness grew across Massachusetts. Marine biologists at institutions including Woods Hole Oceanographic Institution and the New England Aquarium provided research showing that Cape Cod Bay served as essential feeding grounds for right whales each spring. The choice reflected growing public interest in protecting the very species Massachusetts whalers had once hunted most aggressively."
      
      - subtitle: "Why the Right Whale for Massachusetts"
        text: "Massachusetts selected the right whale because no other animal tells the state's maritime story more completely. For over two centuries, from the 1600s through the 1800s, Massachusetts dominated the global whaling industry. Nantucket and New Bedford grew wealthy hunting whales, particularly the slow-moving right whales that earned their name by being the 'right' whale to catch. By 1980, Massachusetts chose this same species as its symbol—not to celebrate the hunt, but to acknowledge past harm and commit to making it right."

  - id: "state-symbolism"
    icon: "fa-anchor"
    title: "What the Right Whale Represents"
    style: "highlight"
    paragraphs:
      - "The right whale embodies Massachusetts' complex relationship with the ocean. The state built its early wealth on whaling, sending ships around the world to hunt these massive mammals. Today, Massachusetts leads efforts to save the species from extinction."
      - "New Bedford once held the title of whaling capital of the world in the mid-1800s. The city's prosperity came directly from hunting right whales and other species. Streets were paved with gold earned from whale oil that lit lamps across America and Europe."
      - "Choosing this endangered whale as the state symbol represents redemption and responsibility. Massachusetts accepts its role in bringing right whales to the edge of extinction and now dedicates substantial resources to ensuring their survival, aligning with ideals in the [Massachusetts state motto](/states/massachusetts/motto/ense-petit-placidam-sub-libertate-quietem)."
    
    subsections:
      - subtitle: "From Exploitation to Protection"
        text: "The history of right whales in Massachusetts waters is a story of radical transformation. Colonial whalers began hunting right whales off Cape Cod in the early 1600s, recognizing them as valuable because they swam slowly near shore, floated when killed, and contained abundant oil and baleen. By the late 1800s, commercial whaling had reduced the North Atlantic population to perhaps 100 individuals. The 1980 designation marked Massachusetts' formal acknowledgment that the state bore responsibility for the species' survival. The choice was an act of ecological reckoning rarely seen in state symbolism."
      
      - subtitle: "Cape Cod Bay as Critical Habitat"
        text: "Cape Cod Bay holds unique importance for right whales and for Massachusetts' identity. Each winter and spring, right whales arrive in the bay to feed on massive concentrations of zooplankton. Scientists estimate that 30 to 40 percent of the entire right whale population visits Cape Cod Bay annually, making it one of the most important habitats for the species. The bay's productivity stems from the same oceanographic conditions that made Massachusetts a fishing power. When the state chose the right whale in 1980, it recognized Cape Cod Bay as irreplaceable for the species' survival."
      
      - subtitle: "The Name That Doomed Them"
        text: "Right whales received their common name from whalers who considered them the 'right' whale to hunt. They swam slowly, often at the surface. When killed, their bodies floated due to thick blubber layers, making them easy to retrieve. A single whale provided 50 to 70 barrels of oil and enormous quantities of baleen used for corset stays, umbrella ribs, and other products. These exact characteristics that made them valuable to Massachusetts whalers nearly caused their extinction. The state's choice to honor them as its marine mammal represents an acknowledgment of that history."
      
      - subtitle: "Stellwagen Bank and Federal Protection"
        text: "In 1992, twelve years after Massachusetts designated the right whale as state mammal, the federal government established Stellwagen Bank National Marine Sanctuary off the coast between Cape Ann and Cape Cod. The 842-square-mile sanctuary protects some of the most productive feeding grounds in the Gulf of Maine. Right whales, humpback whales, and other marine life depend on the nutrient-rich waters above this underwater plateau. The sanctuary designation reinforced Massachusetts' commitment to protecting the species it had chosen as its symbol."
      
      - subtitle: "Ship Strikes and Modern Threats"
        text: "Right whales face their greatest modern threat in the same waters where Massachusetts once hunted them. Collisions with large vessels kill several right whales each year, particularly in shipping lanes leading to Boston Harbor. The other major threat comes from entanglement in fishing gear, which can cause prolonged suffering and death. Massachusetts has implemented vessel speed restrictions in right whale habitat and developed fishing gear modifications to reduce entanglement risk. These protective measures cost money and inconvenience commercial interests, but they reflect the state's commitment to its marine mammal."

  - id: "identification"
    icon: "fa-binoculars"
    title: "How to Identify Right Whales"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Right whales are massive animals with distinctive features that make them recognizable even at a distance. Their most striking characteristic is the lack of a dorsal fin—the back appears smooth and broad. The head comprises about one-quarter of the total body length and is covered with raised patches of rough, whitish skin called callosities."
        list_items:
          - "**Size**: Adults reach 45–55 feet in length; females grow slightly larger than males"
          - "**Weight**: 50,000–70,000 pounds (25–35 tons), comparable to ten elephants"
          - "**Appearance**: Stocky black body with white patches on belly; head covered with barnacle-like callosities"
          - "**Blow**: V-shaped spout rising 15 feet when whale surfaces to breathe"
      
      - subtitle: "Identifying Individual Whales"
        text: "Scientists identify individual right whales by photographing the unique pattern of callosities on each whale's head. These rough white patches are colonized by whale lice and cyamids, creating patterns as distinctive as human fingerprints. Researchers have catalogued every known North Atlantic right whale using these callosity patterns. Scars from ship strikes and fishing gear entanglements provide additional identifying marks, though these represent the threats facing the population."
      
      - subtitle: "Behavior in Massachusetts Waters"
        text: "Right whales visit Massachusetts waters primarily to feed on dense concentrations of zooplankton, particularly a tiny crustacean called Calanus finmarchicus. They feed by swimming through plankton patches with their mouths open, filtering water through baleen plates that trap food. A feeding right whale may stay submerged for 10 to 20 minutes before surfacing to breathe. Mothers with calves often bring their young to Cape Cod Bay, where calves learn to feed in the productive waters."

  - id: "in-the-state"
    icon: "fa-map-marked-alt"
    title: "Right Whales in Massachusetts Waters"
    style: "default"
    paragraphs:
      - "Massachusetts waters serve as critical habitat for the North Atlantic right whale population. Cape Cod Bay, Massachusetts Bay, and the waters above Stellwagen Bank host the whales from late winter through spring when zooplankton blooms provide essential food in coastal zones represented on the [Massachusetts state flag](/states/massachusetts/flag/massachusetts-state-flag)."
      - "Population trends are deeply concerning. Scientists estimate fewer than 350 right whales remain in the entire North Atlantic, with fewer than 70 breeding females. The population has declined since 2010 despite decades of protection efforts."
    
    facts:
      - "**Cape Cod Bay**: Hosts 30–40% of the entire right whale population each winter-spring"
      - "**Stellwagen Bank**: Designated National Marine Sanctuary in 1992; 842 square miles of protected feeding habitat"
      - "**Critical Period**: January through April when whales concentrate in Cape Cod Bay"
      - "**Historic Population**: Estimated at 10,000–20,000 individuals before commercial whaling"

  - id: "where-to-see"
    icon: "fa-ship"
    title: "Where to See Right Whales"
    style: "default"
    paragraphs:
      - "Whale watching trips from Provincetown, Gloucester, and Boston offer the best opportunities to see right whales in Massachusetts waters. Stellwagen Bank National Marine Sanctuary provides excellent whale viewing from spring through fall, though right whales are most common in late winter and early spring."
    
    list_items:
      - "**Stellwagen Bank Cruises**: Whale watching boats from Provincetown, Gloucester, and Boston Harbor visit the sanctuary; right whales most likely January–May"
      - "**Cape Cod Bay Shore Viewing**: Race Point Beach in Provincetown and beaches along Cape Cod Bay occasionally allow shore-based right whale sightings, particularly February–April"
      - "**New England Aquarium**: Boston harbor location offers educational exhibits about right whales, their history with Massachusetts, and ongoing conservation efforts; aquarium scientists conduct right whale research"

  - id: "current-status"
    icon: "fa-shield-alt"
    title: "Conservation Status"
    style: "default"
    paragraphs:
      - "North Atlantic right whales are critically endangered with approximately 350 individuals remaining. The species faces extinction despite 50 years of federal protection under the Endangered Species Act and Marine Mammal Protection Act, and comparisons are often made across [states by population](/rankings/demographics/states-by-population)."
      - "The population declined sharply after 2010 due to increased deaths from vessel strikes and fishing gear entanglements. Birth rates have also dropped, with scientists observing fewer calves in recent years than needed to sustain the population."
    
    subsections:
      - subtitle: "Protection Efforts in Massachusetts"
        text: "Massachusetts implements strict vessel speed restrictions in right whale habitat, particularly in Cape Cod Bay during critical feeding periods. Ships must reduce speed to 10 knots or less in designated zones to reduce collision risk. The state also works with commercial fishing operations to develop fishing gear that poses less entanglement risk. These measures have proven controversial because they affect commercial shipping and fishing, but Massachusetts maintains them as essential for the state marine mammal's survival. Research programs based at the New England Aquarium and other institutions track individual whales, monitor population health, and work with industries to develop protection strategies."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The right whale connects to multiple Massachusetts state symbols through shared themes of maritime heritage and ocean resources. The state fish, the cod, represents the fishing industry that built coastal Massachusetts. Together, the cod and the right whale tell the story of how Massachusetts used and now works to protect ocean resources, alongside long-term forest and shore stewardship seen in the [official Massachusetts state tree](/states/massachusetts/tree/american-elm)."
      - "Massachusetts' state motto adds deeper meaning to the right whale designation. The motto 'Ense petit placidam sub libertate quietem' translates to 'By the sword we seek peace, but peace only under liberty.' Massachusetts once pursued right whales with harpoons and now seeks peace with the species through protection."
    
    subsections:
      - subtitle: "The Cod Connection"
        text: "Massachusetts designated the cod as the official state fish in 1974, six years before selecting the right whale. Both symbols represent species that shaped Massachusetts' economy and identity. The Grand Banks fishing grounds that produced cod wealth lie in the same waters where right whales feed. A carved wooden cod has hung in the Massachusetts State House since 1784, symbolizing the fishing industry's importance. The pairing of cod and right whale as state symbols acknowledges that Massachusetts built its prosperity on ocean resources and now bears responsibility for their stewardship."
      
      - subtitle: "State Motto and Redemption"
        text: "The Massachusetts motto speaks of seeking peace through strength. This theme resonates with the right whale designation in an unexpected way. The state demonstrated strength in building the world's greatest whaling fleet, then demonstrated different strength in choosing a whale species as its official symbol. The motto's reference to liberty takes on additional meaning—Massachusetts now defends the right whale's liberty to exist after nearly destroying that liberty through commercial hunting. The connection suggests that true peace comes not from conquest but from making right what was harmed."
        link:
          label: "See Massachusetts state motto"
          url: "/states/massachusetts/motto/ense-petit-placidam-sub-libertate-quietem"

