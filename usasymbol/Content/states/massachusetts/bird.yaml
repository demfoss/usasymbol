sections:
- id: why-did-massachusetts-end-up-with-the-chickadee
  icon: fa-solid fa-circle-question
  title: Why Did Massachusetts End Up With the Chickadee?
  paragraphs:
  - Massachusetts did not arrive at the chickadee as the only obvious answer. Through the 1930s, the veery had a real case — it is a forest thrush with a distinctive, spiraling call, and the conversation around it had reached public discussion by 1937, including a notice in The New Yorker that summer. But the veery is a migratory bird that leaves the Northeast in autumn.
  - By 1941, the Commonwealth chose something that stayed. The black-capped chickadee is a year-round resident across Massachusetts — present in towns, parks, woodlots, and backyards through January and February, when a migratory state bird would be somewhere in Central America.
- id: why-year-round-presence-mattered
  icon: fa-solid fa-snowflake
  title: Why a Winter Bird Made a Better State Symbol
  paragraphs:
  - A state bird has more symbolic use when people can actually encounter it. Massachusetts winters are long and strip the landscape of most species. The chickadee remained — recognizable by its black cap and bib, and by the two-note call that gives the bird its name — making it a working emblem rather than a seasonal reminder.
  - Maine had already designated the same species in 1927. That overlap doesn't diminish the Massachusetts logic; the two states independently arrived at the same practical answer. The chickadee is the right bird for a long New England winter, regardless of which state noticed first.
faq:
- question: What is Massachusetts's state bird?
  answer: Massachusetts's state bird is the Black-capped Chickadee, adopted on March 21, 1941.
- question: Why did Massachusetts choose the Black-capped Chickadee?
  answer: Massachusetts chose the chickadee because it is a year-round resident — present through winter when migratory birds are gone. The state had earlier considered the veery, a migratory thrush, before settling on the chickadee in 1941.
- question: Did Massachusetts consider another bird before the chickadee?
  answer: Yes. The veery — a migratory forest thrush — was under discussion as a state bird candidate through the 1930s. It was passed over, likely because it leaves Massachusetts for winter, making it a less practical year-round emblem.
- question: When did Massachusetts adopt the Black-capped Chickadee?
  answer: Massachusetts adopted the Black-capped Chickadee on March 21, 1941, under what is now Mass. Gen. Laws ch. 2, sec. 9.
- question: What other state shares the Black-capped Chickadee as a state bird?
  answer: Maine also uses the Black-capped Chickadee as its state bird, having adopted it in 1927 — fourteen years before Massachusetts.
