title: Black-capped Chickadee
scientific_name: Poecile atricapillus
adopted_year: 1941
legislation: Mass. Gen. Laws ch. 2, sec. 9
meaning: 'Massachusetts ended up with the chickadee after earlier state-bird debate had gone toward the veery. What settled the question was something practical: the chickadee was familiar year-round, and the veery was not.'
author: USA Symbol Team
date_published: '2025-11-25'
date_modified: "2026-05-02"
seo_title: "Massachusetts State Bird | Black-capped Chickadee"
seo_description: "Massachusetts adopted the Black-capped Chickadee in 1941 after rejecting the veery. A year-round bird beat a migratory rival."
intro_text: Massachusetts's official state bird is the <strong>Black-capped Chickadee</strong>, adopted on <strong>March 21, 1941</strong> and codified in <strong>Mass. Gen. Laws ch. 2, sec. 9</strong>. The chickadee was not the first candidate. Through the 1930s, state-bird talk in Massachusetts had included the veery, a migratory thrush — a more romantic choice and a worse practical one. By 1941, the Commonwealth settled on a bird that residents could keep encountering through the New England winter, not just in warmer months.
