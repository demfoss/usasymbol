- id: facts
  icon: fa-solid fa-lightbulb
  title: Atlantic Cod Facts
  facts:
  - Adopted in 1974 by the Massachusetts Legislature.
  - Scientific name is Gadus morhua.
  - Can grow up to 51 inches long and weigh up to 77 pounds.
  - Can live more than 20 years.
  - Has a whisker-like barbel under its chin and a pale line along each side.
faq:
- question: What is Massachusetts's state fish?
  answer: The state fish of Massachusetts is the Atlantic cod. It became official in 1974.
- question: When did Massachusetts adopt the Atlantic cod?
  answer: The Massachusetts Legislature made the cod the official state fish in 1974.
- question: Why did Massachusetts choose the Atlantic cod?
  answer: Cod fishing was a big part of the state's early history and economy. State law calls the cod a historic and continuing symbol of Massachusetts.
- question: What is the Sacred Cod?
  answer: The Sacred Cod is a carved wooden codfish about five feet long. It has hung in the Massachusetts House of Representatives since 1784 to honor the state's fishing industry.
- question: Is Cape Cod named after the fish?
  answer: Yes. Cape Cod was named in the 1600s after the cod that were plentiful in the waters around it.
