seo_title: Massachusetts State Fish | Atlantic Cod
seo_description: The Massachusetts state fish is the Atlantic cod, adopted in 1974. Learn what it looks like, where it lives, and why it became official.
hero_image: /images/fish/massachusetts/massachusetts-fish-hero.webp
hero_image_alt: An Atlantic cod with a heavy spotted body, a pale line along its side, and a small whisker under its chin.
hero_image_caption: The Atlantic cod has been the official state fish of Massachusetts since 1974. Photo by Wilhelm Thomas Fiege, CC BY-SA 4.0.
intro_text: Massachusetts's state fish is the Atlantic cod, a heavy, spotted ocean fish that has been linked to the state since colonial times. It became official in 1974. This profile appears in the [list of U.S. state fish](/symbols/fish).
sections:
- id: overview
  icon: fa-solid fa-fish
  title: What Is the State Fish of Massachusetts?
  paragraphs:
  - The Atlantic cod is the official state fish of Massachusetts. The Massachusetts Legislature made it official in 1974. Its scientific name is Gadus morhua.
  - State law calls the cod the fish emblem of the state and its "historic and continuing symbol."
- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Atlantic Cod
  paragraphs:
  - The Atlantic cod has a heavy body, a large head, and a blunt snout. A small whisker called a barbel hangs from its chin.
  - Its color depends on where it lives. It can be golden, olive green, or brown, and it is covered in dark speckles with a pale belly.
  - A clear white line runs down each side of its body. It also has three fins along its back, which makes it easy to spot.
- id: selection
  icon: fa-solid fa-landmark
  title: How It Became the State Fish
  paragraphs:
  - State lawmakers named the cod the official state fish of Massachusetts in 1974.
  - By then, the cod had already been a symbol of Massachusetts for about 200 years. Since 1784, a carved wooden cod called the Sacred Cod has hung in the House of Representatives at the State House in Boston.
- id: reason
  icon: fa-solid fa-circle-question
  title: Why Massachusetts Chose the Atlantic Cod
  paragraphs:
  - Cod fishing played a big part in the early history and economy of Massachusetts. Native Americans and early colonists both relied on cod for food. Fishing for cod also helped the colony earn money through trade.
  - Cape Cod is named after the fish. The Sacred Cod in the State House reminds lawmakers how much the fishing industry has mattered to the state.
- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Atlantic Cod
  paragraphs:
  - Atlantic cod live in the cold ocean waters off Massachusetts, including Massachusetts Bay. They stay near the sea floor, often along rocky slopes and ledges.
  - In the western Atlantic, cod range from Greenland down to Cape Hatteras in North Carolina.
