  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Rhodonite Facts"
    facts:
      - "Adopted as Massachusetts's state gem in 1979."
      - "The Betts manganese mine in Plainfield was first worked in the 1830s and mined heavily around 1848."
      - "Rhodonite's pink color comes from manganese, and its dark veining comes from manganese oxide."
      - "The Betts mine tailings also produce rhodochrosite and spessartine garnet alongside rhodonite."

