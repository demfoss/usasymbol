sections:
  - id: overview
    icon: fa-solid fa-gem
    title: Massachusetts State Gem
    paragraphs:
      - "Rhodonite is Massachusetts's official state gem, designated by the Massachusetts General Court in 1979. It is a manganese silicate valued for its pink to rose-red color, and the state's best-known material comes from an old manganese mine in Plainfield."
      - "Lawmakers chose a mineral with a genuine local collecting history rather than an imported gem, giving Massachusetts rockhounds a symbol tied to their own hills."

  - id: what-is
    icon: fa-solid fa-gem
    title: "What Is Rhodonite?"
    paragraphs:
      - "Rhodonite is a manganese silicate that ranges in color from light pink to a deep rose or reddish pink, frequently crossed with dark veins of black manganese oxide. That contrast between the pink body color and the black veining is the material's most recognizable feature."
      - "Rhodonite forms in metamorphic rock alongside other manganese minerals, and in Massachusetts it occurs in schist with garnet and rhodochrosite. Cut and polished, rhodonite takes a good shine and is used in jewelry and decorative carving."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Massachusetts Chose Rhodonite as Its State Gem"
    paragraphs:
      - "The Betts manganese mine in Plainfield, first worked in the 1830s and mined more heavily around 1848, left behind tailings piles that became one of New England's classic mineral-collecting sites. Rhodonite, along with rhodochrosite and spessartine garnet, is what collectors have searched those tailings for ever since."
      - "By the time lawmakers acted in 1979, rhodonite already had decades of standing among Massachusetts rockhounds as the state's signature pink gem material. Naming it the state gem formalized a choice the collecting community had effectively made on its own."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Rhodonite Became Massachusetts's State Gem"
    paragraphs:
      - "State lawmakers designated rhodonite the official state gem in 1979, recognizing a mineral already closely associated with the Betts mine tailings in Plainfield."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Rhodonite Is Found in Massachusetts"
    paragraphs:
      - "Plainfield, in Hampshire County, is the site of the former Betts manganese mine, whose tailings piles remain a well-known collecting spot for rhodonite, rhodochrosite, and garnet. The mine itself closed generations ago, but rock hounds still search the surface tailings there today."
    sites:
      - name: Betts Manganese Mine
        city: Plainfield
