faq:
  - question: What is Massachusetts's state gem?
    answer: "Massachusetts's state gem is rhodonite, a pink to rose-red manganese silicate often marked with dark veining."
  - question: When did Massachusetts adopt rhodonite as its state gem?
    answer: "The Massachusetts General Court designated rhodonite the official state gem in 1979."
  - question: Why did Massachusetts choose rhodonite?
    answer: "Rhodonite from the old Betts manganese mine in Plainfield had already been collected by Massachusetts rockhounds for generations by the time lawmakers made it the official state gem."
  - question: Where can you find rhodonite in Massachusetts?
    answer: "The tailings piles at the former Betts manganese mine in Plainfield remain the state's best-known rhodonite collecting site."

