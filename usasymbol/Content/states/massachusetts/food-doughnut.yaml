sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Massachusetts's State Doughnut?"
    paragraphs:
      - "The Boston cream doughnut is Massachusetts's official state doughnut, designated by the Massachusetts General Court in 2003. It is a round doughnut filled with custard and coated with chocolate frosting."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Boston Cream Doughnut"
    paragraphs:
      - "A Boston cream doughnut is a yeast-raised doughnut injected with vanilla custard and topped with a layer of chocolate frosting or glaze. It carries the same custard and chocolate flavor combination as Boston cream pie in doughnut form."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Boston Cream Doughnut Became Massachusetts's State Doughnut"
    paragraphs:
      - "The Massachusetts General Court designated the Boston cream doughnut the official state doughnut in 2003, adding a fourth dessert-related food symbol to the state's list alongside the corn muffin, Boston cream pie, and chocolate chip cookie."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Massachusetts Chose the Boston Cream Doughnut"
    paragraphs:
      - "The Boston cream doughnut takes its name and flavor directly from Boston cream pie, already the state dessert, giving Massachusetts a doughnut version of a dessert already tied to the city of Boston."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Boston Cream Doughnut Facts"
    facts:
      - "Adopted as Massachusetts's state doughnut in 2003."
      - "Named for its shared flavor with Boston cream pie, Massachusetts's state dessert since 1996."
      - "Massachusetts has four dessert-related state food symbols: corn muffin, Boston cream pie, chocolate chip cookie, and Boston cream doughnut."

