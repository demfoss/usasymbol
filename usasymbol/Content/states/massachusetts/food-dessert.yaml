intro_text: "Massachusetts's state dessert is Boston cream pie, adopted in 1996, a sponge cake filled with custard and topped with chocolate glaze that was created at Boston's Parker House hotel. This profile appears in the [list of U.S. state foods](/symbols/desserts)."

sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Massachusetts's State Dessert?"
    paragraphs:
      - "Boston cream pie is Massachusetts's official state dessert, designated by the Massachusetts General Court in 1996. Despite its name, it is a cake, made of two sponge cake layers filled with custard and topped with chocolate glaze."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About Boston Cream Pie"
    paragraphs:
      - "Boston cream pie consists of two layers of yellow sponge cake filled with vanilla custard and coated on top with a chocolate glaze or fondant. It is called a pie because it was originally baked in a pie tin, a common practice before cake pans were widely available."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How Boston Cream Pie Became Massachusetts's State Dessert"
    paragraphs:
      - "The Massachusetts General Court designated Boston cream pie the official state dessert in 1996, following a campaign led by Massachusetts schoolchildren."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Massachusetts Chose Boston Cream Pie"
    paragraphs:
      - "Boston cream pie was created in the 1850s by a French chef at Boston's Parker House hotel, now the Omni Parker House, making it a dessert with a documented origin in the state's capital city."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Boston Cream Pie Comes From in Massachusetts"
    paragraphs:
      - "The Omni Parker House hotel in downtown Boston still credits itself as the birthplace of Boston cream pie and continues to serve it today."
    sites:
      - name: Omni Parker House
        city: Boston
        lat: 42.3581
        lng: -71.0603
        note: "Birthplace of Boston cream pie"
        type: primary

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Boston Cream Pie Facts"
    facts:
      - "Adopted as Massachusetts's state dessert in 1996."
      - "Created at Boston's Parker House hotel in the 1850s."
      - "Despite the name, it is a cake, not a pie."

