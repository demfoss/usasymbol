intro_text: "Massachusetts's state berry is the cranberry, adopted in 1994 to recognize a crop grown in bogs across the southeastern part of the state since colonial times. This profile appears in the [list of U.S. state foods](/symbols/fruits)."

sections:
  - id: overview
    title: "What Is the Massachusetts State Berry?"
    paragraphs:
      - "The cranberry is Massachusetts's official state berry, designated by the Massachusetts General Court in 1994. Cranberries are grown in wetland bogs across Plymouth County and Cape Cod."

  - id: about
    title: "About the Cranberry"
    paragraphs:
      - "Cranberries are small, tart red berries that grow on low vines in wetland bogs. Growers flood the bogs at harvest time each fall, causing the buoyant berries to float to the surface where they can be gathered in bulk."

  - id: selection
    title: "How the Cranberry Became the State Berry"
    paragraphs:
      - "The Massachusetts General Court designated the cranberry the official state berry in 1994."

  - id: reason
    title: "Why Massachusetts Chose the Cranberry"
    paragraphs:
      - "Massachusetts growers have cultivated cranberries commercially since the early 1800s, and the bogs of Plymouth County and Cape Cod remain one of the country's leading cranberry growing regions."

  - id: location
    title: "Where Massachusetts Cranberries Are Grown"
    paragraphs:
      - "Plymouth County and Cape Cod are home to most of the state's working cranberry bogs, and the town of Wareham hosts events tied to the annual fall harvest."
    sites:
      - name: Cranberry bogs of Plymouth County
        city: Wareham
        lat: 41.76
        lng: -70.72
        note: "Historic cranberry growing region"
        type: primary

  - id: facts
    title: "Cranberry Facts"
    facts:
      - "Adopted as Massachusetts's state berry in 1994."
      - "Massachusetts growers have farmed cranberries commercially since the early 1800s."
      - "Cranberry bogs are flooded at harvest time so the berries float for gathering."

