sections:
  - id: overview
    icon: fa-solid fa-mountain
    title: Massachusetts State Rock
    paragraphs:
      - "Roxbury puddingstone is Massachusetts's official state rock, designated by the Massachusetts General Court in 1983. It is a conglomerate, a sedimentary rock made of pebbles cemented together, formally known to geologists as the Roxbury Conglomerate."
      - "Massachusetts chose a rock that literally underlies part of Boston rather than a material valued for mining or jewelry, tying the designation to the ground the city itself is built on."

  - id: what-is
    icon: fa-solid fa-mountain
    title: "What Is Roxbury Puddingstone?"
    paragraphs:
      - "Roxbury puddingstone is a conglomerate: a dark, hardened matrix packed with rounded pebbles and cobbles of many colors and rock types. The mix of smooth, embedded stones set in a firm background is what gives the rock its texture, resembling dried fruit suspended in a pudding."
      - "The rock formed roughly 570 to 595 million years ago, when loose gravel, sand, and silt were compressed and cemented together over time. Boston residents nicknamed it puddingstone for its resemblance to the fruit-studded holiday pudding once common in New England kitchens."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: "Why Massachusetts Chose Roxbury Puddingstone as Its State Rock"
    paragraphs:
      - "The rock underlies so much of the Roxbury section of Boston that the neighborhood itself took its name from it, appearing as Rocksbury on some early maps. Exposed outcrops of the conglomerate can still be seen at surface level around the neighborhood today."
      - "Roxbury puddingstone has also been quarried and used as building stone across the Boston area for centuries, giving it a visible presence well beyond its name. In 1886, a thirty-ton puddingstone boulder from Roxbury was shipped to Gettysburg to serve as a monument for a Massachusetts regiment, a mark of how closely residents identified the rock with their home state."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How Roxbury Puddingstone Became Massachusetts's State Rock"
    paragraphs:
      - "State lawmakers designated Roxbury puddingstone the official state rock in 1983, recognizing a conglomerate already tied to Boston's geography, place names, and building history."

  - id: location
    icon: fa-solid fa-map-location-dot
    title: "Where Roxbury Puddingstone Is Found in Massachusetts"
    paragraphs:
      - "The Roxbury neighborhood of Boston sits directly on top of the conglomerate that shares its name, with outcrops still visible at the surface in parks and rock cuts around the area. The formation extends beneath other nearby parts of Boston as well, but Roxbury remains the type location where the rock is best exposed."
