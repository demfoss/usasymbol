faq:
  - question: What is Massachusetts's state rock?
    answer: "Massachusetts's state rock is Roxbury puddingstone, a conglomerate made of rounded pebbles cemented into a darker rock matrix."
  - question: When did Massachusetts adopt Roxbury puddingstone as its state rock?
    answer: "The Massachusetts General Court designated Roxbury puddingstone the official state rock in 1983."
  - question: Why did Massachusetts choose Roxbury puddingstone?
    answer: "The rock underlies the Roxbury section of Boston, giving the neighborhood its name, and it has been quarried as building stone in the area for centuries."
  - question: Where can you see Roxbury puddingstone in Massachusetts?
    answer: "Outcrops of the conglomerate are still visible at the surface in and around the Roxbury neighborhood of Boston, the formation's namesake location."

