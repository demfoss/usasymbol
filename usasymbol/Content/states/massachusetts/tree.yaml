seo_title: "Massachusetts State Tree | American Elm"
seo_description: 'Massachusetts chose American elm in 1941, honoring the village greens, shade streets, and town commons that shaped New England scenery.'

intro_text: "The Massachusetts state tree is the <strong>American Elm</strong> (<em>Ulmus americana</em>), adopted in <strong>1941</strong>. Massachusetts chose the American Elm because it once lined town commons, village greens, churchyards, and streets across the Commonwealth, creating the classic New England shade-tree landscape. These vase-shaped elms grew 80 to 100 feet tall and became living markers of Massachusetts history before Dutch elm disease devastated many old trees. The American Elm remains the official state tree of Massachusetts and appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "What Is the Massachusetts State Tree?"
    paragraphs:
      - "The American Elm is Massachusetts's official state tree. This deciduous hardwood historically grew 80 to 100 feet tall in Massachusetts, with exceptional specimens exceeding 120 feet. The trunk measured three to six feet in diameter on mature trees. The species developed a distinctive vase-shaped form with major limbs dividing from the trunk 15 to 30 feet above ground, then arching gracefully outward and upward. This growth pattern created the classic elm-lined streets that characterized Massachusetts towns from colonial times through the mid-1900s. Dutch elm disease killed millions of Massachusetts elms starting in the 1930s, dramatically reducing the population, though resistant specimens and replanted trees still grow across the state near habitat used by the [official state bird of Massachusetts](/states/massachusetts/bird/black-capped-chickadee)."
      - "The bark appears gray-brown with deep irregular furrows and broad flat ridges. Diamond-shaped patterns emerge where furrows intersect on older trunks. The texture feels rough and corky. Leaves grow three to six inches long with doubly serrated edges - each large tooth has smaller teeth along its edge. The leaves are asymmetrical at the base where they attach to the twig, with one side extending slightly beyond the other. This lopsided base helps identify elms. The leaves turn yellow in fall before dropping."
      - "American elm once grew throughout Massachusetts from coastal areas to the Berkshire hills. The species thrived on moist soils along rivers and streams but adapted to a wide range of conditions. Massachusetts towns deliberately planted elms along streets and around commons, creating the formal tree-lined landscapes that defined New England communities. Boston Common featured numerous elms. Cambridge streets bore the nickname 'Elm City' before Dutch elm disease arrived. Today, disease-resistant American elm cultivars allow Massachusetts communities to restore this historic tree to streets and parks."

  - id: name
    icon: "fa-solid fa-tag"
    title: "Massachusetts State Tree Name"
    paragraphs:
      - "The common name American Elm distinguishes this species from European and Asian elm species. Early Massachusetts colonists called it white elm for the light-colored wood. The scientific name Ulmus americana combines the classical Latin name for elm (Ulmus) with 'americana' indicating North American origin. Some historical references use the name water elm, reflecting the tree's preference for moist sites."
      - "New Englanders often called these trees simply 'elms' without specifying the species, since American elm dominated the region. The tree earned descriptive names like 'Liberty Tree' when specific elms became associated with Revolutionary War events. Massachusetts elm enthusiasts sometimes use the term 'cathedral tree' for the species, describing how arching branches created Gothic arch shapes over streets. The species belongs to the Ulmaceae family, the elm family."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why American Elm Became the Massachusetts State Tree"
    paragraphs:
      - "Massachusetts recognized the American Elm as its official state tree on March 21, 1941. The Massachusetts General Court passed legislation establishing the elm during the 1941 session. The designation honored a tree closely tied to Massachusetts history and New England character. By 1941, Dutch elm disease had already begun killing Massachusetts elms, making the designation both a celebration of the tree's past importance and a recognition of its threatened status."
      - "Massachusetts chose American elm because the tree defined the Commonwealth's towns and historical landscape. Every Massachusetts village green featured elms. The trees shaded colonial meetinghouses where town governments convened. Elm-lined streets created the quintessential New England town appearance that characterized communities from the coast to western Massachusetts. The species grew faster than oak or maple, providing shade within a generation. This rapid growth combined with the graceful vase shape made elm the preferred street tree for Massachusetts municipalities from the 1700s onward."
      - "The tree held special historical significance in Massachusetts. The famous Liberty Tree in Boston was an elm where colonists gathered before the Revolution to protest British policies. Washington Elm in Cambridge marked the spot where tradition says George Washington took command of the Continental Army in 1775, though historians debate whether the specific tree witnessed that event. Elms stood witness to crucial moments in American independence. Beyond these famous specimens, countless ordinary Massachusetts elms shaded the towns where Revolutionary ideas flourished. The tree represented both the physical character of Massachusetts communities and the democratic traditions of town meeting governance that occurred beneath elm-shaded commons and aligned with language in the [Massachusetts state motto](/states/massachusetts/motto/ense-petit-placidam-sub-libertate-quietem)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Massachusetts State Tree Facts"
    facts:
      - "Massachusetts designated American Elm on March 21, 1941, as Dutch elm disease began spreading through the Commonwealth"
      - "The famous Liberty Tree in Boston was an American elm where colonists gathered to protest British rule before the Revolution"
      - "Elm-lined streets were so characteristic of New England that multiple towns earned the nickname 'Elm City' before disease struck"
      - "American elm can grow three to six feet per year in youth, faster than oak or maple, which made it ideal for quickly shading new Massachusetts towns"
      - "The vase-shaped crown created natural arches over streets when elms were planted on both sides, forming 'cathedral' effects"
      - "Dutch elm disease killed an estimated 77 million American elms in Massachusetts and across the United States between 1930 and 1989"
      - "Disease-resistant American elm varieties developed since the 1990s now allow Massachusetts communities to replant this historic species"
      - "The asymmetrical leaf base where one side extends beyond the other is a reliable identification feature for all elm species"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Massachusetts State Tree and Flower"
    paragraphs:
      - "Massachusetts's state flower is the Mayflower (Epigaea repens), designated in 1918. The state adopted its floral symbol more than two decades before choosing the American elm. Both symbols reference early Massachusetts history - the Mayflower ship that brought Pilgrims and the elms that later shaded colonial settlements. The low-growing mayflower blooms in early spring with pink and white flowers, while the towering elm leafs out in late spring. The pair covers Massachusetts from ground level wildflowers to the tree canopy that historically defined the Commonwealth's towns and landscapes; see the [Massachusetts state flower](/states/massachusetts/flower/mayflower)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Massachusetts American Elm"
    paragraphs:
      - "Check the leaf base for the clearest identification. Where the leaf attaches to the twig, one side of the leaf base extends slightly beyond the other, creating a lopsided appearance. This asymmetrical base is diagnostic for elms. The leaves have doubly serrated edges - large teeth with smaller teeth along them. The leaf surface feels slightly rough on top and softly hairy underneath. Leaves measure three to six inches long and two to three inches wide with prominent parallel veins running from the midrib to the leaf edge."
      - "The bark develops a distinctive pattern on mature trees. Deep irregular furrows separate broad flat ridges. The ridges often show diamond or crosshatch patterns where furrows intersect. The bark color ranges from gray to brown. Young elm bark starts relatively smooth and develops furrows as the tree ages. The bark texture feels corky and rough. Twigs are slender, often zigzagging slightly, and may have corky ridges along them."
      - "The growth form is the American elm's most recognizable feature. The trunk divides into several major ascending limbs 15 to 30 feet above ground. These limbs arch outward and upward, creating the classic vase or fountain shape. On mature trees, the crown can spread 60 to 80 feet wide while reaching 80 to 100 feet tall. The silhouette appears open and graceful rather than dense. In spring, small reddish flowers appear in clusters before leaves emerge. These flowers develop into flat, round, papery seeds called samaras, measuring about one-half inch across with a notch at one end."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Massachusetts State Tree Symbolizes"
    paragraphs:
      - "The American Elm symbolizes Massachusetts's colonial heritage and the New England town tradition. The tree represents the democratic ideals born under elm-shaded town commons where citizens gathered for town meetings. The species evokes nostalgia for a time when elm-lined streets defined every Massachusetts community. The famous Liberty Tree connects the species to Revolutionary history and resistance to tyranny. Despite Dutch elm disease devastating the population, the elm remains the official symbol, representing resilience and Massachusetts's commitment to preserving its historical character. Modern replanting of disease-resistant elms demonstrates how Massachusetts honors its heritage while adapting to new challenges in a geography summarized by [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Massachusetts state tree?"
    answer: "The American Elm (Ulmus americana) is Massachusetts's official state tree. The Massachusetts General Court designated it on March 21, 1941, honoring the tree's central role in Commonwealth history and New England town landscapes."
  
  - question: "What is the Massachusetts state tree called?"
    answer: "Massachusetts's state tree is called American Elm or simply elm. The scientific name is Ulmus americana. It's also been called white elm for the wood color, and specific famous specimens were called Liberty Tree or Washington Elm."
  
  - question: "When was the Massachusetts state tree adopted?"
    answer: "Massachusetts adopted the American Elm as its official state tree on March 21, 1941. The General Court passed the designation during the 1941 session, at a time when Dutch elm disease was beginning to threaten the species in Massachusetts."
  
  - question: "Why is the American Elm Massachusetts's state tree?"
    answer: "Massachusetts chose the American Elm because it defined the Commonwealth's towns and historical landscape. Every Massachusetts village green featured elms. The trees shaded colonial meetinghouses and created the classic New England street appearance. The famous Liberty Tree in Boston was an elm where colonists gathered before the Revolution. Elms grew throughout Massachusetts communities, witnessing the democratic town meeting traditions that shaped American government."
  
  - question: "What is the Massachusetts state tree name?"
    answer: "The name is American Elm. The scientific name is Ulmus americana - Ulmus is Latin for elm, and americana indicates North American origin. The 'American' distinguishes it from European and Asian elm species."
  
  - question: "Where does the Massachusetts state tree grow?"
    answer: "The American Elm historically grew throughout Massachusetts from coastal areas to the Berkshire hills. The species thrives on moist soils but adapts to various conditions. Dutch elm disease dramatically reduced populations, but disease-resistant varieties are being replanted in Massachusetts towns. American elm grows naturally across eastern North America from Nova Scotia to Florida and west to the Rocky Mountains."
  
  - question: "What are some facts about the Massachusetts state tree?"
    answer: "The American Elm grows 80 to 100 feet tall with a distinctive vase-shaped crown. The leaf base is asymmetrical - one side extends beyond the other. The famous Liberty Tree in Boston was an American elm. Dutch elm disease killed an estimated 77 million elms in the U.S. The tree can grow three to six feet per year. Disease-resistant varieties now allow Massachusetts to replant this historic species on streets and commons."
  
  - question: "How do you recognize the Massachusetts state tree?"
    answer: "Look for leaves with asymmetrical bases where one side extends beyond the other at the twig attachment. The leaves have doubly serrated edges. The bark has deep irregular furrows creating diamond patterns. The tree develops a distinctive vase shape with major limbs arching upward from a divided trunk. Small round papery seeds appear in spring. The overall form is open and graceful."

