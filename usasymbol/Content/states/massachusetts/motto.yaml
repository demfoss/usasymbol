faq:
  - question: "What is the Massachusetts state motto?"
    answer: "Massachusetts's state motto is \"Ense Petit Placidam Sub Libertate Quietem,\" Latin for \"By the Sword We Seek Peace, But Peace Only Under Liberty.\" It was formally adopted in 1780 and circles the border of the Massachusetts state seal."

  - question: "What does the Massachusetts motto mean?"
    answer: "The motto means that peace is the goal, but only peace that comes with liberty — not peace through submission. The sword is a means of last resort, drawn to protect freedom. The armored arm holding a sword on the state seal illustrates this directly."

  - question: "What is the English translation of the Massachusetts motto?"
    answer: "The standard translation is \"By the Sword We Seek Peace, But Peace Only Under Liberty.\" The six Latin words break down as: Ense (by the sword), Petit (seeks), Placidam (peaceful), Sub (under), Libertate (liberty), Quietem (peace/rest)."

  - question: "Who wrote the Massachusetts state motto?"
    answer: "The phrase is attributed to Algernon Sidney (1623–1683), an English republican theorist who was executed by the British crown. Paul Revere chose the phrase for the Massachusetts seal in 1775, connecting the Revolutionary cause to Sidney's argument that political authority belongs to the people."

  - question: "When did Massachusetts adopt its state motto?"
    answer: "Paul Revere first incorporated the phrase into the Massachusetts seal in 1775. The motto was formally adopted in 1780, when Massachusetts ratified its own constitution and the seal became the official emblem of the Commonwealth."

