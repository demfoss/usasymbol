title: "Ense Petit Placidam Sub Libertate Quietem"
language: "Latin"
english_translation: "By the sword we seek peace, but peace only under liberty"
adopted_year: 1775

author: "USA Symbol Team"
date_published: "2025-12-02"
date_modified: "2026-03-27"
seo_title: "Massachusetts State Motto | Ense Petit Placidam Sub Libertate Quietem! By the sword we seek peace, but peace only under liberty!"
seo_description: "Massachusetts's Latin motto is 'Ense petit placidam sub libertate quietem,' meaning 'By the sword we seek peace, but peace only under liberty.'"

intro_text: "Massachusetts's state motto is <strong>Ense Petit Placidam Sub Libertate Quietem</strong> — Latin for <em>By the sword we seek peace, but peace only under liberty</em>. At eight words, it is the longest state motto in the United States. The phrase was written around 1659 by Algernon Sidney, an English republican who was later executed for treason against King Charles II. The Provincial Congress adopted it in 1775 — two months after the Battles of Lexington and Concord — as an act of political defiance. Paul Revere engraved the first seal. The motto then vanished from official use for 105 years, from 1780 to 1885, before the legislature restored it. In 2022, a state commission voted unanimously to recommend replacing both the seal and the motto."

sections:
  - id: "algernon-sidney-executed"
    icon: "fa-solid fa-scroll"
    title: "Written by a Man Executed for Treason — Then Quoted by Revolutionaries"
    paragraphs:
      - "Algernon Sidney wrote the full phrase around 1659 or 1660 while serving on a British diplomatic delegation in Copenhagen, negotiating peace between Denmark and Sweden. The University of Copenhagen kept an album where distinguished visitors inscribed mottoes. Sidney wrote: 'Manus haec inimica tyrannis ense petit placidam sub libertate quietem' — 'This hand, an enemy to tyrants, seeks with the sword peaceful repose under liberty.' Massachusetts adopted only the second half."
      - "Sidney returned to England and spent years opposing the absolute monarchy of Charles II. In 1683, he was arrested on a charge of treason. His unpublished manuscript Discourses Concerning Government — arguing that people have the right to resist tyrannical government — was used as evidence against him. He was convicted and executed on December 7, 1683."
      - "Sidney became a hero to American colonists. His Discourses Concerning Government circulated widely in the decades before the Revolution. Thomas Jefferson listed Sidney alongside John Locke as a foundational source for the Declaration of Independence. When Massachusetts needed a motto in 1775, choosing Sidney's words was a deliberate statement: the colony aligned itself with a man who died opposing the same crown they were defying."

  - id: "paul-revere-engraved-it"
    icon: "fa-solid fa-star"
    title: "Paul Revere Engraved the Motto Three Months After His Midnight Ride"
    paragraphs:
      - "The Revolutionary War began on April 19, 1775 with the Battles of Lexington and Concord. Massachusetts's Provincial Congress governed the colony instead of British authority. Governor General Thomas Gage, the royal governor, held the official provincial seal. The colony needed a new one — without it, no official document could be authenticated."
      - "On July 28, 1775, the General Court ordered a committee to design a new seal. The committee — including Major James Otis, Dr. John Winthrop, and Major Joseph Hawley — reported a design on August 5. Paul Revere received the commission to engrave it. He had made his midnight ride just three months earlier, on April 18-19. Working as a silversmith and engraver, he created copper plates for the new seal. His original signed bill still exists in the Massachusetts Archives."
      - "The 1775 seal showed a patriot figure wearing a tricorn hat, holding a broadsword raised in one hand and a Magna Carta scroll in the other. The Sidney motto curved around the edge. It was a direct visual argument: an armed citizen defending constitutional law against tyranny."

  - id: "105-years-missing"
    icon: "fa-solid fa-clock-rotate-left"
    title: "The Motto Disappeared for 105 Years"
    paragraphs:
      - "When Massachusetts ratified its state constitution in 1780, it needed a new state seal. The General Court appointed a committee including Nathan Cushing to design one. The new design returned to imagery from the original 1629 Massachusetts Bay Colony seal: a Native American figure holding a bow and arrow. The 1775 Revolutionary-era imagery — and the Sidney motto — was dropped entirely. For 105 years, from 1780 to 1885, the Latin phrase had no official presence on Massachusetts seals."
      - "The legislature passed a law on June 4, 1885, providing a detailed description of the state seal. The new description specified the coat of arms with the Native American figure, the star, the crest of an arm holding a broadsword, and the motto on a blue ribbon beneath the shield. The Sidney phrase returned after more than a century of absence — not restored out of sentiment, but systematized as part of a legislative effort to formalize the seal's legal description."

  - id: "commission-2022"
    icon: "fa-solid fa-landmark"
    title: "A Commission Voted in 2022 to Recommend Replacing the Motto"
    paragraphs:
      - "Governor Charlie Baker signed legislation on January 11, 2021 establishing a commission to study the Massachusetts state seal and motto. The commission included six Indigenous leaders from Wampanoag, Nipmuc, and Massachusett nations, along with legislators, historians, and community representatives."
      - "The commission voted unanimously on May 17, 2022 to recommend changing both the seal and the motto. Concerns centered on the seal's imagery — a colonial arm holding a broadsword above a Native American figure — which commission members said depicted a relationship of domination. The motto's connection to armed force was also questioned in context."
      - "A new advisory commission established in 2024 received over 1,150 public design submissions. Three finalist proposals for a new seal and motto were unveiled in August 2025, with public hearings scheduled for fall 2025. As of 2026, the official motto remains 'Ense Petit Placidam Sub Libertate Quietem' while the redesign process continues."

  - id: "facts"
    icon: "fa-solid fa-lightbulb"
    title: "Massachusetts State Motto Facts"
    style: "gradient"
    facts:
      - "Massachusetts has the longest state motto in the U.S. — eight Latin words translating to thirteen English words."
      - "Algernon Sidney wrote the full phrase in Copenhagen around 1659 while on a diplomatic mission."
      - "Sidney was executed for treason on December 7, 1683, for opposing King Charles II."
      - "Paul Revere engraved the 1775 seal — three months after his midnight ride on April 18-19, 1775."
      - "The motto disappeared from the official seal for 105 years, from 1780 to 1885."
      - "A state commission voted unanimously on May 17, 2022 to recommend replacing both the seal and the motto."

faq:
  - question: "What is Massachusetts's state motto?"
    answer: "Massachusetts's state motto is 'Ense Petit Placidam Sub Libertate Quietem,' a Latin phrase meaning 'By the sword we seek peace, but peace only under liberty.' At eight words, it is the longest state motto in the United States."

  - question: "Where does Massachusetts's motto come from?"
    answer: "From Algernon Sidney, an English republican political theorist who wrote the full phrase in Copenhagen around 1659: 'Manus haec inimica tyrannis ense petit placidam sub libertate quietem' (This hand, an enemy to tyrants, seeks with the sword peaceful repose under liberty). Massachusetts adopted only the second half. Sidney was executed for treason in 1683 for opposing King Charles II."

  - question: "When did Massachusetts adopt its motto?"
    answer: "July 28, 1775 — less than four months after the Battles of Lexington and Concord opened the Revolutionary War. The Provincial Congress ordered the new seal specifically because British Governor General Thomas Gage held the official colonial seal and Massachusetts needed its own."

  - question: "Did Massachusetts's motto ever disappear from the seal?"
    answer: "Yes. When Massachusetts ratified its state constitution in 1780, a new seal design dropped the motto entirely. The Sidney phrase was absent from official seals for 105 years until the legislature restored it on June 4, 1885, as part of a law formally describing the state seal."

  - question: "Is Massachusetts's motto under review?"
    answer: "Yes. A state commission voted unanimously on May 17, 2022 to recommend replacing both the seal and the motto. A new advisory commission was established in 2024. Three finalist designs were unveiled in August 2025. The official motto remains in effect while the redesign process continues."

  - question: "What language is Massachusetts's motto in?"
    answer: "Latin. The phrase 'Ense Petit Placidam Sub Libertate Quietem' is classical Latin, written in dactylic hexameter — the same meter as Virgil's Aeneid. It was adopted in 1775 and restored to the seal in 1885."

