intro_text: "Massachusetts's state motto is <strong>Ense Petit Placidam Sub Libertate Quietem</strong>, Latin for <em>By the Sword We Seek Peace, But Peace Only Under Liberty</em>. The phrase is attributed to Algernon Sidney, an English republican theorist executed in 1683, and was incorporated into the Massachusetts seal by Paul Revere in 1775. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

