sections:
  - id: overview
    icon: fa-solid fa-wheat-awn
    title: "What Is Massachusetts's State Bean?"
    paragraphs:
      - "The baked navy bean is Massachusetts's official state bean, designated by the Massachusetts Legislature in 1993. It refers to small white navy beans slow baked in a sweet, savory sauce, a dish long connected to Boston."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Baked Navy Bean"
    paragraphs:
      - "Navy beans are small, oval white beans that soften and absorb flavor well during long, slow cooking. In the classic Boston preparation, the beans are baked for hours with molasses, salt pork, and onion, giving them a sweet, smoky flavor. The dish became a New England tradition, often served on Saturday nights."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Baked Navy Bean Became Massachusetts's State Bean"
    paragraphs:
      - "The Massachusetts Legislature designated the baked navy bean the official state bean in 1993, recognizing a dish deeply tied to the state's culinary identity."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Massachusetts Chose the Baked Navy Bean"
    paragraphs:
      - "Boston has been nicknamed Beantown for generations because of its long history of baking navy beans with molasses, a tradition that dates back to colonial-era trade routes bringing molasses into the port city. The dish became so closely tied to Boston's identity that state lawmakers recognized it as the official state bean."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Baked Navy Bean Facts"
    facts:
      - "Adopted as Massachusetts's state bean in 1993."
      - "Boston has been nicknamed Beantown because of its baked-bean tradition."
      - "The classic recipe uses molasses, salt pork, and onion."
      - "Colonial-era molasses trade through the Port of Boston helped popularize the dish."

