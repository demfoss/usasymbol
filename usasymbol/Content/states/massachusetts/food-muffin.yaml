sections:
  - id: overview
    icon: fa-solid fa-cookie-bite
    title: "What Is Massachusetts's State Muffin?"
    paragraphs:
      - "The corn muffin is Massachusetts's official state muffin, designated by the Massachusetts General Court in 1986. It is a small, dense muffin made with cornmeal."

  - id: about
    icon: fa-solid fa-magnifying-glass
    title: "About the Corn Muffin"
    paragraphs:
      - "A corn muffin is made from cornmeal, flour, eggs, and milk or buttermilk, baked into a small, slightly sweet or savory round. It has a coarser, more crumbly texture than a typical wheat flour muffin."

  - id: selection
    icon: fa-solid fa-landmark
    title: "How the Corn Muffin Became Massachusetts's State Muffin"
    paragraphs:
      - "The Massachusetts General Court designated the corn muffin the official state muffin in 1986, one of several food symbols the state adopted around that time."

  - id: reason
    icon: fa-solid fa-circle-question
    title: "Why Massachusetts Chose the Corn Muffin"
    paragraphs:
      - "Corn was a staple crop grown by Native Americans in the region and adopted by early English colonists at Plymouth and elsewhere in Massachusetts, making cornmeal a foundational ingredient in the state's colonial-era cooking. The corn muffin reflects that long agricultural and culinary history."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Corn Muffin Facts"
    facts:
      - "Adopted as Massachusetts's state muffin in 1986."
      - "Made from cornmeal, a staple grain in the state's colonial-era diet."
      - "Corn was grown by Native Americans in the region long before European settlement."

