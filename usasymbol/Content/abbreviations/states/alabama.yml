type: State Abbreviation Override
state_slug: alabama
traditional_abbreviation: Ala.
formation_summary: Alabama's USPS abbreviation is AL.
formation_detail: USPS has used AL for Alabama since 1963. The older form Ala. still appears
  in books, archives, and some style-driven writing, but AL is the standard for addresses
  and forms.
search_intent_summary: Use AL for mailing addresses, shipping labels, government forms,
  and school or business records.
similar_codes_summary: AL is easy to mix up with Alaska (AK), Arizona (AZ), and Arkansas
  (AR) when several A-state codes appear together in a list.
