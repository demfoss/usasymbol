state_slug: mississippi
traditional_abbreviation: Miss.
formation_summary: Mississippi uses the USPS abbreviation MS.
formation_detail: USPS adopted MS for Mississippi in 1963. The older form Miss. still appears
  in older publications, but MS is the standard postal abbreviation now.
search_intent_summary: MS is the form used for Mississippi in mailing addresses, shipping
  labels, government forms, and most databases.
similar_codes_summary: MS is often double-checked against MI, MN, and MO because the M-state
  abbreviations are easy to confuse when entered quickly.
