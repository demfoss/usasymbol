type: State Abbreviation Override
state_slug: nebraska
traditional_abbreviation: Nebr.
formation_summary: Nebraska uses the USPS abbreviation NE.
formation_detail: NE became Nebraska's standard postal abbreviation in 1963. The older form
  Nebr. still appears in older publications, but NE is the form used in current addresses
  and forms.
search_intent_summary: Use NE for Nebraska in mailing addresses, shipping labels, government
  forms, and business records.
similar_codes_summary: NE is often double-checked against NV, NH, and NJ because those short
  codes can look similar in forms and spreadsheets.
