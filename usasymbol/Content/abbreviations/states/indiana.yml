type: State Abbreviation Override
state_slug: indiana
traditional_abbreviation: Ind.
formation_summary: Indiana's USPS abbreviation is IN.
formation_detail: IN became the standard postal abbreviation for Indiana in 1963. The older
  form Ind. still appears in older writing, but IN is the form used in current addresses
  and forms.
search_intent_summary: Use IN for Indiana in mailing addresses, shipping labels, official
  forms, and database entries.
similar_codes_summary: IN is simple in an address, but outside that context it can blend
  into ordinary English, so many people search for the full state name.
