state_slug: south-dakota
traditional_abbreviation: S.D.
formation_summary: South Dakota uses the USPS abbreviation SD.
formation_detail: USPS adopted SD for South Dakota in 1963. The older form S.D. still appears
  in older publications, but SD is the standard postal abbreviation today.
search_intent_summary: Use SD for South Dakota in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: SD is often checked against ND and SC because directional state codes
  can look similar in forms and short lists.
