formation_summary: Virginia's USPS abbreviation is VA.
formation_detail: USPS adopted VA for Virginia in 1963. The older form Va. still appears
  in older publications, but VA is the standard postal abbreviation today.
search_intent_summary: Use VA for Virginia in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: VA is often checked against VT because the two V-state abbreviations
  can look similar in short lists and forms.
