    facts:
      - "Mississippi borders exactly four U.S. states"
      - "The Mississippi River forms Mississippi's entire 400-mile western border"
      - "Mississippi is the only state named after the Mississippi River"
      - "Mississippi has about 44 miles of Gulf of Mexico coastline"
      - "The Alabama border is Mississippi's longest at about 310 miles"
      - "The Mississippi Delta is one of the most fertile agricultural regions in the U.S."
      - "Mississippi is not landlocked due to its Gulf coastline"

faq:
  - question: "What borders Mississippi?"
    answer: "Mississippi borders four states and the Gulf of Mexico. Tennessee borders to the north, Alabama to the east, Louisiana to the south and west, Arkansas to the northwest (across the Mississippi River), and the Gulf of Mexico to the south."
  - question: "What state borders Mississippi?"
    answer: "Four states border Mississippi: Tennessee (north), Alabama (east), Louisiana (south and west), and Arkansas (northwest)."
  - question: "What state borders Mississippi on the east?"
    answer: "Alabama borders Mississippi on the east, running about 310 miles from Tennessee to the Gulf of Mexico."
  - question: "What state borders Mississippi to the east?"
    answer: "Alabama borders Mississippi to the east along a mostly straight north-south line for about 310 miles."
  - question: "What state borders Mississippi on the north?"
    answer: "Tennessee borders Mississippi on the north along the 35th parallel for about 115 miles from Arkansas to Alabama."
  - question: "What borders Mississippi to the west?"
    answer: "The Mississippi River borders Mississippi to the west, separating it from Arkansas in the north and Louisiana in the south for approximately 400 miles total."
  - question: "What state borders the Mississippi River?"
    answer: "Ten states border the Mississippi River: Minnesota, Wisconsin, Iowa, Illinois, Missouri, Kentucky, Tennessee, Arkansas, Mississippi, and Louisiana. The river forms state borders for most of its length."
  - question: "How many states border the Mississippi River?"
    answer: "Ten U.S. states border the Mississippi River along its approximately 2,340-mile length from Minnesota to Louisiana."
  - question: "Mississippi River borders what states?"
    answer: "The Mississippi River borders or flows through ten states: Minnesota, Wisconsin, Iowa, Illinois, Missouri, Kentucky, Tennessee, Arkansas, Mississippi, and Louisiana."

