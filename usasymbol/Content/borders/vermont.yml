faq:
  - question: "What borders Vermont?"
    answer: "Vermont borders three states, Canada, one major lake, and one major river. New Hampshire borders to the east (across the Connecticut River), Massachusetts to the south, New York to the west (with Lake Champlain between them), and Canada's Quebec province to the north."
  
  - question: "What states border Vermont?"
    answer: "Three states border Vermont: New Hampshire (east), Massachusetts (south), and New York (west)."
  
  - question: "What river borders Vermont and New Hampshire?"
    answer: "The Connecticut River borders Vermont and New Hampshire, forming the entire 235-mile eastern boundary between the states. Uniquely, Vermont's border sits at the western bank of the river, meaning New Hampshire owns the entire river."
  
  - question: "What country borders Vermont?"
    answer: "Canada borders Vermont to the north. Specifically, the Canadian province of Quebec shares about 90 miles of international border with Vermont along the 45th parallel north latitude."
  
  - question: "What Canadian province borders Vermont?"
    answer: "Quebec is the Canadian province that borders Vermont. This international border runs about 90 miles along Vermont's northern edge."
  
  - question: "What large lake borders Vermont to the northwest?"
    answer: "Lake Champlain borders Vermont to the west (not quite northwest, but on the western side). This large lake forms about 120 miles of Vermont's border with New York and is the sixth-largest freshwater lake in the United States. Burlington, Vermont's largest city, sits on its eastern shore."
  
  - question: "What town in Vermont borders Canada?"
    answer: "Several Vermont towns border Canada along the northern boundary, including Derby Line (which connects with Stanstead, Quebec), Norton, Alburgh, Richford, and others. Derby Line is particularly famous for the Haskell Free Library and Opera House, which straddles the international border with its stage in Canada and audience seating in Vermont."
  
  - question: "How many states border Vermont?"
    answer: "Three states border Vermont: New Hampshire to the east, Massachusetts to the south, and New York to the west. Vermont also shares an international border with Canada to the north."

