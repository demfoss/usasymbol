seo_title: "Vermont Borders | New Hampshire, Massachusetts, New York"
seo_description: "Vermont borders New Hampshire, Massachusetts, and New York, plus Quebec. Lake Champlain and the Connecticut River define two sides."

intro_text: "Vermont borders three U.S. states: New Hampshire to the east, Massachusetts to the south, and New York to the west. Vermont also shares an international border with Canada's Quebec province to the north. Lake Champlain forms much of Vermont's western boundary with New York. The Connecticut River creates the entire eastern border with New Hampshire."

