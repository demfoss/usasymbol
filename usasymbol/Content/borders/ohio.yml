seo_description: "Ohio borders 5 states: Michigan, Pennsylvania, West Virginia, Kentucky, Indiana. Lake Erie to the north. Ohio River creates the entire southern boundary."

intro_text: "Ohio borders five states: Michigan to the north, Pennsylvania to the east, West Virginia to the southeast, Kentucky to the south, and Indiana to the west. Lake Erie forms Ohio's northern boundary, giving the state access to the Great Lakes system. The Ohio River creates the entire southern and southeastern border with West Virginia and Kentucky."

