faq:
  - question: "What states border Ohio?"
    answer: "Five states border Ohio: Michigan (north), Pennsylvania (east), West Virginia (southeast), Kentucky (south), and Indiana (west)."
  
  - question: "What borders Ohio?"
    answer: "Ohio borders five states and Lake Erie. Michigan borders to the north (mostly across Lake Erie), Pennsylvania to the east, West Virginia to the southeast, Kentucky to the south, and Indiana to the west. Lake Erie forms the northern boundary."
  
  - question: "How many states border Ohio?"
    answer: "Five states border Ohio."
  
  - question: "What great lake borders Ohio?"
    answer: "Lake Erie is the only Great Lake that borders Ohio. The lake forms Ohio's entire northern boundary and provides about 312 miles of shoreline."
  
  - question: "Which state borders Ohio to the west?"
    answer: "Indiana borders Ohio to the west. The boundary is a straight north-south line running about 175 miles from Lake Michigan to the Ohio River."
  
  - question: "What lake borders Cleveland Ohio?"
    answer: "Lake Erie borders Cleveland, Ohio. Cleveland sits on the southern shore of Lake Erie in Cuyahoga County."
  
  - question: "What body of water borders Ohio to the north?"
    answer: "Lake Erie borders Ohio to the north, providing the state with Great Lakes access and about 312 miles of shoreline."
  
  - question: "Ohio River borders what states?"
    answer: "The Ohio River borders multiple states, but it forms Ohio's entire southern boundary with West Virginia and Kentucky. The river runs for about 450 miles along Ohio's southern edge."

