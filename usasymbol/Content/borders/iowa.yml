    facts:
      - "Iowa borders exactly six U.S. states—tied for second most"
      - "The Mississippi River forms Iowa's entire eastern border (about 305 miles)"
      - "The Missouri River forms Iowa's entire western border (about 300 miles)"
      - "More than half of Iowa's borders are formed by rivers"
      - "Iowa is landlocked with no ocean or Great Lakes coastline"
      - "The Quad Cities region sits on the Iowa-Illinois border"
      - "Iowa sits between two of America's largest rivers"

faq:
  - question: "What borders Iowa?"
    answer: "Iowa borders six states. Minnesota borders to the north, Wisconsin and Illinois to the east (across the Mississippi River), Missouri to the south, Nebraska to the west (across the Missouri River), and South Dakota to the northwest."
  - question: "What state borders Iowa?"
    answer: "Six states border Iowa: Minnesota (north), Wisconsin (east), Illinois (east), Missouri (south), Nebraska (west), and South Dakota (northwest)."
  - question: "What state borders Iowa to the north?"
    answer: "Minnesota borders Iowa to the north along the 43rd parallel north, running about 260 miles from South Dakota to Wisconsin."
  - question: "What state borders Iowa to the south?"
    answer: "Missouri borders Iowa to the south along an irregular survey line running about 310 miles from Nebraska to Illinois."
  - question: "What river borders Iowa and Nebraska?"
    answer: "The Missouri River forms the entire border between Iowa and Nebraska, running for about 300 miles along Iowa's western edge."
  - question: "What river borders Nebraska and Iowa?"
    answer: "The Missouri River separates Nebraska and Iowa, creating a natural boundary along Iowa's western border for about 300 miles."
  - question: "How many states border Iowa?"
    answer: "Six states border Iowa, making it tied with several others for the second-most state borders in the U.S."
  - question: "Is Iowa landlocked?"
    answer: "Yes, Iowa is landlocked. It has no ocean or Great Lakes coastline and is surrounded entirely by other states, though it has extensive river borders."

