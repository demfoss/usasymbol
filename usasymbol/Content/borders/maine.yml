faq:
  - question: "What borders Maine?"
    answer: "Maine borders one U.S. state and two Canadian provinces. New Hampshire borders to the west, Quebec (Canada) to the northwest, New Brunswick (Canada) to the north and northeast, and the Atlantic Ocean to the east and south."
  - question: "What state borders Maine?"
    answer: "Only one U.S. state borders Maine: New Hampshire to the west. Maine is the only state in the U.S. that borders exactly one other state."
  - question: "What is the only state that borders Maine?"
    answer: "New Hampshire is the only U.S. state that borders Maine. The two states share a border of about 180 miles along Maine's western edge."
  - question: "What country borders Maine?"
    answer: "Canada borders Maine through two provinces: Quebec to the northwest (about 180 miles) and New Brunswick to the north and northeast (about 430 miles)."
  - question: "What country borders Maine to the north?"
    answer: "Canada borders Maine to the north through the provinces of Quebec (northwest) and New Brunswick (north and northeast)."
  - question: "What ocean borders Maine?"
    answer: "The Atlantic Ocean borders Maine along its eastern and southern coasts, providing about 228 miles of general coastline and 3,478 miles of tidal shoreline."
  - question: "How many other U.S. states does Maine border?"
    answer: "Maine borders only one other U.S. state—New Hampshire. This makes Maine unique as the only state with exactly one neighboring state."
  - question: "What bodies of water create borders for Maine?"
    answer: "Several bodies of water form Maine's borders: the Atlantic Ocean to the east and south, the St. John River and St. Croix River along parts of the Canadian border, and the Salmon Falls River and Piscataqua River along portions of the New Hampshire border."

