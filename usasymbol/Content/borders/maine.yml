seo_title: "Maine Borders | Only New Hampshire, Canada & Atlantic"
seo_description: "Maine borders 1 state: New Hampshire. Also borders Canada — Quebec and New Brunswick. Atlantic Ocean runs the eastern and southern coasts. Not landlocked."

intro_text: "Maine borders only one U.S. state: New Hampshire to the west. The state also shares international borders with two Canadian provinces—Quebec to the northwest and New Brunswick to the north and northeast. Maine meets the Atlantic Ocean along its eastern and southern coasts."

