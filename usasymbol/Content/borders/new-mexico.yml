seo_title: "New Mexico Borders: What States and Countries Border New Mexico?"
seo_description: "New Mexico borders 5 states (Colorado, Oklahoma, Texas, Arizona, Utah) and Mexico. See complete border breakdown with Four Corners point."

intro_text: "New Mexico borders five U.S. states: Colorado to the north, Oklahoma and Texas to the east, Arizona to the west, and Utah to the northwest at the Four Corners point. The state also shares an international border with Mexico to the south. New Mexico is one of the Four Corners states."

