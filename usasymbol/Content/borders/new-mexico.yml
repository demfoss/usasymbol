faq:
  - question: "What borders New Mexico?"
    answer: "New Mexico borders five U.S. states and Mexico. Colorado borders to the north, Oklahoma and Texas to the east, Mexico to the south, Arizona to the west, and Utah at the Four Corners point in the northwest."
  - question: "What state borders New Mexico?"
    answer: "Five states border New Mexico: Colorado (north), Oklahoma (northeast), Texas (east), Arizona (west), and Utah (northwest at Four Corners point)."
  - question: "What state borders New Mexico on the west?"
    answer: "Arizona borders New Mexico on the west, running about 390 miles along the 109th meridian from the Four Corners to Mexico."
  - question: "What country borders New Mexico?"
    answer: "Mexico borders New Mexico to the south. The international border runs about 180 miles along the 31st parallel, touching the Mexican states of Chihuahua and Sonora."
  - question: "How many states border New Mexico?"
    answer: "Five states border New Mexico: Colorado, Oklahoma, Texas, Arizona, and Utah (at a single point)."
  - question: "What state borders both New Mexico and Missouri?"
    answer: "Oklahoma borders both New Mexico (to the east of New Mexico) and Missouri (to the southwest of Missouri)."
  - question: "What is Four Corners in New Mexico?"
    answer: "Four Corners is the point where New Mexico, Arizona, Colorado, and Utah meet. It's the only place in the United States where four states touch at a single point, located in New Mexico's northwestern corner."
  - question: "Is New Mexico landlocked?"
    answer: "Yes, New Mexico is landlocked. It has no ocean or Great Lakes coastline and is surrounded by five states and Mexico."

