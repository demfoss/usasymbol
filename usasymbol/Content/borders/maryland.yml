faq:
  - question: "What borders Maryland?"
    answer: "Maryland borders four states and two major water bodies. Pennsylvania borders to the north, Delaware to the east, Virginia to the south, West Virginia to the west, the Atlantic Ocean to the east, and the Chesapeake Bay runs through the center of the state."
  - question: "What state borders Maryland?"
    answer: "Four states border Maryland: Pennsylvania (north), Delaware (east), Virginia (south), and West Virginia (west)."
  - question: "What state borders Maryland to the north?"
    answer: "Pennsylvania borders Maryland to the north along the Mason-Dixon Line, running about 230 miles from West Virginia to Delaware."
  - question: "What state borders Maryland on the east?"
    answer: "Delaware borders Maryland on the east along the Delmarva Peninsula, running about 125 miles from Pennsylvania to the Atlantic Ocean."
  - question: "What river borders Maryland to the south?"
    answer: "The Potomac River borders Maryland to the south and forms the border with Virginia. The entire river belongs to Maryland up to the Virginia shoreline."
  - question: "What river borders Maryland and Virginia?"
    answer: "The Potomac River forms the border between Maryland and Virginia. Maryland owns the entire river, with the border at the low-water mark on the Virginia shore."
  - question: "What ocean borders Maryland?"
    answer: "The Atlantic Ocean borders Maryland along the eastern shore of the Delmarva Peninsula for about 31 miles, including Ocean City and Assateague Island."
  - question: "What is the Chesapeake Bay's role in Maryland?"
    answer: "The Chesapeake Bay runs through the center of Maryland for about 195 miles, dividing the state into the Western Shore and Eastern Shore regions. Maryland surrounds most of the bay."

