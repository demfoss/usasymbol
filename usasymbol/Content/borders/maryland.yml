seo_title: "Maryland Borders | 4 States, Chesapeake Bay & Atlantic"
seo_description: "Maryland borders Pennsylvania, Delaware, Virginia, and West Virginia. Chesapeake Bay splits the state; the Potomac forms much of the south."

intro_text: "Maryland borders four states: Pennsylvania to the north, Delaware to the east, Virginia to the south, and West Virginia to the west. The state also meets the Atlantic Ocean along its eastern shore and surrounds most of the Chesapeake Bay. The Potomac River forms much of Maryland's southern and western borders with Virginia and West Virginia."

