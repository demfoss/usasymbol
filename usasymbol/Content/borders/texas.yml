      - "Texas is not landlocked due to Gulf of Mexico access"
      - "Texas is the second-largest U.S. state after Alaska"

faq:
  - question: "What borders Texas?"
    answer: "Texas borders four states, Mexico, and the Gulf of Mexico. Oklahoma borders to the north, Arkansas to the northeast, Louisiana to the east, and New Mexico to the west. Mexico borders to the south and southwest along the Rio Grande. The Gulf of Mexico borders the southeastern coast."
  
  - question: "What states border Texas?"
    answer: "Four states border Texas: Oklahoma (north), Arkansas (northeast), Louisiana (east), and New Mexico (west)."
  
  - question: "What country borders Texas?"
    answer: "Mexico is the only country that borders Texas. The Rio Grande forms about 1,250 miles of international border between Texas and Mexico—the longest border with Mexico of any U.S. state."
  
  - question: "What river borders Texas and Mexico?"
    answer: "The Rio Grande (called Río Bravo del Norte in Mexico) borders Texas and Mexico. This river creates about 1,250 miles of international boundary from El Paso to the Gulf of Mexico."
  
  - question: "What river borders Texas and Oklahoma?"
    answer: "The Red River borders Texas and Oklahoma. This river forms about 480 miles of the northern boundary between the states and gets its name from the red clay soil that colors the water."
  
  - question: "What ocean borders Texas?"
    answer: "The Gulf of Mexico borders Texas along its southeastern coast. While technically a gulf rather than an open ocean, the Gulf of Mexico is part of the Atlantic Ocean system and provides Texas with about 367 miles of coastline."
  
  - question: "What state borders Texas to the north?"
    answer: "Oklahoma borders Texas to the north. The Red River forms most of this boundary, running about 480 miles from New Mexico to Arkansas."
  
  - question: "What state borders Texas to the east?"
    answer: "Louisiana borders Texas to the east. The Sabine River and Toledo Bend Reservoir form most of this 180-mile boundary."
  
  - question: "What state borders Texas to the west?"
    answer: "New Mexico borders Texas to the west. This boundary follows the 103rd meridian for about 550 miles, creating a straight north-south line from Oklahoma to Mexico."
  
  - question: "What river borders Texas and Louisiana?"
    answer: "The Sabine River borders Texas and Louisiana. This river and Toledo Bend Reservoir (formed by a dam on the Sabine) create most of the boundary between the states."

