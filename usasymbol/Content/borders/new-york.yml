seo_title: "New York Border States"
seo_description: "New York borders 5 states (Vermont, Massachusetts, Connecticut, Pennsylvania, New Jersey) and Canada (Quebec, Ontario). See complete border breakdown with Great Lakes and Atlantic Ocean."

intro_text: "New York borders five U.S. states: Vermont, Massachusetts, and Connecticut to the east, Pennsylvania and New Jersey to the south. The state also shares international borders with two Canadian provinces—Quebec to the north and Ontario to the northwest. New York meets the Atlantic Ocean along its southeastern coast and borders two Great Lakes: Erie and Ontario."

