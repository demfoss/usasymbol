faq:
  - question: "What borders New York?"
    answer: "New York borders five U.S. states, two Canadian provinces, two Great Lakes, and the Atlantic Ocean. Vermont, Massachusetts, and Connecticut border to the east; Pennsylvania and New Jersey to the south; Quebec and Ontario (Canada) to the north; Lake Erie and Lake Ontario to the northwest; and the Atlantic Ocean to the southeast."
  - question: "What state borders New York?"
    answer: "Five states border New York: Vermont, Massachusetts, Connecticut, Pennsylvania, and New Jersey."
  - question: "What country borders New York?"
    answer: "Canada borders New York through two provinces: Quebec to the north and Ontario to the northwest."
  - question: "What great lake borders New York?"
    answer: "Two Great Lakes border New York: Lake Erie in the southwest and Lake Ontario in the north."
  - question: "What lake borders Buffalo, New York?"
    answer: "Lake Erie borders Buffalo, New York. The city sits at the eastern end of Lake Erie where the Niagara River begins."
  - question: "What ocean borders New York?"
    answer: "The Atlantic Ocean borders New York along its southeastern coast, primarily along Long Island and at the mouth of the Hudson River where New York City is located."
  - question: "What ocean borders New York City?"
    answer: "The Atlantic Ocean borders New York City. The city sits at the mouth of the Hudson River where it meets the Atlantic, creating New York Harbor."
  - question: "What body of water borders New York City?"
    answer: "Several bodies of water border New York City: the Atlantic Ocean to the south and east, the Hudson River to the west, and the East River (actually a tidal strait) between Manhattan and Long Island."

