faq:
  - question: "What borders Michigan?"
    answer: "Michigan borders three U.S. states by land—Wisconsin, Indiana, and Ohio—plus Canada (Ontario). Across the Great Lakes, Michigan also faces Illinois and Minnesota by water."
  - question: "What state borders Michigan?"
    answer: "Three states border Michigan by land: Wisconsin (west), Indiana (south), and Ohio (south). Michigan also shares water borders across the Great Lakes with Illinois and Minnesota."
  - question: "How many U.S. states border Michigan?"
    answer: "Three U.S. states border Michigan by land: Wisconsin, Indiana, and Ohio. Michigan also shares water borders with Illinois and Minnesota across the Great Lakes."
  - question: "What country borders Michigan?"
    answer: "Canada borders Michigan through the province of Ontario. The border runs for about 720 miles through various rivers and lakes including the Detroit River, St. Clair River, and portions of Lakes Huron, St. Clair, and Erie."
  - question: "What Canadian province borders Michigan?"
    answer: "Ontario is the Canadian province that borders Michigan, with major crossing points at Detroit-Windsor, Sault Ste. Marie, and Port Huron-Sarnia."
  - question: "What lake borders Michigan?"
    answer: "Four Great Lakes border Michigan: Lake Superior (north), Lake Michigan (west), Lake Huron (east), and Lake Erie (southeast). Michigan is the only state to border four of the five Great Lakes."
  - question: "Lake Michigan borders what states?"
    answer: "Lake Michigan borders four states: Michigan (east), Wisconsin (west), Illinois (southwest), and Indiana (southeast)."
  - question: "How many states does Lake Michigan border?"
    answer: "Lake Michigan borders four U.S. states: Michigan, Wisconsin, Illinois, and Indiana."
  - question: "Which state borders both Minnesota and Michigan?"
    answer: "Wisconsin is the state that borders both Minnesota (to the east of Minnesota) and Michigan (to the west of Michigan's Upper Peninsula)."

