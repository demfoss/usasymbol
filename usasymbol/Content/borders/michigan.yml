seo_title: "Michigan Borders | 3 Land States, Canada & 4 Great Lakes"
seo_description: "Michigan borders 3 states: Wisconsin, Indiana, Ohio. Also borders Canada (Ontario). Touches 4 Great Lakes: Superior, Michigan, Huron, Erie. Not landlocked."

intro_text: "Michigan borders three U.S. states by land: Wisconsin to the west, and Indiana and Ohio to the south. The state also shares an international border with Ontario, Canada. Across the Great Lakes, Michigan also faces Illinois (across Lake Michigan) and Minnesota (across Lake Superior) by water. Michigan is the only state that borders four of the five Great Lakes: Superior, Michigan, Huron, and Erie."

