seo_title: "Illinois Borders | 5 States, Lake Michigan & 3 Major Rivers"
seo_description: "Illinois borders 5 states: Wisconsin, Indiana, Kentucky, Missouri, Iowa. Lake Michigan northeast. Mississippi, Ohio, and Wabash rivers form most state borders."

intro_text: "Illinois borders five states: Wisconsin to the north, Indiana to the east, Kentucky to the southeast, Missouri to the west, and Iowa to the northwest. The state also meets Lake Michigan along its northeastern shore. The Mississippi River forms Illinois's entire western border, while the Ohio River creates the southern boundary with Kentucky and the Wabash River marks part of the eastern border with Indiana."

