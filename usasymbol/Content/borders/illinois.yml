sections:
  - id: states-border
    icon: "fa-solid fa-map"
    title: "Which States Border Illinois?"
    paragraphs:
      - "Illinois shares its borders with five U.S. states: [Wisconsin](https://usasymbol.com/states/wisconsin) to the north, Indiana to the east, Kentucky to the southeast, Missouri to the west, and Iowa to the northwest. Rivers form most of Illinois's borders, making it one of the most water-defined states in the country."
    subsections:
      - id: "border-wisconsin"
        subtitle: "North: Wisconsin"
        paragraphs:
          - "Wisconsin and [Illinois](https://usasymbol.com/states/illinois) are separated by a border located on Illinois's northern edge. The state line runs roughly east-west from Lake Michigan in the east to the Mississippi River in the west."
          - "The Illinois-Wisconsin border extends for about 185 miles. The border follows a relatively straight line across the top of Illinois. Illinois counties along this border include Lake, McHenry, Boone, Winnebago, Stephenson, and Jo Daviess. On the Wisconsin side, Kenosha, Racine, Walworth, Rock, Green, Lafayette, and Grant counties sit along the border."
        bullets:
          - "About 185 miles east-west"
          - "Straight line from Lake Michigan to Mississippi River"
          - "Illinois counties: Lake, McHenry, Boone, Winnebago, Stephenson, Jo Daviess"
      
      - id: "border-indiana"
        subtitle: "East: Indiana (Wabash River Border)"
        paragraphs:
          - "[Indiana](https://usasymbol.com/states/indiana) and Illinois are separated by a border located on Illinois's eastern edge. The boundary runs roughly north-south from Lake Michigan in the north to the Ohio River in the south, with the Wabash River forming the southern portion."
          - "The Illinois-Indiana border extends for about 350 miles. The Wabash River creates a natural border for about 200 miles in the southern section. Illinois counties along this border include Lake, Porter, Jasper, Newton, White, Wabash, Edwards, and others. Major cities near this border include Chicago and Gary (in Indiana)."
        bullets:
          - "About 350 miles north-south"
          - "Wabash River forms southern 200 miles"
          - "Near major cities: Chicago, Gary (IN)"
      
      - id: "border-kentucky"
        subtitle: "South-East: Kentucky (Ohio River Border)"
        paragraphs:
          - "[Kentucky](https://usasymbol.com/states/kentucky) and Illinois are separated entirely by the Ohio River along Illinois's southeastern edge. This makes the Illinois-Kentucky border unique—it's formed completely by a single river."
          - "The Illinois-Kentucky border extends for about 135 miles along the Ohio River from Indiana in the east to Missouri in the west. Illinois counties along this border include Hardin, Pope, Massac, and Pulaski. On the Kentucky side, Livingston, Crittenden, Union, and other counties sit along the Ohio River."
        bullets:
          - "About 135 miles along Ohio River"
          - "Entire border formed by river"
          - "Illinois counties: Hardin, Pope, Massac, Pulaski"
      
      - id: "border-missouri"
        subtitle: "West: Missouri (Mississippi River Border)"
        paragraphs:
          - "Missouri and Illinois are separated by the Mississippi River along Illinois's western edge. The river creates a natural boundary running roughly north-south from Iowa in the north to Kentucky in the south."
          - "The Illinois-Missouri border extends for about 360 miles along the Mississippi River. This is one of the longest river borders between two states in the U.S. Illinois counties along this border include Pike, Scott, Greene, Jersey, Calhoun, Madison, St. Clair, Monroe, Randolph, and Alexander. Major cities on this border include St. Louis, Missouri and East St. Louis, Illinois."
        bullets:
          - "About 360 miles along Mississippi River"
          - "One of longest river borders in U.S."
          - "Major cities: St. Louis (MO), East St. Louis (IL)"
      
      - id: "border-iowa"
        subtitle: "North-West: Iowa (Mississippi River Border)"
        paragraphs:
          - "Iowa and Illinois are separated by the Mississippi River along Illinois's northwestern edge. The river creates the boundary from Wisconsin in the north to Missouri in the south."
          - "The Illinois-Iowa border extends for about 165 miles along the Mississippi River. Illinois counties along this border include Jo Daviess, Carroll, Whiteside, Rock Island, and Mercer. The Quad Cities region—including Rock Island and Moline in Illinois, and Davenport and Bettendorf in Iowa—sits along this border."
        bullets:
          - "About 165 miles along Mississippi River"
          - "Quad Cities region on border"
          - "Illinois counties: Jo Daviess, Carroll, Whiteside, Rock Island, Mercer"

  - id: lake-michigan
    icon: "fa-solid fa-water"
    title: "Lake Michigan: Illinois's Great Lake Shore"
    paragraphs:
      - "Lake Michigan borders Illinois's northeastern coast for about 63 miles, from the Wisconsin border in the north to the Indiana border in the south. This is the shortest Great Lakes coastline of any state that borders the lakes."
    subsections:
      - id: "border-lake-michigan"
        subtitle: "North-East: Lake Michigan"
        paragraphs:
          - "Lake Michigan forms Illinois's northeastern boundary, providing the state's only water access to the Great Lakes system. The lake shore stretches from the Wisconsin state line south to the Indiana border."
          - "Illinois's Lake Michigan coastline is about 63 miles long. Chicago, the state's largest city and the third-largest city in the U.S., sits along this shoreline. Lake County and Cook County in Illinois contain the entire Lake Michigan coastline. The lakefront includes beaches, harbors, and Chicago's famous lakefront parks and skyline."
        bullets:
          - "About 63 miles of coastline"
          - "Chicago located on Lake Michigan shore"
          - "Only Illinois counties: Lake and Cook"

  - id: three-major-rivers
    icon: "fa-solid fa-water"
    title: "Three Major Rivers Form Illinois Borders"
    paragraphs:
      - "Illinois is defined by rivers more than almost any other state. Three major rivers form its borders: the Mississippi River creates the entire western border with Iowa and Missouri (about 525 miles total), the Ohio River forms the entire southeastern border with Kentucky (about 135 miles), and the Wabash River marks the southern portion of the eastern border with Indiana (about 200 miles). This means that roughly 860 of Illinois's total border length is formed by rivers—over 70% of all state borders."

