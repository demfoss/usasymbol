      - "Chicago sits on Lake Michigan's southwestern shore"
      - "Illinois is not landlocked because it borders Lake Michigan"

faq:
  - question: "What state borders Illinois?"
    answer: "Five states border Illinois: Wisconsin (north), Indiana (east), Kentucky (southeast), Missouri (west), and Iowa (northwest)."
  - question: "What borders Illinois?"
    answer: "Illinois borders five states and Lake Michigan. Wisconsin borders to the north, Indiana to the east, Kentucky to the southeast, Missouri to the west, Iowa to the northwest, and Lake Michigan to the northeast."
  - question: "What state borders Illinois to the east?"
    answer: "Indiana borders Illinois to the east. The Wabash River forms the southern portion of this boundary for about 200 miles."
  - question: "What state borders Illinois to the north?"
    answer: "Wisconsin borders Illinois to the north along a relatively straight line running about 185 miles from Lake Michigan to the Mississippi River."
  - question: "What great lake borders Illinois?"
    answer: "Lake Michigan is the only Great Lake that borders Illinois. The lake provides about 63 miles of coastline along Illinois's northeastern edge, including Chicago's famous lakefront."
  - question: "What river borders Illinois to the west?"
    answer: "The Mississippi River forms Illinois's entire western border with both Iowa (north) and Missouri (south), running for about 525 miles total."
  - question: "What river borders Illinois and Kentucky?"
    answer: "The Ohio River forms the entire border between Illinois and Kentucky, running for about 135 miles."
  - question: "What river partially borders Illinois on the east?"
    answer: "The Wabash River partially borders Illinois on the east, forming the southern portion (about 200 miles) of the border between Illinois and Indiana."

