seo_title: "North Dakota Borders: What States and Countries Border North Dakota?"
seo_description: "North Dakota borders 3 states (Montana, South Dakota, Minnesota) and Canada (Saskatchewan, Manitoba). See complete border breakdown with Red River."

intro_text: "North Dakota borders three U.S. states: Montana to the west, South Dakota to the south, and Minnesota to the east. The state also shares an international border with Canada to the north, touching two Canadian provinces—Saskatchewan and Manitoba. The Red River forms North Dakota's entire eastern border with Minnesota."

