faq:
  - question: "What borders North Dakota?"
    answer: "North Dakota borders three U.S. states and Canada. Montana borders to the west, South Dakota to the south, Minnesota to the east (across the Red River), and Canada (Saskatchewan and Manitoba) to the north."
  - question: "What state borders North Dakota?"
    answer: "Three states border North Dakota: Montana (west), South Dakota (south), and Minnesota (east)."
  - question: "What state borders South Dakota to the north?"
    answer: "North Dakota borders South Dakota to the north, running about 360 miles along the 46th parallel from Montana to Minnesota."
  - question: "What state borders North Dakota to the west?"
    answer: "Montana borders North Dakota to the west, running about 215 miles from Saskatchewan (Canada) to South Dakota."
  - question: "What foreign country borders North Dakota?"
    answer: "Canada borders North Dakota along the entire northern edge through two provinces: Saskatchewan (northwest for about 200 miles) and Manitoba (northeast for about 110 miles)."
  - question: "What Canadian province borders North Dakota?"
    answer: "Two Canadian provinces border North Dakota: Saskatchewan along most of the northern border and Manitoba in the northeastern corner."
  - question: "What river forms North Dakota's eastern border?"
    answer: "The Red River of the North forms North Dakota's entire eastern border with Minnesota, running about 310 miles from Canada to South Dakota."
  - question: "Is North Dakota landlocked?"
    answer: "Yes, North Dakota is landlocked. It has no ocean or Great Lakes coastline and is surrounded by three states and Canada."

