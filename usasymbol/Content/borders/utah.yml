faq:
  - question: "What states border Utah?"
    answer: "Five states border Utah: Idaho (north), Wyoming (northeast), Colorado (east), Arizona (south), and Nevada (west)."
  
  - question: "What borders Utah?"
    answer: "Utah borders five states: Idaho to the north, Wyoming to the northeast, Colorado to the east, Arizona to the south, and Nevada to the west. Utah has no ocean, Great Lakes, or international borders—it is completely landlocked."
  
  - question: "How many states border Utah?"
    answer: "Five states border Utah. Additionally, New Mexico touches Utah at a single point (Four Corners) where Utah, Arizona, Colorado, and New Mexico all meet, though this is technically a point rather than a border line."
  
  - question: "What state borders Utah to the south?"
    answer: "Arizona borders Utah to the south. The Colorado River forms part of this boundary in the west, while the 37th parallel creates a straight line in the east extending to Four Corners."
  
  - question: "What state borders Kansas and Utah?"
    answer: "Colorado borders both Kansas and Utah. Colorado sits between Kansas (to the east) and Utah (to the west). Colorado shares its western border with Utah along the 109th meridian."
  
  - question: "What is Four Corners?"
    answer: "Four Corners is the only point in the United States where four states meet at one location. Utah's southeastern corner touches Arizona, Colorado, and New Mexico at this spot. A monument marks the location where visitors can stand in all four states at once."
  
  - question: "Does Utah border New Mexico?"
    answer: "Utah touches New Mexico at a single point (Four Corners) where Utah, Arizona, Colorado, and New Mexico all meet. However, Utah and New Mexico don't share a border line—they only touch at this one geographic point in the southeastern corner of Utah."
  
  - question: "Why does Utah have straight borders?"
    answer: "Utah has straight borders because they were surveyed as mathematical lines (meridians and parallels) when Utah Territory was organized in the 1800s. This was common for western territories, creating geometric boundaries rather than following natural features like rivers or mountains. The only exception is part of the Arizona border where the Colorado River forms a natural boundary."

