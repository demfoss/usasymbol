seo_description: "Wyoming borders 6 states: Montana, Idaho, Utah, Colorado, Nebraska, South Dakota. All borders are straight surveyed lines — one of 3 rectangular states. Landlocked."

intro_text: "Wyoming borders six states: Montana to the north, Idaho to the west, Utah to the southwest, Colorado to the south, Nebraska to the east, and South Dakota to the northeast. Wyoming is completely landlocked with no ocean or Great Lakes access. Nearly all of Wyoming's borders follow straight surveyed lines, making it one of only three states with rectangular borders along with Colorado and Utah."

