faq:
  - question: "What states border Wyoming?"
    answer: "Six states border Wyoming: Montana (north), Idaho (west), Utah (southwest), Colorado (south), Nebraska (east), and South Dakota (northeast)."
  
  - question: "What borders Wyoming?"
    answer: "Wyoming borders six states: Montana to the north, Idaho to the west, Utah to the southwest, Colorado to the south, Nebraska to the east, and South Dakota to the northeast. Wyoming has no ocean, Great Lakes, or international borders—it is completely landlocked."
  
  - question: "How many states border Wyoming?"
    answer: "Six states border Wyoming: Montana, Idaho, Utah, Colorado, Nebraska, and South Dakota."
  
  - question: "What state borders both Wyoming and Missouri?"
    answer: "Nebraska is the state that borders both Wyoming and Missouri. Nebraska borders Wyoming to the east and Missouri to the southeast, making it one of Nebraska's eight neighboring states."
  
  - question: "Why does Wyoming have straight borders?"
    answer: "Wyoming has straight borders because they were surveyed as mathematical lines (parallels and meridians) when Wyoming Territory was organized in the 1860s-1870s. This was common for western territories, creating geometric boundaries rather than following natural features. The northern border follows the 45th parallel, the southern border follows the 41st parallel, and the east-west borders follow meridian lines."
  
  - question: "Is Wyoming rectangular?"
    answer: "Yes, Wyoming is rectangular (technically a trapezoid due to Earth's curvature, but appearing rectangular on maps). Wyoming is one of only three U.S. states with entirely straight-line borders, along with Colorado and Utah. All of Wyoming's borders follow surveyed parallels and meridians."
  
  - question: "What national park borders three states?"
    answer: "Yellowstone National Park borders three states: Wyoming, Montana, and Idaho. The park sits in northwestern Wyoming where it meets both Montana (north) and Idaho (west). About 96% of Yellowstone is in Wyoming, with small portions in Montana and Idaho."
  
  - question: "Which state borders Wyoming to the south?"
    answer: "Colorado borders Wyoming to the south. This boundary runs about 365 miles along the 41st parallel north latitude, creating a perfectly straight east-west line from Utah to Nebraska."

