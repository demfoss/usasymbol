faq:
  - question: "What borders North Carolina?"
    answer: "North Carolina borders four states and the Atlantic Ocean. Virginia borders to the north, Tennessee to the west, Georgia to the southwest, South Carolina to the south, and the Atlantic Ocean to the east."
  - question: "What state borders North Carolina?"
    answer: "Four states border North Carolina: Virginia (north), Tennessee (west), Georgia (southwest), and South Carolina (south)."
  - question: "What state borders North Carolina to the north?"
    answer: "Virginia borders North Carolina to the north, running about 335 miles from the Atlantic coast to Tennessee."
  - question: "What state borders North Carolina to the west?"
    answer: "Tennessee borders North Carolina to the west, running about 265 miles through the Great Smoky Mountains along the 35th parallel."
  - question: "What ocean borders North Carolina?"
    answer: "The Atlantic Ocean borders North Carolina along its eastern coast, providing about 301 miles of general coastline and over 3,375 miles of tidal shoreline."
  - question: "What large body of water borders North Carolina?"
    answer: "The Atlantic Ocean is the large body of water that borders North Carolina's eastern coast. The state also has several large sounds (Pamlico Sound, Albemarle Sound) between the Outer Banks and the mainland."
  - question: "What body of water borders North Carolina?"
    answer: "The Atlantic Ocean borders North Carolina to the east. The state also features Pamlico Sound, Albemarle Sound, and other sounds and estuaries along its coast."
  - question: "How many states border North Carolina?"
    answer: "Four states border North Carolina: Virginia, Tennessee, Georgia, and South Carolina."

