intro_text: "North Carolina borders four states: Virginia to the north, Tennessee to the west, Georgia to the southwest, and South Carolina to the south. The state also meets the Atlantic Ocean along its eastern coast. North Carolina's coastline features the Outer Banks, a string of barrier islands."

