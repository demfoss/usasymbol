sections:
  - id: states-border
    icon: "fa-solid fa-map"
    title: "Which States Border Massachusetts?"
    paragraphs:
      - "Massachusetts shares its borders with five U.S. states: [Vermont](https://usasymbol.com/states/vermont) and New Hampshire to the north, Rhode Island and Connecticut to the south, and New York to the west. Massachusetts is centrally located in the New England region."
    subsections:
      - id: "border-vermont"
        subtitle: "North-West: Vermont"
        paragraphs:
          - "Vermont and Massachusetts are separated by a border located in Massachusetts's northwestern corner. The boundary runs roughly north-south for a short distance where the three states of Vermont, [New Hampshire](https://usasymbol.com/states/new-hampshire), and Massachusetts meet."
          - "The Massachusetts-Vermont border extends for only about 40 miles, making it one of Massachusetts's shorter state borders. The border runs from New York in the west to New Hampshire in the east. Only two Massachusetts counties touch this border: Franklin and Berkshire. On the Vermont side, Bennington and Windham counties sit along the border."
        bullets:
          - "About 40 miles north-south"
          - "Northwestern corner only"
          - "Massachusetts counties: Franklin, Berkshire"
      
      - id: "border-new-hampshire"
        subtitle: "North: New Hampshire"
        paragraphs:
          - "New Hampshire and [Massachusetts](https://usasymbol.com/states/massachusetts) are separated by a border located on Massachusetts's northern edge. The state line runs roughly east-west from Vermont in the west to the Atlantic Ocean region in the east."
          - "The Massachusetts-New Hampshire border extends for about 90 miles. The border follows a relatively straight line across the top of Massachusetts. Massachusetts counties along this border include Berkshire, Franklin, Worcester, Middlesex, and Essex. On the New Hampshire side, Cheshire, Hillsborough, and Rockingham counties sit along the border. The border region includes portions of the Merrimack River valley."
        bullets:
          - "About 90 miles east-west"
          - "Relatively straight line"
          - "Massachusetts counties: Berkshire, Franklin, Worcester, Middlesex, Essex"
      
      - id: "border-rhode-island"
        subtitle: "South: Rhode Island"
        paragraphs:
          - "[Rhode Island](https://usasymbol.com/states/rhode-island) and Massachusetts are separated by a border located on Massachusetts's southern edge. The boundary runs roughly east-west from Connecticut in the west toward the Atlantic coast in the east."
          - "The Massachusetts-Rhode Island border extends for about 45 miles. The border follows an irregular line across southern Massachusetts. Massachusetts counties along this border include Bristol, Plymouth, Norfolk, and parts of others. On the Rhode Island side, Providence, Kent, and Washington counties sit along the border. Major cities near this border include Providence, Rhode Island and Fall River, Massachusetts."
        bullets:
          - "About 45 miles east-west"
          - "Irregular boundary line"
          - "Major cities: Providence (RI), Fall River (MA)"
      
      - id: "border-connecticut"
        subtitle: "South: Connecticut"
        paragraphs:
          - "Connecticut and Massachusetts are separated by a border located on Massachusetts's southern edge. The state line runs roughly east-west from New York in the west to Rhode Island in the east."
          - "The Massachusetts-Connecticut border extends for about 90 miles. The border follows a relatively straight line across southern Massachusetts along approximately the 42nd parallel north. Massachusetts counties along this border include Berkshire, Hampden, Hampshire, Worcester, and Middlesex. Major cities near this border include Springfield, Massachusetts and Hartford, Connecticut."
        bullets:
          - "About 90 miles along 42nd parallel"
          - "Relatively straight east-west line"
          - "Major cities: Springfield (MA), Hartford (CT)"
      
      - id: "border-new-york"
        subtitle: "West: New York"
        paragraphs:
          - "New York and Massachusetts are separated by a border located on Massachusetts's western edge. The boundary runs roughly north-south from Vermont in the north to Connecticut in the south."
          - "The Massachusetts-New York border extends for about 50 miles. The border runs through the Berkshire Mountains and Taconic Range. Only Berkshire County in Massachusetts touches this border. On the New York side, Columbia and Rensselaer counties sit along the border. The border region is known for its mountainous terrain and cultural attractions like the Berkshires."
        bullets:
          - "About 50 miles north-south"
          - "Through Berkshire Mountains"
          - "Only Berkshire County (MA) touches border"

  - id: atlantic-coast
    icon: "fa-solid fa-water"
    title: "Atlantic Ocean: Massachusetts's Eastern Coastline"
    paragraphs:
      - "The Atlantic Ocean borders Massachusetts's eastern coast for about 192 miles of general coastline. However, Massachusetts's tidal shoreline—including all the bays, inlets, islands, and Cape Cod—extends for approximately 1,519 miles, creating one of New England's most distinctive coastlines."
    subsections:
      - id: "border-atlantic"
        subtitle: "East: Atlantic Ocean"
        paragraphs:
          - "The Atlantic Ocean forms Massachusetts's eastern boundary, creating a complex and historically significant coastline. The coastline stretches from New Hampshire in the north to Rhode Island in the south and includes Cape Cod, which extends far into the Atlantic."
          - "Massachusetts's Atlantic coastline measures about 192 miles along the general shoreline, but the tidal shoreline (including bays, harbors, and islands) extends for approximately 1,519 miles. Major features include Massachusetts Bay, Cape Cod Bay, Buzzards Bay, and the islands of Martha's Vineyard and Nantucket. Massachusetts counties with ocean coastline include Essex, Suffolk, Norfolk, Plymouth, Bristol, Barnstable, Dukes, and Nantucket. Major coastal cities include Boston, Salem, Gloucester, Plymouth, New Bedford, and Provincetown."
        bullets:
          - "About 192 miles of general coastline"
          - "About 1,519 miles of tidal shoreline"
          - "Includes Cape Cod, Martha's Vineyard, Nantucket"

  - id: cape-cod
    icon: "fa-solid fa-map-marked-alt"
    title: "Cape Cod: A Unique Geographic Feature"
    paragraphs:
      - "Cape Cod is a distinctive hook-shaped peninsula that extends about 65 miles into the Atlantic Ocean from the southeastern corner of Massachusetts. The Cape is separated from the mainland by the Cape Cod Canal, which was completed in 1914 to provide a shipping shortcut. Cape Cod includes Barnstable County and is one of the most recognizable geographic features on the U.S. East Coast. The Cape's beaches, dunes, and maritime character make it a major tourist destination. Cape Cod Bay sits between the Cape and the mainland, while the Atlantic Ocean borders the eastern shore."

  - id: massachusetts-bay
    icon: "fa-solid fa-anchor"
    title: "Massachusetts Bay and Maritime History"
    paragraphs:
      - "Massachusetts Bay is a large bay on the Atlantic coast that gives the state its name and has been central to its history since colonial times. The bay extends from Cape Ann in the north to Cape Cod in the south and includes Boston Harbor, one of the finest natural harbors on the Atlantic coast. The Massachusetts Bay Colony was founded in 1630 and became one of the most important English settlements in North America. Today, the bay remains vital for shipping, fishing, recreation, and the state's economy."

  - id: key-facts
    icon: "fa-solid fa-table"
    title: "Key Facts & Statistics"
    paragraphs:
      - "This table shows every border Massachusetts shares, organized by direction and type."
    table:
      columns:
