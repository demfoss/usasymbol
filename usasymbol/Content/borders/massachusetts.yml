    facts:
      - "Massachusetts borders exactly five U.S. states"
      - "The Atlantic Ocean provides about 192 miles of general coastline"
      - "Massachusetts has about 1,519 miles of tidal shoreline"
      - "Cape Cod extends about 65 miles into the Atlantic Ocean"
      - "Massachusetts Bay gives the state its name"
      - "The state includes the islands of Martha's Vineyard and Nantucket"
      - "Massachusetts is not landlocked due to its Atlantic coastline"

faq:
  - question: "What borders Massachusetts?"
    answer: "Massachusetts borders five states and the Atlantic Ocean. Vermont and New Hampshire border to the north, Rhode Island and Connecticut to the south, New York to the west, and the Atlantic Ocean to the east."
  - question: "What state borders Massachusetts?"
    answer: "Five states border Massachusetts: Vermont (northwest), New Hampshire (north), Rhode Island (south), Connecticut (south), and New York (west)."
  - question: "How many states border Massachusetts?"
    answer: "Five states border Massachusetts, making it one of the New England states with the most neighbors."
  - question: "What state borders Massachusetts on the west?"
    answer: "New York borders Massachusetts on the west, running about 50 miles through the Berkshire Mountains from Vermont to Connecticut."
  - question: "What ocean borders Massachusetts?"
    answer: "The Atlantic Ocean borders Massachusetts along its eastern coast, providing about 192 miles of general coastline and 1,519 miles of tidal shoreline including Cape Cod."
  - question: "What ocean borders Massachusetts and Virginia?"
    answer: "The Atlantic Ocean borders both Massachusetts (to the east) and Virginia (to the east). Both states have Atlantic coastlines, though they are separated by several other states along the coast."
  - question: "Which ocean borders Massachusetts?"
    answer: "The Atlantic Ocean is the only ocean that borders Massachusetts, forming the state's entire eastern coastline including Cape Cod, Massachusetts Bay, and the islands."
  - question: "What is Cape Cod?"
    answer: "Cape Cod is a distinctive hook-shaped peninsula that extends about 65 miles into the Atlantic Ocean from southeastern Massachusetts. It's separated from the mainland by the Cape Cod Canal and is one of the most recognizable geographic features on the East Coast."

