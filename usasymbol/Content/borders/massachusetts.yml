seo_description: "Massachusetts borders 5 states (Vermont, New Hampshire, Rhode Island, Connecticut, New York) and the Atlantic Ocean. See complete border breakdown."

intro_text: "Massachusetts borders five states: Vermont and New Hampshire to the north, Rhode Island and Connecticut to the south, and New York to the west. The state also meets the Atlantic Ocean along its eastern coast. Massachusetts Bay and Cape Cod Bay are major features of the coastline."

