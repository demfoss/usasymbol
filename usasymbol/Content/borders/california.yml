      - "San Ysidro is the busiest land border crossing in the Western Hemisphere"

faq:
  - question: "How many states border California?"
    answer: "Three states border California: Oregon to the north, Nevada to the east, and Arizona to the southeast."
  - question: "What is the longest border California shares with another state?"
    answer: "Nevada shares California's longest state border. The boundary runs diagonally through the Sierra Nevada mountains from the Oregon border to the Arizona border."
  - question: "Does California border Utah?"
    answer: "No, California does not border Utah. California's eastern neighbors are only Nevada and Arizona. Utah is located northeast of Arizona and does not touch California."
  - question: "What river forms the California-Arizona border?"
    answer: "The Colorado River forms most of the California-Arizona border, creating approximately 240 miles of natural boundary."
  - question: "What country borders California?"
    answer: "Mexico is the only country that borders California. The international boundary runs about 140 miles along California's southern edge from the Pacific Ocean to the Colorado River."
  - question: "How long is California's coastline?"
    answer: "California has approximately 840 miles of Pacific Ocean coastline, stretching from the Oregon border in the north to Mexico in the south."

