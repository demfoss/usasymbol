faq:
  - question: "What borders Alaska?"
    answer: "Alaska borders Canada to the east and southeast. It is also surrounded by the Pacific Ocean (south), Bering Sea (west), and Arctic Ocean (north). No U.S. states border Alaska."
  - question: "What state borders Alaska?"
    answer: "No U.S. states border Alaska. Alaska is separated from the contiguous United States by Canada, making it the only state completely separated from the rest of the country."
  - question: "What country borders Alaska?"
    answer: "Canada is the only country that shares a land border with Alaska. The border is about 1,538 miles long and runs through Yukon Territory and British Columbia."
  - question: "What Canadian territory borders Alaska?"
    answer: "Yukon Territory borders Alaska to the east, forming most of Alaska's border with Canada for about 1,210 miles along the 141st meridian west."
  - question: "What Canadian province borders Alaska?"
    answer: "British Columbia borders Alaska to the southeast along the Alaska Panhandle for about 330 miles."
  - question: "What ocean borders Alaska?"
    answer: "Two oceans border Alaska: the Pacific Ocean to the south and the Arctic Ocean to the north. The Bering Sea, which is part of the Pacific, borders Alaska to the west."
  - question: "What sea borders Alaska to the west?"
    answer: "The Bering Sea borders Alaska to the west, separating it from Russia by about 55 miles at the Bering Strait."
  - question: "Does Alaska border Russia?"
    answer: "Alaska does not share a land border with Russia, but the two countries are separated by only 55 miles across the Bering Strait. At the narrowest point between the Diomede Islands, the distance is just 2.4 miles."

