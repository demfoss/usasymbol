seo_title: "Alaska Borders: Canada, 3 Oceans & Near Russia"
seo_description: "Alaska borders only Canada — Yukon Territory and British Columbia. No U.S. states share its border. Russia lies 55 miles away across the Bering Strait."

intro_text: "Alaska does not border any U.S. states. Instead, it shares land borders with Canada—specifically Yukon Territory to the east and British Columbia to the southeast. Alaska also comes within 55 miles of Russia across the Bering Strait, though no land border exists between them."

