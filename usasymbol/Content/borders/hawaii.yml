sections:
  - id: no-borders
    icon: "fa-solid fa-island-tropical"
    title: "Hawaii Has No State or Country Borders"
    paragraphs:
      - "Hawaii is the only U.S. state that shares no borders with any other state or country. The state is an isolated archipelago in the middle of the Pacific Ocean, located approximately 2,400 miles southwest of [California](https://usasymbol.com/states/california), 3,850 miles from Japan, and 4,900 miles from China. This extreme isolation makes Hawaii the most remote population center on Earth."

  - id: pacific-ocean
    icon: "fa-solid fa-water"
    title: "Pacific Ocean: Hawaii's Only Border"
    paragraphs:
      - "The Pacific Ocean completely surrounds [Hawaii](https://usasymbol.com/states/hawaii), forming the state's only border. Hawaii sits in the central Pacific Ocean, roughly in the middle of the ocean between Asia and North America. The state's 137 islands are spread across 1,500 miles of ocean, though the eight main islands are clustered more closely together."
      - "Hawaii's total coastline measures approximately 750 miles across all islands. The major islands—Hawaii (Big Island), Maui, Oahu, Kauai, Molokai, Lanai, Niihau, and Kahoolawe—each have their own distinct coastlines ranging from volcanic black sand beaches to white coral sand beaches. The surrounding Pacific waters reach depths of over 15,000 feet in some areas near the islands."

  - id: island-chain
    icon: "fa-solid fa-map-marked-alt"
    title: "An Archipelago of 137 Islands"
    paragraphs:
      - "Hawaii is an archipelago consisting of 137 islands, atolls, and seamounts stretching about 1,500 miles across the Pacific. Only seven of these islands are inhabited year-round: Hawaii (Big Island), Maui, Oahu, Kauai, Molokai, Lanai, and Niihau. The eighth major island, Kahoolawe, is uninhabited. The Hawaiian island chain was formed by volcanic activity as the Pacific tectonic plate moved over a stationary hotspot in Earth's mantle, creating islands that get progressively older from southeast to northwest."

  - id: most-isolated
    icon: "fa-solid fa-globe"
    title: "Most Isolated Population Center on Earth"
    paragraphs:
      - "Hawaii is the most geographically isolated population center on Earth. The nearest landmass is California, about 2,400 miles away. The nearest other state is [Alaska](https://usasymbol.com/states/alaska), roughly 2,800 miles to the north. This isolation has created unique ecosystems found nowhere else on Earth, with over 90% of Hawaii's native species being endemic—meaning they exist only in Hawaii. The isolation also means Hawaii is the only U.S. state located in Oceania rather than North America."

