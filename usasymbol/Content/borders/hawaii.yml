faq:
  - question: "What borders Hawaii?"
    answer: "Only the Pacific Ocean borders Hawaii. The state is an isolated archipelago in the middle of the Pacific Ocean with no land borders to any state or country."
  - question: "What state borders Hawaii?"
    answer: "No U.S. states border Hawaii. Hawaii is an island state located about 2,400 miles from the U.S. mainland, making it the only state with no land borders."
  - question: "What country borders Hawaii?"
    answer: "No country borders Hawaii. Hawaii is surrounded entirely by the Pacific Ocean, with the nearest countries being over 1,000 miles away."
  - question: "What ocean borders Hawaii?"
    answer: "The Pacific Ocean borders Hawaii on all sides. Hawaii sits in the central Pacific Ocean, roughly midway between Asia and North America."
  - question: "How far is Hawaii from the nearest land?"
    answer: "The nearest significant land to Hawaii is the U.S. mainland (California), located approximately 2,400 miles to the east. The nearest foreign country is Kiribati, about 1,200 miles to the south."
  - question: "Is Hawaii the most isolated state?"
    answer: "Yes, Hawaii is the most geographically isolated population center on Earth. It is located about 2,400 miles from the U.S. mainland and thousands of miles from any other significant landmass."
  - question: "How many islands make up Hawaii?"
    answer: "Hawaii consists of 137 islands, atolls, and seamounts stretching about 1,500 miles across the Pacific Ocean. Only seven islands are inhabited year-round, with eight major islands in total."

