faq:
  - question: "What borders Colorado?"
    answer: "Colorado borders seven states: Wyoming (north), Nebraska and Kansas (east), Oklahoma and New Mexico (south), and Utah and Arizona (west). Colorado is landlocked with no ocean borders."
  - question: "What state borders Colorado?"
    answer: "Seven states border Colorado: Wyoming, Nebraska, Kansas, Oklahoma, New Mexico, Arizona, and Utah."
  - question: "How many borders does Colorado have?"
    answer: "Colorado borders seven states, making it tied with Missouri and Tennessee for the most state borders in the U.S."
  - question: "What state borders Colorado to the west?"
    answer: "Utah borders Colorado to the west along the entire western state line. Arizona also touches Colorado at the Four Corners point in the southwest corner."
  - question: "What state borders Colorado to the south?"
    answer: "Two states border Colorado to the south: New Mexico (which forms most of the southern border) and Oklahoma (which touches the southeast corner). Arizona also meets Colorado at the Four Corners point in the southwest."
  - question: "What state borders Colorado to the east?"
    answer: "Two states border Colorado to the east: Kansas (which forms most of the eastern border) and Nebraska (which borders the northeast corner)."
  - question: "What is Four Corners in Colorado?"
    answer: "Four Corners is the point where Colorado, Arizona, New Mexico, and Utah meet. It's the only place in the United States where four states touch at a single point."
  - question: "Is Colorado landlocked?"
    answer: "Yes, Colorado is landlocked. It has no ocean, gulf, or Great Lakes coastline and is surrounded entirely by other states."

