seo_title: "Colorado Borders: 7 States, All Straight Survey Lines"
seo_description: "Colorado borders 7 states: Wyoming, Nebraska, Kansas, Oklahoma, New Mexico, Utah; Arizona at Four Corners only. Every border is a straight surveyed line. Landlocked."

intro_text: "Colorado borders seven states: Wyoming to the north, Nebraska and Kansas to the east, Oklahoma and New Mexico to the south, and Utah and Arizona to the west. Colorado is one of only three states to border seven others."

