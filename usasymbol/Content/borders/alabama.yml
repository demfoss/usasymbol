    facts:
      - "Alabama borders exactly four U.S. states"
      - "The Mississippi border is Alabama's longest at about 310 miles"
      - "Alabama has about 53 miles of Gulf of Mexico coastline"
      - "The Chattahoochee River forms part of the Alabama-Georgia border"
      - "Alabama's northern and southern borders follow parallel lines (35th and 31st)"
      - "Alabama is not landlocked because it touches the Gulf of Mexico"

faq:
  - question: "What borders Alabama?"
    answer: "Alabama borders four states and the Gulf of Mexico. Tennessee borders to the north, Georgia to the east, Florida to the south, and Mississippi to the west. The Gulf of Mexico also borders Alabama's southern coast."
  - question: "What states border Alabama?"
    answer: "Four states border Alabama: Tennessee (north), Georgia (east), Florida (south), and Mississippi (west)."
  - question: "How many states border Alabama?"
    answer: "Four states border Alabama."
  - question: "What state borders Alabama to the north?"
    answer: "Tennessee borders Alabama to the north. The border follows a straight line along the 35th parallel north latitude for about 115 miles."
  - question: "What state borders Alabama to the east?"
    answer: "Georgia borders Alabama to the east. The Chattahoochee River forms the southern portion of this boundary, which extends for about 285 miles."
  - question: "What state borders Alabama to the west?"
    answer: "Mississippi borders Alabama to the west. This is Alabama's longest border at about 310 miles, and portions include the Tennessee River."
  - question: "What river borders Alabama and Georgia?"
    answer: "The Chattahoochee River forms part of the border between Alabama and Georgia, particularly in the southern section of their shared boundary."
  - question: "Does Alabama border the ocean?"
    answer: "Alabama borders the Gulf of Mexico along its southern coast, with about 53 miles of shoreline. It does not border the Atlantic or Pacific oceans."

