intro_text: "Alabama borders four states: Tennessee to the north, Georgia to the east, Florida to the south, and Mississippi to the west. The state also touches the Gulf of Mexico along its southern coast. The Chattahoochee River forms part of Alabama's eastern boundary with Georgia."

