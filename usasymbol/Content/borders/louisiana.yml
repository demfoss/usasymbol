seo_description: "Louisiana borders 3 states: Arkansas, Mississippi, Texas. Gulf of Mexico forms the southern coast. Sabine River marks Texas; Mississippi River runs east."

intro_text: "Louisiana borders three states: Arkansas to the north, Mississippi to the east, and Texas to the west. The state also meets the Gulf of Mexico along its southern coast. The Mississippi River forms part of Louisiana's eastern border, while the Sabine River creates much of the boundary with Texas."

