faq:
  - question: "What borders Louisiana?"
    answer: "Louisiana borders three states and the Gulf of Mexico. Arkansas borders to the north, Mississippi to the east, Texas to the west, and the Gulf of Mexico to the south."
  - question: "What state borders Louisiana?"
    answer: "Three states border Louisiana: Arkansas (north), Mississippi (east), and Texas (west)."
  - question: "What state borders Louisiana to the north?"
    answer: "Arkansas borders Louisiana to the north along the 33rd parallel north latitude for about 275 miles."
  - question: "What state borders Louisiana to the east?"
    answer: "Mississippi borders Louisiana to the east. The Mississippi River forms the northern portion of this border, while the Pearl River creates the southern section."
  - question: "What state borders Louisiana to the west?"
    answer: "Texas borders Louisiana to the west. The Sabine River forms most of this boundary for about 180 miles."
  - question: "What body of water borders Louisiana?"
    answer: "The Gulf of Mexico borders Louisiana to the south, along with several major rivers: the Mississippi River (east), Pearl River (east), and Sabine River (west)."
  - question: "What body of water borders Louisiana to the south?"
    answer: "The Gulf of Mexico borders Louisiana to the south, providing about 397 miles of coastline and over 7,700 miles of tidal shoreline."
  - question: "What river borders Texas and Louisiana?"
    answer: "The Sabine River forms most of the border between Texas and Louisiana, running about 180 miles from Arkansas to the Gulf of Mexico."
  - question: "What lake borders Texas and Louisiana?"
    answer: "Sabine Lake borders both Texas and Louisiana near the Gulf coast, where the Sabine River widens into a lake before entering the Gulf of Mexico."

