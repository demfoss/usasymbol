faq:
  - question: "What states border Tennessee?"
    answer: "Eight states border Tennessee: Kentucky and Virginia (north), North Carolina (east), Georgia, Alabama, and Mississippi (south), and Arkansas and Missouri (west). Tennessee borders more states than any other except Missouri, which also borders eight."
  
  - question: "How many states border Tennessee?"
    answer: "Eight states border Tennessee, making it tied with Missouri for bordering the most states in the country. The eight states are Kentucky, Virginia, North Carolina, Georgia, Alabama, Mississippi, Arkansas, and Missouri."
  
  - question: "What state borders Tennessee to the east?"
    answer: "North Carolina borders Tennessee to the east. This 340-mile border runs through the Great Smoky Mountains in the north and follows surveyed lines in the south."
  
  - question: "What state borders Tennessee to the northeast?"
    answer: "Virginia borders Tennessee to the northeast. This short border of about 50 miles runs through the Appalachian Mountains where Tennessee, Virginia, and North Carolina meet."
  
  - question: "What borders Tennessee?"
    answer: "Tennessee borders eight states and no bodies of water except the Mississippi River on its western edge. Kentucky and Virginia border to the north, North Carolina to the east, Georgia, Alabama, and Mississippi to the south, and Arkansas and Missouri to the west across the Mississippi River."
  
  - question: "What state borders Memphis Tennessee?"
    answer: "Two states border Memphis, Tennessee: Mississippi borders Memphis to the south, and Arkansas borders Memphis to the west across the Mississippi River. Memphis sits in the far southwestern corner of Tennessee where all three states meet."
  
  - question: "What body of water borders Tennessee on the west?"
    answer: "The Mississippi River borders Tennessee on the west, forming the entire western boundary with Arkansas and Missouri for about 190 miles total. This is Tennessee's only border formed entirely by water."
  
  - question: "Tennessee has borders with how many states?"
    answer: "Tennessee has borders with eight states: Kentucky, Virginia, North Carolina, Georgia, Alabama, Mississippi, Arkansas, and Missouri. Only Missouri matches this number—all other states border fewer neighbors."

