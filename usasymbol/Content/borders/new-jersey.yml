    facts:
      - "New Jersey borders exactly three U.S. states"
      - "The Delaware River forms New Jersey's entire 190-mile western border"
      - "New Jersey has about 130 miles of Atlantic Ocean coastline"
      - "New Jersey has approximately 1,792 miles of tidal shoreline"
      - "The Hudson River separates New Jersey from New York City"
      - "New Jersey is the most densely populated state in the U.S."
      - "New Jersey is not landlocked due to its extensive Atlantic coastline"

faq:
  - question: "What borders New Jersey?"
    answer: "New Jersey borders three states and the Atlantic Ocean. New York borders to the north and northeast, Pennsylvania to the west (across the Delaware River), Delaware to the southwest (across the Delaware River and Bay), and the Atlantic Ocean to the east and south."
  - question: "What state borders New Jersey?"
    answer: "Three states border New Jersey: New York (north and northeast), Pennsylvania (west), and Delaware (southwest)."
  - question: "Which state borders New Jersey on the northeast?"
    answer: "New York borders New Jersey on the northeast across the Hudson River, separating New Jersey from New York City."
  - question: "What ocean borders New Jersey?"
    answer: "The Atlantic Ocean borders New Jersey along its eastern and southern coasts, providing about 130 miles of general coastline."
  - question: "What river borders New Jersey and Pennsylvania?"
    answer: "The Delaware River forms the entire border between New Jersey and Pennsylvania, running about 140 miles from New York to Delaware."
  - question: "What major body of water borders New Jersey?"
    answer: "Several major bodies of water border New Jersey: the Atlantic Ocean (east and south), the Hudson River (northeast with New York), the Delaware River (west with Pennsylvania), and Delaware Bay (southwest with Delaware)."
  - question: "How long is New Jersey's coastline?"
    answer: "New Jersey has approximately 130 miles of general Atlantic Ocean coastline, though its tidal shoreline (including bays and inlets) extends for about 1,792 miles."
  - question: "What is the Jersey Shore?"
    answer: "The Jersey Shore refers to New Jersey's Atlantic coastline and coastal region, featuring over 40 beach towns and resorts. It's one of the most popular beach destinations on the East Coast."

