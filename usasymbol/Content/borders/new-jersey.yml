intro_text: "New Jersey borders three states: New York to the north and northeast, Pennsylvania to the west, and Delaware to the southwest. The state also meets the Atlantic Ocean along its eastern and southern coasts. The Delaware River forms New Jersey's entire western border with Pennsylvania and Delaware."

