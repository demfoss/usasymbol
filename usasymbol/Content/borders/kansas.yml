faq:
  - question: "What borders Kansas?"
    answer: "Kansas borders four states. Nebraska borders to the north, Missouri to the east, Oklahoma to the south, and Colorado to the west. Kansas is landlocked with no ocean borders."
  - question: "What state borders Kansas?"
    answer: "Four states border Kansas: Nebraska (north), Missouri (east), Oklahoma (south), and Colorado (west)."
  - question: "What state borders Kansas to the east?"
    answer: "Missouri borders Kansas to the east. The border runs about 270 miles along a mostly straight line from Nebraska to Oklahoma, with Kansas City sitting on the state line."
  - question: "What state borders Kansas to the south?"
    answer: "Oklahoma borders Kansas to the south. The border follows the 37th parallel north for about 410 miles, making it Kansas's longest state border."
  - question: "What state borders Kansas to the west?"
    answer: "Colorado borders Kansas to the west along the 25th meridian west (102nd meridian), running about 220 miles from Nebraska to Oklahoma."
  - question: "What state borders Kansas to the north?"
    answer: "Nebraska borders Kansas to the north. The border follows the 40th parallel north latitude for about 210 miles from Colorado to Missouri."
  - question: "What state borders both Kansas and Utah?"
    answer: "Colorado is the state that borders both Kansas (to the east of Colorado) and Utah (to the west of Colorado)."
  - question: "Is Kansas landlocked?"
    answer: "Yes, Kansas is landlocked. It has no ocean or Great Lakes coastline and is surrounded entirely by four other states."
  - question: "Which two states does Kansas City border?"
    answer: "Kansas City borders Kansas and Missouri. The city exists as two separate municipalities—Kansas City, Kansas and Kansas City, Missouri—on opposite sides of the state line."

