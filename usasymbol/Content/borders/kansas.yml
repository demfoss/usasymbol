intro_text: "Kansas borders four states: Nebraska to the north, Missouri to the east, Oklahoma to the south, and Colorado to the west. The state has a nearly rectangular shape with mostly straight borders following lines of latitude and longitude. The Missouri River forms a small portion of Kansas's northeastern border with Missouri."

