faq:
  - question: "What states border Rhode Island?"
    answer: "Two states border Rhode Island: Massachusetts (north and east) and Connecticut (west). This makes Rhode Island one of the states with the fewest neighbors in the continental United States."
  
  - question: "What borders Rhode Island?"
    answer: "Rhode Island borders two states and the Atlantic Ocean. Massachusetts borders to the north and east, Connecticut to the west, and the Atlantic Ocean (including Narragansett Bay) to the south."
  
  - question: "How many states border Rhode Island?"
    answer: "Two states border Rhode Island: Massachusetts and Connecticut. Only Hawaii and Alaska border fewer states than Rhode Island."
  
  - question: "What ocean borders Rhode Island?"
    answer: "The Atlantic Ocean borders Rhode Island along its southern coast. Narragansett Bay, a major estuary of the Atlantic, extends into the state and provides about 384 miles of tidal shoreline."
  
  - question: "Is Rhode Island an island?"
    answer: "No, Rhode Island is not entirely an island. Most of Rhode Island is on the mainland and borders Connecticut and Massachusetts. However, the state does include several islands in Narragansett Bay, including Aquidneck Island (historically called Rhode Island), Block Island, and others. The name comes from these islands, but the majority of the state's area and population is on the mainland."
  
  - question: "Does Rhode Island border Massachusetts?"
    answer: "Yes, Massachusetts borders Rhode Island on two sides—the entire northern border and most of the eastern border. This border extends about 160 miles total, making Massachusetts Rhode Island's longest border neighbor."
  
  - question: "Does Rhode Island border Connecticut?"
    answer: "Yes, Connecticut borders Rhode Island to the west. The border runs about 50 miles from Massachusetts to the Atlantic Ocean, with the Pawcatuck River forming the southern portion."
  
  - question: "What river borders Rhode Island and Connecticut?"
    answer: "The Pawcatuck River borders Rhode Island and Connecticut in the southern section of their boundary. This river flows for about 15 miles along the border before emptying into Little Narragansett Bay and the Atlantic Ocean."

