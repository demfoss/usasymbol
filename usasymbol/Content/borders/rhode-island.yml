seo_title: "Rhode Island Borders | Connecticut, Massachusetts & Atlantic"
seo_description: "Rhode Island borders Connecticut and Massachusetts. Narragansett Bay and the Atlantic shape the coast, though most land is mainland."

intro_text: "Rhode Island borders two states: Connecticut to the west and Massachusetts to the north and east. The Atlantic Ocean forms Rhode Island's southern boundary through Narragansett Bay and the open ocean. Despite its name, Rhode Island is not entirely an island—the mainland makes up most of the state's area, though the state does include several islands including Aquidneck Island (Rhode Island), Block Island, and others."

