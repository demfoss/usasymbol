seo_title: "Minnesota Borders | 4 States, Canada & Lake Superior"
seo_description: "Minnesota borders 4 states: Wisconsin, Iowa, South Dakota, North Dakota. Also borders Canada — Manitoba and Ontario. Lake Superior northeast. Landlocked."

intro_text: "Minnesota borders four U.S. states: Wisconsin to the east, Iowa to the south, South Dakota to the west, and North Dakota to the northwest. The state also shares international borders with two Canadian provinces—Manitoba to the north and Ontario to the northeast. Lake Superior borders Minnesota's northeastern coast."

