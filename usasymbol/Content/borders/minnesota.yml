    facts:
      - "Minnesota borders exactly four U.S. states"
      - "Minnesota shares about 550 miles of border with Canada"
      - "Lake Superior is Minnesota's only Great Lake border (189 miles)"
      - "The Northwest Angle is the northernmost point in the contiguous U.S."
      - "About 60% of Minnesota's borders are formed by water"
      - "The Red River forms the entire border with North Dakota"
      - "Minnesota is not landlocked due to its Lake Superior coastline"

faq:
  - question: "What borders Minnesota?"
    answer: "Minnesota borders four U.S. states, two Canadian provinces, and Lake Superior. Wisconsin borders to the east, Iowa to the south, South Dakota to the west, North Dakota to the northwest, Manitoba (Canada) to the north, Ontario (Canada) to the northeast, and Lake Superior to the northeast."
  - question: "What state borders Minnesota?"
    answer: "Four states border Minnesota: Wisconsin (east), Iowa (south), South Dakota (west), and North Dakota (northwest)."
  - question: "What state borders Minnesota to the east?"
    answer: "Wisconsin borders Minnesota to the east. The St. Croix River and Mississippi River form most of this boundary."
  - question: "What state borders Minnesota to the south?"
    answer: "Iowa borders Minnesota to the south along the 43rd parallel north latitude for about 260 miles."
  - question: "What country borders Minnesota?"
    answer: "Canada borders Minnesota through two provinces: Manitoba to the north (about 310 miles) and Ontario to the northeast (about 240 miles)."
  - question: "What Canadian province borders Minnesota?"
    answer: "Two Canadian provinces border Minnesota: Manitoba along the northern border (49th parallel) and Ontario in the northeastern water boundary region."
  - question: "What great lake borders Minnesota?"
    answer: "Lake Superior is the only Great Lake that borders Minnesota, providing about 189 miles of coastline along Minnesota's North Shore in the northeast."
  - question: "What body of water borders Minnesota?"
    answer: "Multiple bodies of water border Minnesota: Lake Superior (northeast), the Mississippi River (east with Wisconsin), St. Croix River (east with Wisconsin), Red River (northwest with North Dakota), Big Sioux River (west with South Dakota), and various lakes along the Canadian border."
  - question: "Which state borders both Minnesota and Michigan?"
    answer: "Wisconsin is the state that borders both Minnesota (to the east of Minnesota) and Michigan (to the west of Michigan's Upper Peninsula and across Lake Michigan)."

