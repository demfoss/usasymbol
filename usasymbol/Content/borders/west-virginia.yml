faq:
  - question: "What states border West Virginia?"
    answer: "Five states border West Virginia: Virginia (east and south), Kentucky (southwest), Ohio (west), Pennsylvania (north), and Maryland (northeast)."
  
  - question: "What borders West Virginia?"
    answer: "West Virginia borders five states. Virginia borders to the east and south, Kentucky to the southwest, Ohio to the west across the Ohio River, Pennsylvania to the north, and Maryland to the northeast. West Virginia has no ocean, Great Lakes, or international borders."
  
  - question: "What state borders West Virginia to the west?"
    answer: "Ohio borders West Virginia to the west. The Ohio River forms this entire boundary for about 240 miles, creating a natural water border between the states."
  
  - question: "How many states border West Virginia?"
    answer: "Five states border West Virginia: Virginia, Kentucky, Ohio, Pennsylvania, and Maryland."
  
  - question: "How did West Virginia get its borders?"
    answer: "West Virginia's borders were created when it separated from Virginia during the Civil War in 1863. Western Virginia counties that opposed Confederate secession held conventions to form a new Union-loyal state. The boundaries followed county lines, mountain ridges, and river valleys of the counties that voted for statehood. The Northern and Eastern Panhandles were included for strategic reasons including control of the B&O Railroad."
  
  - question: "Why does West Virginia have panhandles?"
    answer: "West Virginia has two panhandles (Northern and Eastern) that were included when the state separated from Virginia in 1863. The Northern Panhandle extends between Ohio and Pennsylvania to reach the Mason-Dixon Line. The Eastern Panhandle extends between Maryland and Virginia to control the Baltimore & Ohio Railroad and strategic territory near Washington, D.C. during the Civil War."
  
  - question: "What state borders Virginia to the west?"
    answer: "West Virginia borders Virginia to the west (and also wraps around to border Virginia's northwest side). The two states share about 380 miles of border through the Appalachian Mountains. West Virginia separated from Virginia in 1863 during the Civil War."
  
  - question: "What river forms West Virginia's western border?"
    answer: "The Ohio River forms West Virginia's entire western border with Ohio (about 240 miles) and part of the southwestern border with Kentucky. Major West Virginia cities on this river include Wheeling, Parkersburg, and Huntington."

