      - "Idaho's border passes through Yellowstone and Grand Teton National Parks"

faq:
  - question: "What borders Idaho?"
    answer: "Idaho borders six U.S. states and one Canadian province. Montana and Wyoming border to the east, Utah and Nevada to the south, Oregon to the west, Washington to the northwest, and British Columbia, Canada to the north."
  - question: "What state borders Idaho?"
    answer: "Six states border Idaho: Montana, Wyoming, Utah, Nevada, Oregon, and Washington."
  - question: "How many states border Idaho?"
    answer: "Six states border Idaho, making it tied with several other states for having the second-most state borders in the U.S."
  - question: "What Canadian province borders Idaho?"
    answer: "British Columbia borders Idaho along the northern tip of the Idaho Panhandle for about 45 miles."
  - question: "What borders the state of Idaho to the north?"
    answer: "British Columbia, Canada borders Idaho to the north along the 49th parallel, running for about 45 miles across the top of the Idaho Panhandle."
  - question: "Which northwestern state borders Idaho and Oregon?"
    answer: "Washington is the northwestern state that borders both Idaho and Oregon. Washington sits northwest of Idaho and north of Oregon."
  - question: "What river forms Idaho's border?"
    answer: "The Snake River forms much of Idaho's western border with Oregon and Washington. The river carved Hells Canyon, North America's deepest river gorge, along this border."
  - question: "Is Idaho landlocked?"
    answer: "Yes, Idaho is landlocked. It has no ocean or Great Lakes coastline and is surrounded entirely by other states and British Columbia, Canada."

