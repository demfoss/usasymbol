seo_title: "Idaho Borders | 6 States, Canada & Hells Canyon"
seo_description: "Idaho borders 6 states: Montana, Wyoming, Utah, Nevada, Oregon, Washington. Also borders Canada (British Columbia). Snake River & Hells Canyon on the west."

intro_text: "Idaho borders six U.S. states and one Canadian province. Montana and Wyoming lie to the east, Utah and Nevada to the south, Oregon to the west, and Washington to the northwest. British Columbia, Canada borders Idaho to the north. The Snake River forms much of Idaho's western border with Oregon and Washington."

