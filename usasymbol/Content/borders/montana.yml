faq:
  - question: "What borders Montana?"
    answer: "Montana borders three U.S. states and Canada. Idaho borders to the west, Wyoming to the south, North Dakota and South Dakota to the east, and Canada (British Columbia, Alberta, and Saskatchewan) to the north."
  - question: "What state borders Montana?"
    answer: "Three states border Montana: Idaho (west), Wyoming (south), and North Dakota and South Dakota (east)."
  - question: "What state borders Montana on the west?"
    answer: "Idaho borders Montana on the west, running about 545 miles along the Continental Divide and Bitterroot Range through the Rocky Mountains."
  - question: "Which state borders Montana to the south?"
    answer: "Wyoming borders Montana to the south, running about 390 miles from Idaho to South Dakota, including a section through Yellowstone National Park."
  - question: "What borders Montana to the north?"
    answer: "Canada borders Montana to the north through three provinces: British Columbia (northwest), Alberta (north), and Saskatchewan (northeast). The border follows the 49th parallel for about 545 miles."
  - question: "What country borders Montana?"
    answer: "Canada borders Montana along the entire northern edge through three provinces: British Columbia, Alberta, and Saskatchewan, for a total of about 545 miles."
  - question: "What Canadian province borders Montana?"
    answer: "Three Canadian provinces border Montana: British Columbia (northwest for about 65 miles), Alberta (north for about 300 miles), and Saskatchewan (northeast for about 180 miles)."
  - question: "How many Canadian provinces border Montana?"
    answer: "Three Canadian provinces border Montana: British Columbia, Alberta, and Saskatchewan."
  - question: "What part of Canada borders Montana?"
    answer: "Three Canadian provinces border Montana along the 49th parallel: British Columbia in the northwest, Alberta across most of the northern border, and Saskatchewan in the northeast."

