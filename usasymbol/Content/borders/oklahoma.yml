seo_description: "Oklahoma borders Kansas, Missouri, Arkansas, Texas, New Mexico, and Colorado. The Red River shapes most of the Texas line."

intro_text: "Oklahoma borders six states: Kansas to the north, Missouri to the northeast, Arkansas to the east, Texas to the south, New Mexico to the west, and Colorado to the northwest. The Red River creates most of the southern boundary with Texas. Oklahoma's Panhandle gives the state its distinctive shape, stretching west between Texas and Kansas."

