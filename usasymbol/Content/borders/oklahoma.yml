faq:
  - question: "What states border Oklahoma?"
    answer: "Six states border Oklahoma: Kansas (north), Missouri (northeast), Arkansas (east), Texas (south), New Mexico (west), and Colorado (northwest)."
  
  - question: "What borders Oklahoma?"
    answer: "Oklahoma borders six states. Kansas borders to the north, Missouri to the northeast, Arkansas to the east, Texas to the south, New Mexico to the west, and Colorado to the northwest. The Red River forms most of the southern boundary with Texas."
  
  - question: "What river borders Texas and Oklahoma?"
    answer: "The Red River borders Texas and Oklahoma. This river forms about 540 miles of the southern boundary between the two states."
  
  - question: "What state borders Oklahoma to the south?"
    answer: "Texas borders Oklahoma to the south. The Red River creates most of this boundary, running for about 540 miles between the states."
  
  - question: "What state borders Oklahoma to the north?"
    answer: "Kansas borders Oklahoma to the north. This boundary follows the 37th parallel north latitude for about 415 miles across the entire northern edge of Oklahoma, including the Panhandle."
  
  - question: "Which states touch Oklahoma's borders?"
    answer: "Six states touch Oklahoma's borders: Kansas, Missouri, Arkansas, Texas, New Mexico, and Colorado. This makes Oklahoma one of the states with the most neighbors in the country."
  
  - question: "Why does Oklahoma have weird borders?"
    answer: "Oklahoma's distinctive shape comes from the Panhandle, a narrow strip of land extending 166 miles westward. This area was called 'No Man's Land' because no state claimed it for decades due to various territorial disputes and slavery-related boundaries. The Panhandle became part of Oklahoma Territory in 1890."
  
  - question: "What Oklahoma county borders Kansas and Missouri?"
    answer: "Ottawa County is the only Oklahoma county that borders both Kansas and Missouri. This county sits in the far northeastern corner of Oklahoma where these three states meet."

