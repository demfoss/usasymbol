faq:
  - question: "What borders Nevada?"
    answer: "Nevada borders five states. Oregon and Idaho border to the north, Utah to the east, Arizona to the southeast (across the Colorado River), and California to the west and southwest."
  - question: "What state borders Nevada?"
    answer: "Five states border Nevada: Oregon (north), Idaho (northeast), Utah (east), Arizona (southeast), and California (west and south)."
  - question: "How many states border Nevada?"
    answer: "Five states border Nevada."
  - question: "What is Nevada's longest border?"
    answer: "California shares Nevada's longest border at about 600 miles, running from Oregon in the north to Arizona in the south through the Sierra Nevada mountains and desert terrain."
  - question: "What is Nevada's shortest border?"
    answer: "Idaho shares Nevada's shortest border at only about 25 miles in the northeastern corner of the state."
  - question: "Is Nevada landlocked?"
    answer: "Yes, Nevada is landlocked. It has no ocean or Great Lakes coastline and is surrounded entirely by five other states."
  - question: "What lake is on the Nevada border?"
    answer: "Lake Tahoe straddles the border between Nevada and California in the Sierra Nevada mountains. Lake Mead, formed by Hoover Dam, also sits on the Nevada-Arizona border."

