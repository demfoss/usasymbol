sections:
  - id: states-border
    icon: "fa-solid fa-map"
    title: "Which States Border Nevada?"
    paragraphs:
      - "Nevada shares its borders with five U.S. states: [Oregon](https://usasymbol.com/states/oregon) and Idaho to the north, Utah to the east, Arizona to the southeast, and California to the west and southwest. Most of Nevada's borders follow straight survey lines through desert and mountain terrain."
    subsections:
      - id: "border-oregon"
        subtitle: "North: Oregon"
        paragraphs:
          - "Oregon and [Nevada](https://usasymbol.com/states/nevada) are separated by a border located on Nevada's northern edge. The state line follows the 42nd parallel north latitude, creating a straight east-west boundary."
          - "The Nevada-Oregon border extends for about 225 miles from California in the west to Idaho in the east. Nevada counties along this border include Washoe, Humboldt, and Elko. On the Oregon side, Lake, Harney, and Malheur counties sit along the border. The border region is characterized by high desert and basin-and-range topography."
        bullets:
          - "About 225 miles along 42nd parallel"
          - "Straight east-west line"
          - "Nevada counties: Washoe, Humboldt, Elko"
      
      - id: "border-idaho"
        subtitle: "North-East: Idaho"
        paragraphs:
          - "[Idaho](https://usasymbol.com/states/idaho) and Nevada are separated by a border in Nevada's northeastern corner. The boundary runs roughly north-south for a short distance where the three states of Nevada, Idaho, and Utah meet."
          - "The Nevada-Idaho border extends for only about 25 miles, making it Nevada's shortest state border. Only Elko County in Nevada touches this border. The border region is remote high desert with limited population."
        bullets:
          - "About 25 miles (shortest border)"
          - "Northeastern corner only"
          - "Only Elko County touches border"
      
      - id: "border-utah"
        subtitle: "East: Utah"
        paragraphs:
          - "[Utah](https://usasymbol.com/states/utah) and Nevada are separated by a border located on Nevada's eastern edge. The state line runs roughly north-south from Idaho in the north to Arizona in the south."
          - "The Nevada-Utah border extends for about 365 miles. The border follows a mostly straight meridian line through the Great Basin desert. Nevada counties along this border include Elko, White Pine, Lincoln, and Clark. The border region is characterized by desert valleys, mountain ranges, and very low population density."
        bullets:
          - "About 365 miles north-south"
          - "Follows meridian through Great Basin"
          - "Nevada counties: Elko, White Pine, Lincoln, Clark"
      
      - id: "border-arizona"
        subtitle: "South-East: Arizona (Colorado River Border)"
        paragraphs:
          - "Arizona and Nevada are separated by the Colorado River along Nevada's southeastern edge. The river creates a natural boundary for about 150 miles."
          - "The Nevada-Arizona border extends for about 150 miles along the Colorado River from Utah in the north to California in the south. Only Clark and Mohave counties in Nevada touch this border. Lake Mead, formed by Hoover Dam, creates much of this border. The Hoover Dam itself sits on the border, and Las Vegas is located about 25 miles northwest of the border."
        bullets:
          - "About 150 miles along Colorado River"
          - "Lake Mead forms much of border"
          - "Hoover Dam on border"
      
      - id: "border-california"
        subtitle: "West & South: California (Longest Border)"
        paragraphs:
          - "California and Nevada are separated by a border on Nevada's western and southwestern edges. The boundary runs roughly north-south from Oregon in the north to Arizona in the south."
          - "The Nevada-California border extends for about 600 miles, making it Nevada's longest state border. The border follows a diagonal line through the Sierra Nevada mountains in the north, then runs roughly north-south through desert terrain in the south. Nevada counties along this border include Washoe, Carson City, Douglas, Lyon, Mineral, Esmeralda, Nye, and Clark. Lake Tahoe straddles the border in the northwest. The Reno-Tahoe area sits near this border."
        bullets:
          - "About 600 miles (longest border)"
          - "Diagonal line through Sierra Nevada"
          - "Lake Tahoe on border"

  - id: lake-tahoe
    icon: "fa-solid fa-water"
    title: "Lake Tahoe: Straddling the Nevada-California Border"
    paragraphs:
      - "Lake Tahoe is a large alpine lake that straddles the border between Nevada and California in the Sierra Nevada mountains. The lake is approximately two-thirds in California and one-third in Nevada. Lake Tahoe is the largest alpine lake in North America and the second-deepest lake in the United States at 1,645 feet deep. The lake sits at 6,225 feet elevation and is known for its crystal-clear waters and surrounding mountain scenery. Major communities on the Nevada side include Incline Village and Stateline (home to casinos), while South Lake Tahoe sits on the California side. The lake is a major recreation destination and tourist area for both states."

  - id: hoover-dam
    icon: "fa-solid fa-water-ladder"
    title: "Hoover Dam: Engineering Marvel on the Border"
    paragraphs:
      - "Hoover Dam sits on the Nevada-Arizona border in the Colorado River, creating Lake Mead, one of the largest artificial reservoirs in the United States. Completed in 1936, the dam stands 726 feet high and spans 1,244 feet across the Black Canyon. The dam provides hydroelectric power to Nevada, Arizona, and California, and supplies water to millions of people in the Southwest. The border between Nevada and Arizona runs through the middle of the dam—visitors can literally stand in both states simultaneously on the dam's crest. Lake Mead, the reservoir behind the dam, forms much of the Nevada-Arizona border and is a major recreation area."

  - id: driest-state
    icon: "fa-solid fa-sun"
    title: "Driest State in the Nation"
    paragraphs:
      - "Nevada is the driest state in the United States, receiving an average of only about 9 inches of precipitation per year. This extreme aridity shapes Nevada's borders and landscape. Most of Nevada lies within the Great Basin, a vast region of interior drainage where water doesn't flow to the ocean. The state's borders run through some of the most arid desert terrain in North America, including parts of the Mojave Desert in the south and the Great Basin Desert throughout much of the state. Despite the dry climate, the Colorado River along the Arizona border and Lake Tahoe on the California border provide crucial water resources."

