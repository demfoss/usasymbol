intro_text: "Nebraska borders six states: South Dakota to the north, Iowa and Missouri to the east, Kansas to the south, and Colorado and Wyoming to the west. The Missouri River forms Nebraska's entire eastern border with Iowa and Missouri. Nebraska is located in the heart of the Great Plains."

