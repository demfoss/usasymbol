faq:
  - question: "What borders Nebraska?"
    answer: "Nebraska borders six states. South Dakota borders to the north, Iowa and Missouri to the east (across the Missouri River), Kansas to the south, and Colorado and Wyoming to the west."
  - question: "What state borders Nebraska?"
    answer: "Six states border Nebraska: South Dakota (north), Iowa (east), Missouri (southeast), Kansas (south), Colorado (southwest), and Wyoming (west)."
  - question: "Which state borders Nebraska to the south?"
    answer: "Kansas borders Nebraska to the south along the 40th parallel north latitude for about 210 miles."
  - question: "What river borders Iowa and Nebraska?"
    answer: "The Missouri River forms the entire border between Iowa and Nebraska, running for about 300 miles from South Dakota to Missouri."
  - question: "What river borders Nebraska and Iowa?"
    answer: "The Missouri River separates Nebraska and Iowa along their entire shared border of approximately 300 miles."
  - question: "How many states border Nebraska?"
    answer: "Six states border Nebraska, making it tied with Arkansas, Kentucky, and Pennsylvania for the second-most state borders in the U.S."
  - question: "Is Nebraska landlocked?"
    answer: "Yes, Nebraska is landlocked. It has no ocean or Great Lakes coastline and is surrounded entirely by six other states."

