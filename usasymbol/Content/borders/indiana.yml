    facts:
      - "Indiana borders exactly four U.S. states"
      - "Lake Michigan is the only Great Lake that borders Indiana"
      - "The Ohio River forms Indiana's entire 345-mile southern border"
      - "Indiana has the shortest Great Lakes coastline at about 45 miles"
      - "The Wabash River forms about 200 miles of border with Illinois"
      - "Indiana is not landlocked because it borders Lake Michigan"
      - "Nearly half of Indiana's borders are formed by rivers"

faq:
  - question: "What state borders Indiana?"
    answer: "Four states border Indiana: Michigan (north), Ohio (east), Kentucky (south), and Illinois (west)."
  - question: "What borders Indiana?"
    answer: "Indiana borders four states and Lake Michigan. Michigan borders to the north, Ohio to the east, Kentucky to the south, Illinois to the west, and Lake Michigan to the northwest."
  - question: "What state borders Indiana to the north?"
    answer: "Michigan borders Indiana to the north along a roughly straight line running about 120 miles from Ohio to Illinois and Lake Michigan."
  - question: "What state borders Indiana to the east?"
    answer: "Ohio borders Indiana to the east along a relatively straight north-south line running about 175 miles from Michigan to Kentucky."
  - question: "What state borders Indiana to the south?"
    answer: "Kentucky borders Indiana to the south. The entire border is formed by the Ohio River, running for about 345 miles."
  - question: "What state borders Indiana to the west?"
    answer: "Illinois borders Indiana to the west. The Wabash River forms the southern portion of this boundary for about 200 miles."
  - question: "What great lake borders Indiana?"
    answer: "Lake Michigan is the only Great Lake that borders Indiana. The lake provides about 45 miles of coastline along Indiana's northwestern corner, the shortest Great Lakes coastline of any state."
  - question: "What river borders Indiana and Kentucky?"
    answer: "The Ohio River forms the entire border between Indiana and Kentucky, running for about 345 miles along Indiana's southern edge."
  - question: "What state borders Ohio and Indiana to the south?"
    answer: "Kentucky borders both Ohio and Indiana to the south. The Ohio River forms the border between Kentucky and both of these northern states."

