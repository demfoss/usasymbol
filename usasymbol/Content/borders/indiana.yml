seo_title: "Indiana Borders | 4 States, Lake Michigan & Ohio River"
seo_description: "Indiana borders 4 states: Michigan, Ohio, Kentucky, Illinois. Lake Michigan touches the northwest corner. Ohio River forms the entire 345-mile southern edge with Kentucky."

intro_text: "Indiana borders four states: Michigan to the north, Ohio to the east, Kentucky to the south, and Illinois to the west. The state also meets Lake Michigan along its northwestern shore. The Ohio River forms Indiana's entire southern border with Kentucky, while the Wabash River creates much of the western boundary with Illinois."

