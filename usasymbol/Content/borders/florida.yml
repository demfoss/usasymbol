intro_text: "Florida borders only two states: Georgia to the north and Alabama to the northwest. The state is surrounded by water on three sides—the Atlantic Ocean to the east, the Gulf of Mexico to the west, and the Florida Straits to the south. Florida has more coastline than any other state in the contiguous United States."

