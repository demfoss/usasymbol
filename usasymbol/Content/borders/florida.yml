faq:
  - question: "What borders Florida?"
    answer: "Florida borders two states and three bodies of water. Georgia borders to the north, Alabama to the northwest, the Atlantic Ocean to the east, the Gulf of Mexico to the west, and the Florida Straits to the south."
  - question: "What state borders Florida?"
    answer: "Two states border Florida: Georgia (north) and Alabama (northwest)."
  - question: "What ocean borders Florida?"
    answer: "The Atlantic Ocean borders Florida's eastern coast. Florida is also bordered by the Gulf of Mexico on its western coast, though the Gulf is technically a marginal sea of the Atlantic Ocean."
  - question: "What ocean borders Florida on three sides?"
    answer: "Florida is bordered by water on three sides, but not by a single ocean. The Atlantic Ocean borders the east, the Gulf of Mexico borders the west, and the Florida Straits lie to the south. Together, these water bodies surround Florida on three sides."
  - question: "What body of water borders Florida?"
    answer: "Three major bodies of water border Florida: the Atlantic Ocean to the east, the Gulf of Mexico to the west, and the Florida Straits to the south."
  - question: "What body of water borders Florida on the east?"
    answer: "The Atlantic Ocean borders Florida on the east, providing approximately 580 miles of coastline."
  - question: "What borders Florida to the south?"
    answer: "The Florida Straits border Florida to the south, separating the state from Cuba by about 90 miles at the narrowest point."
  - question: "How much coastline does Florida have?"
    answer: "Florida has approximately 1,350 miles of coastline, making it the state with the most coastline in the contiguous United States. This includes about 580 miles along the Atlantic Ocean and 770 miles along the Gulf of Mexico."

  - question: "Does Florida get snow?"
    answer: "Almost never. Florida averages fewer than 1 snow day per year — the lowest of any U.S. state. See the full [ranking of states that get no snow](/rankings/geography/states-with-no-snow)."
