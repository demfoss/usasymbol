      - "The Cumberland Gap sits on Kentucky's border with Virginia"

faq:
  - question: "What borders Kentucky?"
    answer: "Kentucky borders seven states. Illinois, Indiana, and Ohio border to the north (across the Ohio River), West Virginia and Virginia to the east, Tennessee to the south, and Missouri to the west (across the Mississippi River)."
  - question: "What state borders Kentucky?"
    answer: "Seven states border Kentucky: Illinois, Indiana, Ohio, West Virginia, Virginia, Tennessee, and Missouri."
  - question: "How many states border Kentucky?"
    answer: "Seven states border Kentucky, making it tied with Colorado, Missouri, and Tennessee for the most state borders in the United States."
  - question: "What river borders Indiana and Kentucky?"
    answer: "The Ohio River forms the entire border between Indiana and Kentucky, running for about 345 miles. Major cities on this border include Louisville, Kentucky and Evansville and New Albany in Indiana."
  - question: "What river borders Kentucky and Indiana?"
    answer: "The Ohio River separates Kentucky and Indiana along their entire shared border of approximately 345 miles."
  - question: "What river borders Illinois and Kentucky?"
    answer: "The Ohio River forms the entire border between Illinois and Kentucky, running for about 135 miles in Kentucky's northwestern corner."
  - question: "What river borders Ohio and Kentucky?"
    answer: "The Ohio River forms the entire border between Ohio and Kentucky, running for about 180 miles. Cincinnati, Ohio sits directly across from Covington and Newport, Kentucky."
  - question: "What river borders Louisville, Kentucky?"
    answer: "The Ohio River borders Louisville, Kentucky. The city sits on the southern bank of the Ohio River, which forms the border between Kentucky and Indiana at this point."
  - question: "What Kentucky city borders Cincinnati?"
    answer: "Covington and Newport are the two main Kentucky cities that border Cincinnati, Ohio. Both sit directly across the Ohio River from Cincinnati."

