seo_title: "Georgia Borders: What States and Ocean Border Georgia?"
seo_description: "Georgia borders 5 states (Florida, Alabama, Tennessee, North Carolina, South Carolina) and the Atlantic Ocean. See complete border breakdown with rivers."

intro_text: "Georgia borders five states: Florida to the south, Alabama to the west, Tennessee and North Carolina to the north, and South Carolina to the east. The state also meets the Atlantic Ocean along its southeastern coast. The Savannah River forms most of Georgia's border with South Carolina, while the Chattahoochee River creates part of the boundary with Alabama."

