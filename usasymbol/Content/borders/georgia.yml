    facts:
      - "Georgia borders exactly five U.S. states"
      - "Three major rivers form Georgia's state borders"
      - "The entire Georgia-South Carolina border follows the Savannah River"
      - "The Tennessee border is Georgia's shortest at about 40 miles"
      - "Georgia has about 100 miles of Atlantic Ocean coastline"
      - "The Chattahoochee River creates one of the longest river borders in the U.S."

faq:
  - question: "What borders Georgia?"
    answer: "Georgia borders five states and the Atlantic Ocean. Florida borders to the south, Alabama to the west, Tennessee and North Carolina to the north, South Carolina to the east, and the Atlantic Ocean to the southeast."
  - question: "What state borders Georgia?"
    answer: "Five states border Georgia: Florida (south), Alabama (west), Tennessee (north), North Carolina (north), and South Carolina (east)."
  - question: "What state borders Georgia to the west?"
    answer: "Alabama borders Georgia to the west. The Chattahoochee River forms most of this boundary for about 285 miles."
  - question: "What ocean borders Georgia?"
    answer: "The Atlantic Ocean borders Georgia along its southeastern coast, providing about 100 miles of coastline."
  - question: "Which body of water borders Georgia?"
    answer: "Four major bodies of water border Georgia: the Atlantic Ocean to the southeast, the Savannah River to the east (forming the entire border with South Carolina), the Chattahoochee River to the west (forming most of the border with Alabama), and the St. Marys River to the south (forming part of the border with Florida)."
  - question: "What river borders Georgia and South Carolina?"
    answer: "The Savannah River forms the entire border between Georgia and South Carolina, running for about 250 miles from North Carolina to the Atlantic Ocean."
  - question: "What river borders Georgia and Alabama?"
    answer: "The Chattahoochee River forms most of the border between Georgia and Alabama, creating one of the longest river boundaries between two U.S. states."
  - question: "What country borders Georgia?"
    answer: "No country borders the state of Georgia in the United States. Georgia is bordered only by other U.S. states and the Atlantic Ocean. (Note: There is a country named Georgia in the Caucasus region that borders Russia, Turkey, Armenia, and Azerbaijan, but this is a different Georgia.)"

