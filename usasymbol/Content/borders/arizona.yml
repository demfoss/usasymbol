faq:
  - question: "What borders Arizona?"
    answer: "Arizona borders five U.S. states and Mexico. Utah borders to the north, Colorado at the Four Corners point in the northeast, New Mexico to the east, Mexico to the south, California to the west (across the Colorado River), and Nevada to the northwest (across the Colorado River)."
  - question: "What state borders Arizona?"
    answer: "Five states border Arizona: Utah (north), Colorado (northeast at Four Corners point), New Mexico (east), Nevada (northwest), and California (west)."
  - question: "What state borders Arizona on the east?"
    answer: "New Mexico borders Arizona on the east, running about 390 miles along the 109th meridian from the Four Corners to Mexico."
  - question: "What state borders Arizona on the north?"
    answer: "Utah borders Arizona on the north, running about 275 miles along the 37th parallel from Nevada to the Four Corners point."
  - question: "What country borders Arizona?"
    answer: "Mexico borders Arizona to the south. The international border runs about 370 miles along the 31st parallel, entirely with the Mexican state of Sonora."
  - question: "What Mexican state borders Arizona?"
    answer: "Sonora is the Mexican state that borders Arizona along the entire 370-mile southern border."
  - question: "What river borders Arizona and California?"
    answer: "The Colorado River forms the entire border between Arizona and California, running for about 240 miles from Nevada to Mexico."
  - question: "What river borders California and Arizona?"
    answer: "The Colorado River separates California and Arizona along their entire shared border of approximately 240 miles."
  - question: "What ocean borders Arizona?"
    answer: "No ocean borders Arizona. Arizona is landlocked and surrounded by other states and Mexico, with no coastline."
  - question: "Is Arizona landlocked?"
    answer: "Yes, Arizona is landlocked. It has no ocean or Great Lakes coastline and is surrounded by five states and Mexico."

