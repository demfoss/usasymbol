seo_title: "Arizona Borders: 5 States, Mexico & Colorado River"
seo_description: "Arizona borders 5 states (Utah, New Mexico, Nevada, California; Colorado at Four Corners) and Mexico (Sonora). The Colorado River forms the entire western edge."

intro_text: "Arizona borders five U.S. states: Utah to the north, Colorado to the northeast at the Four Corners point, New Mexico to the east, Nevada to the northwest, and California to the west. The state also shares an international border with Mexico to the south. The Colorado River forms Arizona's entire western border with Nevada and California."

