intro_text: "Delaware borders three states: Pennsylvania to the north, Maryland to the west and south, and New Jersey to the east across the Delaware River and Delaware Bay. The state also meets the Atlantic Ocean along its southeastern coast. Its northern border with Pennsylvania follows the Twelve-Mile Circle, a rare circular border arc."

