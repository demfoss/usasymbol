seo_title: "Virginia Borders | 5 States, Potomac River & Atlantic"
seo_description: "Virginia borders Maryland, West Virginia, Kentucky, Tennessee, and North Carolina. The Potomac, Chesapeake Bay, and Atlantic shape its edges."

intro_text: "Virginia borders five states: Maryland to the north, West Virginia to the northwest and west, Kentucky to the southwest, Tennessee to the south, and North Carolina to the south. The Atlantic Ocean forms Virginia's eastern coastline. The Potomac River creates much of the northern border with Maryland, while Chesapeake Bay divides Virginia's mainland from the Eastern Shore peninsula."

