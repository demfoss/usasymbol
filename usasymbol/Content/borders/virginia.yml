faq:
  - question: "What states border Virginia?"
    answer: "Five states border Virginia: Maryland (north), West Virginia (northwest and west), Kentucky (southwest), Tennessee (south), and North Carolina (south)."
  
  - question: "What borders Virginia?"
    answer: "Virginia borders five states, the Atlantic Ocean, and Chesapeake Bay. Maryland borders to the north across the Potomac River, West Virginia to the northwest and west, Kentucky to the southwest, Tennessee to the south, North Carolina to the south, and the Atlantic Ocean to the east. Chesapeake Bay divides the state."
  
  - question: "What ocean borders Virginia?"
    answer: "The Atlantic Ocean borders Virginia along its eastern coast, providing about 112 miles of coastline including the Eastern Shore peninsula and the Hampton Roads region."
  
  - question: "What state borders Virginia to the north?"
    answer: "Maryland borders Virginia to the north. The Potomac River forms most of this boundary for about 200 miles, with Washington, D.C. sitting on the Maryland side between the two states."
  
  - question: "What state borders Virginia to the west?"
    answer: "West Virginia borders Virginia to the west and northwest. This 380-mile border runs through the Appalachian Mountains. West Virginia separated from Virginia in 1863 during the Civil War."
  
  - question: "What river borders Maryland and Virginia?"
    answer: "The Potomac River borders Maryland and Virginia, forming about 200 miles of the northern boundary between the states. The river flows from West Virginia through Maryland and Virginia before emptying into Chesapeake Bay."
  
  - question: "What body of water borders Virginia?"
    answer: "Several bodies of water border Virginia: the Atlantic Ocean along the eastern coast, Chesapeake Bay (which divides Virginia into mainland and Eastern Shore), and the Potomac River (forming the Maryland border). Other rivers like the James, York, and Rappahannock flow through Virginia into Chesapeake Bay."
  
  - question: "Which states share borders with Virginia?"
    answer: "Five states share borders with Virginia: Maryland, West Virginia, Kentucky, Tennessee, and North Carolina. West Virginia borders Virginia on two sides (northwest and west) due to its separation from Virginia during the Civil War."

