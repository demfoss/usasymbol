    facts:
      - "Missouri borders exactly eight U.S. states—tied for most in the nation"
      - "The Mississippi River forms Missouri's entire 385-mile eastern border"
      - "The Kentucky border is Missouri's shortest at about 25 miles"
      - "Missouri is landlocked with no ocean or Great Lakes coastline"
      - "The Missouri Bootheel creates borders with Tennessee and extended Arkansas border"
      - "Kansas City exists in both Missouri and Kansas"
      - "Missouri is at the confluence of the Mississippi and Missouri Rivers"

faq:
  - question: "What borders Missouri?"
    answer: "Missouri borders eight states. Iowa borders to the north, Illinois, Kentucky, and Tennessee to the east, Arkansas to the south, Oklahoma to the southwest, Kansas to the west, and Nebraska to the northwest."
  - question: "What state borders Missouri?"
    answer: "Eight states border Missouri: Iowa, Illinois, Kentucky, Tennessee, Arkansas, Oklahoma, Kansas, and Nebraska."
  - question: "How many states border Missouri?"
    answer: "Eight states border Missouri, making it tied with Tennessee for the most state borders in the United States."
  - question: "What state borders Missouri to the north?"
    answer: "Iowa borders Missouri to the north along a relatively straight line running about 310 miles from Nebraska to Illinois."
  - question: "What state borders Missouri to the east?"
    answer: "Illinois borders most of Missouri to the east across the Mississippi River. Kentucky also borders Missouri to the east for a short section (about 25 miles) in the Bootheel region."
  - question: "What state borders Missouri to the south?"
    answer: "Arkansas borders Missouri to the south along the 36°30' parallel (the Missouri Compromise line) for about 310 miles. Tennessee also borders Missouri in the southeast corner in the Bootheel region."
  - question: "What state borders Missouri to the west?"
    answer: "Kansas borders most of Missouri to the west for about 270 miles. Nebraska also borders Missouri in the northwest corner for about 125 miles."
  - question: "What state borders both Wyoming and Missouri?"
    answer: "Nebraska and Kansas both border Wyoming (to the east) and Missouri (to the west). Colorado also borders both states but is positioned between them."
  - question: "What state borders both New Mexico and Missouri?"
    answer: "Oklahoma borders both New Mexico (to the west of Oklahoma) and Missouri (to the northeast of Oklahoma)."

