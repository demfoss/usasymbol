seo_title: "South Dakota Borders: What States Border South Dakota?"
seo_description: "South Dakota borders 6 states (North Dakota, Minnesota, Iowa, Nebraska, Wyoming, Montana). Landlocked state divided by Missouri River. See complete border guide."

intro_text: "South Dakota borders six states: North Dakota to the north, Minnesota to the east, Iowa to the southeast, Nebraska to the south, Wyoming to the west, and Montana to the northwest. South Dakota is landlocked with no ocean or Great Lakes access. The Missouri River flows through the center of the state, historically dividing it into East River and West River regions."

