faq:
  - question: "What states border South Dakota?"
    answer: "Six states border South Dakota: North Dakota (north), Minnesota (east), Iowa (southeast), Nebraska (south), Wyoming (west), and Montana (northwest)."
  
  - question: "What borders South Dakota?"
    answer: "South Dakota borders six states. North Dakota borders to the north, Minnesota to the east, Iowa to the southeast, Nebraska to the south, Wyoming to the west, and Montana to the northwest. South Dakota has no ocean, Great Lakes, or international borders."
  
  - question: "What state borders South Dakota to the north?"
    answer: "North Dakota borders South Dakota to the north. This boundary follows the 46th parallel north latitude for about 360 miles, creating a straight east-west line across the northern prairie."
  
  - question: "What state borders South Dakota to the south?"
    answer: "Nebraska borders South Dakota to the south. The Missouri River forms about 350 miles of this border in the eastern section, while a straight surveyed line continues in the west for a total of about 425 miles."
  
  - question: "Which state borders South Dakota to the south?"
    answer: "Nebraska is the only state that borders South Dakota to the south. The boundary includes the Missouri River in the east and a surveyed line in the west."
  
  - question: "What state borders South Dakota to the southwest?"
    answer: "Wyoming borders South Dakota to the southwest and west. This straight north-south border runs for about 355 miles and passes near the Black Hills, including Mount Rushmore."
  
  - question: "What state borders Canada and South Dakota?"
    answer: "No state borders both Canada and South Dakota. North Dakota sits between South Dakota and Canada—it borders Canada to its north and South Dakota to its south, but South Dakota itself does not touch the Canadian border. The closest South Dakota gets to Canada is the North Dakota border, which is about 200 miles south of the U.S.-Canada border."
  
  - question: "How many states border South Dakota?"
    answer: "Six states border South Dakota: North Dakota, Minnesota, Iowa, Nebraska, Wyoming, and Montana. This makes South Dakota one of the states with more neighbors, tied with several other states for having six bordering states."

