faq:
  - question: "What states border South Carolina?"
    answer: "Two states border South Carolina: North Carolina (north) and Georgia (southwest and west)."
  
  - question: "What borders South Carolina?"
    answer: "South Carolina borders two states and the Atlantic Ocean. North Carolina borders to the north, Georgia to the southwest (across the Savannah River), and the Atlantic Ocean to the southeast."
  
  - question: "What ocean borders South Carolina?"
    answer: "The Atlantic Ocean borders South Carolina along its southeastern coast, providing about 187 miles of coastline including beaches, historic ports, and the Sea Islands."
  
  - question: "What state borders South Carolina on the north?"
    answer: "North Carolina borders South Carolina on the north. This boundary runs about 335 miles from the Atlantic Ocean to Georgia along surveyed lines established in the 1700s and 1800s."
  
  - question: "What river borders Georgia and South Carolina?"
    answer: "The Savannah River borders Georgia and South Carolina. This river forms nearly the entire boundary between the states, flowing about 250 miles from the mountains to the Atlantic Ocean."
  
  - question: "What city borders North and South Carolina?"
    answer: "Rock Hill, South Carolina sits very close to the North Carolina border, and Charlotte, North Carolina is just across the state line, making this the major urban area spanning the border. The two cities are about 25 miles apart and form a connected metropolitan region."
  
  - question: "What city borders Georgia and South Carolina?"
    answer: "Augusta, Georgia sits on the Savannah River directly across from South Carolina, with North Augusta and Aiken on the South Carolina side. Near the coast, Savannah, Georgia is just across the Savannah River from South Carolina."
  
  - question: "How many states border South Carolina?"
    answer: "Two states border South Carolina: North Carolina and Georgia. This makes South Carolina one of the states with fewer neighbors in the United States."

