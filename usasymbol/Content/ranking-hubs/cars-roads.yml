h1: "Cars, Roads and Driving by State"
seo_title: "Cars and Roads by State | Gas, Taxes, Commutes & Safety"
seo_description: "Compare vehicle taxes, gas prices, road quality, commutes, traffic deaths, and car costs in every state, with maps and full tables."
intro:
  - "Owning a car costs very different amounts from state to state. Twenty-one states charge an annual property tax on vehicles, Pennsylvania has the highest gas tax at 57.6 cents a gallon, and full-coverage insurance averages $4,535 a year in New York."
  - "The roads differ too. New Hampshire has the best roads in the country and Hawaii the worst. New Yorkers face the longest commute at 33.5 minutes, while South Dakotans get to work in 17.3."
  - "These pages cover the costs, the roads, and the safety record of driving in every state. For speed limits, seatbelts, and other traffic rules, see the Driving Laws hub."
