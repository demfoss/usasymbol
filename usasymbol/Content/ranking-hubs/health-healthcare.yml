h1: "Health and Healthcare by State"
seo_title: "Health Rankings by State | Life Expectancy, Costs & Care"
seo_description: "Compare life expectancy, obesity, healthcare quality, medical costs, and access to care in every state, with maps and full tables."
intro:
  - "Where you live changes how long you are likely to live. Hawaii has the longest life expectancy at 81.6 years, while Mississippi has the lowest at 71.9. Hawaii also leads the country in healthcare quality."
  - "Costs vary just as much. A basic ambulance ride averages $2,473 in Hawaii and $1,266 in Alabama, and a month of assisted living runs from $7,885 in Vermont to $3,983 in Louisiana."
  - "These pages compare health outcomes, habits, and the price and supply of care across all fifty states. Start with life expectancy and healthcare quality, then look at the costs that matter for your family."
