tag: "Livestock & Dairy"
category: agriculture
h1: "Livestock and Dairy Production by State"
seo_title: "Livestock and Dairy Production by State | Beef, Milk & Eggs"
seo_description: "See which states lead in beef, milk, chickens, eggs, hogs, cheese, and honey, with maps and full state tables for each animal product."
intro:
  - "Animal farming has clear capitals. Texas leads the country in beef with 12.2 million cattle, Georgia raises the most chickens, and Iowa leads in both eggs and hogs, producing about 35% of the hogs tracked by USDA."
  - "Dairy has two giants. California produces the most milk and Wisconsin ranks second. Separate pages rank the states for cheese, butter, yogurt, and ice cream."
  - "Each page ranks the states for one animal or product and shows the result on a map. The list also covers smaller herds, from goats and sheep to bison, horses, and honeybees."
