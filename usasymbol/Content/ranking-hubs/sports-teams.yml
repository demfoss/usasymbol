h1: "Sports Teams by State"
seo_title: "Sports Teams by State | NFL, NBA, MLB, NHL & College"
seo_description: "See which states have NFL, NBA, MLB, NHL, MLS, and WNBA teams, the most popular sport in each state, and college and Olympic records."
intro:
  - "Pro teams cluster in a few big states. California has the most MLB, NBA, MLS, and WNBA teams, and it shares the NFL lead with Florida and New York at three teams each. Twenty-four states have no Big 4 team at all."
  - "Fans in those states pick teams by geography, TV markets, and history, and college sports often fill the gap. Alabama has 14 college football national championships, and Nebraska draws the biggest crowds, 86,896 fans per game."
  - "These pages cover pro leagues, college titles, and the most popular sport in each state. Start with the leagues below or find out who your state really roots for."
