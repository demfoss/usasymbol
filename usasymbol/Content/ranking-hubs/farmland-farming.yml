h1: "Farms and Farmland by State"
seo_title: "Farms and Farmland by State | Land, Value & Farmers"
seo_description: "Compare farms, farmland acres, land value per acre, organic farms, and the average age of farmers in every state, with maps and tables."
intro:
  - "Texas has the most farms in the country, 231,000, and the most farmland, 125.5 million acres. Nebraska has the highest share of its land in farms, at 89.4%."
  - "Land is worth very different amounts from state to state. Farm real estate in Rhode Island averages $23,600 per acre, while in New Mexico it averages $735."
  - "These pages also look at who farms and how. California leads in certified organic farms, and Hawaii's farmers are the oldest in the nation, with an average age of 60.8 in 2022."
