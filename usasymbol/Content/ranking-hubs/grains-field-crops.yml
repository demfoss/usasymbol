h1: "Grain and Field Crop Production by State"
seo_title: "Corn, Wheat & Soybean Production by State"
seo_description: "See which states grow the most corn, wheat, soybeans, rice, cotton, and other field crops, with maps and full state-by-state tables."
intro:
  - "Field crops cover more American farmland than anything else, and each one has its own home ground. Iowa grows the most corn, Illinois the most soybeans, and Kansas the most wheat."
  - "Further south the crops change. Arkansas produced 44.64% of the nation's rice in 2024, and Texas grows nearly 40% of the country's cotton."
  - "These pages rank every state that reports each crop, from the big commodities to smaller ones like sunflowers, lentils, and hops. Start with corn, soybeans, and wheat, the three crops that shape the Farm Belt."
