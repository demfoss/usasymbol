tag: "Voting & Elections"
category: government
h1: "Voting and Elections by State"
seo_title: "Voting and Elections by State | Turnout & Electoral Votes"
seo_description: "Compare electoral votes, red and blue states, turnout, voting laws, and election rules in every state, with maps and full tables."
intro:
  - "Midterm season is here. On November 3, 2026, voters fill all 435 U.S. House seats, 35 U.S. Senate seats, and 36 governorships, and the rules for casting those ballots change a lot from one state to the next."
  - "These pages compare how states run elections. Some mail a ballot to every voter, some register people on Election Day, and a few let voters rank candidates or recall an official. Others require photo ID, limit voting after a felony conviction, or draw district lines through an independent commission."
  - "Power is covered as well. See which party holds the governor's office and both legislative chambers in each state, which Senate seats and governorships are up this November, and which states have picked the presidential winner most often since 1960."
  - "The results side is here too. California has the most electoral votes, 54, and in 2024 Minnesota led turnout at 77.4% of eligible voters while Hawaii had the lowest at 47.5%."
