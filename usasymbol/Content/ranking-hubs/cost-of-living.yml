h1: "Cost of Living by State"
seo_title: "Cost of Living by State | Rent, Bills, Groceries & More"
seo_description: "Compare the cost of living in every state, from rent and home values to electric bills, groceries, insurance, and what $100 really buys."
intro:
  - "A dollar does not go equally far everywhere. In Mississippi $100 buys about $116 worth of goods, while in Hawaii it buys about $88. Hawaii has the highest cost of living index, and West Virginia the lowest."
  - "The gap shows up in every bill. Average rent runs from $2,841 a month in Massachusetts to $1,059 in Oklahoma, and the average electric bill from $162.66 in Hawaii to $80.24 in Utah."
  - "These pages break the cost of living into its parts, housing, utilities, food, insurance, and debt, so you can compare any two states line by line."
