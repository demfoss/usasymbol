intro:
  - "Education in the United States is run largely by the states, so school quality, funding, graduation requirements, and even the school calendar vary widely from one state to the next."
  - "These rankings cover public school quality, high school and college graduation rates, SAT and ACT scores, school spending, class size, and teacher salaries, along with the rules that shape schooling, such as homeschool laws and kindergarten start ages."
  - "Start with the overall school rankings, then open a specific measure to see how your state compares."
