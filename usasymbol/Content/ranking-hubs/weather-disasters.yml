h1: "Weather and Natural Disasters by State"
seo_title: "Weather by State | Snow, Heat, Wind, Storms & Disasters"
seo_description: "Compare snowfall, heat, wind, rain, lightning, hurricanes, tornadoes, earthquakes, and wildfires in every state, with maps and tables."
intro:
  - "The weather in America runs from Hawaii, where snow almost never falls, to Vermont, which averages 93.90 inches a year. Florida leads the country in lightning, and South Dakota ranks as the windiest state."
  - "Disasters follow their own maps. Florida has taken 120 direct hurricane hits since 1851, Texas had the most tornadoes in 2024, and Alaska recorded 59,545 earthquakes from 2015 to 2025, more than any other state."
  - "Each page ranks all fifty states with a map and the numbers behind it. Start with snow, heat, and wind, or look up the risks for the state you live in or plan to move to."
