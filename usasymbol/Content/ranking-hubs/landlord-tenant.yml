h1: "Landlord & Tenant Laws by State"
seo_title: "Landlord & Tenant Laws by State | Deposits, Eviction & Rent"
seo_description: "Compare landlord and tenant laws in all 50 states: security deposits, eviction notices, rent increases, entry rules, and abandoned property."
intro:
  - "Landlord and tenant law is written state by state, so the same lease can carry very different rights depending on where the rental sits. States decide how much of a security deposit a landlord may collect, how fast it must be returned, how much notice comes before an eviction or a rent increase, and when a landlord may enter the unit."
  - "These rankings compare all fifty states on each of those rules, from security deposit limits and return deadlines to eviction notice periods, rent increase notice, rental application fees, and landlord entry notice. Related pages cover what happens to belongings a tenant leaves behind and how squatters' rights work."
  - "Open a page below to see every state on one list. Local ordinances and lease terms can add to these rules, so treat each page as a starting point and confirm the current statute for your state."
