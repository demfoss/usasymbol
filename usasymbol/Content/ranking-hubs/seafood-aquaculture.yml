h1: "Seafood and Aquaculture by State"
seo_title: "Seafood Production by State | Lobster, Shrimp & Oysters"
seo_description: "See which states lead in lobster, shrimp, oysters, catfish, crawfish, and trout, from ocean catches to fish farms, with maps and tables."
intro:
  - "Seafood production follows the water. Maine lands the most lobster of any state, worth $739.96 million, and Texas landed more shrimp in 2020 than any other state, ahead of Louisiana."
  - "Farms matter as much as boats. Mississippi leads catfish farming, Washington leads oyster farming, and Louisiana has 97% of the nation's crawfish farms."
  - "Each page ranks the states for one kind of seafood and explains why the leaders sit where they do."
