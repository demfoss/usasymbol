h1: "Population and People by State"
seo_title: "Population by State | People, Age, Height & Migration"
seo_description: "Compare population, density, age, migration, height, happiness, and the most common last names in every state, with maps and tables."
intro:
  - "California has the most people of any state, 39.3 million, and Wyoming the fewest. New Jersey packs 1,304 people into every square mile, while Alaska has just 1.3."
  - "The people differ as well as the numbers. Montana men are the tallest in the country and Hawaii men the shortest. Maine has the oldest median age at 44.8 years and Utah the youngest at 32.0. Smith is the most common last name in 30 states."
  - "These pages track who lives in each state, where people are moving, and what sets each population apart."
