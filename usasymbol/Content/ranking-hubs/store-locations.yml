seo_title: "Store Locations by State | Walmart, Target, Costco & More"
seo_description: "See how many Walmart, Target, Costco, Home Depot, CVS, Dollar General, and bank branches every state has, with maps and tables."
intro:
  - "Texas has 514 Walmart stores and 1,892 Dollar General stores, more of each than any other state. California leads for Target, Costco, Home Depot, and Trader Joe's."
  - "Some chains stay close to home. Pennsylvania has 317 Sheetz locations, Florida and New Jersey lead for Wawa, and Texas has 36 Buc-ee's travel centers."
  - "These pages show where each store and bank chain operates, which states have the most locations, and which have none."
