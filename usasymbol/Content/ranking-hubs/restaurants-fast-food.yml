seo_description: "See where McDonald's, Chick-fil-A, Taco Bell, Starbucks, Waffle House, and other chains operate in every state, with maps and tables."
intro:
  - "Texas has the most McDonald's locations, 1,269, narrowly ahead of California. Alabama has the most fast food restaurants per resident and Vermont the fewest."
  - "Regional chains draw the clearest maps. Whataburger has 780 locations in Texas, Culver's is strongest in Wisconsin, and Georgia has 455 Waffle Houses. Dunkin' wins the Northeast, while Starbucks leads 39 states per resident."
  - "These pages show where each chain operates, how many locations every state has, and which states have none."
