tag: "Crime & Safety"
h1: "Crime & Safety Rankings by State"
seo_title: "Crime & Safety Rankings by State | Safest & Most Dangerous"
seo_description: "Compare crime and safety across all 50 states: crime, murder, robbery, and burglary rates, the safest and most dangerous states, and more."
intro:
  - "Crime looks different depending on what you measure. Overall crime rates, violent crime, property crime, and specific offenses such as murder, robbery, burglary, and fraud can each rank the states in a different order."
  - "These rankings gather the main measures in one place: overall crime and murder rates, the safest and most dangerous states, prison and incarceration data, and pages on scams, cybercrime, and identity theft. Start with a broad ranking for the overall picture, then open a specific crime to see how your state compares."
