h1: "U.S. State Geography Facts"
seo_title: "State Geography Facts | Size, Borders, Capitals & Names"
seo_description: "Compare the states by land area, neighbors, coastline, highest point, capitals, and names, with maps and full tables for every state."
intro:
  - "Some state facts never change, and they are the ones people look up most. Missouri and Tennessee each touch eight other states, while Alaska and Hawaii touch none. Alaska has 6,640 miles of ocean coastline, nearly five times as long as Florida's."
  - "Capitals have their own stories. Santa Fe sits at 7,199 feet, higher than any other state capital, and in 33 states the capital is not the largest city. Even the names can be ranked, from the 13 letters of Massachusetts and both Carolinas to the 4 letters of Iowa, Ohio, and Utah."
  - "Each page covers all fifty states with a map and a full table. Start with neighbors, land area, and capitals, or jump to lakes, mountains, and time zones."
