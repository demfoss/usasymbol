h1: "Outdoors and Recreation by State"
seo_title: "Outdoor Recreation by State | Parks, Fishing, Hunting & More"
seo_description: "Compare national parks, public land, fishing, hunting, golf, skiing, lighthouses, and stargazing in every state, with maps and tables."
intro:
  - "America's outdoors is spread unevenly. Nevada has the highest share of public land at 80.1%, Alaska holds the most national forest land, and California has the most national parks, with nine."
  - "Every state has its own way to get outside. Michigan has 203 lighthouses, Florida about 1,250 golf courses, and Minnesota registers more boats per resident than any other state. Wyoming sells the most hunting licenses per resident."
  - "These pages rank the states for parks, public land, water, and outdoor sports. Use them to plan a trip or to see what your own state does best."
