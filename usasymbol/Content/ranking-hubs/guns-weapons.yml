tag: "Guns & Weapons"
category: law
h1: "Gun & Weapon Laws by State"
seo_title: "Gun & Weapon Laws by State | Carry, Knife & Ammo Rankings"
seo_description: "Compare gun, knife, and weapon laws across all 50 states: concealed carry, stand-your-ground, magazine limits, ammunition rules, and firearm statistics."
intro:
  - "The United States has no single set of weapon laws. Each state decides who may carry a firearm and how, what magazines and ammunition are allowed, when self-defense justifies force, and which knives and other weapons are legal to own."
  - "These rankings compare the states on concealed carry, stand-your-ground and magazine capacity rules, ammunition limits, knife laws, and more unusual questions such as butterfly knives and flamethrowers. Alongside the laws, you will find firearm statistics like gun ownership and gun deaths, so the rules and the data can be read side by side."
  - "Open a page below to see every state on one list. Because rules can change with a permit, a place, or a type of weapon, check the current statute for your state before relying on any single figure."
