seo_description: "Compare marriage age, age of consent, cousin marriage, and family laws by state, plus marriage, divorce, and household statistics."
intro:
  - "Family law is written by the states, which is why the legal age to marry, the age of consent, and the rules around relatives and children are not the same everywhere."
  - "These rankings compare the states on marriage age, age of consent, cousin marriage, alienation of affection claims, and the age a child can be left home alone. Companion pages add the human side of the same subject: marriage and divorce rates, age at first marriage, household size, and how long couples date before getting engaged."
  - "Start with a legal page if you need a specific rule, or with the statistics pages to see how families differ across the country."
