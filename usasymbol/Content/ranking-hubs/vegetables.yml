seo_title: "Vegetable Production by State | Top Growing States"
seo_description: "See which states grow the most potatoes, tomatoes, lettuce, onions, sweet corn, and other vegetables, with maps and full state tables."
intro:
  - "Most vegetables sold in American stores come from just a few states. California produces about 28 times as many tomatoes as Florida, and it grows most of the country's head lettuce, with Arizona the only other state that reports a commercial crop."
  - "The north has its own leaders. Idaho produced 138,380,000 cwt of potatoes in 2024, more than any other state, and Washington grows more onions than California or Oregon."
  - "Each page ranks the states that report the crop and shows the results on a map. Pick a vegetable below to see who grows the most."
