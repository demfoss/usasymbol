h1: "Regions of the United States"
seo_title: "U.S. Regions | Which States Are in Each Region"
seo_description: "See which states make up the Midwest, Northeast, Southeast, Southwest, New England, Appalachia, and the Sun, Snow, Corn, and Bible Belts."
intro:
  - "Americans group their states in many ways, and the lists rarely match. Six states make up New England, while the Southeast has 7 core states and a broader 11-state version. Thirteen states border Canada and four border Mexico."
  - "Some regions are named for what grows or falls there. The Corn Belt centers on Iowa, the Snow Belt covers 16 northern states, and the Sun Belt stretches from Virginia and Florida to Nevada."
  - "Each page lists the states in a region, explains where the borders are disputed, and shows the region on a map."
