  - "These rankings compare the states on marijuana legality, delta-10 THC, recreational drug testing, and cigarette prices, next to public-health data on vaping, methamphetamine use, opioids, and overdose deaths."
  - "Choose a page below to see every state on one list. Drug laws change often, so treat each page as a snapshot and confirm the current rule with your state."
