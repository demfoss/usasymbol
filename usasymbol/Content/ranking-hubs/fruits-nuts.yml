seo_title: "Fruit and Nut Production by State | Top Growing States"
seo_description: "See which states grow the most apples, oranges, grapes, strawberries, almonds, pistachios, and other fruits and nuts, with maps and full tables."
intro:
  - "A handful of states grow most of America's fruit, and California leads almost every list. It produces 5 million tons of grapes a year and grows all of the country's almonds and pistachios tracked by USDA."
  - "Other states own a single crop. Washington produced 66.8% of the nation's apples in 2025, and Florida still ranks second for oranges behind California. Climate decides the map. Citrus and avocados need mild winters, while apples and cherries need cold ones."
  - "Each page ranks every state that reports the crop, with a map and the full table. Start with the big four below, then look up the fruit or nut you want."
