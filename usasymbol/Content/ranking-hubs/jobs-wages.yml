tag: "Jobs & Wages"
category: economy
h1: "Salaries by State"
seo_title: "Salaries by State | Nurse, Teacher, Police & Trade Pay"
seo_description: "Compare pay by state for nurses, teachers, police officers, electricians, and firefighters, plus minimum wage, median income, and unemployment."
intro:
  - "The same job can pay very different money depending on the state. A registered nurse in California averages $133,340 a year, while a nurse in South Dakota averages $64,500. Teachers range from $103,552 in California to $54,975 in Mississippi."
  - "These rankings compare salaries for specific jobs in every state, then add the numbers that decide how far a paycheck goes: minimum wage, median household income, the living wage for a single adult, and unemployment. Each page lists all fifty states, so you can see where your job pays the most and where it pays the least."
  - "Rules matter too. Some states require a license for work that is open to anyone elsewhere, and right-to-work laws and union membership change from one state line to the next. Start with the salary pages, then check the workplace rules for the state you have in mind."
