sections:
  - id: history
    icon: fa-solid fa-landmark
    title: "History of the United States Flag"
    paragraphs:
      - "On June 14, 1777, the Continental Congress resolved that the new national flag would have thirteen alternating red and white stripes and thirteen white stars in a blue field. The resolution called the stars a new constellation but left their shape, spacing, and arrangement unstated. Flagmakers consequently used circles, rows, and other patterns."
      - "Congress added two stars and two stripes after Vermont and Kentucky entered the Union. That fifteen-star, fifteen-stripe flag flew over Fort McHenry in 1814 and inspired Francis Scott Key, but adding a stripe for every new state soon became impractical."
      - "The Flag Act of 1818 restored thirteen stripes and established the lasting rule for expansion. A new star is added on the July 4 following a state's admission, while the stripe count remains fixed."
    subsections:
      - subtitle: "Did Betsy Ross Make the First American Flag?"
        text: "Betsy Ross was a Philadelphia upholsterer who made flags, but no contemporary document proves that she designed or sewed the first Stars and Stripes. Her grandson presented the familiar family story to the Historical Society of Pennsylvania in 1870, nearly a century after the supposed meeting with George Washington."

  - id: symbols
    icon: fa-solid fa-shapes
    title: "United States Flag Meaning and Symbolism"
    style: "symbol-cards"
    symbols:
      - id: stars
        name: "Fifty Stars"
        image: ""
        clip_region: "circle(25% at 24% 25%)"
        paragraphs:
          - "Arranged in nine staggered horizontal rows, the white stars correspond to the fifty states. Alternating rows contain six and five stars."
      - id: stripes
        name: "Thirteen Stripes"
        image: ""
        clip_region: "inset(0 0 0 38%)"
        paragraphs:
          - "Seven red and six white stripes run from hoist to fly. Their total preserves the number of states in the first union."
      - id: union
        name: "Blue Union"
        image: ""
        clip_region: "inset(0 62% 46% 0)"
        paragraphs:
          - "Occupying the upper hoist corner, the blue rectangle is called the union. It keeps the state stars together as one field."

  - id: colors
    icon: fa-solid fa-palette
    title: "Official Colors and Dimensions"
    paragraphs:
      - "Federal specifications use Old Glory Red, white, and Old Glory Blue for government flags. Executive Order 10834 fixes a 10 to 19 ratio and gives exact measurements for the union, stripes, stars, and their spacing."
    colors:
      - name: "Old Glory Red"
        hex: "#B31942"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Old Glory Blue"
        hex: "#0A3161"

  - id: current-design
    icon: fa-solid fa-star
    title: "How the 50-Star Flag Was Standardized"
    paragraphs:
      - "Alaska's admission produced a 49-star flag used for one year beginning July 4, 1959. Hawaii entered the Union that August, triggering another change on the next Independence Day."
      - "President Dwight D. Eisenhower issued the specifications for the 50-star arrangement in 1959. The pattern uses five rows of six stars alternating with four rows of five, creating evenly staggered columns across the union."

  - id: flag-code
    icon: fa-solid fa-book
    title: "What the U.S. Flag Code Says"
    paragraphs:
      - "The Flag Code gives civilians a common guide for displaying and respecting the flag. It covers raising and lowering, processions, placement with other flags, half-staff display, and the position of the union."
      - "Most provisions are customs rather than criminal prohibitions for private citizens. The code says a worn flag should be destroyed in a dignified manner, preferably by burning, which is why veterans' groups often conduct formal retirement ceremonies."

  - id: display-etiquette
    icon: fa-solid fa-building-columns
    title: "Everyday Flag Display Etiquette"
    paragraphs:
      - "When the flag hangs flat against a wall, the union belongs uppermost and to the observer's left. In a row of state flags, the U.S. flag takes the position of honor at its own right, which appears on the audience's left."
      - "A flag displayed outdoors at night should be properly illuminated. During a ceremony, people in uniform follow their service rules, while civilians commonly face the flag and place the right hand over the heart."

  - id: half-staff
    icon: fa-solid fa-arrow-down
    title: "Why the Flag Flies at Half-Staff"
    paragraphs:
      - "Half-staff display marks official periods of mourning. The president orders it for federal buildings and grounds, and governors may order it within their states under circumstances set out in federal law and local practice."
      - "The flag is first raised briskly to the peak and then lowered to the half-staff position. Before it is lowered for the day, it returns briefly to the peak."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "June 14 is observed as Flag Day because the first flag resolution passed on that date."
      - "The longest-serving design is the current 50-star flag."
      - "A union displayed downward is reserved as a signal of dire distress under the Flag Code."
      - "Six flags planted on the Moon had no wind to make them wave."
      - "Nicknames include the Stars and Stripes, Old Glory, and the Star-Spangled Banner."

  - id: previous-versions
    icon: fa-solid fa-flag
    title: "Historical Versions of the Flag"
    versions:
      - name: "Thirteen-Star Flag"
        years: "1777 to 1795"
        image: ""
        description: "Thirteen stars accompanied thirteen stripes, but Congress did not prescribe one star pattern."
      - name: "Star-Spangled Banner"
        years: "1795 to 1818"
        image: ""
        description: "Fifteen stars and fifteen stripes recognized Vermont and Kentucky. This was the design seen at Fort McHenry."
      - name: "Forty-Eight-Star Flag"
        years: "1912 to 1959"
        image: ""
        description: "Six rows of eight stars created the first nationally standardized star arrangement and lasted forty-seven years."
      - name: "Forty-Nine-Star Flag"
        years: "1959 to 1960"
        image: ""
        description: "Alaska's star appeared for a single year before Hawaii's admission required the present version."
      - name: "Fifty-Star Flag"
        years: "1960 to present"
        image: ""
        description: "Nine alternating rows of six and five stars form the design used today."

