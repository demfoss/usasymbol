intro_text: "The United States flag displays **50 white stars** in a blue union and **13 alternating red and white stripes**, a design first established by the Continental Congress in 1777. Congress did not prescribe the first star arrangement, so early flags varied. The current 50-star pattern entered official use on July 4, 1960, after Hawaii joined the Union."
