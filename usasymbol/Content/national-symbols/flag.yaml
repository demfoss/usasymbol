faq:
  - question: "What do the 50 stars on the American flag represent?"
    answer: "Each star corresponds to one state. The current design has fifty stars because the Union has fifty states."
  - question: "Why does the American flag have 13 stripes?"
    answer: "The stripes preserve the number of states in the original union. Seven stripes are red and six are white."
  - question: "When was the American flag adopted?"
    answer: "The Continental Congress adopted the basic stars-and-stripes design on June 14, 1777. The present 50-star version began on July 4, 1960."
  - question: "Who designed the first American flag?"
    answer: "No surviving contemporary record identifies one proven designer. The Betsy Ross account comes from a family story first made public in 1870."
  - question: "When is a new star added to the flag?"
    answer: "A new star is added on the July 4 following a state's admission to the Union. Congress established that rule in 1818."

