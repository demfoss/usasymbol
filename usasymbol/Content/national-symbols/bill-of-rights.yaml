sections:
- id: why-needed
  icon: fa-solid fa-scale-balanced
  title: Why the Bill of Rights Was Added
  paragraphs:
  - The Constitution drafted in 1787 described the powers and structure of the new federal government, but it did not contain a separate list of protected liberties. Antifederalists argued that clearer limits were needed to guard speech, religion, jury trials, and other rights against federal interference.
  - Several state ratifying conventions approved the Constitution while recommending amendments. The promise that the First Congress would consider those proposals helped secure support for the new framework, especially during the closely divided Massachusetts ratification debate.
- id: making
  icon: fa-solid fa-pen-nib
  title: How Congress Wrote the Bill of Rights
  paragraphs:
  - Representative James Madison introduced proposed amendments in the House on June 8, 1789. He drew from state ratification proposals, state declarations of rights, the Virginia Declaration of Rights, and other established sources rather than writing every principle from scratch.
  - The House approved 17 amendments. The Senate revised and combined them, and a conference committee produced 12 articles that Congress sent to the states in September 1789.
- id: freedoms
  icon: fa-solid fa-comments
  title: First, Second, and Third Amendments
  paragraphs:
  - The First Amendment protects the free exercise of religion and bars a federal establishment of religion. It also protects speech, the press, peaceful assembly, and petitions asking the government to address grievances.
  - The Second Amendment addresses the right to keep and bear arms in connection with a well-regulated militia. The Third prohibits quartering soldiers in private homes during peacetime without the owner's consent and requires wartime quartering to follow law.
- id: criminal-procedure
  icon: fa-solid fa-gavel
  title: Fourth Through Eighth Amendments
  paragraphs:
  - The Fourth Amendment guards against unreasonable searches and seizures and sets standards for warrants. The Fifth includes grand-jury protection for serious federal crimes, protection against double jeopardy and compelled self-incrimination, due process, and compensation when private property is taken for public use.
  - The Sixth guarantees core rights in criminal prosecutions, including a speedy and public trial, an impartial jury, notice of the accusation, confrontation of witnesses, compulsory process, and counsel. The Seventh protects jury trial in specified federal civil cases, while the Eighth prohibits excessive bail, excessive fines, and cruel and unusual punishments.
- id: retained-and-reserved
  icon: fa-solid fa-people-group
  title: Ninth and Tenth Amendments
  paragraphs:
  - The Ninth Amendment warns that listing certain rights in the Constitution must not be read to deny other rights retained by the people. It answers the concern that a written list might imply that unlisted rights did not exist.
  - The Tenth Amendment says powers not delegated to the United States, and not prohibited to the states, are reserved to the states or the people. It states a basic principle of American federalism, although disputes about the boundary between federal and state authority continue.
- id: twelve-not-ten
  icon: fa-solid fa-file-circle-question
  title: Why the Original Lists 12 Amendments
  paragraphs:
  - The document displayed by the National Archives contains all 12 articles proposed by Congress. The states ratified Articles Three through Twelve in 1791, so those ten became Amendments One through Ten.
  - The first proposal concerned the size of the House of Representatives and was never ratified. The second delayed congressional pay changes until after an election; it remained pending until 1992, when it became the Twenty-Seventh Amendment.
- id: applies-today
  icon: fa-solid fa-landmark
  title: Bill of Rights Today
  paragraphs:
  - The Bill of Rights originally restrained the federal government, not every state or local action. After the Fourteenth Amendment was ratified in 1868, the Supreme Court gradually held that many Bill of Rights protections also bind state and local governments through a process called incorporation.
  - Constitutional rights are broad rules, not automatic answers to every dispute. Courts examine the amendment's text, history, precedent, and the facts of a case when deciding whether government action crossed a constitutional line.
- id: original-document
  icon: fa-solid fa-vault
  title: Original Bill of Rights Parchment
  paragraphs:
  - Congress prepared one enrolled parchment and 13 handwritten copies. President George Washington sent copies to the 11 states then operating under the Constitution and to North Carolina and Rhode Island, which had not yet ratified it.
  - The federal parchment is displayed in the Rotunda for the Charters of Freedom at the National Archives in Washington, D.C. It is shown with the Declaration of Independence and Constitution under carefully controlled light and environmental conditions.
