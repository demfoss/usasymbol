faq:
- question: How many amendments are in the Bill of Rights?
  answer: The Bill of Rights contains ten amendments. Congress proposed twelve articles in 1789, but the states ratified only Articles Three through Twelve in 1791.
- question: Who wrote the Bill of Rights?
  answer: James Madison prepared the proposals introduced in the House, drawing on recommendations from state conventions and earlier declarations of rights. Congress revised his proposals before sending twelve articles to the states.
- question: What rights does the First Amendment protect?
  answer: It protects religious exercise, speech, the press, peaceful assembly, and petition. It also prohibits a federal law establishing religion.
- question: Why were there originally twelve proposed amendments?
  answer: Congress included two structural proposals before the ten rights amendments. One concerned House representation, and the other concerned congressional pay.
- question: Does the Bill of Rights apply to state governments?
  answer: Many protections apply to state and local governments through the Fourteenth Amendment and Supreme Court decisions. The legal rule is called incorporation, and not every provision has been applied in exactly the same way.
