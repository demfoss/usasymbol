faq:
- question: What is the national mammal of the United States?
  answer: The American bison, also called the North American bison, is the official national mammal.
- question: When did the bison become the national mammal?
  answer: President Barack Obama signed the National Bison Legacy Act on May 9, 2016.
- question: Are bison and buffalo the same animal?
  answer: Americans commonly call bison buffalo, but true buffalo are different animals native to Africa and Asia. The scientific name of the American species is Bison bison.
- question: Why did the United States choose the bison?
  answer: Federal law cites its importance to Indigenous cultures, American history, grassland ecology, conservation, and the national economy.
- question: Where can people see bison today?
  answer: Public herds live in Yellowstone and Grand Teton national parks, several wildlife refuges, state parks, Tribal lands, and other conservation areas.

