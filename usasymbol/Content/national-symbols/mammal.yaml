sections:
- id: answer-fast
  icon: fa-solid fa-paw
  title: National Mammal of the United States
  paragraphs:
  - The American bison is the official national mammal. President Barack Obama signed the National Bison Legacy Act on May 9, 2016. The law calls the animal the North American bison, while scientists use the name <em>Bison bison</em>.
  - The word buffalo remains common in the United States. It appears in place names, songs, and historical records, but the animal is a bison rather than one of the true buffalo species of Africa and Asia.
- id: identification
  icon: fa-solid fa-binoculars
  title: American Bison Identification
  paragraphs:
  - A bison carries most of its mass in the front. It has a broad forehead, short curved horns, a high shoulder hump, a shaggy beard, and a heavy coat over the head and forequarters. Both males and females have horns.
  - Bulls can stand about 6 feet tall at the shoulder and weigh around 2,000 pounds. Their size can be misleading. Bison can run quickly, pivot fast, jump fences, and react suddenly, which is why park visitors must keep a safe distance.
- id: national-designation
  icon: fa-solid fa-landmark
  title: 2016 National Mammal Designation
  paragraphs:
  - The 2016 act lists a detailed case for the designation. It recognizes the bison's presence in Indigenous cultures, its role in American history, its contribution to grassland ecosystems, its image on coins and government seals, and the efforts that saved it from extinction.
  - The law did not make every bison a federal animal or replace the bald eagle. It also states that the new title does not alter herd-management plans, laws, regulations, or policies. National symbolism and day-to-day bison management remain separate.
- id: indigenous-nations
  icon: fa-solid fa-people-group
  title: Bison and Indigenous Nations
  paragraphs:
  - For many Plains nations, bison provided food and materials for clothing, shelter, tools, containers, trade, and ceremony. Those relationships are living traditions, not only chapters in nineteenth-century history.
  - Tribal nations now lead important restoration herds and cultural programs. The InterTribal Buffalo Council works with member tribes to return buffalo to Tribal lands, strengthen food sovereignty, restore prairie relationships, and renew cultural practices.
- id: grassland-engineer
  icon: fa-solid fa-seedling
  title: Bison and Prairie Ecology
  paragraphs:
  - Bison do more than eat grass. Their grazing creates patches of short and tall vegetation. Hooves disturb soil, dung returns nutrients, and wallows form shallow depressions that may collect rainwater and support different plants and animals.
  - Herd movement once connected large areas of grassland. Today's fenced and managed herds cannot reproduce every historic process, but conservation managers still use bison to rebuild habitat patterns that cattle or mowing alone may not create.
- id: collapse
  icon: fa-solid fa-chart-line-down
  title: American Bison Population Decline
  paragraphs:
  - Tens of millions of bison once ranged across much of North America. Commercial hide hunting, expanding settlement, railroad access, habitat conversion, and government policies drove a rapid nineteenth-century slaughter. The destruction also attacked the independence and food systems of Plains tribes.
  - By the late 1800s, only a few hundred wild bison remained. Small surviving groups, including the Yellowstone herd and animals protected by private ranchers and conservationists, became foundations for later recovery.
- id: recovery
  icon: fa-solid fa-arrow-trend-up
  title: American Bison Recovery
  paragraphs:
  - Conservation breeding prevented extinction, and bison now number in the hundreds of thousands across North America. Most live in commercial herds rather than in large, free-ranging conservation populations.
  - Public, Tribal, nonprofit, and private conservation herds differ in ancestry, size, fencing, cattle-gene history, disease management, and ecological purpose. A larger total population therefore does not mean the historic Great Plains system has been fully restored.
- id: yellowstone
  icon: fa-solid fa-mountain-sun
  title: Yellowstone Bison Herd
  paragraphs:
  - Yellowstone National Park protects the only place in the contiguous United States where wild bison have lived continuously since prehistoric times. The current herd descends partly from the small wild group that survived the nineteenth-century slaughter inside the park.
  - Yellowstone bison move across a large landscape, face predators, and respond to winter weather and forage. Their movement beyond park boundaries can create difficult questions involving roads, private property, hunting, livestock disease, and agreements with neighboring governments and tribes.
- id: size-and-speed
  icon: fa-solid fa-gauge-high
  title: American Bison Size and Speed
  paragraphs:
  - The shoulder hump is supported by long vertebrae and strong muscles that help a bison swing its head through deep snow. Its dense winter coat provides insulation, then sheds in ragged patches as warmer weather returns.
  - Calves are born with orange-red coats and are often nicknamed red dogs. Adults may look slow while grazing, but they can run up to about 35 miles per hour. Park guidance warns visitors never to approach them for a photograph.
- id: symbols-and-coins
  icon: fa-solid fa-coins
  title: Bison as an American Symbol
  paragraphs:
  - The bison was already a familiar public image before it received the national-mammal title. It appeared on the Buffalo nickel from 1913 to 1938, on the modern National Park Service arrowhead, and on the seal of the Department of the Interior. It now sits alongside the other [national symbols](/national-symbols) recognized in federal law and public tradition.
  - Those images connect the animal with wildlife, western landscapes, and conservation. The 2016 law gathered those established associations into an official title while also naming the bison's importance to Native Americans.

