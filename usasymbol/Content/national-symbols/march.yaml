intro_text: "The official national march of the United States is **The Stars and Stripes Forever**, composed by John Philip Sousa in 1896 and designated by Congress in 1987. Its final strain layers a bright piccolo obbligato over a broad trio melody and a forceful brass countermelody, creating one of the most recognizable endings in concert-band music."

