faq:
  - question: "What is the national march of the United States?"
    answer: "The national march is John Philip Sousa's The Stars and Stripes Forever. Congress designated it in 1987."
  - question: "Who wrote The Stars and Stripes Forever?"
    answer: "John Philip Sousa composed it in 1896. He also wrote patriotic words for the trio, although performances are normally instrumental."
  - question: "When was The Stars and Stripes Forever first performed?"
    answer: "The Sousa Band premiered it on May 14, 1897, at the Academy of Music in Philadelphia."
  - question: "What instrument plays the famous solo?"
    answer: "The piccolo plays the rapid obbligato above the trio melody. Bands may use one player or a piccolo section."
  - question: "When did it become the official national march?"
    answer: "President Ronald Reagan signed the designation on December 11, 1987. Congress made the march official in 1987."

