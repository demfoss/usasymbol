sections:
  - id: overview
    icon: fa-solid fa-music
    title: "United States National March"
    paragraphs:
      - "Federal law names The Stars and Stripes Forever as the national march. It is not the national anthem and does not replace The Star-Spangled Banner at ceremonies where an anthem is called for."
      - "The designation honors both a particular composition and the American concert-band tradition Sousa helped build. Brass, woodwinds, and percussion carry the piece without requiring a singer."

  - id: composition-story
    icon: fa-solid fa-ship
    title: "How Sousa Composed The Stars and Stripes Forever"
    paragraphs:
      - "Sousa was returning by ship from Europe in late 1896 when he learned that David Blakely, the manager of the Sousa Band, had died. He later recalled that the march began sounding in his mind during the ocean crossing, even though he had no instrument available."
      - "Back in the United States, Sousa committed the imagined music to paper and completed the score on Christmas Day. The piece emerged from a difficult homecoming rather than from a commission for a parade or government ceremony."
      - "The Sousa Band introduced the march at the Academy of Music in Philadelphia on May 14, 1897. It quickly became a regular encore and remained closely identified with its composer."

  - id: musical-structure
    icon: fa-solid fa-wave-square
    title: "How the March Is Built"
    paragraphs:
      - "A short, brilliant introduction leads to two contrasting opening strains. Each presents compact melodic material before the music moves into the trio, where the key changes and the texture becomes broader and more lyrical."
      - "A loud break strain interrupts that trio with a contest between low brass and the rest of the band. When the trio returns, the piccolo adds a rapid obbligato above the original melody."
      - "The final grandioso adds a second countermelody in the brass while the piccolo continues overhead. Three independent ideas remain audible at once, which makes the ending exciting without simply becoming louder."

  - id: piccolo
    icon: fa-solid fa-wind
    title: "The Famous Piccolo Solo"
    paragraphs:
      - "The piccolo line enters during the repeated trio and races through quick notes above the sustained main tune. Although listeners call it a solo, a concert band may assign it to several piccolo players for projection and brilliance."
      - "Its high register cuts through the full ensemble without amplification. Precise articulation matters because the line must remain clear while brass and percussion build underneath it."
      - "Sousa delayed the piccolo until late in the work, so a new color arrives just when a repeated melody could otherwise feel familiar. That timing is central to the march's design."

  - id: sousa
    icon: fa-solid fa-person-military-pointing
    title: "John Philip Sousa, the March King"
    paragraphs:
      - "Sousa directed the United States Marine Band from 1880 to 1892, expanding its repertoire and national touring profile. He then formed the civilian Sousa Band, which traveled widely and brought concert-band music to large public audiences."
      - "His catalog includes more than one hundred marches, among them Semper Fidelis, The Washington Post, and The Liberty Bell. The Stars and Stripes Forever received the federal national title, but those other works remain central to his reputation."
      - "Sousa also wrote operettas, suites, songs, novels, and instructional works. Calling him only a march composer understates the range of his professional life, even if the nickname March King is deserved."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How the March Received National Status"
    paragraphs:
      - "Congress designated The Stars and Stripes Forever as the national march in 1987, ninety years after its first public performance. President Ronald Reagan signed the measure on December 11."
      - "The statute is concise and names no required arrangement, tempo, or occasion. Military and civilian bands can therefore use editions suited to their instrumentation while preserving Sousa's composition."
    facts:
      - "1880. Sousa becomes leader of the United States Marine Band."
      - "1896. He conceives the march while returning from Europe and completes it in December."
      - "1897. The Sousa Band premieres the work in Philadelphia."
      - "1987. Federal law designates it the national march."

  - id: performances
    icon: fa-solid fa-drum
    title: "Where Americans Hear the National March"
    paragraphs:
      - "Military concerts, Independence Day programs, school band festivals, parades, and civic ceremonies regularly feature the march. Concert performances often save it for an encore because audiences recognize the trio and piccolo entrance immediately."
      - "A parade performance may emphasize steady forward motion, while a concert rendition can reveal inner countermelodies and dynamic contrasts. Both approaches grow from Sousa's band tradition."
      - "The local recording on this page is an interpretation of a public-domain composition. Individual modern recordings can still carry separate performance and recording rights."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "Words Written for The Stars and Stripes Forever"

  - id: other-state-songs
    icon: fa-solid fa-list
    title: "Other Official National Music"

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "The Stars and Stripes Forever Facts"
    facts:
      - "Sousa completed the score on Christmas Day in 1896."
      - "The first performance took place at Philadelphia's Academy of Music."
      - "Its celebrated piccolo passage appears only after the trio melody is established."
      - "The 1987 law names the work but prescribes no official recording."
      - "Sousa led the Marine Band for twelve years before forming his own ensemble."


