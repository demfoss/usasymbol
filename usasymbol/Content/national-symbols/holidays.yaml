faq:
- question: How many annual U.S. federal holidays are there?
  answer: Federal law names 11 annual holidays. Inauguration Day is a separate limited holiday for covered federal employees in the Washington area every four years.
- question: Do all businesses close on federal holidays?
  answer: No. Federal holiday law does not generally require private businesses to close or provide paid leave.
- question: What is the newest federal holiday?
  answer: Juneteenth National Independence Day is the newest annual federal holiday. It was added in 2021 and falls on June 19.
- question: Is Presidents Day the official federal name?
  answer: No. Federal law calls the third Monday in February Washington's Birthday, although Presidents Day is widely used elsewhere.
- question: What happens when a federal holiday falls on a weekend?
  answer: For most Monday-through-Friday federal employees, a Saturday holiday is observed Friday and a Sunday holiday is observed Monday. Different work schedules can have different in-lieu-of days.
