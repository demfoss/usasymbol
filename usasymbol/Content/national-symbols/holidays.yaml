sections:
- id: official-list
  icon: fa-solid fa-calendar-days
  title: The 11 Annual Federal Holidays
  paragraphs:
  - Five holidays always have a numbered calendar date, while six use a weekday rule. The date rule below is the legal schedule; the observed workday can differ when a fixed-date holiday falls on a weekend.
  table:
    headers:
    - Holiday
    - Date in federal law
    - Main subject
    rows:
    - [New Year's Day, January 1, Start of the calendar year]
    - [Birthday of Martin Luther King Jr., Third Monday in January, Civil-rights leader Martin Luther King Jr.]
    - [Washington's Birthday, Third Monday in February, George Washington]
    - [Memorial Day, Last Monday in May, U.S. military personnel who died in service]
    - [Juneteenth National Independence Day, June 19, End of slavery commemorated through the 1865 Galveston announcement]
    - [Independence Day, July 4, Adoption of the Declaration of Independence]
    - [Labor Day, First Monday in September, American workers and the labor movement]
    - [Columbus Day, Second Monday in October, Federal observance named for Christopher Columbus]
    - [Veterans Day, November 11, U.S. military veterans]
    - [Thanksgiving Day, Fourth Thursday in November, National day of thanksgiving]
    - [Christmas Day, December 25, Christmas]
    caption: Annual public holidays listed in federal law.
    note: Inauguration Day is a separate limited holiday under subsection (c).
- id: what-federal-means
  icon: fa-solid fa-building-columns
  title: What Is a Federal Holiday?
  paragraphs:
  - Federal holiday law sets work and pay rules for covered federal employees. Many federal offices close, although essential operations, public safety, national security, health care, transportation, and other services may continue.
  - A private employer does not have to close or provide paid leave merely because a date is a federal holiday. State and local governments, schools, courts, libraries, transit agencies, and businesses establish calendars under their own laws and policies.
- id: observed-day
  icon: fa-solid fa-business-time
  title: Federal Holiday Observed Dates
  paragraphs:
  - For most federal employees working Monday through Friday, a fixed-date holiday that falls on Saturday is observed on the preceding Friday. A fixed-date holiday that falls on Sunday is usually observed on the following Monday.
  - The observed day affects work schedules but does not rewrite the holiday's historical date. Independence Day remains July 4 even when the federal day off occurs on July 3 or July 5, and alternative work schedules can require a different in-lieu-of calculation.
- id: monday-holidays
  icon: fa-solid fa-calendar-week
  title: Monday Federal Holidays
  paragraphs:
  - Washington's Birthday, Memorial Day, Labor Day, Columbus Day, and Martin Luther King Jr. Day use Monday-based rules. A Monday date gives many employees a three-day weekend and avoids annual weekend shifts for those observances.
  - The Uniform Monday Holiday Act moved Washington's Birthday, Memorial Day, and Columbus Day to Monday formulas and established the modern federal rule for Veterans Day before Congress later restored Veterans Day to November 11. Labor Day already fell on the first Monday in September.
- id: names
  icon: fa-solid fa-tag
  title: Official Holiday Names
  paragraphs:
  - Federal law calls the February holiday "Washington's Birthday," not Presidents Day. States, cities, schools, and businesses may use Presidents Day or another local name, but OPM uses the statutory federal name.
  - "Columbus Day" is also the name in federal law. Some states and localities instead observe Indigenous Peoples' Day or use both names; those choices do not by themselves change the federal statute.
- id: inauguration-day
  icon: fa-solid fa-flag-usa
  title: Inauguration Day Holiday
  paragraphs:
  - Inauguration Day is not a twelfth annual nationwide federal holiday. Every fourth year after 1965, covered federal employees working in a designated Washington, D.C., area receive a holiday on January 20 when a president is inaugurated.
  - The limited rule helps accommodate the ceremony, crowds, transportation, and security around the capital. Federal employees outside the covered area do not automatically receive this holiday.
- id: history
  icon: fa-solid fa-clock-rotate-left
  title: History of Federal Holidays
  paragraphs:
  - In 1870, Congress recognized New Year's Day, Independence Day, Thanksgiving Day, and Christmas Day as holidays for federal employees in the District of Columbia. Congress added and revised observances over time instead of creating today's complete list at once.
  - The calendar expanded to include commemorations of military service, labor, national leaders, civil rights, and emancipation. Juneteenth National Independence Day joined the list in 2021 as the newest annual federal holiday.
- id: planning
  icon: fa-solid fa-circle-check
  title: What Is Open on Federal Holidays?
  paragraphs:
  - OPM publishes federal holiday dates, but each institution controls its own public schedule. The U.S. Postal Service, federal courts, museums, parks, financial markets, public transit, and local schools may follow related but not identical calendars.
  - Check the institution's official website for the specific year and location. This matters when a holiday is observed on a nearby weekday or when emergency, seasonal, and essential services use special hours.

