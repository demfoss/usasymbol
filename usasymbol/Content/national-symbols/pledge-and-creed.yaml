faq:
- question: Who wrote the Pledge of Allegiance?
  answer: Francis Bellamy wrote it in 1892 for a national public-school celebration organized through The Youth's Companion.
- question: What was the original Pledge of Allegiance?
  answer: Bellamy's version began "I pledge allegiance to my Flag" and was shorter than today's text. It did not include "of the United States of America" or "under God."
- question: When was "under God" added to the pledge?
  answer: Congress added those words in 1954. President Dwight D. Eisenhower signed the change on Flag Day, June 14.
- question: Do public-school students have to say the pledge?
  answer: No. The Supreme Court ruled in Barnette that public schools cannot compel students to salute the flag or recite the pledge.
- question: Who wrote the American's Creed?
  answer: William Tyler Page wrote the winning entry in a national contest. The House recognized the creed in 1918.
