page:
  h1: Pledge of Allegiance and the American's Creed
  quick_answer:
  - The Pledge is a short promise directed to the flag and republic; the American's Creed is a longer statement about constitutional government, citizenship, law, and civic duty.
  intro_paragraphs:
  - "The <strong>Pledge of Allegiance</strong> and the <strong>American's Creed</strong> are two different civic texts. Francis Bellamy wrote the pledge for a school celebration in 1892, while William Tyler Page wrote the creed chosen through a national contest and recognized by the House in 1918."
