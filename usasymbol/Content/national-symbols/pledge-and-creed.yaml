sections:
- id: pledge-text
  icon: fa-solid fa-flag-usa
  title: Pledge of Allegiance Text
  paragraphs:
  - "Federal law gives the current wording: \"I pledge allegiance to the Flag of the United States of America, and to the Republic for which it stands, one Nation under God, indivisible, with liberty and justice for all.\""
  - The pledge addresses both the flag and the republic it represents. Its current version has 31 words, but it is not identical to Bellamy's 1892 wording.
- id: bellamy
  icon: fa-solid fa-pen-nib
  title: Francis Bellamy and the Pledge
  paragraphs:
  - Francis Bellamy wrote the pledge while working with The Youth's Companion, a national family magazine. The text first appeared in print on September 8, 1892, as part of a planned public-school celebration marking 400 years since Columbus's arrival in the Americas.
  - Bellamy designed a brief statement that schoolchildren across the country could recite in the same ceremony. The original said "my Flag" and did not contain the words "of the United States of America" or "under God."
- id: word-changes
  icon: fa-solid fa-pen-to-square
  title: Pledge of Allegiance Changes
  paragraphs:
  - A National Flag Conference in 1923 changed "my Flag" to "the Flag of the United States," and the words "of America" were added in 1924. The revised text named the country explicitly instead of relying on the speaker's meaning of "my Flag."
  - Congress included the pledge in federal flag legislation in 1942. In 1954, Congress added "under God," producing the wording used today.
- id: ceremony
  icon: fa-solid fa-person
  title: Pledge of Allegiance Etiquette
  paragraphs:
  - The Flag Code says people should face the flag and stand at attention. People not in uniform place the right hand over the heart; those in uniform give the military salute, and specific rules address head coverings.
  - These instructions describe customary respect for the flag. They should be read together with constitutional protections that limit government power to compel speech or belief.
- id: schools
  icon: fa-solid fa-school
  title: Pledge of Allegiance in Schools
  paragraphs:
  - In West Virginia State Board of Education v. Barnette, the Supreme Court ruled in 1943 that public schools cannot force students to salute the flag or recite the pledge. The decision protects freedom of speech and conscience even when a school conducts a regular pledge ceremony.
  - States and school districts may establish pledge exercises under applicable law, but a public-school student cannot constitutionally be punished simply for declining to affirm the words. School rules can still require non-disruptive behavior while others participate.
- id: creed-text
  icon: fa-solid fa-scroll
  title: American's Creed Text and Meaning
  paragraphs:
  - The American's Creed begins with belief in the United States as a government of the people, by the people, and for the people. It describes a union of sovereign states, a republic, principles of freedom, equality, justice, and humanity, and a citizen's duties to country, Constitution, laws, and flag.
  - William Tyler Page built the text from ideas and phrases associated with the Declaration of Independence, Constitution, Gettysburg Address, and other American sources. It is much longer than the pledge and is not the text prescribed for the federal flag ceremony.
- id: contest
  icon: fa-solid fa-award
  title: William Tyler Page and the Creed
  paragraphs:
  - A national contest begun in 1916 invited Americans to write a concise statement of political faith. Page, a longtime House employee who had started as a congressional page, won among more than 3,000 submissions.
  - The House recognized him and the creed on April 3, 1918. Page recited it on the Capitol steps, and a bronze tablet bearing the text was later placed in the Capitol.
- id: compare
  icon: fa-solid fa-not-equal
  title: Pledge vs. American's Creed
  paragraphs:
  - The pledge is a promise of allegiance centered on the flag, nation, republic, liberty, and justice. The creed is a statement of belief about the structure and principles of American government followed by a list of civic duties.
  - Their legal and ceremonial roles also differ. Federal law supplies the pledge's wording and flag etiquette, while House recognition gave the creed historical civic standing without making it the standard daily flag recitation.
timeline:
- year: September 8, 1892
