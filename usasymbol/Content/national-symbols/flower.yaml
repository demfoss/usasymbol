sections:
- id: answer-fast
  icon: fa-solid fa-seedling
  title: National Flower of the United States
  paragraphs:
  - The rose is the official national floral emblem of the United States. Congress approved the choice in October 1986, and President Ronald Reagan proclaimed it on November 20 of that year.
  - People usually call it the national flower. The exact federal title is national floral emblem, a useful detail for a school report or a comparison with state flowers.
- id: what-is-official
  icon: fa-solid fa-scale-balanced
  title: Official Rose Designation
  paragraphs:
  - Federal law names "the flower commonly known as the rose." It does not identify a scientific species, a garden cultivar, or a color. A red hybrid tea rose is not more official than a pink, white, yellow, or native wild rose.
  - True roses belong to the genus <em>Rosa</em>, which includes many wild species and thousands of cultivated selections. The broad wording allows all of them to sit under the emblem without turning a garden label into a legal test.
- id: campaign
  icon: fa-solid fa-check-to-slot
  title: National Flower Campaign
  paragraphs:
  - Americans debated possible national flowers for decades. Supporters promoted several choices, including the rose and the marigold, through garden clubs, public campaigns, and proposals in Congress.
  - By the mid-1980s, the rose campaign had gained enough support for both chambers to act. The resulting joint resolution asked the president to declare the rose the national floral emblem and set the stage for the final proclamation.
- id: proclamation
  icon: fa-solid fa-landmark
  title: 1986 Rose Designation
  paragraphs:
  - President Reagan signed the congressional resolution on October 7, 1986. On November 20, he issued Presidential Proclamation 5574 during a ceremony in the White House Rose Garden.
  - The proclamation did more than repeat the legal title. It described roses at homes, parks, ceremonies, parades, celebrations, and memorials, explaining why one familiar flower could carry many different public uses.
- id: rose-anatomy
  icon: fa-solid fa-magnifying-glass
  title: Rose Identification
  paragraphs:
  - Wild roses often have open flowers with five petals and a center filled with many stamens. Garden breeding can turn those simple blooms into tightly layered flowers with dozens of petals. Colors, fragrance, plant height, and flowering season vary widely.
  - Rose stems may carry prickles, which are outgrowths of the plant's outer tissue. Botanically, they are not true thorns. After pollination, many roses form a rounded or oval fruit called a rose hip.
- id: native-and-garden
  icon: fa-solid fa-leaf
  title: Native and Garden Roses
  paragraphs:
  - North America has native rose species adapted to places such as dunes, prairies, wetlands, open woods, and mountain slopes. Cultivated roses also arrived from Europe and Asia, and breeders crossed plants from several regions to create modern garden groups.
  - That mix matters because the national emblem is not one imported garden rose. It includes the broad idea of a rose, from a native five-petaled species to a carefully bred exhibition flower.
- id: public-life
  icon: fa-solid fa-people-group
  title: Roses in American Public Life
  paragraphs:
  - Roses mark weddings, graduations, holidays, civic events, memorials, and military commemorations. Public rose gardens also serve as living collections where visitors can compare species, old garden roses, and modern cultivars.
  - The flower's meaning changes with the occasion and community. The federal designation does not assign a required message to each color, nor does it regulate how citizens, schools, businesses, or government offices use roses.
- id: white-house-garden
  icon: fa-solid fa-building-columns
  title: White House Rose Garden Connection
  paragraphs:
  - The Rose Garden gave President Reagan a fitting place to announce the emblem, but the garden itself did not create the legal designation. Congress had already passed the resolution, and rose advocates had worked for national recognition for years.
  - The White House garden is also not planted only with roses. Its design has changed over time and includes trees, shrubs, bulbs, and seasonal flowers alongside roses.
- id: states-and-rose
  icon: fa-solid fa-map-usa
  title: Rose as a State Flower
  paragraphs:
  - A national floral emblem does not replace [state flowers](/symbols/flowers). New York recognizes the rose as its state flower, while other states name specific roses or related plants, including Georgia's Cherokee rose and Iowa's wild rose.
  - These designations can overlap without conflict because they come from different governments. The national law applies to the United States as a whole, and each state keeps its own floral choices.

