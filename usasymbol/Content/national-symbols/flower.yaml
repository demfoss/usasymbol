faq:
- question: What is the national flower of the United States?
  answer: The rose is the official national floral emblem of the United States.
- question: When did the rose become the national floral emblem?
  answer: Congress approved it in 1986. President Ronald Reagan issued the formal proclamation on November 20, 1986.
- question: What color is the official national rose?
  answer: No color is official. The law designates the rose generally, so red, white, pink, yellow, and other roses are included.
- question: Is one rose species the national flower?
  answer: No. Federal law does not name a species or cultivated variety.
- question: Why is it called a national floral emblem instead of a national flower?
  answer: National floral emblem is the exact title used by Congress and the presidential proclamation. National flower is the common shorter name.

