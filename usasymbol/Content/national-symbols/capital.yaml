faq:
- question: What is the capital of the United States?
  answer: Washington, D.C., is the national capital. The federal government moved there in 1800.
- question: Is Washington, D.C., a state?
  answer: No. It is a federal district under authority granted to Congress by the Constitution.
- question: What does D.C. stand for?
  answer: D.C. stands for District of Columbia. The city was named for George Washington, while Columbia was a poetic name used for the United States.
- question: Why was Washington chosen as the capital?
  answer: The Residence Act placed the permanent seat of government on the Potomac as part of a political compromise. President Washington then selected the exact district.
- question: Can Washington, D.C., residents vote for president and Congress?
  answer: Residents vote for president under the Twenty-Third Amendment and elect a House delegate. They do not elect voting senators, and their delegate cannot vote on final passage in the full House.
