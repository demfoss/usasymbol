sections:
- id: constitutional-plan
  icon: fa-solid fa-book-open
  title: Federal District in the Constitution
  paragraphs:
  - Article I gives Congress authority over a district that becomes the seat of the United States government. The framers wanted the national government to control its immediate location rather than depend on one state for protection, public services, or permission to operate.
  - The Constitution did not name a city. It allowed a district of limited size created through state cessions and congressional acceptance, leaving the precise location to later political agreement.
- id: compromise
  icon: fa-solid fa-handshake
  title: The Compromise of 1790
  paragraphs:
  - Congress debated sites in the North and South while also arguing about Revolutionary War debts. The Residence Act of 1790 authorized a permanent seat along the Potomac River and kept Philadelphia as the temporary capital for ten years.
  - President George Washington received authority to select the exact area. The location near Georgetown and Alexandria connected Atlantic shipping, inland routes, and the border between Maryland and Virginia.
- id: earlier-capitals
  icon: fa-solid fa-route
  title: U.S. Capitals Before Washington
  paragraphs:
  - The Continental and Confederation Congresses met in Philadelphia, Baltimore, Lancaster, York, Princeton, Annapolis, Trenton, and New York during the Revolution and Confederation period. Those meeting places did not all have the same legal status as the later permanent capital.
  - Under the Constitution, the federal government first assembled in New York City in 1789. It moved to Philadelphia in 1790 while Washington's federal buildings were being prepared.
- id: city-plan
  icon: fa-solid fa-map
  title: The L'Enfant Plan for Washington
  paragraphs:
  - George Washington chose the general district, and Pierre Charles L'Enfant prepared an ambitious plan for the new city. It combined a street grid with broad diagonal avenues, circles, public squares, and prominent sites for Congress and the president.
  - Surveyor Andrew Ellicott carried the project forward after L'Enfant's dismissal and revised the plan used for development. Benjamin Banneker assisted the boundary survey that marked the original district.
- id: move-1800
  icon: fa-solid fa-person-walking-luggage
  title: Federal Government Moves to Washington
  paragraphs:
  - Congress first met in the unfinished Capitol in November 1800. President John Adams moved into the unfinished President's House, now called the White House, during the same year.
  - The early capital was still a construction site with muddy roads and scattered development. Government offices, homes, markets, and neighborhoods grew around the ceremonial plan over many decades.
- id: district-shape
  icon: fa-solid fa-draw-polygon
  title: District of Columbia Boundaries
  paragraphs:
  - Maryland and Virginia originally ceded land that formed a diamond-shaped district on both sides of the Potomac. It contained the existing ports of Georgetown and Alexandria as well as the planned City of Washington.
  - Congress returned the portion west and south of the river to Virginia in 1846. Today's District of Columbia occupies the former Maryland side, so its map no longer forms the original diamond.
- id: capital-government
  icon: fa-solid fa-landmark
  title: National Institutions in Washington
  paragraphs:
  - The Capitol houses Congress, the White House is the president's official residence and workplace, and the Supreme Court sits across from the Capitol. Executive departments, federal courts, museums, memorials, archives, embassies, and international institutions also operate in the district.
  - The National Mall creates a public landscape connecting major civic buildings and monuments. Washington is therefore both a working seat of government and a place where national memory is presented through architecture, collections, and public ceremony.
- id: residents
  icon: fa-solid fa-people-roof
  title: D.C. Government and Representation
  paragraphs:
  - Congress has constitutional authority over the district, while an elected mayor and council manage many local matters under the Home Rule Act. Congress can review district legislation and has a role unlike that of any state legislature over a local jurisdiction.
  - The Twenty-Third Amendment lets district residents vote for president. They elect a delegate who may participate in the House but cannot vote on final passage in the full chamber, and they do not elect voting senators. Representation and statehood remain active political questions.
