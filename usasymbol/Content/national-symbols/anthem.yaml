intro_text: "The United States national anthem is **The Star-Spangled Banner**, adopted in 1931 from Francis Scott Key's 1814 poem about the defense of Fort McHenry. Key wrote after seeing the fort's flag survive a British bombardment, then fitted his words to a melody by English composer John Stafford Smith."

