faq:
  - question: "What is the national anthem of the United States?"
    answer: "The national anthem is The Star-Spangled Banner. Congress gave it official status in 1931."
  - question: "Who wrote the U.S. national anthem?"
    answer: "Francis Scott Key wrote the words in 1814. John Stafford Smith composed the older melody."
  - question: "What event inspired The Star-Spangled Banner?"
    answer: "The British bombardment of Fort McHenry during the War of 1812 inspired Key. He saw the American garrison flag still flying at dawn."
  - question: "How many verses does The Star-Spangled Banner have?"
    answer: "Key's poem has four verses. Ceremonial performances normally use only the first."
  - question: "When did The Star-Spangled Banner become the national anthem?"
    answer: "President Herbert Hoover signed the anthem law on March 3, 1931. Military organizations had used the song officially for decades."

