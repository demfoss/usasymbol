sections:
  - id: overview
    icon: fa-solid fa-music
    title: "United States National Anthem"
    paragraphs:
      - "Congress made The Star-Spangled Banner the national anthem on March 3, 1931. The law recognized a song already used by the U.S. Navy, played at military ceremonies, and heard at public events across the country."
      - "Its identity comes from two older works joined in 1814, Key's new Baltimore poem and Smith's eighteenth-century London club melody. That combination explains both the anthem's American subject and its English tune."

  - id: fort-mchenry
    icon: fa-solid fa-fort-awesome
    title: "The Night at Fort McHenry"
    paragraphs:
      - "Key boarded a British ship in September 1814 to help secure the release of Maryland physician William Beanes. Because he learned details of the planned attack on Baltimore, the British kept Key and his companions with the fleet until the bombardment ended."
      - "From a vessel in the Patapsco River, Key watched rockets and shells strike Fort McHenry through the night of September 13 and 14. At dawn, the large American garrison flag remained visible above the fort, showing that the defense had held."
      - "Key drafted lines on the back of a letter and completed the poem after returning to Baltimore. A printer issued it under the title Defence of Fort M'Henry within days."

  - id: melody
    icon: fa-solid fa-compact-disc
    title: "Where the Anthem's Melody Came From"
    paragraphs:
      - "John Stafford Smith composed the tune for To Anacreon in Heaven, the constitutional song of a London gentlemen's music club. The melody was already familiar in the United States and had carried other sets of words before 1814."
      - "Its range spans an octave and a fifth, which places the opening low and the climactic phrase much higher. Singers often choose a conservative starting pitch so the final high notes remain comfortable."
      - "The meter of Key's poem matched the tune closely enough that Baltimore printers advertised the pairing almost immediately. The published song soon took its name from the poem's recurring flag image."

  - id: flag-story
    icon: fa-solid fa-flag
    title: "The Fort McHenry Flag Behind the Song"
    paragraphs:
      - "Baltimore flagmaker Mary Pickersgill made the garrison flag with help from her daughter, two nieces, and an African American indentured servant named Grace Wisher. Major George Armistead had requested a banner so large that the British would have no difficulty seeing it from a distance."
      - "The wool flag originally measured about 30 by 42 feet and carried fifteen stars and fifteen stripes. Armistead's family preserved it, sometimes giving away small pieces as souvenirs, before the Smithsonian received it in the early twentieth century."
      - "A conservation gallery at the National Museum of American History now displays the surviving banner under low light at a slight angle. The missing areas and muted colors record two centuries of use, clipping, exposure, and preservation."

  - id: four-verses
    icon: fa-solid fa-align-left
    title: "What the Four Verses Describe"
    paragraphs:
      - "The first verse stays inside the uncertainty of the night and ends by asking whether the flag still flies. The second answers from the morning shoreline, while the fourth closes with victory and the phrase In God is our trust."
      - "The third verse includes the words hireling and slave in a taunt directed at the defeated enemy. Historians debate the line's precise targets and implications, and modern criticism places it beside Key's own history as a slaveholder and prosecutor of abolitionists."
      - "Public performances almost always sing only the first verse. Knowing that the source text has four verses helps separate the familiar ceremonial song from the complete War of 1812 poem."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: "How The Star-Spangled Banner Became Official"
    paragraphs:
      - "The Navy formally recognized the song for flag-raising in 1889, and President Woodrow Wilson directed military bands to play it on appropriate occasions in 1916. Neither action made it the statutory national anthem."
      - "Supporters, including the National Society United States Daughters of 1812, campaigned for congressional adoption. President Herbert Hoover signed the 1931 law, nearly 117 years after the poem was written."
    facts:
      - "1814. Key writes Defence of Fort M'Henry after the British attack on Baltimore."
      - "1889. The Navy recognizes the song for flag-raising ceremonies."
      - "1916. President Wilson directs military use on appropriate occasions."
      - "1931. Congress and President Hoover establish the national anthem."

  - id: performance-etiquette
    icon: fa-solid fa-person
    title: "National Anthem Etiquette"
    paragraphs:
      - "Federal law describes customary conduct during the anthem. People present should stand and face the flag, or face the music when no flag is displayed."
      - "Members of the armed forces and veterans may render the military salute. Other people remove nonreligious headwear and place the right hand over the heart, while the statutory guidance carries no general penalty for a private person's failure to follow it."
      - "Performers may choose a key, tempo, and arrangement suited to the occasion. The law names the composition but does not require one official recording or mandate all four verses."

  - id: lyrics
    icon: fa-solid fa-quote-left
    title: "The Star-Spangled Banner Lyrics"

  - id: other-state-songs
    icon: fa-solid fa-list
    title: "Other Official National Music"

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "The Star-Spangled Banner Facts"
    facts:
      - "The song's original printed title was Defence of Fort M'Henry."
      - "Fort McHenry's smaller storm flag, not the giant garrison flag, probably flew during the worst weather."
      - "A standard performance of the first verse usually lasts under two minutes."
      - "The melody predates Key's words by several decades."
      - "The Smithsonian's surviving flag has fifteen stars and fifteen stripes."


