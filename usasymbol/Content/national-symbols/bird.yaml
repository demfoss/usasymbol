sections:
- id: answer-fast
  icon: fa-solid fa-dove
  title: National Bird of the United States
  paragraphs:
  - The bald eagle is the official national bird. Its scientific name, <em>Haliaeetus leucocephalus</em>, means a sea eagle with a white head. It lives only in North America and is most often found near rivers, lakes, reservoirs, marshes, and coasts where fish are available.
  - The 2024 designation settled an unusual gap in federal law. The eagle had represented the United States on the Great Seal since 1782, but no statute had formally called it the national bird.
- id: identification
  icon: fa-solid fa-binoculars
  title: Bald Eagle Identification
  paragraphs:
  - An adult bald eagle has a dark brown body, a white head and tail, a large yellow bill, and yellow feet. Females and males have the same colors, but females are generally larger. Adults commonly span about 6 to 7 feet from wingtip to wingtip.
  - Young bald eagles look very different. They are mostly mottled brown and do not gain the clean white head and tail of an adult until they are about four or five years old. In flight, a bald eagle holds its broad wings nearly flat, while a turkey vulture usually raises its wings into a shallow V.
- id: great-seal
  icon: fa-solid fa-stamp
  title: Bald Eagle on the Great Seal
  paragraphs:
  - Congress adopted the [Great Seal](/national-symbols/seal) on June 20, 1782. Its bald eagle holds an olive branch in its right talon and thirteen arrows in its left. A shield with thirteen stripes covers the eagle's breast, and a scroll in its beak carries the motto <em>E pluribus unum</em>.
  - The eagle faces the olive branch. The official explanation describes the branch and arrows as the power of peace and war, with peace preferred. The number thirteen repeats throughout the design for the original states.
  - Government documents, treaties, commissions, passports, military insignia, and currency helped make the seal's eagle familiar long before Congress created a legal national-bird title.
- id: legal-status
  icon: fa-solid fa-scale-balanced
  title: 2024 National Bird Designation
  paragraphs:
  - The bald eagle was widely described as the national bird for generations, but that description rested on custom and the Great Seal. In 2024, Congress passed legislation adding a direct sentence to federal law: the bald eagle is the national bird.
  - President Joe Biden signed the measure on December 23, 2024. The law did not redesign the seal or create a new wildlife program. It gave legal wording to a role Americans had already recognized for more than two centuries.
- id: decline
  icon: fa-solid fa-chart-line-down
  title: Bald Eagle Population Decline
  paragraphs:
  - Bald eagles suffered from shooting, habitat loss, and contamination during the nineteenth and twentieth centuries. The pesticide DDT caused a particularly serious problem. It built up through food chains and made many eagle eggshells too thin to survive incubation.
  - By 1963, surveys counted only 417 known nesting pairs in the lower 48 states. Alaska and Canada still supported larger populations, but the collapse in the contiguous United States was severe enough to make the eagle a national conservation emergency.
- id: recovery
  icon: fa-solid fa-arrow-trend-up
  title: Bald Eagle Recovery
  paragraphs:
  - Federal protection, the 1972 ban on most uses of DDT, habitat safeguards, nest monitoring, and reintroduction programs allowed bald eagles to rebound. The species left the federal endangered and threatened species list in 2007 after recovery goals had been met.
  - A U.S. Fish and Wildlife Service estimate released in 2021 placed the lower-48 population at 316,700 individual bald eagles, including 71,467 occupied nesting territories. The estimate used aerial surveys and other data, so it is a scientific estimate rather than a count of every bird.
- id: protection-today
  icon: fa-solid fa-shield-halved
  title: Federal Bald Eagle Protection
  paragraphs:
  - Delisting did not remove every safeguard. The Bald and Golden Eagle Protection Act and the Migratory Bird Treaty Act still prohibit many actions that kill, capture, possess, sell, or disturb bald eagles without authorization.
  - Eagle nests, feathers, eggs, and body parts are also regulated. A feather found outdoors is not automatically legal to keep. Federal programs make eagle feathers available to enrolled members of federally recognized tribes for religious and cultural use.
- id: hunting-and-habitat
  icon: fa-solid fa-fish
  title: Bald Eagle Habitat and Behavior
  paragraphs:
  - Bald eagles are powerful fish hunters, but they are flexible feeders. They may catch fish near the surface, take waterfowl or small mammals, eat carrion, or steal food from other birds. That flexibility helps them live near wild coasts, working reservoirs, and populated waterways.
  - A breeding pair often returns to the same nesting territory and adds material to a large stick nest over time. Nest sites are usually close to water and in trees or structures with a wide view and a clear flight path.
- id: franklin-letter
  icon: fa-solid fa-envelope-open-text
  title: Benjamin Franklin, the Eagle, and the Turkey
  paragraphs:
  - Benjamin Franklin did criticize the bald eagle in a private 1784 letter to his daughter. He thought the bird drawn on a Society of the Cincinnati emblem looked like a turkey, then compared the character of the two birds.
  - Franklin was not proposing a replacement for the national bird. The United States did not yet have a national-bird law, and Congress had adopted the Great Seal two years earlier. No evidence shows that the turkey lost a formal contest against the eagle.

