faq:
- question: What is the national bird of the United States?
  answer: The bald eagle is the official national bird of the United States.
- question: When did the bald eagle officially become the national bird?
  answer: President Joe Biden signed the designation into law on December 23, 2024. The eagle had appeared on the Great Seal since 1782.
- question: Why was the bald eagle chosen for the Great Seal?
  answer: The 1782 seal placed a North American bald eagle at the center of a design about national authority. Its olive branch and arrows represent the powers of peace and war.
- question: Is a bald eagle really bald?
  answer: No. The white feathers cover its head. The common name comes from an older use of the word "bald" for white-headed.
- question: Is the bald eagle still endangered?
  answer: No. It was removed from the federal endangered and threatened species list in 2007, but other federal laws still protect it.

