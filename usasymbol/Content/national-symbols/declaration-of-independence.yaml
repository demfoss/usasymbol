faq:
- question: Who wrote the Declaration of Independence?
  answer: Thomas Jefferson prepared the principal draft for the Committee of Five. Congress debated and revised the text before adopting it.
- question: When was the Declaration adopted?
  answer: Congress adopted the final text on July 4, 1776. It had approved the resolution for independence on July 2.
- question: Was the Declaration signed on July 4?
  answer: Most delegates signed the engrossed parchment on August 2, 1776, and some signed later. July 4 is the date Congress adopted the text.
- question: How many people signed the Declaration?
  answer: Fifty-six delegates signed the engrossed parchment. They represented all thirteen states.
- question: What are the main parts of the Declaration?
  answer: It presents principles of rights and government, lists grievances against the king, describes unsuccessful appeals, and declares the colonies free and independent states.
