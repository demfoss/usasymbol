sections:
- id: road-to-independence
  icon: fa-solid fa-route
  title: Road to Independence
  paragraphs:
  - Fighting between colonial and British forces began in 1775, but many colonists initially hoped for reconciliation. War, royal rejection of petitions, British military measures, and political arguments for self-government pushed public opinion toward separation.
  - On June 7, 1776, Richard Henry Lee of Virginia introduced a resolution declaring the colonies free and independent states. Congress postponed the final vote while delegates sought instructions, but it appointed a committee to prepare a declaration in case independence passed.
- id: drafting
  icon: fa-solid fa-pen-nib
  title: Committee of Five and Jefferson's Draft
  paragraphs:
  - The committee included Thomas Jefferson, John Adams, Benjamin Franklin, Roger Sherman, and Robert R. Livingston. Jefferson prepared the principal draft, Adams and Franklin reviewed it, and the committee presented it to Congress.
  - Congress debated and edited the wording before adoption. It removed passages, shortened others, and made the Declaration an act of Congress rather than the work of one writer.
- id: principles
  icon: fa-solid fa-scale-balanced
  title: Equality, Rights, and Consent
  paragraphs:
  - The best-known passage says all men are created equal and possess unalienable rights, including life, liberty, and the pursuit of happiness. It says governments gain their just powers from the consent of the governed.
  - The Declaration also argues that people may alter or abolish a government that becomes destructive of those ends. These claims expressed a political ideal, even though slavery continued and many people lacked equal legal or political rights in 1776.
- id: grievances
  icon: fa-solid fa-list-check
  title: Grievances Against King George III
  paragraphs:
  - Most of the document is a list of accusations against King George III. The charges concern colonial laws, legislatures, judges, military power, taxation, trade, jury trials, and warfare.
  - This section was meant to show that separation followed repeated injuries rather than a single dispute. The wording presents the king as responsible for a pattern of rule incompatible with colonial liberty.
- id: conclusion
  icon: fa-solid fa-scroll
  title: Declaration of Independence Explained
  paragraphs:
  - The conclusion declares the united colonies to be free and independent states and says their political connection with Great Britain is dissolved. It claims powers independent states may exercise, including making war and peace, forming alliances, and establishing commerce.
  - The delegates pledge their lives, fortunes, and sacred honor in support of the declaration. The document announced a claim of nationhood, but military victory and international recognition still had to be won.
- id: three-dates
  icon: fa-solid fa-calendar-days
  title: July 2, July 4, and August 2
  paragraphs:
  - Congress approved Lee's independence resolution on July 2. It adopted the Declaration's edited text on July 4, which is why that date appears on the document and became Independence Day.
  - The engrossed parchment was prepared after adoption. Most delegates signed it on August 2, while a few signatures were added later, so the familiar claim that all 56 signed on July 4 is incorrect.
- id: copies
  icon: fa-solid fa-copy
  title: Dunlap Broadsides
  paragraphs:
  - Printer John Dunlap produced broadsides during the night after adoption. Copies were distributed to officials, military commanders, and the states so the decision could be announced publicly.
  - These printed broadsides are not copies of the later signed parchment. They record the adopted text and originally carried the printed names of John Hancock as president of Congress and Charles Thomson as secretary.
- id: stone-and-original
  icon: fa-solid fa-vault
  title: Stone Engraving and Original Parchment
  paragraphs:
  - By the early 1800s, the engrossed parchment had faded and suffered from handling and display. William J. Stone completed a precise engraving in 1823; many modern reproductions descend from that image rather than a direct photograph of the parchment.
  - The original is displayed in the National Archives Rotunda in Washington, D.C. Careful lighting, monitoring, and protective housing help slow further deterioration.
- id: continuing-meaning
  icon: fa-solid fa-landmark
  title: Declaration of Independence Today
  paragraphs:
  - The Declaration is not a constitution and does not organize the federal government. Its principles have nevertheless shaped American political argument, abolitionism, the women's-rights movement, civil-rights advocacy, presidential speeches, and interpretations of the nation's founding promises.
  - Readers should distinguish the ideal it states from conditions in 1776. That tension helps explain both the document's influence and the continuing debate over who is fully included in its promise of equality.
