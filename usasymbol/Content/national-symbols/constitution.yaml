faq:
- question: How many articles are in the original Constitution?
  answer: The original Constitution contains seven articles. They describe the branches, state relations, amendment process, federal supremacy, and ratification.
- question: How many amendments does the Constitution have?
  answer: It has 27 ratified amendments. The first ten are known collectively as the Bill of Rights.
- question: Who wrote the Constitution?
  answer: Convention delegates drafted it collectively through debate and committees. James Madison was influential and kept important notes, but he was not the sole author.
- question: When did the Constitution take effect?
  answer: The ninth state ratified it in June 1788, satisfying Article VII. Operations under the new government began in 1789.
- question: Can the Constitution be changed?
  answer: Yes. Article V provides proposal and ratification procedures that require broad agreement in Congress and among the states.
