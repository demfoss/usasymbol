sections:
- id: before-constitution
  icon: fa-solid fa-clock-rotate-left
  title: Why the Articles of Confederation Failed
  paragraphs:
  - The Articles of Confederation created a one-house Congress but no separate national executive or federal court system. Congress could request money from states, but it lacked an independent power to tax and faced serious difficulty regulating commerce or enforcing national decisions.
  - Delegates gathered in Philadelphia in May 1787 with authority to revise the Articles. They instead designed a new government and required ratification by special conventions in nine states, a different rule from the unanimous approval needed to amend the Articles.
- id: preamble
  icon: fa-solid fa-scroll
  title: Constitution Preamble Explained
  paragraphs:
  - The Preamble begins with "We the People," placing the Constitution's authority in the people rather than a king or a compact written only in the names of states. It identifies goals that include a more perfect union, justice, domestic tranquility, common defense, general welfare, and liberty.
  - The Preamble explains purpose but does not grant a separate list of federal powers. Specific grants and limits appear in the articles and amendments that follow.
- id: three-branches
  icon: fa-solid fa-building-columns
  title: Articles I, II, and III
  paragraphs:
  - Article I creates Congress and divides it into the House of Representatives and Senate. It describes elections and lawmaking, lists congressional powers, and places limits on both Congress and the states.
  - Article II establishes the presidency and executive responsibilities. Article III establishes the federal judicial power, creates the Supreme Court, allows Congress to establish lower courts, and defines treason narrowly.
- id: union-rules
  icon: fa-solid fa-link
  title: Articles IV Through VII
  paragraphs:
  - Article IV governs relations among states and provides for admitting new states. Article V establishes methods for proposing and ratifying amendments, while Article VI makes the Constitution, federal laws made under it, and treaties the supreme law of the land.
  - Article VI also honors existing national debts and forbids religious tests for federal and state public office. Article VII says ratification by conventions in nine states would establish the Constitution among the states that approved it.
- id: checks-balances
  icon: fa-solid fa-scale-balanced
  title: Checks and Balances
  paragraphs:
  - The Constitution assigns legislative, executive, and judicial responsibilities to different branches. That separation is reinforced by checks such as the presidential veto, congressional control of appropriations and impeachment, Senate consideration of appointments and treaties, and judicial review developed through constitutional practice.
  - The design does not make the branches completely independent. Governing usually requires them to share authority, which can slow action but also makes it harder for one branch to exercise every national power alone.
- id: federalism
  icon: fa-solid fa-layer-group
  title: Federal and State Powers
  paragraphs:
  - The Constitution gives the federal government enumerated powers, including powers concerning interstate commerce, taxation, defense, naturalization, and money. States retain broad responsibilities, subject to the Constitution and valid federal law.
  - This division is called federalism. The Necessary and Proper Clause, Supremacy Clause, Tenth Amendment, later amendments, and court decisions all shape the boundary, so no single clause answers every federalism question.
- id: ratification
  icon: fa-solid fa-check-to-slot
  title: The Ratification Debate
  paragraphs:
  - Federalists defended the proposed Constitution as a stronger but limited national framework. Antifederalists warned about centralized power and the absence of a written bill of rights; essays, pamphlets, newspapers, and public conventions carried the debate across the states.
  - Delaware ratified first on December 7, 1787. New Hampshire became the ninth state on June 21, 1788, satisfying Article VII, while Virginia and New York followed soon afterward. North Carolina ratified in 1789 and Rhode Island in 1790.
- id: amendments
  icon: fa-solid fa-file-pen
  title: Constitutional Amendments
  paragraphs:
  - Article V requires more than an ordinary lawmaking majority. Amendments may be proposed by two-thirds of both houses of Congress or by a convention called after applications from two-thirds of state legislatures, then ratified by three-fourths of the states through legislatures or conventions as Congress specifies.
  - All 27 amendments were proposed by Congress. The Bill of Rights became the first ten in 1791; later amendments ended slavery, strengthened citizenship and voting protections, changed elections, limited presidential terms, and revised other parts of government.
- id: original
  icon: fa-solid fa-vault
  title: Original Constitution Today
  paragraphs:
  - Thirty-nine delegates signed the four-page parchment on September 17, 1787. Not every convention delegate approved the finished plan, and several had already left Philadelphia before the signing.
  - The National Archives displays the original in the Rotunda for the Charters of Freedom in Washington, D.C. Transcripts are easier to read, but the parchment preserves the engrossed text, signatures, and physical evidence of the convention's work.
