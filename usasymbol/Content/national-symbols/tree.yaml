sections:
- id: answer-fast
  icon: fa-solid fa-tree
  title: National Tree of the United States
  paragraphs:
  - The oak is the official national tree. Congress made the designation in 2004 after the oak finished first in a public vote organized by the Arbor Day Foundation.
  - The legal wording is unusually precise. It names the tree genus <em>Quercus</em>, commonly known as the oak tree, rather than choosing a white oak, live oak, red oak, or any other single species.
- id: public-vote
  icon: fa-solid fa-check-to-slot
  title: National Tree Vote
  paragraphs:
  - In 2001, the Arbor Day Foundation invited people to vote for a national tree. The ballot offered 21 tree choices and allowed write-in votes. The oak finished first, ahead of the redwood, dogwood, maple, and other familiar trees.
  - The vote did not itself create an official symbol. It provided a public result that supporters could take to Congress, turning the selection into a two-step process: popular choice first, federal law second.
- id: law
  icon: fa-solid fa-landmark
  title: 2004 National Tree Designation
  paragraphs:
  - Congress placed the designation in legislation enacted on December 8, 2004. The sentence is short: the tree genus <em>Quercus</em>, commonly known as the oak tree, is the national tree.
  - The provision now appears in Title 36 of the United States Code. It creates an official national symbol but does not protect every oak, control forestry, or prevent states and communities from naming their own official trees.
- id: genus
  icon: fa-solid fa-leaf
  title: Oak Species in the Quercus Genus
  paragraphs:
  - A genus is a scientific group containing related species. The national-tree law therefore includes many different oaks: towering forest trees, spreading live oaks, western woodland species, and shrubby oaks adapted to dry country.
  - Some oaks lose their leaves each year, while others remain evergreen. Leaf shapes range from deep rounded lobes to sharp points or nearly smooth edges. The most reliable shared clue is the acorn, a nut seated in a scaly cup.
- id: two-oak-groups
  icon: fa-solid fa-code-branch
  title: White Oak vs. Red Oak
  paragraphs:
  - Many North American oaks fall into white-oak and red-oak groups. White-oak-group leaves often have rounded lobes, and their acorns usually mature in one growing season. Red-oak-group leaves often have bristle-tipped lobes, and their acorns usually take two seasons.
  - These are useful field clues, not a complete identification key. Live oaks and other species may have leaves that do not match the familiar lobed outline, so the acorn, bark, buds, range, and leaf underside can all matter.
- id: wildlife
  icon: fa-solid fa-dove
  title: Acorns and Wildlife
  paragraphs:
  - Oaks produce a seasonal crop of nuts called mast. Deer, squirrels, mice, turkeys, jays, ducks, bears, and many other animals eat acorns. Jays and squirrels also move and bury acorns, sometimes leaving seeds in places where new oaks can grow.
  - Oak leaves, bark, branches, cavities, and dead wood provide food or shelter for insects, birds, fungi, and mammals. The exact community changes by oak species and region, but the ecological influence extends far beyond the tree's shade.
- id: people
  icon: fa-solid fa-people-group
  title: Oak Uses
  paragraphs:
  - Indigenous peoples across North America developed region-specific ways to gather, store, grind, and leach acorns for food. Oak materials also served in tools, structures, dyes, medicines, baskets, and cultural practices. Those traditions continue in many communities.
  - Oak wood has been used for ships, buildings, flooring, furniture, tools, railroad ties, and barrels. White oak is especially useful for liquid-tight barrels because of structures in its wood that block the large vessels.
- id: historic-oaks
  icon: fa-solid fa-clock-rotate-left
  title: Historic Oak Trees
  paragraphs:
  - Individual trees have carried famous local stories. Connecticut's Charter Oak became linked with colonial self-government, Maryland's Wye Oak was celebrated for its enormous size, and Virginia's Emancipation Oak is associated with education and the reading of the Emancipation Proclamation. These local choices sit beside the broader collection of [state trees](/symbols/trees).
  - None of those individual trees is the national tree. They help explain why oak attracted voters across different regions, but the federal designation belongs to the genus rather than to a named specimen.
- id: threats
  icon: fa-solid fa-shield-halved
  title: Oak Pests and Diseases
  paragraphs:
  - There is no single conservation status for all oaks. Drought, altered fire patterns, browsing, land conversion, poor regeneration, and introduced pests or diseases affect different species and forests in different ways.
  - Oak wilt can kill susceptible trees, while sudden oak death affects several western oak and tanoak communities. Moving firewood can spread insects and pathogens, so local forestry agencies often ask travelers to buy or gather firewood near where they will burn it.
- id: identify
  icon: fa-solid fa-magnifying-glass
  title: How to Identify an Oak Tree
  paragraphs:
  - Start with the fruit. If a tree produces a true acorn in a cup, it belongs to the oak family and is likely an oak. Then compare whether leaves are evergreen or deciduous, lobed or unlobed, rounded or bristle-tipped.
  - Location narrows the possibilities. A southern live oak on a coastal plain, a Gambel oak in the interior West, and a northern red oak in an eastern forest all fit the national designation while looking and growing differently.

