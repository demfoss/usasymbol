faq:
- question: What is the national tree of the United States?
  answer: The oak is the official national tree. Federal law specifically names the genus Quercus.
- question: When did the oak become the national tree?
  answer: Congress made the designation official on December 8, 2004.
- question: How was the oak chosen?
  answer: It finished first in a nationwide public vote organized by the Arbor Day Foundation in 2001. Congress later made the result official.
- question: Which oak species is the national tree?
  answer: No single species. The law covers the entire genus Quercus, including white oaks, red oaks, live oaks, and many others.
- question: How can you recognize an oak tree?
  answer: Every true oak produces acorns. Leaf shape, bark, buds, and location help identify the exact species.

