seo_title: "U.S. National Motto | In God We Trust"
seo_description: "In God We Trust became the U.S. national motto in 1956, ninety-two years after its first appearance on the two-cent coin."
intro_text: "**In God We Trust** is the official national motto of the United States, designated by Congress in 1956. The exact phrase first appeared on the two-cent coin in 1864 after Treasury Secretary Salmon P. Chase asked the Mint for a religious inscription during the Civil War. It now appears on every denomination of U.S. currency."
