sections:
  - id: overview
    icon: fa-solid fa-scroll
    title: "The Official Motto of the United States"
    paragraphs:
      - "Federal law gives one direct answer to the question of the national motto. Title 36 states that In God We Trust is the national motto, without prescribing a font, emblem, or required personal recitation."
      - "The 1956 designation followed more than nine decades of use on coins. It also came during the Cold War, when Congress adopted several measures that emphasized religious language in public life."

  - id: coin-origin
    icon: fa-solid fa-coins
    title: "How In God We Trust Reached U.S. Coins"
    paragraphs:
      - "In 1861, Pennsylvania minister Mark R. Watkinson wrote to Treasury Secretary Salmon P. Chase asking that U.S. money acknowledge God. Chase directed Mint Director James Pollock to prepare a suitable motto, but existing law did not allow officials to alter coin inscriptions on their own."
      - "Congress granted the necessary authority in 1864. The two-cent piece issued that year became the first U.S. coin bearing the exact words In God We Trust."
      - "Later coin laws permitted or required the phrase on additional denominations. Some redesigned coins omitted it for a time, prompting Congress to require the motto on coins where it had previously appeared."

  - id: national-designation
    icon: fa-solid fa-landmark
    title: "Why Congress Made the Motto Official in 1956"
    paragraphs:
      - "Congress designated In God We Trust as the national motto on July 30, 1956, and President Dwight D. Eisenhower signed the measure. The action placed the familiar currency inscription into federal law as a national designation."
      - "A separate 1955 law directed that the phrase appear on all United States coins and paper currency. The first paper money carrying it entered circulation in 1957 as new printing plates were prepared denomination by denomination."

  - id: currency
    icon: fa-solid fa-money-bill-wave
    title: "Where the Motto Appears on American Money"
    paragraphs:
      - "Every current U.S. coin denomination and Federal Reserve note carries In God We Trust. Placement changes with the artwork, so the motto may appear on the obverse or reverse and in a straight or curved line."
      - "The phrase joined paper money much later than coinage. Treasury introduced it during a gradual plate conversion beginning with one-dollar silver certificates issued in 1957."

  - id: congress-buildings
    icon: fa-solid fa-building-columns
    title: "The Motto in Government Spaces"
    paragraphs:
      - "The House of Representatives placed the words above the Speaker's rostrum in 1950, before the phrase received its statutory national title. The Senate chamber displays it above the presiding officer's desk."
      - "Federal, state, and local bodies also use the motto on seals, license plates, plaques, and public buildings. Those displays arise from different laws and policies, not from one national design standard."

  - id: two-mottos
    icon: fa-solid fa-scale-balanced
    title: "In God We Trust and E Pluribus Unum"
    paragraphs:
      - "E pluribus unum entered official national heraldry with the Great Seal in 1782 and means Out of many, one. It remains on the seal and on U.S. currency, which explains why many sources call it the traditional national motto."
      - "Only In God We Trust has the explicit statutory title of national motto. The two phrases answer different questions, one states the present legal designation and the other describes union in the Great Seal."

  - id: constitutional-debate
    icon: fa-solid fa-gavel
    title: "Constitutional Debate Around the Motto"
    paragraphs:
      - "Challenges to government use of the motto argue that it conflicts with the First Amendment's religion clauses. Federal courts have repeatedly allowed the practice, treating the historical and ceremonial usage as compatible with the Constitution."
      - "Public disagreement continues because the phrase is religious in ordinary language. Explaining its legal history does not require treating it as a statement every American must personally affirm."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "In God We Trust Facts"
    style: gradient
    facts:
      - "The motto appeared on coins ninety-two years before becoming the national motto."
      - "James Pollock considered several wordings before the Mint settled on the exact phrase."
      - "The Saint-Gaudens eagle briefly omitted the motto in 1907."
      - "Congress restored the words to affected gold coins in 1908."
      - "A motto designation does not establish one official typeface."

