faq:
  - question: "What is the official motto of the United States?"
    answer: "The official national motto is In God We Trust. Congress designated it in 1956."
  - question: "What does In God We Trust mean?"
    answer: "In ordinary English, the phrase expresses trust in God. Federal law adopts the wording but does not prescribe a theological interpretation."
  - question: "When was In God We Trust adopted as the national motto?"
    answer: "President Dwight D. Eisenhower signed the designation on July 30, 1956."
  - question: "When did In God We Trust first appear on money?"
    answer: "It first appeared on the two-cent coin in 1864. Paper currency began carrying it in 1957."
  - question: "Is E pluribus unum the national motto?"
    answer: "It is an official Great Seal motto and a traditional national phrase, but it is not the motto named by the 1956 statute."

