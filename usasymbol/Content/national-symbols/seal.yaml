faq:
  - question: "What is the Great Seal of the United States?"
    answer: "It is the official two-sided seal adopted by Congress in 1782. Its obverse shows a bald eagle, and its reverse shows an unfinished pyramid beneath an eye."
  - question: "What is the Great Seal used for?"
    answer: "It authenticates selected federal documents after the required signatures and authorization. The Secretary of State is its official custodian."
  - question: "What do the arrows and olive branch mean?"
    answer: "They refer to the federal powers of war and peace. The eagle faces the olive branch on its right side."
  - question: "Why are there thirteen stars on the Great Seal?"
    answer: "They refer to the thirteen states in the original union. The number repeats in several other parts of the design."
  - question: "What does E pluribus unum mean?"
    answer: "It means Out of many, one. The phrase describes unity formed from the original states."
  - question: "What does the unfinished pyramid mean?"
    answer: "Thirteen stone levels indicate the original states, while the unfinished top presents the nation as still being built. Thomson described its base as strength and duration."

