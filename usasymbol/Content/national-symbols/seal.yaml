sections:
  - id: history
    icon: fa-solid fa-landmark
    title: "How the Great Seal Was Created"
    paragraphs:
      - "Congress appointed its first seal committee on July 4, 1776, the same day it approved the Declaration of Independence. Benjamin Franklin, John Adams, and Thomas Jefferson proposed imagery, but Congress accepted none of their complete designs."
      - "Two later committees added ideas that survived, including the shield, olive branch, arrows, stars, and unfinished pyramid. In 1782, Secretary of Congress Charles Thomson combined the strongest elements and supplied a formal written description."
      - "Congress approved Thomson's design on June 20, 1782. When the present federal government began, a 1789 law placed the seal and its records in the custody of the Secretary of State."

  - id: obverse-elements
    icon: fa-solid fa-shield-halved
    title: "What the Eagle Side of the Great Seal Means"
    paragraphs:
      - "The obverse is both the working face of the seal and the national coat of arms. Its design balances separate state identities with federal union, while the eagle's two talons hold instruments associated with peace and war."
    elements:
      - id: bald-eagle
        name: "Bald Eagle"
        image: /images/amphibians/national-symbols/great-seal-obverse.webp
        paragraphs:
          - "A native bald eagle supports the shield without any visible prop. Thomson explained that the United States should rely on its own virtue for preservation."
      - id: shield
        name: "Shield and Chief"
        image: /images/amphibians/national-symbols/great-seal-obverse.webp
        paragraphs:
          - "Thirteen red and white vertical pieces stand for the original states, joined beneath a blue chief that represents Congress."
      - id: branch-arrows
        name: "Branch and Arrows"
        image: /images/amphibians/national-symbols/great-seal-obverse.webp
        paragraphs:
          - "The eagle holds an olive branch in its right talon and thirteen arrows in its left. Its head turns toward the branch, giving peace the position of preference."
      - id: constellation
        name: "Constellation"
        image: /images/amphibians/national-symbols/great-seal-obverse.webp
        paragraphs:
          - "Thirteen stars break through surrounding clouds above the eagle. Thomson described a new state taking its place among sovereign powers."
      - id: e-pluribus-unum
        name: "E Pluribus Unum"
        image: /images/amphibians/national-symbols/great-seal-obverse.webp
        paragraphs:
          - "Carried in the eagle's beak, the scroll reads Out of many, one. The thirteen-letter Latin phrase refers to one union formed from the original states."

  - id: reverse
    icon: fa-solid fa-landmark-dome
    title: "The Pyramid Side of the Great Seal"
    paragraphs:
      - "An unfinished pyramid rises through thirteen courses of stone. The Roman numerals MDCCLXXVI at its base give 1776, the year independence was declared."
      - "Above the summit, an eye within a triangle appears in a glory of light. The reverse belongs to the legally adopted design, although the Department of State has never cut a reverse die for sealing documents."

  - id: latin-mottos
    icon: fa-solid fa-language
    title: "What the Three Latin Mottos Mean"
    paragraphs:
      - "E pluribus unum means Out of many, one and appears on the eagle side. It describes union rather than naming the official national motto, which federal law now identifies as In God We Trust."
      - "Annuit coeptis, above the pyramid, conveys that Providence has favored the undertakings. Novus ordo seclorum, below it, means A new order of the ages and refers to the new American era beginning in 1776, not to a secret world government."

  - id: groups-of-thirteen
    icon: fa-solid fa-hashtag
    title: "Why the Number Thirteen Repeats"
    paragraphs:
      - "The number marks the original states throughout the design. It appears in the shield pieces, stars, arrows, olive leaves and fruits, pyramid levels, and the letter counts of E pluribus unum and Annuit coeptis."
      - "Those repetitions are structural, not hidden code. Thomson's written explanation directly tied them to the states that formed the first union."

  - id: official-use
    icon: fa-solid fa-stamp
    title: "How the Great Seal Is Used Today"
    paragraphs:
      - "The Secretary of State keeps the Great Seal. Department of State officers affix it to certain documents after the president signs and the proper countersignature or authorization is complete."
      - "Examples include instruments of ratification for treaties, diplomatic commissions, and some presidential proclamations and warrants. The seal is not a general-purpose stamp placed on every federal document."

  - id: seal-coat-of-arms
    icon: fa-solid fa-circle-info
    title: "Great Seal, Seal Impression, and Coat of Arms"
    paragraphs:
      - "The full Great Seal is a two-sided design defined in 1782. A seal impression is the embossed eagle-side mark physically made on an authorized document."
      - "The coat of arms is the colored eagle design without a surrounding inscription. Government buildings, passports, flags, military insignia, and publications commonly display that arms artwork even when no document is being sealed."

  - id: dollar-bill
    icon: fa-solid fa-money-bill-1
    title: "Why Both Sides Appear on the One-Dollar Bill"
    paragraphs:
      - "The one-dollar Federal Reserve note places the reverse design to the left and the obverse to the right. Their appearance on currency makes both sides familiar even though only the eagle side operates as the sealing die."
      - "President Franklin D. Roosevelt approved adding the two designs to the dollar in 1935. The printed images reproduce the seal's emblems but do not create a legal seal impression."

  - id: versions
    icon: fa-solid fa-clock-rotate-left
    title: "Dies and Historical Renderings"
    paragraphs:
      - "The adopted written description has remained the authority since 1782, while worn dies have been replaced. Artists interpret line, feather, and cloud details differently so long as the heraldic elements remain faithful to the official blazon."
    versions:
      - name: "First Great Seal Die"
        years: "1782 to 1841"
        image: ""
        description: "The first working die cut only the eagle side and produced impressions for early federal documents."
      - name: "Treaty Seal"
        years: "1825 to 1871"
        image: ""
        description: "A larger die was used on treaty instruments before changes in federal treaty practice ended its role."
      - name: "Current Working Die"
        years: "1904 to present"
        image: ""
        description: "The Department of State continues to use a die first cut in 1904 for authorized impressions."

