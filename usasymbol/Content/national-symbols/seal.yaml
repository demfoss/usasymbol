intro_text: "The **Great Seal of the United States**, adopted in 1782, shows a bald eagle with a shield, olive branch, arrows, stars, and the motto *E pluribus unum* on its obverse. Its reverse places the Eye of Providence above an unfinished pyramid. Only the eagle side is cut into the die used to authenticate selected federal documents."

