seo_title: "U.S. National Colors | Red, White and Blue"
seo_description: "Red, white, and blue are the customary U.S. national colors, drawn from the 1777 flag and explained in the 1782 Great Seal."
intro_text: "The customary national colors of the United States are **red, white, and blue**, drawn from the flag established in 1777 and the Great Seal adopted in 1782. Federal law requires those colors in the flag, but Congress has not passed a separate law naming an official set of national colors. The often quoted meanings belong to the Great Seal's official explanation."
official_colors: "Red, White, and Blue"
official_since: "Traditional"
primary_use: "National Flag, Great Seal, Federal Insignia"
known_for: "Thirteen red and white flag stripes paired with a blue union of fifty white stars, the color arrangement recognized around the world as American."
