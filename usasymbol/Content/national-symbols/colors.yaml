sections:
  - id: legal-status
    icon: fa-solid fa-scale-balanced
    title: "Are Red, White, and Blue Official National Colors?"
    style: default
    paragraphs:
      - "Title 4 describes the national flag as thirteen alternating red and white stripes with white stars in a blue field. That makes the three colors official parts of the flag, but the United States Code does not separately designate them as national colors."
      - "The precise description is therefore customary national colors. This distinction matters because Congress has enacted standalone designations for the anthem, motto, floral emblem, tree, mammal, bird, and march."

  - id: flag-origin
    icon: fa-solid fa-flag
    title: "How the Colors Entered the American Flag"
    style: default
    paragraphs:
      - "The Flag Resolution of 1777 specified red and white stripes and white stars on blue without explaining why Congress chose those colors. The palette also appeared in British maritime flags familiar to the colonists, but the resolution left no official origin story."
      - "As states joined the Union, Congress changed the counts of stars and, briefly, stripes. The red, white, and blue palette stayed constant through every official version."

  - id: what-colors-mean
    icon: fa-solid fa-palette
    title: "What the U.S. National Colors Mean"
    style: color-meaning-cards
    intro: "Charles Thomson supplied the best-known official explanation while presenting the Great Seal in 1782. His words describe the seal's colors, not a symbolism clause in the flag law."
    color_cards:
      - color_name: "Red"
        hex: "#B31942"
        heading: "Meaning of American Red"
        meaning: "On the Great Seal, Thomson connected red with hardiness and valor. On the flag, it fills seven stripes."
      - color_name: "White"
        hex: "#FFFFFF"
        heading: "What American White Means"
        meaning: "Thomson assigned purity and innocence to white. Visually, it creates six flag stripes and every star."
      - color_name: "Blue"
        hex: "#0A3161"
        heading: "American Blue Color Meaning"
        meaning: "Vigilance, perseverance, and justice were Thomson's seal meanings. Blue also unites all fifty stars in one field."

  - id: where-colors-appear
    icon: fa-solid fa-location-dot
    title: "Where You Can See U.S. National Colors"
    style: color-appear-cards
    intro: "The palette appears most authoritatively on the national flag, the Great Seal's coat of arms, and federal insignia derived from them."
    appear_cards:
      - image: /images/amphibians/national-symbols/united-states-flag.svg
        alt: "United States flag in red, white, and blue"
        heading: "National Flag"
        description: "Red and white alternate across thirteen stripes, while white stars fill a dark blue union."
      - image: /images/amphibians/national-symbols/great-seal-obverse.webp
        alt: "Great Seal obverse with eagle, shield, and blue chief"
        heading: "Great Seal"
        description: "The eagle's shield has red and white vertical pieces below a solid blue chief."
      - image: ""
        alt: "Federal insignia using the national palette"
        heading: "Federal Insignia"
        description: "Agencies and military services adapt the palette in emblems, roundels, ribbons, and ceremonial graphics."

  - id: old-glory-shades
    icon: fa-solid fa-droplet
    title: "Old Glory Red and Old Glory Blue"
    style: default
    paragraphs:
      - "Government procurement standards identify textile shades known as Old Glory Red and Old Glory Blue. Screen values such as the HEX codes on this page are practical conversions, not a substitute for the physical color references used to manufacture federal flags."
      - "Printed and digital reproductions can therefore differ slightly while remaining recognizably American. Material, lighting, ink, and display settings all affect the color a viewer sees."

  - id: seal-versus-flag
    icon: fa-solid fa-circle-info
    title: "Why Flag and Seal Meanings Get Mixed Together"
    style: default
    paragraphs:
      - "Many classroom explanations attach Thomson's 1782 words directly to the stripes and union. The association is understandable because the same palette appears in both national emblems, yet the 1777 flag resolution contains no color meanings."
      - "A careful answer names the source. Red, white, and blue are flag colors, while hardiness, purity, vigilance, and the other familiar qualities come from the Great Seal explanation."

  - id: using-the-palette
    icon: fa-solid fa-swatchbook
    title: "Using the American Palette in Design"
    style: default
    paragraphs:
      - "For an accurate flag, begin with the statutory arrangement and federal proportions rather than treating the three swatches as a general logo kit. Preserve enough contrast for white stars and stripes to remain visible against neighboring colors."
      - "A digital project may use the page's HEX approximations, while uniforms, flags, and regulated government materials can require a separate agency specification. Always check the standard that governs the actual product."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Red, White, and Blue Facts"
    style: gradient
    facts:
      - "The first flag resolution named all three colors but explained none of them."
      - "White appears in more separate shapes on the current flag than either red or blue."
      - "Every official star-count change has kept the same three-color palette."
      - "Old Glory is both a flag nickname and part of the common shade names."
      - "The Great Seal's shield uses thirteen red and white vertical pieces beneath a blue chief."

