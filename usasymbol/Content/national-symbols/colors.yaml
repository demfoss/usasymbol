faq:
  - question: "What are the national colors of the United States?"
    answer: "Red, white, and blue are the customary national colors. They form the palette of the United States flag and Great Seal."
  - question: "Are red, white, and blue officially designated national colors?"
    answer: "No separate federal statute gives them that title. They are official components of the national flag and customary national colors."
  - question: "What do the American colors mean?"
    answer: "Charles Thomson linked white with purity and innocence, red with hardiness and valor, and blue with vigilance, perseverance, and justice in his 1782 Great Seal explanation."
  - question: "Did the 1777 flag law explain the colors?"
    answer: "No. The resolution prescribed red and white stripes and white stars on blue but assigned no symbolism."
  - question: "What are Old Glory Red and Old Glory Blue?"
    answer: "They are names used for standardized flag shades in government specifications. Digital HEX values are approximations of physical color references."

