seo:
  title: State Snacks | Official List, Map & Facts
  description: Utah, Texas, Illinois, South Carolina, New York and Indiana have an official state snack. Illinois and Indiana both chose popcorn.
page:
  h1: List of State Snacks
  quick_answer:
  - "Utah named Jell-O its official state snack in 2001, the earliest on the list. Texas followed in 2003 with tortilla chips and salsa, and Illinois chose popcorn in 2004."
  - "South Carolina picked boiled peanuts in 2006, New York chose yogurt in 2014, and Indiana joined Illinois with popcorn in 2021."
  intro_paragraphs:
  - "State snacks usually come from what the state grows or makes. Popcorn comes from corn country, boiled peanuts from the South and yogurt from New York, where dairy farms supply a large Greek yogurt industry."
  - "Utah's Jell-O is a special case. It was recognized by a Senate resolution, not a full state law, so it carries less legal weight than the other five."
  sections:
  - id: snacks-overview
    icon: fa-solid fa-bowl-food
    title: Official State Snacks by State
    paragraphs:
    - "Jell-O was invented in Le Roy, New York, in 1897, yet Utah is the state that adopted it. Utah is often cited as the country's biggest Jell-O eater, and lime Jell-O salads are a fixture of its church potlucks. Texas named a pair, tortilla chips and salsa, the only snack on the list made of two foods."
    - "South Carolina's boiled peanuts are simmered in salty brine until soft, and roadside stands across the South sell them by the bag. New York's yogurt reflects the Greek yogurt plants, including Chobani's in New Berlin, built in the state since 2005."
  - id: snacks-popcorn
    icon: fa-solid fa-wheat-awn
    title: Why Illinois and Indiana Chose Popcorn
    paragraphs:
    - "Both states sit in the Corn Belt, where popping corn grows alongside field corn. Indiana was the home of Orville Redenbacher, who was born in Brazil, Indiana, and built one of the best-known popcorn brands in the country."
  methodology: Adoption years reflect the year of official legislative designation.
  sources:
