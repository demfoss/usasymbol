page:
  h1: "Official State Dinosaurs"
  
  quick_answer:
    - "Only 12 U.S. states have officially designated a state dinosaur as of 2026."
    - "Colorado was the first, designating Stegosaurus in 1982 — the oldest official state dinosaur in the country."
    - "Montana's Maiasaura peeblesorum followed in 1985, named the 'good mother lizard' after fossilized nests with eggs and juveniles were discovered at Egg Mountain."
    - "New Jersey's Hadrosaurus foulkii, designated in 1991, marks the site of the first nearly complete dinosaur skeleton found in North America (Haddonfield, 1858)."
    - "California and Arkansas both added their designations in 2017. Utah's Utahraptor became the most recent addition in 2018."
    - "State dinosaurs are a separate designation from state fossils. Some states have a dinosaur species as their state fossil — those are covered on the state fossils page, not here."

  intro_paragraphs:
    - "Not every U.S. state has an official state dinosaur — only 12 do. State fossils, which are a different legal category and sometimes include dinosaur species, are covered separately."
    - "Each of these designations is tied to a specific species found within the state. Most were enacted after a schoolchild or educator proposed the idea to the state legislature, though a few emerged from scientific recommendations. Colorado started the tradition in 1982. In the four decades since, the list has grown slowly, with the most active period coming in 2017–2018, when California, Arkansas, and Utah added their own."

  insights:
    - "Colorado's 1982 Stegosaurus designation was the first of its kind in the U.S. The Morrison Formation running through Colorado has produced some of the world's best Stegosaurus specimens."
    - "New Jersey's Hadrosaurus foulkii changed paleontology. The 1858 Haddonfield skeleton was the first evidence that large dinosaurs walked on two legs, not four. Before it, scientists modeled dinosaurs after lizards."
    - "Montana's Maiasaura was designated in 1985 — just six years after Jack Horner and Bob Makela's 1979 Egg Mountain discovery. Nests, eggs, hatchlings, and adults together rewrote what we knew about dinosaur parental behavior."
    - "Utah's Utahraptor stands about 23 feet long and weighs an estimated 1,000 pounds — far larger than the Velociraptor made famous in film. It was formally described in 1993, the same year Jurassic Park was released — a coincidence that made it instantly famous."
    - "Oklahoma's Acrocanthosaurus atokensis, named for Atoka County where the first specimen was found, is estimated at over 38 feet in length — one of the largest carnivorous dinosaurs on the North American record."
    - "California's Augustynolophus morrisi is an endemic species — known only from fossils found within California. It was one of the last non-avian dinosaurs in North America before the end-Cretaceous extinction."
    - "Maryland's Astrodon johnstoni has a historic distinction: it was the first dinosaur species described from North American material, in 1859. Miners found its teeth in iron ore pits in Prince George's County."

  methodology: "This page includes official state dinosaurs only, not separate state fossils. Names follow accepted taxonomy."

  sources:
    - name: "Society of Vertebrate Paleontology"
      url: "https://vertpaleo.org/"
      description: "Scientific research, taxonomy, and peer-reviewed publications on vertebrate fossils including dinosaurs"
    - name: "Smithsonian National Museum of Natural History"
      url: "https://naturalhistory.si.edu/"
      description: "Reference for dinosaur species information, fossil history, and educational content"
    - name: "National Conference of State Legislatures (NCSL)"
      url: "https://www.ncsl.org/"
      description: "State symbol legislation reference and tracking"

