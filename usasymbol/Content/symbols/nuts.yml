seo:
  title: "State Nuts | Official List, Map & Facts"
  description: "Official state nuts are listed by state, with adoption years and facts about each crop."

page:
  h1: "List of State Nuts"

  quick_answer:
    - "A state nut is an official nut designated by a state legislature, usually a crop the state is a leading grower of."
    - "Alabama's state nut is the pecan, adopted in 1982, grown across the state's river valleys and coastal plain."

  intro_paragraphs:
    - "State nuts are usually chosen because a state has a long-established commercial nut-growing industry."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: nuts-overview
      icon: fa-solid fa-seedling
      title: Official State Nuts of U.S. States
      paragraphs:
        - "The table below lists official state nuts with their adoption year and a short note on each one's connection to the state. This list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed designation are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state foods"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_foods"
      description: "State nut designations with adoption years."

