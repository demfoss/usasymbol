page:
  h1: "Official U.S. State Marine Mammals"
  
  quick_answer:
    - "13 U.S. states have designated official state marine mammals, including whales, dolphins, seals, and manatees."
    - "The North Atlantic Right Whale is the most common state marine mammal, representing Georgia, Massachusetts, and South Carolina."
    - "Hawaii has two marine mammal designations: the Humpback Whale (1979) and Hawaiian Monk Seal (2008)."
    - "California designated the Gray Whale as its state marine mammal in 1975, one of the earliest marine mammal designations."

  intro_paragraphs:
    - "State marine mammals are designated by U.S. state legislatures to honor whales, dolphins, seals, and other marine animals that hold special significance to coastal states. These designations recognize the ecological importance, economic value, and cultural connections between states and their ocean wildlife. Most state marine mammal designations occurred between 1975 and 2016, reflecting growing awareness of marine conservation."
    - "The animals range from massive baleen whales like the Gray Whale and Humpback Whale to smaller marine mammals like the Harbor Seal and Bottlenose Dolphin. Several species are endangered, and their designations as state symbols help raise awareness for conservation efforts."

  insights:
    - "The North Atlantic Right Whale represents three states: Georgia (1985), Massachusetts (1980), and South Carolina (2009). Fewer than 350 Right Whales survive, making it one of the world's most endangered large whales."
    - "California's Gray Whale (1975) and Florida's Manatee (1975) were among the first state marine mammal designations, both adopted in the same year."
    - "Hawaii is the only state with two separate marine mammal designations: the Humpback Whale (1979) and Hawaiian Monk Seal (2008), both critically endangered species."
    - "The Bottlenose Dolphin represents three states: Florida (as state saltwater mammal), Mississippi, and South Carolina, reflecting its abundance along the Atlantic and Gulf coasts."
    - "Connecticut designated the Sperm Whale as its state animal (not marine mammal specifically) in 1975, honoring the state's 19th-century whaling industry."
 
  methodology: "This page includes official state marine mammal designations. Scientific names follow current marine mammal taxonomy."
  
