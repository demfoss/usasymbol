page:
  h1: "List of State Nicknames"
  
  quick_answer:
    - "Most state nicknames are unofficial — they evolved through popular usage, geography, history, or culture rather than legislative action."
    - "About 14 states have legislatively official nicknames, including Arizona (The Grand Canyon State), California (The Golden State), Florida (The Sunshine State), and New Mexico (The Land of Enchantment)."
    - "Texas's 'The Lone Star State' is one of the most recognizable nicknames, referring to the single star on its flag from the Republic of Texas era."
    - "Many states have multiple nicknames, but one typically dominates in popular usage and appears on license plates and tourism materials."

  intro_paragraphs:
    - "State nicknames are informal or official titles that capture a state's identity, geography, history, or culture in a few memorable words. While every U.S. state has at least one widely recognized nickname, only about a third have been formally adopted through state legislation. Most nicknames emerged organically through centuries of use."
    - "Some nicknames reference natural features (The Grand Canyon State, The Evergreen State), while others honor historical events (The First State, The Volunteer State) or key industries (The Golden State, The Silver State). Several states have semi-official nicknames that appear on license plates or state seals but were never formally adopted by law."

  insights:
    - "Nature-based nicknames are the most common category. At least 20 states reference plants, animals, landscapes, or natural features in their primary nicknames."
    - "Delaware's 'The First State' is the most historically straightforward — it was the first state to ratify the U.S. Constitution on December 7, 1787."
    - "Indiana's 'The Hoosier State' has the most debated origin. No one knows for certain where 'Hoosier' came from, with at least a dozen competing theories."
    - "Several nicknames appear on license plates, making them among the most visible state symbols. Florida plates feature 'Sunshine State,' and Arizona has displayed 'Grand Canyon State' since the 1940s."
    - "South Dakota changed its nickname from 'The Coyote State' to 'The Mount Rushmore State' in 1992 to boost tourism."
 
  methodology: "This page lists each state's primary nickname and status. When several exist, the most widely recognized one is used."
  
  sources:
    - name: "Library of Congress"
      url: "https://www.loc.gov/"
      description: "Historical records and state symbol documentation"

