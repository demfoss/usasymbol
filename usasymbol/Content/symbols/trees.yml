seo:
  title: "List of State Trees - All 50 States"
  description: "A complete list of state trees for all 50 U.S. states with pictures. Four states share the Sugar Maple - find out which state tree represents yours."

page:
  h1: "U.S. State Trees: Alphabetical List with Pictures"
  
  quick_answer:
    - "The Sugar Maple is the most popular state tree, representing four states: New York, Vermont, West Virginia, and Wisconsin."
    - "Oaks are the most represented tree family — White Oak (Connecticut, Illinois, Maryland), Northern Red Oak (New Jersey), Southern Live Oak (Georgia), Ohio Buckeye (Ohio), and generic Oak (Iowa) account for six state trees."
    - "California's state tree, the Coast Redwood, is the tallest living organism on Earth, reaching heights over 380 feet."
    - "Texas was one of the earliest adopters, designating the Pecan tree in 1919 — well before most states chose their official trees."

  intro_paragraphs:
    - "Every U.S. state has designated an official state tree, recognizing species that are economically important, ecologically significant, or culturally meaningful to their region. Pine trees dominate the selections — at least 10 states chose a pine species — reflecting the central role of timber in American history."
    - "Most state trees were adopted between the 1930s and 1960s, often after campaigns by forestry associations, garden clubs, or schoolchildren's votes. Some states chose broad categories (Iowa simply designated 'Oak'), while others named very specific species. The table below lists each state's tree with scientific names, images, and the year of official adoption."

  insights:
    - "Pine trees are by far the most represented family, with at least 10 states choosing a pine species. This reflects the enormous importance of the timber industry in American history."
    - "The Tulip Tree (Liriodendron tulipifera) goes by different common names in different states: 'Tulip Tree' in Indiana, 'Tulip Poplar' in Kentucky and Tennessee — but all three are the exact same species."
    - "Utah changed its state tree from the Blue Spruce to the Quaking Aspen in 2014. A single aspen grove in Utah called 'Pando' is considered the heaviest and oldest living organism on Earth — a clonal colony of 47,000 connected trunks spanning 106 acres."
    - "Hawaii's Kukui (Candlenut) was brought to the islands by Polynesian voyagers over 1,000 years ago. Its oily nuts were burned for light, giving it the name 'candlenut.'"
    - "Massachusetts chose the American Elm in 1941 — just before Dutch Elm Disease devastated elm populations across the country. The disease has killed tens of millions of elms since the 1950s."
 
  methodology: "This list includes the official state tree for each of the 50 U.S. states as designated by state legislatures. Scientific names follow current botanical taxonomy. The year adopted reflects when the tree was officially designated by law or legislative resolution."
  
  sources:
    - name: "USDA Forest Service"
      url: "https://www.fs.usda.gov/"
      description: "Tree species data, distribution maps, and forestry research"
    - name: "Arbor Day Foundation"
      url: "https://www.arborday.org/"
      description: "Tree identification guides and planting resources"

