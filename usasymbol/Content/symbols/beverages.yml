sections:
  - id: "what-counts-as-a-state-drink"
    icon: "fa-solid fa-glass-water"
    title: "What Counts as a State Drink or State Beverage?"
    paragraphs:
      - "In practice, this category is wider than the phrase state beverage suggests. Some legislatures used broad labels like state beverage or state drink. Others created narrower categories such as state spirit, state cocktail, state juice, state soft drink, or state hospitality beverage. For readers, these all belong in the same family: officially designated drinks."
      - "That broader approach makes the list more useful. If a state has an official spirit but no official beverage, the spirit still answers the same public question: what drink has the state formally chosen to represent itself? Alabama, Maryland, Virginia, Nevada, Delaware, and Wisconsin all illustrate why the umbrella category matters."

  - id: "why-milk-dominates"
    icon: "fa-solid fa-cow"
    title: "Why Milk Dominates the List"
    paragraphs:
      - "Milk became the default state beverage for a simple reason: it works as a clean, noncontroversial agricultural symbol. Legislatures could support dairy farmers, school nutrition messaging, and rural industry all at once without attaching the symbol to a single brand."
      - "That is why milk appears across very different regions, from Vermont and Wisconsin to Oklahoma and South Carolina. It is less a statement about local uniqueness than a statement about agriculture, everyday consumption, and farm identity. That same farm-symbol logic also appears in the [state mammals list](/symbols/mammals), where Wisconsin designates the dairy cow."
      - "The downside is that milk-heavy lists can feel repetitive. The more memorable entries often come from states that picked something more specific to place, history, or local food culture."

  - id: "states-with-multiple-drink-symbols"
    icon: "fa-solid fa-layer-group"
    title: "States With More Than One Official Drink Symbol"
    paragraphs:
      - "A small group of states use the category more creatively by designating more than one official drink-related symbol. Delaware has milk and Orange Crush. Maryland has milk, rye whiskey, and Orange Crush. Nebraska has milk and Kool-Aid. South Carolina has milk and South Carolina-grown tea. Virginia has milk and George Washington's Rye Whiskey. Wisconsin has milk and the brandy old fashioned."
      - "These multi-part systems usually happen when an older agricultural symbol remains in place and a later legislature adds a more distinctive local specialty. That pattern lets states keep a traditional farm-facing symbol while also recognizing a drink that feels more culturally specific."

faq:
  - question: "How many states have an official state drink or beverage?"
    answer: "As of 2026, 33 U.S. states have at least one official drink-related symbol. Counting beverages, drinks, spirits, cocktails, juices, and soft drinks together, that produces 40 statewide designations on this list."

  - question: "What is the most common state beverage?"
    answer: "Milk is the most common official state beverage or state drink. Twenty states designate milk in some form, making it by far the dominant choice on the list."

  - question: "Which state was first to adopt an official beverage?"
    answer: "Ohio is the earliest-known state on this list to adopt an official beverage, choosing tomato juice in 1965."

  - question: "Do all state drink symbols use the label state beverage?"
    answer: "No. States use several labels, including state drink, state beverage, state spirit, state cocktail, state juice, state soft drink, and state hospitality beverage."

  - question: "Which states have more than one official drink symbol?"
    answer: "Delaware, Maryland, Nebraska, South Carolina, Virginia, and Wisconsin each have more than one official drink-related designation."

  - question: "What are the newest state drink designations?"
    answer: "Recent additions include Delaware's Orange Crush in 2024 and Maryland's Orange Crush plus Nevada's Picon Punch in 2025."

