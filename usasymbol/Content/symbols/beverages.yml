page:
  h1: "Official State Beverages"

  quick_answer:
    - "As of 2026, 33 U.S. states have at least one official drink-related symbol, for a total of 40 state beverage, spirit, cocktail, juice, and soft-drink designations."
    - "Milk is by far the most common choice. Twenty states designate milk as an official state beverage or state drink."
    - "Ohio was the first known state to adopt an official beverage, choosing tomato juice in 1965."
    - "Several states have more than one drink designation. Maryland, Delaware, Nebraska, South Carolina, Virginia, and Wisconsin all appear more than once on this list."
    - "The newest additions on this page include Delaware's Orange Crush in 2024 and Maryland's Orange Crush plus Nevada's Picon Punch in 2025."

  intro_paragraphs:
    - "Official state beverage designations span a broader category than the name suggests: not just state beverages and state drinks, but also state spirits, state cocktails, state juices, state soft drinks, and similar designations adopted in state law. That broader framing matters because the category is messy. Some states used a plain label like state beverage, while others carved out narrower labels such as state spirit or state hospitality beverage."
    - "The result is a fascinating mix of symbols. Many legislatures chose milk to reflect dairy farming. Others chose products tied to a signature crop, industry, or local tradition: Florida picked orange juice, Massachusetts and New Jersey chose cranberry juice, Washington chose coffee, and Rhode Island designated coffee milk. A few recent additions lean into culture more directly, such as Maryland's and Delaware's Orange Crush designations and Wisconsin's brandy old fashioned."

  insights:
    - "Milk dominates the list because state beverage designations were often used to recognize agriculture, school nutrition, and dairy cooperatives rather than a unique local recipe."
    - "Ohio's tomato juice designation in 1965 appears to be the earliest official state beverage on the books, decades before most other states joined the category."
    - "The category widened over time. Older designations usually say state beverage or state drink, while newer ones often use more specific labels like state spirit, state cocktail, or state juice."
    - "Only a handful of states use the category to promote a clearly local specialty: Maine with Moxie, Rhode Island with coffee milk, Nevada with Picon Punch, and Wisconsin with the brandy old fashioned are especially distinctive."

  methodology: "This page includes official statewide drink-related symbols. Years follow formal adoption or recognition dates."

