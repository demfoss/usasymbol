faq:
  - question: "What is the most common official state dance?"
    answer: "Square dance is the most common state dance, adopted by 25 states between 1977 and 2011 as part of a nationwide campaign by square-dance organizations."

  - question: "Which states have an official state dance that is not square dance?"
    answer: "Hawaii (hula), Kentucky and North Carolina (clogging), Pennsylvania and Wisconsin (polka), California (West Coast Swing), and Washington, D.C. (hand dancing) all named something other than square dance."

  - question: "Which states have more than one official dance designation?"
    answer: "North Carolina names clogging its state folk dance and the Carolina shag its state popular dance. South Carolina names square dance its state folk dance and the shag its state dance."

  - question: "Do all states have an official state dance?"
    answer: "No. Delaware and Minnesota both considered proposals, a maypole dance and square dance respectively, but neither became law, so both states have no official state dance."

