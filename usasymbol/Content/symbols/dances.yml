seo:
  title: "Official State Dances | List, Map & Facts"
  description: "Official state dances are listed by state, from square dance's 1970s-90s campaign to Hawaii's hula, North Carolina's clogging, and Pennsylvania's polka."

page:
  h1: "List of State Dances by State"

  quick_answer:
    - "Twenty-nine U.S. states and Washington, D.C. have legislated an official state dance, state folk dance, or state popular dance."
    - "Square dance is by far the most common pick, adopted by 25 states starting with Washington in 1979, the result of a nationwide campaign by square-dance callers and organizations through the 1970s, 1980s, and 1990s."
    - "A handful of states broke from the square-dance pattern with something specific to local tradition: Hawaii chose hula, North Carolina and Kentucky chose clogging, Pennsylvania and Wisconsin chose polka, and Washington, D.C. chose hand dancing."
    - "Some states carry two separate dance designations. North Carolina names clogging its state folk dance and the Carolina shag its state popular dance, and South Carolina names square dance its state folk dance and the shag its state dance."

  intro_paragraphs:
    - "State dances are one of the more organized corners of official state symbolism. Most of the list traces back to a single cause: square-dance callers' associations lobbying state legislatures, state by state, to name square dance an official folk dance."
    - "That campaign explains why the list looks repetitive at first glance. Twenty-five states share the same answer. What stands out are the states that chose something else entirely, a regional step-dance tradition, a partner dance born in a specific dance hall, or a movement tradition older than the state itself."
    - "A few states never adopted one at all. Delaware and Minnesota both considered proposals, a maypole dance in Delaware and square dance in Minnesota, and neither became law."

  insights:
    - "Washington was the first state to adopt square dance as its official dance, in 1979, ahead of the wave of similar designations that followed through the 1980s and 1990s."
    - "Hawaii's hula, adopted in 1999, is the only state dance tied to a documented Indigenous tradition that predates the state itself by centuries."
    - "North Carolina and South Carolina are the only two states that carry two separate official dance designations rather than one."
    - "Pennsylvania and Wisconsin both chose polka over square dance, reflecting the states' historic Central and Eastern European immigrant communities."

  sections:
    - id: dances-overview
      icon: fa-solid fa-music
      title: Official State Dances Across the U.S.
      paragraphs:
        - "The table below includes official state dances and closely related dance designations adopted by state legislatures. Most states use the label state dance or state folk dance, and a few use state popular dance for a second, more contemporary designation."
        - "Square dance accounts for the large majority of entries. States that chose something else did so to point at a tradition specific to their own history rather than a shared national campaign."

    - id: dances-why-square-dance
      icon: fa-solid fa-people-group
      title: Why So Many States Chose Square Dance
      paragraphs:
        - "Square dance's dominance on this list is not a coincidence of similar taste. Square-dance callers and dance organizations ran a sustained campaign through the 1970s, 1980s, and 1990s to get state legislatures to name it an official folk dance, and even pushed unsuccessfully for a national dance designation."
        - "That is why the adoption years cluster so tightly, most states signed on between 1977 and 1999, and why the states that resisted the trend, like Hawaii, North Carolina, and Pennsylvania, stand out as the ones with a genuinely distinct local answer."

  methodology: "This page lists official state dances and closely related dance designations as presented in state-symbol reference compilations and current public summaries. Adoption years are given as the year of legislative designation."

  sources:
