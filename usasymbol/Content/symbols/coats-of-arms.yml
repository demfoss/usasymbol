page:
  h1: "State Coats of Arms of All 50 States"

  quick_answer:
    - "Fifteen U.S. states have officially adopted formal heraldic coats of arms (shield, crest, supporters, and motto) following the European armorial tradition. The other states use the shield imagery from their state seal as their coat of arms."
    - "Maryland has the most historically significant state coat of arms: the quartered Calvert and Crossland family arms, genuine medieval English heraldry carried to America by the colony's founders in 1632 and in official use since 1876."
    - "Alabama's 1939 coat of arms is the most historically explicit. It is divided into five sections, one for each government that held sovereignty over the territory: France, Spain, Britain, the Confederacy, and the United States."
    - "Mississippi's coat of arms is the most recently redesigned; the current design was adopted in 2001. North Dakota's formal heraldic arms were adopted in 1957, relatively late for a state admitted in 1889."
    - "Oklahoma is the only U.S. state with no coat of arms. The state has only a great seal and has never formally adopted armorial bearings."

  intro_paragraphs:
    - "A coat of arms is a set of official symbols built around a central shield. A full heraldic coat of arms has four parts: the shield itself, a crest on top, two figures standing on each side (called supporters), and a motto below. Fifteen U.S. states have arms with all four parts. The other 35 states use just the shield from their state seal as their coat of arms. Same image, but without the full structure."
    - "The difference is official, not just visual. States with full heraldic arms (Maryland, New Jersey, Pennsylvania) can place them on military flags and uniforms under recognized heraldic rules. States using seal imagery do the same in practice, but the design was never formally approved as heraldic arms."
    - "Most state arms were made official in the late 1800s, when states first put their symbols into law. Some had been using these designs informally for decades before that. The adoption years in the table show when each design became law, not when it first appeared."

  insights:
    - "Fifteen states have formally adopted heraldic coats of arms: Alabama, Connecticut, Delaware, Hawaii, Louisiana, Maryland, Massachusetts, Mississippi, Missouri, New Jersey, North Dakota, Pennsylvania, Rhode Island, Texas, and Virginia."
    - "Oklahoma is the only state with no coat of arms. The Oklahoma legislature has never adopted one; the state uses its great seal in all contexts where other states would use a coat of arms."
    - "Maryland's arms follow the European armorial formula exactly: the quarterly Calvert (gold and black diagonal stripes) and Crossland (red and white crosses) design is a genuine grant from the English heraldic system, not a design created for the American context."
    - "Supporters are the figures that stand on each side of the shield as if holding it. They appear in the arms of New Jersey (Liberty and Ceres), Pennsylvania (two horses), Michigan (elk and moose), Missouri (two grizzly bears), Maine (farmer and sailor), and New York (Liberty and Justice)."
    - "North Dakota's coat of arms, adopted in 1957, uses an Indian arrowhead as the shield device and the motto 'Strength from the Soil' in plain English. Most state arms use Latin mottoes and classical imagery; North Dakota chose neither."
    - "Mississippi adopted its current coat of arms in 2001, the most recent formal adoption among U.S. states. Before 2001 it had used arms dating to 1894."
    - "The crest sits on top of the shield. Massachusetts uses an arm grasping a broadsword. Pennsylvania uses an eagle. New Jersey uses a horse's head. Connecticut, Texas, and several others use no crest at all; just the shield, which is the oldest form of armorial bearing."
    - "Idaho's coat of arms is the only one known to have been designed by a woman. Emma Edwards Green won the open design competition in 1866 and placed a woman holding scales of justice beside a miner with a pick, an unusual composition for the era."

  sections:
    - id: coats-of-arms-overview
      icon: fa-solid fa-shield-halved
      title: Coats of Arms of All 50 States
      paragraphs:
        - 'The table below covers all 50 states. States with formally adopted heraldic arms are noted by their blazon, the technical heraldic description of the design. States using their seal imagery as a non-heraldic shield are listed with the date their current design was codified into state law.'
        - 'Adoption years reflect when the current design was officially adopted by the state legislature or executive order, not the date of first use. Where a design was adopted during the territorial period and carried into statehood unchanged, the territorial adoption year is used.'
        - 'Oklahoma appears in the table as a note only. It has no coat of arms, only a great seal, and has never formally adopted armorial bearings.'

    - id: notable-arms
      icon: fa-solid fa-star
      title: Most Distinctive State Coats of Arms
      paragraphs:
        - 'These six state coats of arms are notable for historical depth, unusual symbolism, or a specific story that changes how you read the image.'
      highlights:
        - name: "Maryland: Medieval Heraldry Carried to America"
          state: maryland
          image: /images/coats-of-arms/maryland/coat-of-arms.webp
          description: "Maryland's coat of arms is quartered, alternating between the Calvert arms (gold and black diagonal stripes) and the Crossland arms (red and white crossbottony crosses). These are the genuine medieval heraldic arms of the Calvert family, who founded Maryland in 1632. They derive from a real English heraldic grant, not from a design committee. The arms were formally codified in Maryland law in 1876, but the imagery had been in use since the colonial era. No other U.S. state has coat of arms imagery with a direct, unbroken line to a real European armorial grant."

        - name: "Alabama: Five Nations in One Shield"
          state: alabama
          image: /images/coats-of-arms/alabama/coat-of-arms.webp
          description: "Alabama's 1939 coat of arms is quartered to record every national government that held sovereignty over the territory. The four quarters show the arms of France (blue with gold fleurs-de-lis), Spain (the castle and lion of Castile and León), Britain (the crosses of St. George, St. Andrew, and St. Patrick), and the United States (the national arms). A fifth section in the center, the Confederate battle flag, marks the period of secession. Two bald eagles serve as supporters. The composition is a deliberate historical inventory in heraldic form."

        - name: "New Jersey: The Most Complete Colonial Achievement"
          state: new-jersey
          image: /images/coats-of-arms/new-jersey/coat-of-arms.webp
          description: "New Jersey's coat of arms, adopted September 10, 1776, less than three months after the Declaration of Independence, is one of the most formally complete in the country. The shield bears three ploughs. Liberty and Ceres (goddess of agriculture) serve as supporters. A horse's head forms the crest above. The motto 'Liberty and Prosperity' appears on the scroll below with the date 1776. It follows the full European armorial formula and was designed in the first months of American independence."

        - name: "North Dakota: Arrowhead and Motto"
          state: north-dakota
          image: /images/coats-of-arms/north-dakota/coat-of-arms.webp
          description: "North Dakota's coat of arms, adopted in 1957, stands apart from most state arms in its directness. The shield shows an Indian arrowhead in gold with a green bend bearing three gold stars. Above, an arrowhead crest with a bow. The motto, 'Strength from the Soil', is in plain English rather than Latin, naming the state's agricultural foundation directly. It was adopted 68 years after statehood, when most states had long since codified their symbols. The simplicity is deliberate."

        - name: "Pennsylvania: Two Horses, Three Industries"
          state: pennsylvania
          image: /images/coats-of-arms/pennsylvania/coat-of-arms.webp
          description: "Pennsylvania's coat of arms, formally adopted in 1875, is one of the most complete heraldic achievements among U.S. states. The shield is divided into three sections: a ship at sea (commerce), a plow (agriculture), and three sheaves of wheat (the land's productivity). Two horses serve as supporters. An eagle forms the crest. The motto 'Virtue, Liberty, and Independence' appears below. The two horse supporters are unusual in U.S. state heraldry, which more often uses human figures or regional animals."

        - name: "Virginia: Virtus in 1776"
          state: virginia
          image: /images/coats-of-arms/virginia/coat-of-arms.webp
          description: "Virginia's coat of arms dates to 1776, the first year of the Revolution, and was re-adopted formally in 1976. The shield shows Virtus, the Roman goddess of virtue, standing with spear and sword over a fallen king whose crown has rolled away on the ground. The motto 'Sic Semper Tyrannis' (Thus always to tyrants) identifies the scene directly. It was not designed as allegory; it was designed as a statement of intent in the first weeks of armed rebellion against the British Crown."

  methodology: "Adoption years follow Wikipedia's Armorial of the United States and state legislative records. For states that adopted arms during the territorial period, the territorial adoption year is used. Oklahoma has no coat of arms and is listed as such."

  sources:
    - name: "Wikipedia, Armorial of the United States"
      url: "https://en.wikipedia.org/wiki/Armorial_of_the_United_States"
      description: "Comprehensive list of U.S. state coats of arms with adoption years, heraldic blazons, and classification as heraldic or non-heraldic."
