      symbol_image: "/images/coats-of-arms/north-dakota/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of North Dakota"
      coat_of_arms_slug: "coat-of-arms-of-north-dakota"
      adopted_year: 1957
      short_fact: "Heraldic. An Indian arrowhead on a gold field with a green bend and three stars; arrows and a bow as crest, motto 'Strength from the Soil' in plain English, adopted 68 years after statehood."

    - state: "Ohio"
      state_slug: "ohio"
      symbol_image: "/images/coats-of-arms/ohio/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Ohio"
      coat_of_arms_slug: "coat-of-arms-of-ohio"
      adopted_year: 1803
      short_fact: "Non-heraldic seal shield. A rising sun over Mount Logan and the Scioto River with 13 arrows and 17 stars, Ohio was the 17th state. Design modified in 1953 and 1996."

    - state: "Oklahoma"
      state_slug: "oklahoma"
      symbol_image: "/images/seals/oklahoma/seal.webp"
      coat_of_arms_name: "No Coat of Arms (Seal Only)"
      coat_of_arms_slug: "great-seal-of-oklahoma"
      adopted_year: 1907
      short_fact: "Oklahoma has no coat of arms, the only U.S. state in this category. The state uses its great seal in all contexts. The seal's central star shows the Five Civilized Tribes; 45 outer stars mark the states at admission."

    - state: "Oregon"
      state_slug: "oregon"
      symbol_image: "/images/coats-of-arms/oregon/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Oregon"
      coat_of_arms_slug: "coat-of-arms-of-oregon"
      adopted_year: 1859
      short_fact: "Non-heraldic seal shield. A British ship departing and an American ship arriving in the Pacific, with a covered wagon heading west and a beaver as crest, the only state with different imagery on each side."

    - state: "Pennsylvania"
      state_slug: "pennsylvania"
      symbol_image: "/images/coats-of-arms/pennsylvania/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Pennsylvania"
      coat_of_arms_slug: "coat-of-arms-of-pennsylvania"
      adopted_year: 1875
      short_fact: "Heraldic. Two horses as supporters, an eagle as crest, and a shield tierced with a ship, a plough, and three sheaves of wheat, motto 'Virtue, Liberty, and Independence.' Formally adopted 1875."

    - state: "Rhode Island"
      state_slug: "rhode-island"
      symbol_image: "/images/coats-of-arms/rhode-island/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Rhode Island"
      coat_of_arms_slug: "coat-of-arms-of-rhode-island"
      adopted_year: 1882
      short_fact: "Heraldic. A gold anchor on a blue field with 13 stars and the single-word motto 'Hope', formally adopted 1882, based on imagery in continuous use since 1647."

    - state: "South Carolina"
      state_slug: "south-carolina"
      symbol_image: "/images/coats-of-arms/south-carolina/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of South Carolina"
      coat_of_arms_slug: "coat-of-arms-of-south-carolina"
      adopted_year: 1776
      short_fact: "Non-heraldic seal shield. Two ovals: a palmetto standing over a fallen British oak (the 1776 Battle of Sullivan's Island), and a woman under 'Dum Spiro Spero' (While I breathe, I hope)."

    - state: "South Dakota"
      state_slug: "south-dakota"
      symbol_image: "/images/coats-of-arms/south-dakota/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of South Dakota"
      coat_of_arms_slug: "coat-of-arms-of-south-dakota"
      adopted_year: 1889
      short_fact: "Non-heraldic seal shield. A steamboat on the Missouri River, a smelting furnace, and farmers in open fields under a sun, the industries of the Dakota Territory in 1889."

    - state: "Tennessee"
      state_slug: "tennessee"
      symbol_image: "/images/coats-of-arms/tennessee/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Tennessee"
      coat_of_arms_slug: "coat-of-arms-of-tennessee"
      adopted_year: 1802
      short_fact: "Non-heraldic seal shield. A plow and sheaf of wheat labeled 'Agriculture,' a riverboat labeled 'Commerce', the two economic foundations, named in plain English rather than allegory."

    - state: "Texas"
      state_slug: "texas"
      symbol_image: "/images/coats-of-arms/texas/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Texas"
      coat_of_arms_slug: "coat-of-arms-of-texas"
      adopted_year: 1839
      short_fact: "Heraldic. A lone star circled by live oak and olive branches, adopted January 25, 1839 by the Republic of Texas, and carried unchanged into U.S. statehood in 1845."

    - state: "Utah"
      state_slug: "utah"
      symbol_image: "/images/coats-of-arms/utah/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Utah"
      coat_of_arms_slug: "coat-of-arms-of-utah"
      adopted_year: 1850
      short_fact: "Non-heraldic seal shield. A beehive (Deseret, the Mormon symbol of industry) flanked by Utah sego lilies, with an eagle above and crossed U.S. flags. Arms date to the territorial period."

    - state: "Vermont"
      state_slug: "vermont"
      symbol_image: "/images/coats-of-arms/vermont/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Vermont"
      coat_of_arms_slug: "coat-of-arms-of-vermont"
      adopted_year: 1779
      short_fact: "Non-heraldic seal shield. A pine tree, a cow, and sheaves of wheat, plain agrarian imagery designed in 1779 while Vermont was still an independent republic before joining the Union."

    - state: "Virginia"
      state_slug: "virginia"
      symbol_image: "/images/coats-of-arms/virginia/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Virginia"
      coat_of_arms_slug: "coat-of-arms-of-virginia"
      adopted_year: 1776
      short_fact: "Heraldic. Virtus stands with one foot on a fallen king whose crown rolls away, 'Sic Semper Tyrannis' (Thus always to tyrants). Designed in 1776; re-adopted formally June 3, 1976."

    - state: "Washington"
      state_slug: "washington"
      symbol_image: "/images/coats-of-arms/washington/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Washington"
      coat_of_arms_slug: "coat-of-arms-of-washington"
      adopted_year: 1854
      short_fact: "Non-heraldic seal shield. A portrait of George Washington copied from Gilbert Stuart's 1796 painting, the only state coat of arms to feature the face of a real historical person. Territory arms adopted 1854."

    - state: "West Virginia"
      state_slug: "west-virginia"
      symbol_image: "/images/coats-of-arms/west-virginia/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of West Virginia"
      coat_of_arms_slug: "coat-of-arms-of-west-virginia"
      adopted_year: 1863
      short_fact: "Non-heraldic seal shield. A farmer and a miner flank a rock inscribed June 20, 1863; crossed rifles record the Civil War context of the state's founding. Motto: 'Montani Semper Liberi' (Mountaineers are always free)."

    - state: "Wisconsin"
      state_slug: "wisconsin"
      symbol_image: "/images/coats-of-arms/wisconsin/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Wisconsin"
      coat_of_arms_slug: "coat-of-arms-of-wisconsin"
      adopted_year: 1851
      short_fact: "Non-heraldic seal shield with supporters. A sailor and a miner flank a quartered shield with a plow, an arm and hammer, an anchor, and a pick and shovel, a badger as the crest above."

    - state: "Wyoming"
      state_slug: "wyoming"
      symbol_image: "/images/coats-of-arms/wyoming/coat-of-arms.webp"
      coat_of_arms_name: "Coat of Arms of Wyoming"
      coat_of_arms_slug: "coat-of-arms-of-wyoming"
      adopted_year: 1868
      short_fact: "Non-heraldic seal shield. A woman on a pedestal between a cowboy and a miner, with the motto 'Equal Rights', Wyoming was the first U.S. territory to grant women the vote, in 1869."
