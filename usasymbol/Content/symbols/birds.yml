sections:
  - id: most-popular-birds
    icon: fa-solid fa-ranking-star
    title: The Birds States Reused Most Often
    paragraphs:
      - "The Northern Cardinal leads the list with seven states: Illinois, Indiana, Kentucky, North Carolina, Ohio, Virginia, and West Virginia. That tells you less about rarity than about visibility. Cardinals are bright, easy to identify, and present in winter, so they work well as a public symbol."
      - "Six Plains and Interior West states share the Western Meadowlark: Kansas, Montana, Nebraska, North Dakota, Oregon, and Wyoming. The geographic cluster isn't accidental. These were states where open grassland and ranch country defined the landscape, and the meadowlark was the bird you heard on fence posts every morning. For most of these designations from the 1920s–1940s, the choice wasn't really debated."
      - "The Northern Mockingbird spread across five Southern states — Arkansas, Florida, Mississippi, Tennessee, and Texas — in a tight window from 1927 to 1944. That timing lines up with coordinated bird designation campaigns run by women's clubs and Audubon groups across the South. The mockingbird wasn't selected because it was rare or distinctive. It was selected because every Southerner already knew it."
  - id: unique-state-birds
    icon: fa-solid fa-star
    title: Choices That Feel Specific to One State
    paragraphs:
      - Some state birds read like a generic American bird list. Others are hard to separate from place. Hawaii's Nene is the clearest example because it is native to the islands and does not make sense as a symbol anywhere else.
      - Minnesota's Common Loon and Louisiana's Brown Pelican also feel tightly matched to state identity. The loon fits Minnesota's lake-country image so well that it has become more than a legal symbol. In Louisiana, the pelican shows up across state branding, including the nickname 'Pelican State'.
      - New Mexico's Greater Roadrunner, Arizona's Cactus Wren, and Oklahoma's Scissor-tailed Flycatcher are also strong fits because they immediately evoke a landscape. You can picture the habitat before you even get to the state name.
  - id: non-native-birds
    icon: fa-solid fa-question
    title: Domestic Birds and Other Unusual Picks
    paragraphs:
      - Delaware and Rhode Island break the pattern completely. Delaware chose the Blue Hen, and Rhode Island chose the Rhode Island Red. Both are domestic chickens, which means not every state bird was selected as a wildlife emblem.
      - Those two cases show how far the idea of a state bird can stretch. Delaware's choice comes out of Revolutionary War-era military identity. Rhode Island's choice reflects local breeding and agricultural history. In both cases, the bird functions more like a cultural artifact than a field-guide species.
      - South Dakota's Ring-necked Pheasant is another reminder that symbolism is not the same thing as nativeness. It became important through hunting culture and rural identity. Utah's California Gull also came from a historical episode people wanted to remember, not from a simple 'what bird best lives here' exercise.
  - id: birds-in-danger
    icon: fa-solid fa-triangle-exclamation
    title: What This List Hides About Conservation
    paragraphs:
      - "A state bird can look permanent on paper while its real-world status changes. Hawaii's Nene is the clearest example: it became a symbol, then nearly disappeared, and now depends on sustained conservation work."
      - Louisiana's Brown Pelican tells a different story. The species vanished from the state during the DDT era and later returned after regulation and restoration. That makes it one of the few state birds whose official status is tied to a widely recognized conservation collapse and recovery.
      - Loons are affected by water quality and lead fishing tackle. Meadowlarks have lost habitat as grassland is converted to row crops. The designation doesn't change — but the pressures on these birds don't pause because a state once named one its symbol.
  - id: how-chosen
    icon: fa-solid fa-check-to-slot
    title: How States Actually Picked Them
    paragraphs:
      - Most designations came in a fairly tight window, especially from the late 1920s through the 1950s. That was the main state-symbol era, and birds were often promoted through women's clubs, Audubon groups, teachers, and student votes.
      - Kentucky was first in 1926 with the Northern Cardinal. A large cluster followed quickly in 1927, including Alabama, Florida, Maine, Missouri, Oregon, Texas, and Wyoming. Once the pattern was established, other states filled in the gap rather than inventing a new tradition.
      - This helps explain why so many states chose familiar, noncontroversial birds. The process was public-facing. It rewarded birds people recognized, birds children could vote for, and birds civic groups could defend without much technical debate.
  - id: bird-families
    icon: fa-solid fa-feather
    title: Songbirds Dominate, But Not Entirely
    paragraphs:
      - The list is dominated by songbirds. Cardinals, meadowlarks, mockingbirds, robins, bluebirds, chickadees, and wrens account for a large share of the map. States generally favored birds people could hear and identify without specialist knowledge.
      - Game birds and water birds are much less common. California Quail, Ruffed Grouse, Ring-necked Pheasant, and Willow Ptarmigan stand apart from the usual backyard pattern. So do the Common Loon, Brown Pelican, Nene, and California Gull.
      - "New York's Eastern Bluebird, adopted in 1970, is the most recent designation on the list — more than four decades after the early wave. Nearly all state birds were locked in before 1960 and have never been reconsidered. The list is largely a snapshot of civic culture and backyard familiarity from a specific mid-century moment, not an ongoing ecological assessment."
faq:
  - question: What is the most common state bird?
    answer: "The Northern Cardinal is the most common state bird, representing 7 states: Illinois, Indiana, Kentucky, North Carolina, Ohio, Virginia, and West Virginia. The Western Meadowlark is second with 6 states, and the Northern Mockingbird is third with 5 states."
  - question: Which state has the cardinal as its state bird?
    answer: "Seven states have the Northern Cardinal as their state bird: Illinois, Indiana, Kentucky, North Carolina, Ohio, Virginia, and West Virginia. Kentucky was the first to adopt the cardinal in 1926."
  - question: What is California's state bird?
    answer: California's state bird is the California Quail (Callipepla californica), adopted in 1931. The species is native to California's valleys and foothills and is recognizable by the curved head plume of the male.
  - question: What is Texas's state bird?
    answer: "Texas's state bird is the Northern Mockingbird (Mimus polyglottos), adopted in 1927 — one of the earliest state bird designations in the country. Texas is the largest of the five states to use the mockingbird; the others are Arkansas, Florida, Mississippi, and Tennessee, all of which chose it in a tight window between 1927 and 1944."
  - question: What is the rarest state bird?
    answer: Hawaii's Nene is usually treated as the rarest state bird because it is endemic to Hawaii and suffered a severe mid-20th-century population collapse. It remains far less common than the widespread backyard species used by many other states.
  - question: Which state has a chicken as its state bird?
    answer: "Two states have chickens as state birds: Delaware (Blue Hen Chicken, adopted 1939) and Rhode Island (Rhode Island Red, adopted 1954). These are the only states with domestic birds rather than wild species as their official state birds."
  - question: What is New York's state bird?
    answer: New York's state bird is the Eastern Bluebird (Sialia sialis), adopted in 1970 — the most recent state bird designation in the country. Missouri also uses the Eastern Bluebird as its state bird.
  - question: What is Florida's state bird?
    answer: "Florida's state bird is the Northern Mockingbird (Mimus polyglottos), adopted in 1927. Florida was among the first states to make an official bird designation. The same bird was chosen independently across five Southern states between 1927 and 1944, reflecting coordinated Audubon and civic campaigns during that era."
  - question: What is the state bird of each state?
    answer: "Every U.S. state has one officially designated bird. The most commonly shared species are: Northern Cardinal (7 states: Illinois, Indiana, Kentucky, North Carolina, Ohio, Virginia, West Virginia), Western Meadowlark (6 states: Kansas, Montana, Nebraska, North Dakota, Oregon, Wyoming), and Northern Mockingbird (5 states: Arkansas, Florida, Mississippi, Tennessee, Texas). The remaining 32 states each have a distinct species. The full alphabetical list with scientific names and adoption years is in the table on this page."
  - question: Is the eagle a state bird?
    answer: No state uses the Bald Eagle as its official state bird. The Bald Eagle is the national bird of the United States, while state bird designations are separate.
  - question: What state bird isn't actually a wild bird?
    answer: Two state birds are domestic animals rather than wild species. Delaware's Blue Hen Chicken (1939) is a fighting breed associated with Revolutionary War soldiers. Rhode Island's Rhode Island Red (1954) is a heritage chicken breed developed in the state. South Dakota's Ring-necked Pheasant and Utah's California Gull are wild birds but were introduced or are non-native to their states.
  - question: Where can I download a printable list of state birds in alphabetical order?
    answer: Use the download button on this page to get the printable PDF. It includes all 50 state birds in alphabetical order with common names, scientific names, and adoption years.
