seo:
  title: "State Birds of All 50 States: Pictures, Scientific Names & Adoption Years"
  description: "Alphabetical list of all 50 state birds with pictures, scientific names, and adoption years, including birds shared by multiple states."

page:
  h1: "State Birds of All 50 States"
  
  quick_answer:
    - "The Northern Cardinal is the most common state bird, representing 7 states: Illinois, Indiana, Kentucky, North Carolina, Ohio, Virginia, and West Virginia."
    - "The Western Meadowlark is second with 6 states: Kansas, Montana, Nebraska, North Dakota, Oregon, and Wyoming."
    - "The Northern Mockingbird represents 5 states: Arkansas, Florida, Mississippi, Tennessee, and Texas."
    - "Two states use domestic birds rather than wild species: Delaware's Blue Hen and Rhode Island's Rhode Island Red."
  intro_paragraphs:
    - The outliers are more revealing than the repeats. Delaware and Rhode Island chose domestic chickens. Hawaii chose the Nene, a goose found naturally only in the islands. Utah chose the California Gull because of a specific pioneer-era story, not because the bird is uniquely Utah. The table below is useful as a checklist, but the pattern across the list is what makes state birds interesting.
  insights:
    - "The same small set of birds dominates the map: cardinal, meadowlark, and mockingbird account for 18 states."
    - Regional familiarity mattered more than rarity. States usually picked birds people heard in fields, towns, gardens, and fence lines.
    - A few designations are plainly historical rather than zoological, especially Delaware's Blue Hen and Utah's California Gull.
    - Endemic or strongly place-specific choices are less common, which is why Hawaii's Nene and Minnesota's Common Loon stand out.
    - The list mixes wild species, domestic breeds, game birds, and birds chosen for symbolism, not just for ecology.
  methodology: This page lists the officially recognized bird for each U.S. state. Adoption years reflect the designation year used in state law, resolution, or other official state references. Scientific names follow modern ornithological usage.
