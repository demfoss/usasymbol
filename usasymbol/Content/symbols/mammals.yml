seo:
  title: "U.S. State Mammals by State: Official Mammals, Marine Mammals & More"
  description: "Explore U.S. state mammals by state, including official mammals, marine mammals, and other mammal designations."

page:
  h1: "U.S. State Mammals by State"
  
  quick_answer:
    - "The White-tailed deer is the most designated state mammal, representing 11 states including Pennsylvania, Ohio, Illinois, and South Carolina."
    - "Three states — Kansas, Oklahoma, and Wyoming — chose the American Bison, the national mammal of the United States since 2016."
    - "California's state animal is the Grizzly bear, even though grizzlies have been extinct in the state since 1924."
    - "Indiana, Iowa, and Minnesota have not designated any official state mammal."

  intro_paragraphs:
    - "State mammals (also called state animals in many states) honor wildlife that played a role in a state's history, ecology, or cultural identity. Unlike birds and flowers, which were mostly adopted in the early 1900s, most state mammal designations came later — between the 1950s and 2000s. Many states designate multiple mammals in separate categories: land mammal, marine mammal, state dog, state horse, or state cat."
    - "The selections range from charismatic megafauna like grizzly bears and bison to smaller creatures like squirrels and raccoons. Several states chose domesticated animals — Missouri's official state animal is the Missouri Mule, and New Jersey designated the horse. The tables below organize each state's mammal designations by category."    

  insights:
    - "The White-tailed deer dominates state mammal selections with 11 states, reflecting its abundance — an estimated 30 million roam the U.S. today."
    - "Several states designate shelter or rescue animals. Colorado named 'shelter dogs and cats' as its official state pets in 2013. Tennessee and Georgia followed with similar designations."
    - "The Black bear represents four states: Alabama, Louisiana, New Mexico, and West Virginia. The American Bison represents three: Kansas, Oklahoma, and Wyoming."
    - "Florida has the most mammal designations of any state — five: Florida Panther, Manatee, Dolphin, Florida Cracker Horse, and Bottlenose Dolphin."
    - "Texas designated three mammals in a single bill in 1995: the Nine-banded Armadillo (small mammal), Texas Longhorn (large mammal), and Mexican Free-tailed Bat (flying mammal)."
 
  methodology: "This list includes all official state mammal designations for the 50 U.S. states as enacted by state legislatures. Mammals are organized by category: land mammals, marine mammals, state dogs, state horses, state cats, and other designations. States without any mammal designation are noted."
  
  sources:
    - name: "National Wildlife Federation"
      url: "https://www.nwf.org/"
      description: "Wildlife identification and conservation information"
    - name: "State legislative archives"
      url: ""
      description: "Official state statutes and legislative records for each designation"

