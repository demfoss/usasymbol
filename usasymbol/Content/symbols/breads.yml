seo:
  title: State Breads | Official List, Map & Facts
  description: South Dakota named frybread and Texas named pan de campo as official state bread, both in 2005. Neither is a loaf.
page:
  h1: List of State Breads
  quick_answer:
  - "South Dakota named frybread its official state bread in 2005, a fried dough tied to the state's tribal nations."
  - "Texas chose pan de campo the same year, a cowboy bread baked in a Dutch oven over open fires on cattle drives and ranches."
  intro_paragraphs:
  - "Only two states have a state bread, and neither picked a bakery loaf. Both chose a bread with a story behind it."
  sections:
  - id: breads-overview
    icon: fa-solid fa-bread-slice
    title: Official State Breads by State
    paragraphs:
    - "Frybread is made from a simple dough of flour, salt and baking powder, fried in hot oil until it puffs. It is often traced to the Navajo Long Walk of the 1860s, when families forced from their homes had only government rations of flour and lard. South Dakota links it to the nine tribal nations within its borders."
    - "Pan de campo means camp bread. Vaqueros and later cowboys baked it in cast-iron Dutch ovens buried in coals, which let a trail crew bake without a kitchen. Other baked goods, including muffins, doughnuts and pastries, are on the [State Desserts & Sweets](/symbols/desserts) list."
  methodology: Adoption years reflect the year of official legislative designation.
