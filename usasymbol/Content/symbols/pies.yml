seo:
  title: State Pies | Official List, Map & Facts
  description: Florida, Illinois, Texas, Vermont and Louisiana have an official state pie. Delaware and Maine named a pie as their state dessert instead.
page:
  h1: List of State Pies
  quick_answer:
  - "Vermont named apple pie its official state pie in 1999, the first of any state. Florida, Texas and Illinois followed with Key lime, pecan and pumpkin, and Louisiana added a savory meat pie."
  - "Louisiana's Natchitoches meat pie, named in 2003, is the only savory entry. It is a fried pastry filled with seasoned meat, not a dessert."
  intro_paragraphs:
  - "Most state pies come straight from the farm. Florida has the Key lime, Texas the pecan, Illinois the pumpkin and Vermont the apple, each a crop the state is proud of."
  - "Delaware (peach pie) and Maine (wild blueberry pie) also honor a pie, but they filed it under state dessert. Both are on the [State Desserts & Sweets](/symbols/desserts) list."
  sections:
  - id: pies-overview
    icon: fa-solid fa-utensils
    title: Official State Pies by State
    paragraphs:
    - "Vermont's 1999 law goes further than naming the pie. It recommends eating apple pie with milk, cheddar cheese or ice cream. Florida's Key lime pie came in 2006 and takes its name from the small, tart limes of the Florida Keys, mixed with sweetened condensed milk."
    - "Texas chose pecan pie in 2013, which suits a state whose official tree is the pecan. Illinois picked pumpkin pie in 2016. Morton, Illinois, calls itself the pumpkin capital of the world, and most of the pumpkin in canned pie filling is grown in the state."
  - id: pies-savory
    icon: fa-solid fa-drumstick-bite
    title: Louisiana's Official Meat Pie
    paragraphs:
    - "Louisiana skipped fruit and nuts. In 2003 it named the Natchitoches meat pie, a half-moon pastry stuffed with spiced beef and pork and fried until crisp. Natchitoches, founded in 1714, is the oldest settlement in the state, and the pie has been a local staple there for generations."
  methodology: Adoption years reflect the year of official legislative designation.
