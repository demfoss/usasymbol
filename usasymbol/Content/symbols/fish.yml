faq:
  - question: "What is the most common state fish?"
    answer: "The brook trout. It is an official fish in eight states, mostly in the Northeast and the Appalachian Mountains. The striped bass is close behind."
  - question: "Which state has the most state fish?"
    answer: "Georgia has three. The largemouth bass is the state fish, the red drum is the state saltwater fish, and the Southern Appalachian brook trout is the state cold water game fish."
  - question: "Which states do not have a state fish?"
    answer: "Indiana, Iowa, and Ohio have not named an official state fish."
  - question: "What is Hawaii's state fish?"
    answer: "Hawaii's state fish is the reef triggerfish, known in Hawaiian as the humuhumunukunukuāpuaʻa. It lives on the coral reefs around the islands."
  - question: "Why do some states have a freshwater and a saltwater fish?"
    answer: "Coastal states have both rivers and ocean, and anglers fish both. Naming two fish lets a state honor a favorite from each kind of water."
