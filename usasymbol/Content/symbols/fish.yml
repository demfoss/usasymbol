seo:
  title: "State Fish | Official List, Map & Facts"
  description: "Every official state fish by state, from brook trout and striped bass to Hawaii's reef triggerfish, with adoption years and where each one lives."

page:
  h1: "List of State Fish"

  quick_answer:
    - "A state fish is an official fish chosen by a state, usually by state lawmakers, to represent its rivers, lakes, or coast."
    - "The brook trout is the most popular choice. It is an official fish in eight states, and the striped bass follows close behind."
    - "Some states have more than one, such as a freshwater fish and a saltwater fish. Georgia has three."

  intro_paragraphs:
    - "States pick their fish for different reasons. Some chose a native fish found almost nowhere else, like the Apache trout in Arizona or the golden trout in California. Others picked a famous sport fish that brings anglers to their waters."
    - "Coastal states often split the honor. Florida and New York each have one fish for fresh water and another for salt water."

  sections:
    - id: fish-overview
      icon: fa-solid fa-fish
      title: Official State Fish of U.S. States
      paragraphs:
        - "The table below lists every official state fish designation with its type, adoption year, and a short note. States that have not named a fish, such as Indiana, Iowa, and Ohio, are not listed."

  methodology: "Each designation was checked against state statutes and official state sources. When a law uses an older scientific name, the current accepted name is shown. Adoption years reflect the year the designation became official."

  sources:
