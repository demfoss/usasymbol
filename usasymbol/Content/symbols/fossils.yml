seo:
  title: "State Fossils of All 50 States | Pictures & Facts"
  description: "Nebraska designated the first state fossil in 1967. Official list of all 44 U.S. state fossils with images, scientific names, and adoption years by state."

page:
  h1: "State Fossils of All 50 States"

  quick_answer:
    - "State fossils are official prehistoric symbols designated by state legislatures, separate from state dinosaurs and state stones. Nebraska and North Dakota were the first to act, both in 1967; 44 states have designated one as of 2026."
    - "Six states still lack an official state fossil: Arkansas, Florida, Hawaii, Iowa, New Hampshire, and Texas. Several have state dinosaurs but no state fossil."
    - "The mammoth is the most popular choice: eight states have designated a mammoth or mastodon. Kansas is the only state with two official state fossils adopted in the same year, a flying reptile and a marine reptile, both from 2014."
    - "Rhode Island adopted its state fossil (the trilobite) in 2023, making it the most recent designation. Minnesota adopted the giant beaver in 2025."

  intro_paragraphs:
    - "State fossils are official prehistoric symbols designated by state legislatures, separate from state dinosaurs, state stones, and state minerals. Most were adopted during the 1980s, following major fossil discoveries across the American West. The designated species range from [dinosaurs](/symbols/dinosaurs) like Stegosaurus and Triceratops to ancient whales, trilobites, mammoth teeth, and fossil plants."
    - "The United States holds some of the richest fossil beds on Earth: the Morrison Formation in Colorado and Utah, the Hell Creek Formation in Montana and South Dakota, the Green River Formation in Wyoming, and the La Brea Tar Pits in California. State fossil designations reflect these local discoveries. Utah's Allosaurus came from a quarry with over 60 specimens; Nebraska's woolly mammoth 'Archie' is the largest mammoth skeleton ever found; Montana designated Maiasaura because one of the first dinosaur nesting sites was discovered there."
    - "Six states have not designated a state fossil as of 2026. Florida's state stone, agatized coral, is technically a fossil but has never been formally reclassified. Iowa's proposed crinoid designation failed to pass in 2018. New Hampshire considered the mastodon in 2015 without action. Texas has a [state dinosaur](/symbols/dinosaurs) but no state fossil."

  insights:
    - "Nebraska and North Dakota acted first in 1967, twenty years before most states followed. The 1980s produced the biggest wave: sixteen states designated their fossils in that decade alone."
    - "The woolly mammoth or Columbian mammoth appears in eight states. Trilobites are the second most common choice, adopted by five states: Kentucky, New York, Pennsylvania, Rhode Island, and Wisconsin."
    - "Vermont is the only state with two separate official fossil categories: a state terrestrial fossil (woolly mammoth, 2014) and a state marine fossil (beluga whale skeleton, 1993). The beluga is the only state fossil from a species still alive today."
    - "Kansas's 2014 designation named two fossils simultaneously: Pteranodon (state flying fossil) and Tylosaurus (state marine fossil), both from the Western Interior Seaway that covered Kansas during the Cretaceous."
    - "Rhode Island's 2023 designation is the least specific of all: it names 'trilobite' without specifying genus or species. South Carolina's 2014 mammoth bill was nearly amended to add Genesis language; the religious text was removed before passage."
    - "Illinois's Tully Monster (Tullimonstrum gregarium) is so unusual that paleontologists still debate what phylum it belongs to. It resembles no known modern animal group and has been found only in the Mazon Creek beds of northeastern Illinois."
    - "Idaho's Hagerman Horse is one of the oldest Equus species and resembles the modern African zebra more than a modern horse. Nearly 200 skeletons have been recovered from the Hagerman Fossil Beds National Monument."

  sections:
    - id: fossils-overview
      icon: fa-solid fa-bone
      title: State Fossils of All 50 States
      paragraphs:
        - "State fossils are official prehistoric symbols designated by state legislatures. Nebraska and North Dakota were the first to act in 1967; Rhode Island was the most recent in 2023. Most designations came during the 1980s, following heightened public interest in paleontology and major fossil discoveries across the American West."
        - "Designated species reflect each state's paleontological heritage. Utah named the Allosaurus because over 60 specimens came from a single Utah quarry. Wyoming chose Knightia because thousands of these fossil fish are recovered from the Green River Formation. Montana designated Maiasaura because one of the first dinosaur nesting sites on record was found there in the 1970s."

    - id: states-without-fossils
      icon: fa-solid fa-circle-question
      title: States Without an Official Fossil
      paragraphs:
        - "Six states have not designated an official state fossil as of 2026. Arkansas has Arkansaurus fridayi as its state dinosaur but no state fossil. Florida's agatized coral is the state stone but has never been officially reclassified as a state fossil. Hawaii's volcanic geology makes fossils rare, and the legislature has not designated any."
        - "Iowa's crinoid proposal in 2018 never passed. New Hampshire considered the American mastodon in 2015 without final action. Texas has Sauroposeidon proteles as its state dinosaur and petrified Palmoxylon as its state stone (technically a fossil), but no formal state fossil designation exists."

