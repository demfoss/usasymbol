faq:
  - question: "Which state was the first to designate a state fossil?"
    answer: "Nebraska and North Dakota were tied as the first, both designating state fossils in 1967. Nebraska chose the woolly mammoth; North Dakota chose Teredo petrified wood, shipworm-bored fossil wood from the Paleocene period."

  - question: "How many states have an official state fossil?"
    answer: "As of 2026, 44 states have an official state fossil. Six states have not designated one: Arkansas, Florida, Hawaii, Iowa, New Hampshire, and Texas. Some of these have state dinosaurs or state stones that are technically fossils."

  - question: "What is the most popular state fossil?"
    answer: "The mammoth or mastodon is the most popular choice, designated by eight states: Alaska (woolly mammoth), Indiana and Michigan (mastodon), Minnesota (giant beaver, 2025), Nebraska (three mammoth species), South Carolina and Washington (Columbian mammoth), and Vermont (woolly mammoth, state terrestrial fossil)."

  - question: "What is the most recently designated state fossil?"
    answer: "Rhode Island designated the trilobite as its state fossil in 2023, making it the most recent designation. Minnesota designated the giant beaver (Castoroides ohioensis) in 2025."

  - question: "What state has two official state fossils?"
    answer: "Several states have two. Kansas designated the Pteranodon (flying fossil) and Tylosaurus (marine fossil) in 2014. Ohio has the trilobite (1985) and Dunkleosteus (2021). Vermont has a state marine fossil (beluga whale, 1993) and a state terrestrial fossil (woolly mammoth, 2014)."

  - question: "Is a state fossil the same as a state dinosaur?"
    answer: "No. State fossils and state dinosaurs are separate designations. A state may have both, one, or neither. Arkansas, Texas, and the District of Columbia have state dinosaurs but no state fossils. Many states with state fossils do not have a separate state dinosaur designation."

