  rows:
    - state: "Alabama"
      state_slug: "alabama"
      symbol_image: "/images/fossils/alabama.jpg"
      fossil_name: "Basilosaurus Whale"
      scientific_name: "Basilosaurus cetoides"
      age: "Eocene"
      year_adopted: 1984
      short_fact: "An ancient whale 40–60 feet long. Alabama fossils cannot be removed from the state without the governor's written approval."

    - state: "Alaska"
      state_slug: "alaska"
      symbol_image: "/images/fossils/alaska.jpg"
      fossil_name: "Woolly Mammoth"
      scientific_name: "Mammuthus primigenius"
      age: "Pleistocene"
      year_adopted: 1986
      short_fact: "Mammoth fossils are routinely uncovered by Alaskan gold miners as stream banks erode. The woolly mammoth is one of the most commonly found Pleistocene mammals in Alaska."

    - state: "Arizona"
      state_slug: "arizona"
      symbol_image: "/images/fossils/arizona.jpg"
      fossil_name: "Petrified Wood"
      scientific_name: "Araucarioxylon arizonicum"
      age: "Triassic"
      year_adopted: 1988
      short_fact: "The most abundant fossil tree in Arizona's Petrified Forest National Park, deposited approximately 225 million years ago during the Triassic period."

    - state: "Arkansas"
      state_slug: "arkansas"
      symbol_image: ""
      fossil_name: "None designated"
      scientific_name: ""
      age: ""
      year_adopted: null
      short_fact: "Arkansas has no official state fossil. Arkansaurus fridayi is the state dinosaur, but no separate state fossil has been legislated."

    - state: "California"
      state_slug: "california"
      symbol_image: "/images/fossils/california.jpg"
      fossil_name: "Saber-Toothed Cat"
      scientific_name: "Smilodon fatalis"
      age: "Pleistocene"
      year_adopted: 1974
      short_fact: "Thousands of Smilodon specimens have been recovered from the La Brea Tar Pits in Los Angeles, the richest single source of Pleistocene mammals in the world."

    - state: "Colorado"
      state_slug: "colorado"
      symbol_image: "/images/fossils/colorado.jpg"
      fossil_name: "Stegosaurus"
      scientific_name: "Stegosaurus armatus"
      age: "Jurassic"
      year_adopted: 1982
      short_fact: "One of the most recognizable dinosaurs ever found, with fossils in the Jurassic Morrison Formation of Colorado. Despite weighing 5–10 tons, its brain was roughly the size of a walnut."

    - state: "Connecticut"
      state_slug: "connecticut"
      symbol_image: "/images/fossils/connecticut.jpg"
      fossil_name: "Dinosaur Tracks"
      scientific_name: "Eubrontes giganteus"
      age: "Jurassic"
      year_adopted: 1991
      short_fact: "These three-toed tracks in the Connecticut Valley's sandstone were the first dinosaur fossils discovered in North America. The species that made them remains unknown; no skeleton has been found."

    - state: "Delaware"
      state_slug: "delaware"
      symbol_image: "/images/fossils/delaware.jpg"
      fossil_name: "Belemnite"
      scientific_name: "Belemnitella americana"
      age: "Cretaceous"
      year_adopted: 1996
      short_fact: "Belemnites are extinct squid-like cephalopods with a hard internal cone, found in abundance along the banks of the Chesapeake and Delaware Canal in the Late Cretaceous Mount Laurel Formation."

    - state: "Florida"
      state_slug: "florida"
      symbol_image: ""
      fossil_name: "None designated"
      scientific_name: ""
      age: ""
      year_adopted: null
      short_fact: "Florida has no official state fossil. Its state stone, agatized coral, is technically a fossil, but Florida has not formally designated a state fossil."

    - state: "Georgia"
      state_slug: "georgia"
      symbol_image: "/images/fossils/georgia.jpg"
      fossil_name: "Shark Tooth"
      scientific_name: "Carcharocles megalodon"
      age: "Cretaceous–Miocene"
      year_adopted: 1976
      short_fact: "Georgia designated the fossil shark tooth without naming a species. Megalodon teeth up to 7 inches long have been found in the state. Sharks shed thousands of teeth per lifetime, making shark teeth the most common Georgia fossil."

    - state: "Hawaii"
      state_slug: "hawaii"
      symbol_image: ""
      fossil_name: "None designated"
      scientific_name: ""
      age: ""
      year_adopted: null
      short_fact: "Hawaii's volcanic geology makes fossilization rare. The islands are geologically young, and no official state fossil has been designated."

    - state: "Idaho"
      state_slug: "idaho"
      symbol_image: "/images/fossils/idaho.jpg"
      fossil_name: "Hagerman Horse"
      scientific_name: "Equus simplicidens"
      age: "Pliocene"
      year_adopted: 1988
      short_fact: "One of the oldest members of the genus Equus, discovered in 1928 near Hagerman, Idaho. Nearly 200 skeletons have been recovered from the Hagerman Fossil Beds National Monument. Resembles the modern African zebra more than a horse."

    - state: "Illinois"
      state_slug: "illinois"
      symbol_image: "/images/fossils/illinois.jpg"
      fossil_name: "Tully Monster"
      scientific_name: "Tullimonstrum gregarium"
      age: "Pennsylvanian"
      year_adopted: 1989
      short_fact: "One of the most mysterious fossils ever found: a soft-bodied creature from 300 million years ago that does not fit any known animal phylum. Found only in the Mazon Creek fossil beds of Illinois."

    - state: "Indiana"
      state_slug: "indiana"
      symbol_image: "/images/fossils/indiana.jpg"
      fossil_name: "American Mastodon"
      scientific_name: "Mammut americanum"
      age: "Holocene"
      year_adopted: 2022
      short_fact: "Indiana adopted the mastodon in 2022 after a campaign by Greensburg elementary school students. Mastodon remains are found throughout the state, often preserved in glacial lake deposits."

    - state: "Iowa"
      state_slug: "iowa"
      symbol_image: ""
      fossil_name: "None designated"
      scientific_name: ""
      age: ""
      year_adopted: null
      short_fact: "Iowa has no official state fossil. A crinoid designation was proposed in 2018 but was not passed by the legislature."

    - state: "Kansas"
      state_slug: "kansas"
      symbol_image: "/images/fossils/kansas.jpg"
      fossil_name: "Pteranodon & Tylosaurus"
      scientific_name: "Pteranodon longiceps / Tylosaurus kansasensis"
      age: "Cretaceous"
      year_adopted: 2014
      short_fact: "Kansas designated two official state fossils simultaneously in 2014: the Pteranodon (state flying fossil) and Tylosaurus (state marine fossil), both from the Western Interior Seaway that covered Kansas 85 million years ago."

    - state: "Kentucky"
      state_slug: "kentucky"
      symbol_image: "/images/fossils/kentucky.jpg"
      fossil_name: "Brachiopod"
      scientific_name: "Undetermined species"
      age: "Ordovician–Pennsylvanian"
      year_adopted: 1986
      short_fact: "Kentucky designated the entire brachiopod group, not a single species. Brachiopod shells are so common in Kentucky's Paleozoic rocks that naming one would have excluded hundreds of others."

    - state: "Louisiana"
      state_slug: "louisiana"
      symbol_image: "/images/fossils/louisiana.jpg"
      fossil_name: "Petrified Palmwood"
      scientific_name: "Palmoxylon sp."
      age: "Oligocene"
      year_adopted: 1976
      short_fact: "Petrified palm wood is found in Louisiana's Catahoula Formation, deposits laid down in broad coastal plains about 30 million years ago. Characterized by distinctive rod-like structures visible in cross-section."

    - state: "Maine"
      state_slug: "maine"
      symbol_image: "/images/fossils/maine.jpg"
      fossil_name: "Pertica Plant"
      scientific_name: "Pertica quadrifaria"
      age: "Devonian"
      year_adopted: 1976
      short_fact: "An extinct vascular plant from around 390 million years ago, first described from compression fossils found in northern Maine's Trout Valley Formation in 1972. Grew up to 3 feet tall."

    - state: "Maryland"
      state_slug: "maryland"
      symbol_image: "/images/fossils/maryland.jpg"
      fossil_name: "Ecphora Shell"
      scientific_name: "Ecphora gardnerae gardnerae"
      age: "Miocene"
      year_adopted: 1984
      short_fact: "An extinct carnivorous sea snail from the Miocene epoch. Ecphora was one of the first New World fossils illustrated in a European scientific publication. Adopted 1984; the species name was revised in 1994. Fossils are found in Maryland and Virginia's Chesapeake Group formations."

    - state: "Massachusetts"
      state_slug: "massachusetts"
      symbol_image: "/images/fossils/massachusetts.jpg"
      fossil_name: "Dinosaur Tracks"
      scientific_name: "Eubrontes giganteus"
      age: "Jurassic"
      year_adopted: 1980
      short_fact: "The Connecticut River Valley of western Massachusetts is one of the world's richest dinosaur track sites. First discovered in the early 1800s by a farmer's son, the tracks were initially thought to be ancient bird prints."

    - state: "Michigan"
      state_slug: "michigan"
      symbol_image: "/images/fossils/michigan.jpg"
      fossil_name: "American Mastodon"
      scientific_name: "Mammut americanum"
      age: "Holocene"
      year_adopted: 2002
      short_fact: "Mastodon remains are found across Michigan, often in glacial lake beds and peat deposits. Michigan's Petoskey Stone (state stone) is also a fossil: polished fragments of Devonian coral."

    - state: "Minnesota"
      state_slug: "minnesota"
      symbol_image: "/images/fossils/minnesota.jpg"
      fossil_name: "Giant Beaver"
      scientific_name: "Castoroides ohioensis"
      age: "Pleistocene"
      year_adopted: 2025
      short_fact: "The giant beaver was the largest rodent in North American history, reaching up to 8 feet in length, about the size of a modern black bear. Minnesota designated it as state fossil in 2025."

    - state: "Mississippi"
      state_slug: "mississippi"
      symbol_image: "/images/fossils/mississippi.jpg"
      fossil_name: "Prehistoric Whale"
      scientific_name: "Zygorhiza kochii"
      age: "Eocene"
      year_adopted: 1981
      short_fact: "Like Alabama, Mississippi chose an ancient basilosaurid whale. Zygorhiza lived 40–34 million years ago in the warm shallow sea that covered the Gulf Coast region during the Eocene."

    - state: "Missouri"
      state_slug: "missouri"
      symbol_image: "/images/fossils/missouri.jpg"
      fossil_name: "Sea Lily"
      scientific_name: "Delocrinus missouriensis"
      age: "Pennsylvanian"
      year_adopted: 1989
      short_fact: "Crinoids, commonly called sea lilies, are animals not plants. Despite their flower-like appearance, they are echinoderms related to starfish and sea urchins. Their fossils are common in Missouri's Pennsylvanian-age limestones."

    - state: "Montana"
      state_slug: "montana"
      symbol_image: "/images/fossils/montana.jpg"
      fossil_name: "Maiasaura"
      scientific_name: "Maiasaura peeblesorum"
      age: "Cretaceous"
      year_adopted: 1985
      short_fact: "Montana chose Maiasaura because paleontologists Jack Horner and Bob Makela discovered the first known dinosaur nesting colony there in 1978, upending assumptions about dinosaur behavior. Maiasaura means 'good mother lizard.'"

    - state: "Nebraska"
      state_slug: "nebraska"
      symbol_image: "/images/fossils/nebraska.jpg"
      fossil_name: "Mammoth"
      scientific_name: "Mammuthus primigenius / columbi / imperator"
      age: "Pleistocene"
      year_adopted: 1967
      short_fact: "Nebraska was the first state to designate a state fossil in 1967 and designates three mammoth species. 'Archie,' the largest mammoth skeleton ever found, was discovered in Lincoln County and stands 15 feet tall at the University of Nebraska State Museum."

    - state: "Nevada"
      state_slug: "nevada"
      symbol_image: "/images/fossils/nevada.jpg"
      fossil_name: "Ichthyosaur"
      scientific_name: "Shonisaurus popularis"
      age: "Triassic"
      year_adopted: 1977
      short_fact: "A giant marine reptile up to 50 feet long. A bone bed of 37 Shonisaurus individuals was found near Berlin, Nevada in 1928, now preserved at Berlin-Ichthyosaur State Park, one of the most significant marine reptile sites in the world."

    - state: "New Hampshire"
      state_slug: "new-hampshire"
      symbol_image: ""
      fossil_name: "None designated"
      scientific_name: ""
      age: ""
      year_adopted: null
      short_fact: "New Hampshire has no official state fossil. The American mastodon was proposed in 2015 but the bill was not passed."

    - state: "New Jersey"
      state_slug: "new-jersey"
      symbol_image: "/images/fossils/new-jersey.jpg"
      fossil_name: "Hadrosaurus"
      scientific_name: "Hadrosaurus foulkii"
      age: "Cretaceous"
      year_adopted: 1991
      short_fact: "Discovered in 1858 in Haddonfield, NJ, Hadrosaurus foulkii was the first nearly complete dinosaur skeleton found in North America. When mounted in 1868, it became the first mounted dinosaur skeleton in the world."

    - state: "New Mexico"
      state_slug: "new-mexico"
      symbol_image: "/images/fossils/new-mexico.jpg"
      fossil_name: "Coelophysis"
      scientific_name: "Coelophysis bauri"
      age: "Triassic"
      year_adopted: 1981
      short_fact: "Hundreds of Coelophysis skeletons were found at Ghost Ranch during the 1940s, making it the best-known Triassic dinosaur in the world. At about 6 feet long and 50 lbs, it is the best-represented dinosaur species from its era."

    - state: "New York"
      state_slug: "new-york"
      symbol_image: "/images/fossils/new-york.jpg"
      fossil_name: "Sea Scorpion"
      scientific_name: "Eurypterus remipes"
      age: "Silurian"
      year_adopted: 1984
      short_fact: "An extinct arthropod from 432–418 million years ago, 5–9 inches long, with large paddles for swimming. First found in 1818 and initially misidentified as a fossil catfish. It lived in the shallow brackish sea that covered upstate New York during the Silurian period."

    - state: "North Carolina"
      state_slug: "north-carolina"
      symbol_image: "/images/fossils/north-carolina.jpg"
      fossil_name: "Megalodon Tooth"
      scientific_name: "Otodus megalodon"
      age: "Miocene–Pliocene"
      year_adopted: 2013
      short_fact: "Megalodon teeth are the state fossil: the largest predatory shark ever known, estimated at up to 60 feet long with 7.5-inch serrated teeth. Teeth erode from the Miocene-aged Hawthorn Formation and are popular with divers in rivers and offshore."

    - state: "North Dakota"
      state_slug: "north-dakota"
      symbol_image: "/images/fossils/north-dakota.jpg"
      fossil_name: "Petrified Wood (Teredo)"
      scientific_name: "Teredo petrified wood"
      age: "Paleocene"
      year_adopted: 1967
      short_fact: "North Dakota designated shipworm-bored petrified wood: wood bored into by marine mollusks while drifting as sea flotsam about 60 million years ago, then fossilized. Found in the Cannonball Formation of south-central North Dakota."

    - state: "Ohio"
      state_slug: "ohio"
      symbol_image: "/images/fossils/ohio.jpg"
      fossil_name: "Trilobite & Dunkleosteus"
      scientific_name: "Isotelus maximus / Dunkleosteus terrelli"
      age: "Ordovician / Devonian"
      year_adopted: 1985
      short_fact: "Ohio has two state fossils: the trilobite Isotelus (1985), proposed by Dayton schoolchildren, and the armored fish Dunkleosteus (2021). Dunkleosteus was a 20-foot apex predator with the strongest bite force of any fish ever measured."

    - state: "Oklahoma"
      state_slug: "oklahoma"
      symbol_image: "/images/fossils/oklahoma.jpg"
      fossil_name: "Saurophaganax"
      scientific_name: "Saurophaganax maximus"
      age: "Jurassic"
      year_adopted: 2000
      short_fact: "A massive allosaurid predator from the Late Jurassic Morrison Formation of Oklahoma, estimated at 34–43 feet in length. First discovered near Kenton, Oklahoma in the 1930s. Designated by the governor on April 14, 2000."

    - state: "Oregon"
      state_slug: "oregon"
      symbol_image: "/images/fossils/oregon.jpg"
      fossil_name: "Dawn Redwood"
      scientific_name: "Metasequoia sp."
      age: "Eocene"
      year_adopted: 2005
      short_fact: "Designated in 2005 after a local fossil enthusiast gave every Oregon legislator a Metasequoia fossil. The dawn redwood is a deciduous conifer that flourished 34–5 million years ago; its fossils are common across the Pacific Northwest."

    - state: "Pennsylvania"
      state_slug: "pennsylvania"
      symbol_image: "/images/fossils/pennsylvania.jpg"
      fossil_name: "Trilobite"
      scientific_name: "Phacops rana"
      age: "Devonian"
      year_adopted: 1988
      short_fact: "Phacops may be the world's most recognizable trilobite; its distinctive compound eyes are unusually well-preserved. Proposed by an elementary school science class and designated in 1988. Found in Pennsylvania's Devonian-age rocks."

    - state: "Rhode Island"
      state_slug: "rhode-island"
      symbol_image: "/images/fossils/rhode-island.jpg"
      fossil_name: "Trilobite"
      scientific_name: "Genus and species not specified"
      age: "Paleozoic"
      year_adopted: 2023
      short_fact: "Rhode Island designated the trilobite in 2023 without naming a specific genus or species, the least specific state fossil designation in the country. It was adopted 56 years after Nebraska and North Dakota were first."

    - state: "South Carolina"
      state_slug: "south-carolina"
      symbol_image: "/images/fossils/south-carolina.jpg"
      fossil_name: "Columbian Mammoth"
      scientific_name: "Mammuthus columbi"
      age: "Pleistocene"
      year_adopted: 2014
      short_fact: "South Carolina's mammoth bill nearly included Genesis language from creationist legislators before passing without it. Columbian mammoths were larger than woolly mammoths and roamed the warmer climates of the southern U.S."

    - state: "South Dakota"
      state_slug: "south-dakota"
      symbol_image: "/images/fossils/south-dakota.jpg"
      fossil_name: "Triceratops"
      scientific_name: "Triceratops horridus"
      age: "Cretaceous"
      year_adopted: 1988
      short_fact: "The Cretaceous Hell Creek Formation that outcrops across South Dakota is one of the world's richest sources of Triceratops fossils. South Dakota replaced a cycad (fossil plant) with Triceratops in 1988."

    - state: "Tennessee"
      state_slug: "tennessee"
      symbol_image: "/images/fossils/tennessee.jpg"
      fossil_name: "Pterotrigonia Bivalve"
      scientific_name: "Pterotrigonia thoracica"
      age: "Cretaceous"
      year_adopted: 1998
      short_fact: "An extinct bivalve mollusk from the Cretaceous, when much of western Tennessee was covered by a shallow sea about 70 million years ago. Common fossil in the Coon Creek Formation of McNairy County."

    - state: "Texas"
      state_slug: "texas"
      symbol_image: ""
      fossil_name: "None designated"
      scientific_name: ""
      age: ""
      year_adopted: null
      short_fact: "Texas has no official state fossil. Its state dinosaur is Sauroposeidon proteles and its state stone, petrified Palmoxylon, is technically a fossil, but no state fossil has been designated."

    - state: "Utah"
      state_slug: "utah"
      symbol_image: "/images/fossils/utah.jpg"
      fossil_name: "Allosaurus"
      scientific_name: "Allosaurus fragilis"
      age: "Jurassic"
      year_adopted: 1988
      short_fact: "The most common large predatory dinosaur in the Jurassic Morrison Formation. Over 60 Allosaurus skeletons, adults and juveniles, were recovered from a single Utah quarry. It could open its jaw exceptionally wide, possibly using its upper jaw like a hatchet."

    - state: "Vermont"
      state_slug: "vermont"
      symbol_image: "/images/fossils/vermont.jpg"
      fossil_name: "Beluga Whale & Woolly Mammoth"
      scientific_name: "Delphinapterus leucas / Mammuthus primigenius"
      age: "Pleistocene"
      year_adopted: 1993
      short_fact: "Vermont has both a state marine fossil (beluga whale skeleton, 1993) and a state terrestrial fossil (woolly mammoth tooth and tusk, 2014). The beluga is the only state fossil from a species still living today."

    - state: "Virginia"
      state_slug: "virginia"
      symbol_image: "/images/fossils/virginia.jpg"
