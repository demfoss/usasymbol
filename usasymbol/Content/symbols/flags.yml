page:
  h1: "All 50 U.S. State Flags"

  quick_answer:
    - "Texas has the oldest current state flag, adopted in 1839 — when Texas was still an independent republic."
    - "Mississippi's 'New Magnolia' flag (2021) is the newest. Utah and Minnesota also redesigned their flags in 2024."
    - "Ohio is the only state with a non-rectangular flag — a swallowtail burgee shape, adopted in 1902."
    - "Oregon is the only state with a different design on each side: the state seal on the front, a beaver on the back."

  intro_paragraphs:
    - "Texas's Lone Star flag dates to 1839 — six years before statehood — making it the oldest current state flag by over 20 years. Hawaii's (1845) is second; South Carolina's (1861) is third, adopted when the state seceded."
    - "Most state flags were settled between 1900 and 1930. Utah and Minnesota are the most recent redesigns, both in 2024; Mississippi replaced its Confederate-era design in 2021."

  insights:
    - "At least 20 states use the same basic format: a state seal on a solid blue background. They're the hardest to tell apart at a glance."
    - "New Mexico's flag is consistently ranked the best-designed — a red Zia sun symbol on yellow, no text, no seal."
    - "Hawaii's flag is the only U.S. state flag to include the British Union Jack."
    - "Georgia has changed its flag more than any other state — five major versions since the Civil War."
    - "Three state flags have been replaced since 2020: Mississippi (2021), Utah (2024), and Minnesota (2024)."

  methodology: "This list covers the official state flag for each of the 50 U.S. states as recognized by state legislatures. 'Year adopted' reflects when the current flag design was first officially enacted. 'Year standardized' indicates when the flag's specifications — colors, proportions, or design details — were last formally codified by law."

  sources:
    - name: "North American Vexillological Association (NAVA)"
      url: "https://nava.org/"
      description: "Flag design standards and historical research"

