seo:
  title: "State Colors by State: Official and Common Colors in All 50 States"
  description: "Explore state colors for all 50 U.S. states, including official colors where adopted and common color associations used elsewhere."

page:
  h1: "State Colors by State"

  quick_answer:
    - "Only 15 states have officially designated state colors by statute. For the other 35, colors flow from state flags, historical tradition, or the dominant colors of the flagship university."
    - "Blue and Gold is the most common combination — claimed by eight states: Alaska, California, Indiana, Kansas, Kentucky, New York, Pennsylvania, and South Dakota."
    - "Red, White, and Blue is shared by six states: Arkansas, Georgia, Iowa, Missouri, Texas, and Virginia — all aligning their palette with the national flag."
    - "South Carolina has only one official state color: Indigo Blue — confirmed by forensic analysis of 1776 Revolutionary War militia cockades. White is explicitly excluded by law."
    - "Hawaii assigns a separate color to each of its major islands, making it the only U.S. state without a single statewide official color."
    - "In 2024, Minnesota and Utah redesigned their state flags and established entirely new color palettes — the most significant state color changes in decades."
    - "Tennessee, Ohio, Michigan, Nebraska, Wisconsin, and Wyoming are all strongly identified with their flagship university's colors — none of which has been designated by state law."

  intro_paragraphs:
    - "What are the state colors? The answer depends on the state — and on what counts as 'official.' Only 15 states have formally designated their colors through legislation. The remaining 35 rely on tradition: typically the dominant colors of the state flag, but also state seals, historical uniforms, or the athletic colors of the flagship university. This guide covers all 50 states with verified designations, legislation references, HEX codes, and the history behind every palette."
    - "The stories behind state colors are more interesting than most reference sites suggest. George Washington personally specified the uniform colors for two future states — Colonial Blue and Buff for Delaware in 1776, and Jersey Blue and Buff for New Jersey in 1779. South Carolina's Indigo Blue was confirmed through forensic analysis of surviving Revolutionary War cockades. In at least six states, the football team effectively settled the color question that the legislature never did. From mining heritage to Native American tradition to Civil War memory, every state color has a reason."

  insights:
    - "Blue is the dominant color in American state symbolism — it appears in the official or traditional palette of over 35 states, reflecting both patriotic tradition and the prevalence of blue on state flags."
    - "University athletics have shaped state color identity more than legislatures in many states. Nebraska (Scarlet and Cream), Michigan (Maize and Blue), Tennessee (Orange and White), Ohio (Scarlet and Gray), and Wyoming (Brown and Gold) are all identified by their university's colors statewide."
    - "New Mexico's Red and Yellow (official since 1999) reflect the historic colors of Spain — carried to the Southwest by 16th-century colonists and displayed today on the state's iconic 1925 flag."
    - "Oklahoma's official Green and White were proposed in 1915 by the Ohoyohoma Circle — a name from the Choctaw language meaning 'women's circle' — to represent the mistletoe, the state's original flower. One of the few color designations rooted in Native American tradition."
    - "Oregon (Navy Blue and Gold, 1959) codified its colors in the same statute that governs its unique two-sided flag — the only state to formally link flag design and color designation in a single law."
    - "Eight states share Blue and Gold: Alaska, California, Indiana, Kansas, Kentucky, New York, Pennsylvania, and South Dakota. Six states share Red, White, and Blue: Arkansas, Georgia, Iowa, Missouri, Texas, and Virginia."
    - "Only two U.S. states have colors personally chosen by George Washington: Delaware (Colonial Blue and Buff, 1776) and New Jersey (Jersey Blue and Buff, 1779) — both specified for Continental Army regimental uniforms."
    - "Georgia, Virginia, Tennessee, Pennsylvania, Ohio, Florida, and New York are among the most searched state color queries online — yet none has officially designated its colors by statute. Popular recognition outpaces legislation in every one of these states."
    - "South Carolina's Indigo Blue is the only state color verified by forensic analysis of physical artifacts — specifically the blue cockades worn by colonial militia in 1776. No other state color designation carries this level of documented historical evidence."

  methodology: "This list includes official, semi-official, and traditional state color designations for all 50 U.S. states. 'Official' designations are established by state statute or legislative resolution. 'Semi-official' designations are widely recognized but lack formal statutory authority. 'Traditional' colors are derived from state flags, seals, or long-standing custom. HEX codes are provided as closest standard approximations; Pantone values may differ for official print standards."

  sources:
    - name: "National Conference of State Legislatures (NCSL)"
      url: "https://www.ncsl.org/"
      description: "Overview of state symbols and legislative history"

