seo:
  title: "State Desserts & Sweets | Official List, Map & Facts"
  description: "Official state cookies, cakes, pies, and other sweets are listed by state, with adoption years and facts about each one."

page:
  h1: "List of State Desserts & Sweets"

  quick_answer:
    - "A state dessert, cookie, cake, or pie is an official sweet designated by a state legislature, often tied to a signature local recipe."
    - "Alabama has designated two: the Yellowhammer cookie as state cookie (2023) and the Lane cake as state cake (2016, invented in Clayton, Alabama)."

  intro_paragraphs:
    - "State desserts and sweets are usually chosen because a recipe was invented in the state or has become closely associated with its food culture."
    - "This list is being built out state by state and currently covers only designations that have been fully verified against official sources."

  sections:
    - id: desserts-overview
      icon: fa-solid fa-cookie-bite
      title: Official State Desserts & Sweets of U.S. States
      paragraphs:
        - "The table below lists official state cookies, cakes, pies, and other sweets with their adoption year and a short note on each one's connection to the state. This list grows as more states are added."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed designation are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state foods"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_foods"
      description: "State dessert, cookie, cake, and pie designations with adoption years."

