      symbol_image: "/images/rocks/indiana/indiana-state-stone-hero.webp"
      rock_name: "Salem Limestone"
      rock_slug: "salem-limestone"
      adopted_year: 1971
      notes: "Quarried around Bedford, it supplied roughly 80 percent of U.S. building stone by 1920, including the Empire State Building and the Pentagon."
    - state: "Iowa"
      state_slug: "iowa"
      symbol_image: "/images/rocks/iowa/iowa-state-rock-hero.webp"
      rock_name: "Geode"
      rock_slug: "geode"
      adopted_year: 1967
      notes: "Named to promote tourism, since the Keokuk area of southeastern Iowa is famous worldwide for its crystal-lined geodes."
    - state: "Kansas"
      state_slug: "kansas"
      symbol_image: "/images/rocks/kansas/kansas-state-rock-hero.webp"
      rock_name: "Greenhorn Limestone"
      rock_slug: "greenhorn-limestone"
      adopted_year: 2018
      notes: "A thin layer called post rock gave treeless prairie settlers a stone substitute for wooden fence posts starting in the 1880s."
    - state: "Kentucky"
      state_slug: "kentucky"
      symbol_image: "/images/rocks/kentucky/kentucky-state-rock-hero.webp"
      rock_name: "Coal"
      rock_slug: "coal"
      adopted_year: 2024
      notes: "Redesignated from state mineral to state rock in 2024 to correct its scientific classification, while keeping its tie to Kentucky's mining history."
    - state: "Maine"
      state_slug: "maine"
      symbol_image: "/images/rocks/maine/maine-state-rock-hero.webp"
      rock_name: "Granitic Pegmatite"
      rock_slug: "granitic-pegmatite"
      adopted_year: 2023
      notes: "Its crystal-lined pockets are the host rock for tourmaline, Maine's state mineral, and made Oxford County a top gem-hunting region."
    - state: "Massachusetts"
      state_slug: "massachusetts"
      symbol_image: "/images/rocks/massachusetts/massachusetts-state-rock-hero.webp"
      rock_name: "Roxbury Puddingstone"
      rock_slug: "roxbury-puddingstone"
      adopted_year: 1983
      notes: "This conglomerate underlies the Roxbury neighborhood of Boston so thoroughly that the neighborhood took its name from the rock."
    - state: "Michigan"
      state_slug: "michigan"
      symbol_image: "/images/rocks/michigan/michigan-state-stone-hero.webp"
      rock_name: "Petoskey Stone"
      rock_slug: "petoskey-stone"
      adopted_year: 1965
      notes: "This fossilized coral, 350 million years old, is named for an Odawa chief and found along Lake Michigan beaches."
    - state: "Mississippi"
      state_slug: "mississippi"
      symbol_image: "/images/rocks/mississippi/mississippi-state-stone-hero.webp"
      rock_name: "Petrified Wood"
      rock_slug: "petrified-wood"
      adopted_year: 1976
      notes: "The Mississippi Petrified Forest near Flora preserves an ancient log jam, one of only two petrified forests known east of the Mississippi River."
    - state: "Missouri"
      state_slug: "missouri"
      symbol_image: "/images/rocks/missouri/missouri-state-rock-hero.webp"
      rock_name: "Mozarkite"
      rock_slug: "mozarkite"
      adopted_year: 1967
      notes: "This colorful chert, collected around Benton County since the 1950s, takes a bright mottled polish for jewelry."
    - state: "Nebraska"
      state_slug: "nebraska"
      symbol_image: "/images/rocks/nebraska/nebraska-state-rock-hero.webp"
      rock_name: "Prairie Agate"
      rock_slug: "prairie-agate"
      adopted_year: 1967
      notes: "Unlike most agates, it rarely shows banding, gathered loose from the badlands of the Oglala National Grassland."
    - state: "Nevada"
      state_slug: "nevada"
      symbol_image: "/images/rocks/nevada/nevada-state-rock-hero.webp"
      rock_name: "Sandstone"
      rock_slug: "sandstone"
      adopted_year: 1987
      notes: "Named in 1987 after a campaign by Las Vegas fifth graders, honoring the red formations of Valley of Fire State Park."
    - state: "New Hampshire"
      state_slug: "new-hampshire"
      symbol_image: "/images/rocks/new-hampshire/new-hampshire-state-rock-hero.webp"
      rock_name: "Granite"
      rock_slug: "granite"
      adopted_year: 1985
      notes: "Quarried at Rattlesnake Hill in Concord, it gave New Hampshire its nickname, the Granite State, over a century before the official designation."
    - state: "North Dakota"
      state_slug: "north-dakota"
      symbol_image: "/images/rocks/north-dakota/north-dakota-state-rock-hero.webp"
      rock_name: "Knife River Flint"
      rock_slug: "knife-river-flint"
      adopted_year: 2025
      notes: "Native peoples quarried and traded this toolmaking stone for over 10,000 years; a student rock club led the 2025 campaign to name it."
    - state: "Oklahoma"
      state_slug: "oklahoma"
      symbol_image: "/images/rocks/oklahoma/oklahoma-state-rock-hero.webp"
      rock_name: "Rose Rock"
      rock_slug: "rose-rock"
      adopted_year: 1968
      notes: "This barite crystal cluster forms almost nowhere else on Earth besides the sandstone country around Noble."
    - state: "Oregon"
      state_slug: "oregon"
      symbol_image: "/images/rocks/oregon/oregon-state-rock-hero.webp"
      rock_name: "Thunderegg"
      rock_slug: "thunderegg"
      adopted_year: 1965
      notes: "A plain, potato-sized volcanic nodule that often hides colorful agate or jasper inside; named by a vote of Oregon rockhounding clubs."
    - state: "Rhode Island"
      state_slug: "rhode-island"
      symbol_image: "/images/rocks/rhode-island/rhode-island-state-rock-hero.webp"
      rock_name: "Cumberlandite"
      rock_slug: "cumberlandite"
      adopted_year: 1966
      notes: "Known to occur naturally at only two places on Earth: Cumberland, Rhode Island, and Taberg, Sweden."
    - state: "South Carolina"
      state_slug: "south-carolina"
      symbol_image: "/images/rocks/south-carolina/south-carolina-state-stone-hero.webp"
      rock_name: "Blue Granite"
      rock_slug: "blue-granite"
      adopted_year: 1969
      notes: "Winnsboro's quarries, one of the largest in the country, ship this mica-flecked granite for buildings and monuments nationwide."
    - state: "Tennessee"
      state_slug: "tennessee"
      symbol_image: "/images/rocks/tennessee/tennessee-state-rock-hero.webp"
      rock_name: "Limestone"
      rock_slug: "limestone"
      adopted_year: 1979
      notes: "Quarried around Knoxville and sold nationally for over a century as Tennessee marble, though it is true limestone, not marble."
    - state: "Texas"
      state_slug: "texas"
      symbol_image: "/images/rocks/texas/texas-state-stone-hero.webp"
      rock_name: "Petrified Palmwood"
      rock_slug: "petrified-palmwood"
      adopted_year: 1969
