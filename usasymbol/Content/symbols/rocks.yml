seo:
  title: "State Rocks & Stones | Official List, Map & Facts"
  description: "Official state rocks and stones are listed by state, with adoption years and facts about the quarries and geology behind each one."

page:
  h1: "List of State Rocks & Stones"

  quick_answer:
    - "A state rock (sometimes called a state stone) is an official rock type designated by a state legislature, often tied to a quarrying industry or a distinctive local formation."
    - "Alabama's state rock is marble, adopted in 1969, quarried around Sylacauga, a town long nicknamed the Marble City."
    - "Some states designate a specific named stone instead of a rock type, this list covers both kinds of designation."

  intro_paragraphs:
    - "State rocks and stones are usually chosen for their connection to a real quarrying industry or a landmark geological formation, not simply for how they look."
    - "Many are building stones: granite, marble, or limestone that supplied construction and monument stone far beyond the state's own borders."

  sections:
    - id: rocks-overview
      icon: fa-solid fa-mountain
      title: Official State Rocks & Stones of U.S. States
      paragraphs:
        - "The table below lists official state rocks and stones with their adoption year and a short note on where each one is quarried or found. Thirty states have designated an official state rock or stone. The rest have not."

  methodology: "Adoption years reflect the year of official legislative designation. States with no confirmed state rock or stone are omitted rather than guessed at."

  sources:
    - name: "Wikipedia, List of U.S. state minerals, rocks, stones and gemstones"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_minerals,_rocks,_stones_and_gemstones"
      description: "State rock and stone designations with adoption years."

