    - state: "Utah"
      state_slug: "utah"
      symbol_image: "/images/rocks/utah/utah-state-rock-hero.webp"
      rock_name: "Coal"
      rock_slug: "coal"
      adopted_year: 1991
      notes: "Carbon County, named directly for its coal deposits, built the mining towns of Price and Helper starting in the 1880s."
    - state: "Vermont"
      state_slug: "vermont"
      symbol_image: "/images/rocks/vermont/vermont-state-rock-hero.webp"
      rock_name: "Granite, Marble, and Slate"
      rock_slug: "granite-marble-and-slate"
      adopted_year: 1992
      notes: "Vermont named three state rocks together in 1992, each anchoring its own quarrying region: Barre, Danby-Proctor, and the Slate Valley."
    - state: "Virginia"
      state_slug: "virginia"
      symbol_image: "/images/rocks/virginia/virginia-state-rock-hero.webp"
      rock_name: "Nelsonite"
      rock_slug: "nelsonite"
      adopted_year: 2016
      notes: "Named for Nelson County, where it was first identified and mined near Roseland for titanium and phosphate until 1971."
    - state: "West Virginia"
      state_slug: "west-virginia"
      symbol_image: "/images/rocks/west-virginia/west-virginia-state-rock-hero.webp"
      rock_name: "Bituminous Coal"
      rock_slug: "bituminous-coal"
      adopted_year: 2009
      notes: "Mined since a commercial mine opened near Wheeling in 1810, coal seams now run through most of the state's 55 counties."
    - state: "Wisconsin"
      state_slug: "wisconsin"
      symbol_image: "/images/rocks/wisconsin/wisconsin-state-rock-hero.webp"
      rock_name: "Red Granite"
      rock_slug: "red-granite"
      adopted_year: 1971
      notes: "Quarried around Wausau since the 1880s, it was used in construction of the Wisconsin State Capitol."


