  title: "State Soils | Official Series, Map & Facts"
  description: "Official state soils are listed by state, with soil series names, adoption years, and facts about where each soil is found."

page:
  h1: "List of State Soils"

  quick_answer:
    - "State soils are official soil series designated by state legislatures to represent each state's land and agricultural heritage. Each is a distinct, scientifically classified soil series identified and named by USDA soil scientists."
    - "Nebraska's Holdrege series (1979) is one of the earliest state soils designated in the United States. Iowa's Tama and most others followed in the 1980s and 1990s. Montana's Scobey series was the most recently designated, in 2015."
    - "Texas's Houston Black covers over 10 million acres of the Blackland Prairie and cracks wide open in drought. You can see the gaps in the ground. Florida's Myakka covers millions of acres of pine flatwoods and is the most extensive soil in the state."
    - "The red color in many southeastern state soils (Alabama's Bama series, North Carolina's Cecil series) comes from iron oxides that built up over thousands of years of warm, wet weathering."
    - "Connecticut and Washington have proposed but not yet officially adopted state soils. All other states have formally designated one."

  intro_paragraphs:
    - "State soils are one of the least-known official state symbols, most people don't know their state has one. Unlike state birds or flowers, they weren't chosen by popular vote. Soil scientists nominated them, and state legislatures made them official."
    - "Each state soil is a specific soil type with a name, usually taken from the town or county where it was first studied. Iowa's Tama series is named for Tama County. Alabama's Bama series is named for the state itself. Each one has a distinct color, texture, and layer structure that sets it apart from other soils."
    - "These are the soils that built each state's farming economy, the fields where cotton, corn, wheat, and timber grew for generations. The state soil is usually the most agriculturally important soil in the state, not necessarily the most common one."

  insights:
    - "Iron oxides give many southeastern state soils their red and yellow-red colors. The deeper the red, the longer the soil has been forming in warm, wet conditions, some of these profiles represent tens of thousands of years of weathering."
    - "Soil horizon names follow a standardized system. The A horizon is topsoil. E is the eluvial layer where minerals leach downward. B horizons are subsoil where leached materials accumulate. C is parent material, the original sediment or rock the soil formed from."
    - "State soils are typically chosen for agricultural productivity, geographic extent, and how representative they are of the dominant landscape. A soil covering 500,000 acres and supporting three cash crops will be chosen over a rare or unusual soil."
    - "Oregon's Jory series, officially designated in 2011, is named for J.B. Jory who farmed the Willamette Valley. It now underlies some of the most valuable Pinot Noir vineyards in the Pacific Northwest."
    - "Texas's Houston Black series is a Vertisol, a soil that shrinks and cracks in drought and swells when wet. Houston's famously unstable foundations are partly explained by the city sitting on this expansive black clay."
    - "The USDA Official Series Descriptions (OSDs) for state soils are publicly available and remarkably detailed, they specify exact Munsell color codes for each horizon, clay percentages, reaction pH, and typical permeability."
    - "Montana's Scobey series, designated in 2015, is the most recently adopted state soil in the United States, more than three decades after the program began gaining momentum in the 1980s."
    - "South Carolina's Bohicket series is one of the most unusual state soils: it is a tidal marsh soil from the coastal lowlands, not a productive agricultural soil. The choice reflects the ecological and cultural importance of South Carolina's coastal marshes."

  sections:
    - id: soils-history
      icon: fa-solid fa-clock-rotate-left
      title: How the State Soil Program Started
      paragraphs:
        - 'The state soil program began taking shape in the 1980s, pushed by the Soil Science Society of America. The idea was simple: give each state an official soil the way states have an official bird or flower. Nebraska was the first, designating the Holdrege series in 1979. Most other states followed through the 1980s and 1990s.'
        - 'The USDA Natural Resources Conservation Service, the federal agency that maps and classifies American soils, provided the scientific backbone. Each nominated soil already had a complete official description: where it was first found, what it looks like layer by layer, and how far it spreads across the state.'
        - 'Montana was last, officially designating the Scobey series in 2015. Connecticut and Washington have proposed state soils but have not yet passed them into law.'

    - id: soils-overview
      icon: fa-solid fa-mountain
      title: Official State Soils of All 50 States
      paragraphs:
        - 'The table below lists every state soil with its adoption year and key characteristic. Names come from the town or county where the soil was first studied and described.'
        - 'Connecticut and Washington have officially proposed state soils that have not yet been formally adopted. Puerto Rico (Bayamon) and the U.S. Virgin Islands (Victory) also have official territorial soils.'

  methodology: "Adoption years reflect the year of official legislative designation, as recorded by the Soil Science Society of America and USDA NRCS. Years marked as proposed indicate a recommendation that has not been enacted into law. States with no confirmed adoption year are listed without one."

  sources:
    - name: "Wikipedia, List of U.S. state soils"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_soils"
      description: "State soil designations with adoption years."

