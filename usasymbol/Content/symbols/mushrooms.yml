seo:
  title: State Mushrooms | Official List, Map & Facts
  description: Minnesota, Oregon, Texas and California have an official state mushroom. Minnesota named the morel in 1984, and two states chose a golden chanterelle.
page:
  h1: List of State Mushrooms
  quick_answer:
  - "Minnesota named the morel its official state mushroom in 1984, the earliest of the four. Oregon followed with the Pacific golden chanterelle in 1999."
  - "Texas chose the Texas star in 2021, a rare earthstar fungus found only in Texas and Japan. California picked its own golden chanterelle in 2023, so chanterelles now hold two of the four titles."
  intro_paragraphs:
  - "Three of the four state mushrooms are ones people actually pick and eat. The fourth, the Texas star, is a rarity that few people ever see."
  - "Oregon and California each claim a different species of golden chanterelle. Both are woodland fungi that grow in a partnership with the roots of nearby trees."
  sections:
  - id: mushrooms-overview
    icon: fa-solid fa-seedling
    title: Official State Mushrooms by State
    paragraphs:
    - "Minnesota's morel has a honeycombed cap and appears for a few weeks in spring, which makes the hunt a local ritual. Oregon's chanterelle is gathered in the fall in Douglas fir forests, and California's grows under oaks in coastal and foothill woodland."
    - "The Texas star is the oddball. It grows on dead cedar elm stumps in central Texas, and its tough outer skin splits into pointed arms that look like a star. Japan is the only other place in the world where it is known to grow."
  - id: mushrooms-foraging
    icon: fa-solid fa-triangle-exclamation
    title: Foraging Warning for Wild Mushrooms
    paragraphs:
    - "Both state favorites have dangerous look-alikes. The jack-o'-lantern mushroom is often mistaken for a chanterelle and causes severe stomach illness, and false morels can be toxic when eaten raw or undercooked. Have a local expert confirm any wild mushroom before it goes in the pan."
  methodology: Adoption years reflect the year of official legislative designation.
