faq:
  - question: "Which state was the first to designate an official state firearm?"
    answer: "Utah was the first, designating the Browning M1911 pistol in March 2011. The bill was sponsored to honor the pistol's 100th anniversary and the legacy of its designer, John Moses Browning, who was born in Ogden, Utah."

  - question: "How many U.S. states have an official state firearm?"
    answer: "As of 2026, exactly 10 states have an official state firearm: Alaska, Arizona, Indiana, Kentucky, Missouri, Pennsylvania, Tennessee, Texas, Utah, and West Virginia. The other 40 states have not enacted such a designation."

  - question: "What is the most recent state to designate an official state firearm?"
    answer: "Missouri designated the Hawken Rifle as its official state firearm in July 2023, making it the most recent addition to the list. The Hawken was built in St. Louis — Missouri's historic gateway to the American West — starting in the 1820s."

  - question: "Are the Kentucky Long Rifle and the Pennsylvania Long Rifle the same weapon?"
    answer: "Yes — they are the same rifle. It was invented by German immigrant gunsmiths in Lancaster County, Pennsylvania around 1740. It earned the name 'Kentucky Rifle' after Kentucky frontiersmen used it with devastating effect at the Battle of New Orleans in 1815. Both states have since claimed it under different names: Pennsylvania as the origin, Kentucky as the legend."

  - question: "Why did Tennessee choose a modern military rifle as its state firearm?"
    answer: "Tennessee chose the Barrett M82 to honor the state's contemporary manufacturing prowess. The rifle was designed by Tennessee native Ronnie Barrett in 1982 and is produced at Barrett Firearms Manufacturing in Murfreesboro. The designation honors a living innovation — not a historical artifact — making Tennessee unique among all designating states."

  - question: "What makes Indiana's Grouseland Rifle unique among all state firearms?"
    answer: "Indiana designated a specific surviving artifact — a flintlock rifle crafted by Colonel John Small, Indiana's first sheriff — rather than a model or type of gun. Only a handful of Small's rifles survive. The designated rifle is displayed at Grouseland mansion in Vincennes, the former home of President William Henry Harrison. No other state has named a specific individual firearm, by provenance, as its state symbol."

  - question: "Why don't more states have an official state firearm?"
    answer: "State firearm designations require a legislative majority plus a governor's signature — and face consistent organized opposition in states with larger urban populations or divided legislatures. Bills have failed in New Hampshire, Colorado, and other states when urban legislators argue the symbolism is inappropriate given contemporary gun violence. The 10 states that have succeeded all share a political profile: rural-majority legislatures and governors willing to sign."

  - question: "What is the difference between a state rifle and a state firearm?"
    answer: "A 'state firearm' is a broad designation covering pistols, revolvers, and long guns alike. A 'state rifle' is specifically limited to long guns. Tennessee designated the Barrett M82 as its official state rifle — while Utah's M1911 pistol and Arizona's Colt SAA revolver could only qualify under the broader 'state firearm' category."

  - question: "Which state firearm is the rarest surviving artifact?"
    answer: "The 1847 Colt Walker (Texas) is the rarest production model. Approximately 160 authenticated originals survive from a production run of about 1,100. When verified examples appear at auction, they typically sell for $500,000 to over $1 million. Indiana's Grouseland Rifle is rarer as an individually designated artifact, but the Colt Walker is rarer as a mass-produced historical model."

  - question: "Which state firearm had the longest military service record?"
    answer: "The Browning M1911 (Utah) served as the U.S. military's standard sidearm for 74 continuous years — from 1911 to 1985, through World War I, World War II, Korea, and Vietnam. No other handgun in history has served a major military for a longer uninterrupted span."
