sections:
  - id: "why-states-adopt-firearms"
    icon: "fa-solid fa-landmark"
    title: "Why States Adopt Official Firearms"
    paragraphs:
      - "A state firearm designation is a legislative act — it requires a bill to pass both chambers of the state legislature and the governor's signature. Unlike [state birds](/symbols/birds) or flowers (often chosen by schoolchildren in the early 1900s), state firearm designations are deliberate political statements made by elected officials."
      - "Supporters argue that these designations celebrate engineering ingenuity, frontier history, and the constitutional right to bear arms. Critics sometimes see them as political gestures. But the historical record shows that nearly every designation is tied to a genuine, documentable connection between the firearm and the state's history — a designer born there, a weapon made there, or battles won with it on that soil. That history-first pattern is closer to [state mottos](/symbols/mottos) and civic symbols than to wildlife symbols."
      - "Utah's 2011 designation of the [Browning M1911 pistol](/states/utah/firearm/browning-m1911-pistol) set the template. The bill cited the pistol's 100th anniversary and John Moses Browning's birth in Ogden, Utah. The combination of local pride, historical significance, and constitutional symbolism proved persuasive — and replicable. Six other states followed before the decade ended."

  - id: "first-state-firearm"
    icon: "fa-solid fa-trophy"
    title: "Which State Was First to Designate an Official State Firearm?"
    paragraphs:
      - "Utah holds the distinction of being the first U.S. state to designate an official state firearm. On March 14, 2011 — exactly 100 years after the U.S. Army formally adopted the M1911 pistol — Governor Gary Herbert signed HB 219 into law."
      - "The bill was not primarily a gun-rights statement. It was an anniversary celebration tied to a specific person: John Moses Browning, born in Ogden, Utah in 1855, who designed the M1911 along with more than 120 other firearms during his career. Sponsors framed the designation as honoring a Utah native whose engineering genius shaped American and world history."
      - "Arizona followed just weeks later in 2011, designating the [Colt Single Action Army revolver](/states/arizona/firearm/colt-single-action-army-revolver). That same year produced two state firearm designations — a coincidence that reflected growing legislative interest in the category. By 2014, Indiana, West Virginia, Kentucky, and Pennsylvania had all followed. The template Utah established — local connection, historical significance, and constitutional symbolism — proved easy to replicate."

  - id: "all-state-firearms"
    icon: "fa-solid fa-map"
    title: "All 10 Official State Firearms"
    paragraphs:
      - "The 10 designations span roughly 200 years of American firearms history — from Indiana's 1790s flintlock Grouseland Rifle to Tennessee's Barrett M82, which is still in active military use today."
    subsections:
      - subtitle: "Alaska — Pre-1964 Winchester Model 70 (2014)"
        text: "Alaska's designation is unique: it specifies a production era, not just a model. The [Pre-1964 Winchester Model 70](/states/alaska/firearm/pre-1964-winchester-model-70) — designated via Senate Bill 175 in 2014 — is the only state firearm that requires a specific manufacturing vintage. Pre-1964 Model 70s used a hand-fitted controlled-round-feed action considered essential for stopping large dangerous game in Alaska's wilderness. The designation reflects Alaska's identity as North America's last true frontier."
      - subtitle: "Arizona — Colt Single Action Army Revolver (2011)"
        text: "Arizona's [Colt Single Action Army revolver](/states/arizona/firearm/colt-single-action-army-revolver) — designated by Senate Bill 1610 just weeks after Utah's M1911 — is the iconic 'Peacemaker' of the American West. Introduced in 1873 and in continuous production for over 150 years, the SAA defined the sheriff, the cowboy, and the outlaw of frontier legend. Arizona's choice honored the weapon that wrote the visual identity of the American West."
      - subtitle: "Indiana — Grouseland Rifle (2012)"
        text: "Indiana's designation is the most distinctive in the country. The [Grouseland Rifle](/states/indiana/firearm/grouseland-rifle) — designated by Senate Enrolled Act 209 in 2012 — is a specific surviving artifact crafted by Colonel John Small, Indiana's first sheriff. Only a handful of Small's rifles survive. The designated rifle is on display at Grouseland mansion in Vincennes, the former home of President William Henry Harrison. No other state has named a specific individual firearm, by provenance, as its state symbol."
      - subtitle: "Kentucky — Kentucky Long Rifle (2013)"
        text: "Kentucky designated the [Kentucky Long Rifle](/states/kentucky/firearm/kentucky-long-rifle) in 2013 via House Bill 239. The long rifle earned its name from Kentucky and Tennessee frontiersmen who used it with devastating effect at the Battle of New Orleans in 1815. The historical irony: the rifle was actually invented and manufactured in Pennsylvania by German immigrant craftsmen. Kentucky claims the legend; Pennsylvania claims the origin. Both designations are historically legitimate."
      - subtitle: "Missouri — Hawken Rifle (2023)"
        text: "Missouri is the most recent state to join the list, designating the [Hawken Rifle](/states/missouri/firearm/hawken-rifle) via Senate Bill 139 in July 2023. The Hawken was built by brothers Jacob and Samuel Hawken at their St. Louis gunshop starting in the 1820s. St. Louis was the literal gateway to the American West — the starting point of both the Santa Fe and Oregon Trails — and the Hawken was the weapon every mountain man needed to survive beyond it."
      - subtitle: "Pennsylvania — Pennsylvania Long Rifle (2014)"
        text: "Pennsylvania designated the [Pennsylvania Long Rifle](/states/pennsylvania/firearm/pennsylvania-long-rifle) via House Bill 1989 in 2014 — claiming the origin story that Kentucky's designation implied but did not state. The rifle was invented circa 1740 by German immigrant craftsmen, most notably Martin Meylin, in Lancaster County. HB 1989 was itself unusual: it began as a bill to designate the Piper J-3 Cub as the state aircraft, and the long rifle designation was added as a last-minute amendment."
      - subtitle: "Tennessee — Barrett M82 / M107 (2016)"
        text: "Tennessee's designation of the [Barrett M82](/states/tennessee/firearm/barrett-m82---m107) via HJR 0231 in 2016 stands apart from every other entry on this list. It is not a historical artifact — it is a current-production .50 BMG semi-automatic rifle used by military forces in over 60 countries. Designed by Ronnie Barrett of Murfreesboro, Tennessee in 1982 and built at Barrett Firearms Manufacturing to this day, it represents Tennessee's claim as a center of living innovation, not just heritage."
      - subtitle: "Texas — 1847 Colt Walker Pistol (2021)"
        text: "Texas designated the [1847 Colt Walker revolver](/states/texas/firearm/1847-colt-walker-pistol) via Senate Concurrent Resolution 8 in 2021. The Walker was co-designed by Texas Ranger Captain Samuel H. Walker and Samuel Colt in 1847 — the partnership that saved Colt's company from bankruptcy and produced the most powerful production revolver ever made. Approximately 160 of the original 1,100 revolvers survive; authenticated examples sell at auction for $500,000 to over $1 million."
      - subtitle: "Utah — Browning M1911 Pistol (2011)"
        text: "Utah was first. The [Browning M1911 pistol](/states/utah/firearm/browning-m1911-pistol), designated via House Bill 219 in 2011, was designed by John Moses Browning — born in Ogden, Utah in 1855 — and served as the U.S. military's standard sidearm for 74 consecutive years, through World War I, World War II, Korea, and Vietnam. Utah chose the centennial of the pistol's adoption to make the designation permanent."
      - subtitle: "West Virginia — Hall Model 1819 Flintlock Rifle (2013)"
        text: "West Virginia's [Hall Model 1819 Flintlock Rifle](/states/west-virginia/firearm/hall-model-1819-flintlock-rifle) — designated via Senate Concurrent Resolution 7 in 2013 — represents two revolutions simultaneously. It was the first breech-loading rifle adopted by any national military. And it was produced at the Harpers Ferry Armory using precision machine tools that proved, for the first time, that firearms could be assembled from fully interchangeable parts — the founding moment of American industrial mass production."

  - id: "flintlock-era"
    icon: "fa-solid fa-scroll"
    title: "The Flintlock Era: Colonial Rifles and the American Frontier"
    paragraphs:
      - "Four of the ten state firearms belong to the flintlock era: the [Grouseland Rifle (Indiana)](/states/indiana/firearm/grouseland-rifle), the [Kentucky Long Rifle](/states/kentucky/firearm/kentucky-long-rifle), the [Pennsylvania Long Rifle](/states/pennsylvania/firearm/pennsylvania-long-rifle), and the [Hall Model 1819 (West Virginia)](/states/west-virginia/firearm/hall-model-1819-flintlock-rifle). These weapons defined America's first century."
      - "The long rifle was arguably the most important firearm in American history. Developed by German immigrant gunsmiths primarily in Lancaster County, Pennsylvania in the early 1700s, it combined a rifled barrel with extraordinary length — sometimes exceeding five feet. This gave it accuracy at 200–300 yards, far beyond the effective range of the British Army's Brown Bess musket."
      - "At the Battle of New Orleans in 1815, Kentucky and Tennessee sharpshooters armed with long rifles decimated British forces from behind earthworks. The rifle's reputation spread, and it became known as the 'Kentucky rifle' even though it was made in Pennsylvania — a branding triumph that still confuses historians today. Both states now claim it as their own."
      - "West Virginia's Hall Model 1819 represents a technological leap beyond the flintlock: it was the first breech-loading military rifle adopted by the U.S. Army. Its designer, John Hancock Hall, also pioneered the concept of interchangeable parts manufactured to exact tolerances — a concept that gave birth to the American industrial revolution."

  - id: "frontier-revolvers"
    icon: "fa-solid fa-star"
    title: "Frontier Revolvers: The Colt Legacy"
    paragraphs:
      - "Two state firearms are Colt revolvers separated by 26 years of innovation: the [1847 Colt Walker (Texas)](/states/texas/firearm/1847-colt-walker-pistol) and the [1873 Colt Single Action Army (Arizona)](/states/arizona/firearm/colt-single-action-army-revolver). Together, they tell the story of how American firearms evolved from the percussion era to the metallic cartridge age."
      - "The Colt Walker of 1847 was created under urgent wartime conditions. Texas Ranger Captain Samuel Walker wrote to Samuel Colt with a list of requirements: a revolver capable of stopping a horse with one shot, reliable enough for cavalry use, and powerful enough to compete with the rifles of the era. The result weighed nearly 4.5 pounds empty and fired a .44 caliber ball with more muzzle energy than any production revolver ever built before it."
      - "The Colt Single Action Army of 1873 — the 'Peacemaker' — refined everything the Walker began. Lighter, more reliable, and chambered for the new self-contained metallic cartridge, it became the defining weapon of the American West. Sheriffs, outlaws, cowboys, and soldiers carried it. It remains in production today, over 150 years after its introduction."

  - id: "19th-century-mountain-rifle"
    icon: "fa-solid fa-mountain"
    title: "The Mountain Man's Choice: Hawken Rifle (Missouri)"
    paragraphs:
      - "Missouri's official state firearm — designated in 2023 — is the [Hawken Rifle](/states/missouri/firearm/hawken-rifle), built by brothers Jacob and Samuel Hawken at their St. Louis gunshop starting in the 1820s. St. Louis was the gateway to the West, and the Hawken became the tool of the mountain man."
      - "Where the Pennsylvania long rifle was elegant and precise, built for forest hunting, the Hawken was built for the Great Plains and Rocky Mountains. It had a shorter, heavier barrel in large calibers (.50 to .55) capable of bringing down bison, elk, and grizzly bears. It was the choice of Jim Bridger, Kit Carson, and the fur trappers who explored and mapped the American interior."
      - "Missouri's designation reflects the state's unique position as both the origin point and the supply depot of westward expansion. The Santa Fe Trail and the Oregon Trail both began in Missouri, and the Hawken Rifle went with nearly every expedition that followed them."

  - id: "modern-era"
    icon: "fa-solid fa-crosshairs"
    title: "The Modern Era: Barrett M82 (Tennessee)"
    paragraphs:
      - "Tennessee's 2016 designation of the [Barrett M82](/states/tennessee/firearm/barrett-m82---m107) stands apart from every other state firearm. It is not a historical artifact or a colonial relic — it is a current-production military weapon used by armed forces in over 60 countries."
      - "Ronnie Barrett designed the M82 in 1982 in his home state of Tennessee, initially rejected by major manufacturers who called it impractical. He built it himself, sold it himself, and proved them wrong. The rifle fires the .50 BMG cartridge — originally designed for machine guns — and is capable of engaging targets at over a mile with precision."
      - "Barrett Firearms Manufacturing is headquartered in Murfreesboro, Tennessee. The Tennessee legislature's decision to designate the M82 was an explicit recognition of the company's economic contribution to the state and Ronnie Barrett's status as a living embodiment of American innovation and entrepreneurship."

  - id: "browning-m1911"
    icon: "fa-solid fa-shield"
    title: "The Soldier's Pistol: Browning M1911 (Utah)"
    paragraphs:
      - "No American firearm has a longer or more distinguished military service record than the [Browning M1911](/states/utah/firearm/browning-m1911-pistol). Adopted by the U.S. Army in 1911, it served as the standard-issue sidearm through World War I, World War II, Korea, and Vietnam — a span of over 70 years of continuous service."
      - "John Moses Browning designed the M1911 in his hometown of Ogden, Utah. The pistol's design — a single-stack .45 ACP magazine feeding a tilting-barrel locked-breech action — was so superior to everything that came before it that it remains the template for most modern semi-automatic pistols manufactured today."
      - "Utah designated the M1911 in March 2011, on the weapon's centennial anniversary. The legislation noted Browning's Utah roots and the pistol's unparalleled service record. Today, Utah is also home to the Browning museum in Ogden, which displays original prototypes and the full history of one of history's most productive firearm designers."

  - id: "states-without-firearms"
    icon: "fa-solid fa-circle-question"
    title: "Why Don't Other States Have an Official Firearm?"
    paragraphs:
      - "Only 10 of 50 U.S. states have designated an official state firearm — which means 40 states have not. The question is not whether a historical or cultural case could be made for other states. It could. Montana has the Sharps rifle and the buffalo hunter tradition. Wyoming has the Winchester Model 1873. Idaho sits at the intersection of mountain man, Lewis and Clark, and Nez Perce firearms history. The question is whether a legislature can agree."
      - "State firearm designations fail for predictable reasons. Larger urban populations tend to oppose them, viewing official gun designations as politically tone-deaf in cities with active gun violence challenges. Divided legislatures — where suburban swing districts hold the balance of power — rarely produce the supermajority enthusiasm needed to pass symbolic legislation over organized opposition. And governors in purple states rarely want to sign a bill that will generate negative press coverage without delivering material policy change."
    subsections:
      - subtitle: "Montana — A Clear Cultural Case, No Designation"
        text: "Montana has perhaps the strongest cultural case of any non-designating state. The Sharps rifle — the 'Big Fifty' of the 1870s — was the primary tool of the buffalo hunters who opened the Northern Plains. Montana's identity is inseparable from that history. But Montana's legislature has not moved forward with a designation, directing political energy toward substantive firearms policy rather than symbolic declarations."
      - subtitle: "Wyoming — The Cowboy State Without a Cowboy Gun"
        text: "Wyoming, the self-styled 'Cowboy State,' has never designated a state firearm despite having an obvious candidate in the Winchester Model 1873 — 'The Gun That Won the West.' The Winchester was chambered in the same cartridge as the Colt SAA, making it the natural paired companion to Arizona's already-designated state firearm. Wyoming's legislature has considered the question but has not acted."
      - subtitle: "Idaho — Mountain Man Tradition, No Official Symbol"
        text: "Idaho sits at the intersection of the mountain man rifle tradition, the Lewis and Clark expedition, and the Nez Perce warrior culture — all of which have distinct associated firearms. But Idaho has not designated a state firearm. The state's overwhelmingly rural legislature is not opposed in principle; the designation simply has not been a legislative priority."
      - subtitle: "The Broader Pattern"
        text: "The 10 states that have designated firearms share a common political profile: rural-majority or rural-leaning legislatures, strong hunting cultures, and governors willing to sign. The 40 states without designations represent the rest of the spectrum — not necessarily opposition, but the absence of the specific alignment of will, timing, and champion legislator that turns a good idea into enacted law."

  - id: "states-failed-firearm"
    icon: "fa-solid fa-ban"
    title: "States That Tried and Failed: Bills That Didn't Pass"
    subsections:
      - subtitle: "The Political Arithmetic of Failure"
        text: "For every state that has passed a state firearm designation, several others have introduced bills that stalled, died in committee, or failed on the floor. The pattern is consistent: bills tend to fail in states with larger urban populations, divided legislatures, or governors unwilling to sign. The same bill that passes 55-17 in a rural-majority legislature fails 48-52 in a chamber where suburban districts hold the balance of power."
      - subtitle: "New Hampshire"
        text: "New Hampshire, home to one of the strongest gun cultures in the Northeast, has seen proposals to designate the Model 1895 Winchester or a colonial-era musket as the state firearm. Bills have repeatedly cleared initial committee hearings but failed to advance, reflecting the state's complex mix of libertarian-leaning gun rights voters and a legislature with divided suburban representation."
      - subtitle: "Colorado"
        text: "Colorado introduced state firearm legislation in the early 2010s, during the same wave that saw six other states pass designations. The bills did not advance, in part due to the political shift in Colorado's legislature following rapid population growth in the Denver metro area. Colorado's experience illustrates how demographic change can close windows that once appeared open."
      - subtitle: "Why Opposition Forms"
        text: "Opposition to state firearm bills follows predictable lines. Critics argue the designations are politically symbolic rather than historically meaningful, that they normalize firearm culture in official state identity, or that the legislative time would be better spent elsewhere. In states where these arguments carry majority weight, the bills don't pass. The 10 states that have succeeded share a common feature: a legislature where the historical and cultural case for the specific firearm overcame those objections."

  - id: "state-rifle-vs-state-firearm"
    icon: "fa-solid fa-scale-balanced"
    title: "State Rifle vs. State Firearm: Does the Designation Type Matter?"
    paragraphs:
      - "Not every state uses the same language. Most of the 10 designations on this list use the term 'state firearm' — a broad category that covers pistols, revolvers, and rifles alike. But Tennessee is an exception: HJR 0231 (2016) designated the Barrett M82 specifically as the state's official 'state rifle,' not 'state firearm.' The distinction reflects the M82's identity as a long gun, and some legislators preferred the narrower term."
      - "The difference matters more than it might appear. A 'state firearm' designation can include a pistol (Utah's M1911), a revolver (Arizona's Colt SAA, Texas's Colt Walker), or a rifle — it places no restriction on type. A 'state rifle' designation is limited to long guns by definition. States choosing the broader 'state firearm' label give themselves more flexibility in what they can honor."
      - "A handful of states have at various times considered designating both a state rifle and a separate state pistol — creating a two-tier system similar to states that have both a state dog and a state cat. None of the 10 current designating states have done so, but the legislative framework exists for any state that wants to follow that path."

  - id: "pop-culture"
    icon: "fa-solid fa-film"
    title: "In Popular Culture: State Firearms on Screen"
    subsections:
      - subtitle: "Colt Single Action Army — The Hollywood Revolver"
        text: "No firearm appears more often in American cinema than the Colt Single Action Army. It is the default 'Western revolver' in hundreds of films, from John Ford's classics to Clint Eastwood's spaghetti Westerns to Quentin Tarantino's The Hateful Eight. Its silhouette — the long barrel, the exposed hammer, the curved grip — is one of the most recognizable shapes in popular culture."
      - subtitle: "Hawken Rifle — Jeremiah Johnson"
        text: "Robert Redford's 1972 film Jeremiah Johnson brought the Hawken Rifle to mainstream audiences. The film follows a mountain man in the Rocky Mountains, and the Hawken is his constant companion — used for hunting, survival, and ultimately warfare. The film is considered one of the most accurate portrayals of mountain man life ever made."
      - subtitle: "Colt Walker — True Grit"
        text: "The Coen Brothers' True Grit (2010) prominently features a Colt Walker revolver, emphasized specifically for its enormous size and frightening power. The weapon's impracticality — it is genuinely difficult to shoot accurately due to its weight — becomes part of the character of the story."
      - subtitle: "Barrett M82 — Call of Duty and Sniper"
        text: "The Barrett M82 is one of the most recognized firearms in video games, appearing in every major Call of Duty title. In film, it appears in Sniper (1993) and its sequels, American Sniper (2014), and dozens of action movies. Its distinctive muzzle brake and massive scale make it instantly identifiable even to audiences with no firearms knowledge."

  - id: "interesting-facts"
    icon: "fa-solid fa-lightbulb"
    title: "Key Facts About Official State Firearms"
    style: "gradient"
    facts:
      - "Only 10 of 50 U.S. states have designated an official state firearm as of 2026"
      - "Utah was first in 2011; Missouri was most recent in 2023"
      - "The Colt Single Action Army has been in continuous production since 1873 — over 150 years"
      - "Indiana's Grouseland Rifle is the only designation honoring a specific surviving artifact rather than a model"
      - "Kentucky and Pennsylvania both claim the same weapon — the Long Rifle — under different state names"
