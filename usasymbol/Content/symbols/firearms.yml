page:
  h1: "Official U.S. State Firearms"

  quick_answer:
    - "Only 10 U.S. states have designated an official state firearm. Utah was the first, adopting the Browning M1911 pistol in 2011."
    - "Missouri is the most recent addition — the Hawken Rifle became its official state firearm in July 2023."
    - "Tennessee's Barrett M82 is the only modern military-grade semi-automatic rifle on the list, reflecting the state's role as a center of firearm innovation."
    - "Indiana's Grouseland Rifle is unique — it honors a specific surviving artifact rather than a model, making it the rarest designation in the country."
    - "Kentucky and Pennsylvania both claim the Long Rifle — the same weapon developed by German immigrants in Pennsylvania but named for Kentucky's frontiersmen."

  intro_paragraphs:
    - "Only 10 of 50 U.S. states have designated an official state firearm. Utah was first in 2011; six of the ten weapons use 19th-century or earlier technology. All 10 designations are tied to a documented connection between the weapon and the state — a designer born there, a weapon made there, or a battle won with it."

  insights:
    - "All 10 states with official state firearms rank among the most gun-friendly in the country according to Guns & Ammo magazine's annual rankings."
    - "Six of the ten designated firearms use 19th-century or earlier technology (flintlock, percussion cap, or black powder), reflecting a deep reverence for frontier heritage."
    - "The Colt Single Action Army (Arizona) has been in continuous production since 1873 — over 150 years — making it one of the longest-running firearm designs in history."
    - "The Barrett M82 (Tennessee) is the only firearm on the list still actively manufactured and in current use by military forces worldwide."
    - "West Virginia's Hall Model 1819 was the first American firearm produced with fully interchangeable parts — the founding moment of American industrial mass production."

  methodology: "This page includes states with enacted laws designating an official state firearm. States are ordered alphabetically."

