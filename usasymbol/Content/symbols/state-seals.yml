page:
  h1: "State Seals of All 50 States"

  quick_answer:
    - "Every U.S. state has an official great seal used to authenticate government documents, legislation, and executive orders. State seals are among the oldest official state symbols — Delaware's has been in use since 1777."
    - "Rhode Island's seal design dates to 1647, making it the oldest continuously used seal imagery in the country — more than 130 years before the United States existed."
    - "California's seal features Minerva — the Roman goddess of wisdom — because California was admitted as a full state without a territorial period, just as Minerva was born an adult. The seal was designed at the 1849 Monterey Constitutional Convention."
    - "Virginia's seal, designed in the first weeks of the Revolution (1776), shows the goddess Virtus standing with one foot on the chest of a fallen king. The motto beneath reads 'Sic Semper Tyrannis' — Thus always to tyrants."
    - "Washington is the only state with a real person's face on its seal: a portrait of George Washington copied from Gilbert Stuart's 1796 painting using a hardware-store wax seal kit — and later codified as the official emblem."

  intro_paragraphs:
    - "State seals are not decorative emblems — they are legal instruments. A document bearing a state seal carries the authority of that government; governors apply it to legislation, commissions, and executive orders. All 50 remain in active legal use today, from Delaware's seal of 1777 to Hawaii's adopted at statehood in 1959."
    - "The imagery on state seals reflects who was designing them and when. The original thirteen states drew on classical antiquity — Roman goddesses, Latin mottoes, heraldic shields — because that vocabulary signaled republican seriousness. States admitted during the frontier period put miners, farmers, steamboats, and railways on their seals. Western states added the landscapes their settlers had crossed to get there. Read in sequence, the 50 seals trace the geography and economy of American expansion."
    - "Unlike state flags, which can vary widely in design, state seals follow a consistent format: a circular emblem with the state motto, the year of founding or admission, and a central composition. The specific figures vary dramatically — from the spare (Rhode Island's golden anchor and one word: 'Hope') to the densely packed (California's Minerva, grizzly bear, gold miner, ships, mountains, and 31 stars)."

  insights:
    - "Classical mythology dominates early state seals. Virginia (Virtus), California (Minerva), New York (Liberty and Justice), New Jersey (Ceres and Liberty), and Iowa all use Roman goddess figures as central images."
    - "Several seals depict the state's dominant industry at the time of design: California's miner, Michigan's elk and moose, Wyoming's cattle rancher, Montana's mining tools and Great Falls."
    - "Latin mottoes appear on the majority of state seals, even for states that never had significant Latin-speaking populations — the language signaled Republican seriousness and connection to ancient precedent."
    - "Oklahoma's seal is the most politically dense: the central star is divided into five sections, each containing the official seal of one of the Five Civilized Tribes — Cherokee, Choctaw, Chickasaw, Creek, and Seminole — nations that held legal sovereignty over the territory before statehood."
    - "The grizzly bear appears on California's seal but the California grizzly has been extinct since 1922. The state continues to use it on both the seal and as the official state animal."
    - "Minnesota redesigned its seal in 1983 specifically to remove imagery considered demeaning to Native Americans. Massachusetts revised its seal in 2022 for the same reason, removing a European sword from next to the Native American figure."
    - "Idaho's seal is the only one designed by a woman: Emma Edwards Green won a design competition in 1891. Her composition placed a woman representing justice beside a miner — an unusual pairing for the era."
    - "West Virginia's seal was designed in 1863, the same year the state was created by separating from Virginia during the Civil War. The crossed rifles on the seal explicitly reference that founding moment."

  sections:
    - id: seals-overview
      icon: fa-solid fa-stamp
      title: State Seals of All 50 States
      paragraphs:
        - 'State seals are legal instruments, not decorative emblems. All 50 state seals remain in active legal use today — from Delaware''s 1777 design to Hawaii''s 1959 seal — authenticating legislation, commissions, and executive orders issued under the governor''s authority.'
        - 'The imagery on each seal reflects who was doing the designing and when. The original thirteen states drew on classical antiquity — Roman goddesses, Latin mottoes, heraldic shields — because that vocabulary signaled republican seriousness. States admitted during the frontier period put miners, farmers, steamboats, and railways on their seals.'
        - 'Western states added the specific landscapes their settlers had crossed to get there. Read in sequence, the 50 seals trace the geography and economy of American expansion from the Atlantic coast to Hawaii.'

    - id: notable-seals
      icon: fa-solid fa-star
      title: Most Distinctive State Seals
      paragraphs:
        - 'Most state seals require some context to read correctly. These six contain imagery that is either misidentified by most viewers, encodes a specific historical event, or has a backstory that changes what you see when you look at it.'
      highlights:
