  description: "Washington's seal was made from a hardware-store wax kit in 1889. All 50 official great seals with images, adoption years, and key imagery explained."

page:
  h1: "State Seals of All 50 U.S. States"

  quick_answer:
    - "Every U.S. state has an official great seal used to authenticate government documents and legislation. State seals are among the oldest official state symbols, most dating to the early statehood period."
    - "California's seal features Minerva — the Roman goddess of wisdom — because California was admitted as a full state without a territorial period, just as Minerva was born an adult. The seal was designed at the 1849 Monterey Constitutional Convention."
    - "Many state seals depict allegorical figures, classical goddesses, and regional landscapes. Some — like Virginia's — show dramatic scenes: Virginia's seal depicts Virtus, the goddess of virtue, standing over a fallen tyrant."
    - "The oldest continuously used state seal design is Connecticut's, based on a seal used by the Connecticut Colony as far back as 1647."
    - "Several states have revised their seals significantly. Minnesota redesigned its seal in 1983 to remove imagery considered demeaning to Native Americans."

  intro_paragraphs:
    - "State seals are the oldest and most legally significant of all official state symbols. They predate statehood in many cases — Connecticut's seal design traces back to 1647, more than a century before the state existed. The seal is the instrument that gives official acts their legal weight: legislation, commissions, and executive orders are authenticated by the governor's application of the state seal."
    - "The imagery on state seals reflects the moment of each state's founding. Seals designed in the early national period draw heavily from classical antiquity — Roman and Greek goddesses, Latin mottoes, shields and spears. Seals from the frontier period of the mid-1800s often feature agricultural and industrial scenes: miners, farmers, factories, and rivers. Later seals tend toward greater formalism, codifying earlier designs rather than introducing new ones."
    - "Unlike state flags, which can be widely varied in design, state seals follow a consistent format: a circular emblem bearing the state's motto, the year of admission or founding, and a central composition of symbolic figures. The specific figures vary dramatically — from the relatively spare (Nevada: a silver star and 'Battle Born') to the densely packed (California: Minerva, a grizzly bear, a gold miner, ships, mountains, and 31 stars)."

  insights:
    - "Classical mythology dominates early state seals. Virginia (Virtus), California (Minerva), and New York (Liberty and Justice) all use Roman goddesses as central figures."
    - "Several seals depict the state's dominant industry at the time of design: California's miner, Michigan's elk and moose, Wyoming's cattle."
    - "Latin mottoes appear on the majority of state seals, even for states that never had significant Latin-speaking populations — the language signaled Republican seriousness and connection to ancient precedent."
    - "Three state seals use the phrase 'In God We Trust' — Georgia, Florida, and Mississippi — though the phrase did not become the U.S. national motto until 1956."
    - "The grizzly bear appears on California's seal but the California grizzly has been extinct since 1922. The state continues to use it as both the seal's central animal and the state's official animal."

  sections:
    - id: seals-overview
      icon: fa-solid fa-stamp
      title: State Seals of All 50 States
      paragraphs:
        - 'State seals are not decorative emblems — they are legal instruments. A document bearing a state seal carries the authority of that government; governors are required to apply it to legislation, commissions, and executive orders. All 50 state seals remain in active legal use today, from Delaware''s seal of 1777 to Hawaii''s adopted at statehood in 1959.'
        - 'The imagery on each seal reflects who was doing the designing and when. The original thirteen states drew on classical antiquity — Roman goddesses, Latin mottoes, heraldic shields — because that vocabulary signaled republican seriousness.'
        - 'States admitted during the frontier period put miners, farmers, steamboats, and railways on their seals — the industries that justified statehood. Western states added the specific landscapes their settlers had crossed to get there. Read in sequence, the 50 seals trace the geography and economy of American expansion.'

    - id: notable-seals
      icon: fa-solid fa-star
      title: Most Distinctive State Seals
      paragraphs:
        - 'Most state seals require some context to read correctly. The six below contain imagery that is either misidentified by most viewers, encodes a specific historical event, or has a backstory that changes what you see when you look at it.'
      highlights:
        - name: Virginia — Virtus Over a Fallen Tyrant
          state: virginia
          image: /images/seals/virginia/seal.webp
          description: Virginia's seal, adopted in 1776, shows Virtus — the Roman goddess of virtue — standing with one foot on the chest of a fallen king, his crown rolling away on the ground. The motto beneath reads "Sic Semper Tyrannis" (Thus always to tyrants). It was designed in the first weeks of the Revolution, and it reads as a declaration of intent rather than a symbol of a place.

        - name: Louisiana — The Pelican in Her Piety
          state: louisiana
          image: /images/seals/louisiana/seal.webp
          description: Louisiana's seal shows a pelican feeding her three chicks — and in the medieval tradition the image draws from, she is feeding them from a wound in her own breast, not from caught fish. The image is called "the pelican in her piety" and was a symbol of self-sacrifice in pre-Christian and later Christian iconography. Louisiana adopted it at statehood in 1812. Almost no one who looks at the seal recognizes what the pelican is actually doing.

        - name: Washington — The Only Portrait Seal
          state: washington
          image: /images/seals/washington/seal.webp
          description: Washington is the only state seal bearing the face of a real historical person. The portrait is George Washington, taken from Gilbert Stuart's 1796 painting. The seal was made in 1889 using a hardware-store wax seal kit and a photograph of the painting — a practical improvisation that was later codified as the official state emblem and has remained unchanged since.

        - name: New Mexico — Two Eagles, One Transfer
          state: new-mexico
          image: /images/seals/new-mexico/seal.webp
          description: New Mexico's seal shows a small American bald eagle perched on top of a larger Mexican golden eagle — the eagle from Mexico's coat of arms, shown holding a snake. The American eagle partially covers the Mexican one. The image records the 1848 transfer of the territory from Mexico to the United States in heraldic terms, with one national symbol literally superseding the other.

        - name: Oklahoma — The Five Nations
          state: oklahoma
          image: /images/seals/oklahoma/seal.webp
          description: Oklahoma's central star is divided into five sections, each containing the seal of one of the Five Civilized Tribes forcibly relocated to Indian Territory in the 1830s — Cherokee, Choctaw, Chickasaw, Creek, and Seminole. Around it, 45 smaller stars mark the states at the time of Oklahoma's 1907 admission. The tribal seals are not decorative; each represents a nation that held legal sovereignty over the territory before statehood.

        - name: Connecticut — In Use Since 1647
          state: connecticut
          image: /images/seals/connecticut/seal.webp
          description: Connecticut's seal shows three grapevines, an image carried forward from the Connecticut Colony's seal of 1647 — more than 130 years before the state existed. The current design was formalized in 1784. The three vines represent the original colonial settlements of Hartford, Windsor, and Wethersfield. The design has been in continuous official use longer than the United States has been a country.

  methodology: "This page lists the official great seal for each U.S. state. Adoption years reflect the first formal adoption of the seal or its current authoritative design version. For states that have substantially revised their seals, both dates are noted where relevant."

