page:
  h1: "State Mottos of All 50 U.S. States"
  
  quick_answer:
    - "All 50 U.S. states have an official motto, most adopted by state legislature and a few embedded in state constitutions."
    - "Rhode Island has the shortest state motto — just one word: 'Hope' (1664). Massachusetts has the longest: the 14-word Latin phrase 'Ense petit placidam sub libertate quietem,' meaning 'By the sword we seek peace, but peace only under liberty.'"
    - "Latin is the most common language, used by 23 states. English comes next with 22. The remaining five use Greek, Hawaiian, French, Spanish, Italian, or Chinook Jargon."
    - "New Hampshire's 'Live Free or Die' is widely considered the most iconic state motto in America."

  intro_paragraphs:
    - "Every U.S. state has at least one official motto — a word or phrase that appears on the state seal, state flag, and legal documents. Unlike nicknames and tourism slogans, mottos carry formal legal status: adopted by state legislatures or embedded in state constitutions. A handful of states maintain two official mottos; a few have changed theirs over time."
    - "Latin is the dominant language, used by 23 states — a legacy of 18th- and 19th-century legal tradition. English comes next with 22 states. The remaining five use Greek, Hawaiian, French, Spanish, Italian, or Chinook Jargon. Rhode Island's single-word 'Hope' (1664) is the shortest; Massachusetts's 14-word Latin phrase from 1775 is the longest."

  insights:
    - "Latin dominates state mottos because most were adopted in the 18th and 19th centuries, when Latin was the standard language of law and scholarship."
    - "Five states reference God or a deity in their mottos: Arizona ('God enriches'), Colorado ('Nothing without the Deity'), Florida ('In God We Trust'), Ohio ('With God, all things are possible'), and South Dakota ('Under God the people rule')."
    - "Hawaii's motto is the only one in a Native Hawaiian language: 'Ua mau ke ea o ka āina i ka pono' — first spoken by King Kamehameha III in 1843 after British sovereignty was restored."
    - "Virginia's 'Sic semper tyrannis' (Thus always to tyrants) dates to 1776, though it gained notoriety when John Wilkes Booth reportedly shouted it after assassinating President Lincoln."
    - "Montana is the only state with a Spanish motto: 'Oro y plata' (Gold and silver), reflecting its mining heritage."
 
  methodology: "This list includes the official state motto for each of the 50 U.S. states as designated by state legislatures or established through official state seals. For states with two mottos, the primary or most widely recognized motto is listed first. Translations follow the most commonly accepted English versions."
  
  sources:
    - name: "National Conference of State Legislatures"
      url: "https://www.ncsl.org/"
      description: "State government data and legislative information"
