seo:
  title: State Cookies | Official List, Map & Facts
  description: New Mexico, Massachusetts, Alabama and North Carolina have an official state cookie. New Mexico named the first one, the bizcochito, in 1989.
page:
  h1: List of State Cookies
  quick_answer:
  - "New Mexico named the bizcochito, an anise cookie, its official state cookie in 1989, the first of any state. Massachusetts followed with the chocolate chip cookie in 1997."
  - "Alabama chose the Yellowhammer cookie in 2023, named for its state bird. North Carolina picked the Moravian cookie in 2026, a paper-thin spiced cookie from Old Salem."
  intro_paragraphs:
  - "State cookies are a young kind of symbol. Only New Mexico's predates 1997, and North Carolina's was named just this year."
  - "Each cookie carries a local story, from a Spanish colonial recipe in New Mexico to a Massachusetts inn where a famous cookie was improvised."
  sections:
  - id: cookies-overview
    icon: fa-solid fa-cookie-bite
    title: Official State Cookies by State
    paragraphs:
    - "The bizcochito is flavored with anise and cinnamon and has long been baked for weddings, feast days and Christmas. Its recipe came north with Spanish colonists, which makes it far older than the 1989 law."
    - "Massachusetts claims the chocolate chip cookie because Ruth Wakefield created it at the Toll House Inn in Whitman in the 1930s. Nestlé later began printing her recipe on its chocolate bar wrappers, which spread it across the country."
  - id: cookies-regional
    icon: fa-solid fa-circle-info
    title: Alabama and North Carolina Cookies
    paragraphs:
    - "North Carolina's Moravian cookie comes from the Moravian settlers who founded Salem, now part of Winston-Salem, in 1766. The dough is spiced and rolled so thin that the cookie snaps."
    - "Alabama's Yellowhammer cookie takes its name from the yellowhammer, the state bird. Cakes, muffins and pastries have their own entries on the [State Desserts & Sweets](/symbols/desserts) list."
  methodology: Adoption years reflect the year of official legislative designation.
