sections:
  - id: "eagles-vs-pelican"
    icon: "fa-solid fa-crow"
    title: "Eagles Dominate, But Louisiana Stands Apart"
    paragraphs:
      - "Seven of the eight bird-featuring state flags display the bald eagle, America's national emblem since 1782. These states chose the eagle to demonstrate loyalty to the Union and connection to founding American ideals like freedom, strength, and independence. The eagle's symbolism transcends regional identity — it represents national rather than local values."
      - "Louisiana breaks this pattern spectacularly. The state flag features a brown pelican in a nest feeding three chicks with drops of its own blood — an ancient symbol called 'pelican in her piety.' This imagery comes from medieval Christian tradition, where pelicans were believed to wound themselves to feed their young during famine, representing ultimate parental sacrifice. Louisiana's motto 'Union, Justice, Confidence' appears on a banner below."
      - "The brown pelican is Louisiana's official state bird and appears prominently on the state seal adopted in 1902. Unlike generic eagle symbolism shared by seven states, Louisiana's pelican is deeply connected to the state's coastal identity, wetlands heritage, and Gulf of Mexico ecosystem. The bird nearly went extinct in Louisiana during the 1960s due to DDT pesticide but has since recovered — a conservation success story that made the symbol even more meaningful."

  - id: "flag-vs-state-birds"
    icon: "fa-solid fa-triangle-exclamation"
    title: "Why Flag Birds Don't Match State Birds"
    paragraphs:
      - "A fascinating quirk: only Louisiana features its official state bird on its flag. The other seven states display birds that aren't their state birds. Illinois's flag shows a bald eagle, but the state bird is the Northern Cardinal. North Dakota's flag features an eagle, but the state bird is the Western Meadowlark. Iowa's flag shows an eagle, but the state bird is the Eastern Goldfinch (American Goldfinch)."
      - "This mismatch reveals the different purposes these symbols serve. State birds, mostly adopted in the 1920s-1940s through public votes, celebrate regional wildlife and ecosystems. Children and garden clubs voted for birds they saw in their backyards — cardinals, robins, meadowlarks. These selections emphasized local pride and natural heritage."
      - "Flag birds, in contrast, represent political values and national identity. Eagles on flags say 'we are American' rather than 'we are Midwestern' or 'we are coastal.' States chose eagles to demonstrate Union loyalty, especially during the nationalistic periods following the Civil War, Spanish-American War, and World War I. Louisiana's pelican is the remarkable exception — it represents Louisiana-specific identity and even appears on the state nickname ('The Pelican State')."

  - id: "eagle-symbolism-patterns"
    icon: "fa-solid fa-shield-halved"
    title: "Common Eagle Symbolism Across State Flags"
    paragraphs:
      - "The seven eagle-bearing state flags share remarkably similar symbolism, borrowed directly from the Great Seal of the United States. Nearly all show the bald eagle holding olive branches (representing peace) in its right talon and arrows (representing military strength) in its left. The eagle faces the olive branch side, symbolizing America's preference for peace over war — a deliberate choice by the founding fathers in 1782."
      - "The number 13 appears repeatedly in eagle flag designs: 13 stars, 13 arrows, 13 olive leaves, 13 stripes on shields. These elements honor the original thirteen colonies, creating visual continuity between newer states and America's founding. Even states that joined the Union a century later — like North Dakota (1889) — use this colonial symbolism to claim heritage in the American founding narrative."
      - "Most eagle flags display a shield on the bird's breast with red and white stripes representing the original states. The shield symbolizes self-reliance and defense — the eagle supports itself without external help, just as America defends itself. Some flags add state-specific elements: Illinois includes the state motto, Iowa shows a flying rather than static eagle, and Pennsylvania uses a golden rather than natural-colored eagle."

  - id: "design-prominence"
    icon: "fa-solid fa-eye"
    title: "How Prominently Do Birds Appear?"
    paragraphs:
      - "State flags vary dramatically in how prominently they feature birds. Iowa's flag gives the eagle maximum visibility — it flies boldly across the wide white central stripe of a tricolor flag, carrying a ribbon with the state motto. This horizontal flying pose makes the eagle impossible to miss and distinguishes Iowa's design from typical seal-on-bedsheet patterns."
      - "North Dakota similarly emphasizes its eagle, placing it front and center on a blue field with minimal other elements. The eagle, shield, ribbon, and stars comprise the entire design — clean and heraldic. Louisiana's pelican also dominates its flag, appearing large on a blue field with the nest and chicks clearly visible even from a distance."
      - "In contrast, several eagle-bearing states (Michigan, Missouri, Pennsylvania) feature birds as small components of elaborate state seals where they compete for attention with ships, miners, mountains, plows, and Latin mottos. These birds require close examination to identify, violating modern flag design principles favoring simple, recognizable symbols."

  - id: "louisiana-pelican-story"
    icon: "fa-solid fa-heart"
    title: "The Louisiana Pelican: A Unique State Symbol"
    paragraphs:
      - "Louisiana's brown pelican flag tells a remarkable story of symbolism, extinction, and recovery. The 'pelican in her piety' image — showing a mother pelican feeding chicks with her own blood — dates to medieval European heraldry and Christian iconography. Early Louisiana colonists adopted this symbol, which appeared on Louisiana's first state seal in 1812, just months after statehood."
      - "The current flag design was officially adopted in 1912 during Louisiana's statehood centennial celebration. The pelican appears in white on a blue field, standing in a nest with three chicks. Drops of blood fall from the mother's breast to feed her young — a powerful image of parental sacrifice that resonated with Louisiana's cultural values. The banner below reads 'Union, Justice, Confidence,' Louisiana's state motto adopted in 1864."
      - "Tragically, brown pelicans disappeared entirely from Louisiana by 1963, victims of DDT pesticide poisoning that thinned their eggshells. After DDT was banned in 1972, Louisiana reintroduced pelicans from Florida. The population recovered so successfully that brown pelicans were removed from the endangered species list in 2009. Today, over 40,000 pelicans thrive along Louisiana's coast — making the flag symbol a living conservation success story rather than a memorial to an extinct species."

  - id: "flag-design-patterns"
    icon: "fa-solid fa-palette"
    title: "Common Design Patterns in Bird Flags"
    paragraphs:
      - "Most eagle flags follow a 'seal-on-bedsheet' design pattern — a state seal featuring an eagle placed on a solid blue background. Illinois, Michigan, New York, North Dakota, and Pennsylvania all use this approach. Critics argue this makes state flags hard to distinguish from a distance, violating good flag design principles that favor simple, recognizable symbols."
      - "Iowa breaks this pattern with its tricolor design (blue, white, red vertical stripes) inspired by the French flag, acknowledging France's historical claim to Iowa territory through the Louisiana Purchase. The eagle appears only on the white stripe, making Iowa's flag more distinctive and easier to identify than typical seal-on-blue designs."
      - "Louisiana also avoids the seal-on-bedsheet problem. The white pelican on blue is simple, bold, and recognizable from a distance. Pennsylvania's golden eagle (rather than the traditional bald eagle coloring) makes its flag slightly more distinctive. Michigan's inclusion of an elk and moose supporting the shield adds unique wildlife elements. However, flag design experts consistently rank most eagle flags among America's worst-designed state flags due to complexity and similarity."

  - id: "historical-adoption"
    icon: "fa-solid fa-timeline"
    title: "When States Adopted Bird Flags"
    paragraphs:
      - "Most bird-bearing state flags were adopted during two distinct periods of American nationalism. The first wave came 1901-1913: New York (1901), Pennsylvania (1907), Michigan (1911), North Dakota (1911), Louisiana (1912), and Missouri (1913). This period followed the Spanish-American War (1898), when American imperialism and patriotic fervor ran high."
      - "The second wave occurred 1915-1921 during and after World War I: Illinois (1915) and Iowa (1921). World War I intensified American nationalism and prompted many states to adopt or modify official symbols. Illinois even modified its flag in 1970 to add the word 'ILLINOIS' after Vietnam War soldiers couldn't identify which state it represented — the seal looked too similar to other states' designs."
      - "This timing wasn't coincidental. Both periods saw Americans questioning their national identity and place in the world. Displaying the bald eagle — symbol of American power and independence — allowed states to proclaim loyalty to the Union and shared values. Birds on flags served political purposes, declaring 'we are American' during moments when that identity needed reinforcement."

  - id: "bird-species-facts"
    icon: "fa-solid fa-feather"
    title: "About the Birds on State Flags"
    paragraphs:
      - "The bald eagle (Haliaeetus leucocephalus) appears on seven state flags but nearly went extinct by the 1960s. DDT pesticide poisoning caused eggshell thinning, reducing the U.S. population to just 417 breeding pairs in 1963. After DDT was banned in 1972 and the Endangered Species Act provided protection, eagle populations recovered dramatically. Today, over 300,000 bald eagles live in North America, including healthy populations in flag-bearing states like Iowa, Illinois, and Michigan."
      - "Brown pelicans (Pelecanus occidentalis) are large coastal birds with 6-7 foot wingspans found along the Gulf Coast and both U.S. coasts. They're spectacular divers, plunging from heights of 60 feet to catch fish. Like bald eagles, brown pelicans nearly went extinct due to DDT — they disappeared entirely from Louisiana by 1963. Reintroduction programs and pesticide bans allowed recovery. Louisiana's pelican population now exceeds 40,000 birds."
      - "Bald eagles mate for life and return to the same nest each year, adding new material until some nests reach 2,000 pounds and the size of a small car. They can live 20-30 years in the wild. Their wingspan reaches 6-8 feet, and they can dive at speeds over 100 mph when hunting fish. Native American tribes consider eagles sacred, using their feathers in important ceremonies — federal law allows only enrolled tribal members to possess eagle feathers."

  - id: "flag-design-quality"
    icon: "fa-solid fa-star-half-stroke"
    title: "Flag Design: Simple Birds vs. Complex Seals"
    paragraphs:
      - "Flag design experts often criticize state flags with birds, particularly those following the 'seal-on-bedsheet' pattern where complex state seals appear on solid blue backgrounds. The North American Vexillological Association's 2001 survey of state flag designs ranked many bird flags in the bottom half due to their complexity and similarity to other state flags."
      - "Good flag design follows five principles: simplicity, meaningful symbolism, limited colors (2-3), no lettering, and distinctive design. Louisiana's pelican flag succeeds by these standards — the white pelican on blue is simple, distinctive, and recognizable from a distance. Iowa's flying eagle similarly works well. But flags like Michigan (with eagles competing against elk, moose, and Latin text) fail the simplicity test."
      - "The fundamental problem: state seals designed for close inspection on documents don't work as flags meant to fly at a distance. A bird within a circular seal surrounded by text becomes an indistinct blob from 100 feet away. States like Maryland (unique geometric pattern), New Mexico (simple Zia sun symbol), and Texas (lone star) prove that simple, bold designs work better — yet most bird-bearing states chose complexity over clarity."

faq:
  - question: "Which state flags have birds on them?"
    answer: "Eight U.S. state flags feature birds: Illinois, Iowa, Louisiana, Michigan, Missouri, New York, North Dakota, and Pennsylvania. Seven states display bald eagles, while Louisiana uniquely features a brown pelican."
  
  - question: "What state flag has a pelican?"
    answer: "Louisiana's state flag features a brown pelican feeding its young with drops of blood, symbolizing parental self-sacrifice. This 'pelican in her piety' image comes from medieval heraldry and has represented Louisiana since 1812. Louisiana is the only state with a pelican on its flag."
  
  - question: "How many state flags have eagles?"
    answer: "Seven state flags feature bald eagles: Illinois, Iowa, Michigan, Missouri, New York, North Dakota, and Pennsylvania. All seven use the bald eagle to symbolize American values like freedom, strength, and national unity."
  
  - question: "Does any state flag show the state bird?"
    answer: "Only Louisiana features its official state bird (brown pelican) on its flag. All other states with birds on flags display different species than their official state birds — most show bald eagles while having cardinals, robins, or other birds as state birds."
  
  - question: "Why do state flags use eagles instead of state birds?"
    answer: "State flags use bald eagles to represent national identity and American values rather than regional wildlife. Eagles symbolize the federal union and shared founding principles, while state birds celebrate local ecosystems and natural heritage. These symbols serve different purposes."
  
  - question: "What does the Louisiana pelican symbolize?"
    answer: "Louisiana's pelican represents parental devotion and self-sacrifice. The image shows a mother pelican feeding chicks with her own blood, based on medieval Christian symbolism. The pelican also represents Louisiana's coastal identity, wetlands heritage, and conservation success after near-extinction."
  
  - question: "Which state flag has the best bird design?"
    answer: "Iowa and Louisiana have the most effective bird flag designs according to vexillology experts. Iowa's flying eagle is bold and distinctive, while Louisiana's pelican on blue is simple and recognizable. Both avoid the 'seal-on-bedsheet' pattern that makes many eagle flags difficult to identify."
  
  - question: "When were bird flags adopted?"
    answer: "Most bird-bearing state flags were adopted 1901-1921 during two waves of American nationalism following the Spanish-American War and World War I. Louisiana (1912), North Dakota (1911), Illinois (1915), and Iowa (1921) adopted their flags during this patriotic period."