seo:
  title: "State Flags with Birds — 8 U.S. States Featuring Birds on Their Flags"
  description: "Discover which U.S. state flags feature birds. From the bald eagle to the brown pelican, learn about the 8 states with birds on their official flags and the symbolism behind each design."

page:
  h1: "State Flags with Birds: Which States Feature Avian Symbols"
  
  quick_answer:
    - "Eight U.S. state flags feature birds: Illinois, Iowa, Louisiana, Michigan, Missouri, New York, North Dakota, and Pennsylvania."
    - "Seven states feature the bald eagle (America's national bird), while Louisiana uniquely displays the brown pelican feeding its young."
    - "Louisiana is the only state to feature both a bird on its flag AND that bird matches the official state bird (brown pelican)."
    - "Bird imagery on state flags typically represents freedom, strength, self-sacrifice, or connection to American values."

  intro_paragraphs:
    - "Birds appear on eight U.S. state flags, serving as powerful symbols of freedom, strength, and regional identity. While seven states chose the bald eagle to represent their connection to American ideals, Louisiana stands alone with its brown pelican — a symbol of parental devotion and self-sacrifice. These avian emblems tell stories about each state's values, history, and relationship with the natural world."
    - "State flags featuring birds range from elaborate heraldic eagles mimicking the Great Seal of the United States to Louisiana's unique pelican feeding its young. Some states display birds as central design elements, while others incorporate them into complex state seals. Below, explore which states feature birds on their flags, the species represented, and the fascinating stories behind these winged symbols."

  insights:
    - "Louisiana is the only state to feature a bird other than the bald eagle on its flag — the brown pelican appears feeding its young with drops of blood, symbolizing self-sacrifice."
    - "Louisiana is also the only state where the flag bird matches the official state bird (brown pelican), making it doubly significant."
    - "North Dakota's flag shows the most detailed bird design, with an eagle nearly identical to the Great Seal holding olive branches, arrows, and a shield with 13 stripes."
    - "Iowa's flag presents a unique flying eagle pose — the bird soars horizontally across the flag rather than facing forward in traditional heraldic style."
    - "Most states with birds on their flags adopted these designs between 1900-1925, during a period of intense American nationalism following the Spanish-American War."

  methodology: "This list includes all U.S. state flags featuring birds as part of their official design, whether as primary elements or within state seals. Information verified through state government sources, vexillology databases, and historical flag documentation. Year adopted reflects official legislative adoption dates."
  
  sources:
