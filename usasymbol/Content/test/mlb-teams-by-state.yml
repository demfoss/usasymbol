page:
  h1: "MLB Teams by State: Which States Have Baseball Teams?"
  
  quick_answer:
    - "California has the most MLB teams with 4: Dodgers, Angels, Padres, and Giants. Seven states have exactly 2 teams: New York (Yankees, Mets), Texas (Rangers, Astros), Ohio (Guardians, Reds), Illinois (Cubs, White Sox), Pennsylvania (Phillies, Pirates), Missouri (Cardinals, Royals), and Florida (Marlins, Rays)."
    - "30 MLB teams play in 17 states plus Washington D.C. That means 33 states have no Major League Baseball team. The largest state without an MLB team is North Carolina (10.4 million people)."

  intro_paragraphs:
    - "Major League Baseball's 30 teams are spread across 17 U.S. states and the District of Columbia. The distribution is heavily skewed toward population centers — California alone has 4 teams, while the entire Mountain West region has just 2 (Arizona and Colorado). This guide lists every MLB team organized by state, based on where each team's home stadium is located."
    - "Some teams have names that don't match their state: the Kansas City Royals play in Missouri, not Kansas. The Texas Rangers and Houston Astros both represent Texas but sit 250 miles apart. Below you'll find every team, their home city, stadium, and league affiliation."

  insights:
    - "California leads with 4 MLB teams, followed by 7 states with 2 teams each. The remaining 9 states have just 1 team."
    - "33 states have no MLB team. The Pacific Northwest has only Seattle; the entire Southeast outside of Atlanta and Florida is unrepresented."
    - "New York City is the only metro area with 2 teams in the same city (Yankees and Mets). Chicago and Los Angeles have 2 teams each, but in different parts of the metro area."
    - "The newest MLB market is Denver (Rockies, 1993). No new cities have received expansion teams in over 25 years."
    - "Washington D.C. went 33 years without baseball (1971–2004) before the Nationals arrived from Montreal."

  methodology: "Teams are listed by the state where their home stadium is located. The Kansas City Royals are listed under Missouri (Kauffman Stadium is in Kansas City, MO). Washington D.C. is listed separately as a federal district. Data reflects the 2025 MLB season."
  
