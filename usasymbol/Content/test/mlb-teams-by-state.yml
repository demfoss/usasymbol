sections:
  - id: "states-without-mlb"
    icon: "fa-solid fa-map"
    title: "33 States Without MLB Teams"
    paragraphs:
      - "The majority of U.S. states — 33 out of 50 — have no Major League Baseball team. The largest states by population without MLB include North Carolina (10.4 million), New Jersey (9.3 million, though many residents root for NYC teams), Virginia (8.6 million), and Tennessee (7 million). These states rely on minor league affiliates or cheer for teams in neighboring states."
      - "Geographic gaps are striking. The entire Southeast outside of Atlanta and Florida has no team — North Carolina, South Carolina, Tennessee, Alabama, Mississippi, and Louisiana combined have over 35 million people and zero MLB franchises. The Mountain West is similarly sparse: only Arizona and Colorado have teams, leaving Utah, Nevada, New Mexico, and Idaho without major league baseball."
      - "Some states came close: Portland (Oregon) and Charlotte (North Carolina) have been mentioned as expansion candidates for years. Las Vegas and Nashville frequently appear on lists of potential new markets. MLB hasn't expanded since 1998 (Arizona Diamondbacks and Tampa Bay Rays), making it the longest expansion drought in modern baseball history."

  - id: "california-dominance"
    icon: "fa-solid fa-trophy"
    title: "Why California Has 4 MLB Teams"
    paragraphs:
      - "California's 4 MLB teams reflect its massive population (39 million) and geographic spread. The Dodgers and Angels serve the Los Angeles metro area (13 million people), while the Giants cover the San Francisco Bay Area (7.7 million) and the Padres represent San Diego (3.3 million). Each team has distinct regional identity despite sharing one state."
      - "This wasn't always the case. Until 1958, California had zero MLB teams — the sport was concentrated in the Northeast and Midwest. The Dodgers and Giants both relocated from New York City that year, forever changing baseball's geography. The Angels arrived in 1961 as an expansion team, and the Padres joined in 1969."
      - "California's teams have combined for 14 World Series championships: Dodgers (7), Giants (3, all in San Francisco era), Angels (1), and Athletics (4 in Oakland, though the team relocated to Sacramento in 2025). The state produces more MLB players than any other, with roughly 8% of all current players hailing from California."

  - id: "two-team-states"
    icon: "fa-solid fa-baseball"
    title: "States With Two Teams: Built-In Rivalries"
    paragraphs:
      - "Seven states plus D.C.-adjacent markets have 2 MLB teams, creating natural rivalries. The most intense is New York: Yankees vs. Mets games (called the 'Subway Series') draw massive attention despite being interleague matchups. The Yankees have 27 championships; the Mets have 2. This imbalance fuels the rivalry's intensity."
      - "Chicago's Cubs vs. White Sox rivalry predates the modern era. The Cubs play on the North Side at historic Wrigley Field (built 1914); the White Sox occupy the South Side at Guaranteed Rate Field. The teams play in different leagues and rarely met in meaningful games until interleague play began in 1997. Their 2005 matchup never happened — the White Sox won the World Series that year while the Cubs missed the playoffs."
      - "Ohio's split is geographic: Cleveland (Guardians) in the north, Cincinnati (Reds) in the south. They're 250 miles apart and play in different leagues, so the rivalry is mild. Pennsylvania is similar — Philadelphia and Pittsburgh are 300 miles apart with distinct regional identities. Missouri's division follows the same pattern: Kansas City in the west, St. Louis in the east, with the I-70 corridor separating them."

  - id: "stadium-locations"
    icon: "fa-solid fa-location-dot"
    title: "Where Teams Actually Play"
    paragraphs:
      - "Team names don't always match stadium locations. The Atlanta Braves play in Cumberland, Georgia — a suburb 10 miles northwest of downtown Atlanta. They moved from Turner Field (downtown) to Truist Park in 2017. The 'Los Angeles' Angels actually play in Anaheim, 25 miles southeast of L.A., though they officially changed their name to include Los Angeles in 2005."
      - "The Texas Rangers play in Arlington — exactly halfway between Dallas and Fort Worth. This neutral location serves the entire DFW metroplex (7.6 million people). The Kansas City Royals play in Missouri, not Kansas; Kauffman Stadium sits on the Missouri side of the state line, though Kansas City spans both states."
      - "Fenway Park (Boston Red Sox) is the oldest MLB stadium still in use, opened in 1912. Wrigley Field (Chicago Cubs) is second, opened in 1914. The newest stadium is Globe Life Field (Texas Rangers), opened in 2020. Most teams have built new stadiums since 1990 as part of baseball's 'retro ballpark' movement that started with Camden Yards (Baltimore) in 1992."

  - id: "expansion-history"
    icon: "fa-solid fa-clock-rotate-left"
    title: "How MLB Expanded Across America"
    paragraphs:
      - "MLB's geographic footprint changed dramatically in the late 20th century. Before 1953, no team existed west of St. Louis or south of Washington D.C. The Boston Braves moved to Milwaukee in 1953, starting the relocation era. The Dodgers and Giants moved to California in 1958. By 1998, MLB had teams coast-to-coast and in Florida, Arizona, and Colorado."
      - "Expansion added teams in waves: 1961 (Angels, new Senators), 1962 (Mets, Colt .45s/Astros), 1969 (Royals, Pilots/Brewers, Padres, Expos), 1977 (Blue Jays, Mariners), 1993 (Rockies, Marlins), and 1998 (Diamondbacks, Devil Rays). Each expansion brought baseball to new regions and diluted talent pools."
      - "Washington D.C. lost baseball twice — the Senators left for Minnesota (1961) and Texas (1971). The city spent 33 years without a team before the Montreal Expos relocated and became the Nationals in 2005. This remains the most recent franchise relocation, though the Athletics' move from Oakland to Sacramento in 2025 ends that streak."

faq:
  - question: "Which state has the most MLB teams?"
    answer: "California has the most MLB teams with 4: Los Angeles Dodgers, Los Angeles Angels, San Diego Padres, and San Francisco Giants. California's large population (39 million) and geographic spread support multiple franchises across different regions of the state."
  
  - question: "How many states have MLB teams?"
    answer: "17 states plus Washington D.C. have MLB teams, totaling 18 locations with 30 teams. This means 33 states have no Major League Baseball team. States with teams are concentrated along the coasts and in the Midwest."
  
  - question: "Which states have 2 MLB teams?"
    answer: "Seven states have exactly 2 MLB teams: New York (Yankees, Mets), California has 4, Texas (Rangers, Astros), Ohio (Guardians, Reds), Illinois (Cubs, White Sox), Pennsylvania (Phillies, Pirates), Missouri (Cardinals, Royals), and Florida (Marlins, Rays)."
  
  - question: "What is the largest state without an MLB team?"
    answer: "North Carolina is the largest state by population without an MLB team, with approximately 10.4 million residents. Other large states without teams include New Jersey (9.3 million), Virginia (8.6 million), and Tennessee (7 million)."
  
  - question: "Do the Kansas City Royals play in Kansas?"
    answer: "No, the Kansas City Royals play in Missouri. Kauffman Stadium is located in Kansas City, Missouri, on the Missouri side of the state line. Kansas City spans both Kansas and Missouri, but the stadium and team headquarters are in Missouri."
  
  - question: "What MLB teams are in New York?"
    answer: "New York has 2 MLB teams: the New York Yankees (play at Yankee Stadium in the Bronx) and the New York Mets (play at Citi Field in Queens). Both teams are in New York City but in different boroughs. Games between them are called the 'Subway Series.'"
  
  - question: "What MLB teams are in Texas?"
    answer: "Texas has 2 MLB teams: the Texas Rangers (play at Globe Life Field in Arlington, between Dallas and Fort Worth) and the Houston Astros (play at Minute Maid Park in Houston). Both teams are in the American League West division."
  
  - question: "When was the last MLB expansion?"
    answer: "The last MLB expansion was in 1998 when the Arizona Diamondbacks and Tampa Bay Devil Rays (now Rays) joined the league. This is the longest expansion drought in modern baseball history — over 25 years. Cities like Portland, Charlotte, Nashville, and Las Vegas have been discussed as potential expansion markets."

