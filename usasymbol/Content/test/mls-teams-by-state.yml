  description: "All 30 MLS teams listed by state and province. California and Texas have the most teams (4 and 3). Canada has 3 teams. View the complete list by stadium location."

page:
  h1: "MLS Teams by State: Which States Have Soccer Teams?"
  
  quick_answer:
    - "California has the most MLS teams with 4: LA Galaxy, LAFC, San Jose Earthquakes, and San Diego FC. Texas is second with 3 teams: Austin FC, FC Dallas, and Houston Dynamo."
    - "Florida and Ohio each have 2 teams. Florida has Inter Miami and Orlando City. Ohio has FC Cincinnati and Columbus Crew."
    - "Canada has 3 MLS teams: Toronto FC, CF Montréal, and Vancouver Whitecaps. The New York Red Bulls play in New Jersey, not New York — only NYCFC actually plays in New York State."

  intro_paragraphs:
    - "Major League Soccer has grown to 30 teams across 21 U.S. states, Washington D.C., and 3 Canadian provinces. The league has expanded rapidly since 2017, adding teams in Atlanta, Los Angeles (LAFC), Nashville, Austin, Charlotte, St. Louis, and San Diego. MLS is now the fifth major professional sports league in North America."
    - "This list is based on where each team's home stadium is located. California leads with 4 teams, followed by Texas with 3. Notably, the New York Red Bulls play in Harrison, New Jersey — not New York. Below you'll find every team organized by location, including stadium names and conference affiliations."

  insights:
    - "California has 4 MLS teams, more than any other state. The LA Galaxy and LAFC rivalry ('El Tráfico') is one of soccer's fiercest derbies."
    - "Texas has 3 teams spread across the state: Austin, Dallas, and Houston — all 200+ miles apart."
    - "The New York Red Bulls play in New Jersey (Red Bull Arena, Harrison), while NYCFC plays in New York (Yankee Stadium, Bronx)."
    - "Inter Miami, co-owned by David Beckham, became globally famous after signing Lionel Messi in 2023."
    - "Sporting Kansas City plays in Kansas (not Missouri), making Kansas one of only 21 states with an MLS team."

  methodology: "Teams are grouped by home stadium location. Data reflects the 2025 MLS season."
  
