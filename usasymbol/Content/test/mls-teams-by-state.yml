sections:
  - id: "california-soccer-capital"
    icon: "fa-solid fa-futbol"
    title: "California: America's Soccer Capital"
    paragraphs:
      - "California has 4 MLS teams — more than any other state — reflecting both its massive population (39 million) and its deep soccer culture. The LA Galaxy (est. 1996) are MLS's most decorated club with 5 championships. LAFC (est. 2018) quickly became a powerhouse, winning MLS Cup in 2022. San Jose Earthquakes are an original MLS team, and San Diego FC joined in 2025."
      - "The LA Galaxy vs. LAFC rivalry, nicknamed 'El Tráfico' (a joke about LA's infamous traffic), has become one of soccer's most intense derbies. The teams play just 15 miles apart but represent different parts of the sprawling metro area. Galaxy draws from the South Bay and Orange County; LAFC owns downtown and the Eastside."
      - "California's soccer success comes from its demographics — the state has the largest Hispanic population in the U.S. (15.5 million), and soccer is the dominant sport in Latin American culture. Youth soccer participation in California exceeds any other state, creating a pipeline of fans and players."

  - id: "red-bulls-new-jersey"
    icon: "fa-solid fa-map-location-dot"
    title: "Why the New York Red Bulls Play in New Jersey"
    paragraphs:
      - "Despite 'New York' in their name, the Red Bulls play at Red Bull Arena in Harrison, New Jersey — just across the Hudson River from Manhattan. This mirrors the NFL's Jets and Giants situation. Meanwhile, NYCFC plays at Yankee Stadium in the Bronx, making them the only MLS team actually in New York State."
      - "The Red Bulls chose New Jersey for practical reasons: land availability, lower construction costs, and easy transit access from Manhattan (PATH train). Red Bull Arena, built in 2010, is considered one of MLS's best soccer-specific stadiums. NYCFC has struggled to find a permanent home in New York City's expensive real estate market, playing in a baseball stadium not designed for soccer."
      - "The Hudson River Derby between NYCFC and Red Bulls is one of MLS's premier rivalries. It divides the metro area's soccer fans much like Yankees/Mets divide baseball fans. The Red Bulls have history (founded 1996 as MetroStars); NYCFC has star power (backed by City Football Group, Manchester City's owners)."

  - id: "messi-effect"
    icon: "fa-solid fa-star"
    title: "The Messi Effect: Inter Miami's Global Rise"
    paragraphs:
      - "Inter Miami became the world's most-watched MLS team after signing Lionel Messi in July 2023. The Argentine superstar, considered the greatest player of all time, chose Miami over offers from Saudi Arabia and European clubs. His arrival transformed MLS's global profile overnight."
      - "Inter Miami is co-owned by David Beckham, who received the franchise as part of his 2007 MLS contract. The team struggled in its first three seasons (2020-2022), but Messi's signing changed everything. Jersey sales, TV ratings, and attendance skyrocketed. Away games became sellout events as fans across North America sought to see Messi play."
      - "The 'Messi effect' extends beyond Miami. MLS secured a massive new TV deal with Apple TV ($2.5 billion over 10 years), partly driven by Messi's star power. Other global stars followed: Sergio Busquets and Jordi Alba joined Messi in Miami. Hugo Lloris went to LAFC. MLS is no longer seen as a 'retirement league' but a legitimate destination for elite players."

  - id: "soccer-specific-stadiums"
    icon: "fa-solid fa-stadium"
    title: "Soccer-Specific Stadiums: MLS's Building Boom"
    paragraphs:
      - "MLS has invested heavily in soccer-specific stadiums, moving away from shared NFL venues. Of 30 teams, 24 now play in purpose-built soccer stadiums. These venues typically seat 18,000-25,000 fans, creating intimate atmospheres impossible in 70,000-seat football stadiums."
      - "Recent stadium highlights include Nashville's GEODIS Park (30,000 seats, largest soccer-specific stadium in the U.S.), Austin's Q2 Stadium (20,738 seats, known for its steep stands), and St. Louis's CITYPARK (22,500 seats, opened 2023 with the city's first MLS team). Cincinnati's TQL Stadium and Columbus's Lower.com Field are considered among MLS's best."
      - "Some teams still share venues: Seattle Sounders and New England Revolution play in NFL stadiums (Lumen Field and Gillette Stadium). Atlanta United shares Mercedes-Benz Stadium with the Falcons but converts it to a 42,500-seat soccer configuration that creates MLS's loudest atmosphere. NYCFC remains the only team without a permanent soccer-specific home, still playing at Yankee Stadium."

  - id: "expansion-history"
    icon: "fa-solid fa-chart-line"
    title: "MLS Expansion: From 10 Teams to 30"
    paragraphs:
      - "MLS launched in 1996 with 10 teams and nearly collapsed in 2001 when the league contracted to 10 teams after folding two franchises. The turnaround began with David Beckham's arrival in 2007 and accelerated with soccer-specific stadium construction. Today's 30-team league is unrecognizable from the struggling startup of the early 2000s."
      - "The expansion era (2017-present) added 12 teams: Atlanta United (2017), LAFC (2018), FC Cincinnati (2019), Nashville SC and Inter Miami (2020), Austin FC (2021), Charlotte FC (2022), St. Louis CITY SC (2023), and San Diego FC (2025). Each team paid $200-300+ million in expansion fees — compared to $10 million in 2005."
      - "Future expansion remains possible but selective. Las Vegas, Phoenix, Detroit, San Antonio, Sacramento, and Indianapolis have expressed interest. Commissioner Don Garber has suggested 32 teams as a potential ceiling. The league prioritizes markets with committed ownership, stadium plans, and strong corporate support."

  - id: "canadian-clubs"
    icon: "fa-solid fa-maple-leaf"
    title: "Canada's Three MLS Teams"
    paragraphs:
      - "Canada has 3 MLS teams across three provinces: Toronto FC (Ontario), CF Montréal (Quebec), and Vancouver Whitecaps (British Columbia). Toronto FC (est. 2007) was the first Canadian MLS team and won the treble (MLS Cup, Supporters' Shield, Canadian Championship) in 2017 — one of soccer's most dominant single-season performances."
      - "The Canadian teams face unique challenges. They must comply with both U.S. and Canadian regulations, deal with cross-border travel logistics, and compete for fans in a country where hockey dominates. Yet all three have built passionate supporter cultures. Toronto's 'South End Supporters' and Vancouver's 'Southsiders' are among MLS's most vocal fan groups."
      - "CF Montréal (formerly Montreal Impact until 2021) operates as the only primarily French-language team in MLS. The team plays at Stade Saputo, a 19,619-seat venue in Olympic Park. Quebec's distinct culture creates a unique atmosphere — it's the closest MLS gets to a European football experience."

faq:
  - question: "Which state has the most MLS teams?"
    answer: "California has the most MLS teams with 4: LA Galaxy, Los Angeles FC (LAFC), San Jose Earthquakes, and San Diego FC. Texas is second with 3 teams (Austin FC, FC Dallas, Houston Dynamo). No other state has more than 2 MLS teams."
  
  - question: "How many MLS teams are there?"
    answer: "MLS has 30 teams as of 2025. 27 teams are in the United States across 21 states plus Washington D.C. 3 teams are in Canada (Toronto FC, CF Montréal, Vancouver Whitecaps). The league has grown from 10 teams in 1996 to 30 today."
  
  - question: "Do the New York Red Bulls play in New York?"
    answer: "No, the New York Red Bulls play in Harrison, New Jersey at Red Bull Arena. Only New York City FC actually plays in New York State, at Yankee Stadium in the Bronx. This is similar to the NFL's Jets and Giants, who both play in New Jersey despite having 'New York' in their names."
  
  - question: "What MLS team does Lionel Messi play for?"
    answer: "Lionel Messi plays for Inter Miami CF in Fort Lauderdale, Florida. He joined the team in July 2023, choosing MLS over offers from Saudi Arabia and European clubs. His arrival dramatically increased MLS's global visibility and helped Inter Miami win the Leagues Cup in 2023."
  
  - question: "What MLS teams are in Texas?"
    answer: "Texas has 3 MLS teams: Austin FC (Q2 Stadium in Austin), FC Dallas (Toyota Stadium in Frisco, north of Dallas), and Houston Dynamo FC (Shell Energy Stadium in Houston). All three teams play in the Western Conference."
  
  - question: "Does Sporting Kansas City play in Kansas or Missouri?"
    answer: "Sporting Kansas City plays in Kansas. Children's Mercy Park is located in Kansas City, Kansas — not Kansas City, Missouri. This makes Kansas one of only 21 U.S. states with an MLS team, while Missouri has St. Louis CITY SC."
  
  - question: "How many MLS teams are in Canada?"
    answer: "Canada has 3 MLS teams: Toronto FC (plays at BMO Field in Toronto, Ontario), CF Montréal (plays at Stade Saputo in Montreal, Quebec), and Vancouver Whitecaps FC (plays at BC Place in Vancouver, British Columbia). Toronto FC was the first Canadian MLS team, founded in 2007."
  
  - question: "What is the newest MLS team?"
    answer: "San Diego FC is the newest MLS team, joining the league in 2025. They play at Snapdragon Stadium in San Diego, California. Previous recent expansion teams include St. Louis CITY SC (2023), Charlotte FC (2022), and Austin FC (2021)."

