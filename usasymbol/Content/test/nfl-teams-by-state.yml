sections:
  - id: "jets-giants-new-jersey"
    icon: "fa-solid fa-map-location-dot"
    title: "Why the Jets and Giants Play in New Jersey"
    paragraphs:
      - "Despite having 'New York' in their names, both the Jets and Giants play home games in East Rutherford, New Jersey. MetLife Stadium opened in 2010 and is the only NFL stadium shared by two teams. The Jets and Giants split costs, scheduling, and revenue — a unique arrangement in professional sports."
      - "This situation dates back to 1976 when the Giants left Yankee Stadium for the newly built Giants Stadium in New Jersey's Meadowlands complex. The Jets followed in 1984, leaving Shea Stadium. Both franchises chose New Jersey for practical reasons: more land for parking, lower costs, and easier highway access from Manhattan (just 8 miles away)."
      - "The Buffalo Bills are therefore the only NFL team that actually plays in New York State. Their Highmark Stadium in Orchard Park (a Buffalo suburb) keeps New York on the NFL map. A new stadium is under construction and will open in 2026, ensuring the Bills remain in western New York."

  - id: "states-without-nfl"
    icon: "fa-solid fa-map"
    title: "28 States Without NFL Teams"
    paragraphs:
      - "More than half of U.S. states — 28 out of 50 — have no NFL team. The largest states by population without a franchise include Virginia (8.6 million), New Jersey technically has 2 teams but 'borrows' them from New York, while states like Alabama, Kentucky, and South Carolina have passionate college football cultures but no NFL presence."
      - "The Southeast is notably underrepresented. Despite having the Atlanta Falcons, Carolina Panthers, Tampa Bay Buccaneers, Jacksonville Jaguars, Miami Dolphins, New Orleans Saints, and Tennessee Titans, huge swaths of the region remain uncovered. Alabama, Mississippi, Arkansas, and Kentucky have no teams despite strong football traditions."
      - "Expansion candidates frequently mentioned include San Antonio, St. Louis (lost the Rams in 2016), Oakland (lost the Raiders in 2020), and Austin. The NFL hasn't added new teams since 2002 (Houston Texans) and shows little interest in expansion, preferring to maximize value of existing franchises."

  - id: "shared-stadiums"
    icon: "fa-solid fa-stadium"
    title: "Teams That Share Stadiums"
    paragraphs:
      - "Two NFL markets have teams sharing stadiums. In Los Angeles, the Rams and Chargers both play at SoFi Stadium in Inglewood, which opened in 2020 at a cost of $5.5 billion — the most expensive stadium ever built. The Rams are considered the 'home' team with first choice of dates, while the Chargers are tenants."
      - "In New Jersey, the Giants and Jets share MetLife Stadium with a more equal arrangement. Both teams co-own the stadium and split scheduling evenly. When both teams have home games the same weekend, the NFL coordinates to ensure they play on different days (one Saturday/Sunday, or one at 1 PM/other at 4 PM)."
      - "This stadium-sharing model is rare in American sports. Most cities can support only one NFL franchise, and team owners prefer exclusive venues. Los Angeles's massive population (13 million metro) and New York's unique situation (two legacy franchises) make these exceptions possible."

  - id: "smallest-markets"
    icon: "fa-solid fa-city"
    title: "Small Cities With NFL Teams"
    paragraphs:
      - "Green Bay, Wisconsin is famously the smallest city with a major professional sports team. With just 107,000 residents, Green Bay is dwarfed by NFL cities like New York (8.3 million) or Los Angeles (3.9 million). The Packers survive because they're community-owned — the only publicly-owned franchise in major American pro sports."
      - "The Packers sold stock to fans in 1923 to avoid bankruptcy and have held five more stock sales since. Over 360,000 shareholders own more than 5 million shares, though the stock pays no dividends and can't appreciate in value. This ownership structure makes relocation impossible, keeping the team in tiny Green Bay forever."
      - "Other small-market teams include the Buffalo Bills (metro population 1.2 million), Jacksonville Jaguars (1.6 million), and New Orleans Saints (1.3 million). These teams often struggle with revenue compared to large-market franchises but maintain loyal fanbases. Jacksonville has faced relocation rumors for years, while Buffalo's new stadium deal in 2022 secured the Bills through at least 2064."

  - id: "relocation-history"
    icon: "fa-solid fa-truck-moving"
    title: "NFL Teams That Changed States"
    paragraphs:
      - "The NFL has seen significant franchise movement since 1980. The Raiders have been particularly nomadic: Oakland to Los Angeles (1982), back to Oakland (1995), then to Las Vegas (2020). The Rams left Los Angeles for St. Louis (1995) then returned to LA (2016). St. Louis lost its second team when the Cardinals left for Arizona (1988)."
      - "The Baltimore Colts' overnight move to Indianapolis in 1984 remains infamous — owner Robert Irsay loaded moving trucks at 2 AM to avoid legal intervention. Baltimore eventually received the Ravens in 1996 when Art Modell moved the Cleveland Browns. Cleveland was awarded a new Browns franchise in 1999, one of few examples of a city getting its team 'back.'"
      - "Houston lost the Oilers to Tennessee (became Titans in 1999) but received the expansion Texans in 2002. Los Angeles went without NFL football from 1995 to 2016 — the largest U.S. market without a team — before receiving both the Rams and Chargers. This 21-year absence proved that even massive markets aren't guaranteed franchises."

  - id: "conference-geography"
    icon: "fa-solid fa-compass"
    title: "Why Conference Divisions Don't Match Geography"
    paragraphs:
      - "NFL divisions often defy geography due to historical team movements and league expansion. The Dallas Cowboys play in the NFC East despite being located in Texas — farther west than NFC West teams like the Arizona Cardinals. Dallas joined the Eastern Conference in 1960 and stayed when divisions reorganized."
      - "The Indianapolis Colts remain in the AFC South, though Indianapolis is north of AFC North cities like Cincinnati and Baltimore. The Colts' division assignment stems from their 2002 realignment when the NFL prioritized preserving rivalries over geographic logic. Similarly, the Miami Dolphins are in the AFC East — the southernmost team in a 'northern' division."
      - "The NFC North makes geographic sense (Chicago, Detroit, Green Bay, Minnesota), as do the AFC West (Denver, Kansas City, Las Vegas, Los Angeles) and NFC West (Arizona, Los Angeles, San Francisco, Seattle). These divisions formed around natural regional rivalries that the NFL prefers to maintain even when team relocations create geographic oddities."

faq:
  - question: "Which state has the most NFL teams?"
    answer: "California and Florida are tied with 3 NFL teams each. California has the Los Angeles Rams, Los Angeles Chargers, and San Francisco 49ers. Florida has the Miami Dolphins, Tampa Bay Buccaneers, and Jacksonville Jaguars."
  
  - question: "Do the New York Jets and Giants play in New York?"
    answer: "No, both the New York Jets and New York Giants play in New Jersey. They share MetLife Stadium in East Rutherford, NJ, about 8 miles from Manhattan. The only NFL team that actually plays in New York State is the Buffalo Bills at Highmark Stadium in Orchard Park."
  
  - question: "How many states have NFL teams?"
    answer: "22 states have NFL teams, with 32 teams total. This means 28 states have no NFL franchise. California and Florida lead with 3 teams each, while 5 states have 2 teams: Texas, Ohio, Pennsylvania, New Jersey, and Maryland."
  
  - question: "What is the smallest city with an NFL team?"
    answer: "Green Bay, Wisconsin is the smallest city with an NFL team, with a population of about 107,000. The Green Bay Packers survive in this small market because they're community-owned — the only publicly-owned major pro sports franchise in America, with over 360,000 shareholders."
  
  - question: "Where do the Washington Commanders play?"
    answer: "The Washington Commanders play at FedEx Field in Landover, Maryland — not in Washington D.C. The stadium is located about 10 miles east of downtown D.C. This makes Maryland a state with 2 NFL teams (Ravens and Commanders), while D.C. technically has none."
  
  - question: "Which NFL teams share a stadium?"
    answer: "Two pairs of NFL teams share stadiums. The New York Jets and New York Giants share MetLife Stadium in East Rutherford, New Jersey. The Los Angeles Rams and Los Angeles Chargers share SoFi Stadium in Inglewood, California. Both arrangements are unique in the NFL."
  
  - question: "When did Las Vegas get an NFL team?"
    answer: "Las Vegas received the Raiders in 2020 when the team relocated from Oakland, California. The Raiders play at Allegiant Stadium, a $1.9 billion domed stadium that opened that same year. This made Nevada a state with an NFL team for the first time."
  
  - question: "What NFL teams are in Texas?"
    answer: "Texas has 2 NFL teams: the Dallas Cowboys and the Houston Texans. The Cowboys play at AT&T Stadium in Arlington (between Dallas and Fort Worth), and the Texans play at NRG Stadium in Houston. Both teams are in different conferences — Cowboys in NFC East, Texans in AFC South."

