sections:
  - id: "canada-hockey-nation"
    icon: "fa-solid fa-hockey-puck"
    title: "Canada: Hockey's Homeland With 7 Teams"
    paragraphs:
      - "Canada has 7 NHL teams — more than any U.S. state and 22% of the entire league. Hockey is Canada's national winter sport, and the NHL was founded in Montreal in 1917 with all-Canadian teams. Today's Canadian franchises span from Vancouver on the Pacific to Montreal in the east."
      - "The Toronto Maple Leafs are the NHL's most valuable franchise ($2.8 billion) despite their infamous championship drought — no Stanley Cup since 1967. The Montreal Canadiens hold the record for most championships (24) but haven't won since 1993. Edmonton's Oilers dynasty of the 1980s (5 Cups with Wayne Gretzky) remains legendary."
      - "Alberta has both Calgary and Edmonton, creating the intense 'Battle of Alberta' rivalry. Ontario has Toronto and Ottawa, while Quebec has Montreal — the Canadiens are the only French-language major pro sports team in North America. British Columbia (Vancouver), Manitoba (Winnipeg), and Alberta make up the Western Canadian contingent."

  - id: "original-six"
    icon: "fa-solid fa-star"
    title: "The Original Six: Hockey's Historic Franchises"
    paragraphs:
      - "Six NHL teams are known as the 'Original Six' — franchises that survived the Great Depression and World War II when the league contracted to just these teams from 1942 to 1967. They are: Boston Bruins, Chicago Blackhawks, Detroit Red Wings, Montreal Canadiens, New York Rangers, and Toronto Maple Leafs."
      - "These six teams played only each other for 25 years, building intense rivalries that endure today. The Canadiens dominated this era with 10 Stanley Cups, including five straight (1956-1960). The Maple Leafs won 9 Cups, the Red Wings 5, the Blackhawks 3, the Bruins 2, and the Rangers just 1 during the Original Six era."
      - "The 1967 expansion doubled the NHL from 6 to 12 teams, adding franchises in Los Angeles, San Francisco (later moved), Minnesota, Pittsburgh, Philadelphia, and St. Louis. This began the NHL's transformation from a regional league into a continental sport. The Original Six teams retain special status and consistently draw large audiences."

  - id: "sunbelt-hockey"
    icon: "fa-solid fa-sun"
    title: "Hockey in the Sun Belt: Florida, Texas, and Beyond"
    paragraphs:
      - "The NHL's expansion into warm-weather markets seemed risky but has produced mixed results. Florida now has 2 teams: the Panthers (Sunrise, near Fort Lauderdale) won the Stanley Cup in 2024, while the Lightning (Tampa) won back-to-back Cups in 2020-2021. The Sunshine State has become a legitimate hockey market."
      - "The Dallas Stars (relocated from Minnesota in 1993) won the Stanley Cup in 1999 and remain competitive. Nashville's Predators have built a passionate fanbase since 1998, with Bridgestone Arena becoming one of the NHL's loudest venues. The Carolina Hurricanes (formerly Hartford Whalers) won the Cup in 2006 and have recently become a powerhouse."
      - "Not every Sun Belt experiment worked. The Arizona Coyotes struggled for decades with attendance and arena issues, eventually relocating to Utah in 2024. The Atlanta Thrashers lasted just 11 seasons (1999-2011) before moving to Winnipeg. These failures show that hockey can work in non-traditional markets, but only with committed ownership and proper facilities."

  - id: "newest-teams"
    icon: "fa-solid fa-sparkles"
    title: "Vegas, Seattle, and Utah: NHL's Newest Markets"
    paragraphs:
      - "The Vegas Golden Knights (2017) became the most successful expansion team in NHL history, reaching the Stanley Cup Final in their first season and winning it all in 2023. Las Vegas embraced hockey despite having no winter sports tradition, regularly selling out T-Mobile Arena. The team proved that entertainment markets can support hockey year-round."
      - "The Seattle Kraken (2021) became the NHL's 32nd team, ending the Pacific Northwest's wait for hockey since the Seattle Metropolitans won the Stanley Cup in 1917 (pre-NHL). Climate Pledge Arena, a renovated version of the historic KeyArena, became the league's most environmentally sustainable venue. Seattle's passionate fanbase set attendance records in the team's early years."
      - "The Utah Hockey Club (2024) represents the most recent relocation. The Arizona Coyotes played three seasons in a 5,000-seat college arena after losing their Glendale arena deal, finally moving to Salt Lake City. Utah shares the Delta Center with the NBA's Jazz and hopes to build hockey culture in a market better known for skiing and the Jazz."

  - id: "three-team-states"
    icon: "fa-solid fa-ranking-star"
    title: "California and New York: States With 3 Teams"
    paragraphs:
      - "California has 3 NHL teams spread across the state: the Anaheim Ducks (Orange County), Los Angeles Kings (LA), and San Jose Sharks (Bay Area). The Kings won Stanley Cups in 2012 and 2014, becoming the first California team to win hockey's ultimate prize. The Ducks followed with a Cup in 2007. The Sharks have never won despite consistent competitiveness."
      - "New York's 3 teams serve distinct regions: the Rangers play at Madison Square Garden in Manhattan, the Islanders play at UBS Arena on Long Island (after years in Brooklyn), and the Sabres represent Buffalo in western New York. The Rangers are the glamour franchise; the Islanders won 4 straight Cups (1980-1983); the Sabres have never won."
      - "Both states show that geographic spread matters. California's teams are 350+ miles apart (San Jose to Anaheim), serving distinct markets. New York's teams are similarly spread — Buffalo is 370 miles from Manhattan. This prevents direct competition while maximizing regional coverage."

  - id: "states-without-nhl"
    icon: "fa-solid fa-map"
    title: "31 States Without NHL Teams"
    paragraphs:
      - "The majority of U.S. states — 31 out of 50 — have no NHL team. The NHL has fewer teams than the NFL, MLB, or NBA, making franchises more scarce. Large states without teams include Georgia (Atlanta lost the Thrashers in 2011), Wisconsin (despite bordering hockey-mad Minnesota), and Oregon (despite Seattle's success nearby)."
      - "The Midwest has notable gaps: Wisconsin, Iowa, Nebraska, Kansas, and the Dakotas have no NHL presence despite cold winters perfect for hockey culture. The league has one team (Minnesota Wild) for the entire Upper Midwest. Similarly, the Mountain West has only Colorado and Utah, leaving Montana, Wyoming, Idaho, and New Mexico without teams."
      - "Expansion or relocation candidates occasionally mentioned include Houston (second-largest city without an NHL team after Phoenix lost the Coyotes), Atlanta (second chance after Thrashers' failure), Quebec City (has a new arena and passionate fans), and Portland. The NHL seems satisfied at 32 teams for now, making new franchises unlikely soon."

faq:
  - question: "Which state has the most NHL teams?"
    answer: "California and New York are tied with 3 NHL teams each. California has the Anaheim Ducks, Los Angeles Kings, and San Jose Sharks. New York has the New York Rangers, New York Islanders, and Buffalo Sabres. However, Canada as a country has 7 NHL teams — more than any U.S. state."
  
  - question: "How many NHL teams are in Canada?"
    answer: "Canada has 7 NHL teams: Toronto Maple Leafs, Montreal Canadiens, Vancouver Canucks, Calgary Flames, Edmonton Oilers, Winnipeg Jets, and Ottawa Senators. These teams are spread across 5 provinces: Ontario (2), Alberta (2), Quebec (1), British Columbia (1), and Manitoba (1)."
  
  - question: "How many states have NHL teams?"
    answer: "19 U.S. states have NHL teams, plus Washington D.C. The NHL also has 7 teams in Canada across 5 provinces. This means 31 U.S. states have no NHL franchise. The 32-team league is more concentrated than other major sports leagues."
  
  - question: "What happened to the Arizona Coyotes?"
    answer: "The Arizona Coyotes relocated to Utah in 2024 and became the Utah Hockey Club. The team struggled for years with arena issues and poor attendance, eventually playing in a 5,000-seat college arena. The move to Salt Lake City gives the franchise a fresh start with the Delta Center as their home arena."
  
  - question: "What NHL teams are in New York?"
    answer: "New York has 3 NHL teams: the New York Rangers (play at Madison Square Garden in Manhattan), the New York Islanders (play at UBS Arena in Elmont, Long Island), and the Buffalo Sabres (play at KeyBank Center in Buffalo). All three teams actually play in New York State."
  
  - question: "When did Seattle get an NHL team?"
    answer: "Seattle received the Kraken as an expansion team in 2021, becoming the NHL's 32nd franchise. The team plays at Climate Pledge Arena, a renovated version of the historic KeyArena. Seattle previously had the Metropolitans, who won the Stanley Cup in 1917 before the NHL existed."
  
  - question: "What are the Original Six NHL teams?"
    answer: "The Original Six are the NHL teams that survived from 1942 to 1967 when the league had only six franchises: Boston Bruins, Chicago Blackhawks, Detroit Red Wings, Montreal Canadiens, New York Rangers, and Toronto Maple Leafs. These teams have special historic status in hockey."
  
  - question: "Which Canadian NHL team has won the most Stanley Cups?"
    answer: "The Montreal Canadiens have won the most Stanley Cups with 24 championships, more than any other NHL franchise. However, their last Cup was in 1993. The Toronto Maple Leafs have 13 Cups but haven't won since 1967 — the longest active championship drought in the NHL."

