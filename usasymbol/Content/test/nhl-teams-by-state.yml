page:
  h1: "NHL Teams by State: Which States Have Hockey Teams?"
  
  quick_answer:
    - "California and New York are tied with the most NHL teams at 3 each. California has the Ducks, Kings, and Sharks. New York has the Rangers, Islanders, and Sabres."
    - "Florida and Pennsylvania each have 2 teams. Florida has the Panthers and Lightning. Pennsylvania has the Flyers and Penguins."
    - "Canada has 7 NHL teams — more than any U.S. state: Maple Leafs, Canadiens, Canucks, Flames, Oilers, Jets, and Senators. The NHL has 32 teams total across 19 U.S. states, Washington D.C., and 5 Canadian provinces."

  intro_paragraphs:
    - "The NHL's 32 teams are spread across 19 U.S. states, Washington D.C., and 5 Canadian provinces. Unlike other major American sports leagues, the NHL has significant presence in Canada — 7 of 32 teams (22%) are Canadian. This reflects hockey's roots as Canada's national sport."
    - "This list is based on where each team's home arena is located. California and New York lead U.S. states with 3 teams each, while Canada as a whole has more teams than any single U.S. state. Below you'll find every team organized by location, including arena names and conference affiliations."

  insights:
    - "Canada has 7 NHL teams — more than any U.S. state. The Toronto Maple Leafs are the league's most valuable franchise despite not winning the Stanley Cup since 1967."
    - "The newest NHL team is the Utah Hockey Club (2024), relocated from Arizona after the Coyotes failed to secure a permanent arena deal."
    - "Seattle became the 32nd NHL city in 2021 when the Kraken joined as an expansion team, ending the Pacific Northwest's long wait for hockey."
    - "Las Vegas received the Golden Knights in 2017 — the first major pro sports team in Vegas history. They won the Stanley Cup in just their sixth season (2023)."
    - "New York has 3 teams: Rangers (Manhattan), Islanders (Long Island), and Sabres (Buffalo). All three actually play in New York State."

  methodology: "Teams are listed by the state or province where their home arena is physically located. Canadian teams are grouped by province. The Utah Hockey Club (formerly Arizona Coyotes) is listed under Utah following their 2024 relocation. Data reflects the 2025-26 NHL season."
  
