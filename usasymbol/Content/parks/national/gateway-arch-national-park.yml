faq:
  - question: "Where is Gateway Arch National Park?"
    answer: "Gateway Arch National Park is on the Mississippi River waterfront in downtown St. Louis, Missouri. The arch stands at 11 N. 4th Street; the Old Courthouse is two blocks west. St. Louis Lambert International Airport is about 15 miles away. MetroLink light rail connects the airport to the park in approximately 30 minutes."
  - question: "How much does it cost to go inside the Gateway Arch?"
    answer: "Walking the grounds and visiting the Museum of Westward Expansion and Old Courthouse are free. The tram ride to the top of the arch costs $19 for adults (16 and over) and $10 for children 15 and under. Children under 3 ride free. The America the Beautiful Annual Pass ($80) covers tram entry for the pass holder and three guests."
  - question: "Do you need to book the tram ride in advance?"
    answer: "Yes, especially for summer and spring weekends. Tram tickets are timed-entry and can sell out days ahead in peak season. Purchase through Recreation.gov or at the visitor center on the day of your visit if same-day tickets remain. Walk-up availability is common in fall and winter."
  - question: "How tall is the Gateway Arch?"
    answer: "The arch is 630 feet (192 meters) tall — exactly as wide at the base as it is tall. It is the tallest man-made monument in the United States. Views from the observation room at the top extend up to 30 miles on a clear day."
  - question: "When is the best time to visit Gateway Arch National Park?"
    answer: "Fall (September through November) offers the best combination of mild weather and shorter tram lines. Spring (March through May) is the most photogenic season, with cherry blossoms peaking in early April. Summer is the most crowded and hottest period; arrive before 9 a.m. to beat heat and queues. Winter is the quietest season with the easiest tram access."
  - question: "What is the Old Courthouse at Gateway Arch?"
    answer: "The Old Courthouse is a historic St. Louis courthouse completed in 1862, located two blocks west of the arch. It was the site of the Dred and Harriet Scott freedom suit trials in 1847 and 1850, the first stages of the Dred Scott v. Sandford case that reached the Supreme Court in 1857. Restored courtrooms and exhibits on the case are open for free self-guided tours."

