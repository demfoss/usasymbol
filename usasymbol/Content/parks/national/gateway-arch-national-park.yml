sections:
  overview: |
    Gateway Arch National Park occupies 91 acres on the west bank of the Mississippi River in downtown St. Louis, Missouri, making it one of the smallest national parks in the country. The park's centerpiece is the Gateway Arch — a 630-foot stainless-steel catenary curve completed in 1965 and the tallest man-made monument in the United States. The park also includes the Museum of Westward Expansion underground beneath the arch and the Old Courthouse two blocks west, where the Dred Scott freedom suits were tried in 1847 and 1850. The site drew about 2.2 million visitors in 2023, ranking 16th among the 63 national parks, and is the most-visited park in the Midwest.

  known_for: |
    The Gateway Arch tram ride, which carries visitors 630 feet to the top in small egg-shaped pods and delivers views of St. Louis and the Mississippi River stretching up to 30 miles on a clear day.
    The Museum of Westward Expansion, a free underground museum beneath the arch tracing the Louisiana Purchase, the Lewis and Clark Expedition, and the lives of Indigenous peoples and settlers during the 19th-century westward migration.
    The Old Courthouse, where enslaved people Dred and Harriet Scott filed suit for their freedom in 1847, launching the legal case that reached the U.S. Supreme Court in 1857 and accelerated the national crisis over slavery.
    The arch's design by Finnish-American architect Eero Saarinen, who won the Jefferson National Expansion Memorial competition in 1948 with a shape — the weighted catenary curve — that has no exact precedent in monumental architecture.

  best_things_to_see_items:
    - name: "Tram Ride to the Top"
      description: "Eight egg-shaped tram pods carry visitors up the hollow legs of the arch to an observation room at 630 feet, with windows facing east over the Mississippi River and west over St. Louis. Each pod holds five passengers and the ride takes about four minutes each way. Views on a clear day extend up to 30 miles. Timed entry tickets ($19 adults, $10 children 15 and under) are required and sell out on busy days; book in advance through Recreation.gov."
      image: "https://www.nps.gov/common/uploads/grid_builder/jeff/crop16_9/9D0945E4-AF7F-D17A-2E0083CAABB64687.jpg?width=640&quality=90&mode=crop"
      alt: "A woman and a child look out of a window on the observation deck at the top of the Gateway Arch."
      credit: "NPS Photo"
    - name: "Museum of Westward Expansion"
      description: "The museum occupies the underground visitor center directly beneath the arch and is free to enter. Exhibits cover the Louisiana Purchase of 1803, the Lewis and Clark Expedition, Plains Indian cultures, the lives of pioneers and homesteaders, and the role of the transcontinental railroad. A large circular gallery displays artifacts and first-person accounts from the 19th century. The museum entrance is on the west side of the arch grounds through the visitor center."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/FBCFBFBA-9E31-E1E2-FE548CC5DF841833.jpg?width=1300&quality=90&mode=crop"
      alt: "two glass cases, one holding a model of the Arch grounds and one a large model of the Arch structure"
      credit: "Jennifer Clark/NPS Photo"
    - name: "Old Courthouse"
      description: "The Old Courthouse, two blocks west of the arch at 11 N. 4th Street, is a Greek Revival and Renaissance Revival building completed in 1862 that served as the St. Louis courthouse until 1930. It was the site of the Dred and Harriet Scott freedom suit trials in 1847 and 1850 — the first rounds of the legal case that reached the Supreme Court as Dred Scott v. Sandford in 1857. Restored courtrooms and exhibits on the Scott case and St. Louis history are open to the public at no charge."
      image: "https://www.nps.gov/common/uploads/structured_data/34E649C6-F06F-EB7F-0F9B8B092450772F.jpg"
      alt: "looking across the green lawn in Smith Square to the Old Courthouse"
      credit: "NPS photo/Jennifer Clark"
    - name: "Arch Grounds and Reflecting Ponds"
      description: "The park grounds between the arch and the Old Courthouse include two reflecting ponds, open lawns, and cherry trees that bloom in early April. The north and south ponds reflect the arch in calm conditions and are popular photography spots. The grounds are free to walk and are open year-round; the north pond area is the most sheltered and photogenic viewpoint. Benches and open lawn make this a lunch and rest spot for downtown St. Louis visitors."
      image: "https://www.nps.gov/common/uploads/structured_data/348E44EA-F431-FA18-DCB014F7BAA8D225.jpg"
      alt: "The Gateway Arch reflected in the waters of the north pond"
      credit: "NPS photo/Jennifer Clark"
    - name: "Mississippi Riverfront"
      description: "The east side of the arch grounds faces the Mississippi River, with a broad promenade running along the riverbank. Views here place the arch directly overhead, the river at foot level, and the Illinois shore across 1,500 feet of water. The St. Louis riverfront was the departure point for Lewis and Clark's Corps of Discovery in 1804 and was one of the busiest steamboat ports in the country through the mid-19th century. Seasonal river cruises depart from the cobblestone landing below the promenade."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/9DDA3F9D-0B10-6AEA-97B2B8E992EC9768.jpeg?width=1600&quality=90&mode=crop"
      alt: "the grand staircase leading down to the riverfront "
      credit: "NPS Photo/Jennifer Clark"

