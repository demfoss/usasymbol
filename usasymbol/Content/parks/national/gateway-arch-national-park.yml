seo_description: "Visit Gateway Arch National Park in St. Louis: ride to the top of the 630-foot Arch, tour the Westward Expansion museum, best time to go, and fees."
intro_text: "Gateway Arch National Park in St. Louis, [Missouri](/states/missouri), is a 91-acre urban park centered on the 630-foot stainless-steel Gateway Arch completed in 1965 and the Old Courthouse where the Dred Scott case was tried, designated a national park in 2018."

