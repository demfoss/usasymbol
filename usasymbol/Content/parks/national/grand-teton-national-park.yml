intro_text: "Grand Teton National Park in Wyoming was established in 1929 to protect the Teton Range and expanded in 1950 to include Jackson Hole valley, reaching its current 310,044 acres — the 9th most visited national park in the United States, with Jackson Hole Airport the only commercial airport inside any U.S. national park."

