sections:
  overview: |
    Grand Teton National Park covers 310,044 acres in northwestern Wyoming, immediately south of Yellowstone, built around twelve Teton Range peaks that exceed 12,000 feet and rise with no foothills directly from the flat floor of Jackson Hole valley at around 6,800 feet elevation. The centerpiece is Grand Teton at 13,775 feet, the highest summit in the range. The park contains Jenny Lake and Jackson Lake — two glacially carved bodies of water at the base of the mountains — along with 200 miles of trails, the Snake River, and some of the most productive grizzly bear and moose habitat in the lower 48 states. It ranks 9th among the 63 national parks with about 3.4 million visitors per year.

  known_for: |
    The sheer east face of the Teton Range, which rises roughly 7,000 feet from the valley floor to the summit of Grand Teton in a nearly vertical wall with no gradual approach — one of the most dramatic mountain fronts in North America.
    World-class wildlife density in Jackson Hole valley, where grizzly bears, black bears, wolves, moose, bison, elk, and pronghorn are regularly visible from the roadside, and bear 399 and her offspring have become among the most photographed grizzlies in the world.
    Cascade Canyon and the trail to Lake Solitude, the park's most-used backcountry corridor, accessible by boat shuttle across Jenny Lake and rising 3,000 feet into the alpine zone beneath the tallest peaks.
    Technical climbing on Grand Teton and its neighbors, with the Exum Ridge and Owen-Spalding routes on Grand Teton ranking among the most iconic moderate alpine climbs in the United States.

  best_things_to_see_items:
    - name: "Teton Range and Teton Park Road"
      description: "The 42-mile Teton Park Road runs along the base of the mountains between Moose and Jackson Lake Lodge, providing continuous close-range views of the range's east face. Pullouts at Cathedral Group Turnout, String Lake Trailhead, and other points give the best unobstructed views of Grand Teton, Mount Owen, and Teewinot Mountain. The road is closed to private vehicles in winter but opens to snowshoers and cross-country skiers. Sunrise and the first hour of morning light turn the granite faces orange before the mountains fall into shadow."
      image: "https://www.nps.gov/grte/planyourvisit/images/drive_bonney.jpg?autorotate=false&format=webp&maxheight=1300&maxwidth=1300"
      alt: "A road headed towards mountains with bright clouds behind them."
      credit: "NPS Photo/J. Bonney"
    - name: "Jenny Lake"
      description: "Jenny Lake is a 1,191-acre glacial lake at the base of the central Tetons, the most popular destination in the park. A shuttle boat crosses the lake from the east shore to the west, cutting 2 miles off the hike to Hidden Falls and Inspiration Point — the most-used trail in the park. A 7.7-mile loop circles the entire lake. The campground on the lake's south shore is the park's most sought-after; the visitor center on the east side has the best walk-up view of the mountains from lakeshore level."
      image: "https://www.nps.gov/grte/planyourvisit/images/jennylake_10.jpg?autorotate=false&maxwidth=650"
      alt: "Mountains rise out of a calm lake."
      credit: "NPS Photo/J. Bonney"
    - name: "Cascade Canyon and Lake Solitude"
      description: "Cascade Canyon is the main backcountry corridor in the Tetons, a glacially carved valley running 9 miles from Jenny Lake west to the divide. The full round trip to Lake Solitude — a turquoise alpine lake at 9,035 feet below the highest peaks — covers 14.4 miles with 3,046 feet of gain. The canyon hosts one of the most reliable concentrations of black bears in the park; moose are common near the creek in the lower canyon. The boat shuttle across Jenny Lake reduces round-trip hiking distance significantly."
      image: "https://www.nps.gov/common/uploads/structured_data/3C7FAC1D-1DD8-B71B-0B1A9E05DFA2AD10.jpg"
      alt: "Lake Solitude with the high Teton Peaks beyond during summer"
      credit: "NPS Photo / D. Lehle"
    - name: "Oxbow Bend and Snake River Wildlife Corridor"
      description: "Oxbow Bend is a calm meander of the Snake River below Jackson Lake Dam, one of the best wildlife-watching spots in the park. Moose feed in the willows at dawn and dusk; bald eagles and ospreys nest in the cottonwoods; trumpeter swans rest on the water in fall. Mount Moran — 12,605 feet — frames the scene to the west. The pullout is directly on US-89/191, accessible without leaving your vehicle. Fall is the peak season, when golden aspens line the river and the elk rut is underway."
      image: "https://home.nps.gov/common/uploads/cropped_image/primary/C52A9D54-D552-3636-C6144CE833DAC763.jpg?mode=crop&quality=90&width=1300"
      alt: "A river with mountains in the background."
    - name: "Wildlife Watching — Grizzlies, Wolves, and Bison"
      description: "Jackson Hole supports one of the highest densities of wildlife in the contiguous United States. Grizzly bears are seen regularly along the Antelope Flats road and near Pilgrim Creek in early summer. The Teton wolf packs are occasionally spotted near Willow Flats below Jackson Lake Lodge. Bison herds graze openly across Antelope Flats and the Moran Junction area year-round. The best times are early morning and evening; a spotting scope and patience are the essential tools. The park's wildlife is genuinely wild and unpredictable — maintain at least 100 yards from bears and wolves, 25 yards from all other wildlife."
      image: "https://www.nps.gov/common/uploads/structured_data/3C7FA923-1DD8-B71B-0B30EAF26172B37E.jpg"
      alt: "Grizzly bear running through dry grass with shrubs behind"
      credit: "NPS Photo / D. Lehle"
    - name: "Jackson Lake and Colter Bay"
      description: "Jackson Lake is the largest body of water in the park at roughly 27 square miles, filling a glacially carved basin that was enlarged by a dam built in 1916 to support downstream irrigation. Colter Bay Village on the lake's east shore offers boat rentals, kayak and canoe access, a marina, and a visitor center with one of the park's best collections of Native American art and artifacts. Signal Mountain on the lake's south shore has a summit road providing panoramic views of Jackson Hole and the entire Teton Range from above."
      image: "https://www.nps.gov/grte/planyourvisit/images/jacksonlake_rzott.jpg?autorotate=false&maxwidth=650"
      alt: "A kayak on a lake with mountains in the background."
      credit: "NPS Photo/R. Zott"

  seasons:
    - season: spring
      months: "May – June"
      temp_rim: "35–65 °F (2–18 °C)"
