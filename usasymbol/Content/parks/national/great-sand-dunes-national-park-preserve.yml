sections:
  overview: |
    Great Sand Dunes National Park & Preserve covers 149,028 acres of southern Colorado's San Luis Valley, about 38 miles northeast of Alamosa. The park centers on a 30-square-mile dune field pressed against the Sangre de Cristo Mountains, where Star Dune rises 750 feet above the surrounding sand, the tallest dune in North America. Medano Creek flows along the base of the dunes each spring, creating a shallow wading area before it sinks into the sand sheet in early summer. The adjacent preserve extends into the mountains and adds alpine lakes, old-growth forest, and 13,000-foot peaks to the landscape. Ranked 42nd of 63 national parks by annual visitation, the park draws about 609,000 visitors a year.

  known_for: |
    **North America's tallest dunes**: Star Dune stands 750 feet above the dune field floor, and the surrounding field covers 30 square miles against the base of the Sangre de Cristo Mountains. **Medano Creek surge flow**: in spring, Medano Creek runs along the dune base and produces periodic waves caused by collapsing sand dams, a hydrological feature found at only a handful of places on Earth. **Sand sledding and sandboarding**: visitors carry sleds or boards up the dunes and ride the steep sand faces; boards can be rented in the town of Mosca, just outside the park. **Dark sky designation**: the park holds an International Dark Sky Park designation, and the dry San Luis Valley air produces clear views of the Milky Way on moonless nights.

  best_time_to_visit: |
    **Spring (March-May)** The best time for Medano Creek. Peak flow typically runs from mid-May through early June, turning the dune base into a wading area. Temperatures at the visitor center average 45 to 65 degrees Fahrenheit. Winds can be strong in March and April, making sandboarding gritty but dune hiking manageable. Crowds build toward Memorial Day weekend.

    **Summer (June-August)** The busiest season. Sand surface temperatures can reach 150 degrees Fahrenheit by mid-afternoon, making barefoot hiking dangerous between about 10 a.m. and 5 p.m. Hike the dunes early in the morning and watch for afternoon thunderstorms, which develop quickly over the mountains. Medano Creek slows and disappears by July in most years. Campground reservations are essential.

    **Fall (September-October)** Temperatures drop to 40 to 65 degrees and crowds thin sharply after Labor Day. Elk move down from the preserve in September and October, often visible near the park entrance at dawn. Sand surface temperatures are comfortable all day. This is the most relaxed season for dune hiking and is the best window for photography at the golden-hour light.

    **Winter (November-February)** Snow dusts the dunes periodically but rarely accumulates for long at lower elevations. Temperatures average 20 to 45 degrees at the park entrance. Pinyon Flats Campground stays open on a first-come basis. Snowshoeing and cross-country skiing are possible after snowfall, and winter crowds are thin enough to have the dune field almost to yourself.

  hiking: |
    **Easy** The Montville Nature Trail is a 0.5-mile loop through pinyon-juniper forest near the visitor center, passing springs and old homestead ruins. The Wellington Ditch Trail covers 2.2 miles round trip across open grasslands along a historic irrigation ditch, with wide views of the dunes and Sangre de Cristos. Both are flat and accessible.

    **Moderate** The Mosca Pass Trail climbs 7.4 miles round trip through the Sangre de Cristo Wilderness, gaining 1,530 feet to a mountain pass at 9,737 feet. The shaded forest route provides a cool alternative to dune hiking on hot summer days. Start early and carry water; there is no water source on the trail.

    **Strenuous** There are no formal trails on the dune field. The High Dune Route is the most popular cross-country hike: roughly 2.5 miles round trip from the main parking lot with about 650 feet of gain to the crest at 699 feet above the dune floor. The Star Dune Route extends further, reaching the tallest dune in North America at 750 feet; plan on 3 to 4 miles round trip from the main parking lot. Hike both before 10 a.m. in summer; sand surface temperatures can reach 150 degrees Fahrenheit by midday. The Medano Lake Trail in the preserve is 8 miles round trip with roughly 2,300 feet of gain to an alpine lake at 11,582 feet.

  camping: |
    Pinyon Flats Campground is the only developed campground, with 88 sites at 8,200 feet in a pinyon-juniper forest a short walk from the dune field. Sites with electricity run $30 per night; standard sites are $20. From late spring through fall the campground fills by Thursday afternoon and requires reservations through Recreation.gov; in winter it operates first-come, first-served. Backcountry camping in the dune field is free with a permit, self-issued at the visitor center. Dune field campers must set up out of sight of the parking area, carry all water, and use a human waste kit; campfires are not permitted on the dunes. Primitive camping is also available by high-clearance 4WD vehicle along Medano Pass Primitive Road inside the preserve.

  fees_reservations: |
    Entry costs $25 per vehicle, $20 per motorcycle, or $15 per person arriving on foot or bicycle; passes cover seven consecutive days. The America the Beautiful annual pass ($80) covers entry for the pass holder and passengers. Pinyon Flats Campground costs $20 per standard night and $30 per night for electric sites; reserve through Recreation.gov. Backcountry permits for the dune field are free and self-issued at the visitor center. No permit is required to hike the dunes during the day. Confirm current fees and rules at the official park page at nps.gov/grsa.

  getting_there: |
    **By car** The main entrance is on Colorado State Highway 150, reached from U.S. Highway 160 east of Alamosa. From Alamosa, drive east on U.S. 160 about 14 miles to the CO-150 junction, then north about 18 miles to the visitor center, roughly 38 miles total. From Denver, take I-25 south to Walsenburg, then U.S. 160 west over La Veta Pass, about 240 miles.

    **By air** Alamosa San Luis Valley Regional Airport (ALS) is about 38 miles from the park and handles regional flights with connections through Denver. Denver International Airport (DEN) is about 240 miles north and offers far more flight options; a rental car is required from either airport. No public transit serves the park.

  geology: |
    The San Luis Valley sits in a rift basin where the Earth's crust pulled apart over the past 25 to 30 million years, dropping a block of land between parallel fault systems to create a broad, flat valley surrounded by mountains. Volcanic eruptions filled parts of the valley floor and contribute to the dark minerals visible in the dune sand today.

    During the last ice age, Lake Alamosa covered much of the valley floor and deposited thick layers of sand and gravel. When the lake drained roughly 440,000 years ago, it left that material exposed on the valley surface. Prevailing winds from the southwest picked up the sand and carried it northeast toward the Sangre de Cristo Mountains.

    The mountains form a wall that stops the sand from traveling further. Medano Creek and Sand Creek, flowing down from the range, intercept sand trying to move around the dune field and carry it back to the windward side, a closed-loop recycling system that has kept the dune field growing in place for at least 440,000 years.

    The result is a dune field over 30 square miles in area, with individual dunes reaching 750 feet above the surrounding sand sheet. The sand sheet itself, a flatter, vegetated zone between the dunes and the grasslands, holds additional sand and supports a community of specialized insects found nowhere else, including the Great Sand Dunes tiger beetle.

  wildlife: |
    Elk herds move between the alpine preserve and the valley grasslands seasonally, with the largest concentrations near the park entrance in September and October during the rut. Pronghorn graze the open sand sheet and grasslands year-round and are frequently visible from the park road. Mule deer are common in the pinyon-juniper forest around Pinyon Flats Campground.

    The dune field and sand sheet support species adapted to shifting sand, including Ord's kangaroo rat, which never drinks water and is active only at night. The Great Sand Dunes tiger beetle is found only at this park, living in the wet sand along Medano Creek. American black bears inhabit the preserve's forests but rarely appear near the main dune area.

    Rio Grande cutthroat trout, a threatened subspecies, live in Sand Creek and other streams in the preserve, supporting a catch-and-release fishery. Burrowing owls use the sand sheet, and peregrine falcons nest on the Sangre de Cristo cliffs above the preserve. On moonless nights the dark valley sky brings out a wide range of bats hunting insects over Medano Creek.

  history: |
    Paleo-Indian hunters were present in the San Luis Valley at least 11,000 years ago, when large mammals including mammoths and ground sloths still roamed the region. Projectile points and butchering sites found near the dunes document this early occupation. Ute people later lived throughout the valley and mountains, regarding the dunes as a significant and somewhat mysterious place in their landscape.

    Spanish expeditions crossed the San Luis Valley in the 1770s and 1780s. Governor Juan Bautista de Anza led a force through the valley in 1779 on a campaign against Comanche raiders, one of the first detailed European accounts of the dune field. American military expeditions surveyed the area in the mid-1800s as the United States expanded westward.

    Ranching and small farming communities established themselves in the valley during the late 1800s. Local advocates lobbied for federal protection of the dunes, and President Herbert Hoover proclaimed Great Sand Dunes National Monument on March 17, 1932. The monument protected the dune field but left surrounding lands open to grazing and private ownership. Decades of advocacy by local communities and conservation groups led Congress to redesignate the area as Great Sand Dunes National Park & Preserve on September 13, 2004, adding the Sangre de Cristo mountain lands and creating the preserve designation for areas that allow regulated hunting.

  best_things_to_see_items:
    - name: "Star Dune"
      description: "At 750 feet above the dune field floor, Star Dune is the tallest dune in North America. There is no formal trail; reach it by hiking cross-country from the main parking lot, roughly 3 to 4 miles round trip. Hike before 10 a.m. in summer; sand surface temperatures can reach 150 degrees Fahrenheit by midday."
      image: "/images/parks/national/great-sand-dunes-national-park-preserve/06-star-dune.jpg"
      alt: "Star Dune rises well above the other dune ridges with a distinctive pyramid shape."
      credit: "NPS/Patrick Myers"
    - name: "Medano Creek"
      description: "A seasonal creek flows along the base of the dunes from roughly April through early July, creating a shallow wading area popular with families. The creek produces surge flow, periodic waves caused by sand dams that build and collapse, a hydrological phenomenon found at only a handful of locations on Earth. Peak flow is typically mid-May through early June."
      image: "/images/parks/national/great-sand-dunes-national-park-preserve/07-medano-creek.jpg"
      alt: "A girl in the foreground floats on a tube in a wave of Medano Creek, while other youth splash and play. In the background are dunes and a snowy mountain."
      credit: "NPS/Patrick Myers"
    - name: "Sand Sledding and Sandboarding"
      description: "Visitors carry sleds or sandboards up the dunes and ride the steep sand faces down. There are no rental facilities inside the park; rent equipment in the town of Mosca, a few miles south on CO-150. Wax the board before each run; dry sand slows boards quickly, and re-waxing at the bottom extends each descent."
      image: "/images/parks/national/great-sand-dunes-national-park-preserve/08-sand-sledding-and-sandboarding.jpg"
      alt: "Girls Sand Sledding"
      credit: "NPS/Patrick Myers"
    - name: "High Dune"
      description: "High Dune, at 699 feet above the dune floor, is the closest major summit to the parking lot and the most-climbed peak in the dune field. The cross-country route covers about 2.5 miles round trip with 650 feet of gain. Views from the crest look directly into the Sangre de Cristo Mountains and across the full breadth of the valley."
      image: "/images/parks/national/great-sand-dunes-national-park-preserve/09-high-dune.jpg"
      alt: "Morning Light on High Dune on First Ridge"
      credit: "NPS/Scott Hansen"
    - name: "Wildlife at the Park Entrance"
      description: "Elk herds and pronghorn are regularly visible near the park entrance road in the early morning and at dusk, especially in September and October when elk are in rut. Pull over at the grassland sections of CO-150 and scan the flats with binoculars. The combination of large dunes, snow-capped mountains, and grazing elk in a single frame is a signature image of the park."
      image: "/images/parks/national/great-sand-dunes-national-park-preserve/10-wildlife-at-the-park-entrance.jpg"
      alt: "Elk, Grasslands, Dunes, and Sangre de Cristo Mountains"
      credit: "NPS"
    - name: "Alpine Lakes in the Preserve"
      description: "Sand Creek Lakes and Medano Lake sit above 11,500 feet in the Sangre de Cristo Wilderness section of the preserve, reached by strenuous trails of 8 or more miles round trip. The lakes are cold and clear, surrounded by spruce-fir forest and tundra. Rio Grande cutthroat trout inhabit the creeks below, and the trails are open to day hikers and backpackers with a free permit."
      image: "/images/parks/national/great-sand-dunes-national-park-preserve/11-alpine-lakes-in-the-preserve.jpg"
      alt: "Lower Sand Creek Lake, Great Sand Dunes National Preserve"
      credit: "NPS/Kris Illenberger"
    - name: "Stargazing"
      description: "Great Sand Dunes holds an International Dark Sky Park designation. The dry San Luis Valley air and distance from major cities produce exceptionally dark skies, with the Milky Way visible to the naked eye on moonless nights. The main parking lot and the dune field itself are accessible after dark; the dunes glow faintly under starlight, and the Sangre de Cristos form a black silhouette against the sky."
      image: "/images/parks/national/great-sand-dunes-national-park-preserve/12-stargazing.jpg"
      alt: "Colorful Milky Way over the red lit Lehman Caves Visitor Center"
      credit: "Tom Auchter"

