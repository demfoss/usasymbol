seo_description: "Visit Great Sand Dunes National Park in Colorado: North America's tallest dunes, Medano Creek, top hikes, $25 entry, and best time to go."
intro_text: "Great Sand Dunes National Park & Preserve in southern [Colorado](/states/colorado) protects North America's tallest dunes, rising up to 750 feet from the floor of the San Luis Valley. Established as a park in 2004, the 149,028-acre unit spans sagebrush grasslands, a 30-square-mile dune field, and alpine terrain in the Sangre de Cristo Mountains."

