faq:
  - question: "Where is Great Sand Dunes National Park?"
    answer: "Great Sand Dunes National Park & Preserve is in southern Colorado's San Luis Valley, about 38 miles northeast of Alamosa. The nearest major airport is Alamosa San Luis Valley Regional (ALS). From Denver it is about 240 miles south."
  - question: "What are the entrance fees for Great Sand Dunes?"
    answer: "Entry costs $25 per vehicle, $20 per motorcycle, or $15 per person on foot or bicycle; passes cover seven consecutive days. The America the Beautiful annual pass ($80) covers entry. There is no extra fee to hike the dunes during the day."
  - question: "When does Medano Creek flow at Great Sand Dunes?"
    answer: "Medano Creek typically flows from April through early July, with peak flow in mid-May through early June. The creek runs along the base of the dunes and produces surge flow, natural waves from collapsing sand dams. By mid-summer most years the creek sinks into the sand sheet and disappears."
  - question: "When is the best time to visit Great Sand Dunes National Park?"
    answer: "Fall, particularly September and October, offers the most comfortable conditions: cool sand temperatures all day, thin crowds, and elk visible near the entrance. Spring is excellent for Medano Creek. Avoid midday in summer when sand surface temperatures can reach 150 degrees Fahrenheit."
  - question: "How hard is it to climb the dunes?"
    answer: "Dune hiking is strenuous because every step sinks into soft sand. Reaching High Dune takes about 1.25 miles each way with 650 feet of gain; most fit adults complete it in 1.5 to 2.5 hours. Star Dune is about 1.75 miles from the parking lot and higher. Wear closed shoes; sand gets extremely hot in summer; carry plenty of water."
  - question: "Can you sled or sandboard at Great Sand Dunes?"
    answer: "Yes. Visitors bring their own sleds or sandboards, or rent them in the town of Mosca a few miles south of the entrance on CO-150. There is no rental facility inside the park. Wax the board before hiking up; dry sand slows boards quickly."
  - question: "Is camping available inside the park?"
    answer: "Yes. Pinyon Flats Campground has 88 sites at $20 to $30 per night and requires reservations through Recreation.gov from spring through fall. Backcountry camping in the dune field is free with a self-issued permit; campfires are not allowed on the dunes."

