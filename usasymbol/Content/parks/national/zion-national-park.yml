  hiking: |
    **Easy**: Riverside Walk (2.2 miles round trip, 57 ft gain) is a paved path along the Virgin River from the Temple of Sinawava shuttle stop to The Narrows entry. It is fully wheelchair accessible and passes hanging gardens and streamside vegetation. Lower Emerald Pools (1.2 miles round trip, 69 ft gain) loops from Zion Lodge to a dripping cliff face and spring-fed pool.

    **Easy-Moderate**: Canyon Overlook Trail (1 mile round trip, 163 ft gain) follows a canyon ledge to a viewpoint over lower Zion Canyon and Pine Creek Canyon. The trailhead is east of the Zion-Mount Carmel Tunnel and is the only major viewpoint trail accessible by private vehicle without the shuttle.

    **Moderate**: Upper Emerald Pools (3 miles round trip, 350 ft gain) extends from the Lower Pools trailhead up to the highest pool with canyon wall views. Check current NPS alerts before visiting; portions of the trail have closed after rock fall events.

    **Strenuous**: Angels Landing (5.4 miles round trip, 1,488 ft gain) requires a permit for the chains section above Scout Lookout, where a narrow fin of rock with sheer drop-offs on both sides leads to the summit. The NPS runs a lottery for permits at recreation.gov; advance and same-day draws are available. The Narrows bottom-up (4-10 miles, river wading) starts at the end of Riverside Walk and travels upstream through the slot canyon; waterproof footwear and a walking stick are required, and a flood forecast check on the NPS website is mandatory before entry.

  campgrounds:
    - name: "Watchman Campground"
