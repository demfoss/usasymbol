  best_time_to_visit: |
    **Fall (September-November)** is the best overall window. Temperatures on the canyon floor drop from summer highs into the 50s and 60s F, cottonwood trees along the Virgin River turn gold in October, and crowds thin noticeably after Labor Day. The Narrows in October carries cooler water and vivid fall color on the canyon walls.

    **Spring (March-May)** brings wildflowers on canyon ledges and waterfalls fed by snowmelt. The canyon floor temperatures reach 45 to 75 F, making hiking comfortable during the day. The Narrows can run high or close entirely in March and April due to snowmelt and rain; check the NPS flood forecast before any river hike.

    **Summer (June-August)** is peak season and the most demanding. Canyon floor temperatures can reach 105 F by midday, and the shuttle lines at the visitor center stretch long before 9 a.m. Start all strenuous hikes before dawn and carry at least 1 liter of water per hour in heat. The Narrows stays cooler than the surface and is one of the few places to hike comfortably in afternoon summer heat.

    **Winter (December-February)** draws very few visitors and the park is notably quiet. Temperatures range from 25 to 55 F and ice forms on north-facing trails and shaded sections of Angels Landing. Traction devices are required when ice is present. The shuttle runs reduced winter hours.

