  camping: |
    Zion has three NPS campgrounds. Watchman Campground (176 sites, near the South Entrance) operates year-round with electric hookup sites and requires Recreation.gov reservations from March through November. South Campground (126 sites, no hookups) is a short walk from the visitor center, runs March through November by reservation, and fills months ahead for summer weekends. Both canyon campgrounds release dates on Recreation.gov; book as early as the window allows.

    Lava Point Campground offers 6 primitive sites on the Kolob Terrace road at 7,890 feet elevation, open July through October on a first-come, first-served basis. No water is available at Lava Point; carry all drinking water. The primitive sites offer a quiet, high-altitude alternative well removed from canyon crowds.

    Backcountry camping in the park requires a permit available through Recreation.gov. Popular routes such as the top-down Narrows and The Subway each have strict permit quotas; lottery dates are posted on the NPS website months ahead of the season.

