  fees_reservations: |
    The entrance fee is $35 per vehicle for a 7-day pass, $30 per motorcycle, or $20 per person on foot or bicycle. The America the Beautiful Annual Pass ($80/year) covers Zion and all other federal recreation areas for 12 months.

    Angels Landing requires a separate permit from the NPS lottery on recreation.gov, roughly $6 per permit plus $3 per person. Advance draws open months ahead and same-day draws open at midnight the night before. The Subway and top-down Narrows backcountry routes also require separate permits through the same system.

    Campground reservations for Watchman and South campgrounds are made through Recreation.gov and fill months in advance for summer. Lava Point is first-come, first-served.

    No timed-entry reservation is currently required to drive into the park, but the Zion Canyon Scenic Drive is closed to private vehicles from spring through late fall and served by a free park shuttle.

    Confirm current fees and rules at the official park page: nps.gov/zion.

  getting_there: |
    **By car:** The South Entrance in Springdale is the main entrance for most visitors, reached via Utah Route 9 from I-15 (Exit 16 at Hurricane or Exit 27 at Leeds). Springdale is about 45 miles from St. George Regional Airport (SGU). The East Entrance is reached from US-89 via Utah Route 9 through Mount Carmel Junction. Large vehicles, including most RVs and vehicles with trailers over certain dimensions, require a paid escort permit through the 1.1-mile Zion-Mount Carmel Tunnel; check NPS guidelines for current size limits. The Kolob Canyons Entrance on the northwest side of the park is reached from I-15 Exit 40, about 40 miles from the main canyon.

    **By shuttle:** A free municipal shuttle runs between Springdale town stops and the park's South Entrance visitor center in season. The park's own free shuttle serves 9 stops along Zion Canyon Scenic Drive from the visitor center to Temple of Sinawava, where The Narrows begins. From spring through late fall, private vehicles cannot drive the canyon road; the shuttle is the only way to reach most trailheads.

    **By air:** St. George Regional Airport (SGU) is about 45 miles away and has service from several major carriers. Las Vegas Harry Reid International Airport (LAS) is about 160 miles southwest and is the nearest large hub for visitors flying from major cities.

  geology: |
    Zion Canyon is cut through a sequence of sedimentary rock layers deposited over roughly 250 million years. The dominant material is Navajo Sandstone, a cream-to-red formation up to 2,200 feet thick that was deposited as windblown sand dunes during the Jurassic period, about 180 million years ago. Cross-bedding patterns, visible in the canyon walls as diagonal lines running through the rock, record the angle of ancient dune faces. Iron minerals stain the sandstone orange and red where water has moved through the rock.

    The Virgin River carved Zion Canyon by cutting downward as the Colorado Plateau uplifted over millions of years. The river is still actively eroding the canyon; flash floods carry abrasive sand and gravel that scour the riverbed and widen the slot. The Narrows, where the canyon narrows to as little as 20 feet wide, formed where the river cut through especially resistant sandstone.

    Kolob Arch in the northwest section has a span of about 287 feet, one of the largest natural arches on Earth. It formed by erosion of the Navajo Sandstone along a vertical crack in the canyon wall. The same jointing and erosion process creates the narrow finger canyons visible throughout the Kolob Canyons section.

    The Great White Throne, a prominent Navajo Sandstone monolith at about 6,744 feet, rises directly above the canyon floor near Zion Lodge. Its pale upper face results from oxidation and mineral leaching, which removes the iron that colors the surrounding red walls.

  wildlife: |
    California condors were reintroduced to the Colorado Plateau in 1996. More than 90 condors now range across Arizona, Utah, and Nevada, and individual birds are regularly seen soaring above Zion Canyon on thermals rising from the canyon walls. Condors have wingspans of up to 9.5 feet and are unmistakable in flight. Tagged birds are monitored by researchers and sightings can be reported to the visitor center.

    Desert bighorn sheep were extirpated from the park by the early 20th century and reintroduced in 1973. A population of about 500 now lives in the canyon and on the canyon rims, and sheep are often spotted from shuttle buses on rocky ledges above the road. Mule deer are common throughout the canyon and in meadows near Zion Lodge. Rock squirrels and ringtail cats inhabit the talus slopes; ringtails are nocturnal and rarely seen without a headlamp after dark.

    The Virgin River corridor supports canyon tree frogs, audible as a loud rattling call from rocks near the water in spring and summer. Peregrine falcons nest on the canyon walls each spring; the park monitors active nest sites and may restrict certain climbing routes during the nesting season. Mexican spotted owls, a federally threatened species, use the narrow side canyons.

  history: |
    Human presence in the Zion area dates back at least 8,000 years. Ancestral Puebloan and Fremont peoples farmed the canyon floor and left granaries, pictographs, and pottery in the alcoves above the Virgin River. The Southern Paiute called the canyon Mukuntuweap, meaning straight canyon, and continued to live in and use the region until the mid-19th century.

    Mormon pioneer Isaac Behunin settled in the canyon in 1863 and gave it the name Zion, a Hebrew word for place of refuge used in the Latter-day Saint tradition. Brigham Young reportedly disapproved of the name as too sacred and suggested "Not Zion," but the name held. President William Howard Taft proclaimed Mukuntuweap National Monument in 1909. President Woodrow Wilson redesignated it Zion National Park on November 19, 1919.

    The Zion-Mount Carmel Highway, including the 1.1-mile tunnel through the canyon wall, was completed in 1930 and opened the east side of the park. The Civilian Conservation Corps built most of the park's roads, trails, and structures throughout the 1930s, including the Grotto Picnic Area and the current trail system to Emerald Pools.

    Angels Landing was named by Methodist minister Frederick Fisher in 1916, who said the summit was so high that only an angel could land there. The chain-assisted route to the top was built by the park service in 1926. The NPS permit requirement for the chains section took effect in 2022 after decades of fatal falls from the exposed ridge.

faq:
  - question: "Where is Zion National Park?"
    answer: "Zion is in southwestern Utah, near the town of Springdale. The South Entrance is about 45 miles from St. George Regional Airport (SGU) and about 160 miles northeast of Las Vegas."
  - question: "When is the best time to visit Zion?"
    answer: "Fall (September-November) is the best overall window for cooler temperatures, thinner crowds, and fall color along the Virgin River. Spring (March-May) offers wildflowers but Narrows flood risk is high in early spring. Summer is the busiest and hottest season; start hikes before 8 a.m."
  - question: "How much does it cost to enter Zion?"
    answer: "The entrance fee is $35 per vehicle for a 7-day pass, $30 per motorcycle, or $20 per person on foot or bicycle. The America the Beautiful Annual Pass ($80) covers Zion and all U.S. national parks for one year. Confirm current fees at nps.gov/zion."
  - question: "Do I need a permit for Angels Landing?"
    answer: "Yes. A permit is required for the chains section above Scout Lookout, the most exposed part of the hike. Permits are obtained through an NPS lottery on recreation.gov; advance draws open months ahead and same-day draws open at midnight the night before your hike. The fee is about $6 per permit plus $3 per person."
  - question: "Can I drive through Zion Canyon?"
    answer: "Private vehicles cannot drive the Zion Canyon Scenic Drive from spring through late fall. A free park shuttle serves 9 stops along the road, including all major trailheads. The Canyon Overlook trailhead east of the tunnel and the Kolob Canyons section are accessible by private car year-round."
  - question: "How do I hike The Narrows?"
    answer: "The Narrows bottom-up route starts at the end of Riverside Walk (Temple of Sinawava shuttle stop) and goes upstream through the Virgin River. No permit is required for this day hike. Waterproof footwear and a walking stick are essential; rent canyoneering gear in Springdale. Check the NPS flood forecast at nps.gov/zion before entering; the route closes when river flow is dangerous."
  - question: "Are pets allowed at Zion?"
    answer: "Pets are allowed in campgrounds, on the Pa'rus Trail, and in parking areas on a 6-foot leash. They are not permitted on other park trails or the canyon shuttle. Pet-friendly options in the park are limited, so most visitors leave pets with sitters or at facilities in Springdale."

