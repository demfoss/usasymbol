sections:
  overview: |
    Zion National Park covers 147,242 acres of red and cream Navajo Sandstone in southwestern Utah, about 45 miles from St. George. The park ranks third in U.S. national park visitation, drawing nearly 4.7 million people in 2023. Zion Canyon runs 15 miles long and reaches 2,640 feet deep, carved by the North Fork of the Virgin River through layered sedimentary rock. From spring through late fall, private vehicles are barred from Zion Canyon Scenic Drive and a free park shuttle carries visitors to trailheads, overlooks, and the canyon's upper end.

  known_for: |
    **Angels Landing**: A permitted chain-assisted scramble to a 5,790-foot summit with sheer 1,500-foot drop-offs on both sides, widely considered one of the most dramatic hikes in the U.S. national park system.
    **The Narrows**: A river hike through a slot canyon where the Virgin River fills the canyon floor and walls rise 1,000 feet overhead, narrowing to as little as 20 feet wide in places.
    **Zion Canyon depth**: At up to 2,640 feet, the canyon is one of the deepest slots in North America, carved through 2,000 feet of Navajo Sandstone by a single river.
    **Kolob Arch**: One of the world's largest natural arches, with a span of about 287 feet, located in the Kolob Canyons section on the park's northwest edge, reachable by a 7-mile round-trip trail.

  best_things_to_see_items:
    - name: "Angels Landing"
      description: "Angels Landing rises 1,488 feet above the canyon floor and ends at a narrow ridge with sheer drop-offs on both sides. The final half-mile to the summit requires a permit from the NPS lottery and uses chains bolted into the rock for handholds. The view from the top takes in the full length of Zion Canyon and the Virgin River 1,500 feet below."
      image: "/images/parks/national/zion-national-park/08-best-angels-landing.jpg"
      alt: "Red rock of Angels Landing and Zion Canyon with many hikers going up section of trail with chains."
      credit: "NPS/Abi Farish"
    - name: "The Narrows"
      description: "The Narrows is a river hike through the slot canyon of the North Fork of the Virgin River, starting at the end of Riverside Walk. Hikers wade upstream through knee- to waist-deep water as walls rise 1,000 feet and narrow to as little as 20 feet wide. No permit is required for the bottom-up day route; waterproof boots or canyoneering shoes and a walking stick are strongly recommended."
      image: "/images/parks/national/zion-national-park/09-best-the-narrows.jpg"
      alt: "Tall, red, sandstone walls enclose a narrow river."
      credit: "NPS"
    - name: "Kolob Canyons"
      description: "The Kolob Canyons section of the park is a separate northwest unit reached from Exit 40 on I-15, about 40 miles from the main Zion Canyon entrance. A 5-mile scenic drive ends at a viewpoint into the red finger canyons. The Taylor Creek Trail (5 miles round trip, moderate) leads into the canyon and past two historic pioneer cabins."
      image: "/images/parks/national/zion-national-park/10-best-kolob-canyons.jpg"
      alt: "Snow is covering canyon walls as a road passes through the scene"
      credit: "NPS Photo"
    - name: "Emerald Pools"
      description: "Three spring-fed pools sit at different elevations above the canyon floor, connected by trails from the Zion Lodge area. The Lower Pool trail (1.2 miles round trip) is the easiest, ending under a dripping cliff face. The Upper Pool trail (3 miles round trip, moderate) climbs to the highest pool with canyon wall views. Check NPS alerts before visiting, as sections of the trail close after rock fall events."
      image: "/images/parks/national/zion-national-park/11-best-emerald-pools.jpg"
      alt: "Yellow leaves below and red canyon walls above."
      credit: "NPS Photo / Christopher Gezon"
    - name: "Canyon Overlook Trail"
      description: "The Canyon Overlook Trail is a 1-mile round-trip walk along a canyon ledge that ends at a viewpoint over lower Zion Canyon, Pine Creek Canyon, and the East Temple. The trailhead is on the east side of the Zion-Mount Carmel Tunnel and is accessible by private vehicle. It is the most rewarding short hike in the park for views with minimal effort."
      image: "/images/parks/national/zion-national-park/12-best-canyon-overlook-trail.jpg"
      alt: "Four rangers sit on stone stairs. Three of the rangers are repairing the stairs, and the fourth is capturing video of the work."
      credit: "NPS / Jonathan Shafer"
    - name: "Zion-Mount Carmel Highway"
      description: "The 24-mile Zion-Mount Carmel Highway (Utah Route 9) crosses the park from the South Entrance through the 1.1-mile Zion-Mount Carmel Tunnel, built in 1930, to the east entrance near Mount Carmel Junction. The eastern section above the tunnel passes through slickrock country with sandstone checkerboard mesas and hoodoos completely unlike the main canyon. Large vehicles including most RVs require a special permit and escort through the tunnel."
      image: "/images/parks/national/zion-national-park/13-best-zion-mount-carmel-highway.jpg"
      alt: "Large boulder sitting on SR 9"
      credit: "NPS / Colton Johnston"
    - name: "Riverside Walk"
      description: "Riverside Walk is a 2.2-mile paved round-trip path along the Virgin River from the Temple of Sinawava shuttle stop to the start of The Narrows. The trail is wheelchair accessible and passes hanging gardens and canyon tree frogs audible from the riverbanks. It is the entry point for anyone starting a Narrows day hike."
      image: "/images/parks/national/zion-national-park/14-best-riverside-walk.jpg"
      alt: "Two hikers walking down the Riverside Walk trail, two other hikers can be seen in the background"
      credit: "NPS Photo"

