seo_title: "Voyageurs National Park: Boating, Fishing & Visitor Tips"
seo_description: "Visit Voyageurs National Park in Minnesota: four border lakes, boating, fishing, Northern Lights, and free entry."
intro_text: "Voyageurs National Park in northern Minnesota protects 218,222 acres of boreal lake country along the Canadian border, where roughly 40 percent of the park is open water. Established in 1975, it is one of the few U.S. national parks where the interior is accessible only by boat, canoe, or kayak."

