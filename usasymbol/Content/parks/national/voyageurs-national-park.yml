  fees_reservations: |
    Park entry is free. No entrance fee is charged at any of the four visitor centers. Overnight camping in the park requires a free permit, available through recreation.gov or self-issued at visitor center kiosks. Reservable campsites fill on summer weekends; book in advance for July and August island sites. Houseboat rentals from private operators range from $150 to $400 per night depending on size and season; book directly with the concession operators. There are no tour tickets or timed entries. Confirm current programs and rules at the official park page: nps.gov/voya.

