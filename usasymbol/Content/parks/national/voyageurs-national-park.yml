sections:
  overview: |
    The park centers on four large lakes — Rainy, Namakan, Sand Point, and Kabetogama — connected by narrows and bays along the Minnesota-Ontario border. No paved road enters the park interior; four visitor centers at Rainy Lake, Kabetogama Lake, Ash River, and Crane Lake serve as launching points for boats, canoes, and kayaks. Entry is free and the park draws about 264,000 visitors per year, ranked 56th among the 63 national parks. The Northern Lights are visible on clear nights from late summer through fall, and Rainy Lake sits at a latitude high enough to see strong displays in active solar years.

  known_for: |
    - A water-based park where the interior is accessible only by boat, canoe, or kayak — no roads cross the park
    - Rainy, Namakan, Sand Point, and Kabetogama lakes, totaling more than 655 miles of shoreline along the Canadian border
    - Gray wolf packs that hunt year-round across the Kabetogama Peninsula and surrounding forest
    - Northern Lights visible from the lakes on clear fall and winter nights, with minimal light pollution from surrounding towns

  best_things_to_see: |
    Boating the four-lake system is the core experience: paddling from one rocky bay to the next, camping on islands, and fishing for walleye in the shallows at dusk. Kettle Falls Hotel, a 1913 structure accessible only by boat from any direction, is the geographic heart of the park and a working lodge where visitors can stay overnight. Ellsworth Rock Gardens on Kabetogama Lake is a lakeside terraced garden built by a single Chicago contractor between 1944 and 1965, with more than 200 sculptures and planters carved from local rock. The Northern Lights appear over the open water on clear nights from August through October, away from the minimal light pollution near International Falls. Bald eagles, osprey, and common loons are visible from the water daily through the open season.

  best_things_to_see_items:
    - name: "The Four-Lake Water System"
      description: "Rainy, Namakan, Sand Point, and Kabetogama lakes form a connected water highway along the Ontario border with more than 655 miles of combined shoreline. Boaters can cross between lakes through narrows and bays, reaching more than 500 islands throughout the system. The only way to explore the park interior is by water; the scale and remoteness increase the further from the launch points you travel."
      image: "/images/parks/national/voyageurs-national-park/08-four-lake-water-system.jpg"
      alt: "Orange tinted sky with islands scattered throughout the still lake."
      credit: "More Than Just Parks"
    - name: "Kettle Falls Hotel"
      description: "Kettle Falls Hotel was built in 1913 at the confluence of Rainy and Namakan lakes, accessible only by boat from all four entry points. It operated as a saloon and hotel for loggers, then sport fishermen, and still takes overnight guests. The building is a National Historic Landmark; the porch bar sits directly on the international boundary, with Canada to the north."
      image: "/images/parks/national/voyageurs-national-park/09-kettle-falls-hotel.jpg"
      alt: "aerial view of Kettle Falls hotel taken in early winter at Voyageurs National Park"
    - name: "Ellsworth Rock Gardens"
      description: "Ellsworth Rock Gardens on the north shore of Kabetogama Lake is a half-acre terraced garden built by Jack Ellsworth between 1944 and 1965. More than 200 sculptures, planters, and rock arrangements line the lakeshore. Ellsworth hauled every stone by boat from surrounding shores. The site is accessible only by water; the NPS maintains it as a cultural landscape."
      image: ""
      alt: "Stone sculptures and terraces along the lakeshore at Ellsworth Rock Gardens"
    - name: "Northern Lights"
      description: "Voyageurs sits at 48 degrees north latitude and has no significant light pollution near the open water. The aurora borealis is visible on clear nights from August through March, with the most frequent and intense displays in September and October when solar activity peaks with dark nights. The open lake surface provides an unobstructed northern horizon and a reflection of the lights in still water."
      image: "/images/parks/national/voyageurs-national-park/10-northern-lights.jpg"
      alt: "The Aurora Borealis over Voyageurs National Park"
      credit: "NPS/Dimse"
    - name: "Fall Foliage from the Water"
      description: "The boreal forest around the lakes turns gold and red in late September and early October. Paddling through a channel with birch and aspen reflected in still water at sunrise is one of the distinctive fall experiences in the upper Midwest. Crowds drop sharply after Labor Day and boat traffic on the lakes is minimal by mid-September."
      image: "/images/parks/national/voyageurs-national-park/11-fall-foliage-from-water.jpg"
      alt: "orange, yellow, and green colors are showing in the fall foliage"
      credit: "NPS Photo"
    - name: "Wolf Watching and Wildlife"
      description: "The Kabetogama Peninsula holds several gray wolf packs that are among the most accessible wolf populations in the contiguous United States. Wolves cross the ice in winter and are occasionally spotted near shorelines. Moose are seen in shallow bays feeding on aquatic vegetation in early morning, and bald eagles nest throughout the park."
      image: "/images/parks/national/voyageurs-national-park/12-wolf-watching-wildlife.jpg"
      alt: "Within Voyageurs National Park there are approximately six to eight wolf packs and a total of 35-45 wolves. Lone wolves, such as the one in this photo, make up about 15% of the total populations of wolves in the park."

  best_time_to_visit: |
    **Spring (May–June):** Ice-out on the lakes typically occurs in early to mid-May, opening the water for boats. Waterfowl migration peaks in May, with loons, ducks, and mergansers arriving in large numbers. Black flies and mosquitoes are at their worst from late May through June; bring head nets and insect repellent. Fishing for northern pike is productive immediately after ice-out.

    **Summer (July–August):** The prime season for boating, fishing, swimming, and camping on the islands. Water temperatures reach 70°F and all visitor centers are fully staffed. Walleye and muskie fishing peak in late July. The park is at its busiest but still quiet compared to most national parks; boat traffic on the lakes is light except near the launch points on weekends.

    **Fall (September–October):** The best season for Northern Lights, fall foliage, and solitude. Crowds drop after Labor Day and the lakes are nearly empty by late September. The aurora borealis is most reliably visible in September and October on clear moonless nights over the open water. Fishing for walleye and lake trout improves as water cools. The visitor centers begin closing for the season in October.

  hiking: |
    **Road-accessible trails:** Voyageurs has limited hiking from road-accessible areas. The Rainy Lake Visitor Center maintains a 2-mile network of short interconnected trails through the boreal forest near the lakeshore, including the Oberholtzer Trail, which reaches a rocky overlook above Rainy Lake. The Blind Ash Bay Trail starts at the Ash River Visitor Center and runs 3 miles round trip through birch and aspen forest to an overlook at the end of a bay. The Black Bay Beaver Pond Trail near the Kabetogama Visitor Center is a 0.9-mile round trip to an active beaver pond. Pets on leash are permitted on road-accessible trails.

    **Boat-access interior trails:** The Kabetogama Peninsula holds the only interior trail system, the Cruiser Lake Trail, reachable only after boating to the peninsula's shore. The main route runs approximately 9.5 miles round trip from the landing to Cruiser Lake, gaining several hundred feet across rolling boreal terrain. Side trails extend to smaller lakes and ridge viewpoints. Hikers must arrive by their own boat and carry all water; no services exist in the interior.

