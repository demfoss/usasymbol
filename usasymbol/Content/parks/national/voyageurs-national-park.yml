faq:
  - question: "Where is Voyageurs National Park?"
    answer: "Voyageurs National Park is in northern Minnesota along the Canadian border, near the town of International Falls. The park has four separate entry points — Rainy Lake, Kabetogama Lake, Ash River, and Crane Lake — all reached via US-53 from Duluth."
  - question: "Do you need a boat to visit Voyageurs National Park?"
    answer: "To access the park interior, yes. No road enters the park beyond the visitor centers. Short hiking trails are available at each visitor center without a boat. Boat rentals are available from private marinas near all four visitor centers."
  - question: "Is there an entrance fee for Voyageurs National Park?"
    answer: "No. The park is free to enter. Overnight camping requires a free permit available through recreation.gov or at the visitor centers."
  - question: "Can you see the Northern Lights at Voyageurs?"
    answer: "Yes. The park sits at 48 degrees north latitude with minimal surrounding light pollution. The aurora borealis is visible on clear nights from August through March, with the most active displays typically in September and October. The open lake surface gives an unobstructed northern horizon."
  - question: "What fish are in Voyageurs National Park?"
    answer: "The four-lake system holds walleye, northern pike, muskie, smallmouth bass, and lake trout. A Minnesota fishing license is required for anyone 16 and older. The park does not sell licenses; purchase them in International Falls or online from the Minnesota DNR before entering."
  - question: "When is the best time to visit Voyageurs National Park?"
    answer: "Summer (July and August) is best for boating, camping, and fishing. Fall (September and October) is best for Northern Lights, foliage, and solitude. Spring is good for bird migration and pike fishing but black flies are severe in late May and June."
  - question: "Are there wolves at Voyageurs National Park?"
    answer: "Yes. The park supports several gray wolf packs year-round. The Kabetogama Peninsula pack is among the best studied in the United States. Wolves are occasionally spotted crossing narrows or along wooded shorelines, and their howling is audible at night across the open water."

