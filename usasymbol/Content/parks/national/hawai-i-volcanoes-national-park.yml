faq:
  - question: "Is lava flowing at Hawaiʻi Volcanoes National Park?"
    answer: "Kīlauea has erupted frequently since 2020, with multiple episodes producing a lava lake inside Halemaʻumaʻu Crater. Eruption activity changes without warning -- it can start, pause, or end on any day. Check the NPS eruption update page at nps.gov/havo for current status before your visit."
  - question: "Where is Hawaiʻi Volcanoes National Park?"
    answer: "The park is on the Big Island of Hawaii, about 30 miles southwest of Hilo via Highway 11 and about 100 miles southeast of Kailua-Kona. The nearest commercial airport is Hilo International (ITO), roughly 30 miles from the entrance."
  - question: "What is the entrance fee for Hawaiʻi Volcanoes National Park?"
    answer: "Entry costs $30 per vehicle, $25 per motorcycle, or $15 per person on foot or bicycle; passes cover seven consecutive days. The America the Beautiful annual pass covers entry. No timed entry reservation is required."
  - question: "What is the best hike at Hawaiʻi Volcanoes National Park?"
    answer: "Kīlauea Iki Trail is the best overall hike: a 4-mile loop that descends 400 feet into the 1959 eruption crater and crosses the hardened lava lake floor past active steam vents. Allow 2 to 3 hours. For something shorter, the Nāhuku (Thurston Lava Tube) Loop takes about 45 minutes and includes a 0.3-mile walk through a lit lava tube."
  - question: "Is it safe to visit during an eruption?"
    answer: "The park stays open during most eruption activity, and the caldera rim overlooks are typically safe for viewing. Some trails and roads close when volcanic gases reach dangerous levels or lava flows onto roads; check current conditions at nps.gov/havo. Vog (volcanic smog) can affect air quality and is a concern for people with respiratory conditions."
  - question: "How do I get to Hawaiʻi Volcanoes National Park without a car?"
    answer: "A rental car is effectively required. The park has no shuttle or public transit connection from Hilo or Kona. Guided bus tours operate from both sides of the island for visitors who cannot or prefer not to drive."
  - question: "Can you see both Kīlauea and Mauna Loa in one day?"
    answer: "You can see both from the park's main road network in one day. The Kīlauea summit area, Crater Rim Drive, and Chain of Craters Road are accessible by car; allow 4 to 6 hours for a thorough driving visit. Mauna Loa Road provides views of and access to the lower slopes of that volcano. Hiking to Mauna Loa's summit requires 3 to 4 days."

