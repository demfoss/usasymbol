sections:
  overview: |
    Hawaiʻi Volcanoes National Park spans 325,605 acres of the Big Island, climbing from wave-battered black lava coastline at sea level to the 13,680-foot summit of Mauna Loa, the world's largest volcano by volume. Two active volcanoes anchor the park: Kīlauea, one of the world's most continuously active volcanoes, and Mauna Loa, which last erupted in November 2022. The park's main hub sits at about 4,000 feet near the Kīlauea caldera, roughly 30 miles southwest of Hilo on Highway 11. A UNESCO World Heritage Site since 1987, the park draws about 1.5 million visitors a year, ranking 23rd of 63 national parks, with volcanic activity serving as the main draw year-round.

  known_for: |
    **Active lava and eruptions** -- Kīlauea has erupted frequently since 2020, with multiple episodes of lava lake activity inside Halemaʻumaʻu Crater visible from the caldera rim at night; eruption status changes often, so check nps.gov/havo before your visit. **Kīlauea Iki Crater** -- a 1959 eruption left a one-mile-wide lava lake that hardened to a walk-able black floor still crossed by steam vents; the 4-mile loop trail descending into it is the park's most popular hike. **Nāhuku (Thurston Lava Tube)** -- a 500-year-old tube where molten rock once flowed, now an 0.3-mile lit walk through a cathedral-sized tunnel of dark basalt. **Chain of Craters Road** -- a 19-mile paved descent from the summit caldera to the coast, passing pit craters, lava flows from multiple eruptions, and ancient Hawaiian petroglyphs at Puʻu Loa.

  best_time_to_visit: |
    **Spring (March-May)** One of the more comfortable windows. Summit temperatures at Kīlauea average 55 to 65 degrees Fahrenheit and trade winds keep the air clear. Lava viewing from the caldera rim is good year-round when the volcano is active. Crowds are moderate and campgrounds are easier to book than in summer.

    **Summer (June-August)** The busiest season, especially in July and August when mainland visitors coincide with school holidays. Daytime temperatures at the 4,000-foot summit area remain mild at 55 to 70 degrees. The coast end of Chain of Craters Road can be hot at 80 to 88 degrees. Book Nāmakanipaio Campground well in advance.

    **Fall (September-October)** Crowds ease after Labor Day. Conditions remain good, and the summit area can have clearer skies in September. Eruption activity is unpredictable year-round; fall visits carry the same volcanic sighting odds as any other season.

    **Winter (November-February)** The wettest season around Hilo and on the park's eastern slopes. Mauna Loa summit can see snow. The caldera rim gets fog and rain, though lava glow is often more dramatic against low cloud cover. Visitor numbers drop, making this the easiest time to get campsite availability. Pack layers and rain gear; temperatures near the summit can drop to 40 degrees at night.

  hiking: |
    **Easy** Devastation Trail covers 1 mile one way through a cinder field and standing dead trees left by the 1959 Kīlauea Iki eruption, which buried this forest under volcanic debris. The flat, paved route shows the raw contrast between destruction and recovery. Nāhuku (Thurston Lava Tube) Loop is about 1.3 miles including the 0.3-mile lit walk through the lava tube itself; the tube ceiling reaches 20 feet in some sections. Both trailheads are near each other off Crater Rim Drive.

    **Moderate** Kīlauea Iki Trail is the park's premier day hike: a 4-mile loop that drops 400 feet into the crater over a steep forested wall, then crosses 1 mile of hardened lava floor past active steam vents to the 1959 vent on the far side. Fumaroles hiss from cracks in the floor; the route is marked by cairns. Allow 2 to 3 hours and carry water. Crater Rim Trail follows the caldera edge for variable distances; the section from the Kīlauea Visitor Center past the steam vents and sulfur banks to the Halemaʻumaʻu overlook is about 4 miles round trip with minimal elevation change.

    **Strenuous** Mauna Loa Trail from the Mauna Loa Road terminus at 6,662 feet climbs 7.5 miles one way to Red Hill Cabin at 10,035 feet, with a further 11.5 miles to the summit at 13,677 feet. The full round trip of nearly 40 miles is typically done over 3 to 4 days with overnight stays at Red Hill and Mauna Loa Summit Cabin; both require advance permits from the visitor center. The upper trail is above treeline on barren lava with high UV exposure and rapid weather changes.

  camping: |
    The park has two developed campgrounds and a backcountry permit system for Mauna Loa. Nāmakanipaio Campground sits at about 4,000 feet in an open eucalyptus meadow near the main caldera area, with 10 tent sites at $15 per night; reserve through Recreation.gov. A-frame cabins at the same site are managed separately through Volcano House, the historic hotel at the caldera rim; book directly with the hotel. Kulanaokuaiki Campground, accessible via Chain of Craters Road, has 8 tent sites in a more remote lava-field setting at about 2,700 feet; sites are free and first-come, first-served with pit toilets but no water. Backcountry hikers on the Mauna Loa Trail use Red Hill Cabin and Mauna Loa Summit Cabin; both require a free permit from the Kīlauea Visitor Center and have a maximum group size. Carry all water above the campgrounds -- no reliable sources exist on the upper mountain.

  fees_reservations: |
    Entry costs $30 per vehicle, $25 per motorcycle, or $15 per person on foot or bicycle; passes cover seven consecutive days. The America the Beautiful annual pass ($80) covers entry for the pass holder and vehicle occupants. No timed entry reservation is required for general park access. Nāmakanipaio tent camping costs $15 per night; reserve through Recreation.gov. Kulanaokuaiki camping is free and first-come. Mauna Loa backcountry cabin permits are free and issued at the Kīlauea Visitor Center. Volcano House hotel requires separate booking. Eruption conditions, road closures, and trail hazards change frequently; confirm current status at nps.gov/havo before visiting.

  getting_there: |
    **By car** The main park entrance is on Highway 11, about 30 miles southwest of Hilo and 100 miles southeast of Kailua-Kona. From Hilo, drive south on Highway 11 through Keaau and Mountain View to the park entrance near Volcano Village. From Kona, take Highway 11 south around the island's southern tip -- allow 2 to 2.5 hours. No shuttle serves the park interior; a car is required.

    **By air** Hilo International Airport (ITO) is roughly 30 miles from the park entrance and offers inter-island and some mainland connections. Ellison Onizuka Kona International Airport (KOA) is about 100 miles away on the island's west side. Rental cars are available at both airports.

  geology: |
    The Hawaiian Islands formed as the Pacific Plate moved northwest over a fixed mantle hot spot -- a rising plume of unusually hot rock. The Big Island sits directly over the hot spot today, which is why Kīlauea and Mauna Loa remain active while older islands to the northwest have long gone dormant. Mauna Loa has produced more lava by volume than any other volcano on Earth; its base on the ocean floor extends more than 30,000 feet below sea level, making it the tallest mountain on Earth when measured from its base.

    The park's two main lava types reflect different eruption styles. Pāhoehoe forms when low-viscosity lava cools slowly, producing smooth, ropy surfaces and hollow tubes when flowing lava drains from a hardened shell. ʻAʻā forms when lava moves faster and cools more rapidly at the surface, creating the sharp, clinkery rubble that covers much of Chain of Craters Road. Both types appear side by side throughout the park.

    The 2018 eruption dramatically reshaped the landscape. A series of fissures opened on Kīlauea's lower East Rift Zone, producing lava flows that buried Leilani Estates and filled Kapoho Bay with new land. At the summit, the withdrawal of magma caused the floor of Halemaʻumaʻu Crater to collapse roughly 1,600 feet over several weeks, more than doubling the caldera's depth. Post-2018 eruption episodes have partially refilled the crater with a new lava lake.

    Nāhuku (Thurston Lava Tube) formed about 500 years ago when surface lava cooled and crusted over while molten rock continued flowing through the interior. When the eruption stopped and the lava drained, a hollow tunnel up to 20 feet high remained. Lava tubes can extend for miles; this one is accessible because a section was excavated and opened for public use in 1913.

  wildlife: |
    Nēnē, the Hawaiian state bird, are frequently seen along the caldera rim, near parking areas, and on the lava fields; the park hosts one of the largest resident populations in Hawaii. Do not feed them -- nēnē that approach humans for food lose their foraging instincts and become dependent on handouts. The ʻōpeʻapeʻa, or Hawaiian hoary bat, is the only native land mammal in Hawaii and hunts insects at dusk near the forest edges around the caldera.

    Native forest birds including ʻapapane, ʻamakihi, and ʻōmaʻo (Hawaiian thrush) inhabit the park's ʻōhiʻa lehua forests between about 3,000 and 7,000 feet. The ʻōhiʻa lehua, the dominant native tree, is the first plant to colonize new lava flows and provides the primary food source for the honeycreepers. Hawaiian hawk (ʻio) and pueo (Hawaiian short-eared owl) hunt in open areas.

    The coastal sections of Chain of Craters Road provide access to black sand beaches and lava benches where Hawaiian green sea turtles haul out to rest. Hawaiian monk seals occasionally appear on the coast as well. Feral pigs, cats, and mongooses are present throughout the park and are managed as threats to nesting birds and native plants.

  history: |
    Native Hawaiians (Kānaka Maoli) have a continuous cultural relationship with the volcanoes that predates written history. Pele, the Hawaiian volcano deity, is believed to reside in Halemaʻumaʻu Crater. The lava fields, craters, and coastline hold hundreds of sites of cultural significance, including the Puʻu Loa petroglyph field, which contains over 23,000 carved images -- one of the largest petroglyph concentrations in Hawaii. Trails across the lava connected communities on opposite sides of the island for centuries.

    Western contact began in 1778 with Captain James Cook's arrival in the Hawaiian Islands. Missionaries and naturalists reached the volcano in the early 1800s and sent accounts of the lava lake back to Europe and America, drawing travelers from around the world. Mark Twain visited Kīlauea in 1866 and described it as "the most unutterable of all spectacles" in his dispatches for the Sacramento Union.

    Geologist Thomas Jaggar established the Hawaiian Volcano Observatory on the caldera rim in 1912, beginning systematic scientific monitoring of the eruptions. Congress created Hawaii National Park in 1916, the same legislation that established the National Park Service. The Kīlauea and Mauna Loa sections were combined with Haleakalā on Maui under one administration until 1961, when Hawaiʻi Volcanoes became its own park. UNESCO designated it a World Heritage Site in 1987. The 2018 eruption, the most destructive in modern Hawaiian history, altered the park's landscape and led to significant trail and road reconstruction that continued through the early 2020s.

  best_things_to_see_items:
    - name: "Halemaʻumaʻu Crater and Lava Lake"
      description: "The main crater within Kīlauea caldera, where an active lava lake has formed during multiple eruption episodes since 2020. The caldera rim overlooks offer views into the crater and, when the volcano is erupting at night, glow visible from miles away. Eruption status changes frequently; check nps.gov/havo for current conditions. The Kīlauea Overlook and Jaggar Museum overlook area are the primary viewing spots."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/26DA4B6B-0552-CB8D-A53F8DE679CE890B.jpg?width=1600&quality=90&mode=crop"
      alt: "A deep crater within a volcanic caldera with a tree in the foreground"
      credit: "NPS Photo/J. Wei"
    - name: "Kīlauea Iki Trail"
      description: "A 4-mile loop that descends 400 feet through a native forest wall into the crater formed during the dramatic 1959 eruption, then crosses a mile of hardened lava floor past steaming vents to the cinder cone that fountained lava 1,900 feet into the air. The trail is marked by cairns across the flat floor and is one of the most accessible ways to walk on fresh volcanic rock. Allow 2 to 3 hours."
      image: "https://www.nps.gov/havo/planyourvisit/images/HAVO_20190607_K%C4%ABlauea-Iki-Trail-with-Ohia-in-Foreground_JWei.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp"
      alt: "Floor of a volcanic crater with small ohia trees with red flowers"
      credit: "NPS Photo/J. Wei"
    - name: "Nāhuku (Thurston Lava Tube)"
      description: "A 500-year-old lava tube with a 0.3-mile lit walking section through a tunnel up to 20 feet high. The full loop is about 1.3 miles including the surrounding rainforest trail. Access is via a short path through a dense ʻōhiʻa and tree fern forest that makes the transition into bare basalt particularly striking. Arrive early -- the trailhead parking lot fills quickly."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/E9F518AD-FA51-5A78-BBD2E2242E31C563.jpg?width=1600&quality=90&mode=crop"
      alt: "A lava tube lit by orange electric light"
      credit: "NPs Photo/D. Boyle"
    - name: "Chain of Craters Road"
      description: "A 19-mile paved road that descends 3,700 feet from the caldera area to the coast, passing a dozen pit craters, ʻaʻā and pāhoehoe lava fields from eruptions spanning decades, and the Puʻu Loa petroglyph field (over 23,000 carvings). The road ends at a lava bench where 1990s flows covered the old coastal highway. Allow 2 to 3 hours for the drive with stops."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/E29407FA-9CC2-7061-6E950C7008484F50.jpg?width=1300&quality=90&mode=crop"
      alt: "Rainbow on the side of a road in a lava landscape"
      credit: "NPS Photo/J. Wei"
    - name: "Steam Vents and Sulfur Banks"
      description: "A short walk from the Kīlauea Visitor Center leads to steam vents where groundwater heated by underground magma rises as plumes of water vapor, and to sulfur banks coated in yellow sulfur crystals deposited by volcanic gases. Both features are accessible from the paved Crater Rim Trail and require only a few minutes of walking. The vents are most dramatic on cool mornings."
      image: "https://www.nps.gov/havo/learn/nature/images/HAVO_20190106_Wahinekapu-Steaming-Bluff_JWei.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp"
      alt: "Steam rising from the forested edge of a volcanic crater"
      credit: "NPS Photo/J. Wei"
    - name: "Mauna Loa"
      description: "The world's largest volcano by volume -- about 18,000 cubic miles of rock -- dominates the park's western half. The Mauna Loa Road climbs to the trailhead at 6,662 feet, giving accessible views across the barren upper landscape. The summit at 13,677 feet is reached by a multi-day trail requiring backcountry permits. Mauna Loa last erupted in November 2022 after a 38-year quiet period."
      image: "https://www.nps.gov/havo/learn/nature/images/HAVO_20191115_Looking-Toward-Mauna-Loa-from-Keanakakoi-Area_JWei.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp"
      alt: "Mauna Loa volcano at sunrise"
      credit: "NPS Photo/J. Wei"
    - name: "Puʻu Loa Petroglyphs"
      description: "One of the largest petroglyph fields in Hawaii, with over 23,000 images carved into smooth pāhoehoe lava along the coast. A 1.4-mile round-trip boardwalk leads from the Chain of Craters Road to the primary concentration of carvings. The petroglyphs include circles, human figures, and over 16,000 puka (holes) where Hawaiians placed umbilical cords of newborns to ensure a long life."
      image: "https://www.nps.gov/havo/learn/historyculture/images/puuloa-petroglyph-boardwalk_688.jpg?maxwidth=650&autorotate=false"
      alt: "Visitors on a boardwalk over petroglyphs in dark gray rock"
      credit: "NPS photo"

