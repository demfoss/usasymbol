seo_description: "Visit Hawaiʻi Volcanoes National Park on Hawaii's Big Island: active volcanoes, Kīlauea hikes, lava tubes, $30 entry, and best time to go."
intro_text: "Hawaiʻi Volcanoes National Park on the Big Island of Hawaii protects the summits and flanks of two of the world's most active volcanoes, Kīlauea and Mauna Loa. Established in 1916 and covering 325,605 acres from sea level to 13,680 feet, the park is a UNESCO World Heritage Site where ongoing eruptions continue to build the island."

