faq:
  - question: "Where is Biscayne National Park?"
    answer: "Biscayne is in South Florida, about 21 miles south of downtown Miami and just north of Everglades National Park. The only road-accessible facility is the Dante Fascell Visitor Center at Convoy Point in Homestead — take SW 328th Street east from US-1. The park's islands are accessible only by boat."
  - question: "Is there an entrance fee for Biscayne National Park?"
    answer: "No — Biscayne National Park has no entrance fee. The park is free to visit. An overnight mooring fee (approximately $35 per vessel per night) applies at Elliott Key and Boca Chita Key for boats staying overnight. Guided tours run by the park concessioner charge separate fees."
  - question: "When is the best time to visit Biscayne National Park?"
    answer: "Winter (December–February) offers the most comfortable weather, the clearest water on the reef, and the full guided-tour schedule. Spring (March–May) is nearly as good with slightly warmer water. Summer brings intense heat, daily thunderstorms, and frequent tour cancellations. Fall is quiet and uncrowded once hurricane season winds down in late October."
  - question: "How do I get to the islands in Biscayne National Park?"
    answer: "No roads connect to any island in the park. Elliott Key and Boca Chita Key are accessible by private boat or through guided tours and island-landing excursions operated by the park concessioner at the Dante Fascell Visitor Center. A boat ramp at the visitor center is available for private vessels. Elliott Key is about 9 miles from the visitor center; Boca Chita Key is about 10 miles."
  - question: "What is the best activity at Biscayne National Park?"
    answer: "Snorkeling the coral reef is the signature experience. The reef holds more than 500 fish species and is the only living coral reef in the continental United States. Guided snorkel trips depart from the Dante Fascell Visitor Center and are the safest way to reach the reef without local knowledge. Kayaking Biscayne Bay and visiting Boca Chita Key are strong alternatives for visitors without snorkel gear."
  - question: "Can you see manatees at Biscayne National Park?"
    answer: "Yes. West Indian manatees feed in the seagrass beds of Biscayne Bay year-round and are commonly spotted from boats and kayaks, particularly near Elliott Key and Adams Key. The park enforces slow-speed zones in key areas to protect manatees from boat propeller injuries. Early mornings on calm days offer the best sightings."
  - question: "Are there sharks in Biscayne National Park?"
    answer: "Yes, but encounters are rarely dangerous. Nurse sharks are the most common species; they rest on the sandy bottom under coral ledges during the day and are not aggressive toward snorkelers. Reef sharks and blacktip sharks are present on the outer reef. Follow standard guidelines: do not touch, feed, or corner marine life, and stay calm if you encounter a shark."

