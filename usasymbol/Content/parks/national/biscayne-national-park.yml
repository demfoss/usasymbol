sections:
  overview: |
    Biscayne National Park lies at the southern tip of Florida, 21 miles south of downtown Miami, between the city and the open Atlantic. The park covers 172,971 acres, of which 95 percent is water — Biscayne Bay to the west and the ocean reef tract to the east. Between those two bodies of water sit 27 mangrove-covered keys, the northernmost chain of the Florida Keys. The park protects the only living coral reef in the continental United States, part of the third-largest coral reef system in the world. Biscayne ranks 43rd among the 63 national parks by annual visitation, drawing about 565,000 visitors in 2023. Most of the park is accessible only by boat; the Dante Fascell Visitor Center at Convoy Point is the only mainland facility and the departure point for guided tours.

  known_for: |
    The only living coral reef in the continental United States, running along the eastern edge of the park on the ocean side of the keys, with hundreds of coral and fish species including parrotfish, angelfish, and queen triggerfish. The Maritime Heritage Trail, six protected shipwrecks ranging from 19th-century sailing vessels to a 1960s freighter, accessible by snorkelers and SCUBA divers. Boca Chita Key's ornamental lighthouse, built in 1937 by private owner Mark Honeywell, one of the most photographed structures in the park and the embarkation point for a loop walk through tropical hardwood hammock. Nesting and feeding grounds for green sea turtles, loggerhead turtles, West Indian manatees, and American crocodiles.

  best_things_to_see_items:
    - name: "Coral Reef Snorkeling and Diving"
      description: "The coral reef running along the park's eastern edge is part of the Florida Reef, the third-largest coral reef in the world. Staghorn and elkhorn corals, both threatened species, grow alongside brain coral and sea fans. The reef is home to more than 500 fish species. Guided snorkel and SCUBA trips depart from the Dante Fascell Visitor Center; a personal boat or kayak cannot safely navigate directly to the reef without local knowledge."
      image: "https://www.nps.gov/common/uploads/structured_data/E789390E-C7B5-2B1F-13974FC0EA9C7BD6.jpg"
      alt: "Underwater view of coral reef with a large school of yellow and blue fish"
      credit: "NPS image by Shaun Wolfe"
    - name: "Boca Chita Key"
      description: "Boca Chita Key is a 32-acre island about 10 miles south of the visitor center, reachable only by boat. Millionaire Mark Honeywell developed it as a private retreat in the late 1930s, leaving behind an ornamental lighthouse, a decorative harbor, and several concrete buildings. A 0.5-mile loop trail circles the island through tropical hardwood hammock. The island has mooring and tent camping and is one of the most popular day-trip destinations in the park."
      image: "https://www.nps.gov/bisc/planyourvisit/images/DSC_0055_1.jpg?autorotate=false&format=webp&maxheight=1300&maxwidth=1300"
      alt: "Boca Chita lighthouse"
      credit: "NPS image by Matt Johnson"
    - name: "Elliott Key"
      description: "Elliott Key is the largest island in the park at about 7 miles long, with a campground, ranger station, and the only freshwater shower facility in the backcountry. A 6.5-mile trail called Spite Highway runs the length of the island through dense tropical hardwood hammock — so named because developers bulldozed the path in 1968 to reduce the land's value and block the monument designation. The island is accessible only by boat, about 9 miles from the visitor center."
      image: "https://www.nps.gov/bisc/planyourvisit/images/DSC_0091_2.jpg?autorotate=false&maxwidth=650"
      alt: "Elliott Key harbor"
      credit: "NPS image by Matt Johnson"
    - name: "Biscayne Bay Kayaking"
      description: "Biscayne Bay's shallow, clear waters are ideal for kayaking and canoeing. The bay averages only 6 to 9 feet deep, with a sandy bottom and extensive seagrass beds visible from above. A kayak launch is available at the visitor center; paddlers can reach Adams Key (5 miles) or the near shore of Elliott Key (9 miles) on a full-day crossing. The Miami skyline rises to the north across the open bay."
      image: "https://www.nps.gov/common/uploads/structured_data/3C870533-1DD8-B71B-0B70CFF5EF6538F1.jpg"
      alt: "Downtown Miami in background."
      credit: "NPS photo"
    - name: "Maritime Heritage Trail"
      description: "Six shipwrecks within the park are marked with mooring buoys and interpretive materials as the Maritime Heritage Trail, accessible by snorkelers and SCUBA divers. The wrecks range from the 19th-century sailing vessel Lugano to the 1960s freighter Erl King, and range from 10 to 45 feet in depth. Each wreck supports its own community of coral and fish. The concessioner at the visitor center runs guided dive trips to the trail."
      image: "https://www.nps.gov/bisc/learn/historyculture/images/Arratoon-Apcar-front-image_2.jpg?autorotate=false&maxwidth=650"
      alt: "The steel skeleton of a ship rests on the ocean floor"
    - name: "Wildlife and Sea Turtles"
      description: "Biscayne's beaches and shallow waters are critical nesting and feeding habitat for green sea turtles and loggerhead turtles, both federally protected. Green turtles nest on the ocean-facing beaches of the keys from May through October. West Indian manatees feed on seagrass beds in the bay throughout the year and are most reliably spotted in the warm months near Elliott Key and Adams Key. American crocodiles — not alligators — use the park's shallow coastal waters year-round."
      image: "https://www.nps.gov/common/uploads/structured_data/3C870A07-1DD8-B71B-0B9BA7F6549AD537.jpg"
      alt: "Green sea turtle"
      credit: "NPS photo"

