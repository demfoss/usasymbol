faq:
  - question: "What is Hot Springs National Park known for?"
    answer: "Hot Springs National Park is best known for Bathhouse Row -- eight historic Beaux-Arts spa buildings on Central Avenue -- and for 47 thermal springs that emerge from Hot Springs Mountain at a constant 143°F. It is also the oldest federally reserved public land in the United States, protected by Congress since 1832."
  - question: "Is there an entrance fee for Hot Springs National Park?"
    answer: "No. The park charges no entrance fee and the Fordyce Bathhouse museum is free. Fees apply to bathing services at the two operating bathhouses: Buckstaff charges approximately $40 to $60 per person for a traditional thermal bath, and Quapaw Baths offers thermal pool access for around $35. Camping at Gulpha Gorge costs $26 to $30 per night."
  - question: "Where is Hot Springs National Park?"
    answer: "Hot Springs National Park is in the city of Hot Springs, Arkansas, in the Ouachita Mountains about 55 miles southwest of Little Rock. The park entrance and Bathhouse Row are on Central Avenue in downtown Hot Springs. The nearest major airport is Bill and Hillary Clinton National (LIT) in Little Rock."
  - question: "Can you still take a thermal bath at Hot Springs National Park?"
    answer: "Yes. Buckstaff Bathhouse, open since 1912, offers traditional thermal mineral baths including a soak in spring water and a steam cabinet. It accepts walk-ins during posted hours and charges approximately $40 to $60 per person. Quapaw Baths and Spa offers a more modern thermal pool experience for around $35."
  - question: "When is the best time to visit Hot Springs National Park?"
    answer: "Spring (March-May) is the most popular season for comfortable temperatures, wildflowers on the mountain trails, and the full operation of bathhouses and attractions. Fall (September-October) is the best window for hiking with fewer crowds and fall foliage. The park is open year-round; the springs flow at 143°F regardless of season."
  - question: "How old is Hot Springs National Park?"
    answer: "Congress first reserved the springs as federal property on April 20, 1832, making this the oldest protected federal land in the United States -- 40 years before Yellowstone. The area was redesignated Hot Springs National Park on March 4, 1921. The Fordyce Bathhouse museum tells the full history of the park and the spa era."
  - question: "Is there camping in Hot Springs National Park?"
    answer: "Yes. Gulpha Gorge Campground, located about 2 miles from downtown, has 44 sites with standard and electric hookup options at $26 to $30 per night. Reservations are through Recreation.gov. There is no backcountry camping in the park."

