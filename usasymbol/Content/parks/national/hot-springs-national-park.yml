seo_title: "Hot Springs National Park: Bathhouses, Hikes & Map"
seo_description: "Visit Hot Springs National Park in Arkansas: thermal baths on Bathhouse Row, free entry, hiking trails, and best time to go."
intro_text: "Hot Springs National Park in the Ouachita Mountains of central [Arkansas](/states/arkansas) protects 47 thermal springs flowing at 143°F and a landmark row of eight Gilded Age bathhouses along Central Avenue. Congress reserved the springs in 1832 -- 40 years before Yellowstone -- making this the first federally protected public land in the United States."

