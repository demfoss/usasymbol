sections:
  overview: |
    Hot Springs National Park occupies 5,554 acres in the Ouachita Mountains of central Arkansas, entirely surrounded by the city of Hot Springs. The park is built around two distinct elements: 47 geothermal springs that emerge from Hot Springs Mountain at a steady 143°F, and Bathhouse Row -- eight ornate buildings on Central Avenue constructed between 1892 and 1923, when Hot Springs was the most fashionable spa destination in the United States. The park extends beyond the downtown corridor into forested ridges with about 26 miles of hiking trails. Free to enter and ranking 17th of 63 national parks by visitation, it draws about 1.7 million visitors a year, most of them drawn first to the bathhouses and then to the mountain trails.

  known_for: |
    **Bathhouse Row** -- eight Beaux-Arts and Spanish Colonial Revival bathhouses lining Central Avenue, several open for tours or spa services; the Fordyce Bathhouse serves as the park visitor center and museum, preserving the original marble interiors and mechanical bathing equipment. **Thermal springs at 143°F** -- 47 springs flow from the western slope of Hot Springs Mountain year-round at a constant 143 degrees Fahrenheit, collected and piped to the bathhouses and to public jug fountains where visitors can fill containers with free thermal water. **First federally reserved public land** -- Congress set aside the springs in 1832 as Hot Springs Reservation, 40 years before Yellowstone and 44 years before the NPS itself, establishing the precedent for public ownership of natural wonders. **Sunset Trail** -- a 10-mile backcountry loop through the wooded ridges above the city, completely removed from the urban setting below.

  best_time_to_visit: |
    **Spring (March-May)** The most popular season. Temperatures range from 55 to 75 degrees Fahrenheit and the wooded trails bloom with dogwood, redbud, and wildflowers. The Bathhouse Row buildings and Grand Promenade are at their most visited from March onward. Spring weekends bring crowds to Central Avenue; weekday mornings offer a quieter experience.

    **Summer (June-August)** Hot and humid with highs reaching 90 to 95 degrees. The shaded forest trails on Hot Springs Mountain and West Mountain are cooler than downtown. The bathhouse interiors provide a respite from the heat, and the springs themselves stay at their constant 143°F regardless of season. Book Gulpha Gorge Campground in advance.

    **Fall (September-October)** The best hiking season. Temperatures cool to 55 to 75 degrees and the mixed hardwood forest on the mountain trails turns yellow and orange in October. Crowds ease from their summer peak while the weather remains comfortable.

    **Winter (November-February)** The quietest season. Temperatures average 35 to 55 degrees with occasional ice. The springs and bathhouses operate year-round. Gulpha Gorge Campground stays open. The lack of foliage on the trails opens long views across the Ouachita ridges.

  hiking: |
    **Easy** The Grand Promenade is a 0.5-mile paved walkway running behind Bathhouse Row along the base of Hot Springs Mountain, connecting the bathhouses to the mountain trail system. Interpretive signs explain the spring collection system and the cultural history of the baths. The walk is flat and accessible and serves as the main orientation route for first-time visitors.

    **Moderate** Hot Springs Mountain Trail climbs from behind Bathhouse Row to the summit area of Hot Springs Mountain, about 1.5 miles one way with 200 feet of elevation gain through oak and hickory forest. The summit holds an observation tower with views over the city and park. West Mountain Trail loops around West Mountain through dense second-growth forest with occasional views east toward downtown.

    **Strenuous** Sunset Trail is the park's main backcountry route, a 10-mile loop through the forested ridges southwest of the city. The trail crosses Sugarloaf Mountain, Music Mountain, and West Mountain, passing springs, rock outcrops, and segments of old service roads. The full loop requires 4 to 5 hours and significant elevation changes; day hikers often do shorter out-and-back sections. Dead Chief Trail provides a connecting shortcut through the Sunset Trail system.

  camping: |
    Gulpha Gorge Campground is the only campground in the park, located about 2 miles from downtown Hot Springs at the mouth of Gulpha Creek Gorge. The campground has 44 sites at elevations of about 650 feet; sites include both tent-only spots and those with electrical hookups. Sites with hookups cost $30 per night and standard sites cost $26 per night; reserve through Recreation.gov. The campground is open year-round and fills on spring and fall weekends. A short trail leads from the campground into the park's trail network. There is no backcountry camping within the park.

  fees_reservations: |
    Hot Springs National Park charges no entrance fee. Fordyce Bathhouse, which serves as the visitor center and museum, is free to enter. Buckstaff Bathhouse on Bathhouse Row still offers traditional thermal baths; a standard bath and steam cabinet costs approximately $40 to $60 per person, booked at the door during operating hours. Quapaw Baths and Spa, another restored bathhouse, offers thermal pool access and spa services for approximately $35 per person; check their schedule in advance. Gulpha Gorge Campground costs $26 to $30 per night depending on site type; reserve through Recreation.gov. The America the Beautiful annual pass does not provide a campsite discount at this park since there is no entrance fee. Confirm current bathhouse hours, fees, and campsite rates at nps.gov/hosp.

  getting_there: |
    **By car** The park's Central Avenue entrance is in downtown Hot Springs, accessible from U.S. Highway 70 and Arkansas Highway 7. From Little Rock, take I-30 west to Highway 70 west, then Highway 270 to Hot Springs -- about 55 miles and one hour. From Dallas, take I-30 east to Arkadelphia, then U.S. 67 north and Highway 270 east -- approximately 290 miles.

    **By air** Bill and Hillary Clinton National Airport (LIT) in Little Rock is about 55 miles northeast of the park. Rental cars are available at the airport; no direct public transit serves Hot Springs from Little Rock. Amtrak does not stop in Hot Springs.

  geology: |
    The Ouachita Mountains formed about 300 million years ago when ancient tectonic plates collided and folded layers of marine sediment -- primarily novaculite, sandstone, and shale -- into parallel east-west ridges. Novaculite, an extremely hard microcrystalline silica rock, caps many of the ridges and gives the local hills their sharp profiles. The Ouachitas are among the few east-west trending mountain ranges in North America, a product of the direction of the ancient collision.

    The thermal springs have nothing to do with volcanic activity. Rainwater falling on the ridge tops seeps through fractures in the rock and descends roughly 8,000 feet underground over the course of an estimated 4,400 years. At that depth, the normal geothermal gradient of the Earth's crust heats the water to over 200°F. The water then rises along fault zones, cooling slightly as it climbs, and emerges from the western face of Hot Springs Mountain at a constant 143°F.

    The springs produce about 850,000 gallons of thermal water per day. Most of the original spring outlets were capped and enclosed during Bathhouse Row's development; the water is piped through an underground collection system to the bathhouses and to a series of public jug fountains on the promenade. A display cascade on the Grand Promenade lets visitors see and touch free-flowing thermal water.

  wildlife: |
    White-tailed deer are the most visible large animal, frequently seen on the forest trails of Hot Springs Mountain and West Mountain in the early morning and at dusk. Wild turkeys forage in the wooded sections of the park year-round and are sometimes spotted near the Gulpha Gorge Campground. The mixed oak-hickory forest on the ridge trails supports a range of songbirds including wood thrushes, red-eyed vireos, and warblers, particularly active during spring migration in April and May.

    Barred owls call from the wooded stream corridors at night. Eastern box turtles cross the mountain trails in warm weather. Various native snake species, including the non-venomous rat snake and the venomous copperhead, inhabit the rocky slopes; watch your step when leaving the paved surfaces. The urban setting of the park limits large mammal diversity, but the forest patches on the upper ridges provide enough cover for a functioning woodland community within city limits.

  history: |
    Native peoples including the Caddo, Quapaw, and Osage knew and used the springs for at least several thousand years before European contact. The springs may have served as a neutral gathering place between groups that otherwise competed for territory in the region. Spanish explorer Hernando de Soto's expedition is traditionally credited with reaching the springs in 1541, though the exact route of his journey remains debated by historians.

    Congress passed legislation on April 20, 1832, setting aside the springs as a federal reservation -- the first time the United States government reserved natural land specifically for public benefit. For decades the Hot Springs Reservation was administered by Army officers who tried, with limited success, to prevent encroachment by bathhouse operators and souvenir vendors. A resort community grew steadily on the surrounding private land throughout the 19th century.

    The grand bathhouses on Central Avenue were built between the 1890s and 1920s as the town reached peak popularity as a health resort and gambling center. Babe Ruth and other major-league baseball players trained in Hot Springs each spring from the 1880s through the 1940s, using the baths for conditioning. Al Capone operated from his suite at the Arlington Hotel in the 1920s with minimal interference from local law enforcement. Congress redesignated the reservation as Hot Springs National Park on March 4, 1921. President Bill Clinton, who grew up in Hot Springs, cited the park as formative in his early interest in public lands.

  best_things_to_see_items:
    - name: "Fordyce Bathhouse"
      description: "The most elaborate building on Bathhouse Row, completed in 1915 with a stained-glass ceiling, marble fountains, and three floors of original mechanical bathing equipment. It now serves as the park visitor center and museum, with self-guided tours through the intact treatment rooms, steam cabinets, and rooftop gymnasium. Entry is free and no reservation is required."
      image: "https://www.nps.gov/hosp/planyourvisit/images/158B8139.jpg"
      alt: "The exquisite stained glass ceiling of mermaides swimming in a pond over a statue of a native american woman offering water to a traveling man"
      credit: "NPS Photo/Mitch Smtih"
    - name: "Bathhouse Row"
      description: "Eight historic bathhouses along a two-block stretch of Central Avenue, built between 1892 and 1923 in styles ranging from Spanish Colonial to Italian Renaissance. Several buildings have been adaptively reused -- one houses a brewery, another an art gallery -- while the Buckstaff and Quapaw still offer thermal bathing services. The entire row is a National Historic Landmark District."
      image: "https://www.nps.gov/common/uploads/structured_data/C11CC032-E6FC-33A3-A850BBC58A6DBD3C.jpg"
      alt: "A sky view of large bathhouse buildings"
      credit: "Mitch Smith"
    - name: "Buckstaff Bathhouse"
      description: "The only bathhouse on the row continuously operating since it opened in 1912. A standard visit includes a thermal mineral soak, a steam cabinet session, and a cooling-down rest period -- the same sequence guests experienced a century ago. No appointment is needed; walk-in service runs during posted hours. Fees are approximately $40 to $60 per person depending on services."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/B58D3CF5-91D1-E3C1-EF826D63C4E5010D.jpg?width=1600&quality=90&mode=crop"
      alt: "Buckstaff Bathhouse "
      credit: "NPS Photo/Mitch Smith"
    - name: "Thermal Springs and Jug Fountains"
      description: "Free-flowing hot spring water is available at jug fountains along the Grand Promenade and at the display cascade behind Fordyce Bathhouse, where visitors can touch and collect the 143°F water. The display cascade is the most accessible place to see open spring water flowing as it emerges from the mountainside. Bring a container -- collecting thermal water for personal use is permitted."
      image: "https://www.nps.gov/hosp/learn/nature/images/_DSC7249.jpg"
      alt: "A woman dipping her hand into the display spring behind Arlington Lawn"
      credit: "NPS Photo/Mitch Smith"
    - name: "Grand Promenade"
      description: "A 0.5-mile paved walkway behind Bathhouse Row connecting the buildings to the mountain trail system and running along the base of Hot Springs Mountain. Interpretive signs explain the spring collection infrastructure and the history of the spa era. The promenade is the natural starting point for the mountain trails and is pleasant in the early morning before Central Avenue fills with traffic."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/CB779C4E-F61A-3CDB-A25F4A1D3522EFE1.jpg?width=1300&quality=90&mode=crop"
      alt: "A man walks with his dog down a red brick path surrounded by bright green trees."
      credit: "NPS Photo/Mitch Smith"
    - name: "Sunset Trail"
      description: "A 10-mile backcountry loop through the wooded Ouachita ridges southwest of downtown, crossing Sugarloaf Mountain, Music Mountain, and West Mountain. The trail is a complete departure from the urban setting of Bathhouse Row -- quiet second-growth oak and hickory forest with rock outcrops and seasonal wildflowers. Trailheads are accessible from multiple points; the full loop takes 4 to 5 hours."
      image: "https://www.nps.gov/hosp/planyourvisit/images/_DSC9852.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp"
      alt: "The sun peeking out of trees on a mountain trail"
      credit: "NPS Photo/Mitch Smith"
    - name: "Hot Springs Mountain"
      description: "The forested ridge directly above Bathhouse Row, accessible by trail from the Grand Promenade. Hot Springs Mountain Trail climbs about 1.5 miles to the summit area where an observation tower offers elevated views over the city and surrounding Ouachita ridges. The mountain contains the collection tunnels and pipes that gather thermal water from the 47 springs before routing it downtown."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/BDAADDE9-AEAA-5E74-396708EBC5EB60B0.jpg?width=1300&quality=90&mode=crop"
      alt: "A white pagoda with a red roof sits on the edge of a hillside."
      credit: "NPS Photo/Mitch Smith"

