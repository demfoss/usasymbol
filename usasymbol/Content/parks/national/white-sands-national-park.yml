sections:
  overview: |
    White Sands National Park covers 146,344 acres of the Tularosa Basin in southern New Mexico, about 15 miles southwest of Alamogordo. The park protects the world's largest gypsum dune field, 275 square miles of white dunes that rise up to 60 feet above the desert floor. Ranked 34th in visitation among the 63 national parks, it draws roughly 782,000 visitors each year. Dunes Drive, an 8-mile paved road, connects five marked trails and ends near the backcountry camping area; the park occasionally closes for military missile tests on the surrounding White Sands Missile Range.

  known_for: |
    - **Largest gypsum dune field on Earth**: 275 square miles of pure white sand found nowhere else in the world
    - **Sledding**: the visitor center gift shop sells and rents plastic sleds for use on the dunes
    - **White-adapted wildlife** including the bleached earless lizard and Apache pocket mouse, both found almost nowhere else
    - **Trinity Site proximity**: the world's first nuclear bomb detonated 60 miles north on July 16, 1945, and is open to the public twice a year

  best_things_to_see_items:
    - name: "Alkali Flat Trail"
      description: "The park's most immersive route crosses 4.6 miles round-trip through the heart of the dune field toward the ancient lakebed of Lake Otero. Trail markers are orange posts; pay attention, as disorientation is common. Carry at least two liters of water per person."
      image: "/images/parks/national/white-sands-national-park/08-alkali-flat-trail.jpg"
      alt: "Alkali Flat Trail"
    - name: "Interdune Boardwalk"
      description: "A 0.4-mile paved loop accessible to wheelchairs and strollers winds through the low ground between dunes. Interpretive signs explain how plants and animals survive in the gypsum sand. Good option in summer heat because it stays shaded by dune walls."
      image: "/images/parks/national/white-sands-national-park/09-interdune-boardwalk.jpg"
      alt: "a plastic boardwalk with metal railings curves through the white sands dunes. A larger viewing area platform can be seen in the distance up a very gradual incline."
      credit: "NPS Photo, Dana Robbins"
    - name: "Sunset on Dunes Drive"
      description: "The 8-mile road ends at a small parking area facing the San Andres Mountains. At sunset, the white gypsum turns pink and gold against the dark silhouette of the mountains. The park stays open one hour past sunset on most evenings; check the daily schedule at the entrance."
      image: "/images/parks/national/white-sands-national-park/12-best-sunset-on-dunes-drive.jpg"
      alt: "Sunset Skies"
    - name: "Lake Lucero Tour"
      description: "A ranger-led tour (offered select weekends) drives 4 miles beyond the main road to the dry lakebed where gypsum crystals form. You can handle selenite crystals the size of your hand, the raw material for every dune in the park. Reservations open on recreation.gov several weeks in advance."
      image: "/images/parks/national/white-sands-national-park/10-lake-lucero-tour.jpg"
      alt: "A ranger presents a Lake Lucero tour to visitors."
    - name: "Dune Sledding"
      description: "Plastic sleds sold at the gift shop ($20-25) let visitors ride the north-facing dune faces, which are steepest. The best sledding slopes are accessible from Dune Life Nature Trail and the end of Dunes Drive. Wax the sled bottom for better speed."
      image: "/images/parks/national/white-sands-national-park/11-dune-sledding.jpg"
      alt: "A visitor sleds down a sand dune with their hands in the air."
    - name: "Backcountry Camping"
      description: "Ten primitive sites sit 0.5 to 2 miles into the dune field, accessible only on foot. At night the sky is dark enough to see the Milky Way clearly, and silence is total. Permits cost $3 per person per night through recreation.gov; no water or fire is available."
      image: "/images/parks/national/white-sands-national-park/13-best-backcountry-camping.jpg"
      alt: "Camping"

  best_time_to_visit: |
    **Fall (September-November)** is the most comfortable window. Daytime temperatures drop to the 70s and 80s F, nights cool to the 40s, and afternoon thunderstorms end by mid-September. Crowds thin after Labor Day. October and early November offer the best combination of mild air and low visitor numbers.

    **Spring (March-May)** runs a close second. Temperatures are similar to fall, but wind is stronger; gusts can reduce visibility and sand-blast exposed skin. Wildflowers appear in the interdune areas in April. Visit on weekdays to avoid spring-break crowds in March.

    **Summer (June-August)** brings dangerous heat, with daytime highs above 100 F on the dunes. Start any walk before 9 a.m. or after 4 p.m. The park draws its peak crowds on Independence Day week. Afternoon monsoon storms roll in fast from July onward and can drench the trail in minutes.

    **Winter (December-February)** is cold; nights dip below freezing and days reach the 50s to 60s F, but the dunes are almost empty and the white sand against a blue winter sky is striking. A dusting of rare snow on the gypsum is memorable. Some ranger programs pause until spring.

