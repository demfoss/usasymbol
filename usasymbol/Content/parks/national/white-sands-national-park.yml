  hiking: |
    **Easy trails** suit most visitors. The Interdune Boardwalk (0.4 miles, paved) is wheelchair accessible and explains the plant and insect life that survives in the gypsum. The Dune Life Nature Trail (1.0 mile, sandy) uses numbered posts to trace animal tracks and desert adaptations. Both work well in summer if you go before 9 a.m.

    **Moderate routes** cross more of the dune field. The Playa Trail (2.5 miles) ends at a dry lakebed where oryx and coyotes often feed early in the morning. The Backcountry Camping Loop (2.3 miles) follows the same orange-post marking system to the primitive sites. Carry water for any walk longer than the boardwalk; there are no water sources in the dunes.

    **Strenuous: Alkali Flat Trail** (4.6 miles) crosses the widest part of the dune field toward the ancient Lake Otero basin. The sand is soft, the sun is relentless, and the white landscape offers no landmarks; disorientation is the main hazard. Start before sunrise in summer. Bring a minimum of 2 liters of water per person and a hat.

  campgrounds:
    - name: "Backcountry Campground"
      sites: "10 primitive sites"
      season: "Year-round"
      reservations: "Required; recreation.gov, $3 per person per night"
      note: "Hike-in only, 0.5 to 2 miles from the trailhead. No water, no fire, no shade. Pack out all waste. Bring a headlamp; sites are unmarked at night."

  camping: |
    White Sands has one backcountry campground with 10 primitive sites scattered 0.5 to 2 miles into the dune field. Sites are hike-in only and have no water, fire rings, or shade structures. Permits cost $3 per person per night and must be reserved through recreation.gov; walk-in permits are not available. Campers must pack out all waste, including food scraps. Bring at minimum 3 liters of water per person for the night plus your hike in and out. The park has no frontcountry campground, and no lodging exists inside the park boundary. Alamogordo, 15 miles east, has hotels and an RV park with hookups.

