faq:
  - question: "Where is White Sands National Park?"
    answer: "White Sands is in southern New Mexico, about 15 miles southwest of Alamogordo on US-70. The nearest major airport is El Paso International (ELP), roughly 85 miles south."
  - question: "When is the best time to visit White Sands?"
    answer: "Fall (September through November) and spring (March through May) offer the most comfortable temperatures, from the 60s to 80s F. Summer highs exceed 100 F on the dunes; plan to be back at your car by 10 a.m. if you visit June through August."
  - question: "How much does it cost to get into White Sands?"
    answer: "Entry is $25 per vehicle for a 7-day pass. Individual visitors on foot or bicycle pay $15. The America the Beautiful Annual Pass ($80) covers entry to all federal fee sites for a year."
  - question: "Can you go sledding at White Sands?"
    answer: "Yes. Plastic sleds are sold at the visitor center gift shop for about $20 to $25. The steepest dune faces near the end of Dunes Drive are the most popular sledding spots. Waxing the sled bottom improves speed on the gypsum."
  - question: "Does the road to White Sands ever close?"
    answer: "Yes. US-70 passes through a White Sands Missile Range corridor and closes for missile testing, sometimes for two to four hours at a stretch. Check the missile range closure schedule at wsmr.army.mil before you travel."
  - question: "Is there camping inside White Sands National Park?"
    answer: "The park has 10 primitive backcountry campsites accessible only on foot. Permits cost $3 per person per night and must be reserved through recreation.gov. No water, fires, or shade structures are provided; bring at least 3 liters of water per person."
  - question: "What is the easiest trail at White Sands?"
    answer: "The Interdune Boardwalk is 0.4 miles, paved, and wheelchair accessible. It loops through the low area between dunes with interpretive signs about desert ecology. Most visitors can complete it in under 20 minutes."

