  fees_reservations: |
    Entry costs $25 per vehicle for a 7-day pass, $20 per motorcycle, and $15 per person on foot or bicycle. The $45 annual White Sands pass covers unlimited entries for one year. The $80 America the Beautiful pass covers all federal fee areas and pays for itself at two parks. Backcountry campers pay an additional $3 per person per night through recreation.gov; permits are required and no walk-ins are accepted. Lake Lucero ranger tours also book through recreation.gov and sell out weeks in advance. No reservations are required for day-use entry. Confirm current fees and rules at the official park page: nps.gov/whsa.

  getting_there: |
    **By car:** The park entrance is on US-70 West, 15 miles southwest of Alamogordo and 52 miles northeast of Las Cruces. From El Paso, take US-54 north to Alamogordo (about 80 miles), then US-70 west. Note that US-70 passes through the White Sands Missile Range corridor; the road closes for missile tests, sometimes for several hours. Check current closure status at wsmr.army.mil before you drive.

    **By air:** El Paso International Airport (ELP) is approximately 85 miles south and is the closest commercial airport with regular service. Albuquerque International Sunport (ABQ) is about 200 miles north. Car rental at ELP is strongly recommended; no public transit or shuttle connects the airport to the park.

  geology: |
    The Tularosa Basin is a closed basin with no outlet to the sea. Rain dissolves gypsum from the surrounding San Andres and Sacramento Mountains and carries it downslope into the basin floor. Thousands of years ago, a shallow lake called Lake Otero covered the southern basin. When the lake dried in a warming climate, the dissolved gypsum crystallized into transparent selenite sheets visible today at Lake Lucero.

    Wind breaks the selenite crystals into sand-sized grains. Those grains are lighter than quartz and blow easily, piling into crescent-shaped barchan dunes and long transverse ridges. The dunes migrate northeast at roughly 30 feet per year, slowly burying and then uncovering whatever lies in their path.

    Gypsum reflects rather than absorbs sunlight, which is why the sand does not heat up the way quartz desert does. Surface temperatures on white gypsum dunes stay significantly cooler than on typical desert sand, making barefoot walking possible well into the afternoon. The mineral also holds moisture better than quartz, which allows plants to take root and slow dune migration at the edges of the field.

    The park sits inside the White Sands Missile Range, one of the largest military installations in the United States. The geology of the basin, flat, remote, and enclosed, made it an ideal test site, a fact that shaped the park's modern history as much as its ancient lake.

  wildlife: |
    The bleached earless lizard is the park's signature animal, a subspecies that evolved white or pale gray coloring to match the gypsum sand. The Apache pocket mouse shows the same adaptation; its coat has lightened over thousands of generations. Both are found almost exclusively in the white sand ecosystem. Look for them on trail edges in late morning before heat forces them underground.

    Oryx, large African antelope introduced by New Mexico game managers in the 1970s, now roam the surrounding basin in herds of 10 to 30 and occasionally cross the dune field. Coyotes and roadrunners are seen frequently along Dunes Drive, especially in the hour after sunrise. Kit foxes are active at dusk and dawn near the backcountry campsites.

    Birdwatchers have recorded 239 species in and around the park. Migrating raptors, including ferruginous hawks and Swainson's hawks, concentrate in the basin during fall. The dry lakebed on the Playa Trail is productive for shorebirds after monsoon rains leave temporary puddles in August and September.

  history: |
    The Jornada Mogollon people occupied the Tularosa Basin for more than a thousand years before European contact, leaving campsites, hearths, and stone tools along the shores of ancient Lake Otero. The lake shrank and disappeared as the climate dried, but the dunes preserved organic material from their camps.

    Spanish colonizers crossed the basin in the 16th and 17th centuries along the Jornada del Muerto, Journey of the Dead Man, a waterless stretch of the Camino Real trade route. The name reflected the hazards of crossing the white flats in summer heat. Ranchers grazed cattle on the basin margins in the late 1800s.

    President Herbert Hoover proclaimed White Sands a national monument in January 1933 to protect the dune field from mining and development. The surrounding land was already being used for military purposes; the Army established what became White Sands Missile Range during World War II. On July 16, 1945, the first nuclear bomb was detonated at Trinity Site, 60 miles north of the park. The blast left a crater lined with trinitite, a glassy mineral formed when the explosion fused desert sand.

    Congress elevated White Sands from monument to national park in December 2019, the last national park designation of the 2010s. It joined 62 other national parks with 146,344 acres and remains the only national park to occasionally close for active missile testing.

