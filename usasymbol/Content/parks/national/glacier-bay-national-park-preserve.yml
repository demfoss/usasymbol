sections:
  overview: |
    Glacier Bay National Park & Preserve covers 3,283,168 acres in the Alaska Panhandle, about 75 miles west of Juneau, and contains one of the world's most dramatic examples of glacial retreat — a 65-mile fjord system that was completely choked with ice just 250 years ago. The park holds more than 1,000 glaciers, including a dozen active tidewater glaciers that calve icebergs directly into the sea. The gateway community of Gustavus has no road connection to the rest of Alaska; visitors arrive by small aircraft from Juneau or aboard cruise ships. The park drew about 60,000 land-based visitors in 2023, ranking 60th among the 63 national parks, though hundreds of thousands more pass through by cruise ship each year.

  known_for: |
    Active tidewater glaciers — particularly Margerie and Grand Pacific in Tarr Inlet — that calve building-sized icebergs into the bay with a sound like cannon fire, audible from a mile away.
    Humpback whales, which feed intensively in the bay's krill-rich waters through summer and are among the most reliably sighted large whales in Alaska.
    One of the fastest documented glacial retreats in scientific history: the bay's main glacier receded roughly 65 miles between 1750 and the present, transforming a solid ice sheet into open ocean in less than three centuries.
    Sea kayaking through a landscape shifting between floating icebergs, harbor seal haul-outs, and shorelines emerging from beneath glacial ice for the first time in living memory.

  best_things_to_see_items:
    - name: "Tidewater Glaciers — Margerie and Tarr Inlet"
      description: "Margerie Glacier at the head of Tarr Inlet is the most visited tidewater glacier in the park — a 21-mile-long river of ice that terminates in a 250-foot-tall face directly at sea level. Active calving produces icebergs from marble-sized fragments to house-sized blocks, often with a thunderclap report and a swell that rocks nearby vessels. The day boat tour from Bartlett Cove is the primary way to reach Tarr Inlet; kayakers and private boats can also approach. Johns Hopkins Glacier in the adjacent inlet is larger but access is restricted in early summer to protect harbor seal pupping."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/1F070B99-FE37-2012-50AFEBC295AE838F.jpg?width=1600&quality=90&mode=crop"
      alt: "Margerie Glacier can be seen flowing down from the Fairweather Mountains into Glacier Bay."
      credit: "NPS Photo"
    - name: "Day Boat Tour up the Bay"
      description: "The park concessioner operates daily boat tours from Bartlett Cove from late May through early September, traveling roughly 130 miles round trip up the bay and back in about eight hours. The tour is the only practical way for visitors without their own vessel or kayak to reach the upper bay glaciers in a single day. A park ranger narrates throughout, and humpback whales, sea otters, harbor seals, and mountain goats are commonly spotted along both arms of the bay. Tickets are purchased separately from park admission; book in advance through the park concessioner."
      image: "https://www.nps.gov/glba/learn/nature/images/Margerie-2021-350p.jpg?maxwidth=650&autorotate=false"
      alt: "Low resolution image of margerie glacier and tour boat"
    - name: "Sea Kayaking the West Arm"
      description: "Multi-day sea kayaking is the signature independent experience in Glacier Bay. The West Arm — covering Tarr Inlet, Johns Hopkins Inlet, and the surrounding coastline — offers tidewater glaciers, icebergs to navigate around, and beaches where brown bears forage at low tide. The park water taxi drops kayakers at points up to 65 miles up the bay and retrieves them on a scheduled day; rental kayaks are available at Bartlett Cove. Trips typically run 3 to 10 days. A free permit is required to camp in the backcountry; the park also holds a required kayaker orientation session before entry."
      image: "https://www.nps.gov/glba/planyourvisit/images/KayakinginGLBA.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp"
      alt: "Kayaking in Glacier Bay"
    - name: "Wildlife Watching from Shore and Boat"
      description: "Brown bears are a near-daily presence on the beaches and forest edges throughout Glacier Bay, particularly along the east arm and near Bartlett Cove. Bald eagles perch on snags throughout the park; tufted puffins and horned puffins nest on rocky headlands. Steller sea lions haul out on rocky points, and Dall's porpoise and harbor porpoise are frequently seen from the day boat. The combination of marine mammals, land mammals, and seabirds viewable from a single day on the water ranks among the most species-rich wildlife experiences in Southeast Alaska."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/F3BDB3C4-D938-9674-E4019492AFA4CC65.jpg?width=1600&quality=90&mode=crop"
      alt: "A humpback dives out of the water, ready to splash down again."
      credit: "Photo © Sean Neilson 2014"
    - name: "Bartlett Cove and Temperate Rainforest"
      description: "Bartlett Cove is park headquarters and the only developed area in Glacier Bay, located 10 miles north of Gustavus. The spruce and hemlock rainforest here began growing on bare glacial outwash less than 200 years ago — one of the most visually striking examples of primary succession accessible to visitors anywhere in North America. Two easy trails leave from Bartlett Cove, and the dock area is a reliable spot for bald eagle and sea otter sightings. Glacier Bay Lodge, the only in-park lodging, is located at Bartlett Cove."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/4C9CE31B-B9B4-EEE4-249A5156F1DD6488.jpg?width=1600&quality=90&mode=crop"
      alt: "A boulder on a rocky shore, pink sunset clouds overhead. Tall spruce trees flank the shore."
      credit: "NPS Photo"

