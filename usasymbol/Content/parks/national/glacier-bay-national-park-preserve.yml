seo_title: "Glacier Bay National Park: Glaciers, Map & Visitor Guide"
seo_description: "Visit Glacier Bay National Park in Alaska: tidewater glaciers, whale watching, kayaking, best time to visit, fees, and how to get there."
intro_text: "Glacier Bay National Park & Preserve in southeastern [Alaska](/states/alaska), established in 1980 and designated a UNESCO World Heritage Site in 1992, contains the world's largest assemblage of tidewater glaciers in a single protected area — 3,283,168 acres where a massive ice sheet has retreated 65 miles in roughly 250 years."

