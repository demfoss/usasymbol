faq:
  - question: "Where is Glacier Bay National Park?"
    answer: "Glacier Bay is in southeastern Alaska, about 75 miles west of Juneau on the Alaska Panhandle. The gateway community is Gustavus; Bartlett Cove, where park headquarters and the lodge are located, is 10 miles north of Gustavus. There are no roads connecting Gustavus to any other community in Alaska."
  - question: "How do you get to Glacier Bay National Park?"
    answer: "The standard route is a 30-minute flight from Juneau International Airport (JNU) to Gustavus Airport (GST); Alaska Airlines operates seasonal scheduled service and smaller regional carriers fly year-round. From Gustavus, a shuttle or taxi covers the 10 miles to Bartlett Cove. Cruise ship passengers see the bay from aboard their ship without stopping at Bartlett Cove."
  - question: "Is there an entrance fee for Glacier Bay?"
    answer: "No. Glacier Bay charges no entrance fee and the Bartlett Cove campground is free. The main paid activity is the day boat glacier tour, operated by the park concessioner at a separate fee — check current rates through Glacier Bay Lodge. Backcountry permits are also free."
  - question: "When is the best time to visit Glacier Bay?"
    answer: "July and August offer the best combination of stable weather, full concessioner services, and peak humpback whale activity. May and June are less crowded with equally active wildlife. September is quiet with excellent bear viewing. The day boat tour typically runs late May through early September; all services close by late September."
  - question: "Can you see glaciers at Glacier Bay?"
    answer: "Yes. The day boat tour from Bartlett Cove travels to active tidewater glaciers including Margerie Glacier in Tarr Inlet, where calving is frequent and visible from the boat. Kayakers can approach closer. The upper bay glaciers are roughly 65 miles from the bay's mouth and are not visible from Bartlett Cove itself."
  - question: "Is kayaking in Glacier Bay safe for beginners?"
    answer: "The lower bay near Bartlett Cove is accessible to paddlers with basic skills; the upper bay requires sea kayaking experience and cold-water safety training. Water temperatures are near freezing year-round, and conditions can change rapidly. A mandatory ranger orientation session is required before any overnight kayak trip. Rental kayaks and guided tours are available through the park concessioner."
  - question: "What wildlife can I see at Glacier Bay?"
    answer: "Humpback whales are the signature species and are seen on nearly every day boat tour in July and August. Harbor seals haul out on icebergs throughout the bay. Brown bears forage on beaches; bald eagles are common. Tufted puffins, mountain goats, sea otters, Steller sea lions, and Dall's porpoise are regularly sighted from boats."

