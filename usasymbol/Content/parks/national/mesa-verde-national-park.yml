  fees_reservations: |
    The 7-day vehicle pass costs $30 and covers all occupants of one private vehicle. Motorcycles pay $25 for the same 7-day window. Individuals arriving on foot or by bicycle pay $15 per person. The America the Beautiful Annual Pass is valid here for $80 and covers entrance to all national parks. Guided cliff dwelling tours at Cliff Palace and Balcony House require a separate $6 ticket per person per tour. In summer, Cliff Palace tour tickets frequently sell out; purchase through recreation.gov before arriving. Confirm current fees and rules at the official park page: nps.gov/meve.

