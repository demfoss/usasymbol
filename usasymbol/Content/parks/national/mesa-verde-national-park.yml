  camping: |
    Morefield Campground, 4 miles from the park entrance gate, is the only campground inside Mesa Verde. It has 267 sites covering tent pads, standard RV sites, and full hookup sites in Loop A. The campground opens in mid-April and closes in late October. Reservations are accepted through recreation.gov, and sites fill quickly in July and August; book at least two weeks ahead for summer visits. No backcountry camping is permitted anywhere within the park.

