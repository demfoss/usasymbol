  getting_there: |
    By car, the park entrance is on U.S. Highway 160, 9 miles east of Cortez and 36 miles west of Durango. From the entrance gate, the main road climbs 21 miles to the major sites on Chapin Mesa; Wetherill Mesa Road adds 12 more miles off that route. No park shuttle connects the entrance to the archaeological sites; a car is required. The nearest commercial airport is Durango–La Plata County Airport (DRO), about 35 miles east via U.S. 160. The closest major hub airport is Albuquerque International Sunport (ABQ), approximately 240 miles southeast via U.S. 64 and U.S. 550.

  geology: |
    Mesa Verde is a large cuesta, a flat-topped formation that tilts gently to the south. The mesa surface is capped by Cliff House Sandstone, a Cretaceous formation deposited by a shallow inland sea about 75 million years ago. Below it lies the dark Mancos Shale, which forms the valley floors visible from any canyon overlook. The two-layer structure is one of the clearest examples of sedimentary layering in the Southwest.

    The cliff alcoves that shelter the dwellings formed through slow water erosion within the sandstone. Rainwater seeps into vertical joints, freezes, and forces pieces of rock away from the cliff face over thousands of years. Most alcoves face south or southwest, which sheltered inhabitants from storms and provided passive solar warmth in winter.

    The mesa surface stands between 7,000 and 8,500 feet above sea level. Deep canyons cut by tributaries of the Mancos River divide the mesa into long fingers. The canyon walls expose hundreds of feet of layered rock and form the backdrop for most of the major cliff dwelling sites.

  wildlife: |
    Mule deer are common throughout the mesa and canyons, often seen along the park road at dawn and dusk. Wild turkeys move in flocks across open areas near Morefield Campground and along the mesa top. Both were important food sources for the Ancestral Pueblo people; today they are fully protected.

    Black bears use the park seasonally, and mountain lions are present but rarely sighted. Store food and scented items in a hard-sided container or designated bear box at all campgrounds. Abert's squirrels, recognizable by their tufted ears, are common in the ponderosa pine forest on the mesa top. Pinyon jays travel in loud flocks through the lower pinyon-juniper woodland.

    Raptors are visible year-round. Golden eagles and red-tailed hawks hunt above the canyons. Peregrine falcons have nested on some cliff faces within the park. Rattlesnakes and short-horned lizards are active on warm days from spring through early fall; watch the edges of trails.

  history: |
    The Ancestral Pueblo people first settled the Mesa Verde region around 550 CE. Early communities built pit houses on the mesa top and farmed corn, beans, and squash on the dry plateau. By 900 CE, above-ground masonry structures replaced pit houses as the population grew. The cliff dwellings most visitors see today were built during a concentrated period from about 1190 to 1300 CE, when communities shifted from the mesa top into alcoves cut into the canyon walls. By 1300 CE, the entire population had migrated south toward the Rio Grande valley and the Hopi mesas. A prolonged drought from 1276 to 1299 CE is among the factors documented in the archaeological record. Today, 27 Pueblo and Tribal nations trace their ancestry to the people who built here.

    Spanish explorers moved through the Four Corners region in the eighteenth century but left no detailed records of the ruins. In 1874, photographer William Henry Jackson documented the sites for the Hayden Survey, producing the first widely published images. Richard Wetherill and his brother-in-law Charlie Mason found Cliff Palace in December 1888 while searching for stray cattle. Over the following decade, the Wetherill family guided excavations and sold artifacts to collectors and museums. Virginia McClurg and Lucy Peabody led a campaign through the 1890s and early 1900s to stop looting and secure federal protection.

    President Theodore Roosevelt established Mesa Verde as a national park in 1906, the same year he signed the Antiquities Act. It was the first U.S. national park created specifically to protect human-made structures rather than natural features. The park was designated a UNESCO World Heritage Site in 1978.

