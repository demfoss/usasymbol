faq:
  - question: "Where is Mesa Verde National Park?"
    answer: "Mesa Verde is in southwestern Colorado, near the town of Cortez. The park entrance is on U.S. Highway 160, about 9 miles east of Cortez and 36 miles west of Durango."
  - question: "When is the best time to visit Mesa Verde?"
    answer: "Fall (September through early October) gives the best combination of mild temperatures and lighter crowds. Summer is the only season when all cliff dwelling tours run on full schedules, but July and August are the most crowded months and tour tickets sell out in advance."
  - question: "How much does it cost to enter Mesa Verde?"
    answer: "A 7-day vehicle pass costs $30. Motorcycles pay $25, and individuals arriving on foot or by bicycle pay $15. Guided tours of Cliff Palace and Balcony House require an additional $6 per person per tour."
  - question: "What is the most famous site at Mesa Verde?"
    answer: "Cliff Palace is the park's most visited structure, with 150 rooms and 23 kivas. It is the largest cliff dwelling in North America and is accessible only on a ranger-led tour. Tickets cost $6 and can be purchased at the visitor center or in advance through recreation.gov."
  - question: "Do you need reservations to see Cliff Palace?"
    answer: "Yes. Cliff Palace is accessible only on a ranger-led tour, and a $6 tour ticket is required. In summer, tickets frequently sell out days in advance through recreation.gov. Walk-up availability at the visitor center is limited."
  - question: "Can you bring pets to Mesa Verde?"
    answer: "Pets are not allowed on trails, in cliff dwellings, or in park buildings. They may remain in a vehicle or on a leash in campsite areas. High summer temperatures make leaving pets in parked vehicles dangerous."
  - question: "How long do you need at Mesa Verde?"
    answer: "One full day covers the main Chapin Mesa sites, including a Cliff Palace tour and a self-guided drive of the Mesa Top Loop Road. Two days allows time for Wetherill Mesa and Long House. Three days adds hiking on Prater Ridge or Petroglyph Point."

