sections:
  overview: |
    Mesa Verde sits on a series of high mesas in southwestern Colorado, 9 miles east of Cortez. The park holds more than 5,000 archaeological sites, including 600 cliff dwellings on Chapin Mesa, Wetherill Mesa, and the surrounding canyons. Cliff Palace, the largest cliff dwelling in North America, contains 150 rooms and 23 kivas and is accessible by guided tour only. Ranked 40th among the 63 national parks by visitation, Mesa Verde draws about 613,000 visitors per year, with peak traffic from June through August.

  known_for: |
    - Cliff Palace, with 150 rooms and 23 kivas, the largest cliff dwelling in North America
    - More than 600 cliff dwellings spanning Chapin Mesa, Wetherill Mesa, and their canyons
    - UNESCO World Heritage Site status, awarded in 1978, recognizing global cultural significance
    - Designated an International Dark Sky Park, with some of the least light-polluted skies in the Four Corners region

  best_things_to_see: |
    Cliff Palace draws the most visitors: a 150-room, 23-kiva dwelling accessible only on a ranger-led tour. Balcony House requires climbing a 32-foot ladder to reach 38 rooms tucked into a south-facing alcove. Long House on Wetherill Mesa is the second-largest dwelling in the park, with tours running through Labor Day. The Chapin Mesa Archeological Museum covers 1,400 years of occupation with original artifacts and is included with park admission. The Mesa Top Loop Road links 12 stops spanning pit houses from the 550s CE through mesa-top villages of the 1200s.

  best_things_to_see_items:
    - name: "Cliff Palace"
      description: "Cliff Palace is the largest cliff dwelling in North America, with 150 rooms and 23 kivas built into a massive sandstone alcove on Chapin Mesa. It was home to roughly 100 people at its peak around 1250 CE. Access is by ranger-led tour only; tickets are $6 per person and can be purchased at the visitor center or through recreation.gov."
      image: "/images/parks/national/mesa-verde-national-park/05-highlight-04.jpg"
      alt: "View of cliff dwelling from across canyon"
      credit: "NPS Photo"
    - name: "Balcony House"
      description: "Balcony House sits in a south-facing alcove on Chapin Mesa and holds 38 rooms. The guided tour requires climbing a 32-foot wooden ladder and crawling through a narrow exit tunnel, making it the most physically demanding tour in the park. Tickets are $6 per person; the tour runs from late April through late October."
      image: "/images/parks/national/mesa-verde-national-park/03-highlight-02.jpg"
      alt: "A cliff dwelling within a cliff alcove seen from across a canyon"
      credit: "NPS Photo"
    - name: "Chapin Mesa Archeological Museum"
      description: "The Chapin Mesa Archeological Museum, open year-round, covers 1,400 years of Ancestral Pueblo history through original pottery, tools, and architectural models. Admission is included with park entry. It is the best starting point for first-time visitors before heading to the cliff dwellings."
      image: "/images/parks/national/mesa-verde-national-park/03-chapin-mesa-archeological-museum.jpg"
      alt: "A paved path leads to a stone masonry museum building surrounded by yuccas and pinyon and juniper trees"
      credit: "NPS"
    - name: "Long House (Wetherill Mesa)"
      description: "Long House is the second-largest cliff dwelling in the park, with roughly 150 rooms spread across a wide alcove on Wetherill Mesa. Ranger-led tours run from early June through Labor Day; the trailhead is at the end of Wetherill Mesa Road, about 12 miles from the Chapin Mesa junction. Tickets are $6 per person."
      image: "/images/parks/national/mesa-verde-national-park/04-long-house.jpg"
      alt: "View of Long House"
      credit: "NPS / Cade Valcarce"
    - name: "Petroglyph Point"
      description: "A large panel of Ancestral Pueblo rock carvings marks a canyon wall near the end of the Petroglyph Point Trail on Chapin Mesa. The 2.8-mile round trip hike descends into the canyon before climbing back to the mesa top. The panel is the most accessible example of Ancestral Pueblo rock art in the park."
      image: "/images/parks/national/mesa-verde-national-park/05-petroglyph-point-panel.jpg"
      alt: "Sandstone panel of numerous petroglyphs etched into the stone."
      credit: "NPS"
    - name: "Mesa Top Loop Road"
      description: "The Mesa Top Loop Road is a 6-mile self-guided drive on Chapin Mesa with 12 marked stops covering 700 years of occupation history. Stops include pit houses from the 550s CE, the Square Tower House overlook, and several mesa-top masonry villages. The drive takes about 90 minutes with stops."
      image: "/images/parks/national/mesa-verde-national-park/06-mesa-top-loop-road.jpg"
      alt: "Four images that include housing styles from stone-masonry villages to wood and mud roofed shelters"
    - name: "Far View Sites Complex"
      description: "Far View Sites Complex, on the mesa top near the Chapin Mesa junction, includes five separate masonry villages occupied between roughly 900 and 1300 CE. The sites were among the largest communities in the region at their peak. A self-guided trail connects all five sites in under a mile."
      image: "/images/parks/national/mesa-verde-national-park/07-far-view-sites.jpg"
      alt: "Three people reading interpretive sign in from of a low, ancient, stone-masonry room walls."
      credit: "NPS Photo"

  best_time_to_visit: |
    **Spring (April–May):** Cliff Palace and Balcony House tours reopen in mid-April. Daytime highs range from 50 to 70°F and crowds are thin. Snow can linger on higher roads into May. Spring is the best window for guided tours without advance booking pressure.

    **Summer (June–August):** All facilities and tours run on full schedules, but this is the busiest season. Daytime highs climb to the mid-80s°F on the mesa top. Tour tickets for Cliff Palace and Balcony House sell out days in advance; book through recreation.gov before arriving.

    **Fall (September–October):** The most comfortable combination of weather and manageable crowds. Highs drop to 60–75°F after Labor Day, tour tickets are available with less advance planning, and the ponderosa pines show yellow in late October. Morefield Campground typically closes by the end of October.

    **Winter (November–March):** Morefield Campground is closed and most cliff dwelling tours are suspended. The Chapin Mesa Archeological Museum stays open and the rim roads are accessible on clear days. Snowshoeing is possible after significant snowfall. Highs average in the 30s to 40s°F, and the mesa is nearly empty.

  hiking: |
    **Easy:** The Knife Edge Trail runs 1.7 miles one-way from Morefield Campground to the park boundary, following an old road with open views over Montezuma Valley. No permit is required. The Soda Canyon Overlook Trail is a 1.5-mile round trip from the Chapin Mesa road; it ends at a canyon rim where Balcony House is visible in the alcove below.

    **Moderate:** Petroglyph Point Trail is a 2.8-mile round trip loop from Chapin Mesa that descends to a canyon wall passing a large panel of Ancestral Pueblo rock carvings before climbing back to the mesa top. Register at the trailhead kiosk before starting. Spruce Canyon Trail is a 2.1-mile round trip that drops into the canyon below the mesa; the descent is steep in places, and no water is available on the trail.

    **Strenuous:** Prater Ridge Trail is a 7.8-mile loop starting at Morefield Campground. The route climbs about 1,000 feet to the highest ridge on the park's north end, where views stretch across the full mesa system. Shade is limited in summer; carry at least 2 liters of water.

