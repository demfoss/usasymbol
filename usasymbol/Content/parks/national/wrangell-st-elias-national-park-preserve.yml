faq:
  - question: "Where is Wrangell-St. Elias National Park?"
    answer: "Wrangell-St. Elias is in southeastern Alaska, roughly 200 miles east of Anchorage. The main visitor area near McCarthy and Kennecott is reached via the 61-mile unpaved McCarthy Road, which begins near Chitina off AK-1."
  - question: "How big is Wrangell-St. Elias?"
    answer: "The park covers 13,175,901 acres, the largest national park in the United States, about six times the size of Yellowstone. It is larger than the entire country of Switzerland."
  - question: "Is there an entrance fee for Wrangell-St. Elias?"
    answer: "No. Entry to the park is free. Camping in the backcountry and at Kendesnii Campground is also free. Kennecott Mines tours run through a private concessionaire and cost approximately $20 to $28 per person."
  - question: "When is the best time to visit Wrangell-St. Elias?"
    answer: "June through August is the only season when the McCarthy Road is reliably open and all services are running. July offers the longest daylight and the most stable weather, though mosquitoes are heavy. September is the best month for fall color and moose watching with far fewer visitors."
  - question: "Can you drive to Kennecott?"
    answer: "No. The McCarthy Road ends at a footbridge over the Kennicott River. Visitors park on the west bank, cross on foot, and either walk 0.5 miles to McCarthy or take a shuttle van. From McCarthy, it is another 5 miles by shuttle or on foot to reach Kennecott."
  - question: "Do you need a permit to hike or camp in the backcountry?"
    answer: "No permits are required for backcountry hiking or camping anywhere in the park. The visitor center strongly recommends registering your itinerary before a multi-day trip. Bear-resistant food canisters are required in some zones; check current regulations at nps.gov/wrst."
  - question: "What is Kennecott?"
    answer: "Kennecott is a National Historic Landmark, a copper mining town built by the Kennecott Copper Corporation that operated from 1903 to 1938. The mill buildings, bunkhouses, and equipment were abandoned intact when the ore ran out. Guided tours of the mill run in summer through a private concessionaire."

