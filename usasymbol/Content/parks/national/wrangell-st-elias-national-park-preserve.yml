sections:
  overview: |
    Wrangell-St. Elias National Park & Preserve covers 13,175,901 acres of southeastern Alaska, larger than the combined area of Yellowstone, Yosemite, and the country of Switzerland. The park spans four mountain ranges and holds nine of the sixteen highest peaks in the United States, including 18,008-foot Mount St. Elias, the second-tallest summit in the country. Glaciers cover roughly a third of the park, including the Nabesna Glacier, the longest valley glacier in North America at about 80 miles. Entry is free, and with only about 79,000 visitors in 2023, it is one of the least visited national parks despite its extraordinary scale.

  known_for: |
    - **Largest national park in the United States** at 13.2 million acres, six times the size of Yellowstone
    - **Kennecott Mines National Historic Landmark**, a copper boomtown that operated from 1903 to 1938 and produced over $200 million in ore, now a remarkably preserved ghost town accessible by unpaved road
    - **Nine of the sixteen highest peaks in the US**, including 18,008-foot Mount St. Elias and 16,390-foot Mount Blackburn
    - **Nabesna Glacier**, the longest valley glacier in North America at roughly 80 miles, and the Bering Glacier, the largest glacier in North America by area

  best_time_to_visit: |
    **Summer (June-August)** is the only fully accessible season. The McCarthy and Nabesna Roads are drivable, the Kennecott Mines are open for tours, and most air taxi operators run flightseeing trips daily. Temperatures in McCarthy average 55 to 70 F. Expect some rain, and mosquitoes are heavy in June and July. Book lodging and flightseeing well in advance; the town of McCarthy has very limited capacity.

    **Spring (May)** opens the roads after mud season, but snow lingers on trails above 4,000 feet into mid-May. Bears emerge from dens in April and May and are active across the valley. Some businesses in McCarthy open by Memorial Day weekend. The light is exceptional at this time of year, with near-continuous daylight.

    **Fall (September-October)** brings fall color across the tundra, cooler temperatures, and far fewer visitors than summer. Moose rutting peaks in September. Hunting season draws visitors to the preserve sections. Most McCarthy businesses close after the first week of October, and road conditions can deteriorate quickly with early snow.

    **Winter (November-April)** sees the park nearly shut to casual visitors. The McCarthy Road becomes impassable after freeze-up in late October. Temperatures drop well below zero F. A small number of winter travelers access the area by ski plane or snowmachine, but logistics require serious planning and local knowledge.

  hiking_trails:
    - name: "Root Glacier Trail"
      difficulty: "Easy to Moderate"
      distance: "4 miles roundtrip"
      elevation: "300 ft gain"
      note: "The most accessible glacier walk in the park. Starts at Kennecott, crosses a moraine, and reaches the edge of Root Glacier. Ice crampons available to rent in Kennecott for travel on the glacier surface."
    - name: "Erie Mine Trail"
      difficulty: "Moderate"
      distance: "3.2 miles roundtrip"
      elevation: "800 ft gain"
      note: "Climbs through forest and meadow above Kennecott to a historic mine site with views of the valley. Often combined with the Root Glacier Trail into a full day."
    - name: "Bonanza Mine Trail"
      difficulty: "Strenuous"
      distance: "8.4 miles roundtrip"
      elevation: "3,800 ft gain"
      note: "The park's signature day hike climbs from Kennecott to the highest mine workings at about 6,000 feet. Views of the Wrangell Mountains and Root Glacier from the top are exceptional. Allow 6 to 8 hours."
    - name: "Nabesna Road Pullouts"
      difficulty: "Easy"
      distance: "Varies"
      elevation: "Minimal"
      note: "The 42-mile Nabesna Road offers informal walking from pullouts into tundra and river bars. No marked trails; route-finding in open terrain. Good for birdwatching and wildlife."
    - name: "Backcountry Off-Trail Travel"
      difficulty: "Strenuous"
      distance: "Varies"
      elevation: "Varies"
      note: "Most of the park has no trails. Experienced backcountry travelers navigate by topographic map and compass across tundra, river valleys, and glaciers. No permits required, but register an itinerary with the visitor center before departure."

  hiking: |
    **Easy to moderate** hiking centers on the Kennecott area. The Root Glacier Trail (4 miles roundtrip, 300 ft gain) is the most popular route; it crosses a rocky moraine and reaches the edge of Root Glacier, where visitors can rent crampons in Kennecott to walk on the ice surface. The Erie Mine Trail (3.2 miles roundtrip, 800 ft gain) climbs to a historic mine platform with wide valley views and is often combined with the glacier walk into a full day.

    **Strenuous: Bonanza Mine Trail** (8.4 miles roundtrip, 3,800 ft gain) is the park's best single-day hike. It climbs from Kennecott through spruce forest and alpine meadow to the mine workings at roughly 6,000 feet, with unobstructed views of the Wrangell Mountains and Root Glacier. Allow 6 to 8 hours and start early. The upper half of the trail holds snow into early July.

    **Backcountry off-trail travel** defines the park's character beyond the Kennecott corridor. Most of the 13.2 million acres has no marked trails; experienced hikers navigate by topographic map across open tundra, river bars, and glacier margins. No backcountry permits are required, but the visitor center strongly recommends registering an itinerary before departure. Bears are active throughout the park; carry bear spray and practice proper food storage. River crossings require judgment about water level and current; many park rivers run glacial and cold even in summer.

  campgrounds:
    - name: "Kendesnii Campground"
      sites: "10"
      season: "Late May-early September"
      reservations: "First-come, first-served"
      note: "Located at mile 27.8 on Nabesna Road. Vault toilet, fire rings, bear boxes. Free. No water; bring your own or treat from the creek."
    - name: "Backcountry Camping"
      sites: 0
      season: "Year-round"
      reservations: "None required"
      note: "Camping is permitted anywhere in the park on public land. No permits needed. Store food in bear canisters; hang bags are unreliable in this terrain. Register your itinerary at the visitor center."

  camping: |
    Kendesnii Campground on Nabesna Road is the park's only developed campground, with 10 sites with vault toilets, fire rings, and bear boxes, free and first-come. No treated water is available; bring your own or filter from the creek. The campground sits at mile 27.8 of Nabesna Road and is accessible by most vehicles when the road is dry.

    Backcountry camping is permitted anywhere on park land with no permit and no fee. Most visitors staying near McCarthy use private lodges or camp on private land with permission; there is no NPS campground in that area. Bear-proof food storage is essential throughout the park; canisters are recommended because hanging is impractical on the open tundra. Leave no trace principles apply strictly in a park with almost no infrastructure.

  fees_reservations: |
    Wrangell-St. Elias has no entrance fee. Camping in the backcountry and at Kendesnii Campground is free. No backcountry permits are required. Kennecott Mines tours run through a private concessionaire and cost approximately $20 to $28 per person depending on the tour; reserve directly through the Kennecott Visitor Center or by phone. Flightseeing tours from local air taxi operators are not managed by NPS and range from $150 to $400 or more per person depending on route length. Confirm current fees and rules at the official park page: nps.gov/wrst.

  getting_there: |
    **By car (McCarthy Road):** The main visitor corridor starts at the Edgerton Highway junction near Chitina, about 66 miles from Glennallen on AK-1. The McCarthy Road runs 61 miles east to the edge of the Kennicott River, where visitors park and cross a footbridge to reach McCarthy (about 0.5 miles) and then take a shuttle van or walk 5 miles to Kennecott. The road is unpaved with sharp rocks; most rental agreements prohibit use of standard vehicles on it; check before you drive. Spare tires are essential.

    **By car (Nabesna Road):** From Slana on AK-1 (about 65 miles from Glennallen), the 42-mile Nabesna Road enters the northern park. The first 29 miles are manageable by most high-clearance vehicles in dry conditions; beyond that, 4WD is recommended. The road ends at Nabesna, a private inholding with a small airstrip.

    **By air:** Anchorage (ANC) is approximately 250 miles west and is the practical hub for most visitors. Fairbanks International (FAI) is about 300 miles north. Rental cars at both airports are required to reach the park. Small air taxi operators in Chitina, McCarthy, and Gulkana offer charter flights into remote park airstrips.

  geology: |
    Wrangell-St. Elias formed where the Pacific tectonic plate has been grinding into and under the North American plate for tens of millions of years. The collision pushed up the Wrangell, St. Elias, Alaska, and Chugach mountain ranges, four separate ranges whose peaks overlap inside the park's boundaries. The process is still active; earthquakes are frequent and measurable throughout the region.

    The Wrangell Mountains are a volcanic field, not a folded range. Mount Wrangell (14,163 ft) is the largest active shield volcano in North America by volume, and fumaroles vent steam from its summit year-round. The volcanic rock gives the Wrangell peaks a darker, more rounded profile than the sharp glaciated peaks of the St. Elias Range to the south.

    Glaciers cover roughly a third of the park, about 4.5 million acres of ice. The Nabesna Glacier runs approximately 80 miles from its accumulation zone near the St. Elias Range down to its terminus near the Nabesna Road, making it the longest valley glacier in North America. The Bering Glacier and Bagley Icefield complex, on the park's southern edge, covers more total area than any glacier system outside Greenland and Antarctica.

    The copper deposits at Kennecott formed when volcanic fluids percolated through faults in the sedimentary limestone, depositing extraordinarily high-grade ore; some samples ran 70 percent pure copper, among the richest ever mined.

  wildlife: |
    Dall sheep are visible on rocky slopes throughout the park and are particularly easy to spot on the hillsides above the Nabesna Road. Grizzly bears are common across the park; black bears are less frequent but present in forested lower elevations. Both species are active from late April through October. Moose concentrate in the willow thickets along river valleys and are most often seen from the McCarthy and Nabesna Roads.

    Caribou migrate through the northern sections of the park in herds of several hundred animals, typically in September and October. Wolves travel in packs across the tundra and are sometimes spotted from the Nabesna Road early in the morning. Mountain goats cling to the steep rock faces near Kennecott and are visible with binoculars from town. Bison, reintroduced from Yellowstone stock in the 1950s, roam the Copper River Basin near the park's western boundary.

    The park lists over 200 bird species. Trumpeter swans nest on lowland ponds and river oxbows. Golden eagles hunt tundra slopes throughout summer. Ptarmigan are found above treeline and are one of the most reliably spotted birds in the alpine zones. Fishing for salmon and Arctic grayling is productive in the Copper River drainage and many park tributaries.

  history: |
    The Ahtna Athabascan people have lived in the Copper River basin for thousands of years, using the river system for salmon fishing and maintaining trade routes through the mountain passes. The Eyak people occupied the coastal zone on the park's southern edge. Both groups left fish camps, hunting sites, and oral traditions describing the land before any written records.

    Russian fur traders reached the coast in the late 1700s, but the interior remained largely unknown to outsiders until the late 1800s gold rush drew prospectors inland. Army Lieutenant Henry Allen made the first recorded traverse of the Copper River in 1885, mapping the interior for the U.S. military. Copper prospectors found extraordinarily rich ore veins near the Kennicott Glacier in 1900. By 1903, the Kennecott Copper Corporation had begun construction of a mill town, connected to Cordova on the coast by 196 miles of railroad.

    The Kennecott mines operated from 1903 to 1938, extracting more than $200 million worth of copper ore, roughly $4 billion in today's dollars. When the ore ran out, the company shut the operation and left overnight, abandoning the mill buildings, equipment, and bunkhouses exactly as they stood. The National Historic Landmark designation in 1978 protected the remaining structures from salvage.

    Congress established Wrangell-St. Elias as a national park and preserve in December 1980 under the Alaska National Interest Lands Conservation Act, the largest single act of land conservation in U.S. history. The act created or expanded ten national parks in Alaska and designated 104 million acres of public land.

  best_things_to_see_items:
    - name: "Kennecott Mines National Historic Landmark"
      description: "The red mill buildings of the Kennecott Mines rise five stories above the glacier moraine and remain almost exactly as they were when the last worker walked out in 1938. Guided tours run inside the mill building from late May through early September. Walk the exterior for free at any time."
      image: "/images/parks/national/wrangell-st-elias-national-park-preserve/03-highlight-02.jpg"
      alt: "Historic, large, red buildings with mountains in the background"
      credit: "NPS Photo/ Matthew Yarbrough"
    - name: "Root Glacier Walk"
      description: "A 4-mile roundtrip trail from Kennecott leads to the edge of Root Glacier, where visitors can rent crampons and walk on the glacier surface with a guide or independently. The ice is active; crevasses open and close seasonally, so travel beyond the moraine edge requires care and proper footwear."
      image: "/images/parks/national/wrangell-st-elias-national-park-preserve/04-highlight-03.jpg"
      alt: "A large glacier with stripes of different colored rock nestled in between barren mountain slopes."
      credit: "NPS Photo/ Bryan Petrtyl"
    - name: "Bonanza Mine Trail"
      description: "The park's premier day hike climbs 3,800 feet over 4.2 miles from Kennecott to the Bonanza Mine workings at roughly 6,000 feet. Views from the top take in Root Glacier, the Wrangell Mountains, and the full McCarthy Valley. Allow 6 to 8 hours and start by 7 a.m."
      image: "/images/parks/national/wrangell-st-elias-national-park-preserve/02-highlight-01.jpg"
      alt: "Two backpackers sitting in an alpine meadow with snowy mountains in the background"
      credit: "NPS Photo/ Bryan Petrtyl"
    - name: "Flightseeing"
      description: "Air taxi operators in McCarthy and Chitina offer flightseeing tours ranging from 30-minute glacier overflights to full-day landings on remote glaciers. A one-hour flight covers the scale of the icefield and the summit ring of Mount St. Elias in ways no road trip can match. Book at least one month in advance in summer."
      image: "/images/parks/national/wrangell-st-elias-national-park-preserve/05-highlight-04.jpg"
      alt: "Four large snow covered mountains rise above dense forest into blue skies."
      credit: "NPS Photo/ Bryan Petrtyl"
    - name: "Nabesna Road Drive"
      description: "The 42-mile unpaved Nabesna Road enters the northern park from the village of Slana and passes through spruce forest, open tundra, and river crossings with views of the Wrangell volcanoes. Interpretive pullouts and informal trail access make it a practical wildlife-watching corridor. Dall sheep are often visible on the slopes above mile 20."
      image: "/images/parks/national/wrangell-st-elias-national-park-preserve/02-highlight-01.jpg"
      alt: "Two backpackers sitting in an alpine meadow with snowy mountains in the background"
      credit: "NPS Photo/ Bryan Petrtyl"

