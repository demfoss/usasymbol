seo_description: "Visit Great Smoky Mountains National Park in Tennessee and North Carolina: free entry, top hikes, Cades Cove, and best time to go."
intro_text: "Great Smoky Mountains National Park straddles the Tennessee-[North Carolina](/states/north-carolina) border and is the most visited national park in the United States, drawing about 13.3 million visitors in 2023. Free to enter and established in 1934, the park protects 522,427 acres of ancient Appalachian forest, more than 800 miles of trails, and one of the most biodiverse temperate landscapes on Earth."

