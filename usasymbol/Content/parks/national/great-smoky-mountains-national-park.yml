faq:
  - question: "Is there an entrance fee for Great Smoky Mountains National Park?"
    answer: "No. Great Smoky Mountains is one of the few national parks in the United States with no entrance fee. Congress set this condition in the original 1926 authorization because state and private funds -- not federal money -- paid for the land. The America the Beautiful pass is not needed for entry."
  - question: "Where is Great Smoky Mountains National Park?"
    answer: "The park straddles the border of Tennessee and North Carolina in the southern Appalachian Mountains. The main Tennessee entrance is through Gatlinburg, about 45 miles southeast of Knoxville. The North Carolina entrance is at Cherokee, about 65 miles west of Asheville."
  - question: "When is the best time to visit Great Smoky Mountains National Park?"
    answer: "Spring (March-May) is best for wildflowers and waterfalls with manageable crowds. Fall (October) offers peak foliage but the heaviest traffic of the year. Summer is the busiest overall. Winter is the least crowded, with good elk viewing in Cataloochee Valley."
  - question: "What is the best hike in Great Smoky Mountains National Park?"
    answer: "For a first visit, Alum Cave Trail (4.4 miles round trip, 1,200 ft gain) gives the best combination of varied scenery and manageable effort. Laurel Falls is the easiest popular waterfall hike at 2.6 miles round trip. For a full day, Ramsey Cascades (8 miles, 2,200 ft) leads through old-growth forest to the park's tallest waterfall."
  - question: "When is the synchronous firefly event at Great Smoky Mountains?"
    answer: "Photinus carolinus fireflies near Elkmont typically synchronize their flashes for about two weeks in late May or early June, with exact dates announced each spring. The NPS runs a ticketed shuttle-bus lottery to control parking; apply through Recreation.gov when the lottery opens. The display peaks around 10 p.m. on warm, dark nights."
  - question: "Are there bears in Great Smoky Mountains National Park?"
    answer: "Yes. The park is home to an estimated 1,500 or more black bears -- roughly one bear per 350 acres. Bears are often seen in Cades Cove and along the Roaring Fork Motor Nature Trail. Keep 50 yards of distance, never feed or approach them, and store all food in bear-proof containers or hang bags when camping."
  - question: "Do I need reservations to visit Great Smoky Mountains?"
    answer: "No reservation is required to enter or hike the park. Developed campgrounds at Elkmont, Cades Cove, and Smokemont require reservations through Recreation.gov and fill months ahead for summer and fall weekends. Cosby and Deep Creek campgrounds are first-come, first-served. Backcountry campers need an online permit at $8 per person per night."

