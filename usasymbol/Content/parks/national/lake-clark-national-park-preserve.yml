intro_text: "Lake Clark National Park and Preserve protects 2,619,733 acres of southwest Alaska where the Alaska Range meets the Aleutian Range in the glacier-covered Chigmit Mountains. Two active volcanoes rise over tundra valleys, sockeye salmon crowd five river systems each summer, and brown bears gather on the Cook Inlet coast in concentrations rare anywhere in the world. The park has no road access; the only way in is by small aircraft or, along the southern coast, by boat. About 12,000 visitors arrived in 2023, and Dena'ina Athabascan communities have relied on the land for thousands of years under federally recognized subsistence rights."

