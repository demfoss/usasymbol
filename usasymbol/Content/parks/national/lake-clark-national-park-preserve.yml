faq:
  - question: "Where is Lake Clark National Park?"
    answer: "Lake Clark is in southwest Alaska, roughly 150 air miles southwest of Anchorage across Cook Inlet. The nearest village is Port Alsworth, population around 150, which has the park's field headquarters. The nearest major airport is Ted Stevens Anchorage International (ANC). There are no roads to the park; every visit requires a flight by small aircraft or, for the coastal areas, a boat crossing."
  - question: "How do you get to Lake Clark National Park?"
    answer: "By floatplane or bush plane from Anchorage, Kenai, or Homer; there is no road access to any part of the park. Air taxi operators based at Lake Hood Seaplane Base in Anchorage fly to Port Alsworth and interior lakes in about 45 to 60 minutes. Coastal bear-viewing sites on the Cook Inlet side are reachable by water taxi from Homer in about 30 minutes by air. Book air taxis months in advance for July and August travel."
  - question: "What is Lake Clark National Park known for?"
    answer: "Lake Clark is best known for coastal brown bear viewing at Silver Salmon Creek and Chinitna Bay, where bears graze sedge flats and fish for salmon. The park is also known for world-class sockeye salmon fishing, two active volcanoes (Redoubt and Iliamna), glaciated peaks in the Chigmit Mountains, and Richard Proenneke's historic hand-built cabin at Twin Lakes. Its fly-in-only access keeps annual visitation around 12,000."
  - question: "When is the best time to visit Lake Clark?"
    answer: "July through August is the best window: salmon runs peak, brown bears are most active on the coast and rivers, days are long, and all lodges and guides are operating. Late May and June offer excellent coastal bear viewing before salmon arrive and fewer visitors. September has dramatic fall color and continued bear activity through the coho run but weather becomes unreliable and most lodges close by mid-September."
  - question: "How much does it cost to visit Lake Clark?"
    answer: "The park charges no entrance fee. The primary costs are air taxi flights, typically $400 to $700 per person round trip from Anchorage to interior destinations, and guide or lodge fees for bear-viewing or fishing trips. A sport fishing license from the Alaska Department of Fish and Game is required for any fishing in the park. The America the Beautiful Annual Pass ($80) is not needed here but covers entrance at all other national parks."
  - question: "Are there hiking trails in Lake Clark?"
    answer: "Very few maintained trails exist. The Tanalian Falls Trail (about 2 miles one-way from Port Alsworth) and the strenuous Tanalian Mountain route (about 5 miles one-way, 3,400 feet of gain) are the main marked options. Coastal bear-viewing areas offer flat walks on beach and sedge flats. Almost all other hiking is off-trail on open tundra, river gravel bars, and boreal forest; topographic map and bear spray are essential."
  - question: "Is it safe to view bears at Lake Clark?"
    answer: "Yes, when done with a licensed guide following established safety protocols. Silver Salmon Creek and Chinitna Bay are specifically managed for close-range bear encounters; guides enforce strict distance and behavior rules that keep both visitors and bears safe. Solo hiking in active bear areas is not recommended. All visitors should carry bear spray, know how to use it, and review NPS bear safety guidelines before any outing in the park."

  - question: What state is Lake Clark National Park & Preserve in?
    answer: Lake Clark National Park & Preserve is in [Alaska](/states/alaska), near Port Alsworth, Alaska.
