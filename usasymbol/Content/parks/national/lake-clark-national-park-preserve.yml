sections:
  overview: |
    Lake Clark National Park and Preserve covers 2,619,733 acres of southwest Alaska, roughly 150 miles southwest of Anchorage across Cook Inlet. The park spans three distinct ecosystems in close proximity: tidal flats and sedge meadows along the Cook Inlet coast, boreal forest and river corridors in the interior lowlands, and the glaciated Chigmit Mountains, where the Alaska Range meets the Aleutian Range, rising to active volcanoes above 10,000 feet. No road reaches the park; visitors arrive by floatplane or bush plane to interior lakes and airstrips, or by boat and small aircraft to the Cook Inlet coastline. With roughly 12,000 visitors in 2023, Lake Clark is among the least-visited of the 63 national parks, a function of fly-in-only access that keeps the landscape intact and wildlife populations healthy.

  known_for: |
    Brown bear viewing along the Cook Inlet coast, particularly at Silver Salmon Creek and Chinitna Bay, where bears congregate in summer to graze sedge grass and later feed on returning sockeye salmon, making this some of the most accessible wild brown bear habitat in North America.
    Five species of Pacific salmon use the park's rivers every summer: sockeye, king, coho, chum, and pink run the Newhalen and Tlikakila rivers, drawing eagles, bears, and sport anglers to one of the most productive salmon fisheries in Alaska.
    Two active stratovolcanoes, Mount Redoubt at 10,197 feet and Mount Iliamna at 10,016 feet, both visible from the Cook Inlet coast and from Anchorage on clear days; Redoubt erupted most recently in 2009, sending an ash column 65,000 feet into the air.
    Complete inaccessibility by road; every visitor arrives by small aircraft or boat, which keeps annual visitation around 12,000 and leaves the park's 2.6 million acres effectively roadless and trailless outside the Port Alsworth area.

  best_things_to_see_items:
    - name: "Brown Bear Viewing, Cook Inlet Coast"
      description: "The Cook Inlet coastline at Silver Salmon Creek and Chinitna Bay is among the best places in the world to observe brown bears at close range. Bears arrive in spring to graze sedge flats and return in late summer when silver salmon pack the creek. Access is by floatplane or boat from Homer or Kenai, typically on a guided day trip or multi-day lodge stay. Bears often approach within yards of visitors on foot, making this one of the most intense wildlife encounters available in any national park."
      image: "/images/parks/national/lake-clark-national-park-preserve/06-brown-bear-viewing-cook-inlet-coast.jpg"
      alt: "two brown bear cubs playing in the sedges"
      credit: "NPS Photo / Kara Lewandowski"
    - name: "Mount Redoubt and Mount Iliamna"
      description: "Mount Redoubt (10,197 ft) and Mount Iliamna (10,016 ft) are side-by-side active stratovolcanoes in the Chigmit Mountains, both draped in glaciers and producing fumarolic steam visible from a distance. Redoubt last erupted in 2009 and has been volcanically active for centuries; Iliamna shows persistent fumarolic activity from its summit craters. Flightseeing tours from Anchorage and Port Alsworth orbit both peaks, and on clear days from the Cook Inlet coast both summits are visible rising above the glaciated ridge."
      image: "/images/parks/national/lake-clark-national-park-preserve/07-mount-redoubt-and-mount-iliamna.jpg"
      alt: "Photo of a stratovolcano flanked with glaciers towering over a river valley."
      credit: "NPS Photo / Paige Spencer"
    - name: "Tanalian Falls"
      description: "Tanalian Falls drops through a narrow gorge in the forest above Port Alsworth, reached by one of the few maintained trails in the park. The trail follows the Tanalian River through boreal forest before climbing to the falls, which are most dramatic in late spring when snowmelt is running. Fall foliage turns the birch and willow gold and orange around the trail in early September. The falls serve as a turnaround for day hikers; a rougher trail continues past them toward Kontrashibuna Lake and Tanalian Mountain."
      image: "/images/parks/national/lake-clark-national-park-preserve/08-tanalian-falls.jpg"
      alt: "Waterfall surrounded by forest in fall foiliage and mountains in the background."
      credit: "NPS Photo / Karen Smigielski"
    - name: "Chigmit Mountain Glaciers"
      description: "The Chigmit Mountains hold dozens of active glaciers descending from peaks above 8,000 feet. Flying into or out of the park on a clear day reveals crevassed ice fields, hanging glaciers, and glacier-fed turquoise lakes, including Turquoise Lake in the upper drainage, whose color comes from glacial flour suspended in the water. Flightseeing from Anchorage or Port Alsworth offers the most accessible view; the terrain requires technical mountaineering skills to explore on foot."
      image: "/images/parks/national/lake-clark-national-park-preserve/09-chigmit-mountain-glaciers.jpg"
      alt: "photo of large alpine glacier"
      credit: "NPS Photo / Chuck Lindsay"
    - name: "Richard Proenneke's Cabin at Twin Lakes"
      description: "In 1967, Richard Proenneke built a hand-crafted log cabin at Upper Twin Lakes entirely by hand using simple tools and lived there alone for over 30 years. His cabin, tools, and journals are now a National Historic Landmark. Floatplanes bring visitors to the Twin Lakes airstrip, a short walk from the cabin, which is staffed by a volunteer in summer. Proenneke filmed his construction and daily life on Super 8; the documentary 'Alone in the Wilderness' (2003) remains the most widely seen introduction to Lake Clark."
      image: "/images/parks/national/lake-clark-national-park-preserve/10-richard-proenneke-s-cabin-at-twin-lakes.jpg"
      alt: "photo of a log cabin tucked into a spruce forest reflecting in a blue lake."
      credit: "NPS Photo / Kent Miller"
    - name: "Sockeye Salmon Runs and Sport Fishing"
      description: "The Newhalen River drains Lake Clark into Lake Iliamna, part of the Bristol Bay watershed that produces the largest sockeye salmon run in the world. At peak run in July, salmon pack the river so densely the water appears to move; five species use the park's waterways through the season. Sport fishing for sockeye, rainbow trout, arctic char, and northern pike draws anglers who fly in to fish rivers that see little pressure. An Alaska sport fishing license is required."
      image: "/images/parks/national/lake-clark-national-park-preserve/11-sockeye-salmon-runs-and-sport-fishing.jpg"
      alt: "Sockeye salmon web banner 640 wide Steve Huffman"
      credit: "NPS Photo / S. Huffman"

