faq:
  - question: "When is the best time to visit Everglades National Park?"
    answer: "December through February is the best time: dry season, temperatures of 65–78 °F, minimal mosquitoes, and wildlife concentrated in small pools near the trails. March and April are almost as good. Avoid May through October — the wet season brings extreme heat, daily thunderstorms, and mosquitoes that make outdoor activity impractical."
  - question: "Where is Everglades National Park?"
    answer: "The park is at the southern tip of Florida, with the main entrance near Homestead, about 45 miles south of Miami. There are three separate entrances: the main entrance (Ernest F. Coe Visitor Center) near Homestead, the Shark Valley entrance on US-41 west of Miami, and the Gulf Coast entrance at Everglades City on the northwest side. A car is required; no public transportation serves the park."
  - question: "What is the Anhinga Trail?"
    answer: "The Anhinga Trail is a 0.8-mile paved and boardwalk loop at Royal Palm, 2 miles from the main entrance. It consistently offers the closest wildlife encounters in the park: alligators float directly below the boardwalk, anhingas dry their wings on the railings, and wading birds fish in the water alongside the trail. It is the first stop for most first-time visitors and can be walked in 30 to 45 minutes."
  - question: "Are there alligators in Everglades National Park?"
    answer: "Yes — alligators are extremely common throughout the park's freshwater habitats and are regularly seen at close range from boardwalk trails. The Anhinga Trail, the Shark Valley loop road, and the Pa-hay-okee Overlook area are among the most reliable spots. Alligators generally ignore people, but the NPS advises keeping at least 15 feet of distance and never feeding them."
  - question: "Can you kayak or canoe in the Everglades?"
    answer: "Yes. The park has numerous marked canoe and kayak trails ranging from the 5.4-mile Nine Mile Pond loop to the 99-mile Wilderness Waterway from Everglades City to Flamingo. Canoe and kayak rentals are available at the Flamingo marina and from outfitters in Everglades City. Backcountry overnight paddling requires a free permit from the Flamingo or Gulf Coast Visitor Center."
  - question: "What is Shark Valley?"
    answer: "Shark Valley is a 15-mile paved loop road in the northern section of the park, accessible from US-41 about 35 miles west of Miami. Visitors can rent bicycles and ride the loop independently, or take the concession-operated tram (about $25–$30/adult, narrated). A 45-foot observation tower at mile 7.5 provides a panoramic view of the sawgrass prairie. Alligators are extremely common along the road; dozens may be visible on cool mornings."
  - question: "How much does it cost to visit Everglades National Park?"
    answer: "Entrance costs $35 per vehicle for a 7-day pass, $30 per motorcycle, or $15 per person on foot or bicycle. The America the Beautiful Annual Pass ($80) covers entrance for 12 months. The Shark Valley Tram Tour is an additional $25–$30 per adult, operated by a separate concessionaire. Campsite fees are $20–$30 per night at the two frontcountry campgrounds."

