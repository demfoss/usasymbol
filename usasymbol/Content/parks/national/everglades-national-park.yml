sections:
  overview: |
    Everglades National Park occupies the southern tip of Florida, covering 1,508,938 acres of subtropical wetland, sawgrass prairie, mangrove coast, and shallow marine estuary. The park is the largest remaining subtropical wilderness in the United States and is simultaneously a UNESCO World Heritage Site, a UNESCO Biosphere Reserve, and a Ramsar Wetland of International Importance — the only site in North America to hold all three designations. At its core, the Everglades is not a swamp but a wide, shallow, nearly imperceptible river: fresh water from Lake Okeechobee flows south across a limestone plain at about a quarter mile per day, through 60 miles of sawgrass prairie, before dispersing into the coastal mangroves and Florida Bay. The park draws roughly 1.2 million visitors a year (rank 27 among 63 national parks), with nearly all visits occurring in the dry season between November and April, when lower water levels concentrate wildlife and mosquitoes are largely absent.

  known_for: |
    American alligators, present in virtually every freshwater habitat in the park and regularly seen at close range from boardwalk trails — the Anhinga Trail at Royal Palm is one of the most reliable places in the world to observe wild alligators.
    Wading bird colonies that once numbered in the millions before the 20th-century drainage of the Everglades; roseate spoonbills, great blue herons, great egrets, snowy egrets, little blue herons, and wood storks are present year-round and most visible in the dry season when fish are concentrated in shrinking pools.
    Canoeing and kayaking through backcountry waterways, including the 99-mile Wilderness Waterway from Everglades City to Flamingo — one of the longest backcountry water routes in the eastern United States.
    The only place in the world where American alligators and American crocodiles live in the same habitat, with the American crocodile — far rarer and shier than the alligator — nesting at Flamingo at the park's southern end.

  best_things_to_see_items:
    - name: "Anhinga Trail"
      description: "The Anhinga Trail at Royal Palm is a 0.8-mile paved loop boardwalk and the single best wildlife-viewing trail in the park. At close range from the boardwalk, anhingas dry their wings on railings, purple gallinules walk across lily pads, and large alligators rest motionless in the water inches below the deck. Great blue herons, great egrets, and little blue herons are present year-round. The trail is best from December through April when low water concentrates fish and the wildlife that feeds on them."
      image: "https://www.nps.gov/common/uploads/structured_data/3C8547ED-1DD8-B71B-0B596F29F0A9A60B.jpg"
      alt: "An American Alligator high walks the Anhinga Trail."
      credit: "NPS Photo"
    - name: "Shark Valley"
      description: "Shark Valley is a 15-mile paved loop in the northern section of the park along the Tamiami Trail, with a 45-foot observation tower at mile 7.5 that offers a panoramic view across the sawgrass prairie — the clearest sense of the Everglades as a river that the park provides. Visitors ride rented bikes or board the concession-operated tram that narrates the full loop. Alligators are extremely common along the road here; dozens may be visible sunning on the asphalt on cool mornings."
      image: "https://www.nps.gov/common/uploads/structured_data/3C85E60F-1DD8-B71B-0BAB4F7583E96025.jpg"
      alt: "Two visitors bike along the road in Shark Valley."
      credit: "NPS Photo"
    - name: "Nine Mile Pond Canoe Trail"
      description: "Nine Mile Pond is a 5.4-mile marked canoe and kayak loop in the main park interior, threading through sawgrass prairie, shallow ponds, and mangrove tunnels. The route is marked by numbered poles and is manageable for paddlers with basic experience. Wildlife along the trail includes alligators, wading birds, turtles, and in winter, manatees occasionally in the deeper channel sections. Canoe rentals are available at the Flamingo marina; kayaks can be brought from outside."
      image: "https://www.nps.gov/common/uploads/structured_data/3C854681-1DD8-B71B-0BA4F6D9379336DF.jpg"
      alt: "Two canoes at Nine Mile Pond during sunset."
      credit: "NPS Photo"
    - name: "Pa-hay-okee Overlook"
      description: "Pa-hay-okee, a Miccosukee phrase meaning 'grassy waters,' is an elevated wooden platform on a hardwood hammock island in the middle of the sawgrass prairie. A short 0.4-mile round-trip walk leads from the parking area to the platform, which provides an unobstructed 360-degree view across the sea of grass. The platform is one of the best places in the park to see and photograph the vast scale of the sawgrass river on a clear day, especially in the golden light of late afternoon."
      image: "https://www.nps.gov/ever/planyourvisit/images/PAHAYOKEE-BOARDWALK_NEW-1-1.jpg?autorotate=false&format=webp&maxheight=1300&maxwidth=1300"
      alt: "Pa-hay-okee Overlook"
      credit: "NPS photo by Brandon Cintron Gerena"
    - name: "Flamingo and Florida Bay"
      description: "Flamingo at the park's southern tip is the departure point for Florida Bay, a shallow 850-square-mile estuary where freshwater and saltwater meet. The Flamingo marina rents canoes, kayaks, and small motorboats for exploring the bay and nearby backcountry. American crocodiles — far rarer than alligators — nest near Flamingo and are occasionally spotted from the marina area. The flamingo lodge and campground offer the only in-park overnight lodging and camping options on the Atlantic side."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/80270432-C1D4-4E62-9B191EBAD495CD89.jpg?mode=crop&quality=90&width=1600"
      alt: "Kayaks and Canoes sit next to the water at Flamingo Marina"
      credit: "NPS Photo D. Diaz"
    - name: "Ten Thousand Islands (Gulf Coast)"
      description: "The northwest corner of the park along the Gulf of Mexico contains a labyrinth of mangrove islands and tidal channels that comprise the largest mangrove ecosystem in North America. The Gulf Coast Visitor Center at Everglades City is the launching point for boat tours and backcountry paddling trips into the islands. Bottlenose dolphins, manatees, ospreys, and brown pelicans are common here, along with the wading birds found throughout the park. The 99-mile Wilderness Waterway starts here and ends at Flamingo."
      image: "https://www.nps.gov/ever/learn/nature/images/HustonRiver.jpg?autorotate=false&maxwidth=650"
      alt: "The Huston River, located in the southern part of the Ten Thousand Islands region of Everglades National Park."
      credit: "NPS photo by Lori Oberhofer"

