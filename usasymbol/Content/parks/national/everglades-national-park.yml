intro_text: "Everglades National Park covers 1,508,938 acres of subtropical wetland and coastal wilderness at the southern tip of [Florida](/states/florida), authorized in 1934 and dedicated in 1947 as the first national park established to protect biodiversity rather than scenery. It is the largest tropical wilderness in the United States, a UNESCO World Heritage Site, and the only place in the world where American alligators and American crocodiles coexist in the wild."

