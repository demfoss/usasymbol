sections:
  overview: |
    Bryce Canyon National Park occupies the eastern edge of the Paunsaugunt Plateau in southern Utah, about 80 miles northeast of St. George. The park covers 35,835 acres and is not actually a canyon — it is a series of 13 natural amphitheaters carved into the plateau edge, filled with the world's largest concentration of hoodoos, the orange and white limestone spires that define the park's character. The rim elevation ranges from 8,000 feet at the northern entrance to 9,115 feet at Rainbow Point, making Bryce Canyon one of the coolest national parks in the American Southwest in summer. The park draws about 2.9 million visitors annually, ranking 14th among the 63 national parks. A free shuttle system operates from late May through mid-October, connecting the visitor center and all major viewpoints.

  known_for: |
    The world's largest concentration of hoodoos — irregular limestone columns carved by frost, rain, and ice over millions of years — visible from 13 named overlooks along the 18-mile scenic drive. The Navajo Loop Trail, a 1.3-mile circuit that descends into the Wall Street narrows and passes Thor's Hammer, the most photographed hoodoo in the park. Bryce Canyon's position as one of the least light-polluted national parks in the contiguous United States, with International Dark Sky Park designation and Milky Way visibility most clear nights from May through October. Snow-dusted hoodoos in winter, one of the most visually dramatic conditions in any U.S. national park, accessible by snowshoe and cross-country ski from November through March.

  best_things_to_see_items:
    - name: "Bryce Amphitheater"
      description: "The Bryce Amphitheater is the largest of the park's natural bowls and the concentration point for most visitor activity. Four overlooks — Sunrise Point, Sunset Point, Inspiration Point, and Bryce Point — line the rim above it, each at a slightly different elevation and angle. Inspiration Point offers the widest panoramic view of the hoodoo field below, while Bryce Point sits at 8,296 feet and looks directly down into the densest section of spires."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/47C76958-A120-310D-EE19D8ABBFE4B8A6.jpg?mode=crop&quality=90&width=1300"
      alt: "Red rock formations against a clear blue sky"
      credit: "NPS Photo"
    - name: "Navajo Loop Trail"
      description: "The Navajo Loop Trail descends 550 feet from Sunset Point into the amphitheater on a series of tight switchbacks, passes through the Wall Street slot canyon — a narrow passage between 200-foot hoodoo walls — and returns via a different branch past Thor's Hammer, a balanced rock formation on a tall column. The full loop is 1.3 miles. Most visitors descend via Wall Street and return via the wider Thor's Hammer branch."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/95FDFAB3-A125-D311-769FAC609D835815.jpeg?mode=crop&quality=90&width=1300"
      alt: "Hikers descend sandy switchbacks heading into a canyon of red rock with trees"
    - name: "Stargazing"
      description: "Bryce Canyon holds International Dark Sky Park designation and is one of the darkest places in the contiguous United States. The Milky Way core is visible to the naked eye most clear nights from May through October. The park's high elevation at 8,000 to 9,000 feet reduces atmospheric haze, and the surrounding plateau has minimal light pollution for 70 miles in most directions. Ranger-led astronomy programs run at the outdoor amphitheater in summer and are free with park admission."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/B80F0795-A5AB-8CE3-5EE347AAC7AB58AE.jpg?mode=crop&quality=90&width=1300"
      alt: "The black silhouette of a person standing at a viewpoint with the milky way in the backgroundn"
      credit: "NPS Photo"
    - name: "Rainbow Point"
      description: "Rainbow Point is the southernmost stop on the 18-mile scenic drive, at 9,115 feet — the highest elevation in the park. The viewpoint looks south across the Grand Staircase into Zion National Park's high country on clear days. Ancient bristlecone pines, some more than 1,700 years old, grow on the exposed ridgeline near Rainbow Point and Yovimpa Point. The Bristlecone Loop trail (1.0 mile) circles through the bristlecone grove at the plateau's edge."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/C8BFB803-F826-FE47-05F63C15ED5ECCE7.jpg?mode=crop&quality=90&width=1600"
      alt: "White rock red rock spires and forest at viewpoint"
      credit: "NPS Photo / Peter Densmore"
    - name: "Natural Bridge"
      description: "Natural Bridge is a 125-foot natural arch carved through a limestone fin along the scenic drive between the main amphitheater area and Rainbow Point. Unlike the arches at Arches National Park, this formation was carved primarily by rain and frost rather than underground water — making it technically a natural bridge rather than an arch in the strictest geologic classification. A pullout with a guardrail provides direct views; no trail descends to the base."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/55C7ED65-EEB8-E375-2E64E6AFED583ACA.jpg?mode=crop&quality=90&width=1600"
      alt: "A glowing orange rock arch stands among limestone slopes above a forested landscape"
      credit: "NPS Photo / Peter Densmore"
    - name: "Utah Prairie Dogs"
      description: "Bryce Canyon National Park is a stronghold for the Utah prairie dog, a federally threatened species found only in southwestern Utah. The animals live in colonies near the meadows and forest edges along the rim road, particularly between the visitor center and Sunset Campground. Prairie dogs are active from spring through fall and are often seen sitting upright at burrow entrances or foraging in open grassland adjacent to the hoodoo formations."
      image: "https://www.nps.gov/brca/learn/nature/images/prairiedogs.jpg?autorotate=false&maxwidth=650"
      alt: "prairie dogs"
      credit: "NPS Photo"

