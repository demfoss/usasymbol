faq:
  - question: "Where is Bryce Canyon National Park?"
    answer: "Bryce Canyon is in southern Utah, about 270 miles from both Las Vegas and Salt Lake City. The nearest town is Bryce Canyon City, just outside the north entrance on Utah Route 12. St. George Regional Airport (SGU) is approximately 80 miles southwest and offers commercial service."
  - question: "When is the best time to visit Bryce Canyon National Park?"
    answer: "Fall (September–October) offers the best balance of comfortable weather and manageable crowds. Summer (June–August) has all facilities open but parking fills by 9 a.m. — use the free shuttle. Spring brings snow-dusted hoodoos and wildflowers. Winter is dramatically beautiful with snow on the hoodoos, but icy trails require traction devices."
  - question: "How much does it cost to enter Bryce Canyon National Park?"
    answer: "The entrance fee is $35 per vehicle for a 7-day pass. Motorcycles pay $30 and individuals on foot or bicycle pay $20 per person. The America the Beautiful Annual Pass ($80) covers Bryce Canyon and all other national parks for 12 months. Confirm current fees at nps.gov/brca."
  - question: "Do I need a reservation to visit Bryce Canyon?"
    answer: "No timed-entry reservation is currently required to drive into the park. North Campground and Sunset Campground accept reservations from May through October via Recreation.gov; summer weekends book out months ahead. The free shuttle operates late May through mid-October and is the practical alternative to driving to crowded viewpoints."
  - question: "What is the best hike in Bryce Canyon National Park?"
    answer: "The Queens Garden + Navajo Loop combination (2.9 miles, moderate) is the most rewarding single hike — descend through the hoodoo field to Queens Garden, traverse the amphitheater floor, and return via the Wall Street narrows and Thor's Hammer. For less elevation gain, the Navajo Loop alone (1.3 miles) covers the most dramatic terrain. The Peekaboo Loop (5.5 miles, strenuous) goes deeper into the formation field."
  - question: "What are hoodoos and why are there so many at Bryce Canyon?"
    answer: "Hoodoos are tall, thin columns of rock carved by erosion. At Bryce Canyon, they form because the Claron Formation limestone is cracked by frost — the park has about 200 freeze-thaw cycles per year, which steadily widens cracks into slots, then separates fins into isolated pillars. The iron oxides staining the rock pink, orange, and red give Bryce Canyon its distinctive color. The park holds the largest concentration of hoodoos found anywhere on Earth."
  - question: "Is Bryce Canyon good for stargazing?"
    answer: "Yes. Bryce Canyon holds International Dark Sky Park designation and is one of the darkest places in the contiguous United States. The Milky Way core is visible to the naked eye most clear nights from May through October. The park runs free ranger-led astronomy programs at the outdoor amphitheater on summer evenings. The best viewing is from the Bryce Amphitheater overlooks and Inspiration Point, away from the campground lights."

