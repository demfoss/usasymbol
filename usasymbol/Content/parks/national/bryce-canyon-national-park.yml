seo_description: "Visit Bryce Canyon National Park in Utah: hoodoo hiking, dark skies, best time to go, entrance fees, and how to get there."
intro_text: "Bryce Canyon National Park in [Utah](/states/utah) sits atop the Paunsaugunt Plateau at 8,000 to 9,115 feet elevation, protecting the world's largest concentration of hoodoos — orange and white limestone spires carved by frost; established in 1928, the park draws about 2.9 million visitors a year."

