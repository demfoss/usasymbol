seo_title: "Carlsbad Caverns National Park: Tours, Bats & Best Time"
seo_description: "Visit Carlsbad Caverns in New Mexico: 119 caves, the Big Room, nightly bat flights, best time to go, fees, and cave tour reservations."
intro_text: "Carlsbad Caverns National Park in New Mexico protects 46,766 acres of Chihuahuan Desert above and below ground, including more than 119 caves formed when sulfuric acid dissolved ancient limestone. Established in 1930 and designated a UNESCO World Heritage Site in 1995, the park draws about 441,000 visitors a year to the Big Room and the nightly bat flight."

