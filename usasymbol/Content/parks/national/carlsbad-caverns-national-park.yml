faq:
  - question: "Where is Carlsbad Caverns National Park?"
    answer: "Carlsbad Caverns is in southeastern New Mexico, about 25 miles southwest of the city of Carlsbad on US Highway 62/180. The nearest major airport is El Paso International (ELP) in Texas, roughly 150 miles to the southwest."
  - question: "Do I need a reservation to visit Carlsbad Caverns?"
    answer: "Reservations are required for all ranger-led cave tours, including King's Palace, Slaughter Canyon Cave, Left Hand Tunnel, Hall of the White Giant, and Spider Cave. Book through Recreation.gov as early as possible — summer tours sell out weeks in advance. No reservation is needed for the self-guided Big Room and Natural Entrance routes or for the Bat Flight Program."
  - question: "When is the best time to see the bat flight at Carlsbad Caverns?"
    answer: "The bat colony is present from late April through October. The largest nightly flights occur from July through September when the colony is at its maximum of up to 400,000 bats. The Bat Flight Program runs at the outdoor amphitheater at dusk; arrive at least 30 minutes before sunset for a seat. There is no bat flight from November through early April when the colony is in Mexico."
  - question: "What is the temperature inside Carlsbad Cavern?"
    answer: "The cave maintains a constant temperature of approximately 56 °F (13 °C) year-round, regardless of outside conditions. Bring a jacket or light fleece for any cave visit, including in summer when surface temperatures can exceed 95 °F."
  - question: "How do you get into Carlsbad Cavern?"
    answer: "There are two ways in: the Natural Entrance Route, a 1.25-mile paved descent of 750 feet through the historic cave opening (about 45 minutes walking down); or the elevator, which descends 750 feet in about 60 seconds. Both routes lead to the Big Room. The Natural Entrance route is one-way; all visitors exit by elevator."
  - question: "Is there camping at Carlsbad Caverns National Park?"
    answer: "The park has no developed campground. Backcountry camping is allowed in designated primitive areas with a free same-day permit from the visitor center; no water or facilities are available. The nearest private campgrounds and RV parks are in White's City at the park entrance and in the city of Carlsbad, about 25 miles northeast."
  - question: "What is Lechuguilla Cave?"
    answer: "Lechuguilla Cave, discovered in its full extent in 1986, is the deepest cave in the United States at 1,604 feet and has more than 145 miles of mapped passage. It is closed to the public and accessible only to permitted scientific researchers. Its formations — including rare sulfur-coated speleothems and cave bubbles — are found nowhere else on Earth."

