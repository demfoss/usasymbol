sections:
  overview: |
    Carlsbad Caverns National Park sits in the Guadalupe Mountains of southeastern New Mexico, about 25 miles southwest of the city of Carlsbad. The park covers 46,766 acres of Chihuahuan Desert surface and protects more than 119 caves beneath it, all formed through a rare sulfuric acid dissolution process rather than the more common rainwater-erosion process found in most cave systems. The main cave, Carlsbad Cavern, contains the Big Room — one of the largest cave chambers in North America, with a floor area of 8.2 acres and a ceiling 255 feet high at its tallest point. The park ranks 47th among the 63 U.S. national parks by annual visitation, drawing roughly 441,000 visitors in 2023. A colony of up to 400,000 Brazilian free-tailed bats roosts in the cave from late spring through fall and spirals out at dusk in a flight visible from a surface amphitheater at no additional charge.

  known_for: |
    The Big Room, a single cave chamber with 8.2 acres of floor space and formations including the 62-foot Giant Dome column, reachable by a 750-foot elevator ride or a 1.25-mile walk-in route through the Natural Entrance.
    The nightly bat flight from late April through October, when up to 400,000 Brazilian free-tailed bats spiral out of the Natural Entrance at dusk in a counter-clockwise column that can last up to two hours and is visible from a free surface amphitheater.
    Lechuguilla Cave, descending 1,604 feet to become the deepest cave in the United States, accessible only to permitted scientific researchers — the most extensive and pristine cave system in the country.
    A formation inventory unlike any other American cave: stalactites, stalagmites, columns, soda straws, helictites, cave pearls, cave popcorn, and lily pads — all still growing slowly in the sections of the cave that hold moisture.

  best_things_to_see_items:
    - name: "The Big Room"
      description: "The Big Room is the main cave chamber of Carlsbad Cavern, with 8.2 acres of floor space and a ceiling 255 feet high at its highest point. A 1.25-mile paved loop trail passes the Giant Dome (62 feet), the Hall of Giants, and the Bottomless Pit (actually 140 feet deep). The chamber is reached either by the Natural Entrance walk-in route or by the elevator, which descends 750 feet in 60 seconds."
      image: "https://www.nps.gov/common/uploads/structured_data/29A84FDD-D660-B07C-A6B12986D3123FC7.jpeg"
      alt: "Photo of the Big Room with trail"
      credit: "NPS / Eymard Bangcoro"
    - name: "Natural Entrance Route"
      description: "The Natural Entrance is the historic opening through which Jim White first explored the cave in the late 1890s and through which the bat colony exits each evening. A paved 1.25-mile descent follows switchbacks 750 feet underground past formations including the Bat Cave, Devil's Spring, and Iceberg Rock before opening into the Big Room. The route is one-way and takes about 45 minutes to walk down."
      image: "https://www.nps.gov/common/uploads/structured_data/2B40AD3D-DDDB-2F2E-1CB524F96FF08C4B.jpg"
      alt: "Photo of the Natural Entrance to Carlsbad Cavern with visitors hiking down the trail."
      credit: "NPS / Eymard Bangcoro"
    - name: "Bat Flight Program"
      description: "Each evening from late April through October, up to 400,000 Brazilian free-tailed bats spiral out of the Natural Entrance in a counter-clockwise column at dusk. The free Bat Flight Program runs at the outdoor amphitheater beside the Natural Entrance; rangers give a short talk before the flight begins. The bats hunt insects over the Chihuahuan Desert through the night and return before sunrise."
      image: "https://www.nps.gov/cave/planyourvisit/images/DSC04975.JPG?maxwidth=650&autorotate=false"
      alt: "Bats in Flight"
      credit: "NPS / Nick Hristov"
    - name: "King's Palace Guided Tour"
      description: "King's Palace is a ranger-led tour through four connected rooms below the Big Room floor: King's Palace, Queen's Chamber, Papoose Room, and Green Lake Room. The rooms contain some of the most densely decorated formations in the entire cave system, including large stalactite draperies and rare cave pearls. The tour is 1.0 mile round trip and requires advance reservation; numbers are strictly limited."
      image: "https://www.nps.gov/cave/planyourvisit/images/DSCF0244_small.jpg?maxwidth=650&autorotate=false"
      alt: "Photo of ranger and visitors on a King's Palace Tour."
      credit: "NPS / Eymard Bangcoro"
    - name: "Slaughter Canyon Cave"
      description: "Slaughter Canyon Cave is a separate, undeveloped cave in the southern part of the park accessible only by a ranger-led tour. The cave has no paved trails or electric lights; visitors carry their own flashlights through 1.25 miles of natural cave passage past a 89-foot stalagmite called the Christmas Tree. The 2.5-mile round-trip walk to the cave entrance on the surface is also required."
      image: "https://www.nps.gov/cave/images/P8110050-Barbary-Habitat-Looking-down-on-Slaughter-cave-trail.JPG?maxwidth=1300&autorotate=false"
      alt: "Looking down onto the Slaughter Canyon Cave trail"
      credit: "NPS"
    - name: "Desert Surface Trails"
      description: "The park's surface is Chihuahuan Desert with ancient sea ledges, fossil reefs, canyons, and cacti. The Desert Nature Trail, a 0.5-mile loop near the visitor center, introduces the plants and geology of the Capitan Reef formation. Backcountry trails extend into Rattlesnake Canyon and Yucca Canyon for visitors who want to see the above-ground landscape away from the cave area."
      image: "https://www.nps.gov/cave/images/NPS-Dan-Pawlak_Nature-Trail.jpg?maxwidth=1300&autorotate=false"
      alt: "View of the paved nature trail with desert plants lining the path"
      credit: "NPS / Dan Pawlak"

