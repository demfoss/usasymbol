sections:
  overview: |
    Gates of the Arctic National Park & Preserve covers 7,523,898 acres of the central Brooks Range in northern Alaska, making it the second-largest national park in the United States. The entire park sits above the Arctic Circle, roughly 200 miles northwest of Fairbanks, spanning from the Endicott Mountains in the east to the Schwatka Mountains in the west. There are no roads, no maintained trails, and no developed facilities anywhere inside the park; every visitor travels by small aircraft, river float, or on foot across open tundra. About 11,000 people visit each year, placing it among the least visited of the 63 national parks and one of the few places in the United States where wilderness travel is entirely unmediated by infrastructure.

  known_for: |
    Complete roadlessness across 7.5 million acres — no paved roads, no unpaved roads, no maintained trails, and no visitor centers or campgrounds inside the park, making it the most infrastructure-free national park in the United States.
    Six federally designated Wild and Scenic Rivers — the Alatna, John, Kobuk, Noatak, North Fork Koyukuk, and Tinayguk — drawing paddlers on multi-week expeditions through remote Brooks Range valleys.
    The Arrigetch Peaks, a cluster of sheer granite spires rising above the Alatna River valley and one of the most sought-after technical climbing destinations in arctic North America.
    The Western Arctic caribou herd, which has numbered over 200,000 animals and completes two migrations across the park annually on routes the Nunamiut people have followed for more than ten thousand years.

  best_things_to_see_items:
    - name: "Arrigetch Peaks"
      description: "The Arrigetch Peaks are a tight cluster of granite spires rising steeply from the Alatna River valley in the park's southwestern quadrant, with walls reaching several thousand feet and technical routes up to Grade V. Non-climbers fly in to Circle Lake or the Arrigetch Creek drainage and hike cross-country through tundra and boulder fields to reach the base. The approach alone, with vertical rock mirrored in tundra lakes, is one of Alaska's most striking backcountry experiences. No maintained route exists; all travel is off-trail."
      image: "/images/parks/national/gates-of-the-arctic-national-park-preserve/06-arrigetch-peaks.jpg"
      alt: "Alpenglow on the granite cliffs of mountains"
      credit: "NPS Photo"
    - name: "Frigid Crags and Boreal Mountain — The Gates"
      description: "Frigid Crags and Boreal Mountain are the two peaks that Robert Marshall named in 1930 as the 'gates of the Arctic,' framing the North Fork Koyukuk River valley like sentinels on opposite banks. Standing in the valley and looking north, Frigid Crags rises on the west and Boreal Mountain on the east — a passage into Arctic wilderness Marshall considered one of the most inspiring landscapes in Alaska. The peaks are accessible on foot from the Wiseman area near the Dalton Highway or by fly-in charter from Bettles."
      image: "/images/parks/national/gates-of-the-arctic-national-park-preserve/07-frigid-crags-and-boreal-mountain-the-gates.jpg"
      alt: "The Gates of the Arctic from Pyramid Creek confluence with North Fork Koyukuk River. Boreal Mountain (left) and Frigid Crags (right) frame this dramatic \"entrance\" into the Arctic."
      credit: "NPS Photo"
    - name: "Floating the Alatna River"
      description: "The Alatna River is one of six Wild and Scenic Rivers in the park and the primary corridor for multi-day float trips into the western Brooks Range. The river flows south from its headwaters near the Arrigetch Peaks through about 100 miles of remote valley before exiting the park near Allakaket. Paddlers fly in by charter floatplane to the upper drainage and are picked up by floatplane at Allakaket or Alatna; no roads reach either end. Expect flatwater with sections of swift current; Class I to II conditions are typical in midsummer."
      image: "/images/parks/national/gates-of-the-arctic-national-park-preserve/08-floating-the-alatna-river.jpg"
      alt: "Aerial view of the Alatna River"
      credit: "NPS/Sean Tevebaugh"
    - name: "North Fork Koyukuk Corridor"
      description: "The North Fork of the Koyukuk River drains the mountains around Frigid Crags and Boreal Mountain and provides one of the park's most accessible backcountry corridors for both floaters and hikers. Charter flights land on gravel bars near Bettles, and visitors travel upstream on foot along open tundra benches with the Brooks Range rising on both sides. Wolves, grizzly bears, and caribou are frequently seen in this valley. Bettles, the main gateway community, sits a short flight south and offers basic services and air taxi connections."
      image: "/images/parks/national/gates-of-the-arctic-national-park-preserve/09-north-fork-koyukuk-corridor.jpg"
      alt: "North Fork Koyukuk River with forest and mountains in background"
      credit: "NPS/Josh Spice"
    - name: "Anaktuvuk Pass"
      description: "Anaktuvuk Pass is a high mountain crossing through the Brooks Range and home of the Nunamiut people — the only permanent community inside any U.S. national park, with about 300 residents accessible only by aircraft. The Simon Paneak Memorial Museum in the village documents more than ten thousand years of Nunamiut culture, including mask-making traditions and the caribou-hunting knowledge that sustained life in one of Earth's most demanding environments. Visitors fly in from Fairbanks on scheduled or charter flights."
      image: "/images/parks/national/gates-of-the-arctic-national-park-preserve/10-anaktuvuk-pass.jpg"
      alt: "Looking northeast at Anaktuvuk Pass, Alaska in the Brooks Range mountains."
      credit: "NPS/Josh Spice"
    - name: "Midnight Sun and Northern Lights"
      description: "The park sits far enough north that the sun does not set for roughly 30 days around the summer solstice, flooding the tundra with continuous light from mid-June through early July. The same latitude that brings 24-hour daylight in summer produces aurora borealis from mid-August through April, with peak activity in September and February. Dark skies here are total — no city glow reaches the Brooks Range. Late August and September combine the first auroras with fall tundra color in the same evening sky."
      image: ""
      alt: "Aurora and lingering twilight above the Brooks Range under the park's midnight-sun and dark-sky seasons."

