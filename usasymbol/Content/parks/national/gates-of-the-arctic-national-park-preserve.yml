faq:
  - question: "Where is Gates of the Arctic National Park?"
    answer: "Gates of the Arctic is in northern Alaska, in the central Brooks Range, entirely above the Arctic Circle. The park sits roughly 200 miles northwest of Fairbanks. No road enters the park; the nearest road access is the Dalton Highway, which runs along the park's eastern boundary near Coldfoot and Wiseman."
  - question: "How do you get to Gates of the Arctic?"
    answer: "Most visitors fly by small charter aircraft from Fairbanks or the gateway community of Bettles, about 35 miles south of the park. Scheduled regional flights connect Fairbanks to Bettles; from Bettles, air taxi operators fly directly to river bars and lakes inside the park. Alternatively, drive the Dalton Highway to Coldfoot or Wiseman and walk into the park on foot from the eastern boundary."
  - question: "Is there an entrance fee for Gates of the Arctic?"
    answer: "No. Gates of the Arctic is free to enter and requires no backcountry permit. The NPS strongly recommends registering your trip itinerary at the Bettles Field Station or the Arctic Interagency Visitor Center in Coldfoot before entering the backcountry."
  - question: "Are there trails in Gates of the Arctic?"
    answer: "No. The park has no maintained trails anywhere in its 7.5 million acres. All travel is cross-country across open tundra, river gravel bars, and mountain terrain. Navigation requires a topographic map and compass. Gravel bars alongside rivers provide the easiest walking; tussock grass and willow brush make open tundra physically demanding."
  - question: "When is the best time to visit Gates of the Arctic?"
    answer: "July and August are the primary visiting months: temperatures reach 50–75 °F in the valleys, rivers are at manageable levels for floating, and the midnight sun provides 24-hour daylight in early July. September brings fall tundra color, no mosquitoes, and the caribou fall migration, but weather can deteriorate rapidly and snow can arrive at any time. Mosquitoes are intense from mid-June through mid-August."
  - question: "What wildlife can I see at Gates of the Arctic?"
    answer: "Caribou, grizzly bears, wolves, Dall sheep, wolverines, and golden eagles all live in the park. The Western Arctic caribou herd — one of the largest on Earth — migrates through twice yearly. Grizzly bears are the most commonly seen large mammal, visible on open tundra throughout summer. Fishing for Arctic grayling, lake trout, and northern pike is available with an Alaska state fishing license."
  - question: "Can I camp in Gates of the Arctic?"
    answer: "Yes. Dispersed camping is permitted anywhere in the park on durable surfaces, and no permit is required. There are no designated campgrounds or facilities. Camp on gravel bars when possible, store food in bear canisters, treat all water before drinking, and file a trip itinerary with the NPS at Bettles or Coldfoot before departure."

  - question: What state is Gates of the Arctic National Park & Preserve in?
    answer: Gates of the Arctic National Park & Preserve is in [Alaska](/states/alaska), near Fairbanks, Alaska.
