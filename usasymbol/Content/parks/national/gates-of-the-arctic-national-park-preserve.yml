seo_title: "Gates of the Arctic: Hiking, Map & Visitor Guide"
seo_description: "Visit Gates of the Arctic in Alaska: roadless Brooks Range wilderness above the Arctic Circle, river floats, best time to visit, and how to get there."
intro_text: "Gates of the Arctic National Park & Preserve was established in 1980 and named for two Brooks Range peaks that explorer Robert Marshall called the 'gates of the Arctic' in 1930 — a 7,523,898-acre roadless wilderness in [Alaska](/states/alaska) above the Arctic Circle with no maintained trails or visitor facilities of any kind."

