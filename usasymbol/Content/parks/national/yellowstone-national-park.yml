  camping: |
    Yellowstone has 12 campgrounds with roughly 2,000 sites total. Four of the largest, Madison (278 sites), Canyon (273), Bridge Bay (432), and Grant Village (430), require advance reservations through Recreation.gov and fill months ahead for July and August. Mammoth Campground (85 sites) operates year-round on a first-come, first-served basis and is the only campground accessible by wheeled vehicle in winter. Norris (100 sites) and six smaller campgrounds, including Tower Fall, Indian Creek, Slough Creek, Pebble Creek, and Lewis Lake, operate first-come, first-served and can fill by late morning in peak summer.

    Backcountry camping requires a permit available in person at visitor centers starting 48 hours before the trip. Backcountry permits cannot be reserved online. Bear canisters or park-approved food storage are required at most sites; rangers provide current guidance at the permit desk.

