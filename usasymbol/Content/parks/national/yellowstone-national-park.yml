  fees_reservations: |
    The entrance fee is $35 per vehicle for a 7-day pass, $30 per motorcycle, or $20 per person on foot or bicycle. The America the Beautiful Annual Pass ($80/year) covers Yellowstone and all other federal recreation areas for 12 months and pays for itself in two Yellowstone vehicle entries.

    No timed-entry reservation is currently required to drive into the park. Campground reservations for the four major campgrounds, Madison, Canyon, Bridge Bay, and Grant Village, are made through Recreation.gov and typically fill within minutes of opening, sometimes six months out. First-come campgrounds fill by late morning on summer weekends. Backcountry permits are issued in person only, starting 48 hours before the trip.

    Fishing requires a separate Yellowstone-specific permit (not a state license), available at visitor centers and ranger stations.

    Confirm current fees and rules at the official park page: nps.gov/yell.

  getting_there: |
    **By car:** Five entrances reach the park. The West Entrance (West Yellowstone, MT, US-20) is closest to the geyser basins and the busiest in summer. The North Entrance (Gardiner, MT, US-89) is the only entrance open to wheeled vehicles year-round. The South Entrance (US-89/191/287) connects Yellowstone to Grand Teton National Park and is convenient for visitors combining both. The East Entrance (US-20, about 52 miles from Cody, WY) and Northeast Entrance (US-212, Cooke City, MT) are less congested options.

    **By air:** Bozeman Yellowstone International Airport (BZN) is about 90 miles from the West Entrance. Jackson Hole Airport (JAC) is about 60 miles from the South Entrance. Both have rental cars on site; no scheduled shuttle serves either entrance.

    **By snowcoach or snowmobile (winter):** From mid-December through early March, interior roads are closed to wheeled vehicles. NPS-authorized operators run guided snowcoach tours from West Yellowstone and Mammoth to Old Faithful and the interior. Unguided snowmobile access requires a permit on designated roads.

  geology: |
    Yellowstone sits above one of the world's most active volcanic hotspots, a plume of superheated rock rising from deep in the Earth's mantle. Three massive eruptions have occurred over the past 2.1 million years; the most recent, about 640,000 years ago, released enough ash to alter global climate. The resulting Yellowstone Caldera, about 30 by 45 miles wide, forms the central basin of the park. The caldera floor has risen and fallen measurably in recent decades, driven by magma and hydrothermal fluid movement.

    The hydrothermal system is powered by groundwater that seeps down, heats near the magma chamber, and rises back to the surface. Geysers form where a narrow underground constriction traps heated water until pressure triggers an eruption; hot springs arise where water rises freely without that constriction. Mudpots form where acidic steam breaks down surface rock into clay; fumaroles vent steam directly where water is too scarce to pool.

    The Grand Canyon of the Yellowstone opened after the last glaciation when the river cut through rhyolite that hydrothermal activity had chemically softened. The canyon walls show yellow and red staining from iron oxidation, the color that likely gave the Yellowstone River its name. Lower Falls drops 308 feet and is one of the tallest waterfalls in the Rocky Mountain region.

    Yellowstone Lake occupies a depression in the caldera. The lakebed holds active hydrothermal vents, and a dormant lava dome called Mary Bay rises from the northern floor. At 7,733 feet elevation and 136 square miles, it is the largest high-elevation lake in North America.

  wildlife: |
    Wolves were reintroduced to Yellowstone in January 1995, when 31 wolves from Alberta, Canada, were released into the Lamar Valley. The population grew to roughly 100 animals in the park and more than 500 in the Greater Yellowstone Ecosystem. Their return reshaped elk movement patterns and allowed willows and aspens to recover in stream valleys, a process ecologists call a trophic cascade. Lamar Valley remains the best place in the park to see wolf packs, especially at dawn.

    Grizzly bears number about 700 in the Greater Yellowstone Ecosystem. They emerge from dens in March and April and are most visible in spring digging for roots and in early summer catching spawning cutthroat trout in park streams. Black bears are also present, mostly in forested areas. Both species require 100 yards of distance; carry bear spray on any off-boardwalk trail.

    Yellowstone holds the largest free-roaming bison herd in North America, about 5,000 animals, visible year-round across the park's valleys and geothermal areas. Elk number in the tens of thousands and concentrate in the northern range in winter. Pronghorn, moose, bighorn sheep, bald eagles, osprey, and sandhill cranes round out the species commonly seen from spring through fall.

  history: |
    Indigenous peoples have lived in and traveled through the Yellowstone region for at least 11,000 years. The Shoshone-Bannock, Crow, Blackfeet, Nez Perce, and other nations used the area for hunting, gathering, and ceremony. The Sheepeaters, a band of Eastern Shoshone, were the only group known to have lived in the park year-round before Euro-American contact.

    John Colter, a fur trapper who had traveled west with the Lewis and Clark Expedition, is the first Euro-American known to have seen Yellowstone's hydrothermal features, during a solo winter journey in 1807-1808. His accounts of boiling springs and erupting geysers were widely disbelieved for decades.

    The 1870 Washburn-Langford-Doane Expedition provided the first systematic documentation of the park's features. A year later, Ferdinand Hayden led a federal survey that included landscape painter Thomas Moran and photographer William Henry Jackson. Their images and paintings were shown to Congress and helped persuade legislators to act. President Ulysses S. Grant signed the Yellowstone National Park Protection Act on March 1, 1872, creating the world's first national park.

    The U.S. Army administered the park from 1886 to 1918, building its first roads and protecting it from poachers who had hunted the last bison nearly to extinction. Wolf eradication campaigns eliminated the last wolves from the park by 1926. The reintroduction of 31 wolves in 1995, over strong regional opposition, became one of the most studied conservation interventions in U.S. history.

faq:
  - question: "Where is Yellowstone National Park?"
    answer: "Yellowstone spans northwestern Wyoming, southern Montana, and eastern Idaho. The West Entrance at West Yellowstone, Montana, is the most-used entry point, about 90 miles from Bozeman Yellowstone International Airport (BZN)."
  - question: "When is the best time to visit Yellowstone?"
    answer: "Fall (September-October) offers the best balance: thinning crowds, elk rut, and active wolf packs in Lamar Valley. Summer gives the most access but heavy congestion. Spring is good for wildlife but many roads stay closed into May. Winter is quiet and requires snowcoach or snowmobile access to the interior."
  - question: "How much does it cost to enter Yellowstone?"
    answer: "The entrance fee is $35 per vehicle for a 7-day pass, $30 per motorcycle, or $20 per person on foot or bicycle. The America the Beautiful Annual Pass ($80) covers Yellowstone and all U.S. national parks for one year. Confirm current fees at nps.gov/yell."
  - question: "Do I need a reservation to visit Yellowstone?"
    answer: "No timed-entry reservation is currently required to drive into the park. Campground reservations at the four major campgrounds are made on Recreation.gov and fill months in advance for summer. First-come campgrounds fill by late morning on peak days. Backcountry permits are in-person only."
  - question: "What time does Old Faithful erupt?"
    answer: "Old Faithful erupts roughly every 44 to 125 minutes. The Old Faithful Visitor Education Center posts the next predicted eruption time, accurate within about 10 minutes. Arrive at least 20 minutes early to get a seat on the boardwalk benches."
  - question: "What wildlife can I see in Yellowstone?"
    answer: "About 5,000 bison roam the park year-round. Roughly 100 wolves and 700 grizzly bears live in the Greater Yellowstone Ecosystem. Lamar Valley in the northeast is the best spot for wolves and grizzlies, especially at dawn. Stay at least 100 yards from wolves and bears and 25 yards from bison."
  - question: "Can I swim in Yellowstone's hot springs?"
    answer: "No. Swimming in hydrothermal features is illegal and has caused severe burns and deaths. The Boiling River near Mammoth, where a hot spring mixes with the Gardner River, is the only authorized soaking area. Check current conditions at the visitor center, as it closes seasonally."

