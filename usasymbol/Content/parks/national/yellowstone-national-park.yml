  hiking: |
    **Easy**: The Upper Geyser Basin Loop covers 1.5 miles of boardwalk past Old Faithful and a dozen neighboring geysers on paved, accessible surface. It is the best walk for visitors who want to see multiple erupting features in one circuit without significant elevation gain.

    **Easy-Moderate**: Mystic Falls Trail (2.6 miles round trip, 200 ft gain) starts at Biscuit Basin and passes active geothermal features before reaching a 70-foot waterfall in the forest. Fairy Falls Trail (5.4 miles round trip, minimal gain) is a nearly flat walk to a 197-foot waterfall with an optional spur to the Grand Prismatic Spring overlook, the best angle for seeing the hot spring's full color pattern.

    **Moderate**: Bunsen Peak Trail (4.6 miles round trip, 1,300 ft gain) reaches an open summit with wide views north toward Mammoth Hot Springs. Carry water; the exposed ridge has no shade.

    **Strenuous**: Mount Washburn (6.4 miles round trip, 1,400 ft gain to 10,243 ft) is the most popular summit hike and the best place to see the extent of the Yellowstone Caldera. Uncle Tom's Trail (0.5 miles round trip) descends 300 metal stairs to a platform near the base of Lower Falls; the steps are steep and slick when wet, so traction matters. Afternoon thunderstorms develop quickly on both exposed routes; start early and watch for weather.

