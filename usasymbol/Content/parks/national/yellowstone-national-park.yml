sections:
  overview: |
    Yellowstone National Park, established March 1, 1872, was the world's first national park and covers 2,219,791 acres across Wyoming, Montana, and Idaho. The park sits above an active supervolcano and holds more than 10,000 hydrothermal features, including geysers, hot springs, mudpots, and fumaroles, more than anywhere else on Earth. Nearly 3.9 million visitors come each year, placing it seventh among U.S. national parks. Five entrances reach the park; the West Entrance at West Yellowstone, Montana, is the busiest and closest to the main geyser basins.

  known_for: |
    **Old Faithful**: The park's most famous geyser erupts roughly every 44 to 125 minutes, sending about 8,400 gallons of water up to 184 feet high. Eruption predictions posted at the visitor center are accurate to within about 10 minutes.
    **Grand Prismatic Spring**: At roughly 370 feet wide, it is the largest hot spring in the United States. The vivid color rings come from heat-tolerant microorganisms called thermophiles living in the different temperature zones.
    **Lamar Valley wildlife**: The broad open valley in the northeast corner offers some of the best large mammal watching in North America, with regular sightings of wolves, grizzly bears, bison, and pronghorn.
    **500-plus geysers**: Yellowstone contains about half of the world's active geysers, concentrated across several basins along the Grand Loop Road.

  best_things_to_see_items:
    - name: "Old Faithful"
      description: "Old Faithful erupts on a schedule posted at the Old Faithful Visitor Education Center, with predictions accurate to within about 10 minutes. The boardwalk viewing area circles the geyser cone and fills fast before each predicted eruption. Arriving 20 minutes early secures a front-row spot on the benches."
      image: "/images/parks/national/yellowstone-national-park/08-best-old-faithful.jpg"
      alt: "A crowd of people standing along a wooden boardwalk watches a geyser erupt."
      credit: "NPS/Jim Peaco"
    - name: "Grand Prismatic Spring"
      description: "Grand Prismatic Spring is about 370 feet across and sits in the Midway Geyser Basin, 6 miles north of Old Faithful. A boardwalk loops the basin for a ground-level view of the vivid color rings. The Fairy Falls Trail provides an elevated overlook from a hillside where the full color pattern is visible."
      image: "/images/parks/national/yellowstone-national-park/09-best-grand-prismatic-spring.jpg"
      alt: "A visitor stands on a boardwalk near a hot spring and a lake."
      credit: "NPS/Diane Renkin"
    - name: "Lamar Valley"
      description: "A broad glacially carved valley in the park's northeast corner offers some of North America's most reliable large mammal viewing. Wolves, grizzly bears, bison herds, pronghorn, and coyotes are regularly seen from road pull-outs along the Lamar Valley road. Dawn and dusk produce the most animal activity; bring binoculars or a spotting scope."
      image: "/images/parks/national/yellowstone-national-park/10-best-lamar-valley-wolf.jpg"
      alt: "A wolf howls while standing on a snowy field."
      credit: "NPS/Jim Peaco"
    - name: "Mammoth Hot Springs"
      description: "Mammoth Hot Springs is a terrace of travertine built by hot water depositing calcium carbonate as it surfaces and cools. The active terraces change shape and color from season to season as mineral flows shift. Upper and Lower Terrace boardwalk loops cover the main formations and the area is open year-round."
      image: "/images/parks/national/yellowstone-national-park/13-best-mammoth-hot-springs.jpg"
      alt: "A visitor standing on a boardwalk watches the sunrise through mist rising from the Mammoth Hot Springs."
    - name: "Grand Canyon of the Yellowstone"
      description: "The Yellowstone River carved a canyon 20 miles long and up to 1,200 feet deep through hydrothermal-weakened rhyolite. Lower Falls drops 308 feet, nearly twice the height of Niagara Falls, and is visible from Artist Point on the South Rim and Lookout Point on the North Rim. Uncle Tom's Trail descends 300 steel stairs to a platform near the base of the falls."
      image: "/images/parks/national/yellowstone-national-park/11-best-grand-canyon-lower-falls-artist-point.jpg"
      alt: "Lower Falls of the Yellowstone"
      credit: "NPS/Jim Peaco"
    - name: "Norris Geyser Basin"
      description: "Norris is the hottest and most geologically dynamic basin in the park. Steamboat Geyser here is the world's tallest active geyser, capable of eruptions exceeding 300 feet, though timing is irregular and unpredictable. Two boardwalk loops, Porcelain Basin and Back Basin, cover distinct terrain types in about 2.5 miles total."
      image: "/images/parks/national/yellowstone-national-park/14-best-norris-geyser-basin.jpg"
      alt: "Visitors walk on a boardwalk that goes through a hydrothermal area"
    - name: "Yellowstone Lake"
      description: "At 7,733 feet elevation and 136 square miles, Yellowstone Lake is the largest high-elevation lake in North America. Bridge Bay Marina rents rowboats and offers guided fishing trips; cutthroat trout fishing requires a Yellowstone-specific permit available at visitor centers. The lake's north shore has active hydrothermal features visible from the road."
      image: "/images/parks/national/yellowstone-national-park/12-best-yellowstone-lake-rainbow.jpg"
      alt: "A rainbow is produced by a storm cell over a large lake with mountains in the background"
      credit: "NPS/Diane Renkin"

