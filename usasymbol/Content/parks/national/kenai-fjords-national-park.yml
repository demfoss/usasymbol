sections:
  overview: |
    Kenai Fjords National Park covers 669,984 acres on the southern end of the Kenai Peninsula, about 125 miles south of Anchorage. The Harding Icefield, one of the largest icefields in the United States at roughly 700 square miles, feeds nearly 40 named glaciers, several of which reach the sea as tidewater glaciers. Exit Glacier, accessible by paved road from Seward, is the park's single land entry point; the fjords, islands, and tidewater glaciers are reached by boat tour from Seward's small boat harbor. Entry to the park is free.

  known_for: |
    - **Harding Icefield**: One of the largest icefields in the US, spanning roughly 700 square miles of the Kenai Mountains and feeding nearly 40 glaciers. The Harding Icefield Trail from Exit Glacier is considered one of Alaska's best day hikes.
    - **Tidewater glaciers**: Several glaciers in Aialik Bay and Northwestern Fjord reach the sea and actively calve icebergs into the water, audible as cannon-shot cracks and visible from boat tours.
    - **Marine wildlife**: The park's cold, nutrient-rich waters support humpback whales, orcas, Steller sea lions, sea otters, Dall's porpoise, and dense seabird colonies including tufted puffins.
    - **Exit Glacier retreat**: Dated wooden stakes along the Exit Glacier nature trail mark the glacier's historical position from the 1800s to the present, showing over a mile of retreat since 1815.


  best_things_to_see_items:
    - name: "Harding Icefield Trail"
      description: "An 8.2-mile round-trip climb of 3,000 feet above Exit Glacier leads to the edge of the Harding Icefield, where the full expanse of ice and surrounding peaks stretches to the horizon. The upper trail crosses open snowfields even in summer; gaiters and trekking poles are recommended. Allow 6 to 8 hours and watch for changing weather."
      image: "/images/parks/national/kenai-fjords-national-park/06-harding-icefield-trail.jpg"
      alt: "A person looks at a wide view of an icefield with mountains sticking out from the ice"
    - name: "Exit Glacier"
      description: "Exit Glacier descends from the Harding Icefield to within walking distance of Seward. Dated stakes along the nature trail show the glacier's former extent each decade from 1815 to the present; the glacier has retreated over a mile in that time. An accessible paved path leads to within 200 feet of the current ice face."
      image: "/images/parks/national/kenai-fjords-national-park/07-exit-glacier.jpg"
      alt: "Chunks of glacier ice line a creek from Exit Glacier"
      credit: "NPS Photo/ J. Rodrigues"
    - name: "Tidewater Glacier Boat Tour"
      description: "Full-day boat tours from Seward's small boat harbor reach Aialik Bay and Northwestern Fjord, where Holgate Glacier and Aialik Glacier calve icebergs directly into the sea. Half-day tours reach Resurrection Bay sea lion rocks and puffin colonies. Multiple licensed operators depart daily from late May through September."
      image: "/images/parks/national/kenai-fjords-national-park/08-tidewater-glacier-boat-tour.jpg"
      alt: "People view large tidewater glacier from boat"
      credit: "NPS Photo"
    - name: "Whale Watching in Resurrection Bay"
      description: "Humpback whales feed in Resurrection Bay and the Gulf of Alaska from May through October, and boat tours commonly encounter them alongside Dall's porpoise and sea otters. Orcas (killer whales) appear less predictably but are recorded regularly. Most boat tour operators have naturalist guides who identify species and explain the ecosystem."
      image: "/images/parks/national/kenai-fjords-national-park/09-whale-watching-in-resurrection-bay.jpg"
      alt: "a humpback whale breaches"
      credit: "NPS Photo/Thoresen"
    - name: "Seabird Rookeries"
      description: "The rocky islands and sea cliffs of Kenai Fjords support some of the largest seabird colonies in Alaska. Tufted and horned puffins, common murres, black-legged kittiwakes, and pelagic cormorants nest in dense colonies visible from boat tours. The Chiswell Islands in the Alaska Maritime National Wildlife Refuge, adjacent to the park, hold some of the most accessible colonies."
      image: "/images/parks/national/kenai-fjords-national-park/10-seabird-rookeries.jpg"
      alt: "Black-legged kittiwakes at Chiswell Islands."
    - name: "Kayaking near Exit Glacier or in the Fjords"
      description: "Guided sea kayaking trips operate both from Seward and from water-taxi drop-offs in Aialik Bay. Paddling beside tidewater glacier faces and through iceberg-dotted coves is the most immersive way to experience the fjords. Multi-day trips camping on park beaches are possible for experienced kayakers; permits are not required but registration with the visitor center is recommended."
      image: "/images/parks/national/kenai-fjords-national-park/11-kayaking-near-exit-glacier-or-in-the-fjords.jpg"
      alt: "A person paddles with a large tidewater glacier in the distance"
      credit: "NPS Photo"

  best_time_to_visit: |
    **Spring (May-June)** marks the opening of boat tour season, typically in late May. Wildlife is highly active: humpback whales arrive from wintering grounds, sea otters nurse pups, and seabird colonies are at peak nesting activity. Exit Glacier trails open as snow recedes, and the Harding Icefield Trail is often snow-covered above 2,000 feet through June.

    **Summer (July-August)** is peak season. All boat tours operate on full schedules, Exit Glacier is accessible day and night in Alaska's long daylight, and the Harding Icefield Trail is at its most accessible. Seward fills on weekends; book lodging months in advance.

    **Fall (September-October)** brings fall color to the hillsides around Seward and continued whale activity as humpbacks feed heavily before migration. Boat tours run into September but schedules thin after Labor Day. The Harding Icefield Trail closes as snow returns to upper elevations.

    Exit Glacier Road remains open for snowshoeing and skiing in winter, but most park visitor infrastructure closes October through April.

  hiking: |
    **Easy trails** at Exit Glacier suit all fitness levels. The Edge of the Glacier Trail is a paved, partially accessible 0.5-mile path leading to within 200 feet of the glacier face, with dated stakes marking historical ice positions along the way. The Glacier View Loop adds 0.8 miles and ~100 feet of gain for wider views across Exit Creek to the glacier.

    **Moderate trails** gain elevation into the forest and lower alpine zone. The Overlook Loop covers 3.2 miles with about 500 feet of gain, reaching viewpoints above the glacier where the full lower icefall comes into view. Bears use all Exit Glacier trails; make noise and carry bear spray.

    **Strenuous trails** are represented by one route: the Harding Icefield Trail, 8.2 miles round trip with 3,000 feet of gain from the Exit Glacier trailhead to the edge of the icefield. The upper section crosses permanent snowfields; gaiters and trekking poles are strongly recommended. Allow 6 to 8 hours, start early to beat afternoon weather, and turn back if clouds move in above the treeline.

  camping: |
    Exit Glacier Campground has roughly 12 walk-in tent sites at the base of the Exit Glacier trail system, open June through September. Sites are free and first-come first-served with no reservation option. Vault toilets, water, and a food storage area are available. The campground fills on busy summer weekends.

    Beach and backcountry camping is permitted throughout the fjords section with no fee and no permit required, though registration at the visitor center is recommended. Sites are accessible only by boat or kayak. No facilities exist in the fjords backcountry; carry out all waste and hang or canister food because of brown bear activity along the coast.

  fees_reservations: |
    Park entry is free. Exit Glacier Campground is free with no reservation system; sites are first-come first-served. No timed-entry permits are required for any part of the park.

    Boat tours are sold by private operators and are the main expense for most visitors. Half-day tours from Seward run approximately $100-$130 per person; full-day tours to the outer fjords cost roughly $175-$225 per person. Tours book up in July and August; reserve seats several weeks in advance.

    Confirm current fees and rules at the official park page at nps.gov/kefj.

  getting_there: |
    **By car from Anchorage**: Drive south on the Seward Highway (AK-1 to AK-9), a 125-mile, roughly 2.5-hour route. The highway follows Turnagain Arm and is scenic but narrow in places. Exit Glacier is 8 miles from Seward on Exit Glacier Road (Herman Leirer Road).

    **By train**: The Alaska Railroad runs a seasonal Glacier Discovery train from Anchorage to Seward with a travel time of about 4 hours. The train operates daily in summer and is a popular alternative to driving the Seward Highway.

    **By air**: Ted Stevens Anchorage International Airport (ANC) is 125 miles from Seward. No commercial flights serve Seward directly; a car rental or shuttle from Anchorage is required.

  geology: |
    The Harding Icefield is a remnant of the Pleistocene ice sheet that once covered most of southern Alaska. At roughly 700 square miles and up to 3,000 feet thick, it is one of the largest icefields in the United States. The nunataks, isolated mountain peaks poking through the ice surface, mark the highest points of the buried Kenai Mountains below.

    The fjords themselves are glacially carved valleys that filled with seawater as the glaciers retreated and global sea levels rose after the last ice age. The steep walls and narrow inlets typical of the park's coastline preserve the U-shaped cross-sections that identify glacial carving. Active uplift from the 1964 Good Friday Earthquake, the most powerful recorded in North American history at 9.2 magnitude, raised parts of the coastline by as much as 6 feet and killed coastal forests in areas of sudden uplift.

    Exit Glacier is retreating measurably each year. The NPS has maintained dated stakes since the 1970s showing the glacier's annual terminus position; the record shows the glacier has retreated more than a mile since 1815 and is currently losing ground at an accelerating rate. The freshly exposed rock behind the glacier shows the succession from bare moraine to alder thicket to spruce forest in compressed time.

    Tidewater glaciers behave differently from land-terminating glaciers: where the ice meets deep seawater, the buoyancy and wave action accelerate calving, causing periodic large ice releases that produce waves and floating bergs. Holgate and Aialik glaciers in the park's outer fjords are among the most active calving glaciers accessible to boat tours in Alaska.

  wildlife: |
    Humpback whales are the park's most sought marine mammal, feeding in Resurrection Bay and the outer fjords from May through October. They are commonly seen breaching and lunge-feeding from boat tours. Orcas appear less predictably but are recorded regularly; transient orcas hunt harbor seals and sea otters along the coastline.

    Steller sea lions haul out in large numbers on the Chiswell Islands and other rocky outcrops near the park boundary. Sea otters raft in Resurrection Bay year-round, often floating on their backs with pups on their chests. Harbor seals rest on ice floes that calve from tidewater glaciers; the glacier ice keeps the water cold and reduces the shark predation that affects Pacific seals farther south.

    Mountain goats are visible on near-vertical cliffs near the tidewater glaciers, where they use mineral licks exposed by glacial retreat. Black bears and brown bears forage along the coast and near Exit Glacier. The park's seabird colonies include tufted puffins, horned puffins, common murres, pigeon guillemots, and black-legged kittiwakes.

  history: |
    The Sugpiaq (Alutiiq) people occupied the Kenai Peninsula coast for at least 4,000 years, building villages around reliable salmon runs and marine mammal hunting. Russian fur traders reached the area in the late 1700s and established a presence at what is now Seward. Sea otter pelts drove the initial European interest, and hunting depleted otter populations severely before protection came in the twentieth century.

    American settlement of Seward began in 1903 as a railroad terminus for the Alaska Central Railway. The town grew as a supply port, and commercial fishing became the economic base for the region. The March 27, 1964, Good Friday Earthquake destroyed much of Seward's waterfront when the shaking triggered a submarine landslide and tsunami. The event permanently changed the coastal geography of the park area.

    Congress created Kenai Fjords National Park on December 2, 1980, under the Alaska National Interest Lands Conservation Act. The park was designed to protect both the Harding Icefield ecosystem and the coastal fjord environment, recognized as globally significant for marine wildlife and glacial science.

