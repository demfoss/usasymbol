faq:
  - question: "Where is Kenai Fjords National Park?"
    answer: "Kenai Fjords National Park is on the southern Kenai Peninsula in south-central Alaska, about 125 miles south of Anchorage. The gateway town is Seward, Alaska. Exit Glacier, the park's only road-accessible feature, is 8 miles from downtown Seward."
  - question: "How do you get to Kenai Fjords?"
    answer: "Drive the Seward Highway from Anchorage (about 2.5 hours) or take the Alaska Railroad scenic train (about 4 hours). The fjords themselves are only accessible by boat tour or kayak from Seward's small boat harbor."
  - question: "Is Kenai Fjords National Park free?"
    answer: "Yes, park entry is free. Exit Glacier Campground is also free. The main costs are boat tours, which range from about $100 for a half-day Resurrection Bay tour to $175-$225 for a full-day trip to the outer fjords."
  - question: "What is the best time to visit Kenai Fjords?"
    answer: "July and August offer the best combination of weather, wildlife activity, and full boat tour schedules. May and June are good for serious wildlife watchers with fewer crowds. Avoid expecting full services before late May."
  - question: "Can you see glaciers at Kenai Fjords?"
    answer: "Yes. Exit Glacier is reachable by a short walk from the road; dated stakes show its retreat from the 1800s to the present. Full-day boat tours reach Holgate Glacier and Aialik Glacier in the outer fjords, where active calving produces icebergs."
  - question: "What wildlife can you see at Kenai Fjords?"
    answer: "Humpback whales, orcas, sea otters, Steller sea lions, harbor seals, Dall's porpoise, mountain goats, black and brown bears, and large seabird colonies including tufted puffins. Marine mammals are best seen on boat tours from Seward."
  - question: "Do you need a reservation to visit Kenai Fjords?"
    answer: "No reservation is required for park entry. Exit Glacier Campground is first-come first-served. Boat tours require advance reservations in July and August; book several weeks ahead through licensed operators in Seward."

