intro_text: "Kenai Fjords National Park protects 669,984 acres of the southern Kenai Peninsula in Alaska, where the Harding Icefield feeds nearly 40 glaciers flowing toward the Pacific. Exit Glacier, 8 miles from Seward, is the only road-accessible part of the park; the rest is reached by boat across a coastline of tidewater glaciers, deep fjords, and seabird rookeries."

