faq:
  - question: "Where is Death Valley National Park?"
    answer: "Death Valley is in eastern California, about 120 miles northwest of Las Vegas, Nevada. The main visitor hub at Furnace Creek is roughly 2 hours from Las Vegas via US-95 and CA-190, or about 4 hours from Los Angeles via I-15. The nearest major airport is Harry Reid International (LAS) in Las Vegas. There is no public transportation to the park; a rental car is required."
  - question: "When is the best time to visit Death Valley?"
    answer: "November through March offers the most comfortable temperatures for hiking and exploring the valley floor, typically 60–80 °F during the day. Spring (February through April) adds wildflowers and is the most popular season; popular sites can be very crowded. Summer (May through September) is life-threatening on the valley floor, with temperatures regularly exceeding 115 °F. High-elevation areas like Wildrose and Telescope Peak remain accessible in summer."
  - question: "How much does it cost to enter Death Valley?"
    answer: "Entry costs $30 per vehicle for a 7-day pass, $25 per motorcycle, or $15 per person on foot or bicycle. The America the Beautiful Annual Pass ($80) covers entry to all national parks for a year. Pay at the entrance stations on Highway 190 or Highway 178; keep the receipt in your vehicle."
  - question: "Is Death Valley safe to visit in summer?"
    answer: "The valley floor is dangerous in summer. Temperatures regularly reach 115–120 °F, and the NPS advises against hiking below 2,000 feet between 10 a.m. and 4 p.m. from May through September. Heat-related deaths occur nearly every year. If visiting in summer, carry at least 1 gallon of water per person per day, hike only at dawn, and never rely on a single vehicle in a remote area. High-elevation areas above 5,000 feet, such as Wildrose Campground, are manageable."
  - question: "What is the lowest point in Death Valley?"
    answer: "Badwater Basin, at 282 feet (86 m) below sea level, is the lowest point in North America. A boardwalk from the parking area leads onto the salt flat; a sign marking sea level is visible on the canyon wall hundreds of feet above the parking area. Badwater is accessible year-round but best visited before 9 a.m. in summer."
  - question: "Are there campgrounds in Death Valley?"
    answer: "Yes. Death Valley has several NPS campgrounds. Furnace Creek Campground (136 sites, $22/night) is the main site and requires reservations October through April via Recreation.gov. Sunset, Stovepipe Wells, and Mesquite Spring campgrounds are first-come, first-served. Wildrose and Mahogany Flat campgrounds are free, at higher elevation, and the only viable options in summer. No campgrounds have electrical hookups."
  - question: "What is the Racetrack and how do you get there?"
    answer: "Racetrack Playa is a dry lake bed in the northern park where rocks move across the surface on their own, leaving visible tracks. The movement occurs when a thin layer of ice forms under the rocks in winter and wind pushes them across the wet surface. The playa is 28 miles from Ubehebe Crater on an unpaved road; a high-clearance vehicle is required, and tire pressure should be reduced for the gravel surface. The drive takes about 1.5 hours each way."

