seo_title: "Death Valley National Park: Map, Things to Do & Best Time"
seo_description: "Visit Death Valley National Park in California: the hottest, driest place in North America, top hikes, best time to go, fees, and how to get there."
intro_text: "Death Valley National Park covers 3,422,024 acres of desert basin and mountain in California and Nevada — the largest national park in the contiguous United States, established in 1994 from a national monument that dates to 1933. Badwater Basin, at 282 feet below sea level, is the lowest point in North America, and the park holds the world's highest reliably recorded air temperature of 134 °F (56.7 °C)."

