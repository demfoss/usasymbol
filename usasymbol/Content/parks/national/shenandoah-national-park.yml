  camping: |
    Four campgrounds serve the park at different points along Skyline Drive. Big Meadows Campground near milepost 51 is the largest and most central, with 217 sites at 3,510 feet; it offers the best access to the visitor center, wayside, and waterfall trails. Matthews Arm Campground in the northern district near milepost 22 has 179 sites and operates from late spring through late fall. Loft Mountain Campground in the southern district near milepost 79 has 193 sites and runs a similar season. Lewis Mountain Campground near milepost 57 is the smallest with 32 sites and offers a quieter alternative near the central park. Reservations are required at all campgrounds from May through October via recreation.gov; Big Meadows sells out weeks in advance for fall foliage weekends. Some sites at each campground remain first-come in the shoulder season. Backcountry camping is permitted with a free self-issued permit, available at the park entrance stations or the visitor centers.

