  getting_there: |
    By car, the north entrance is at Front Royal, Virginia, where US-340 meets Skyline Drive. From Washington D.C., take I-66 west to US-340 south; the drive is about 75 miles and takes roughly 90 minutes. The south entrance at Rockfish Gap is near Waynesboro, Virginia, at the junction of I-64 and US-250. Two central entrances on US-211 near Luray (Swift Run Gap) and on US-33 (Thornton Gap) provide mid-park access. Dulles International Airport (IAD) is about 75 miles from the Front Royal entrance. No public transit serves the park. Old Rag has a separate trailhead off VA-600 near Etlan, Virginia, outside the park boundary.

  geology: |
    The Blue Ridge Mountains are among the oldest ranges on Earth. The core of Shenandoah is built from Precambrian basement rock, including ancient granite and greenstone, some dating to about 1.1 billion years ago. The greenstone, visible at many trail cuts and outcrops, formed from lava flows that erupted onto a prehistoric sea floor. These rocks were later compressed and folded by the Appalachian orogeny — a series of continental collisions between roughly 480 and 300 million years ago — that pushed the Blue Ridge to heights comparable to the modern Alps.

    The smooth, rounded profiles of the ridge today reflect hundreds of millions of years of erosion. The hard greenstone resists weathering better than the limestone and dolomite that underlies the Shenandoah Valley to the west, which is why the valley sits lower than the ridge. Old Rag Mountain's distinctive granite knobs and boulder fields represent a separate intrusive rock mass that has been more slowly exhumed from the surrounding landscape.

    Thin soils and the high annual rainfall common on the ridge support a dense oak-hickory and tulip poplar forest that has regrown almost entirely since the farmlands and logged slopes of the early twentieth century were left to recover. In less than a century, the landscape has transitioned from open fields to mature second-growth forest — one of the most visible examples of ecological recovery in the eastern United States.

  wildlife: |
    Black bears are the most talked-about wildlife in the park. Shenandoah has an estimated 700 bears — roughly one for every 285 acres — giving it one of the highest black bear densities in the eastern United States. Bears are seen regularly in campgrounds, along trails, and at meadow edges from spring through fall. Store all food in bear-proof containers or vehicles; bears have broken into tents and packs. Feeding bears is illegal and carries a substantial fine.

    White-tailed deer are visible at nearly every overlook and meadow, particularly at Big Meadows at dawn and dusk. Wild turkeys cross the Drive regularly, especially in the southern district. Peregrine falcons were extirpated from the Appalachians by DDT in the mid-twentieth century; a reintroduction program in the 1980s succeeded, and falcons now nest on several cliff faces in the park, including Hogback Mountain and Stony Man.

    Woodland songbirds are abundant from May through August. The park lies within the breeding range of more than 200 species; scarlet tanagers, wood thrushes, and various warblers are common in the forest interior. Brook trout, native to the Appalachian streams, remain in several cold, clear tributaries in the northern district; fishing requires a Virginia fishing license.

  history: |
    The Blue Ridge was inhabited for thousands of years by ancestral Siouan-speaking peoples before European settlers arrived in the early eighteenth century. By the mid-1800s, the hollows and ridge flanks supported several hundred families who farmed small plots, kept orchards, and grazed livestock on the open ridge. The land was also extensively logged for charcoal production feeding the iron furnaces that operated throughout the region into the late nineteenth century.

    The idea for a national park in the southern Appalachians circulated in conservation circles from the early twentieth century. Congress authorized the park in 1926, but Virginia was required to purchase and donate the land — unlike western parks established on federal territory. The state condemned roughly 3,000 separate land parcels to assemble the park boundary. Between 1934 and 1938, approximately 500 families were relocated, many involuntarily. A small number of residents with life tenancy agreements remained until their deaths. The displacement of the mountain communities remains a contested and painful chapter in the park's history.

    President Franklin Roosevelt dedicated the park on July 3, 1936, from Big Meadows. The Civilian Conservation Corps built most of the park's infrastructure, including Skyline Drive, the stone overlook walls, the lodge at Skyland, and Big Meadows Lodge, between 1933 and 1942. Roosevelt's predecessor, Herbert Hoover, had maintained a summer camp called Camp Rapidan in the park's headwaters; it is still accessible by trail and remains a national historic landmark.

