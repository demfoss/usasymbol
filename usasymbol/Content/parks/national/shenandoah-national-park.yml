faq:
  - question: "Where is Shenandoah National Park?"
    answer: "Shenandoah National Park is in northern Virginia along the Blue Ridge Mountains. The main north entrance is at Front Royal, about 75 miles from Washington D.C. via I-66 west to US-340."
  - question: "When is the best time to visit Shenandoah?"
    answer: "Fall foliage, typically the last two weeks of October, is the park's busiest and most popular period. Spring (April–May) is the best time for wildflowers and waterfalls with fewer crowds. Summer is good for hiking but the busiest campground season."
  - question: "Do you need reservations for Shenandoah National Park?"
    answer: "No timed-entry permit is required to drive Skyline Drive or enter the park. Old Rag Mountain requires a separate day-use ticket from recreation.gov ($1 processing fee). Campsite reservations are required from May through October."
  - question: "How long is Skyline Drive?"
    answer: "Skyline Drive is 105 miles long, running from Front Royal in the north to Rockfish Gap in the south at the Virginia border with the Blue Ridge Parkway. The posted speed limit is 35 mph; a full-length drive without stops takes about 3 hours."
  - question: "Is Old Rag Mountain hard to hike?"
    answer: "Old Rag is the most challenging popular hike in the park. The 9-mile loop gains 2,800 feet and includes a rock scramble near the summit that requires hand-and-foot movement through boulders and narrow passages. A day-use ticket from recreation.gov is required and sells out months in advance for weekends."
  - question: "Are dogs allowed at Shenandoah National Park?"
    answer: "Yes. Pets on leash (6-foot maximum) are allowed on most trails and in all developed areas. They are not permitted in the backcountry overnight without their owner, and they must be kept on leash at all times. Shenandoah has one of the more permissive pet policies in the national park system."
  - question: "How many bears are in Shenandoah National Park?"
    answer: "The park has an estimated 700 black bears, one of the highest densities in the eastern United States. Bears are seen regularly in campgrounds and along trails. Store all food in bear-proof containers or hard-sided vehicles; never leave food in a tent or pack unattended."

