  fees_reservations: |
    The 7-day vehicle pass costs $30 and covers all occupants of one private vehicle. Motorcycles pay $25 for the same window. Individuals arriving on foot or by bicycle pay $15. The America the Beautiful Annual Pass is valid here for $80. No timed-entry reservation is required to enter the park itself. Old Rag Mountain requires a separate day-use ticket through recreation.gov, available for a $1 processing fee per person; tickets are released in advance and are required year-round. Camping reservations open at recreation.gov in January for summer dates. Confirm current fees and rules at the official park page: nps.gov/shen.

