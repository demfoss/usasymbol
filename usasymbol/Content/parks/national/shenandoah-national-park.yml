sections:
  overview: |
    Shenandoah's central feature is Skyline Drive, a 105-mile paved road running the full length of the park along the Blue Ridge crest at a posted 35 mph limit, with 75 designated overlooks between Front Royal in the north and Rockfish Gap in the south. About 101 miles of the Appalachian Trail pass through the park, parallel to the Drive for most of its length. Entry costs $30 per vehicle and no timed-entry permit is required. The park draws about 1.9 million visitors per year. Pets are allowed on most trails on leash, making it one of the more pet-friendly national parks.

  known_for: |
    - Skyline Drive, a 105-mile ridge-top road with 75 overlooks above the Shenandoah Valley and Piedmont
    - Old Rag Mountain, the most popular hike in the Mid-Atlantic, with a 9-mile loop and a signature granite rock scramble
    - Peak fall foliage, typically the last two weeks of October, when the hardwood forest along the Drive turns red, orange, and gold
    - One of the highest black bear densities in the eastern United States, with an estimated 700 bears in the park

  best_things_to_see: |
    Skyline Drive connects the park's major stops by car: Dickey Ridge Visitor Center near Front Royal, Big Meadows at the midpoint, and Loft Mountain in the south. Dark Hollow Falls is the most visited waterfall, reached in under a mile from a Skyline Drive pullout. Old Rag Mountain draws hikers from across the Mid-Atlantic for its granite ridge scramble and summit views; a day-use ticket through recreation.gov is required. Whiteoak Canyon descends from Skyline Drive to a series of six waterfalls, the highest of which drops 86 feet. The Appalachian Trail intersects Skyline Drive at multiple points and is accessible for short walks or overnight sections.

  best_things_to_see_items:
    - name: "Skyline Drive"
      description: "Skyline Drive runs 105 miles from the park's north entrance at Front Royal to the south entrance at Rockfish Gap, where it connects to the Blue Ridge Parkway. The road stays near the ridge crest the entire length, with 75 overlooks facing east toward the Piedmont and west toward the Shenandoah Valley. The posted speed limit is 35 mph; a full-length drive takes about 3 hours without stops."
      image: "/images/parks/national/shenandoah-national-park/01-skyline-drive.jpg"
      alt: "A road surrounded by fall foliage turns a curve around a small waterfall."
      credit: "NPS Photo / Neal Lewis"
    - name: "Old Rag Mountain"
      description: "Old Rag is a 9-mile loop in the park's northern district that climbs 2,800 feet to a granite summit with 360-degree views. The upper mile involves a rock scramble through a boulder maze, requiring hand-and-foot movement through cracks and chimneys. A day-use ticket is required via recreation.gov and sells out on weekends months in advance; purchase before making the drive."
      image: "/images/parks/national/shenandoah-national-park/02-old-rag-hikers.jpg"
      alt: "Old Rag Hikers"
    - name: "Big Meadows"
      description: "Big Meadows sits near milepost 51 at the highest point of Skyline Drive, elevation 3,510 feet. The open meadow is one of the best wildlife-watching spots in the park; white-tailed deer graze at dusk and bears are occasionally seen at meadow edges in summer. Big Meadows has a lodge, campground, wayside, and the Harry F. Byrd Sr. Visitor Center."
      image: "/images/parks/national/shenandoah-national-park/03-big-meadows.jpg"
      alt: "Yellow and red fall meadow."
      credit: "Lara Ellis"
    - name: "Dark Hollow Falls"
      description: "Dark Hollow Falls is the most visited waterfall in the park, dropping 70 feet over greenstone ledges into a pool. The trail is 1.4 miles round trip from a parking area near Big Meadows, descending 440 feet. The hike back is entirely uphill; short but steep. Blackwater Creek provides the sound of rushing water the entire length of the trail."
      image: "/images/parks/national/shenandoah-national-park/04-dark-hollow-falls.jpg"
      alt: "A waterfall cascades into a mossy pool"
      credit: "NPS"
    - name: "Whiteoak Canyon"
      description: "Whiteoak Canyon descends from Skyline Drive through a narrow gorge holding six waterfalls on Whiteoak Run. The highest falls drop 86 feet. The trail is 4.6 miles one-way to the base of the lower falls, losing about 2,500 feet; most day hikers turn around at the upper falls after 1.8 miles. The canyon holds some of the largest hemlocks remaining in the park."
      image: "/images/parks/national/shenandoah-national-park/05-whiteoak-canyon.jpg"
      alt: "Whiteoak Canyon Trail - one of Shenandoah's most popular."
      credit: "NPS"
    - name: "Appalachian Trail Sections"
      description: "About 101 miles of the Appalachian Trail pass through Shenandoah, running roughly parallel to Skyline Drive at slightly lower elevations on the ridge. It crosses the Drive at multiple points, making short out-and-back walks easy to access from any overlook parking area. Bearfence Mountain, accessible from the AT near milepost 56, involves a short rock scramble with panoramic views and takes under an hour."
      image: "/images/parks/national/shenandoah-national-park/06-appalachian-trail.jpg"
      alt: "Hiker on the Appalachian Trail"

  best_time_to_visit: |
    **Spring (April–May):** Wildflowers peak along the lower trails and hollows from late April through May. Trillium, Virginia bluebells, and dogwood bloom in sequence as warmth moves up the mountainside. Spring brings more rain than other seasons, and morning fog often fills the valleys below the Drive overlooks. Crowds are moderate and campsite availability is good.

    **Summer (June–August):** The park is fully open and staffed. Daytime highs on the ridge reach 75–85°F, cooler than the surrounding lowlands. The forest is dense and green, and waterfalls run steadily from spring rains. July and August are the busiest months; Big Meadows Campground fills most weekends. Lightning is a risk on exposed peaks in afternoon thunderstorms.

    **Fall (September–October):** The park's peak season for both crowds and color. Fall foliage typically peaks in the last two weeks of October, when the tulip poplar, oak, and maple stands along Skyline Drive turn gold, red, and orange. Old Rag day-use tickets sell out immediately when they open for October weekends. Arrive early or visit mid-week to avoid the longest lines.

    **Winter (November–March):** Skyline Drive can close in sections during snow and ice events but reopens as conditions improve. The overlooks are sometimes accessible even when the rest of the Drive is closed. Crowds are minimal, and the bare trees open long views from the ridge that summer foliage blocks. Some campgrounds remain open seasonally.

  hiking: |
    **Easy:** Dark Hollow Falls Trail is 1.4 miles round trip from a parking area near Big Meadows, descending 440 feet to a 70-foot waterfall on Hogcamp Branch. The return is entirely uphill but short. Stony Man Trail is 1.6 miles round trip from the Stony Man parking area, gaining 340 feet to the second-highest peak in the park at 4,011 feet, with a cliff-edge view over the Shenandoah Valley. Pets on leash are welcome on both trails.

    **Moderate:** Bearfence Mountain Loop is a short 1.2-mile loop that includes a rock scramble to an open granite summit with 360-degree views; the scramble involves using hands and feet on exposed rock. The trailhead is at milepost 56.4. Hawksbill Mountain Trail climbs to the park's highest point at 4,051 feet via a 2.8-mile round trip from the Upper Hawksbill parking area, gaining about 690 feet.

    **Strenuous:** Old Rag Mountain Loop is 9 miles with 2,800 feet of gain. The rock scramble section near the summit requires navigating a granite boulder maze and crawling through narrow passages. A day-use ticket from recreation.gov is required and must be purchased in advance; tickets for fall and summer weekends sell out months ahead. Whiteoak Canyon Trail descends 4.6 miles one-way to the lower falls with 2,500 feet of elevation loss; returning to the trailhead means climbing all of it back.

