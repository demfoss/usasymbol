faq:
  - question: "Where is Arches National Park?"
    answer: "Arches is in southeastern Utah, five miles north of Moab on U.S. Route 191. The nearest commercial airport is Canyonlands Regional (CNY), about 18 miles from the park entrance."
  - question: "When is the best time to visit Arches National Park?"
    answer: "Spring (March–May) and fall (September–November) offer the most comfortable temperatures, 50–80 °F. Summer temperatures regularly exceed 100 °F and midday hiking is dangerous. Winter is quiet and the arches look striking with snow, but ice on slickrock can make trails hazardous."
  - question: "How much does it cost to enter Arches National Park?"
    answer: "The entrance fee is $30 per vehicle for a 7-day pass. Motorcycles pay $25 and individuals entering on foot or by bicycle pay $15 per person. The America the Beautiful Annual Pass ($80) covers Arches and all other U.S. national parks for 12 months. Confirm current fees at nps.gov/arch."
  - question: "Do I need a reservation to visit Arches National Park?"
    answer: "No timed-entry reservation is currently required to drive into the park by car. The Devils Garden Campground (51 sites) requires advance booking via Recreation.gov from March 1 through October 31, and the Fiery Furnace requires a separate self-guided permit. Entry reservation requirements have changed in past seasons; check nps.gov/arch before visiting."
  - question: "What is the best hike in Arches National Park?"
    answer: "The Delicate Arch Trail (3.0 miles round trip, 480 ft gain) is the most rewarding hike for most visitors. Start before 8 a.m. or after 4 p.m. in summer and carry at least 1 liter of water per person. For easier access to multiple arches, the Windows Loop (1.0-mile loop) and Landscape Arch (1.9 miles round trip) require little effort."
  - question: "How far is Arches National Park from Moab?"
    answer: "The park entrance is 5 miles north of Moab on U.S. Route 191, about a 10-minute drive. Moab serves as the main base for visiting Arches and has hotels, restaurants, gear shops, and private campgrounds."
  - question: "Are there dangerous animals or hazards in Arches?"
    answer: "Prairie rattlesnakes are present but rarely encountered; watch where you place hands and feet while scrambling. The primary hazard is heat: summer temperatures exceed 100 °F and trails have no shade. Carry at least 1 liter of water per hour of hiking in warm months. Flash floods can move through canyon washes after distant thunderstorms, especially in July and August."

