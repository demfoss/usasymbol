sections:
  overview: |
    Arches National Park sits in southeastern Utah, five miles north of Moab on U.S. Route 191. The park covers 76,679 acres of red-rock desert on the Colorado Plateau and contains more than 2,000 named natural stone arches — the highest concentration found anywhere on Earth. Delicate Arch, a 65-foot free-standing sandstone span, appears on Utah's license plate and is the park's defining landmark. Arches ranks 21st among the 63 U.S. national parks by annual visitation, drawing roughly 1.8 million visitors in 2023. One paved scenic drive runs 18 miles from the visitor center to Devils Garden, with spur roads reaching the Windows Section, Balanced Rock, and the Delicate Arch trailhead.

  known_for: |
    More than 2,000 named natural stone arches, the largest concentration on Earth, all carved from Entrada Sandstone deposited about 150 million years ago. Delicate Arch, a 65-foot free-standing sandstone span that appears on Utah license plates, reached by a 3-mile round-trip trail with 480 feet of elevation gain. Landscape Arch in Devils Garden, one of the longest natural arches in the world at roughly 306 feet span. Dark skies certified by the International Dark Sky Association, with the Milky Way core visible to the naked eye from multiple overlooks along the main road.

  best_things_to_see_items:
    - name: "Delicate Arch"
      description: "Delicate Arch is a 65-foot free-standing sandstone arch at the lip of a natural sandstone bowl, with the La Sal Mountains rising in the distance. It is the most photographed feature in the park and the symbol of Utah's outdoor identity. The trailhead sits at Wolfe Ranch, 12 miles from the visitor center; the round trip is 3 miles with 480 feet of gain on exposed slickrock."
      image: "https://www.nps.gov/arch/planyourvisit/images/DSC_0749_2.jpg?autorotate=false&format=webp&maxheight=1300&maxwidth=1300"
      alt: "A large sloping red rock face with a unique rock formation jutting out of it. It is an arch shaped like an upside U. The blue sky can be seen through the wide opening in the rock. The people standing below it look very small."
      credit: "NPS/Neal Herbert"
    - name: "Landscape Arch"
      description: "Landscape Arch spans roughly 306 feet from base to base, making it one of the longest natural stone arches in the world. The arch is thin — in 1991 a large rock slab fell from its underside, narrowing the ribbon of stone further. It stands in Devils Garden, 1.9 miles from the trailhead on a flat gravel path."
      image: "https://www.nps.gov/arch/planyourvisit/images/Landscape-Arch-Small.png?autorotate=false&maxwidth=650"
      alt: "A thin arch bridges the gap between two large rocks. The sky is blue and the desert landscaped is scattered with green vegetation."
      credit: "NPS/Neal Herbert"
    - name: "Windows Section"
      description: "The Windows Section groups four arches within a short walking distance: North Window (93 feet wide), South Window, Turret Arch, and Double Arch. The Windows Loop trail is 1 mile and requires minimal effort. Double Arch, reached by a separate 0.5-mile spur, consists of two arches sharing a single rock base — one of the largest arch spans in the park."
      image: "https://www.nps.gov/arch/planyourvisit/images/TheWindowsJacobW.jpg?autorotate=false&format=webp&maxheight=1300&maxwidth=1300"
      alt: "Expansive red rocks in different shapes and sizes, creating a wall. There are multiple arches among the wall and blue sky can be seen through them. The foreground is full of low-lying vegetation and the sky is brilliant blue."
      credit: "NPS/Jacob W. Frank"
    - name: "Balanced Rock"
      description: "Balanced Rock is a 3,577-ton boulder perched on a narrow rock pedestal 128 feet high. The formation sits near the junction of the Windows spur road, 9 miles from the visitor center. A 0.3-mile loop trail circles the base; the formation is especially striking at sunset when the rock turns deep orange."
      image: "https://home.nps.gov/arch/planyourvisit/images/14001330199_c3c118e4c7_k.jpg?autorotate=false&maxwidth=1300"
      alt: "A landscape of spread out towering rock pillars. One looks like a large boulder is balancing on a pedestal. The rocks are red and are glowing from a rising sun. The sky is blue and a full moon is setting, into the distant snowcapped mountains."
      credit: "NPS/Kait Thomas"
    - name: "Fiery Furnace"
      description: "The Fiery Furnace is a maze of narrow sandstone fins and hidden alcoves in the center of the park. Self-guided entry requires a permit and completion of a mandatory online orientation; ranger-led walks run in spring and fall and must be reserved at the visitor center. The fins glow orange-red at sunset, which gives the area its name."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/6E4373DD-F9D1-84E1-B17C1C64F98668F2.jpg?mode=crop&quality=90&width=1600"
      alt: "The view from Fiery Furnace Overlook"
      credit: "NPS"
    - name: "Devils Garden"
      description: "Devils Garden is a ridge of sandstone fins at the north end of the park containing eight named arches, including Landscape Arch, Partition Arch, and Double O Arch. The main trail runs 4.2 miles round trip to Double O Arch; a primitive loop extension adds 3.7 more miles through scrambling terrain. The Devils Garden Campground sits at the trailhead."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/BB39A68C-FCBB-328C-5F2416B75059050A.jpg?mode=crop&quality=90&width=1600"
      alt: "Hikers reading a trailhead sign near a fence, sandstone walls in background"
      credit: "NPS/Veronica Verdin"
    - name: "Night Sky"
      description: "Arches holds International Dark Sky Park designation from the International Dark Sky Association. The Milky Way core is visible to the naked eye on clear nights from April through October with no equipment required. Balanced Rock and the Windows overlooks are the most used spots for night photography, both accessible directly from the paved road."
      image: "https://www.nps.gov/common/uploads/structured_data/3C7A0C49-1DD8-B71B-0B460D58D6E83B40.jpg"
      alt: "the Milky Way arcs above silhouetted stone pinnacles"
      credit: "NPS/Wonderly"

