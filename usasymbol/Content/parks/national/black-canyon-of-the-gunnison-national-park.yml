intro_text: "Black Canyon of the Gunnison National Park in [Colorado](/states/colorado) protects 30,780 acres of one of the deepest, narrowest canyons in North America, where the Gunnison River carved walls up to 2,722 feet deep through 1.7-billion-year-old Precambrian rock; established in 1999, the park draws about 506,000 visitors a year."

