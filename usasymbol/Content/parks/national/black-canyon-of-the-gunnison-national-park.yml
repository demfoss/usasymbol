faq:
  - question: "Where is Black Canyon of the Gunnison National Park?"
    answer: "The park is in western Colorado, about 15 miles east of Montrose. The South Rim entrance is reached via U.S. 50 east from Montrose, then north on Colorado Route 347. Montrose Regional Airport (MTJ) is approximately 15 miles away and has commercial service connecting to Denver and other hubs."
  - question: "When is the best time to visit Black Canyon of the Gunnison?"
    answer: "Fall (September–October) is the best season — temperatures are comfortable at 45–70 °F, Gambel oak turns bright gold, and crowds thin considerably. Summer (June–August) has the longest days and all facilities open but brings daily afternoon thunderstorms. The North Rim Road closes in winter; the South Rim Road stays open to Gunnison Point only."
  - question: "How much does it cost to enter Black Canyon of the Gunnison?"
    answer: "The entrance fee is $30 per vehicle for a 7-day pass. Motorcycles pay $25 and individuals on foot or bicycle pay $15 per person. The America the Beautiful Annual Pass ($80) covers this park and all other national parks for 12 months. Confirm current fees at nps.gov/blca."
  - question: "What is the Painted Wall at Black Canyon?"
    answer: "The Painted Wall is the tallest cliff in Colorado at 2,250 feet — taller than any building ever constructed. Its distinctive white and pink streaks are pegmatite dikes, lighter-colored rock that intruded into the dark gneiss about 1.4 billion years ago. The best views are from Painted Wall View and Cedar Point on the South Rim Road."
  - question: "Can you hike to the bottom of Black Canyon of the Gunnison?"
    answer: "Yes, but it is serious and requires a free permit issued at the South Rim Visitor Center. Six designated inner canyon routes descend 1,800 to 2,700 feet to the Gunnison River on unmarked, near-vertical terrain. A rope, helmet, and gloves are required. Most parties camp at the river and return the next day. The routes are not recommended for inexperienced hikers."
  - question: "Is Black Canyon of the Gunnison good for fishing?"
    answer: "Yes. The Gunnison River through the canyon is designated Gold Medal water by Colorado — one of the state's highest fishing designations — and supports wild rainbow and brown trout. The most accessible fishing is from East Portal at the eastern end of the park, reached by a paved road with a 16 percent grade. A valid Colorado fishing license is required."
  - question: "What is the difference between the South Rim and North Rim?"
    answer: "The South Rim has the visitor center, 88-site campground, paved 7-mile scenic road, and most maintained trails. It is the primary visitor area. The North Rim is accessed by 12 miles of unpaved road from Crawford, Colorado, has a 13-site primitive campground with no reservations, and sees far fewer visitors. The North Vista Trail from the North Rim reaches Exclamation Point, the park's highest overlook."

