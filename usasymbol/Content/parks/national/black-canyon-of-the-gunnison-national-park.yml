sections:
  overview: |
    Black Canyon of the Gunnison National Park lies in western Colorado, about 15 miles east of Montrose. The park follows the deepest 12 miles of the 48-mile Black Canyon, where the Gunnison River has cut a gorge up to 2,722 feet deep through some of the oldest exposed rock in North America. At its narrowest point, the canyon walls stand only 40 feet apart at river level; the rim-to-rim width reaches a maximum of about 1,100 feet. Some sections of the inner canyon receive fewer than 33 minutes of sunlight per day, giving the canyon its name. The park covers 30,780 acres and ranks 45th among the 63 national parks by annual visitation, drawing roughly 506,000 visitors in 2023. Two separate rim roads — the South Rim and the more remote North Rim — provide access to overlooks and trailheads on opposite sides of the canyon.

  known_for: |
    The Painted Wall, at 2,250 feet the tallest cliff face in Colorado, streaked with white and pink pegmatite dikes that give the canyon its name-defining visual. The Gunnison River, which drops an average of 34 feet per mile through the canyon — one of the steepest river gradients in North America and five times steeper than the Colorado River through the Grand Canyon. Walls made of Precambrian schist and gneiss 1.7 to 1.8 billion years old, among the oldest exposed rock surfaces on Earth. Technical inner canyon routes descending to the river, where climbers and experienced hikers must use ropes and gear on near-vertical unmarked terrain.

  best_things_to_see_items:
    - name: "Painted Wall"
      description: "The Painted Wall is the tallest cliff in Colorado at 2,250 feet — taller than any building ever constructed. Younger pegmatite intrusions, 1.4 billion years old, cut through the dark Precambrian gneiss in diagonal bands of white and pink that look from a distance like brushstrokes. The best views are from Painted Wall View and Cedar Point, both on the South Rim Road. Light changes the contrast dramatically between morning and late afternoon."
      image: "https://www.nps.gov/common/uploads/structured_data/3C8166E8-1DD8-B71B-0BDEB9A4EEEED807.jpg"
      alt: "Black Canyon near Painted Wall"
      credit: "NPS Photo/Lynch"
    - name: "South Rim Scenic Drive and Overlooks"
      description: "The South Rim Road runs 7 miles from the visitor center to Warner Point, with 12 named overlooks along the way. Each pullout looks directly into the canyon from a different angle. Gunnison Point, just below the visitor center, is the widest-view overlook and the first most visitors reach. Dragon Point and Chasm View offer the most dramatic sense of the canyon's depth, with the river visible far below at the base of near-vertical walls."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/DDC0CD24-FBEA-CD76-BE774966495CB79A.jpg?mode=crop&quality=90&width=1300"
      alt: "An overlook lined with wooden fencing leading towards a canyon edge"
      credit: "NPS/Zach Schierl"
    - name: "Oak Flat Loop Trail"
      description: "Oak Flat Loop is the most rewarding moderate trail on the South Rim, descending from the canyon rim partway into the upper canyon through Gambel oak, serviceberry, and mountain mahogany. The 2-mile loop drops about 400 feet below the rim before returning to the visitor center area. The inner walls of the canyon are visible from several points on the descent and the route gives a different perspective than the overlooks above."
      image: "https://npgallery.nps.gov/GetAsset/37d8ccd8-c3ac-421d-a315-ec6218d8f7ae/original.jpg"
      alt: "Trail through woods"
      credit: "NPS/Victoria Stauffenberg"
    - name: "Inner Canyon Technical Routes"
      description: "Six designated inner canyon routes descend from the South Rim to the Gunnison River on terrain that requires ropes, helmets, and scrambling ability. There are no maintained trails — routes are marked with painted dots on rock. A permit is required and issued at the visitor center on the day of the descent. The routes range from 1,800 to 2,700 feet of descent and are for experienced parties only; conditions including poison ivy, loose rock, and rattlesnakes make the descents serious undertakings."
      image: "https://www.nps.gov/blca/planyourvisit/images/Gunnison-Route-chain-horizontal.JPG"
      alt: "A steep descent with a chain leading down attached to a tree"
      credit: "NPS photo"
    - name: "Gunnison River Fishing and Kayaking"
      description: "The Gunnison River through the canyon supports a wild population of rainbow and brown trout and is designated Gold Medal water by the state of Colorado — one of the highest angling designations available. Access to the river requires descending one of the inner canyon routes or entering from the East Portal at the eastern end of the park. The river is runnable by expert kayakers in spring and early summer; the section through the park is Class V and requires a permit."
      image: "https://www.nps.gov/blca/planyourvisit/images/Black-Canyon-Gunnison-River-fishing-300dpi.jpg"
      alt: "A person fishing while standing on a boulder next to a river"
      credit: "NPS Photo"
    - name: "North Rim"
      description: "The North Rim is accessed by a 12-mile unpaved road from Crawford, Colorado, and receives far fewer visitors than the South Rim. The North Vista Trail runs 3 miles round trip to Exclamation Point, the highest overlook in the park, with a direct view down to the river 1,800 feet below. The North Rim has its own small primitive campground and no visitor center; rangers patrol but the experience is significantly more solitary than the South Rim."
      image: "https://www.nps.gov/blca/planyourvisit/images/Painted-Wall-from-North-Rim-2023.jpg"
      alt: "A large canyon wall with varying colored geologic layers"
      credit: "NPS photo"
    - name: "Stargazing"
      description: "Black Canyon of the Gunnison holds International Dark Sky Park designation. The canyon's remote location in western Colorado and the surrounding public lands produce minimal light pollution. The Milky Way core is visible to the naked eye from May through September. The South Rim Campground amphitheater hosts ranger-led astronomy programs on weekend evenings in summer. Bring a red-light headlamp — overlook railings end abruptly at the canyon edge."
      image: "https://home.nps.gov/blca/planyourvisit/images/21c41c8d-3cd2-4d44-b205-9f4245f88418HiResProxy.jpg?autorotate=false&maxwidth=1300"
      alt: "The Milky Way bends above the silhouetted horizon in this panoramic view at Black Canyon of the Gunnison National Park."
      credit: "NPS/Bettymaya Foott"

