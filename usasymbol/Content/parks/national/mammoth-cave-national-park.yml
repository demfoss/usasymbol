intro_text: "Mammoth Cave National Park protects the world's longest known cave system, with more than 400 miles of surveyed passages carved through limestone beneath 54,011 acres of forested Kentucky hills. Park entrance is free, but the cave itself is reached only through guided tours that require advance tickets. Human presence in the cave spans at least 4,000 years; the cave's modern history is inseparable from Stephen Bishop, an enslaved man who first systematically mapped and explored it in the 1840s and whose named passages and features are still in use today. UNESCO designated the park a World Heritage Site in 1981 and an International Biosphere Reserve in 1990."

