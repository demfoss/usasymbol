sections:
  overview: |
    Mammoth Cave National Park covers 54,011 acres of rolling forested plateau in south-central Kentucky, about 90 miles north of Nashville and 100 miles south of Louisville. Below the surface lies the world's longest known cave system: more than 400 miles of surveyed passages, roughly twice the length of the next longest known cave on Earth. The Green River cuts through the center of the park, dividing the upland karst surface from the river valley bottomlands and supporting a distinct ecological corridor. The park draws about 686,000 visitors per year, ranking 39th among the 63 national parks; most come for the cave, and most of those visit between May and October when tour schedules are fullest.

  known_for: |
    The world's longest known cave system at over 400 miles of surveyed passages, extending through five distinct levels of limestone labyrinth beneath the park surface and roughly double the length of the second-longest known cave on Earth.
    Guided cave tours ranging from a half-mile formations walk to a four-mile underground expedition, all requiring advance ticket reservations through Recreation.gov; the cave temperature stays at 54 °F year-round regardless of conditions above ground.
    The documented history of Stephen Bishop, an enslaved man who served as the cave's chief guide from 1839 onward, systematically explored and mapped passages no one had entered before, named features still in official use today, and created the first comprehensive map of the cave in 1842.
    A UNESCO World Heritage Site (1981) and International Biosphere Reserve (1990) protecting not only the cave passages but the karst surface landscape, the Green River corridor, and rare species including the endangered Indiana bat and eyeless cave fish found nowhere else on Earth.

  best_things_to_see_items:
    - name: "Historic Tour"
      description: "The Historic Tour covers 2 miles through the Historic Entrance, the original opening through which cave miners and early tourists entered, passing the massive Rotunda chamber where saltpeter leaching vats from the War of 1812 era still stand in place. The route continues through Broadway, the main corridor wide enough to hold a city block, and Gothic Avenue, where thousands of early visitor signatures and dates scratched into the cave walls date from the 1810s onward. The tour takes about 2 hours at a steady pace, involves stairs and uneven terrain, and requires advance tickets through Recreation.gov."
      image: "/images/parks/national/mammoth-cave-national-park/06-historic-tour.jpg"
      alt: "A large cave entrance with a stair case leading down. "
      credit: "NPS Photo/ Deb Spillman"
    - name: "Cave Formations: Domes, Dripstones, and Frozen Niagara"
      description: "The Domes and Dripstones Tour and the Frozen Niagara Tour both concentrate on the cave's most visually spectacular sections, where active water seepage has built stalactites, stalagmites, flowstone cascades, and columns over tens of thousands of years. Frozen Niagara is a 75-foot flowstone formation that resembles a waterfall locked in stone, reached by a 0.5-mile tour. Upper dry passages hold gypsum flowers, extremely rare crystal formations that grow outward from cave walls in curling shapes unlike anything found in most other caves."
      image: "/images/parks/national/mammoth-cave-national-park/07-cave-formations-domes-dripstones-and-frozen-niagara.jpg"
      alt: "A large area of rock that resembles a frozen waterfall."
      credit: "NPS Photo/ Deb Spillman"
    - name: "Green River Paddling and Surface Trails"
      description: "The Green River flows through the park for about 25 miles of flatwater, offering canoeing and kayaking through forested river valleys with little motorboat traffic and frequent wildlife sightings along the banks. The park rents canoes and kayaks seasonally near the Green River Ferry crossing. The river corridor is also accessible on foot via trails like Turnhole Bend (5 miles) and the short paved River Styx Spring Trail, where the cave's underground river surfaces at the base of the bluff."
      image: "/images/parks/national/mammoth-cave-national-park/08-green-river-paddling-and-surface-trails.jpg"
      alt: "Canoes on Green River"
      credit: "NPS Photo/ Tracie Irvin Young"
    - name: "Cedar Sink"
      description: "Cedar Sink is a large collapsed sinkhole in the southern part of the park, reached by a 1.9-mile trail that descends about 250 feet to the sink floor where a small stream disappears underground through a crevice. The exposed rock walls of the sink reveal the layered limestone and sandstone geology of the park in visible cross-section, and the damp floor supports a distinct forest community different from the surrounding uplands. Cedar Sink is one of the best surface destinations for visitors who want to see karst landforms directly without entering the cave."
      image: "/images/parks/national/mammoth-cave-national-park/04-cedar-sink.jpg"
      alt: "Cedar Sink in Snow"
    - name: "Wild Cave Tour"
      description: "The Wild Cave Tour is a 5-to-6-hour adventure caving experience through undeveloped passages not on any regular tour route, requiring crawling through tight squeezes, climbing over boulders, and navigating by helmet light through sections where the ceiling drops to knee height. Participants must be at least 16 years old, meet height and weight requirements, and book well in advance through Recreation.gov. The NPS provides helmets and headlamps; wear old clothes that can get muddy and damaged."
      image: "/images/parks/national/mammoth-cave-national-park/05-wild-cave-tour.jpg"
      alt: "Wild Cave tour"
    - name: "Mammoth Cave Baptist Church"
      description: "The Mammoth Cave Baptist Church, a small white frame building on a ridge near the historic area, was founded in 1818 and served the African American community of guides, workers, and their families connected to the cave through the 19th and early 20th centuries. It is one of the oldest continuously active African American congregations in Kentucky and remains an active place of worship. The church and its surrounding cemetery are part of the park's cultural landscape and are open to respectful visitors; the congregation holds services periodically."
      image: "/images/parks/national/mammoth-cave-national-park/09-mammoth-cave-baptist-church.jpg"
      alt: "a white, one-story building in a forest"
      credit: "NPS Photo / Deb Spillman"

