faq:
  - question: "Where is Mammoth Cave National Park?"
    answer: "Mammoth Cave is in south-central Kentucky, about 90 miles north of Nashville via I-65 and about 100 miles south of Louisville via the same highway. The nearest town is Cave City, just off I-65 Exit 48. The nearest major airports are Nashville International (BNA) and Louisville Muhammad Ali International (SDF), each about 90 miles away. A rental car is required; no public transit serves the park."
  - question: "Is there an entrance fee for Mammoth Cave?"
    answer: "Park entrance is free. Cave tours are the primary expense and require tickets purchased in advance through Recreation.gov. Tour prices range from approximately $10 to $15 per person for shorter formation tours to $35 for the Grand Avenue Tour and $70 for the Wild Cave Tour. The America the Beautiful Annual Pass does not cover cave tour fees."
  - question: "How do I get tickets for Mammoth Cave tours?"
    answer: "All cave tours require advance tickets through Recreation.gov. Popular tours including the Historic Tour and Grand Avenue Tour sell out weeks ahead on summer and fall weekends. Book as early as possible for visits between May and October. A small number of walk-up tickets may be available at the visitor center on the day of your visit, but this is unreliable on busy days."
  - question: "When is the best time to visit Mammoth Cave?"
    answer: "June through August is peak season with the fullest tour schedule, but tours sell out fastest then. April through May and September through October offer easier tour availability, comfortable surface hiking temperatures, and smaller crowds. The cave stays at 54 °F year-round, so the underground experience is the same in any season. Winter tours run on a reduced schedule but are the easiest to book."
  - question: "What should I wear inside Mammoth Cave?"
    answer: "The cave temperature is 54 °F (12 °C) year-round; bring a light jacket or fleece regardless of the outside temperature. Wear closed-toe shoes with good traction on wet rock; sandals and flip-flops are not permitted on cave tours. For the Wild Cave Tour, wear old clothes that can get muddy and destroyed. Helmets and lights are provided for adventure tours."
  - question: "Can you hike at Mammoth Cave besides the cave tours?"
    answer: "Yes. The park has about 85 miles of surface trails through forested ridges, river valleys, and karst terrain. The Cedar Sink Trail (1.9 miles round trip) leads to a dramatic collapsed sinkhole. The Big Woods Loop (3.3 miles) crosses old-growth forest. The Good Spring Loop (9 miles) is the longest and most challenging surface route. The Green River is open for canoeing and kayaking through the park."
  - question: "Are there bears in Mammoth Cave National Park?"
    answer: "Black bears are occasionally reported in the park but are not common. The more relevant wildlife safety note involves bats: the cave is critical habitat for the Indiana bat and other species. Do not disturb bats in or around the cave, and if you have visited other caves recently, follow White-nose Syndrome decontamination protocols posted at the visitor center to avoid spreading the fungal disease that has killed millions of bats across North America."

  - question: What state is Mammoth Cave National Park in?
    answer: Mammoth Cave National Park is in [Kentucky](/states/kentucky), near Cave City, Kentucky.
