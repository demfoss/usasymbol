sections:
  overview: |
    Yosemite spans nearly 750,000 acres of the Sierra Nevada, but most visitors experience it through a single glacially carved corridor: Yosemite Valley. That seven-mile stretch packs in more iconic granite formations—Half Dome, El Capitan, Cathedral Rocks—than almost anywhere else on Earth. Outside the Valley, the park stretches into high-country wilderness with meadows, lakes, and the headwaters of the Tuolumne and Merced rivers. It was designated a UNESCO World Heritage Site in 1984 and consistently ranks among the most visited national parks in the country.

  known_for: |
    Yosemite is best known for its vertical granite walls. El Capitan stands 3,000 feet from base to summit—the tallest unbroken granite face in the world—and Half Dome rises 4,737 feet above the Valley floor. The park's waterfalls are fed by Sierra snowmelt: Yosemite Falls drops 2,425 feet in two tiers, making it one of the tallest waterfalls in North America. Three groves of giant sequoias grow within park boundaries, the most accessible being Mariposa Grove near the south entrance, home to the Grizzly Giant—estimated at 1,800 years old.

  best_things_to_see: |
    **El Capitan** — The granite monolith that defines the Valley's north wall. Best viewed from Valley View or El Capitan Meadow. Rock climbers attempting its routes are visible with binoculars.

    **Half Dome** — Yosemite's signature peak, accessible by a strenuous 14–16 mile round-trip hike with a cable-assisted summit section. Day-use permits required (lottery system, apply in March for spring trips).

    **Yosemite Falls** — A two-tier waterfall roaring in April–June snowmelt season, often reduced to a trickle by late summer. The lower falls trail is paved and accessible; the upper falls trail gains 2,700 feet.

    **Mariposa Grove** — The park's largest sequoia grove, reopened in 2018 after a multi-year restoration. The Grizzly Giant and California Tunnel Tree are the landmarks. Shuttle from the south entrance (required when lot is full).

    **Tunnel View** — The classic panoramic overlook at the east end of the Wawona Tunnel, framing El Capitan, Half Dome, and Bridalveil Fall in one view. Free to visit, extremely crowded at sunrise.

    **Glacier Point** — Road-accessible overlook 3,200 feet above the Valley with direct sight lines to Half Dome, Nevada Fall, and the high Sierra. Open late May through November (road closed in winter).

  best_time_to_visit: |
    **Spring (April–June)** is the best time for waterfalls—snowmelt is at its peak and flows typically max out in May. Wildflowers bloom in the Valley meadows. The downside: crowds build quickly from Memorial Day onward, and Tioga Road to Tuolumne Meadows is usually still closed until late May or June.

    **Fall (September–November)** is the second-best window: crowds thin noticeably after Labor Day, temperatures are mild, and the Valley meadows have a different kind of light. Some high-country roads close by October.

    **Summer (July–August)** brings the largest crowds and requires the most planning—timed-entry reservations are mandatory during peak hours. Waterfalls are reduced. The upside: Tioga Road is fully open, giving access to Tuolumne Meadows and the high country.

    **Winter (December–March)** is quiet, with lodges open and Valley roads accessible. Snow adds atmosphere. Tire chains are required. Many high-country roads are closed, and some facilities (Glacier Point Road) don't open until late spring.

  hiking: |
    Yosemite has more than 800 miles of trails ranging from paved Valley floor loops to multi-day wilderness routes.

    **Easy — Valley Floor Loop** (13 miles, flat): Connects major Valley landmarks; can be ridden by bike (rentals at Curry Village). Segments are walkable in under an hour.

    **Moderate — Mirror Lake Loop** (5 miles round trip): Follows Tenaya Creek to a reflective lake beneath Half Dome. Best in spring before the lake dries into a meadow.

    **Moderate — Vernal Fall via Mist Trail** (5.4 miles round trip, 1,000 ft gain): The park's most-hiked trail. Spray from the 317-foot fall soaks hikers on the granite staircase—bring a rain jacket. Nevada Fall adds another 2 miles and 1,900 feet total.

    **Strenuous — Half Dome** (14–17 miles round trip, 4,800 ft gain): Requires a separate permit (lottery). The final 400 feet use fixed steel cables. Best done July–early September when cables are up.

    **Strenuous — Four Mile Trail to Glacier Point** (9.6 miles round trip, 3,200 ft gain): Steady switchbacks through forest to the Valley overlook. Take the shuttle back down if legs give out.

  camping: |
    Yosemite has 13 campgrounds with roughly 1,400 sites total. Most Valley campgrounds (Upper Pines, Lower Pines, North Pines) open on a reservation system available at recreation.gov starting five months in advance—they sell out in minutes for summer dates. First-come, first-served campgrounds are available at Tamarack Flat and Yosemite Creek in the high country (accessible only when Tioga Road is open).

    Camp 4, the historic walk-in tent campground at the base of El Capitan, is legendary among climbers. It's first-come, first-served and fills by 8 a.m. in summer.

    The Ahwahnee Hotel (formerly the Yosemite Valley Lodge) is the park's historic luxury accommodation—reservations open 366 days in advance and book out fast for summer and fall weekends.

  fees_reservations: |
    **Entrance fee:** $35 per vehicle (7-day pass), $30 per motorcycle, $20 per person on foot or bike. The America the Beautiful annual pass ($80) covers this and all other federal lands.

    **Timed-entry reservations:** Required for vehicles entering between 5 a.m. and 4 p.m. from late May through early September. Reservations open 21 days in advance on recreation.gov. Without one, you can still enter after 4 p.m. or before 5 a.m., or arrive by tour bus or YARTS public transit (no reservation needed).

    **Half Dome permits:** Daily quota of 300 hikers on the cable route. Apply in the pre-season lottery (March, for May–September dates) or the daily lottery (two days before). Cost: $10 per person plus $8 application fee.

    Note: Fees and reservation policies change annually. Always check the official NPS Yosemite page before visiting.

  getting_there: |
    **By car:** Highway 120 (Tioga Road) is the main east-west route through the park, connecting I-395 on the east with Modesto on the west—but it closes in winter. Highway 140 via Mariposa is the most reliable year-round approach and the closest route from the San Francisco Bay Area. Highway 41 from Fresno is the southern approach.

    **By public transit:** YARTS (Yosemite Area Regional Transportation System) runs buses from Merced (where Amtrak Amtrak San Joaquin trains stop), Fresno, and Mammoth Lakes. Buses stop at Valley landmarks and cost roughly $15–25 round trip.

    **By air:** Fresno Yosemite International (FAT) is the nearest major airport, about 65 miles south. San Francisco (SFO) and Sacramento (SMF) are roughly 4 hours by car; Los Angeles (LAX) is about 5–6 hours.

  geology: |
    Yosemite's landscape is the product of two forces: plutonic granite and Pleistocene glaciers. The Sierra Nevada batholith—a mass of granite that cooled 80–100 million years ago deep underground—was exposed over millions of years of erosion. During the last ice age, glaciers up to 4,000 feet thick carved the original V-shaped river valley into the broad U-shaped trough visible today. When glaciers retreated roughly 10,000 years ago, they left hanging valleys (where Bridalveil and Yosemite Falls drop off), erratic boulders, and the polished granite domes characteristic of the high Sierra. Half Dome's vertical face was formed not by glacial carving but by a process called exfoliation—sheets of granite peeling away from the dome over time.

  wildlife: |
    The park supports more than 400 species of vertebrates. Black bears are the most discussed—roughly 300 to 500 live in the park, and food storage regulations (bear canisters or metal boxes) are strictly enforced at all campgrounds. Mule deer are common throughout the Valley meadows and are easily spotted at dusk. Coyotes are frequently seen along Valley roads.

    The Steller's jay and Clark's nutcracker are the most conspicuous birds; peregrine falcons nest on El Capitan's granite walls. Sierra Nevada bighorn sheep were reintroduced to the Yosemite high country in 1986 and a small herd persists near Tioga Pass. The great gray owl—California's largest owl—is a year-round resident.

  history: |
    The Ahwahnechee people lived in Yosemite Valley for at least 3,000 years before the Mariposa Battalion—a California militia—forcibly entered the valley in 1851 during the Gold Rush era displacement of indigenous peoples.

    In 1864, President Abraham Lincoln signed the Yosemite Grant, transferring the Valley and Mariposa Grove to California for preservation—the first time the U.S. government set aside land for public use. This precedent directly inspired the creation of Yellowstone as the first national park in 1872.

    John Muir explored the Sierra Nevada extensively starting in 1868 and became Yosemite's most influential advocate, arguing in the press and to President Theodore Roosevelt (who camped here in 1903) that the Valley required federal protection. Congress established Yosemite National Park in 1890. Muir co-founded the Sierra Club in 1892, partly to defend it.

    The early 20th century brought roads, lodges, and mass tourism. The Ahwahnee Hotel opened in 1927. A decades-long debate over the Hetch Hetchy Valley—flooded in 1923 to supply San Francisco's water over Muir's fierce opposition—defined the limits of preservation within park boundaries and shaped modern environmental politics.

faq:
  - question: "Do you need reservations to visit Yosemite?"
    answer: "From late May through early September, vehicles entering Yosemite between 5 a.m. and 4 p.m. require a timed-entry reservation from recreation.gov. Reservations open 21 days in advance and sell out quickly. To avoid needing one, arrive before 5 a.m., after 4 p.m., or use YARTS public transit—no reservation required for bus passengers."
  - question: "What is the best time to visit Yosemite?"
    answer: "Spring (April–June) for waterfalls at full flow and blooming meadows; fall (September–October) for thinner crowds and mild weather. Summer is the busiest period and requires the most advance planning. Winter is quiet but limits access to the high country."
  - question: "How much does it cost to enter Yosemite?"
    answer: "The vehicle pass is $35 and covers 7 days. The America the Beautiful annual pass ($80) covers Yosemite and all other national parks, monuments, and federal recreation areas—worth it for more than two park visits per year."
  - question: "Can you hike Half Dome without a permit?"
    answer: "No. A permit is required to hike beyond the base of the cables on Half Dome. The daily quota is 300 hikers. Apply in the pre-season lottery in March (for May–September trips) or the daily lottery two days before your hike on recreation.gov."
  - question: "Where is Yosemite National Park located?"
    answer: "Yosemite is in the Sierra Nevada mountains of central California, about 165 miles east of San Francisco, 200 miles northeast of Los Angeles, and 90 miles northeast of Fresno. The main Valley is at roughly 4,000 feet elevation; the park's highest point, Mount Lyell, reaches 13,114 feet."

