seo_title: "Congaree National Park: Hiking, Fireflies & Best Time"
seo_description: "Visit Congaree National Park in South Carolina: old-growth forest, champion trees, synchronous fireflies, top hikes, and how to get there."
intro_text: "Congaree National Park in [South Carolina](/states/south-carolina) protects 26,546 acres of the largest intact old-growth bottomland hardwood forest remaining in the southeastern United States, a UNESCO Biosphere Reserve since 1983. Established in 2003, the park holds more national and state champion trees than any other area in the eastern US and draws about 249,000 visitors a year."

