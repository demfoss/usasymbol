faq:
  - question: "Where is Congaree National Park?"
    answer: "Congaree is in central South Carolina, about 20 miles southeast of Columbia. The park entrance is on National Park Road off Old Bluff Road near the town of Hopkins. The nearest major airport is Columbia Metropolitan (CAE), about 20 miles away."
  - question: "Is Congaree a swamp?"
    answer: "No. Congaree is a floodplain forest, not a swamp. The Congaree and Wateree rivers flood the park about ten times a year on average, but the water drains away after each flood rather than standing permanently. The regular flooding deposits nutrients that drive the extraordinary tree growth. The park was historically called Congaree Swamp, which led to the persistent misconception."
  - question: "When is the best time to visit Congaree National Park?"
    answer: "Fall (September through November) offers the most comfortable hiking temperatures, lower water levels, and the least mosquito pressure. Spring (March through May) is best for birdwatching, particularly for the prothonotary warbler and migrating species. The synchronous firefly display in late May and early June requires a timed-entry lottery reservation and draws the largest crowds."
  - question: "How do I see the synchronous fireflies at Congaree?"
    answer: "The firefly display occurs in late May and early June, when thousands of fireflies (Photinus carolinus) flash in synchronized pulses after dark. Vehicle access requires a timed-entry parking reservation from Recreation.gov; the lottery typically opens six to eight weeks before the event and sells out quickly. Walk-in and bike-in visitors do not need a reservation. Check nps.gov/cong for the current year's dates and lottery schedule."
  - question: "Is there an entrance fee for Congaree National Park?"
    answer: "No. Congaree charges no entrance fee and no camping fee. Longleaf Campground is free and first-come, first-served. The only fee-bearing activity is the timed-entry parking reservation during the firefly event, made through Recreation.gov."
  - question: "Can you canoe or kayak at Congaree?"
    answer: "Yes. Cedar Creek is a 15-mile blackwater canoe and kayak trail through the old-growth forest. A concessionaire at the Cedar Creek Landing offers rentals; book in advance for spring and fall weekends. You can also bring your own boat. The creek is best paddled in spring and fall when water levels are moderate; it can be too shallow in dry summers and too fast after heavy flooding."
  - question: "What is the best hike in Congaree?"
    answer: "The Boardwalk Loop (2.4-mile loop) is the best introduction, passing among the largest trees in the park on a fully accessible elevated walkway. For a longer experience, the Weston Lake Loop (4.4 miles) extends to an oxbow lake with good wildlife viewing. Both trails start from the Harry Hampton Visitor Center and can be combined in about two to three hours."

  - question: What state is Congaree National Park in?
    answer: Congaree National Park is in [South Carolina](/states/south-carolina), near Hopkins, South Carolina.
