sections:
  overview: |
    Congaree National Park sits in the central coastal plain of South Carolina, about 20 miles southeast of Columbia on the Congaree River floodplain. The park protects 26,546 acres of old-growth bottomland hardwood forest — the largest intact tract of this forest type remaining in the southeastern United States and a UNESCO Biosphere Reserve since 1983. Despite its name in popular use, Congaree is a floodplain forest, not a swamp; the Congaree and Wateree rivers flood the park roughly ten times a year on average, depositing nutrients that drive the extraordinary tree growth. The park ranks 57th among the 63 U.S. national parks by annual visitation, drawing about 249,000 visitors in 2023. Entrance is free and no reservation is required to visit, though the annual synchronous firefly event in late May and early June requires a timed-entry ticket.

  known_for: |
    The highest concentration of national and state champion trees in the eastern United States, with individual loblolly pines, bald cypresses, cherrybark oaks, and American elms that hold records for size — some more than 500 years old and never logged.
    The synchronous firefly (Photinus carolinus) display in late May and early June, one of only a few places in the eastern US where thousands of fireflies flash in coordinated pulses, drawing visitors from across the country to a timed-entry viewing program.
    Cedar Creek, a blackwater stream that winds 15 miles through the old-growth forest and is the park's main paddling route, accessible by canoe or kayak for multi-hour trips through the forest interior.
    The Boardwalk Loop, an elevated wooden walkway that puts visitors among ancient trees — some exceeding 150 feet tall — in a forest that has never been industrially logged, offering a rare view of what much of the southeastern US looked like before European settlement.

  best_things_to_see_items:
    - name: "Ancient Trees and Champion Grove"
      description: "Congaree holds more national and state champion trees than any other area of comparable size in the eastern United States. Loblolly pines reach 169 feet; cherrybark oaks and water tupelos exceed national records. Many individuals are 300 to 500 years old. The Boardwalk Loop passes several of the largest trees within 0.2 miles of the visitor center, with identification plaques marking species and dimensions."
      image: "/images/parks/national/congaree-national-park/02-ancient-trees-and-champion-grove.jpg"
      alt: "big tree - view looking up from ground"
      credit: "NPS Photo"
    - name: "Boardwalk Loop Trail"
      description: "The 2.4-mile Boardwalk Loop is an elevated wooden walkway that passes through the heart of the old-growth forest at canopy-base height. The boardwalk crosses several creek channels and Weston Lake, putting visitors above the floodplain and among trees that dwarf the walkway. The route is fully accessible, free, and open year-round; it can be walked in under an hour and is the most efficient introduction to the forest."
      image: "/images/parks/national/congaree-national-park/03-boardwalk-loop-trail.jpg"
      alt: "Boardwalk"
      credit: "NPS Photo"
    - name: "Synchronous Firefly Display"
      description: "Each year in late May and early June, thousands of synchronous fireflies (Photinus carolinus) flash in coordinated pulses across the forest floor and understory, creating one of the most unusual natural spectacles in the eastern United States. The NPS runs a timed-entry lottery for parking access during the event; walk-in and bike-in visitors do not need a ticket. The display lasts roughly two hours after dark on peak nights."
      image: "/images/parks/national/congaree-national-park/03-synchronous-firefly-display.jpg"
      alt: "Fireflies blink along the forest floor at dusk"
      credit: "NPS Photo"
    - name: "Cedar Creek Canoe Trail"
      description: "Cedar Creek is a 15-mile blackwater paddling route that threads through the old-growth forest interior, passing under the canopy of bald cypress and water tupelo trees draped with Spanish moss. The water is tea-colored from tannins — clean but dark. Put-in and take-out points are at the Cedar Creek Landing. The route takes 4 to 6 hours to paddle; canoes and kayaks are available for rental from a concessionaire at the landing."
      image: "/images/parks/national/congaree-national-park/04-cedar-creek-canoe-trail.jpg"
      alt: "Wide stream with cypress trees on either bank"
      credit: "NPS photo / SECN staff"
    - name: "Weston Lake"
      description: "Weston Lake is an oxbow lake formed from an old bend in Cedar Creek, visible from the 4.4-mile Weston Lake Loop trail. The still, dark water reflects the canopy overhead and is a reliable spot for wood ducks, river otters, and the prothonotary warbler — a brilliant orange-yellow bird that nests in tree cavities over water and is one of the most sought species by birdwatchers visiting the park."
      image: "/images/parks/national/congaree-national-park/05-weston-lake.jpg"
      alt: "Weston Lake"
    - name: "Birding the Floodplain"
      description: "Congaree is one of the best birding sites in South Carolina. The prothonotary warbler, sometimes called the swamp canary for its bright color and loud song, nests throughout the floodplain from April through July. Wood storks, threatened at the national level, roost and nest in the park. Barred owls are so common that their calls overlap at dawn. The park lies within the Atlantic Flyway; peak warbler migration occurs in April and early May."
      image: "/images/parks/national/congaree-national-park/06-birding-the-floodplain.jpg"
      alt: "Prothonotary Warbler (male) (Protonotaria citrea) at Congaree NP."

