sections:
  overview: |
    Redwood National and State Parks stretch roughly 50 miles along the northern California coast from Orick north to Crescent City, protecting 138,999 acres of coast redwood forest, prairie, and wild coastline. The park complex is jointly managed by the National Park Service and California State Parks and includes three state park units — Prairie Creek Redwoods, Del Norte Coast Redwoods, and Jedediah Smith Redwoods — alongside the federal Redwood National Park. Together they protect about 45 percent of the remaining old-growth coast redwood forest on Earth. Entry to the national park land is free; state park day-use areas charge a separate vehicle fee. The park ranks 48th in annual visitation among the 63 U.S. national parks, drawing roughly 433,000 visitors per year. UNESCO designated the complex a World Heritage Site in 1980.

  known_for: |
    Redwood is above all known for the coast redwoods themselves — the tallest living organisms on Earth. The tallest known individual, Hyperion, stands approximately 380 feet inside the park; its exact location is not disclosed publicly to protect the tree from impact. The Newton B. Drury Scenic Parkway drives beneath a cathedral canopy of old-growth trees without leaving the car. Fern Canyon in Prairie Creek Redwoods State Park features 50-foot walls covered in five-fern species and was a filming location for the movie The Lost World: Jurassic Park (1997). Roosevelt elk graze the Elk Prairie meadow in visible herds year-round. The Smith River — one of the last major undammed rivers on the Pacific Coast — runs clear and cold through Jedediah Smith and offers premier steelhead and salmon fishing.

  best_things_to_see_items:
    - name: "Tall Trees Grove"
      description: "A grove holding several of the world's tallest measured trees, accessible via a 3.4-mile round-trip trail from the Tall Trees Trailhead. A free permit is required to drive the access road; permits are issued daily in limited numbers at the Kuchel Visitor Center near Orick. No permit needed to hike in from the highway."
      image: "/images/parks/national/redwood-national-and-state-parks/02-highlight-01.jpg"
      alt: "Redwood trees line a narrow dirt road."
      credit: "NPS"
    - name: "Fern Canyon"
      description: "A slot canyon in Prairie Creek Redwoods State Park where five fern species coat vertical walls rising 50 feet on both sides of a narrow creek. The 1.5-mile loop crosses the creek multiple times on stepping stones; waterproof footwear is advised. The approach road (Gold Bluffs Beach Road) is unpaved and limited to vehicles under 24 feet."
      image: "/images/parks/national/redwood-national-and-state-parks/01-best-fern-canyon.jpg"
      alt: "Hikers in Fern Canyon at the end of Davison Road in Prairie Creek Redwoods State Park, Redwood National and State Parks."
    - name: "Newton B. Drury Scenic Parkway"
      description: "A 10-mile paved road through Prairie Creek Redwoods State Park that runs entirely through old-growth forest, the most accessible old-growth drive in the park complex. Pull-outs allow for short walks among trees exceeding 300 feet. The road is passable by any vehicle and is the best single introduction to the redwoods for visitors with limited time."
      image: "/images/parks/national/redwood-national-and-state-parks/02-best-newton-b-drury-scenic-parkway.jpg"
      alt: "Large redwood trees along a curving, paved road. The Newton B. Drury Scenic Parkway is a driving highlight of the parks."
      credit: "Photo / Dave Van de Mark"
    - name: "Elk Prairie"
      description: "A large open meadow within Prairie Creek Redwoods State Park where Roosevelt elk graze year-round. Herds of 20 to 100 animals are regularly visible from the road or the adjacent campground. Bulls carry large antlers from late summer through fall; calves appear in late spring. Stay at least 50 feet from all elk."
      image: "/images/parks/national/redwood-national-and-state-parks/03-best-elk-prairie.jpg"
      alt: "Roosevelt elk grazes in Prairie Creek Redwoods State Park"
    - name: "Jedediah Smith — Stout Grove and Howland Hill Road"
      description: "Howland Hill Road is an unpaved 10-mile scenic drive through some of the largest old-growth redwood groves in the park, including Stout Grove, where trees exceed 16 feet in diameter and 300 feet in height. The road is narrow and not suitable for RVs. The drive ends near the Smith River, which is clear enough to see the bottom in summer."
      image: "/images/parks/national/redwood-national-and-state-parks/04-best-howland-hill-road.jpg"
      alt: "Visitor on Howland Hill Road"
      credit: "NPS"
    - name: "Crescent Beach and Enderts Beach"
      description: "Two wild Pacific Coast beaches accessible from Crescent City. Enderts Beach has accessible tide pools and is the southern trailhead for the Coastal Trail. Crescent Beach offers a flat walk with views of the bay and sea stacks. Neither beach is safe for swimming due to cold water and rip currents, but both are excellent for wildlife observation."
      image: "/images/parks/national/redwood-national-and-state-parks/03-highlight-02.jpg"
      alt: "Two visitors looking at tidepools."
      credit: "NPS Photo / John Chao"
    - name: "Lady Bird Johnson Grove"
      description: "A 1.4-mile loop through old-growth redwoods on a ridge above the Redwood Creek valley, dedicated by Lady Bird Johnson at the park's opening ceremony on August 27, 1969. The trailhead is off Bald Hills Road, roughly 2 miles from US 101 near Orick. An interpretive brochure is available at the trailhead."
      image: "/images/parks/national/redwood-national-and-state-parks/05-best-lady-bird-johnson-grove.jpg"
      alt: "Fog shrouded Lady Bird Johnson Grove."

