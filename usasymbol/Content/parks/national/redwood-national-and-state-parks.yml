seo_title: "Redwood National Park: Tallest Trees, Hikes & Map"
seo_description: "Visit Redwood National and State Parks in California: free entry, world's tallest trees, Fern Canyon, Roosevelt elk, and top hiking trails."
intro_text: "Redwood National and State Parks in northern California protect 138,999 acres of coast redwood forest along a 50-mile stretch of coastline, home to the tallest trees on Earth. The complex combines one national park with three California state parks under shared management, is free to enter, and has been a UNESCO World Heritage Site since 1980."

