sections:
  overview: |
    Theodore Roosevelt National Park covers 70,447 acres of North Dakota Badlands in three separate units along the Little Missouri River. The South Unit, adjacent to the town of Medora off I-94, is the largest and most visited, with a 36-mile paved scenic loop, the park visitor center, and Roosevelt's Maltese Cross Cabin. The North Unit sits about 70 miles north and offers a 14-mile scenic drive and significantly fewer crowds. The Elkhorn Ranch Unit, between the two, preserves the site of Roosevelt's second ranch and is accessible only by primitive road or on foot. Entry to the South Unit is off I-94 at Exit 24; the North Unit entrance is off US 85. A single $30 vehicle fee covers all three units for seven days. The park ranks 37th in annual visitation among the 63 U.S. national parks.

  known_for: |
    The park is best known for its free-roaming bison herds. Hundreds of bison graze the South Unit's grasslands and are reliably visible from the scenic loop drive — often blocking the road. The South Unit also holds the only population of free-roaming wild horses in any national park in the lower 48 states, a herd of roughly 70–100 animals descended from ranch horses. Roosevelt's Maltese Cross Cabin, his first ranch cabin, was relocated to the South Unit visitor center and is open for viewing. The badlands terrain of eroded buttes, colorful clay formations, and river breaks makes for some of the most dramatic landscapes on the Great Plains.

  best_things_to_see_items:
    - name: "South Unit Scenic Loop Drive"
      description: "A 36-mile paved loop through the heart of the South Unit, passing overlooks, prairie dog towns, bison range, and badlands formations. Buck Hill, the highest point on the loop at about 2,855 feet, gives a 360-degree view across the badlands. The drive takes 2–3 hours with stops and works well after rain when the clay formations show their full color range."
      image: "/images/parks/national/theodore-roosevelt-national-park/01-south-unit-scenic-loop.jpg"
      alt: "A view from the South Unit's 36-mile Scenic Loop Drive."
    - name: "Bison Herd Viewing"
      description: "Free-roaming bison frequently stop traffic on the South Unit scenic loop, particularly near the Beef Corral Bottom area. The South Unit herd numbers several hundred animals and is visible most days of the year. Bison can run 35 mph and are unpredictable — stay at least 75 feet away and never approach on foot."
      image: "/images/parks/national/theodore-roosevelt-national-park/02-bison-herd-viewing.jpg"
      alt: "two bull bison collide heads in a dusty battle for dominance"
      credit: "NPS Photo / Teresina Wheaten"
    - name: "Wild Horse Viewing"
      description: "The South Unit's wild horse herd of roughly 70–100 animals is the only free-roaming wild horse population in a national park in the contiguous United States. Horses are most often seen in the area between Peaceful Valley Ranch and the Scenic Loop. Early morning drives along the loop give the best chance of sighting a band."
      image: "/images/parks/national/theodore-roosevelt-national-park/03-wild-horses.jpg"
      alt: "Wild horses in the South Unit of Theodore Roosevelt National Park."
    - name: "Painted Canyon Overlook"
      description: "A free overlook directly off I-94 at Exit 32, about 7 miles east of the South Unit entrance. No entry fee is charged here. The overlook gives an immediate panoramic view of the badlands and the Little Missouri valley. A small visitor center and picnic area operate seasonally. This is often the first look at the park for visitors driving I-94."
      image: "/images/parks/national/theodore-roosevelt-national-park/04-painted-canyon.jpg"
      alt: "The view at the Painted Canyon overlook."
    - name: "Roosevelt's Maltese Cross Cabin"
      description: "Roosevelt's first ranch cabin in Dakota Territory, built in 1883 and later moved to the South Unit visitor center grounds. The original log structure is open for ranger-led tours in summer. The cabin is the most direct physical connection in the park to Roosevelt's time on the land."
      image: "/images/parks/national/theodore-roosevelt-national-park/05-maltese-cross-cabin.jpg"
      alt: "The Maltese Cross Cabin, located adjacent to the South Unit Visitor Center, is open for ranger-guided tours in the summer and self-guided tours the rest of the year."
    - name: "Oxbow Overlook (North Unit)"
      description: "The endpoint of the North Unit's 14-mile scenic drive, with views down to a sweeping bend in the Little Missouri River. The North Unit's landscape is more heavily forested with juniper and cottonwood than the South and sees a fraction of the visitor traffic. Wildlife viewing on the North Unit drive, including longhorn steers and elk, can be exceptional."
      image: "/images/parks/national/theodore-roosevelt-national-park/06-oxbow-overlook.jpg"
      alt: "A view to the east from River Bend Overlook in the North Unit."
    - name: "Stargazing"
      description: "The park sits in one of the darkest regions of the continental United States, far from major city light pollution. The Milky Way is visible to the naked eye on clear moonless nights from June through September. The South Unit's Buck Hill and the North Unit's Oxbow Overlook are both good dark-sky sites accessible by car."
      image: "/images/parks/national/theodore-roosevelt-national-park/07-stargazing.jpg"
      alt: "the swirling, dusty looking milky way runs vertically though a starry night sky"
      credit: "NPS Photo / Jeff Zylland"

