seo_title: "Theodore Roosevelt National Park: Hikes, Map & Wildlife"
seo_description: "Visit Theodore Roosevelt National Park in North Dakota: bison, wild horses, badlands scenery, top hikes, and best time to go. $30 entry."
intro_text: "Theodore Roosevelt National Park in North Dakota protects 70,447 acres of badlands along the Little Missouri River, the only national park in the lower 48 states with free-roaming wild horses. Congress designated it in 1978, preserving the land where Roosevelt ranched from 1883 to 1887 — an experience he credited as the foundation of his conservation presidency."

