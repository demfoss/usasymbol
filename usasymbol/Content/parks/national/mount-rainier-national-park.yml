sections:
  overview: |
    Mount Rainier National Park covers 236,381 acres in western Washington, roughly 60 miles southeast of Seattle and centered on an active stratovolcano at 14,410 feet. The mountain carries 26 named glaciers totaling about 35 square miles of ice, more glacial coverage than any other peak in the contiguous United States, and feeds five major river systems draining toward Puget Sound. Four distinct areas give visitors very different experiences: Paradise on the south slope at 5,400 feet for wildflower meadows and summit access, Sunrise on the northeast at 6,400 feet for glacier close-ups, Carbon River in the northwest for old-growth rainforest, and Longmire at the Nisqually entrance for history and forest walks. The park ranks 20th in annual visitation among the 63 national parks, drawing about 1.6 million visitors per year with the heaviest concentration in July and August at Paradise.

  known_for: |
    Subalpine wildflower meadows at Paradise, where more than 50 species of wildflowers bloom in dense carpets from mid-July through mid-August across slopes visible from the historic Paradise Inn, drawing visitors from across the Pacific Northwest for the annual bloom.
    The 26 named glaciers that cover the mountain's flanks, including Emmons Glacier on the northeast face, the largest glacier by area in the contiguous United States at about 4.3 square miles, and Nisqually Glacier on the south face, one of the most studied glaciers in North America.
    The Wonderland Trail, a 93-mile loop that circumnavigates the entire mountain through forest, meadow, and alpine terrain, requiring 7 to 14 days and a backcountry permit, considered one of the premier long-distance backpacking routes in the country.
    Mountaineering on the summit route, which draws roughly 10,000 attempted ascents per year via the Disappointment Cleaver and other routes; about half succeed, making Rainier one of the most frequently climbed glaciated peaks in the world.

  best_things_to_see_items:
    - name: "Paradise Wildflower Meadows"
      description: "The Paradise area at 5,400 feet on the mountain's south slope produces some of the most concentrated subalpine wildflower displays in the western United States, with lupine, paintbrush, bistort, and avalanche lily blooming in dense sweeps from mid-July through mid-August. The 5.5-mile Skyline Trail loop from the Paradise parking area climbs through the heart of the meadows with close views of the Nisqually Glacier and, on clear days, the summit. A timed entry reservation may be required to drive to Paradise on summer weekends; check the NPS website before your visit."
      image: "/images/parks/national/mount-rainier-national-park/06-paradise-wildflower-meadows.jpg"
      alt: "Two children hike on trail through wildflower meadow with Mount Rainier above them."
      credit: "NPS Photo / Steve Redman"
    - name: "Mountaineering and Glacier Travel"
      description: "Mount Rainier's summit at 14,410 feet is reached by technical glacier routes requiring crampons, ice axe, roped-team travel, and a summit permit from the NPS. The most common route, the Disappointment Cleaver, ascends the south and southeast face via Camp Muir at 10,080 feet, where climbers sleep before an early morning summit push. Non-climbers can hike the 8.5-mile round-trip route from Paradise to Camp Muir across the Muir Snowfield without technical gear, gaining 4,600 feet of elevation. Guided summit climbs are available through authorized concessionaires based in Ashford."
      image: "/images/parks/national/mount-rainier-national-park/07-mountaineering-and-glacier-travel.jpg"
      alt: "Climber on glacier steps downward with icy crags in background."
      credit: "NPS Photo"
    - name: "Carbon River Rainforest"
      description: "The Carbon River area in the park's northwest corner protects one of the few remaining inland temperate rainforests in the contiguous United States, with towering western red cedar, Douglas-fir, and Sitka spruce draped in moss and ferns in a forest that averages over 100 inches of annual rainfall. The road into this area is closed to vehicles and reserved for hikers and cyclists; the 5-mile walk to Carbon River Camp passes through the thickest old-growth in the park. This area is the least visited of the four main park zones and the most likely to feel genuinely remote."
      image: "/images/parks/national/mount-rainier-national-park/08-carbon-river-rainforest.jpg"
      alt: "Towering cedars and douglas-firs reach skyward while a beam of sun breaks through the canopy."
      credit: "NPS Photo / Emily Brouwer"
    - name: "Hoary Marmots and Alpine Wildlife"
      description: "Hoary marmots are the iconic animal of Rainier's subalpine meadows, large ground squirrels with silver-tipped fur that whistle loudly from rocky outcrops in the Paradise and Sunrise areas throughout summer. Mountain goats appear on the rocky high ridges, particularly around Spray Park and the Sunrise area; these are feral descendants of animals introduced in 1925. American pika, small relatives of rabbits, inhabit talus slopes above treeline and are heard by their sharp call before they are seen. Black bears live throughout the forested zones below about 6,000 feet."
      image: "/images/parks/national/mount-rainier-national-park/09-hoary-marmots-and-alpine-wildlife.jpg"
      alt: "A hoary marmot with white frosted fur rests on a rock beside white flowers in a meadow."
      credit: "NPS Photo"
    - name: "Sunrise and Emmons Glacier"
      description: "Sunrise at 6,400 feet is the highest point reachable by paved road in Washington state and puts visitors closer to the mountain's summit than any other driveable location in the park. The Emmons Glacier, largest in the contiguous United States, fills the northeast face directly above the Sunrise area, and a trail from the visitor center looks down onto the glacier's terminus at the White River. Sunrise is typically open only from early July through mid-October and is less crowded than Paradise, with the same mountain quality in clearer, drier weather."
      image: "/images/parks/national/mount-rainier-national-park/10-sunrise-and-emmons-glacier.jpg"
      alt: "Large glacier on northeast side of Mount Rainier"
      credit: "NPS Photo"
    - name: "Grove of the Patriarchs"
      description: "The Grove of the Patriarchs is a 1.5-mile loop trail on an island in the Ohanapecosh River in the park's southeast corner, crossing a suspension bridge to reach a stand of western red cedar, Douglas-fir, and western hemlock trees estimated at 500 to 1,000 years old. The largest cedars are more than 25 feet in circumference. The trail is flat, paved near the bridge, and accessible to most visitors; it is one of the most popular short hikes in the park and one of the few places where the scale of old-growth forest can be appreciated without a long approach. The trailhead is near Ohanapecosh Campground."
      image: "/images/parks/national/mount-rainier-national-park/11-grove-of-the-patriarchs.jpg"
      alt: "A hiker walks across a suspension bridge in the forest above bright blue water."
      credit: "NPS photo"

