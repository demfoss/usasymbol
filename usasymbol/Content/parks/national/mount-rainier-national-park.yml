faq:
  - question: "Where is Mount Rainier National Park?"
    answer: "Mount Rainier is in western Washington state, about 60 miles southeast of Seattle and 40 miles southeast of Tacoma. The main Nisqually entrance is reached via Hwy 706 from Hwy 7 south of Tacoma. The nearest major airport is Seattle-Tacoma International (SEA), about 60 miles from the Nisqually entrance. Driving time from Seattle or Tacoma is about 1.5 to 2 hours."
  - question: "When is the best time to visit Mount Rainier?"
    answer: "Mid-July through August is the peak window: wildflower bloom at Paradise is at its best, all park areas including Sunrise are open, and above-treeline trails are snow-free. September is quieter with good trail conditions and clearer weather. Summer weekends require a timed entry reservation for Paradise; book through Recreation.gov before your visit. Sunrise opens in early July and closes in mid-October."
  - question: "Do I need a reservation to visit Mount Rainier?"
    answer: "A timed entry reservation is required to drive to Paradise on summer weekends from late June through Labor Day. Without one, you may be turned away at the Paradise road junction. Book through Recreation.gov when reservations open in spring. No reservation is required for other park areas or for weekday visits to Paradise. Campsite reservations at Cougar Rock and Ohanapecosh require separate advance booking."
  - question: "How much does it cost to enter Mount Rainier?"
    answer: "A vehicle 7-day pass costs $30 and covers all occupants. Motorcycles are $25; individuals arriving on foot or bicycle pay $15 per person. The America the Beautiful Annual Pass ($80) covers entrance at all national parks for 12 months. Climbers going above 10,000 feet or onto glaciers need a separate annual summit permit at $60 per climber, purchased through Recreation.gov."
  - question: "Can you drive to the top of Mount Rainier?"
    answer: "No. The highest road in the park reaches Sunrise at 6,400 feet, well below the 14,410-foot summit. Summit climbing requires crampons, an ice axe, roped-team travel, and an NPS summit permit. The most popular non-technical destination is Camp Muir at 10,080 feet, reached by an 8.5-mile round trip from Paradise over the Muir Snowfield. Guided summit climbs are available through authorized concessionaires."
  - question: "Are bears a concern at Mount Rainier?"
    answer: "Black bears live throughout the park and are occasionally seen near campgrounds and trails. Proper food storage is required: use bear boxes at campgrounds and carry food in a bear canister in the backcountry. Attacks are rare; most encounters involve bears investigating food odors near campsites. Make noise on trails in dense vegetation and give any bear plenty of space."
  - question: "What is the weather like at Mount Rainier?"
    answer: "The mountain creates its own weather and conditions change rapidly at elevation. Paradise and Sunrise can see clouds, rain, and even snow in any month of the year. Summer high temperatures at Paradise run 60 to 70 °F but afternoon thunderstorms are common. Winter at Paradise averages more than 650 inches of snowfall annually. Always bring layers, waterproof gear, and extra food and water regardless of the forecast below."

  - question: What state is Mount Rainier National Park in?
    answer: Mount Rainier National Park is in [Washington](/states/washington), near Ashford, Washington.
