faq:
  - question: "Where is Katmai National Park?"
    answer: "Katmai National Park & Preserve is on the Alaska Peninsula in southwest Alaska, about 290 miles southwest of Anchorage. The gateway town is King Salmon, Alaska, reached by commercial flight from Anchorage in about 1 hour."
  - question: "How do you get to Katmai National Park?"
    answer: "Fly commercially from Anchorage to King Salmon Airport (AKN), then take an NPS-permitted air taxi or floatplane to Brooks Camp (30-45 minutes). There are no roads connecting Katmai to the Alaska highway system."
  - question: "When is the best time to see bears at Katmai?"
    answer: "Early to mid-July is peak bear viewing at Brooks Falls, when the sockeye salmon run is strongest. September is excellent for bears feeding on spawned-out salmon before hibernation, with smaller crowds than July."
  - question: "Do you need a permit to visit Katmai?"
    answer: "Park entry is free and requires no permit. A timed-entry permit is required to access the Brooks Falls viewing platform during peak season; it is free and reserved at recreation.gov. Brooks Camp Campground requires a separate paid reservation."
  - question: "How much does it cost to visit Katmai?"
    answer: "Park entry is free. The main expense is transportation: a commercial flight from Anchorage to King Salmon costs roughly $150-$400 round trip, and an air taxi to Brooks Camp adds approximately $200-$350 per person round trip."
  - question: "Is it safe to visit Katmai with so many bears?"
    answer: "Yes, with proper precautions. All visitors receive a mandatory bear safety orientation at Brooks Camp. Viewing platforms are designed to observe bears safely from above. Bears in the Brooks Camp area are habituated to human presence but remain wild animals; follow ranger instructions at all times."
  - question: "What is the Valley of Ten Thousand Smokes?"
    answer: "The Valley of Ten Thousand Smokes is a 40-square-mile valley buried under volcanic ash and pumice from the 1912 Novarupta eruption, the largest eruption of the 20th century. The NPS runs daily bus tours 23 miles into the valley from Brooks Camp. Hikers can descend to the valley floor for off-trail exploration."

