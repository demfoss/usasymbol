sections:
  overview: |
    Katmai National Park & Preserve covers 4,093,077 acres on the Alaska Peninsula in southwest Alaska, accessible only by small aircraft or boat. The park contains the Valley of Ten Thousand Smokes, blanketed in up to 700 feet of ash by the 1912 Novarupta eruption, and Brooks Falls, where brown bears congregate each July to catch sockeye salmon mid-leap. Roughly 2,200 brown bears live within the park, one of the highest concentrations anywhere on earth. Park entry is free; the primary costs are the flights to reach it.

  known_for: |
    - **Brooks Falls bear viewing**: Every July, brown bears line Brooks Falls to intercept sockeye salmon mid-leap. The NPS viewing platform holds up to 40 people and is one of the most watched wildlife spectacles on the planet, including via 24-hour live webcam.
    - **Valley of Ten Thousand Smokes**: The 1912 Novarupta eruption buried a 40-square-mile valley under ash and pumice up to 700 feet deep. The valley's eroded ash formations remain one of the most otherworldly landscapes in the national park system.
    - **World-class sport fishing**: The park's rivers support runs of all five Pacific salmon species. Bristol Bay sockeye, rainbow trout, and Arctic char draw anglers from around the world to remote fly-in fishing camps.
    - **Brown bear density**: The park's 4 million acres support an estimated 2,200 brown bears, and encounters are routine along rivers and lakeshores throughout the summer season.


  best_things_to_see_items:
    - name: "Brooks Falls"
      description: "Brooks Falls is a 6-foot drop on the Brooks River where sockeye salmon leap upstream and brown bears wait to catch them in their jaws. Peak activity runs from early to mid-July; a platform above the falls holds 40 visitors at a time. The NPS streams live footage 24 hours a day during the season."
      image: "/images/parks/national/katmai-national-park-preserve/06-brooks-falls.jpg"
      alt: "Bear standing at the edge of a waterfall while a salmon is leaping towards it."
      credit: "NPS/David Jacob"
    - name: "Valley of Ten Thousand Smokes"
      description: "A 40-square-mile valley filled to depths of 700 feet with ash and pumice from the 1912 Novarupta eruption. The NPS operates daily bus tours from Brooks Camp to the Ukak River overlook, 23 miles into the valley. Hikers can descend to the valley floor and walk among eroded ash canyons and volcanic formations."
      image: "/images/parks/national/katmai-national-park-preserve/07-valley-of-ten-thousand-smokes.jpg"
      alt: "A large, tan, ash-filled valley is surrounded by snow covered mountains."
      credit: "NPS Photo / M. Fitz"
    - name: "Mount Katmai Caldera"
      description: "The 1912 Novarupta eruption drained the magma chamber beneath Mount Katmai, causing the summit to collapse into a caldera roughly 2 miles wide and 800 feet deep. A turquoise lake now fills the crater. The caldera is accessible by floatplane overflight from Brooks Camp or King Salmon."
      image: "/images/parks/national/katmai-national-park-preserve/08-mount-katmai-caldera.jpg"
      alt: "lake inside of an ash and glacier covered volcano"
      credit: "NPS/Roy Wood"
    - name: "Bear Viewing along the Brooks River"
      description: "Three viewing platforms on the Brooks River give different perspectives on bear behavior throughout the season. The Lower River platform is best in early July when bears are learning to fish. The Riffles platform is productive in September when bears concentrate on spawned-out salmon before hibernation."
      image: "/images/parks/national/katmai-national-park-preserve/09-bear-viewing-along-the-brooks-river.jpg"
      alt: "Three bears walk near a sleeping bear"
      credit: "NPS/Bryanna Plog"
    - name: "Dumpling Mountain"
      description: "A 4.4-mile round-trip trail from Brooks Camp climbs 800 feet to a broad summit with panoramic views of Naknek Lake, the surrounding volcanoes, and the tundra stretching to the horizon. The trail passes through spruce forest and open tundra and is one of the few maintained hiking routes in the park."
      image: "/images/parks/national/katmai-national-park-preserve/10-dumpling-mountain.jpg"
      alt: "A footpath through green tundra with expansive views of two lakes behind"
      credit: "NPS Photo/A Ramos"
    - name: "Sport Fishing"
      description: "Katmai's rivers hold all five Pacific salmon species plus rainbow trout and Arctic char. Fly-fishing for sockeye and rainbow is most productive July through September. Many anglers base at fly-in lodges deep in the preserve and never visit Brooks Camp; the park issues fishing licenses through the state of Alaska."
      image: "/images/parks/national/katmai-national-park-preserve/11-sport-fishing.jpg"
      alt: "Anglers test their luck and skill at the mouth of the Brooks River"
      credit: "NPS/M. Fitz"

  best_time_to_visit: |
    **June** is the quietest open month. Bears emerge from dens and move toward the coast and rivers, but the salmon have not yet arrived at Brooks Falls. Wildflowers bloom across the tundra and mosquitoes are at their peak; bring a head net.

    **July** is the prime month. Sockeye salmon reach Brooks Falls in the first week, and bears concentrate at the platforms in numbers that peak around mid-month. The Brooks Falls viewing platform fills to its 40-person limit quickly; timed-entry permits are required and must be reserved well in advance.

    **September** brings the fall salmon run and bears fattening for hibernation. Viewing platforms are active through the month, crowds thin from July levels, and fall color spreads across the tundra. Temperatures drop quickly after Labor Day.

    The park has no winter visitor infrastructure. Air taxi service to Brooks Camp ends in October, and the area receives heavy snow and darkness through spring.

  hiking: |
    **Easy walks** center on the Brooks Camp area. The Brooks Falls Trail covers about 1.5 miles round trip from the visitor center along the Brooks River to the falls viewing platform; it passes through dense vegetation where bear encounters are possible, so stay alert and make noise. The Lower Camp Loop connects the campground, visitor center, and river platforms on flat ground.

    **Moderate trails** are limited to one maintained route from Brooks Camp: the Dumpling Mountain Trail, 4.4 miles round trip with 800 feet of gain. The summit gives a 360-degree panorama over Naknek Lake and a chain of snow-capped volcanoes. Start early; bears use the trail regularly.

    **Valley of Ten Thousand Smokes hiking** begins at the Ukak River overlook at the end of the 23-mile bus road. From the overlook, hikers can descend steep slopes into the ash-covered valley for off-trail exploration. There are no marked trails on the valley floor; navigation by map and compass is required, and the nearest help is a long walk away. This is expert backcountry terrain.

  camping: |
    Brooks Camp Campground is the only developed campground in the park, with roughly 60 sites open June through September. Reservations are required and open in January each year through recreation.gov; July dates sell out within minutes of opening. A bear-resistant food storage system and a mandatory bear orientation session are required for all campers.

    Backcountry camping is permitted throughout the park without a fee. Visitors planning backcountry trips must self-register at the Brooks Camp visitor center and carry bear canisters, which are mandatory for all overnight trips. No maintained facilities exist outside Brooks Camp. Katmai Wilderness Lodge and several private fly-in fishing lodges operate within the park under NPS concession permits and offer an alternative to tent camping.

  fees_reservations: |
    Park entry is free. The main costs are transportation: a commercial flight from Anchorage to King Salmon Airport (AKN) takes about 1 hour, and an air taxi from King Salmon to Brooks Camp adds roughly 45 minutes. Round-trip air taxi costs from King Salmon to Brooks Camp typically run $200-$350 per person through permitted operators.

    A timed-entry permit is required to use the Brooks Falls viewing platform during peak season. Permits are released through recreation.gov and must be reserved in advance; they are free but competitive in July. Brooks Camp Campground reservations are separate and open in January.

    Confirm current fees and reservation windows at the official park page at nps.gov/katm.

  getting_there: |
    **By air to King Salmon**: Commercial flights run from Anchorage Ted Stevens International Airport (ANC) to King Salmon Airport (AKN), about 1 hour. Several airlines serve the route. King Salmon is the gateway for most park visitors.

    **By air taxi to Brooks Camp**: Multiple NPS-permitted air taxi operators fly floatplanes and wheeled aircraft from King Salmon to Brooks Camp, roughly 30-45 minutes. Advance reservations are essential in July. Float planes land directly on Naknek Lake at Brooks Camp.

    **By boat**: The Brooks River and Naknek Lake are accessible by motorboat from King Salmon via the Naknek River; the trip takes several hours depending on conditions. Boat travel is less common than air access.

  geology: |
    On June 6-9, 1912, the Novarupta vent erupted on the Alaska Peninsula in the largest volcanic eruption of the 20th century. The eruption expelled roughly 3 cubic miles of magma and ash, burying the Ukak River valley under 700 feet of pyroclastic material. Ash fell across southern Alaska and was detected as far away as Seattle.

    The eruption drained the magma chamber beneath Mount Katmai, 6 miles to the east. Without subsurface support, the mountain's summit collapsed inward within 60 hours, forming a caldera roughly 2 miles wide and 800 feet deep. A crater lake with a distinctive turquoise color now fills the caldera.

    National Geographic explorer Robert Griggs reached the valley in 1916 and found thousands of steam vents hissing from the still-hot ash. He named it the Valley of Ten Thousand Smokes. Most fumaroles have since cooled, but the ash and pumice landscape remains largely intact, eroded into canyons by rivers cutting through the soft volcanic material.

    The Alaska Peninsula sits on the Pacific Ring of Fire, and Katmai's landscape includes at least 15 active or recently active volcanoes. Glaciers cap several summits, and the contrast between volcanic ash fields, glacier-fed rivers, and coastal wetlands creates a landscape found nowhere else in the national park system.

  wildlife: |
    Brown bears are the park's defining wildlife. The NPS estimates the park supports approximately 2,200 bears, and the density along the Brooks River in July is among the highest ever documented. Bears arrive at Brooks Falls from mid-June onward, with peak numbers in the first two weeks of July. By September, bears are foraging on blueberries and spawned-out salmon to build fat reserves before denning.

    Sockeye salmon are the ecological engine of the park. An estimated 30-40 million sockeye enter Bristol Bay each summer; the fraction that reaches Katmai's rivers feeds not just bears but bald eagles, river otters, mink, and the downstream estuary food web. The salmon run typically peaks at Brooks Falls in early to mid-July.

    Moose, caribou, and wolves inhabit the park's interior. Sea otters, harbor seals, and Steller sea lions use the coastline. Over 200 bird species have been recorded, including nesting populations of bald eagles, loons, and numerous shorebirds and waterfowl on the tundra ponds.

  history: |
    The Alutiiq (Sugpiaq) people inhabited the Alaska Peninsula coast for at least 4,000 years, building villages around reliable salmon runs and maritime resources. Interior Athabascan peoples seasonally used the park's current territory for hunting. The 1912 eruption destroyed villages and forced permanent relocation of communities on the upper peninsula.

    Robert Griggs led a series of National Geographic Society expeditions to the eruption zone beginning in 1916. His photographs and reports of the Valley of Ten Thousand Smokes reached a national audience and made the case for federal protection. President Woodrow Wilson established Katmai National Monument in 1918, primarily to protect the volcanic landscape Griggs had documented.

    The monument was enlarged several times as its ecological importance became clear. Congress redesignated it as Katmai National Park and Preserve on December 2, 1980, under the Alaska National Interest Lands Conservation Act, which reorganized much of Alaska's federal land in one legislative action.

