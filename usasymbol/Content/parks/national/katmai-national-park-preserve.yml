intro_text: "Katmai National Park & Preserve protects 4 million acres of the Alaska Peninsula, including the Valley of Ten Thousand Smokes, a landscape buried by the largest volcanic eruption of the 20th century. The park holds one of the highest concentrations of brown bears on earth, and July's sockeye salmon run draws those bears to Brooks Falls, one of the most photographed wildlife spectacles in North America."

