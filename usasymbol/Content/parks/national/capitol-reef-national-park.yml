faq:
  - question: "Where is Capitol Reef National Park?"
    answer: "Capitol Reef is in south-central Utah on Highway 24, about 215 miles south of Salt Lake City (roughly 3.5 hours by car). The nearest town is Torrey, Utah, about 10 miles west of the visitor center. There is no commercial airport nearby; Salt Lake City International (SLC) is the closest major hub."
  - question: "What is the Waterpocket Fold?"
    answer: "The Waterpocket Fold is a nearly 100-mile-long monocline — a one-sided wrinkle in Earth's crust — formed when tectonic forces pushed one side of a fault block upward about 50 to 70 million years ago. The fold tilts rock layers steeply on one side, exposing about 270 million years of geologic history in the canyon walls. It is the defining feature of Capitol Reef National Park."
  - question: "When is the best time to visit Capitol Reef National Park?"
    answer: "Spring (March through May) and fall (September through November) offer the most comfortable temperatures, 50–80 °F. Summer peaks at 90–100 °F and flash floods are a real risk in the slot canyons. Fall is particularly good because late-season fruit (pears and apples) is ripe through October and crowds thin after Labor Day."
  - question: "Can you pick fruit at Capitol Reef?"
    answer: "Yes. The Fruita orchards have over 3,000 trees bearing peaches, pears, cherries, apricots, and apples. When fruit is ripe — generally late June through October depending on variety — visitors may pick and eat fruit in the orchard at no additional charge beyond the park entrance fee. Taking fruit out of the orchard is limited to small quantities for personal consumption."
  - question: "How much does it cost to enter Capitol Reef National Park?"
    answer: "The entrance fee is $20 per vehicle for a 7-day pass — lower than most other Utah national parks. Motorcycles pay $15 and individuals on foot or bicycle pay $10 per person for 7 days. The America the Beautiful Annual Pass ($80/year) covers Capitol Reef and all other U.S. national parks. Highway 24 through the park is free; the fee applies to the Scenic Drive."
  - question: "What is the best hike in Capitol Reef?"
    answer: "Hickman Bridge Trail (1.8 miles round trip, 400 ft gain) is the most popular hike, leading to a 133-foot natural sandstone bridge with Capitol Dome in the background. For a flat canyon experience, Capitol Gorge Trail (2.0 miles round trip) passes the Pioneer Register inscriptions and natural water pockets. Cassidy Arch Trail (3.5 miles round trip, 670 ft gain) offers the best elevated views."
  - question: "Are flash floods a danger at Capitol Reef?"
    answer: "Yes. Grand Wash and Capitol Gorge are narrow slot canyons where flash floods can arrive suddenly with no local rain. Check the weather forecast for the entire region before entering either canyon. If you hear a roar or see water rising, move to high ground immediately. The NPS posts flood warnings at trailheads when conditions are elevated."

