sections:
  overview: |
    Capitol Reef National Park sits in south-central Utah, centered on the Waterpocket Fold, a nearly 100-mile-long monocline — a single-sided wrinkle in Earth's crust — that cuts through 241,904 acres of canyon and mesa terrain. Utah Highway 24 passes through the heart of the park at no charge; the paved Scenic Drive and surrounding backcountry require the $20 entrance fee. The park ranks 24th among the 63 U.S. national parks by annual visitation, drawing roughly 1.5 million visitors in 2023. Unlike the other Utah national parks, Capitol Reef has no shuttle system and no entry reservation requirement, and its entrance fee is lower than those at Zion, Bryce Canyon, or Arches. The Fruita Historic District, a cluster of working pioneer orchards planted by Mormon settlers in the 1880s, lies at the park's center and is open for fruit picking in season.

  known_for: |
    The Waterpocket Fold, a nearly 100-mile-long monocline that exposes rock layers spanning 270 million years of Earth history, creating the sheer cliffs, domes, canyons, and water-filled potholes that define the park's landscape.
    The Capitol Dome, a rounded white Navajo Sandstone formation that resembles the U.S. Capitol building and gives the park its name; the "reef" refers to the barrier of cliffs that blocked overland travel much as a coral reef blocks ships.
    Fruita Historic District, a working collection of pioneer orchards planted in the 1880s with peach, pear, cherry, apricot, and apple trees; visitors may pick and eat fruit in season at no charge beyond the entrance fee.
    Fremont culture petroglyphs, particularly the large panel of bighorn sheep and human figures along Highway 24 near the visitor center, left by people who lived and farmed along the Fremont River from about 700 to 1300 CE.

  best_things_to_see_items:
    - name: "Hickman Bridge"
      description: "Hickman Bridge is a 133-foot natural sandstone bridge at the end of a 1.8-mile round-trip trail east of the visitor center. The trail climbs 400 feet through a side canyon before emerging at the arch, which frames Capitol Dome in the distance. The trailhead is on Highway 24 and requires no scenic drive fee."
      image: "https://www.nps.gov/common/uploads/structured_data/3C82E4FB-1DD8-B71B-0B8614194A6D08FA.jpg"
      alt: "A hiker stands beside Hickman Bridge, a natural sandstone bridge"
      credit: "NPS Photo"
    - name: "Fruita Historic Orchards"
      description: "The Fruita orchards are a working collection of more than 3,000 fruit trees — peach, pear, cherry, apricot, and apple — planted by Mormon pioneer Nels Johnson and later settlers beginning in 1880. The NPS maintains the orchards and opens them for free picking when fruit is ripe, typically late June through October depending on variety. Mule deer graze the orchard grass at dusk year-round."
      image: "https://www.nps.gov/common/uploads/structured_data/3C82E9BB-1DD8-B71B-0B30AEA8D8052350.jpg"
      alt: "Fruit tree with peaches in front of red sandstone cliffs"
      credit: "NPS Photo"
    - name: "Fremont Petroglyphs"
      description: "A large panel of Fremont culture petroglyphs is carved into a cliff face on the north side of Highway 24, about one mile east of the visitor center. The panel shows bighorn sheep and trapezoidal human figures with headdresses, hammered into the dark desert varnish on Wingate Sandstone. Roadside pullouts allow close viewing without any hiking."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/07C490B0-C60A-35DD-40E539E66DDF3F6F.jpg?width=1600&quality=90&mode=crop"
      alt: "Rock markings carved into flat red rock depicting human-like figures with trapezoidal bodies."
      credit: "S. Cotrell"
    - name: "Grand Wash"
      description: "Grand Wash is a flat-floored slot canyon cutting through the Waterpocket Fold. The 4.4-mile round-trip trail follows the canyon between sheer sandstone walls up to 800 feet high with barely 20 feet of width at the narrowest point. The trailhead is on the Scenic Drive; the canyon is also accessible from the east via Highway 24."
      image: "https://www.nps.gov/care/planyourvisit/images/Stop3grandwash.jpg?maxwidth=650&autorotate=false"
      alt: "Grand Wash Road"
      credit: "NPS"
    - name: "Capitol Gorge and Pioneer Register"
      description: "Capitol Gorge is a narrow canyon on the southern Scenic Drive that served as a wagon road through the Waterpocket Fold until 1962. The Pioneer Register, 1.0 mile from the trailhead, is a sandstone wall where travelers carved their names from 1871 onward. Continuing another 0.2 miles reaches a series of natural water tanks — potholes in Navajo Sandstone — visible from above."
      image: ""
      alt: "Historic signatures carved into the canyon wall at Pioneer Register."
    - name: "Cassidy Arch"
      description: "Cassidy Arch is a large freestanding sandstone arch above Grand Wash, reached by a 3.5-mile round-trip trail with 670 feet of gain. The arch is named for outlaw Butch Cassidy, who is said to have camped in the canyon. The final section of the trail crosses exposed slickrock to the arch rim; the view back toward the Waterpocket Fold is the widest in this part of the park."
      image: ""
      alt: "View toward Cassidy Arch above Grand Wash."
    - name: "Cathedral Valley"
      description: "Cathedral Valley is the remote northern section of Capitol Reef, accessible by high-clearance 4WD on 60 miles of unpaved road from Highway 24. The valley's dominant features are Temple of the Sun and Temple of the Moon — isolated monoliths of Entrada Sandstone rising 400 to 500 feet from a flat, empty plain. River crossings are required and road conditions vary seasonally."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/B53E0301-F924-63FA-417AD5192DC50604.jpeg?width=1600&quality=90&mode=crop"
      alt: "large reddish brown monoliths rise from the desert floor"
      credit: "NPS / Damian Popovic"

