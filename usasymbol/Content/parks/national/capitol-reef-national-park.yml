seo_description: "Visit Capitol Reef National Park in Utah: the Waterpocket Fold, top hikes, best time to go, fees, and how to get there."
intro_text: "Capitol Reef National Park in [Utah](/states/utah) protects 241,904 acres along the Waterpocket Fold, a 100-mile wrinkle in Earth's crust that exposes nearly 270 million years of geologic history. Established in 1971, the park draws roughly 1.5 million visitors a year to its canyons, arches, and working pioneer orchards."

