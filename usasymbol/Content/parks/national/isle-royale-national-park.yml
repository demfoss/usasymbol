faq:
  - question: "Where is Isle Royale National Park?"
    answer: "Isle Royale is an island in the northwest corner of Lake Superior, belonging to Michigan. The nearest mainland city is Houghton, Michigan, about 56 miles to the southeast. The park has no road connection to the mainland."
  - question: "How do you get to Isle Royale?"
    answer: "By ferry or float plane only. Ferries run from Houghton, Michigan (6 hours), Copper Harbor, Michigan (3.5 hours), and Grand Portage, Minnesota (2.5 hours). Float plane service operates from Houghton. All options require reservations."
  - question: "When is Isle Royale open?"
    answer: "The park is open mid-April through October. It closes entirely in November and does not reopen until mid-April. Peak ferry and lodge operations run late May through Labor Day."
  - question: "How much does Isle Royale cost?"
    answer: "$7 per person per day for park entry. Ferry passage is additional, ranging from roughly $70 to $150 per person each way depending on the departure point. The America the Beautiful annual pass covers the entry fee."
  - question: "Can you see wolves at Isle Royale?"
    answer: "Wolves are present but rarely seen. The island's wolf population has been studied since 1958 and numbered around 25 individuals after the 2018-2019 reintroduction. Hearing howling from camp is more common than a visual sighting."
  - question: "Are there moose at Isle Royale?"
    answer: "Yes. Isle Royale has one of the highest moose densities in North America. Moose are commonly seen near beaver ponds and lake edges throughout the island, especially at dawn and dusk near Washington Harbor, Daisy Farm, and Windigo."
  - question: "Can you bring pets to Isle Royale?"
    answer: "No. Pets are not permitted anywhere in Isle Royale National Park, including on ferries operated by the NPS. This protects the island's wildlife, particularly the moose and wolf populations."

