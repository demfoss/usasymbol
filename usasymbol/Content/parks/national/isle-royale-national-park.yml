intro_text: "Isle Royale is a 45-mile-long island in the northwest corner of Lake Superior, reachable only by boat or float plane. The park holds 165 miles of trails, ten Lake Superior shipwrecks for divers, and a moose-wolf ecosystem studied continuously since 1958. No roads, no vehicles, and no winter access make it the least-visited national park."

