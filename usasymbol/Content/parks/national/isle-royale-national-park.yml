sections:
  overview: |
    Isle Royale National Park occupies a 45-mile-long island and surrounding waters in the northwest corner of Lake Superior, entirely within Michigan. The park's 571,790 acres include the island's interior lakes, forest, and wetlands plus a broad belt of Lake Superior open water. There are no roads or wheeled vehicles; every visitor arrives by ferry or float plane and travels on foot or by water. With roughly 25,000 visitors per year, Isle Royale ranks 63rd among the 63 national parks in visitation, the least visited in the lower 48.

  known_for: |
    - **Moose and wolves**: The island's moose and wolf populations have been the subject of the world's longest continuous predator-prey study, running without interruption since 1958.
    - **Lake Superior shipwrecks**: Ten historic shipwrecks lie in the cold, clear waters surrounding the island, making Isle Royale one of the top freshwater dive destinations in North America.
    - **Roadless wilderness**: No roads, no vehicles, and no access between November and mid-April give the island a true wilderness character rare among national parks east of the Rockies.
    - **Greenstone Ridge Trail**: A 40-mile spine trail traverses the island's full length from Windigo to Rock Harbor, a 3-to-5-day backpacking route with Lake Superior views in both directions.


  best_things_to_see_items:
    - name: "Moose in the Wild"
      description: "Isle Royale supports one of the highest moose densities in North America. Moose wade in beaver ponds and feed along lake edges throughout the island, most reliably near Windigo, Washington Harbor, and Daisy Farm. Early morning and evening are the best viewing windows; give moose a wide berth."
      image: "/images/parks/national/isle-royale-national-park/06-moose-in-the-wild.jpg"
      alt: "Cow and calf moose stand in a creek facing each other while water drips off the cow&#39;s face."
      credit: "NPS"
    - name: "Greenstone Ridge Trail"
      description: "The 40-mile Greenstone Ridge Trail runs the full length of the island along its central spine, offering Lake Superior views to the north and south on clear days. Most hikers take 3 to 5 days, camping at designated sites along the route. The traverse ends at Rock Harbor or Windigo, where ferries depart."
      image: "/images/parks/national/isle-royale-national-park/07-greenstone-ridge-trail.jpg"
      alt: "Wooden trail Marker for Greenstone Ridge Trail"
      credit: "NPS"
    - name: "Rock of Ages Lighthouse"
      description: "The 1908 Rock of Ages Lighthouse rises 130 feet from a reef southwest of the island and is best seen by boat tour from Rock Harbor. The lighthouse marks one of Lake Superior's most dangerous shoals and sits near several park shipwrecks popular with divers."
      image: "/images/parks/national/isle-royale-national-park/08-rock-of-ages-lighthouse.jpg"
      alt: "Aerial view of Rock of Ages Lighthouse"
      credit: "NPS Photo / Paul Brown"
    - name: "Shipwreck Diving"
      description: "Ten historic shipwrecks rest in the cold, clear waters around Isle Royale, ranging in depth from 10 to 170 feet. The Kamloops, Emperor, and America are the most visited. Lake Superior's cold temperatures preserve the wrecks in extraordinary condition; visibility frequently exceeds 40 feet."
      image: "/images/parks/national/isle-royale-national-park/09-shipwreck-diving.jpg"
      alt: "A diver exploring the shipwreck Emperor."
      credit: "NPS Photo"
    - name: "Rock Harbor and Scoville Point"
      description: "Rock Harbor is the island's main eastern hub with the visitor center, Rock Harbor Lodge, a camp store, and ferry dock. The 4.2-mile Scoville Point loop leaves from Rock Harbor and follows the rocky Lake Superior shoreline through boreal forest, with consistent moose habitat along the inner harbor."
      image: "/images/parks/national/isle-royale-national-park/10-rock-harbor-and-scoville-point.jpg"
      alt: "view of Rock Harbor channel rocky shoreline from overlooking cliff"
      credit: "Photo courtesy of Bill Roth."
    - name: "Windigo and Washington Harbor"
      description: "Windigo, at the island's southwest end, is the ferry landing for boats from Grand Portage, Minnesota. Washington Harbor is calm, shallow water ideal for kayaking and canoeing, surrounded by spruce-fir forest. The visitor station at Windigo rents canoes and sells basic supplies."
      image: "/images/parks/national/isle-royale-national-park/11-windigo-and-washington-harbor.jpg"
      alt: "Aerial view of Washington Harbor."
      credit: "NPS Photo/Paul Brown"

  best_time_to_visit: |
    **Late May-June** is the quietest opening window. The park opens in mid-April, but full ferry service and lodge operations begin in late May. Blackflies and mosquitoes peak in June; head nets are standard gear. Trail conditions are good and wildlife is active.

    **July-August** is peak season. All ferries run on full schedules, Rock Harbor Lodge is open, and daytime temperatures reach 65-75°F. Bugs thin out by mid-July. Expect the highest competition for campsites and ferry bookings.

    **September-October** is the best window for experienced visitors. Bugs are gone, temperatures are cool (45-65°F), fall colors begin in late September, and visitor numbers drop sharply. Ferries begin cutting back schedules after Labor Day; confirm departure times before booking.

    The park closes entirely in November and does not reopen until mid-April. No winter access exists.

  hiking: |
    **Easy trails** cluster around the two main service hubs. The Stoll Memorial Trail is a 4.4-mile loop from Rock Harbor that follows the rocky Lake Superior shoreline and passes through boreal forest, completing in 2 to 3 hours. The Scoville Point Trail adds 4.2 miles of similar terrain on a rocky point with open water views on three sides.

    **Moderate trails** take hikers into the island's interior. The Huginnin Cove Loop runs 9.4 miles from Windigo through beaver pond country and moose habitat along the north shore. The Feldtmann Ridge Trail covers about 14.8 miles and is best done as an overnight with a camp at Feldtmann Lake.

    **Strenuous multi-day routes** define the Isle Royale experience. The Greenstone Ridge Trail spans roughly 40 miles along the island's central spine from Windigo to Rock Harbor, typically completed in 3 to 5 days with camps at designated sites. The Minong Ridge Trail covers approximately 26 miles along the rugged north shore with limited water sources and technical terrain; experienced backcountry hikers only. Carry a water filter; surface water is available but must be treated.

  camping: |
    Designated campgrounds dot the island along major trails and waterways, each with tent sites, 3-sided shelters, and pit toilets. Rock Harbor area campgrounds include Daisy Farm and Moskey Basin. On the west end, Washington Creek Campground serves Windigo arrivals. Backcountry sites require advance registration.

    All camping requires an entrance fee payment and a campsite reservation. Rock Harbor Lodge offers lodge rooms and housekeeping cabins for those who prefer beds; the lodge operates late May through Labor Day and books months in advance. No RV access exists; the island has no roads.

    Pets are not permitted anywhere on Isle Royale, including campgrounds. No food storage canisters are required, but hanging food away from camp is strongly recommended due to red foxes habituated to humans near the main hubs.

  fees_reservations: |
    The entrance fee is $7 per person per day, charged for each day spent in the park. There is no vehicle fee because no vehicles enter the island. The America the Beautiful annual pass covers the entrance fee.

    Ferry passage is sold separately by private operators and costs roughly $70-$150 per person each way depending on the departure port and vessel. Float plane access from Houghton is available through a private operator and costs significantly more. All ferry departures require reservations; summer sailings fill weeks in advance.

    Campsite reservations are required and made through recreation.gov. Rock Harbor Lodge reservations open months ahead and sell out for peak weeks. Confirm current fees and rules at the official park page at nps.gov/isro.

  getting_there: |
    **By ferry from Houghton, Michigan**: The MV Ranger III departs Houghton for Rock Harbor, a 6-hour crossing. Houghton County Memorial Airport (CMX) is about 5 miles from the Houghton ferry dock. This is the most common gateway from the U.S.

    **By ferry from Copper Harbor, Michigan**: The Isle Royale Queen IV runs to Rock Harbor in about 3.5 hours from Copper Harbor on the Keweenaw Peninsula.

    **By ferry from Grand Portage, Minnesota**: The Voyageur II and Greenstone cross to Windigo in about 2.5-3 hours. This is the fastest crossing and the standard western approach.

    **By float plane**: Royale Air Service operates float plane flights between Houghton and Rock Harbor or Windigo, weather permitting. Float planes carry limited gear; verify baggage limits when booking.

  geology: |
    Isle Royale exposes some of the oldest rock accessible in the national park system. The island's core consists of Precambrian basalt flows deposited roughly 1.1 billion years ago during a continental rift event that split the North American plate. These ancient lava flows are visible along the shoreline as dark, fine-grained ledges.

    Copper mineralized into the basalt fractures over millions of years, creating the native copper deposits that drew Indigenous miners thousands of years before European contact. Pits and trenches from prehistoric copper extraction are still visible in parts of the island's interior.

    Glacial ice reshaped the island during the last ice age. The Laurentide Ice Sheet advanced from the northeast, grinding down the softer rock between lava ridges and carving the island's characteristic pattern of parallel northeast-southwest ridges separated by narrow lakes and wetlands. This ridge-and-trough topography controls every major trail on the island.

    Lake Superior itself occupies the same ancient rift basin as the island's basalt. Its cold, clear water is exceptionally low in nutrients and transparent, which preserves both the underwater shipwrecks and the native lake trout fishery that supported commercial fishing on the island for over a century.

  wildlife: |
    Moose are the island's signature animal. They colonized Isle Royale by swimming from Canada around 1900, and the island's isolation has made the population a closed system ideal for scientific study. Moose feed in beaver ponds, shallow lake margins, and balsam fir stands throughout the island. Washington Harbor, Daisy Farm, and Tobin Harbor are reliable viewing spots.

    Wolves arrived across Lake Superior ice around 1949 and established the predator-prey dynamic that researchers have tracked since 1958. Wolf numbers have fluctuated dramatically, dropping as low as 2 individuals before NPS authorized a reintroduction in 2018-2019. Hearing wolves howl at night is possible from campgrounds but sightings are uncommon.

    Common loons nest on the island's interior lakes and call through summer nights. Bald eagles patrol the shorelines. Mink, river otter, and beaver are present in the wetlands, and red foxes appear near Rock Harbor and Windigo, where they have learned to approach campers for food. Do not feed them.

  history: |
    The Ojibwe people mined native copper on Isle Royale for at least 4,500 years. Copper pits and trenches from prehistoric mining are preserved throughout the island, and copper objects from Isle Royale have been found at archaeological sites across the eastern continent. The Ojibwe knew the island as Minong, meaning "a good place to get copper."

    American commercial fishing began on the island in the 1840s and lasted through the mid-twentieth century. Fishing families built permanent camps on the island's sheltered harbors; the Edison Fishery at Rock Harbor, preserved by the NPS, documents this way of life. Lake trout and whitefish were the primary catches.

    Congress established Isle Royale National Park in 1940. The last private landholders were bought out over subsequent decades. UNESCO designated the park an International Biosphere Reserve in 1981, recognizing the ongoing wolf-moose research as a global scientific resource.

    The Lake Superior Chippewa retain treaty fishing rights within park waters, a right affirmed by federal courts and still exercised today.

