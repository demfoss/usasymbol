sections:
  overview: |
    Glacier National Park protects 1,013,322 acres of the northern Rocky Mountains in Montana, along the border with Canada. Going-to-the-Sun Road, a 50-mile highway across the Continental Divide, is the park's defining experience and one of the most scenic mountain drives in North America. About 3 million people visit each year, placing Glacier 11th among U.S. national parks, with most of that traffic concentrated in the 10 weeks from late June through early September. Whitefish and Kalispell serve as the main west-side gateways; Glacier Park International Airport (FCA) is about 30 miles from the West Entrance.

  known_for: |
    **Going-to-the-Sun Road**: A 50-mile highway crossing Logan Pass at 6,646 feet, connecting the west side to the east side through the heart of the park. The road opens fully only from mid-June to mid-October and requires a vehicle reservation during peak summer hours.
    **Alpine wildlife**: Mountain goats and bighorn sheep are regularly seen from the roadside at Logan Pass, and grizzly bears, black bears, moose, wolves, and wolverines all live within the park.
    **Glacially sculpted terrain**: Knife-edge arêtes, bowl-shaped cirques, deep U-shaped valleys, and turquoise lakes show the work of repeated glaciation over the past two million years.
    **Shrinking glaciers**: The park once held more than 150 named glaciers. Fewer than 30 active glaciers remain today, and climate models project the loss of most remaining ice within decades.

  best_things_to_see_items:
    - name: "Going-to-the-Sun Road"
      description: "The 50-mile road crosses the Continental Divide at Logan Pass (6,646 ft) and passes through a sequence of valley forest, hanging gardens, sheer cliffs, and high alpine terrain. Vehicle reservations are required for the Logan Pass corridor between 6 a.m. and 3 p.m. from late May through mid-September; book on Recreation.gov. The road typically opens fully to vehicles from late June through mid-October depending on snowpack."
      image: "/images/parks/national/glacier-national-park/06-going-to-the-sun-road.jpg"
      alt: "Antique car on road, dwarfed by mountain vista"
      credit: "NPS/Jacob W. Frank"
    - name: "Logan Pass and Hidden Lake Overlook"
      description: "Logan Pass is the highest point on Going-to-the-Sun Road and the trailhead for the Hidden Lake Overlook Trail, a 2.8-mile round trip across alpine meadows filled with wildflowers in July. Mountain goats are frequently seen within yards of hikers along this trail, often below the boardwalk. The pass visitor center is the park's best orientation point for understanding the Continental Divide landscape."
      image: "/images/parks/national/glacier-national-park/07-logan-pass.jpg"
      alt: "Subalpine wildflowers and Logan Pass"
      credit: ""
    - name: "Many Glacier"
      description: "The Many Glacier valley in the northeast section of the park is the most concentrated single area for scenery, trails, and wildlife. Grinnell Lake, Swiftcurrent Lake, and Lake Josephine are all within a short walk of the Many Glacier Hotel. Boat tours cross the lakes in summer, reducing the round-trip distance on popular trails. Grizzly bears are frequently seen on the surrounding slopes."
      image: "/images/parks/national/glacier-national-park/08-many-glacier-hotel.jpg"
      alt: "A rustic brown-wooden hotel sits in front of a mountain range. A black and white image aligns."
      credit: ""
    - name: "Lake McDonald Lodge"
      description: "Lake McDonald Lodge sits on the eastern shore of the largest lake in the park, a 10-mile-long, 472-foot-deep body of water on the west side. Built in 1913 in a Swiss chalet style, the lodge interior features a great hall with mounted animal trophies and carved log railings from the early 20th-century era of railway tourism. The lodge and surrounding cabins are open from mid-May through early October."
      image: "/images/parks/national/glacier-national-park/19-lake-mcdonald-lodge.jpg"
      alt: "A rustic three-story lodge with dark brown wood and white stone decorated with hanging plants."
      credit: "NPS photo by David Restivo."
    - name: "Grinnell Glacier Trail"
      description: "The Grinnell Glacier Trail reaches one of the park's most accessible active glaciers, visible from a viewpoint at the end of an 11-mile round trip from the Many Glacier trailhead with 1,600 feet of elevation gain. Boat shuttles across Swiftcurrent and Josephine lakes reduce the round trip to about 7.6 miles. The glacier has shrunk dramatically since George Bird Grinnell first visited it in the 1880s and the retreating ice is visible in comparison photos posted at the trailhead."
      image: "/images/parks/national/glacier-national-park/09-grinnell-glacier-trail.jpg"
      alt: "A turquoise lake with floating pieces of ice sits at the base of snow-speckled, striated cliffs."
      credit: "NPS"
    - name: "St. Mary Lake and Wild Goose Island"
      description: "St. Mary Lake on the east side of the park is 10 miles long and flanked by high peaks. Wild Goose Island, a tiny tree-covered rock outcrop near the center of the lake, is the most photographed location on the east side. The Wild Goose Island Overlook pull-out on Going-to-the-Sun Road provides the classic view. St. Mary Falls, 1.7 miles round trip from the road, drops through a narrow red-rock gorge into a turquoise pool."
      image: "/images/parks/national/glacier-national-park/10-wild-goose-island.jpg"
      alt: "A cloudy view of Wild Goose Island in St. Mary Lake"
      credit: ""
    - name: "Highline Trail"
      description: "The Highline Trail runs 11.8 miles one way from Logan Pass northward along the Continental Divide to Waterton Valley, traversing cliff-side sections, alpine meadows, and high passes with consistent views into the park's interior. The first mile from Logan Pass hugs a near-vertical cliff face with a fixed cable for handholds; most hikers turn around at Grinnell Glacier Overlook (7.6 miles round trip) rather than completing the full traverse. A shuttle or trail connection makes the full one-way route practical."
      image: "/images/parks/national/glacier-national-park/11-highline-trail.jpg"
      alt: "A hiker in red takes in a sweeping landscape cloaked in grey clouds."
      credit: "NPS"

