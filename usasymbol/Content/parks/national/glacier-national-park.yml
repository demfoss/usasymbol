  fees_reservations: |
    The entrance fee is $35 per vehicle for a 7-day pass, $30 per motorcycle, or $20 per person on foot or bicycle. The America the Beautiful Annual Pass ($80/year) covers Glacier and all other federal recreation areas for 12 months.

    A separate vehicle reservation is required to drive Going-to-the-Sun Road between the Apgar turnoff and the St. Mary Visitor Center from late May through mid-September, during the hours of 6 a.m. to 3 p.m. Reservations are made through Recreation.gov and are typically required beginning in mid-spring; the system opens in April. This reservation is separate from the entrance fee and campground reservations. The Many Glacier road corridor may also require a timed-entry reservation in peak season; check the park website for the current year's rules.

    Campground reservations for all major campgrounds open on Recreation.gov in late winter and fill within minutes for July and August dates. Backcountry permits open in mid-March on Recreation.gov. Advance planning is essential for any summer visit.

    Confirm current fees and rules at the official park page: nps.gov/glac.

  getting_there: |
    **By car:** The West Entrance near the town of West Glacier is the main entry point, reached by US-2 from Whitefish and Kalispell. The East Entrance at St. Mary is reached from US-89 from the south. The Many Glacier area branches off from US-89 about 9 miles south of Babb. Driving the full park from west to east via Going-to-the-Sun Road (50 miles) is only possible when the road is fully open, typically from mid-June to mid-October.

    **By air:** Glacier Park International Airport (FCA) near Kalispell is the nearest commercial airport, about 30 miles from the West Entrance, with nonstop service from Seattle, Salt Lake City, Denver, and other hubs in summer. Missoula International Airport (MSO) is about 75 miles south and has more year-round service options.

    **By train:** Amtrak's Empire Builder stops daily at West Glacier and East Glacier Park on its Chicago-to-Seattle route. The East Glacier station is a short distance from the Glacier Park Lodge and the Two Medicine trailhead. Amtrak makes Glacier one of the few national parks reachable by rail without a car, though a car is strongly recommended for flexibility once inside.

  geology: |
    Glacier's rocks are among the oldest exposed mountain rocks in North America. The park's basement is Belt Supergroup sedimentary rock deposited in shallow seas roughly 1.5 billion years ago. These ancient mudstones, siltstones, and limestones were buried, then later uplifted and thrust eastward during the Lewis Overthrust, a tectonic event that pushed older rock more than 50 miles east over much younger Cretaceous formations. The visible result is a geological anomaly: the park's colorful layered rocks are far older than the valley rocks beneath them.

    The signature red and green argillites that color the canyon walls and river cobbles throughout the park are oxidized Belt Supergroup mudstones. The red tones come from iron oxides and the green from reduced iron compounds, reflecting alternating oxygen levels during deposition. Ripple marks and other sedimentary structures from billion-year-old shallow water are preserved in the rock faces above many trails.

    The current landscape was carved by repeated glaciation during the Pleistocene. Ice sheets sculpted deep U-shaped valleys, sharpened ridgelines into knife-edge arêtes, excavated bowl-shaped cirques below every major summit, and deposited moraines across the valley floors. Grinnell Lake and the other turquoise lakes of Many Glacier sit in cirque basins carved by ice and are fed by streams still running off active glaciers above.

    Triple Divide Peak near the park's center is one of the hydrological wonders of North America: precipitation falling on its summit can flow to the Pacific Ocean, the Atlantic, or Hudson Bay, making it the only point in the contiguous United States where water drains to all three ocean systems.

  wildlife: |
    Grizzly bears and black bears both live throughout the park. About 300 grizzly bears use Glacier and the surrounding wilderness, making it one of the last places in the contiguous United States with a self-sustaining grizzly population. Bears are active across all elevations from mid-April through October. Carry bear spray on every trail outside of the developed west-side valley areas, know how to deploy it, and hike in groups of three or more whenever possible.

    Mountain goats are the most frequently seen large mammal at Logan Pass, where they graze on the mineral-rich soils along the boardwalk trail and often approach within feet of hikers. Bighorn sheep are common on the rocky slopes of the Many Glacier and Two Medicine areas. Moose appear in willow and riparian areas near the west-side lakes and in the St. Mary and Many Glacier valleys. Wolves are present but rarely seen; wolverines and lynx live in the backcountry but sightings are uncommon.

    The park supports strong populations of westslope cutthroat trout and bull trout, both native species that serve as indicators of stream health. Fishing requires a Montana state fishing license. Pikas and hoary marmots are abundant above treeline and often audible from Logan Pass trails; pikas are considered a sensitive indicator species for high-elevation warming. More than 260 bird species have been recorded, including golden eagles, bald eagles, osprey, harlequin ducks on the park's fast streams, and Clark's nutcracker throughout the high country.

  history: |
    The lands that became Glacier National Park lie within the traditional territories of multiple Indigenous nations. The Blackfeet Confederacy has lived east of the Continental Divide for centuries, and the area the NPS calls Many Glacier was and remains sacred ground. The Salish, Kootenai, and Pend d'Oreille nations used the west side of the mountains for hunting, fishing, and travel. In 1895, the federal government purchased the eastern portion of the range from the Blackfeet for $1.5 million after pressuring the tribe to sell under threat of further land reduction; the transaction remains contested and is central to ongoing land and water rights disputes.

    Explorer and naturalist George Bird Grinnell first traveled through the area in 1885, named many of its features, and spent two decades advocating for federal protection. He called the area the Crown of the Continent. Congress established Glacier National Park on May 11, 1910. The Great Northern Railway, whose main line passed through the Flathead Valley, immediately promoted the park as the "American Alps" and built a network of hotels and backcountry chalets to draw rail passengers. Several of those lodges, including the Lake McDonald Lodge (1913) and the Many Glacier Hotel (1914), remain in operation and are now National Historic Landmarks.

    Going-to-the-Sun Road was completed in 1932 after 11 years of construction over some of the most challenging mountain terrain in the country. The road, itself a National Historic Civil Engineering Landmark, opened the park's interior to automobile tourists and transformed the visitor experience. In 1932, Glacier and Canada's adjoining Waterton Lakes National Park were jointly designated the world's first International Peace Park. The park was designated a UNESCO World Heritage Site in 1995.

faq:
  - question: "Where is Glacier National Park?"
    answer: "Glacier is in northwestern Montana, along the Canadian border. The West Entrance near West Glacier is about 30 miles from Glacier Park International Airport (FCA) near Kalispell. The East Entrance at St. Mary is reached from US-89."
  - question: "When is the best time to visit Glacier?"
    answer: "Late July through early September gives the best combination of open road, snow-free trails, and wildflowers. September offers thinning crowds with larches turning gold. Avoid planning around Going-to-the-Sun Road without checking whether it is open; the road typically opens fully in late June and can close from early snowfall in September or October."
  - question: "Do I need a reservation to visit Glacier?"
    answer: "Yes, in peak season. A vehicle reservation is required to drive Going-to-the-Sun Road between Apgar and St. Mary during the hours of 6 a.m. to 3 p.m. from late May through mid-September. Reservations are made on Recreation.gov. Campground reservations are also required at the major campgrounds and fill within minutes of opening. Check nps.gov/glac for the current year's specific rules."
  - question: "How much does it cost to enter Glacier?"
    answer: "The entrance fee is $35 per vehicle for a 7-day pass, $30 per motorcycle, or $20 per person on foot or bicycle. The America the Beautiful Annual Pass ($80) covers Glacier and all U.S. national parks for one year."
  - question: "What are the best hikes in Glacier?"
    answer: "Hidden Lake Overlook (2.8 miles round trip, easy-moderate) is the best short hike and usually has mountain goat sightings. Avalanche Lake (5.9 miles, moderate) is the best mid-length hike from the west side. Grinnell Glacier (11 miles or 7.6 miles with boat shuttle, strenuous) is the premier full-day hike from Many Glacier. Highline Trail from Logan Pass is the most iconic long route."
  - question: "Are there bears in Glacier National Park?"
    answer: "Yes. Both grizzly bears and black bears are present throughout the park. About 300 grizzly bears live in and around Glacier. Carry bear spray on all trails beyond the main west-side valley areas, hike in groups of three or more, make noise on the trail, and store food in bear boxes or canisters at all times."
  - question: "Can I drive Going-to-the-Sun Road in an RV?"
    answer: "Vehicles over 21 feet long or 8 feet wide, including most RVs and vehicles with trailers, cannot drive the Logan Pass section of Going-to-the-Sun Road between Avalanche Creek and the Sun Point parking area. The road has tight switchbacks and low clearances in this stretch. Park your RV at Apgar or Sprague Creek and use the free park shuttle to access Logan Pass."

