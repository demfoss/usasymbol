  camping: |
    Glacier has 13 frontcountry campgrounds spread across the west side, east side, and remote areas including Two Medicine and Cut Bank. The five largest, Apgar (194 sites), Fish Creek (178), St. Mary (148), Many Glacier (109), and Avalanche Creek (87), take reservations through Recreation.gov and fill within minutes of opening for July and August. Many Glacier in particular is one of the most in-demand campgrounds in the national park system; book the moment reservations open, typically in early spring. Pets are not allowed on park trails, which limits campsite utility for pet owners.

    Backcountry camping requires a permit, available through Recreation.gov starting in mid-March for the upcoming summer season. The park has more than 65 backcountry campsites spread across the trail system, all requiring a bear canister or use of the provided bear box at the site. Quotas are strict on popular backcountry routes. Campfires are prohibited at most backcountry sites to protect vegetation.

  fees:
    - pass_type: "Private vehicle (7-day)"
      cost: "$35"
      note: "Covers the vehicle and all passengers for 7 consecutive days."
    - pass_type: "Motorcycle (7-day)"
      cost: "$30"
