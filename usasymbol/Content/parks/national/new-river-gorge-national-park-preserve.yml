sections:
  overview: |
    New River Gorge National Park & Preserve covers 70,814 acres of forested canyon in southern West Virginia, centered on a 53-mile stretch of the New River. The gorge cuts up to 1,300 feet deep through the Appalachian Plateau, exposing 300-million-year-old sandstone cliffs that have made the area one of the top rock climbing destinations in the eastern United States. The New River Gorge Bridge, spanning 3,030 feet and rising 876 feet above the water, is the longest steel arch bridge in the Western Hemisphere and the park's defining landmark. Congress designated the park the 63rd national park in December 2020, elevating it from its earlier status as a national river. Fayetteville, West Virginia, is the main gateway, roughly 65 miles from Yeager Airport in Charleston.

  known_for: |
    The park is known for the New River Gorge Bridge, an engineering landmark that draws bridge-walkers and, on Bridge Day each October, the largest extreme sports festival in the United States. Whitewater rafting on the Lower New River produces Class III–V rapids through a canyon with no road access; hundreds of thousands of visitors run it each year. Rock climbing draws enthusiasts to more than 1,400 established routes on Nuttall Sandstone cliffs. Sandstone Falls, at the southern end of the park, is the largest waterfall on the New River — 25 feet high and 1,500 feet wide — and accessible by a short boardwalk.

  best_things_to_see_items:
    - name: "New River Gorge Bridge"
      description: "The 3,030-foot steel arch bridge carries US 19 over the gorge 876 feet above the river. The Canyon Rim Visitor Center sits just north of the bridge and offers the best ground-level view. On Bridge Day (third Saturday of October), the bridge opens to pedestrians and BASE jumpers for a single day."
      image: "/images/parks/national/new-river-gorge-national-park-preserve/01-long-point-bridge-view.jpg"
      alt: "bridge spanning deep, forested gorge"
      credit: "NPS photo/Chance Raso"
    - name: "Sandstone Falls"
      description: "The widest natural waterfall in West Virginia drops 10–25 feet across the full 1,500-foot width of the New River at the park's southern end. A flat boardwalk leads to mid-river islands for close views. The approach road is off WV 20 near Hinton."
      image: "/images/parks/national/new-river-gorge-national-park-preserve/02-sandstone-falls-boardwalk-view.jpg"
      alt: "view of Sandstone Falls from end of boardwalk"
      credit: "Dave Bieri"
    - name: "Grand View Overlook"
      description: "A panoramic overlook at roughly 2,600 feet elevation that reveals a sweeping horseshoe bend in the New River far below. The Grand View area also has picnic grounds, a short rim trail, and summer theater performances. It sits on the eastern side of the park off WV 9."
      image: "/images/parks/national/new-river-gorge-national-park-preserve/03-grandview-main-overlook.jpg"
      alt: "view of river and gorge"
      credit: "Carey Woods"
    - name: "Thurmond Historic District"
      description: "A once-thriving railroad and coal town that, at its early-20th-century peak, handled more freight than Cincinnati. Today a handful of restored buildings remain, including the 1904 depot. The C&O Railway still passes through, and Amtrak's Cardinal stops here three times a week."
      image: "/images/parks/national/new-river-gorge-national-park-preserve/04-thurmond-historic-district.jpg"
      alt: "railroad tracks and old brick buildings"
      credit: "John Petro"
    - name: "Whitewater Rafting on the Lower New"
      description: "The Lower New River's 14-mile section below Grandview produces Class III–V rapids through a roadless gorge. Dozens of licensed outfitters operate out of Fayetteville and Oak Hill. The season runs April through October, with highest water levels in spring."
      image: "/images/parks/national/new-river-gorge-national-park-preserve/05-fayette-station-rapids.jpg"
      alt: "rafters paddle through whitewater"
      credit: "NPS"
    - name: "Rock Climbing at Endless Wall"
      description: "The Endless Wall cliff line runs for more than a mile along the gorge rim and holds some of the park's most accessible climbing routes on Nuttall Sandstone. The trail to the base begins from Fern Creek Trailhead off US 19. Over 1,400 established routes exist park-wide, ranging from beginner to elite."
      image: "/images/parks/national/new-river-gorge-national-park-preserve/06-endless-wall-cliffs.jpg"
      alt: "cliffs, gorge, and river with beginning of fall colors"
      credit: "Gary Hartley"

