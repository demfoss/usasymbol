faq:
  - question: "Where is Canyonlands National Park?"
    answer: "Canyonlands is in southeastern Utah. The most visited entrance — Island in the Sky — is about 32 miles from Moab via U.S. Route 191 North and Utah Highway 313. The nearest commercial airport is Canyonlands Regional (CNY), roughly 30 miles from the Island in the Sky entrance."
  - question: "How many districts does Canyonlands have?"
    answer: "Canyonlands has four districts: Island in the Sky, the Needles, the Maze, and Horseshoe Canyon. No roads connect them; each requires a separate drive ranging from 32 to over 130 miles from Moab. Each district has its own entrance, character, and access requirements."
  - question: "When is the best time to visit Canyonlands National Park?"
    answer: "Spring (March through May) and fall (September through November) offer the most comfortable conditions, with temperatures of 50–80 °F. Summer temperatures regularly exceed 100 °F at the mesa rim and are dangerous in canyon bottoms. Winter is the quietest season but some dirt roads may close after snowstorms."
  - question: "How much does it cost to enter Canyonlands National Park?"
    answer: "The entrance fee is $30 per vehicle for a 7-day pass. Motorcycles pay $25 and individuals on foot or bicycle pay $15 per person for 7 days. The America the Beautiful Annual Pass ($80/year) covers Canyonlands and all other U.S. national parks. Each district charges its own fee; confirm current fees at nps.gov/cany."
  - question: "What is the best hike in Canyonlands?"
    answer: "Mesa Arch Trail (0.5-mile loop) is the most visited hike, best experienced at sunrise when the arch glows orange against the canyon below. For a longer rim walk, Grand View Point Trail (2.0 miles round trip) offers the widest panorama on Island in the Sky. In the Needles district, the Chesler Park and Joint Trail Loop (6.0 miles) passes spires and a narrow slot canyon."
  - question: "Do I need a permit for Canyonlands?"
    answer: "No permit is needed to drive into the park or hike most day-use trails. A self-issue day-use permit is required for certain Needles trails including the Chesler Park loop; pick one up at the visitor center kiosk. Overnight backcountry travel in the Maze and on White Rim Road requires an advance permit from Recreation.gov, reserved months ahead for spring and fall dates."
  - question: "Can I drive to the Maze district of Canyonlands?"
    answer: "The Maze is the most remote district in the park and requires a high-clearance 4WD vehicle. The drive from Moab is over 130 miles one-way, with the final 30 to 40 miles on rough unpaved roads. An overnight permit from Recreation.gov is required. Most visitors to the Maze are experienced desert travelers with navigation skills and multi-day supplies."

