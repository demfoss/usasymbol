sections:
  overview: |
    Canyonlands National Park sits in southeastern Utah, roughly 30 miles southwest of Moab. The park covers 337,598 acres of canyon and mesa terrain carved over millions of years by the Colorado and Green rivers, making it the largest national park in Utah by area. It ranks 36th among the 63 U.S. national parks by annual visitation, with roughly 840,000 visitors in 2023. The park divides into four separate districts: Island in the Sky, the Needles, the Maze, and the detached Horseshoe Canyon unit. No paved roads connect any of the districts; each requires a separate drive of 30 to more than 130 miles from Moab.

  known_for: |
    Four entirely separate districts with no connecting roads, ranging from the easily accessible Island in the Sky mesa top to the Maze — one of the most remote destinations in the U.S. National Park System, reachable only by high-clearance 4WD on unpaved roads.
    Mesa Arch, a thin sandstone span at the rim of Island in the Sky at roughly 6,000 feet elevation, frames the Colorado River canyons 1,000 feet below and the La Sal Mountains beyond — most dramatic at sunrise when the underside of the arch glows orange.
    The Great Gallery in Horseshoe Canyon, a 200-foot-long panel of life-sized figures painted in the Barrier Canyon Style by Archaic period peoples at least 2,000 years ago, considered one of the most significant ancient rock art sites in North America.
    The Confluence, where the Green River meets the Colorado River deep inside the canyon, visible from overlooks in both the Island in the Sky and Needles districts or accessible by multi-day river raft.

  best_things_to_see_items:
    - name: "Mesa Arch"
      description: "Mesa Arch is a thin sandstone span at the very edge of the Island in the Sky mesa, approximately 6,000 feet above sea level. The arch frames sheer canyon walls and the Colorado River 1,000 feet below. Sunrise turns the underside of the arch bright orange; photographers arrive 30 to 60 minutes before dawn to secure a spot on the rim."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/F3F20058-EF2D-B688-6C3B2A157C9E4E33.jpg?width=1600&quality=90&mode=crop"
      alt: "Sunrise at Mesa Arch. "
      credit: "Neal Herbert"
    - name: "Grand View Point"
      description: "Grand View Point is the southernmost overlook on Island in the Sky, with an unobstructed view of the canyon system and the White Rim 1,200 feet below. On clear days the Henry Mountains and Abajo Mountains are visible on the horizon. The Grand View Point Trail runs 2.0 miles round trip along the mesa rim from the parking area."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/F458D49C-ACE6-7003-D7E6833813DD455A.jpg?width=1600&quality=90&mode=crop"
      alt: "White snow dusts the tops of the brown and red canyons from Grand View Point"
      credit: "NPS/Jacob W. Frank"
    - name: "Needles District"
      description: "The Needles is the most hike-friendly district in Canyonlands, named for its colorful spires of Cedar Mesa Sandstone banded in red and white. The district has over 55 miles of maintained trails ranging from short day hikes to multi-day backpacking routes. Chesler Park, a grass-floored meadow ringed by standing spires, is the main destination."
      image: "https://www.nps.gov/cany/planyourvisit/images/needles.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp"
      alt: "tall spires of sandstone with bands of white and red rock"
      credit: "NPS/Neal Herbert"
    - name: "White Rim Road"
      description: "White Rim Road is a 100-mile dirt track that circles Island in the Sky at the base of the mesa cliffs, running along a bench of White Rim Sandstone roughly 1,200 feet below the rim. Mountain bikers typically complete the loop in 3 to 4 days; 4WD vehicles take 2 to 3 days. A permit is required for overnight travel; day use requires no permit."
      image: "https://www.nps.gov/cany/planyourvisit/images/WR-biking-header-wide.jpg?maxwidth=1300&maxheight=1300&autorotate=false&format=webp"
      alt: "Mountain bikers on a dirt road"
      credit: "NPS"
    - name: "Horseshoe Canyon and the Great Gallery"
      description: "Horseshoe Canyon is a detached unit of Canyonlands accessed via a 32-mile dirt road from Utah Highway 24. The Great Gallery is a 200-foot-long panel of life-sized Barrier Canyon Style figures painted at least 2,000 years ago — the finest large-scale ancient rock art site on the Colorado Plateau. The round trip from the canyon rim to the gallery is 6.5 miles with 750 feet of descent."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/746FB0E9-A570-7A63-52832EAC4C0E3599.jpeg?width=1600&quality=90&mode=crop"
      alt: "painted person-like figures in red and brown on a long sandstone wall"
    - name: "The Confluence Overlook"
      description: "The Confluence is where the Green River flows into the Colorado River inside the canyon, forming the Y-shape that defines Canyonlands. The overlook in the Needles district requires a 10.0-mile round trip hike on moderate terrain. River trips put visitors directly at the water level where the two rivers meet and the canyon walls rise on three sides."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/74177209-01FA-B216-D6D6DE60C5419B5E.jpg?width=1600&quality=90&mode=crop"
      alt: "A green and gray river converge below towering canyon walls"
      credit: "NPS/Veronica Verdin"
    - name: "Upheaval Dome"
      description: "Upheaval Dome is a circular structure roughly 3 miles wide and 1,500 feet deep in the center of Island in the Sky. Most geologists now classify it as an ancient meteorite impact crater, likely formed around 60 million years ago. The first overlook is 0.4 miles from the trailhead; the second overlook at 0.9 miles gives a fuller view into the crater interior."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/F480E9B0-A7E5-53BB-09F6B51351373B9C.jpg?width=1600&quality=90&mode=crop"
      alt: "Layers of green, red, beige and orange rock are visible within a crater."
      credit: "NPS/Veronica Verdin"

  seasons:
    - season: spring
      months: "March – May"
      temp_rim: "50–75 °F (10–24 °C)"
      crowd_level: high
      verdict: "Best overall conditions with comfortable temperatures, but Mesa Arch parking fills before dawn on spring weekends."
    - season: summer
