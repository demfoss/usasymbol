sections:
  overview: |
    Saguaro National Park surrounds the city of Tucson, Arizona, in two separate units divided by about 30 miles of urban land. The Tucson Mountain District (West) covers 24,034 acres at the base of the Tucson Mountains and holds the densest saguaro forest in the park. The Rincon Mountain District (East) covers 67,293 acres, rises from desert flats to the 8,666-foot summit of Mica Mountain, and includes a wilderness backcountry with pine and mixed conifer forest above 6,000 feet. The two districts have separate entrance stations; a single $25 vehicle fee covers both for seven days. At roughly 1.2 million visitors per year, the park ranks 28th in annual visitation among the 63 U.S. national parks. Tucson International Airport is only 10 miles from the east district entrance.

  known_for: |
    The park takes its name and identity from the giant saguaro cactus — the tallest cactus in the United States, reaching 40–60 feet and living 150–200 years. Arms typically begin growing only after 75 years, making a multi-armed saguaro a genuine old-growth plant. The park has no car campgrounds; visitors base themselves in Tucson and drive to one of two scenic loop drives for day use. The west district's Bajada Loop Drive and the east district's Cactus Forest Loop Drive both offer close views of saguaro forests from a car. Saguaro blossoms — the state flower of Arizona — open on May and June nights, and the park draws photographers during blooms and during monsoon lightning storms each summer.

  best_things_to_see_items:
    - name: "Cactus Forest Loop Drive (East)"
      description: "An 8-mile paved one-way loop through the Rincon Mountain District's saguaro forest, open to cars and bicycles. Pull-outs allow short walks among cacti, and the road passes the Mica View and Javelina picnic areas. The drive takes 45 minutes to an hour with stops and is the best introduction to the east district."
      image: "/images/parks/national/saguaro-national-park/01-cactus-forest-loop-drive.jpg"
      alt: "Rainbow over Cactus Forest Drive"
      credit: "NPS Photo/SAGU"
    - name: "Bajada Loop Drive (West)"
      description: "A 6-mile unpaved scenic loop through the heart of the Tucson Mountain District, passing some of the densest saguaro concentrations in the park. The road is suitable for most passenger vehicles in dry conditions. The Valley View Overlook trailhead and Signal Hill petroglyphs are both accessed from this loop."
      image: ""
      alt: "Dirt road curving through saguaro-covered hillsides at sunset in Saguaro National Park West"
    - name: "Signal Hill Petroglyphs"
      description: "A short trail from the Bajada Loop Drive in the west district leads to a hillside covered in petroglyphs left by the Hohokam people over several centuries. More than 200 rock carvings are visible on the basalt boulders, including spirals, human figures, and geometric shapes. A self-guiding brochure is available at the trailhead."
      image: "/images/parks/national/saguaro-national-park/02-signal-hill-petroglyphs.jpg"
      alt: "A large boulder sits in the right of the image, a large spiral image is etched into the stone. "
      credit: "JCamp"
    - name: "Valley View Overlook"
      description: "A 0.8-mile round-trip walk from the Bajada Loop Drive to a low ridge with views across the Avra Valley and the dense saguaro forest below. Best at sunrise or sunset when the light rakes across the cactus forest. The trail is flat and suitable for most visitors."
      image: ""
      alt: "Wide view across Avra Valley with saguaro cacti covering the slopes in the foreground"
    - name: "Saguaro Blossom Season (May–June)"
      description: "Giant saguaros bloom from late April through June, producing large white flowers at the tips of arms and trunks that open at night and close by midday. White-winged doves, bats, and insects pollinate the flowers; fruit ripens in late June and is harvested by Tohono O'odham people in a traditional ceremony. The east district's Cactus Forest is the best viewing area."
      image: "/images/parks/national/saguaro-national-park/03-saguaro-flowers-in-bloom.jpg"
      alt: "Three large saguaro flowers in full bloom"
      credit: "NPS, Saguaro National Park"
    - name: "Rincon Mountain Wilderness"
      description: "The east district's backcountry rises through five vegetation zones from Sonoran Desert to pine-oak and mixed conifer forest above 6,000 feet. Manning Camp, at 8,000 feet, is the main backcountry campsite and is accessible by trails of 7–14 miles. The summit area supports black bears and mountain lions absent from the lower desert."
      image: "/images/parks/national/saguaro-national-park/11-best-rincon-mountain-wilderness.jpg"
      alt: "a large pine tree stands in front of a forest of pines with mountain peaks in the background"

