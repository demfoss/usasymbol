faq:
  - question: "Where is Crater Lake National Park?"
    answer: "Crater Lake is in southern Oregon, about 60 miles north of Klamath Falls and 75 miles northeast of Medford via Oregon Highway 62. The nearest major airport is Rogue Valley International–Medford (MFR). The South Entrance on OR-62 is open year-round; the North Entrance opens only after snow clears, typically in late June or early July."
  - question: "How deep is Crater Lake?"
    answer: "Crater Lake is 1,943 feet deep at its maximum, making it the deepest lake in the United States and one of the deepest in the world. The water is fed entirely by rain and snowmelt — no rivers flow in or out — which contributes to its exceptional clarity. A white disc can be seen 120 feet below the surface in calm conditions."
  - question: "When is the best time to visit Crater Lake?"
    answer: "Summer (July through September) is the only time the full park is accessible. The Rim Drive opens in late June or early July and closes with the first heavy snowfall, usually in late October. Boat tours to Wizard Island run from late June through mid-September. For fewer crowds, visit in September — facilities are still open but summer crowds have thinned."
  - question: "How much does it cost to enter Crater Lake National Park?"
    answer: "The entrance fee is $30 per vehicle for a 7-day pass. Motorcycles pay $25 and individuals on foot or by bicycle pay $15. The America the Beautiful Annual Pass ($80/year) covers Crater Lake and all other U.S. national parks. Boat tours to Wizard Island are booked and paid separately through the park concessionaire."
  - question: "Can you swim in Crater Lake?"
    answer: "Yes, but only at Cleetwood Cove — the one place where the trail reaches the lakeshore. The water is cold, typically 50 to 60 °F even in August, and there are no lifeguards. The 1.1-mile trail down from the rim is steep; the return climb is demanding. Swimming anywhere else along the caldera rim is prohibited by steep, uncontrolled terrain."
  - question: "How do you get to Wizard Island?"
    answer: "Wizard Island is accessible only by boat tour from Cleetwood Cove, the park's only lakeshore access point. Tours are operated by the park concessionaire and must be booked in advance — same-day tickets are rarely available in summer. The boat tour includes time on the island to hike the 1.8-mile summit trail and swim. Tours run from late June through mid-September."
  - question: "Does Crater Lake freeze in winter?"
    answer: "Crater Lake rarely freezes completely because of its extreme depth — the deep water retains heat. The surface may develop thin ice in very cold winters, but a complete ice-over has been recorded only a handful of times in the park's history. The lake is visible year-round from Rim Village, which remains accessible via the South Entrance even in winter."

