intro_text: "Crater Lake National Park in [Oregon](/states/oregon) preserves the deepest lake in the United States — 1,943 feet — formed 7,700 years ago when the volcano Mount Mazama collapsed after a catastrophic eruption. Established in 1902, the park draws roughly 700,000 visitors a year to the caldera rim and the intensely blue water below."

