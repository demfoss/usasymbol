sections:
  overview: |
    Crater Lake National Park sits in the Cascade Range of southern Oregon, about 60 miles north of Klamath Falls. The park covers 183,224 acres and is built around a single caldera — the collapsed remnant of the volcano Mount Mazama — that holds the deepest lake in the United States at 1,943 feet. The lake's water is fed entirely by rain and snowmelt, with no rivers flowing in or out; the water is among the purest on Earth, giving the lake its distinctive deep blue color visible for miles. Crater Lake ranks 38th among the 63 U.S. national parks by annual visitation, drawing roughly 700,000 visitors in 2023. The 33-mile Rim Drive circles the caldera at about 7,100 feet elevation and is the primary way to see the lake; it is typically open from late June or early July through October, with snow closing it in both directions for the rest of the year.

  known_for: |
    The deepest lake in the United States at 1,943 feet and one of the deepest in the world — the water is so pure that a white disk can be seen 120 feet below the surface, and the blue color is visible from aircraft at cruising altitude.
    Wizard Island, a cinder cone that formed inside the caldera after the main collapse and rises 764 feet above the lake surface, reachable by a concessionaire boat tour from Cleetwood Cove — the only legal access point to the lakeshore.
    The 33-mile Rim Drive, open July through October at approximately 7,100 feet elevation, with more than a dozen overlooks circling the caldera and views that change with each turn of the road.
    The Old Man of the Lake, a 30-foot bleached log that has been floating vertically in the lake since at least 1896, drifting around the caldera driven by wind while remaining upright — a natural curiosity documented by scientists for over a century.

  best_things_to_see_items:
    - name: "Wizard Island"
      description: "Wizard Island is a cinder cone that erupted within the caldera after Mount Mazama collapsed, rising 764 feet above the lake surface. It is the park's most distinctive landmark and the destination for boat tours from Cleetwood Cove. Visitors who take the tour can hike the 1.8-mile round trip to the island's summit crater and swim in the lake from its rocky shore. Boat tour tickets sell out; book through the park concessionaire well in advance."
      image: "https://www.nps.gov/crla/learn/nature/images/Wizard-Island_IMG_9691.jpg"
      alt: "In Crater Lake is Wizard Island, a tree covered cinder cone volcano with a crater"
      credit: "NPS Photo 2018"
    - name: "Phantom Ship"
      description: "Phantom Ship is a small rocky island in the southern part of the lake whose jagged silhouette resembles a sailing vessel at certain angles and light conditions. It is the oldest exposed rock in the park, made of lava dikes that were part of Mount Mazama's internal structure before the collapse. The best view is from Sun Notch overlook, a 0.8-mile round-trip walk from the Rim Drive."
      image: "https://www.nps.gov/common/uploads/structured_data/3C7B23C5-1DD8-B71B-0B4F2400855714FA.jpg"
      alt: "a view of Phantom Ship and Chaski Bay"
      credit: "NPS Photo"
    - name: "Cleetwood Cove and the Lakeshore"
      description: "Cleetwood Cove is the only place in the park where visitors can legally reach the water's edge. A 1.1-mile trail descends 700 feet to a rocky shoreline where the lake is open for swimming — one of the highest-elevation swimming spots in the national park system. The water temperature ranges from 50 to 60 °F even in summer. Boat tours to Wizard Island depart from the dock at the cove bottom."
      image: "https://www.nps.gov/common/uploads/structured_data/3C7B2524-1DD8-B71B-0B84C60FF964D102.jpg"
      alt: "a view of Crater Lake from the lakeshore"
      credit: "NPS Photo"
    - name: "Rim Drive"
      description: "The 33-mile Rim Drive circles the entire caldera at about 7,100 feet elevation, with more than a dozen named overlooks. The full loop takes two to three hours by car with stops at the main viewpoints. Cloudcap Overlook, the highest point on the drive at 8,065 feet, and Pinnacles Overlook, above a field of ancient ash spires, are the most visited stops beyond the main Rim Village area."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/08EE5F9B-0351-4BB5-D1F7BC93327FB4FA.jpg?width=1300&quality=90&mode=crop"
      alt: "View of Rim Drive from Watchman Peak.  Hillman Peak and Crater Lake in the background."
      credit: "NPS Photo"
    - name: "Crater Lake Lodge"
      description: "Crater Lake Lodge sits at the caldera rim at Rim Village, perched on the edge with a direct view of the lake and Wizard Island from its dining room and back terrace. The original lodge opened in 1915; the current structure was rebuilt in 1995 after the original was condemned. The great hall retains the 1915 stone fireplace and wood-beam ceiling. Rooms sell out months in advance; dining room dinner reservations are required."
      image: "https://www.nps.gov/common/uploads/cropped_image/primary/47E22A67-9CA7-28C3-3693266A7750DA12.jpg?width=1600&quality=90&mode=crop"
      alt: "Crater Lake Lodge and a path to it"
      credit: "NPS Photo 2020/Mimi Gorman"
    - name: "Mount Scott Summit"
      description: "Mount Scott is the highest point in Crater Lake National Park at 8,929 feet — a 600-foot cone that predates Mount Mazama's collapse and was not destroyed in the eruption. The 5.0-mile round-trip trail climbs 1,250 feet through subalpine forest and open pumice fields to a fire lookout with a 360-degree view of the caldera, the Cascade peaks to the north, and the Klamath Basin to the south."
      image: "https://www.nps.gov/common/uploads/structured_data/3C7B26D3-1DD8-B71B-0B939039D597B9A3.jpg"
      alt: "Crater Lake as seen from the summit of Mt. Scott"
      credit: "NPS Photo"
    - name: "Vidae Falls"
      description: "Vidae Falls is a 100-foot cascade on Vidae Creek on the south rim of the park, visible from a short pull-off on the Rim Drive near the East Entrance. The falls flow strongest in June and July from snowmelt. A short path leads from the parking area to the base viewpoint. The falls are one of the few dramatic water features in a park dominated by the lake itself."
      image: "https://www.nps.gov/common/uploads/structured_data/3C7B28BD-1DD8-B71B-0B3EA88108473DEA.jpg"
      alt: "water flowing over Vidae Falls"
      credit: "NPS Photo"

