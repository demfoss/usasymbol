sections:
  - id: "states-with-the-most-net-international-migration"
    icon: "fa-solid fa-arrow-up"
    title: "States With the Most Net International Migration"
    paragraphs:
      - "Florida gained 1,059,143 net international migrants from 2020 to 2024, more than any other state. California follows at 934,230, and Texas is third at 820,761."

  - id: "states-with-the-fewest-net-international-migrants"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Fewest Net International Migrants"
    paragraphs:
      - "Montana gained the fewest net international migrants of any state, 2,622, just behind Wyoming at 3,028 and West Virginia at 7,597."

  - id: "which-state-has-the-highest-international-migration-rate"
    icon: "fa-solid fa-plane-arrival"
    title: "Which State Has the Highest International Migration Rate?"
    paragraphs:
      - "Washington D.C., not a state, posts the highest international migration rate in the data at 50.23 per 1,000 residents. Florida has the highest rate among actual states, 49.18, even though Florida's total of 1,059,143 is more than 30 times D.C.'s 34,639."

