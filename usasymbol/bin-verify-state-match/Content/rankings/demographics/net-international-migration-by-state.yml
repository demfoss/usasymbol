faq:
  - question: "Which state has the most net international migration?"
    answer: "Florida, with 1,059,143 net international migrants from 2020 to 2024. California ranks second at 934,230, and Texas is third at 820,761."

  - question: "Which state has the fewest net international migrants?"
    answer: "Montana, with 2,622 from 2020 to 2024, the fewest of any state."

  - question: "What is the international migration rate in Florida?"
    answer: "49.18 per 1,000 residents, the highest rate among all 50 states."

  - question: "Which state has the highest international migration rate?"
    answer: "Washington D.C., which is not a state, leads at 50.23 per 1,000 residents. Florida is highest among actual states at 49.18."

  - question: "What is the net international migration for California?"
    answer: "934,230 from 2020 to 2024, the second-most of any state after Florida."

  - question: "Which state has the lowest international migration rate?"
    answer: "Montana, at 2.42 per 1,000 residents, the lowest of any state."

