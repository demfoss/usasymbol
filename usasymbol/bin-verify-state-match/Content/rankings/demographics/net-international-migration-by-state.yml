page:
  h1: "Net International Migration by State"

  quick_answer:
    - "Florida leads net international migration by state with 1,059,143 net arrivals from 2020 to 2024, far more than any other state."
    - "Montana gained the fewest net international migrants of any state, just 2,622, a fraction of Florida's total."
    - "Washington D.C., not a state, posts the highest migration rate in the data at 50.23 per 1,000 residents, edging out Florida's 49.18, the top rate among actual states."

  methodology: "Net international migration and the rate per 1,000 residents cover 2020 to 2024, on record for 2026. Washington D.C. is included as a jurisdiction alongside the 50 states."

