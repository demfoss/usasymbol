map:
  title: "Happiest States Map"
  image_alt: "U.S. map shaded by each state's total happiness score"
  caption: "Hawaii leads with a total score of 65.50, followed by Maryland at 64.13 and Nebraska at 63.61. West Virginia is lowest at 32.04."
  metric_key: total_score
  metric_label: "Happiness Score"
  color_scheme: amber
  color_scale: linear

sections:
  - id: "why-hawaii-is-the-happiest-state"
    icon: "fa-solid fa-sun"
    title: "Why Hawaii Is the Happiest State"
    paragraphs:
      - "Hawaii ranks first overall with a total score of 65.50, the highest in the ranking. Its strongest category is Emotional & Physical Well-Being, where it ranks second nationally, trailing only New Jersey."
      - "Hawaii ranks 16th in Work Environment and 13th in Community & Environment, well behind its Emotional & Physical Well-Being standing. Even with those mid-table category ranks, its overall score still leads second-place Maryland by 1.37 points."

  - id: "maryland-and-nebraska-round-out-the-top-three"
    icon: "fa-solid fa-medal"
    title: "Maryland and Nebraska Round Out the Top Three"
    paragraphs:
      - "Maryland ranks second overall at 64.13, trailing Hawaii by 1.37 points. It posts the third-best Emotional & Physical Well-Being rank nationally, along with a 14th-place Work Environment rank and a 10th-place Community & Environment rank."
      - "Nebraska ranks third at 63.61, just 0.52 points behind Maryland. Its Work Environment rank of 7 and Community & Environment rank of 4 are both stronger than its 9th-place Emotional & Physical Well-Being rank."

  - id: "category-rank-vs-overall-happiness-rank"
    icon: "fa-solid fa-chart-column"
    title: "Category Ranks vs Overall Happiness Rank"
    paragraphs:
      - "Utah ranks sixth overall at 61.12 but ranks first in both Work Environment and Community & Environment. Its 26th-place Emotional & Physical Well-Being rank holds its overall score down."
      - "New Jersey ranks first in Emotional & Physical Well-Being but only fourth overall at 63.42, weighed down by a 23rd-place Work Environment rank and a 36th-place Community & Environment rank. California shows a similar gap, ranking 4th in Emotional & Physical Well-Being but 45th in Work Environment."

