faq:
  - question: "Which state is the happiest?"
    answer: "Hawaii leads the ranking with a total score of 65.50 and the second-best Emotional & Physical Well-Being rank of any state."

  - question: "Which state is the least happy?"
    answer: "West Virginia ranks last overall at 32.04, also placing 50th in both Emotional & Physical Well-Being and Work Environment."

  - question: "Why is Hawaii the happiest state?"
    answer: "Hawaii's total score of 65.50 is driven largely by its second-place Emotional & Physical Well-Being rank, the strongest of its three category scores. That lead holds even though it ranks just 16th in Work Environment and 13th in Community & Environment."

  - question: "What is Utah's happiness rank?"
    answer: "Utah ranks sixth overall at 61.12, despite ranking first in both Work Environment and Community & Environment. A 26th-place Emotional & Physical Well-Being rank holds it back."

  - question: "Is Maryland or Nebraska happier?"
    answer: "Maryland ranks higher. It is second overall at 64.13, while Nebraska is third at 63.61."

  - question: "Are any states tied in the happiness ranking?"
    answer: "Yes. New York and Iowa are both scored at 55.42, and Alaska and Alabama are both scored at 40.69."

