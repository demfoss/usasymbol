page:
  h1: "Net Domestic Migration by State"

  quick_answer:
    - "Domestic migration by state is led by North Carolina at 84,100 net arrivals. California posted the largest outflow at 229,100."
    - "California's loss of 229,100 domestic migrants exceeds the combined net gains of North Carolina, Texas, and South Carolina, which total 218,000. New York ranks second in outmigration at 137,600."
    - "Oklahoma and Arkansas each gained 14,500 net domestic migrants, tying at ranks 11 and 12. Colorado and Maryland each lost 12,100, tying at ranks 43 and 44."

  methodology: "Data covers net domestic migration from July 1, 2024 to July 1, 2025, in the latest U.S. Census Bureau state population release available in 2026. The measure counts moves between U.S. states and excludes international immigration and natural population change."

  sources:
