sections:
  - id: "states-losing-the-most-domestic-migrants"
    icon: "fa-solid fa-right-from-bracket"
    title: "States Losing the Most Domestic Migrants"
    paragraphs:
      - "California lost 229,100 domestic migrants, the largest outflow of any state. The gap between California and New York at 137,600 is 91,500, which is larger than North Carolina's 84,100 net gain."
      - "Illinois ranked third in outmigration at 40,000 net departures, followed by New Jersey at 37,400 and Massachusetts at 33,300. Those three states combined for a loss of 110,700 residents to other parts of the country."

  - id: "states-gaining-the-most-domestic-migrants"
    icon: "fa-solid fa-right-to-bracket"
    title: "States Gaining the Most Domestic Migrants"
    paragraphs:
      - "North Carolina attracted 84,100 net domestic migrants, more than any other state. South Carolina placed third at 66,600, just 700 behind Texas at 67,300."
      - "Tennessee gained 42,400 net residents, ranking fourth. Arizona followed at 31,100, giving the five leading destinations a combined inflow of 291,500 domestic migrants."

