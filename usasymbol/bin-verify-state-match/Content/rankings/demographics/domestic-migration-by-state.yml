faq:
  - question: "Which state gained the most domestic migrants in the latest Census update?"
    answer: "North Carolina gained 84,100 net domestic migrants, more than any other state. Texas ranked second at 67,300, and South Carolina placed third at 66,600."

  - question: "Which state lost the most residents to other states in the latest Census update?"
    answer: "California recorded a net domestic outmigration of 229,100. New York ranked second at 137,600, a gap of 91,500 people."

  - question: "What is the net domestic migration for Texas?"
    answer: "Texas gained 67,300 net domestic migrants, ranking second among all 50 states. South Carolina placed third at 66,600, just 700 residents behind Texas."

  - question: "How many states lost domestic migrants?"
    answer: "19 states recorded negative net domestic migration from July 2024 to July 2025. Nebraska, at 366 net departures, posted the smallest negative figure in that group."

  - question: "What is the domestic migration for California?"
    answer: "California lost 229,100 net domestic migrants. That figure exceeds the combined net gains of North Carolina at 84,100, Texas at 67,300, and South Carolina at 66,600."

  - question: "Did Florida gain or lose residents in the latest Census update?"
    answer: "Florida gained 22,500 net domestic migrants, ranking eighth among all states. Alabama ranked seventh at 23,400, just ahead of Florida."

