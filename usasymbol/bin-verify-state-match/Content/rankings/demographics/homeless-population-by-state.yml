page:
  h1: "Homeless Population by State"

  quick_answer:
    - "California has the largest homeless population of any state, with 187,084 people counted in 2024 and a rate of 48.0 per 10,000 residents."
    - "New York and Hawaii tie for the highest homelessness rate in the country at 81.0 per 10,000 residents, well above California's 48.0. Mississippi has the lowest rate of any state at 4.0 per 10,000, and Wyoming has the smallest total count at 501."
    - "Homelessness fell 65.6% in Michigan and 34.8% in Florida since 2007, while New York rose 152% and Vermont rose 234% over the same period."

  methodology: "Population and rates use HUD's 2024 point-in-time count. Percent changes compare 2024 with 2007, and Washington, D.C. is excluded."

  sources:
    - name: "World Population Review — Homeless Population by State"
      url: "https://worldpopulationreview.com/state-rankings/homeless-population-by-state"
      description: "State-by-state homeless population counts and rates per 10,000 residents from HUD's 2024 Annual Homelessness Assessment Report"
    - name: "USAFacts — Which States Have the Highest and Lowest Rates of Homelessness"
      url: "https://usafacts.org/articles/which-states-have-the-highest-and-lowest-rates-of-homelessness/"
      description: "Analysis of point-in-time homelessness counts and the correlation between rent costs and homelessness rates by state"
