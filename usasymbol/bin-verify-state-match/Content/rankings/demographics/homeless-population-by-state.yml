faq:
  - question: "Which state has the most homeless people?"
    answer: "California counted 187,084 people experiencing homelessness in 2024, more than any other state. New York follows with 158,019."

  - question: "Which state has the highest homelessness rate?"
    answer: "New York and Hawaii share the highest rate at 81.0 per 10,000 residents. Oregon ranks third at 54.0 per 10,000."

  - question: "Which state has the lowest homelessness rate?"
    answer: "Mississippi has the lowest rate of any state at 4.0 per 10,000 residents."

  - question: "Which state has the fewest homeless people overall?"
    answer: "Wyoming counted 501 people experiencing homelessness in 2024, the smallest total of any state."

  - question: "Has homelessness increased or decreased since 2007?"
    answer: "Trends vary sharply by state. Vermont rose 234% and New York rose 152% since 2007, while Michigan fell 65.6% and Florida fell 34.8% over the same period."

  - question: "What is the homeless population in Florida?"
    answer: "Florida counted 31,362 people experiencing homelessness in 2024, a rate of 14.0 per 10,000 residents."

