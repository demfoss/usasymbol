sections:
  - id: "northeast-density"
    icon: "fa-solid fa-city"
    title: "Why the Northeast Is So Dense"
    paragraphs:
      - "The five most densely populated states are New Jersey (1,304 people/sq mi), Rhode Island (1,082), Massachusetts (919), Connecticut (765), and Maryland (648). Each combines a relatively small land area with a population large enough to push density far above the national pattern."
      - "New Jersey ranks first because 9.6 million residents fit into 7,354 square miles. Rhode Island ranks second with 1.1 million residents in just 1,034 square miles."
      - "The next group drops quickly: Delaware is sixth at 549 people per square mile, Florida is seventh at 441, and New York is eighth at 424."

  - id: "western-emptiness"
    icon: "fa-solid fa-mountain"
    title: "Why Western States Have the Lowest Population Density"
    paragraphs:
      - "Alaska, Wyoming, Montana, North Dakota, and South Dakota have the lowest density values. Alaska is the outlier at 1.3 people per square mile across 567,695 square miles of land."
      - "Wyoming ranks 49th at 6.1 people per square mile, with 590,784 residents spread across 96,850 square miles. Montana ranks 48th at 7.9 people per square mile and has the second-largest land area in the bottom five."
      - "North Dakota and South Dakota are both listed at 12 people per square mile. South Dakota has more residents, while North Dakota has less land area, which keeps their density values close."

  - id: "population-vs-density"
    icon: "fa-solid fa-scale-balanced"
    title: "Why Big States Don't Rank Highest in Density"
    paragraphs:
      - "California has the largest population in the table at 39.3 million, but it ranks #11 in density because its land area is 155,517 square miles. For raw headcounts rather than people per square mile, see the [U.S. states by population](/rankings/demographics/states-by-population) list."
      - "Texas shows an even wider gap between population rank and density rank. It has 32.1 million residents, but with 261,065 square miles of land, it ranks #22 at 123 people per square mile."
      - "Small states can rank high even with much smaller populations. Rhode Island has 1.1 million residents and ranks #2 in density because its land area is only 1,034 square miles."

  - id: "density-consequences"
    icon: "fa-solid fa-house"
    title: "What Population Density Shows"
    paragraphs:
      - "Density changes how many people share the same square mile of land. In New Jersey, the figure is 1,304 people per square mile, in Wyoming it is 6.1, and in Alaska it is 1.3."
      - "The contrast is visible even among large-population states. Florida has 23.7 million residents and a density of 441, while Texas has 32.1 million residents but a density of 123 because its land area is nearly five times larger."
      - "Density also separates neighboring ranks in the table. Pennsylvania and Ohio both show 292 people per square mile, but Pennsylvania has a larger population and a larger land area."

  - id: "changing-density"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States Getting Denser (and Sparser)"
    paragraphs:
      - "Population density is a snapshot of population divided by land area. A state's density rises when its population grows while its land area stays the same."
      - "Current density does not always track current population size. Idaho has 2.1 million residents and 82,344 square miles of land, giving it 25 people per square mile. New Hampshire has fewer residents but much less land, giving it 159 people per square mile."
      - "States with similar densities can have different underlying totals. Colorado and Iowa both list 58 people per square mile, but Colorado has 6.0 million residents across 104,079 square miles while Iowa has 3.2 million across 55,971."

faq:
  - question: "What is the most densely populated state in the United States?"
    answer: "New Jersey is the most densely populated U.S. state with approximately 1,304 people per square mile. It has 9.6 million residents across 7,354 square miles of land."

  - question: "What is the least densely populated state?"
    answer: "Alaska is the least densely populated state with approximately 1.3 people per square mile. It has 738,003 residents across 567,695 square miles of land."

  - question: "What is the population density of the United States?"
    answer: "The average population density of the United States is approximately 95 people per square mile. State values range from 1,304 people per square mile in New Jersey to 1.3 in Alaska."

  - question: "Why is New Jersey the most densely populated state?"
    answer: "New Jersey is the most densely populated state because 9.6 million people live in 7,354 square miles. That works out to 1,304 people per square mile, ahead of Rhode Island at 1,082."

  - question: "Is California the most densely populated state?"
    answer: "No, California ranks #11 in population density despite being the most populous state. California has 39.3 million people and 155,517 square miles of land, which works out to 253 people per square mile."

  - question: "Which region of the United States is most densely populated?"
    answer: "The Northeast has the densest group of states in this ranking. New Jersey, Rhode Island, Massachusetts, Connecticut, and Maryland take the top five spots."

