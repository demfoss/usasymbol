page:
  h1: "Maternal Mortality Rate by State"

  quick_answer:
    - "Tennessee has the highest maternal mortality rate of any state, 42.1 deaths per 100,000 live births, based on 166 maternal deaths from 2019 to 2023."
    - "Texas recorded 532 maternal deaths, more than any other state, yet its rate of 29.3 per 100,000 ranks only 15th nationally. Louisiana's rate of 40.7 is the second-highest despite just 108 deaths."
    - "California has the lowest maternal mortality rate in the country at 10.1 per 100,000 live births, despite 228 deaths, the third-highest raw total of any state."

  methodology: "Rates are 2019-2023 CDC/NCHS estimates from World Population Review and America's Health Rankings. Delaware, Maine, and Vermont lack reliable rates, and D.C. is excluded."

  sources:
    - name: "World Population Review — Maternal Mortality Rate by State"
      url: "https://worldpopulationreview.com/state-rankings/maternal-mortality-rate-by-state"
      description: "State maternal mortality rates and death counts, 2019-2023 CDC/NCHS estimates"
    - name: "America's Health Rankings — Maternal Mortality"
      url: "https://www.americashealthrankings.org/explore/measures/maternal_mortality_c"
      description: "State maternal mortality rate rankings, including several small-population states not published elsewhere"

