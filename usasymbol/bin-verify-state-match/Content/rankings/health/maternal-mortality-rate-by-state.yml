faq:
  - question: "Which state has the highest maternal mortality rate?"
    answer: "Tennessee has the highest maternal mortality rate of any state, 42.1 deaths per 100,000 live births, based on 166 deaths from 2019 to 2023."

  - question: "Which state has the lowest maternal mortality rate?"
    answer: "California has the lowest maternal mortality rate in the country at 10.1 per 100,000 live births."

  - question: "Which state has the most maternal deaths?"
    answer: "Texas recorded 532 maternal deaths, more than any other state, though its rate of 29.3 per 100,000 ranks only 15th nationally."

  - question: "Which states have no reliable maternal mortality estimate?"
    answer: "Delaware, Maine, and Vermont have no reliable rate estimate. Their small number of annual births makes a stable rate impossible to calculate."

  - question: "Which states tie for the same maternal mortality rate?"
    answer: "Indiana and Kentucky tie at 31.4 per 100,000, and Arizona and Georgia tie at 30.4. Missouri and Ohio also share a rate, 25.4."

  - question: "What is the national maternal mortality rate?"
    answer: "The national maternal mortality rate is 23.5 deaths per 100,000 live births, based on 4,283 maternal deaths nationwide from 2019 to 2023."

