faq:
  - question: "Which state has the highest teen birth rate?"
    answer: "Mississippi has the highest teen birth rate at 22.8 per 1,000 females ages 15 to 19. Arkansas ranks second at 22.2, and Louisiana is third at 21.3."

  - question: "Which state has the lowest teen birth rate?"
    answer: "New Hampshire has the lowest teen birth rate at 4.6 per 1,000. Massachusetts follows at 5.4, and Vermont is third-lowest at 6.3."

  - question: "Which state has the highest teen pregnancy rate?"
    answer: "Mississippi has the highest teen pregnancy rate at 38.8 per 1,000, ahead of Arkansas at 38.2 and Oklahoma at 37.0."

  - question: "What is the teen birth rate in Texas?"
    answer: "Texas has a teen birth rate of 18.5 per 1,000, the eighth highest in the country. Its teen pregnancy rate is 32.4, tied with Kentucky and Tennessee."

  - question: "What is the teen pregnancy rate in California?"
    answer: "California's teen pregnancy rate is 24.5 per 1,000, while its birth rate is 8.7, the 11th lowest in the country."

  - question: "Why does Wyoming have no teen birth rate listed?"
    answer: "Wyoming's teen birth rate is not on record. Its teen pregnancy rate is listed at 26.2 per 1,000, the 24th highest in the country."

