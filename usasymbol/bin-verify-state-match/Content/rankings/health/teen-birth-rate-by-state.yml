page:
  h1: "Teen Birth Rate by State"

  quick_answer:
    - "Mississippi has the highest teen birth rate in the country at 22.8 births per 1,000 females ages 15 to 19."
    - "New Hampshire has the lowest teen birth rate at 4.6 per 1,000, less than a fifth of Mississippi's rate. Massachusetts is next at 5.4, and Vermont follows at 6.3."
    - "Mississippi also posts the highest teen pregnancy rate at 38.8 per 1,000, ahead of Arkansas at 38.2 and Oklahoma at 37.0."

  methodology: "Birth rates are teen births per 1,000 females ages 15 to 19. Pregnancy rates are listed separately, and Wyoming's birth rate is not on record."

