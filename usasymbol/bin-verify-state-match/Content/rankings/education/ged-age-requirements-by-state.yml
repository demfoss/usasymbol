  description: "41 states and D.C. set the GED minimum age at 16. Ten states require 17. 26 of 51 require GED residency, on record for 2026."

page:
  h1: "GED Age Requirements by State"

  quick_answer:
    - "41 states and the District of Columbia set the minimum age to take the GED at 16, the more common requirement nationwide."
    - "Ten states set the minimum at 17: California, Connecticut, Illinois, Kentucky, Maine, Minnesota, Missouri, South Carolina, Tennessee, and Wisconsin."
    - "26 of the 51 states and D.C. require residency to take the GED, a nearly even split against the 25 that do not."

  methodology: "Minimum GED age and residency requirement reflect each state's GED testing rules on record for 2026."

  sources:
