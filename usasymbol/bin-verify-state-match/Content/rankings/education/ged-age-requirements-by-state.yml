    layout: right

faq:
  - question: "What is the minimum age to take the GED?"
    answer: "16 in 41 states and the District of Columbia. Ten states set the minimum at 17: California, Connecticut, Illinois, Kentucky, Maine, Minnesota, Missouri, South Carolina, Tennessee, and Wisconsin."

  - question: "How old do you have to be to get your GED in California?"
    answer: "17. California also requires residency to take the GED."

  - question: "Which states require GED residency?"
    answer: "26 of the 51 states and D.C. require residency, including Alabama, Delaware, New York, and Texas."

  - question: "Does Texas require residency to take the GED?"
    answer: "Yes. Texas sets the GED minimum age at 16 and requires residency."

  - question: "Which states set the GED age at 17 without requiring residency?"
    answer: "Maine, Minnesota, and Tennessee. The other seven states with a 17 minimum, including California and Illinois, do require residency."

