sections:
  - id: "states-with-a-ged-age-requirement-of-17"
    icon: "fa-solid fa-arrow-up"
    title: "States With a GED Age Requirement of 17"
    paragraphs:
      - "Ten states set the GED minimum age at 17: California, Connecticut, Illinois, Kentucky, Maine, Minnesota, Missouri, South Carolina, Tennessee, and Wisconsin."
      - "Seven of these ten also require residency: California, Connecticut, Illinois, Kentucky, Missouri, South Carolina, and Wisconsin. Maine, Minnesota, and Tennessee set the age at 17 without requiring residency."

  - id: "states-with-a-ged-age-requirement-of-16"
    icon: "fa-solid fa-arrow-down"
    title: "States With a GED Age Requirement of 16"
    paragraphs:
      - "41 states and the District of Columbia set the GED minimum age at 16, the more common requirement nationwide and four times as many as the ten states requiring 17."

  - id: "states-that-require-ged-residency"
    icon: "fa-solid fa-map-pin"
    title: "States That Require GED Residency"
    paragraphs:
      - "26 of the 51 states and D.C. require residency to take the GED, including Alabama, Delaware, New York, and Texas. The remaining 25, including Alaska, Florida, and Oregon, do not, a nearly even split nationwide."

