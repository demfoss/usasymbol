sections:
  - id: "states-with-the-highest-sat-scores"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Highest SAT Scores"
    paragraphs:
      - "North Dakota leads the country with an average total score of 1,254, 225 points above the national average. Nebraska (1,249), Wisconsin (1,240), Kansas (1,238), and Wyoming (1,234) round out the top five."
      - "Wyoming stands out for its EBRW score of 638, the highest of any state, even though a lower Math score of 597 keeps its total score in fifth place."

  - id: "states-with-the-lowest-sat-scores"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest SAT Scores"
    paragraphs:
      - "New Mexico has the lowest average total score at 875, 154 points below the national average. West Virginia (911), Delaware (933), and Rhode Island (935) round out the bottom four."

