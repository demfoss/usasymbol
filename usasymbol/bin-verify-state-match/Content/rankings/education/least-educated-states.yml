faq:
  - question: "What is the least educated state in America?"
    answer: "West Virginia, with a bachelor's degree rate of 24.12%, the lowest of any state. Its high school completion rate is 88.82% and its advanced degree rate is 9.94%."

  - question: "Which states have the lowest bachelor's degree rates?"
    answer: "West Virginia at 24.12%, Mississippi at 24.78%, Arkansas at 25.27%, Louisiana at 26.45%, and Kentucky at 26.98% form the bottom five."

  - question: "Which state has the lowest advanced degree rate?"
    answer: "Mississippi, at 9.35%, just below Arkansas at 9.37% and North Dakota at 9.38%."

  - question: "Which state has the lowest high school graduation rate?"
    answer: "California, at 84.45%. That is lower than West Virginia's 88.82%, even though California's bachelor's degree rate of 36.19% is far higher."

  - question: "Is Mississippi or West Virginia less educated?"
    answer: "West Virginia has the lower bachelor's degree rate, 24.12% versus Mississippi's 24.78%, but Mississippi has the lower advanced degree rate, 9.35% versus West Virginia's 9.94%."

  - question: "Which state has the highest bachelor's degree rate, for comparison?"
    answer: "Massachusetts, at 50.62% among states. Washington D.C., which is not a state, posts an even higher rate of 63.05%."

