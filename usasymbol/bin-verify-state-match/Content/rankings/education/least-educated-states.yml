page:
  h1: "Least Educated States"

  quick_answer:
    - "West Virginia has the lowest bachelor's degree attainment rate in the country, 24.12%, the least educated state on this list."
    - "Mississippi follows at 24.78% and Arkansas at 25.27%, both within a point of West Virginia's rate and more than 26 points behind Massachusetts, the highest-ranked state at 50.62%."
    - "Mississippi's advanced degree rate of 9.35% is the lowest of any state, even lower than West Virginia's 9.94%, showing the two states rank differently depending on the degree level measured."

  methodology: "Educational attainment reflects Census Bureau data for the population 25 and older. Washington D.C. is included below, but Puerto Rico's figures appear only in the text."

