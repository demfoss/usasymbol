sections:
  - id: "states-with-the-lowest-bachelors-degree-rates"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Lowest Bachelor's Degree Rates"
    paragraphs:
      - "West Virginia's bachelor's degree rate of 24.12% is the lowest of any state. Mississippi follows at 24.78%, Arkansas at 25.27%, Louisiana at 26.45%, and Kentucky at 26.98%, forming a tight bottom-five cluster all within 3 points of each other."

  - id: "states-with-the-lowest-advanced-degree-rates"
    icon: "fa-solid fa-user-graduate"
    title: "States With the Lowest Advanced Degree Rates"
    paragraphs:
      - "Mississippi's advanced degree rate of 9.35% is the lowest of any state, just below Arkansas at 9.37% and North Dakota at 9.38%. West Virginia, the state with the lowest bachelor's degree rate, ranks higher here at 9.94%."

  - id: "state-with-the-lowest-high-school-graduation-rate"
    icon: "fa-solid fa-school-circle-exclamation"
    title: "State With the Lowest High School Graduation Rate"
    paragraphs:
      - "California's high school completion rate of 84.45% is the lowest of any state, even lower than West Virginia's 88.82%. California's bachelor's degree rate of 36.19% still ranks in the middle of the pack, well above the states at the bottom of this list."

