page:
  h1: "Age to Start Kindergarten by State"

  quick_answer:
    - "Washington sets the highest age to start kindergarten at 8 years old, the oldest compulsory age of any state. Most states set the age at 6, and 12 states, including Alaska and Wyoming, set it at 7."
    - "20 states require kindergarten attendance by law, while 25 states leave it optional even though compulsory schooling starts at 5, 6, or 7. Alabama, Michigan, and New York are among the states with no mandatory-attendance requirement."
    - "21 states require districts to offer full-day kindergarten, including Delaware, Hawaii, Maryland, and West Virginia. Massachusetts, New Hampshire, New Jersey, New York, Ohio, and Pennsylvania leave the daily schedule up to local districts."

  methodology: "Compulsory school age, kindergarten entry cutoff dates, and schedule and attendance requirements reflect state law on record for 2026. LEA is the standard abbreviation for local education agency."

