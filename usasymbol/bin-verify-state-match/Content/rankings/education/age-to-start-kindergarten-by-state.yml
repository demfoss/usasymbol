sections:
  - id: "states-where-kindergarten-attendance-is-not-required"
    icon: "fa-solid fa-house"
    title: "States Where Kindergarten Attendance Is Not Required"
    paragraphs:
      - "25 states do not require kindergarten attendance, even though compulsory schooling begins at age 5, 6, or 7 in each of them. Alabama, Illinois, Michigan, New York, and Washington are among them; families in these states may enroll a child directly in first grade without ever attending kindergarten."

  - id: "states-that-require-full-day-kindergarten"
    icon: "fa-solid fa-clock"
    title: "States That Require Full-Day Kindergarten"
    paragraphs:
      - "21 states require districts to offer full-day kindergarten, including Alabama, Delaware, Hawaii, Maryland, and West Virginia. Illinois, Indiana, Montana, and Texas require both a full-day and a half-day option. Massachusetts, New Hampshire, New Jersey, New York, Ohio, and Pennsylvania leave the daily schedule up to local districts."

faq:
  - question: "What is the compulsory age to start school in each state?"
    answer: "Washington sets the highest compulsory school age at 8. Most states set it at 6; 12 states, including Alaska, Louisiana, and Wyoming, set it at 7. Twelve jurisdictions, including Washington, DC, set it at 5."

  - question: "Is kindergarten mandatory in every state?"
    answer: "No. 20 states require kindergarten attendance by law. 25 states, including Alabama, Michigan, and New York, leave attendance optional even though compulsory schooling begins at 5, 6, or 7."

  - question: "Which states require full-day kindergarten?"
    answer: "21 states require school districts to offer full-day kindergarten, including Delaware, Hawaii, Maryland, Oklahoma, and West Virginia. Illinois, Indiana, Montana, and Texas require both a full-day and a half-day option."

  - question: "What does LEA option mean for a kindergarten cutoff date?"
    answer: "LEA stands for local education agency. New Jersey, New York, Ohio, and Pennsylvania let each school district set its own kindergarten entry cutoff date rather than a single statewide date."

  - question: "What is the kindergarten cutoff date in Connecticut?"
    answer: "Connecticut requires a child to turn 5 by January 1, the earliest fixed cutoff date of any state. Colorado has the latest fixed cutoff, October 1."

  - question: "Does Vermont have a kindergarten cutoff date?"
    answer: "No. Vermont lists a flat age-5 requirement with no specific cutoff date, unlike most states, which set a date such as September 1 or October 1."

