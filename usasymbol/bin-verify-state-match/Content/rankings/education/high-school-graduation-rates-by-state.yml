sections:
  - id: "states-with-the-highest-graduation-rates"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Highest Graduation Rates"
    paragraphs:
      - "Vermont leads the country at 94.9%, just ahead of Maine at 94.8% and Montana at 94.6%. New Hampshire (94.4%) and Wyoming (94.2%) round out the top five."
      - "North Dakota (94.0%) and Minnesota (93.9%) follow closely, and Alaska and Wisconsin tie for eighth at 93.6% each."

  - id: "states-with-the-lowest-graduation-rates"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Graduation Rates"
    paragraphs:
      - "California has the lowest graduation rate at 84.7%, the only state below 85%. Texas follows at 86.0%, and Mississippi is next at 87.1%."
      - "Louisiana (87.3%) and Nevada (87.5%) round out the bottom five. New Mexico and New York tie for the sixth lowest at 88.0% each."

