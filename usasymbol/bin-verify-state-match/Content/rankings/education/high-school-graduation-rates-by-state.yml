faq:
  - question: "Which state has the highest high school graduation rate?"
    answer: "Vermont, at 94.9%, just ahead of Maine at 94.8% and Montana at 94.6%."

  - question: "Which state has the lowest high school graduation rate?"
    answer: "California, at 84.7%, the only state below 85%."

  - question: "What is the high school graduation rate in Texas?"
    answer: "86.0%, the second lowest in the country after California."

  - question: "What is the high school graduation rate in New York?"
    answer: "88.0%, tied with New Mexico for the 45th highest rate in the country."

  - question: "How much higher is Vermont's graduation rate than California's?"
    answer: "10.2 percentage points, the widest gap between the top and bottom state in this data."

