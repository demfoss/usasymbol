sections:
  - id: "states-with-the-latest-elementary-start-times"
    icon: "fa-solid fa-arrow-trend-up"
    title: "States With the Latest Elementary Start Times"
    paragraphs:
      - "Nevada has the latest elementary start time in the country at 8:48 AM, just ahead of Washington at 8:47 AM and Rhode Island at 8:44 AM. Connecticut and Minnesota tie for fourth at 8:41 AM each."

  - id: "states-with-the-earliest-elementary-start-times"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Earliest Elementary Start Times"
    paragraphs:
      - "Mississippi has the earliest elementary start time at 7:40 AM, the only one before 7:44 AM. South Carolina follows at 7:44 AM, then Alabama at 7:49 AM and Hawaii at 7:53 AM."

  - id: "states-where-high-school-starts-later"
    icon: "fa-solid fa-arrows-rotate"
    title: "States Where High School Starts Later"
    paragraphs:
      - "Eight states reverse the typical pattern, where high school starts later than elementary school: Alabama, Arkansas, Georgia, Hawaii, Mississippi, North Carolina, South Carolina, and Texas."
      - "South Carolina has the widest gap of any state: elementary starts at 7:44 AM, and high school starts at 8:34 AM, 50 minutes later. Florida's middle school start time of 8:50 AM is the latest start time at any school level in this data, later than every state's elementary start time, including Nevada's 8:48 AM."

