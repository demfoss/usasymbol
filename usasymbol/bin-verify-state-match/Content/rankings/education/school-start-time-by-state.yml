faq:
  - question: "Which state has the latest elementary school start time?"
    answer: "Nevada, at 8:48 AM, just ahead of Washington at 8:47 AM."

  - question: "Which state has the earliest elementary school start time?"
    answer: "Mississippi, at 7:40 AM, the earliest in this data."

  - question: "Does high school start later than elementary school anywhere?"
    answer: "Yes, in eight states: Alabama, Arkansas, Georgia, Hawaii, Mississippi, North Carolina, South Carolina, and Texas."

  - question: "What time does high school start in South Carolina?"
    answer: "8:34 AM, 50 minutes later than the state's 7:44 AM elementary start time, the widest gap in this data."

  - question: "What is the latest school start time of any level in this data?"
    answer: "Florida's middle school start time of 8:50 AM, later than every state's elementary start time, including Nevada's 8:48 AM."

