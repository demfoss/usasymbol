  description: "31 states stress abstinence in sex education, 10 cover it as one topic. Only 17 of 49 states require consent education on record for 2026."

page:
  h1: "Abstinence-Only Education States"

  quick_answer:
    - "31 states list abstinence as something to stress in sex education, not just cover as one topic among several, more than three times the 10 states that cover it instead."
    - "New York and Pennsylvania stress abstinence specifically within HIV education rather than general sex education. New Mexico splits the two: its sex education covers abstinence, but its HIV education stresses it."
    - "Only 23 of 49 states require contraception education and only 17 require consent education, both fewer than the 31 states that stress abstinence."

  methodology: "Sex education mandate, abstinence approach, contraception requirement, and consent requirement reflect each state's curriculum standards on record for 2026. Alaska and Wyoming are not included in the source data."

