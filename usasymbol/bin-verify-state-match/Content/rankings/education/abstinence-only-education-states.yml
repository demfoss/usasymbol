sections:
  - id: "states-that-stress-abstinence"
    icon: "fa-solid fa-triangle-exclamation"
    title: "States That Stress Abstinence in Sex Education"
    paragraphs:
      - "31 states list abstinence as something to stress in sex education, including Alabama, Georgia, Ohio, Texas, and Washington. That group spans both states that mandate sex education, like Texas, and states that do not, like Alabama."
      - "New York and Pennsylvania apply this differently. Both stress abstinence specifically within HIV education rather than general sex education, a narrower requirement than the other 29 Stress states."

  - id: "states-that-cover-abstinence"
    icon: "fa-solid fa-circle-check"
    title: "States That Cover Abstinence as One Topic"
    paragraphs:
      - "Ten states cover abstinence as one topic among several rather than stressing it: California, Colorado, District of Columbia, Illinois, Kansas, Maryland, New Hampshire, Vermont, Virginia, and West Virginia."
      - "New Mexico is the only state that splits the two approaches. Its sex education covers abstinence, but its HIV education specifically stresses it, the same narrower pattern used by New York and Pennsylvania."

  - id: "states-that-require-consent-education"
    icon: "fa-solid fa-hand"
    title: "States That Require Consent Education"
    paragraphs:
      - "Only 17 of 49 states require that sex education include consent, among them Delaware, Maine, Maryland, Oregon, and Washington. Contraception education is required in 23 states, also fewer than the 31 states that stress abstinence."

