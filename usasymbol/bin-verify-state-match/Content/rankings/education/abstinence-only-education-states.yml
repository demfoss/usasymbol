    layout: right

faq:
  - question: "Which states stress abstinence in sex education?"
    answer: "31 states list abstinence as something to stress, including Alabama, Georgia, Ohio, Texas, and Washington."

  - question: "Which states cover abstinence as just one topic instead of stressing it?"
    answer: "Ten states: California, Colorado, District of Columbia, Illinois, Kansas, Maryland, New Hampshire, Vermont, Virginia, and West Virginia."

  - question: "Is sex education mandatory in Texas?"
    answer: "Yes. Texas mandates sex education, stresses abstinence, and requires contraception education, but does not require consent education."

  - question: "Which states require consent education in sex education?"
    answer: "Only 17 of 49 states, including Delaware, Maine, Maryland, Oregon, and Washington."

  - question: "What is the abstinence approach in New York?"
    answer: "New York stresses abstinence specifically within HIV education, not general sex education. New York does not mandate sex education overall."

  - question: "Does California require contraception education?"
    answer: "Yes. California covers abstinence as one topic and requires contraception education, but does not require consent education."

