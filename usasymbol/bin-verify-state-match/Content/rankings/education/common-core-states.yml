page:
  h1: "Common Core States"

  quick_answer:
    - "30 states still use Common Core standards today, the most common status among all 50 states."
    - "15 states adopted Common Core in 2010 or 2011 but later reversed, repealed, or rewrote their standards, including Oklahoma and South Carolina, both repealed in 2014."
    - "Four states never adopted Common Core at all: Alaska, Nebraska, Texas, and Virginia. Minnesota is the only state to partially adopt it, using Common Core for English Language Arts only."

  methodology: "Common Core status, adoption year, and subsequent changes reflect each state's public record on adoption, revision, or repeal, current for 2026."

  sources:
