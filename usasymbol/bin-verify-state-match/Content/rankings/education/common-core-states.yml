faq:
  - question: "Which states still use Common Core?"
    answer: "30 states, including California, Illinois, and Washington."

  - question: "Which states rejected Common Core?"
    answer: "15 states adopted Common Core in 2010 or 2011 but later reversed, repealed, or rewrote their standards, including Oklahoma, South Carolina, and West Virginia."

  - question: "Did Texas ever adopt Common Core?"
    answer: "No. Texas is one of four states, along with Alaska, Nebraska, and Virginia, that never adopted Common Core."

  - question: "When did states adopt Common Core?"
    answer: "Most states adopted Common Core in 2010. Idaho, Maine, Montana, and Washington adopted in 2011, and Wyoming adopted last, in 2012."

  - question: "Does Minnesota use Common Core?"
    answer: "Partially. Minnesota adopted Common Core for English Language Arts only, not mathematics."

  - question: "Which states repealed Common Core?"
    answer: "Oklahoma and South Carolina both repealed their standards in 2014. West Virginia followed in 2015, and Florida reversed its standards in January 2020, the most recent repeal."

