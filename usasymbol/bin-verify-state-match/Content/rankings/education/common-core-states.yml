sections:
  - id: "states-that-still-use-common-core"
    icon: "fa-solid fa-check"
    title: "States That Still Use Common Core"
    paragraphs:
      - "30 states still use Common Core standards, including California, Illinois, Ohio, and Washington. Most adopted in 2010, though Idaho, Maine, Montana, and Washington adopted in 2011, and Wyoming adopted last, in 2012."

  - id: "states-that-adopted-common-core-then-reversed-it"
    icon: "fa-solid fa-rotate-left"
    title: "States That Adopted Common Core Then Reversed It"
    paragraphs:
      - "15 states adopted Common Core in 2010 or 2011 but later reversed, repealed, or rewrote their standards, including Alabama, Florida, Indiana, and New York. Oklahoma and South Carolina both repealed their standards in 2014, and West Virginia followed in 2015."

  - id: "states-that-never-adopted-common-core"
    icon: "fa-solid fa-xmark"
    title: "States That Never Adopted Common Core"
    paragraphs:
      - "Four states never adopted Common Core: Alaska, Nebraska, Texas, and Virginia. Minnesota took a middle path, partially adopting Common Core for English Language Arts only, without adopting it for math."

