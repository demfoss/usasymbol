faq:
  - question: "Is it illegal to sleep in your car in Texas?"
    answer: "Texas is the most permissive state on this page for rest-area sleeping. TxDOT says visitors may stay up to 24 hours at state safety rest areas."

  - question: "Can you sleep in your car in Florida?"
    answer: "Florida allows up to 3 hours for the general public at rest areas. FDOT also says overnight camping is not permitted."

  - question: "Can you sleep in your car in Virginia?"
    answer: "Virginia is the clearest no-overnight state on this page. VDOT says overnight parking is not allowed at safety rest areas."

  - question: "Can you sleep in your car in California?"
    answer: "California lists up to 8 hours of rest-area rest in the provided notes. The same notes also say some California cities ban sleeping in cars on public streets."

  - question: "Which states ban sleeping in vehicles?"
    answer: "Virginia, Colorado, Oregon, and Hawaii are the strongest restriction states on this page. Virginia bars overnight parking at rest areas, while the provided notes point to city or non-designated-area enforcement in the other three."

  - question: "What are the rest area overnight parking rules in New York?"
    answer: "New York is listed here as temporary parking only. The provided notes say sleeping is prohibited in most public areas and rest stops allow only temporary parking."

