page:
  h1: "Window Tint Laws by State"

  quick_answer:
    - "New Mexico allows the darkest front side window tint of any state at 20% VLT, the minimum percentage of light the glass must let through."
    - "New Jersey, Vermont, Michigan, and Delaware ban aftermarket tint on the main area of front side windows entirely. Delaware still allows factory tint at 70% VLT or lighter."
    - "Iowa, Louisiana, North Dakota, and Utah all lowered their front side tint limits between May 2025 and July 2026, making darker tint legal in each state."

  methodology: "This page tracks the minimum legal VLT (visible light transmission) percentage for front side windows in each state, based on a 50-state legal-status review current as of 2026. Back side and rear window figures reflect the standard passenger car rule, and SUVs, vans, and pickups are commonly allowed darker tint there under the same law, so confirm current rules with your state DMV before installing tint."

  sources:
