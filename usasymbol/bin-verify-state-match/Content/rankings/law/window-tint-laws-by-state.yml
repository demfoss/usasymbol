sections:
  - id: "states-with-the-darkest-legal-window-tint"
    icon: "fa-solid fa-circle-half-stroke"
    title: "States With the Darkest Legal Window Tint"
    paragraphs:
      - "New Mexico allows the darkest front side tint of any state at 20% VLT. Montana and Washington follow at 24%, and Arkansas, Louisiana, Oklahoma, and Texas all sit at 25%."
      - "Colorado and South Carolina permit 27% VLT, and Florida, Mississippi, and Wyoming allow 28%. Louisiana's 12% rear window limit is the darkest rear-window figure in the table."

  - id: "states-with-the-strictest-window-tint-laws"
    icon: "fa-solid fa-ban"
    title: "States With the Strictest Window Tint Laws"
    paragraphs:
      - "New Jersey, Vermont, Michigan, and Delaware do not allow aftermarket tint on the main area of front side windows at all. Delaware permits factory tint at 70% VLT or lighter, and Michigan allows only the top 4 inches to be tinted."
      - "Alaska, California, New Hampshire, New York, Pennsylvania, and Rhode Island require 70% VLT on front side windows, among the lightest limits of any state that permits aftermarket tint."

  - id: "states-that-recently-changed-their-tint-laws"
    icon: "fa-solid fa-clock-rotate-left"
    title: "States That Recently Changed Their Tint Laws"
    paragraphs:
      - "Utah lowered its front side limit from 43% to 35% under HB 112, effective May 7, 2025. Louisiana followed in August 2025, cutting its front side limit from 40% to 25%."
      - "North Dakota also changed in August 2025, dropping from 50% to 35%. Iowa is the most recent, lowering its front side limit from 70% to 50% under HF 766, effective July 1, 2026."

