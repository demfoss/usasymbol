faq:
  - question: "How dark can window tint be in Texas?"
    answer: "Texas requires at least 25% VLT on front side windows. Back side windows may be any darkness with dual side mirrors installed."

  - question: "How dark can window tint be in California?"
    answer: "California requires 70% VLT on front side windows, though aftermarket film must be rated at least 88% VLT to meet that combined requirement with the factory glass."

  - question: "How dark can window tint be in Florida?"
    answer: "Florida requires 28% VLT on front side windows and 15% on back side and rear windows for sedans. SUVs and multi-purpose vehicles may go as dark as 6% on those rear windows."

  - question: "Which state allows the darkest legal window tint?"
    answer: "New Mexico allows the darkest front side tint at 20% VLT, the lowest minimum of any state in this table."

  - question: "Which states ban aftermarket window tint on front side windows?"
    answer: "New Jersey, Vermont, Michigan, and Delaware do not allow aftermarket film on the main area of front side windows. Michigan permits only the top 4 inches, the same limit it applies to the windshield."

  - question: "Did any states change their window tint laws recently?"
    answer: "Yes. Utah, Louisiana, and North Dakota all lowered their front side limits in 2025, and Iowa followed in July 2026, cutting its limit from 70% to 50%."

