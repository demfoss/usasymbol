seo:
  title: "One-Party Consent States | Map, Recording Laws"
  description: "38 states let a participant record without telling the others. California, Florida, Illinois, Maryland, and Washington require all-party consent."

page:
  h1: "One-Party Consent States"

  quick_answer:
    - "One-party consent states number 38. Texas, New York, and Vermont are in the group where a participant may record without telling the others."
    - "All-party consent states number 12. California, Connecticut, Florida, Illinois, Maryland, Massachusetts, Michigan, Montana, Nevada, New Hampshire, Pennsylvania, and Washington are in that red group."
    - "Vermont is the outlier in the current source set. Vermont has no state recording statute, so the federal one-party rule is the baseline there."

  methodology: "This binary map follows the 38-state and 12-state split used in the current Reporters Committee First Amendment Handbook. Row notes use the current Reporters Recording Guide and the provided 50-state chart to flag mixed rules in states such as Connecticut, Missouri, Nevada, and Oregon."

  sources:
    - name: "Reporters Committee for Freedom of the Press. First Amendment Handbook"
      url: "https://www.rcfp.org/resources/first-amendment-handbook/"
      description: "Current 38-state and 12-state recording-consent split used for the binary map"
    - name: "Reporters Committee for Freedom of the Press. Introduction to the Reporter's Recording Guide"
      url: "https://www.rcfp.org/introduction-to-reporters-recording-guide/"
      description: "Current overview of one-party, all-party, mixed, and Vermont edge-case rules"
    - name: "California Legislative Information. Penal Code Section 632"
      url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=632"
      description: "California all-party consent rule, penalties, and inadmissibility rule"
    - name: "Florida Legislature. Statute 934.03"
      url: "https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0900-0999%2F0934%2FSections%2F0934.03.html"
      description: "Florida all-party consent rule and third-degree felony penalty"
    - name: "Illinois General Assembly. 720 ILCS 5/14-2"
      url: "https://www.ilga.gov/documents/legislation/ilcs/documents/072000050K14-2.htm"
      description: "Illinois all-party consent rule for private conversations"
    - name: "Illinois General Assembly. 720 ILCS 5/14-4"
      url: "https://ilga.gov/legislation/ILCS/details?ActID=1876&ActName=Criminal+Code+of+2012.&ChapAct=720+ILCS+5%2F&Chapter=&ChapterID=53&MajorTopic=&Print=True&SeqEnd=35399999&SeqStart=34200000"
      description: "Illinois felony sentence provision for eavesdropping"
    - name: "Maryland General Assembly. Courts and Judicial Proceedings 10-402"
      url: "https://mgaleg.maryland.gov/mgawebsite/laws/StatuteText?article=gcj&section=10-402"
      description: "Maryland all-party consent rule and penalty language"
    - name: "Washington State Legislature. RCW 9.73.030"
      url: "https://app.leg.wa.gov/rcw/default.aspx?cite=9.73.030"
