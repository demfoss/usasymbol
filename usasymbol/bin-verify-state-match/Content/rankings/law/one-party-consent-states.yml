faq:
  - question: "Which states are one-party consent states?"
    answer: "38 states are one-party consent states on this map. Texas, New York, Georgia, Ohio, Virginia, and Vermont are in that group."

  - question: "Which states are two-party consent states for recording?"
    answer: "12 states are in the all-party group on this binary map. California, Connecticut, Florida, Illinois, Maryland, Massachusetts, Michigan, Montana, Nevada, New Hampshire, Pennsylvania, and Washington are the full list."

  - question: "Is it illegal to record someone without permission in Texas?"
    answer: "Texas is a one-party state on this page. Its row says None if one party consents."

  - question: "Is it illegal to record someone without permission in California?"
    answer: "California is an all-party state on this page. Its row lists Misdemeanor or felony and notes that Penal Code 632 requires consent of all parties to a confidential communication."

  - question: "What is the secret recording law in Connecticut?"
    answer: "Connecticut is red on this binary map. Its row says Civil or felony and notes that in-person recording is one-party while telephone calls require all parties."

  - question: "What is the secret recording law in Vermont?"
    answer: "Vermont is green on this map, but it is not a normal statute state. Its row says Federal baseline only because Vermont has no state recording statute."

