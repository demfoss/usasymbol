sections:
  - id: "states-with-the-longest-abandoned-property-notice-periods"
    icon: "fa-solid fa-box-archive"
    title: "States With the Longest Abandoned Property Notice Periods"
    paragraphs:
      - "Indiana requires landlords to hold a tenant's abandoned property for 90 days after notice, the longest period on record and 12 times longer than the 7-day minimum. Texas and Vermont follow at 60 days each, and Washington requires 45 days."
      - "Eleven states share the most common period on record at 30 days: Connecticut, Kansas, Nevada, New Jersey, New Mexico, North Carolina, Pennsylvania, South Dakota, Tennessee, West Virginia, and Wisconsin. Minnesota and North Dakota require 28 days, just short of that 30-day mark."

  - id: "states-with-the-shortest-abandoned-property-notice-periods"
    icon: "fa-solid fa-clock"
    title: "States With the Shortest Abandoned Property Notice Periods"
    paragraphs:
      - "Delaware, Maine, Nebraska, and New Hampshire require the shortest period on record at 7 days after notice. Florida, Missouri, Montana, and Virginia require 10 days, and Alabama and Arizona require 14 days."
      - "California's 18-day period sits well below the 30-day cluster and just above the 15-day group of Alaska, Hawaii, Oklahoma, Oregon, Utah, and Wyoming."

