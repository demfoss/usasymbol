page:
  h1: "Abandoned Property Laws by State"

  quick_answer:
    - "Indiana has the longest abandoned property notice period on record at 90 days, the time a landlord must hold a tenant's belongings after notice before disposing of them."
    - "Texas and Vermont follow at 60 days each, and Washington requires 45 days. Eleven states, including Connecticut, Nevada, and Pennsylvania, share the most common period on record at 30 days."
    - "Delaware, Maine, Nebraska, and New Hampshire require the shortest period on record at 7 days, less than a tenth of Indiana's 90-day requirement."

  methodology: "Abandonment periods reflect the number of days a landlord must hold a tenant's abandoned personal property after notice before disposal, listed by state as of 2026. Not every state has a specific period on record."

