faq:
  - question: "What state has the longest abandoned property notice period?"
    answer: "Indiana has the longest period on record at 90 days after notice. Texas and Vermont follow at 60 days each, and Washington requires 45 days."

  - question: "What state has the shortest abandoned property notice period?"
    answer: "Delaware, Maine, Nebraska, and New Hampshire share the shortest period on record at 7 days after notice."

  - question: "How many days must a landlord hold abandoned property in Texas?"
    answer: "Texas requires a 60-day holding period after notice, tied with Vermont for the second-longest period on record."

  - question: "How many states require a 30-day abandoned property notice period?"
    answer: "Eleven states require 30 days: Connecticut, Kansas, Nevada, New Jersey, New Mexico, North Carolina, Pennsylvania, South Dakota, Tennessee, West Virginia, and Wisconsin. That is the most common period on record."

  - question: "What is the abandoned property notice period in California?"
    answer: "California's period on record is 18 days after notice, shorter than the 30-day cluster but longer than the 15-day group that includes Alaska, Hawaii, Oklahoma, Oregon, Utah, and Wyoming."

