  quick_answer:
    - "Kentucky ranks first for porch piracy risk, with an implied theft probability of 29.8%, the highest of any state in this ranking."
    - "Texas logs the highest raw incident count at 26,293 home larceny-thefts, yet ranks only fifth by probability at 25.8%. California posts the second-highest raw count at 15,311 and ranks second by probability at 27.6%."
    - "Utah has the lowest implied probability at 3%, just 0.6 points below Connecticut's 3.6%. Both states share the lowest reporting rate in the table, at 1%, along with Michigan."

  methodology: "The Porch Piracy Risk Index combines implied theft probability, porch-piracy search volume per 100,000 residents, self-reported theft rates, and state home larceny-theft incident counts for 2023-24."

