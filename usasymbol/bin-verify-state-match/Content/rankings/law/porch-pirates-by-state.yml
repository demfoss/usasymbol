sections:
  - id: "states-with-the-highest-porch-piracy-risk"
    icon: "fa-solid fa-chart-line"
    title: "States With the Highest Porch Piracy Risk"
    paragraphs:
      - "Kentucky ranks first for porch piracy risk at 29.8% implied probability, well above California's 27.6% in second place. Alaska follows closely at 26.7%, and North Dakota is fourth at 26.6%."
      - "Texas rounds out the top five at 25.8%, despite logging 26,293 home larceny-theft incidents, the highest raw count in the table. Kentucky's reporting rate of 12% is also the highest of any state, well above Texas's 5%."

  - id: "states-with-the-most-package-theft-incidents"
    icon: "fa-solid fa-boxes-stacked"
    title: "States With the Most Package Theft Incidents"
    paragraphs:
      - "Texas logs 26,293 home larceny-theft incidents, the highest raw count in the table, yet ranks fifth by implied probability at 25.8%. California is second in raw incidents at 15,311 and second by probability at 27.6%."
      - "North Carolina reports 10,116 incidents but ranks 20th by probability at 13.1%. Illinois logs 7,739 incidents at a probability of 15.1%, and Ohio's 7,238 incidents correspond to a probability of just 7%."

  - id: "states-with-the-lowest-porch-piracy-risk"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Porch Piracy Risk"
    paragraphs:
      - "Utah has the lowest implied probability in the table at 3%, just 0.6 points below Connecticut at 3.6%. Michigan is third-lowest at 4.9%, with a reporting rate of just 1%, tied with Utah and Connecticut for the lowest in the table."
      - "New Jersey, Georgia, and Idaho are tied at 6.6% probability, the only three-way tie in the table. Idaho's larceny count is lowest among the three at 323, compared with 3,830 in New Jersey and 2,324 in Georgia."

