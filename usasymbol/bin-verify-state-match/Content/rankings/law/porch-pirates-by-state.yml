faq:
  - question: "Which state has the highest risk of porch piracy?"
    answer: "Kentucky has the highest implied theft probability at 29.8%. It also has the highest reporting rate in the table at 12%, though its home larceny-theft count of 1,983 is far below the largest states."

  - question: "Which state has the most package theft incidents?"
    answer: "Texas logs the most home larceny-theft incidents at 26,293, the highest raw count in the table. Its implied probability is 25.8%, ranking fifth overall."

  - question: "What is the porch piracy risk in California?"
    answer: "California has an implied theft probability of 27.6%, second highest in the table, with 15,311 home larceny-theft incidents and a 6% reporting rate."

  - question: "Which state has the lowest risk of porch piracy?"
    answer: "Utah has the lowest implied probability at 3%. Its reporting rate of 1% ties Connecticut and Michigan for the lowest in the table."

  - question: "Which state has the highest rate of people reporting package theft?"
    answer: "Kentucky has the highest reporting rate at 12%, followed by North Dakota at 11%. Alaska, Nebraska, and Iowa each report 10%."

  - question: "What is the porch piracy risk in Texas?"
    answer: "Texas has an implied theft probability of 25.8%, ranking fifth. It logs 26,293 home larceny-theft incidents, the highest raw count in the table, but its reporting rate of 5% is well below Kentucky's 12%."

