faq:
  - question: "Which states have unlimited homestead exemption?"
    answer: "Seven states list Unlimited homestead protection. Florida, Texas, Arkansas, Iowa, Kansas, Oklahoma, and South Dakota make up that group, and five of the seven also list acreage limits."

  - question: "What is the homestead exemption in Florida?"
