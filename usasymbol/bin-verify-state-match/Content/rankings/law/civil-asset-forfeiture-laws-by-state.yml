faq:
  - question: "Which states banned civil asset forfeiture?"
    answer: "Maine and New Mexico are the clearest civil-forfeiture abolition states on this page because IJ says both now use criminal forfeiture only. North Carolina is close in most cases, but it still keeps a civil path for racketeering."

  - question: "What are the civil asset forfeiture laws in Massachusetts?"
    answer: "Massachusetts is the worst state on this page by IJ grade. The government needs only probable cause, and law enforcement can keep up to 100% of forfeiture proceeds."

  - question: "What are the civil asset forfeiture laws in Alabama?"
    answer: "Alabama is also deep in the red tier. Prosecutors use a preponderance standard, no broad conviction rule applies, and law enforcement can keep 100% of proceeds."

  - question: "Does Nebraska require a criminal conviction for civil forfeiture?"
    answer: "No. IJ now says Nebraska does not have only criminal forfeiture because a loophole left most civil forfeitures alive. Nebraska also still lets law enforcement keep 50% of proceeds."

  - question: "Which states send civil forfeiture money to schools?"
    answer: "Missouri and North Carolina are the clearest examples on this page because IJ says all forfeiture proceeds go to fund schools. Wisconsin also sends proceeds to schools, though agencies can retain up to 50% for forfeiture expenses."

  - question: "Can police keep 100 percent of civil forfeiture proceeds?"
    answer: "Yes. Many states still allow it, including Massachusetts, Alabama, Georgia, Idaho, Iowa, Nevada, Oklahoma, Pennsylvania, Tennessee, and West Virginia. That is one reason so many states remain red on this map."

