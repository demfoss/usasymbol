seo:
  title: "Civil Asset Forfeiture by State | Map, Laws & Facts"
  description: "Maine and New Mexico use criminal forfeiture only. Massachusetts and Alabama let law enforcement keep up to 100% of forfeiture proceeds."

page:
  h1: "Civil Asset Forfeiture by State"

  quick_answer:
    - "Civil asset forfeiture protection is strongest in Maine and New Mexico, where conviction is required and police share is 0%."
    - "Missouri and North Carolina are the next strongest outliers. Both send proceeds to schools, and Missouri requires conviction of the owner even when forfeiture is uncontested."
    - "Massachusetts and Alabama sit at the red extreme. Massachusetts uses probable cause and 100%, while Alabama uses preponderance of the evidence and 100%."

  methodology: "This page uses the Institute for Justice report Policing for Profit 4 and its state profiles, released in March 2026. IJ says the profile language reflects each state's forfeiture laws as of May 7, 2025, and this map groups states by whether the core forfeiture path requires a conviction and how much of the proceeds can flow back to law enforcement."

  sources:
    - name: "Institute for Justice. Policing for Profit 4"
      url: "https://ij.org/report/policing-for-profit-4/"
      description: "March 2026 national report on civil asset forfeiture laws, state grades, and due-process rules"
    - name: "Institute for Justice. New Mexico State Profile"
      url: "https://ij.org/report/policing-for-profit-4/state-profile/new-mexico/"
      description: "New Mexico profile showing criminal forfeiture only and no police profit incentive"
    - name: "Institute for Justice. Maine State Profile"
      url: "https://ij.org/report/policing-for-profit-4/state-profile/maine/"
      description: "Maine profile showing criminal forfeiture only and general-fund routing"
    - name: "Institute for Justice. Nebraska State Profile"
      url: "https://ij.org/report/policing-for-profit-4/state-profile/nebraska/"
      description: "Nebraska profile explaining the loophole that kept most civil forfeitures alive"
    - name: "Institute for Justice. Massachusetts State Profile"
      url: "https://ij.org/report/policing-for-profit-4/state-profile/massachusetts/"
      description: "Massachusetts profile showing probable-cause standard and up to 100% law-enforcement share"
    - name: "Institute for Justice. Alabama State Profile"
      url: "https://ij.org/report/policing-for-profit-4/state-profile/alabama/"
      description: "Alabama profile showing preponderance standard and 100% law-enforcement share"

