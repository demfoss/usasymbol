sections:
  - id: "right-to-work-states-list"
    icon: "fa-solid fa-briefcase"
    title: "Right-to-Work States List"
    paragraphs:
      - "Twenty-six states have right-to-work laws in 2026. Texas, Florida, Georgia, North Carolina, Tennessee, Arizona, and Virginia are all in that group."
      - "Alabama, Arkansas, Kentucky, Oklahoma, South Carolina, Utah, Wisconsin, and Wyoming are in the same yes group. Nevada and Idaho are there too."

  - id: "states-without-right-to-work-laws"
    icon: "fa-solid fa-people-group"
    title: "States Without Right-to-Work Laws"
    paragraphs:
      - "Twenty-four states do not have right-to-work laws. California, New York, Illinois, New Jersey, Washington, Oregon, and Pennsylvania are all in that no group."
      - "Alaska, Hawaii, Colorado, Minnesota, Massachusetts, and Rhode Island are also no-right-to-work states. Michigan joined them after its 2024 repeal."

  - id: "michigan-right-to-work-status"
    icon: "fa-solid fa-calendar-day"
    title: "Michigan Right-to-Work Status"
    paragraphs:
      - "Michigan is now a no-right-to-work state. The repeal took effect on March 30, 2024."
      - "Michigan had been a right-to-work state before that repeal. NCSL still notes it as the first state in decades to reverse such a law."

visual_assets:
  - id: right-to-work-list
    src: /images/rankings/law/right-to-work-states/right-to-work-list.jpg
    alt: Workers collaborating inside a manufacturing facility
    caption: Right-to-work states are heavily concentrated in the South, Great Plains, and parts of the Mountain West. Texas, Florida, Georgia, North Carolina, and Tennessee are among the largest and most economically significant members of that group.
    section: right-to-work-states-list
    layout: full-width-tall

  - id: without-right-to-work
    src: /images/rankings/law/right-to-work-states/without-right-to-work.jpg
    alt: Workers and labor supporters holding protest or union signs
    caption: Non-right-to-work states tend to be concentrated on the West Coast, in the Northeast, and across parts of the Upper Midwest. These states continue to allow union-security agreements under state law, subject to federal labor rules.
    section: states-without-right-to-work-laws
    layout: full-width-tall

  - id: michigan-right-to-work
    src: /images/rankings/law/right-to-work-states/michigan-right-to-work.jpg
    alt: Michigan State Capitol building in Lansing
    caption: Michigan's repeal of right-to-work took effect on March 30, 2024, making it the most prominent recent reversal in the state-by-state labor-law map. That change moved Michigan back into the non-right-to-work column after little more than a decade.
    section: michigan-right-to-work-status
    layout: full-width-tall

faq:
  - question: "Is Texas a right-to-work state?"
    answer: "Yes. Texas is in the right-to-work group in 2026."

  - question: "Is Florida a right-to-work state?"
    answer: "Yes. Florida has a right-to-work law on the books."

  - question: "Is California a right-to-work state?"
    answer: "No. California is in the no-right-to-work group."

  - question: "Is Michigan a right-to-work state?"
    answer: "No. Michigan repealed its right-to-work law effective March 30, 2024."

  - question: "Which states are right-to-work states?"
    answer: "Twenty-six states are right-to-work states in 2026, including Texas, Florida, Georgia, North Carolina, Tennessee, Arizona, and Virginia. Wisconsin, Kentucky, and Oklahoma are in that group too."

  - question: "Is at-will employment the same as right-to-work?"
    answer: "No. Right-to-work covers union membership and union dues, while at-will employment is a different rule about ending employment."

