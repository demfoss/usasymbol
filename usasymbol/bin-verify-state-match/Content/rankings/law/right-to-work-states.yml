  title: "Right-to-Work States | Map, Unions & Facts"
  description: "Twenty-six states have right-to-work laws in 2026. Michigan repealed its law effective March 30, 2024, leaving 24 states without one."

page:
  h1: "Right-to-Work States"

  quick_answer:
    - "Right-to-work states total 26 in 2026, including Texas, Florida, Georgia, North Carolina, and Tennessee."
    - "Michigan is no longer a right-to-work state. Its repeal took effect on March 30, 2024."
    - "California, New York, Illinois, Pennsylvania, and Washington are in the no-right-to-work group. Texas, Florida, and Virginia are in the yes group."

  methodology: "State status follows the National Conference of State Legislatures right-to-work resource, checked on June 22, 2026. Michigan repeal timing is noted from the State of Michigan labor guidance."

  sources:
