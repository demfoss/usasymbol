faq:
  - question: "What age can a child be left home alone in Illinois?"
    answer: "Illinois sets a legal minimum age of 14, the oldest legal minimum on record and the only one above 10."

  - question: "Which states have a legal minimum age for leaving a child home alone?"
    answer: "Four states have a legal minimum on record: Illinois (14), Oregon (10), and Maryland and North Carolina (8 each). Maryland and North Carolina base their minimum on fire code rather than a standalone childcare statute."

  - question: "What is the recommended age to leave a child home alone?"
    answer: "Recommended ages on record range from 6 in Kansas and Oklahoma to 12 in Colorado, Connecticut, Florida, and Mississippi. These are guidelines, not legal requirements."

  - question: "Does Georgia have a law about the age a child can be left home alone?"
    answer: "Georgia has no legal minimum, only a recommendation: ages 9 to 12 for short periods alone and 13 and up for extended time alone."

  - question: "What age can a child be left home alone in Maryland?"
    answer: "Maryland's fire code sets 8 as the minimum age for children to be left alone briefly, and 12 as the minimum for longer periods."

  - question: "Which states regulate the home alone age at the local level?"
    answer: "New Mexico lists a statewide recommended age of 10, but Albuquerque sets its own local minimum of 11. Minnesota regulates the issue locally with no statewide figure on record."

