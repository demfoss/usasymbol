sections:
  - id: "states-with-a-legal-minimum-home-alone-age"
    icon: "fa-solid fa-gavel"
    title: "States With a Legal Minimum Home Alone Age"
    paragraphs:
      - "Illinois sets a legal minimum age of 14, the only state whose set minimum exceeds 10. Oregon sets a legal minimum of 10, while Maryland and North Carolina each set a legal minimum of 8."
      - "Maryland and North Carolina both base their minimum on fire code rather than a standalone childcare statute. Maryland's fire code allows children 8 and older to be left alone briefly and children 12 and older for longer periods, and North Carolina's fire code sets 8 as the minimum age in the absence of a statewide law."

  - id: "states-with-a-recommended-home-alone-age"
    icon: "fa-solid fa-clipboard-list"
    title: "States With a Recommended Home Alone Age"
    paragraphs:
      - "Colorado, Connecticut, Florida, and Mississippi share the highest recommended, non-legal age on record at 12, tied with the fire-code minimum for longer periods in Maryland. Kansas and Oklahoma share the lowest recommended age at 6, the youngest figure on record."
      - "Georgia and North Dakota both set a recommended age of 9, with each state building in a higher threshold for extended time alone. Georgia recommends ages 9 to 12 for short periods and 13 and up for extended time, and North Dakota's DHS guidelines set 9 as the minimum and 12 for longer periods."

  - id: "states-that-regulate-at-the-local-level"
    icon: "fa-solid fa-map-location-dot"
    title: "States That Regulate the Home Alone Age Locally"
    paragraphs:
      - "New Mexico lists a recommended age of 10 statewide, but the city of Albuquerque sets its own minimum age of 11. Minnesota regulates the issue at the local level with no statewide figure on record, one of 31 states in this list without a listed age."

