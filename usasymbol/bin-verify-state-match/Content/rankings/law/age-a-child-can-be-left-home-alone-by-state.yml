page:
  h1: "Age a Child Can Be Left Home Alone by State"

  quick_answer:
    - "Illinois sets the oldest legal minimum age to leave a child home alone at 14, the only state above 10. Maryland and North Carolina set a legal minimum of 8, and Oregon sets 10."
    - "Colorado, Connecticut, Florida, and Mississippi share the highest recommended age on record at 12, though none make it a legal requirement. Kansas and Oklahoma share the lowest recommended age at 6."
    - "Only four states have a legally mandated minimum age on record: Illinois, Maryland, North Carolina, and Oregon. Most others rely on a recommended guideline, and many have no figure on record at all."

  methodology: "Ages reflect each state's legally mandated minimum age or, where no law exists, a published recommended guideline age, on record as of 2026. Several states without a listed figure regulate the issue at the local level instead."

