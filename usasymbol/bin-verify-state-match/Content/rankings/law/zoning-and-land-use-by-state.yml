page:
  h1: "Zoning and Land Use by State"

  quick_answer:
    - "Zoning and land use freedom is strongest in Texas, where permit burden is Very Low and off-grid living is often feasible in rural areas."
    - "Wyoming matches Texas on Very Low permit burden, while Idaho stays green with Low burden and often feasible off-grid living."
    - "California, New York, and Hawaii are the toughest outliers. All three sit in Red Tape, and California and Hawaii both carry Very High permit burden."

  methodology: "This page uses a June 2026 editorial synthesis of official state and local land-use sources, including Hawaii's statewide land classification system, New York's SEQR review process, California housing and permit fee materials, Idaho's planning law, Wyoming county planning rules, and Houston's no-zoning code. Labels reflect how hard it is in practice to permit ordinary rural building and off-grid living, not a single statewide statutory score."

  sources:
    - name: "City of Houston Planning and Development"
      url: "https://www.houstontx.gov/planning/DevelopRegs/"
      description: "Official city page stating Houston does not have zoning but still regulates development through ordinances and subdivision rules"
    - name: "Hawaii Land Use Commission"
      url: "https://luc.hawaii.gov/"
      description: "Official statewide land classification system for urban, rural, agricultural, and conservation districts"
    - name: "California Department of Housing and Community Development"
      url: "https://www.hcd.ca.gov/housing-element/building-blocks/constraints-fees"
      description: "Official California material on development fees, zoning changes, use permits, and fee constraints"
    - name: "New York State Department of Environmental Conservation. SEQR"
      url: "https://dec.ny.gov/regulatory/permits-licenses/seqr"
      description: "Official description of New York's environmental review process for discretionary actions"
    - name: "Idaho Local Land Use Planning Act"
      url: "https://www.cityofnampa.us/1749/Local-Land-Use-Planning-Act"
      description: "Local summary of Idaho's statewide planning framework under Title 67, Chapter 65"
    - name: "Sublette County Wyoming Planning and Zoning"
      url: "https://www.sublettecountywy.gov/123/Planning-Zoning"
      description: "Example of Wyoming county planning, zoning, subdivision, building, and septic review"

