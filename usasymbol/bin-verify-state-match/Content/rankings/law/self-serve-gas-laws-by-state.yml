faq:
  - question: "Which states do not allow you to pump your own gas?"
    answer: "New Jersey is the only state on this page where self-serve gas is illegal statewide. Oregon is not in that group anymore."

  - question: "Is it illegal to pump gas in New Jersey?"
    answer: "Yes. New Jersey is marked No for self_serve_legal, Full-Service Only for service_model, and $50-$250 first. Up to $500 later in the penalty column."

  - question: "What is the fine for pumping your own gas in New Jersey?"
    answer: "New Jersey lists $50 to $250 for a first offense and up to $500 for each later offense. That penalty range appears in N.J.S.A. 34:3A-10 and the current New Jersey labor regulation page."

  - question: "Is self-serve gas legal in Oregon?"
    answer: "Yes. Oregon is marked Yes for self_serve_legal and Self-Serve + Attendant for service_model. The Oregon State Fire Marshal says 2023 law now allows self-service statewide."

  - question: "Why does Oregon still have gas attendants?"
    answer: "Oregon still uses a hybrid model. HB 2426 says stations offering self-service must also provide attended service and must charge the same price at both pump types."

  - question: "Why is New Jersey the only state with no self-serve gas?"
    answer: "New Jersey is the only red state in this table because its act still bans non-attendants from dispensing fuel. The legislative findings cite fire hazards, safety enforcement, liability concerns, and gasoline-fume exposure."

