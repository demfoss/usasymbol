faq:
- question: Which state has the most data centers?
  answer: Virginia leads with 603 facilities, 142 more than second-place Texas. No other state passes 300.
- question: How many data centers are in Texas?
  answer: Texas has 461 data centers, the second most in the country. Another 170 facilities were planned or under construction there as of February 2026, a pipeline second only to Virginia's.
- question: Which states have the most planned data centers?
  answer: Virginia led with 287 planned facilities as of February 2026. Texas followed with 170, then Georgia with 141, Illinois with 123, and Arizona with 86.
- question: Which state has the fewest data centers?
  answer: Vermont has the fewest with 3. Rhode Island is next at 7, followed by Alaska at 8.
- question: How many data centers are in California?
  answer: California has 287 data centers, third behind Virginia and Texas. Its planned pipeline is small at 54 projects, roughly a fifth of Virginia's 287.
- question: How much electricity do data centers use in the US?
  answer: Data centers used about 4.4 percent of all US electricity in 2023. Virginia, the state with the most facilities, accounted for an estimated 32 terawatt-hours, more than any other state.
