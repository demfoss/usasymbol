page:
  h1: Data Centers by State
  quick_answer:
  - Data centers by state counts put Virginia first with 603 facilities. Texas ranks second with 461, and California is third with 287.
  - Vermont ranks last with 3 data centers. Rhode Island has 7 and Alaska has 8, keeping all three states below 10.
  - Virginia leads Texas by 142 facilities. Illinois ranks fourth with 228, edging Georgia at 219 and Ohio at 204.
  methodology: Facility counts come from the Data Center Map database as of May 2026 and include operational and announced sites. Planned-versus-operating splits follow Pew Research Center's February 2026 analysis of the same data.
