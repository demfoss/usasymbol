- id: planned-data-centers
  icon: fa-solid fa-hard-hat
  title: Planned Data Centers by State
  paragraphs:
  - Virginia had 287 data centers planned or under construction as of February 2026, the largest pipeline in the country. Texas followed with 170 planned facilities.
  - Georgia's pipeline of 141 planned facilities exceeded its 94 operating sites, the only top-six state where planned projects outnumbered operating ones. Illinois had 123 planned, and Arizona had 86.
  - Nationwide, more than 3,000 data centers were operating in early 2026. Over 1,500 more were planned or under construction.
- id: fewest-data-centers
  icon: fa-solid fa-map-pin
  title: States With the Fewest Data Centers
  paragraphs:
  - Vermont ranks last with 3 data centers. Rhode Island has 7, and Alaska has 8.
  - Hawaii, Maine, and West Virginia each have 9 facilities. New Hampshire and South Dakota sit just above them at 10.
- id: largest-data-center-markets
  icon: fa-solid fa-server
  title: Largest Data Center Markets in the US
  table:
