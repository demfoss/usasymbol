  paragraphs:
  - Northern Virginia anchors the industry. Loudoun County's Data Center Alley helps give Virginia 603 facilities, more than the next state by 142, with Amazon Web Services, Microsoft, Google, and Meta all operating large campuses there.
  - Hyperscale growth has spread inland. Columbus helped push Ohio to 204 facilities, and Atlanta's pipeline of planned sites now exceeds the number Georgia already operates.
