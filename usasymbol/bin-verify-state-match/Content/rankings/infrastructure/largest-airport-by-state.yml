faq:
  - question: "Which state has the largest airport by passengers?"
    answer: "Georgia ranks first with Hartsfield-Jackson Atlanta International at 104.7 million passengers. Texas is second at 81.4 million with Dallas/Fort Worth International."

  - question: "What is the largest airport in Colorado?"
    answer: "Denver International is Colorado's largest airport in this table at 77.8 million passengers. Denver also has the biggest area figure at 34,000 acres."

  - question: "What is the largest airport in Texas?"
    answer: "Dallas/Fort Worth International is Texas's largest airport with 81.4 million passengers. Its area is 17,207 acres, which ranks second in the table."

  - question: "What is the largest airport in California?"
    answer: "Los Angeles International is California's largest airport at 75.0 million passengers. LAX covers 3,500 acres."

  - question: "Which state has the smallest primary airport?"
    answer: "Delaware ranks last with Wilmington Airport at 0.3 million passengers. West Virginia follows at 0.5 million with Yeager Airport."

  - question: "Which state has the largest airport by area?"
    answer: "Colorado leads by area with Denver International at 34,000 acres. Texas is next with Dallas/Fort Worth International at 17,207 acres."

