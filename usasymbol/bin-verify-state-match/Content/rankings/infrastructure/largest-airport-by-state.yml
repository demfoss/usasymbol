page:
  h1: "Largest Airport in Each State"

  quick_answer:
    - "Largest airport by state data puts Georgia first. Hartsfield-Jackson Atlanta International handles 104.7 million passengers, ahead of Texas at 81.4 million."
    - "Denver International in Colorado covers 34,000 acres, the biggest footprint in the table. Dallas/Fort Worth in Texas is next at 17,207 acres."
    - "Delaware ranks last at 0.3 million passengers at Wilmington Airport. West Virginia is next at 0.5 million at Yeager Airport."

  methodology: "Passenger figures use FAA 2023 enplanements, and area figures use FAA airport facility records. Each state is represented by its busiest commercial airport in the table."

  sources:
    - name: "FAA Passenger Boarding Data"
      url: "https://www.faa.gov/airports/planning_capacity/passenger_allcargo_stats/passenger"
      description: "2023 enplanements for U.S. commercial service airports"
