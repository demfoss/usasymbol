sections:
  - id: "size-vs-traffic"
    icon: "fa-solid fa-plane-departure"
    title: "Largest Airport by State Top and Bottom"
    paragraphs:
      - "Georgia leads the table with Hartsfield-Jackson Atlanta International at 104.7 million passengers. Texas follows with Dallas/Fort Worth International at 81.4 million, and Colorado is close behind at 77.8 million."
      - "Delaware sits last with Wilmington Airport at 0.3 million passengers. West Virginia reaches 0.5 million at Yeager Airport, and Vermont reaches 0.6 million at Burlington International."

  - id: "when-the-airport-doesnt-match-the-city"
    icon: "fa-solid fa-map-pin"
    title: "Largest Airport by State Area Leaders"
    paragraphs:
      - "Colorado has the biggest airport footprint in the table at 34,000 acres at Denver International. Texas ranks second at 17,207 acres at Dallas/Fort Worth International."
      - "Oklahoma also stands out by area. Will Rogers World Airport covers 8,000 acres with 4.5 million passengers, while Virginia's Ronald Reagan Washington National covers 861 acres with 25.1 million passengers."

  - id: "outliers-worth-knowing"
    icon: "fa-solid fa-star"
    title: "Largest Airport by State Traffic and Size Gaps"
    paragraphs:
      - "Georgia handles 104.7 million passengers on 4,700 acres at Hartsfield-Jackson Atlanta International. Colorado handles 77.8 million passengers on 34,000 acres at Denver International."
      - "Indiana shows a similar gap at a smaller scale. Indianapolis International spans 7,700 acres with 10.5 million passengers, while New Jersey's Newark Liberty handles 46.4 million passengers on 2,027 acres."

