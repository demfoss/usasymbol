faq:
  - question: "Which state has the most MLS teams?"
    answer: "California has 4 MLS teams, one more than Texas's 3 and two more than Ohio or Florida's 2 each."

  - question: "How many MLS teams are in Texas?"
    answer: "Texas has 3 MLS teams, all in the Western Conference, including Austin FC, FC Dallas, and Houston Dynamo FC."

  - question: "Which MLS teams are in Canada?"
    answer: "Three MLS clubs play in Canada, including Toronto FC, CF Montréal, and the Vancouver Whitecaps. The other 27 clubs play in the United States."

  - question: "What is the largest MLS stadium?"
    answer: "Mercedes-Benz Stadium in Atlanta is the largest MLS stadium, seating 42,500 for Atlanta United FC."

  - question: "Does Ohio have more than one MLS team?"
    answer: "Yes. Ohio has 2 MLS teams, FC Cincinnati, which plays at TQL Stadium, and Columbus Crew, which plays at ScottsMiracle-Gro Field."

  - question: "How many states have an MLS team?"
    answer: "19 U.S. states have at least one MLS team, out of the 26 clubs assigned to a state. Ohio and Florida are the only states with exactly 2 teams each."

