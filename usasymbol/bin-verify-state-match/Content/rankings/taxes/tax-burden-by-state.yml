faq:
  - question: "Which state has the highest tax burden?"
    answer: "Hawaii has the highest total tax burden at 13.30% of personal income. Its 7.48% sales and excise tax burden is the highest of any state and accounts for more than half of the total."
  - question: "Which state has the lowest tax burden?"
    answer: "Alaska has the lowest total tax burden at 4.92% of personal income, less than half of Hawaii's rate. Alaska has no state income tax."
  - question: "What is the tax burden in Texas?"
