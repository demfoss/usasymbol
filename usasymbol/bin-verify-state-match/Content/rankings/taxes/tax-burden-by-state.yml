page:
  h1: "Tax Burden by State"

  quick_answer:
    - "Hawaii has the highest total state and local tax burden in the country at 13.30% of personal income, driven mainly by a 7.48% sales and excise tax burden."
    - "Alaska has the lowest burden at 4.92%, less than half of Hawaii's rate, and reports a 0.00% income tax burden. New York ranks second at 12.39%, and Vermont is third at 11.10%."
    - "Burden splits into three parts, property, income, and sales and excise taxes, each measured as a share of personal income. Vermont's property tax burden of 4.89% is the highest of any state, and Oregon's income tax burden of 4.76% is the highest of any state."

  methodology: "Total tax burden measures property, individual income, and sales and excise taxes collected in each state as a share of the state's total personal income, using Tax Policy Center data collected as of March 3, 2026."

  sources:
    - name: "WalletHub, States with the Highest and Lowest Tax Burden 2026"
