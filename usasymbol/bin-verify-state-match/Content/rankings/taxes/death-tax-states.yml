    death_tax_status: "Death Tax Status"
    estate_tax: "Estate Tax"
    inheritance_tax: "Inheritance Tax"
    estate_tax_exemption: "Estate Tax Exemption"
    estate_tax_rate: "Estate Tax Rate"

  metric_default: death_tax_status
  sort_default: asc

