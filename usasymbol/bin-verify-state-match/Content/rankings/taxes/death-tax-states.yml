map:
  title: "Death Tax States Map"
  image: "/images/rankings/taxes/death-tax-states/death-tax-states-map.webp"
  image_alt: "U.S. map color-coded by state death tax status, with Maryland in red, estate-tax states in orange, inheritance-tax states in yellow, and no-tax states in green"
  caption: "Maryland is the only red state with Estate Tax Yes and Inheritance Tax Yes. 34 states are green with No and No, while Washington stands out among estate-tax states with a 35% top rate."
  metric_key: death_tax_status
  metric_label: "Death Tax Status"
  name_key: state
  tooltip_label: death_tax_status
  color_scheme: categorical
  color_scale: categorical
  color_map:
    "Both Taxes": "red-dark"
    "Estate Tax Only": "orange"
    "Inheritance Tax Only": "yellow"
    "No State Death Tax": "green-dark"
  detail_keys:
    - estate_tax
    - inheritance_tax
    - estate_tax_rate
    - inheritance_tax_rate
  filters:
    - key: death_tax_status
      label: "Filter by Death Tax Status"
      use_colors: true
    - key: estate_tax
      label: "Filter by Estate Tax"
      accent_color: "#b1135b"
    - key: inheritance_tax
      label: "Filter by Inheritance Tax"
      accent_color: "#2f6f86"

