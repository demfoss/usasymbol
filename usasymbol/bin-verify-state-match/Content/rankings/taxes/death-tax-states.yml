    paragraphs:
      - "12 states levy an estate tax in 2025. Washington has the highest top estate tax rate at 35%, Hawaii reaches 20%, and Connecticut stands apart with a 12% flat rate and the highest exemption at $13,990,000."
      - "Oregon and Rhode Island have the lowest estate tax exemptions in the table at $1,000,000 and $1,802,431. New York lists the second-highest exemption at $7,160,000, and Maine lists $7,000,000."

  - id: "states-with-inheritance-tax"
    icon: "fa-solid fa-file-invoice-dollar"
    title: "States with Inheritance Tax"
    paragraphs:
      - "Five states levy an inheritance tax in 2025. Kentucky and New Jersey have the highest top rates at 16%, Nebraska and Pennsylvania reach 15%, and Maryland tops out at 10%."
      - "Nebraska has the highest inheritance tax exemption in the table at $100,000. Pennsylvania lists No exemption, New Jersey lists $25,000, and Kentucky and Maryland each list $1,000."

