faq:
  - question: "Which states have no inheritance tax?"
    answer: "45 states have no inheritance tax in 2025. Only Kentucky, Maryland, Nebraska, New Jersey, and Pennsylvania list Inheritance Tax Yes."

  - question: "Which states have estate tax?"
    answer: "12 states have an estate tax in 2025. Connecticut, Hawaii, Illinois, Maine, Maryland, Massachusetts, Minnesota, New York, Oregon, Rhode Island, Vermont, and Washington make up that group."

  - question: "Which states have both estate tax and inheritance tax?"
    answer: "Maryland is the only two-tax state in 2025. Its row lists a $5,000,000 estate tax exemption and a $1,000 inheritance tax exemption."

  - question: "What is the estate tax in Washington?"
    answer: "Washington lists a $3,000,000 estate tax exemption and a 10%-35% estate tax rate. The 35% top rate is the highest estate tax rate in the table."

  - question: "What is the inheritance tax in Pennsylvania?"
    answer: "Pennsylvania lists Inheritance Tax Yes, No exemption, and a 0%-15% rate. It does not list an estate tax in the table."

  - question: "Which states have no death tax?"
    answer: "34 states have no state-level death tax in 2025. Iowa is in that group because its inheritance tax was eliminated effective January 1, 2025."

