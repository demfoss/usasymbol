type: ranking
slug: death-tax-states
category: taxes
url: /rankings/taxes/death-tax-states
auto_link_phrases:
  - "states with no inheritance tax"
  - "estate tax by state map"
  - "death tax states"
  - "where is the best place to die for taxes"
  - "states with no death tax"
hero_image: "/images/rankings/taxes/death-tax-states/death-tax-states-hero.jpg"
hero_image_alt: "Estate planning documents and house keys representing state-level death taxes"
hero_image_caption: "State death-tax policy is concentrated in a small group of states, with Maryland standing alone as the only one that levies both an estate tax and an inheritance tax."

author: "USA Symbol Team"
date_published: "2026-06-25"
date_modified: "2026-06-25"

seo:
  title: "Death Tax States | Map, Estate & Inheritance"
  description: "Maryland is the only state with both estate tax and inheritance tax. 34 states have neither state-level death tax in 2025."

page:
  h1: "Death Tax States"

  quick_answer:
    - "Death tax states have one two-tax outlier. Maryland is the only state with Estate Tax Yes and Inheritance Tax Yes in 2025."
    - "34 states have No and No. Washington has Estate Tax Yes with a 35% top rate, the highest estate tax rate in the table."
    - "Kentucky and New Jersey have Inheritance Tax Yes with 16% top rates. Pennsylvania and Nebraska top out at 15%, while Maryland tops out at 10%."

  methodology: "Rows with Estate Tax Yes or Inheritance Tax Yes come from the Tax Foundation 2025 table provided in the source CSV. States not listed in that table are shown as No and No, and the District of Columbia is excluded from these 50 state rows."

  sources:
    - name: "Tax Foundation. Estate and Inheritance Taxes by State, 2025"
      url: "https://taxfoundation.org/data/all/state/estate-inheritance-taxes/"
      description: "2025 state table with estate tax exemptions, estate tax rates, inheritance tax exemptions, and inheritance tax rates"
    - name: "Tax Foundation. Facts and Figures 2025"
      url: "https://taxfoundation.org/wp-content/uploads/2025/05/TaxFoundation_FactsFigures2025-v2.pdf"
      description: "Reference tables for state estate tax and inheritance tax structures in 2025"
    - name: "Tax Foundation. Estate Tax Glossary"
      url: "https://taxfoundation.org/taxedu/glossary/estate-tax/"
      description: "Definition of estate tax"
    - name: "Tax Foundation. Inheritance Tax Glossary"
      url: "https://taxfoundation.org/taxedu/glossary/inheritance-tax/"
      description: "Definition of inheritance tax"

table:
  caption: "Death Tax States in 2025"
  note: "Estate tax is paid by the estate before assets are distributed. Inheritance tax is paid by the recipient. Rates and exemptions shown here use the 2025 state table provided by Tax Foundation."
  columns:
