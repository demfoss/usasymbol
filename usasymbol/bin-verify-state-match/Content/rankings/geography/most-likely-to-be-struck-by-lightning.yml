faq:
  - question: "Which state has the most lightning?"
    answer: "Texas has the most average total lightning per year at 41,083,472. Florida ranks second on total counts at 13,989,300."

  - question: "Which state has the highest lightning density?"
    answer: "Florida has the highest lightning density at 244.1 counts per square mile. Oklahoma is second at 213.8, and Louisiana is third at 210.7."

  - question: "What is the lightning density in Florida?"
    answer: "Florida records 244.1 lightning counts per square mile. Its 2019 total was 13,049,687, and its 2015 to 2019 annual average was 13,989,300."

  - question: "What is the lightning density in Texas?"
    answer: "Texas records 154.9 lightning counts per square mile. That is lower than Florida's 244.1, even though Texas leads the country in average annual lightning counts at 41,083,472."

  - question: "Which state has the least lightning?"
    answer: "Alaska has the lowest lightning density at 0.3 counts per square mile. Washington is lowest in the contiguous United States at 2.1."

  - question: "What is the lightning density in California?"
    answer: "California records 3.6 lightning counts per square mile. Its average annual total is 573,698, which places it far below Texas at 41,083,472 and Florida at 13,989,300."

