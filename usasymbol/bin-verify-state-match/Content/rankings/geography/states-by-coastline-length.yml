faq:
  - question: "Which state has the most coastline?"
    answer: "Alaska has the most ocean coastline of any U.S. state at 6,640 miles. Florida is second at 1,350 miles, followed by California (840 mi) and Hawaii (750 mi)."

  - question: "Which state has the longest coastline in the lower 48?"
    answer: "Florida has 1,350 miles of ocean coastline, the most of any state in the contiguous United States. California ranks second in the lower 48 with 840 miles."

  - question: "How much coastline does Texas have?"
    answer: "Texas has 367 miles of ocean coastline along the Gulf of Mexico, ranking 6th overall. Louisiana ranks 5th at 397 miles, 30 miles more than Texas."

  - question: "Which state has the shortest coastline?"
    answer: "New Hampshire has 13 miles of ocean coastline, ranking 23rd and last among states with any ocean access. Delaware (28 mi) and Maryland (31 mi) are the next two shortest."

  - question: "How many U.S. states have no ocean coastline?"
    answer: "Twenty-seven U.S. states have no ocean coastline. They include Arizona, Nevada, Colorado, Montana, Wyoming, Ohio, Minnesota, Illinois, Pennsylvania, and Vermont, among others."

  - question: "How much coastline does California have?"
    answer: "California has 840 miles of Pacific coastline, ranking 3rd among all U.S. states. Only Alaska (6,640 mi) and Florida (1,350 mi) have more."

