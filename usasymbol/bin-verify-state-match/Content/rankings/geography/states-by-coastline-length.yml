page:
  h1: "Coastline of the United States"

  quick_answer:
    - "Alaska has 6,640 miles of ocean coastline, the most of any U.S. state. Florida ranks second at 1,350 miles, the longest in the contiguous United States."
    - "Texas ranks 6th with 367 miles on the Gulf of Mexico despite being the second-largest state by land area. Louisiana ranks 5th with 397 miles, placing it ahead of Texas."
    - "New Hampshire has the shortest ocean coastline of any coastal state at 13 miles. Twenty-seven states, including Arizona, Colorado, and Ohio, have no ocean coastline."

  methodology: "Coastline figures use NOAA's general coastline measurement, which traces only the outer coast and excludes inland tidal waters, per NOAA 'Coastlines of the United States,' National Ocean Survey, 1975. Tidal shoreline figures, which follow every inlet and tidal creek, are much larger and are not used here."

  sources:
    - name: "NOAA Office for Coastal Management"
      url: "https://oceanservice.noaa.gov/facts/coastline.html"
      description: "Official NOAA coastline data and explanation of general vs. tidal shoreline measurement"
    - name: "NOAA Nautical Charts — U.S. Coastline and Shoreline"
      url: "https://nauticalcharts.noaa.gov/data/us-coastline-and-shoreline.html"
      description: "Primary source: NOAA 'Coastlines of the United States,' National Ocean Survey, 1975"

