faq:
  - question: "Which state has the most snowfall?"
    answer: "Vermont has the highest average snowfall at 93.90 inches a year. Maine is second at 90.73 inches, and New York is third at 90.11."

  - question: "Which state has the least snowfall?"
    answer: "Louisiana has the lowest average snowfall at 0.68 inches a year. Mississippi is next lowest at 1.09 inches."

  - question: "How much snow does Alaska get in a year?"
    answer: "Alaska averages 76.41 inches of snow a year, ranking sixth in the country. Colorado is close behind at 71.07 inches."

  - question: "Does Florida get snow?"
    answer: "Florida is not included in the rankings because it averages near-zero snowfall. Hawaii is excluded for the same reason."

  - question: "How much snow does New York get in a year?"
    answer: "New York averages 90.11 inches of snow a year, the third-highest total in the rankings, behind only Vermont and Maine."

  - question: "How much snow does California get in a year?"
    answer: "California averages 31.72 inches of snow a year, ranking 23rd, just behind Ohio at 31.73 and ahead of Nebraska at 31.11."

