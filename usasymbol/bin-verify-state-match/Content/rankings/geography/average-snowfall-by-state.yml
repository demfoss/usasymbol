  quick_answer:
    - "Vermont has the highest average snowfall in the country at 93.90 inches a year, the most of any state in the rankings."
    - "Maine and New York follow closely at 90.73 and 90.11 inches, both topping 90 inches like Vermont. New Hampshire ranks fourth at 89.68 inches."
    - "Louisiana has the lowest average snowfall at 0.68 inches. Mississippi (1.09), Alabama (1.30), and Georgia (1.38) also finish under 1.5 inches."

  methodology: "Average annual snowfall figures come from World Population Review's 2026 ranking, based on climate normals recorded at weather stations in each state between 1990 and 2020. Florida and Hawaii are excluded because both average near-zero snowfall."

