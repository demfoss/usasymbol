sections:
  - id: "what-states-are-in-the-deep-south"
    icon: "fa-solid fa-map-location-dot"
    title: "What States Are in the Deep South?"
    paragraphs:
      - "Five states form the universally recognized Deep South: Alabama, Georgia, Louisiana, Mississippi, and South Carolina. All five were original Confederate states whose economies were built almost entirely on cotton slavery. South Carolina was the first to secede (December 20, 1860), and Louisiana was the last of the five (January 26, 1861). Mississippi was the only U.S. state where enslaved people outnumbered free residents."
      - "Five additional states appear in some but not all definitions: Arkansas, Florida, North Carolina, Tennessee, and Texas. In each case, one part of the state matches the Deep South pattern, the Arkansas Delta, the Florida Panhandle, southeastern North Carolina, West Tennessee, East Texas, while the rest does not. Whole-state inclusion is contested because these states contain large non-Deep-South regions."

  - id: "core-vs-sometimes-included-deep-south-states"
    icon: "fa-solid fa-circle-half-stroke"
    title: "Core vs Sometimes-Included Deep South States"
    paragraphs:
      - "The 5 core states share three traits no sometimes-included state fully replicates: cotton was the dominant crop across most of the state (not just one region), enslaved people constituted at least 44 percent of the total population by 1860, and secession came in the first wave, January or earlier. Mississippi's enslaved population reached 55 percent of its total, and South Carolina's reached 57 percent."
      - "The 5 sometimes-included states each have a geographic exception that prevents full classification. Texas is mostly Western, Florida is mostly subtropical and non-Southern culturally, Tennessee has a strongly Unionist eastern third, North Carolina's Piedmont and mountains differ sharply from its coastal plain, and Arkansas's Ozark northwest resembles the Border South more than the Cotton South. No authoritative source classifies all five as fully Deep South."

  - id: "why-its-called-the-deep-south"
    icon: "fa-solid fa-circle-info"
    title: "Why Is It Called the Deep South?"
    paragraphs:
      - "The term 'Deep South' originally meant deep into the Cotton Belt, the zone of fertile, flat land where short-staple cotton grew most productively and where plantation slavery was most economically entrenched. The five core states sit at the geographic and economic center of that zone. 'Deep' distinguished them from the Upper South (Virginia, Kentucky, Tennessee) where tobacco and mixed farming were more common and plantation dependence was less total."
      - "The phrase became standard in the early 20th century as a geographic and cultural descriptor. Journalists and scholars used it to describe the states where Reconstruction-era racial segregation was strictest, where Democratic Party dominance was most absolute, and where the Confederate memory was most institutionally embedded. The term carries both a geographic meaning (the southernmost cotton states) and a cultural one (the most intensely Southern states)."

  - id: "deep-south-vs-upper-south"
    icon: "fa-solid fa-arrows-up-down"
    title: "Deep South vs Upper South"
    paragraphs:
      - "The Upper South, Virginia, Kentucky, Tennessee, North Carolina, Arkansas, and West Virginia, differs from the Deep South on three historical markers: crop type (tobacco and mixed farming rather than cotton monoculture), timing of secession (later, or not at all), and internal division (significant Unionist populations). Kentucky never seceded, and West Virginia was created in 1863 because its counties refused to follow Virginia into the Confederacy."
      - "Virginia is the clearest example of the Upper South distinction. Although Richmond served as Confederate capital, Virginia's economy was built on tobacco, not cotton. Its secession came on April 17, 1861, nearly four months after South Carolina, and only after Fort Sumter forced a choice. The Deep South states had already formed the Confederate government in Montgomery, Alabama before Virginia joined."

