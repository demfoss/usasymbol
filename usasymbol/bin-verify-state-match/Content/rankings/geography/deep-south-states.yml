page:
  h1: "Deep South States"

  quick_answer:
    - "Five states form the universally recognized Deep South, Alabama, Georgia, Louisiana, Mississippi, and South Carolina. All five were among the original Confederate states most economically dependent on cotton slavery."
    - "Five states are sometimes included in the Deep South: Arkansas, Florida (North Florida only), North Carolina (southeastern counties), Tennessee (West Tennessee only), and Texas (East Texas only). Each has a region that matches Deep South culture, but a larger area that does not, making whole-state inclusion contested."
    - "The Deep South differs from the Upper South, Virginia, Kentucky, West Virginia, and the non-Deep-South portions of Tennessee and North Carolina, which had weaker ties to the Cotton Belt, seceded later or not at all, and maintained stronger Unionist sentiment during the Civil War."

  methodology: "Deep South classification reflects the geographic and historical consensus across academic sources, encyclopedias, and major reference works. Core states appear in virtually every published definition. Sometimes-included states appear in some definitions based on substate regions matching Deep South economic and cultural patterns."

