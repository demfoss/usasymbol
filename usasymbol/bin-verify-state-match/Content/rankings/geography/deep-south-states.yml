faq:
  - question: "What states are in the Deep South?"
    answer: "Five states form the universally recognized Deep South: Alabama, Georgia, Louisiana, Mississippi, and South Carolina. Five more — Arkansas, Florida, North Carolina, Tennessee, and Texas — are sometimes included, typically because one part of the state (the Arkansas Delta, North Florida, West Tennessee, East Texas, or southeastern North Carolina) shares Deep South characteristics."

  - question: "What is the difference between the Deep South and the Upper South?"
    answer: "The Deep South (Alabama, Georgia, Louisiana, Mississippi, South Carolina) was defined by cotton monoculture, high proportions of enslaved people, and early secession in late 1860 and January 1861. The Upper South (Virginia, Kentucky, Tennessee, North Carolina, Arkansas) had more tobacco and mixed farming, lower cotton dependence, and seceded later or not at all. Kentucky never seceded and West Virginia was created specifically to stay in the Union."

  - question: "Is Texas in the Deep South?"
    answer: "East Texas is often classified as Deep South. The Piney Woods and Red River Valley region bordering Louisiana and Arkansas was part of the antebellum Cotton Belt and is culturally continuous with the Deep South. The rest of Texas — West Texas, the Gulf Coast south of Houston, and the major cities — is not. Texas as a whole is rarely classified as fully Deep South."

  - question: "Is Florida in the Deep South?"
    answer: "North Florida — the Panhandle and Big Bend region bordering Georgia and Alabama — is consistently classified as Deep South in cultural geography. Central and South Florida, the Miami metro, and the Atlantic Coast are not. Florida seceded January 10, 1861, but had one of the smallest plantation economies of the Confederate states."

  - question: "Is Tennessee in the Deep South?"
    answer: "West Tennessee, centered on Memphis and the Mississippi River floodplain, is typically classified as Deep South because of its Cotton Belt geography and culture. Middle Tennessee and East Tennessee are Upper South. East Tennessee had such strong Unionist sentiment that Confederate authorities considered it a security risk during the Civil War."

  - question: "Why is Mississippi considered the heart of the Deep South?"
    answer: "Mississippi had the highest proportion of enslaved people of any state — 55 percent of its total population by 1860 — and was the most cotton-dependent state in the antebellum South. It was the second state to secede (January 9, 1861) and its Black Belt and Delta regions were among the most intensively farmed cotton zones in U.S. history."

