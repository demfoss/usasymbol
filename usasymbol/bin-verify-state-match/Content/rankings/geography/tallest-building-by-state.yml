page:
  h1: "Tallest Building By State"
  
  quick_answer:
    - "One World Trade Center in New York City is the tallest building in any U.S. state at 1,776 feet (541 m). The symbolic height commemorates the year of American independence."
    - "Willis Tower in Chicago (1,451 ft), Comcast Technology Center in Philadelphia (1,121 ft), and Salesforce Tower in San Francisco (1,070 ft) round out the top 4 tallest state buildings."
    - "Vermont has the shortest 'tallest building,' Decker Towers in Burlington, which stands just 124 feet tall. Wyoming and South Dakota also have no buildings over 200 feet."

  methodology: "Heights are architectural heights for completed habitable buildings as of 2025. Towers and antennas are excluded."
  
