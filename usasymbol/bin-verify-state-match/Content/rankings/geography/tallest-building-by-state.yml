sections:
  - id: "supertall-states"
    icon: "fa-solid fa-building"
    title: "States With Supertall Buildings (1,000+ Feet)"
    paragraphs:
      - "Only four states have buildings exceeding 1,000 feet, the 'supertall' threshold defined by the Council on Tall Buildings and Urban Habitat. New York's One World Trade Center leads at 1,776 feet, a height chosen to symbolize the year of American independence. Built on the World Trade Center site, it opened in 2014 as the Western Hemisphere's tallest building."
      - "Chicago's Willis Tower (formerly Sears Tower) held the title of America's tallest building from 1974 to 2014. At 1,451 feet with 110 floors, it remains the tallest building in the Midwest and second-tallest in the U.S. Philadelphia's Comcast Technology Center (1,121 ft, 2018) and Atlanta's Bank of America Plaza (1,023 ft, 1992) complete the supertall club."
      - "California and Texas also clear 1,000 feet, Salesforce Tower in San Francisco at 1,070 ft and JPMorgan Chase Tower in Houston at 1,002 ft, but neither skyline is defined by a single dominant tower the way New York or Chicago is. San Francisco limits height across most neighborhoods. Houston, which has no zoning ordinances at all, produced its tower through market forces rather than civic ambition."

  - id: "surprising-tall-buildings"
    icon: "fa-solid fa-star"
    title: "Surprisingly Tall Buildings in Unexpected States"
    paragraphs:
      - "Alabama's RSA Battle House Tower in Mobile (745 ft) surprises many, it's taller than any building in 30 other states. Built in 2007 as a mixed-use development, it brought a major skyscraper to a city of just 190,000 people. The Retirement Systems of Alabama funded the project to stimulate downtown development."
      - "Oklahoma's Devon Energy Center (844 ft) in Oklahoma City is taller than buildings in much larger cities like Phoenix, Denver, and Portland. Completed in 2012 for oil company Devon Energy, it transformed OKC's skyline and remains the tallest building between Chicago and Houston. The building features innovative glass curtain walls and a sky lobby."
      - "Nebraska's First National Bank Tower (634 ft) in Omaha exceeds expectations for a state with 2 million people. Iowa's 801 Grand (630 ft) in Des Moines is similarly impressive. These Midwestern cities punched above their weight during the 1980s-2000s office tower boom, creating skylines that rival much larger metros."

  - id: "shortest-tallest"
    icon: "fa-solid fa-arrow-down"
    title: "States With the Shortest 'Tallest Buildings'"
    paragraphs:
      - "Vermont has the shortest 'tallest building' of any state, Decker Towers in Burlington, which stands just 124 feet (11 stories). Vermont's lack of major cities, combined with aesthetic preferences for low-rise development and historic preservation, means no building has challenged this modest height. Burlington, the state's largest city, has only 45,000 residents."
      - "Wyoming (145 ft), South Dakota (174 ft), Montana (200 ft), and Maine (206 ft) round out the shortest tallest buildings. These states share characteristics: small populations, no major metro areas, and economies based on agriculture, energy, or tourism rather than corporate headquarters. Ironically, Wyoming and Montana have some of the highest natural terrain in the nation, and the [highest point in each state](/rankings/geography/highest-point-by-state) elevation rankings show the natural counterpart to this list."
      - "North Dakota's tallest structure is actually its State Capitol building (241 ft), a 1930s Art Deco tower nicknamed 'The Skyscraper of the Prairie.' When the original capitol burned in 1930, legislators chose a modern skyscraper design, unusual for state capitols. New Hampshire's tallest is a converted mill building from 1914."

  - id: "skyscraper-eras"
    icon: "fa-solid fa-clock-rotate-left"
    title: "When State Skyscrapers Were Built"
    paragraphs:
      - "State skyscraper construction reflects economic cycles. The 1970s–early 1980s produced many of today's record-holders, including Willis Tower, the GM Renaissance Center, and the IDS Center, built when oil money and corporate expansion peaked, and Chicago, Houston, and Detroit were investing in permanent symbols of that confidence."
      - "The 1990s-2000s saw a second wave focused on banking and technology: Bank of America Plaza (1992), Key Tower (1991), Bank of America Corporate Center (1992). Cities like Atlanta and Charlotte became major banking hubs, funding skyline-defining towers. Goldman Sachs Tower (2004) put Jersey City on the map."
      - "The 2010s brought a third wave: One World Trade Center (2014), Comcast Technology Center (2018), Salesforce Tower (2018), Devon Energy Center (2012). This era featured more mixed-use developments and tech company headquarters rather than pure office towers. The trend continues with residential supertalls in cities like Miami."

  - id: "regional-patterns"
    icon: "fa-solid fa-map"
    title: "Regional Skyscraper Patterns"
    paragraphs:
      - "The Northeast corridor dominates: New York (1,776 ft), Pennsylvania (1,121 ft), New Jersey (781 ft), and Massachusetts (790 ft) all rank in the top 15. Financial services, insurance, and corporate headquarters drove these towers. Connecticut's tallest (535 ft) is in Hartford, reflecting the insurance industry's historic importance."
      - "The Midwest shows surprising strength: Illinois (1,451 ft), Ohio (947 ft), Indiana (811 ft), Minnesota (792 ft), Michigan (727 ft), and Wisconsin (601 ft) all have buildings over 600 feet. Chicago's influence radiates regionally, and Midwestern cities invested heavily in downtown office towers during the 1970s-90s."
      - "The Sun Belt splits. Georgia, Texas, and Florida built genuine skyline towers, while Arizona, Nevada, and New Mexico barely cleared 500 feet. Phoenix's tallest building dates to 1972, and by the time the city's explosive growth arrived, it went outward, not up. Las Vegas has 67-floor buildings, but they're hotel towers: Nevada's skyline exists to house tourists, not corporations."

faq:
  - question: "What is the tallest building in the United States?"
    answer: "One World Trade Center in New York City is the tallest building in the United States at 1,776 feet (541 meters). The symbolic height represents the year of American independence. It opened in 2014 on the World Trade Center site and has 104 floors."
  
  - question: "Which state has the tallest building?"
    answer: "New York has the tallest building of any U.S. state — One World Trade Center at 1,776 feet. Illinois ranks second with Willis Tower (1,451 ft), Pennsylvania third with Comcast Technology Center (1,121 ft), and Georgia fourth with Bank of America Plaza (1,023 ft)."
  
  - question: "How many states have buildings over 1,000 feet?"
    answer: "Six states have buildings over 1,000 feet: New York (1,776 ft), Illinois (1,451 ft), Pennsylvania (1,121 ft), California (1,070 ft), Georgia (1,023 ft), and Texas (1,002 ft)."
  
  - question: "What state has the shortest tallest building?"
    answer: "Vermont has the shortest 'tallest building' of any state — Decker Towers in Burlington at just 124 feet (11 stories). Wyoming (145 ft), South Dakota (174 ft), and Montana (200 ft) also have very short tallest buildings due to their small populations and lack of major cities."
  
  - question: "What is the tallest building in Texas?"
    answer: "JPMorgan Chase Tower in Houston is the tallest building in Texas at 1,002 feet (305 meters) with 75 floors. Built in 1982, it's the tallest building in the South and Southwest regions. Dallas's tallest, Bank of America Plaza, is 921 feet."
  
  - question: "What is the tallest building in California?"
    answer: "Salesforce Tower in San Francisco is the tallest building in California at 1,070 feet (326 meters). Completed in 2018, it has 61 floors and houses Salesforce's headquarters. The Wilshire Grand Center in Los Angeles is second at 1,018 feet."

