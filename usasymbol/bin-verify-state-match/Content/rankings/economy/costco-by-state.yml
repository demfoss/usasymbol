  quick_answer:
    - "California has the most Costco stores of any state at 136, more than Texas and Florida combined."
    - "Texas ranks second with 46 Costco stores, and Florida is third with 35. Washington is fourth at 33, home to Costco's own headquarters in Issaquah."
    - "Rhode Island, West Virginia, and Wyoming are the only states with no Costco stores. Costco operates 649 warehouses across the United States overall."

  methodology: "Store counts are Costco's state-by-state warehouse listing, current as of 2026, covering the 50 states only. Costco's own national summary lists 649 warehouses total and 147 in California, a different snapshot than this state-by-state breakdown."

