page:
  h1: "Firefighter Salary by State"

  quick_answer:
    - "New York has the highest average firefighter salary in the country at $56,837 a year, equal to $27.33 an hour."
    - "North Carolina has the lowest average firefighter salary at $34,464 a year, $22,373 less than New York and $9,539 below the roughly $44,003 national average."
    - "New Hampshire ($52,917) and Arizona ($49,573) are the next-highest-paying states. Louisiana ($37,298) and Texas ($38,396) are among the lowest, alongside North Carolina."

  methodology: "World Population Review's 2026 figures show average annual firefighter salaries and hourly wages by state. The $44,003 U.S. average is calculated from all 50 state values."

