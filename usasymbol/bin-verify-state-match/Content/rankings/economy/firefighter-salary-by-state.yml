faq:
  - question: "Which state pays firefighters the most?"
    answer: "New York pays firefighters the most, $56,837 a year. The next-highest state, New Hampshire, pays $52,917, more than $3,900 lower."

  - question: "Which state pays firefighters the least?"
    answer: "North Carolina pays firefighters the least, an average of $34,464 a year, or $16.57 an hour."

  - question: "What is the average firefighter salary in the US?"
    answer: "The average across the 50 states in the table is about $44,003 a year."

  - question: "Does firefighter salary include paramedic or wildland pay?"
    answer: "Annual Salary and Hourly Wage are averages across each of the 50 states and do not separate paramedic-certified or wildland firefighter pay."

  - question: "How much do firefighters make per hour?"
    answer: "Hourly pay ranges from $16.57 in North Carolina to $27.33 in New York, the same two states that rank lowest and highest on annual salary."

  - question: "How much do firefighters make in California?"
    answer: "California's average firefighter salary is $42,639 a year, or $20.50 an hour, $1,364 below the $44,003 national average."

