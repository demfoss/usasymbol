faq:
  - question: "Which state has the most expensive housing?"
    answer: "Hawaii has the highest median home value in the U.S. at over $800,000. The combination of limited buildable land on the islands, high construction costs due to imported materials, and strong demand from both residents and investors keeps prices at the top of every national ranking."
  - question: "Which state has the cheapest housing?"
    answer: "West Virginia has the lowest median home value of any U.S. state at around $125,000. The state has a rural economy with limited high-wage employment, which suppresses housing demand and keeps prices well below the national average."
  - question: "How does median home value compare to median home price?"
    answer: "The Census Bureau's median home value is self-reported by homeowners and reflects estimated market value of owner-occupied units. Median home price (from Redfin, Zillow, or NAR) reflects actual sales transaction prices and may differ due to sampling differences and market timing. Both measures show similar trends across states."
  - question: "Which states have the best home value relative to income?"
    answer: "States where home values are low relative to median household income offer the best affordability. Mississippi, West Virginia, and Oklahoma typically score well on home-value-to-income ratios. California, Hawaii, and Massachusetts have the worst ratios — buyers in those states need 10x or more their annual income to purchase a median-priced home."

