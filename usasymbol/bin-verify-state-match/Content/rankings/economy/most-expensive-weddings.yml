sections:
  - id: "states-with-the-highest-average-wedding-costs"
    icon: "fa-solid fa-ring"
    title: "States With the Highest Average Wedding Costs"
    paragraphs:
      - "Massachusetts had the highest average wedding cost in 2020 at $30,489, just ahead of New Jersey at $30,357. Connecticut followed at $29,499, and New York was fourth at $27,533."
      - "Maryland and New Hampshire rounded out the top six at $27,498 and $27,074. Every state in the top nine that year averaged at least $25,000, more than double the cost in the bottom ten states."

  - id: "states-with-the-lowest-average-wedding-costs"
    icon: "fa-solid fa-arrow-trend-down"
    title: "States With the Lowest Average Wedding Costs"
    paragraphs:
      - "Arkansas had the lowest average wedding cost in 2020 at $12,426, just below West Virginia at $12,498. These were the only two states under $13,000 that year."
      - "Mississippi followed at $13,399, and Kentucky was next at $13,537. Oklahoma rounded out the bottom five at $13,881."

  - id: "how-wedding-costs-have-shifted-since-2020"
    icon: "fa-solid fa-chart-line"
    title: "How Wedding Costs Have Shifted Since 2020"
    paragraphs:
      - "More recent survey data for a subset of states shows sharp increases in several of the priciest 2020 states. New Jersey has climbed to roughly $54,400, up about 79% from its 2020 average. Rhode Island shows an even larger jump, from $25,458 to about $49,180, up about 93%."
      - "Not every state moved the same direction. Alaska's more recent figure of about $16,150 is down roughly 33% from its 2020 average of $24,037, and Wyoming and Utah both show smaller declines rather than the increases seen in most other states."

