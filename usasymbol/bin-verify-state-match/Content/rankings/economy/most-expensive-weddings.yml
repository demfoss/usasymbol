faq:
  - question: "Which state has the most expensive average wedding?"
    answer: "Massachusetts had the highest average wedding cost in the most recent complete 50-state dataset at $30,489, just ahead of New Jersey at $30,357. More recent partial survey data suggests New Jersey may have since overtaken it, at roughly $54,400."

  - question: "Which state has the cheapest average wedding?"
    answer: "Arkansas had the lowest average wedding cost at $12,426, with West Virginia close behind at $12,498. These were the only two states under $13,000."

  - question: "What is the average wedding cost in the United States?"
    answer: "The national average in 2020 was $20,300, a decrease from the year before due to pandemic-era restrictions on guest counts and venues."

  - question: "How much has the average wedding cost risen since 2020?"
    answer: "In states with more recent data available, New Jersey has risen from $30,357 to roughly $54,400, up about 79%. Rhode Island has risen from $25,458 to about $49,180, up about 93%."

  - question: "Has any state's wedding cost gone down since 2020?"
    answer: "Alaska's more recent figure of about $16,150 is down roughly 33% from its 2020 average of $24,037. Utah and Wyoming also show smaller declines rather than increases."

  - question: "What is the average wedding cost in California and Texas?"
    answer: "California averaged $26,049 in 2020, ranking 7th, and more recent data puts it near $39,170. Texas averaged $19,324 in 2020, ranking 22nd, with more recent data near $30,000."

