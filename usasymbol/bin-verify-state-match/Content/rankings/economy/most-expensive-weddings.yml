page:
  h1: "Average Wedding Cost by State"

  quick_answer:
    - "Massachusetts had the highest average wedding cost in the most recent complete 50-state dataset at $30,489, narrowly ahead of New Jersey at $30,357."
    - "West Virginia had the lowest average cost at $12,498, with Arkansas close behind at $12,426, the only two states under $13,000."
    - "More recent survey data for a subset of states shows sharp movement since then. New Jersey is now estimated near $54,400, up about 79%, while Alaska has fallen to roughly $16,150, down about 33%."

  methodology: "State-level averages are from The Wedding Report via ValuePenguin for 2020, the most recent year with a complete 50-state breakdown. More recent 2025 comparison figures for a subset of states come from Zola data reported by Joy, and the District of Columbia is excluded throughout."

  sources:
