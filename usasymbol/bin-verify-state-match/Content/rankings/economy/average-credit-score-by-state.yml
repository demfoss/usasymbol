page:
  h1: "Average Credit Score by State"

  quick_answer:
    - "Minnesota has the highest average credit score of any state at 741 in 2025."
    - "Mississippi has the lowest average score at 677, a 64-point gap below Minnesota. Vermont and Wisconsin tie for second at 737, and New Hampshire ranks fourth at 735."
    - "The national average FICO Score fell to 713 in 2025, its first annual decline since 2013. Louisiana dropped 4 points to 686, the largest fall of any state, while Illinois, Maine, and Vermont held steady."

  methodology: "Scores are Experian's FICO Score 8 averages as of year-end 2025, compared against year-end 2024 figures. The District of Columbia is excluded."

