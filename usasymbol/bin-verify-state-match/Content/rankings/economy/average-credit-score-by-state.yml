faq:
  - question: "Which state has the highest credit score?"
    answer: "Minnesota has the highest average credit score at 741. Vermont and Wisconsin tie for second at 737."
  - question: "Which state has the lowest credit score?"
    answer: "Mississippi has the lowest average credit score at 677. Louisiana ranks second-lowest at 686, after the steepest year-over-year drop of any state, 4 points."
  - question: "What is the average credit score in the US?"
    answer: "The national average FICO Score was 713 at the end of 2025, down 2 points from 715 in 2024. That marked the first annual decline in the national average since 2013."
  - question: "What is the average credit score in Texas?"
    answer: "Texas has an average credit score of 692, tied with Georgia and down 3 points from 695 in 2024."
  - question: "Which states had the biggest credit score drop in 2025?"
    answer: "Louisiana fell 4 points, from 690 to 686, the largest drop of any state. South Dakota, North Dakota, Nebraska, and Wyoming each fell 3 points."
  - question: "Did any state's credit score stay the same in 2025?"
    answer: "Illinois, Maine, and Vermont were the only states with no change from 2024, holding at 720, 731, and 737."

