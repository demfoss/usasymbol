      - "Florida drops to sixth by this measure at 2.94% of home value, behind Arkansas (3.27%) and Nebraska (2.97%), because its $348,000 median home value runs far higher than Louisiana's or Oklahoma's. Hawaii's premium equals just 0.07% of its $814,500 home value, working out to $240 per $100,000 of coverage against Florida's $4,096."

