faq:
  - question: "Which state has the highest home insurance cost?"
    answer: "Florida tops every state for home insurance cost. Its $10,240 average is more than 17 times Hawaii's $601, the cheapest state in the country."
  - question: "Which state has the lowest home insurance cost?"
    answer: "Hawaii has the lowest average premium at $601 a year, or $50 a month, 83% below the national average."
  - question: "What is the average home insurance cost by state?"
    answer: "The national average is $3,548 a year, or $296 a month, for $250,000 in dwelling coverage. Individual state averages range from $601 in Hawaii to $10,240 in Florida."
  - question: "Which state has the highest home insurance rate relative to home value?"
    answer: "Louisiana's premium equals 4.90% of its median home value, the highest ratio of any state. Oklahoma is second at 4.49%, even though both states rank behind Florida in nominal dollar terms."
  - question: "What is the average home insurance cost in Texas?"
    answer: "Texas averages $6,854 a year, or $571 a month, 93% above the national average, ranking fourth highest in the country. That works out to about $2,742 per $100,000 of dwelling coverage."

