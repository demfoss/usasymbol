page:
  h1: "Home Insurance Cost by State"

  quick_answer:
    - "Florida has the highest average home insurance cost at $10,240 a year, or $853 a month, 189% above the national average of $3,548."
    - "Hawaii has the lowest average premium at just $601 a year, 83% below the national average. Delaware ($976) and Vermont ($1,054) also rank among the least expensive."
    - "Louisiana's premium equals 4.90% of its median home value, the highest ratio of any state, even though Florida's $10,240 nominal premium is larger in dollar terms. Hawaii's premium is just 0.07% of its home value, the lowest ratio in the country."

  methodology: "Premiums are MoneyGeek's 2026 rates for $250,000 in dwelling coverage with a $1,000 deductible, for a homeowner with good credit and no recent claims. Percent of home value uses each state's Census median home value."

  sources:
