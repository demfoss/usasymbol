page:
  h1: "Most Popular Coffee Chain by State"

  quick_answer:
    - "Starbucks is the most popular coffee chain in 33 states, more than any other chain."
    - "Dunkin' leads in 14 states plus Washington, D.C., mostly across the Northeast and Mid-Atlantic, but also in Florida, North Carolina, and South Carolina."
    - "Nebraska's most popular chain is Scooter's Coffee, founded in Bellevue, Nebraska, in 1998. Minnesota and North Dakota both favor Caribou Coffee, founded in Minneapolis in 1992."

  methodology: "Chain popularity data is from World Population Review, based on Maptitude/Caliper coffee shop concentration data as of 2021."

