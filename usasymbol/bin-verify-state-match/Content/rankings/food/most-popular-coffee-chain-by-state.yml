faq:
  - question: "Which coffee chain is most popular in the most states?"
    answer: "Starbucks tops the ranking as the most popular chain in 33 of the 50 states."

  - question: "Which states prefer Dunkin' over Starbucks?"
    answer: "Dunkin' leads in Connecticut, Delaware, Florida, Illinois, Maine, Maryland, Massachusetts, New Hampshire, New Jersey, North Carolina, Pennsylvania, Rhode Island, South Carolina, Vermont, and Washington, D.C."

  - question: "What is the most popular coffee chain in Nebraska?"
    answer: "Scooter's Coffee is Nebraska's most popular chain, the only state in the ranking where a chain other than Starbucks, Dunkin', or Caribou leads."

  - question: "What is the most popular coffee chain in Minnesota?"
    answer: "Caribou Coffee is Minnesota's most popular chain. North Dakota is the only other state that favors Caribou over Starbucks or Dunkin'."

  - question: "What is the most popular coffee chain in Texas?"
    answer: "Starbucks is the most popular coffee chain in Texas."

  - question: "Does Dunkin' win any states outside the Northeast?"
    answer: "Yes. Dunkin' leads in Florida, Illinois, North Carolina, and South Carolina, in addition to its Northeast and Mid-Atlantic cluster."

