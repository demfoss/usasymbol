sections:
  - id: "states-where-dunkin-is-most-popular"
    icon: "fa-solid fa-mug-hot"
    title: "States Where Dunkin' Is Most Popular"
    paragraphs:
      - "Dunkin' leads in 14 states plus Washington, D.C., with its deepest cluster running from Maine down through Delaware, including Connecticut, Massachusetts, and Rhode Island."
      - "Dunkin' also leads outside the Northeast, including Florida, Illinois, and North Carolina."

  - id: "regional-chains-lead-in-nebraska-minnesota-and-north-dakota"
    icon: "fa-solid fa-map-pin"
    title: "States Where a Local Coffee Chain Leads"
    paragraphs:
      - "Nebraska is the only state where Scooter's Coffee is most popular. The chain was founded in Bellevue, Nebraska, in 1998."
      - "Minnesota and North Dakota both favor Caribou Coffee over Starbucks or Dunkin'. Caribou Coffee was founded in Minneapolis, Minnesota, in 1992."

