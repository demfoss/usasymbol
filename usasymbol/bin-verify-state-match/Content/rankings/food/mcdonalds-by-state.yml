faq:
  - question: "Which state has the most McDonald's locations?"
    answer: "Texas has the most McDonald's restaurants of any state, with 1,269 locations, about 9% of the US total. California is close behind at 1,234, also about 9%."

  - question: "Which state has the fewest McDonald's locations?"
    answer: "North Dakota has the fewest McDonald's locations of any state, with 24. Vermont has 26, and Wyoming has 28."

  - question: "How many McDonald's restaurants are there in the United States?"
    answer: "There are 13,865 McDonald's restaurants across the United States and its territories, as of June 29, 2026. They operate in 5,041 cities."

  - question: "Which US city has the most McDonald's restaurants?"
    answer: "Houston, Texas has the most McDonald's locations of any US city, at 129. Chicago, Illinois is second with 101."

  - question: "Are there any US states or territories with no McDonald's restaurants?"
    answer: "American Samoa and the U.S. Virgin Islands are the only US territories with no McDonald's restaurant. Every one of the 50 states has at least one location."

  - question: "Which state has the most McDonald's per capita?"
    answer: "Among the ten states with the most McDonald's locations, Ohio has the densest presence, with one restaurant per 18,910 residents, ahead of Michigan's one per 19,060 and Illinois's one per 19,800."

