seo:
  title: "McDonald's by State 2026 | Map & Location Counts"
  description: "Texas has the most McDonald's locations at 1,269, narrowly ahead of California's 1,234. North Dakota has the fewest of any state, with 24."

page:
  h1: "McDonald's Locations by State"

  quick_answer:
    - "Texas has the most McDonald's restaurants of any state at 1,269, about 9% of the US total, narrowly ahead of California's 1,234 locations, also about 9%."
    - "Florida ranks third with 906 locations, and Illinois is fourth at 640. Ohio has the densest McDonald's presence among the top 10 states, with one restaurant per 18,910 residents, versus one per 33,890 in New York."
    - "North Dakota has the fewest McDonald's locations of any state at 24, while Vermont has 26 and Wyoming has 28. American Samoa and the U.S. Virgin Islands are the only US territories with no McDonald's restaurant at all."

  methodology: "Top 10 state counts are current as of June 29, 2026, and the other 40 states are from a 2021 count published by 247wallst.com. This table's 50-state total is 13,737, versus a national total of 13,865 across all states and territories."

  sources:
    - name: "247wallst.com — States With the Most McDonald's Restaurants"
      url: "https://247wallst.com/special-report/2021/11/25/states-with-the-most-mcdonalds-restaurants/"
      description: "State-by-state McDonald's outlet estimates and 2019 Census population figures, published 2021"
    - name: "McDonald's USA Location Count"
      description: "National and top-10 state McDonald's location totals, city distribution, and average customer rating, current as of June 29, 2026"

