sections:
  - id: "most-teen-screen-time-by-state"
    icon: "fa-solid fa-mobile-screen"
    title: "States With the Most Teen Screen Time"
    paragraphs:
      - "Mississippi teens average 6 hours 11 minutes of daily screen time, the highest total among the 19 states in this dataset. Arkansas follows at 5 hours 54 minutes, 18 minutes behind Mississippi. Alabama (5h 53m) and Louisiana (5h 52m) trail Arkansas by a minute apiece."
      - "Florida ranks fifth at 5 hours 43 minutes, ahead of Nevada (5h 41m), Washington (5h 40m), and Missouri (5h 39m). Maryland and Georgia close out the top ten at 5 hours 36 minutes and 5 hours 33 minutes. Every state in the top ten logs more than 5 hours 30 minutes daily."

  - id: "least-teen-screen-time-by-state"
    icon: "fa-solid fa-hourglass-half"
    title: "States With the Least Teen Screen Time"
    paragraphs:
      - "Alaska posts the lowest figure in the dataset at 4 hours 14 minutes daily, nearly two hours below Mississippi's total. Vermont and Hawaii come next, both at 4 hours 38 minutes, separated by just 18 seconds before rounding. Wyoming follows at 4 hours 41 minutes."
      - "South Dakota and Montana both land at 4 hours 58 minutes, a 22-second gap that disappears once rounded to the minute. Utah sits just below them at 4 hours 51 minutes, and North Dakota at 4 hours 47 minutes. Rhode Island, at 4 hours 56 minutes, is the only Northeastern state among the nine lowest totals."

