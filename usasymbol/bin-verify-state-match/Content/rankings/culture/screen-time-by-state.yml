faq:
  - question: "Which state has the most teen screen time?"
    answer: "Mississippi teens average the most screen time of any state, 6 hours 11 minutes daily. Arkansas ranks second at 5 hours 54 minutes."

  - question: "Which state has the least teen screen time?"
    answer: "Alaska teens average the least screen time in the dataset, 4 hours 14 minutes daily. That is nearly two hours below Mississippi's total."

  - question: "What is the average teen screen time in Mississippi?"
    answer: "Teens in Mississippi average 6 hours 11 minutes of screen time per day, the highest figure among the 19 states covered in this study."

  - question: "How much daily screen time do teens in Alaska have?"
    answer: "Alaska teens average 4 hours 14 minutes of screen time daily, the lowest total in the dataset."

  - question: "Do Vermont and Hawaii have the same amount of teen screen time?"
    answer: "Nearly. Vermont teens average 4 hours 37 minutes and 30 seconds daily, and Hawaii teens average 4 hours 37 minutes and 48 seconds, a difference of just 18 seconds."

  - question: "Which southern states have the highest teen screen time?"
    answer: "Mississippi (6h 12m), Arkansas (5h 54m), Alabama (5h 53m), and Louisiana (5h 52m) hold four of the top four spots in the ranking, and all four are in the South."

