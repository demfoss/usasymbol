faq:
  - question: "What are the most popular baby names by state?"
    answer: "Liam is the most popular boy name by state, leading in 23 states. Charlotte is the most popular girl name by state, leading in 18 states."

  - question: "Which boy name is the most popular in the most states?"
    answer: "Liam. It leads outright in 23 states, five more than second-place Oliver's 18 states."

  - question: "Which girl name is the most popular in the most states?"
    answer: "Charlotte. It leads in 18 states, just one ahead of Olivia's 17-state total, the closest margin between any two top names in the dataset."

  - question: "What is the most popular baby name in California?"
    answer: "Mia is California's most popular girl name, with Olivia in second. Liam is the most popular boy name, with Noah as runner-up."

  - question: "What is the most popular baby name in Texas?"
    answer: "Olivia leads the girl name list in Texas, with Emma as runner-up. Liam tops the boy name list, with Noah in second."

  - question: "What are the most popular baby names in Wyoming?"
    answer: "Emma is Wyoming's most popular girl name, followed by Harper. Oliver leads the boy names, with Hudson second."

