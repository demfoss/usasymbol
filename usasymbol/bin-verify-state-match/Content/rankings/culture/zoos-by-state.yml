faq:
- question: How many AZA-accredited zoos are in each state?
  answer: The count ranges from 25 in California down to zero in four states. Florida is second at 24, and Texas holds third with 17.
- question: Which state has the most AZA-accredited zoos?
  answer: California has the most, with 25 accredited zoos and aquariums, including the San Diego Zoo and the Los Angeles Zoo. Florida trails by just one facility, at 24.
- question: Which states have no AZA-accredited zoo?
  answer: Maine, New Hampshire, Vermont, and Wyoming have zero AZA-accredited zoos or aquariums. Three of the four sit together in New England.
- question: What is an AZA-accredited zoo in New York?
  answer: The Bronx Zoo is New York's flagship, the largest metropolitan zoo in the United States. New York has 12 AZA-accredited zoos and aquariums in total, the fourth highest count of any state.
- question: Which AZA-accredited zoos are in Texas?
  answer: The Houston Zoo is the flagship of Texas's 17 AZA-accredited facilities, the third highest count in the country. Fort Worth Zoo and the Dallas Zoo are also AZA-accredited in the state.
- question: What is the largest zoo in North Carolina?
  answer: The North Carolina Zoo in Asheboro is the largest natural habitat zoo in the country by land area. It is one of 9 AZA-accredited facilities in North Carolina, the fifth highest state total.
