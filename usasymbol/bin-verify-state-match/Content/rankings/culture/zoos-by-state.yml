      state_slug: wyoming
      region: Mountain West
      notes: Also the only state with no zoo of any kind
  paragraphs:
  - Maine, New Hampshire, and Vermont are three neighboring New England states with zero AZA-accredited zoos. Wyoming is the only Mountain West state in the group.
  - Wyoming's count remains zero because the state has seen no sustained effort to establish a zoo, not because zoos are prohibited. Wyoming officials may approve exotic animals for exhibition case by case, while private ownership of tigers and other big cats remains barred.
