page:
  h1: AZA-Accredited Zoos by State
  quick_answer:
  - California has 25 AZA-accredited zoos and aquariums, more than any other state, led by the San Diego Zoo.
  - Florida has 24 accredited facilities, one fewer than California, while Texas ranks third at 17. Maine, New Hampshire, Vermont, and Wyoming each have zero AZA-accredited zoos.
  - New York has 12 accredited zoos and aquariums, and North Carolina has 9. Illinois, Kansas, Missouri, Ohio, and Tennessee each have 7.
  methodology: Counts reflect zoos, aquariums, and related facilities accredited by the Association of Zoos and Aquariums (AZA) as of March 2026. Unaccredited zoos, sanctuaries, and roadside animal parks are not counted.
