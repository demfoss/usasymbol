state_slug: illinois
traditional_abbreviation: Ill.
formation_summary: Illinois uses the USPS abbreviation IL.
formation_detail: USPS has used IL for Illinois since 1963. The older form Ill. still appears
  in older publications, but IL is the standard postal abbreviation today.
search_intent_summary: IL is the form used for Illinois in mailing addresses, shipping labels,
  official forms, and database records.
similar_codes_summary: IL is often checked against ID, IN, and IA because the I-state codes
  are easy to mix up in forms and alphabetical lists.
