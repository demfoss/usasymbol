formation_summary: Arizona's USPS abbreviation is AZ.
formation_detail: USPS has used AZ for Arizona since 1963. Ariz. still shows up in older
  print sources, but AZ is the modern postal form.
search_intent_summary: AZ is the form used for Arizona in mailing addresses, shipping labels,
  government paperwork, and databases.
similar_codes_summary: AZ is often double-checked alongside AL, AK, and AR because the A-state
  abbreviations differ by only one letter.
