formation_summary: North Carolina's USPS abbreviation is NC.
formation_detail: NC has been North Carolina's standard postal abbreviation since 1963. The
  older form N.C. still appears in older sources, but NC is the standard postal form now.
search_intent_summary: Use NC for North Carolina in mailing addresses, shipping labels,
  official forms, and database entries.
similar_codes_summary: NC is usually checked against ND and SC because directional state
  abbreviations are easy to mix up at a glance.
