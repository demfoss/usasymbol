state_slug: oklahoma
traditional_abbreviation: Okla.
formation_summary: Oklahoma's USPS abbreviation is OK.
formation_detail: USPS adopted OK for Oklahoma in 1963. The older form Okla. still appears
  in older publications, but OK is the standard postal abbreviation today.
search_intent_summary: Use OK for Oklahoma in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: OK is often checked against OH and OR because the O-state abbreviations
  can look similar in short lists and forms.
