formation_summary: Massachusetts uses the USPS abbreviation MA.
formation_detail: MA became Massachusetts's standard postal abbreviation in 1963. The older
  form Mass. still appears in older publications, but MA is the form used in current addresses
  and forms.
search_intent_summary: Use MA for Massachusetts in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: MA is sometimes checked against ME and MD when several M-state abbreviations
  appear together.
