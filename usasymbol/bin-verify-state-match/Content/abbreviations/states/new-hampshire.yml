state_slug: new-hampshire
traditional_abbreviation: N.H.
formation_summary: New Hampshire's USPS abbreviation is NH.
formation_detail: NH became New Hampshire's standard postal abbreviation in 1963. The older
  punctuated form N.H. still appears in older writing, but NH is the form used in current
  addresses and forms.
search_intent_summary: Use NH for New Hampshire in mailing addresses, shipping labels, official
  forms, and database records.
similar_codes_summary: NH is often checked against NJ, NM, and NY because several New-state
  abbreviations start the same way and are easy to blur together.
