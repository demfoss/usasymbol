formation_summary: Georgia's USPS abbreviation is GA.
formation_detail: USPS adopted GA for Georgia in 1963. The older form Ga. still shows up
  in older writing, but GA is the standard postal abbreviation today.
search_intent_summary: GA is the form used for Georgia in mailing addresses, shipping labels,
  official forms, and most databases.
similar_codes_summary: GA is usually a simple confirmation rather than a code people frequently
  confuse with another state.
