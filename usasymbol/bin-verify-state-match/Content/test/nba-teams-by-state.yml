  description: "All 30 NBA teams listed by state. California has the most teams (4). Texas has 3. New York and Florida each have 2. View the complete list by arena location."

page:
  h1: "NBA Teams by State: Which States Have Basketball Teams?"
  
  quick_answer:
    - "California has the most NBA teams with 4: Lakers, Clippers, Warriors, and Kings. Texas is second with 3 teams: Mavericks, Rockets, and Spurs."
    - "New York and Florida each have 2 teams. New York has the Knicks (Manhattan) and Nets (Brooklyn). Florida has the Heat (Miami) and Magic (Orlando)."
    - "30 NBA teams play in 21 U.S. states plus Washington D.C. and Toronto, Canada. That means 29 states have no NBA team. The Toronto Raptors are the only NBA team outside the United States."

  intro_paragraphs:
    - "The NBA's 30 teams are spread across 21 U.S. states, Washington D.C., and one Canadian city (Toronto). This list is based on where each team's home arena is actually located. California dominates with 4 teams, while Texas has 3. Most NBA states have just one franchise, and 29 states have no NBA presence at all."
    - "Some markets feature intense local rivalries: the Lakers and Clippers share the same arena in Los Angeles, while the Knicks and Nets compete for New York City fans just miles apart. Below you'll find every team organized by state, including arena names and conference affiliations."

  insights:
    - "California's 4 NBA teams represent the state's massive population (39 million) and geographic spread — from Sacramento to San Diego."
    - "The Lakers and Clippers both play at Crypto.com Arena in Los Angeles, making it the only NBA arena shared by two teams."
    - "Texas has 3 teams spread across the state: Dallas (north), Houston (east), and San Antonio (south) — each about 200+ miles apart."
    - "Seattle lost the SuperSonics to Oklahoma City in 2008 and remains the largest U.S. city without an NBA team (population 750,000)."
    - "The Toronto Raptors (est. 1995) are the only NBA team outside the United States and the only Canadian team since the Vancouver Grizzlies left for Memphis in 2001."

  methodology: "Teams are grouped by home arena location. Data reflects the 2025-26 NBA season."
  
  sources:
