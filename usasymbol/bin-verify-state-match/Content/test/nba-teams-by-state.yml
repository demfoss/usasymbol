sections:
  - id: "california-dominance"
    icon: "fa-solid fa-trophy"
    title: "Why California Has 4 NBA Teams"
    paragraphs:
      - "California's 4 NBA teams reflect its status as America's most populous state (39 million people) and its basketball culture. The Lakers and Clippers share Los Angeles (metro population 13 million), the Warriors represent the San Francisco Bay Area (7.7 million), and the Kings serve Sacramento and Northern California's Central Valley."
      - "The Lakers are California's original team, moving from Minneapolis in 1960. The Warriors came from Philadelphia in 1962 (originally to San Francisco, then Oakland, now back to San Francisco). The Kings arrived from Kansas City in 1985. The Clippers moved from San Diego to Los Angeles in 1984, creating the unique two-team LA market."
      - "The Lakers and Clippers sharing Crypto.com Arena (formerly Staples Center) creates scheduling challenges. The Lakers are the 'home' team with priority booking, while the Clippers have long sought their own arena. The Intuit Dome in Inglewood is scheduled to become the Clippers' exclusive home, ending the shared arrangement."

  - id: "shared-arena"
    icon: "fa-solid fa-building"
    title: "Lakers and Clippers: Sharing an Arena"
    paragraphs:
      - "The Los Angeles Lakers and Clippers both play at Crypto.com Arena in downtown LA — the only shared arena in the NBA. This arrangement began when the arena (then Staples Center) opened in 1999 and has created one of sports' most unusual rivalries: two teams competing for the same city while literally sharing a locker room building."
      - "The Lakers clearly dominate the arrangement. They have first choice of dates, their banners hang from the rafters (Clippers' don't), and they're widely considered 'LA's team' with 17 championships to the Clippers' zero. The Clippers have often been called 'tenants' in their own home arena."
      - "This dynamic is changing. The Clippers' new Intuit Dome in Inglewood (next to SoFi Stadium) will give them their own identity separate from the Lakers. The $2 billion arena features innovative design including a 'halo board' screen and will end 25+ years of arena-sharing when the Clippers fully transition."

  - id: "states-without-nba"
    icon: "fa-solid fa-map"
    title: "29 States Without NBA Teams"
    paragraphs:
      - "More than half of U.S. states — 29 out of 50 — have no NBA team. Major population centers without franchises include Seattle (750,000 city population), San Diego (1.4 million), Las Vegas (650,000), and the entire states of Virginia (8.6 million), New Jersey (9.3 million), and Alabama (5 million)."
      - "Seattle's situation is particularly notable. The city had the SuperSonics from 1967 to 2008, winning a championship in 1979. Owner Clay Bennett relocated the team to Oklahoma City after failing to secure a new arena deal. Seattle remains the largest U.S. city to lose a major sports franchise and hasn't received a replacement team despite years of effort."
      - "Expansion candidates frequently mentioned include Seattle, Las Vegas, and Mexico City. The NBA hasn't expanded since 2004 (Charlotte Bobcats, now Hornets) but commissioner Adam Silver has indicated expansion is possible in coming years. Las Vegas, with its new professional sports presence (Raiders, Golden Knights), is considered a leading candidate."

  - id: "knicks-nets-rivalry"
    icon: "fa-solid fa-basketball"
    title: "New York's Two Teams: Knicks vs. Nets"
    paragraphs:
      - "New York has two NBA teams playing in different boroughs: the Knicks at Madison Square Garden in Manhattan and the Nets at Barclays Center in Brooklyn. Unlike the NFL's Jets/Giants situation (both in New Jersey), both NBA teams actually play within New York City limits."
      - "The Knicks are the original New York team, founded in 1946 as a charter NBA member. They've played at Madison Square Garden since 1968 and are consistently among the league's most valuable franchises despite not winning a championship since 1973. MSG's midtown Manhattan location makes it arguably the NBA's most famous arena."
      - "The Nets have a more nomadic history. They started as the New Jersey Americans (ABA) in 1967, became the New York Nets, won two ABA championships, joined the NBA in 1976, moved to New Jersey, then relocated to Brooklyn in 2012. The Brooklyn move aimed to establish a distinct identity separate from the Knicks' Manhattan dominance."

  - id: "texas-three-teams"
    icon: "fa-solid fa-star"
    title: "Texas: Three Teams, Three Cities"
    paragraphs:
      - "Texas has 3 NBA teams spread geographically across the state: the Dallas Mavericks in North Texas, the Houston Rockets in East Texas, and the San Antonio Spurs in South-Central Texas. Each city is 200+ miles from the others, creating distinct markets rather than direct local rivalry."
      - "The Spurs are Texas's most successful franchise with 5 championships (1999, 2003, 2005, 2007, 2014), all during the Tim Duncan era. The Rockets won back-to-back titles in 1994-95 with Hakeem Olajuwon. The Mavericks won their lone championship in 2011 with Dirk Nowitzki, ending a long drought for Dallas sports."
      - "San Antonio (population 1.5 million) is notably smaller than Dallas (7.6 million metro) or Houston (7.1 million metro), yet the Spurs have been the most successful. Their sustained excellence under coach Gregg Popovich (1996-present) proves that smaller markets can compete when organizations are well-run."

  - id: "relocation-history"
    icon: "fa-solid fa-truck-moving"
    title: "NBA Teams That Changed States"
    paragraphs:
      - "The NBA has seen significant franchise movement throughout its history. The most controversial recent relocation was the Seattle SuperSonics to Oklahoma City in 2008. The Sonics had played in Seattle since 1967 and won a championship in 1979, but owner Clay Bennett moved the team after the city refused to fund a new arena."
      - "The Vancouver Grizzlies lasted just 6 seasons (1995-2001) before moving to Memphis, leaving Canada with only the Toronto Raptors. Other notable moves include the New Jersey Nets to Brooklyn (2012), the Kansas City Kings to Sacramento (1985), and the original Charlotte Hornets to New Orleans (2002), which led to Charlotte receiving an expansion team (Bobcats) that later reclaimed the Hornets name."
      - "Historical relocations shaped today's league: the Lakers came from Minneapolis (1960), the Warriors from Philadelphia (1962), the Hawks from St. Louis (1968), the Clippers from San Diego (1984), and the Kings from Kansas City (1985). These moves generally followed population shifts to the Sun Belt and West Coast."

faq:
  - question: "Which state has the most NBA teams?"
    answer: "California has the most NBA teams with 4: Los Angeles Lakers, Los Angeles Clippers, Golden State Warriors, and Sacramento Kings. Texas is second with 3 teams (Mavericks, Rockets, Spurs). No other state has more than 2 NBA teams."
  
  - question: "How many states have NBA teams?"
    answer: "21 U.S. states have NBA teams, plus Washington D.C. and Toronto, Canada. This means 29 states have no NBA franchise. The 30 NBA teams are concentrated in major metropolitan areas, leaving much of the country without professional basketball."
  
  - question: "Do the Lakers and Clippers share an arena?"
    answer: "Yes, the Los Angeles Lakers and Clippers both play at Crypto.com Arena (formerly Staples Center) in downtown Los Angeles. This is the only shared arena in the NBA. However, the Clippers are building their own arena (Intuit Dome) in Inglewood, which will end this arrangement."
  
  - question: "What is the largest city without an NBA team?"
    answer: "Seattle is the largest U.S. city without an NBA team, with a population of about 750,000. Seattle had the SuperSonics from 1967 to 2008 before the team relocated to Oklahoma City. Other large cities without teams include San Diego, Las Vegas, and San Jose."
  
  - question: "What NBA teams are in New York?"
    answer: "New York has 2 NBA teams: the New York Knicks (play at Madison Square Garden in Manhattan) and the Brooklyn Nets (play at Barclays Center in Brooklyn). Both teams are in different boroughs of New York City and both actually play within New York State, unlike the NFL's Jets and Giants who play in New Jersey."
  
  - question: "What NBA teams are in Texas?"
    answer: "Texas has 3 NBA teams: the Dallas Mavericks (American Airlines Center in Dallas), Houston Rockets (Toyota Center in Houston), and San Antonio Spurs (Frost Bank Center in San Antonio). All three teams are in the Western Conference."
  
  - question: "Is there an NBA team in Canada?"
    answer: "Yes, the Toronto Raptors are the only NBA team in Canada. They play at Scotiabank Arena in Toronto, Ontario. The Raptors joined the NBA in 1995 and won their first championship in 2019. Canada previously had the Vancouver Grizzlies (1995-2001) before they moved to Memphis."
  
  - question: "When did Seattle lose the SuperSonics?"
    answer: "Seattle lost the SuperSonics in 2008 when owner Clay Bennett relocated the team to Oklahoma City, where they became the Thunder. The move was controversial because Seattle had supported the Sonics since 1967 and the team had won a championship in 1979. Seattle has been trying to get a new NBA team ever since."

