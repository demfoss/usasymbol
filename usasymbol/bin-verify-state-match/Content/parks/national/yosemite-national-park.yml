faq:
  - question: "Do you need reservations to visit Yosemite?"
    answer: "From late May through early September, vehicles entering Yosemite between 5 a.m. and 4 p.m. require a timed-entry reservation from recreation.gov. Reservations open 21 days in advance and sell out quickly. To avoid needing one, arrive before 5 a.m., after 4 p.m., or use YARTS public transit—no reservation required for bus passengers."
  - question: "What is the best time to visit Yosemite?"
    answer: "Spring (April–June) for waterfalls at full flow and blooming meadows; fall (September–October) for thinner crowds and mild weather. Summer is the busiest period and requires the most advance planning. Winter is quiet but limits access to the high country."
  - question: "How much does it cost to enter Yosemite?"
    answer: "The vehicle pass is $35 and covers 7 days. The America the Beautiful annual pass ($80) covers Yosemite and all other national parks, monuments, and federal recreation areas—worth it for more than two park visits per year."
  - question: "Can you hike Half Dome without a permit?"
    answer: "No. A permit is required to hike beyond the base of the cables on Half Dome. The daily quota is 300 hikers. Apply in the pre-season lottery in March (for May–September trips) or the daily lottery two days before your hike on recreation.gov."
  - question: "Where is Yosemite National Park located?"
    answer: "Yosemite is in the Sierra Nevada mountains of central California, about 165 miles east of San Francisco, 200 miles northeast of Los Angeles, and 90 miles northeast of Fresno. The main Valley is at roughly 4,000 feet elevation; the park's highest point, Mount Lyell, reaches 13,114 feet."

  - question: What state is Yosemite National Park in?
    answer: Yosemite National Park is in [California](/states/california), near Mariposa, California.

