faq:
  - question: "Where is Denali National Park?"
    answer: "Denali is in interior Alaska, roughly 240 miles north of Anchorage and 125 miles south of Fairbanks. The park entrance is near the town of Healy on the Parks Highway (AK-3). The nearest major airport is Ted Stevens Anchorage International (ANC), about 240 miles south. The Alaska Railroad runs to the park entrance from both Anchorage and Fairbanks in summer."
  - question: "When is the best time to visit Denali?"
    answer: "July is the best month for peak wildlife activity, the longest days, and the best mountain views. June offers fewer crowds and 20-hour daylight but some services open gradually through the month. Early September brings brilliant fall tundra color and the annual Road Lottery for private vehicle access. The main visitor season runs late May through mid-September; most facilities close after that."
  - question: "Can you drive to Wonder Lake?"
    answer: "No. Private vehicles are permitted only to mile 15 at Savage River Check Station. Beyond that, the park road is accessible only by NPS bus, bicycle, or on foot. Wonder Lake is at mile 85 — a 5 to 6-hour bus ride from the park entrance. Transit bus tickets to Wonder Lake cost approximately $46 round trip and are purchased through Recreation.gov."
  - question: "How do I see Denali (the mountain)?"
    answer: "The mountain is best viewed from Eielson Visitor Center (mile 66) and Wonder Lake (mile 85), reached by the park bus system. Clear views are not guaranteed — the mountain is hidden in clouds roughly 60 to 70 percent of the time. The best odds for a clear view are early morning in July. If the mountain is clear on your first bus trip, the driver will typically announce it; many visitors plan multiple bus days to maximize their chances."
  - question: "How much does it cost to visit Denali?"
    answer: "Park entrance costs $15 per person for a 7-day pass. Bus tickets are purchased separately: approximately $38 round trip to Eielson Visitor Center (mile 66) and $46 round trip to Wonder Lake (mile 85). Campsite fees range from $16 to $44 per night depending on the site. The America the Beautiful Annual Pass ($80) covers entrance fees at all national parks."
  - question: "Are there trails in Denali?"
    answer: "Maintained trails exist only near the entrance area: the Taiga Loop (1.3 miles), Horseshoe Lake Trail (2.8 miles round trip), Savage River Loop (2 miles), and Mt. Healy Overlook Trail (5.4 miles round trip). Beyond the entrance, the park has no maintained trails — visitors hike cross-country through open tundra and river gravel bars. Day hikes require no permit; overnight backcountry stays require a free permit from the Backcountry Information Center."
  - question: "Is Denali safe to visit?"
    answer: "Yes, with appropriate preparation. Bears are common throughout the park; carry bear spray and know how to use it. Mosquitoes are intense from late May through July; insect head nets are practical, not optional. Weather changes rapidly and can bring snow at any elevation at any time of year. Off-trail hiking requires waterproof boots and a topographic map. The park road is unpaved and buses can be delayed; carry food and water for a full day on any bus trip."

  - question: What state is Denali National Park & Preserve in?
    answer: Denali National Park & Preserve is in [Alaska](/states/alaska), near Healy, Alaska.
