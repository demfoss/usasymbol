intro_text: "Denali National Park & Preserve protects 6,045,153 acres of [Alaska](/states/alaska) wilderness centered on Denali — North America's highest peak at 20,310 feet — established as Mount McKinley National Park in 1917 and renamed in 1980. A single 92-mile road bisects the park; private vehicles are permitted only to mile 15, and most visitors see the interior by park bus."

