sections:
  overview: |
    Denali National Park & Preserve occupies 6,045,153 acres of interior Alaska, roughly 240 miles north of Anchorage, centered on Denali — the highest peak in North America at 20,310 feet. A single unpaved road stretches 92 miles into the park, but private vehicles are permitted only to mile 15 at Savage River; beyond that, the park is accessible only by the NPS bus system, on foot, or by small aircraft. This deliberate access restriction keeps the interior wild: 95 percent of the park is designated wilderness with no maintained trails outside the entrance corridor. The park draws about 601,000 visitors per year, ranking 41st among the 63 national parks, with nearly all visits concentrated in the short open season of late May through mid-September.

  known_for: |
    Denali, the highest peak in North America at 20,310 feet, visible on clear days from as far as 200 miles away and a goal for roughly 1,000 mountaineers who attempt the summit each year via the West Buttress and other routes.
    The park bus system, the primary way to travel the 92-mile road into the wilderness, where grizzly bears, wolves, caribou, and Dall sheep are regularly spotted from the window by passengers scanning the open tundra.
    Wonder Lake at mile 85, a glacially carved lake near the north end of the park road that produces a famous reflection of Denali on calm mornings — one of the most photographed views in Alaska.
    The absence of maintained trails beyond the entrance area, which means visitors exploring the backcountry navigate cross-country through open tundra and taiga with a map, compass, and a free backcountry permit.

  best_things_to_see_items:
    - name: "Denali (the Mountain)"
      description: "At 20,310 feet, Denali is the highest point in North America and the dominant feature of the park. The mountain is visible from many points along the park road, most dramatically from the Eielson Visitor Center at mile 66 and Wonder Lake at mile 85. Clear views are not guaranteed — the mountain creates its own weather and is hidden in clouds more than half the time even in summer. Catching Denali fully revealed is one of the park's most anticipated and unpredictable moments."
      image: "/images/parks/national/denali-national-park-preserve/06-denali-the-mountain.jpg"
      alt: "A huge snowy mountain looming over a landscape of forests and water"
      credit: "NPS Photo / Emily Mesner"
    - name: "Wonder Lake"
      description: "Wonder Lake at mile 85 of the park road is a natural lake in a broad glacially carved valley, roughly 2.5 miles long, offering the closest road-accessible viewpoint to Denali's north face. On calm mornings the mountain reflects perfectly in the still water. The Wonder Lake Campground sits on the shore, putting campers at the reflection point for both sunrise and sunset. The 85-mile bus ride to Wonder Lake takes about 5 to 6 hours one-way."
      image: "/images/parks/national/denali-national-park-preserve/07-wonder-lake.jpg"
      alt: "snowy mountains reflected in a pond"
      credit: "NPS Photo / Nathan Kostegian"
    - name: "The Park Bus System"
      description: "The park bus system is the main way to explore Denali's interior. Transit buses run the length of the park road, stopping anywhere passengers request, and riders can get off to hike cross-country and flag down a later bus to return. Narrated tour buses run as far as Toklat River at mile 53. The green buses are not air-conditioned and the road is unpaved past mile 15, but the wildlife viewing from the windows — grizzlies, wolves, caribou — makes the long ride one of the defining Denali experiences."
      image: "/images/parks/national/denali-national-park-preserve/08-the-park-bus-system.jpg"
      alt: "a man standing next to a green bus"
      credit: "NPS Photo / Emily Mesner"
    - name: "Eielson Visitor Center"
      description: "Eielson Visitor Center at mile 66 sits on an open tundra ridge with one of the broadest views of Denali and the Alaska Range from any road-accessible point in the park. Rangers staff the center in summer; exhibits cover glaciology, tundra ecology, and the mountain. The surrounding tundra is open for cross-country hiking in any direction; caribou are frequently seen on the slopes above the center. The bus ride from the park entrance takes about 3.5 to 4 hours."
      image: "/images/parks/national/denali-national-park-preserve/09-eielson-visitor-center.jpg"
      alt: "a building set into a hillside"
      credit: "NPS Photo / Kent Miller"
    - name: "Polychrome Pass"
      description: "Polychrome Pass at mile 46 is a section of park road that crosses a high open ridge above the Toklat River valley. The road narrows here and traverses exposed, colorful volcanic rock in shades of red, orange, and purple. The views across the tundra to the Alaska Range are among the widest on the park road. Most bus drivers stop here briefly for photographs, and the exposed ridge makes it one of the best spots on the road for spotting Dall sheep on the slopes above."
      image: "/images/parks/national/denali-national-park-preserve/10-polychrome-pass.jpg"
      alt: "a landscape of rivers and shrubs leading up to distant mountains"
      credit: "NPS Photo / Tim Rains"
    - name: "Mt. Healy Overlook"
      description: "The Mt. Healy Overlook Trail is the most significant maintained trail in the park, climbing 1,700 feet from the entrance area to a broad tundra ridge with views of the Alaska Range, the park road, and the forested valley below. The 5.4-mile round-trip hike is the best way to experience the transition from taiga to alpine tundra on foot without needing a bus. The trail is also one of the most reliable spots near the entrance to see Dall sheep on the rocky slopes above the treeline."
      image: "/images/parks/national/denali-national-park-preserve/11-mt-healy-overlook.jpg"
      alt: "three people sitting on a rocky outcropping, looking out over a landscape of forests, mountains and roads"
      credit: "NPS Photo / Emily Mesner"
    - name: "Backcountry Off-Trail Hiking"
      description: "Denali has no maintained backcountry trails. Visitors who want to explore beyond the park road travel cross-country through open tundra, river gravel bars, and taiga. The park is divided into 87 backcountry units, each with a daily camping quota to limit impact. Free overnight permits are issued at the Backcountry Information Center on a walk-in basis, generally 1 day in advance. Getting off the bus at any point and walking into the tundra is the most direct way to experience the park's wilderness scale."
      image: "/images/parks/national/denali-national-park-preserve/12-backcountry-off-trail-hiking.jpg"
      alt: "A man hiking up a hillside in front of a vista of mountains and rivers"
      credit: "NPS Photo / Emily Mesner"

