seo_title: "Pinnacles National Park: Condors, Caves & Hikes"
seo_description: "Visit Pinnacles National Park in California: ancient volcanic spires, California condors, talus caves, and top hiking trails. $30 entry."
intro_text: "Pinnacles National Park in California protects 26,686 acres of volcanic rock spires and talus caves near Soledad, established as a national monument in 1908 and elevated to national park status in 2013. It is one of the best places in North America to observe wild California condors and ranks 59th among the 63 U.S. national parks in annual visitation."

