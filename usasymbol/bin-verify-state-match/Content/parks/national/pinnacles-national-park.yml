sections:
  overview: |
    Pinnacles National Park covers 26,686 acres in the Gabilan Mountains of central California, roughly 80 miles south of San Jose. The park's signature landscape — jagged spires of rhyolite rising from oak woodland and chaparral — is the eroded remnant of an ancient volcano split and displaced by the San Andreas Fault over 23 million years. Two talus caves, Balconies Cave and Bear Gulch Cave, form where boulders wedged in narrow canyon slots create passable tunnels below. The park has two separate entrances, east and west, which are not connected by road through the park interior. At roughly 217,000 annual visitors, it is one of the quietest national parks in California. Timed-entry reservations are required for vehicle entry on spring weekends.

  known_for: |
    Pinnacles is best known as one of the premier California condor viewing sites in the world. Condors, reintroduced to the park beginning in 2003, frequently soar above the High Peaks and roost on the spires; visitors can regularly spot 10 or more individuals in a single morning. The talus caves — dark boulder passages requiring a flashlight — are unique in the national park system and draw hikers year-round. Rock climbers come for hundreds of established routes on rhyolite, a coarse volcanic rock that holds friction well. The annual tarantula migration from September through November, when male tarantulas cross the grasslands searching for mates, draws a specific crowd of wildlife watchers each fall.

  best_things_to_see_items:
    - name: "High Peaks"
      description: "The central ridge of volcanic spires, reachable by a 5.3-mile loop from the east entrance or a longer circuit from the west. The trail passes through narrow rock slots, along exposed catwalks with hand-carved steps, and onto open ridges with views of the Salinas Valley and Monterey Bay on clear days."
      image: "/images/parks/national/pinnacles-national-park/04-highlight-03.jpg"
      alt: "A massive rock spire with California condors flying above the peak."
      credit: "NPS Photo/ Katherine Fielding"
    - name: "Balconies Cave"
      description: "A talus cave on the west side of the park, accessed by the 2.4-mile Balconies Cave Trail from the west entrance. Boulders wedged between canyon walls create a 200-foot dark passage requiring a flashlight. The cave stays 10–15°F cooler than outside and is open year-round, subject to bat maternity closures."
      image: "/images/parks/national/pinnacles-national-park/01-hero-image.jpg"
      alt: "Boulders in the Balconies Cave."
      credit: "National Park Service/Oscar Garcia"
    - name: "Bear Gulch Cave and Reservoir"
      description: "A longer talus cave on the east side, carved by a creek that still flows through its lower section. The upper cave connects to a small reservoir. Partial closures protect Townsend's big-eared bat maternity colonies in spring; the lower section typically stays open. Flashlight required."
      image: "/images/parks/national/pinnacles-national-park/05-bear-gulch-cave-and-reservoir.jpg"
      alt: "Stairs lead down into the depths of a cave as a misty waterfall streams down overhead."
      credit: "Paul Johnson"
    - name: "California Condor Viewing"
      description: "Condors reintroduced to Pinnacles beginning in 2003 now number in the dozens in the surrounding region. The High Peaks and the area near the east entrance visitor center offer the most reliable sightings. Each bird wears a numbered wing tag; rangers and volunteers track individuals daily. Morning is the best viewing window before thermals develop."
      image: "/images/parks/national/pinnacles-national-park/04-highlight-03.jpg"
      alt: "A massive rock spire with California condors flying above the peak."
      credit: "NPS Photo/ Katherine Fielding"
    - name: "Spring Wildflowers"
      description: "The grasslands and chaparral slopes bloom from February through April with goldfields, poppies, owl's clover, and shooting stars. The area around the Bench Trail and the park's lower hillsides can produce dense wildflower displays in wet years. Peak bloom typically falls in March on the east side."
      image: "/images/parks/national/pinnacles-national-park/05-highlight-04.jpg"
      alt: "Rock formations appear behind a grassy hillside covered with oak trees and purple and yellow flowers"
      credit: "NPS Photo"
    - name: "Tarantula Migration (Fall)"
      description: "From late September through November, male tarantulas emerge from burrows and walk the grasslands searching for mates, making Pinnacles one of the most reliable places in California to see tarantulas in the wild. The Bench Trail and areas near the east campground are good viewing spots on warm afternoons."
      image: "/images/parks/national/pinnacles-national-park/03-highlight-02.jpg"
      alt: "A Tarantula walking"
      credit: "National Park Service/Oscar Garcia"

