sections:
  overview: |
    Acadia National Park lies on the coast of Maine, centered on Mount Desert Island with two smaller units — the Schoodic Peninsula on the mainland and the offshore island of Isle au Haut. The park covers 49,052 acres of granite peaks, rocky shoreline, glacially carved lakes, and boreal forest. Cadillac Mountain, at 1,530 feet, is the highest point on the U.S. Atlantic coast. Nearly 4 million people visit each year, making Acadia the fifth most-visited national park in the country. The bulk of trails, campgrounds, and visitor facilities concentrate on Mount Desert Island, minutes from Bar Harbor.

  known_for: |
    Cadillac Mountain — at 1,530 feet, the highest peak on the U.S. Atlantic coast and the first place in the country where sunrise reaches land from October through early March. Fifty-seven miles of broken-stone carriage roads built by John D. Rockefeller Jr. between 1913 and 1940, closed to motor vehicles and open to hikers, cyclists, and horses year-round. A jagged Atlantic shoreline with landmarks including Thunder Hole, Otter Cliff, and the 1858 Bass Harbor Head Lighthouse. Jordan Pond, a glacier-carved lake framed by the twin rounded summits of The Bubbles.

  best_things_to_see_items:
    - name: "Cadillac Mountain"
      description: "At 1,530 feet, Cadillac is the highest peak on the U.S. Atlantic coast. From October through early March it is the first place in the United States where the sunrise reaches land. The summit road is open in warmer months; the South Ridge Trail is a 7-mile round-trip hiking route to the top."
      image: "/images/parks/national/acadia-national-park/05-cadillac-mountain.jpg"
      alt: "Crowd on top of mountain for sunrise"
      credit: "Ashley L. Conti/Friends of Acadia"
    - name: "Thunder Hole"
      description: "Thunder Hole is a narrow ocean inlet cut into the granite shore of Mount Desert Island. Incoming waves compress air trapped in the rock pocket, producing a loud boom and a spray of seawater that can reach 40 feet. The effect is strongest about two hours before high tide with moderate ocean swells."
      image: "/images/parks/national/acadia-national-park/06-thunder-hole.jpg"
      alt: "Large puffy clouds dot a brilliant blue sky as wave crash against the rocky coastline of Acadia."
      credit: "NPS / Kristi Rugg"
    - name: "Jordan Pond"
      description: "Jordan Pond is a clear glacially carved lake in the interior of the park, 276 acres wide and up to 150 feet deep. The view north toward The Bubbles — two symmetrical rounded summits — is one of the most photographed in New England. The Jordan Pond Path loops 3.4 miles around the shore."
      image: "/images/parks/national/acadia-national-park/07-jordan-pond.jpg"
      alt: "A log and rocks reflecting in a pond"
      credit: "Photo by Nathaniel X. Boechat, Friends of Acadia, NPS"
    - name: "Beehive Trail"
      description: "The Beehive is a 1.5-mile loop that scales a near-vertical granite face using iron rungs and narrow ledges bolted into the cliff. The exposed route gains about 520 feet and opens wide views of Sand Beach and the Atlantic. It is not suitable for anyone with a fear of heights."
      image: "/images/parks/national/acadia-national-park/08-beehive-trail.jpg"
      alt: "Two hikers ascend a sheer cliff trail by way of historic iron rung ladders."
      credit: "NPS / Kristi Rugg"
    - name: "Carriage Roads"
      description: "John D. Rockefeller Jr. funded 57 miles of broken-stone carriage roads across Mount Desert Island between 1913 and 1940. The roads are closed to cars and open to hikers, cyclists, and horses year-round. Seventeen hand-built stone bridges carry the network over streams and ravines."
      image: "/images/parks/national/acadia-national-park/09-carriage-roads.jpg"
      alt: "Wooden sign post with place names on a carriage road"
      credit: "Photo by Will Newton, Friends of Acadia, NPS"
    - name: "Bass Harbor Head Lighthouse"
      description: "Built in 1858, Bass Harbor Head Lighthouse stands on a granite ledge at the southern tip of Mount Desert Island. It is one of the most photographed lighthouses on the Maine coast. The grounds are open during daylight hours; the tower is a private residence and not open for tours."
      image: "/images/parks/national/acadia-national-park/10-bass-harbor-head-lighthouse.jpg"
      alt: "Lighthouse by rocky coastline"
      credit: "NPS Photo by Kent Miller"
    - name: "Sand Beach"
      description: "Sand Beach is one of the few sandy beaches on Maine's rocky coast. It sits in a sheltered cove between granite headlands near the start of the Ocean Path. The Atlantic water here rarely rises above 55 °F (13 °C) even in July."
      image: "/images/parks/national/acadia-national-park/11-sand-beach.jpg"
      alt: "People relax and swim on a sandy beach"
      credit: "Ashley L. Conti/Friends of Acadia"

