faq:
  - question: "Where is Acadia National Park?"
    answer: "Acadia is on the coast of Maine, centered on Mount Desert Island. The nearest town is Bar Harbor, about 48 miles southeast of Bangor International Airport (BGR)."
  - question: "When is the best time to visit Acadia?"
    answer: "September and October offer the best balance of weather, fall foliage, and lighter crowds. Summer (June–August) has all facilities open and is warmest, but parking and timed reservations fill fast. Spring is quieter but some services do not open until mid-May."
  - question: "How much does it cost to enter Acadia?"
    answer: "The entrance fee is $6 per vehicle for a 7-day pass. The America the Beautiful Annual Pass ($80) covers Acadia and all other U.S. national parks for one year. Confirm current fees at nps.gov/acad before your visit, as prices change."
  - question: "Do I need a reservation to visit Acadia?"
    answer: "In summer, timed-entry vehicle reservations are required for the Cadillac Mountain Summit Road and some other high-demand areas. Campground reservations for all three NPS campgrounds are made through Recreation.gov and fill quickly. The free Island Explorer shuttle requires no reservation."
  - question: "What are the best hikes in Acadia?"
    answer: "Ocean Path (4.4 miles, easy) and Jordan Pond Path (3.4-mile loop, easy) suit most visitors. Gorham Mountain (1.8 miles, moderate) is a solid first summit. Beehive Trail (1.5-mile loop, iron rungs) is the most iconic challenge. Precipice Trail closes in spring for peregrine falcon nesting — check NPS alerts first."
  - question: "Can I see the first sunrise in the U.S. from Cadillac Mountain?"
    answer: "Yes — from early October through early March, Cadillac Mountain (1,530 ft) is the first place in the continental United States where sunrise reaches land. Outside that window the sunrise honor shifts to other coastal locations. The summit is reachable by road or by the South Ridge Trail (7 miles round trip)."
  - question: "How do I get to Acadia without a car?"
    answer: "Concord Coach Lines runs seasonal bus service from Boston and Portland to Bar Harbor. The free Island Explorer shuttle connects Bar Harbor, trailheads, campgrounds, and Sand Beach throughout summer and fall — a practical way to avoid parking problems on busy days."

  - question: What state is Acadia National Park in?
    answer: Acadia National Park is in [Maine](/states/maine), near Bar Harbor, Maine.
