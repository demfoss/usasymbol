sections:
  overview: |
    Haleakalā National Park covers 33,265 acres of Maui, Hawaii, split between two districts that share an entrance fee but no connecting road. The Summit District climbs to 10,023 feet at Pu'u 'Ula'ula, where the volcanic wilderness depression stretches 7.5 miles long, 2.5 miles wide, and 3,000 feet deep. The Kipahulu District, about 60 miles away by road along the island's southern coast, protects a bamboo-forested valley, a chain of freshwater pools called 'Ohe'o Gulch, and 400-foot Waimoku Falls. Together the two districts hold more endangered species per square mile than almost anywhere in the United States. The park draws about 955,000 visitors a year, ranking 33rd of 63 national parks.

  known_for: |
    **Sunrise above the clouds**: watching the sun rise from 10,023 feet over a sea of clouds is the park's most requested experience; a timed entry reservation through Recreation.gov is required to enter the Summit District between 3 a.m. and 7 a.m. **'Ahinahina silversword**: a rosette plant found only on Haleakalā that takes 3 to 50 years to produce a single flower stalk, blooms once, and then dies; several thousand grow within the crater wilderness. **Pipiwai Trail**: a 4-mile round-trip route through a towering bamboo forest to 400-foot Waimoku Falls in the Kipahulu District. **Nēnē**: the Hawaiian state bird, a goose descended from Canada geese that arrived on the islands thousands of years ago, reduced to fewer than 30 individuals in the 1950s and now recovering to several thousand statewide with the park as a key refuge.

  best_time_to_visit: |
    **Spring (March-May)** One of the better windows for clear summit mornings. Temperatures at the summit average 40 to 55 degrees Fahrenheit at sunrise and can reach 65 degrees by midday. The Kipahulu coast is warm and humid at 75 to 85 degrees year-round. Spring trades bring some cloud cover, but afternoons often clear. Crowds are moderate compared to summer.

    **Summer (June-August)** The busiest season. Sunrise reservations sell out 60 days in advance; book immediately when the window opens. Summit temperatures at dawn run 35 to 50 degrees. Trade winds keep the summit cool and sometimes push clouds below the crater rim, producing the famous cloud-sea effect. Kipahulu sees more rain in summer afternoons.

    **Fall (September-October)** Crowds ease slightly from summer peaks while conditions remain similar. Sunrise reservations are slightly easier to obtain but still fill weeks ahead. The Kipahulu pools are most accessible when rainfall is lower, making September a good time to visit that district.

    **Winter (November-February)** The most variable season. Summit temperatures at dawn can drop to the low 30s with occasional frost and snow on the upper slopes. The summit road closes temporarily during severe weather. Sunrise reservations are easier to get. Kipahulu stays warm and wet; the pools are frequently closed due to flash flood risk after heavy rain.

  hiking: |
    **Easy** Hosmer Grove Loop is a 0.7-mile loop near the park entrance at 6,800 feet, passing through a mix of introduced conifers and native Hawaiian plants including 'ōhi'a lehua. Early mornings bring native honeycreepers including 'apapane. Kuloa Point Loop in the Kipahulu District covers 0.5 miles along the coast with views of the 'Ohe'o pools and the ocean; it is paved and accessible to most visitors.

    **Moderate** Pipiwai Trail in the Kipahulu District climbs 4 miles round trip with about 800 feet of gain, passing banyan trees, two small waterfalls, and a half-mile stretch through a dense bamboo forest before reaching 400-foot Waimoku Falls. Do not enter the streambed or pools; flash floods can arrive without warning.

    **Strenuous** Halemau'u Trail descends 1,400 feet over about 4 miles one way from the rim to Holua campsite on the crater floor, passing native shrubland and crossing volcanic cinder. The round trip of about 8 miles is the standard day hike into the crater wilderness; carry 3 liters of water per person, as none is available below the rim. The Sliding Sands (Keonehe'ehe'e) Trail drops 3,000 feet over 10 miles one way to Palikū at the far end of the crater; most day hikers descend 4 to 5 miles and return. Altitude affects exertion; the summit sits above 10,000 feet, where the air holds about 40 percent less oxygen than at sea level.

  camping: |
    The park has two front-country campgrounds and two backcountry sites in the crater wilderness. Hosmer Grove Campground near the Summit District entrance has a small number of tent sites at 6,800 feet, open year-round on a first-come, first-served basis at no charge; facilities are limited to pit toilets and no potable water. Kipahulu Campground in the Kipahulu District has about 60 tent sites near the coast at roughly 100 feet elevation, open year-round on a first-come, first-served basis at $20 per night. In the crater wilderness, Holua (6,940 feet) and Palikū (6,380 feet) each have a small campsite and a historic cabin available for overnight stays; both require advance reservations through Recreation.gov and a fee. Campers at all sites must pack out all trash and carry all water below the rim.

  fees_reservations: |
    Entry costs $30 per vehicle, $25 per motorcycle, or $15 per person on foot or bicycle; passes cover three consecutive days. The America the Beautiful annual pass ($80) covers entry for the pass holder and vehicle passengers. A separate timed entry reservation is required to enter the Summit District between 3 a.m. and 7 a.m.; reservations open 60 days in advance at Recreation.gov and carry a $1 service fee. Without a reservation, visitors may enter the Summit District from 7 a.m. onward without additional booking. Kipahulu requires no timed entry. Kipahulu camping costs $20 per night; crater wilderness campsites and cabins require Recreation.gov reservations. Confirm current fees and rules at the official park page at nps.gov/hale.

  getting_there: |
    **Summit District by car** From Kahului Airport, take Highway 36 east to Highway 37 south through Pukalani, then Highway 377 and Highway 378 (Haleakalā Highway) to the summit, about 35 miles and 1.5 to 2 hours of driving. The road climbs from sea level to 10,023 feet; fuel up before starting, as no gas is available above Pukalani.

    **Kipahulu District by car** From Kahului, take the Road to Hana (Highway 36/360) around the island's northeast coast, continuing past Hana to Kipahulu, about 65 miles and 2.5 to 3 hours with stops. The road is narrow and winding; large vehicles are discouraged. The two districts have no road connection within the park.

    **By air** Kahului Airport (OGG) on Maui is the gateway for both districts and receives direct flights from the mainland and inter-island connections. Rental cars are available at the airport; no public transit reaches either park district.

  geology: |
    Haleakalā is a shield volcano formed over the Hawaiian hot spot, the same geological feature that built the entire chain of Hawaiian Islands as the Pacific Plate slowly moved northwest over a fixed plume of rising mantle rock. Haleakalā's main shield-building eruptions ended hundreds of thousands of years ago, but younger volcanic activity, including lava flows and cinder cone formation on the upper slopes, continued until roughly 1600 CE based on geological evidence.

    The large depression at the summit is not a true volcanic crater formed by collapse but rather an erosional feature created where two valleys, Ko'olau Gap on the northeast and Kaupō Gap on the south, eroded back from opposite sides of the mountain and merged. Later volcanic eruptions partially filled the valley floor with cinder cones and lava flows, producing the stark landscape visitors see today. The depression measures 7.5 miles long, 2.5 miles wide, and about 3,000 feet deep.

    The Kipahulu Valley on the park's southeast flank receives up to 400 inches of rain per year in the upper watershed, one of the highest rainfall totals in the United States. This rain feeds 'Ohe'o Gulch, carving a series of waterfalls and pools as it descends to the coast. The valley floor is layered volcanic rock, and the cliffs above the pools expose the dark basalt flows that built the island.

  wildlife: |
    The 'ahinahina (Haleakalā silversword) is the park's most iconic species. It grows only on the rocky cinder of Haleakalā's upper slopes, produces a single flower stalk after 3 to 50 years of growth, blooms, sets seed, and dies. Overgrazing by feral goats and cattle reduced the population to near extinction in the early 20th century; fencing and predator control have allowed thousands of plants to recover within the crater wilderness.

    Nēnē, the Hawaiian state bird, were reduced to fewer than 30 individuals in the wild by the 1950s from hunting and introduced predators. A breeding program and intensive management raised statewide numbers to over 3,000; the park hosts a significant resident population. Nēnē are commonly seen near the crater rim parking areas and along the summit road. Do not feed them.

    The 'ua'u (Hawaiian petrel) is a highly endangered seabird that nests in burrows on the upper slopes of Haleakalā at night. Artificial lights disorient fledglings as they leave their burrows; the park manages its lighting accordingly. Native forest birds including 'apapane and 'amakihi are audible in the Hosmer Grove area and in the Kipahulu Valley forests. Feral pigs, rats, and mongooses are present throughout the park and are managed as invasive threats to native species.

  history: |
    Hawaiian people have a continuous relationship with Haleakalā that predates written records. The name means "House of the Sun" and comes from the legend of the demigod Maui, who is said to have climbed to the summit and lassoed the sun's rays to slow its passage across the sky, giving his mother more daylight to dry her kapa cloth. Trails crossing the summit were used for centuries to reach fishing grounds on the southern coast.

    Hawaiian agricultural communities cultivated the lower slopes and coastal areas of Kipahulu for generations. The introduction of cattle ranching by foreign settlers in the 19th century brought dramatic environmental damage: feral cattle, goats, and pigs grazed native plants to the root and opened the land to invasive species. By the early 1900s, much of the lower mountain had been cleared or degraded.

    Congress created Hawaii National Park in 1916, originally covering both Haleakalā on Maui and the Kilauea and Mauna Loa volcanoes on the Big Island. The two sections were administered separately for decades. In 1961, Haleakalā became its own national park. The Kipahulu District was added in 1969, partly through the efforts of conservationist Charles Lindbergh, who lived near Kipahulu and is buried in a small churchyard just outside the park boundary. Extensive feral animal fencing began in the 1980s and continues today as the park's primary conservation tool.

  best_things_to_see_items:
    - name: "Sunrise from the Summit"
      description: "Watching the sun rise above the clouds from 10,023 feet is the single most popular experience in the park. The sky turns purple, then orange, and the crater fills with shadow and light as the sun clears the horizon. A timed entry reservation through Recreation.gov is required to enter between 3 a.m. and 7 a.m.; reservations open 60 days in advance and sell out quickly. Dress for temperatures in the 30s and 40s and bring layers."
      image: "/images/parks/national/haleakal-national-park/05-sunrise-from-the-summit.jpg"
      alt: "A dawn sky colors clouds yellow and pink, silhouetting an overlook shelter."
      credit: "NPS"
    - name: "'Ohe'o Gulch (Seven Sacred Pools)"
      description: "A series of freshwater pools carved into dark basalt by 'Ohe'o Stream as it descends from the Kipahulu Valley to the coast. The lower pools are accessible via the Kuloa Point Loop and are open for wading when conditions are safe; flash floods can arrive without warning and closures are common after rain. Check the NPS website before visiting; the pools close frequently."
      image: "/images/parks/national/haleakal-national-park/06-ohe-o-gulch-seven-sacred-pools.jpg"
      alt: "`Ohe`o Gulch is the path of cascades flowing into the Pacific Ocean "
      credit: "NPS Photo"
    - name: "Pipiwai Trail to Waimoku Falls"
      description: "A 4-mile round-trip trail in the Kipahulu District that climbs through banyan groves and a dense half-mile bamboo forest to 400-foot Waimoku Falls. The bamboo can grow over 30 feet high and the light filtering through the canopy is unlike anything on the Summit. Allow 3 to 4 hours and bring rain gear; the valley receives heavy rainfall year-round."
      image: "/images/parks/national/haleakal-national-park/07-pipiwai-trail-to-waimoku-falls.jpg"
      alt: "Waimoku waterfall in the park's Kipahulu District"
      credit: "NPS"
    - name: "'Ahinahina Silversword"
      description: "Thousands of 'ahinahina grow on the rocky cinder slopes of the crater wilderness, their silver-green rosettes catching the light in the thin mountain air. The plants are visible from the crater rim trails and concentrated along the Sliding Sands Trail. When one blooms, a stalk rising 3 to 6 feet covered in purple flowers, it is a rare sight; the plant dies immediately after. Do not approach or touch them."
      image: "/images/parks/national/haleakal-national-park/08-ahinahina-silversword.jpg"
      alt: "Silversword plants in a variety of stages in the crater"
      credit: "NPS Photo"
    - name: "Crater Wilderness Hike"
      description: "Descending into Haleakalā's volcanic depression by foot is the most direct way to grasp the scale of the landscape. The Halemau'u Trail drops 1,400 feet to the crater floor in about 4 miles, passing cinder cones and native shrubland. Carry 3 liters of water per person; none is available below the rim; expect to gain all the elevation back on the return."
      image: "/images/parks/national/haleakal-national-park/01-best-crater-wilderness-hike.jpg"
      alt: "Three hikers walk along a cinder trail. In the distance, cinder cones and rocky ridges display vibrant hues of red, yellow, and green."
      credit: "NPS Photo / Hannah Mousavi"
    - name: "Nēnē Watching"
      description: "The Hawaiian state bird, a goose endemic to the islands, is regularly seen near the summit parking areas and along the crater rim. The park's population represents one of the most successful endangered species recoveries in the United States. Nēnē are not shy and will approach visitors; keep 25 feet of distance and do not feed them, as human food disrupts their foraging behavior."
      image: "/images/parks/national/haleakal-national-park/09-nene-watching.jpg"
      alt: "Brown, black, and white birds stand in green grass"
      credit: "NPS Photo/Jill Peters"

