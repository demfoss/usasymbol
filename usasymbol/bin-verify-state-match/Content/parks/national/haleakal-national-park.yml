faq:
  - question: "Do I need a reservation to see the sunrise at Haleakalā?"
    answer: "Yes. A timed entry reservation is required to enter the Summit District between 3 a.m. and 7 a.m. Reservations open 60 days in advance through Recreation.gov and carry a $1 service fee; they sell out quickly, often within minutes of opening. Without a reservation, you must wait until 7 a.m. to enter."
  - question: "Where is Haleakalā National Park?"
    answer: "Haleakalā National Park is on Maui, Hawaii. The Summit District is about 35 miles from Kahului Airport on the island's central plain. The Kipahulu District is roughly 65 miles from Kahului via the Road to Hana. The two districts have no road connection within the park."
  - question: "What is the entrance fee for Haleakalā National Park?"
    answer: "Entry costs $30 per vehicle, $25 per motorcycle, or $15 per person on foot or bicycle; passes cover three consecutive days. Sunrise visits also require a $1 timed entry reservation. The America the Beautiful annual pass covers entry."
  - question: "What should I wear to see the Haleakalā sunrise?"
    answer: "Dress for temperatures in the 30s and 40s Fahrenheit at the summit, even in summer. Bring a warm jacket, hat, and gloves. Wind at 10,000 feet can make it feel colder. The sun warms quickly once it rises, so layers are practical. Closed shoes are recommended as the cinder around the rim is loose."
  - question: "Can you swim in the pools at Haleakalā National Park?"
    answer: "Wading in the lower 'Ohe'o pools is permitted when conditions are safe, but the pools close frequently due to flash flood risk; without warning, rain upstream can send a dangerous surge of water down the gulch. Check nps.gov/hale for current closure status before visiting. Swimming in the upper pools is not permitted."
  - question: "What is the 'ahinahina silversword?"
    answer: "The 'ahinahina is a plant found only on Haleakalā. It forms a silver-leafed rosette that grows for 3 to 50 years before producing a single flower stalk up to 6 feet tall, blooming in summer, setting seed, and dying. Several thousand grow in the crater wilderness. Do not touch or approach them; footsteps compact the cinder soil around their roots."
  - question: "How long is the drive from Kahului to the Haleakalā summit?"
    answer: "The drive from Kahului to the summit visitor center is about 35 miles and takes 1.5 to 2 hours. The road climbs from sea level to over 10,000 feet; fuel up before leaving Pukalani, the last town with a gas station on the way up. Sunrise visitors typically leave Kahului around 2 to 2:30 a.m."

  - question: What state is Haleakalā National Park in?
    answer: Haleakalā National Park is in [Hawaii](/states/hawaii), near Kula, Maui, Hawaii.

