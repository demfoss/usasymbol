seo_title: "Haleakalā National Park: Hikes, Sunrise & Guide"
seo_description: "Visit Haleakalā National Park on Maui: sunrise reservations, Pipiwai Trail, silversword plants, $30 entry, and best time to go."
intro_text: "Haleakalā National Park on Maui, [Hawaii](/states/hawaii) spans the 10,023-foot summit of a massive shield volcano and the lush Kipahulu rainforest coast, two districts separated by a two-hour drive around the island. Established in 1916 and covering 33,265 acres, the park shelters the 'ahinahina silversword, the nēnē goose, and dozens of other species found nowhere else on Earth."

