intro_text: "Grand Canyon National Park in northwestern [Arizona](/states/arizona), established February 26, 1919, preserves a 277-mile gorge carved by the Colorado River — over a mile deep and up to 18 miles wide — whose layered walls expose 1.7 billion years of Earth's geological history and rank it among the Seven Natural Wonders of the World."

