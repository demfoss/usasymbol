sections:
  overview: |
    Grand Canyon National Park covers 1.2 million acres of the Colorado Plateau in northwestern Arizona. The canyon stretches 277 miles along the Colorado River, reaches depths of more than 6,000 feet in places, and exposes rock layers spanning nearly 1.7 billion years. The South Rim, where the vast majority of visitors go, sits at roughly 7,000 feet elevation and is open year-round. The North Rim, only 10 miles away as the crow flies but 215 miles by road, stands at 8,000 feet and is open mid-May through mid-October. The park receives about 6 million visitors per year, making it the second most visited national park in the United States. It was designated a UNESCO World Heritage Site in 1979.

  known_for: |
    The Grand Canyon is known above all for its overwhelming scale: a gorge so vast that the far rim looks distant rather than across-the-street. Its layered walls are a textbook of geological time: limestone, sandstone, shale, and ancient metamorphic rock stacked in a sequence that covers nearly half of Earth's history. The Vishnu Basement Rocks at the inner gorge floor are 1.7 billion years old; the Kaibab Limestone forming the rim is about 270 million years old.

    The canyon is also known for its rim-to-river hiking routes: Bright Angel Trail and South Kaibab Trail descend 4,500 feet from the South Rim to the Colorado River. And the Colorado River through the canyon is one of the world's premier multi-day whitewater rafting destinations, with more than 160 rapids, several rated among the most technically demanding in North America.

  best_things_to_see_items:
    - name: "Mather Point and Yavapai Point"
      description: "The most-visited overlooks on the South Rim, a short walk from the Grand Canyon Visitor Center. Mather Point gives an immediate panoramic view of the inner canyon and Colorado River corridor. Yavapai Point has an enclosed geology museum with labeled formations in the view."
      image: "/images/parks/national/grand-canyon-national-park/05-mather-point-and-yavapai-point.jpg"
      alt: "People behind guardrails at a scenic overlook viewing a colorful landscape of peaks and cliffs."
      credit: "NPS/M.Quinn"
    - name: "Bright Angel Trail"
      description: "The park's most traveled inner-canyon trail, descending 4,460 feet over 9.5 miles from the South Rim to the Colorado River. The 3-Mile Resthouse is the standard day-hike turnaround; rest houses at 1.5 and 3 miles have water (May–September) and emergency phones."
      image: "/images/parks/national/grand-canyon-national-park/06-bright-angel-trail.jpg"
      alt: "A dirt trail with steps descends into the canyon past a short cliff of white limestone."
      credit: "NPS/Ty Karlovetz"
    - name: "Desert View Drive"
      description: "A 25-mile scenic road east along the South Rim from Grand Canyon Village to Desert View, the canyon's highest accessible overlook at 7,438 feet. The 1932 Desert View Watchtower, designed by architect Mary Colter, is one of the park's most photographed structures."
      image: "/images/parks/national/grand-canyon-national-park/07-desert-view-drive.jpg"
      alt: "A circular stone tower, 70 feet tall perched on the edge of a vast canyon"
      credit: "NPS/M.Quinn"
    - name: "Hermit Road"
      description: "A 7-mile western rim drive accessible by free shuttle bus (March–November) or bicycle. Pima, Mohave, and Hopi Points offer some of the widest canyon panoramas on the South Rim and are the top sunset spots in the park."
      image: "/images/parks/national/grand-canyon-national-park/08-hermit-road.jpg"
      alt: "Mojave point view."
    - name: "The North Rim"
      description: "Higher, cooler, and far less crowded than the South. The Grand Canyon Lodge sits at the rim's edge at 8,000 feet; the short Bright Angel Point Trail from the lodge gives an immediate dramatic view down into the canyon. Open mid-May through mid-October."
      image: "/images/parks/national/grand-canyon-national-park/09-the-north-rim.jpg"
      alt: "Viewing the canyon from the patio of Grand Canyon Lodge."
    - name: "Phantom Ranch"
      description: "The only lodging at the canyon bottom, accessible only by hiking or mule. Operated by Xanterra, it has dorms and cabins and serves hot meals. A reservation requires entering the NPS lottery, which opens 15 months in advance."
      image: "/images/parks/national/grand-canyon-national-park/09-best-phantom-ranch.jpg"
      alt: "A historic image of Phantom Ranch on the left and a modern image of Phantom Ranch on the right."

