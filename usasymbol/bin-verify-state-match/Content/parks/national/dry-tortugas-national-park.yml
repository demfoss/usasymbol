faq:
  - question: "How do you get to Dry Tortugas National Park?"
    answer: "There is no road access. The two options are the Yankee Freedom III ferry from Key West Historic Seaport (2.5-hour ride, about $200–$220 round trip for adults) and the Key West Seaplane Adventures flight (40 minutes, about $390–$470 round trip). Private boats can also anchor at the park's mooring buoys. Book either option well in advance — spring dates sell out months ahead."
  - question: "What is Fort Jefferson?"
    answer: "Fort Jefferson is a six-sided masonry fort on Garden Key, the largest island in the park. Construction began in 1846 and continued for nearly 30 years; approximately 16 million bricks were used. It was designed to hold 450 cannons and never fired a shot in battle. During the Civil War it was used as a military prison, most famously for Dr. Samuel Mudd. A self-guided walking tour takes about 1 to 1.5 hours."
  - question: "When is the best time to visit Dry Tortugas?"
    answer: "Spring (March through May) offers the best combination of calm seas, comfortable temperatures (75–85 °F), and good water visibility. Winter (December through February) has the clearest water of the year. Summer is hot and humid with afternoon storms and the start of hurricane season. Fall brings the quietest crowds and excellent migratory bird watching in October, but hurricane risk remains through November."
  - question: "Can you camp at Dry Tortugas?"
    answer: "Yes. Garden Key Campground has 10 tent sites; reservations are required through Recreation.gov and cost about $15 per person per night. There is no water, electricity, or running water — everything must be brought in on the ferry or seaplane. The camping fee is separate from the entrance fee and the ferry fare. Spring dates sell out months in advance."
  - question: "Is snorkeling good at Dry Tortugas?"
    answer: "Yes — the water around Dry Tortugas is among the clearest in the eastern United States, often 60 to 80 feet of visibility in winter and spring. The moat wall around Fort Jefferson has coral, sponges, and abundant fish accessible to beginners in shallow water. The Windjammer Wreck off Loggerhead Key offers a shallow dive or snorkel in 20 to 25 feet of water. The Yankee Freedom ferry includes snorkel gear rental in its ticket price."
  - question: "Are there hiking trails at Dry Tortugas?"
    answer: "No formal hiking trails exist. Garden Key is a small island; the main on-land activity is the self-guided walking tour of Fort Jefferson, covering about 0.5 miles of interior walkways and gun decks. The primary activities at the park are in the water: snorkeling, swimming, and for private boaters, diving. Walking the beach and moat wall exterior adds another 0.3 miles at most."
  - question: "Does the America the Beautiful Pass work at Dry Tortugas?"
    answer: "The annual pass covers the $15 per-person entrance fee only. It does not reduce or waive the ferry fare, the seaplane fare, or the camping fee. Since the ferry often bundles the entrance fee into its ticket price, holders of the annual pass should confirm whether the bundled fare can be reduced when booking."

  - question: What state is Dry Tortugas National Park in?
    answer: Dry Tortugas National Park is in [Florida](/states/florida), near Key West, Florida.
