seo_title: "Dry Tortugas National Park: Map, Things to Do & Best Time"
seo_description: "Visit Dry Tortugas National Park in Florida: Fort Jefferson, snorkeling, sea turtle nesting, best time to go, and how to get there."
intro_text: "Dry Tortugas National Park protects 64,701 acres of open water, coral reef, and seven small islands 70 miles west of Key West, [Florida](/states/florida) — accessible only by ferry or seaplane and one of the most remote national parks in the eastern United States. The park's centerpiece is Fort Jefferson, the largest masonry structure in the Americas, begun in 1846 and never fully completed; the park was established as a national monument in 1935 and redesignated as a national park in 1992."

