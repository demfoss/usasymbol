sections:
  overview: |
    Dry Tortugas National Park sits 70 miles west of Key West in the Gulf of Mexico, a cluster of seven low coral islands surrounded by 64,701 acres of open water — more than 99 percent of the park is sea. Accessible only by a 2.5-hour ferry ride or a 40-minute seaplane flight, it is among the most remote national parks in the eastern United States and one of the least visited, drawing about 81,000 people in 2023 to rank 61st among all 63 national parks. The park's dominant structure is Fort Jefferson, a six-sided brick fortification begun in 1846 that covers most of Garden Key and is the largest masonry structure in the Americas — built from approximately 16 million bricks over 30 years yet never fully completed and never fired in battle. The surrounding waters hold sections of the Florida Reef, some of the clearest water on the East Coast, and a suite of wildlife that includes nesting sea turtles, one of the largest sooty tern colonies in the United States, and abundant reef fish visible from the surface without scuba equipment.

  known_for: |
    Fort Jefferson, the six-sided Civil War-era brick fortification on Garden Key that covers nearly the entire island — one of the largest masonry structures in the Americas, built from roughly 16 million bricks, and still largely intact more than 150 years after construction began.
    Snorkeling and diving in water clear enough to see the bottom at 25 feet from the surface, with coral formations along the fort's moat wall and the Windjammer Wreck — a 19th-century iron sailing ship resting in shallow water off Loggerhead Key.
    The sooty tern colony on Bush Key, where approximately 80,000 to 100,000 terns nest each year from January through September in one of the largest seabird colonies in the United States, visible and audible from Garden Key.
    Sea turtle nesting from May through October, when loggerhead, green, and hawksbill turtles haul onto the beaches and the surrounding water is a regular feeding and resting habitat for sea turtles year-round.

  best_things_to_see_items:
    - name: "Fort Jefferson"
      description: "Fort Jefferson is a six-sided masonry fortification that dominates Garden Key, built from approximately 16 million bricks starting in 1846. Designed to hold 450 cannons across three gun tiers, it was intended to control the shipping lanes between the Atlantic and the Gulf of Mexico. Construction continued for 30 years without the fort ever being finished or firing in anger. A self-guided walking tour through the interior corridors, gun decks, and parade ground takes about 1 to 1.5 hours; NPS rangers lead guided tours when the ferry is in."
      image: "/images/parks/national/dry-tortugas-national-park/06-fort-jefferson.jpg"
      alt: "A view inside Fort Jefferson."
      credit: "NPS Photo / Maria Belen Farias"
    - name: "Snorkeling the Moat Wall"
      description: "The outer wall of Fort Jefferson is surrounded by a moat, and the exterior face of the wall below the waterline supports coral formations, sponges, and abundant fish visible from the surface in water that is typically 10 to 20 feet deep and clear enough to see fine detail. Snorkeling equipment rentals are available from the ferry concessionaire on day trips. The moat wall is the most accessible snorkel site in the park and one of the best: parrotfish, angelfish, barracuda, and nurse sharks are regularly seen."
      image: "/images/parks/national/dry-tortugas-national-park/07-snorkeling-the-moat-wall.jpg"
      alt: "Park visitors enjoy a sunset on the moat wall."
      credit: "NPS Photo / Maria Belen Farias"
    - name: "Windjammer Wreck"
      description: "The Windjammer is a 19th-century iron-hulled sailing ship resting in shallow water off the southwest shore of Loggerhead Key, the second-largest island in the park. The wreck lies in 20 to 25 feet of water and is accessible to snorkelers as well as scuba divers. The iron hull and rigging framework are largely intact and encrusted with coral and sponge; fish density around the wreck is higher than in the surrounding reef. Reaching the wreck requires a boat trip from Garden Key — the ferry does not stop there, so private or charter boats are the standard access."
      image: "/images/parks/national/dry-tortugas-national-park/08-windjammer-wreck.jpg"
      alt: "Two divers dive the Windjammer Wreck"
      credit: "NPS Photo"
    - name: "Sooty Tern Colony on Bush Key"
      description: "Bush Key, immediately east of Garden Key and visible from the fort's walls, hosts one of the largest sooty tern nesting colonies in the United States. Between 80,000 and 100,000 birds pack the key from late January through September, creating a wall of sound audible across the water. Magnificent frigatebirds and brown noddies nest on the same key. Bush Key is closed to visitors during nesting season, but the colony is fully visible and audible from the Garden Key shore and the fort's upper gun deck."
      image: "/images/parks/national/dry-tortugas-national-park/09-sooty-tern-colony-on-bush-key.jpg"
      alt: "2 small black and white birds resting on green vegetation"
    - name: "Loggerhead Key"
      description: "Loggerhead Key is the largest island in the park at about 45 acres, located about 3 miles west of Garden Key. It has a functioning lighthouse (one of the few still operated by the Coast Guard in a national park) and is surrounded by some of the best reef snorkeling in the park. The Windjammer Wreck lies just off its southwestern shore. Private boats can anchor off the key; the ferry does not include a Loggerhead Key stop on standard day trips."
      image: "/images/parks/national/dry-tortugas-national-park/10-loggerhead-key.jpg"
      alt: "A boat passes in front of Loggerhead Key during sunset."
      credit: "NPS Photo / Maria Belen Farias"
    - name: "Stargazing from Garden Key"
      description: "The Dry Tortugas are roughly 70 miles from the nearest city lighting, making Garden Key one of the darkest sky sites accessible in the eastern United States. The Milky Way is visible to the naked eye on moonless nights from late spring through early fall. Campers who stay overnight have the sky to themselves after the day-trip ferry departs around 3 p.m. There are no facilities open after dark; bring a red-light headlamp to preserve night vision and leave a clear view of the stars."
      image: "/images/parks/national/dry-tortugas-national-park/11-stargazing-from-garden-key.jpg"
      alt: "Starscape over Fort Jefferson on Garden Key."
      credit: "Photo courtesy of Judd Patterson, www.juddpatterson.com"

