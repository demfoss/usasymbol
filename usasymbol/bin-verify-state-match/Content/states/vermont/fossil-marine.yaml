- id: facts
  icon: fa-solid fa-lightbulb
  title: Beluga Whale Facts
  facts:
  - "The beluga whale is the only state fossil in the United States from a species still alive today."
  - "The Charlotte Whale was found in 1849 during railroad construction, about 150 feet above sea level and 10 miles from Lake Champlain."
  - "Its discovery confirmed the existence of the Champlain Sea, a post-glacial saltwater body that flooded the Champlain Valley from about 13,000 to 10,000 years ago."
  - "Vermont originally designated the beluga as its state fossil in 1993; it was reclassified as state marine fossil in 2014 when the woolly mammoth was added."
  - "Vermont is the only U.S. state with two separate official fossil categories, a state marine fossil and a state terrestrial fossil."

