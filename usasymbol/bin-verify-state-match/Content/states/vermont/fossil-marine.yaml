faq:
- question: What is Vermont's state marine fossil?
  answer: "Vermont's state marine fossil is the beluga whale (Delphinapterus leucas), designated in 1993. It is the only U.S. state fossil from a species still alive today."
- question: When did Vermont adopt the beluga whale as its state fossil?
  answer: "Vermont designated the beluga whale as its state fossil in 1993. It was reclassified as the state marine fossil in 2014 when the woolly mammoth was added as a second state fossil."
- question: What did the beluga whale look like?
  answer: "Adult beluga whales are white, up to 18 feet long, and weigh up to 3,500 pounds. They can turn their heads side to side, unlike most whales, because their neck vertebrae are not fused."
- question: Where was the Charlotte Whale found in Vermont?
  answer: "The Charlotte Whale was found in 1849 in the town of Charlotte, Vermont, about 10 miles from Lake Champlain and 150 feet above sea level, during railroad construction. The skeleton is now at the Perkins Museum of Geology at the University of Vermont."
- question: When did the Charlotte Whale live?
  answer: "The Charlotte Whale specimen is about 11,000 years old, from the Pleistocene epoch, when a post-glacial saltwater sea called the Champlain Sea covered the Champlain Valley."
- question: Why is a whale fossil found so far from the ocean?
  answer: "About 13,000 to 10,000 years ago, the land in the Champlain Valley was still depressed from the weight of glaciers. Seawater flooded the lowland, forming the Champlain Sea. As the land slowly rebounded and the water drained, marine animals like the beluga were left behind and buried."

