faq:
  - question: "What is Vermont's state motto?"
    answer: "Vermont's state motto is \"Freedom and Unity.\" It has appeared on the state seal since Vermont's early statehood and reflects the state's history as an independent republic that chose to join the United States."

  - question: "What does \"Freedom and Unity\" mean?"
    answer: "\"Freedom\" refers to Vermont's independent history — Vermont was a self-governing republic from 1777 to 1791 and wrote the first American constitution to ban adult slavery. \"Unity\" refers to Vermont's choice to join the United States as the 14th state on March 4, 1791."

  - question: "Was Vermont an independent country before it became a state?"
    answer: "Yes. Vermont declared independence in 1777 and governed itself as the Vermont Republic for fourteen years. It was admitted to the United States as the 14th state on March 4, 1791, the first new state after the original thirteen colonies."

  - question: "When did Vermont ban slavery?"
    answer: "Vermont's constitution of 1777 banned adult slavery — the first American constitution to do so. This happened while Vermont was still an independent republic, before it joined the United States in 1791."

