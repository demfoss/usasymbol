seo_description: "Vermont's state motto is \"Freedom and Unity.\" Vermont banned slavery in its 1777 constitution and joined the Union as the 14th state on March 4, 1791."

intro_text: "Vermont's state motto is <strong>Freedom and Unity</strong>. Vermont wrote the first American constitution to ban adult slavery in 1777 and joined the Union as the 14th state on March 4, 1791. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

