seo_title: "Vermont State Soil | Tunbridge Series"
seo_description: "The Vermont state soil is the Tunbridge series, a rocky Spodosol on glaciated uplands statewide. It supports sugar maple forest, dairy pasture, and hay."
hero_image: /images/soils/vermont/vermont-state-soil-hero.webp
hero_image_alt: "Green valley farms and wooded hills under clear autumn color."
hero_image_caption: "Fields and tree-covered hills combine in a classic Vermont valley view."
intro_text: "Vermont's state soil is the Tunbridge series — a dark, stony Spodosol covering the glaciated hillsides and uplands of the Green Mountains, where the stone walls built from its boulders still line the sugar maple forests and dairy pastures of the Vermont countryside. This profile appears in the [list of U.S. state soils](/symbols/soils)."

sections:
- id: overview
  icon: fa-solid fa-mountain
  title: Vermont State Soil
  paragraphs:
  - "Tunbridge is a Spodosol — a soil order that forms only in cool, humid climates under acid forest. Rainwater, made acidic by decomposing pine needles and maple leaves, dissolves iron, aluminum, and organic matter from the upper soil and carries them downward. The result is a pale, almost white layer just below the surface, and a vivid reddish-brown layer below that where the dissolved material has re-deposited."
  - "The soil is well-drained and moderately deep — typically 20 to 40 inches before striking the schist, gneiss, or granite bedrock of the Green Mountains. It is acidic throughout, with a pH between 4.5 and 5.5, which suits sugar maple, yellow birch, and American beech far better than most farm crops."

- id: history
  icon: fa-solid fa-landmark
  title: Why Vermont Chose the Tunbridge Soil
  paragraphs:
  - "Soil scientists at the USDA Natural Resources Conservation Service selected the Tunbridge series to represent Vermont because it is the most widespread upland soil in the state, covering the hillsides and ridges of the Green Mountains and the surrounding foothills that define Vermont's landscape."
  - "The series is named after the town of Tunbridge in Orange County, Vermont, where the soil was first formally described. Tunbridge sits in the White River valley on the eastern flank of the Green Mountains — in the heart of the soil's core distribution."
  - "The Tunbridge series is recognized by the USDA as Vermont's state soil. It was chosen because it underlies Vermont's two defining land uses: the sugar maple forests that produce more maple syrup than any other state, and the rocky stone-walled pastures that anchored New England dairy farming for two centuries."

- id: profile
  icon: fa-solid fa-layer-group
  title: Tunbridge Soil Profile and Horizons
  paragraphs:
  - "Dig into Tunbridge soil under a sugar maple forest and the first thing you hit is dark, spongy organic matter. Below that comes a very dark brown sandy loam, then something unexpected: a pale gray layer — almost white — where acid rain has stripped away all the iron and color. Then the soil turns dramatically darker: a reddish-brown spodic horizon stained by iron and humus carried down from above. A few inches further, the color fades to brown, and then you hit a rock."
  layers:
  - horizon: A
    name: Surface layer
    depth_in: "0–7"
    color_hex: "#332820"
    color_name: very dark grayish brown
    texture: sandy loam
    note: acid humus from maple and beech leaf litter
  - horizon: E
    name: Eluvial layer
    depth_in: "7–10"
    color_hex: "#B0AE9E"
    color_name: gray
    texture: sandy loam
    note: bleached white-gray; iron and aluminum stripped out
  - horizon: Bhs
    name: Spodic horizon
    depth_in: "10–13"
    color_hex: "#5A2C1C"
    color_name: dark reddish brown
    texture: sandy loam
    note: humus and iron re-deposited; diagnostic spodic layer
  - horizon: Bs
    name: Iron-enriched subsoil
    depth_in: "13–28"
    color_hex: "#8A5030"
    color_name: reddish brown
    texture: sandy loam
    note: iron oxides color the horizon; less humus than Bhs
  - horizon: C
    name: Glacial till
    depth_in: "28–38"
    color_hex: "#8A8070"
    color_name: grayish brown
    texture: gravelly loam
    note: stony Laurentide till; many cobbles and boulders
  - horizon: R
    name: Bedrock
    depth_in: "38+"
    color_hex: "#787060"
    color_name: dark gray
    texture: schist or gneiss
    note: Green Mountain metamorphic bedrock; root barrier

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Tunbridge Soil Grows in Vermont
  paragraphs:
  - "Tunbridge soil covers the hillsides, ridges, and upland glacial terraces of the Green Mountains and their eastern and western foothills — the core of Vermont's terrain. It forms on slopes of 3 to 60 percent at elevations of 500 to 2,500 feet, in areas that receive 35 to 50 inches of precipitation per year."
  - "Orange County is the type location, but the soil spreads across nearly every county in central and northern Vermont. Washington, Lamoille, Caledonia, and Windsor counties all have large Tunbridge areas on their hillsides and ridges."
  counties:
  - Orange
  - Washington
  - Lamoille
  - Caledonia
  - Windsor
  - Addison
  - Chittenden
  - Orleans

- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Tunbridge Soil
  paragraphs:
  - "Sugar maple is the tree most closely associated with Tunbridge soil. Vermont produces more maple syrup than any other state, and the majority of Vermont's sugar bushes — the maple groves tapped each spring — grow on Tunbridge and related stony, well-drained upland soils. The low fertility and acidity that limit farm crops suit sugar maple perfectly."
  - "Dairy farmers cleared Tunbridge hillsides of their forest and boulders through the eighteenth and nineteenth centuries. The boulders went into the stone walls that still cross Vermont's landscape. The cleared land became pasture for the Holstein and Jersey cows at the heart of Vermont's dairy economy."
  - "Today, many former Tunbridge pastures have returned to sugar maple and yellow birch forest as dairy farms consolidated and fields were abandoned. Hay, oats, and silage corn are grown on the flatter Tunbridge areas near valley floors, with lime applied to correct the naturally low pH."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Tunbridge Soil Facts
  facts:
  - "The series is named after the town of Tunbridge in Orange County, Vermont, where USDA soil scientists first formally described and mapped the series."
  - "Tunbridge soil is classified as a Typic Haplorthod — a Spodosol with a spodic horizon containing iron, aluminum, and humus carried down from the surface by acidic rainwater. Spodosols are characteristic of the cool, forested Northeast."
  - "The E horizon — the pale gray, almost white layer just below the surface — is one of the most distinctive features in Vermont's soil profiles. Acid from decomposing forest litter strips iron and aluminum from this layer and deposits them in the reddish-brown Bhs below."
  - "Tunbridge soil is moderately deep, reaching bedrock at 20 to 40 inches. The bedrock is metamorphic schist, gneiss, and granite — the ancient rock of the Green Mountains formed from sediment compressed and heated roughly 400 million years ago during the collision of ancestral North America and Europe."
  - "The pH of Tunbridge soil ranges from 4.5 to 5.5 — more acidic than black coffee. Farmers applying lime to raise pH for crops must work against the natural acid-producing chemistry of the overlying maple and birch forest."
  - "Vermont's iconic stone walls are a direct product of Tunbridge soil. Farmers clearing boulders and cobbles from glacial till to create pastures stacked them into walls over two centuries of agriculture. An estimated 240,000 miles of stone walls remain in New England."

