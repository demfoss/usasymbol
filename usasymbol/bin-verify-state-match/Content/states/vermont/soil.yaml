faq:
- question: What is Vermont's state soil?
  answer: "Vermont's state soil is the Tunbridge series, a dark, stony Spodosol found on the glaciated hillsides and uplands of the Green Mountains and their foothills. It is recognized by the USDA Natural Resources Conservation Service as Vermont's representative state soil and supports the sugar maple forests, dairy pastures, and stone-walled landscapes that define Vermont."
- question: Why is it called Tunbridge soil?
  answer: "The series is named after the town of Tunbridge in Orange County, Vermont, where USDA soil scientists first formally described and classified the series. Tunbridge sits on the eastern flank of the Green Mountains in the heart of the soil's core distribution."
- question: What color is Tunbridge soil?
  answer: "The surface is very dark grayish brown from acid forest humus. Below that is the most striking feature: a gray to almost white E horizon, stripped of iron by acid leaching. Below the E horizon is the reddish-brown spodic layer, stained by iron and humus that washed down from above. The glacial till below is grayish brown and full of stones."
- question: Where is Tunbridge soil found in Vermont?
  answer: "Tunbridge soil covers hillsides, ridges, and upland terraces across most of Vermont, mainly in Orange, Washington, Lamoille, Caledonia, and Windsor counties. It grows on slopes of 3 to 60 percent at elevations of 500 to 2,500 feet in areas receiving 35 to 50 inches of precipitation per year."
- question: What grows in Tunbridge soil?
  answer: "Sugar maple, yellow birch, and American beech are the native trees. Vermont's maple syrup industry grows almost entirely on Tunbridge and related upland soils. Dairy pastures occupy the gentler slopes, maintained with lime to correct the natural acidity. Hay and oats grow on the flatter Tunbridge sites in valley settings."
- question: Who chose Tunbridge as Vermont's state soil?
  answer: "Soil scientists at the USDA Natural Resources Conservation Service selected the Tunbridge series to represent Vermont. It was chosen because it is the most widespread upland soil in the state and links directly to Vermont's defining land uses: maple syrup production and rocky-hillside dairy farming."
- question: How deep is Tunbridge soil before hitting rock?
  answer: "Tunbridge soil is moderately deep — typically 20 to 40 inches before striking the metamorphic bedrock of the Green Mountains. That bedrock is schist or gneiss formed during a continental collision roughly 400 million years ago. The shallow depth is why Tunbridge soil is so stony: boulders and cobbles in the glacial till have nowhere to sink."

