faq:
- question: What is Vermont's state insect?
  answer: "Vermont's state insect is the European honey bee, adopted by the Vermont General Assembly in 1978."
- question: When did Vermont adopt the European honey bee?
  answer: "Vermont adopted the honey bee as its official state insect in 1978."
- question: Why did Vermont choose the European honey bee?
  answer: "Vermont chose the honey bee because of its importance to agriculture. Bees pollinate crops and orchards across the state and produce honey and beeswax."
- question: What does Vermont's state insect look like?
  answer: "The honey bee has a golden-brown, fuzzy body with dark bands, two pairs of clear wings, and six legs. Worker bees grow to about half an inch long."
- question: Where is the European honey bee found in Vermont?
  answer: "Honey bees are found statewide in Vermont, kept in hives on farms, orchards, and in backyard gardens, and are most active from late spring through early fall."
- question: Is the European honey bee a butterfly, bee, beetle, or dragonfly?
  answer: "The European honey bee is a bee, not a butterfly, beetle, or dragonfly. Its scientific name is Apis mellifera."
- question: Does Vermont have a separate state butterfly?
  answer: "Yes. Vermont named the [monarch butterfly](/states/vermont/insect/monarch-butterfly) its official state butterfly in 1987, separate from the honey bee's designation as state insect."

