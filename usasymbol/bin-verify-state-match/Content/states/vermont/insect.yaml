sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Vermont?
  paragraphs:
  - "The honey bee, Apis mellifera, is Vermont's official state insect. The Vermont General Assembly designated it in 1978."
  - "Honey bees are common across Vermont, kept in managed hives by commercial and backyard beekeepers throughout the state."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee has a golden-brown, fuzzy body marked with dark bands across its abdomen, two pairs of clear wings, and six legs. Its long antennae help it smell and taste."
  - "Worker bees, the ones most people see, grow to about half an inch long. A single hive can hold up to 80,000 bees, including one queen, a small number of male drones, and thousands of worker bees."
  - "Worker bees carry pollen home in special baskets on their hind legs. Only worker bees sting, and each one dies after stinging."

- id: history
  icon: fa-solid fa-landmark
  title: How Vermont Chose the European Honey Bee
  paragraphs:
  - "The Vermont General Assembly named the honey bee the official state insect in 1978."
  - "Lawmakers chose the bee because of its importance to agriculture. Honey bees pollinate crops and orchards across Vermont and produce honey and beeswax."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the European Honey Bee in Vermont
  paragraphs:
  - "European honey bees are found statewide, from commercial hives on farms and orchards to backyard gardens in Vermont's towns and cities. They are most active from late spring through early fall, when flowers and crops are in bloom."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1978, by the Vermont General Assembly."
  - "Scientific name: Apis mellifera."
  - "Appearance: golden-brown, fuzzy body with dark bands, clear wings, and a length of about half an inch for worker bees."
  - "A single hive can hold up to 80,000 bees: one queen, drones, and thousands of worker bees."
  - "Honey bees pollinate many of Vermont's fruit and vegetable crops."




