type: State Seal
state: Indiana
name: Great Seal of Indiana
adopted_year: 1816
revised_year: 1963
is_official: true
legislation: Indiana Code § 1-2-5
meaning: "Indiana's state seal records the defining tension of early 19th-century American expansion: a pioneer felling a tree with an ax as a bison retreats westward. The 18 stars mark Indiana as the 18th state, admitted December 11, 1816. The rising sun signals a new beginning. The design is a single, coherent statement: civilization advancing, wilderness retreating."
author: USA Symbol Team
date_published: '2026-05-09'
date_modified: '2026-05-09'
seo_title: 'Indiana State Seal | Pioneer, Bison & 18 Stars'
seo_description: "Indiana's 1816 seal shows a pioneer, a fleeing bison, and 18 stars marking Indiana as the 18th state."
hero_image: /images/seals/indiana/seal.webp
hero_image_alt: Great Seal of the State of Indiana, featuring a pioneer felling a tree and a bison fleeing west, with 18 stars around the border
hero_image_caption: The Great Seal of Indiana, adopted at statehood in 1816. The woodsman at center-left swings an ax while a bison crosses to the right; rolling hills and a rising sun fill the background, and 18 stars ring the outer edge.
intro_text: "Indiana's state seal, adopted in 1816, shows a pioneer chopping down a tree as a bison retreats westward across a landscape of hills and a rising sun. Eighteen stars around the border mark Indiana's place as the 18th state admitted to the Union on December 11, 1816. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
