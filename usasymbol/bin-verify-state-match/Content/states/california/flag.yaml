sections:
  - id: history
    icon: fa-solid fa-landmark
    title: "History of the California State Flag"
    paragraphs:
      - "On June 14, 1846, a group of American settlers seized the Mexican garrison at Sonoma, declared California an independent republic, and raised a homemade flag. William L. Todd, a relative of Mary Todd Lincoln, painted it. The republic lasted 25 days before U.S. forces claimed California in the Mexican-American War. The flag's design and its name survived."
      - "The original Bear Flag, held by the Society of California Pioneers in San Francisco, burned in the 1906 earthquake fire along with most of the society's collection. For over 50 years after statehood, California had no official state banner. The Native Sons of the Golden West lobbied the legislature to use their marching banner as the basis for an official design."
      - "On February 3, 1911, the California Legislature adopted the current design, ending four decades of competing unofficial versions. The law specified a red star, a brown grizzly walking left, a green grass plot, a red stripe, and the words CALIFORNIA REPUBLIC in condensed gothic type. It set exact proportions, making California's one of the most precisely specified flags in the country."
    subsections:
      - subtitle: "What Was the Original Bear Flag?"
        image: /images/flags/california/original-bear-flag.jpg
        image_caption: "The original Bear Flag raised at Sonoma on June 14, 1846."
        text: "Todd painted the flag on a strip of brown cotton, about a yard and a half long, using red paint he found at hand. Pioneer John Bidwell, who witnessed the raising, wrote that Native Californians watching from below called Todd's rough bear drawing 'coche,' the common Spanish word for pig. A replica made before 1906 now resides in Sonoma."

  - id: symbols
    icon: fa-solid fa-shapes
    title: "California Flag Meaning and Symbolism"
    style: "symbol-cards"
    symbols:
      - id: grizzly-bear
        name: "Grizzly Bear"
        image: symbols/bear.svg
        clip_region: 'circle(28% at 50% 42%)'
        paragraphs:
          - "Centered on the white field, the brown bear walks left, modeled on Monarch, a California grizzly captured in 1889 and kept at Golden Gate Park in San Francisco. The California grizzly is the flag's only element depicting an extinct animal."
      - id: red-star
        name: "Red Star"
        image: symbols/star.svg
        clip_region: 'circle(8% at 17% 20%)'
        paragraphs:
          - "Placed in the upper left corner, the five-pointed red star was inspired by the California Lone Star Flag, a settler design that circulated before the 1846 revolt. Todd carried it over into the original Bear Flag."
      - id: california-republic-text
        name: "CALIFORNIA REPUBLIC"
        image: symbols/california-republic.svg
        clip_region: 'inset(72% 5% 14% 5%)'
        paragraphs:
          - "Running above the red stripe, CALIFORNIA REPUBLIC in condensed gothic letters repeats the wording from Todd's 1846 flag, without the period that appeared on the original. The 1911 law set the letter height and spacing in statute."
      - id: red-stripe
        name: "Red Stripe"
        image: symbols/stripe.svg
        clip_region: 'inset(85% 0% 0% 0%)'
        paragraphs:
          - "A horizontal red stripe runs the full length of the flag at the bottom, one-sixth the hoist width. The stripe's red is specified in California law to match the same shade used on the national flag."

  - id: colors
    icon: fa-solid fa-palette
    title: "Official Colors and Dimensions"
    paragraphs:
      - "California's flag uses five colors defined by Textile Color Card Association cable numbers in state law. The official shades are white (cable 70001), Old Glory Red (cable 70180), Irish Green (cable 70168), Maple Sugar brown (cable 70129), and Seal dark brown (cable 70108)."
    colors:
      - name: "White"
        hex: "#FFFFFF"
      - name: "Red (Old Glory Red)"
        hex: "#BF0A30"
      - name: "Brown (Maple Sugar)"
        hex: "#85622A"
      - name: "Green (Irish Green)"
        hex: "#009A44"
      - name: "Dark Brown (Seal)"
        hex: "#321414"

  - id: extinct-grizzly
    icon: fa-solid fa-circle-exclamation
    title: "Is the Grizzly on California's Flag Extinct?"
    paragraphs:
      - "The California grizzly (Ursus arctos californicus) was hunted to extinction by 1922, with the last confirmed sighting recorded near Sequoia. By that year, the bear design was already on the state flag and in dozens of official uses. In 1953, the California Legislature named the grizzly the state animal, three decades after the last wild one died."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "State law sets six official flag sizes, with hoist widths of two, three, four, five, six, and eight feet."
      - "California's 1911 law positions the bear's eye at the exact midpoint between the top and bottom of the white field."
      - "California entered the Union as the 31st state on September 9, 1850, four years after the Bear Flag revolt."
      - "The grass plot below the bear measures eleven-twelfths of the hoist width in length, per state statute."
      - "The red star's center sits one-sixth of the fly length from the hoist edge, as specified in law."

  - id: previous-versions
    icon: fa-solid fa-flag
    title: "Historical Versions of the Flag"
    versions:
      - name: "California Lone Star Flag"
        years: "1836"
        image: versions/lone-star-1836.webp
        description: "A pre-revolt settler design proposed before 1846, with a lone star on a plain field. Circulated informally among American settlers in Mexican-controlled California."
      - name: "Todd's Bear Flag"
        years: "1846"
        image: versions/todd-bear-1846.webp
        description: "William L. Todd's hand-painted design on brown cotton, raised at Sonoma on June 14, 1846. The Society of California Pioneers held it for six decades before its loss."
      - name: "Early Bear Flag Variant"
        years: "1846"
        image: versions/storm-bear-1846.webp
        description: "A second documented version of the Bear Flag from 1846 showing a different bear rendering. Multiple unofficial variations circulated for four decades before standardization."
      - name: "Standardized State Flag"
        years: "1911 to present"
        image: versions/modern-1911.webp
        description: "Adopted February 3, 1911. The first design to fix exact proportions, five color codes, and condensed gothic lettering in a single statute."

faq:
  - question: "What does the California state flag look like?"
    answer: "California's flag shows a brown grizzly bear on a white field, walking left above a strip of green grass. A five-pointed red star appears in the upper left corner. The words CALIFORNIA REPUBLIC run in condensed gothic letters above a red stripe at the bottom."
  - question: "What animal is on the California flag?"
    answer: "The California grizzly bear (Ursus arctos californicus). The subspecies was hunted to extinction by 1922, eleven years after the flag was officially adopted. It once ranged across California's coastal ranges and Sierra Nevada foothills."
  - question: "What does California Republic mean on the flag?"
    answer: "California Republic was the independent state declared by American settlers at Sonoma in 1846. It lasted less than a month. The Mexican-American War was already underway when the settlers made their move, and U.S. forces absorbed California within weeks."
  - question: "When was the California state flag adopted?"
    answer: "The California Legislature adopted the current standardized design on February 3, 1911. A version of the Bear Flag had been in informal use since 1846, but no official uniform design existed for over 50 years."
  - question: "Who painted the original California Bear Flag?"
    answer: "William L. Todd painted the original Bear Flag at Sonoma in 1846. The design he produced became the basis for the official state flag standardized 65 years later. No additional elements were introduced between the 1846 original and the 1911 law."

