seo_title: "Flag of California | History, Meaning & Colors"
seo_description: "Brown grizzly on white, adopted in 1911, traces to settler William Todd's handmade flag raised at Sonoma on June 14, 1846."
meaning: "California's flag links every element to a documented historical moment. The bear came from Todd's 1846 revolt flag. The star came from a pre-revolt settler design. The text repeated an 1846 republic's declaration. The 1911 law fixed all three into a single standard."

intro_text: "California's state flag shows a **brown grizzly bear** on a **white field** above a **red stripe**, with a **red star** and the words **CALIFORNIA REPUBLIC**, adopted in 1911 by the California Legislature. The bear design traces back to the settler flag raised at Sonoma in 1846, during a revolt against Mexican rule. No other U.S. state flag carries the name of a short-lived independent republic."

