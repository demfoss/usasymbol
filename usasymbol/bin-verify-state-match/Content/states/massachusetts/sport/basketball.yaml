sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Massachusetts State Sport
    paragraphs:
      - "Massachusetts designated basketball the official sport of the commonwealth in 2006, a choice that faced no real competition once lawmakers took it up. Few states can point to a sport that began inside their own borders, and Massachusetts is one of them. The 2006 law simply gave official standing to a claim the state had already held for more than a century."

  - id: what-is
    icon: fa-basketball
    title: "Basketball in Massachusetts"
    paragraphs:
      - "Two teams of five players try to score by shooting a ball through a raised hoop, dribbling to advance the ball and passing to keep possession while the defense contests every shot. Points come from two-point field goals, three-point shots from beyond the arc, and free throws awarded after fouls. The Boston Celtics, Massachusetts' NBA franchise, play home games at TD Garden, a short drive from where the sport began."
      - "That origin sits in Springfield, where physical education instructor James Naismith nailed two peach baskets to a gymnasium balcony in December 1891 and wrote thirteen rules for an indoor game his students could play through the winter. The building belonged to the International YMCA Training School, later renamed Springfield College. The Naismith Memorial Basketball Hall of Fame now stands a few miles from that original gymnasium site."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Basketball Represents Massachusetts
    paragraphs:
      - "Massachusetts did not choose basketball because the sport is popular nationwide; it chose basketball because the sport exists only because of Springfield. Naismith was working at the International YMCA Training School when he invented the game, and no other state can claim the sport's actual birthplace. That distinction set basketball apart from every other sport considered for the honor."
      - "The Boston Celtics turned that origin into decades of results after forming in Boston in 1946, three years before their league merged into the NBA. Behind Bill Russell and coach Red Auerbach, the Celtics won eight consecutive championships from 1959 to 1966, and by 2024 the franchise had won 18 NBA titles, more than any other team in the league. Few states can pair a sport's invention with a professional franchise's sustained success in the same city."
      - "Springfield keeps that history within walking distance. The Naismith Memorial Basketball Hall of Fame, founded in 1959, sits blocks from the site of Naismith's original gymnasium, and Springfield College still trains physical educators in the tradition he started. That combination of invention and institution made basketball an easy choice once Massachusetts decided to name an official sport."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Basketball Became Massachusetts' State Sport
    paragraphs:
      - "Basketball became Massachusetts' official sport in 2006, and the push did not start in a legislative committee. Fourth-graders at the Mulready School in Hudson researched the game's Springfield origins as a class project, drafted the proposal themselves, and persuaded their local lawmakers to file the bill, which Governor Mitt Romney signed that year. The designation arrived 115 years after Naismith invented the sport, making Massachusetts one of the last states to formally claim a game it had already given the world."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Basketball Facts
    facts:
      - "Massachusetts designated basketball the official sport of the commonwealth in 2006."
      - "James Naismith invented basketball in Springfield in 1891, nailing two peach baskets to a gymnasium balcony at the International YMCA Training School."
      - "The bill that made basketball official began as a class project by fourth-graders at the Mulready School in Hudson."
      - "The Naismith Memorial Basketball Hall of Fame was founded in Springfield in 1959."
      - "The Boston Celtics have won 18 NBA championships, the most of any franchise, most recently in 2024."

