faq:
  - question: What is Massachusetts' state sport?
    answer: "Massachusetts' official state sport is basketball, adopted in 2006."
  - question: When did Massachusetts adopt basketball as its state sport?
    answer: "Massachusetts adopted basketball as its state sport in 2006, 115 years after the game was invented in Springfield."
  - question: Why did Massachusetts choose basketball?
    answer: "Basketball was invented in Springfield in 1891 by James Naismith, giving Massachusetts a direct claim no other state can match. The Boston Celtics and the Naismith Memorial Basketball Hall of Fame added to that case."
  - question: What team represents Massachusetts in basketball?
    answer: "The Boston Celtics represent Massachusetts in the NBA and have won a league-record 18 championships, most recently in 2024."

