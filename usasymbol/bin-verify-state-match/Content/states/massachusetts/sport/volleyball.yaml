faq:
  - question: What is Massachusetts' recreational and team sport?
    answer: "Massachusetts' official recreational and team sport is volleyball, adopted in 2014."
  - question: When did Massachusetts adopt volleyball as its state sport?
    answer: "Massachusetts adopted volleyball as its recreational and team sport in 2014, eight years after naming basketball its state sport."
  - question: Why did Massachusetts choose volleyball?
    answer: "Volleyball was invented in Holyoke in 1895 by William G. Morgan, giving Massachusetts a direct claim to a second sport played worldwide. The International Volleyball Hall of Fame in Holyoke added to that case."
  - question: Is volleyball Massachusetts' only official sport?
    answer: "No. Massachusetts also recognizes basketball as its official state sport, adopted in 2006 after being invented in Springfield in 1891."

