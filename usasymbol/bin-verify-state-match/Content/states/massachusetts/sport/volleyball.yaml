sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Massachusetts State Sport
    paragraphs:
      - "Massachusetts designated volleyball its official recreational and team sport in 2014, adding a second sport to a list that already included basketball as the sport of the commonwealth since 2006. Both games trace back to YMCA gymnasiums built a few miles apart in western Massachusetts. Volleyball's 2014 designation gave the game formal recognition it had already held informally in Holyoke since the International Volleyball Hall of Fame opened there in 1987."

  - id: what-is
    icon: fa-solid fa-volleyball
    title: "Volleyball in Massachusetts"
    paragraphs:
      - "Two teams of six players hit a ball back and forth over a net, with each side allowed up to three touches to return it before it lands on their side of the court. Points come from kills, blocks, and opponent errors, and matches are typically decided by winning three of five sets. Massachusetts fields the sport at every level, from beach courts along the coast to gymnasiums in nearly every public high school."
      - "The game began a few miles from where basketball was invented, at the Holyoke YMCA in 1895. Physical education director William G. Morgan combined elements of basketball, baseball, tennis, and handball into a game he called Mintonette, designed for members who found basketball too rough. A colleague watching the game noted that players were mostly volleying the ball back and forth, and the name volleyball replaced Mintonette within a year."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Volleyball Represents Massachusetts
    paragraphs:
      - "Massachusetts already had a claim to inventing basketball, and volleyball gave the state a second sport born entirely within its borders. Morgan invented the game in 1895 at the Holyoke YMCA, about twenty miles from Springfield, where Naismith had invented basketball four years earlier. Few states can claim the birthplace of one widely played sport, and Massachusetts can claim two."
      - "Holyoke turned that origin into a lasting institution. The International Volleyball Hall of Fame opened there in 1987 and has inducted players, coaches, and organizers from around the world every year since. That institution gave state lawmakers a concrete reason to add volleyball to the commonwealth's official symbols."
      - "Volleyball is also a sport most Massachusetts residents play rather than watch. Youth leagues, school teams, and beach courts along the coast keep participation high across every age group, matching the description lawmakers chose when they named it a recreational and team sport rather than simply a spectator sport."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Volleyball Became Massachusetts' Recreational and Team Sport
    paragraphs:
      - "Massachusetts designated volleyball its official recreational and team sport in 2014, eight years after basketball became the sport of the commonwealth. State Senator Michael Knapik had introduced the designation in earlier legislative sessions without success, including one attempt that passed the Senate but died in the House amid pushback from lawmakers who favored soccer. The bill finally passed in 2014 with Representative Aaron Vega of Holyoke as House co-sponsor, clearing the Senate 39-0 and the House without recorded opposition before Governor Deval Patrick signed it into law on July 31, 2014."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Volleyball Facts
    facts:
      - "Massachusetts designated volleyball its official recreational and team sport on July 31, 2014, when Governor Deval Patrick signed the bill into law."
      - "William G. Morgan invented volleyball at the Holyoke YMCA in 1895, originally naming it Mintonette."
      - "An earlier attempt at the designation passed the Massachusetts Senate in a prior session but died in the House amid opposition from lawmakers who favored soccer."
      - "The International Volleyball Hall of Fame has stood in Holyoke since 1987."
      - "Massachusetts also recognizes basketball as its state sport, adopted in 2006 after being invented in Springfield in 1891."

