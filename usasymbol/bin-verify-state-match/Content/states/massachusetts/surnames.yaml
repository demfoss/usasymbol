    ratio: 368
    origin: irish
    type: Patronymic
    meaning: "From Irish \"O Murchadha,\" descendant of Murchadh, a personal name often interpreted as sea warrior. Murphy's high rank fits a state where Boston, Charlestown, and later mill cities drew large Irish Catholic communities in the 19th century."

