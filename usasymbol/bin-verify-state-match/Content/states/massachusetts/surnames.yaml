seo:
  title: "Most Common Surnames in Massachusetts"
  description: "Massachusetts' most common surnames are Sullivan, Johnson, and Brown, shaped by Irish Boston and Portuguese South Coast roots."

page:
  h1: "Most Common Surnames in Massachusetts"
  intro: "Sullivan is the most common surname in Massachusetts, followed by Johnson and Brown, and the list is unusually Irish from top to bottom. Boston's famine-era Irish migration, Lowell's and Worcester's mill-city growth, and Portuguese settlement in New Bedford and Fall River pushed names like Murphy, McCarthy, Walsh, Silva, and Kelly far higher here than in most states."
  heritage_title: "Irish Boston, Mill Cities, and the Portuguese South Coast"
  heritage_body: "Massachusetts absorbed one of the country's largest Irish inflows during and after the Great Famine; in 1847 alone Boston's Irish-born population jumped by more than 13,000, and by 1855 the city had more than 50,000 Irish residents. Textile cities such as Lowell, Lawrence, and Worcester then layered on French-Canadian and other immigrant surnames during the late 19th century. On the South Coast, whaling and later factory work tied New Bedford and Fall River to the Azores, Madeira, and Cape Verde, which helps explain why Silva ranks in the top 20 and names like Medeiros and Cabral are so visible statewide."
  fun_fact: "Massachusetts is one of the few states where Smith does not make the top 20 at all; seven clearly Irish surnames, including Sullivan, Murphy, McCarthy, Walsh, Kelly, Burke, and Collins, rank ahead of it."

