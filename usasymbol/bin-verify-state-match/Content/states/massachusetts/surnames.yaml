    meaning: "From Irish \"O Suileabhain,\" usually glossed as descendant of Suileabhan, a personal name associated with dark eyes. It leads Massachusetts because Boston became one of the main destinations for Irish migration during and after the Great Famine, turning an already familiar Irish surname into the state's most common one."

