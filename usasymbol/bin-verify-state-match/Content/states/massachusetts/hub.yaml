seo_description: "Massachusetts symbols include the black-capped chickadee, mayflower, American elm, Atlantic cod, and the state motto and flag."
snippet_answer: Find out more about the official state symbols that represent Massachusetts, from the black-capped chickadee and mayflower to the Atlantic cod and the Ense Petit motto. Bay Colony origins, Revolutionary history, and an ongoing debate over the state flag make Massachusetts's list one of the most historically layered in New England.
