seo_title: "Massachusetts License Plate Slogan | The Spirit of America"
seo_description: "The Spirit of America is the Massachusetts standard license plate slogan, used since the 1990s and based on the state's former nickname."
hero_image: /images/license-plates/massachusetts/spirit-of-america-plate.jpg
hero_image_alt: Massachusetts license plate with The Spirit of America slogan in blue lettering on white
hero_image_caption: The standard Massachusetts passenger plate — white reflective base, red embossed serial, and "The Spirit of America" screened in blue at the bottom. In use as the standard design since 1993.
intro_text: '**"The Spirit of America"** is the only slogan Massachusetts has placed on a standard general-issue license plate. It became standard in 1993, after nine decades with no slogan. The phrase shortens the state promotional line "The Spirit of Massachusetts is the Spirit of America," while the current red-on-white base traces back to 1987. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans).'
quick_answer: '"The Spirit of America" has been on Massachusetts standard passenger plates since 1993 — the first time in the state''s plate-issuing history, which dates to 1903, that any slogan appeared on a standard general-issue design. The phrase was shortened from the state promotional motto "The Spirit of Massachusetts is the Spirit of America." Before 1993, standard Massachusetts plates carried no slogan; the current red-on-white design with blue text has been the standard since.'
