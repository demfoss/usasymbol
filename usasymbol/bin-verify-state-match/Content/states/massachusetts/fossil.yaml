- id: facts
  icon: fa-solid fa-lightbulb
  title: Dinosaur Tracks Facts
  facts:
  - "Massachusetts adopted Eubrontes giganteus as its state fossil in 1980."
  - "Each track can be up to 15 inches long, pointing to a track-maker roughly 20 feet in length."
  - "Edward Hitchcock catalogued Connecticut Valley tracks starting in 1835 and spent decades believing they were made by giant birds."
  - "The Beneski Museum at Amherst College holds thousands of Early Jurassic track specimens from the Connecticut River Valley."
  - "Eubrontes giganteus is an ichnogenus — a scientific name for the track itself, not for the animal that made it."

