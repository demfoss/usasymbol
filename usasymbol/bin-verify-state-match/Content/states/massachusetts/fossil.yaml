faq:
- question: What is Massachusetts's state fossil?
  answer: "Massachusetts's state fossil is Eubrontes giganteus, a large three-toed dinosaur track from the Early Jurassic period, about 200 million years old."
- question: When did Massachusetts adopt its state fossil?
  answer: "Massachusetts designated Eubrontes giganteus as its state fossil in 1980."
- question: What did the dinosaur tracks look like?
  answer: "Each track is three-toed and up to 15 inches long, pressed into what was once soft mud along a prehistoric lakeshore. The animal that left them was probably about 20 feet long."
- question: Where are dinosaur track fossils found in Massachusetts?
  answer: "Most tracks are found in the Connecticut River Valley. The Dinosaur Footprints Reservation in Holyoke has hundreds of tracks on a sandstone shelf open to the public."
- question: When did the dinosaur tracks' maker live?
  answer: "The tracks were made about 200 million years ago during the Early Jurassic period, when the Connecticut River Valley was a chain of shallow rift lakes."
- question: Who pushed to make it the state fossil?
  answer: "The designation honored Edward Hitchcock, who catalogued Connecticut Valley trackways beginning in 1835 and built one of the world's first major fossil track collections."

