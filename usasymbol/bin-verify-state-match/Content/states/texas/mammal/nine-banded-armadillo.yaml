faq:
  - question: "What is Texas's state small mammal?"
    answer: "Texas's state small mammal is the nine-banded armadillo (Dasypus novemcinctus), designated in 1995. Texas is the only state to recognize the armadillo as an official state symbol."
  
  - question: "When was the armadillo designated as Texas's state mammal?"
    answer: "The nine-banded armadillo became Texas's official state small mammal in 1995 when the 74th Legislature passed House Concurrent Resolution No. 18, sponsored by Representative Bob Hunter. The same legislative session also designated the Texas longhorn as the official large mammal, creating separate categories for large and small mammals."
  
  - question: "Why did Texas choose the armadillo as a state symbol?"
    answer: "Texas chose the armadillo because the species uniquely represents the state's independent character and frontier toughness through its distinctive armor shell. The armadillo embodies Texas's willingness to embrace the unconventional rather than choosing predictable symbols. The species' origins in Mexico and gradual colonization of Texas mirror the state's border culture. By 1995, the armadillo had already become a cultural icon in Texas artwork, music, and folklore, making official recognition simply acknowledge what had happened organically."
  
  - question: "Are armadillos native to Texas?"
    answer: "Nine-banded armadillos are native to the Americas but were not historically present in Texas until the mid-1800s. The species evolved in South America and gradually expanded northward through Central America and Mexico. Armadillos crossed the Rio Grande into south Texas during the 1850s and naturally colonized most of the state over the next century. While technically a recent arrival from a geological perspective, the armadillo has inhabited Texas for over 170 years and is considered part of the state's native wildlife."
  
  - question: "Do armadillos carry diseases?"
    answer: "Nine-banded armadillos can carry the bacteria that causes Hansen's disease (leprosy), making them one of few wild animals susceptible to this infection. However, transmission to humans is extremely rare and requires direct contact with armadillo tissues or blood. The vast majority of armadillo encounters pose no disease risk. Avoid handling armadillos, particularly dead ones, and always wear gloves if contact is necessary. The species' susceptibility to leprosy bacteria has made armadillos valuable for medical research into treatments for Hansen's disease."
  
  - question: "Why do so many armadillos get hit by cars?"
    answer: "Armadillos have an instinctive defense behavior that causes roadway deaths. When startled by sudden sounds or vibrations, armadillos leap straight upward three to four feet into the air. This jumping reflex protected armadillos from ancient predators that attacked with downward bites or pounces. On modern roads, the jumping response causes armadillos to leap directly into the undercarriage of passing vehicles at precisely the wrong moment. Armadillos also have poor eyesight and rely primarily on smell, so they may not detect approaching vehicles until too late."
  
  - question: "Can armadillos roll into a ball?"
    answer: "Nine-banded armadillos cannot fully roll into a ball like the three-banded armadillo species found in South America. The nine-banded species has too many armor bands and its body proportions prevent complete ball formation. When threatened, nine-banded armadillos typically attempt to burrow straight down into soft soil using powerful front claws, or they jump vertically into the air. They may curl somewhat to protect their soft underside, but they cannot achieve the complete sphere that makes three-banded armadillos famous."
  
  - question: "Where can I see armadillos in Texas?"
    answer: "Armadillos are common throughout eastern two-thirds of Texas, with highest populations in south and central regions. Look for them during summer evenings in parks, golf courses, and natural areas with loose soil. Central Texas locations including Enchanted Rock State Natural Area, Pedernales Falls State Park, and urban parks around Austin and San Antonio offer reliable viewing. South Texas brushlands near Laredo, Corpus Christi, and the Rio Grande Valley have abundant populations visible along ranch roads at dawn and dusk."

