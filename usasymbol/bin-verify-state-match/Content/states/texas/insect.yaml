faq:
- question: What is Texas's state insect?
  answer: "Texas's state insect is the monarch butterfly, adopted by the Texas Legislature in 1995."
- question: When did Texas adopt the monarch butterfly?
  answer: "Texas adopted the monarch butterfly as its official state insect in 1995."
- question: What does Texas's state insect look like?
  answer: "The monarch has bright orange wings crossed by black veins, with a black border dotted with white spots. It has a wingspan of about 3.5 to 4 inches."
- question: Where is the monarch butterfly found in Texas?
  answer: "Monarchs pass through Texas during both fall and spring migration, with Central Texas and the San Antonio area among the most reliable places to see large numbers."
- question: Is the monarch a butterfly or a moth?
  answer: "The monarch is a butterfly, not a moth, and one of the largest and most recognizable butterflies found in Texas."
- question: Why is Texas important to monarch migration?
  answer: "Texas sits on the Texas funnel, the narrow corridor where the shape of the state channels most of the eastern monarch population during both the fall and spring migrations."

