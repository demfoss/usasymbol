sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Texas?
  paragraphs:
  - "The monarch butterfly, Danaus plexippus, is Texas's official state insect. The Texas Legislature designated it in 1995."
  - "Texas is not just a place monarchs visit. The state sits directly on the migration path monarchs use every spring and fall between the northern United States and their overwintering grounds in Mexico."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Monarch Butterfly
  paragraphs:
  - "A monarch has bright orange wings crossed by thick black veins, with a black border dotted with two rows of small white spots. Males have a small black scent patch on each hind wing that females lack."
  - "Adult monarchs have a wingspan of about 3.5 to 4 inches, one of the larger butterflies found in Texas."
  - "Monarch caterpillars are banded in white, yellow, and black, and feed only on milkweed. That single food source is why milkweed plantings matter so much for the species."

- id: history
  icon: fa-solid fa-landmark
  title: How Texas Chose the Monarch Butterfly
  paragraphs:
  - "The Texas Legislature named the monarch butterfly the official state insect in 1995."
  - "Official sources confirm the designation and its year but do not give a detailed account of the selection process."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Monarch Butterfly in Texas
  paragraphs:
  - "Texas lies along a narrow migratory corridor that monarch researchers often call the Texas funnel, where the shape of the state channels most of the eastern monarch population through Central Texas each year."
  - "The fall migration moves through Texas from roughly September through November on the way to overwintering sites in central Mexico, and a spring migration passes back through the state as monarchs return north and lay eggs on emerging milkweed."
  - "Central Texas, including the Hill Country and the San Antonio area, is one of the most reliable places in the state to see large numbers of monarchs during migration."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Monarch Butterfly Facts
  facts:
  - "Adopted in 1995 by the Texas Legislature."
  - "Scientific name: Danaus plexippus."
  - "Wingspan: about 3.5 to 4 inches, with bright orange wings, black veins, and white-spotted black borders."
  - "Texas sits on the Texas funnel, the narrow corridor most eastern monarchs pass through during both fall and spring migration."
  - "Caterpillars feed only on milkweed, which makes milkweed habitat critical to the species across Texas."




