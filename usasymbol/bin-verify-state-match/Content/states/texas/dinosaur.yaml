    description: "Texas House Bill 1107 updates the state dinosaur designation from Pleurocoelus to Paluxysaurus jonesi — one of the few times a US state has revised an existing dinosaur symbol"

expert_quote:
  text: "Paluxysaurus jonesi represents a new genus and species of titanosauriform sauropod from the Twin Mountains Formation of north-central Texas."
