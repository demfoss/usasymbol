  - year: "1997"
    description: "Texas designates Pleurocoelus as its state dinosaur — the name in use at the time for the state's Early Cretaceous sauropod material"
  - year: "2007"
    description: "Peter Rose formally describes Paluxysaurus jonesi from Hood County material, recognizing the Texas sauropod as a distinct genus from Maryland's Pleurocoelus"
