faq:
  - question: "What is Texas's state dinosaur?"
    answer: "Texas's state dinosaur is Paluxysaurus jonesi. It was adopted in 2009."

  - question: "Why did Texas change its state dinosaur from Pleurocoelus to Paluxysaurus?"
    answer: "Because later research showed the Texas fossils needed their own genus name."

  - question: "What does Paluxysaurus jonesi mean?"
    answer: "It means 'lizard of the Paluxy,' and jonesi honors the Jones Ranch."

  - question: "Did Paluxysaurus make the dinosaur tracks at Glen Rose?"
    answer: "Possibly. It is a reasonable match for the large sauropod tracks there."

  - question: "Could Texas's state dinosaur change again?"
    answer: "Possibly, if future taxonomy changes the name again."

  - question: "Where can I see the Glen Rose dinosaur tracks?"
    answer: "You can see them at Dinosaur Valley State Park in Glen Rose."

