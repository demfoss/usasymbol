faq:
- question: What is Alabama's state marine mammal?
  answer: Alabama's official state marine mammal is the West Indian manatee (Trichechus manatus), designated by the Alabama Legislature in 2009.
- question: When did Alabama designate the West Indian manatee?
  answer: Alabama designated the West Indian manatee as its official state marine mammal in 2009, after a student-led campaign from fourth graders at St. Ignatius Catholic School in Mobile.
- question: Is Alabama's state marine mammal the same as its state mammal?
  answer: No. They are separate designations. Alabama's state mammal is the American black bear (2006). Alabama's state marine mammal is the West Indian manatee (2009). Both designations came after student-led campaigns.
- question: Why did Alabama choose the West Indian manatee?
  answer: The manatee was nominated by fourth graders at a Mobile school who wanted the public to be more aware of the species. It was also an appropriate choice because manatees have a documented presence in Alabama's coastal waters, particularly Mobile Bay and the Gulf Coast.
- question: Are manatees actually found in Alabama?
  answer: Yes. Manatees are documented in Mobile Bay and other Alabama coastal waters, primarily during warmer months. The Dauphin Island Sea Lab operates a Manatee Sighting Network — the first such tracking network outside Florida — specifically for the northern Gulf of Mexico, including Alabama waters.
- question: Is the West Indian manatee endangered or threatened?
  answer: As of 2017, the U.S. Fish and Wildlife Service classifies the West Indian manatee as threatened under the Endangered Species Act, reclassified from endangered. The species remains protected under both the ESA and the Marine Mammal Protection Act. Some older sources still say endangered — the current federal designation is threatened.
- question: Who sponsored the Alabama manatee bill?
  answer: Representative Jim Barton sponsored the bill in the Alabama Legislature. The campaign behind it was led by fourth graders at St. Ignatius Catholic School in Mobile, who organized to advocate for the designation.
