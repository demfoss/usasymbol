sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Alabama?
  paragraphs:
  - "The eastern tiger swallowtail, Papilio glaucus, is Alabama's official state butterfly and state mascot. The Alabama Legislature designated it in 1989."
  - "Unlike the monarch butterfly, Alabama's separate state insect, the eastern tiger swallowtail lives in Alabama year-round rather than passing through on migration."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Eastern Tiger Swallowtail
  paragraphs:
  - "The eastern tiger swallowtail is a large yellow butterfly marked with four black tiger-like stripes on each forewing and a black border along the wing edges. Each hindwing ends in a narrow tail."
  - "Adults have a wingspan of about 3 to 5.5 inches, among the largest butterflies in Alabama. Some females have a dark, almost black form instead of the typical yellow coloring, which is thought to help them mimic the toxic pipevine swallowtail."
  - "Caterpillars start out looking like bird droppings and later turn green with large eyespots that make them look like small snakes, a defense against predators."

- id: history
  icon: fa-solid fa-landmark
  title: How Alabama Chose the Eastern Tiger Swallowtail
  paragraphs:
  - "The push for a state butterfly began in Selma, where resident Mallieve Breeding, known locally as the Butterfly Lady, campaigned for official recognition of a native Alabama butterfly."
  - "Breeding argued for the eastern tiger swallowtail over the monarch, pointing out that monarchs only pass through Alabama during migration while eastern tiger swallowtails live in the state year-round. The Selma City Council backed the request, and the Alabama Legislature made it official in 1989."
  - "Alabama named the monarch butterfly its state insect the same year, making it one of the few states with separate state insect and state butterfly designations."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Eastern Tiger Swallowtail Facts
  facts:
  - "Adopted: 1989, by the Alabama Legislature, which also named it the official state mascot."
  - "Scientific name: Papilio glaucus."
  - "Wingspan: about 3 to 5.5 inches, with yellow wings, black tiger stripes, and tailed hindwings."
  - "Some females have an all-dark wing form instead of yellow, mimicking the toxic pipevine swallowtail."
  - "Championed by Selma's Mallieve Breeding, known as the Butterfly Lady, who argued it lives in Alabama year-round unlike the migratory monarch."




