faq:
- question: What is Alabama's state butterfly?
  answer: "Alabama's state butterfly is the eastern tiger swallowtail, adopted by the Alabama Legislature in 1989."
- question: When did Alabama adopt the eastern tiger swallowtail?
  answer: "Alabama adopted the eastern tiger swallowtail as its official state butterfly in 1989."
- question: Why did Alabama choose the eastern tiger swallowtail?
  answer: "Selma resident Mallieve Breeding, known as the Butterfly Lady, campaigned for the swallowtail over the monarch because it lives in Alabama year-round, while monarchs only migrate through."
- question: What does the eastern tiger swallowtail look like?
  answer: "It is a large yellow butterfly with black tiger-like stripes, a black wing border, and narrow tails on the hindwings. It has a wingspan of about 3 to 5.5 inches."
- question: Is the eastern tiger swallowtail the same as Alabama's state insect?
  answer: "No. Alabama's state insect is the monarch butterfly. The eastern tiger swallowtail is a separate designation, the official state butterfly and state mascot, adopted the same year."

