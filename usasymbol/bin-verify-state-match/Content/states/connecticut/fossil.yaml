- id: facts
  icon: fa-solid fa-lightbulb
  title: Dinosaur Tracks Facts
  facts:
  - "Connecticut designated Eubrontes giganteus as its state fossil in 1991. Over 500 of these tracks are preserved at Dinosaur State Park in Rocky Hill."
  - "Each Eubrontes track is about 15 inches long and three-toed, made by a large theropod dinosaur walking through soft mud about 200 million years ago."
  - "Geologist Edward Hitchcock studied Connecticut Valley tracks from the 1820s onward and died in 1864 still believing they had been made by giant ancient birds, not dinosaurs."
  - "The Rocky Hill tracks were discovered in 1966 by a state construction crew excavating for a building. The state halted construction and preserved the site instead."
  - "Eubrontes giganteus is an ichnospecies name assigned to the tracks, not to the animal. The species that made them has never been definitively identified."

