faq:
- question: What is Connecticut's state fossil?
  answer: "Connecticut's state fossil is the Dinosaur Track, specifically the ichnospecies Eubrontes giganteus. It is a three-toed theropod dinosaur footprint from the Early Jurassic, designated in 1991."
- question: When did Connecticut adopt its state fossil?
  answer: "Connecticut adopted Eubrontes giganteus as its state fossil in 1991. The tracks had been a protected natural landmark since Dinosaur State Park opened in 1968."
- question: What do the Dinosaur Tracks look like?
  answer: "Each Eubrontes giganteus track is three-toed and forward-pointing, about 15 inches long. The tracks appear as depressions in brownish-red Jurassic sandstone, sharp enough to show the outline of individual toes."
- question: Where are Dinosaur Tracks found in Connecticut?
  answer: "The largest concentration is at Dinosaur State Park in Rocky Hill, where over 500 tracks are preserved under an exhibit building. Tracks from the same Portland Formation also appear along the Connecticut River Valley north into Massachusetts."
- question: When did the Dinosaur Tracks form?
  answer: "The tracks were made about 200 million years ago during the Early Jurassic period, when the Connecticut River Valley was a warm lowland crossed by rivers and shallow lakes near the margin of the forming Atlantic Ocean."
- question: Who studied Connecticut's dinosaur tracks?
  answer: "Edward Hitchcock, a geologist and president of Amherst College, cataloged Connecticut Valley tracks from the 1820s through the 1850s and built the world's largest collection of fossil tracks. He believed they were made by giant birds; they were later correctly identified as dinosaur footprints."

