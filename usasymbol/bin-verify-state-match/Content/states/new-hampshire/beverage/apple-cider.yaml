sections:
- id: what-nh-apple-cider-is
  icon: fa-solid fa-flask
  title: 'Fresh-Pressed vs. Hard Cider: What New Hampshire''s State Beverage Actually Is'
  paragraphs:
  - 'In most of the country, the word cider has become ambiguous — it might mean juice, it might mean an alcoholic craft drink. In New Hampshire, it means one specific thing: fresh-pressed juice made from whole apples, run through a cider press, unfiltered, and sold in a jug the same day or the next. That amber-brown color, the slight cloudiness, the way it smells like the orchard it came from — these are not accidental qualities. They are what happens when you press apples instead of juicing them.'
  - Most NH presses run a blend — McIntosh for body, Cortland or Macoun for acidity, Honeycrisp when the season cooperates. An orchard in Hollis pressing a Cortland-forward blend makes something noticeably different from a Wolfeboro press running mostly McIntosh in October. That variability is a feature, not a quality-control failure.
  - 'Hard cider — fermented, alcoholic — is a separate category, and a growing one in New Hampshire. But when the legislature chose apple cider as the state beverage, it was naming the fresh product: the drink that appears at farm stands in September and disappears when the season ends.'
- id: orchards-and-pressing
  icon: fa-solid fa-tree
  title: Why New Hampshire Apple Orchards Never Industrialized
  paragraphs:
  - The orchard culture that survived into the twenty-first century is concentrated in the Monadnock Region in the southwest, the Merrimack Valley through the center of the state, and the Lakes Region further north. Towns like Hollis, Wilton, and Milford in Hillsborough County contain some of the state's oldest continuously operating orchards. Picking season runs from late August through October, with the cider press often running from September straight through November.
  - 'New Hampshire orchards never industrialized the way fruit agriculture did in warmer states. The short growing season, the granite-shot soil, and the cold winters produced a particular kind of apple farming: smaller operations, more varieties per acre, and a product sold close to where it was grown. That structure is why New Hampshire cider tends to vary meaningfully from one orchard to the next — and why the drink has stayed tied to place in a way that mass-produced juices cannot replicate.'
- id: why-nh-designated-apple-cider
  icon: fa-solid fa-landmark
  title: Why Apple Cider Became New Hampshire's Official State Beverage
  paragraphs:
  - The 2020 designation was not a close call. Apple cider did not need to be argued for — it needed to be acknowledged. New Hampshire families drive to the same orchards in October that their parents drove to, and the beverage's claim on the state predates the state itself.
  - Unlike wine, beer, or coffee — drinks with genuine but diffuse connections to American agricultural culture — apple cider points directly at a single industry on actual working land in New Hampshire right now. The orchards are not heritage sites. They are operating farms. The [New Hampshire Division of Agricultural Development](https://www.agriculture.nh.gov/) tracks more than 80 active operations across the state. Designating cider was a way of naming something New Hampshire actually produces, not something it merely consumes.
- id: fall-harvest-culture
  icon: fa-solid fa-star
  title: Apple Cider Season in New Hampshire
  paragraphs:
  - The orchard circuit runs alongside foliage season, which is about as natural as scheduling gets — the same weeks that pull people out of cities to look at color also ripen the late varieties and get the presses running. Apple picking weekends at farms like Alyson's Orchard in Walpole or Mack's Apples in Londonderry are not novelties. They are routines that families repeat across generations, with cider as the thing that goes home at the end.
  - The drink moves through the season with a kind of informal authority — at school fundraisers, at church fairs, at farm stands on two-lane roads where an honor-system cash box sits next to a stack of gallon jugs. It is not marketed in New Hampshire so much as it is assumed. Visitors discover it. Residents take it for granted the way you take a landscape for granted.
  - Hard cider has grown alongside it, with cideries like Poverty Lane Orchards producing nationally recognized fermented products. But the state beverage designation landed on the fresh version — the one that cannot survive pasteurization without changing character, the one you have to be in New Hampshire to drink at its best. The geography is built into the designation.
timeline:
- year: 1600s
  description: European settlers establish apple orchards across the New Hampshire seacoast and southern interior. Cider becomes a household staple on colonial farms throughout the region.
- year: 1700s–1800s
  description: Apple cultivation spreads through Hillsborough, Cheshire, and Merrimack counties. Nearly every working farm in southern New Hampshire maintains an orchard; cider presses operate seasonally at farms and small-scale cooperatives.
- year: Late 1800s–early 1900s
  description: Temperance movement reduces cider consumption significantly. Many orchards are uprooted across New England. New Hampshire retains a denser orchard presence than states further south, particularly in its southwestern counties.
- year: Mid-20th century
  description: Orchard farming stabilizes in New Hampshire as agritourism and direct-to-consumer sales give small operations a viable model. Apple picking weekends become a regional tradition anchored to September and October.
- year: '2020'
  description: Governor Chris Sununu signs HB 1154, designating apple cider as New Hampshire's official state beverage — formally recognizing an agricultural product tied to three centuries of Granite State orchard culture.
faq:
- question: What is New Hampshire's state beverage?
  answer: New Hampshire's official state beverage is apple cider. The state designated it in 2020 under legislation signed by Governor Chris Sununu.
- question: When did New Hampshire designate apple cider as its state beverage?
  answer: New Hampshire designated apple cider as the official state beverage in 2020.
- question: Is the New Hampshire state beverage hard cider or fresh cider?
  answer: Fresh-pressed, unfiltered, non-alcoholic apple cider — not hard cider. Hard cider is fermented and alcoholic; the state beverage designation applies to the traditional fresh-pressed product sold at New Hampshire farm stands and orchards.
- question: Why did New Hampshire choose apple cider as its state beverage?
  answer: Apple cultivation has been part of New Hampshire's agricultural identity since the colonial era. The state has more than 80 active orchards, primarily in the Monadnock Region, Merrimack Valley, and Lakes Region. Designating cider was a recognition of a three-century agricultural tradition still actively producing on working farms across the state.
- question: Which apples go into New Hampshire cider?
  answer: Most New Hampshire cideries blend varieties for balance. McIntosh, Cortland, Macoun, and Honeycrisp are among the most commonly used. Different orchards produce noticeably different ciders depending on variety selection and blending ratios.
- question: Where are the main apple-growing regions in New Hampshire?
  answer: Southern and central New Hampshire hold the densest orchard concentrations — particularly the Monadnock Region in the southwest, the Merrimack Valley through the center of the state, and the Lakes Region to the north. Hillsborough County towns like Hollis, Milford, and Londonderry are especially active.
- question: Does New Hampshire have a hard cider industry?
  answer: Yes. New Hampshire has a growing number of cideries producing fermented, alcoholic hard cider, with Poverty Lane Orchards among the most recognized. The state beverage designation covers fresh cider, not hard cider, but both industries draw on the same orchard base.
