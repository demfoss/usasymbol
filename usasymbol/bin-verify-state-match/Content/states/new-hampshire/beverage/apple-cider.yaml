intro_text: <strong>Apple cider is New Hampshire's official state beverage</strong>, designated in <strong>2020</strong> by Governor Chris Sununu. Fresh-pressed, unfiltered, and non-alcoholic, it is what New England means when it just says cider — and it has been coming off New Hampshire presses since the colonial era. The Granite State has more than 80 orchards producing hundreds of thousands of gallons every season. The designation did not manufacture a connection. It ratified one. This profile appears in the [list of U.S. state beverages](/symbols/beverages).
