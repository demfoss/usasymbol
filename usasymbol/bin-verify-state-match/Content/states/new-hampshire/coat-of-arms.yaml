type: State Coat of Arms
state: New Hampshire
name: New Hampshire State Coat of Arms
adopted_year: 1932
is_official: true
meaning: "The New Hampshire coat of arms connects two founding moments. The frigate Raleigh, built in 1776, represents the state's direct contribution to the Continental Navy and the American Revolution. The nine stars in the laurel wreath count New Hampshire's place as the ninth state to ratify the Constitution, the vote that put the document into effect. The granite boulder in the foreground reflects the physical landscape that shaped the state."
meaning_title: Meaning of the New Hampshire Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'New Hampshire Coat of Arms: Meaning, Symbols and History'
seo_description: "The New Hampshire coat of arms was adopted in 1932 and shows the frigate Raleigh with nine stars and a laurel wreath, representing the state's naval past."
hero_image: /images/coats-of-arms/new-hampshire/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of New Hampshire, adopted 1932, showing the frigate Raleigh on shipbuilding stocks surrounded by a laurel wreath with nine stars and a granite boulder in the foreground
hero_image_caption: The New Hampshire Coat of Arms, standardized January 1, 1932. The design shows the frigate Raleigh under construction on its stocks, a granite boulder in the foreground, a rising sun behind the ship, and a laurel wreath with nine interspersed stars. The date 1776 appears at the base.
intro_text: "The New Hampshire coat of arms centers on the frigate Raleigh, a warship built in 1776 and one of the first 13 commissioned by the Continental Congress, shown still under construction on its shipbuilding stocks. The current standardized design dates to 1931, when historian Otis G. Hammond discovered inconsistencies in earlier versions and Governor John G. Winant formed a committee to fix them, including removing rum barrels that artists had quietly added to the dock over the years. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the New Hampshire Coat of Arms?
  paragraphs:
  - "New Hampshire does not have a separate heraldic coat of arms. The state uses the Great Seal of New Hampshire as its official emblem, and its central design functions as the coat of arms in official and heraldic contexts."
  - "The design shows the frigate Raleigh sitting on shipbuilding stocks, as if still being built. A rising sun appears behind the ship. A granite boulder sits in the foreground on the left. A U.S. flag flies at the ship's stern."
  - "A golden laurel wreath frames the entire scene. Nine stars are spaced evenly within the wreath. The date 1776 appears at the base, and the inscription reads 'SEAL OF THE STATE OF NEW HAMPSHIRE.' The seal is 2 inches in diameter."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the New Hampshire Coat of Arms
  paragraphs:
  - "New Hampshire's first official seal was created by the First Provincial Congress in 1774 or 1775. It featured a pine tree and an upright fish standing on either side of a bundle of five arrows, representing the state's five counties and their combined strength. This colonial design carried the Latin motto Vis Unita Fortior, meaning 'A united force is stronger.'"
  - "When New Hampshire's state constitution took effect in 1784, the Legislature revised the seal to reflect a different identity. Portsmouth had become one of the most active shipbuilding centers in the new nation during the Revolutionary War, and the revised design showed a ship under construction on its stocks with a rising sun behind it. That basic image has remained on the seal ever since."
  - "The 1784 design had one serious problem: no one had described its details precisely enough. As old seals wore out and new dies were cut, different artists interpreted the scene in their own way. Over time, unauthorized elements appeared in the design. The most notable was rum barrels on the dock, which had no place in an official state emblem."
  - "In 1931, historian Otis G. Hammond examined existing seal impressions and documented the inconsistencies. Governor John G. Winant formed a committee to produce a permanent standardized version. The committee identified the frigate Raleigh as the specific ship in the design, removed the rum barrels and other unauthorized additions, replaced the Latin inscription with English text, and specified the seal's exact diameter as 2 inches. The statute codifying the new design took effect on January 1, 1932."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the New Hampshire Coat of Arms
  paragraphs:
  - "The New Hampshire coat of arms is built around the frigate Raleigh and the scene of its construction. Each element connects to either the Revolutionary War or the founding of the United States."
  elements:
  - id: raleigh
    name: The Frigate Raleigh
    image: /images/coats-of-arms/new-hampshire/elements/raleigh.webp
    paragraphs:
    - "The frigate Raleigh occupies the center of the design, shown on its building stocks as if still under construction. The ship was built in 1776 in Portsmouth, New Hampshire, and was one of the first 13 warships authorized by the Continental Congress for the new American navy."
    - "Showing the Raleigh on its stocks rather than at sea was a deliberate choice. It places the image at the moment of construction, connecting the seal directly to New Hampshire's role in building the nation's first navy."
  - id: nine-stars
    name: Nine Stars
    image: /images/coats-of-arms/new-hampshire/elements/stars.webp
    paragraphs:
    - "Nine stars are spaced evenly through the laurel wreath. They represent New Hampshire's position as the ninth state to ratify the U.S. Constitution, on June 21, 1788. New Hampshire's vote was the decisive one: nine of thirteen states were required for the Constitution to take effect, and New Hampshire was the ninth."
  - id: laurel-wreath
    name: Laurel Wreath
    image: /images/coats-of-arms/new-hampshire/elements/laurel.webp
    paragraphs:
    - "A golden laurel wreath frames the entire scene, with the nine stars spaced within its leaves. According to official sources, the laurel wreath symbolizes fame, honor, and victory."
  - id: granite-boulder
    name: Granite Boulder
    image: /images/coats-of-arms/new-hampshire/elements/granite.webp
    paragraphs:
    - "A granite boulder sits in the foreground on the left side of the design. New Hampshire is known as the Granite State, and granite is one of the defining physical features of its landscape. The official statute specifies only that the boulder appear; no symbolic meaning is defined in the law."
  - id: rising-sun
    name: Rising Sun
    image: /images/coats-of-arms/new-hampshire/elements/sun.webp
    paragraphs:
    - "A rising sun appears behind the Raleigh on the horizon, with roughly one-third of its disk visible above the horizon line. The official statute specifies the sun's position precisely but does not assign it a symbolic meaning in the law."
  - id: date-1776
    name: The Date 1776
    image: /images/coats-of-arms/new-hampshire/elements/date.webp
    paragraphs:
    - "The date 1776 appears at the base of the design, flanked by stars. It marks the year the Raleigh was built and the year the United States declared independence. The 1931 committee kept the date in the standardized design."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the New Hampshire Coat of Arms
  paragraphs:
  - "The coat of arms holds two specific founding moments. The frigate Raleigh and the date 1776 anchor the design to the Revolution, when New Hampshire contributed one of the first warships to the new nation's navy. The nine stars anchor it to 1788, when New Hampshire's ratification vote put the Constitution into effect."
  - "The choice to show the Raleigh under construction rather than at sea is significant. It places New Hampshire in the act of building the nation, not just defending it. The granite boulder adds the physical landscape of New England to this founding history."

- id: facts
  icon: fa-solid fa-lightbulb
  title: New Hampshire Coat of Arms Facts
  facts:
  - "The current standardized design took effect on January 1, 1932, after the New Hampshire Legislature acted in 1931."
  - "The 1931 redesign was led by historian Otis G. Hammond, who documented inconsistencies in earlier versions, and carried out under Governor John G. Winant."
  - "Earlier versions of the seal had acquired unauthorized additions over the years, including rum barrels on the dock, because the 1784 design description was never precise enough to prevent different artists from adding their own details."
  - "The nine stars in the laurel wreath represent New Hampshire as the ninth and decisive state to ratify the U.S. Constitution, on June 21, 1788. Nine of thirteen states were required for the Constitution to take effect."
  - "The frigate Raleigh was one of the first 13 warships authorized by the Continental Congress and was built in Portsmouth, New Hampshire, in 1776."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the New Hampshire Coat of Arms
  paragraphs:
  - "The New Hampshire seal went through three distinct stages before the current design was standardized in 1932. Each stage reflected a different moment in the state's identity."
  versions:
  - name: Colonial Seal
    years: 1776
    image: /images/coats-of-arms/new-hampshire/versions/colonial-seal-1776.png
    description: An early Revolutionary-era New Hampshire seal showing the colonial emblem with the Latin motto Vis Unita Fortior (a united force is stronger). This predates the ship-centered state seal design that followed independence.
  - name: Pre-Standard State Seal
    years: 1784–1931
    image: /images/coats-of-arms/new-hampshire/versions/seal-1904.png
    description: A late pre-standard impression of the ship-centered seal derived from the 1784 redesign. Because the 1784 design was never described precisely enough, many artistic variations circulated before the 1931–1932 standardization removed unauthorized additions and fixed the details.
  - name: Official Standard
    years: 1932-present
    image: /images/coats-of-arms/new-hampshire/coat-of-arms.svg
    description: The standardized design that took effect January 1, 1932. It identified the ship as the frigate Raleigh, removed unauthorized additions, replaced Latin text with English, and fixed the seal's diameter at 2 inches. This is the design used in the article's main image and element crops.

faq:
- question: What does the New Hampshire coat of arms show?
  answer: "The New Hampshire coat of arms shows the frigate Raleigh on its building stocks, with a granite boulder in the foreground, a rising sun behind the ship, and a U.S. flag at the ship's stern. A golden laurel wreath with nine evenly spaced stars frames the scene. The date 1776 appears at the base."
- question: When was the New Hampshire coat of arms adopted?
  answer: "The current standardized design took effect on January 1, 1932. A committee formed by Governor John G. Winant in 1931 produced the standardized version after historian Otis G. Hammond documented inconsistencies in earlier designs. The basic image of a ship on stocks dates back to 1784."
- question: What do the nine stars mean on the New Hampshire coat of arms?
  answer: "The nine stars represent New Hampshire as the ninth state to ratify the U.S. Constitution. New Hampshire's vote on June 21, 1788 was the decisive one: the Constitution required nine of thirteen states to ratify it before taking effect, and New Hampshire was the ninth."
- question: What is the frigate Raleigh?
  answer: "The Raleigh was one of the first 13 warships authorized by the Continental Congress for the new American navy. It was built in Portsmouth, New Hampshire, in 1776. The seal shows the ship on its building stocks, as if still under construction."
- question: Why were rum barrels on an earlier version of the New Hampshire seal?
  answer: "The 1784 seal design was never described precisely, so different artists interpreted the scene in their own way over the years. At some point, someone added rum barrels near the dock, and they appeared on versions of the seal for years before the 1931 standardization removed them."
- question: What does the granite boulder represent?
  answer: "New Hampshire is called the Granite State because granite is one of the most prominent features of its landscape. The granite boulder appears in the foreground of the seal, and the official statute specifies it must be there, though no symbolic meaning is defined in the law."
- question: Does New Hampshire have a separate coat of arms and state seal?
  answer: "No. New Hampshire does not have a separate heraldic coat of arms. The state uses the Great Seal of New Hampshire as its official emblem, and the central design of the seal functions as the coat of arms in official and heraldic contexts."

