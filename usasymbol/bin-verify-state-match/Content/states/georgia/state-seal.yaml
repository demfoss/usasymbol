intro_text: "Georgia's state seal encodes the structure of government directly into its design: three columns holding an arch inscribed \"Constitution,\" each pillar carrying one word of the state motto — Wisdom, Justice, Moderation — with a soldier standing guard in front of them, sword drawn. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
