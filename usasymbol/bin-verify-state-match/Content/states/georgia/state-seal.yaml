type: State Seal
state: Georgia
name: Great Seal of Georgia
adopted_year: 1776
revised_year: 1914
is_official: true
legislation: Official Code of Georgia Annotated § 50-3-30
meaning: "The Great Seal of Georgia is built around a constitutional argument: three pillars supporting an arch inscribed \"Constitution\" show that the three branches of government hold the state's fundamental law above everything else. A soldier stands in front of the arch with a drawn sword, defending the constitution. The motto, \"Wisdom, Justice, Moderation,\" is divided across the three pillars, tying each word to one branch. Georgia designed this seal in 1776, before the United States Constitution existed, making the arch one of the earliest visual statements in American history that a written constitution is the supreme law of a state."
