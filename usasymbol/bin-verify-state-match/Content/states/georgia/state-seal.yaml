timeline:
- year: '1776'
  description: Georgia's Second Provincial Congress adopts the state seal. The design features three pillars, a constitutional arch, a soldier with a drawn sword, and the motto "Wisdom, Justice, Moderation."
- year: '1777'
  description: Georgia ratifies its first state constitution, the document the seal's arch was designed to represent.
- year: '1788'
  description: Georgia ratifies the United States Constitution on January 2, becoming the fourth state to do so. The seal predates the federal constitution by eleven years.
- year: '1799'
  description: The Georgia legislature revises the seal for the first time, standardizing the border text and rendering quality. The composition is unchanged.
- year: '1914'
  description: The legislature standardizes the current authoritative version of the seal, codifying proportions, colors, and text in statute under O.C.G.A. § 50-3-30.

faq:
- question: What does Georgia's state seal show?
  answer: Georgia's state seal shows three classical pillars supporting an arch inscribed "Constitution," with a soldier standing in front holding a drawn sword. The motto "Wisdom, Justice, Moderation" is divided across the three pillars, and the date 1776 appears at the bottom.
- question: What do the three pillars on Georgia's state seal mean?
  answer: The three pillars represent the three branches of Georgia's state government — legislative, judicial, and executive. Each pillar also corresponds to one word of the state motto, Wisdom, Justice, and Moderation, assigning a governing virtue to each branch.
- question: What does the soldier on Georgia's state seal mean?
  answer: The soldier with a drawn sword represents the duty to defend constitutional government by force if necessary. He is not a historical figure but an allegory. When the seal was adopted in 1776, Georgia's militia forces were actively fighting British troops during the Revolutionary War.
- question: Why does Georgia's state seal say "Constitution"?
  answer: The arch inscribed "Constitution" represents Georgia's founding law as the supreme authority in the state, above the branches of government that support it and above any individual. The design was created in 1776, the same year Georgia drafted its first state constitution, before the U.S. Constitution existed.
- question: When was Georgia's state seal adopted?
  answer: Georgia's state seal was adopted in 1776 by the Second Provincial Congress, making it one of the oldest state seals in the country. It was revised in 1799 and standardized in 1914, but the composition has not changed since the original adoption.
- question: What does Georgia's state motto mean?
  answer: "\"Wisdom, Justice, Moderation\" reflects Enlightenment political philosophy and the virtues Georgia's founders believed were necessary for a constitutional republic to function. Each word is assigned to one of the three pillars on the seal, tying a virtue to each branch of government."
- question: Has Georgia's state seal changed over time?
  answer: The composition has not changed since 1776. The three pillars, the arch, the soldier, the motto, and the date 1776 have remained in every version. The rendering was standardized in 1799 and again in 1914, when the current authoritative version was codified in O.C.G.A. § 50-3-30.

