seo_title: "Georgia State Dog | Adoptable Dog"
seo_description: "Georgia's state dog is the Adoptable Dog, adopted in 2016. Learn why this official Georgia symbol was chosen and what it represents."

intro_text: "The Adoptable Dog is the official Georgia state dog, designated in 2016. This page gives the direct answer for searches like 'georgia state dog', 'georgia state animal', and 'georgia state mammal' while explaining how the symbol fits the state's official animal designations. Symbolizing second chances, compassion, and responsible pet ownership. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

