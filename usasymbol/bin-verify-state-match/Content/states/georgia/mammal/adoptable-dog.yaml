faq:
  - question: "What is Georgia's state dog?"
    answer: "Georgia's state dog is the adoptable dog (Canis lupus familiaris), designated in 2016 to promote shelter animal adoption and responsible pet ownership statewide."

  - question: "When was the adoptable dog designated as Georgia's state dog?"
    answer: "The adoptable dog became Georgia's official state dog on May 3, 2016, when Governor Nathan Deal signed House Resolution 1130 into law."

  - question: "Why did Georgia choose adoptable dogs instead of a specific breed?"
    answer: "Georgia chose adoptable dogs to promote shelter adoption and save lives rather than honoring a particular breed. The state has no breed with unique historical ties, and approximately 200,000 dogs enter Georgia shelters each year. The designation directs public attention toward adoption and encourages responsible pet ownership."

  - question: "Where can I adopt a dog in Georgia?"
    answer: "You can adopt dogs from hundreds of locations across Georgia including county animal control facilities, Humane Society chapters, breed-specific rescue organizations, and adoption events at pet stores. Major organizations include LifeLine Animal Project in Atlanta, Furkids, and Angels Among Us Pet Rescue. Your local animal control facility is a good starting point."

  - question: "Does Georgia have other official dog symbols?"
    answer: "No, the adoptable dog is Georgia's only official state dog. Georgia was the first state to designate shelter dogs rather than a specific breed as its state dog."

  - question: "Is the adoptable dog on Georgia's flag or seal?"
    answer: "No, the adoptable dog does not appear on Georgia's flag or state seal. The designation is honorary and symbolic, meant to promote shelter adoption rather than appear on state emblems."

  - question: "How many dogs are in Georgia shelters?"
    answer: "Approximately 200,000 dogs enter Georgia shelters each year. The number of dogs currently in shelters at any given time varies by season and location, but Georgia maintains hundreds of shelters and rescue organizations caring for thousands of dogs waiting for adoption."

  - question: "What are the benefits of adopting a shelter dog?"
    answer: "Shelter dogs typically receive veterinary care including vaccinations, spay/neuter surgery, and health screenings before adoption. Adopters save money compared to purchasing from breeders or pet stores. Adult shelter dogs often come house-trained with established temperaments. Most importantly, adoption saves lives by opening shelter space for incoming animals and reducing euthanasia rates."

