faq:
- question: What is Georgia's state insect?
  answer: "Georgia's state insect is the European honey bee, adopted by the Georgia General Assembly in 1975."
- question: When did Georgia adopt the European honey bee?
  answer: "Georgia adopted the European honey bee as its official state insect in 1975."
- question: Why did Georgia choose the European honey bee?
  answer: "Lawmakers pointed to the honey bee's importance to Georgia agriculture, since it pollinates more than fifty of the state's crops."
- question: What does Georgia's state insect look like?
  answer: "The European honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
- question: Does Georgia have a separate state butterfly?
  answer: "Yes. Georgia named the eastern tiger swallowtail its official state butterfly in 1988, separate from the honey bee's designation as state insect."

