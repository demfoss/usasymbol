sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Georgia?
  paragraphs:
  - "The honey bee, Apis mellifera, is Georgia's official state insect. The Georgia General Assembly designated it in 1975."
  - "Lawmakers cited the honey bee's importance to Georgia's agricultural economy, since honey bees pollinate more than fifty of the state's crops."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
  - "Honey bees live in large colonies built around a single queen. Worker bees gather nectar and pollen, build wax honeycomb, and produce the honey the colony eats and stores."
  - "A single hive can hold tens of thousands of bees, all working together to keep the colony fed and growing."

- id: history
  icon: fa-solid fa-landmark
  title: How Georgia Chose the European Honey Bee
  paragraphs:
  - "The Georgia General Assembly approved the honey bee as the state insect in 1975, recognizing its value to Georgia agriculture."
  - "Lawmakers pointed to honey bees' role in pollinating more than fifty Georgia crops and their contribution to the state's honey production as reasons for the designation."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1975, by the Georgia General Assembly."
  - "Scientific name: Apis mellifera."
  - "Honey bees pollinate more than fifty of Georgia's crops."
  - "A single hive can hold tens of thousands of worker bees built around one queen."
  - "Georgia beekeepers produce honey commercially across the state."




