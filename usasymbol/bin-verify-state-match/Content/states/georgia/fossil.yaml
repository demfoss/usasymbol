- id: facts
  icon: fa-solid fa-lightbulb
  title: Shark Tooth Facts
  facts:
  - "Georgia designated the shark tooth as its state fossil in 1976, following a campaign by Georgia schoolchildren."
  - "Carcharocles megalodon teeth can reach 7 inches long, roughly three times the size of a great white shark tooth."
  - "A megalodon tooth found in a Georgia river is typically 5 to 15 million years old, dating to the Miocene epoch."
  - "The Georgia Coastal Plain was shallow ocean during the Miocene, which is why marine fossils like shark teeth appear so far inland today."
  - "Megalodon went extinct about 3.6 million years ago; its teeth are so dense and mineralized that they survive intact for millions of years."

