faq:
- question: What is Georgia's state fossil?
  answer: "Georgia's state fossil is the shark tooth, designated by the Georgia General Assembly in 1976. The most iconic example is the tooth of Carcharocles megalodon, a prehistoric shark estimated at up to 60 feet long."
- question: When did Georgia adopt its state fossil?
  answer: "Georgia adopted the shark tooth as its state fossil in 1976."
- question: What did the shark tooth look like?
  answer: "A Carcharocles megalodon tooth is a thick, triangular blade with serrated edges, up to 7 inches long. It is typically black or dark gray from mineralization and heavy enough to feel solid in the hand."
- question: Where are shark tooth fossils found in Georgia?
  answer: "Shark teeth are found across Georgia's Coastal Plain. The Altamaha River system in southeast Georgia is the most productive area. Teeth also wash up on barrier island beaches like Jekyll Island and Cumberland Island, and Skidaway Island near Savannah has a Miocene fossil layer."
- question: When did the megalodon live?
  answer: "Carcharocles megalodon lived from roughly 23 million to 3.6 million years ago, spanning the late Oligocene through the Pliocene epoch."
- question: Who pushed to make the shark tooth Georgia's state fossil?
  answer: "Georgia schoolchildren campaigned for the designation in the mid-1970s. The Georgia General Assembly made it official in 1976."

