sections:
  - id: history
    icon: fa-solid fa-landmark
    title: "History of the Alaska State Flag"
    paragraphs:
      - "Alaska had no territorial flag for 60 years after the 1867 purchase from Russia. In 1926, Territorial Governor George Parks visited Washington D.C. and noticed all 48 state flags on display but none for Alaska. Parks arranged for the Alaska Department of the American Legion to hold a territory-wide schoolchildren's contest. Most entries used polar bears, the midnight sun, or the territorial seal."
      - "Benny Benson, living at the Jesse Lee Home for Children in Seward, submitted the constellation design. Of 142 entries that reached the Final Awards Committee, his was the unanimous choice. On May 2, 1927, the territorial legislature adopted his design. Benson received a $1,000 education prize and a gold watch engraved with the design."
      - "Benson's flag was built for a territory, not a state. In 1959, Alaska became the 49th state. Lawmakers made no changes, carrying Benson's original design unchanged into the union."

  - id: symbols
    icon: fa-solid fa-shapes
    title: "Alaska Flag Meaning and Symbolism"
    style: "symbol-cards"
    symbols:
      - id: big-dipper
        name: "Big Dipper"
        image: "symbols/big-dipper.svg"
        clip_region: "polygon(0% 30%, 60% 30%, 60% 100%, 0% 100%)"
        paragraphs:
          - "Seven gold stars form the Big Dipper, placed across the lower portion of the flag. In Benson's submission, the constellation stood for the Great Bear, Ursa Major, and strength, tied to the bear's presence in Alaska's landscape."
      - id: north-star
        name: "North Star (Polaris)"
        image: "symbols/north-star.svg"
        clip_region: "polygon(65% 0%, 100% 0%, 100% 35%, 65% 35%)"
        paragraphs:
          - "Placed in the upper right, the largest of the eight stars marks Polaris. Benson wrote that it meant 'the future state of Alaska, the most northerly in the union.' Polaris has marked true north for navigators for centuries."
      - id: blue-field
        name: "Navy Blue Field"
        image: "symbols/blue-field.svg"
        clip_region: "inset(0 0 0 0)"
        paragraphs:
          - "Dark navy blue covers the entire background. Benson described it as standing for the Alaskan sky and the forget-me-not flower, both specified in his 1927 submission."

  - id: colors
    icon: fa-solid fa-palette
    title: "Official Colors and Dimensions"
    paragraphs:
      - "Alaska's flag uses navy blue and gold. State statute defines gold as 'the color of natural yellow gold' and specifies that blue match the shade used in the U.S. national flag."
    colors:
      - name: "Navy Blue"
        hex: "#0F204B"
      - name: "Gold"
        hex: "#FFB612"

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "Dubhe and Merak, the Big Dipper's outermost stars, form a pointer that leads directly to Polaris in the night sky."
      - "Benson submitted a handwritten card explaining each element. His words became the official record of what the flag means."
      - "Benson misspelled 'strength' in his written explanation. The judges overlooked the error and selected his design anyway."
      - "Alaska named the forget-me-not its state flower in 1949, 22 years after Benson assigned it to the flag's navy blue."
      - "Marie Drake's poem about the flag, set to music by Elinor Dusenbury in 1938, became Alaska's official state anthem."

  - id: previous-versions
    icon: fa-solid fa-flag
    title: "Historical Versions of the Flag"
    versions:
      - name: "Russian-American Company Flag"
        years: "1806-1867"
        image: "versions/russian-american-1806.webp"
        description: "The Russian-American Company flew its flag with the Imperial Russian double-headed eagle over Alaskan trading posts. The United States purchased Alaska for $7.2 million in 1867, ending Russian administration."
      - name: "U.S. Flag Only"
        years: "1867-1927"
        image: "versions/us-flag-1867.webp"
        description: "From the Alaska Purchase through 1927, the U.S. national flag flew over territorial government buildings. No contest or legislation had created a distinct Alaskan symbol."
      - name: "Benson's Design"
        years: "1927-present"
        image: "versions/modern-1927.webp"
        description: "The design Benny Benson submitted in the 1927 contest. Adopted as a territorial flag and reclassified as a state flag when Alaska joined the union in 1959."

faq:
  - question: "What does the Alaska state flag look like?"
    answer: "Alaska's flag shows eight gold stars on a navy blue field. Seven stars form the Big Dipper, and the eighth, the largest, is Polaris in the upper right. No seals, text, or other elements appear on the flag."
  - question: "What do the stars on Alaska's flag mean?"
    answer: "Seven stars in the lower portion form the Big Dipper. The eighth and largest, placed in the upper right, is Polaris, the North Star. Benson documented the meaning of each element in his 1927 contest submission."
  - question: "Who designed Alaska's state flag?"
    answer: "Benny Benson designed Alaska's flag in 1927 as a student living in Seward. He won a territory-wide contest organized by the Alaska Department of the American Legion, with his entry chosen unanimously from all finalists. He went on to work for the Alaska Railroad."
  - question: "What do the colors on Alaska's flag mean?"
    answer: "Navy blue and gold, both described in Benson's 1927 submission. The specific shades were later codified in state statute. Alaska uses only two colors, the fewest of any U.S. state flag."
  - question: "Has Alaska's flag ever changed?"
    answer: "No. Alaska's flag has not been modified since it was adopted in 1927. When Alaska became the 49th state in 1959, the legislature kept the territorial flag exactly as Benson designed it."

