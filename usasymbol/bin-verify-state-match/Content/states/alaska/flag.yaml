seo_title: "Flag of Alaska | History, Meaning & Colors"
seo_description: "Benny Benson designed Alaska's flag at 13. Eight gold stars on navy blue, the Big Dipper pointing to Polaris, adopted in 1927 and kept at statehood."
meaning: "Alaska's flag connects eight stars to two constellations visible from Alaskan latitudes. Benny Benson designed it as a territorial student entry, and the state kept it unchanged at statehood. Navy blue represents both the Alaskan sky and the forget-me-not, the only element with two documented meanings."

intro_text: "Alaska's state flag shows **eight gold stars** on a **navy blue** field, the Big Dipper pointing toward Polaris, adopted in 1927 when the territorial legislature accepted 13-year-old Benny Benson's design. Benson won a territory-wide student contest, the only such competition to produce an official U.S. state flag. His design passed to statehood in 1959 unchanged."

