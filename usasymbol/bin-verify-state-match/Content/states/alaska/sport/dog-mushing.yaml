faq:
  - question: What is Alaska's official state sport?
    answer: "Alaska's official state sport is dog mushing, adopted in 1972."
  - question: Why did Alaska choose dog mushing?
    answer: "Because it reflects Alaska's real winter history. Dog teams once carried people, mail, and supplies across long distances and remained central to life in many parts of the state."
  - question: Is dog mushing just the Iditarod?
    answer: "No. The Iditarod is the best-known long-distance race, but dog mushing is a broader sport and tradition that includes sprint racing, recreation, village events, and historic trail travel."
  - question: Was dog mushing official before the Iditarod?
    answer: "Yes. Alaska adopted dog mushing as its official state sport in 1972, and the first full Iditarod ran in March 1973."

