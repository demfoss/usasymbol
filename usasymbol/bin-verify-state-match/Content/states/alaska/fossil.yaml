- id: facts
  icon: fa-solid fa-lightbulb
  title: Woolly Mammoth Facts
  facts:
  - "Alaska designated the Woolly Mammoth as its state fossil in 1986."
  - "Gold dredging operations near Fairbanks beginning in the late 1800s exposed thousands of mammoth bones, teeth, and tusks from frozen ground."
  - "Frozen Alaskan specimens have been recovered with hair, skin, and stomach contents intact, allowing scientists to identify exactly what mammoths ate."
  - "Male Woolly Mammoth tusks could reach 14 feet in length and were used for scraping snow off vegetation and for fighting other males."
  - "A small Woolly Mammoth population survived on Wrangel Island in the Arctic until about 4,000 years ago, outlasting the mainland extinction by 6,000 years."

