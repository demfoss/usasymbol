faq:
- question: What is Alaska's state fossil?
  answer: "Alaska's state fossil is the Woolly Mammoth (Mammuthus primigenius), an Ice Age elephant relative. The state legislature designated it in 1986."
- question: When did Alaska adopt its state fossil?
  answer: "Alaska adopted the Woolly Mammoth as its state fossil in 1986."
- question: What did the Woolly Mammoth look like?
  answer: "The Woolly Mammoth stood up to 11 feet tall at the shoulder and had long, curved tusks reaching up to 14 feet in large males. Its body was covered in a shaggy double-layered coat with coarse outer hairs up to three feet long over a dense woolly undercoat."
- question: Where are Woolly Mammoth fossils found in Alaska?
  answer: "Most mammoth fossils come from interior Alaska, especially the permafrost gold fields around Fox and Ester near Fairbanks. Remains have also been found on the North Slope and along river cutbanks across western and interior Alaska."
- question: When did the Woolly Mammoth live?
  answer: "Mammuthus primigenius lived from about 400,000 years ago through the end of the last Ice Age. Mainland populations went extinct about 10,000 years ago; a small island population survived on Wrangel Island until about 4,000 years ago."
- question: Why does Alaska have so many Woolly Mammoth fossils?
  answer: "Alaska was part of Beringia, the cold grassland that connected Asia and North America during the Ice Age. The region's permafrost preserved mammoth remains for tens of thousands of years, and gold mining operations starting in the late 1800s exposed thousands of specimens from frozen ground."

