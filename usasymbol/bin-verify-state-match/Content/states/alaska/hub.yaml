seo_description: "Alaska symbols include the willow ptarmigan, forget-me-not, Sitka spruce, Benny Benson flag, and North to the Future motto."
snippet_answer: "Find out more about the official state symbols that represent Alaska, from Benny Benson's 1927 flag and the willow ptarmigan to the forget-me-not and North to the Future motto. The Sitka spruce, bowhead whale, and dog mushing emblem round out a list built for the country's northernmost and largest state."
