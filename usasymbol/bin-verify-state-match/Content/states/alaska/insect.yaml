intro_text: "Alaska's state insect is the four-spotted skimmer dragonfly, a brown dragonfly with a dark spot on each wing, officially adopted in 1995. Alaska schoolchildren voted for it in a statewide school election before the Legislature made the choice official."

sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Alaska?
  paragraphs:
  - "The four-spotted skimmer dragonfly, Libellula quadrimaculata, is Alaska's official state insect. The Alaska Legislature designated it in 1995."
  - "It beat out three other finalists, the unmarked slender mosquito, the mourning cloak butterfly, and the bumblebee, in a statewide vote among Alaska schoolchildren."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Four-Spotted Skimmer Dragonfly
  paragraphs:
  - "The four-spotted skimmer has a brown body about 1.7 inches long. Each of its four wings carries a dark spot near the tip, in addition to the stigma, a dark bar found near the wingtip of every dragonfly."
  - "It is a strong, agile flier that can hover in place and fly backward as well as forward, which lets it dart out from a perch to snatch mosquitoes, midges, and black flies out of the air."
  - "It usually perches on a twig or plant stem with a clear view of its surroundings, then returns to the same spot after chasing off prey or rivals."

- id: history
  icon: fa-solid fa-landmark
  title: How Alaska Chose the Four-Spotted Skimmer Dragonfly
  paragraphs:
  - "The push for a state insect began during the 1993-1994 school year, when students at Auntie Mary Nicoli School in Aniak led a campaign asking the Alaska Legislature to name one."
  - "Schools across the state held a vote among four finalists: the four-spotted skimmer dragonfly, the unmarked slender mosquito, the mourning cloak butterfly, and the bumblebee. The dragonfly won, beating the mosquito 3,914 votes to 3,035."
  - "The Alaska Legislature made the vote official in 1995, naming the four-spotted skimmer dragonfly the state insect. State Representative Irene Nicholia said the dragonfly's ability to hover and fly forward and backward reminded lawmakers of the skillful maneuvering of Alaska's bush pilots."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Four-Spotted Skimmer Dragonfly in Alaska
  paragraphs:
  - "Four-spotted skimmers live near ponds, lakes, and other still or slow-moving water across much of Alaska, along with the grasslands nearby."
  - "They are active from late spring through summer, when they can be seen perched on twigs and plant stems at the water's edge or darting out over the water to hunt."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Four-Spotted Skimmer Dragonfly Facts
  facts:
  - "Adopted: 1995, by the Alaska Legislature, after a statewide vote among Alaska schoolchildren."
  - "Scientific name: Libellula quadrimaculata."
  - "A dark spot near the tip of each of its four wings gives the four-spotted skimmer its name."
  - "Body length is about 1.7 inches, with a brown body."
  - "Chosen over three other finalists: the unmarked slender mosquito, the mourning cloak butterfly, and the bumblebee."




