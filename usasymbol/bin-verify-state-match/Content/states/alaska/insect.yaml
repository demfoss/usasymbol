faq:
- question: What is Alaska's state insect?
  answer: "Alaska's state insect is the four-spotted skimmer dragonfly, adopted by the Alaska Legislature in 1995."
- question: When did Alaska adopt the four-spotted skimmer dragonfly?
  answer: "Alaska adopted the four-spotted skimmer dragonfly as its official state insect in 1995, after Alaska schoolchildren voted for it in a statewide school election."
- question: Why did Alaska choose the four-spotted skimmer dragonfly?
  answer: "Alaska schoolchildren voted for the four-spotted skimmer dragonfly over three other finalists in a statewide election. State Representative Irene Nicholia said its skillful hovering and backward flight reminded lawmakers of Alaska's bush pilots."
- question: What does Alaska's state insect look like?
  answer: "The four-spotted skimmer has a brown body about 1.7 inches long, with a dark spot near the tip of each of its four wings."
- question: Where is the four-spotted skimmer dragonfly found in Alaska?
  answer: "It lives near ponds, lakes, and other still or slow-moving water across much of Alaska, along with nearby grasslands, from late spring through summer."
- question: Is the four-spotted skimmer a butterfly, bee, beetle, or dragonfly?
  answer: "It is a dragonfly, not a butterfly, bee, or beetle."
- question: Who helped choose Alaska's state insect?
  answer: "Students at Auntie Mary Nicoli School in Aniak led the campaign, and schoolchildren statewide voted for the dragonfly over the unmarked slender mosquito, the mourning cloak butterfly, and the bumblebee."

