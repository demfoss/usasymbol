seo_title: "Michigan State Colors | Maize Blue"
seo_description: "Michigan state colors are Maize and Blue, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Michigan are **Maize** and **Blue**, originating with the University of Michigan, which formally adopted these colors in 1867. While not officially designated by legislative statute, maize and blue appear on [the Michigan state flag](/states/michigan/flag/michigan-state-flag) and throughout state branding and civic culture. For Michigan, the color cards give HEX, RGB, CMYK, and Pantone references alongside the full [U.S. state colors index](/symbols/colors)."

official_colors: "Maize and Blue"
official_since: "Semi-official / Traditional (University of Michigan, adopted February 12, 1867; Pantone standards finalized 2013)"
primary_use: "University of Michigan athletics and institutional branding, Michigan Wolverines NCAA teams, widespread statewide use across Michigan government, business, and civic life"
known_for: "One of the most recognized color combinations in American collegiate and state identity history; the colors survived more than 145 years of unofficial use and color drift before being standardized in precise Pantone values in 2013 — a process that revealed no fewer than 12 unofficial shades of Michigan Blue had been in simultaneous use"

