timeline:
  - year: "1817"
    description: "University of Michigan founded in Detroit as the Catholepistemiad, or University of Michigania, by an act of the Michigan Territory Legislature; the university that will give Michigan its iconic color tradition is established 20 years before Michigan achieves statehood"
  - year: "1837"
    description: "Michigan admitted to the Union as the 26th state on January 26; the University of Michigan relocates from Detroit to Ann Arbor, establishing the campus where maize and blue will be formally chosen 30 years later"
  - year: "1867"
    description: "On February 12, a student committee of the U-M literary department adopts azure-blue and maize as the University of Michigan's official colors at a chapel meeting; the committee consists of Milton Jackson, Albert H. Pattengill, and J. Eugene Jackson"
  - year: "1879"
    description: "University of Michigan athletic uniforms begin incorporating progressively deeper and bolder shades of blue, beginning a decades-long drift away from the baby blue that had become common in institutional documents toward the darker navy that the original committee intended"
  - year: "1912"
    description: "University of Michigan senate creates a faculty committee to determine the precise official shades of maize and blue for the university's 75th anniversary celebrations; the committee selects ribbon swatches as official exemplars and specifies a deeper blue, depositing the standards in the Bentley Historical Library"
  - year: "2013"
    description: "University of Michigan branding director Steve Busch conducts a color audit finding 12 distinct unofficial shades of Michigan blue in use; he standardizes Michigan Blue as Pantone PMS 282 C (HEX #00274C) and Michigan Maize as Pantone PMS 7406 C (HEX #FFCB05), ending 146 years of color variation"

expert_quote:
  text: "Two colors are at the very core of our existence. Maize and blue play a vital role in establishing a clear and powerful image and in defining the University of Michigan brand."
  source: "University of Michigan Brand and Visual Identity Office, Official Brand Guidelines"

faq:
  - question: "What are the state colors of Michigan?"
    answer: "The traditional state colors of Michigan are Maize and Blue, recognized by cultural convention through the University of Michigan, which formally adopted the colors on February 12, 1867. Michigan has no separate state color statute; maize and blue function as de facto state colors through the university's dominant influence on Michigan public image."
  - question: "What is the HEX code for Michigan Maize?"
    answer: "The official HEX code for Michigan Maize is #FFCB05, corresponding to Pantone PMS 7406 C, standardized by the University of Michigan's Brand and Visual Identity office in 2013."
  - question: "What is the HEX code for Michigan Blue?"
    answer: "The official HEX code for Michigan Blue is #00274C, corresponding to Pantone PMS 282 C, standardized by the University of Michigan's Brand and Visual Identity office in 2013."
  - question: "When did Michigan adopt maize and blue?"
    answer: "The University of Michigan formally adopted azure-blue and maize as its official colors on February 12, 1867, at a chapel meeting of the literary department. The precise Pantone values were not standardized until 2013, when PMS 7406 C (Maize) and PMS 282 C (Blue) were established as the definitive standards."
  - question: "Why are maize and blue Michigan's state colors?"
    answer: "Maize and blue became Michigan's de facto state colors through the cultural dominance of the University of Michigan, the state's flagship public university, which has used the colors in athletics, institutional branding, and public communications since 1867. No formal state legislation designates them as official state colors."
  - question: "How many shades of Michigan Blue existed before standardization?"
    answer: "When University of Michigan branding director Steve Busch conducted a color audit in 2013, he found no fewer than 12 distinct unofficial shades of Michigan Blue in simultaneous use across university departments and affiliates — a result of 146 years of color drift since the original 1867 student committee selection."

