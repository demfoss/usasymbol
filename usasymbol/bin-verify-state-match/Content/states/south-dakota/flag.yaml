type: State Flag
state: South Dakota
name: South Dakota State Flag
adopted_year: 1909
standardized_year: 1992
is_official: true

author: "USA Symbol Team"
date_published: "2025-01-15"
date_modified: "2026-05-01"

seo_title: "South Dakota State Flag | Sun, Seal & Meaning"
seo_description: "South Dakota's flag wraps the state seal in a blazing sun and prints the nickname Mount Rushmore State."

intro_text: "South Dakota adopted its state flag on November 9, 1909, displaying a blazing sun on a blue field and joining the [U.S. state flags collection](/symbols/flags). Ida Anding McNeil designed the original two-sided flag. The state redesigned the flag in 1963 to place the state seal inside the sun. The motto changed to The Mount Rushmore State in 1992."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the South Dakota State Flag Is Designed"
    paragraphs:
      - "The South Dakota state flag is the official government flag of the state of South Dakota. A sky blue field holds the state seal at the center. A gold serrated sun surrounds the seal."
      - "The words South Dakota appear in gold letters above the sun. The Mount Rushmore State appears below in gold letters. Both text elements follow the curve of the sun and seal, matching [South Dakota's official nickname](/states/south-dakota/nickname/the-mount-rushmore-state). The flag measures one and two-thirds times as long as it is wide."
      - "Ida Anding McNeil designed the original flag in 1909. The first version was two-sided with a blazing sun on the front and the state seal on the back. The state simplified the design in 1963. The current version dates to 1992 when the state nickname changed."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the South Dakota State Flag Means"
    paragraphs:
      - "The South Dakota state flag meaning reflects the state's climate and geography. The blazing sun represents South Dakota's abundant sunshine. The blue field symbolizes the sky and aligns with [South Dakota's official color palette](/states/south-dakota/color/blue-and-gold)."
      - "The state seal shows South Dakota's economy and landscape. A farmer at a plow represents agriculture. Cattle and corn indicate farming prosperity. A smelting furnace shows mining. A steamboat on a river marks commerce and transportation, echoing civic language from [South Dakota's state motto](/states/south-dakota/motto/under-god-the-people-rule)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How South Dakota Chose Its State Flag"
    paragraphs:
      - "South Dakota lacked an official state flag until 1909. Senator Ernest May of Deadwood approached the State Historical Society about creating one. Doane Robinson, the society's superintendent, directed Ida Anding McNeil to design the flag. McNeil worked as a legislative reference librarian at the time."
      - "Robinson requested only that the flag include a sun motif because South Dakota receives considerable sunshine. He suggested placing the state seal on the reverse side. McNeil created the first flag from silk. She placed the sun's appliqué and embroidered its rays. The phrases South Dakota and The Sunshine State were embroidered in arcs around the sun. The state seal was painted on a second piece of silk attached to the back."
      - "Senate Bill 208 passed on November 9, 1909. The law appropriated money for two flags. One went to the Secretary of State. Seth Bullock received the other. The bill specified a blue field with a blazing sun in gold. The state seal appeared on the reverse in dark blue. Golden fringe trimmed the edges."
      - "By 1963, the two-sided design proved difficult and expensive to reproduce. Each flag cost about seventy-five dollars for materials. McNeil recreated flags upon request for various organizations. The designs on both sides often showed through to the other."
      - "State Representative William Sahr of Hughes County introduced House Bill 503 to redesign the flag. The new design reduced it to one side and moved the state seal inside the sun motif. The measure passed and was signed into law on March 11, 1963. McNeil supported the redesign but opposed moving the seal to the front."
      - "On November 9, 1992, the state changed the text on the flag. State Representative Gordon Pederson introduced a bill to replace The Sunshine State with The Mount Rushmore State. This reflected the adoption of a new state nickname. The 1992 law specified that previous flag versions remained valid to use across neighboring-region contexts in [States That Border South Dakota](/states/south-dakota/borders)."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the South Dakota Flag"
    versions:
      - name: "State Flag"
        years: "1909–1963"
        image: "versions/south-dakota-1909.webp"
        description: "A two-sided flag. Front showed a gold blazing sun with South Dakota and The Sunshine State in gold letters on a blue field. Back showed the state seal in dark blue."

      - name: "State Flag"
        years: "1963–1992"
        image: "versions/south-dakota-1963.webp"
        description: "A single-sided flag with the state seal placed inside the sun motif. Text read South Dakota and The Sunshine State."

      - name: "Modern State Flag"
        years: "1992–present"
        image: "versions/south-dakota-1992.webp"
        description: "The text changed from The Sunshine State to The Mount Rushmore State. All other design elements remained the same."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the South Dakota Flag"
    symbols:
      - id: seal
        name: "South Dakota State Flag Seal"
        image: "symbols/seal.svg"
        paragraphs:
          - "The state seal appears at the center of the flag inside the sun. The seal is four-ninths the width of the flag in diameter. It can appear on a white background outlined in dark blue or on a sky blue background outlined in dark blue."
          - "The seal shows a farmer at a plow in the right foreground. Cattle and a corn field appear in the right background. A smelting furnace and mining features occupy the left foreground. Hills rise in the left background. A river bearing a steamboat flows between the two parts. The state motto Under God the People Rule appears on the seal."

      - id: sun
        name: "South Dakota State Flag Sun"
        image: "symbols/sun.svg"
        paragraphs:
          - "A gold serrated sun surrounds the state seal. The sun's extreme width is five-ninths the width of the flag. The sun rays are triangular and point outward in all directions."
          - "The blazing sun represents South Dakota's abundant sunshine. The state chose this element because of its consistently sunny weather. The sun appeared on the original 1909 flag and has remained on all versions."

      - id: text
        name: "South Dakota State Flag Text"
        image: "symbols/text.svg"
        paragraphs:
          - "Gold letters reading South Dakota appear above the sun and seal. The words are arranged symmetrically to conform to the circle. The letters are one-eighteenth the width of the field."
          - "The Mount Rushmore State appears below the sun and seal in the same sized gold letters. This text replaced The Sunshine State in 1992. The arrangement matches the curve of the sun."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "South Dakota State Flag Colors"
    paragraphs:
      - "The South Dakota state flag uses sky blue and gold. The blue field represents the sky above South Dakota. Gold appears on the sun rays and lettering."
      - "The state seal includes additional colors showing different elements. These colors appear within the seal but are not specified in state law."
    colors:
      - name: "Sky Blue"
        hex: "#87CEEB"
      - name: "Gold"
        hex: "#FFD700"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "South Dakota State Flag Facts"
    facts:
      - "Ida Anding McNeil designed the original South Dakota state flag in 1909"
      - "The first flag was two-sided with a sun on front and seal on back"
      - "The state simplified the design to one side in 1963"
      - "The motto changed from The Sunshine State to The Mount Rushmore State in 1992"
      - "The flag ranked 68th out of 72 in a 2001 NAVA survey"
      - "Previous flag versions remain valid to use according to state law"

faq:
  - question: "Which flag serves as South Dakota's official banner?"
    answer: "The state flag of South Dakota is the official banner of South Dakota, featuring the state seal surrounded by a gold sun on a sky blue field with text reading South Dakota and The Mount Rushmore State."

  - question: "What are the main visual elements on South Dakota's flag?"
    answer: "The flag shows a sky blue field with the state seal at the center surrounded by gold sun rays. Gold letters reading South Dakota appear above and The Mount Rushmore State appears below."

  - question: "What does the South Dakota state flag represent?"
    answer: "The flag represents South Dakota's sunshine, agriculture, mining, and commerce. The sun symbolizes abundant sunshine. The seal shows farming, cattle, mining, and river transport."

  - question: "What meaning is attached to South Dakota's flag?"
    answer: "The flag means prosperity through South Dakota's natural resources and industry. The sun represents the state's sunny climate. The seal elements show agriculture, mining, and commerce."

  - question: "What are the key symbols on South Dakota's flag?"
    answer: "The Mount Rushmore State appears on the current flag. The state motto Under God the People Rule appears on the state seal within the flag."

  - question: "Who designed the South Dakota state flag?"
    answer: "Ida Anding McNeil designed the original South Dakota state flag in 1909. She was a legislative reference librarian at the State Historical Society."

  - question: "In what year did South Dakota's current flag become official?"
    answer: "South Dakota adopted its state flag on November 9, 1909. The state redesigned it in 1963 and updated the text in 1992."

