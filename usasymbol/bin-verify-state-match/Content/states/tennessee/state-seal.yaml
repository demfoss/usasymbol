intro_text: "Tennessee's state seal divides its imagery into two halves that match its official motto: a plow, sheaf of wheat, and cotton plant above for agriculture, and a river with a vessel below for commerce. The Roman numeral XVI at the center marks Tennessee's entry into the Union on June 1, 1796, as the 16th state. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
