name: Great Seal of the State of Tennessee
adopted_year: 1796
revised_year: 1987
is_official: true
legislation: Tennessee Code Annotated § 4-1-301
meaning: "The Great Seal of Tennessee centers on the two words that named the state's economic identity at its founding: Agriculture and Commerce. A plow, sheaf of wheat, and cotton plant represent the farming economy of Tennessee's fertile river valleys; a river and vessel represent the waterways that carried those goods to market. The Roman numeral XVI at the center marks Tennessee's entry into the Union as the 16th state on June 1, 1796."
