sections:
- id: history
  icon: fa-solid fa-landmark
  title: Tennessee State Seal History and Origin
  paragraphs:
  - "Tennessee's General Assembly adopted its state seal in 1796, the same year Congress admitted Tennessee to the Union as the 16th state on June 1. The seal was designed to reflect the two industries that defined the new state's economy: farming in the fertile river valleys and trade along the waterways connecting Tennessee to wider markets."
  - "The seal went through revisions over the following century as engraving standards changed and the legislature sought a more consistent official image. A standardization came in 1987, when Tennessee codified the current design by statute. The 1987 revision clarified each element's rendering and fixed the proportions required for official use."
  - "The seal does not appear on Tennessee's state flag. The flag uses three stars in a blue circle on a red field to represent the state's three Grand Divisions: East, Middle, and West Tennessee. The seal functions on official documents, government correspondence, and legal instruments."

- id: elements
  icon: fa-solid fa-shapes
  title: What the Tennessee State Seal Symbols Mean
  paragraphs:
  - "The Great Seal of Tennessee organizes its imagery around a vertical arrangement: the upper half contains agriculture symbols, the lower half a commerce scene, and the Roman numeral XVI at the center records the state's place in the Union."
  elements:
  - id: plow-wheat-cotton
    name: Plow, Sheaf of Wheat, and Cotton Plant
    image: /images/state-seals/tennessee/elements/agriculture.png
    paragraphs:
    - "The upper half of the seal shows a plow, a sheaf of wheat, and a cotton plant side by side. These objects name the two main agricultural products of early Tennessee and the tool used to produce them. The plow is a working implement, emphasizing labor over abundance."
    - "Wheat and cotton occupied different geographic zones. Wheat grew primarily in eastern and middle Tennessee; cotton dominated the western lowlands, particularly after the early nineteenth century. The seal places both crops together, representing Tennessee's full agricultural range within a single image."
  - id: river-vessel
    name: River and Vessel
    image: /images/state-seals/tennessee/elements/commerce.png
    paragraphs:
    - "The lower half shows a river with a vessel, representing commerce. Rivers were the primary freight corridors of eighteenth- and early nineteenth-century Tennessee. Flatboats and keelboats carried crops, furs, and goods from inland settlements to New Orleans and eastern markets."
    - "The vessel on the seal is consistent with the flat-bottomed craft used on Tennessee waterways in the 1790s. The image ties commerce to a specific, practical reality rather than to an abstract idea of trade."
  - id: roman-numeral-xvi
    name: Roman Numeral XVI
    image: /images/state-seals/tennessee/elements/xvi.png
    paragraphs:
    - "The Roman numeral XVI appears between the upper agricultural scene and the lower commerce scene. It records Tennessee's order of admission to the United States: Tennessee was the 16th state, admitted on June 1, 1796."
    - "Several state seals use Roman numerals to mark admission order, but Tennessee's placement of XVI at the geometric center of the design gives it unusual prominence. It is not a footnote; it functions as a title, stating directly what Tennessee is in relation to the rest of the Union."
  - id: motto-agriculture-commerce
    name: "Motto: Agriculture and Commerce"
    image: /images/state-seals/tennessee/elements/motto.png
    paragraphs:
    - "The motto \"Agriculture and Commerce\" encircles the seal's imagery and names both halves of the design in plain language. It is one of the most literal state mottos in the country: the seal shows exactly what the motto says."
    - "The motto was chosen in 1796 to describe the economic base of the new state, not to project aspiration or invoke civic virtue. Tennessee's founders were building a frontier state, and the motto reflects that directness."

- id: previous-versions
  icon: fa-solid fa-clock-rotate-left
  title: "Previous Versions of the Tennessee State Seal"
  paragraphs:
  - "The Tennessee state seal has retained its core composition since 1796, but has been re-engraved and revised multiple times. The agricultural symbols, the river and vessel, the Roman numeral XVI, and the motto \"Agriculture and Commerce\" have remained consistent across all versions. What changed over time was the quality and standardization of the rendering."

