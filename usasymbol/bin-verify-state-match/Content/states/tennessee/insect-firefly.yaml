sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Tennessee?
  paragraphs:
  - "The common eastern firefly, Photinus pyralis, is one of Tennessee's two official state insects. State lawmakers designated it in 1975."
  - "Tennessee is one of the few states with two state insects. The firefly shares the title with the ladybug, adopted the same year."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Common Eastern Firefly
  paragraphs:
  - "The common eastern firefly is a soft-bodied beetle with a dark brown body and a reddish-orange head shield edged in black."
  - "It produces a yellow-green glow from special light organs at the tip of its abdomen, using flashes to signal other fireflies after dark."
  - "Adults are most active on warm summer evenings, when they can be seen blinking their lights over lawns, fields, and woodland edges."

- id: history
  icon: fa-solid fa-landmark
  title: How Tennessee Chose the Firefly
  paragraphs:
  - "The Tennessee General Assembly named the firefly an official state insect in 1975. Lawmakers named the ladybug a state insect at the same time."
  - "Official sources confirm both insects share the title but do not give a detailed account of why lawmakers chose to recognize two species instead of one."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Common Eastern Firefly Facts
  facts:
  - "Adopted in 1975 by the Tennessee General Assembly."
  - "Scientific name: Photinus pyralis."
  - "Dark brown body with a reddish-orange head shield and a yellow-green glow at the tip of the abdomen."
  - "Flashes its light after dark during summer evenings to signal other fireflies."
  - "Tennessee also names the ladybug a state insect, making it one of the few states with two official state insects."




