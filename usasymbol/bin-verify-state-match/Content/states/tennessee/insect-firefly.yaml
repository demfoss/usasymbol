faq:
- question: What is Tennessee's state insect?
  answer: "Tennessee has two state insects, the common eastern firefly and the ladybug, both adopted by the Tennessee General Assembly in 1975."
- question: When did Tennessee adopt the firefly?
  answer: "Tennessee adopted the common eastern firefly as a state insect in 1975."
- question: What does Tennessee's firefly look like?
  answer: "It has a dark brown body, a reddish-orange head shield, and a yellow-green glow at the tip of its abdomen that it uses to signal other fireflies."
- question: Is the firefly Tennessee's only state insect?
  answer: "No. Tennessee also names the ladybug a state insect, adopted the same year in 1975."
- question: Where can you see the common eastern firefly in Tennessee?
  answer: "It is common across Tennessee on warm summer evenings, where it can be seen blinking over lawns, fields, and woodland edges."

