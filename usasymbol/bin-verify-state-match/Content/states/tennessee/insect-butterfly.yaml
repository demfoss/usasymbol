faq:
- question: What is Tennessee's state butterfly?
  answer: "Tennessee's state butterfly is the zebra swallowtail, adopted by the Tennessee General Assembly in 1995."
- question: When did Tennessee adopt the zebra swallowtail?
  answer: "Tennessee adopted the zebra swallowtail as its official state butterfly in 1995."
- question: What does the zebra swallowtail look like?
  answer: "It has narrow wings striped in black and white, long tails on the hindwings, and small red and blue spots near the lower wing edge."
- question: Where is the zebra swallowtail found in Tennessee?
  answer: "It is found near woodlands and stream banks across Tennessee where pawpaw trees grow, since its caterpillars feed only on pawpaw leaves."
- question: Is the zebra swallowtail the same as Tennessee's state insects?
  answer: "No. Tennessee's state insects are the firefly and the ladybug. The zebra swallowtail is a separate designation, the state butterfly, adopted in 1995."

