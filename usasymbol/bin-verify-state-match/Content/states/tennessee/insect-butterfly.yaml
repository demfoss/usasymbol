sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Tennessee?
  paragraphs:
  - "The zebra swallowtail, Eurytides marcellus, is Tennessee's official state butterfly. The Tennessee General Assembly designated it in 1995."
  - "It is a separate designation from Tennessee's two state insects, the firefly and the ladybug."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Zebra Swallowtail
  paragraphs:
  - "The zebra swallowtail has narrow, triangular wings marked with bold black and white stripes, similar to a zebra's pattern."
  - "Each hindwing has a pair of long, thin tails and small red and blue spots near the lower edge."
  - "Caterpillars feed only on pawpaw tree leaves, so adult zebra swallowtails are usually seen near woods and stream banks where pawpaw trees grow."

- id: history
  icon: fa-solid fa-landmark
  title: How Tennessee Chose the Zebra Swallowtail
  paragraphs:
  - "The Tennessee General Assembly named the zebra swallowtail the official state butterfly in 1995."
  - "Official sources confirm the designation and its year but do not give a detailed account of the selection process."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Zebra Swallowtail in Tennessee
  paragraphs:
  - "The zebra swallowtail is found across Tennessee near woodlands and stream banks where pawpaw trees grow, since caterpillars feed only on pawpaw leaves."
  - "Adults are most often seen in spring and summer, flying low along forest edges and clearings."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Zebra Swallowtail Facts
  facts:
  - "Adopted in 1995 by the Tennessee General Assembly."
  - "Scientific name: Eurytides marcellus."
  - "Narrow wings with bold black and white stripes, long tails, and small red and blue spots near the hindwing edge."
  - "Caterpillars feed only on pawpaw tree leaves."
  - "Tennessee also has two state insects, the firefly and the ladybug, and a separate state agricultural insect, the European honey bee."




