sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is Tennessee's State Agricultural Insect?
  paragraphs:
  - "The European honey bee, Apis mellifera, is Tennessee's official state agricultural insect. The Tennessee General Assembly designated it in 1990."
  - "Tennessee created this separate agricultural category alongside its state insects, the firefly and the ladybug, and its state butterfly, the zebra swallowtail."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "The European honey bee is a fuzzy, golden-brown and black striped insect that lives in large colonies."
  - "Worker bees collect nectar and pollen from flowers and carry it back to the hive, where the colony produces honey and beeswax."
  - "Each hive has one queen, thousands of worker bees, and a small number of drones, and the bees work together to raise young and defend the colony."

- id: history
  icon: fa-solid fa-landmark
  title: How Tennessee Chose the European Honey Bee
  paragraphs:
  - "The Tennessee General Assembly named the European honey bee the official state agricultural insect in 1990."
  - "The designation recognizes the value of honey bees to Tennessee agriculture, since bees pollinate a wide range of the state's fruit, vegetable, and crop plants."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted in 1990 by the Tennessee General Assembly."
  - "Scientific name: Apis mellifera."
  - "Golden-brown and black striped insect that lives in large hive colonies."
  - "Worker bees gather nectar and pollen and help produce honey and beeswax."
  - "Tennessee also has two state insects, the firefly and the ladybug, and a separate state butterfly, the zebra swallowtail."




