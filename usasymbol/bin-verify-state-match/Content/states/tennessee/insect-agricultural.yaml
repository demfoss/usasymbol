faq:
- question: What is Tennessee's state agricultural insect?
  answer: "Tennessee's state agricultural insect is the European honey bee, adopted by the Tennessee General Assembly in 1990."
- question: When did Tennessee adopt the European honey bee?
  answer: "Tennessee adopted the European honey bee as its official state agricultural insect in 1990."
- question: Why did Tennessee choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to Tennessee agriculture and pollination."
- question: What does a European honey bee look like?
  answer: "It is a fuzzy, golden-brown and black striped insect that lives in large colonies and produces honey and beeswax."
- question: Is the European honey bee the same as Tennessee's state insects?
  answer: "No. Tennessee's state insects are the firefly and the ladybug. The European honey bee is a separate designation, the state agricultural insect, adopted in 1990."

