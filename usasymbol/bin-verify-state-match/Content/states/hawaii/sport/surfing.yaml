sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Hawaii State Sport
    paragraphs:
      - "Hawaii designated surfing, known in Hawaiian as heʻe nalu, its official individual state sport in 1998. The choice needed no invention, since Hawaii is the birthplace of the sport and the source of nearly every surfing tradition practiced worldwide today. Unlike California or other coastal states that adopted surfing generations after it arrived from elsewhere, Hawaii recognized a sport that never had to travel to reach it."

  - id: what-is
    icon: fa-solid fa-water
    title: "Surfing in Hawaii"
    paragraphs:
      - "A surfer paddles out, catches a wave, and rides its face standing on a board, a sequence Hawaiians call heʻe nalu, or wave sliding. Oʻahu's North Shore hosts some of the most demanding waves in the sport, including the Banzai Pipeline, a reef break known for hollow, barreling tubes. Professional surfers still call it the wave every other break gets measured against."
      - "The Vans Pipe Masters, held at Pipeline every winter, ranks among the most prestigious events in professional surfing. Waimea Bay, farther along the same coast, hosts the Eddie Aikau Big Wave Invitational, an event so selective it only runs when open-ocean swells reach 20 feet, a threshold met only a handful of times since 1984. Waikiki, on the south shore of Oʻahu, remains the gentler, tourist-friendly water where most visitors learn to surf."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Surfing Represents Hawaii
    paragraphs:
      - "Surfing is not an import in Hawaii; it is the source. Heʻe nalu was practiced by Native Hawaiians long before Captain Cook's ships reached the islands in 1778, and early written accounts describe entire communities built around the sport. Board size and skill marked status directly: aliʻi rode long olo boards reserved for chiefs, while commoners used shorter alaia boards."
      - "Heʻe nalu nearly disappeared. Missionary influence and the decline of the Native Hawaiian population in the 1800s pushed the tradition to the edge of extinction, kept alive mainly by a small number of practitioners on Waikiki's beaches. Duke Kahanamoku, an Olympic swimming champion and Waikiki beach boy, is widely credited with reviving the sport in the early 1900s and carrying it to California and Australia."
      - "Modern Hawaii keeps surfing central to daily life rather than treating it as a spectacle. Thousands of residents surf recreationally on any given day, from Waikiki beginners to North Shore locals who grew up near Pipeline. That everyday presence, layered onto a sport with roots in Hawaiian royalty, is why lawmakers gave surfing its own designation separate from Hawaii's team sport, outrigger canoe paddling."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Surfing Became Hawaii's State Individual Sport
    paragraphs:
      - "Hawaii's legislature designated surfing the state's official individual sport in 1998, more than a decade after outrigger canoe paddling had already been named the state's team sport in 1986. Splitting the two sports into separate categories let lawmakers honor surfing's identity as a pursuit practiced alone, wave by wave, distinct from paddling's team structure. The designation formalized a status heʻe nalu already held in Hawaiian culture centuries before any legislature existed."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Surfing Facts
    facts:
      - "Hawaii designated surfing its official state individual sport in 1998."
      - "Heʻe nalu, the Hawaiian word for surfing, translates to wave sliding."
      - "Ancient Hawaiian aliʻi, or chiefs, rode long olo boards on waves reserved for royalty."
      - "Oʻahu's Banzai Pipeline hosts the Vans Pipe Masters, one of professional surfing's most prestigious events."
      - "The Eddie Aikau Big Wave Invitational at Waimea Bay only runs when swells reach 20 feet, a rare occurrence since 1984."

