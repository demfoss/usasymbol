intro_text: "Hawaii's state individual sport is surfing, known in Hawaiian as heʻe nalu, designated in 1998. Long before it became a global sport, heʻe nalu was practiced by Native Hawaiian aliʻi centuries before European contact, with certain waves reserved for chiefs alone."

