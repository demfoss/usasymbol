faq:
  - question: What is Hawaii's state sport?
    answer: "Hawaii's official state individual sport is surfing, known in Hawaiian as heʻe nalu, adopted in 1998."
  - question: When did Hawaii adopt surfing as its state sport?
    answer: "Hawaii adopted surfing as its official state individual sport in 1998, twelve years after naming outrigger canoe paddling its state team sport."
  - question: Why did Hawaii choose surfing?
    answer: "Surfing originated in Hawaii, practiced by Native Hawaiians for centuries before European contact. Ancient aliʻi, or chiefs, surfed on waves reserved for royalty alone."
  - question: Is surfing Hawaii's only official state sport?
    answer: "No. Hawaii also recognizes outrigger canoe paddling as its official state team sport, adopted in 1986, separate from surfing's individual designation."

