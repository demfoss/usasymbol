sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Hawaii State Sport
    paragraphs:
      - "Hawaii designated outrigger canoe paddling its official state team sport in 1986, honoring a vessel that predates the state itself. What began as a means of ocean travel and survival is now raced competitively in six-person canoes up and down the island chain. Unlike surfing, Hawaii's individual sport, paddling required teamwork, a distinction lawmakers built into the two separate designations."

  - id: what-is
    icon: fa-solid fa-water
    title: "Outrigger Canoe Paddling Explained"
    paragraphs:
      - "A crew of six paddlers sits in a long, narrow canoe stabilized by a single outrigger float, called an ama, attached to one side. Paddlers stroke in unison, calling out switches to alternate sides and keep the canoe balanced and moving in a straight line. Races range from short sprints near shore to open-ocean crossings that can take most of a day."
      - "The best-known event is the Molokai Hoe, a roughly 41-mile crossing of the Kaiwi Channel from Molokai to Oahu, first raced in 1952. Paddlers call the channel the Channel of Bones for its rough water and strong currents. The women's equivalent, Na Wahine O Ke Kai, has run the same crossing since 1979 and is considered the sport's top women's championship."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Outrigger Canoe Paddling Represents Hawaii
    paragraphs:
      - "The outrigger canoe is not just Hawaii's sporting equipment; it is how Hawaii exists at all. Polynesian voyagers reached the islands over open ocean in double-hulled canoes, using stars, swells, and wildlife to navigate without instruments. That voyaging tradition nearly disappeared until the 1976 voyage of the canoe Hōkūleʻa, which sailed from Hawaii to Tahiti using only traditional wayfinding."
      - "Hōkūleʻa's voyage, guided by Micronesian navigator Mau Piailug, is widely credited with sparking a renewed pride in Native Hawaiian culture known as the Hawaiian Renaissance. Hawaii designated outrigger canoe paddling its state sport a decade later, at a moment when interest in voyaging and Native Hawaiian tradition was already rising. The sport and the culture movement grew from the same canoe."
      - "Paddling also fits Hawaii as a team sport in a way few other activities do. Club crews train across every island, and races like the Molokai Hoe draw teams from Hawaii and well beyond it each fall. That combination of ancient technology and modern competition is what separates outrigger canoe paddling from a purely recreational pastime."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Outrigger Canoe Paddling Became Hawaii's State Team Sport
    paragraphs:
      - "Hawaii's legislature designated outrigger canoe paddling the state's official team sport in 1986. The designation came a decade after the Hōkūleʻa's landmark 1976 voyage to Tahiti had already renewed public interest in Hawaii's canoe-voyaging heritage. Twelve years later, in 1998, lawmakers added surfing as a separate individual-sport designation, splitting Hawaii's two signature water sports into distinct official categories."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Outrigger Canoe Paddling Facts
    facts:
      - "Hawaii designated outrigger canoe paddling its official state team sport in 1986."
      - "Heihei waʻa is the Hawaiian term for canoe racing."
      - "The Molokai Hoe, first raced in 1952, crosses about 41 miles of open ocean between Molokai and Oahu."
      - "The 1976 voyage of the canoe Hōkūleʻa from Hawaii to Tahiti used only traditional Polynesian navigation, with no instruments."
      - "Na Wahine O Ke Kai, the women's crossing of the Kaiwi Channel, has run since 1979."

