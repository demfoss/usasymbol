faq:
  - question: What is Hawaii's state team sport?
    answer: "Hawaii's official state team sport is outrigger canoe paddling, known in Hawaiian as heihei waʻa, adopted in 1986."
  - question: When did Hawaii adopt outrigger canoe paddling as its state sport?
    answer: "Hawaii adopted outrigger canoe paddling as its official state team sport in 1986, twelve years before surfing became the state's individual sport."
  - question: Why did Hawaii choose outrigger canoe paddling?
    answer: "The outrigger canoe carried Polynesian voyagers to Hawaii more than a thousand years ago, and the sport keeps that history alive as a team activity. The designation followed renewed interest in voyaging sparked by the canoe Hōkūleʻa's 1976 trip to Tahiti."
  - question: What is the Molokai Hoe?
    answer: "The Molokai Hoe is an annual outrigger canoe race across the Kaiwi Channel from Molokai to Oahu, about 41 miles of open ocean. First raced in 1952, it is considered the sport's world championship."

