- id: facts
  icon: fa-solid fa-lightbulb
  title: Saurophaganax Facts
  facts:
  - "J. Willis Stovall of the University of Oklahoma described the first Saurophaganax bones in 1941 from the Black Mesa area of Cimarron County."
  - "At up to 40 feet (12 meters) long, Saurophaganax maximus was one of the largest predatory dinosaurs of the Late Jurassic period."
- "Paleontologist Daniel Chure formally separated it from Allosaurus and named the genus Saurophaganax in 1995 after a detailed study of the Oklahoma specimens."
- "Oklahoma made it the official state fossil in 2000 — the only state in the country to claim this species as an official symbol."
- "A mounted Saurophaganax skeleton is on permanent display at the Sam Noble Oklahoma Museum of Natural History in Norman."

