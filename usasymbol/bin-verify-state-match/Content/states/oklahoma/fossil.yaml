faq:
- question: What is Oklahoma's state fossil?
  answer: "Oklahoma's state fossil is the Saurophaganax (Saurophaganax maximus), a large predatory dinosaur from the Late Jurassic period. It was adopted in 2000."
- question: When did Oklahoma adopt its state fossil?
  answer: "Oklahoma designated Saurophaganax maximus as its state fossil in 2000."
- question: What did the Saurophaganax look like?
  answer: "Saurophaganax maximus was a large two-legged predator up to 40 feet long with a deep, narrow skull, rows of blade-like serrated teeth, and three hooked claws on each forelimb."
- question: Where are Saurophaganax fossils found in Oklahoma?
  answer: "Fossils come from the Morrison Formation in the Black Mesa area of Cimarron County in the Oklahoma Panhandle. A mounted skeleton is on display at the Sam Noble Oklahoma Museum of Natural History in Norman."
- question: When did the Saurophaganax live?
  answer: "Saurophaganax maximus lived during the Late Jurassic period, about 150 million years ago, and went extinct at the end of the Jurassic period around 145 million years ago."
- question: Who pushed to make it the state fossil?
  answer: "The University of Oklahoma's long connection to the specimens — first collected and described by OU paleontologist J. Willis Stovall in 1941 — drove the push to make Saurophaganax maximus Oklahoma's official state fossil in 2000."

