timeline:
  - year: "1877"
    description: "Arthur Lakes collects dinosaur bones near Morrison, Colorado; Othniel Charles Marsh names the locality and eventually Stegosaurus from Colorado material"
  - year: "1876–1887"
    description: "Bone Wars: Marsh and Cope's competing teams excavate Garden Park near Cañon City, producing the most significant early Stegosaurus specimens"
  - year: "1887"
    description: "Marsh formally names Stegosaurus stenops from the most complete Garden Park specimen, collected by Marshall P. Felch over preceding field seasons — the type specimen that establishes the canonical species"
  - year: "1982"
    description: "Colorado designates Stegosaurus as its official state dinosaur — one of the first states to create this symbol category"
  - year: "2022–2024"
    description: "A juvenile Stegosaurus nicknamed 'Apex' — among the most complete ever found — is excavated from Morrison Formation deposits in Moffat County, Colorado, and sold at auction in June 2024; its Colorado origin continues the state's defining role in Stegosaurus science"

faq:
  - question: "What is Colorado's state dinosaur?"
    answer: "Colorado's state dinosaur is Stegosaurus. It was adopted in 1982."

  - question: "Where were the original Stegosaurus fossils found?"
    answer: "Key early fossils came from Garden Park near Canon City and from Morrison, Colorado."

  - question: "What were Stegosaurus plates for?"
    answer: "Their exact function is debated, but display and temperature control are the main ideas."

  - question: "What is the Morrison Formation?"
    answer: "It is a famous Late Jurassic rock formation named for Morrison, Colorado."

  - question: "Where can I see Stegosaurus fossils in Colorado?"
    answer: "The Denver Museum of Nature and Science is the best place to start."

  - question: "What was the Bone Wars?"
    answer: "It was a fierce fossil rivalry between Marsh and Cope in the late 1800s."

