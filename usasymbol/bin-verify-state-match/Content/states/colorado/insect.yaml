sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Colorado?
  paragraphs:
  - "The Colorado hairstreak, Hypaurotis crysalus, is Colorado's official state insect. State lawmakers designated it in 1996."
  - "Unlike many state insects, it is a small butterfly rather than a large, showy one, and it stays closely tied to a single native tree."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Colorado Hairstreak
  paragraphs:
  - "The Colorado hairstreak has iridescent purple upper wings bordered by a wide band of dark brown-black. The underside of the wings is grayish, crossed by a band of orange-red spots near the outer edge."
  - "Each hindwing carries a pair of thin, short tails, a feature typical of hairstreak butterflies."
  - "Adults have a wingspan of about 1 to 1.5 inches, making it much smaller than well-known state butterflies like the monarch or swallowtails."

- id: history
  icon: fa-solid fa-landmark
  title: How Colorado Chose the Colorado Hairstreak
  paragraphs:
  - "The Colorado Legislature designated the Colorado hairstreak as the official state insect in 1996."
  - "The butterfly stood out as a species closely tied to Colorado's own Gambel oak woodlands, rather than a wide-ranging insect found across many states."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Colorado Hairstreak in Colorado
  paragraphs:
  - "Colorado hairstreaks live in and around stands of Gambel oak, the shrubby oak that covers many foothill canyons and hillsides along the Front Range and in western Colorado."
  - "Because caterpillars feed only on Gambel oak leaves, adults rarely stray far from oak thickets. They are most often seen in mid to late summer, usually flying and perching high in the oak canopy."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Colorado Hairstreak Facts
  facts:
  - "Adopted: 1996, by the Colorado Legislature."
  - "Scientific name: Hypaurotis crysalus."
  - "Wingspan: about 1 to 1.5 inches, one of the smaller state insects."
  - "Purple upperside wings with dark borders, a grayish underside with an orange-red band, and short tails on the hindwings."
  - "Caterpillars feed only on Gambel oak, so adults stay close to oak woodlands and canyons."




