faq:
- question: What is Colorado's state insect?
  answer: "Colorado's state insect is the Colorado hairstreak, adopted by the Colorado Legislature in 1996."
- question: When did Colorado adopt the Colorado hairstreak?
  answer: "Colorado adopted the Colorado hairstreak as its official state insect in 1996."
- question: What does the Colorado hairstreak look like?
  answer: "It is a small butterfly with iridescent purple wings, dark brown-black borders, a grayish underside with an orange-red band, and short tails on the hindwings."
- question: Where is the Colorado hairstreak found?
  answer: "It lives in and around Gambel oak woodlands, mainly in foothill canyons along the Front Range and in western Colorado, since its caterpillars feed only on Gambel oak leaves."
- question: Is the Colorado hairstreak a butterfly, bee, beetle, or dragonfly?
  answer: "It is a butterfly, a small hairstreak species with a wingspan of about 1 to 1.5 inches."

