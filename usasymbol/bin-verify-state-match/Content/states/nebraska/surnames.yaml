seo:
  title: "Most Common Last Names in Nebraska"
  description: "Nebraska's most common last names are Johnson, Smith, and Anderson, with Danish, Swedish, German, and Czech roots visible."

page:
  h1: "Most Common Last Names in Nebraska"
  intro: "Johnson, Smith, and Anderson are the most common surnames in Nebraska, where farm settlement by Danes, Swedes, Germans, and Czechs left a surname mix unlike most Great Plains states. The most common last names in Nebraska still show that history clearly: Hansen, Jensen, and Peterson rank far higher here than nationally, while Czech names like Svoboda remain far more visible than their U.S. averages would suggest."
  heritage_title: "Scandinavian Prairies, German Counties, and Czech Nebraska"
  heritage_body: "Nebraska's surname map was shaped by immigrant farm belts that formed after the territory opened in 1854 and accelerated with the railroad era. By 1910, one in five Nebraskans was a German immigrant or the child of one, and between 1856 and World War I about 50,000 Czech immigrants chose Nebraska, giving the state the country's highest per-capita Czech population. Danish settlements around Dannebrog and Blair, Swedish communities such as Swedeburg in Saunders County, and German-Russian neighborhoods in Lincoln all helped keep Scandinavian and Central European surnames unusually prominent."
  fun_fact: "Svoboda, the Czech surname meaning 'freedom,' ranks 158th in Nebraska but only 5,380th nationally in Forebears data, one of the clearest signs of the state's Czech settlement."

surnames:
  - rank: 1
    name: Johnson
    count: 15840
    ratio: 127
    origin: english
    type: Patronymic
    meaning: "Son of John, from Hebrew 'Yohanan' meaning God is gracious. Johnson leads Nebraska partly because it fits both older English naming patterns and Scandinavian anglicization, especially in Danish and Swedish farming communities that spread across eastern and central Nebraska in the late 1800s."

  - rank: 2
    name: Smith
    count: 13631
    ratio: 148
    origin: english
    type: Occupational
    meaning: "From Old English 'smith', a metalworker. Smith stayed common on the Nebraska frontier because every railroad town and county seat needed blacksmiths, wagon repairers, and farm tool makers."

  - rank: 3
    name: Anderson
    count: 9755
    ratio: 207
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Anders or Andrew. Anderson ranks unusually high in Nebraska because Swedish, Danish, and Norwegian settlers carried Andersen and Andersson into the Platte Valley and many families simplified the spelling after arrival."

  - rank: 4
    name: Miller
    count: 9238
    ratio: 218
    origin: english
    type: Occupational
    meaning: "Occupational name for a miller, from Old English and German equivalents. In Nebraska it reflects both English-origin settlement and the anglicizing of German 'Muller' and related surnames in heavily German rural counties."

  - rank: 5
    name: Brown
    count: 7729
    ratio: 261
    origin: english
    type: Descriptive
    meaning: "From Old English 'brun', originally a nickname for brown hair or complexion. Brown spread with American-born settlers moving west into Nebraska during the homestead years after the Civil War."

  - rank: 6
    name: Nelson
    count: 6562
    ratio: 307
    origin: scandinavian
    type: Patronymic
    meaning: "Usually son of Nels or Nils, the Scandinavian form of Nicholas. Nebraska's strong Danish and Swedish settlement pushed Nelson into the top 10, especially in communities tied to Lutheran churches and prairie farming colonies."

  - rank: 7
    name: Jones
    count: 6193
    ratio: 325
    origin: welsh
    type: Patronymic
    meaning: "A Welsh and English patronymic meaning son of John. Jones arrived with migrants from Iowa, Illinois, Missouri, and the Upper South during Nebraska's first large settlement waves."

  - rank: 8
    name: Williams
    count: 6143
    ratio: 328
    origin: welsh
    type: Patronymic
    meaning: "Son of William, from the Germanic 'Willahelm'. Williams remains common statewide because it came with English-speaking settlers long before Nebraska's immigrant farm belt filled in."

  - rank: 9
    name: Peterson
    count: 5427
    ratio: 371
    origin: scandinavian
    type: Patronymic
    meaning: "Son of Peter. Peterson ranks much higher in Nebraska than nationally because Danish and Swedish settlers often anglicized Petersen and Petersson into Peterson after establishing farms across eastern and central Nebraska."

  - rank: 10
    name: Davis
    count: 5265
    ratio: 383
    origin: welsh
    type: Patronymic
    meaning: "Son of David, from Hebrew 'Dawid' meaning beloved. Davis came west with English-speaking migrants who followed railroad and homestead opportunities into Nebraska in the late 19th century."

