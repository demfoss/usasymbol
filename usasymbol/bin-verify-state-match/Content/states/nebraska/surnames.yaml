unique_surnames:
  - name: Svoboda
    state_rank: 158
    national_rank: 5380
    origin: czech
    why: "Svoboda means 'freedom' in Czech, and Nebraska's unusually high ranking comes from the state's enormous Czech settlement between 1856 and World War I. Saunders, Colfax, Saline, and other eastern counties helped make Nebraska the leading per-capita Czech state in America."

  - name: Sorensen
    state_rank: 111
    national_rank: 1131
    origin: danish
    why: "A Danish patronymic meaning son of Soren, Sorensen reflects the chain migration that created Danish communities in places such as Dannebrog, Blair, and other Lutheran settlement centers. Nebraska's Danish institutions, including the precursor to Dana College, helped preserve these surnames longer than in many neighboring states."

  - name: Jorgensen
    state_rank: 148
    national_rank: 1521
    origin: danish
    why: "Jorgensen, meaning son of Jorgen, is another strong Danish marker in Nebraska. Its relative concentration tracks the same central and eastern Nebraska settlements that kept Jensen, Petersen, and Sorensen prominent."

  - name: Harms
    state_rank: 166
    national_rank: 2374
    origin: german
    why: "Harms is a North German patronymic that appears far more often in Nebraska than nationally because German farm settlement was so dense across the state. By 1910, one in five Nebraskans was a German immigrant or the child of one, and those naming patterns remain visible."

  - name: Wiese
    state_rank: 178
    national_rank: 3484
    origin: german
    why: "From German 'Wiese', meaning meadow, this surname is much more common in Nebraska than in the country as a whole. It reflects the state's German and German-Russian communities, including the neighborhoods that formed in Lincoln and the rural counties of the northeast."

etymology_groups:
  - type: Scandinavian Patronymics
    icon: fa-solid fa-anchor
    description: "Nebraska is unusually full of Danish and Swedish patronymics. Anderson, Nelson, Peterson, Hansen, and Jensen all rank in the top 15, a legacy of settlements in places such as Dannebrog, Blair, and Swedeburg where church life, language, and family naming traditions stayed strong into the 20th century."
    examples:
      - Anderson (son of Anders)
      - Nelson (son of Nels or Nils)
      - Hansen (son of Hans)
      - Jensen (son of Jens)

  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Occupational surnames remain a major part of Nebraska's top 20 because frontier towns needed skilled trades and because German names often merged into familiar English spellings. Smith, Miller, Meyer, Clark, and Taylor all reflect work that mattered in railroad towns, county seats, and farm service centers."
    examples:
      - Smith (metalworker)
      - Miller (grain miller)
      - Meyer (estate manager)
      - Clark (clerk or scholar)

  - type: Central European Heritage Names
    icon: fa-solid fa-church
    description: "Some of Nebraska's most distinctive surnames came from the state's German and Czech immigration. German settlement was dense enough that almost every county shows a substantial German footprint, while Czech migration made Nebraska the country's strongest per-capita center for names like Svoboda and Novak."
    examples:
      - Svoboda (freedom)
      - Novak (newcomer)
      - Harms (son of Harm)
      - Wiese (meadow)

faq:
  - question: "Why are Scandinavian surnames so common in Nebraska?"
    answer: "Scandinavian surnames are common in Nebraska because Danish and Swedish immigrants founded durable farm communities across central and eastern Nebraska in the late 1800s. That settlement pattern kept names like Anderson, Nelson, Hansen, Jensen, and Peterson much more prominent here than in most states."

  - question: "Why is Svoboda more common in Nebraska than in most states?"
    answer: "Svoboda is much more common in Nebraska because the state attracted about 50,000 Czech immigrants between 1856 and World War I, more per capita than any other state. Eastern Nebraska counties preserved Czech language, churches, and family networks long enough for surnames like Svoboda to remain highly visible."

