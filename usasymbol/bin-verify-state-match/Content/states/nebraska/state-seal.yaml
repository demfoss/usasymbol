intro_text: "Nebraska's state seal places a blacksmith, a westbound locomotive, and a steamboat on the Missouri River inside a single circular scene, with the motto \"Equality Before the Law\" at the top. Adopted in 1867, the same year Nebraska became the 37th state, the design records what the state was and where it intended to go. This profile appears in the [list of U.S. state seals](/symbols/state-seals)."
