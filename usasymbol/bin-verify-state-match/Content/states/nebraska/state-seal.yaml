name: Great Seal of the State of Nebraska
adopted_year: 1867
is_official: true
legislation: Neb. Rev. Stat. § 90-103
meaning: "The Great Seal of Nebraska captures the state at its 1867 founding: a blacksmith at work, a locomotive heading west, a steamboat on the Missouri River, sheaves of wheat, and the Rocky Mountains in the background. Each element represents one dimension of Nebraska's economy and geography at statehood: agriculture, industry, river commerce, and the railroad corridor connecting the plains to the mountain West."
