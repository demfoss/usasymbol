faq:
- question: What is Nebraska's state soil?
  answer: "Nebraska's state soil is the Holdrege series, a deep, dark mollisol formed in wind-blown loess across the loess plains of south-central Nebraska. It supports corn, soybeans, winter wheat, and native grassland across a wide stretch of the state's agricultural heartland."
- question: Why is it called Holdrege soil?
  answer: "The Holdrege series is named for Holdrege, Nebraska, the county seat of Phelps County in south-central Nebraska. USDA soil scientists name soil series after towns, lakes, creeks, or ridges near where the soil was first studied and described."
- question: What color is Holdrege soil?
  answer: "The surface layer is very dark grayish brown, almost black, from centuries of decomposed native grass roots. Below it, the argillic subsoil is brown, and the deeper layers become yellowish brown and then very pale brown as they approach the original loess parent material."
- question: Where is Holdrege soil found in Nebraska?
  answer: "Holdrege soil is found on the loess uplands and tablelands of south-central Nebraska, from Phelps and Kearney counties east through Clay, Fillmore, and Thayer counties. It sits on nearly level ground where loess deposits can be over 100 feet deep."
- question: What grows in Holdrege soil?
  answer: "The main crops are corn and soybeans, grown both dryland and under center-pivot irrigation. Winter wheat is a major dryland crop in the drier western areas. On rangeland, native grasses including big bluestem, little bluestem, and sideoats grama grow naturally."
- question: Who chose the Holdrege soil as Nebraska's state soil?
  answer: "Nebraska's state soil was selected through coordination between the USDA Natural Resources Conservation Service and Nebraska's soil science community. The Holdrege series was chosen to represent the deep loess plains that define south-central Nebraska's landscape and agricultural economy."
- question: How deep is Holdrege soil?
  answer: "The Holdrege soil profile typically extends 40 to 60 inches to loess parent material. The dark A horizons reach about 15 inches deep. The argillic Bt horizon runs from roughly 15 to 30 inches, and below that the soil gradually transitions back to pale, unaltered loess."

