- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Holdrege Soil
  paragraphs:
  - "Corn is the primary crop on Holdrege soil. Nebraska ranks second in the country for corn production, and the south-central counties where Holdrege soil dominates contribute heavily to that total. Both dryland and center-pivot irrigated corn grow on this soil, with irrigated fields drawing from the High Plains Aquifer."
  - "Soybeans have expanded across the Holdrege landscape over the past few decades as farmers rotate with corn. Winter wheat remains an important dryland crop in the drier western counties where Holdrege soil transitions toward the mixed-grass prairie."
  - "Where farming gives way to pasture, Holdrege soil supports native grasses — big bluestem, little bluestem, sideoats grama, and western wheatgrass — the same plant community that built the soil's dark surface layer before European settlement."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Holdrege Soil Facts
  facts:
  - "The Holdrege series is named for Holdrege, Nebraska, the county seat of Phelps County in south-central Nebraska — one of the farming communities built on this soil."
  - "Holdrege soil is classified as a fine-silty, mixed, superactive, mesic mollisol, formed entirely in loess — wind-blown silt that accumulated across the Great Plains during and after the last ice age."
  - "The loess deposits underlying Holdrege soil can reach over 100 feet in depth in some locations, making it one of the deepest parent materials of any state soil in the country."
  - "The dark color of Holdrege's surface comes from centuries of decomposed prairie grass roots. Before farming, tallgrass and mixed-grass prairie covered this landscape and continuously added organic matter to the soil."
  - "Holdrege soil drains well and has moderate permeability — water moves through it steadily, which prevents waterlogging and makes the soil productive under both rainfall and irrigation."

