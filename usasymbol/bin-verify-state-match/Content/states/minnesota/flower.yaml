type: State Flower
state: Minnesota
name: Pink and White Lady's Slipper
scientific_name: Cypripedium reginae
adopted_year: 1902
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-15"
seo_title: "Minnesota State Flower | Pink and White Lady's Slipper"
seo_description: "The Pink and White Lady's Slipper became Minnesota's state flower in 1902. This rare native orchid blooms in Minnesota wetlands and forests each summer."

intro_text: "Minnesota officially recognized the Pink and White Lady's Slipper as its state flower in 1902. This striking orchid grows in wetlands and forests throughout Minnesota. Pink and white petals form a distinctive pouch shape that gives the flower its common name, and this profile appears in the [list of U.S. state flowers](/symbols/flowers)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Minnesota"
    paragraphs:
      - "Minnesota's floral emblem, the Pink and White Lady's Slipper, dates back to 1902. The flower displays a large pink pouch with white petals above. Two ribbon-like petals twist downward on either side. The blooms measure 2 to 3 inches across. A sweet fragrance attracts bees into the pouch where pollination occurs in habitats associated with the [Minnesota state tree](/states/minnesota/tree/red-pine)."
      - "Pink and White Lady's Slippers bloom from late June through July in Minnesota. Individual flowers last two to three weeks. Plants typically produce one or two flowers per stem. The orchids reach heights of 1 to 3 feet. Large pleated leaves wrap around the stem. A single plant can take 16 years to bloom from seed."
      - "This rare native orchid grows in Minnesota's wetlands, swamps, and moist forests. Acidic boggy soil provides ideal conditions. The plants require specific soil fungi to survive. Partial shade suits lady's slippers best. Wild populations face threats from habitat loss and illegal picking. Minnesota law protects this endangered orchid."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Pink and White Lady's Slipper"
    paragraphs:
      - "Known as Pink and White Lady's Slipper, this flower's scientific designation is Cypripedium reginae. The plant belongs to the Orchidaceae family. This massive family includes over 28,000 orchid species found worldwide making it one of the largest flowering plant families."
      - "The genus name Cypripedium comes from Greek words meaning slipper of Venus. The species name reginae means of the queen in Latin. This refers to the flower's regal appearance. Showy lady's slipper serves as another common name. Some people call it queen's lady's slipper."
      - "The pouch-shaped lip traps bees that enter seeking nectar. The only exit forces bees past the reproductive parts. This ensures pollen transfer. The complex pollination system makes the orchid difficult to cultivate. Wild plants depend on specific bee species for reproduction."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Pink and White Lady's Slipper Became the Minnesota State Flower"
    paragraphs:
      - "Minnesota chose the Pink and White Lady's Slipper as its official state flower in 1902. The state legislature made this designation without organizing a public vote. The rare orchid's beauty impressed legislators. Women's clubs throughout Minnesota advocated for protecting native wildflowers and for symbols tied to [The North Star State identity](/states/minnesota/nickname/the-north-star-state)."
      - "The lady's slipper grew naturally in Minnesota's northern forests and wetlands. Its distinctive appearance made it uniquely Minnesota. Settlers marveled at finding these orchids in wilderness areas. The flower represented Minnesota's pristine natural environments. Conservation concerns already existed when the designation occurred, echoing the geography described in the [Minnesota state motto](/states/minnesota/motto/letoile-du-nord)."
      - "Some legislators worried that official designation might encourage picking. The legislature addressed this by emphasizing the flower's protected status. Laws prohibiting removal of lady's slippers from public land gained support. The designation became official on February 19, 1902. Minnesota became one of the earliest states to choose a native orchid."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Minnesota State Flower Facts"
    facts:
      - "Pink and White Lady's Slippers can take 16 years to bloom from seed, making them extremely vulnerable to habitat disturbance and over-collection"
      - "Minnesota law strictly prohibits picking or digging lady's slippers on public lands, with violations subject to fines and penalties"
      - "Minnesota adopted the Pink and White Lady's Slipper on February 19, 1902, becoming one of the first states to designate a native orchid"
      - "The flower's pouch-shaped lip functions as a trap that forces bees to exit past reproductive parts, ensuring pollination occurs"
      - "Lady's slippers require specific mycorrhizal fungi in the soil to germinate and survive, making transplanting nearly impossible"
      - "Individual lady's slipper plants can live for 50 years or more once established in favorable wetland or forest conditions"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Minnesota State Flower and Bird"
    paragraphs:
      - "The Common Loon serves as Minnesota's state bird, a large aquatic bird known for its haunting calls on northern lakes. Both symbols represent Minnesota officially. Minnesota adopted the Pink and White Lady's Slipper in 1902 and designated the Common Loon as state bird in 1961; see the [official Minnesota state bird](/states/minnesota/bird/common-loon)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "Symbolism and Meaning"
    paragraphs:
      - "The Pink and White Lady's Slipper is commonly seen as representing rare beauty and the fragility of nature. The flower has been linked to Minnesota's wilderness heritage and pristine northern forests. Its protected status carries connotations of conservation values and the importance of preserving endangered native species across [states by population](/rankings/demographics/states-by-population)."

faq:
  - question: "What is Minnesota's state flower?"
    answer: "Minnesota's state flower is the Pink and White Lady's Slipper, a rare native orchid with a distinctive pink pouch and white petals that blooms in wetlands and forests."
  
  - question: "When did Minnesota adopt the Pink and White Lady's Slipper as its state flower?"
    answer: "Minnesota adopted the Pink and White Lady's Slipper on February 19, 1902. The state legislature made this designation without organizing a public vote."
  
  - question: "Why did Minnesota choose the Pink and White Lady's Slipper?"
    answer: "Minnesota chose the Pink and White Lady's Slipper because the rare orchid grew naturally in the state's northern forests and wetlands. Its distinctive beauty and unique appearance made it uniquely Minnesota. The flower represented the state's pristine natural environments."
  
  - question: "Is it illegal to pick lady's slippers in Minnesota?"
    answer: "Yes, Minnesota law strictly prohibits picking or digging lady's slippers on public lands. Violations are subject to fines and penalties. The orchid is protected due to its endangered status and extremely slow growth."
  
  - question: "When do Pink and White Lady's Slippers bloom in Minnesota?"
    answer: "Pink and White Lady's Slippers bloom from late June through July in Minnesota. Individual flowers last two to three weeks. A single plant can take 16 years to produce its first bloom from seed."

