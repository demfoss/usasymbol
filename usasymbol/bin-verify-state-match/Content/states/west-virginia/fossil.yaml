faq:
- question: What is West Virginia's state fossil?
  answer: "West Virginia's state fossil is Jefferson's ground sloth, Megalonyx jeffersonii. It was designated by the West Virginia Legislature in 2008."
- question: When did West Virginia adopt its state fossil?
  answer: "West Virginia adopted Jefferson's ground sloth as its state fossil in 2008, after a campaign led by West Virginia schoolchildren."
- question: What did Jefferson's ground sloth look like?
  answer: "Megalonyx jeffersonii was up to 10 feet long and weighed up to 2,400 pounds, with a broad skull, powerful limbs, and large curved claws. It walked on the outer edges of its hind feet with its claws turned inward to protect the tips."
- question: Where are Jefferson's ground sloth fossils found in West Virginia?
  answer: "The type specimens were found in a limestone cave in Greenbrier County, near present-day Ronceverte. Organ Cave in the same county is near the original find site. Other cave deposits in Monroe and Pocahontas counties have also produced Pleistocene mammal bones."
- question: When did Jefferson's ground sloth live?
  answer: "Megalonyx jeffersonii lived during the Late Pleistocene and went extinct about 10,000 years ago at the end of the last Ice Age."
- question: Why is the ground sloth named after Thomas Jefferson?
  answer: "Jefferson studied bones collected from a Greenbrier County cave and presented the first scientific description of the animal in 1797. Later scientists named the species jeffersonii in his honor. That paper is now considered the founding work of American vertebrate paleontology."

