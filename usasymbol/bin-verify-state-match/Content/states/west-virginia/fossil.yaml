- id: facts
  icon: fa-solid fa-lightbulb
  title: Jefferson's Ground Sloth Facts
  facts:
  - "West Virginia designated Megalonyx jeffersonii as its state fossil in 2008, following a campaign by West Virginia schoolchildren."
- "Thomas Jefferson's 1797 paper describing this animal is considered the first major work of American vertebrate paleontology."
- "Jefferson initially believed the large claw bones belonged to a predator three times the size of a lion — only later analysis confirmed it was a plant-eater."
- "Megalonyx means great claw in Greek, named for the massive curved claws Jefferson found in the Greenbrier County cave."
- "The species is a distant relative of the two-toed and three-toed tree sloths living in Central and South America today."

