- id: facts
  icon: fa-solid fa-lightbulb
  title: Sea Lily Facts
  facts:
  - "Missouri designated Delocrinus missouriensis as its state fossil in 1989."
  - "Sea lilies are animals, not plants — they are echinoderms, in the same group as starfish and sea urchins."
  - "Crinoid stem segments (columnals) are among the most common fossils found in Missouri's Pennsylvanian limestone."
  - "The species name missouriensis was given because the type specimens came from Missouri, making it uniquely tied to the state."
  - "During the Pennsylvanian period, Missouri was not landlocked — it lay beneath a warm tropical sea teeming with crinoid gardens."

