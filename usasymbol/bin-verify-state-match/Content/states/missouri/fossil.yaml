faq:
- question: What is Missouri's state fossil?
  answer: "Missouri's state fossil is the sea lily Delocrinus missouriensis, a stalked marine animal from the Pennsylvanian period, about 300 million years old, designated in 1989."
- question: When did Missouri adopt its state fossil?
  answer: "Missouri designated Delocrinus missouriensis as its official state fossil in 1989."
- question: What did the sea lily look like?
  answer: "Delocrinus missouriensis had a segmented stem attached to the seafloor and a small cup at the top with flexible feathery arms used to catch food. It looked like a flower but was entirely an animal."
- question: Where are sea lily fossils found in Missouri?
  answer: "Crinoid fossils are found across central and western Missouri in Pennsylvanian limestone outcrops — road cuts, creek banks, and quarry walls. Small disc-shaped stem segments erode freely into gravel across the region."
- question: When did the sea lily live?
  answer: "Delocrinus missouriensis lived during the Pennsylvanian period, about 300 million years ago, when Missouri was covered by a warm shallow inland sea."
- question: Who pushed to make it the state fossil?
  answer: "The 1989 designation recognized Delocrinus missouriensis as the fossil most closely identified with Missouri — named for the state and found abundantly across its limestone bedrock."

