faq:
  - question: What is Missouri's state exercise?
    answer: "Missouri's official state exercise is the jumping jack, adopted in 2014."
  - question: When did Missouri adopt jumping jacks as its state exercise?
    answer: "Missouri adopted jumping jacks as its state exercise in 2014, when Governor Jay Nixon signed the bill into law that July."
  - question: Why did Missouri choose jumping jacks?
    answer: "The exercise is credited to General John J. Pershing, who was born near Laclede, Missouri, and later commanded American forces in World War I. Missouri honored his invention with the designation."
  - question: Did students really help make jumping jacks official?
    answer: "Yes. Fourth-grade classes at Pershing Elementary School in St. Joseph lobbied lawmakers for years before the bill finally passed in 2014."

