sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Missouri State Sport
    paragraphs:
      - "Missouri designated jumping jacks its official state exercise in 2014, adding a second official physical activity to a list that already included archery, the state's official sport. Both designations reward invention over popularity: archery for producing the compound bow, and jumping jacks for producing an exercise now performed in gyms worldwide. Few states have built two official designations around things invented by their own residents."

  - id: what-is
    icon: fa-solid fa-person-running
    title: "Jumping Jack Explained"
    paragraphs:
      - "To perform a jumping jack, a person starts standing with feet together and arms at the sides, then jumps to spread the feet apart while raising the arms overhead, before jumping back to the starting position. The motion repeats quickly, usually for a set number of reps or a fixed stretch of time. Gym classes, military training, and home workouts still use the same basic movement more than a century after it first appeared."
      - "Missouri's statute places the exercise's origin at West Point in the late 1800s, when Pershing served there as a tactical officer training cadets. Other retellings place the moment earlier, during Pershing's own cadet years, when he used the same drill to organize classmates into groups. Either version ties the exercise to the same Missouri-born officer."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Jumping Jack Represents Missouri
    paragraphs:
      - "Missouri chose jumping jacks because the exercise's credited inventor was Missouri's own. Pershing was born near Laclede in 1860 and later became General of the Armies, a rank Congress created specifically for him in 1919 and has extended to only two other people since, both posthumously. Recognizing his invention gave Missouri a direct, personal link to a movement now performed in gyms worldwide."
      - "Pershing's later career gave the designation weight beyond a school drill. He commanded the American Expeditionary Forces in World War I, one of the largest deployments in American military history, and Missouri preserves his boyhood home in Laclede as a National Historic Landmark. Naming an exercise after his invention let the state celebrate that record in a form anyone could physically repeat."
      - "The designation also cost nothing to put into practice. Gym classes, military recruits, and home workouts already used the same movement long before Missouri made it official, so the law simply attached a name and a history to an exercise most residents already knew."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Jumping Jack Became Missouri's State Exercise
    paragraphs:
      - "Missouri's recognition of jumping jacks came from a campaign that ran for years rather than a single legislative push. Successive fourth-grade classes at Pershing Elementary School in St. Joseph lobbied lawmakers with the help of Representative Pat Conway until the bill finally passed in 2014. Governor Jay Nixon signed it into law that July, and the designation took effect that August."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Jumping Jack Facts
    facts:
      - "Missouri designated jumping jacks its official state exercise in 2014."
      - "The exercise is credited to General John J. Pershing, born near Laclede, Missouri, in 1860."
      - "Fourth-grade classes at Pershing Elementary School in St. Joseph lobbied for years to get the designation passed."
      - "Governor Jay Nixon signed the bill into law in July 2014, effective that August."
      - "Missouri also recognizes archery as its official state sport, adopted in 2022."

