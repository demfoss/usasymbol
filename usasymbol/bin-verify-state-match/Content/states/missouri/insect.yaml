sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Missouri?
  paragraphs:
  - "The honey bee, Apis mellifera, is Missouri's official state insect. The Missouri General Assembly designated it in 1985."
  - "Missouri has a long history of beekeeping, and honey bees remain important to farms and gardens across the state."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
  - "Honey bees live in large colonies built around a single queen. Worker bees gather nectar and pollen, build wax honeycomb, and produce honey."
  - "A single hive can hold thousands of bees, all working together to feed and grow the colony."

- id: history
  icon: fa-solid fa-landmark
  title: How Missouri Chose the European Honey Bee
  paragraphs:
  - "The Missouri General Assembly named the European honey bee the official state insect in 1985."
  - "Lawmakers recognized the honey bee for its role in pollinating Missouri crops and its value to the state's beekeeping industry."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted in 1985 by the Missouri General Assembly."
  - "Scientific name: Apis mellifera."
  - "Body is golden-brown and black with fuzzy stripes and two pairs of clear wings."
  - "Honey bees live in large colonies built around one queen."
  - "Honey bees pollinate many crops and garden plants across Missouri."




