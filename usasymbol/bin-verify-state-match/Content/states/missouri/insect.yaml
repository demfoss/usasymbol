faq:
- question: What is Missouri's state insect?
  answer: "Missouri's state insect is the European honey bee, adopted by the Missouri General Assembly in 1985."
- question: When did Missouri adopt the European honey bee?
  answer: "Missouri adopted the European honey bee as its official state insect in 1985."
- question: Why did Missouri choose the European honey bee?
  answer: "Lawmakers recognized the honey bee for its role in pollinating Missouri crops and its value to the state's beekeeping industry."
- question: What does Missouri's state insect look like?
  answer: "The European honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
- question: Where can you find the European honey bee in Missouri?
  answer: "Honey bees are found throughout Missouri, kept by beekeepers and living wild, and are commonly seen on flowers in gardens and farms."

