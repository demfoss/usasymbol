faq:
- question: What is Maine's state insect?
  answer: "Maine's state insect is the European honey bee, adopted by the Maine Legislature in 1975."
- question: When did Maine adopt the European honey bee?
  answer: "Maine adopted the European honey bee as its official state insect in 1975."
- question: Why did Maine choose the European honey bee?
  answer: "Lawmakers wanted to recognize the importance of honey bees to Maine agriculture and crop pollination."
- question: What does a European honey bee look like?
  answer: "It has a fuzzy, golden-brown and black striped body. Colonies include one queen, thousands of worker bees, and a smaller number of drones."
- question: Is the European honey bee the same as Maine's state butterfly?
  answer: "No. Maine's state butterfly is the Pink-edged Sulphur, adopted in 2023. The European honey bee is a separate designation, the state insect, adopted in 1975."

