faq:
- question: What is Maine's state soil?
  answer: "Maine's state soil is the Chesuncook series, a very poorly drained glacial soil of the northern boreal forest. The Maine Legislature designated it the official state soil in 1999. It is named for Chesuncook Lake in Piscataquis County."
- question: Why is Chesuncook soil always wet?
  answer: "Two things keep Chesuncook soil saturated. First, the dense glacial till it formed in drains water very slowly — the Laurentide ice sheet compacted the till under enormous pressure, leaving a nearly impermeable layer. Second, the nearly flat landscape gives snowmelt nowhere to go. The result is a soil that stays waterlogged from snowmelt in spring through most of the summer, then freezes solid in late autumn."
- question: What color is Chesuncook soil?
  answer: "The surface is dark — almost black where organic matter has built up under the forest. Below it, the mineral soil turns light gray and then gray throughout. That gray color is called gleying: in waterlogged soil with no oxygen, iron changes from rust-brown to a colorless soluble form and washes away, leaving the soil pale gray or greenish gray."
- question: What is gleying?
  answer: "Gleying is what happens to soil when it stays waterlogged and runs out of oxygen. Bacteria use up the oxygen trying to decompose organic matter, and no new oxygen can get in through the water-saturated pores. Without oxygen, iron in the soil chemically changes — it goes from rust-brown (oxidized) to a pale, soluble form (reduced) that washes away. The result is gray or greenish-gray soil. Gray subsoil is one of the most reliable signs that a soil stays wet year-round."
- question: Can you farm Chesuncook soil?
  answer: "No, not without massive drainage and soil amendment — and even then it would be difficult. Chesuncook soil is very poorly drained, highly acidic, cold, and low in the nutrients that crops need. It is not farmland. It is one of the few state soils chosen specifically for its ecological importance rather than agricultural value."
- question: What grows in Chesuncook soil?
  answer: "Black spruce and balsam fir are the primary trees — both can tolerate the waterlogged, acidic, cold conditions that other trees cannot survive. Tamarack grows in the wettest depressions. White cedar occupies the slightly drier edges. Sphagnum moss covers much of the surface, keeping it perpetually moist. Moose are the most prominent wildlife on this landscape."
- question: Who was Thoreau and why does he matter here?
  answer: "Henry David Thoreau was an American writer and naturalist who traveled through the Chesuncook region in 1853, paddling the West Branch of the Penobscot River to Chesuncook Lake. He wrote about the trip in his book The Maine Woods, published in 1864. His description of the wilderness — remote lakes, vast spruce forest, a moose he watched being killed — is one of the earliest and most famous accounts of the Maine north woods. The landscape he described is the same landscape that Chesuncook soil underlies today."
- question: How is Chesuncook soil different from other state soils?
  answer: "Most state soils were chosen for agricultural importance — they grow the state's defining crop or cover its best farmland. Chesuncook is the opposite: it was chosen because it represents Maine's most distinctive natural landscape, not its most productive one. It cannot be farmed. It is the soil of the wilderness, chosen to honor the boreal forest rather than the field."

