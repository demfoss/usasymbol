seo_title: "New Jersey State Tree | Northern Red Oak"
seo_description: 'New Jersey named northern red oak its state tree in 1950, recognizing a common hardwood of state forests, parks, and colonial landscapes.'

intro_text: "New Jersey named the Northern Red Oak its state tree in 1950, honoring a hardwood found across much of the state's forests. Its long usefulness for timber and its broad presence in the landscape made it a practical and familiar choice. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of New Jersey"
    paragraphs:
      - "New Jersey's official state tree is the Northern Red Oak, a large deciduous hardwood native to eastern North America. This oak grows 60 to 80 feet tall in New Jersey forests, with exceptional specimens reaching 100 feet or more. The trunk measures two to four feet in diameter on mature trees. Some ancient New Jersey red oaks exceed five feet across. The tree grows relatively fast for an oak, adding 12 to 18 inches per year during youth. Red oak can live 200 to 300 years in New Jersey forests. The species provided valuable lumber for New Jersey's colonial economy and continues as an important timber tree today."
      - "The bark appears dark gray to nearly black with flat-topped ridges separated by shallow furrows. Young trees show smoother bark that develops the ridged pattern with age. The ridges run vertically up the trunk in relatively straight lines. Unlike white oak's scaly bark, red oak bark forms distinct linear ridges. The leaves measure five to nine inches long with seven to eleven pointed lobes. Each lobe has bristle-tipped teeth, distinguishing red oak group species from white oak group members with rounded lobes. The leaves emerge reddish-pink in spring, turn dark green in summer, and transform to brilliant red or russet-brown in fall. Fall color creates spectacular displays across New Jersey hillsides each autumn."
      - "Northern Red Oak grows throughout New Jersey from the Appalachian ridge in the northwest to the coastal plain in the south. The species thrives on well-drained upland sites across the state. New Jersey's red oaks dominate mixed hardwood forests alongside sugar maple, black birch, and hickories in northern counties. In southern New Jersey, red oak mixes with other oaks and pines. The tree adapts to various soil types from rocky mountain slopes to sandy coastal soils. Red oak acorns mature in fall of the second year, unlike white oak acorns that mature in one season. The acorns provide critical food for New Jersey wildlife. White-tailed deer depend heavily on red oak acorns during fall and winter."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Northern Red Oak"
    paragraphs:
      - "The official name is Northern Red Oak, distinguishing it from southern red oak and other red oak species. The scientific name Quercus rubra combines Quercus (Latin for oak) with rubra (Latin for red). The 'red' refers to the reddish inner wood and fall leaf color. Early New Jersey colonists called it red oak or simply oak without specifying the species. The genus Quercus includes over 400 oak species worldwide, with Northern Red Oak being one of the most widespread in eastern North America."
      - "Some references use the name champion oak for particularly large specimens. Lumbermen sometimes called it Spanish oak, though this name also applies to other species. The species belongs to the Fagaceae family, the beech family. New Jersey's Northern Red Oak is the same species found throughout the northeastern and north-central United States and southeastern Canada. The tree grows naturally from Maine to Georgia and west to Minnesota and Oklahoma. New Jersey lies near the center of the species' range where red oak grows most abundantly."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Northern Red Oak Became the New Jersey State Tree"
    paragraphs:
      - "New Jersey named the Northern Red Oak as its official state tree on June 13, 1950. The New Jersey Legislature passed the designation during the 1950 session. The legislation recognized red oak as a tree abundant in New Jersey forests and important to the state's history. By 1950, red oak had become the dominant hardwood in many New Jersey forests, particularly in the northern counties. The tree's economic value and widespread presence made it a practical choice for representing New Jersey's forest resources and the character behind [the Garden State nickname](/states/new-jersey/nickname/the-garden-state)."
      - "New Jersey chose Northern Red Oak because it represented the state's diverse forest landscape. The tree grows throughout New Jersey from the Kittatinny Mountains to the Pine Barrens, adapting to the state's varied geography. Red oak thrives in New Jersey's climate and soil conditions better than many other hardwoods. The species grows naturally across the entire state, meaning every New Jersey county contains red oak forests. This widespread distribution allowed all New Jersey residents to recognize and appreciate the state tree regardless of where they lived, much like examples in the [list of U.S. state flowers](/symbols/flowers)."
      - "The tree held significant economic importance for New Jersey's development. Colonial shipbuilders used New Jersey red oak for ship timbers, though it proved less durable than white oak for hulls exposed to water. The wood excelled for interior ship construction and deck planking. New Jersey furniture makers prized red oak for its attractive grain and workability. The lumber built countless New Jersey homes, barns, and commercial buildings from colonial times through the 20th century. Red oak flooring became standard in New Jersey houses during the 1800s and remains popular today. The wood's strength and attractive appearance suited it for furniture, cabinets, and interior trim. New Jersey's lumber industry processed millions of board feet of red oak annually during the state's peak logging years. The combination of statewide distribution, attractive appearance, and economic value made Northern Red Oak the logical choice for New Jersey's official tree symbol. The species represented both New Jersey's natural heritage and the forest industries that supported communities across the state."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Jersey State Tree Facts"
    facts:
      - "New Jersey named Northern Red Oak as state tree on June 13, 1950, recognizing its abundance throughout the state"
      - "The bristle-tipped pointed lobes distinguish red oak from white oak, which has rounded lobes without bristles"
      - "Red oak acorns take two years to mature, unlike white oak acorns that mature in one season"
      - "The inner wood appears reddish or pinkish, giving the tree its common name, while the outer sapwood is lighter"
      - "Northern Red Oak is one of the most common trees in New Jersey's forests, particularly in northern counties"
      - "The fall color ranges from bright red to russet-brown, creating spectacular autumn displays across New Jersey hillsides"
      - "Red oak lumber has open pores making it unsuitable for barrels, unlike white oak which has watertight wood"
      - "New Jersey's largest red oaks can produce over 5,000 acorns in a good mast year, feeding countless wildlife"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "New Jersey State Tree and Flower"
    paragraphs:
      - "New Jersey's state flower is the Common Meadow Violet (Viola sororia), designated in 1971. The state chose its tree symbol 21 years before adopting the violet. Both symbols represent New Jersey's native flora. The low-growing violet blooms purple in spring across New Jersey meadows and lawns, while red oak towers over forests statewide. Violets flower in April and May as red oak leaves emerge reddish-pink. By fall, violets have completed their cycle while red oaks display brilliant autumn color. The pair shows New Jersey's landscape from woodland floor to forest canopy, representing the state's diverse natural communities from the mountains to the coast; see [the state flower page](/states/new-jersey/flower/violet)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a New Jersey Red Oak"
    paragraphs:
      - "The leaf shape provides reliable identification. Look for leaves with seven to eleven pointed lobes. Each lobe extends outward with bristle-tipped teeth at the tip and along the edges. The lobes cut far into the leaf, sometimes reaching more than halfway to the midrib. The leaf appears roughly symmetrical with the widest part near the middle or outer third. Leaves measure five to nine inches long and four to six inches wide. The upper surface appears dark green and somewhat glossy. The underside shows lighter green with tufts of hair in vein axils. This bristle-tipped lobe pattern immediately identifies red oak group species."
      - "The bark develops a characteristic pattern on mature trees. Look for dark gray to blackish bark with flat-topped vertical ridges. The ridges run straight up the trunk separated by shallow furrows. The pattern resembles ski tracks running parallel up the tree. Young red oak bark appears smoother and lighter gray, gradually developing ridges as the tree ages. The bark never develops the deep furrows and thick scaly plates of white oak. Red oak bark has a somewhat shiny appearance compared to the dull gray of white oak bark."
      - "The overall form shows a straight central trunk extending well into the crown before major branching. Young red oaks develop pyramidal crowns with branches angled upward. Mature trees form rounded to irregular crowns spreading 40 to 60 feet wide. The crown appears relatively open rather than densely packed with foliage. Lower branches often die and drop off as trees mature, leaving clean trunks for 30 to 50 feet. Acorns measure three-quarters to one inch long with shallow caps covering only one-quarter of the nut. The caps have thin, tight-fitting scales. Acorns mature in fall of the second year, starting green and turning brown. Look for acorns with thin caps and leaves with bristle-tipped lobes for certain identification."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the New Jersey State Tree Symbolizes"
    paragraphs:
      - "Northern Red Oak represents New Jersey's forested landscape and natural heritage. The tree symbolizes strength and longevity, living for centuries in New Jersey woodlands. For many New Jersey residents, red oak forests evoke memories of hiking trails, autumn leaf displays, and the wooded character that persists despite the state's density. The species connects modern New Jersey to colonial history when red oak lumber built settlements across the state. The tree's ability to thrive throughout New Jersey - from mountain ridges to coastal plains - reflects the state's geographic diversity and civic ideals in [New Jersey's motto](/states/new-jersey/motto/liberty-and-prosperity). Red oak reflects New Jersey's commitment to maintaining forest resources and wildlife habitat in one of America's most densely populated states."

faq:
  - question: "What is the New Jersey state tree?"
    answer: "The Northern Red Oak (Quercus rubra) is New Jersey's official state tree. The New Jersey Legislature named it the state tree on June 13, 1950, recognizing its abundance throughout the state."
  
  - question: "What is the New Jersey state tree called?"
    answer: "New Jersey's state tree is called Northern Red Oak or red oak. The scientific name is Quercus rubra, meaning 'red oak.' It's also been called champion oak for large specimens or Spanish oak in some regions."
  
  - question: "When was the New Jersey state tree adopted?"
    answer: "New Jersey named the Northern Red Oak as its official state tree on June 13, 1950. The Legislature passed the designation during the 1950 session, recognizing a tree abundant in New Jersey forests."
  
  - question: "Why is the Northern Red Oak New Jersey's state tree?"
    answer: "New Jersey chose Northern Red Oak because it grows throughout the entire state from the Kittatinny Mountains to the Pine Barrens. The tree thrives in New Jersey's climate and adapts to varied geography. Red oak was economically important - the lumber built New Jersey homes, ships, and furniture from colonial times onward. The species' statewide distribution meant all residents could recognize the state tree. It represents New Jersey's forest heritage and continues as the dominant hardwood in many state forests."
  
  - question: "What is the New Jersey state tree name?"
    answer: "The name is Northern Red Oak. The scientific name is Quercus rubra - Quercus means oak, and rubra means red. The 'red' refers to the reddish inner wood and red fall leaf color. 'Northern' distinguishes it from southern red oak."
  
  - question: "Where does the New Jersey state tree grow?"
    answer: "The Northern Red Oak grows throughout New Jersey from the Appalachian ridge in the northwest to the coastal plain. It thrives on well-drained upland sites across the state. Red oak dominates mixed hardwood forests in northern counties and mixes with other oaks and pines in southern New Jersey. The species grows naturally from Maine to Georgia and west to Minnesota."
  
  - question: "What are some facts about the New Jersey state tree?"
    answer: "The Northern Red Oak grows 60 to 80 feet tall with dark gray bark showing flat-topped vertical ridges. The leaves have seven to eleven pointed lobes with bristle tips. Acorns take two years to mature. The inner wood is reddish. Fall color ranges from bright red to russet-brown. Red oak is one of the most common trees in New Jersey forests. Large trees produce over 5,000 acorns in good years."
  
  - question: "How do you recognize the New Jersey state tree?"
    answer: "Look for leaves with seven to eleven pointed lobes tipped with bristles. The lobes cut far into the leaf. Dark gray to blackish bark has flat-topped vertical ridges like ski tracks. Acorns have shallow caps covering one-quarter of the nut. The tree forms a rounded crown 40 to 60 feet wide. Fall leaves turn bright red to russet-brown. Bristle-tipped lobes distinguish it from white oak's rounded lobes."

