intro_text: "New Jersey's state fossil is the Hadrosaurus (Hadrosaurus foulkii), a duck-billed dinosaur discovered in Haddonfield in 1858 and designated by the legislature in 1991 following a campaign by New Jersey schoolchildren. This profile appears in the [list of U.S. state fossils](/symbols/fossils)."

sections:
- id: overview
  icon: fa-solid fa-bone
  title: New Jersey State Fossil
  paragraphs:
  - "Hadrosaurus foulkii is a hadrosaur, a large duck-billed herbivorous dinosaur from the Late Cretaceous. The name means 'bulky lizard of Foulke,' honoring William Parker Foulke, the Philadelphia naturalist who organized the 1858 excavation in Haddonfield. The species holds a unique place in paleontology: it was the first nearly complete dinosaur skeleton found in North America and, when mounted at the Academy of Natural Sciences in Philadelphia in 1868, became the first dinosaur skeleton ever put on public display anywhere in the world."
  - "Before Hadrosaurus, scientists pictured dinosaurs as slow, four-legged lizard-like animals. The upright, two-legged posture of the Haddonfield skeleton rewrote that image and shaped how dinosaurs were illustrated and understood for the next century."

- id: about
  icon: fa-solid fa-paw
  title: What the Hadrosaurus Was
  paragraphs:
  - "Hadrosaurus foulkii was a large hadrosaur, estimated at 23 to 26 feet (7 to 8 m) long. It had a broad, toothless bill at the front of the jaw and hundreds of tightly packed cheek teeth for grinding plant material. Like other hadrosaurs, it could walk on two legs or drop to all four, and its tail was long and flattened, likely useful for swimming."
  - "The original specimen found in Haddonfield was missing its skull, which has made precise classification difficult. What survived included much of the backbone, hips, limbs, and feet, enough to show that this was a large, upright animal built very differently from the slow, four-legged animals scientists had previously imagined. It lived in the coastal lowlands that bordered the Late Cretaceous sea covering what is now southern New Jersey and went extinct 66 million years ago."

- id: history
  icon: fa-solid fa-landmark
  title: How the Hadrosaurus Became New Jersey's State Fossil
  paragraphs:
  - "In 1858, William Parker Foulke, a Philadelphia lawyer and amateur naturalist, was visiting friends in Haddonfield when he heard that workers had pulled large bones from a marl pit on a nearby property some twenty years earlier. Foulke organized excavations at the same pit, and workers quickly uncovered a partial but remarkably complete dinosaur skeleton. He brought the find to Joseph Leidy at the Academy of Natural Sciences in Philadelphia, the leading American paleontologist of the era."
  - "Leidy described the species in 1858 and named it Hadrosaurus foulkii in Foulke's honor. A decade later, sculptor and artist Benjamin Waterhouse Hawkins mounted the skeleton at the Academy, completing the world's first publicly displayed dinosaur skeleton in 1868. New Jersey schoolchildren led the push to make it the official state fossil, and the legislature adopted the designation in 1991."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Hadrosaurus Fossils Are Found in New Jersey
  paragraphs:
  - "The original Hadrosaurus foulkii skeleton was found in a greensand marl pit in Haddonfield, Camden County. A stone monument marks the approximate discovery site today on Maple Avenue. The marl was part of the Campanian-age Woodbury Formation, a coastal deposit from the shallow sea that covered southern New Jersey during the Late Cretaceous."
  - "Additional hadrosaur and other Cretaceous dinosaur material has since been found in the greensand formations of south Jersey, from Monmouth County south through Camden and Gloucester counties. The New Jersey State Museum in Trenton and the Academy of Natural Sciences of Drexel University in Philadelphia both hold significant collections, including casts and original material from the Haddonfield area."
