- id: facts
  icon: fa-solid fa-lightbulb
  title: Hadrosaurus Facts
  facts:
  - "New Jersey designated Hadrosaurus foulkii its state fossil in 1991, following a campaign by New Jersey schoolchildren."
  - "When mounted at the Academy of Natural Sciences in Philadelphia in 1868, it became the first dinosaur skeleton ever put on public display in the world."
  - "The discovery in 1858 was the first nearly complete dinosaur skeleton found in North America."
  - "The original specimen had no skull, so paleontologist Joseph Leidy and sculptor Benjamin Waterhouse Hawkins built a model head for the 1868 mount based on related species."
  - "Hadrosaurus foulkii was named for William Parker Foulke, the amateur naturalist who organized the Haddonfield excavation after hearing workers' stories about bones found decades earlier."

