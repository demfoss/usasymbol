faq:
- question: What is New Jersey's state fossil?
  answer: "New Jersey's state fossil is the Hadrosaurus (Hadrosaurus foulkii), a large duck-billed dinosaur from the Late Cretaceous, designated in 1991."
- question: When did New Jersey adopt its state fossil?
  answer: "New Jersey adopted the Hadrosaurus as its state fossil in 1991, after New Jersey schoolchildren campaigned for the designation."
- question: What did the Hadrosaurus look like?
  answer: "Hadrosaurus foulkii was about 23 to 26 feet long with a broad, toothless bill, hundreds of grinding cheek teeth, and a long flattened tail. It could walk on two legs or all four."
- question: Where are Hadrosaurus fossils found in New Jersey?
  answer: "The original skeleton was found in a marl pit in Haddonfield, Camden County. A marker stands at the site today. Cretaceous dinosaur fossils have also been found in the greensand formations across Monmouth, Camden, and Gloucester counties in southern New Jersey."
- question: When did the Hadrosaurus live?
  answer: "Hadrosaurus foulkii lived during the Late Cretaceous (Campanian), about 80 to 78 million years ago, in the coastal lowlands bordering the shallow sea that covered southern New Jersey. It went extinct 66 million years ago."
- question: Who pushed to make it the state fossil?
  answer: "New Jersey schoolchildren led the campaign for the state fossil designation in 1991. The original discovery was driven by William Parker Foulke, a Philadelphia naturalist who organized the 1858 excavation after hearing stories of bones found in a Haddonfield marl pit decades earlier."

