seo_title: "Pennsylvania State Firearm | Long Rifle"
seo_description: "Pennsylvania made the Long Rifle its state firearm in 2014, tying the symbol to Lancaster gunmaking and frontier history."

intro_text: "Pennsylvania didn't need to rename what it invented. While the world would come to know it as the Kentucky Rifle, the long rifle was conceived, designed, and perfected in the workshops of Lancaster and Northampton counties — forged by German immigrant craftsmen who gave America its first precision weapon and established the tradition behind the [official state guns of the United States](/symbols/firearms)."

big_stat:
  number: "100"
  description: "Yards of effective range — three times the accuracy of the British Brown Bess smoothbore musket. In 1740, no military firearm on the continent could match what Lancaster County gunsmiths had already built."

timeline:
  - year: "circa 1710"
    description: "German and Swiss immigrants begin settling Lancaster and Northampton counties in Pennsylvania, bringing European gunsmithing techniques and a centuries-old tradition of precision metalwork."
  - year: "circa 1740"
    description: "Martin Meylin and fellow Lancaster County gunsmiths develop the elongated rifled long rifle — extending the barrel to 40+ inches and cutting spiral grooves for accuracy that no smoothbore musket could approach."
  - year: "2010"
    description: "First legislative efforts begin in the Pennsylvania General Assembly to formally designate the Pennsylvania Long Rifle as an official state symbol."
  - year: "2014 (March)"
    description: "House Bill 1989 is introduced by Rep. Dick Hess — originally as a bill to designate the Piper J-3 Cub as Pennsylvania's official state aircraft. No firearms provision exists in the original text."
  - year: "June 2014"
    description: "An amendment designating the Pennsylvania Long Rifle as state firearm is attached to HB 1989. Governor Tom Corbett signs the combined bill into law over objections from Philadelphia-area legislators."

expert_quote:
  text: "Pennsylvania's German craftsmen didn't just make a rifle — they made the rifle that armed a continent, won a revolution, and defined the American frontier."
  source: "Pennsylvania Long Rifle heritage — Lancaster County gunsmithing tradition, c. 1740"

sections:
  - id: "german-gunsmiths"
    icon: "fa-hammer"
    title: "The True Creators: German Gunsmiths of the 1700s"
    paragraphs:
      - "The story of the Pennsylvania Long Rifle begins not in Kentucky, but in the dense German-speaking communities of Lancaster and Northampton counties in the early 1700s. German and Swiss immigrants — many of them Moravian craftsmen — brought with them a tradition of precision metalworking that would transform American warfare, frontier survival, and ultimately the outcome of the American Revolution, with regional context in [States That Border Pennsylvania](/states/pennsylvania/borders)."
      - "The most significant name in this story is Martin Meylin, a German-born gunsmith who settled in Lancaster County and is widely credited as one of the earliest creators of the American long rifle. By approximately 1740, Meylin and his contemporaries had developed a distinctive design that would change the continent: an elongated barrel of 40 or more inches, paired with a rifled bore that imparted stabilizing spin to the lead ball — delivering accuracy that soldiers and frontiersmen had never experienced."
      - "Lancaster County became the undisputed center of this emerging industry. Dozens of skilled gunsmiths established shops across the county, each refining the long rifle's design through generations of craftsmanship. Unlike the mass-produced muskets of European armies, every Pennsylvania Long Rifle was handcrafted to the specific needs of its owner — making each weapon a unique work of functional art."
    subsections:
      - subtitle: "Historical Roots: Lancaster & Northampton Counties"
        text: "The geographic heart of Pennsylvania Long Rifle production stretched across Lancaster County — where Martin Meylin established his shop near what is now Willow Street — and neighboring Northampton County. These communities of German-speaking settlers created an ecosystem of gunsmithing talent that had no parallel in colonial America. The rifles produced here would arm both frontier hunters and Revolutionary War militias."

  - id: "kentucky-connection"
    icon: "fa-arrows-left-right"
    title: "The Kentucky Connection: Correcting History"
    paragraphs:
      - "The rifle Pennsylvania invented would eventually carry a different state's name. By the mid-18th century, Kentucky and Virginia frontiersmen had adopted the Pennsylvania Long Rifle as their weapon of choice — and through decades of frontier legend, popular ballads, and military glory, the name 'Kentucky Rifle' gradually eclipsed the rifle's true Pennsylvania origin."
      - "The naming shift was cultural, not geographic. Samuel Woodworth's 1821 ballad 'The Hunters of Kentucky' celebrated the marksmen who helped Andrew Jackson defeat the British at the Battle of New Orleans, cementing a poetic association between Kentucky frontiersmen and the long rifle. But the rifles those Kentucky hunters carried were built almost universally in Pennsylvania, by craftsmen who had never crossed the Appalachians."
      - "Pennsylvania's 2014 state firearm designation reclaims that history with authority. By formally designating the Pennsylvania Long Rifle, the Commonwealth acknowledges what historians have documented for generations: the rifle that built America was born in Lancaster County."
    subsections:
      - subtitle: "Kentucky Long Rifle: The Same Weapon, a Different Legend"
        text: "Kentucky designated the same weapon as its official state firearm in 2013 — one year before Pennsylvania — under the name 'Kentucky Long Rifle.' Both states share a legitimate claim: Pennsylvania as the place of invention and manufacture, Kentucky as the place of legend and popular memory. The rifles are identical in design and origin; only the story of their fame differs."
        link:
          label: "Explore the Kentucky Long Rifle"
          url: "/states/kentucky/firearm/kentucky-long-rifle"
      - subtitle: "Indiana's John Small Rifle: The Tradition Carried West"
        text: "Indiana took a more specific approach, designating the rifle of John Small — a documented frontier gunsmith who crafted weapons in Vincennes during the Indiana territorial period — as its state firearm in 2012. Small's craft represented the Pennsylvania long rifle tradition carried westward by frontier settlement, a direct lineage from Lancaster County workshops to the Indiana Territory."
        link:
          label: "View Indiana State Firearm"
          url: "/states/indiana/firearm/john-small-rifle"

  - id: "hb-1989"
    icon: "fa-scale-balanced"
    title: "The Bizarre Path of House Bill 1989"
    paragraphs:
      - "The story of how the Pennsylvania Long Rifle became an official state symbol is, fittingly, as unconventional as the rifle itself. House Bill 1989 did not begin as a firearms bill. It was introduced in 2014 by Representative Dick Hess with a single purpose: designating the Piper J-3 Cub — a beloved, Pennsylvania-manufactured light aircraft — as the Commonwealth's official state aircraft symbol."
      - "In June 2014, an amendment was attached to HB 1989 that had nothing to do with airplanes. The provision designated the Pennsylvania Long Rifle as the official state firearm — a rider on a bill about Piper Cubs. The combined legislation moved through both chambers of the General Assembly and landed on Governor Tom Corbett's desk, where it was signed into law."
      - "The result was a uniquely Pennsylvania piece of legislation: a single bill that simultaneously honored the birthplace of American precision gunsmithing and the hometown of an iconic American aircraft manufacturer. Both the Piper J-3 Cub and the Pennsylvania Long Rifle became official state symbols on the same day, under the same bill number."

  - id: "philadelphia-controversy"
    icon: "fa-comments"
    title: "The Controversy: Why Philadelphia Opposed the Bill"
    paragraphs:
      - "The designation was not without opposition. Legislators representing Philadelphia and other urban centers pushed back against adding a firearms designation to state law — framing the symbolism in terms of contemporary gun violence rather than 18th-century history."
      - "The debate exposed a persistent cultural divide between rural and urban Pennsylvania. To Lancaster County, the long rifle represented two centuries of German immigrant craftsmanship and the foundation of American frontier independence. To Philadelphia, any official elevation of a firearm carried uncomfortable political weight in a city dealing with ongoing gun violence."
    subsections:
      - subtitle: "In Defense: Honoring Pennsylvania Craftsmanship"
        text: "Supporters of HB 1989 argued that designating the Pennsylvania Long Rifle was a straightforward recognition of historical craft and cultural heritage — no different in principle from naming a state bird, flower, or mineral, and no different from the case made in Utah when it designated the [Browning M1911](/states/utah/firearm/browning-m1911-pistol) two years earlier. The rifle, they contended, represented Lancaster County's German immigrant communities, their contributions to American independence, and a manufacturing tradition that predated the modern firearms debate by two and a half centuries."
      - subtitle: "In Opposition: Representative Mark B. Cohen"
        text: "Representative Mark B. Cohen of Philadelphia was among the most vocal critics, describing the long rifle designation as deeply offensive given the rates of gun violence in Pennsylvania's largest city. His objection centered not on the rifle's history but on the symbolic message that an official state firearms designation sends — a message he argued was incompatible with the daily reality of urban gun violence in 21st-century Pennsylvania."

  - id: "fur-trade"
    icon: "fa-crosshairs"
    title: "Masterpiece of the Fur Trade: Design vs. the Brown Bess"
    paragraphs:
      - "The Pennsylvania Long Rifle was engineered for a specific environment: the dense forests and unpredictable distances of the American frontier, where game could vanish at 80 yards and a missed shot meant an empty stomach for days. Lancaster County gunsmiths designed a weapon that could consistently hit a target at 100 yards — a capability that the British Army's standard-issue Brown Bess smoothbore musket could not reliably match beyond 50–75 yards."
      - "The rifle became the primary tool of the American fur trade. Trappers and hunters working the vast wilderness between the Appalachians and the Mississippi required a weapon capable of clean, precise kills at range using minimal powder — a resource the frontier never guaranteed in surplus. The Pennsylvania Long Rifle's accuracy and efficiency made it the definitive frontier survival tool, and the craftsmen of Lancaster County its irreplaceable suppliers. This demand for precision eventually drove Mountain Men further west, where the [Hawken Rifle](/states/missouri/firearm/hawken-rifle) of Missouri replaced the long rifle as the weapon of choice beyond the Mississippi."
    subsections:
      - subtitle: "Pennsylvania Long Rifle vs. British Brown Bess"
        list:
          - "**Barrel type:** Rifled bore (PA) vs. smoothbore (Brown Bess)"
          - "**Barrel length:** 40–48 inches (PA) vs. 39–42 inches (Brown Bess)"
          - "**Effective range:** ~100 yards (PA) vs. 50–75 yards (Brown Bess)"
          - "**Caliber:** .40–.50 (PA) vs. .75 caliber (Brown Bess)"
          - "**Loading speed:** Slower patch-and-ball (PA) vs. faster paper cartridge (Brown Bess)"
          - "**Primary use:** Frontier hunting & sharpshooting (PA) vs. mass volley fire tactics (Brown Bess)"

  - id: "where-to-see"
    icon: "fa-building-columns"
    title: "Where to See a Pennsylvania Long Rifle Today"
    paragraphs:
      - "Lancaster County — the birthplace of the Pennsylvania Long Rifle — remains the best place in America to encounter authentic original examples, with institutions dedicated specifically to preserving the region's gunsmithing legacy."
    subsections:
      - subtitle: "Lancaster History — Lancaster, PA"
        text: "Lancaster History (formerly the Lancaster County Historical Society) maintains one of the most significant collections of Pennsylvania Long Rifles in the country, located in the heart of the county where the weapon was invented. Their collections include rifles by documented Lancaster County gunsmiths from the 1740s onward, with historical context connecting each weapon to specific craftsmen and frontier communities."
      - subtitle: "The State Museum of Pennsylvania — Harrisburg"
        text: "The State Museum of Pennsylvania in Harrisburg holds extensive collections representing the Commonwealth's history, including frontier-era firearms and artifacts from the Pennsylvania German communities that built the long rifle tradition. Their exhibitions provide statewide historical context for the rifle's role in Pennsylvania's colonial, Revolutionary, and frontier history."

