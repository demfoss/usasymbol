faq:
  - question: "What is the official state firearm of Pennsylvania?"
    answer: "The official state firearm of Pennsylvania is the Pennsylvania Long Rifle, adopted in 2014 through House Bill 1989 signed by Governor Tom Corbett."
  - question: "Who invented the Pennsylvania Long Rifle?"
    answer: "The Pennsylvania Long Rifle was developed in the 1700s by skilled German immigrant gunsmiths — most notably Martin Meylin — in the Moravian communities of Lancaster and Northampton counties. Meylin is among the earliest documented creators of the distinctive American long rifle design, circa 1740."
  - question: "Is the Pennsylvania Long Rifle the same as the Kentucky Rifle?"
    answer: "Yes. The Pennsylvania Long Rifle and the Kentucky Rifle are the same weapon. It was invented and manufactured in Pennsylvania by German immigrant gunsmiths, but gained the 'Kentucky Rifle' nickname after it was widely used by Kentucky frontiersmen — a name permanently popularized by Samuel Woodworth's 1821 ballad 'The Hunters of Kentucky.'"
  - question: "How did HB 1989 become a state firearms bill?"
    answer: "House Bill 1989 was originally introduced in 2014 to designate the Piper J-3 Cub as Pennsylvania's official state aircraft. A last-minute amendment added the Pennsylvania Long Rifle designation to the same bill, creating an unusual piece of legislation that simultaneously honored two very different aspects of Pennsylvania's industrial heritage. Governor Tom Corbett signed the combined bill into law in June 2014."
  - question: "Why did some Pennsylvania legislators oppose the long rifle designation?"
    answer: "Representative Mark B. Cohen of Philadelphia and other urban legislators opposed the designation, calling it deeply offensive given the rates of gun violence in Pennsylvania's cities. They argued that elevating a firearm to official state symbol status sent the wrong cultural signal, regardless of the rifle's historical significance."
