seo_description: "District of Columbia symbols and facts: the official red-and-white flag, DC abbreviation, federal-district status, and the meaning behind Washington, D.C."
snippet_answer: "The District of Columbia is the federal district that contains Washington, D.C., the capital of the United States. Its best-known local symbol is the red-and-white District flag, adopted in 1938 and based on the Washington family coat of arms."

