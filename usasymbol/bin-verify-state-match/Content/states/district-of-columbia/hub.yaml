editorial:
  heading: What the District Flag Represents
  paragraphs:
  - The District of Columbia flag uses three red stars and two red horizontal bars on a white field. Its design connects the federal district with George Washington through the Washington family coat of arms.
  - This page is a starter hub for District of Columbia symbols. Additional symbol guides can be added as dedicated pages are published.

faq:
- question: Is the District of Columbia a state?
  answer: No. The District of Columbia is a federal district and is not one of the 50 states.
- question: What is the District of Columbia abbreviation?
  answer: The USPS abbreviation for the District of Columbia is DC.
- question: What does the District of Columbia flag look like?
  answer: The flag has three red stars above two horizontal red bars on a white field.
- question: When was the District of Columbia flag adopted?
  answer: The District flag was officially adopted on October 15, 1938.
- question: Why is it called the District of Columbia?
  answer: Columbia was a historical poetic name for the United States, while Washington, D.C. honors George Washington.

