name_meaning:
  heading: What Does District of Columbia Mean?
  paragraphs:
  - The District of Columbia is a federal district rather than one of the 50 states. It contains Washington, D.C., the seat of the United States government.
  - Washington honors George Washington, while Columbia was a historical poetic name for the United States. The postal abbreviation is DC.
