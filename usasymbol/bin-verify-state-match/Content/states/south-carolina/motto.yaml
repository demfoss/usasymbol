sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "South Carolina State Mottos"
    paragraphs:
      - "South Carolina is one of the few U.S. states with two official Latin mottos. Both were adopted on April 2, 1776, as part of the state seal — months before the Declaration of Independence. <strong>Animis Opibusque Parati</strong> appears on the obverse of the seal above a palmetto tree. <strong>Dum Spiro Spero</strong> appears on the reverse above the figure of Spes, the Roman goddess of hope."
      - "The two mottos were designed by two different people, each given one side of the seal. William Henry Drayton, a delegate to the Continental Congress, chose <em>Animis Opibusque Parati</em> for the obverse. Arthur Middleton, who later signed the Declaration of Independence, chose <em>Dum Spiro Spero</em> for the reverse."

  - id: meaning
    icon: "fa-solid fa-language"
    title: "South Carolina State Mottos Meaning"
    paragraphs:
      - "<strong>Animis Opibusque Parati</strong> translates from Latin as <em>Prepared in mind and resources</em>. William Henry Drayton selected it for the obverse in 1776 to assert that South Carolina entered the Revolution with both the will to fight and the material capacity to do so. The phrase paired with the seal's central image of a palmetto tree standing over a fallen oak, the visual record of the Battle of Fort Sullivan."
      - "<strong>Dum Spiro Spero</strong> translates from Latin as <em>While I breathe, I hope</em>. The phrase is attributed to Cicero and had appeared in British heraldic traditions for generations before 1776, including as a personal motto inscribed by King Charles I during his imprisonment by Parliament in the 1640s. Arthur Middleton, who received a classical education in England, selected it for the reverse as a statement of perseverance under adversity."
      - "The two mottos work as a pair. The obverse declares readiness; the reverse declares endurance. Together they describe what the 1776 General Assembly believed South Carolina would need: the capacity to fight, and the will to keep going."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of Both Mottos"
    paragraphs:
      - "The standard English translation of <strong>Animis Opibusque Parati</strong> is <em>Prepared in mind and resources</em>. Some sources also render it as <em>Prepared in minds and resources</em>, since <em>animis</em> is an ablative plural. South Carolina's official sources use <em>Prepared in mind and resources</em> as the primary form."
      - "The standard English translation of <strong>Dum Spiro Spero</strong> is <em>While I breathe, I hope</em>. The Latin is straightforward: <em>dum</em> means <em>while</em>, <em>spiro</em> means <em>I breathe</em>, and <em>spero</em> means <em>I hope</em>. No significant translation dispute exists for this phrase."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of South Carolina's State Mottos"
    paragraphs:
      - "The South Carolina General Assembly authorized the state seal on April 2, 1776. Two members divided the design work: William Henry Drayton took the obverse, and Arthur Middleton took the reverse. Each designer chose his own motto and visual composition independently, which is why the two sides of the seal reflect different themes."
      - "Drayton built the obverse around the Battle of Fort Sullivan, fought on June 28, 1776, almost three months after the seal's authorization. British warships attacked the incomplete fort on Sullivan's Island; its palmetto-log walls absorbed cannon fire rather than shattering, and the fleet withdrew. Drayton placed the palmetto above a fallen oak to record that outcome, and set <em>Animis Opibusque Parati</em> above it to claim that South Carolina had been ready."
      - "Middleton designed the reverse around the figure of Spes walking over discarded British weapons at dawn, with <em>Dum Spiro Spero</em> on a ribbon above. A Charles Town engraver completed the original coin-silver seal, which President John Rutledge used officially for the first time on May 22, 1777. Both mottos have appeared on the seal continuously since."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "Both Mottos on the South Carolina State Seal"
    paragraphs:
      - "<em>Animis Opibusque Parati</em> appears on the obverse above a palmetto tree with a fallen oak at its base and twelve spears bound to the trunk. The twelve spears represent the twelve other colonies allied with South Carolina in 1776. The obverse is the primary face of the seal used for official authentication."
      - "<em>Dum Spiro Spero</em> appears on the reverse above the goddess Spes, who walks along a beach at dawn holding a laurel branch, with discarded British weapons at her feet. The two elliptical vignettes are linked by palmetto branches on the full seal."
      - "Both faces of the seal are used on official state documents, government buildings, and state letterhead. The seal is defined in South Carolina Code § 1-1-610."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "South Carolina State Motto Facts"
    style: "gradient"
    facts:
      - "South Carolina has two official state mottos, both in Latin."
      - "Both mottos were adopted on April 2, 1776 — months before the Declaration of Independence."
      - "\"Animis Opibusque Parati\" means \"Prepared in mind and resources\" and was chosen by William Henry Drayton."
      - "\"Dum Spiro Spero\" means \"While I breathe, I hope\" and was chosen by Arthur Middleton, who later signed the Declaration of Independence."
      - "\"Dum Spiro Spero\" is attributed to Cicero and was also used as a personal motto by King Charles I of England in the 1640s."
      - "The original state seal was a coin-silver disc, four inches in diameter, first used on May 22, 1777."

