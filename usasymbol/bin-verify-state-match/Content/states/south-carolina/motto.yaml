faq:
  - question: "What is South Carolina's state motto?"
    answer: "South Carolina has two official state mottos, both in Latin. \"Animis Opibusque Parati\" means \"Prepared in mind and resources.\" \"Dum Spiro Spero\" means \"While I breathe, I hope.\" Both were adopted on April 2, 1776."

  - question: "What does \"Dum Spiro Spero\" mean?"
    answer: "\"Dum Spiro Spero\" is Latin for \"While I breathe, I hope.\" The phrase is attributed to Cicero. It appears on the reverse of the South Carolina state seal above the goddess Spes. It was chosen in 1776 by Arthur Middleton, who later signed the Declaration of Independence."

  - question: "What does \"Animis Opibusque Parati\" mean?"
    answer: "\"Animis Opibusque Parati\" is Latin for \"Prepared in mind and resources.\" It appears on the obverse of the South Carolina state seal above the palmetto tree. It was chosen in 1776 by William Henry Drayton, a delegate to the Continental Congress."

  - question: "What is the English translation of South Carolina's mottos?"
    answer: "\"Animis Opibusque Parati\" translates as \"Prepared in mind and resources.\" \"Dum Spiro Spero\" translates as \"While I breathe, I hope.\" Both are standard translations used in South Carolina's official sources."

  - question: "When did South Carolina adopt its state mottos?"
    answer: "Both mottos were adopted on April 2, 1776, when the General Assembly authorized the state seal. The completed seal was first used on May 22, 1777, by President John Rutledge."

