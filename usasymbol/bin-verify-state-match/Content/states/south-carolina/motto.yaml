intro_text: "South Carolina has two official Latin state mottos, both adopted on April 2, 1776, when the General Assembly authorized the state seal. <strong>Dum Spiro Spero</strong> means <em>While I breathe, I hope</em>. <strong>Animis Opibusque Parati</strong> means <em>Prepared in mind and resources</em>. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

