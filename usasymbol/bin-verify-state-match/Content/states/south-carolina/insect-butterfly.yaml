faq:
- question: What is South Carolina's state butterfly?
  answer: "South Carolina's state butterfly is the eastern tiger swallowtail, adopted in 1994."
- question: When did South Carolina adopt the eastern tiger swallowtail?
  answer: "South Carolina adopted the eastern tiger swallowtail as its official state butterfly in 1994."
- question: What does the eastern tiger swallowtail look like?
  answer: "It is a large yellow butterfly with black tiger-like stripes, a black wing border, and narrow tails on the hindwings. It has a wingspan of about 3 to 5.5 inches."
- question: Is the eastern tiger swallowtail the same as South Carolina's state insect?
  answer: "No. South Carolina's state insect is the Carolina mantid, adopted in 1988. The eastern tiger swallowtail is a separate designation, the official state butterfly, adopted in 1994."
- question: Where can you find the eastern tiger swallowtail in South Carolina?
  answer: "It is common throughout South Carolina, often seen in gardens, yards, and along woodland edges from spring into fall."

