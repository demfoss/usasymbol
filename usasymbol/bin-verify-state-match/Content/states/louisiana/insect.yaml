faq:
- question: What is Louisiana's state insect?
  answer: "Louisiana's state insect is the European honey bee, adopted by the Louisiana Legislature in 1977."
- question: When did Louisiana adopt the European honey bee?
  answer: "Louisiana adopted the European honey bee as its official state insect in 1977."
- question: Why did Louisiana choose the European honey bee?
  answer: "Lawmakers recognized the honey bee for its role in pollination and its ties to Louisiana's honey industry."
- question: What does Louisiana's state insect look like?
  answer: "The European honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
- question: Does Louisiana have a separate state butterfly?
  answer: "Yes. Louisiana named the Gulf fritillary its official state butterfly in 2022, separate from the honey bee's designation as state insect."

