sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Louisiana?
  paragraphs:
  - "The honey bee, Apis mellifera, is Louisiana's official state insect. State lawmakers designated it in 1977."
  - "Louisiana has long been a major honey-producing state, and beekeeping remains an active industry there today."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
  - "Honey bees live in large colonies built around a single queen. Worker bees gather nectar and pollen, build wax honeycomb, and produce honey."
  - "A single hive can hold thousands of bees, all working together to feed and grow the colony."

- id: history
  icon: fa-solid fa-landmark
  title: How Louisiana Chose the European Honey Bee
  paragraphs:
  - "The Louisiana Legislature named the European honey bee the official state insect in 1977."
  - "Lawmakers recognized the honey bee for its role in pollination and for its connection to Louisiana's honey industry."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted in 1977 by the Louisiana Legislature."
  - "Scientific name: Apis mellifera."
  - "Body is golden-brown and black with fuzzy stripes and two pairs of clear wings."
  - "Honey bees live in large colonies built around one queen."
  - "Louisiana has an active commercial beekeeping and honey industry."




