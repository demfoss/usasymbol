faq:
- question: What is Louisiana's state fossil?
  answer: "Louisiana's state fossil is petrified palmwood (Palmoxylon sp.), the silicified trunk of an ancient subtropical palm tree from the Oligocene epoch. It was designated the state fossil — and state stone — in 1976."
- question: When did Louisiana adopt its state fossil?
  answer: "Louisiana designated petrified palmwood as its official state fossil in 1976, in the same act that also made it the state stone."
- question: What does petrified palmwood look like?
  answer: "Petrified palmwood looks like stone on the outside, often in shades of tan, brown, gray, or red, but with visible wood grain on the surface. In cross-section, dozens of small oval spots — fossilized vascular bundles — are scattered across the face, giving it a distinctive freckled pattern unlike any other wood fossil."
- question: Where is petrified palmwood found in Louisiana?
  answer: "Petrified palmwood is found across the Catahoula Formation of central and northern Louisiana, particularly in Winn, Grant, LaSalle, and Caldwell parishes. The Kisatchie National Forest lies within the main outcrop zone. Specimens weather out of Oligocene sandstone banks and hillsides."
- question: When did the palmwood trees live?
  answer: "The palm trees that became Louisiana's petrified palmwood grew during the Oligocene epoch, roughly 33 to 23 million years ago, in a warm, wet coastal plain similar to a modern subtropical forest."
- question: Why did Louisiana designate the entire group rather than one species?
  answer: "Palmoxylon is used for any fossil palm wood whose parent species cannot be determined from the wood alone. Louisiana's specimens have not been linked to a specific palm species, so the organ genus Palmoxylon sp. is the most accurate designation possible."

