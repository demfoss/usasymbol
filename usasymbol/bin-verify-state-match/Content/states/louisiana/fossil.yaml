- id: facts
  icon: fa-solid fa-lightbulb
  title: Petrified Palmwood Facts
  facts:
  - "Louisiana designated petrified palmwood as both its state stone and its state fossil in 1976 — the only Louisiana symbol to hold both titles simultaneously."
  - "The distinctive pattern of scattered oval vascular bundles visible in cross-section is what distinguishes palm wood from all other wood types, fossil or living."
  - "Palmoxylon is an organ genus, used for any fossilized palm-type wood regardless of the parent species, which remains unidentified for Louisiana's specimens."
  - "The fossils formed about 30 million years ago when silica-rich groundwater replaced the original wood molecule by molecule, preserving the grain and internal structure in stone."
  - "Specimens are found across central Louisiana's Catahoula Formation in Winn, Grant, LaSalle, and Caldwell parishes, weathering out of Oligocene sandstone banks."

