sections:
- id: why-tomato-juice
  icon: fa-solid fa-circle-info
  title: Why Ohio Chose Tomato Juice as Its Official State Drink
  paragraphs:
  - "In 1965, tomato juice was not a quirky choice for Ohio — it was the obvious one. Ohio was the second-largest tomato-producing state in the country, trailing only California. The processing tomato industry had deep roots in the state's agricultural economy: canneries, commercial farms, and an established supply chain that moved Ohio tomatoes into kitchens and grocery shelves across the country."
  - What makes Ohio's choice stand out on the [full list of U.S. state beverages](/symbols/beverages) is not the tomato itself but the specific Ohio history behind it — a named city, a named horticulturist, and a variety that changed commercial farming.
- id: reynoldsburg
  icon: fa-solid fa-seedling
  title: 'Alexander Livingston and the Paragon Tomato: Reynoldsburg''s Claim on the Modern Tomato'
  paragraphs:
  - The sharpest argument Ohio had for claiming the tomato as its own was Alexander W. Livingston, a horticulturist from Reynoldsburg who spent decades selectively breeding tomatoes in the mid-nineteenth century. In 1870, he introduced the Paragon — the first tomato variety he considered stable and uniform enough to bring to market at scale. It was smooth, round, and reliably red, the kind of consistency that commercial growers and canneries needed and had never reliably had before.
  - Livingston did not stop there. Over the following decades, he developed more than a dozen additional tomato varieties, each aimed at improving uniformity, flavor, or shelf performance. The cumulative effect was a transformation of the commercial tomato from an inconsistent field crop into a standardized commodity. Reynoldsburg today calls itself the birthplace of the commercial tomato, and the claim is grounded in Livingston's work — not in promotional mythology.
  - 'The symbol and the history pointed at each other in a way that is genuinely rare: a state drink tied not just to an industry but to a specific person, a specific city, and a specific year.'
- id: tomato-powerhouse
  icon: fa-solid fa-industry
  title: "Ohio's Tomato Industry in 1965: Second in the Nation"
  paragraphs:
  - The 1965 designation captured Ohio at or near its peak as a tomato-producing state. Processing tomatoes — grown for canning and juice rather than fresh retail — were a significant part of the agricultural economy across northwestern and central Ohio. The flat, fertile terrain and the established network of canneries made Ohio a natural fit for large-scale tomato farming in a way that few other eastern states could match.
  - Being second to California in tomato production was not a footnote. California's dominance was already growing, but Ohio's output was large enough to sustain a whole industry of processors, distributors, and agricultural suppliers who depended on the crop. The [Ohio History Connection](https://www.ohiohistory.org) lists the beverage designation among the state's official symbols — a record that has not moved in sixty years.
  - Ohio's tomato industry has contracted significantly since then, as large-scale processing shifted further west. The designation remains, which means the symbol now functions partly as a historical marker — a record of what Ohio's agricultural economy once looked like at its strongest.
- id: alternatives
  icon: fa-solid fa-glass-water
  title: 'Apple Cider and Other Ohio Drinks: Popular but Not Official'
  paragraphs:
  - Apple cider comes up whenever Ohioans debate the state beverage. Ohio is a serious apple-producing state, and hard cider has an obvious claim on regional identity — particularly in the northeastern counties where orchards have operated for generations. The cider argument surfaces periodically, but no legislative effort has successfully displaced tomato juice.
  - Ohio-themed cocktails and Buckeye-branded milkshakes circulate in the tourism and food media space. They belong to the promotional economy, not the symbol list.
  - Tomato juice remains the only official entry on the [Ohio state symbols](/states/ohio) list in this category. A juice chosen in 1965 to honor an industry that has since shrunk — still on the books while cider generates more contemporary enthusiasm. The symbol outlasted the industry that justified it.
timeline:
- year: '1870'
  description: Alexander W. Livingston introduces the Paragon tomato in Reynoldsburg — the first uniform, commercially viable tomato variety, setting the foundation for Ohio's claim as the birthplace of the modern commercial tomato.
- year: '1965'
  description: Ohio designates tomato juice as the official state beverage on October 6, 1965, through Senate Bill 92. At the time, Ohio ranked second in the U.S. in tomato production.
- year: Post-1965
  description: The Reynoldsburg Tomato Festival is established, reinforcing the city's identity as the home of the commercial tomato and the cultural connection behind the state beverage designation.
faq:
- question: What is Ohio's official state drink?
  answer: Ohio's official state beverage is tomato juice, designated on October 6, 1965.
- question: Why did Ohio choose tomato juice as its state drink?
  answer: In 1965, Ohio ranked second only to California in tomato production. The designation recognized the agricultural importance of the tomato industry and Ohio's specific connection to the development of the modern commercial tomato through Alexander Livingston's work in Reynoldsburg.
- question: Who is Alexander Livingston and why does he matter?
  answer: Alexander W. Livingston was a Reynoldsburg horticulturist who developed the Paragon tomato in 1870 — the first stable, uniform variety suitable for commercial production at scale. He went on to develop more than a dozen tomato varieties, and his work is the basis for Reynoldsburg's claim as the birthplace of the modern commercial tomato.
- question: Is apple cider Ohio's state drink?
  answer: No. Apple cider has been discussed as an alternative, but tomato juice remains the only official Ohio state beverage. No legislation has replaced it.
- question: When did Ohio designate its state beverage?
  answer: October 6, 1965, through Senate Bill 92.
