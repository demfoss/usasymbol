seo_title: "Ohio State Beverage | Tomato Juice"
seo_description: "Ohio named tomato juice its state beverage in 1965, when the state was still a national tomato-production power."
intro_text: "**Tomato juice** is Ohio's official state beverage, designated on **October 6, 1965** — and the choice was deliberate. At the time, Ohio ranked second only to California among tomato-producing states, and the legislature had a specific Ohio city and a specific Ohio story to point to. This is not a generic agricultural tribute. It is a symbol with an address."
