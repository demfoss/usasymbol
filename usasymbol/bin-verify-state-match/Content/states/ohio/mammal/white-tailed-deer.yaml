faq:
  - question: "What is Ohio's state animal?"
    answer: "Ohio's state animal is the white-tailed deer (Odocoileus virginianus), designated on April 14, 1988. The white-tailed deer symbolizes one of conservation's greatest success stories—the species went completely extinct in Ohio by 1904 but recovered to approximately 750,000 animals through science-based restoration and management."
  
  - question: "When was the white-tailed deer designated as Ohio's state animal?"
    answer: "The white-tailed deer became Ohio's official state animal in 1988 through House Bill No. 95. The designation recognized the remarkable recovery from complete extirpation and the deer's importance to Ohio's hunting heritage, outdoor economy, and environmental restoration achievements."
  
  - question: "Why did Ohio choose the white-tailed deer as its state animal?"
    answer: "Ohio chose the white-tailed deer because it represents the state's environmental transformation from industrial devastation to ecological recovery. Deer went completely extinct in Ohio by 1904 due to unregulated hunting and habitat destruction. Restoration efforts beginning in 1925 brought deer back through scientific management. This recovery story demonstrates that environmental damage can be reversed through commitment and expertise, inspiring similar programs for other species."
  
  - question: "When did white-tailed deer go extinct in Ohio?"
    answer: "White-tailed deer went completely extinct in Ohio around 1904. The last confirmed wild deer died after decades of unregulated market hunting and forest clearing for agriculture eliminated the species from the state. This made Ohio one of the few states to lose deer entirely, requiring later restoration through reintroduction programs."
  
  - question: "How did Ohio restore its deer population?"
    answer: "Ohio began deer restoration in 1925 by releasing four white-tailed deer from Michigan into Scioto County. Over following decades, wildlife managers released additional deer from Michigan, Pennsylvania, and Wisconsin into suitable habitats. Protective hunting regulations prevented over-harvest during recovery. Population growth accelerated through the 1950s-1970s as deer adapted to Ohio's agricultural landscape. The population grew from zero in 1904 to approximately 750,000 by the 2020s."
  
  - question: "Where can I see white-tailed deer in Ohio?"
    answer: "White-tailed deer appear throughout Ohio in all 88 counties. Best viewing locations include Cuyahoga Valley National Park between Cleveland and Akron, Hocking Hills State Park in southeastern Ohio, Wayne National Forest, and metro parks around major cities. Deer are visible at dawn and dusk along forest edges, in suburban areas, and in agricultural regions. Ohio's abundant deer population makes observation easy with minimal effort."
  
  - question: "How many white-tailed deer live in Ohio?"
    answer: "Ohio's white-tailed deer population is approximately 750,000 animals as of the 2020s. The population fluctuates based on annual harvest (exceeding 200,000 deer), reproduction rates, and winter severity. Population densities vary by region, with highest numbers in southeastern hill country, northeastern counties with mixed agriculture and forest, and suburban areas around major cities."
  
  - question: "Are there too many deer in Ohio?"
    answer: "Many areas of Ohio have deer populations exceeding ecological and social carrying capacity. High densities cause agricultural crop damage, vehicle collisions (over 25,000 reported annually), browsing of suburban landscaping, and suppression of forest regeneration. The Ohio Division of Wildlife uses harvest regulations including liberal antlerless permits to reduce populations in over-abundant areas while maintaining higher populations where desired for hunting."
  
  - question: "What is chronic wasting disease and does it threaten Ohio deer?"
    answer: "Chronic wasting disease (CWD) is a fatal prion disease affecting deer, elk, and moose. It spreads through contaminated environments and remains infectious for years. As of 2024, Ohio had detected limited CWD cases in far eastern counties. The disease poses catastrophic threat to deer populations. No treatment or vaccine exists. The Division of Wildlife conducts extensive surveillance testing and would implement population reductions if CWD becomes widespread."

