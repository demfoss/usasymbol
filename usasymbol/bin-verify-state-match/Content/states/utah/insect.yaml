sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Utah?
  paragraphs:
  - "The honey bee, Apis mellifera, is Utah's official state insect. Governor Scott Matheson signed the designation into law on March 16, 1983."
  - "Utah is nicknamed the Beehive State, and the honey bee's hardworking reputation made it a natural fit alongside that symbol."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
  - "Honey bees live in large colonies built around a single queen. Worker bees gather nectar and pollen, build wax honeycomb, and produce the honey the colony eats and stores."
  - "A single hive can hold tens of thousands of bees, all working together to keep the colony fed and growing."

- id: history
  icon: fa-solid fa-landmark
  title: How Utah Chose the European Honey Bee
  paragraphs:
  - "A fifth-grade class at Ridgecrest Elementary School in Salt Lake County studied the honey bee and how state government works, then lobbied lawmakers to name it Utah's state insect."
  - "State Senator Fred W. Finlinson introduced the bill based on the students' campaign, and Governor Scott Matheson signed it into law on March 16, 1983."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: March 16, 1983, signed into law by Governor Scott Matheson."
  - "Scientific name: Apis mellifera."
  - "Championed by a fifth-grade class at Ridgecrest Elementary School as a class project."
  - "Utah's nickname, the Beehive State, matches the honey bee's reputation for hard work."
  - "A single hive can hold tens of thousands of worker bees built around one queen."




