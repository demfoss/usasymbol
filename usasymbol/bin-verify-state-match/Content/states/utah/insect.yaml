faq:
- question: What is Utah's state insect?
  answer: "Utah's state insect is the European honey bee, adopted in 1983."
- question: When did Utah adopt the European honey bee?
  answer: "Utah adopted the European honey bee as its official state insect on March 16, 1983."
- question: Why did Utah choose the European honey bee?
  answer: "A fifth-grade class at Ridgecrest Elementary School studied the honey bee and lobbied lawmakers to name it the state insect, and the bee's hardworking reputation matched Utah's nickname, the Beehive State."
- question: What does Utah's state insect look like?
  answer: "The European honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of clear wings."
- question: Who helped choose Utah's state insect?
  answer: "A fifth-grade class at Ridgecrest Elementary School in Salt Lake County lobbied for the honey bee as part of a class project, and State Senator Fred W. Finlinson introduced the bill."
- question: Is the honey bee native to Utah?
  answer: "No. The European honey bee was brought to North America by European settlers, but it has long been kept and valued in Utah, whose nickname is the Beehive State."

