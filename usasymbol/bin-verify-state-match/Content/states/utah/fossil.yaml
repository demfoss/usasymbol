faq:
- question: What is Utah's state fossil?
  answer: "Utah's state fossil is Allosaurus (Allosaurus fragilis), a large carnivorous dinosaur from the Late Jurassic period, adopted in 1988."
- question: When did Utah adopt its state fossil?
  answer: "Utah designated Allosaurus fragilis as its official state fossil in 1988."
- question: What did the Allosaurus look like?
  answer: "Allosaurus was a large two-legged predator up to 28 feet long with a massive skull, short three-clawed arms, and a bony ridge over each eye. Its skull had large openings to reduce weight, and it had powerful hind legs built for speed."
- question: Where are Allosaurus fossils found in Utah?
  answer: "The Cleveland-Lloyd Dinosaur Quarry in Emery County, about 30 miles south of Price, has produced more than 60 individual Allosaurus skeletons. The Natural History Museum of Utah in Salt Lake City holds major specimens. The Morrison Formation outcrops across much of eastern and central Utah."
- question: When did the Allosaurus live?
  answer: "Allosaurus lived during the Late Jurassic period, about 155 to 145 million years ago. It was the dominant large predator in the ecosystem that left the Morrison Formation across the American West."
- question: Why does Utah have so many Allosaurus fossils?
  answer: "The Cleveland-Lloyd Dinosaur Quarry in Emery County has produced more Allosaurus specimens than anywhere else on Earth. Why so many predators accumulated in one spot is still debated. Theories include a predator trap, drought, or contaminated water that drew and killed animals over a long period."

