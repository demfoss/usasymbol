faq:
  - question: What is Delaware's state sport?
    answer: "Delaware's official state sport is bicycling, adopted in 2014."
  - question: When did Delaware adopt bicycling as its state sport?
    answer: "Delaware adopted bicycling as its state sport in 2014, after the General Assembly passed the designation."
  - question: Why did Delaware choose bicycling?
    answer: "Delaware has the lowest average elevation of any U.S. state, which makes cycling practical almost everywhere. A growing trail network, including the East Coast Greenway, made the choice an easy fit."
  - question: Did students help make bicycling Delaware's state sport?
    answer: "Yes. Students from Wilbur Elementary School in Bear testified before lawmakers in 2014, arguing that cycling was efficient, healthy, and better for the environment than driving."

