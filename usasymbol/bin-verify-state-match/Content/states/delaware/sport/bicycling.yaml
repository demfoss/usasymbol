sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Delaware State Sport
    paragraphs:
      - "Delaware named bicycling its official state sport in 2014, a choice built around geography rather than a single team or event. Unlike states that picked a spectator sport, Delaware chose something nearly any resident could practice on ordinary roads and trails statewide. The designation followed a growing network of rail-trails and canal towpaths that had already made cycling part of daily life across the state."

  - id: what-is
    icon: fa-solid fa-bicycle
    title: "Bicycling in Delaware"
    paragraphs:
      - "A cyclist in Delaware can ride a paved rail-trail, a canal towpath, or an ordinary road shoulder, since flat terrain keeps most routes within easy reach of casual riders. The Jack A. Markell Trail runs from Wilmington's riverfront to historic New Castle over wetland boardwalks and a cyclist-only bridge across the Christina River. Farther south, the Georgetown-Lewes Trail covers 17 flat miles between inland Sussex County and the Delaware beaches."
      - "Wilmington also hosts the Wilmington Grand Prix, an annual criterium race that draws competitive riders and large crowds downtown. Delaware carries a stretch of the East Coast Greenway, a 3,000-mile trail network connecting Maine to Florida, running through Wilmington and New Castle. Local clubs and charity rides use these same trails throughout the year."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Bicycling Represents Delaware
    paragraphs:
      - "Delaware's flat, low-lying geography makes cycling practical in a way that hillier states cannot match. The state's mean elevation is about 60 feet, and its highest point, near the Pennsylvania line, tops out under 450 feet. That terrain turns commuting, exercise, and recreational riding into the same activity almost anywhere in the state."
      - "Bicycling in Delaware is a sport nearly anyone can take up rather than one built around a professional team. Trails like the Jack A. Markell Trail and the C&D Canal towpath see commuters, families, and racers on the same pavement. That everyday accessibility, more than any single competition, is what lawmakers pointed to when they made the designation."
      - "The push for the designation also came from an unusual source. Students at Wilbur Elementary School in Bear testified before Delaware lawmakers in 2014, arguing that cycling was efficient, healthy, and did not burn gas. Representative Valerie Longhurst, the bill's lead sponsor, credited the students with helping move the legislation forward."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Bicycling Became Delaware's State Sport
    paragraphs:
      - "Delaware's General Assembly designated bicycling the state's official sport in 2014. Lawmakers noted that Delaware had recently ranked among the nation's most bicycle-friendly states and pointed to events like the Wilmington Grand Prix as evidence the sport already had a following. Students from Wilbur Elementary School in Bear also testified in support before the bill passed."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Bicycling Facts
    facts:
      - "Delaware designated bicycling its official state sport in 2014."
      - "Students from Wilbur Elementary School in Bear testified before lawmakers in support of the bill."
      - "Delaware has the lowest mean elevation of any U.S. state, at about 60 feet."
      - "The Jack A. Markell Trail links Wilmington's riverfront to historic New Castle."
      - "Delaware carries a section of the 3,000-mile East Coast Greenway, which runs from Maine to Florida."

