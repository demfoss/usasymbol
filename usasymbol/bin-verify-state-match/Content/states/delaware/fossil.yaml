- id: facts
  icon: fa-solid fa-lightbulb
  title: Belemnite Facts
  facts:
  - "Delaware adopted Belemnitella americana as its state fossil in 1996."
  - "The fossilized part is the guard — a solid calcite structure inside the animal's body, shaped like a bullet or short cigar, typically 3 to 5 inches long."
  - "Belemnitella americana lived in a warm shallow sea that covered Delaware roughly 83 to 72 million years ago during the Campanian stage of the Late Cretaceous."
  - "Belemnites went extinct 66 million years ago in the same mass extinction event that ended the non-bird dinosaurs."
  - "Guards are found in the Merchantville and Mount Laurel formations exposed along the Chesapeake and Delaware Canal in New Castle County."

