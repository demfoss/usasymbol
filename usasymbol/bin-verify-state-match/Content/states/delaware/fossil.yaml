faq:
- question: What is Delaware's state fossil?
  answer: "Delaware's state fossil is the belemnite, specifically Belemnitella americana, an extinct squid-like sea creature from the Late Cretaceous. It was adopted as the state fossil in 1996."
- question: When did Delaware adopt its state fossil?
  answer: "Delaware adopted the belemnite (Belemnitella americana) as its official state fossil in 1996."
- question: What did the belemnite look like?
  answer: "The belemnite looked like a small squid with a hard internal skeleton called a guard. The full animal was roughly 6 to 12 inches long. The guard — a dense, bullet-shaped piece of calcite — is the part that survives as a fossil, usually 3 to 5 inches long."
- question: Where are belemnite fossils found in Delaware?
  answer: "Belemnite fossils are found in the Cretaceous sediments of northern Delaware, especially along the Chesapeake and Delaware Canal and nearby creek banks in New Castle County, in the Merchantville and Mount Laurel formations."
- question: When did the belemnite live?
  answer: "Belemnitella americana lived during the Late Cretaceous, roughly 83 to 72 million years ago, in a warm shallow sea that covered present-day Delaware. The entire belemnite group went extinct 66 million years ago."
- question: Who pushed to make it the state fossil?
  answer: "Delaware designated the belemnite its state fossil in 1996. The species was chosen for its strong connection to Delaware's Cretaceous rock layers, where its guards have been collected from canal cuts and creek banks for well over a century."

