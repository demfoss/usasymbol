faq:
- question: What is Delaware's state macroinvertebrate?
  answer: "Delaware's state macroinvertebrate is the stonefly, adopted by the Delaware General Assembly in 2005."
- question: When did Delaware adopt the stonefly?
  answer: "Delaware adopted the stonefly as its official state macroinvertebrate on May 4, 2005, becoming the first state to name a macroinvertebrate symbol."
- question: Why did Delaware choose the stonefly?
  answer: "Stonefly nymphs can only survive in cold, clean, well-oxygenated water, so lawmakers chose the stonefly to represent and raise awareness of Delaware's water quality."
- question: What does a stonefly look like?
  answer: "Stonefly nymphs have flattened bodies and two long tail filaments and live underwater clinging to rocks. Adults have two pairs of wings that fold flat over the back."
- question: Is the stonefly a bug, butterfly, or beetle?
  answer: "It is neither. The stonefly is an aquatic insect in the order Plecoptera, a separate category called a macroinvertebrate. Delaware's state bug is the ladybug and its state butterfly is the eastern tiger swallowtail."

