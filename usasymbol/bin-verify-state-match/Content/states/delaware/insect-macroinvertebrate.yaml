seo_title: "Delaware State Macroinvertebrate | Stonefly"
seo_description: "Delaware's state macroinvertebrate is the stonefly, adopted in 2005. Learn what it looks like and why it became official."
hero_image: /images/insects/species/stonefly-01.webp
hero_image_alt: "Stonefly nymph with a flattened body and two long tail filaments clinging to a submerged rock"
hero_image_caption: "Stoneflies only survive in clean, well-oxygenated streams, which is why Delaware uses them as a sign of good water quality."
intro_text: "Delaware's state macroinvertebrate is the stonefly, an aquatic insect officially adopted in 2005. Delaware was the first state to name an official macroinvertebrate."

sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Macroinvertebrate of Delaware?
  paragraphs:
  - "The stonefly, order Plecoptera, is Delaware's official state macroinvertebrate. The Delaware General Assembly designated it in 2005."
  - "Delaware was the first state in the country to create this category of state symbol, separate from its state bug and state butterfly."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Stonefly
  paragraphs:
  - "Stoneflies spend most of their lives underwater as nymphs, with flattened bodies and two long, thin tail filaments that help them cling to rocks in flowing streams."
  - "Adult stoneflies have two pairs of wings that fold flat over the back and are relatively weak fliers, usually staying close to the stream they emerged from."
  - "Because stonefly nymphs need cold, clean, well-oxygenated water to survive, biologists use their presence to help judge how healthy a stream is."

- id: history
  icon: fa-solid fa-landmark
  title: How Delaware Chose the Stonefly
  paragraphs:
  - "Schools participating in the Delaware Stream Watch Program, including Gunning Bedford Middle School, Salesianum High School, Delcastle Technical High School, Dickinson High School's Environmental Club, The Independence School, Springer Middle School, St. Andrew's School, and the Charter School of Wilmington, supported the stonefly's designation."
  - "The Delaware General Assembly made the stonefly the official state macroinvertebrate on May 4, 2005, citing stoneflies found in New Castle, Kent, and Sussex counties as evidence of the state's water quality."
  - "Lawmakers said the designation was meant to raise public awareness of water quality issues and to complement citizen programs like Delaware Stream Watch."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Stonefly Facts
  facts:
  - "Adopted: 2005, by the Delaware General Assembly, making Delaware the first state with an official macroinvertebrate."
  - "Scientific classification: order Plecoptera."
  - "Nymphs have flattened bodies and two long tail filaments, and live underwater clinging to rocks in streams."
  - "Chosen as a sign of excellent water quality, since stonefly nymphs cannot survive in polluted or low-oxygen water."
  - "Supported by student groups statewide through the Delaware Stream Watch Program."




