seo_title: "Oregon State Colors | Navy Blue Gold"
seo_description: "Oregon state colors are Navy Blue and Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The official state colors of Oregon are **Navy Blue** and **Gold**, formally designated under Oregon Revised Statutes § 186.010, amended in 1959. Oregon's flag — the only U.S. state flag with different designs on each side — displays navy blue and gold on both faces, and both appear on [the Oregon state flag](/states/oregon/flag/oregon-state-flag) adopted in 1925 and throughout official state branding. The specifications below list HEX, RGB, CMYK, and Pantone values for Oregon color matching. This profile appears in the [list of U.S. state colors](/symbols/colors)."

official_colors: "Navy Blue and Gold"
official_since: "1959 (Oregon Revised Statutes § 186.010)"
primary_use: "State flag, state government branding, Oregon Military Department insignia, state agency materials"
known_for: "Oregon's navy blue and gold flag is the only U.S. state flag with different designs on front and back sides; the front displays the state coat of arms with 33 gold stars, and the reverse displays a gold beaver — Oregon's state animal — on a log; the 33 stars represent Oregon as the 33rd state admitted to the Union in 1859"

