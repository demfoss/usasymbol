sections:
  - id: "official-designation"
    title: "Official Designation and History"
    style: "default"
    paragraphs:
      - "Oregon formally codified navy blue and gold as the official state colors in 1959 when ORS § 186.010 was amended to include the language: 'The official colors of the State of Oregon are navy blue and gold.' The statute does not specify Pantone, Cable, or HEX values, defining the colors by name only. The navy blue and gold had been in use since the flag's adoption in 1925, and the 1959 amendment formally made these flag colors the official state colors, embedding them in the Oregon Revised Statutes for the first time; this context sits beside [the Beaver State nickname](/states/oregon/nickname/the-beaver-state)."
      - "The Oregon state flag itself was officially adopted by the Oregon Legislature on April 15, 1925, following years of unofficial use of various blue-and-gold state banners. The flag's most distinctive feature — its two-sided design — makes it unique among all fifty U.S. state flags. The front displays the state escutcheon in gold, supported by 33 gold stars, with 'State of Oregon' above and '1859' below. The reverse displays a gold beaver standing on a log and facing right. Meier and Frank department store in Portland produced the first official flag in 1925, with employees Marjorie Kennedy and Blanche Cox sewing it by hand; see [the Oregon flag page](/states/oregon/flag/oregon-state-flag)."
    subsections:
      - subtitle: "Oregon Revised Statutes § 186.010"
        text: "ORS § 186.010 states in full: '(1) A state flag is adopted to be used on all occasions when the state is officially and publicly represented... It shall bear on one side on a navy blue field the state escutcheon in gold, supported by 33 gold stars and bearing above the escutcheon the words State of Oregon in gold and below the escutcheon the figures 1859 in gold, and on the other side on a navy blue field a representation of the beaver in gold. (2) The official colors of the State of Oregon are navy blue and gold.' The statute's simultaneous description of the flag and designation of state colors in a single section makes the direct connection between the flag's public imagery and the official color designation explicit in law."
      - subtitle: "The Two-Sided Flag and Oregon's Unique Vexillological Identity"
        text: "Oregon's two-sided flag is the only one of its kind among U.S. state flags. Paraguay is the only country with a similarly two-sided national flag, making Oregon's design extremely rare in vexillological history. The beaver on the reverse was chosen to honor the fur trade that drove European exploration of the Oregon Country in the late 18th and early 19th centuries. The Hudson's Bay Company and the North West Company both established posts in the Oregon Territory, and beaver pelts were among the most valuable commodities of the era, earning Oregon its enduring nickname 'The Beaver State.' In the 2001 NAVA flag survey, the Oregon flag was ranked 62nd out of 72 — a ranking that has spurred ongoing discussions about Oregon potentially redesigning its flag."
  - id: "symbolism"
    title: "What the Colors Represent"
    style: "highlight"
    paragraphs:
      - "Navy blue and gold in Oregon carry the weight of the state's frontier history, Pacific Coast identity, and natural abundance. Navy blue speaks to the depth and permanence of the Pacific Ocean — Oregon's western boundary stretches 363 miles of coastline — and to the forested landscapes of the Coast Range and Cascade Mountains that define the state's notable geographic character. Gold speaks to the agricultural wealth of the Willamette Valley, the gold mining heritage of the Siskiyou and Klamath Mountains, and the color of the beaver fur that wrote Oregon's early European history, alongside civic themes in [Oregon's state motto](/states/oregon/motto/alis-volat-propriis)."
    subsections:
      - subtitle: "Navy Blue: Oregon's Waters and Forests"
        text: "Navy blue's association with Oregon runs through the state's defining natural features. The Columbia River, which forms much of Oregon's northern border, is the fourth-largest river in the United States by discharge and was the primary route for the Lewis and Clark Expedition of 1804-1806, which opened Oregon's interior to American awareness. The Snake River canyon in eastern Oregon contains Hells Canyon — the deepest river gorge in North America at 7,993 feet. The Crater Lake caldera, at 1,943 feet the deepest lake in the United States, is one of the most intensely navy-blue bodies of water in the world. Oregon's navy blue connects the official color palette to this notable water heritage."
      - subtitle: "Gold: Beaver Fur, Wheat, and Agricultural Abundance"
        text: "Gold's presence in Oregon's official colors reaches back to the era of the mountain men and fur traders who first explored the territory in the 1810s-1840s. The beaver trade attracted trappers from American and Canadian fur companies who criss-crossed Oregon's river systems in pursuit of beaver pelts — then commanding the highest prices in European fashion markets for their use in felt hats. Gold also references Oregon's agricultural wealth: the Willamette Valley produces hazelnuts, grass seed, Christmas trees, wine grapes, and more than 170 other commercial crops, making it one of the most productive agricultural regions per acre in North America. Oregon has been the nation's leading hazelnut producer since the early 20th century; compare [the Oregon beaver symbol page](/states/oregon/mammal/beaver)."
  - id: "state-emblems"
    title: "Usage in Flags, Seals, and Insignias"
    style: "default"
    paragraphs:
      - "Navy blue and gold define the Oregon state flag completely — both sides consist solely of navy blue fields with gold designs. The Oregon state seal, officially adopted in 1859 and revised in 1903, features a shield with mountains, an eagle, a departing British man-of-war, an arriving American steamer, and a sheaf of wheat, plow, and pickaxe, along with 33 stars and the American eagle crest — the seal's colors extend beyond navy and gold into the full range of heraldic colors. Navy blue and gold appear in the Oregon National Guard insignia, the Oregon State Police uniform elements, and the branding of the Oregon State Archives and Oregon Secretary of State. The Oregon Military Museum and the Oregon State Library both use navy and gold prominently in their institutional design, while statewide scale is tracked in [U.S. states by population](/rankings/demographics/states-by-population)."

