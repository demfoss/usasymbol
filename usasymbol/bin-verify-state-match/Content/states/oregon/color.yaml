faq:
  - question: "What are the official colors of Oregon?"
    answer: "The official state colors of Oregon are Navy Blue and Gold, designated under Oregon Revised Statutes § 186.010, amended in 1959. These are the same colors as the Oregon state flag, adopted in 1925."
  - question: "What is the HEX code for Oregon Navy Blue?"
    answer: "The standard HEX code for Oregon Navy Blue is #002A86, corresponding to Pantone PMS 287 C. Note that Oregon statute defines the color by name only; this is a widely accepted approximation as no official HEX or Pantone values are specified in the legislation."
  - question: "What is the HEX code for Oregon Gold?"
    answer: "The standard HEX code for Oregon Gold is #FFEA0F, corresponding to Pantone PMS 3945 C. As with the navy blue, these are accepted approximations — Oregon statute does not specify technical color values."
  - question: "Why does Oregon's state flag have two different sides?"
    answer: "Oregon is the only U.S. state with a two-sided flag. The front features the state coat of arms in gold on navy blue; the reverse features a gold beaver — the state animal — on a log. The beaver honors Oregon's fur trade heritage and the nickname 'The Beaver State.'"
  - question: "When were Oregon's state colors officially designated?"
    answer: "Oregon's state colors were officially designated in 1959 when ORS § 186.010 was amended to include the statement 'The official colors of the State of Oregon are navy blue and gold,' though these colors had appeared on the state flag since 1925."

