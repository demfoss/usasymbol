sections:
- id: grand-canyon-state
  icon: fa-solid fa-mountain-sun
  title: "\"Grand Canyon State\" - Arizona's Long-Running Plate Identity"
  paragraphs:
  - '"Grand Canyon State" is the phrase most people associate with Arizona plates, and the chronology supports that. The slogan first appeared in 1940, immediately after the Marcos de Niza commemorative plate, and it has defined Arizona standard plates through later redesigns.'
  - The Grand Canyon gives Arizona a geographic identity that is hard to confuse with any other state. Because the phrase is also Arizona's state nickname, the plate slogan and the state's public brand point to the same landmark.
  - The current standard plate keeps the slogan while using the familiar desert-gradient background introduced in the modern graphic era. The base design has changed, but the words have remained the anchor.

- id: before-the-slogan
  icon: fa-solid fa-clock-rotate-left
  title: The 1939 Marcos de Niza Plate
  paragraphs:
  - The plate immediately before "Grand Canyon State" was Arizona's 1939 Fray Marcos de Niza commemorative issue. It marked the 400th anniversary of the 1539 expedition associated with Fray Marcos de Niza, a Spanish Franciscan often described in older Arizona histories as the first European known to reach the region.
  - 'ADOT''s account says the Arizona Highway Department designed the 1939 plate with vertical "1539" and "1939" dates on the sides and "Marcos de Niza" at the bottom. That bottom position is important: ADOT notes it is where "Grand Canyon State" would appear the following year.'
  - That makes "Marcos de Niza" a real plate text, but not a standard continuing slogan. It belongs in the timeline as a one-year commemorative predecessor.

- id: previous-versions
  icon: fa-solid fa-car-side
  title: Arizona License Plate Slogans by Year
  paragraphs:
  - 'Arizona''s plate-slogan story is short because "Grand Canyon State" arrived early and stayed.'
  versions:
  - name: MARCOS DE NIZA
    years: '1939'
    image: /images/license-plates/arizona/1939-marcos-de-niza.jpg
    description: One-year commemorative plate honoring Fray Marcos de Niza and the 1539 expedition anniversary.
  - name: GRAND CANYON STATE
    years: 1940-present
    image: /images/license-plates/arizona/arizona-grand-canyon-state-standard-plate.jpg
    description: Standard slogan first used in 1940 and still used on Arizona's current standard plate.

- id: meaning
  style: meaning-banner
  title: Meaning of Grand Canyon State
  paragraphs:
  - The Grand Canyon is Arizona's most famous natural landmark and one of the most recognized landscapes in the world. Putting it on the plate gives the state instant recognition in a way a temporary campaign phrase could not.
  - The phrase also avoids the problem many slogans face — it does not depend on a marketing trend or a dated tourism pitch. It is a permanent geographic claim, which explains why it still works more than eight decades after first appearing.
  - 'For more on Arizona''s broader state identity, see the [Arizona state facts](/states/arizona) page. For how other states brand their plates, see [U.S. license plate slogans by state](/symbols/license-plate-slogans).'

timeline:
- year: '1939'
  description: Arizona issues a one-year Fray Marcos de Niza commemorative plate with "Marcos de Niza" at the bottom.
- year: '1940'
  description: Arizona introduces "Grand Canyon State" in the slogan position on standard plates.
- year: '1996'
  description: Arizona introduces the modern scenic graphic base that later evolves into the current flat-printed format.
- year: '2008'
  description: 'Arizona''s current graphic style is updated into the flat-printed version while retaining "Grand Canyon State."'
- year: '2021'
  description: Arizona moves into the current serial format era while keeping the standard "Grand Canyon State" slogan.

faq:
- question: What is the slogan on Arizona license plates?
  answer: Arizona's standard license plate slogan is "Grand Canyon State."
- question: When did "Grand Canyon State" first appear on Arizona plates?
  answer: '"Grand Canyon State" first appeared on Arizona plates in 1940, the year after the one-year Marcos de Niza commemorative plate.'
- question: What slogan came before "Grand Canyon State" on Arizona plates?
  answer: The 1939 plate carried "Marcos de Niza" at the bottom. It commemorated Fray Marcos de Niza and the 400th anniversary of the 1539 expedition associated with him.
- question: Was "Marcos de Niza" a standard Arizona plate slogan?
  answer: "No. \"Marcos de Niza\" was a one-year commemorative plate text in 1939, not Arizona's long-running standard slogan."
- question: Does Arizona still use "Grand Canyon State" on its license plates?
  answer: "Yes. Arizona's current standard plate still carries the \"Grand Canyon State\" slogan."
- question: What does the phrase on the Arizona license plate mean?
  answer: '"Grand Canyon State" identifies Arizona by its most famous natural landmark, the Grand Canyon. It is a permanent geographic claim — the canyon is in Arizona, and the phrase gives the state instant recognition that does not depend on a tourism trend or a dated campaign.'
- question: What is the Arizona license plate saying?
  answer: Arizona's license plate saying is "Grand Canyon State." The phrase first appeared on Arizona plates in 1940, immediately after a one-year Marcos de Niza commemorative plate, and has remained on every standard Arizona plate since.

