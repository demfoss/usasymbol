hero_image_caption: Arizona's current standard plate pairs the long-running "Grand Canyon State" wording with a desert sunset and saguaro design.
intro_text: "**\"Grand Canyon State\"** is Arizona's license plate slogan, first used in 1940 and still printed on the current standard plate. It followed a one-year 1939 \"Marcos de Niza\" commemorative design, but that wording was not a lasting state slogan; the Grand Canyon identity took over the next year. This profile appears in the [list of U.S. license plate slogans](/symbols/license-plate-slogans)."
quick_answer: "\"Grand Canyon State\" is Arizona's license plate slogan. ADOT identifies the 1939 plate as a Fray Marcos de Niza commemorative issue and says \"Grand Canyon State\" appeared in that slogan position the next year, 1940. The 1939 \"Marcos de Niza\" text is a one-year commemorative, not Arizona's lasting slogan."
