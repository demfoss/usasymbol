faq:
- question: What is Arizona's state butterfly?
  answer: "Arizona's state butterfly is the two-tailed swallowtail, adopted by the Arizona Legislature in 2001."
- question: When did Arizona adopt the two-tailed swallowtail?
  answer: "Arizona adopted the two-tailed swallowtail as its official state butterfly in 2001."
- question: What does the two-tailed swallowtail look like?
  answer: "It is a large pale yellow butterfly with black tiger-like stripes, blue markings, and two long tails on each hindwing. It has a wingspan of about 3.5 to 5 inches."
- question: Where is the two-tailed swallowtail found in Arizona?
  answer: "It is found across Arizona, from desert canyons and foothills up into mountain woodlands, and is most often seen from spring through fall."
- question: Is the two-tailed swallowtail a butterfly, bee, beetle, or dragonfly?
  answer: "It is a butterfly, one of the largest swallowtail species in North America, with a wingspan of up to about 5 inches."

