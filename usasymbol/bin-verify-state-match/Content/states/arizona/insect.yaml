sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Arizona?
  paragraphs:
  - "The two-tailed swallowtail, Papilio multicaudata, is Arizona's official state butterfly. State lawmakers designated it in 2001."
  - "It is one of the largest butterflies in North America and a familiar sight across much of Arizona, from desert canyons to mountain forests."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Two-tailed Swallowtail
  paragraphs:
  - "The two-tailed swallowtail has pale yellow wings marked with bold black tiger-like stripes and a black border along the edges. Each hindwing carries a small patch of blue scales and an orange eyespot near the tail."
  - "True to its name, each hindwing ends in two long, narrow tails instead of the single tail found on most swallowtail butterflies."
  - "Adults have a wingspan of about 3.5 to 5 inches, making it one of the largest swallowtails in North America and easy to recognize by size alone."

- id: history
  icon: fa-solid fa-landmark
  title: How Arizona Chose the Two-tailed Swallowtail
  paragraphs:
  - "The Arizona Legislature designated the two-tailed swallowtail as the official state butterfly in 2001."
  - "The butterfly was already familiar to people across the state as a large, easy-to-spot species found from low desert canyons up into pine-oak mountain woodlands."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Two-tailed Swallowtail in Arizona
  paragraphs:
  - "Two-tailed swallowtails are found statewide in Arizona, from canyon washes and desert foothills up into mountain woodlands."
  - "Adults are most often seen from spring through fall, feeding on flowers along streams and canyon trails. Caterpillars feed on the leaves of ash, chokecherry, and other related trees and shrubs."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Two-tailed Swallowtail Facts
  facts:
  - "Adopted: 2001, by the Arizona Legislature."
  - "Scientific name: Papilio multicaudata."
  - "Wingspan: about 3.5 to 5 inches, among the largest butterflies in North America."
  - "Pale yellow wings with black tiger stripes, blue markings, and two tails on each hindwing instead of the usual one."
  - "Found statewide in Arizona, from desert canyons to mountain woodlands."




