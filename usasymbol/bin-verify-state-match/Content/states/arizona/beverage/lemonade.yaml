faq:
- question: What is Arizona's official state drink, and when was it adopted?
  answer: Arizona's official state drink is lemonade. Governor Doug Ducey signed the designation into law in May 2019 when HB 2692 passed the Arizona Legislature.
- question: Why did Arizona choose lemonade as its state drink?
  answer: "The core argument was Arizona's 5 C's: cattle, cotton, copper, climate, and citrus. Four of the five were already reflected in Arizona's official symbols; citrus was not. Garrett Glover, a teenager from Gilbert, proposed lemonade to fill that gap. The citrus connection — Arizona is a significant U.S. lemon producer — gave the argument its foundation."
- question: Who proposed lemonade as Arizona's state drink?
  answer: Garrett Glover, a student from Gilbert, Arizona. He identified the missing citrus representation in Arizona's state symbols, brought the proposal to state legislators, and the bill moved through as HB 2692 before being signed by the governor.
- question: What other drinks were considered for Arizona's state drink?
  answer: Tea, pink lemonade, margarita, tequila, and jamaica were all discussed during legislative hearings. Lemonade was chosen because it connected directly to the citrus argument that drove the bill.
- question: Where is the Arizona state drink law codified?
  answer: The designation is in the Arizona Revised Statutes under section 41-860.06.
