seo_title: "Arizona State Drink | Lemonade"
seo_description: "Arizona named lemonade its state drink in 2019 after a teen-led push that argued citrus belonged among the state's symbols."
intro_text: "**Lemonade is Arizona's official state drink**, signed into law in May 2019 after a teenager from Gilbert argued the state's famous 5 C's needed a citrus representative. The push came not from a lobbyist or a trade group but from a high school student who identified a gap in Arizona's symbol list and took it all the way to the governor's desk. This profile appears in the [list of U.S. state beverages](/symbols/beverages)."
