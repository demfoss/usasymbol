seo_title: "Nevada State Tree | Single-leaf Pinyon Pine"
seo_description: 'Nevada chose single-leaf pinyon pine in 1953, honoring a Great Basin tree valued for edible pine nuts and drought survival.'

intro_text: "Nevada designated the Single-leaf Pinyon Pine as its state tree in 1953, honoring a desert pine closely tied to the Great Basin. Its edible pine nuts and unusual single-needle form make it one of the most distinctive trees associated with the state. This profile appears in the [list of U.S. state trees](/symbols/trees)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Tree of Nevada"
    paragraphs:
      - "The Single-leaf Pinyon Pine is Nevada's official state tree. This small evergreen conifer grows 15 to 30 feet tall in Nevada's arid mountains, rarely exceeding 40 feet even in favorable conditions. The trunk measures one to two feet in diameter on mature trees. Unlike towering forest pines, pinyon remains small and often develops multiple trunks or a shrubby form. This compact growth helps the tree survive Nevada's harsh climate with limited water. Nevada's pinyon pines grow slowly, adding only a few inches per year, but can live 600 years or more. The tree's modest appearance belies its importance - pinyon pine nuts provided a dietary staple for Nevada's indigenous peoples and continue as a harvested crop today."
      - "The needles provide the tree's most distinctive botanical feature. Single-leaf Pinyon produces one needle per bundle, unique among all pine species worldwide. Every other pine has two, three, or five needles bundled together. Each needle measures one to two inches long, appearing stiff, curved, and yellow-green. The singular needle grows in a spiral pattern around the twig. This single-needle adaptation reduces water loss in Nevada's arid environment. The needles stay on the tree for up to 12 years before dropping, giving pinyon a dense, bushy appearance. Small rounded cones measure one to two inches across and produce large, wingless seeds called pine nuts."
      - "Single-leaf Pinyon grows throughout Nevada's mountain ranges at elevations from 4,000 to 9,000 feet. The species dominates the pinyon-juniper woodland zone that covers millions of acres across Nevada. These woodlands form the most extensive plant community in the Great Basin. Nevada contains more pinyon-juniper habitat than any other state. The tree grows on rocky slopes and ridges where few other trees survive. Pinyon tolerates Nevada's extreme temperature swings from summer heat exceeding 100°F to winter cold below zero. The species requires minimal rainfall - as little as 10 to 15 inches annually. This drought tolerance allows pinyon to thrive where most forest trees cannot grow."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Single-leaf Pinyon Pine"
    paragraphs:
      - "The official name is Single-leaf Pinyon Pine, describing the unique one-needle characteristic. Nevadans commonly call it pinyon pine or simply pinyon. The scientific name Pinus monophylla combines Pinus (Latin for pine) with monophylla (Greek for 'single leaf'), directly describing the singular needle. The term 'pinyon' comes from Spanish piñón, meaning pine nut or pine seed. Early Spanish speakers in the Southwest used this name for pines producing edible nuts."
      - "Some references spell it pinon without the tilde, though pinyon is standard in Nevada and scientific literature. Native American tribes had various names - the Shoshone called it tüba, the Paiute called it tuva. Nevada miners and ranchers simply called them nut pines. The species belongs to the Pinaceae family. Single-leaf Pinyon grows only in the Great Basin region, making it endemic to Nevada, western Utah, eastern California, and northwestern Arizona. No other pinyon species has the single-needle adaptation, making Nevada's state tree botanically unique."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why Single-leaf Pinyon Became the Nevada State Tree"
    paragraphs:
      - "Nevada designated the Single-leaf Pinyon Pine as its official state tree on March 8, 1953. The Nevada Legislature passed Assembly Bill 235 during the 1953 session. Governor Charles H. Russell signed the legislation establishing pinyon pine as Nevada's arboreal symbol. The designation recognized a tree that covers more of Nevada's landscape than any other species and holds deep cultural significance for the state's Native American heritage, consistent with [The Silver State nickname](/states/nevada/nickname/the-silver-state)."
      - "Nevada picked Single-leaf Pinyon because it defines the state's high desert mountain environment. The pinyon-juniper woodlands cover roughly 17 million acres across Nevada - about one-quarter of the entire state. No other tree species approaches this extent. The tree symbolizes survival and adaptation to Nevada's harsh climate. Early Nevada settlers learned from Native Americans to harvest pine nuts, which helped them survive lean times. Nevada's Paiute, Shoshone, and Washoe tribes centered their annual cycles around pine nut harvests. Good nut years meant abundance, while poor crops brought hardship."
      - "The tree held enormous economic and cultural value beyond survival food. Pine nuts became a trade commodity between Nevada tribes and with Spanish colonists. Nevada's Native Americans traveled to traditional gathering areas each fall, with some pinyon groves used by the same families for generations. The harvest brought communities together for weeks of gathering and processing nuts. Early Nevada ranchers recognized pinyon as indicator species - where pinyon grew marked the upper limits of arable land and reliable moisture. Nevada mining camps used pinyon wood for fuel and small construction. The nuts remain commercially harvested in Nevada today, though most commercial pine nuts now come from related species in other regions. The Single-leaf Pinyon's unique botanical status, extensive coverage of Nevada's landscape, and long roots in Nevada's cultural history made it the clear choice for state tree. The species represents Nevada's distinctive Great Basin ecosystem found nowhere else on Earth."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Nevada State Tree Facts"
    facts:
      - "Nevada designated Single-leaf Pinyon on March 8, 1953, through Assembly Bill 235 signed by Governor Charles H. Russell"
      - "This is the only pine species in the world with single needles instead of needle bundles - all other pines have two, three, or five needles per bundle"
      - "Pinyon-juniper woodlands cover approximately 17 million acres in Nevada, roughly one-quarter of the entire state"
      - "Pine nuts from Single-leaf Pinyon provided up to 50 percent of calories for some Great Basin Native American tribes before European contact"
      - "The tree can live 600 to 1,000 years, with some ancient Nevada pinyons estimated at over 1,500 years old"
      - "Good pine nut crops occur every three to seven years depending on rainfall and temperature conditions"
      - "The seeds are wingless and relatively large (one-half to three-quarters inch), designed to be dispersed by pinyon jays and Clark's nutcrackers"
      - "Nevada contains more pinyon-juniper woodland habitat than any other state in the United States"

  - id: tree-and-flower
    icon: "fa-solid fa-seedling"
    title: "Nevada State Tree and Flower"
    paragraphs:
      - "Nevada's state flower is the Sagebrush (Artemisia tridentata), designated in 1967. The state adopted its tree symbol 14 years before choosing the sagebrush. Both symbols represent Nevada's high desert environment. The low-growing sagebrush covers Nevada's valleys and lower slopes, while pinyon pine dominates higher elevations on mountain ranges. Sagebrush blooms with tiny yellow flowers in late summer as pinyon cones mature and prepare to release pine nuts. The pair shows Nevada's distinctive Great Basin ecosystem from sagebrush flats to pinyon-covered mountains. Both species are supremely adapted to Nevada's arid climate and define the state's landscape; compare with the [Nevada state flower page](/states/nevada/flower/sagebrush)."

  - id: appearance
    icon: "fa-solid fa-image"
    title: "How to Recognize a Nevada Pinyon Pine"
    paragraphs:
      - "Examine the needles for certain identification. Single-leaf Pinyon produces one needle at each point on the twig - no other pine in the world shares this characteristic. Each needle measures one to two inches long, appearing stiff, curved, and yellow-green to blue-green. The needles grow in a spiral pattern around the twig. The singular needle immediately distinguishes Nevada's state tree from all other pines. Even non-botanists can identify pinyon with confidence by checking for single needles."
      - "The overall form shows a small, often multi-trunked tree with a rounded crown. Young pinyons develop dense, bushy shapes rather than the conical form of most pines. Mature trees rarely grow tall and straight like forest pines. Instead, the crown spreads nearly as wide as the tree is tall. The bark appears reddish-brown to gray with irregular furrows and scaly ridges. Bark on old trees develops deep furrows but never develops the thick plates of larger pine species. Branches grow irregularly, creating a gnarled, picturesque appearance on ancient specimens."
      - "The cones provide another identification feature. Look for small, rounded cones measuring one to two inches across. The cones appear almost spherical rather than elongated. They start green and mature to brown over two years. When ripe, the cones open to reveal large brown seeds without wings. These seeds are the pine nuts. The cones typically contain 10 to 30 seeds, much fewer and larger than most pine cones. In good years, Nevada pinyons produce cones so abundantly that branches appear covered with them. Pinyon jays and Clark's nutcrackers flock to Nevada pinyon groves during nut harvests, their cries filling the mountain air."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Nevada State Tree Symbolizes"
    paragraphs:
      - "Single-leaf Pinyon represents Nevada's resilience and adaptation to challenging environments. The tree symbolizes survival against adversity - thriving where heat, cold, and drought would kill most trees. For Nevada's Native American communities, pinyon represents sustenance, tradition, and connection to ancestral lands. The annual pine nut harvest continues to hold cultural significance for Paiute, Shoshone, and Washoe peoples. The tree reflects Nevada's Great Basin ecosystem, unusual in the world. Modern Nevadans see pinyon as representing the state's rugged independence and distinctive character. The tree's presence across Nevada's mountains creates the landscape that defines the Silver State's character and supports habitat for the [Nevada state animal](/states/nevada/mammal/desert-bighorn-sheep)."

  - id: "regional-context"
    icon: "fa-solid fa-map"
    title: "Regional Context"
    paragraphs:
      - "Pinyon distribution follows elevation and precipitation gradients that continue across basin-and-range systems beyond Nevada's borders. This context is visible in [states neighboring states](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is the Nevada state tree?"
    answer: "The Single-leaf Pinyon Pine (Pinus monophylla) is Nevada's official state tree. The Nevada Legislature designated it on March 8, 1953, through Assembly Bill 235 signed by Governor Charles H. Russell."
  
  - question: "What is the Nevada state tree called?"
    answer: "Nevada's state tree is called Single-leaf Pinyon Pine, pinyon pine, or simply pinyon. The scientific name is Pinus monophylla, meaning 'single-leaf pine.' Native tribes called it tüba or tuva. It's also known as nut pine."
  
  - question: "When was the Nevada state tree adopted?"
    answer: "Nevada designated the Single-leaf Pinyon Pine as its official state tree on March 8, 1953. The Legislature passed Assembly Bill 235 during the 1953 session, establishing pinyon as Nevada's arboreal symbol."
  
  - question: "Why is the Single-leaf Pinyon Nevada's state tree?"
    answer: "Nevada chose Single-leaf Pinyon because it covers more of the state than any other tree - about 17 million acres or one-quarter of Nevada. The pine nuts sustained Native American tribes for thousands of years and remain culturally significant. The tree defines Nevada's high desert mountain environment and symbolizes survival in harsh conditions. It's also botanically unique as the only pine with single needles, making it distinctive to Nevada's Great Basin ecosystem."
  
  - question: "What is the Nevada state tree name?"
    answer: "The name is Single-leaf Pinyon Pine, describing the unique one-needle characteristic. The scientific name is Pinus monophylla - Pinus means pine, and monophylla means 'single leaf' in Greek. Pinyon comes from Spanish piñón, meaning pine nut."
  
  - question: "Where does the Nevada state tree grow?"
    answer: "The Single-leaf Pinyon grows throughout Nevada's mountain ranges at elevations from 4,000 to 9,000 feet. Pinyon-juniper woodlands cover approximately 17 million acres across Nevada. The tree grows on rocky slopes and ridges throughout the Great Basin region of Nevada, western Utah, eastern California, and northwestern Arizona."
  
  - question: "What are some facts about the Nevada state tree?"
    answer: "The Single-leaf Pinyon grows 15 to 30 feet tall and is the only pine in the world with single needles instead of bundles. It covers 17 million acres in Nevada - more than any other state. The pine nuts provided up to 50 percent of calories for Great Basin tribes. The tree can live 600 to 1,000 years. Good nut crops occur every three to seven years. Nevada contains more pinyon-juniper woodland than any other state."
  
  - question: "How do you recognize the Nevada state tree?"
    answer: "Look for single needles (one to two inches long) - no other pine has this characteristic. The tree stays small (15 to 30 feet) with a rounded, bushy crown. The bark is reddish-brown to gray with irregular furrows. Small rounded cones (one to two inches) contain large wingless seeds - the pine nuts. The tree often has multiple trunks and a gnarled appearance."

