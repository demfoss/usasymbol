seo_title: "Nevada State Flag | Battle Born & Silver Star"
seo_description: "Nevada's flag pairs the 'Battle Born' ribbon with a silver star and sagebrush on blue."

intro_text: "Nevada's state flag is built around a single declaration: **Battle Born** — a reference to Nevada becoming a state on October 31, 1864, while the Civil War was still being fought. That phrase sits on a gold scroll beneath a five-pointed silver star, with two sprays of sagebrush — Nevada's [state flower](/states/nevada/flower/sagebrush) — crossing beneath it. The word Nevada curves across the top in gold letters on a cobalt blue field. Louis Shellback III designed the flag after a 1929 competition; a 1991 revision repositioned elements to improve proportions. The flag is featured in the [U.S. state flags collection](/symbols/flags), and the official colors are detailed on [Nevada's state colors page](/states/nevada/color/nevada-official-state-colors-silver-and-blue)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "How the Nevada State Flag Is Designed"
    paragraphs:
      - "The Nevada state flag is the official banner of Nevada. A cobalt blue field covers the background. A five-pointed silver star sits in the upper left corner. Two sprays of sagebrush cross beneath the star."
      - "A gold scroll wraps around the sagebrush sprays. The words Battle Born appear on the scroll. The word Nevada curves across the top in gold capital letters. Government offices, schools, and public sites in Nevada display this flag, while formal wording is covered on the [Nevada state motto page](/states/nevada/motto/all-for-our-country)."
  
  - id: meaning
    icon: "fa-solid fa-book-open"
    title: "What the Nevada Flag Communicates"
    paragraphs:
      - "The flag represents Nevada's admission to statehood during the Civil War. Battle Born refers to Nevada becoming a state in 1864 while the war raged. The phrase became Nevada's unofficial motto."
      - "The silver star symbolizes Nevada's mining industry. Silver mining drove Nevada's economy and settlement. The sagebrush represents Nevada's official state flower adopted in 1959; compare with the [Nevada state flower page](/states/nevada/flower/sagebrush)."
      - "Cobalt blue stands for Nevada's clear skies. Gold represents the state's natural wealth. Silver acknowledges the metal that built Nevada's fortune and aligns with [Nevada's official state colors](/states/nevada/color/nevada-official-state-colors-silver-and-blue)."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Nevada Flag History and Adoption"
    paragraphs:
      - "Nevada introduced its current flag in 1929. The legislature replaced an earlier design that had been in use since 1915. Governor Fred Balzar signed the new flag law. Louis Shellback III designed the winning submission after a state design competition."
      - "Before 1929, Nevada had used two other official flags. The first from 1905 showed silver stars spelling NEVADA in the canton. Clara Crisler designed the second flag in 1915. That version placed the state seal in the center surrounded by 36 stars representing Nevada as the 36th state. The seal's many colors proved too expensive to produce."
      - "The legislature modified the flag in 1991. Officials moved the star and sagebrush higher on the field. This repositioning improved proportions. The word Battle Born got standardized spacing. These changes refined the 1929 design without altering core elements."

  - id: previous-versions
    icon: "fa-solid fa-flag"
    title: "Earlier Versions of the Nevada Flag"
    versions:
      - name: "First State Flag"
        years: "1905–1915"
        image: "versions/first-1905.webp"
        description: "The first official flag featured silver stars spelling NEVADA in the canton with a wreath and scroll."

      - name: "Second State Flag"
        years: "1915–1929"
        image: "versions/second-1915.webp"
        description: "Designed by Clara Crisler, this flag showed the state seal in the center surrounded by 36 stars but proved too expensive to produce."

      - name: "Third State Flag"
        years: "1929–1991"
        image: "versions/third-1929.webp"
        description: "The 1929 redesign by Louis Shellback III introduced the single star, sagebrush sprays, and Battle Born scroll."

      - name: "Current State Flag"
        years: "1991–present"
        image: "versions/current-1991.webp"
        description: "The current flag repositioned the star and sagebrush higher on the field and standardized Battle Born spacing."

  - id: symbols
    icon: "fa-solid fa-shapes"
    title: "Key Symbols on the Nevada Flag"
    symbols:
      - id: star
        name: "Silver Star"
        image: "symbols/star.svg"
        paragraphs:
          - "A five-pointed silver star appears in the upper left. The star symbolizes Nevada's silver mining industry. Silver mining attracted settlers to Nevada Territory in the 1850s and 1860s."
          - "The Comstock Lode discovery in 1859 sparked Nevada's mining boom. Silver made Nevada wealthy. The metal became synonymous with Nevada's identity as the Silver State."

      - id: sagebrush
        name: "Sagebrush Sprays"
        image: "symbols/sagebrush.svg"
        paragraphs:
          - "Two sprays of sagebrush cross beneath the star. Sagebrush grows abundantly across Nevada's high desert. Nevada designated sagebrush as its state flower in 1959."
          - "The plant represents Nevada's natural landscape. Sagebrush covers much of Nevada's terrain. It thrives in the dry climate that defines the state."

      - id: battle-born
        name: "Battle Born Scroll"
        image: "symbols/battle-born.svg"
        paragraphs:
          - "The words Battle Born appear on a gold scroll. This phrase refers to Nevada's admission to the Union on October 31, 1864. The Civil War was still being fought."
          - "President Abraham Lincoln wanted Nevada statehood to support the Union cause and the Thirteenth Amendment. Nevada became a state in the middle of the war. Battle Born became Nevada's unofficial motto celebrating this unique timing."

      - id: nevada-text
        name: "Nevada Text"
        image: "symbols/nevada-text.svg"
        paragraphs:
          - "The word Nevada curves across the top in gold letters. This text identifies the flag clearly. Many states added their names to flags in the early 1900s."
          - "The gold lettering matches the scroll color. It creates visual unity across the design."

      - id: field
        name: "Cobalt Blue Field"
        image: "symbols/field.svg"
        paragraphs:
          - "Cobalt blue covers the background. This shade represents Nevada's clear blue skies. The desert climate creates distinctive sky colors."
      - "Blue also demonstrates loyalty to the Union. Nevada chose this color to match other western state flags adopted in the early twentieth century, with regional context in [states neighboring states](/rankings/geography/states-neighboring-states)."

  - id: colors
    icon: "fa-solid fa-palette"
    title: "Nevada State Flag Colors"
    paragraphs:
      - "The flag uses cobalt blue, silver, gold, and green. Cobalt blue forms the field. Silver appears in the star. Gold shows in the scroll and text. Green depicts the sagebrush."
    colors:
      - name: "Cobalt Blue"
        hex: "#003366"
      - name: "Silver"
        hex: "#C0C0C0"
      - name: "Gold"
        hex: "#FFD700"
      - name: "Green"
        hex: "#2D5016"

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Nevada State Flag Facts"
    facts:
      - "Nevada adopted its current flag design in 1929"
      - "Louis Shellback III designed the 1929 flag"
      - "Clara Crisler designed the 1915-1929 flag version"
      - "The flag was modified in 1991 to reposition elements"
      - "Battle Born refers to Nevada's statehood during the Civil War"
      - "Nevada became a state on October 31, 1864"

faq:
  - question: "What is the official state flag of Nevada?"
    answer: "The Nevada state flag is the official banner of Nevada. It features a silver star between sagebrush sprays with a Battle Born scroll on a cobalt blue field with the word Nevada across the top."

  - question: "How would you describe the design of the Nevada state flag?"
    answer: "The flag shows a five-pointed silver star in the upper left with two sagebrush sprays crossing beneath it. A gold scroll reads Battle Born. The word Nevada curves across the top in gold letters on a cobalt blue background."

  - question: "How do historians explain the symbolism of Nevada's flag?"
    answer: "The flag represents Nevada's Civil War-era statehood and mining heritage. The silver star symbolizes silver mining. The sagebrush represents Nevada's landscape. Battle Born marks Nevada's admission during the Civil War."

  - question: "What does the Nevada state flag represent?"
    answer: "The flag means Nevada's unique path to statehood. Battle Born refers to becoming a state on October 31, 1864, while the Civil War raged. The silver star honors the mining industry that built Nevada."

  - question: "What are the main visual elements on Nevada's flag?"
    answer: "Sagebrush appears on the Nevada state flag. Two sprays cross beneath the silver star. Sagebrush is Nevada's state flower."

  - question: "What stands out most about Nevada's flag?"
    answer: "The flag says Battle Born because Nevada became a state on October 31, 1864, during the Civil War. President Lincoln wanted Nevada statehood to support the Union and the Thirteenth Amendment."

  - question: "When did Nevada adopt its current state flag?"
    answer: "Nevada adopted its current flag design in 1929 and modified it in 1991 to reposition elements."

