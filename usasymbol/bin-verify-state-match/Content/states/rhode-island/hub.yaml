seo_description: "Rhode Island symbols include the anchor flag, Rhode Island Red, harbor seal, violet, red maple, and Ocean State nickname."
snippet_answer: "Among the official state symbols of Rhode Island are the anchor flag, harbor seal, and Rhode Island Red chicken — compact emblems that reflect the state's coastal and agricultural identity. The Hope motto, Ocean State nickname, violet, red maple, and coffee milk give the country's smallest state one of the more locally grounded symbols lists."
