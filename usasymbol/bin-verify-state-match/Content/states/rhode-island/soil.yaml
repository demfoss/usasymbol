faq:
- question: What is Rhode Island's state soil?
  answer: "Rhode Island's state soil is the Newport series, a well-drained glacial till Inceptisol that covers the rocky uplands across all five counties of the state. It formed from granite and gneiss till deposited by the Laurentide ice sheet and is recognized by its thin, dark surface and dense compact basal layer."
- question: Why is it called Newport soil?
  answer: "The Newport series is named after Newport, Rhode Island. USDA soil scientists name soil series after nearby towns, harbors, or geographic features located near where the series was first formally described. Newport city and its surrounding till uplands on Aquidneck Island gave the series its name."
- question: What color is Newport soil?
  answer: "The surface is dark grayish brown sandy loam from organic matter under forest leaf litter. The cambic subsoil transitions from dark yellowish brown in the upper layer to olive brown and then olive as iron leaches downward. The dense basal till at the base is olive gray — a muted, compressed layer that shows little color variation year to year."
- question: Where is Newport soil found in Rhode Island?
  answer: "Newport soil is found across all five Rhode Island counties on the glaciated upland terrain above the coastal lowlands and river valleys. It is most extensive in Providence, Kent, and Washington counties, and also covers the till uplands of Newport and Bristol counties."
- question: What grows in Newport soil?
  answer: "White oak, scarlet oak, red maple, and pitch pine are the dominant forest species. Highbush blueberry and black huckleberry grow in the acidic understory. Farm uses include nursery plants, sod, Christmas trees, and market vegetables. Historic uses included dairy pasture, potatoes, and hay."
- question: What is the dense layer at the bottom of Newport soil?
  answer: "The Cd horizon is dense basal till — glacial material compacted under the weight of miles of ice during the Wisconsin glaciation. It is so compact that roots cannot penetrate it and water moves through it very slowly. This layer sits at roughly three feet and defines the effective depth of Newport soil."
- question: Why is Newport soil so stony?
  answer: "The glacial till that formed Newport soil contains boulders, cobbles, and stones carried by the ice from bedrock across central New England. When the ice melted, all that rocky material was left behind as till. Early Rhode Island farmers spent generations clearing stones from Newport soil uplands, stacking them into the stone walls that still line the landscape."

