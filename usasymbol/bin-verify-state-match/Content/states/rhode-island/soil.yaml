seo_title: "Rhode Island State Soil | Newport Series"
seo_description: "The Rhode Island state soil is the Newport series. It covers glaciated uplands statewide, supporting oak and pitch pine forests and small farms."
hero_image: /images/soils/rhode-island/rhode-island-state-soil-hero.webp
