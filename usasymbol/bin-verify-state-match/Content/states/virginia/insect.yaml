faq:
- question: What is Virginia's state insect?
  answer: "Virginia's state insect is the eastern tiger swallowtail, adopted in 1991."
- question: When did Virginia adopt the eastern tiger swallowtail?
  answer: "Virginia adopted the eastern tiger swallowtail as its official state insect in 1991."
- question: What does the eastern tiger swallowtail look like?
  answer: "It is a large yellow butterfly with black tiger-like stripes, a black wing border, and narrow tails on the hindwings. It has a wingspan of about 3 to 5.5 inches."
- question: Is the eastern tiger swallowtail the same as Virginia's state pollinator?
  answer: "No. Virginia's state pollinator is the European honey bee, adopted in 2024. The eastern tiger swallowtail is a separate designation, the official state insect, adopted in 1991."
- question: Where can you find the eastern tiger swallowtail in Virginia?
  answer: "It is common throughout Virginia, often seen in gardens, yards, and along woodland edges from spring into fall."

