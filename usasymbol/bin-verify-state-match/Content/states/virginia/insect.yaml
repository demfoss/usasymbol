sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Virginia?
  paragraphs:
  - "The eastern tiger swallowtail, Papilio glaucus, is Virginia's official state insect. The Virginia General Assembly designated it in 1991."
  - "The eastern tiger swallowtail is common across the eastern United States and is a familiar sight in Virginia yards and gardens."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Eastern Tiger Swallowtail
  paragraphs:
  - "The eastern tiger swallowtail is a large yellow butterfly marked with four black tiger-like stripes on each forewing and a black border along the wing edges. Each hindwing ends in a narrow tail."
  - "Adults have a wingspan of about 3 to 5.5 inches, among the largest butterflies found in Virginia. Some females have a dark, almost black form instead of the typical yellow coloring."
  - "Caterpillars start out looking like bird droppings and later turn green with large eyespots that make them resemble small snakes, a defense against predators."

- id: history
  icon: fa-solid fa-landmark
  title: How Virginia Chose the Eastern Tiger Swallowtail
  paragraphs:
  - "The Virginia General Assembly named the eastern tiger swallowtail the official state insect in 1991."
  - "The designation recognized the butterfly as a familiar, easily recognized species found throughout the state."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Eastern Tiger Swallowtail in Virginia
  paragraphs:
  - "The eastern tiger swallowtail is common throughout Virginia, from spring into fall."
  - "Look for it in gardens, yards, and along woodland edges, especially near flowering plants."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Eastern Tiger Swallowtail Facts
  facts:
  - "Adopted: 1991, by the Virginia General Assembly."
  - "Scientific name: Papilio glaucus."
  - "Wingspan: about 3 to 5.5 inches, with yellow wings, black tiger stripes, and tailed hindwings."
  - "Some females have an all-dark wing form instead of the typical yellow coloring."
  - "Virginia also has a separate state pollinator, the European honey bee, adopted in 2024."




