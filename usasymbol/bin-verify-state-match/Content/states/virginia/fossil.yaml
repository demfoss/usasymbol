faq:
- question: What is Virginia's state fossil?
  answer: "Virginia's state fossil is the scallop Chesapecten jeffersonius, an extinct Pliocene bivalve designated by the Virginia General Assembly in 1993."
- question: When did Virginia adopt its state fossil?
  answer: "Virginia adopted Chesapecten jeffersonius as its state fossil in 1993."
- question: What did the scallop look like?
  answer: "Chesapecten jeffersonius had a broad, fan-shaped shell up to 6 inches across with 17 to 19 raised ribs and a pair of flat, wing-like extensions at the hinge. It looked very similar to a modern Atlantic bay scallop."
- question: Where are scallop fossils found in Virginia?
  answer: "Fossils are found throughout Virginia's coastal plain wherever the Yorktown Formation is exposed. York River State Park near Williamsburg and Chippokes Plantation State Park in Surry County are reliable sites. The Eastern Shore counties of Northampton and Accomack also have productive outcrops."
- question: When did the scallop live?
  answer: "Chesapecten jeffersonius lived during the Pliocene epoch, roughly 4 to 3 million years ago, in the warm shallow sea that covered Virginia's coastal plain. It went extinct about 3 million years ago as ocean temperatures cooled."
- question: Why is the scallop named after Thomas Jefferson?
  answer: "Thomas Jefferson described fossil scallop shells from near the York River in his 1787 book Notes on the State of Virginia. Later scientists named the species jeffersonius in his honor, recognizing that account as one of the earliest scientific descriptions of an American fossil."

