- id: facts
  icon: fa-solid fa-lightbulb
  title: Scallop Facts
  facts:
  - "Virginia adopted Chesapecten jeffersonius as its state fossil in 1993, naming it after Thomas Jefferson, who described the shells in his 1787 book Notes on the State of Virginia."
  - "Jefferson's description of these fossil shells is one of the earliest scientific accounts of an American fossil, written more than 70 years before Darwin published On the Origin of Species."
  - "Chesapecten jeffersonius had 17 to 19 ribs on its shell — slightly more than most living Atlantic scallops — and could reach 6 inches across."
  - "The Yorktown Formation, the rock unit where C. jeffersonius is most commonly found, underlies much of Virginia's coastal plain and is exposed along dozens of rivers and tidal creeks."
  - "The genus Chesapecten is named for the Chesapeake Bay region, where its fossils are most abundant."

