seo_title: "Virginia State Soil | Pamunkey Series"
seo_description: "The Virginia state soil is the Pamunkey series. It covers river terraces across the Coastal Plain and Piedmont, growing tobacco, corn, and soybeans."
hero_image: /images/soils/virginia/virginia-state-soil-hero.webp
