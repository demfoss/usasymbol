- id: agriculture
  icon: fa-solid fa-wheat-awn
  title: Farming and Forests on Pamunkey Soil
  paragraphs:
  - "Tobacco is the defining crop of Pamunkey soil history. Virginia was the first colony to grow tobacco commercially, beginning along the James River in the early 1600s, and the river terrace soils — Pamunkey and related series — were where English planters established their first and most productive fields. Flue-cured tobacco grew on Pamunkey soil terraces across the Coastal Plain for more than three centuries."
  - "Corn and soybeans are the dominant modern crops on Pamunkey soil. Virginia ranks consistently in the top fifteen soybean-producing states, with the Coastal Plain river terrace counties contributing to that total. Winter wheat is grown in rotation, and peanuts appear on Pamunkey and related sandy-loam terraces in the southeastern Coastal Plain counties."
  - "Where Pamunkey soil farmland has reverted to forest, loblolly pine is the first tree to establish on the old fields. Mature terrace forest on Pamunkey soil supports tulip poplar, red maple, sweetgum, willow oak, and American elm — the moist but well-drained canopy mix typical of Virginia's inner Coastal Plain river margins."
  - "The Pamunkey people have maintained a fishery on the Pamunkey River for centuries, harvesting shad and herring during spring runs. The river terraces above the fishing grounds — the Pamunkey soil uplands — were the garden plots and cornfields that fed the same communities. That relationship between the terrace soils and the river fishery has continued without interruption from the pre-contact period to the present day."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Pamunkey Soil Facts
  facts:
  - "Pamunkey soil is classified as a fine-loamy, mixed, semiactive, thermic Typic Hapludult — an Ultisol formed in Quaternary alluvium on stream terraces, with an argillic clay subsoil and base saturation below 35 percent. The thermic classification means the soil averages between 15°C and 22°C annually, placing it at the warmer end of Virginia's soil temperature zones."
  - "The Pamunkey Tribe received federal recognition from the United States government in 2015, becoming the first Virginia tribe to do so. Their reservation on the Pamunkey River in King William County has been continuously occupied for at least 10,000 years, making the Pamunkey River valley one of the longest-documented sites of human land use in North America — all of it on Pamunkey and related alluvial terrace soils."
  - "Jamestown, the first permanent English settlement in North America, was established in 1607 on a peninsula in the James River — on the same river system whose terrace soils the Pamunkey series represents. The colonists planted their first American tobacco crops on James River Coastal Plain soils within a decade of landing, beginning the agricultural economy that would define Virginia for the next three centuries."
  - "The eluvial E horizon in Pamunkey soil — the pale, leached layer between the surface and the argillic subsoil — is a marker of the soil's age and the humid Virginia climate. In soils younger than a few thousand years, this leached zone does not develop. Its presence in Pamunkey confirms that the river terraces have been stable, well-drained ground long enough for significant chemical weathering to occur."
  - "Virginia's colonial tobacco planters selected river terrace locations for their plantations deliberately. Terrace soils like Pamunkey drain faster than adjacent floodplain soils, warm earlier in spring for transplanting, and sit above flood risk. The terrace topography also gave access to river transport — the system of docks and hogsheads that moved Virginia tobacco from field to ship to London market."

