faq:
- question: What is Virginia's state soil?
  answer: "Virginia's state soil is the Pamunkey series, a deep, well-drained Ultisol on the stream terraces of Virginia's river systems. It formed in Quaternary river alluvium across the Coastal Plain and Piedmont and is named after the Pamunkey River and the Pamunkey Tribe."
- question: Why is it called Pamunkey soil?
  answer: "The Pamunkey series is named after the Pamunkey River in King William County, Virginia. The river is named for the Pamunkey Tribe, one of the oldest continuously inhabited Indigenous communities in North America. USDA soil scientists named the series for the river when mapping the region during early federal soil surveys."
- question: What color is Pamunkey soil?
  answer: "The surface is dark grayish brown loam from organic matter. Below it is a light yellowish brown eluvial layer where nutrients have leached out. The argillic subsoil grades from yellowish brown clay loam to brownish yellow sandy clay loam. The deepest layer is pale yellow stratified river alluvium."
- question: Where is Pamunkey soil found in Virginia?
  answer: "Pamunkey soil is found on stream terraces along Virginia's major river systems — the James, York, Pamunkey, Mattaponi, Rappahannock, and Potomac rivers — through the Coastal Plain and into the Piedmont. It is most extensive in King William, New Kent, Hanover, Caroline, and Spotsylvania counties."
- question: What grows in Pamunkey soil?
  answer: "Tobacco, corn, soybeans, and winter wheat are the main crops. The Pamunkey Tribe has maintained a traditional shad and herring fishery on the Pamunkey River adjacent to the terrace soils for centuries. Where forested, loblolly pine, tulip poplar, sweetgum, and willow oak are the dominant species."
- question: What is the connection between Pamunkey soil and the Pamunkey Tribe?
  answer: "The Pamunkey Tribe has farmed the river terraces along the Pamunkey River in King William County for thousands of years. Their reservation, continuously occupied for at least 10,000 years, sits on Pamunkey and related alluvial terrace soils. The series was named for the river, which was named for the tribe — making the soil name one of the few in the United States that directly honors an Indigenous community."
- question: How is Pamunkey soil different from Virginia's upland soils?
  answer: "Pamunkey soil formed in river alluvium deposited on flat stream terraces, while Virginia's upland soils formed in weathered bedrock residuum on sloping terrain. Pamunkey is deeper, less rocky, and easier to till than most upland Piedmont soils. The flat terrace topography also drains well without erosion risk, which is why river terrace soils were preferred for tobacco and corn from the earliest colonial settlements."

