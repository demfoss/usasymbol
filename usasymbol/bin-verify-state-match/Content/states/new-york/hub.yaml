seo_description: "New York symbols include the eastern bluebird, rose, sugar maple, Excelsior motto, Empire State nickname, and beaver."
snippet_answer: "Among the official state symbols of New York are the eastern bluebird, rose, and sugar maple — each tied to the state's farms, gardens, and forests beyond the cities. The Excelsior motto, Empire State nickname, and beaver connect civic ambition, commerce history, and the fur trade that shaped early New York."
