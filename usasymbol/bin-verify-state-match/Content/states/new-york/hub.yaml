name_meaning:
  heading: What Does New York Mean?
  paragraphs:
  - New York became the 11th state in 1788, after the colonial period that began under Dutch and then English control. The name honors the Duke of York after the English took control of New Netherland and renamed New Amsterdam as New York.
  - The state name is colonial and dynastic, but the symbols are broader. Excelsior gives New York its upward motto, the Empire State nickname gives it scale, and the beaver, sugar maple, rose, milk, and working dog bring the guide back to land, labor, and daily life.
  - New York's postal abbreviation is NY, and residents are New Yorkers. Empire State remains the state's strongest shorthand.
  info_groups:
  - heading: Key Meaning and Background
    items:
    - label: Origin
      text: Named for the Duke of York after English control replaced Dutch New Netherland.
    - label: Statehood
      text: New York ratified the Constitution in 1788, making it the 11th state.
    - label: Motto
      text: Excelsior means Ever Upward.
  - heading: Usage Examples and Context
    items:
    - label: State
      text: Refers to New York, a state that includes New York City, the Hudson Valley, the Adirondacks, the Finger Lakes, and western New York.
    - label: City
      text: New York also commonly refers to New York City, though this hub covers the state.
    - label: People
      text: People from New York are called New Yorkers.
  - heading: Nicknames and Short Forms
    items:
    - label: The Empire State
      text: Main nickname, tied to New York's scale, wealth, and influence.
    - label: Excelsior State
      text: Informal identity drawn from the state motto.
    - label: Abbreviation
      text: NY; older short form N.Y.
editorial:
  heading: What New York's Symbols Say About the State
  paragraphs:
  - New York's [Empire State nickname](/states/new-york/nickname) and [Excelsior motto](/states/new-york/motto) make a powerful pair. One claims scale; the other claims upward motion.
  - The [American beaver](/states/new-york/mammal/beaver) is the symbol that keeps the hub from becoming only civic grandeur. It points to fur-trade history, waterways, and the animal on the state seal tradition.
  - The [sugar maple](/states/new-york/tree), [rose](/states/new-york/flower), [milk](/states/new-york/beverage/milk), and [working dog](/states/new-york/mammal/service-dog) pull New York away from a city-only reading. They make room for forests, farms, gardens, and service work.
faq:
- question: What is the New York state abbreviation?
  answer: The New York postal abbreviation is [NY](/states/new-york/abbreviation) — the two-letter USPS code used on addresses and forms since 1963.
- question: Is Albany New York's largest city?
  answer: No. Albany is the capital, but New York City is far larger. Albany is one of [33 state capitals that are not the largest city in their state](/rankings/geography/state-capitals-not-largest-city).
- question: What is New York's most famous state symbol?
  answer: The [Empire State nickname](/states/new-york/nickname) is New York's most famous state symbol because it is used constantly in public identity, tourism, and culture.
- question: What is New York's state bird?
  answer: New York's state bird is the [eastern bluebird](/states/new-york/bird), adopted in 1970.
- question: What is New York's state flower?
  answer: New York's state flower is the [rose](/states/new-york/flower), adopted in 1955.
- question: What does Excelsior mean?
  answer: New York's [state motto](/states/new-york/motto), Excelsior, means Ever Upward.
- question: How many official state symbols does New York have?
  answer: New York's hub currently covers the flag, bluebird, rose, sugar maple, motto, nickname, colors, milk, beaver, and working dog pages.
