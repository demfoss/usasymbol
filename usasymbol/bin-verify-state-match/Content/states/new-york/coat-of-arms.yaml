type: State Coat of Arms
state: New York
name: New York State Coat of Arms
adopted_year: 1777
is_official: true
meaning: "The New York coat of arms builds its design around a single political argument: liberty and law are equally necessary for republican government, and both require an active rejection of monarchy. Liberty stands on the left holding a Phrygian cap, her crown discarded at her feet. Justice stands on the right, blindfolded, with scales and a sword. The Hudson River landscape on the shield ties the design to New York's specific geography, and the eagle on a globe above places the founding within a broader world context."
meaning_title: Meaning of the New York Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'New York Coat of Arms: Meaning, Symbols and History'
seo_description: "The New York coat of arms was adopted in 1777 and shows Liberty and Justice flanking a shield with a rising sun over the Hudson River."
hero_image: /images/coats-of-arms/new-york/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of New York, showing Liberty at left with a Phrygian cap and discarded crown, Justice at right with scales and sword, and a bald eagle on a globe above a shield with Hudson River ships and a rising sun
hero_image_caption: The New York Coat of Arms, adopted 1777, updated 2020. Liberty stands at left with a Phrygian cap on a pole and a discarded crown at her feet. Justice stands at right, blindfolded, holding scales and a sword. The shield shows two ships on the Hudson River and a sun rising over the Highlands. A bald eagle on a globe sits above, and the ribbon reads Excelsior and E Pluribus Unum.
intro_text: "The New York coat of arms, adopted in 1777, places Liberty on the left and Justice on the right of a shield showing Hudson River ships and a rising sun over the Highlands. A crown lies at Liberty's feet, marking the explicit rejection of British monarchy at the moment of the state's founding. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the New York Coat of Arms?
  paragraphs:
  - "The coat of arms centers on a heraldic shield supported by two standing figures. Above the shield, a bald eagle with spread wings perches on a globe. Below the shield, a ribbon carries the state motto Excelsior and, since April 9, 2020, a second motto: E Pluribus Unum."
  - "The coat of arms and the state seal use the same design. The difference is that the state seal surrounds the design with a circular legend reading THE GREAT SEAL OF THE STATE OF NEW YORK. The coat of arms appears without that border on state buildings, the governor's standard, and official documents where the full seal is not required."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the New York Coat of Arms
  paragraphs:
  - "New York adopted its coat of arms in 1777, the same year the state ratified its first constitution. The design was created by the Convention of the Representatives of the State of New York while the Revolutionary War was still being fought. British forces still occupied parts of New York when the design was finalized."
  - "The convention chose Liberty and Justice as the two supporting figures because they expressed the philosophical argument behind the Revolution: that freedom and impartial law were equal foundations of republican government. The Hudson River landscape on the shield placed the design in New York's own geography rather than relying on purely abstract allegory."
  - "The crown placed at Liberty's feet was not a subtle gesture. In 1777, with the war ongoing, it was a direct and public statement that New York had rejected the British monarchy. The design has kept that crown exactly where the founders put it."
  - "On April 9, 2020, the New York Legislature updated both the state seal and coat of arms to add E Pluribus Unum beneath Excelsior on the ribbon. The figures, shield, eagle, globe, and crown remained unchanged."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the New York Coat of Arms
  paragraphs:
  - "The New York coat of arms arranges its elements around a central shield. Each figure and object was placed deliberately to make a specific argument about what the new state stood for in 1777."
  elements:
  - id: liberty
    name: Liberty
    image: /images/coats-of-arms/new-york/elements/liberty.webp
    paragraphs:
    - "Liberty stands on the left side of the design, holding a tall pole topped with a Phrygian cap. The Phrygian cap was worn by freed slaves in ancient Rome and became a standard symbol of liberation in 18th-century revolutionary culture. It appeared throughout American and French founding-era imagery."
    - "At Liberty's feet lies a discarded crown. It represents the British monarchy that New York had just rejected. The crown is placed beneath her feet rather than simply absent from the design, making the rejection active and explicit."
  - id: justice
    name: Justice
    image: /images/coats-of-arms/new-york/elements/justice.webp
    paragraphs:
    - "Justice stands on the right side of the design, blindfolded, holding scales in one hand and a sword in the other. The blindfold represents impartiality: law applied without regard to the rank or identity of the parties. The scales represent the weighing of evidence."
    - "The sword represents the authority to enforce legal decisions. Together, scales and sword express that law must be both fair in judgment and capable of carrying that judgment out."
  - id: shield
    name: Central Shield
    image: /images/coats-of-arms/new-york/elements/shield.webp
    paragraphs:
    - "The central shield shows a New York landscape divided into two halves. The upper portion depicts the Hudson Highland mountains with a sun rising behind them. The lower portion shows two ships under sail on the Hudson River."
    - "The use of actual New York geography set this design apart from most other state coat of arms of the founding era. The Hudson River was New York's primary commercial artery in 1777, and its presence on the shield tied the design to the material life of the state rather than to generic allegory."
  - id: eagle-globe
    name: Eagle on Globe
    image: /images/coats-of-arms/new-york/elements/eagle-globe.webp
    paragraphs:
    - "A bald eagle with spread wings perches on a globe above the central shield. New York's use of the eagle in 1777 predates the adoption of the Great Seal of the United States by five years: Congress did not adopt the U.S. Great Seal until June 20, 1782."
    - "The globe beneath the eagle's talons places New York's founding in a world context. New York in 1777 was already one of the busiest commercial ports in North America, with trade extending across the Atlantic."
  - id: motto
    name: Excelsior and E Pluribus Unum
    image: /images/coats-of-arms/new-york/elements/motto.webp
    paragraphs:
    - "The ribbon below the shield carries two mottos. Excelsior is Latin for ever upward or higher still. It has been New York's state motto since 1778, when the Legislature formally enacted it. Henry Wadsworth Longfellow made it widely known in 1841 by using it as the title of a poem."
    - "E Pluribus Unum, the national motto meaning Out of many, one, was added to the ribbon on April 9, 2020. It now appears beneath Excelsior on both the coat of arms and the state seal."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the New York Coat of Arms
  paragraphs:
  - "Liberty and Justice face each other across the shield, but neither faces inward toward it. Both face outward, toward the viewer. The design presents them as principles the state claims, not as guardians protecting the shield from the outside."
  - "The crown at Liberty's feet turns a standard allegorical figure into a specific historical statement. In most earlier European heraldry, Liberty simply carried her cap and pole. New York's designers added the discarded crown in 1777 to make the break from monarchy concrete and visible."
  - "The rising sun on the shield aligns with the motto Excelsior. Both point upward and forward. The ships on the Hudson below the sun ground that aspiration in commerce and geography, showing that New York's idea of upward progress was tied to the work of trade and navigation, not to abstract philosophy alone."

- id: facts
  icon: fa-solid fa-lightbulb
  title: New York Coat of Arms Facts
  facts:
  - "Adopted in 1777 by the Convention of the Representatives of the State of New York, the same year the state ratified its first constitution."
  - "The bald eagle on the 1777 design predates the eagle on the Great Seal of the United States by five years. Congress did not adopt the U.S. Great Seal until June 20, 1782."
  - "On April 9, 2020, New York added E Pluribus Unum beneath Excelsior on the ribbon. The figures, shield, eagle, globe, and crown were not changed."
  - "Liberty's discarded crown is placed specifically at her feet, not simply absent from the design. That placement was deliberate in 1777 and remains unchanged."
  - "The Hudson River ships on the shield represent two sailing vessels. The Hudson was New York's primary trade route in 1777 and the economic backbone of the state."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the New York Coat of Arms
  paragraphs:
  - "The core composition of the New York coat of arms has remained stable since the Revolutionary era. Liberty, Justice, the Hudson River shield, the eagle on a globe, and the crown at Liberty's feet all continued unchanged through later standard renderings."
  - "The only official symbolic change in recent law came on April 9, 2020, when New York added E Pluribus Unum beneath Excelsior on the ribbon. Earlier and current renderings on Wikimedia Commons make that ribbon change easy to see."

