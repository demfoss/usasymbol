faq:
- question: What is New York's state insect?
  answer: "New York's state insect is the nine-spotted ladybug, adopted by the New York State Legislature in 1989."
- question: When did New York adopt the nine-spotted ladybug?
  answer: "New York adopted the nine-spotted ladybug as its official state insect in 1989."
- question: What does New York's state insect look like?
  answer: "The nine-spotted ladybug is a small, round, red beetle with nine black spots, four on each wing cover and one split at the center."
- question: Is the nine-spotted ladybug still common in New York?
  answer: "No. It became rare after 1989 as other ladybug species increased. It was rediscovered on Long Island in 2011 after a long search by scientists and volunteers."
- question: Where can you find the nine-spotted ladybug in New York?
  answer: "It is rare today. The best-known recent sighting was on Long Island in 2011, and researchers continue to look for the species around the state."

