sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of New York?
  paragraphs:
  - "The nine-spotted ladybug, Coccinella novemnotata, is New York's official state insect. The New York State Legislature designated it in 1989."
  - "Once common across New York, the nine-spotted ladybug became rare in the decades after its selection as state insect."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Nine-Spotted Ladybug
  paragraphs:
  - "The nine-spotted ladybug is a small, round, domed beetle with a red shell marked by nine black spots, four on each wing cover and one split at the center."
  - "Like other ladybugs, it has short legs and antennae and can fly using wings hidden beneath its hard outer shell."
  - "It feeds on aphids and other small, soft-bodied insects on plants."

- id: history
  icon: fa-solid fa-landmark
  title: How New York Chose the Nine-Spotted Ladybug
  paragraphs:
  - "The New York State Legislature named the nine-spotted ladybug the official state insect in 1989, when it was still a common sight statewide."
  - "In the years that followed, the species declined sharply as other ladybug species, including some introduced from overseas, became more common in New York."
  - "Scientists and volunteers with the Lost Ladybug Project searched for years before rediscovering a wild nine-spotted ladybug on Long Island in 2011."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Nine-Spotted Ladybug in New York
  paragraphs:
  - "The nine-spotted ladybug is now rare in New York. After years without confirmed sightings, one was found on Long Island in 2011, and scientists continue to monitor for the species."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Nine-Spotted Ladybug Facts
  facts:
  - "Adopted in 1989 by the New York State Legislature."
  - "Scientific name: Coccinella novemnotata."
  - "Red, domed shell with nine black spots, four per wing cover and one split at the center."
  - "Became rare in New York after its selection as state insect, as other ladybug species became more common."
  - "Rediscovered on Long Island in 2011 after a multi-year search by the Lost Ladybug Project."




