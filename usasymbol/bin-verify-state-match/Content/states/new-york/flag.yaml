faq:
  - question: "Which flag serves as New York's official banner?"
    answer: "The New York state flag is the official banner of New York. It features the state coat of arms showing Liberty and Justice supporting a shield with landscape on a dark blue field."

  - question: "What are the main visual elements on New York's flag?"
    answer: "The flag shows the New York coat of arms on a dark blue background. The coat of arms includes a shield with the Hudson River and ships, an eagle above, and two female figures (Liberty and Justice) on each side. The motto Excelsior appears on a ribbon below."

  - question: "When was the present New York flag approved in law?"
    answer: "New York's current state flag was formally authorized by the legislature in 1901. Before that, military units had carried the coat of arms on buff-colored fabric since the Revolutionary era. The 1901 law switched to a blue field to align with other state flags. The seal was most recently updated in 2020 to add the motto E Pluribus Unum."

  - question: "What meaning is attached to New York's flag?"
    answer: "The flag means progress and justice. Excelsior means Ever Upward, reflecting ambition. Liberty and Justice represent New York's commitment to freedom and fair governance. The landscape shows New York's natural resources."

  - question: "Which colors define New York's flag?"
    answer: "The New York state flag uses dark blue, white, gold, green, brown, and orange. Dark blue forms the field. The other colors appear in the coat of arms details."

  - question: "Does New York's flag have an official name?"
    answer: "The flag has no official nickname. It is called the New York state flag or the flag of New York."

  - question: "How would you describe the design of the New York state flag?"
    answer: "The New York state flag shows the state coat of arms on a dark blue field. Two female figures — Liberty on the left, Justice on the right — flank a central shield depicting the Hudson River with sailing ships and mountains. An eagle with a globe perches above the shield. A white ribbon below reads Excelsior."

  - question: "What does the New York state flag represent?"
    answer: "New York adopted its state flag in 1901 and updated it in 2020 to include E Pluribus Unum on the seal. The coat of arms the flag is based on dates even further back to 1778."

  - question: "What does New York's flag look like?"
    answer: "The flag shows a dark blue background with the state coat of arms at the center. Liberty stands on the left holding a liberty cap on a pole; Justice stands on the right, blindfolded, with scales and a sword at her feet. The shield between them depicts the Hudson River valley with ships and mountains. An eagle sits above, and the ribbon below reads Excelsior — Ever Upward."

  - question: "Who is credited with the design of New York's flag?"
    answer: "No single designer is credited. The coat of arms was adopted by New York in 1778 and served as the foundation for the flag. When the legislature formalized the flag in 1901, it drew on that existing coat of arms rather than commissioning a new design. The 2020 update, which added E Pluribus Unum to the seal, was a legislative revision rather than an individual design."

