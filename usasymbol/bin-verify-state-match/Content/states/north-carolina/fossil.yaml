- id: facts
  icon: fa-solid fa-lightbulb
  title: Shark Tooth Facts
  facts:
  - "North Carolina designated the megalodon shark tooth as its state fossil in 2013, following a campaign by North Carolina middle school students."
  - "Otodus megalodon teeth can exceed 7 inches in length — roughly three times the size of a great white shark's largest teeth."
  - "The Lee Creek Mine near Aurora has produced thousands of megalodon teeth from Miocene and Pliocene marine sediments."
  - "Megalodon had a cartilaginous skeleton that does not fossilize, so teeth are nearly the only direct evidence of the animal."
  - "Otodus megalodon went extinct about 3.6 million years ago, likely as ocean temperatures dropped and its whale prey shifted to colder waters."

