faq:
- question: What is North Carolina's state fossil?
  answer: "North Carolina's state fossil is the shark tooth of Otodus megalodon, the largest predatory shark in Earth's history, designated in 2013."
- question: When did North Carolina adopt its state fossil?
  answer: "North Carolina designated the megalodon shark tooth as its state fossil in 2013, after a campaign led by middle school students."
- question: What did the megalodon look like?
  answer: "Otodus megalodon is estimated to have reached up to 50 feet in length. Its teeth could exceed 7 inches. Almost nothing else survives in the fossil record — the skeleton was cartilage and did not preserve."
- question: Where are shark tooth fossils found in North Carolina?
  answer: "The best site is the Aurora Fossil Museum in Beaufort County, which has a public collecting area next to the Lee Creek Mine. Teeth also wash onto North Carolina beaches after storms, particularly along the Crystal Coast."
- question: When did the megalodon live?
  answer: "Otodus megalodon lived from about 23 million years ago through the Miocene and Pliocene epochs, going extinct about 3.6 million years ago."
- question: Who pushed to make it the state fossil?
  answer: "North Carolina middle school students petitioned the General Assembly for the designation. The legislature approved the megalodon shark tooth as the state fossil in 2013."

