sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: North Carolina State Sport
    paragraphs:
      - "North Carolina named stock car racing its official state sport in 2011, recognizing an industry rather than a pastime. Lawmakers pointed to the sport's economic weight in the state, citing motorsports' multibillion-dollar annual impact and a Charlotte region that houses the vast majority of NASCAR's top teams. No other sport carried that kind of economic argument into the legislature."

  - id: what-is
    icon: fa-solid fa-flag-checkered
    title: "Stock Car Racing in North Carolina"
    paragraphs:
      - "Drivers race modified production-style cars around oval tracks at speeds that can top 200 miles per hour, drafting off each other's cars to save fuel and setting up late passes for the lead. Pit crews service the cars in seconds during the race, changing tires and adding fuel while the driver waits. Races run for hundreds of laps, and a single mistake in traffic can end a driver's day against a wall."
      - "Hendrick Motorsports, based just outside Charlotte in Concord, has won more NASCAR Cup Series championships than any other team, with drivers Jimmie Johnson and Jeff Gordon combining for eleven of the organization's titles. Charlotte Motor Speedway hosts the Coca-Cola 600 every Memorial Day weekend, the longest race on the NASCAR Cup Series schedule."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Stock Car Racing Represents North Carolina
    paragraphs:
      - "Stock car racing grew out of Prohibition-era necessity in North Carolina's hills, where bootleggers modified ordinary cars to outrun revenue agents on mountain roads. Wilkes County native Junior Johnson learned to drive hauling his family's moonshine, and revenue agents never caught him on the road before he turned that skill into a NASCAR career. That path from bootlegging to racing gave North Carolina a claim to the sport's origin no marketing campaign could manufacture."
      - "Johnson won 50 races as a driver, then became a team owner who claimed six NASCAR championships with two different drivers. The NASCAR Hall of Fame opened in Charlotte in 2010, a year before lawmakers made the sport official, cementing the city's place as the sport's institutional home."
      - "That history built an entire industry around Charlotte. More than 90 percent of NASCAR Cup Series teams, including record-setting Hendrick Motorsports, are headquartered within a short drive of the city, and the legislature cited the sport's six-billion-dollar annual economic impact when it made the designation. Few states can point to a sport that employs as many of their own residents as stock car racing employs North Carolinians."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Stock Car Racing Became North Carolina's State Sport
    paragraphs:
      - "The push began with a group of elementary and middle school students in Iredell County who called themselves the Pit Crew. Students from Lake Norman Elementary and Mount Mourne IB School presented the idea to the Mooresville Board of Commissioners in February 2011, and the board voted to back the proposal in the General Assembly."
      - "Governor Bev Perdue signed the bill into law that June at Charlotte Motor Speedway, making stock car racing North Carolina's official state sport. The legislation cited the sport's economic weight in the state as justification and passed without a competing candidate."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Stock Car Racing Facts
    facts:
      - "North Carolina designated stock car racing its official state sport in 2011, a proposal pushed by students who called themselves the Pit Crew."
      - "Governor Bev Perdue signed the law at Charlotte Motor Speedway in June 2011."
      - "More than 90 percent of NASCAR Cup Series teams are headquartered in the Charlotte region."
      - "Wilkes County native Junior Johnson went from running moonshine to winning 50 NASCAR races and six championships as a team owner."
      - "The NASCAR Hall of Fame has been located in Charlotte since 2010."

