faq:
  - question: What is North Carolina's state sport?
    answer: "North Carolina's official state sport is stock car racing, adopted in 2011."
  - question: When did North Carolina adopt stock car racing as its state sport?
    answer: "North Carolina adopted stock car racing as its state sport in June 2011, when Governor Bev Perdue signed the bill at Charlotte Motor Speedway."
  - question: Why did North Carolina choose stock car racing?
    answer: "The Charlotte region is home to more than 90 percent of NASCAR's top teams and the NASCAR Hall of Fame. The sport also traces to North Carolina bootleggers like Junior Johnson, who turned moonshine-running skills into a racing career."
  - question: Who proposed making stock car racing North Carolina's state sport?
    answer: "A group of Iredell County students who called themselves the Pit Crew proposed the idea in 2011 and presented it to local officials before it reached the General Assembly."

