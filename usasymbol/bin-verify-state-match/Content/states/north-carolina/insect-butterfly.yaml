faq:
- question: What is North Carolina's state butterfly?
  answer: "North Carolina's state butterfly is the eastern tiger swallowtail, adopted by the North Carolina General Assembly in 2012."
- question: When did North Carolina adopt the eastern tiger swallowtail?
  answer: "North Carolina adopted the eastern tiger swallowtail as its official state butterfly in 2012."
- question: Why did North Carolina choose the eastern tiger swallowtail?
  answer: "The eastern tiger swallowtail is common across North Carolina and is a familiar, easily recognized butterfly in gardens and woodlands statewide."
- question: What does the eastern tiger swallowtail look like?
  answer: "It has yellow wings with black tiger stripes and a black border, a tail on each hindwing, and a wingspan of about 3 to 5.5 inches."
- question: Where is the eastern tiger swallowtail found in North Carolina?
  answer: "It is found statewide, from the mountains to the coast, especially near gardens, forest edges, and stream banks."
- question: Is the eastern tiger swallowtail the same as North Carolina's state insect?
  answer: "No. North Carolina's state insect is the European honey bee, adopted in 1973. The eastern tiger swallowtail is a separate designation, the state butterfly, adopted in 2012."

