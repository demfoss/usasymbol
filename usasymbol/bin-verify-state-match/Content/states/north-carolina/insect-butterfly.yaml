sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of North Carolina?
  paragraphs:
  - "The eastern tiger swallowtail, Papilio glaucus, is North Carolina's official state butterfly. The North Carolina General Assembly designated it in 2012."
  - "North Carolina also has a separate state insect, the European honey bee, adopted much earlier in 1973."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Eastern Tiger Swallowtail
  paragraphs:
  - "The eastern tiger swallowtail has yellow wings marked with black tiger stripes and a black border, with a slender tail extending from each hindwing."
  - "Adults have a wingspan of about 3 to 5.5 inches, making it one of the larger butterflies in North Carolina."
  - "Females can appear in a dark, nearly all-black form as well as the typical yellow-and-black pattern."

- id: history
  icon: fa-solid fa-landmark
  title: How North Carolina Chose the Eastern Tiger Swallowtail
  paragraphs:
  - "The North Carolina General Assembly designated the eastern tiger swallowtail as the official state butterfly in 2012."
  - "The eastern tiger swallowtail is common across North Carolina and is a familiar sight in gardens, woodlands, and along roadsides throughout the state."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Eastern Tiger Swallowtail in North Carolina
  paragraphs:
  - "The eastern tiger swallowtail is found statewide in North Carolina, from the mountains to the coast, especially near gardens, forest edges, and stream banks."

