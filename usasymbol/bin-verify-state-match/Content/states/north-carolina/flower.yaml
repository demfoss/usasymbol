seo_title: "North Carolina State Flower | Dogwood"
seo_description: "The Dogwood became North Carolina's state flower in 1941. These white or pink flowers bloom on dogwood trees across North Carolina each spring."

intro_text: "North Carolina chose the Dogwood as its state flower in 1941, making it a long-standing entry in the [list of U.S. state flowers](/symbols/flowers). These distinctive white or pink flowers bloom on dogwood trees throughout North Carolina. Four petal-like bracts surround tiny flowers creating spectacular displays across the state each spring."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of North Carolina"
    paragraphs:
      - "North Carolina recognizes the Dogwood as its state flower. Each bloom displays four white or pink bracts that look like petals. The bracts measure 2 to 4 inches across. Tiny greenish-yellow flowers cluster at the center. A small notch appears at the tip of each bract. Pink varieties show deeper color at the edges."
      - "Dogwood trees bloom from late March through May across North Carolina. Southern regions see earlier blooms than mountain areas. Peak flowering occurs in April throughout most of the state. The blooms last two to three weeks. Trees grow 15 to 30 feet tall. Oval leaves with prominent veins turn red or purple in fall. Bright red berries appear in autumn."
      - "Native dogwood trees grow wild in North Carolina forests and along woodland edges. The trees prefer partial shade under larger forest canopy. Moist well-drained soil suits dogwoods best. They thrive from coastal plains to mountain slopes. Dogwood blooms signal spring throughout North Carolina. The trees appear in every county across the state."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Dogwood"
    paragraphs:
      - "Known as Dogwood, this flower's scientific designation is Cornus florida. The species belongs to the Cornaceae family. This family includes about 85 species of dogwoods and related plants found primarily in temperate regions worldwide."
      - "The genus name Cornus comes from the Latin word for horn. It refers to the hard wood. The species name florida means flowering in Latin. Flowering dogwood serves as the complete common name. Some people call it American dogwood or Eastern dogwood to distinguish it from Asian species."
      - "The name dogwood comes from colonial times. Early settlers used the wood to make skewers called dags or dogs. Another theory suggests the name derives from dagwood, referring to the wood's use in making daggers. The hard dense wood served various purposes for Native Americans and colonists."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Dogwood Became the North Carolina State Flower"
    paragraphs:
      - "North Carolina made the Dogwood its official state flower in 1941. The state legislature voted for this designation following years of discussion. Garden clubs throughout North Carolina campaigned for the dogwood. The North Carolina Federation of Garden Clubs led the advocacy efforts, in a process similar to campaigns seen in the [list of U.S. state birds](/symbols/birds)."
      - "Dogwood trees grew abundantly in North Carolina forests. The spring blooms symbolized renewal and beauty. The trees thrived from mountains to coast. Native Americans used dogwood bark for medicinal purposes. Early settlers valued the hard wood for tools. The tree represented North Carolina's natural heritage and complemented [the state tree tradition](/states/north-carolina/tree/longleaf-pine)."
      - "Some legislators suggested azaleas or Carolina jessamine instead. Dogwood supporters emphasized the tree's statewide distribution. Every region of North Carolina featured dogwoods. The distinctive flowers were easily recognized. The legislature passed the designation on March 6, 1941. North Carolina joined other states honoring native trees as floral emblems, reinforcing themes seen on [the Tar Heel State page](/states/north-carolina/nickname/the-tar-heel-state)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "North Carolina State Flower Facts"
    facts:
      - "The showy white or pink parts are actually bracts, not true petals, with the real flowers being tiny greenish-yellow clusters in the center"
      - "Dogwood trees can live for 80 years or more, with some specimens in North Carolina forests dating back over a century"
      - "North Carolina adopted the Dogwood on March 6, 1941, following advocacy by the North Carolina Federation of Garden Clubs"
      - "Native Americans used dogwood bark to treat fevers and pain, with the bark containing compounds similar to quinine"
      - "The hard dense wood was historically used to make golf club heads, mallets, and weaving shuttles due to its shock-resistant properties"
      - "Dogwood berries provide important food for over 35 species of birds including cardinals, robins, and cedar waxwings in fall and winter"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "North Carolina State Flower and Bird"
    paragraphs:
      - "The Northern Cardinal serves as North Carolina's state bird, a brilliant red songbird common in woodlands and gardens year-round. Both symbols represent North Carolina officially. North Carolina adopted the Dogwood in 1941 and designated the Northern Cardinal as state bird in 1943; compare with [the cardinal profile](/states/north-carolina/bird/northern-cardinal)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Dogwood Symbolizes"
    paragraphs:
      - "The Dogwood is often associated with rebirth and resurrection in Christian symbolism. The flower has been linked to durability and strength due to the wood's hardness. Its spring blooms traditionally symbolize new beginnings and hope while carrying connotations of North Carolina's natural beauty and Appalachian heritage, values that fit [North Carolina's state motto](/states/north-carolina/motto/esse-quam-videri)."

faq:
  - question: "What is North Carolina's state flower?"
    answer: "North Carolina's state flower is the Dogwood, a tree with distinctive white or pink flowers that bloom across the state each spring."
  
  - question: "When did North Carolina adopt the Dogwood as its state flower?"
    answer: "North Carolina adopted the Dogwood on March 6, 1941. The North Carolina Federation of Garden Clubs led the advocacy campaign for this designation."
  
  - question: "Why did North Carolina choose the Dogwood?"
    answer: "North Carolina chose the Dogwood because the trees grew abundantly throughout the state from mountains to coast. The spring blooms symbolized renewal and beauty. Native Americans and early settlers valued the tree for medicine and hard wood. Every region of North Carolina featured dogwoods, making it representative of the entire state."
  
  - question: "Are dogwood flowers really flowers?"
    answer: "The showy white or pink parts are actually bracts, not true petals. The real flowers are tiny greenish-yellow clusters in the center. The bracts serve to attract pollinators to the small flowers."
  
  - question: "When do dogwoods bloom in North Carolina?"
    answer: "Dogwood trees bloom from late March through May in North Carolina, with peak flowering occurring in April. Southern regions see earlier blooms than mountain areas, and the blooms typically last two to three weeks."

