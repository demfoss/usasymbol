title: "North Carolina State Dog | Plott Hound"
scientific_name: "Canis lupus familiaris"
adopted_year: 1989

seo_title: "North Carolina State Dog | Plott Hound"
seo_description: "North Carolina's state dog is the Plott Hound, adopted in 1989. Learn why this official North Carolina symbol was chosen and what it represents."

intro_text: "The Plott Hound is the official North Carolina state dog, designated in 1989. This page gives the direct answer for searches like 'north carolina state dog', 'north carolina state animal', and 'north carolina state mammal' while explaining how the symbol fits the state's official animal designations. Only dog breed developed in North Carolina; legendary bear and wild boar hunting ability; symbol of Appalachian mountain culture. This profile appears in the [list of U.S. state mammals](/symbols/mammals)."

common_name: "Plott Hound"
official_since: "1989"
status: "Recognized breed; only dog breed native to North Carolina; one of four American Kennel Club hound breeds developed in United States"
habitat_in_state: "Originally mountain counties of western North Carolina; now found throughout state as hunting and companion dogs"
known_for: "Only dog breed developed in North Carolina; legendary bear and wild boar hunting ability; symbol of Appalachian mountain culture"

size: "Males: 20 to 25 inches at shoulder; Females: 20 to 23 inches at shoulder"
weight: "Males: 50 to 60 pounds; Females: 40 to 55 pounds"
coloration: "Brindle coat in various shades from yellow to red to chocolate with black overlay; some solid black individuals; occasional white chest markings"
distinctive_traits: "Distinctive brindle pattern unique among American hounds; powerful build for mountain terrain; deep chest for stamina; melodious voice when trailing game"

habitat: "Mountain terrain of western North Carolina; adaptable to various climates and elevations"
range_in_state: "Originated in Haywood County mountains near Canton; breed now distributed throughout North Carolina and beyond"
conservation_status: "Stable breed population; American Kennel Club recognized since 2006; maintained by dedicated breeders preserving working and show lines"
where_to_find: "Private hunting kennels throughout mountain counties; occasionally at dog shows; working Plott packs still hunt in Great Smoky Mountains region"
symbol_connections: "Named for Plott family of Haywood County; represents German immigration heritage; connects to mountain culture alongside Cherokee symbols and mountain music traditions"

sections:
  - id: "official-designation"
    icon: "fa-landmark"
    title: "Official Designation"
    style: "default"
    paragraphs:
      - "The North Carolina General Assembly designated the Plott hound as the official state dog on August 12, 1989, through Session Law 1989-1002. The designation recognized this breed as the only dog developed entirely in North Carolina and honored the mountain families who preserved it, reinforcing [the Tar Heel State heritage](/states/north-carolina/nickname/the-tar-heel-state)."
      - "The legislation came after decades of advocacy by Plott hound enthusiasts who wanted formal recognition for North Carolina's unique contribution to American dog breeding. Bob Plott, descendant of the founding family, worked with legislators to secure the designation in the same civic tradition reflected by [North Carolina's motto](/states/north-carolina/motto/esse-quam-videri)."
    
    subsections:
      - subtitle: "How It Became Symbol"
        text: "The campaign for state dog recognition began in the 1980s when Plott hound breeders and mountain heritage advocates approached the General Assembly. They argued that North Carolina deserved to honor its only native dog breed, especially one with such deep roots in mountain culture and history. The breed had gained national attention through hunting competitions and dog shows, yet remained relatively unknown in North Carolina itself. Bob Plott of Waynesville, a descendant of the breed's founder, testified before legislative committees about the breed's unique history and importance to Appalachian heritage. The General Assembly passed the designation with bipartisan support, recognizing that the Plott hound told an authentic North Carolina story spanning over two centuries."
      
      - subtitle: "Why Chosen"
        text: "Legislators selected the Plott hound because it represents authentic North Carolina heritage developed in the state's mountain regions. Unlike many state symbols chosen for their abundance or visibility, the Plott hound earned designation through historical uniqueness—this breed exists nowhere else. The dog reflects qualities North Carolinians admired: courage to face dangerous game, loyalty to family and pack, stamina for demanding work, and voice to signal success. The German immigrant origin story resonated with North Carolina's diverse cultural heritage. The designation also honored working-class mountain communities whose hunting traditions sustained families for generations. By choosing the Plott hound, North Carolina celebrated its mountain culture and immigrant contributions to state identity."

  - id: "state-symbolism"
    icon: "fa-mountain"
    title: "What the Plott Hound Represents"
    style: "highlight"
    paragraphs:
      - "The Plott hound symbolizes North Carolina's Appalachian mountain heritage and the self-sufficient culture that developed in isolated mountain communities. These dogs represent courage in facing challenges, whether pursuing dangerous bears through rugged terrain or protecting family homesteads."
      - "The breed records immigrant contributions to North Carolina culture. Johannes Plott brought his German hunting dogs to the Carolina mountains in 1750, creating an American breed that merged European tradition with frontier necessity."
      - "The designation in 1989 recognized that mountain culture deserved equal standing with Piedmont and coastal traditions in North Carolina's official symbols. Western North Carolina had often felt overlooked in state politics and culture, making the Plott hound designation meaningful for mountain communities."
    
    subsections:
      - subtitle: "Johannes Plott and German Immigration"
        text: "The Plott hound story begins in 1750 when Johannes Georg Plott left Germany for the American colonies. German hunters had developed bear-hunting hounds over centuries, breeding for specific traits including cold-trailing ability, courage, and voice. Plott brought five of these hounds when he immigrated, landing in Philadelphia before making his way to western North Carolina. He settled in what would become Haywood County, in the rugged mountains near present-day Canton. The region offered abundant black bear populations and terrain similar to German mountain forests. Plott bred his dogs selectively, maintaining the German hunting traits while adapting to American game and conditions. He kept his breeding program closed, refusing to cross with other settlers' dogs, which preserved the unique bloodline."
      
      - subtitle: "Seven Generations of Mountain Breeding"
        text: "For seven generations spanning over 200 years, the Plott family maintained their hound breeding program in North Carolina's mountains. Johannes Plott's son Henry inherited the dogs and continued selective breeding, focusing on courage, stamina, and tracking ability. Each generation faced temptation to crossbreed with other hunting dogs brought by settlers, yet the family maintained breed purity with rare exceptions. In the 1940s, the first G. P. Ferguson crossed a Plott female with a proven leopard bear dog, introducing fresh genetics while preserving core traits. This single outcross represents the only documented deviation from pure Plott breeding in 200 years. The family's dedication created a distinctive American breed that retained German hunting dog characteristics adapted specifically to Southern Appalachian conditions."
      
      - subtitle: "Bear Hunting in Appalachia"
        text: "The Plott hound's development centered on hunting black bears in the Great Smoky Mountains and surrounding ranges. These mountains held substantial bear populations that provided meat, fat, and hides for mountain families. Hunting bears with dogs required specific traits—the courage to face an animal that could kill dogs, the stamina to pursue bears through steep terrain for hours, and the voice to signal hunters following on foot. Plott hounds earned legendary reputation for these qualities. They would trail cold scent for miles, pursue bears up mountainsides, and bay the bear until hunters arrived. Mountain families depended on successful hunts for winter provisions, making reliable hunting dogs essential rather than recreational. This practical necessity drove the Plott family's breeding decisions for generations."
      
      - subtitle: "Recognition Beyond North Carolina"
        text: "The Plott hound remained largely unknown outside mountain counties until the mid-1900s. Mountain families guarded their Plott dogs carefully, selling or giving puppies only to trusted hunters who would maintain working ability. This isolation preserved breed purity but limited recognition. Change came in 1946 when the United Kennel Club recognized the Plott hound as a distinct breed, giving it official standing in the dog world. The American Kennel Club delayed recognition until 2006, making the Plott hound one of the most recently recognized AKC breeds. National recognition validated what mountain hunters had known for 200 years—that North Carolina had developed a world-class hunting breed. The Plott hound now competes successfully in conformation shows while maintaining working ability in field trials."
      
      - subtitle: "Mountain Culture and Identity"
        text: "The Plott hound designation addressed a long-standing imbalance in North Carolina's official symbols. Most state symbols reflected Piedmont and coastal regions—the longleaf pine from southeastern forests, the cardinal common throughout the state, the gray squirrel abundant everywhere. Western North Carolina's distinct mountain culture lacked representation in official symbols despite its importance to state identity. Mountain communities developed unique traditions including bluegrass music, craft heritage, and subsistence practices different from other regions. The Plott hound authentically represented this mountain culture, developed in the mountains by mountain people for mountain conditions. The 1989 designation acknowledged that North Carolina's mountain heritage deserved equal honor with other regional traditions."

  - id: "identification"
    icon: "fa-dog"
    title: "How to Identify Plott Hounds"
    style: "default"
    
    subsections:
      - subtitle: "Physical Description"
        text: "Plott hounds display powerful, athletic builds designed for mountain hunting. They possess exceptional stamina, speed, and agility required to pursue game through steep, rugged terrain for extended periods."
        list_items:
          - "**Size**: Males 20-25 inches at shoulder, females 20-23 inches; medium to large frame with substantial bone structure"
          - "**Weight**: Males 50-60 pounds, females 40-55 pounds; lean and muscular without excess weight that would impede endurance"
          - "**Appearance**: Distinctive brindle coat in shades from yellow through red to chocolate with black striping; some solid black individuals; occasional white chest markings; smooth, fine coat lies close to body"
          - "**Features**: Broad head with moderate stop; long, pendulous ears reaching near nose tip when extended; deep chest for lung capacity; well-muscled hindquarters for power climbing mountains; feet with thick pads for rough terrain"
      
      - subtitle: "Temperament and Behavior"
        text: "Plott hounds demonstrate intense focus when hunting combined with gentle, loyal nature as family companions. They bond strongly with their owners while maintaining independence needed for solo trailing work. The breed shows remarkable courage facing dangerous game like bears and wild boars. Plotts possess strong pack drive, working cooperatively with other dogs when hunting. They require regular exercise and mental stimulation, thriving when given jobs to perform. The breed's hunting instinct remains powerful even in dogs raised as companions rather than working hunters. Early socialization helps channel these instincts appropriately. Plotts typically show friendliness toward people while maintaining natural wariness toward strangers on their property."
      
      - subtitle: "The Distinctive Voice"
        text: "Plott hounds possess melodious, resonant voices that hunters prize for signaling game location and behavior. The breed produces distinct vocalizations for different hunting situations—a steady bay when trailing scent, a faster, more urgent bay when closing on game, and a unique tree bark when bears climb to escape. Mountain hunters developed ability to recognize individual dogs' voices at great distances through dense forest. This vocal ability served practical purposes in rugged terrain where visual contact between hunters and dogs proved impossible. Modern Plott owners discover that these vocal traits persist even in non-hunting contexts. The dogs often vocalize when excited, playing, or alerting to unusual activity. Training helps manage excessive barking while preserving the voice that defines the breed."

  - id: "in-the-state"
    icon: "fa-location-dot"
    title: "Plott Hounds in North Carolina"
    style: "default"
    paragraphs:
      - "The Plott hound originated in Haywood County's mountains near Canton, where Johannes Plott settled in 1750. The breed developed entirely within North Carolina's mountain counties, making it the state's only native dog breed."
      - "Modern Plott hounds live throughout North Carolina as hunting dogs, show dogs, and family companions. The breed maintains strongest presence in mountain counties where hunting traditions continue, though urban areas increasingly include Plotts as companion animals."
    
    facts:
      - "**Origin Location**: Haywood County mountains near Canton; developed in Great Smoky Mountains region and adjacent ranges"
      - "**Current Distribution**: Throughout North Carolina and nationwide; working Plott packs still hunt in western mountain counties; increasing urban populations as companion dogs"
      - "**Population**: Estimated several thousand Plotts in North Carolina; exact numbers unavailable as many working dogs remain unregistered; AKC registered Plotts number in thousands nationwide"
      - "**Uses Today**: Bear and wild boar hunting in mountain regions; competitive hunts and field trials; conformation dog shows; search and rescue work; family companions with active lifestyles"

  - id: "where-to-see"
    icon: "fa-binoculars"
    title: "Where to See Plott Hounds"
    style: "default"
    paragraphs:
      - "Observing Plott hounds requires connecting with hunting communities or attending dog shows. Unlike wildlife symbols visible in parks, state dogs remain primarily with private owners in working and companion roles."
    
    list_items:
      - "**Haywood County Heritage**: Canton area near original Plott family homestead; historical markers acknowledge breed's origins; local residents maintain pride in breed heritage"
      - "**American Kennel Club Dog Shows**: Plotts compete in hound group at shows throughout North Carolina; owners often willing to discuss breed history with interested spectators"
      - "**United Kennel Club Events**: Coonhound and bear dog competitions in mountain counties feature working Plotts; night hunts and field trials showcase breed's hunting abilities"
      - "**Great Smoky Mountains Region**: Working Plott packs occasionally encountered during bear season in national forests and state game lands; hunters use these dogs in traditional mountain hunts"
      - "**Breed Clubs and Events**: Plott Hound Breed Association organizes gatherings where owners share knowledge; annual events celebrate breed heritage"
      - "**Private Kennels**: Many mountain county kennels maintain Plott breeding programs; some breeders welcome visitors by appointment to view working and show lines"

  - id: "current-status"
    icon: "fa-chart-line"
    title: "Breed Status and Preservation"
    style: "default"
    paragraphs:
      - "The Plott hound maintains stable population as a recognized American breed. The American Kennel Club granted full recognition in 2006, placing Plotts in the hound group alongside other scenthound breeds."
      - "Breed preservation efforts balance maintaining working hunting ability with conforming to show standards. Some breeders focus on producing competitive show dogs while others prioritize field performance in actual hunting conditions."
    
    subsections:
      - subtitle: "Breed Preservation Challenges"
        text: "The Plott hound faces challenges common to working breeds gaining show recognition. Kennel club standards establish ideal physical characteristics that sometimes conflict with traits needed for hunting performance. Show breeding may emphasize appearance over working ability, potentially weakening the hunting instincts and stamina that define the breed. Conversely, working kennels maintaining pure hunting lines may produce dogs that don't conform to show standards. Some breeders attempt dual-purpose programs producing Plotts competitive in both arenas. The breed's relatively small population compared to popular hounds makes genetic diversity important. Responsible breeders use genetic testing to avoid hereditary health problems while preserving working traits. Organizations like the Plott Hound Breed Association work to maintain breed standards that honor both heritage and modern purposes."
      
      - subtitle: "Modern Roles Beyond Hunting"
        text: "Plott hounds increasingly serve in non-hunting roles throughout North Carolina and beyond. Their intelligence, stamina, and trainability make them suitable for various working applications. Search and rescue organizations employ Plotts for wilderness tracking, using the breed's scenting ability and rugged build for mountain rescue operations. Law enforcement occasionally uses Plotts for tracking and detection work. Therapy dog programs include well-socialized Plotts who demonstrate the breed's gentle nature with people. Family companions represent the fastest-growing segment of Plott ownership. Many urban and suburban North Carolinians choose Plotts for their loyalty and moderate size. These companion Plotts require substantial exercise and mental stimulation to channel hunting drive appropriately. Training classes help owners manage the breed's natural intensity and independence."
      
      - subtitle: "Educational Significance"
        text: "North Carolina educational programs use the Plott hound to teach state history, genetics, and cultural heritage. Elementary schools studying state symbols learn how selective breeding creates distinct dog breeds. High school biology classes examine Plott hound genetics as examples of inheritance patterns and breed development. History curricula incorporate the Plott family story into lessons about German immigration and mountain settlement. The breed illustrates how isolated communities developed unique cultural traditions including distinct dog types. Museums in western North Carolina feature Plott hound exhibits connecting the breed to broader Appalachian heritage. These educational uses transform the state dog from mere symbol into teaching tool about North Carolina's past and the science of animal breeding."

  - id: "symbol-connections"
    icon: "fa-link"
    title: "Connections to Other State Symbols"
    style: "default"
    paragraphs:
      - "The Plott hound connects to other North Carolina symbols through shared mountain heritage and historical context. While the gray squirrel (state mammal) and cardinal (state bird) represent wildlife found throughout North Carolina, the Plott hound specifically honors western mountain culture; compare [the Northern Cardinal profile](/states/north-carolina/bird/northern-cardinal)."
      - "The designation joined a growing collection of North Carolina symbols adopted during the 1980s and 1990s as the state expanded its official emblems. The Plott hound complemented earlier symbols by representing a region and culture previously underrepresented in state symbolism, including forests linked to [North Carolina's state tree](/states/north-carolina/tree/longleaf-pine)."
    
    subsections:
      - subtitle: "Mountain Geography and Culture"
        text: "The Plott hound's development in the Great Smoky Mountains creates direct connection to North Carolina's mountain geography. These mountains provided the black bears that drove breed development and the rugged terrain that shaped physical traits. The Great Smoky Mountains also influence numerous other North Carolina cultural traditions including bluegrass music, craft heritage, and Cherokee culture. The Plott hound represents non-indigenous mountain heritage just as other symbols represent Cherokee contributions. Mountain communities developed distinct identity partly through isolation—the same isolation that kept Plott hound breeding concentrated in mountain counties for generations. This geographic isolation preserved both cultural traditions and breed purity."
        
      - subtitle: "American Black Bear Connection"
        text: "The Plott hound's primary purpose—hunting black bears—creates symbolic connection to Alabama's state mammal and Louisiana's state mammal, both American black bears. While those states honor the bear itself, North Carolina honors the dog bred to hunt it. This relationship illustrates different approaches to valuing wildlife and human-wildlife interactions. The black bear once ranged throughout North Carolina's mountains in larger numbers than today. Plott hounds helped mountain families harvest bears for food and protection. Modern bear hunting regulations restrict seasons and methods, yet Plotts still pursue bears legally in designated areas. Some North Carolina conservation groups study whether traditional hunting practices including hound pursuit affect bear populations and behavior differently than other hunting methods."
        link:
          label: "See gray squirrel (state mammal)"
          url: "/states/north-carolina/mammal/gray-squirrel"
      
      - subtitle: "Immigration and Diversity"
        text: "The Plott hound story highlights North Carolina's immigrant heritage. Johannes Plott represented one German family among thousands who came to Carolina seeking land and opportunity. German immigrants settled throughout North Carolina's Piedmont and mountain regions, bringing agricultural techniques, craft traditions, and cultural practices. The Plott family's dog breeding represents cultural transplantation—bringing European tradition and adapting it to American conditions. This immigrant contribution to state identity parallels other symbols representing diverse heritage. The state toast uses scuppernong wine developed by early French settlers. Various symbols honor Cherokee indigenous heritage. The Plott hound adds German-American achievement to this diverse symbol collection, demonstrating that state identity emerges from multiple cultural sources."
      
      - subtitle: "Working Dog Heritage"
        text: "North Carolina's agricultural and rural heritage included numerous working dog types beyond Plotts. Farmers kept herding dogs for moving livestock, rat terriers for pest control, and various curs for hunting and protection. These working dogs served practical purposes in agrarian economy where animals earned their keep through useful labor. The Plott hound designation honors this working dog tradition while recognizing that one breed achieved development distinctive enough to represent the state. Unlike companion breeds created primarily for appearance or temperament, working breeds like Plotts maintain focus on job performance. This utilitarian breeding philosophy reflects mountain values of practicality and self-sufficiency. The Plott hound thus symbolizes not just one breed but the broader tradition of working dogs in North Carolina culture."

