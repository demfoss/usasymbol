faq:
  - question: "What is North Carolina's state dog?"
    answer: "North Carolina's state dog is the Plott hound, designated on August 12, 1989. The Plott hound is the only dog breed developed entirely in North Carolina, created by the German immigrant Plott family over seven generations in the mountain counties of western North Carolina."
  
  - question: "When was the Plott hound designated as North Carolina's state dog?"
    answer: "The Plott hound became North Carolina's official state dog in 1989 through Session Law 1989-1002. The designation recognized this breed as North Carolina's unique contribution to American dog breeding and honored the mountain families who preserved it for over 200 years."
  
  - question: "Why did North Carolina choose the Plott hound as its state dog?"
    answer: "North Carolina chose the Plott hound because it is the only dog breed developed entirely within the state. The breed represents North Carolina's Appalachian mountain heritage, German immigrant contributions, and the self-sufficient hunting culture of mountain communities. The Plott family maintained this breed for seven generations starting in 1750, creating a distinctive American hunting dog adapted specifically to North Carolina's mountains."
  
  - question: "Where did the Plott hound originate?"
    answer: "The Plott hound originated in Haywood County in western North Carolina, near present-day Canton. Johannes Plott brought five German bear-hunting dogs to North Carolina in 1750 and settled in the mountains. His family bred these dogs selectively for over 200 years, maintaining breed purity while adapting to Southern Appalachian hunting conditions. The breed developed entirely within North Carolina's mountain counties."
  
  - question: "What were Plott hounds bred to hunt?"
    answer: "Plott hounds were bred primarily to hunt black bears in the Great Smoky Mountains and surrounding ranges. The breed possesses courage to face dangerous game, stamina to pursue bears through steep mountain terrain for hours, and a distinctive voice to signal hunters. Mountain families depended on successful bear hunts for meat, fat, and hides. Modern Plotts also hunt wild boars and compete in coonhound trials."
  
  - question: "Is the Plott hound recognized by major kennel clubs?"
    answer: "Yes, the Plott hound is recognized by both major American kennel clubs. The United Kennel Club granted recognition in 1946. The American Kennel Club granted full recognition in 2006, making the Plott hound one of the most recently recognized AKC breeds. Plotts compete in the hound group at dog shows nationwide."
  
  - question: "Can I own a Plott hound as a pet?"
    answer: "Yes, Plott hounds make loyal family companions for active owners who can provide adequate exercise and mental stimulation. The breed requires substantial daily activity to channel its hunting drive appropriately. Plotts bond strongly with families while maintaining independence. Early socialization and training help manage the breed's intensity and vocal nature. The breed suits owners with active lifestyles who appreciate working dog heritage."
  
  - question: "How is the Plott hound different from other coonhounds?"
    answer: "The Plott hound differs from other coonhounds in several key ways. First, Plott hounds descend from German stock rather than English or French hounds like most American coonhounds. Second, Plotts were bred primarily for bear hunting rather than raccoons, though they excel at both. Third, the distinctive brindle coat is unique among American hounds. Fourth, the breed developed in isolation for 200 years without crossbreeding with other hound types (except one documented outcross), creating distinct genetics."
  
  - question: "Where can I see Plott hounds in North Carolina?"
    answer: "You can see Plott hounds at American Kennel Club and United Kennel Club dog shows throughout North Carolina. The Haywood County area near Canton, where the breed originated, maintains pride in Plott heritage. Working Plott packs still hunt in mountain counties during legal bear seasons. Private breeders throughout western North Carolina maintain Plott kennels, and some welcome visitors by appointment. The breed also appears at field trials and hunting competitions."

