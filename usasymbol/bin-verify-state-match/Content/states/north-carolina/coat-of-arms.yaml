type: State Coat of Arms
state: North Carolina
name: North Carolina State Coat of Arms
adopted_year: 1776
is_official: true
meaning: "The North Carolina coat of arms makes an argument that most state designs do not: it records specific dates. Liberty and Plenty flank a scene with a ship and mountains, but what drives the composition are two moments written directly onto the design. May 20, 1775, is North Carolina's disputed claim to have declared independence before anyone else. April 12, 1776, is its verified claim to have been the first colony to officially authorize a vote for independence. The motto Esse Quam Videri, meaning To be rather than to seem, sits below the design."
meaning_title: Meaning of the North Carolina Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'North Carolina Coat of Arms: Meaning, Symbols and History'
seo_description: "The North Carolina coat of arms was adopted in 1776 and shows Liberty and Plenty with two revolutionary dates: May 20, 1775, and April 12, 1776."
hero_image: /images/coats-of-arms/north-carolina/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of North Carolina, showing Liberty on the left with a Phrygian cap, Plenty on the right with a cornucopia, and two dates marking North Carolina's revolutionary history
hero_image_caption: "The North Carolina Coat of Arms, adopted 1776, standardized 1971. Liberty stands at left with a Phrygian cap on a pole. Plenty stands at right with a cornucopia. Two dates appear on the design: May 20, 1775, and April 12, 1776. The motto Esse Quam Videri curves along the base."
intro_text: "The North Carolina coat of arms, adopted in 1776, is built around two specific dates: May 20, 1775, and April 12, 1776, both marking moments when North Carolina claims to have moved first toward American independence. Liberty and Plenty flank the design, and the motto Esse Quam Videri, meaning To be rather than to seem, runs along the base."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the North Carolina Coat of Arms?
  paragraphs:
  - "The coat of arms places two allegorical figures on either side of a central scene. Behind them, a sailing ship and distant mountains represent North Carolina's geography from the Atlantic coast to the Appalachian highlands. The two dates embedded in the design are what set it apart from every other state coat of arms in the country."
  - "The coat of arms and the state seal share the same composition. The state seal adds a circular legend reading THE GREAT SEAL OF THE STATE OF NORTH CAROLINA around the outside. The coat of arms appears without that border in contexts where only the heraldic design is needed."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the North Carolina Coat of Arms
  paragraphs:
  - "North Carolina adopted its coat of arms in 1776, the same year the colony organized itself as an independent state during the Revolutionary War. The design embedded two dates that were central to how North Carolinians understood their own role in the founding of the United States."
  - "The first date, May 20, 1775, refers to the Mecklenburg Declaration of Independence. Citizens of Mecklenburg County near present-day Charlotte allegedly signed a local independence declaration a full year before the national Declaration of Independence. If authentic, it would make North Carolina the first place in America to formally break with Britain."
  - "The second date, April 12, 1776, is not in dispute. On that day, North Carolina's Provincial Congress met in Halifax and passed the Halifax Resolves, formally instructing the state's delegates to the Continental Congress to vote for independence. It was the first official action by any colony to take that step. North Carolina's claim on this date is fully documented in surviving historical records."
  - "The motto Esse Quam Videri, meaning To be rather than to seem, was formally adopted by the General Assembly and signed into law by Governor Elias Carr on February 21, 1893. Judge Walter Clark of the North Carolina Supreme Court selected the phrase from Cicero's De Amicitia, written in 44 BC. Clark had Senator Jacob Battle of Nash County introduce the bill."
  - "The current standardized version of the coat of arms was adopted in 1971 under N.C. Gen. Stat. § 147-26. The 1971 revision updated proportions and rendering for modern official use while leaving the composition unchanged."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the North Carolina Coat of Arms
  paragraphs:
  - "The North Carolina coat of arms uses two allegorical figures, a landscape scene, two historical dates, and a Latin motto. Each element was placed to make a specific claim about North Carolina's history and character."
  elements:
  - id: liberty
    name: Liberty
    image: /images/coats-of-arms/north-carolina/elements/liberty.webp
    paragraphs:
    - "Liberty stands on the left side of the design, holding a pole topped with a Phrygian cap. The Phrygian cap was worn by freed slaves in ancient Rome and became the standard symbol of liberation in 18th-century revolutionary culture, appearing on other state seals, on early American coins, and throughout French Revolutionary imagery."
    - "In Liberty's other hand is a document representing constitutional government. Her presence on the left grounds the design in the same political philosophy that drove the American Revolution: that freedom from tyranny was a legitimate foundation for a new state."
  - id: plenty
    name: Plenty
    image: /images/coats-of-arms/north-carolina/elements/plenty.webp
    paragraphs:
    - "Plenty stands on the right side of the design, holding a cornucopia from which grain and produce spill. She represents the agricultural wealth of North Carolina, which was one of the most productive farming colonies in the period before independence."
    - "North Carolina's colonial economy ran on tobacco, grain, and naval stores: tar, pitch, and turpentine harvested from the longleaf pine forests. Plenty's cornucopia reflects that agricultural economy specifically, not a generic statement of wealth. The choice of Plenty rather than Justice as the second figure sets North Carolina's design apart from most other state coats of arms."
  - id: dates
    name: May 20, 1775 and April 12, 1776
    image: /images/coats-of-arms/north-carolina/elements/dates.webp
    paragraphs:
    - "May 20, 1775, refers to the Mecklenburg Declaration of Independence, when citizens of Mecklenburg County allegedly signed a declaration breaking from Britain a full year before the national Declaration. The original document has never been found; the text published in 1819 was reconstructed from memory after the alleged original was destroyed in a fire. Historians have disputed its authenticity since the nineteenth century."
    - "April 12, 1776, refers to the Halifax Resolves. On that day, North Carolina's Provincial Congress in Halifax became the first official colonial body to formally instruct its delegates to vote for independence from Britain. The Halifax Resolves survive in their original form and are fully documented. North Carolina's claim to this date is not in dispute, and April 12 also appears on the North Carolina state quarter."
  - id: ship-mountains
    name: Ship and Mountains
    image: /images/coats-of-arms/north-carolina/elements/ship-mountains.webp
    paragraphs:
    - "A sailing ship appears in the background of the design, representing North Carolina's maritime commerce. The state's ports at Wilmington and New Bern were active trade hubs throughout the colonial era. Naval stores, tar, pitch, and turpentine from the longleaf pine forests, were North Carolina's most valuable export to Britain."
    - "Mountains rise in the background on the other side, representing the Blue Ridge and Appalachian ranges in western North Carolina. Together, the ship and mountains span the full geography of the state, from the Atlantic coast to the inland highlands."
  - id: motto
    name: Esse Quam Videri
    image: /images/coats-of-arms/north-carolina/elements/motto.webp
    paragraphs:
    - "The motto Esse Quam Videri curves along the bottom edge of the coat of arms. It is Latin for To be rather than to seem. The phrase comes from Cicero's De Amicitia, written in 44 BC as a dialogue on the nature of genuine virtue and true friendship."
    - "Judge Walter Clark selected the phrase in 1893 and had the General Assembly formally enact it as the official state motto. Governor Elias Carr signed the bill on February 21, 1893, making North Carolina the last of the original thirteen states to formally adopt a motto, 104 years after statehood."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the North Carolina Coat of Arms
  paragraphs:
  - "Most state coats of arms use allegory: abstract figures that stand for ideas. North Carolina's design does something more specific: it records two actual calendar dates and dares anyone to check them. The Halifax Resolves on April 12, 1776, hold up; the Mecklenburg Declaration on May 20, 1775, has been challenged for two centuries."
  - "The choice of Plenty rather than Justice as the second figure was not accidental. In 1776, North Carolina's founders were making an argument about what the new state offered: agricultural abundance alongside political liberty. Justice, with scales and a sword, would have framed the new government in legalistic terms. Plenty, with a cornucopia, framed it in terms of what the land could produce."
  - "The motto Esse Quam Videri, placed below all of this, is a statement about authenticity. It was formally chosen in 1893, more than a century after the coat of arms was first adopted. By then, the state had been through the Civil War and Reconstruction, and a judge who had fought as a Confederate teenager and spent his career on the bench selected a Cicero phrase about the gap between performance and reality. The choice was fitting for a coat of arms that already carried one verified date and one disputed one."

- id: facts
  icon: fa-solid fa-lightbulb
  title: North Carolina Coat of Arms Facts
  facts:
  - "Adopted in 1776, the same year North Carolina organized as an independent state during the Revolutionary War."
  - "April 12, 1776, the Halifax Resolves, is fully documented: North Carolina was the first colony to officially instruct its delegates to vote for independence. The date also appears on the North Carolina state quarter."
  - "May 20, 1775, the Mecklenburg Declaration, is disputed. The original document has never been found; the text was published in 1819 from memory after a fire allegedly destroyed the original."
  - "The motto Esse Quam Videri was formally adopted on February 21, 1893, when Governor Elias Carr signed the bill introduced by Senator Jacob Battle of Nash County. Judge Walter Clark of the NC Supreme Court chose the phrase from Cicero's De Amicitia (44 BC)."
  - "The current standardized design was adopted in 1971 under N.C. Gen. Stat. § 147-26, updating proportions for modern official use while keeping the 1776 composition."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the North Carolina Coat of Arms
  paragraphs:
  - "The core composition of the North Carolina coat of arms has remained unchanged since 1776. Liberty, Plenty, the two dates, the coastal ship, the inland mountains, and the motto all remained part of the design through later renderings."
  - "What changed over time was mostly artistic treatment. Historical illustrations show older ornamental framing and engraving style, while the modern standardized form adopted in 1971 regularized the composition for official state use."

