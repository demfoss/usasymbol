  answer: "North Dakota's state insect is the convergent lady beetle, adopted by the North Dakota Legislative Assembly in 2011."
- question: When did North Dakota adopt the convergent lady beetle?
  answer: "North Dakota adopted the convergent lady beetle as its official state insect in 2011."
- question: Why did North Dakota choose the convergent lady beetle?
  answer: "Lawmakers recognized the convergent lady beetle for its role controlling aphids and other pests on North Dakota crops."
- question: What does North Dakota's state insect look like?
  answer: "It is a small, round, orange or red beetle with black spots and two white lines behind its head that angle toward each other."
- question: Where can you find the convergent lady beetle in North Dakota?
  answer: "It is common in fields, gardens, and farmland across North Dakota, wherever aphids and other small insects are found."

