sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of North Dakota?
  paragraphs:
  - "The convergent lady beetle, Hippodamia convergens, is North Dakota's official state insect. The North Dakota Legislative Assembly designated it in 2011."
  - "It is one of the most common ladybug species found across North Dakota farms and gardens."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Convergent Lady Beetle
  paragraphs:
  - "The convergent lady beetle is a small, round, domed beetle with an orange or red shell marked by black spots, though the number of spots can vary between individuals."
  - "It gets its name from two short white lines behind its head that angle toward each other, or converge."
  - "Like other ladybugs, it feeds on aphids and other small, soft-bodied insects, making it useful to farmers and gardeners."

- id: history
  icon: fa-solid fa-landmark
  title: How North Dakota Chose the Convergent Lady Beetle
  paragraphs:
  - "The North Dakota Legislative Assembly named the convergent lady beetle the official state insect in 2011."
  - "Lawmakers recognized the beetle for its role controlling aphids and other pests on North Dakota crops."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Convergent Lady Beetle Facts
  facts:
  - "Adopted in 2011 by the North Dakota Legislative Assembly."
  - "Scientific name: Hippodamia convergens."
  - "Orange or red shell with black spots and two converging white lines behind the head."
  - "Feeds on aphids and other small, soft-bodied insects."
  - "One of the most common ladybug species found in North Dakota fields and gardens."




