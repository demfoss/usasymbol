faq:
- question: What is North Dakota's state fossil?
  answer: "North Dakota's state fossil is Teredo petrified wood, the silicified remains of Paleocene subtropical trees riddled with the tubular borings of ancient shipworms (Teredo), designated in 1967."
- question: When did North Dakota adopt its state fossil?
  answer: "North Dakota adopted Teredo petrified wood as its state fossil in 1967, one of the earliest state fossil designations in the United States."
- question: What does Teredo petrified wood look like?
  answer: "It looks like stone wood with dozens of cylindrical tunnels bored through it in every direction, each about a quarter to half an inch wide. Cut surfaces show a honeycomb pattern of round holes surrounded by the preserved grain and growth rings of the original tree."
- question: Where is Teredo petrified wood found in North Dakota?
  answer: "Teredo petrified wood erodes out of the Paleocene Fort Union Formation across western North Dakota, especially in Slope, Bowman, and Stark counties and along the Little Missouri River. Theodore Roosevelt National Park has specimens visible on hiking trails."
- question: When did this fossil form?
  answer: "The trees grew and were bored by shipworms during the Paleocene, roughly 60 to 56 million years ago. Silica-rich groundwater gradually replaced the wood with quartz over millions of years after burial."
- question: Who pushed to make it the state fossil?
  answer: "The 1967 designation reflected how familiar and widespread Teredo petrified wood was across western North Dakota, where collectors and residents had long encountered it eroding from the badlands. No single campaign is on record; the fossil was already a recognized symbol of the state's natural landscape."

