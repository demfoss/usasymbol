- id: facts
  icon: fa-solid fa-lightbulb
  title: Teredo Petrified Wood Facts
  facts:
  - "North Dakota adopted Teredo petrified wood as its state fossil in 1967, among the earliest state fossil designations in the United States."
  - "The Teredo borings appear as cylindrical tunnels, each lined with a thin calcium carbonate shell tube that is often preserved inside the stone."
  - "The trees that became this petrified wood grew in a subtropical forest covering North Dakota about 60 million years ago, shortly after the extinction of the non-bird dinosaurs."
  - "Teredo borings in wood are used as a geological indicator: their presence in a fossil log tells scientists the wood drifted into saltwater or brackish water before being buried."
  - "The Fort Union Formation, source of most North Dakota petrified wood, is one of the best-preserved Paleocene forest records in North America."

