type: State Flower
state: North Dakota
name: Wild Prairie Rose
scientific_name: Rosa arkansana
adopted_year: 1907
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-25"
seo_title: "North Dakota State Flower | Wild Prairie Rose"
seo_description: "The Wild Prairie Rose became North Dakota's state flower in 1907. This pink native flower blooms across North Dakota's prairies and grasslands each summer."

intro_text: "The Wild Prairie Rose represents North Dakota's floral emblem, adopted in 1907, and remains a classic entry in the [list of U.S. state flowers](/symbols/flowers). These pink five-petaled flowers bloom wild across North Dakota's prairies and grasslands. Fragrant roses appear throughout the state from June through August each summer."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of North Dakota"
    paragraphs:
      - "The Wild Prairie Rose holds the position of North Dakota's official state flower. Each flower displays five pink petals surrounding a cluster of yellow stamens. The blooms measure 2 to 3 inches across. A light fragrance attracts bees and butterflies. Single flowers or small clusters appear at stem tips."
      - "Wild Prairie Roses bloom from June through August in North Dakota. Peak flowering occurs in late June and early July. The shrub grows 1 to 3 feet tall. Thorny stems spread through underground runners forming dense colonies. Compound leaves with 7 to 11 leaflets cover the branches. Bright red rose hips form after flowers fade in late summer."
      - "This native rose grows wild throughout North Dakota's remaining prairies and grasslands. The Badlands, Sheyenne National Grassland, and prairie preserves support vigorous populations. Roadsides provide common habitat where the plant thrives without cultivation. The rose tolerates drought conditions typical of North Dakota summers. Well-drained soil suits this hardy shrub. Disturbed areas like ditches and fence lines support natural growth across the state."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Wild Prairie Rose"
    paragraphs:
      - "This flower carries the common name Wild Prairie Rose and the scientific name Rosa arkansana. The plant belongs to the Rosaceae family. This enormous family includes over 3,000 species of roses, apples, cherries, and many other flowering plants worldwide."
      - "The genus name Rosa covers all rose species. The species name arkansana refers to Arkansas where botanists first described this plant. Despite this name, the Wild Prairie Rose grows throughout the Great Plains from Canada to Texas. Some botanists consider Rosa pratincola and Rosa suffulta as separate species. Most modern classifications group these under Rosa arkansana."
      - "People call this plant prairie rose or Arkansas rose in different regions. North Dakota residents typically use Wild Prairie Rose when referring to the state flower. The word wild distinguishes it from cultivated garden roses. Native Americans used rose hips for food and rose roots for medicine long before European settlement across the northern plains."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Wild Prairie Rose Became the North Dakota State Flower"
    paragraphs:
      - "North Dakota lawmakers designated the Wild Prairie Rose as state flower in 1907. This made North Dakota one of the earliest states to adopt an official floral emblem. The designation came only 17 years after statehood. School children throughout North Dakota participated in selecting the flower through informal voting, much like the later process for [North Dakota's state bird](/states/north-dakota/bird/western-meadowlark)."
      - "The Wild Prairie Rose grew naturally across North Dakota before agricultural settlement. Early settlers found the pink roses blooming across endless grasslands. The hardy rose survived despite farming and grazing pressure on native prairies. Its persistence symbolized pioneer resilience. The flower represented North Dakota's prairie heritage that defined the territory and complemented [North Dakota's state tree story](/states/north-dakota/tree/american-elm)."
      - "No competing flowers received serious consideration during the selection process. The Wild Prairie Rose seemed the obvious choice to legislators and residents. The rose's wide distribution across North Dakota strengthened the case. Every region featured these pink blooms along roadsides and in grasslands. The legislature passed the designation on March 7, 1907 with little debate, reinforcing identity themes on [the Peace Garden State page](/states/north-dakota/nickname/the-peace-garden-state)."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "North Dakota State Flower Facts"
    facts:
      - "The Wild Prairie Rose spreads through underground stems called rhizomes, allowing it to form dense colonies along roadsides and in prairie remnants across the Badlands and grasslands"
      - "Rose hips from Wild Prairie Rose contain more vitamin C than citrus fruits and were crucial food sources for Native Americans and early settlers on the northern plains"
      - "North Dakota adopted the Wild Prairie Rose on March 7, 1907, becoming one of the first states in America to designate an official state flower"
      - "Each Wild Prairie Rose flower blooms for only a few days before petals drop, but plants produce flowers continuously from June through August"
      - "Birds and small mammals eat the bright red rose hips that persist on branches through winter, providing important wildlife food in North Dakota's harsh climate"
      - "The Wild Prairie Rose grows naturally from Manitoba to Texas across the Great Plains region, thriving in the same grassland environments that once covered North Dakota"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "North Dakota State Flower and Bird"
    paragraphs:
      - "The Western Meadowlark serves as North Dakota's state bird, a grassland songbird with bright yellow breast and melodious call. Both symbols represent North Dakota officially. North Dakota adopted the Wild Prairie Rose in 1907 and designated the Western Meadowlark as state bird in 1947; compare with [the list of U.S. state birds](/symbols/birds)."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Wild Prairie Rose Symbolizes"
    paragraphs:
      - "The Wild Prairie Rose is often associated with North Dakota's prairie heritage and pioneer resilience. The flower has been linked to the vast grasslands that covered the state before agricultural settlement. Its hardy nature frequently represents endurance and adaptability needed to thrive in North Dakota's challenging environment with extreme temperatures and harsh winters, reflecting principles in [North Dakota's state motto](/states/north-dakota/motto/liberty-and-union-now-and-forever-one-and-inseparable)."

faq:
  - question: "What is North Dakota's state flower?"
    answer: "North Dakota's state flower is the Wild Prairie Rose, a pink five-petaled native flower that blooms across prairies and grasslands throughout the state."
  
  - question: "When did North Dakota adopt the Wild Prairie Rose as its state flower?"
    answer: "North Dakota adopted the Wild Prairie Rose on March 7, 1907. This made North Dakota one of the earliest states to designate an official state flower, only 17 years after achieving statehood."
  
  - question: "Why did North Dakota choose the Wild Prairie Rose?"
    answer: "North Dakota chose the Wild Prairie Rose because it grew naturally across the state and represented North Dakota's prairie heritage. School children participated in informal voting and selected the rose. The flower's hardy nature and wide distribution made it the obvious choice with no competing flowers receiving serious consideration."
  
  - question: "Where does the Wild Prairie Rose grow in North Dakota?"
    answer: "The Wild Prairie Rose grows wild throughout North Dakota in remaining prairies, grasslands, the Badlands, Sheyenne National Grassland, along roadsides, in ditches, and near fence lines. The plant thrives in disturbed areas and tolerates North Dakota's drought conditions."
  
  - question: "When does the Wild Prairie Rose bloom in North Dakota?"
    answer: "The Wild Prairie Rose blooms from June through August in North Dakota, with peak flowering occurring in late June and early July. Individual flowers bloom for only a few days, but plants produce flowers continuously throughout the summer."

