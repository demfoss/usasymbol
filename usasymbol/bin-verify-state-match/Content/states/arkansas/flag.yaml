seo_title: "Flag of Arkansas | History, Meaning & Colors"
seo_description: "Arkansas had no state flag until 1913. Its white diamond marks the only diamond-producing state. A fourth star marks Confederate membership."
meaning: "Arkansas's flag connects every element to a documented fact. The diamond is real geology. The twenty-five stars record a specific admission count. The three inner stars name three nations. The lone upper star was added a decade later."

intro_text: "Arkansas's state flag shows a **white diamond** on a **red** field, ringed by **twenty-five white stars** on blue, adopted in 1913 by the General Assembly after a statewide design contest. The flag came into existence because the state had no flag to give a U.S. Navy battleship at its commissioning ceremony."

