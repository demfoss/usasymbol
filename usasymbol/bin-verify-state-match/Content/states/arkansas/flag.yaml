sections:
  - id: history
    icon: fa-solid fa-landmark
    title: "History of the Arkansas State Flag"
    paragraphs:
      - "Arkansas had no state flag until 1913. A Pine Bluff chapter of the Daughters of the American Revolution wanted to give the battleship USS Arkansas a stand of colors before its commissioning. They asked secretary of state Earle E. Hodges for the state flag. He had to inform them no such flag existed."
      - "Hodges chaired a committee to run a statewide design contest. Sixty-five entries arrived, ranging from crayon drawings to miniature silk flags. The committee chose a submission from Willie Kavanaugh Hocker of Wabbaseka, Jefferson County. On February 26, 1913, the General Assembly adopted her red, white, and blue diamond design as the official state flag."
      - "The design changed twice after adoption. In 1923, a fourth star was added to the diamond. A special session in 1924 rearranged all four stars into the current layout."
    subsections:
      - subtitle: "What Did the Other Arkansas Flag Designs Look Like?"
        image: /images/flags/arkansas/i-ill-try-sir-flag.png
        image_caption: "The 'I'll try, sir' flag design, one of the entries in the 1913 contest."
        text: "One entry honored territorial governor James Miller, a War of 1812 hero, with his battlefield line 'I'll try, sir' on a blue field. Another repeated the apple blossom four times in colorful blocks. A third combined the state seal with an outline of the state."

  - id: symbols
    icon: fa-solid fa-shapes
    title: "Arkansas Flag Meaning and Symbolism"
    style: "symbol-cards"
    symbols:
      - id: arkansas-text
        name: "ARKANSAS"
        image: symbols/aransas.png
        clip_region: 'inset(38% 28% 42% 28%)'
        paragraphs:
          - "The word ARKANSAS runs across the center of the white diamond. It is one of the few U.S. state flags that prints the state name directly on the field. Hocker added it at the committee's request before adoption."
      - id: four-stars
        name: "Four Blue Stars"
        image: symbols/four-stars.svg
        clip_region: 'circle(22% at 50% 53%)'
        paragraphs:
          - "Four blue stars appear inside the diamond. Three below the state name represent France, Spain, and the United States, the nations that governed Arkansas before statehood. The lone star above represents the state's Confederate membership."
      - id: diamond
        name: "Diamond and Stars Border"
        image: symbols/twenty-five-stars.svg
        clip_region: 'polygon(50% 8%, 92% 50%, 50% 92%, 8% 50%)'
        paragraphs:
          - "A white diamond centered on a blue star border forms the defining shape of the flag. Twenty-five white stars ring it, marking Arkansas as the twenty-fifth state. Arkansas is the only state where natural diamonds are found in the ground."

  - id: colors
    icon: fa-solid fa-palette
    title: "Official Colors and Dimensions"
    paragraphs:
      - "Arkansas's flag uses red, white, and blue, intentionally matching the colors of the U.S. flag."
    colors:
      - name: "Red"
        hex: "#BF0A30"
      - name: "White"
        hex: "#FFFFFF"
      - name: "Blue"
        hex: "#002868"

  - id: confederate-star
    icon: fa-solid fa-circle-exclamation
    title: "The Confederate Star"
    paragraphs:
      - "The lone blue star above the state name was not part of Hocker's 1913 design. The General Assembly added it in 1923 to represent Arkansas's membership in the Confederate States of America. A 1924 special session moved it above the state name, separated from the three stars below."
      - "Calls to remove the star or reinterpret its meaning have continued in recent years. The Arkansas Code describes the upper star as representing the Confederacy. Some legislators and civic groups have proposed returning to the 1913 three-star design. No amendment has passed."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: "Interesting Facts"
    style: "gradient"
    facts:
      - "Arkansas's flag uses no seal, coat of arms, or state motto. It identifies the state by name only."
      - "Arkansas has made no changes to its flag since 1924, over a century without an amendment to the design."
      - "Arkansas law incorrectly claims Michigan was admitted alongside Arkansas. Arkansas joined in 1836 and Michigan in January 1837."
      - "Crater of Diamonds State Park is the only public diamond mine in North America. Visitors keep what they find."

  - id: previous-versions
    icon: fa-solid fa-flag
    title: "Historical Versions of the Flag"
    versions:
      - name: "Hocker's Original Sketch"
        years: "1912"
        image: versions/hocker-original-1912.webp
        description: "Hocker's original submission showed three blue stars arranged horizontally inside the diamond, without the state name."
      - name: "First Official Flag"
        years: "1913-1923"
        image: versions/official-1913.webp
        description: "Three blue stars and the word ARKANSAS inside the diamond. The three-star arrangement was the complete design as approved."
      - name: "Second Official Flag"
        years: "1923-1924"
        image: versions/official-1923.webp
        description: "The diamond held four stars for the first time, but arranged symmetrically, two above and two below. The General Assembly corrected the placement the following year."
      - name: "Current State Flag"
        years: "1924 to present"
        image: versions/modern-1924.webp
        description: "Three stars below the state name and the Confederate star alone above. The arrangement set after the symmetrical 1923 version was revised."

faq:
  - question: "What does the Arkansas state flag look like?"
    answer: "Arkansas's flag shows a white diamond on a red background, bordered by twenty-five white stars on a blue band. Inside the diamond is the word ARKANSAS with four blue stars, one above and three below the name."
  - question: "What does the diamond on the Arkansas flag mean?"
    answer: "The diamond maps to the geology of southwestern Arkansas, where the Murfreesboro Diamond Field was first commercially mined in the early 1900s. Arkansas is the only U.S. state with a natural diamond deposit, a fact already documented when Hocker designed the flag in 1912."
  - question: "What do the stars on the Arkansas flag mean?"
    answer: "The twenty-five stars on the blue border mark Arkansas as the 25th state admitted to the Union. Inside the diamond, four blue stars name the governments that claimed the land before statehood and the state's role in the Confederacy. The arrangement of those four stars was not finalized until 1924."
  - question: "When was the Arkansas flag adopted?"
    answer: "The flag was adopted February 26, 1913. Willie Kavanaugh Hocker of Wabbaseka won the statewide design contest. The committee selected her diamond design over sixty-four other entries."
  - question: "Has the Arkansas flag ever changed?"
    answer: "Yes, twice. In 1923 a fourth star was added for Confederate membership. In 1924 a special session rearranged the stars, placing three below and one above the state name."

