faq:
- question: What is Arkansas's state insect?
  answer: "Arkansas's state insect is the European honey bee, adopted by the Arkansas General Assembly in 1973."
- question: When did Arkansas adopt the European honey bee?
  answer: "Arkansas adopted the European honey bee as its official state insect in 1973."
- question: Why did Arkansas choose the European honey bee?
  answer: "Lawmakers praised the bee's diligence, hard work, and role in pollinating crops, saying it typified the character of Arkansans."
- question: What does Arkansas's state insect look like?
  answer: "The European honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of transparent wings."
- question: Does Arkansas have a separate state butterfly?
  answer: "Yes. Arkansas named the Diana fritillary its official state butterfly in 2007, separate from the honey bee's designation as state insect."

