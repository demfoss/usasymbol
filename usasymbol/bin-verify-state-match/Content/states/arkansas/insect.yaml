sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Insect of Arkansas?
  paragraphs:
  - "The European honey bee, Apis mellifera, is Arkansas's official state insect. The Arkansas General Assembly designated it in 1973."
  - "Honey bees are not native to North America. European settlers brought them over centuries ago, and Arkansas's law specifically honors the bee for its work ethic and its value to agriculture."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the European Honey Bee
  paragraphs:
  - "A honey bee is a small, fuzzy insect with a golden-brown and black striped body and two pairs of transparent wings."
  - "Honey bees live in large colonies built around a single queen, with thousands of worker bees that gather nectar and pollen and build wax honeycomb."
  - "Each worker bee visits dozens of flowers on a single trip, which is why honey bees rank among the most important pollinators for crops and wild plants alike."

- id: history
  icon: fa-solid fa-landmark
  title: How Arkansas Chose the European Honey Bee
  paragraphs:
  - "State Representative Albert Collier of Jackson County introduced the bill to name the honey bee Arkansas's official state insect. The Arkansas General Assembly passed it in 1973."
  - "Lawmakers praised the bee's diligence, hard work, and attention to home defense, saying the insect typified the outstanding citizens of Arkansas. The law also pointed to the bee's importance to crop pollination."

- id: facts
  icon: fa-solid fa-lightbulb
  title: European Honey Bee Facts
  facts:
  - "Adopted: 1973, by the Arkansas General Assembly."
  - "Scientific name: Apis mellifera."
  - "Introduced by Representative Albert Collier of Jackson County."
  - "Lawmakers praised the bee for its diligence, hard work, and productivity."
  - "About a third of Arkansas's food crops depend on pollination, and honey bees do most of that work."




