sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Arkansas?
  paragraphs:
  - "The Diana fritillary, Speyeria diana, is Arkansas's official state butterfly. The Arkansas General Assembly designated it in 2007."
  - "Arkansas is the only state in the country with the Diana fritillary as its official butterfly, and it was the 26th state overall to name a butterfly as a state symbol."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About the Diana Fritillary
  paragraphs:
  - "The Diana fritillary is one of the largest butterflies in Arkansas, with a wingspan of about 3.5 inches."
  - "Males and females look strikingly different. Males are blackish-brown with orange markings, while females are black with patches of iridescent blue."
  - "The name Diana comes from the Roman goddess, and fritillary comes from a Latin word for dice-box, a nod to the checkered wing patterns found across related species."

- id: history
  icon: fa-solid fa-landmark
  title: How Arkansas Chose the Diana Fritillary
  paragraphs:
  - "State Representative John Paul Wells of Logan County introduced the bill to name the Diana fritillary Arkansas's official state butterfly. The Arkansas General Assembly passed it in 2007."
  - "Lawmakers pointed to the butterfly's beauty, its educational value, and its draw for tourism in Arkansas's mountains as reasons for the designation."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find the Diana Fritillary in Arkansas
  paragraphs:
  - "The Diana fritillary has been recorded in 27 Arkansas counties, mostly in moist, mountainous habitat such as Mount Magazine."
  - "Adult butterflies feed on nectar plants, while their caterpillars rely on violets as the only food source, so both stages are usually found near forested slopes rather than open fields."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Diana Fritillary Facts
  facts:
  - "Adopted: 2007, by the Arkansas General Assembly."
  - "Scientific name: Speyeria diana."
  - "Wingspan: about 3.5 inches, one of the largest butterflies in Arkansas."
  - "Males are blackish-brown with orange markings; females are black with iridescent blue."
  - "Arkansas is the only state with the Diana fritillary as its official state butterfly."




