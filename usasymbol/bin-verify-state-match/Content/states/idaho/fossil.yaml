faq:
- question: What is Idaho's state fossil?
  answer: "Idaho's state fossil is the Hagerman horse (Equus simplicidens), one of the oldest members of the genus Equus. It was designated the state fossil in 1988."
- question: When did Idaho adopt its state fossil?
  answer: "Idaho adopted the Hagerman horse (Equus simplicidens) as its official state fossil in 1988, the same year the Hagerman Fossil Beds were designated a National Monument."
- question: What did the Hagerman horse look like?
  answer: "The Hagerman horse stood about 4.5 feet tall at the shoulder and weighed 800 to 1,000 pounds. Its skull and build resembled a modern Grevy's zebra more than a domestic horse, with a wide flat forehead and a short mane."
- question: Where are Hagerman horse fossils found in Idaho?
  answer: "All known Equus simplicidens fossils come from the Hagerman Fossil Beds National Monument along the Snake River near Hagerman, Idaho. Nearly 200 individuals have been recovered from the Glenns Ferry Formation at that site."
- question: When did the Hagerman horse live?
  answer: "The Hagerman horse lived during the late Pliocene, about 3.5 million years ago, when grasslands and shallow lakes covered the Snake River Plain. The species went extinct around 2 million years ago."
- question: Who pushed to make it the state fossil?
  answer: "Idaho designated the Hagerman horse in 1988, the same year the federal government recognized the Hagerman Fossil Beds as a National Monument. The choice reflected the site's status as the world's richest deposit of Equus simplicidens, a species found nowhere else in such numbers."

