intro_text: "Idaho's state fossil is the Hagerman horse (Equus simplicidens), one of the oldest known members of the genus Equus, found in extraordinary numbers at Hagerman Fossil Beds National Monument and officially designated in 1988. This profile appears in the [list of U.S. state fossils](/symbols/fossils)."

sections:
- id: overview
  icon: fa-solid fa-bone
  title: Idaho State Fossil
  paragraphs:
  - "The Hagerman horse is Idaho's official state fossil, designated in 1988. Equus simplicidens is one of the earliest members of the genus Equus — the same genus that includes all living horses, zebras, and donkeys — making it a direct ancestor of the horses alive today."
  - "Despite the name, the Hagerman horse looked more like a modern African zebra than a domestic horse. Its skull shape, stocky build, and short mane match the Grevy's zebra more closely than any horse breed. Nearly 200 individuals have been found at a single site along the Snake River, making Hagerman one of the richest horse fossil deposits in the world."

- id: about
  icon: fa-solid fa-paw
  title: What the Hagerman Horse Was
  paragraphs:
  - "The Hagerman horse stood about 4.5 feet (1.4 m) tall at the shoulder and weighed roughly 800 to 1,000 pounds — similar in size to a modern quarter horse but stockier in build. Its legs were slightly shorter relative to its body than those of a Thoroughbred, and its skull had the wide, flat forehead characteristic of African zebras."
  - "It was a grazer. Its high-crowned teeth — the flat, ridged molars used to grind tough grasses — match the dentition of animals that fed on open grassland and dry shrub, the kind of landscape that covered the Snake River Plain during the late Pliocene, about 3.5 million years ago."
  - "Equus simplicidens went extinct around 2 million years ago. The genus it belonged to survived and spread across continents, eventually giving rise to the horses, zebras, and asses living today."

- id: history
  icon: fa-solid fa-landmark
  title: How the Hagerman Horse Became Idaho's State Fossil
  paragraphs:
  - "The Hagerman Fossil Beds came to scientific attention in 1928, when rancher Elmer Cook noticed large bones eroding from the bluffs above his Snake River property. He reported the find to the Smithsonian Institution, which sent paleontologist James Gidley to investigate. What Gidley found was extraordinary: layer after layer of horse bones packed into the Glenns Ferry Formation, the remains of animals that had died near a Pliocene lake over thousands of years."
  - "The Smithsonian excavated the site from 1929 to 1934, recovering skulls, teeth, and bones from nearly 200 individual horses. One nearly complete skeleton was assembled and described by Gidley in 1930 as a new species, Equus simplicidens. The type specimen is now in the Smithsonian's National Museum of Natural History in Washington, D.C."
  - "Idaho designated the Hagerman horse as its official state fossil in 1988. The Hagerman Fossil Beds were designated a National Monument by President Reagan in November of the same year — and are now managed by the National Park Service."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Hagerman Horse Fossils Are Found in Idaho
  paragraphs:
  - "All significant Equus simplicidens fossils come from a single location: the Hagerman Fossil Beds National Monument along the Snake River, about two miles west of Hagerman in Gooding County. The bone-bearing layer is the Glenns Ferry Formation, a sequence of lake and river sediments deposited about 3.0 to 3.5 million years ago. The fossils occur in a concentrated band of silty clay that was once the muddy margin of a Pliocene lake."
  - "The site preserves far more than horses. The same formation has yielded fossils of ground sloth, short-faced bear, American mastodon, saber-toothed cat, giant beaver, pronghorn, and dozens of bird and fish species — a snapshot of an entire Pliocene ecosystem. The National Monument protects about 4,300 acres of fossil-bearing bluffs above the Snake River."
