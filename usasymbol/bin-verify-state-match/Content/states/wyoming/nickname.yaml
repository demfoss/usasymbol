sections:
- id: equality-state-meaning
  icon: fa-solid fa-scale-balanced
  title: Why Wyoming Is Called the Equality State
  paragraphs:
  - 'The 1869 law was not a symbolic gesture. It gave Wyoming women three specific rights at once: the vote, the right to hold public office, and the right to serve on juries. Each was radical on its own. Together, those three rights put Wyoming half a century ahead of the rest of the country — what most American women would wait until the 19th Amendment in 1920 to receive.'
  - "William Bright, president of the Wyoming territorial council, introduced the bill. Governor John A. Campbell signed it on December 10, 1869. Wyoming Territory had existed for barely a year. Its legislature was small, its population sparse, and the political terrain less calcified than in older states. The mix of motives — genuine belief in women's rights, a practical attempt to attract female settlers, the influence of Bright's suffragist wife — has been debated ever since. What is not debated is the outcome: the law passed, women voted in Wyoming in 1870, and it held."
  - The nickname did not come stamped on legislation. It grew from identity. Over time, the founding act became the frame through which Wyoming understood itself — not a ranching territory that happened to extend voting rights, but a place that had defined itself politically before it had much else to point to. "Equal Rights," the [state motto](/states/wyoming/motto/equal-rights), says the same thing in two words.
- id: statehood-standoff
  icon: fa-solid fa-landmark
  title: "Wyoming's Statehood Fight: Equal Rights or No State"
  paragraphs:
  - Earning a nickname is one thing. Defending it under pressure is another. Wyoming did both.
  - "When Wyoming applied for statehood in 1890, Congress balked at the women's suffrage provision in the proposed state constitution. The offer was implicit but clear: remove the equality clause, and statehood follows. Wyoming's territorial legislature refused. Their position, as recorded and widely quoted at the time, was something close to: Wyoming will remain a territory for a hundred years before it surrenders equality."
  - Congress admitted Wyoming as the 44th state on July 10, 1890, with women's suffrage intact. That refusal is why The Equality State carries more historical weight than most state nicknames. It was not a label applied in retrospect to soften the past. It was a position Wyoming staked out and held when there was something concrete to lose.
- id: equality-state-vs-cowboy-state
  icon: fa-solid fa-horse
  title: 'Equality State vs. Cowboy State: Wyoming''s Two Competing Identities'
  paragraphs:
  - Walk through a Wyoming airport, look at a license plate, or watch the poster for Cheyenne Frontier Days — the image you encounter is not a ballot box. It's a bucking horse. The Cowboy State is how Wyoming presents itself to the outside world in most commercial and cultural contexts.
  - Ranching shaped Wyoming's economy from the 1860s onward. The open-range cattle industry, the long drives north from Texas, the roundups, the rodeos — all of it built a real culture, not a promotional theme. The Wyoming bucking horse and rider has appeared on state license plates since 1936. Cheyenne Frontier Days, running since 1897, is still billed as the world's largest outdoor rodeo. The [Wyoming state flag](/states/wyoming/flag) carries that same bucking horse image into official use.
  - 'Neither nickname cancels the other. The Equality State is the official one, rooted in law and defended at statehood. The Cowboy State is the one that travels farther, appears on more surfaces, and defines Wyoming in the national imagination. They describe the same state from different angles: one political, one cultural. Wyoming is the only state where those two identities compete at equal volume.'
- id: other-nicknames
  icon: fa-solid fa-tags
  title: "Wyoming's Other Nicknames: Park State, Sagebrush State, Big Wyoming, and More"
  subsections:
  - subtitle: Suffrage State
    text: An earlier version of The Equality State — more literal, less resonant. It circulated before the broader nickname settled, naming the same history in a narrower frame. The word 'suffrage' centered voting rights specifically; 'equality' captured all three rights the 1869 law extended.
  - subtitle: Park State
    text: Wyoming contains Yellowstone — the oldest national park in the world, established 1872 — and Grand Teton National Park. The nickname never became official, but the association between Wyoming and its parks has never needed a law behind it.
  - subtitle: Sagebrush State
    text: Big sagebrush — *Artemisia tridentata* — covers most of Wyoming's high desert basin land, giving the landscape its silver-gray color and its distinctive smell after rain. The name is accurate and unglamorous, which may explain why it never caught on beyond regional use.
  - subtitle: Wonderland of America
    text: A tourism-era slogan, boosterish and broad. It did the work it was designed for in late-nineteenth and early-twentieth century promotional literature, then faded once Yellowstone's reputation was large enough to carry itself without the assist.
  - subtitle: Big Wyoming
    text: 'The most purely geographic of the group. Wyoming is the tenth-largest state by area — 97,813 square miles — and has the smallest population of any state, fewer than 600,000 people. That ratio of space to people creates a particular feeling: long distances, wide sky, towns separated by hours of driving. The name circulates in casual use without any official standing.'
timeline:
- year: December 10, 1869
  description: "Governor John A. Campbell signs the women's suffrage act. Wyoming Territory becomes the first government in the United States to grant women full political rights: voting, officeholding, and jury service."
- year: '1870'
  description: Women vote in Wyoming elections for the first time. Esther Hobart Morris becomes the first female justice of the peace in the United States, serving in South Pass City.
- year: '1890'
  description: Wyoming applies for statehood. Congress objects to the women's suffrage clause in the proposed state constitution. Wyoming's territorial legislature refuses to remove it.
- year: July 10, 1890
  description: Wyoming admitted as the 44th state with women's suffrage intact. The refusal to compromise the equality clause gives the future nickname its historical weight.
- year: '1897'
  description: Cheyenne Frontier Days holds its first rodeo, beginning the tradition that would cement the Cowboy State identity alongside the official Equality State nickname.
- year: '1920'
  description: The 19th Amendment grants American women the vote nationally — fifty years after Wyoming had already done it.
- year: '1936'
  description: The Wyoming bucking horse and rider appears on state license plates, giving the Cowboy State identity its most visible symbol.
- year: '1955'
  description: Wyoming officially adopts "Equal Rights" as the state motto, reinforcing the Equality State identity in law.
faq:
- question: What is Wyoming's official nickname?
  answer: Wyoming's official nickname is The Equality State. It was chosen for the 1869 law granting women full political rights — voting, officeholding, and jury service — the first such law by any government in the United States.
- question: Why is Wyoming called the Equality State?
  answer: Wyoming Territory passed a women's suffrage law on December 10, 1869, giving women the right to vote, hold public office, and serve on juries. When Congress pressured Wyoming to remove that provision at statehood in 1890, Wyoming refused. The nickname reflects both the original act and the defense of it.
- question: Who signed the 1869 Wyoming women's suffrage law?
  answer: Governor John A. Campbell signed the act on December 10, 1869. William Bright, president of the territorial council, introduced the bill.
- question: Did Wyoming nearly lose its women's suffrage rights at statehood?
  answer: Yes. When Wyoming applied for statehood in 1890, Congress objected to the women's suffrage provision in the proposed state constitution. Wyoming's legislature refused to remove it and was admitted as the 44th state on July 10, 1890, with the clause intact.
- question: Is the Cowboy State Wyoming's official nickname?
  answer: No. The Cowboy State is Wyoming's most recognized popular nickname, appearing on license plates and in most tourism and commercial contexts — but the official nickname is The Equality State. Both names are widely used.
- question: What other nicknames does Wyoming have?
  answer: Wyoming has been called the Suffrage State, Park State, Sagebrush State, Wonderland of America, and Big Wyoming. None of these are official. The Park State nickname reflects Wyoming's Yellowstone and Grand Teton parks; Sagebrush State describes the dominant high-desert landscape; Big Wyoming captures the state's large area and small population.
- question: What is Wyoming's state motto?
  answer: Wyoming's state motto is 'Equal Rights,' adopted in 1955. It reinforces the same history behind the Equality State nickname.
- question: When did women first vote in Wyoming?
  answer: Women voted in Wyoming elections starting in 1870, the year after the suffrage act was signed. That was fifty years before the 19th Amendment extended voting rights to American women nationally.
comparison_cards:
  heading: Wyoming's Main Nicknames
  framing: Wyoming has one official nickname and one that dominates public life. They describe the same state from very different angles.
  cards:
  - id: equality-state
    label: The Equality State
    description: Official nickname. Named for the December 10, 1869 law granting women voting rights, officeholding, and jury service — the first government in the U.S. to do so. Defended at statehood in 1890.
    status: Official
  - id: cowboy-state
    label: The Cowboy State
    description: Most widely used popular nickname. Reflects Wyoming's ranching economy, open-range history, and rodeo culture. The bucking horse and rider appears on license plates since 1936 and on the state flag.
    status: Popular (unofficial)
  - id: suffrage-state
    label: Suffrage State
    description: Earlier version of the Equality State nickname, more literal in its reference to voting rights. Fell out of use as the broader term took hold.
    status: Historical (unofficial)
  - id: park-state
    label: Park State
    description: Reflects Wyoming's Yellowstone (est. 1872) and Grand Teton national parks. Never officially adopted.
    status: Informal (unofficial)
  - id: big-wyoming
    label: Big Wyoming
    description: Geographic nickname for the tenth-largest state with the smallest population. Fewer than 600,000 people in 97,813 square miles. Used casually rather than officially.
    status: Informal (unofficial)
  - id: sagebrush-state
    label: Sagebrush State
    description: Named for the big sagebrush that dominates Wyoming's high desert basins. Accurate, unglamorous, and rarely used beyond regional contexts.
    status: Informal (unofficial)
