seo_title: "Wyoming State Nickname | The Equality State"
seo_description: "Wyoming is known as The Equality State, its official state nickname. Learn why the name fits and what other nicknames the state has used."
intro_text: "Wyoming's official nickname is *The Equality State* — chosen not for its landscape but for a single act of political will: in 1869, the Wyoming Territory became the first government in the United States to grant women full political rights. Governor John A. Campbell signed the law on December 10, 1869. Twenty-one years later, when Congress threatened to block statehood over it, Wyoming refused to back down.
 This profile appears in the [list of U.S. state nicknames](/symbols/nicknames).
  "
