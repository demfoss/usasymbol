faq:
- question: What is Wyoming's state butterfly?
  answer: "Wyoming's state butterfly is Sheridan's green hairstreak, adopted in 2009."
- question: When did Wyoming adopt Sheridan's green hairstreak?
  answer: "Wyoming adopted Sheridan's green hairstreak as its official state butterfly on February 26, 2009."
- question: What does Sheridan's green hairstreak look like?
  answer: "It is a small butterfly with a wingspan of less than an inch, with bright green undersides and brown upper wings, usually seen resting with its wings folded shut."
- question: Where can you find Sheridan's green hairstreak in Wyoming?
  answer: "It lives in dry, open habitat such as foothills and sagebrush country, and is one of the first butterflies to appear each spring."
- question: Is Sheridan's green hairstreak a butterfly, bee, beetle, or dragonfly?
  answer: "It is a butterfly, a small species in the hairstreak family known for its bright green underwings."

