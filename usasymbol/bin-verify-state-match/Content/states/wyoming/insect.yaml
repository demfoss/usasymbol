sections:
- id: overview
  icon: fa-solid fa-bug
  title: What Is the State Butterfly of Wyoming?
  paragraphs:
  - "Sheridan's green hairstreak, Callophrys sheridanii, is Wyoming's official state butterfly. Governor Dave Freudenthal signed the designation into law on February 26, 2009."
  - "It is one of the first butterflies to appear in Wyoming each spring, often flying while snow is still on the ground."

- id: about
  icon: fa-solid fa-magnifying-glass
  title: About Sheridan's Green Hairstreak
  paragraphs:
  - "Sheridan's green hairstreak is a small butterfly with a wingspan of less than an inch. Its underwings are a solid bright green, while the upper wings are brown."
  - "It rests with its wings folded shut, showing only the green underside, which helps it blend in with grass and low plants."
  - "The butterfly flies close to the ground and is easy to miss because of its small size and camouflage."

- id: history
  icon: fa-solid fa-landmark
  title: How Wyoming Chose Sheridan's Green Hairstreak
  paragraphs:
  - "The Wyoming Legislature passed Senate File 16 naming Sheridan's green hairstreak the official state butterfly, and Governor Dave Freudenthal signed it into law on February 26, 2009."
  - "The designation took effect July 1, 2009, giving Wyoming its first official state butterfly."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where You Can Find Sheridan's Green Hairstreak in Wyoming
  paragraphs:
  - "Sheridan's green hairstreak is found in dry, open habitat across Wyoming, including foothills and sagebrush country."
  - "It is one of the earliest butterflies to appear each year, often flying in late winter and early spring before most other butterflies emerge."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Sheridan's Green Hairstreak Facts
  facts:
  - "Adopted: February 26, 2009, signed into law by Governor Dave Freudenthal."
  - "Scientific name: Callophrys sheridanii."
  - "Wingspan: less than an inch, with bright green undersides and brown upper wings."
  - "One of the first butterflies to appear in Wyoming each spring."
  - "Wyoming's first and only official state butterfly."




