sections:
- id: answer-fast
  icon: fa-solid fa-circle-info
  title: 'Kentucky''s Official State Drink: Milk Since 2005'
  paragraphs:
  - Milk is Kentucky's official state drink, voted in during 2005 and on the books ever since — a designation that still surprises people who associate the state primarily with bourbon.
  - The symbol split matters here. Ale-8-One — the ginger-citrus soft drink born in Winchester, Kentucky, in 1926 — holds a separate recognition as the official state soft drink, a title formalized in 2013. Milk and Ale-8-One occupy two distinct categories, both officially recognized.
- id: why-milk-was-chosen
  icon: fa-solid fa-landmark
  title: How Milk Became Kentucky's State Drink in 2005
  paragraphs:
  - 'The push for milk came from Senator Joey Pendleton — and Pendleton was not a random legislative sponsor. He was a dairy farmer, and he argued from the industry he knew. His case rested on production numbers: dairy manufacturing was a substantial contributor to Kentucky''s agricultural economy, and the state symbol list, he argued, should reflect what the state actually produced, not only what it was famous for.'
  - 'The legislature agreed. The 2005 designation passed and became part of Kentucky Revised Statutes. The rationale was straightforwardly economic: Kentucky''s dairy sector employed workers, supported rural communities, and generated real revenue. In that framing, the state drink was not about cultural branding. It was about recognizing an industry the state''s public image had always overshadowed.'
- id: bourbon-question
  icon: fa-solid fa-circle-exclamation
  title: Why Bourbon Has Never Been Kentucky's Official State Drink
  paragraphs:
  - Kentucky produces roughly 95 percent of the world's bourbon supply. The state's identity — in tourism campaigns, in export marketing, in the global imagination — is tied to whiskey in a way that almost no other American state is tied to a single product. And yet bourbon has never been designated Kentucky's official state drink.
  - The gap has not gone unnoticed. A 2017 petition pushed to replace milk with bourbon as the state drink, gathered real attention, and made for easy headlines — the contrast between the obvious cultural answer and the correct legal one is genuinely striking. Nothing changed. Milk remained on the books.
  - The explanation is structural. State symbol designations go to organized interests that show up with a bill and a sponsor willing to carry it. The dairy industry mobilized behind Pendleton's 2005 legislation. Bourbon's advocates, despite the industry's enormous economic weight, never pushed an equivalent bill to completion. In most state legislatures, fame is not the same as official recognition.
- id: ale-8-one-distinction
  icon: fa-solid fa-bottle-water
  title: "Ale-8-One and Kentucky's State Soft Drink: A Separate Title"
  paragraphs:
  - "Ale-8-One holds a real and distinct state title: Kentucky's official state soft drink, recognized by law in 2013. But that is a separate designation from the state drink, and conflating the two misreads what each symbol covers."
  - Ale-8-One's Kentucky roots run deep. The soft drink was created in Winchester in 1926 by G.L. Wainscott, who developed a ginger-citrus formula after touring European soft drink factories. It has been bottled in Winchester ever since — one of the few regional sodas in the United States that never moved production out of its origin city. A 2001 proclamation named an official 'Ale-8-1 Day'; the 2013 law formalized the state soft drink recognition. You can read more on the [Ale-8-One state soft drink page](/states/kentucky/beverage/ale-8-one).
- id: why-this-symbol-stands-out
  icon: fa-solid fa-star
  title: Why Kentucky's State Drink and Its Public Identity Don't Match
  paragraphs:
  - 'Kentucky is bourbon country in every meaningful cultural sense: the distilleries, the Bourbon Trail, the international reputation built over two centuries. The state''s public identity and its official state drink are in deliberate, somewhat comic tension. Milk was chosen not for cultural resonance but for agricultural economy, by a dairy farmer who introduced a bill, made his case, and got it passed.'
  - The 2017 petition to switch to bourbon never gained legislative traction. Milk is still on the books. The bourbon industry remains dominant in every other context — on labels, in tourism, in every conversation about what [Kentucky](/states/kentucky) means. The official symbol and the public identity remain misaligned, and that gap is what makes Kentucky's state drink genuinely memorable.
timeline:
- year: '1926'
  description: G.L. Wainscott creates Ale-8-One in Winchester, Kentucky — a ginger-citrus soft drink that will later earn its own separate state recognition.
- year: '2001'
  description: Kentucky proclamation declares an official 'Ale-8-1 Day,' an early recognition of the Winchester soft drink before formal legislative status.
- year: '2005'
  description: Kentucky designates milk as the official state drink. Bill sponsored by Senator Joey Pendleton, a dairy farmer, on the basis of dairy agriculture's contribution to the state economy.
- year: '2013'
  description: Kentucky recognizes Ale-8-One as the official state soft drink — a separate designation from the state drink, which remains milk.
- year: '2017'
  description: A public petition pushes to change the state drink from milk to bourbon. No legislation advances. Milk remains the official state drink.
faq:
- question: What is Kentucky's state drink?
  answer: Kentucky's official state drink is milk, designated in 2005. Senator Joey Pendleton's bill passed on agricultural and economic grounds — dairy farming's contribution to the state's economy, not its cultural fame. Bourbon and Ale-8-One are both well known in Kentucky; neither holds the state drink designation.
- question: Why is Kentucky's state drink milk instead of bourbon?
  answer: Milk was designated because Senator Joey Pendleton — a dairy farmer — championed the bill on the basis of dairy agriculture's importance to Kentucky's economy. Bourbon, despite being culturally central to Kentucky's identity, has never had equivalent legislative backing for an official state drink designation.
- question: Is Ale-8-One Kentucky's state drink?
  answer: No. Ale-8-One is Kentucky's official state soft drink, a separate designation formalized in 2013. The state drink is milk. These are two distinct official titles.
- question: When did Kentucky designate milk as the state drink?
  answer: In 2005. The designation is part of Kentucky Revised Statutes and has not been changed since.
- question: Who proposed making milk Kentucky's state drink?
  answer: Senator Joey Pendleton, who was also a dairy farmer. He argued that milk production and dairy manufacturing were major contributors to Kentucky's agricultural economy and deserved recognition in the state symbol list.
- question: Has there been an effort to make bourbon the state drink?
  answer: Yes. A petition in 2017 pushed to replace milk with bourbon, but no legislation advanced. Milk has remained the official designation.
- question: Does Kentucky have an official state beverage other than milk?
  answer: Ale-8-One is recognized as the official state soft drink — a separate, narrower category. Milk is the official state drink. Bourbon holds no official state drink title.
