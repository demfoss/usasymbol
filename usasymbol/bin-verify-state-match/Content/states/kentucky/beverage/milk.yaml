seo_description: "Kentucky made milk its official state drink in 2005, not bourbon. Ale-8-One holds the separate soft-drink title."
intro_text: Kentucky's official state drink is **milk**, designated in **2005** at the urging of state Senator Joey Pendleton, a dairy farmer who made the case on agricultural and economic grounds. Kentucky is famous worldwide for bourbon and Ale-8-One has its own devoted following — but the legislature chose the one tied to the state's dairy farms. This profile appears in the [list of U.S. state beverages](/symbols/beverages).
