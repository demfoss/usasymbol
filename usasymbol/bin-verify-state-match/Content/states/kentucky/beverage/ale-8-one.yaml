seo_title: "Kentucky State Soft Drink | Ale-8-One"
seo_description: "Ale-8-One is Kentucky's official soft drink, not its state drink. The Winchester soda became an icon long before legal recognition."
intro_text: '**Ale-8-One** is Kentucky''s official state soft drink — a ginger-and-citrus soda that has been made in Winchester, Kentucky, since 1926. The title is specific: not the state drink, which is milk, but a separate designation covering this one regional product. Ale-8-One is also the only soft drink created in Kentucky that is still in production. This profile appears in the [list of U.S. state beverages](/symbols/beverages).'
