faq:
  - question: "What is the Kentucky state motto?"
    answer: "Kentucky's state motto is \"United We Stand, Divided We Fall.\" It has appeared on the Kentucky state seal since 1792 and traces to a patriot song from 1768."

  - question: "What does Kentucky's state motto mean?"
    answer: "The motto means that people who stay united are strong, and those who split apart are weak. For Kentucky in 1792, it was a statement about unity at a time when the United States itself was still new."

  - question: "Where does Kentucky's motto come from?"
    answer: "The phrase traces to \"The Liberty Song\" (1768), written by John Dickinson. The song's chorus included the line \"By uniting we stand, by dividing we fall,\" which circulated widely during the American Revolution."

  - question: "When did Kentucky adopt its state motto?"
    answer: "The motto appeared on the Kentucky state seal in 1792, when Kentucky became the 15th state of the Union on June 1 of that year. It has been part of the official seal since the beginning."

