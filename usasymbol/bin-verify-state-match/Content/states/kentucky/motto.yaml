seo_description: "Kentucky's state motto is \"United We Stand, Divided We Fall.\" It comes from John Dickinson's 1768 song and has appeared on the state seal since 1792."

intro_text: "Kentucky's state motto is <strong>United We Stand, Divided We Fall</strong>. The phrase traces to <em>The Liberty Song</em>, a 1768 patriot song written by John Dickinson, and has appeared on the Kentucky state seal since the state joined the Union in 1792. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

