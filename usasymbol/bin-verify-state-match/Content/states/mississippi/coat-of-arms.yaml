type: State Coat of Arms
state: Mississippi
name: Mississippi State Coat of Arms
adopted_year: 1894
is_official: true
meaning: "The Mississippi coat of arms places an eagle at the center of a blue shield, with cotton stalks below and a red scroll carrying the Latin motto Virtute et Armis curving around the sides and bottom. Adopted in 1894, the design arrived 77 years after statehood. The cotton stalks reflect the crop that shaped Mississippi's landscape and economy throughout the nineteenth century. The motto, By Valor and Arms, was proposed not by a soldier or politician but by an educator, at a moment in Mississippi history when martial identity was being deliberately cultivated."
meaning_title: Meaning of the Mississippi Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'Mississippi Coat of Arms: Meaning, Symbols and History'
seo_description: "The Mississippi coat of arms was adopted in 1894 and shows a blue shield with an eagle, cotton stalks, and the motto Virtute et Armis (By Valor and Arms)."
