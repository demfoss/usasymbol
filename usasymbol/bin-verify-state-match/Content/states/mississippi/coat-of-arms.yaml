hero_image_caption: The Mississippi Coat of Arms, adopted in 1894. A blue shield carries an eagle at its center. Cotton stalks appear below. A red scroll with the motto Virtute et Armis in white letters on gold spaces curves around the sides and bottom.
intro_text: "Mississippi adopted its coat of arms in 1894, 77 years after becoming a state. The design shows a blue shield with an eagle at center, cotton stalks below, and the Latin motto Virtute et Armis on a red scroll curving around the sides. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the Mississippi Coat of Arms?
  paragraphs:
  - "The Mississippi coat of arms is the state's official heraldic emblem, distinct from the Great Seal of Mississippi. Mississippi is unusual among states in having two separate official heraldic symbols: a state seal dating to 1798 and a coat of arms adopted 96 years later in 1894. The seal and the coat of arms are governed by different statutes and carry entirely different imagery."
  - "The two emblems are governed by different statutes and appear in different official contexts. Mississippi's motto, Virtute et Armis, exists only within the coat of arms statute. It has never been adopted as a standalone symbol."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the Mississippi Coat of Arms
  paragraphs:
  - "Mississippi became the 20th state on December 10, 1817, but did not adopt a coat of arms for 77 years. That gap was unusual. Most early states created formal heraldic designs within a decade of statehood. Mississippi used its state seal, adopted in territorial times in 1798, without adding a separate coat of arms until the 1890s."
  - "On February 7, 1894, the Mississippi Legislature appointed a committee to design an official coat of arms. The committee worked through the year, specifying a blue shield with an eagle at center, cotton stalks below, and a red scroll bearing a Latin motto in white letters on gold spaces."
  - "The motto, Virtute et Armis, was proposed by James Rhea Preston, the state superintendent of education. Preston was an educator rather than a soldier or politician, though the phrase he chose reflects the martial values that dominated post-Reconstruction Mississippi, where Civil War veterans held most positions of political leadership."
  - "An extraordinary legislative session in 1894 approved the coat of arms with minimal changes from the committee's draft. That same session also adopted a new state flag incorporating a Confederate battle cross. The coat of arms and the Confederate-symbol flag were products of the same moment in Mississippi's official history."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the Mississippi Coat of Arms
  paragraphs:
  - "The Mississippi coat of arms uses three main visual elements: a blue shield with an eagle, cotton stalks below the shield, and a red scroll with the motto curving around the sides and bottom. Each element connects to Mississippi's history and the era in which the design was created."
  elements:
  - id: shield-and-eagle
    name: The Blue Shield and Eagle
    image: /images/coats-of-arms/mississippi/elements/shield.webp
    paragraphs:
    - "The shield has a blue (azure) background. An eagle occupies the center of the shield as the primary charge. The blue field is one of the most common heraldic colors and was chosen for the Mississippi coat of arms by the 1894 design committee without a recorded explanation in surviving records."
    - "The eagle at the center connects the coat of arms to American national imagery. Eagles appear on federal seals and on dozens of state symbols adopted in the nineteenth century. For Mississippi, the eagle on the coat of arms is distinct from the eagle on the state seal, which holds an olive branch and arrows in its talons in direct imitation of the Great Seal of the United States."
  - id: cotton-stalks
    name: Cotton Stalks
    image: /images/coats-of-arms/mississippi/elements/cotton.webp
    paragraphs:
    - "Cotton stalks appear below the shield. Cotton was the dominant crop of Mississippi from the early nineteenth century through and well beyond the Civil War. By the 1890s, when the coat of arms was designed, cotton still defined Mississippi's agricultural economy and its landscape."
    - "Including cotton in the coat of arms was a direct reference to the state's economic identity. No other crop or regional symbol was specified by the 1894 committee for this position in the design."
  - id: motto-scroll
    name: Virtute et Armis
    image: /images/coats-of-arms/mississippi/elements/scroll.webp
    paragraphs:
    - "A red scroll curves around the bottom and sides of the shield, carrying the motto Virtute et Armis in white letters on gold spaces. The phrase is Latin for By Valor and Arms. The scroll's red color and the white-on-gold letter arrangement were specified by the committee in 1894."
    - "James Rhea Preston, the state superintendent of education who proposed the motto, may have been aware of a contrasting English precedent. Lord Gray De Wilton used the family motto Virtute Non Armis Fido, meaning I trust in virtue, not arms. Mississippi's version, By Valor and Arms, takes the opposite position, treating military force and personal courage as equal instruments of strength."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the Mississippi Coat of Arms
  paragraphs:
  - "The coat of arms arrived in 1894 during a specific moment in Mississippi's history. Post-Reconstruction political leaders were systematically reordering the state's official identity. Civil War veterans held most elected positions, and Confederate memory was being publicly honored. The motto By Valor and Arms fit that cultural atmosphere."
  - "Cotton stalks below the shield acknowledge what Mississippi's economy was built on throughout the nineteenth century. Cotton shaped not only the landscape but also the plantation system, the labor of enslaved people before the Civil War, and the sharecropping economy that followed. The 1894 committee placed cotton in the design without further explanation."
  - "The blue shield and eagle follow the visual language common to American state heraldry of the era. What makes the Mississippi coat of arms distinct is the combination: a martial Latin motto proposed by an educator, cotton as the only regional symbol, and a design that came 77 years into the state's history rather than at its founding."

- id: facts
  icon: fa-solid fa-lightbulb
  title: Mississippi Coat of Arms Facts
  facts:
  - "Mississippi waited 77 years after statehood to adopt a coat of arms, making 1894 one of the latest first-time adoptions among states admitted in the early nineteenth century."
  - "The motto Virtute et Armis was proposed by James Rhea Preston, the state superintendent of education, not by a legislator or military figure."
  - "The motto appears in white letters on gold spaces along a red scroll, a specific color combination specified by the 1894 design committee."
  - "The same extraordinary 1894 legislative session that adopted the coat of arms also adopted a new state flag incorporating a Confederate battle cross."
  - "Mississippi's coat of arms and its state seal are separate emblems governed by different statutes. The state seal dates to 1798; the coat of arms to 1894."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the Mississippi Coat of Arms
  paragraphs:
  - "Mississippi had no coat of arms before 1894. The state relied on the Great Seal, dating to 1798, for its official heraldic identity throughout the first 77 years of statehood. No design sketches or proposed versions from before 1894 have been identified as earlier official coats of arms."
  versions:
  - name: Official Standard
    years: 1894-present
    image: /images/coats-of-arms/mississippi/coat-of-arms.svg
    description: The Mississippi coat of arms adopted by extraordinary legislative session in 1894. The design specifies a blue shield with an eagle at center, cotton stalks below, and a red scroll carrying Virtute et Armis in white letters on gold spaces. No major redesign has been recorded since adoption.

faq:
- question: What does the Mississippi coat of arms show?
  answer: "The Mississippi coat of arms shows a blue shield with an eagle at the center. Cotton stalks appear below the shield. A red scroll curves around the sides and bottom, carrying the Latin motto Virtute et Armis in white letters on gold spaces."
- question: What does Virtute et Armis mean?
  answer: "Virtute et Armis is Latin for By Valor and Arms. The word virtute comes from virtus, meaning courage, excellence, and military virtue. Armis means arms or weapons. Together, the phrase expresses achievement through both inner courage and military strength."
- question: When was the Mississippi coat of arms adopted?
  answer: "The coat of arms was adopted in 1894, during an extraordinary legislative session. A design committee had been appointed on February 7, 1894. Mississippi became a state in 1817, so the coat of arms arrived 77 years after statehood."
- question: Who designed the Mississippi coat of arms?
  answer: "A committee appointed by the Mississippi Legislature on February 7, 1894, designed the coat of arms. James Rhea Preston, the state superintendent of education, proposed the motto Virtute et Armis. An extraordinary legislative session later in 1894 approved the committee's design with minimal changes."
- question: Is the Mississippi coat of arms the same as the state seal?
  answer: "No. The Mississippi state seal dates to 1798 and features an American eagle holding an olive branch and a bundle of arrows, modeled on the Great Seal of the United States. The coat of arms, adopted in 1894, uses a blue shield with an eagle, cotton stalks, and the motto Virtute et Armis. They are separate emblems governed by different statutes."
- question: Why does the Mississippi coat of arms have cotton stalks?
  answer: "Cotton was Mississippi's dominant crop throughout the nineteenth century, shaping both the state's economy and landscape. The 1894 committee that designed the coat of arms included cotton stalks as the regional symbol below the shield. No other crop or symbol was specified for that position."
- question: Why did Mississippi wait so long to adopt a coat of arms?
  answer: "The historical record does not give a clear reason. Mississippi became a state in 1817 and relied on its state seal for official purposes. The coat of arms was not considered until 1894, when the legislature formed a committee specifically to create one. Most early American states adopted heraldic designs within their first decade."

