- id: facts
  icon: fa-solid fa-lightbulb
  title: Prehistoric Whale Facts
  facts:
  - "Mississippi designated Zygorhiza kochii as its state fossil in 1981."
  - "Zygorhiza kochii had tiny vestigial hind limbs — bony remnants of the legs its land-mammal ancestors once used."
  - "The species name kochii honors 19th-century fossil collector Albert Koch, who excavated archaeocete whales from the Gulf Coast."
  - "During the Eocene, the Gulf of Mexico extended north across much of Mississippi, leaving behind the marine clay beds where whale fossils are found today."
  - "Zygorhiza was about 20 feet long — roughly the size of a modern bottlenose dolphin, but far more primitive in structure."

