faq:
- question: What is Mississippi's state fossil?
  answer: "Mississippi's state fossil is the prehistoric whale Zygorhiza kochii, an early archaeocete whale from the Late Eocene, about 35 million years old, designated in 1981."
- question: When did Mississippi adopt its state fossil?
  answer: "Mississippi designated Zygorhiza kochii as its official state fossil in 1981."
- question: What did the prehistoric whale look like?
  answer: "Zygorhiza kochii was about 20 feet long with a long low skull, large serrated teeth, and tiny vestigial hind limbs. Its body was elongated and flexible, more like an eel than a modern whale."
- question: Where are prehistoric whale fossils found in Mississippi?
  answer: "Fossils come mainly from the Yazoo Clay formation in eastern Mississippi, particularly Clarke, Lauderdale, and Kemper counties. The Mississippi Museum of Natural Science in Jackson has mounted skeletal material on display."
- question: When did the prehistoric whale live?
  answer: "Zygorhiza kochii lived during the Late Eocene, about 36 to 34 million years ago, when a shallow sea covered much of present-day Mississippi."
- question: Who pushed to make it the state fossil?
  answer: "The designation in 1981 reflected Mississippi's long history of archaeocete fossil discoveries in the state's Eocene clay beds, known since the 19th century."

