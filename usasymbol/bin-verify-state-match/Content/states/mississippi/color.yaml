seo_title: "Mississippi State Colors | Red Blue Gold"
seo_description: "Mississippi state colors are Red, Blue, and Gold, a palette tied to the flag and official symbolism. See HEX, RGB, CMYK, Pantone, history, and sources."

intro_text: "The traditional state colors of Mississippi are **Red**, **Blue**, and **Gold**, derived from the New Magnolia flag adopted in 2021 as shown on [the Mississippi state flag](/states/mississippi/flag/mississippi-state-flag). Mississippi has not enacted a separate state color statute; the colors are defined by the flag's statutory description under Mississippi law. For Mississippi, the specifications pair HEX, RGB, CMYK, and Pantone values with context from the broader [U.S. state colors reference](/symbols/colors)."

official_colors: "Red, Blue, and Gold"
official_since: "Traditional / State Flag (New Magnolia flag adopted January 11, 2021; signed by Governor Tate Reeves)"
primary_use: "State flag (adopted January 11, 2021), Mississippi state government branding, state agency materials and communications"
known_for: "The New Magnolia flag was approved by 73 percent of voters in a November 2020 referendum — among the most decisive state flag votes in American history — replacing a 126-year-old flag that incorporated the Confederate battle emblem; gold honors both Mississippi's cultural arts heritage and the state's Indigenous peoples through the distinctive gold star at the top of the flag's central design"

