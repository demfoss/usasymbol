seo_title: "Mississippi State Motto | Virtute et Armis"
seo_description: "Mississippi's state motto is \"Virtute et Armis,\" Latin for \"By Valor and Arms.\" Adopted in 1894, it appears on the red scroll of the state coat of arms."

intro_text: "Mississippi's state motto is <strong>Virtute et Armis</strong>, a Latin phrase meaning <em>By Valor and Arms</em>. It was adopted in 1894 as part of the state's first official coat of arms, created 77 years after Mississippi became a state. This profile appears in the [list of U.S. state mottos](/symbols/mottos)."

