sections:
  - id: overview
    icon: "fa-solid fa-scroll"
    title: "Mississippi State Motto"
    paragraphs:
      - "Mississippi's state motto is <strong>Virtute et Armis</strong>, a Latin phrase meaning <em>By Valor and Arms</em>. It was adopted in 1894 through an extraordinary legislative session, 77 years after Mississippi became the 20th state on December 10, 1817."
      - "The motto appears on the state coat of arms, not on the current state flag. Mississippi's flag, redesigned in 2021, displays the phrase <em>In God We Trust</em> instead."

  - id: translation
    icon: "fa-solid fa-language"
    title: "Translation of \"Virtute et Armis\""
    paragraphs:
      - "<em>Virtute</em> is the ablative case of <em>virtus</em>, meaning <em>by valor</em> or <em>by courage</em>. <em>Et</em> means <em>and</em>. <em>Armis</em> is the ablative of <em>arma</em>, meaning <em>by arms</em> or <em>by weapons</em>."
      - "In Latin, the ablative case indicates the means of action. The full phrase means: achieving something by means of both valor and arms."

  - id: meaning
    icon: "fa-solid fa-shield-halved"
    title: "Mississippi State Motto Meaning"
    paragraphs:
      - "The Latin word <em>virtus</em> originally described the qualities of a good soldier: courage, strength, and excellence in battle. Over time it broadened to include moral character and personal worth, but its martial roots remained close to the surface."
      - "Pairing <em>virtus</em> with <em>arma</em> (arms) makes the military reference direct. The motto combines inner courage with physical military strength as equal sources of achievement."

  - id: history
    icon: "fa-solid fa-clock-rotate-left"
    title: "History of Mississippi's State Motto"
    paragraphs:
      - "Mississippi became the 20th state on December 10, 1817, but went 77 years without an official coat of arms. On February 7, 1894, the legislature appointed a committee to design one. Historical records link the motto to James Rhea Preston, the state superintendent of education, who proposed the Latin phrase for the red scroll in the coat of arms design."
      - "An extraordinary legislative session in 1894 approved the coat of arms under Chapter 37 of the Laws of the Extraordinary Session. The same session also adopted a new state flag with a Confederate battle cross canton. Both decisions came from the same post-Reconstruction legislature."
      - "In 1906, during a revision of the Mississippi Code, the coat of arms law was accidentally omitted. In May 2000, the Mississippi Supreme Court ruled that the state technically had no official coat of arms. Governor Ronnie Musgrove signed a new law on February 7, 2001, exactly 107 years after the original adoption, formally restoring the 1894 design. The motto and coat of arms are now codified in Mississippi Code § 3-3-41."

  - id: where-it-appears
    icon: "fa-solid fa-location-dot"
    title: "\"Virtute et Armis\" on the Mississippi State Coat of Arms"
    paragraphs:
      - "The motto appears in white letters on gold spaces along a red scroll at the bottom of the coat of arms. The shield above shows an eagle holding a palm branch in its right talon and a bundle of arrows in its left. <em>Mississippi</em> appears above the eagle in gold, and cotton stalks are arranged below the shield."
      - "Mississippi's current state flag, adopted January 11, 2021, does not show the state motto. The flag features a white magnolia blossom, a ring of 20 white stars and one gold star, and the phrase <em>In God We Trust</em>. The coat of arms with the motto appears on official state documents and government publications."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Mississippi State Motto Facts"
    style: "gradient"
    facts:
      - "Mississippi went 77 years after statehood before adopting a coat of arms and motto in 1894."
      - "\"Virtute et Armis\" means \"By Valor and Arms\" in Latin."
      - "Historical records link the motto to James Rhea Preston, the state superintendent of education."
      - "The 1894 coat of arms law was accidentally dropped from the 1906 Code revision. Governor Musgrove re-signed it on February 7, 2001."
      - "The motto appears on the red scroll of the coat of arms, not on the current state flag."
      - "Mississippi Code § 3-3-41 now codifies the coat of arms and motto."

