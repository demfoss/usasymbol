faq:
  - question: "What is Mississippi's state motto?"
    answer: "Mississippi's state motto is \"Virtute et Armis,\" a Latin phrase meaning \"By Valor and Arms.\" It was adopted in 1894 as part of the state coat of arms and is codified in Mississippi Code § 3-3-41."

  - question: "What does \"Virtute et Armis\" mean?"
    answer: "\"Virtute\" comes from the Latin word \"virtus\" — courage and excellence, especially in battle. \"Armis\" means arms or weapons. Together: \"By Valor and Arms,\" expressing achievement through both inner courage and military strength."

  - question: "When did Mississippi adopt its state motto?"
    answer: "In 1894, during an extraordinary legislative session, as part of the state coat of arms. Mississippi became a state in 1817 but had no official coat of arms or motto for 77 years."

  - question: "Where does Mississippi's motto appear?"
    answer: "On the state coat of arms, in white letters on gold spaces along a red scroll beneath the shield. The motto does not appear on Mississippi's current state flag, which was redesigned in 2021."

  - question: "Did Mississippi's motto change when the flag changed in 2021?"
    answer: "No. The 2021 flag redesign changed the state flag but not the state motto. The new flag shows \"In God We Trust\" — the national motto — not the state motto. \"Virtute et Armis\" remains Mississippi's official state motto."

