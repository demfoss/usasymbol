faq:
- question: What is Wisconsin's state fossil?
  answer: "Wisconsin's state fossil is the trilobite, specifically Calymene celebra. It was designated by the Wisconsin Legislature in 1985."
- question: When did Wisconsin adopt its state fossil?
  answer: "Wisconsin adopted the trilobite (Calymene celebra) as its state fossil in 1985, following a campaign by Wisconsin schoolchildren."
- question: What did the trilobite look like?
  answer: "Calymene celebra was up to 2 inches long with an oval, three-lobed shell divided into a head, 13-segment middle section, and a short tail plate. It could roll into a tight ball for protection, and enrolled specimens are frequently found intact in Wisconsin dolomite."
- question: Where are trilobite fossils found in Wisconsin?
  answer: "Calymene celebra fossils are found along the Niagara Escarpment, which runs from the Milwaukee area north through Green Bay and up the Door Peninsula. Dolomite quarries in Waukesha, Milwaukee, and Ozaukee counties are especially productive, and outcrops on the Door Peninsula are accessible to the public."
- question: When did the trilobite live?
  answer: "Calymene celebra lived during the Middle Silurian period, roughly 428 to 419 million years ago. Wisconsin's specimens come from the Niagaran Stage of the Silurian, when a warm shallow sea covered the state."
- question: Why is the Niagara Escarpment important for Wisconsin trilobites?
  answer: "The Niagara Escarpment is a long ridge of Silurian dolomite that runs through southeastern Wisconsin and up the Door Peninsula. It preserves the ancient reef sediments where Calymene celebra lived, and its quarries and outcrops are the main source of Wisconsin trilobite fossils. The same rock formation continues east to form Niagara Falls."

