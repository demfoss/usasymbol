- id: facts
  icon: fa-solid fa-lightbulb
  title: Trilobite Facts
  facts:
  - "Wisconsin designated Calymene celebra as its state fossil in 1985, one of the earlier state fossil designations in the country."
  - "Enrolled (curled-up) Calymene celebra specimens are among the most commonly found intact trilobite fossils in North America."
  - "Calymene celebra lived on a tropical reef in the Silurian sea — Wisconsin sat near the equator 425 million years ago."
  - "The Niagara Escarpment, the ridge of Silurian dolomite where most Wisconsin trilobites are found, is the same rock formation that forms Niagara Falls."
  - "Calymene celebra is closely related to Calymene blumenbachii, the famous Silurian trilobite from Dudley, England, which is so abundant it was once called the Dudley Bug."

