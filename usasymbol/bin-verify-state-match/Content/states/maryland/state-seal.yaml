hero_image_caption: The obverse of the Great Seal of Maryland, restored to its colonial Calvert design in 1876. Lord Baltimore in full armor rides across the center; the Latin motto from Psalm 5:12 circles the border.
intro_text: 'The Great Seal of Maryland has two sides. The obverse shows Lord Baltimore in full armor on horseback with the Calvert family motto from Psalm 5:12 around the border. The reverse shows the quartered Calvert and Crossland arms flanked by a farmer and fisherman, with the date 1632 and the Italian motto FATTI MASCHII PAROLE FEMINE. This profile appears in the [list of U.S. state seals](/symbols/state-seals).'
