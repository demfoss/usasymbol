type: State Seal
state: Maryland
name: Great Seal of Maryland
adopted_year: 1876
is_official: true
legislation: Maryland Code, State Government Article § 13-101
meaning: "The Great Seal of Maryland is the only U.S. state seal with two distinct sides, obverse and reverse, derived entirely from the heraldry of the Calvert family, the colony's founders. The obverse carries Lord Baltimore in armor on horseback with a border motto from Psalm 5:12. The reverse pairs a farmer and a fisherman with the quartered Calvert and Crossland arms, the same heraldry that appears on the Maryland state flag, and the Italian family motto that had accompanied the Calverts since the 17th century."
