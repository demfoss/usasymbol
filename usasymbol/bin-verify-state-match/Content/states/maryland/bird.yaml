legislation: Chapter 54 of the Acts of 1947
meaning: 'The Baltimore Oriole arrived at the 1947 vote with three things already pointing toward Maryland: the Baltimore name tied to Lord Baltimore and the Calvert dynasty, an orange-and-black plumage echoing Calvert heraldry, and a common name already legible to any American as Maryland-coded.'
