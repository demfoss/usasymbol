sections:
- id: why-maryland-chose-the-baltimore-oriole
  icon: fa-solid fa-circle-question
  title: Why Maryland Chose the Baltimore Oriole
  paragraphs:
  - Most state birds are chosen by legislators looking for something familiar and broadly liked — a species common enough that constituents will recognize it. Maryland's 1947 choice worked differently. The Baltimore Oriole came to the vote with the state's founding name already embedded in its common English label, traced to the Calvert family's Lord Baltimore title that also gave the city its name.
  - That meant the state didn't need to argue for the bird. The name and the heraldic colors were doing the work before any legislation. Chapter 54 of the Acts of 1947 was recognition of an existing fit, not the construction of one.
- id: the-baltimore-orioles-baseball-team
  icon: fa-solid fa-baseball
  title: The Baltimore Orioles Baseball Team
  paragraphs:
  - 'The Baltimore Orioles MLB franchise moved to Baltimore in 1954 — seven years after the state bird designation — and took the name already associated with the city''s most recognized bird. Both the state symbol and the team name share the same root: the Calvert legacy embedded in the word Baltimore.'
  - 'That overlap makes the bird unusually visible in Maryland''s public life. Most state birds exist primarily in official contexts: school curricula, state symbols lists, park signage. Maryland''s state bird also appears on a major-league uniform, which gives the designation a cultural reach that official status alone rarely produces.'
- id: how-the-colors-connect-to-maryland
  icon: fa-solid fa-palette
  title: How the Oriole's Colors Connect to Maryland
  paragraphs:
  - The male Baltimore Oriole has a black head, back, and wings with vivid orange across the breast and flanks — the orange-and-black combination that corresponds to the Calvert side of Maryland's [state flag](/states/maryland/flag/maryland-state-flag). The flag's design draws from two separate coats of arms; the Calvert quarter specifically uses the orange-and-black pairing the bird reproduces.
  - Maryland's [Black-eyed Susan](/states/maryland/flower/black-eyed-susan) runs in the same visual register — dark center, gold-orange petals. The two symbols weren't designed together, but they share a color logic that reinforces each other and that reads as distinctly Maryland rather than incidentally similar.
faq:
- question: What is Maryland's state bird?
  answer: Maryland's state bird is the Baltimore Oriole (Icterus galbula), adopted in 1947 through Chapter 54 of the Acts of 1947.
- question: Why is the Baltimore Oriole Maryland's state bird?
  answer: Maryland chose the Baltimore Oriole because the bird already carried the Baltimore name — tied to Lord Baltimore and the Calvert colonial dynasty — and its orange-and-black plumage matched the Calvert heraldry on the state flag. No argument needed to be constructed; the fit was already there before the 1947 legislation.
- question: Is the Baltimore Orioles baseball team named after the state bird?
  answer: 'Both the state bird and the MLB team draw from the same source: the Calvert family''s Baltimore legacy. The bird''s common name predates the team. The franchise relocated to Baltimore in 1954 and adopted the name of the city''s most recognized bird — seven years after the state had already made it an official symbol.'
- question: When did Maryland adopt the Baltimore Oriole as its state bird?
  answer: Maryland designated the Baltimore Oriole as its official state bird in 1947 through Chapter 54 of the Acts of 1947.
