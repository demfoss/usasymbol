seo_title: "Maryland State Bird | Baltimore Oriole"
seo_description: "Maryland made the Baltimore Oriole its state bird in 1947. Its colors echo Calvert heraldry and the Orioles name."
intro_text: 'Maryland''s official state bird is the <strong>Baltimore Oriole</strong> (<em>Icterus galbula</em>), designated by <strong>Chapter 54 of the Acts of 1947</strong>. The legislature was working with material already in place: the bird carried the Baltimore name from its earliest English description, its orange-and-black plumage echoed the Calvert family''s heraldry on the state flag, and no other state had the same combination of naming heritage and visual match available. This profile appears in the [list of U.S. state birds](/symbols/birds).'
