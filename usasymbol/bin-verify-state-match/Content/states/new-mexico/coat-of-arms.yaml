type: State Coat of Arms
state: New Mexico
name: New Mexico State Coat of Arms
adopted_year: 1912
is_official: true
meaning: "The New Mexico coat of arms places a large American bald eagle directly over a smaller Mexican eagle. The American eagle's wings spread wide, shielding the Mexican eagle below. The Mexican eagle is shown clutching a serpent while perched on a nopal cactus, the same image used in Mexico's national emblem and traced back to the Aztec founding of Tenochtitlan. Together, the two eagles show that New Mexico passed from Mexican sovereignty to the United States while keeping its older history visible."
meaning_title: Meaning of the New Mexico Coat of Arms
meaning_after_section: history
author: USA Symbol Team
date_published: '2026-05-21'
date_modified: '2026-05-21'
seo_title: 'New Mexico Coat of Arms: Meaning, Symbols and History'
seo_description: "The New Mexico coat of arms was adopted in 1912 and shows an American bald eagle protecting a smaller Mexican eagle with a snake and cactus."
hero_image: /images/coats-of-arms/new-mexico/coat-of-arms.webp
hero_image_alt: Official Coat of Arms of the State of New Mexico, showing a large American bald eagle spreading its wings over a smaller Mexican eagle perched on a cactus holding a serpent
hero_image_caption: The New Mexico Coat of Arms. A large American bald eagle spreads its wings over a smaller Mexican eagle perched on a nopal cactus while holding a serpent. The state motto Crescit Eundo, meaning It grows as it goes, appears on a scroll below the design.
intro_text: "The New Mexico coat of arms shows a large American bald eagle spreading its wings over a smaller Mexican eagle clutching a serpent and perched on a nopal cactus. The two-eagle design dates to the territorial period and was codified as an official state symbol when New Mexico was admitted to the Union on January 6, 1912. This profile appears in the [list of U.S. state coats of arms](/symbols/coats-of-arms)."

sections:
- id: overview
  icon: fa-solid fa-shield-halved
  title: What Is the New Mexico Coat of Arms?
  paragraphs:
  - "The coat of arms centers on two eagles placed one above the other. A large American bald eagle spreads its wings at the top, covering and protecting the smaller Mexican eagle below. On the breast of the American eagle is a small shield bearing the colors of the United States flag: a blue chief at the top with red and white vertical stripes below."
  - "The design does not use shield supporters, a helmet, or a crest. Below the eagles, a ribbon scroll carries the state motto in Latin. Among U.S. state coat of arms designs, New Mexico's is one of the most historically specific, placing the entire arc of the state's political history into two birds and a single line of text."

- id: history
  icon: fa-solid fa-landmark
  title: History and Origin of the New Mexico Coat of Arms
  paragraphs:
  - "New Mexico was part of the Spanish empire until Mexico gained independence on September 27, 1821. For the next twenty-five years, New Mexico was a northern province of Mexico. That changed in August 1846, when U.S. General Stephen W. Kearny led his Army of the West into Santa Fe and declared the region under U.S. authority. The Treaty of Guadalupe Hidalgo, signed February 2, 1848, formally transferred the territory to the United States."
  - "Congress created the Territory of New Mexico on September 9, 1850, as part of the Compromise of 1850. The territorial legislature, meeting in the early 1850s, adopted a seal featuring the two-eagle composition: an American bald eagle above a Mexican eagle, with the motto Crescit Eundo on a scroll below. The design acknowledged the region's recent history under Mexico while marking its new status under the United States."
  - "The design remained in use through the entire territorial period. When New Mexico was admitted to the Union as the 47th state on January 6, 1912, the state legislature codified the composition as the official state coat of arms, carrying the territorial design forward without significant changes."

- id: symbols
  icon: fa-solid fa-shapes
  title: Symbols on the New Mexico Coat of Arms
  paragraphs:
  - "The New Mexico coat of arms uses two eagles and a motto scroll. Each element refers to a specific chapter of the state's political history."
  elements:
  - id: american-eagle
    name: The American Bald Eagle
    image: /images/coats-of-arms/new-mexico/elements/american-eagle.webp
    paragraphs:
    - "The large bald eagle at the top of the design spreads its wings wide, facing right. On its breast is a small shield with a blue band at the top and red and white vertical stripes below, representing the United States flag. The eagle's outstretched wings extend over and partially cover the smaller Mexican eagle below."
    - "The bald eagle is the national symbol of the United States. Its position above and around the Mexican eagle shows that the United States is the current governing authority over New Mexico."
  - id: mexican-eagle
    name: The Mexican Eagle
    image: /images/coats-of-arms/new-mexico/elements/mexican-eagle.webp
    paragraphs:
    - "The smaller eagle positioned below the American eagle is shown in the style of Mexico's national emblem. It stands on a nopal cactus and holds a serpent in its beak. This image originates from the Aztec legend of Tenochtitlan: the Mexica people's patron deity Huitzilopochtli instructed them to build their city where they found an eagle perched on a cactus devouring a snake. They found that sign on an island in Lake Texcoco, where they founded Tenochtitlan, now Mexico City."
    - "Mexico adopted this eagle as its national symbol after independence in 1821. By including it in the coat of arms, New Mexico preserved a visual record of the twenty-five years the region spent as part of Mexico before U.S. annexation."
  - id: motto
    name: Crescit Eundo
    image: /images/coats-of-arms/new-mexico/elements/motto.webp
    paragraphs:
    - "The motto Crescit Eundo appears on a scroll beneath the two eagles. It is Latin for It grows as it goes, a phrase drawn from De Rerum Natura, a philosophical poem by the Roman author Lucretius. The original line described how a thunderbolt grows stronger as it travels."
    - "New Mexico adopted the phrase as its territorial motto, and it was retained as the official state motto when the legislature codified the coat of arms at statehood in 1912."

- id: meaning
  icon: fa-solid fa-book-open
  title: Meaning of the New Mexico Coat of Arms
  paragraphs:
  - "The two-eagle design compresses more than two centuries of New Mexico's political history into a single image. The Mexican eagle below shows that New Mexico was governed by Mexico from 1821 to 1846. The American eagle above it shows that the United States took control in 1846 and formalized that authority through the Territory of New Mexico in 1850, then statehood in 1912."
  - "The American eagle does not replace the Mexican eagle. It shields it. That arrangement reflected the reality of New Mexico's population at the time: the territory had a large Hispanic and Native population with deep roots in both Mexican and pre-Mexican culture. The design made that history visible rather than erasing it."
  - "The motto Crescit Eundo pointed forward. It described a territory still growing into what it would become. When New Mexico became a state after sixty-two years as a territory, the phrase remained accurate: the state kept the same image and the same direction."

- id: facts
  icon: fa-solid fa-lightbulb
  title: New Mexico Coat of Arms Facts
  facts:
  - "New Mexico became the 47th state on January 6, 1912. The coat of arms was codified at statehood from the existing territorial seal design."
  - "The Mexican eagle on the design, shown perched on a nopal cactus while holding a serpent, is the same symbol used on the Mexican national flag today."
  - "The motto Crescit Eundo comes from De Rerum Natura by the Roman poet Lucretius and translates as It grows as it goes."
  - "New Mexico was under Mexican rule from 1821 to 1846, a period of twenty-five years. The two-eagle design was created specifically to mark that transition from Mexican to U.S. authority."
  - "The Territory of New Mexico was established by Congress on September 9, 1850, as part of the Compromise of 1850. The territorial legislature adopted the two-eagle composition in the early 1850s."

- id: earlier_versions
  icon: fa-solid fa-clock-rotate-left
  title: Previous Versions of the New Mexico Coat of Arms
  paragraphs:
  - "Surviving territorial-era renderings show that New Mexico's dual-eagle arms were already established before statehood. The core composition remained stable: a larger American eagle above a smaller Mexican eagle with serpent and cactus, with Crescit Eundo below."
  - "The territorial legislature formally adopted the same seal and coat of arms in 1887, and New Mexico carried that design into statehood on January 6, 1912 with only the outer seal wording updated from territory to state."
  versions:
  - name: Illustrated Territorial Arms
    years: "1876"
    image: /images/coats-of-arms/new-mexico/versions/territorial-1876.webp
    description: A documented 1876 illustrated rendering of the New Mexico territorial coat of arms published in Henry Mitchell's The State Arms of the Union. It already shows the mature dual-eagle composition with the Crescit Eundo ribbon below.
  - name: Official State Standard
    years: "1912-present"
    image: /images/coats-of-arms/new-mexico/versions/current-standard.webp
    description: The official New Mexico coat of arms as used at statehood and thereafter. The state version preserves the same dual-eagle arrangement inherited from the territorial era and matches the composition used in the article hero image and element crops.

faq:
- question: What does the New Mexico coat of arms show?
  answer: "The New Mexico coat of arms shows two eagles stacked vertically. A large American bald eagle spreads its wings over a smaller Mexican eagle. The Mexican eagle is perched on a nopal cactus while holding a serpent. A scroll below the eagles carries the state motto Crescit Eundo."
- question: What does the Mexican eagle on the coat of arms mean?
  answer: "The Mexican eagle, shown perched on a cactus while holding a serpent, represents New Mexico's history as part of Mexico from 1821 to 1846. Mexico used this same eagle as its national symbol after independence from Spain. The image traces back to the Aztec founding legend of Tenochtitlan."
- question: What does the New Mexico coat of arms motto mean?
  answer: "The motto Crescit Eundo is Latin for It grows as it goes. It comes from De Rerum Natura by the Roman poet Lucretius. New Mexico adopted it during the territorial period and kept it as the official state motto at statehood in 1912."
- question: When was the New Mexico coat of arms adopted?
  answer: "The coat of arms was officially codified when New Mexico became a state on January 6, 1912. The same two-eagle design had been used by the Territory of New Mexico since the early 1850s."
- question: What is the difference between the New Mexico coat of arms and the state seal?
  answer: "The state seal includes the coat of arms design surrounded by a circular border with the state name and year of admission. The coat of arms shows only the two-eagle composition and the motto scroll, without the border text of the seal."
- question: Why does New Mexico have a Mexican eagle on its coat of arms?
  answer: "New Mexico was part of Mexico from 1821 to 1846. When the United States took control of the territory in 1846, the region had strong ties to Mexican culture and history. The coat of arms preserved that history by placing the Mexican eagle alongside the American one rather than replacing it."

