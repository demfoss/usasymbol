type: State Flower
state: New Mexico
name: Yucca Flower
scientific_name: Yucca glauca
adopted_year: 1927
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-05-01"
seo_title: "New Mexico State Flower | Yucca Flower"
seo_description: "New Mexico adopted the yucca as state flower in 1927. Its blooms depend on yucca moths, one of the desert's tightest pairings."

intro_text: "The yucca flower is New Mexico's official state flower, adopted on March 14, 1927. Creamy white bell-shaped blooms erupt on stalks up to 6 feet tall from spiky desert rosettes across New Mexico's landscape each May through July. Native peoples of the Southwest used every part of the yucca for thousands of years — fiber from the leaves for rope and sandals, roots for soap and shampoo, flowers and fruit for food. And in one of the most exclusive partnerships in the plant kingdom, the yucca is pollinated by a single family of moths and nothing else. Explore how it compares to other state flowers on the [list of U.S. state flowers](/symbols/flowers), or browse New Mexico's full symbols on the [New Mexico state hub](/states/new-mexico)."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of New Mexico"
    paragraphs:
      - "New Mexico recognizes the Yucca Flower as its state flower. Each bloom displays six waxy white petals arranged in a bell shape. The flowers measure 2 to 3 inches long. Dozens of flowers cluster along tall central stalks. A slight sweet fragrance attracts pollinators at night. The petals have a thick waxy texture."
      - "Yucca plants bloom from May through July across New Mexico. Peak flowering occurs in June throughout most desert regions. Individual flowers last several days. The flowering stalk can reach 3 to 6 feet tall. Sharp pointed leaves grow in dense rosettes at ground level. Leaves remain evergreen year-round with fiber along the edges."
      - "Native yucca species grow wild throughout New Mexico in diverse habitats. The plants thrive in dry sandy or rocky soil. Full sun and excellent drainage suit yuccas best. The hardy plants tolerate extreme heat and cold. Yuccas grow from low desert valleys to mountain foothills. Several yucca species occur naturally across New Mexico."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Yucca Flower"
    paragraphs:
      - "This flower carries the common name Yucca Flower and the scientific name Yucca glauca for one widespread New Mexico species. The plant belongs to the Asparagaceae family. This family includes agaves, asparagus, and several hundred other species worldwide."
      - "The genus name Yucca comes from a Taino word for cassava root. Early Spanish explorers confused yucca with cassava plants. The species name glauca means bluish-gray in Latin. It describes the leaf color. Common names include soapweed yucca and Spanish bayonet based on the sharp pointed leaves."
      - "New Mexico never specified which yucca species represents the state. The 1927 designation simply said yucca flower without naming a particular type. This allows all native New Mexico yucca species to serve as state symbols. Yucca glauca and Yucca elata appear most frequently across New Mexico landscapes."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "Why the Yucca Flower Became the New Mexico State Flower"
    paragraphs:
      - "New Mexico chose the Yucca Flower as its official state flower in 1927. The state legislature made this designation following advocacy by women's clubs. The New Mexico Federation of Women's Clubs campaigned actively for the yucca. School children participated in discussions about selecting a state flower."
      - "Yucca plants grew abundantly across New Mexico's diverse landscapes. The distinctive white flowers symbolized New Mexico's desert character. Native Americans had used yucca for thousands of years. The plant provided fibers for rope and baskets. Roots produced soap-like suds for washing. The relationship between yucca and yucca moth fascinated naturalists."
      - "Some people suggested desert wildflowers like Indian paintbrush or prickly pear cactus instead. Supporters of the yucca argued that no plant better represented New Mexico. The yucca's hardiness symbolized pioneer resilience. Its widespread presence made it recognizable statewide. The legislature passed the designation on March 14, 1927."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "New Mexico State Flower Facts"
    facts:
      - "Yucca flowers depend exclusively on yucca moths for pollination, with each yucca species having its own specific moth species in an ancient symbiotic relationship"
      - "Native Americans used yucca roots to make soap and shampoo, with the saponins in the roots producing natural suds when mixed with water"
      - "New Mexico adopted the Yucca Flower on March 14, 1927, following advocacy by the New Mexico Federation of Women's Clubs"
      - "Yucca flowers bloom at night and emit fragrance to attract yucca moths, which are the only insects capable of pollinating these plants"
      - "The sharp pointed leaves contain strong fibers that Native Americans extracted to make rope, sandals, baskets, and cloth for thousands of years"
      - "Some yucca plants can live for over 100 years, with the tall flowering stalk dying back after seed production while the plant survives"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "New Mexico State Flower and Bird"
    paragraphs:
      - "The Greater Roadrunner serves as New Mexico's state bird, a large ground-dwelling bird known for running at high speeds across the desert. Both symbols represent New Mexico officially. New Mexico adopted the Yucca Flower in 1927 and designated the Greater Roadrunner as state bird in 1949."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Yucca Flower Symbolizes"
    paragraphs:
      - "The Yucca Flower is often associated with New Mexico's desert heritage and Native American culture. The plant traditionally symbolizes protection and purification in indigenous traditions. Its hardy nature frequently represents resilience and adaptation while carrying connotations of the distinctive high desert landscape that defines New Mexico's character."

faq:
  - question: "What is New Mexico's state flower?"
    answer: "New Mexico's state flower is the yucca flower, a creamy white bell-shaped bloom that appears on yucca plants across the state's high desert landscape, adopted officially in 1927."

  - question: "What does the New Mexico state flower look like?"
    answer: "Yucca flowers are creamy white and bell-shaped, each about 2 to 3 inches long, clustered densely along a central stalk that can reach 3 to 6 feet tall. The petals are thick and waxy. The plants themselves have stiff, sword-like leaves arranged in a rosette at ground level, with sharp tips that can draw blood — earning the nickname Spanish bayonet."

  - question: "What did Native Americans use yucca for?"
    answer: "Native peoples of the Southwest used yucca for thousands of years before it became a state symbol. Strong fibers extracted from the leaves were woven into rope, sandals, baskets, and cloth. Roots were ground and mixed with water to produce a natural soap and shampoo. Flowers and young fruit were also eaten as food. The plant was essentially a hardware store and grocery store in one."
  
  - question: "When did New Mexico adopt the Yucca Flower as its state flower?"
    answer: "New Mexico adopted the Yucca Flower on March 14, 1927. The New Mexico Federation of Women's Clubs campaigned actively for this designation."
  
  - question: "Why did New Mexico choose the Yucca Flower?"
    answer: "New Mexico chose the Yucca Flower because yucca plants grew abundantly across the state's diverse landscapes. The distinctive white flowers symbolized New Mexico's desert character. Native Americans had used yucca for thousands of years for rope, baskets, and soap. The plant's hardiness represented pioneer resilience."
  
  - question: "How do yucca flowers get pollinated?"
    answer: "Yucca flowers depend exclusively on yucca moths for pollination. Each yucca species has its own specific moth species. The flowers bloom at night and emit fragrance to attract these moths, which are the only insects capable of pollinating yucca plants."
  
  - question: "When do yucca flowers bloom in New Mexico?"
    answer: "Yucca plants bloom from May through July in New Mexico, with peak flowering occurring in June. Individual flowers last several days, and the tall flowering stalk can reach 3 to 6 feet tall."

