type: State Flower
state: Kansas
name: Sunflower
scientific_name: Helianthus annuus
adopted_year: 1903
is_official: true

author: "USA Symbol Team"
date_published: "2025-12-10"
date_modified: "2026-03-12"
seo_title: "Kansas State Flower | Sunflower"
seo_description: "The Sunflower became Kansas's state flower in 1903. These tall yellow flowers bloom across Kansas prairies and fields each summer."

intro_text: "Kansas chose the Sunflower as its state flower in 1903. These towering yellow flowers bloom across prairies and fields throughout Kansas. The Sunflower earned Kansas the nickname Sunflower State long before official adoption and appears alongside [the Western Meadowlark](/states/kansas/bird/western-meadowlark) in many prairie habitats."

sections:
  - id: what-is
    icon: "fa-solid fa-circle-info"
    title: "Official State Flower of Kansas"
    paragraphs:
      - "The Sunflower holds the position of Kansas's official state flower. Each flower head contains dozens of bright yellow petals surrounding a dark center disk. The blooms measure 3 to 6 inches across in wild plants. Cultivated varieties produce heads up to 12 inches wide. A single flower head can contain over 1,000 seeds."
      - "Wild sunflowers bloom from July through September across Kansas. Peak flowering occurs in August when fields turn golden yellow. Plants reach heights of 3 to 10 feet depending on growing conditions. Tall sturdy stalks support the heavy flower heads. Rough hairy leaves grow alternately along the stem. The flower heads track the sun across the sky during growth."
      - "Native sunflowers grow throughout Kansas in prairies, roadsides, and disturbed ground. The plants tolerate drought and poor soil. Full sun produces the strongest growth. Kansas farmers also cultivate sunflowers as a commercial crop. Fields of domestic sunflowers cover thousands of acres, often near riparian zones with [Kansas cottonwoods](/states/kansas/tree/cottonwood). The oil-rich seeds serve multiple agricultural and food purposes."

  - id: name
    icon: "fa-solid fa-tag"
    title: "About the Sunflower"
    paragraphs:
      - "Known as Sunflower, this plant's scientific designation is Helianthus annuus. The species belongs to the Asteraceae family. This massive family includes daisies, asters, and over 23,000 species of flowering plants worldwide."
      - "The genus name Helianthus comes from Greek words meaning sun and flower. The species name annuus indicates the plant completes its life cycle in one year. Sunflowers die after producing seeds in fall. New plants grow from seeds the following spring."
      - "Native Americans cultivated sunflowers for food thousands of years before European contact. They developed varieties with larger seeds and flower heads. Spanish explorers took sunflower seeds to Europe in the 1500s. Russia became a major sunflower producer. Modern commercial varieties trace ancestry to both native American and Russian breeding programs."

  - id: history
    icon: "fa-solid fa-landmark"
    title: "How Kansas Chose the Sunflower"
    paragraphs:
      - "Kansas selected the Sunflower as its official state flower in 1903. The Kansas legislature passed this designation without a formal public vote. Sunflowers already symbolized Kansas in popular culture. The state earned the nickname Sunflower State decades before official adoption, and similar designations are grouped on the [list of U.S. state flowers](/symbols/flowers)."
      - "Kansas residents strongly associated their state with sunflowers. Wild sunflowers bloomed abundantly across Kansas prairies each summer. The tall yellow flowers dominated the landscape. Visitors to Kansas commented on vast expanses of sunflowers. Artists and photographers featured sunflowers in works about Kansas."
      - "No competing flowers received serious consideration during the selection process. The decision seemed obvious to lawmakers. Some debate occurred over whether to specify wild or cultivated sunflowers. The legislature chose not to distinguish between varieties. Both native and domestic sunflowers represent Kansas equally. The designation became official on March 3, 1903."

  - id: facts
    icon: "fa-solid fa-lightbulb"
    title: "Kansas State Flower Facts"
    facts:
      - "Kansas produces over 100 million pounds of sunflower seeds annually, making it one of the top sunflower-growing states in America"
      - "Sunflower heads follow the sun from east to west during the day in young plants, a behavior called heliotropism that stops once flowers mature"
      - "Kansas adopted the Sunflower on March 3, 1903, formalizing a symbol that had represented the state unofficially for decades"
      - "Native Americans domesticated sunflowers over 4,000 years ago, making it one of the few major crops native to North America"
      - "A single sunflower head can produce between 1,000 and 2,000 seeds depending on variety and growing conditions"
      - "Sunflower seeds contain high levels of vitamin E, healthy fats, and protein, serving as both human food and livestock feed in Kansas agriculture"

  - id: flower-and-bird
    icon: "fa-solid fa-dove"
    title: "Kansas State Flower and Bird"
    paragraphs:
      - "The Western Meadowlark serves as Kansas's state bird, a grassland songbird with distinctive yellow breast and melodious call. Both symbols represent Kansas officially. Kansas adopted the Sunflower in 1903 and designated the Western Meadowlark as state bird in 1937."

  - id: symbolism
    icon: "fa-solid fa-heart"
    title: "What the Sunflower Symbolizes"
    paragraphs:
      - "The Sunflower is often associated with Kansas's agricultural heritage and prairie landscape. The flower traditionally symbolizes loyalty and adoration due to its tendency to face the sun. Its bright yellow color frequently represents optimism and the golden wheat and grain fields that define Kansas agriculture, complementing the resilience theme in [Ad Astra per Aspera](/states/kansas/motto/ad-astra-per-aspera)."

  - id: "regional-context"
    icon: "fa-solid fa-map-location-dot"
    title: "Regional Context"
    paragraphs:
      - "Sunflower bloom patterns and prairie conditions are easier to compare with nearby states via [States Neighboring States](/rankings/geography/states-neighboring-states)."

faq:
  - question: "What is Kansas's state flower?"
    answer: "Kansas's state flower is the Sunflower, a tall yellow flower with dark center that blooms across prairies and fields throughout the state."
  
  - question: "When did Kansas adopt the Sunflower as its state flower?"
    answer: "Kansas adopted the Sunflower on March 3, 1903. The designation formalized a symbol that had represented Kansas unofficially for many years."
  
  - question: "Why did Kansas choose the Sunflower?"
    answer: "Kansas chose the Sunflower because wild sunflowers bloomed abundantly across the state's prairies and the flower already symbolized Kansas in popular culture. The state had earned the nickname Sunflower State decades before official adoption. No other flower received serious consideration."
  
  - question: "Are sunflowers native to Kansas?"
    answer: "Yes, wild sunflowers are native to Kansas and grow naturally throughout the state's prairies, roadsides, and disturbed ground. Native Americans domesticated sunflowers over 4,000 years ago, making it one of the few major crops native to North America."
  
  - question: "When do sunflowers bloom in Kansas?"
    answer: "Wild sunflowers bloom from July through September in Kansas, with peak flowering occurring in August. Commercial sunflower crops bloom at similar times depending on planting dates and variety."

