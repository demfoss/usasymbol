- id: facts
  icon: fa-solid fa-lightbulb
  title: Pteranodon Facts
  facts:
  - "Kansas designated Pteranodon longiceps as its state flying fossil in 2014, the only state to create a separate flying fossil category."
  - "O.C. Marsh named Pteranodon in 1876 from Kansas chalk specimens collected during the Bone Wars rivalry with E.D. Cope."
  - "Despite a wingspan up to 23 feet, Pteranodon weighed only about 50 pounds, less than most adult humans, thanks to hollow bones."
  - "Pteranodon means 'wing without tooth.' It was the first pterosaur discovered to have no teeth, with a long beak built for snatching fish instead."
  - "Hundreds of Pteranodon specimens have been found in Kansas, making the state's Niobrara Chalk the most productive Pteranodon site in the world."

