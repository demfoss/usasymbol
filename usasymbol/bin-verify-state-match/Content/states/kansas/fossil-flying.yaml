faq:
- question: What is Kansas's state flying fossil?
  answer: "Kansas's state flying fossil is Pteranodon (Pteranodon longiceps), a large toothless pterosaur designated by the Kansas legislature in 2014. Kansas is the only state with a separate flying fossil designation."
- question: When did Kansas adopt its state flying fossil?
  answer: "Kansas designated Pteranodon longiceps as its state flying fossil in 2014, at the same time it adopted Tylosaurus kansasensis as its state marine fossil."
- question: What did the Pteranodon look like?
  answer: "Pteranodon longiceps had a wingspan up to 23 feet and a long, swept-back bony crest on the back of its head. It had a narrow, toothless beak and hollow bones, and weighed about 50 pounds despite its large size."
- question: Where are Pteranodon fossils found in Kansas?
  answer: "Pteranodon fossils come from the Niobrara Chalk of western Kansas, particularly in Logan, Gove, Trego, and Ellis counties. Monument Rocks in Gove County is the most prominent chalk exposure in the region. The Sternberg Museum of Natural History in Hays holds the largest Kansas collection."
- question: When did the Pteranodon live?
  answer: "Pteranodon longiceps lived during the Late Cretaceous, roughly 86 to 84 million years ago. It went extinct about 66 million years ago at the end of the Cretaceous period."
- question: Who pushed to make Pteranodon Kansas's state flying fossil?
  answer: "Kansas paleontologists and the Sternberg Museum of Natural History in Hays supported the 2014 designations. The legislature created the flying fossil and marine fossil categories at the same time, recognizing Kansas's exceptional Cretaceous fossil record."

