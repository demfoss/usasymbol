seo:
  title: "Most Common Last Names in Montana"
  description: "The most common last names in Montana are Johnson, Smith, and Anderson, with Hi-Line homesteading pushing Scandinavian surnames unusually high."

page:
  h1: "Most Common Last Names in Montana"
  intro: "After the Enlarged Homestead Act of 1909, Scandinavian homesteaders pushed Anderson to No. 3 in Montana, behind only Johnson and Smith. Mining camps, cattle country, and later wheat settlements left Montana with a surname mix that looks more Upper Midwestern than many Western states."
  heritage_title: "Homesteaders, Copper Camps, and the Hi-Line"
  heritage_body: "Montana's modern surname ranking was shaped by two major settlement surges after Native homelands had already been broken apart by conquest, treaty, and federal policy. Gold strikes at Bannack, Virginia City, and Helena in the 1860s, then Butte's copper boom in the 1880s, drew English, Irish, Cornish, and other mining families into the territory. Railroads crossing the state in the 1880s opened the plains to larger-scale settlement, and the Enlarged Homestead Act of 1909 brought tens of thousands of farm families into north-central and northeastern Montana. That later boom helps explain why Johnson, Anderson, Nelson, Peterson, Olson, Larson, and Hanson all sit so high in Montana's top 20."
  fun_fact: "Lozeau is one of Montana's most concentrated surnames: a former Mineral County community took the name after Adolph and Louise Lozeau, who built a trading post on the Mullan Road in the mid-1860s."

