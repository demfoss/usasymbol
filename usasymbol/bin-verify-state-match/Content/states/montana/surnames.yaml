unique_surnames:
  - name: Lozeau
    state_rank: 760
    national_rank: 158810
    origin: french
    why: "Lozeau is a French Canadian surname strongly tied to Montana's early western frontier. Montana History Portal notes that Adolph and Louise Lozeau built a trading post on the Mullan Road in the mid-1860s, and a Mineral County community later carried their name."

  - name: Berthelote
    state_rank: 882
    national_rank: 262771
    origin: french
    why: "Berthelote is a rare French surname that appears in Montana far more than national rank alone would suggest. Its survival fits the long French Canadian and borderland presence that entered Montana through the fur trade, river traffic, and later northern-plains settlement."

  - name: Berges
    state_rank: 228
    national_rank: 17139
    origin: french
    why: "Berges is unusually visible in Montana for a surname of French and Pyrenean origin. That pattern fits the sheep and mining economies, both of which drew workers from southern France, Spain, and nearby Basque country into the Inland West."

  - name: Hardisty
    state_rank: 228
    national_rank: 15764
    origin: english
    why: "Hardisty is a Yorkshire habitational surname that overperforms in Montana. Its rank suggests how many smaller British-origin family names took root in stock-growing and rail-linked communities instead of being submerged by larger national surnames."

  - name: Aspling
    state_rank: 882
    national_rank: 232921
    origin: scandinavian
    why: "Aspling is a rare Scandinavian surname, and Montana is one of the few places where it appears at all in public surname rankings. That makes it a small but vivid trace of the same Scandinavian homestead migration that pushed Johnson, Olson, Larson, and Hanson so high statewide."

etymology_groups:
  - type: Occupational Names
    icon: fa-solid fa-hammer
    description: "Four of Montana's top 20 are straightforward work names: Smith, Miller, Clark, and Taylor. That is a good fit for a state built by mining camps, railroad towns, and farm service centers, where trade surnames spread early and never disappeared."
    examples:
      - Smith (metalworker)
      - Miller (grain miller)
      - Clark (clerical worker)
      - Taylor (tailor)

  - type: Patronymic Names
    icon: fa-solid fa-person
    description: "Patronymics dominate Montana's list. Johnson, Anderson, Williams, Nelson, Jones, Peterson, Davis, Thompson, Olson, Wilson, Larson, Hanson, and Thomas all descend from a father's given name, and the Scandinavian share is especially strong because the 1909 homestead boom drew many Nordic families onto the northern plains."
    examples:
      - Johnson (son of John)
      - Anderson (son of Anders)
      - Peterson (son of Peter)
      - Olson (son of Ole)

  - type: Place-Based Borderland Names
    icon: fa-solid fa-map-location-dot
    description: "Montana's most distinctive surnames often sit below the top 20 and point to older borderland histories rather than mass national trends. French Canadian and mountain-route names such as Lozeau, Berthelote, and Berges preserve traces of trading-post, mining, and sheep-country migrations that were highly local."
    examples:
      - Lozeau (French Canadian family name)
      - Berthelote (French family name)
      - Berges (Pyrenean or French place-based surname)

faq:
  - question: "What is the most common last name in Montana?"
    answer: "Johnson is the most common last name in Montana in this dataset, with Smith second and Anderson third. That ranking is unusual because many states put Smith first, but Montana's strong Scandinavian settlement pushed Johnson and Anderson higher than you might expect."

  - question: "What are the most common last names in Montana?"
    answer: "The most common last names in Montana are Johnson, Smith, Anderson, Miller, and Brown. The full top 20 also includes several Scandinavian patronymics such as Nelson, Peterson, Olson, Larson, and Hanson."

  - question: "Why are Scandinavian last names so common in Montana?"
    answer: "They are so common because Montana's northern plains were heavily settled during the railroad and homesteading era, especially after the Enlarged Homestead Act of 1909. Many of those settlers came from Scandinavian communities in the Upper Midwest or directly from Europe, which lifted surnames like Johnson, Anderson, Nelson, Peterson, Olson, and Larson well above their national standing."

