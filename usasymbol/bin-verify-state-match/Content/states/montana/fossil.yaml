intro_text: "Montana's state fossil is the Maiasaura (Maiasaura peeblesorum), a duck-billed dinosaur adopted in 1985 whose nesting colony at Egg Mountain near Choteau is one of the most important dinosaur fossil sites in North America. This profile appears in the [list of U.S. state fossils](/symbols/fossils)."

sections:
- id: overview
  icon: fa-solid fa-bone
  title: Montana State Fossil
  paragraphs:
  - "Maiasaura peeblesorum is a hadrosaur, a large duck-billed herbivorous dinosaur from the Late Cretaceous of Montana. Its name means 'good mother lizard,' a reference to the nests, eggs, and hatchlings found alongside adults at its discovery site, evidence that strongly suggested it cared for its young after hatching."
  - "The Egg Mountain site near Choteau, where thousands of Maiasaura specimens were recovered, changed how scientists think about dinosaur behavior. Before this discovery, most researchers assumed dinosaurs abandoned their eggs the way modern reptiles do."

- id: about
  icon: fa-solid fa-paw
  title: What the Maiasaura Was
  paragraphs:
  - "Maiasaura peeblesorum grew up to 30 feet (9 m) long and weighed roughly 4 tons. It had a broad, duck-like bill for cropping plants, a flat head without the elaborate crests seen in some other hadrosaurs, and four sturdy limbs that let it walk on two legs or all four. Fossilized gut contents confirm it ate leaves, seeds, and other plant material from the forests and floodplains of Late Cretaceous Montana."
  - "Maiasaura lived in large herds. Bone beds at Egg Mountain contain the remains of thousands of individuals, likely killed together by a volcanic event. Multiple nesting seasons at the same site suggest it returned to the same grounds year after year, much like some migratory birds today. The species went extinct 66 million years ago in the end-Cretaceous mass extinction."

- id: history
  icon: fa-solid fa-landmark
  title: How the Maiasaura Became Montana's State Fossil
  paragraphs:
  - "The story of Maiasaura begins with Marion Brandvold, who ran a rock and fossil shop in Bynum, Montana. In 1978 she found small, unusual dinosaur bones and brought them to paleontologist Jack Horner, then working at Princeton's natural history museum. Horner and colleague Bob Makela traveled to the site, found a nest full of juvenile hadrosaurs, and recognized they were looking at something entirely new: a dinosaur that had been feeding its hatchlings in the nest."
  - "Horner and Makela formally described the species in the journal Nature in 1979, naming it Maiasaura peeblesorum, the 'good mother lizard' of the Peebles family, who owned the land. Montana schoolchildren campaigned for the designation, and the legislature officially adopted Maiasaura peeblesorum as the state fossil in 1985."

- id: location
  icon: fa-solid fa-map-location-dot
  title: Where Maiasaura Fossils Are Found in Montana
  paragraphs:
  - "Egg Mountain, a low ridge in Teton County west of Choteau, is the discovery site and remains the most productive Maiasaura locality in the world. Excavations there have uncovered thousands of bones along with nests, eggs, and hatchlings from the Two Medicine Formation. The site is on private land but can be visited through organized digs run by the Old Trail Museum in Choteau, which has partnered in fieldwork since the early 1980s."
  - "Maiasaura fossils also appear at other outcrops of the Two Medicine Formation, which stretches across north-central Montana from the Sweetgrass Hills to the Front Range of the Rockies. The Museum of the Rockies in Bozeman holds one of the largest Maiasaura collections in the country, including complete skulls and a growth series from hatchling to adult."
