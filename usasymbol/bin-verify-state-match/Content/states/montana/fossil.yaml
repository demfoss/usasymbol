faq:
- question: What is Montana's state fossil?
  answer: "Montana's state fossil is the Maiasaura (Maiasaura peeblesorum), a large duck-billed dinosaur from the Late Cretaceous, designated in 1985."
- question: When did Montana adopt its state fossil?
  answer: "Montana adopted the Maiasaura as its state fossil in 1985, following a campaign by Montana schoolchildren."
- question: What did the Maiasaura look like?
  answer: "Maiasaura peeblesorum was up to 30 feet long and weighed about 4 tons. It had a broad, flat duck-like bill, a plain head without crests, and could walk on two or four legs."
- question: Where are Maiasaura fossils found in Montana?
  answer: "The main site is Egg Mountain near Choteau, in the Two Medicine Formation, where thousands of fossils including nests and eggs have been found. The Museum of the Rockies in Bozeman holds a major collection."
- question: When did the Maiasaura live?
  answer: "Maiasaura peeblesorum lived during the Late Cretaceous (Campanian), about 76 to 74 million years ago. It went extinct 66 million years ago in the end-Cretaceous mass extinction."
- question: Who pushed to make it the state fossil?
  answer: "Montana schoolchildren campaigned for the designation. The discovery itself began with Marion Brandvold, a fossil shop owner in Bynum, who found the first baby bones in 1978 and brought them to paleontologist Jack Horner."

