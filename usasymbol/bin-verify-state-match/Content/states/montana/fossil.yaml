- id: facts
  icon: fa-solid fa-lightbulb
  title: Maiasaura Facts
  facts:
  - "Montana designated Maiasaura peeblesorum its state fossil in 1985, following a campaign by Montana schoolchildren."
  - "The name Maiasaura means 'good mother lizard,' making it the first dinosaur named specifically for its parenting behavior."
  - "Egg Mountain has produced thousands of Maiasaura specimens, including complete growth series from hatchling to full-grown adult."
  - "In 1985, a Maiasaura bone and eggshell fragment were carried aboard a Space Shuttle mission, making it the first dinosaur fossil in space."
  - "Bone beds at Egg Mountain likely record a single catastrophic event, possibly a volcanic ashfall, that killed thousands of animals at once."

