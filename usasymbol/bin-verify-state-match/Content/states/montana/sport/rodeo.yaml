intro_text: "Montana's state sport is rodeo, adopted in 2025 and written into state law as American Rodeo. The designation put an official label on a tradition already proven by Red Lodge cowboy Bill Linderman, who won three world all-around titles decades before Montana ever wrote rodeo into its statutes."

