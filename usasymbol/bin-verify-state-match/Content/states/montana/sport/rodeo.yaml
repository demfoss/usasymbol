sections:
  - id: overview
    icon: fa-solid fa-trophy
    title: Montana State Sport
    paragraphs:
      - "Montana named rodeo its official state sport in 2025, making it the fourth state to grant rodeo that status after Texas, Wyoming, and South Dakota. Lawmakers pointed to a sport that had already shaped the state's ranching communities for more than a century, not a recent import chosen for popularity alone. Support reached across Montana's political spectrum, including the Montana American Indian Caucus and the state's full congressional delegation."

  - id: what-is
    icon: fa-solid fa-hat-cowboy
    title: "Rodeo in Montana"
    paragraphs:
      - "A gate swings open and a bareback rider bursts into the arena on a bucking horse, one hand gripping a leather rigging while the animal twists to throw them. Saddle bronc and bull riding follow the same eight-second clock, judged on control rather than simply staying mounted. Timed events change the picture: barrel racers cut tight turns around three barrels at a gallop, while calf ropers and steer wrestlers race the clock instead of an animal's temper."
      - "Montana hosts rodeos most weekends from spring through fall, from small-town arenas to the Red Lodge Home of Champions Rodeo each July and the Miles City Bucking Horse Sale each May. College rodeo thrives here too: Montana State University's Bobcat team ranks among the sport's strongest programs, producing national champions in both men's and women's competition."

  - id: why-chose
    icon: fa-solid fa-mountain
    title: Why Rodeo Represents Montana
    paragraphs:
      - "Rodeo grew out of the everyday work of Montana's cattle ranches, where riders broke horses and roped calves long before anyone scored the result. Ranch hands began competing informally at roundups and stockyards to settle who did the job best, and those contests hardened into organized events by the early 1900s. Montana chose rodeo because the sport never stopped being tied to the state's working ranches, not because it borrowed the idea from somewhere else."
      - "Red Lodge built the deepest claim to that tradition. Cowboys there gathered informally at railroad stockyards for bronc rides as early as the 1890s, and the town organized its rodeo in 1929. When local rider Bill Linderman won his third World All-Around Cowboy title in 1954, Red Lodge renamed its event the Home of Champions Rodeo, a name it still carries."
      - "Participation extends far beyond spectators. Montana State University's rodeo program has won nine national championships since 1972, and the state's high schools and small towns run rodeo circuits that put more residents in the arena than in the stands. That mix of ranch heritage, competitive success, and everyday participation gave lawmakers a case rodeo's rivals could not match."

  - id: adoption-history
    icon: fa-solid fa-clock-rotate-left
    title: How Rodeo Became Montana's State Sport
    paragraphs:
      - "Republican Representative Greg Overstreet introduced the legislation in the Montana House during the 2025 session, and Senator Wendy McKamey of Great Falls carried the bill through the Senate, where it passed by a wide bipartisan margin. The House gave final approval with only a handful of lawmakers opposed. Governor Greg Gianforte signed the bill into law that spring, making Montana the fourth state to designate rodeo as its official sport."
      - "Support crossed the usual dividing lines. The Montana American Indian Caucus backed the bill alongside the state's congressional delegation, while a small number of lawmakers objected that hunting draws more Montanans than rodeo does. An added amendment made the designation effective immediately rather than waiting for the new year."

  - id: facts
    icon: fa-solid fa-lightbulb
    title: Rodeo Facts
    facts:
      - "Montana designated rodeo its official state sport in 2025, becoming the fourth state to do so after Texas, Wyoming, and South Dakota."
      - "Red Lodge's rodeo traces to informal bronc rides at the town's railroad stockyards in the 1890s and became the Home of Champions Rodeo in 1954."
      - "Montana State University's Bobcat rodeo team has won nine national championships since 1972."
      - "The bill was introduced by Representative Greg Overstreet and carried through the Senate by Wendy McKamey of Great Falls."
      - "Montana's law names the sport American Rodeo, covering events from bull riding to barrel racing."

