faq:
  - question: What is Montana's state sport?
    answer: "Montana's official state sport is rodeo, adopted in 2025."
  - question: When did Montana adopt rodeo as its state sport?
    answer: "Montana adopted rodeo as its state sport in 2025, becoming the fourth state to do so after Texas, Wyoming, and South Dakota."
  - question: Why did Montana choose rodeo?
    answer: "Rodeo grew directly out of ranch work on Montana's cattle operations, and the state still runs one of the country's deepest rodeo circuits. Red Lodge's Home of Champions Rodeo and Montana State University's nine national championships backed the case."
  - question: Why is Red Lodge called the Home of Champions?
    answer: "Red Lodge earned the name in 1954 after local rider Bill Linderman won his third World All-Around Cowboy title. The town's rodeo has run every July since 1929."

