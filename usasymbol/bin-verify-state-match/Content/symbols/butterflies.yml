faq:
  - question: "What is the most common state butterfly?"
    answer: "Eastern tiger swallowtail and monarch butterfly tie as the most popular choice, each named by six states."

  - question: "Which butterfly is the rarest state symbol?"
    answer: "The Diana fritillary belongs to Arkansas alone. No other state has named it an official symbol."

  - question: "What is the oldest state butterfly designation?"
    answer: "California named the dogface butterfly its state insect in 1972, the earliest butterfly-species symbol adopted by any state."

  - question: "What is the newest state butterfly?"
    answer: "Maine adopted the pink-edged sulphur as its state butterfly in 2023."

  - question: "How many states have an official butterfly?"
    answer: "Thirty-one states recognize a butterfly species, either as a dedicated state butterfly or as their overall state insect."

  - question: "Do any states lack an official butterfly?"
    answer: "Nineteen states have not named one. Some chose a different type of insect entirely, and Iowa and Michigan have no state insect at all."

