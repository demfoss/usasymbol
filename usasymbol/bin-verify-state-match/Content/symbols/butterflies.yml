seo:
  title: "State Butterflies | Official List, Map & Facts"
  description: "Official state butterflies are listed by state, with scientific names, adoption years, and facts about why each was chosen."

page:
  h1: "List of State Butterflies"

  quick_answer:
    - "Thirty-one states name an official butterfly, either as a dedicated state butterfly or as their overall state insect."
    - "Eastern tiger swallowtail and monarch butterfly tie as the most common choice, each claimed by six states. Black swallowtail follows in New Jersey and Oklahoma."
    - "California named the dogface butterfly its state insect in 1972, the earliest butterfly symbol on record. Maine's pink-edged sulphur, adopted in 2023, is the newest."

  intro_paragraphs:
    - "Eastern tiger swallowtail, monarch, and black swallowtail dominate the list of state butterflies, together claimed by fourteen states. Legislatures often skip a separate butterfly category and simply name a butterfly species as the overall state insect, the path Texas and Illinois took with the monarch."
    - "Arkansas is the only state to claim the Diana fritillary as an official symbol. New Mexico picked the Sandia hairstreak, a butterfly found almost nowhere outside the Sandia Mountains. Maine's pink-edged sulphur became official in 2023, the newest addition to the list."

  sections:
    - id: butterflies-overview
      icon: fa-solid fa-bug
      title: State Butterflies by State
      paragraphs:
        - "Thirty-one states recognize an official butterfly, either through a dedicated state butterfly title or the broader state insect designation. California adopted the first butterfly species in 1972, and Maine added the newest dedicated state butterfly in 2023."
        - "Every row includes the common name, legal designation, adoption year, and a link to the state profile. Use the searchable table to compare monarchs, swallowtails, fritillaries, hairstreaks, sulphurs, and other official species."

    - id: common-choices
      icon: fa-solid fa-chart-simple
      title: Most Popular State Butterflies
      paragraphs:
        - "Monarch butterflies and eastern tiger swallowtails share first place with six states each. Black swallowtails rank next with New Jersey and Oklahoma, while every other species appears in one state."
        - "Regional ties shape many selections. New Mexico chose the Sandia hairstreak, Arkansas selected the Diana fritillary, and Hawaii named the Kamehameha butterfly. Those choices help the state butterfly list cover habitats from desert foothills to tropical forests."

  methodology: "Adoption years and designations are drawn from each state's official code or legislative record. Butterflies that hold a state's overall state insect title, rather than a separate state butterfly title, are included and labeled accordingly in the Designation column."

  sources:
    - name: "Wikipedia, List of U.S. state insects"
      url: "https://en.wikipedia.org/wiki/List_of_U.S._state_insects"
      description: "State butterfly and state insect designations with adoption years."

