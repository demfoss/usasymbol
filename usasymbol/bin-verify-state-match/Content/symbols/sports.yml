faq:
  - question: "What is Alaska's official state sport?"
    answer: "Alaska's official state sport is dog mushing, adopted in 1972. It reflects the state's history of sled-dog travel, winter survival, and long-distance trail culture."

  - question: "Which states have more than one official sport designation?"
    answer: "Several do. Hawaii recognizes surfing and outrigger canoe paddling. Maryland recognizes jousting, lacrosse, and walking. Massachusetts, Missouri, and Colorado also split the category into multiple sport or exercise designations."

  - question: "What is the newest official state sport?"
    answer: "Montana's rodeo designation from 2025 is one of the newest. Other recent additions include North Dakota curling in 2023 and Washington pickleball in 2022."

