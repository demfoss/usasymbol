faq:
  - question: "Who is the most famous musician from Texas?"
    answer: "George Strait represents Texas, having sent 44 songs to No. 1 on Hot Country Songs, more than any other act. Houston-born Beyoncé earns a shoutout too, with 2020's 'Black Parade.'"

  - question: "Who represents New York?"
    answer: "Billy Joel, born in the Bronx, represents New York. He edges out fellow native New Yorkers Christina Aguilera, Mariah Carey, Lady Gaga, Jay-Z, and Alicia Keys."

  - question: "Why is Prince the pick for Minnesota instead of Bob Dylan?"
    answer: "Both are Minnesota natives, but Prince gets the nod because his film Purple Rain was shot almost entirely in Minneapolis, cementing the city's sound in 1980s pop culture."

  - question: "Is it the Beach Boys or Katy Perry representing California?"
    answer: "The Beach Boys represent California. They sang about wishing 'they all could be California girls' 45 years before Santa Barbara native Katy Perry released 'California Gurls' in 2010."

  - question: "Which state does Elvis Presley represent?"
    answer: "Elvis Presley, known as the King of Rock & Roll, represents Mississippi. His catalog includes 109 Hot 100 hits, and he holds the record for the most charted albums in Billboard 200 history."

  - question: "Is Indiana's pick Michael Jackson or John Mellencamp?"
    answer: "Michael Jackson, born in Gary, represents Indiana. John Mellencamp, born in nearby Seymour, whose population is about 17,500, was the runner-up."

