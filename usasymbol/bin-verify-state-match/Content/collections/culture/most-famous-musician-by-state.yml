seo:
  title: "Most Famous Musician From Every State"
  description: "One musician represents each U.S. state, from Elvis Presley in Mississippi to Billy Joel in New York and Prince in Minnesota."

hero_image: "/images/collections/culture/most-famous-musician-by-state/hero.jpg"
hero_image_alt: "Collage of iconic American musicians representing all 50 U.S. states"
hero_image_caption: "One artist represents every U.S. state, from Elvis Presley in Mississippi to Dolly Parton in Tennessee and the Beach Boys in California."

page:
  h1: "Most Famous Musician From Every State"
  intro_title: "One Iconic Artist for Every State in the Union"

  quick_answer:
    - "Elvis Presley represents Mississippi, with 109 Hot 100 hits and more charted albums than any other artist in Billboard 200 history."
    - "Ray Charles represents Georgia, whose 1960 hit 'Georgia On My Mind' became the state's official song in 1979. Dolly Parton represents Tennessee, with 25 Hot Country Songs No. 1s, the most of any female artist in the chart's history."
    - "The Beach Boys represent California, George Strait represents Texas with 44 Hot Country Songs No. 1s, the most of any act, and Prince represents Minnesota over fellow native Bob Dylan."
    - "Michael Jackson represents Indiana, born in Gary, edging out John Mellencamp, whose 'Small Town' hit famously references his hometown of Seymour."

  methodology: "Billboard staff chose one artist or group to represent each U.S. state, based primarily on birthplace or, for groups and early movers, the state where they spent their formative years. The picks are editorial judgment informed by chart history, not a strict statistical formula."

  sources:
    - name: "Billboard. Top 50 Music Stars of the 50 States"
      url: "https://www.billboard.com/photos/top-50-music-stars-of-the-50-states-428841/"
      description: "Billboard staff picks for the artist or group that best represents each of the 50 U.S. states, chosen primarily by birthplace or formative years and informed by chart history"

expert_quote:
  text: "Please note that all selections are not based on strict Billboard chart methodology, but opinion, although chart history was strongly considered."
  source: "Billboard staff, introduction to the feature"

sections:
  - id: "artist-by-state"
    icon: "fa-solid fa-music"
    style: "law-cards"
    title: "Most Famous Musician From Every State"
    paragraphs:
      - "Some states were an easy call. Alabama for the band Alabama and Georgia for Ray Charles need no explanation. Others came down to a close call between two or three legends who could just as easily have taken the title."
    highlights:
      - name: "Alabama: Alabama"
        image: "/images/collections/culture/most-famous-musician-by-state/alabama.jpg"
        description: "The band Alabama shares its home state's name and has banked 33 Hot Country Songs No. 1s, the most of any group. Its most recent chart-topper came in 2011, its first since 1993, via a guest turn on Brad Paisley's 'Old Alabama.'"

      - name: "Alaska: Jewel"
        image: "/images/collections/culture/most-famous-musician-by-state/alaska.jpg"
        description: "Jewel was born in Utah, but her family moved to Homer, Alaska, into a home without indoor plumbing. In a 2010 interview with Larry King, she called Alaska women 'can-do women' and said she loves the state she calls home."

      - name: "Arizona: Jimmy Eat World"
        image: "/images/collections/culture/most-famous-musician-by-state/arizona.jpg"
        description: "Jimmy Eat World formed in Mesa. Its 2001 album Bleed American placed four songs in the Alternative Airplay top 20, including the No. 1 hit 'The Middle.'"

      - name: "Arkansas: Johnny Cash"
        image: "/images/collections/culture/most-famous-musician-by-state/arkansas.jpg"
        description: "Johnny Cash, the Man in Black, was born in Kingsland. He topped the Billboard 200 as recently as 2006, three years after his death, and won new audiences late in his career with his cover of Nine Inch Nails' 'Hurt.'"

      - name: "California: The Beach Boys"
        image: "/images/collections/culture/most-famous-musician-by-state/california.jpg"
        description: "California has produced stars from Frank Zappa to Santa Barbara's Katy Perry, whose 'California Gurls' topped charts in 2010. The Beach Boys get the nod because they wished 'they all could be California girls' 45 years before Perry's song."

      - name: "Colorado: John Denver"
        image: "/images/collections/culture/most-famous-musician-by-state/colorado.jpg"
        description: "John Denver was born Henry John Deutschendorf Jr. in Roswell, New Mexico. His songs, including 'Rocky Mountain High,' made his adopted name as much a part of Colorado as its mountains."

      - name: "Connecticut: John Mayer"
        image: "/images/collections/culture/most-famous-musician-by-state/connecticut.jpg"
        description: "John Mayer takes a slight edge over fellow Connecticut native Michael Bolton, of New Haven. Mayer's 'No Such Thing' evokes his alma mater, Fairfield High School."

      - name: "Delaware: George Thorogood"
        image: "/images/collections/culture/most-famous-musician-by-state/delaware.jpg"
        description: "Wilmington-born guitarist George Thorogood's Greatest Hits: 30 Years of Rock spent 57 weeks atop Billboard's Blues Albums chart, more than any other album in the chart's history."

      - name: "Florida: Gloria Estefan"
        image: "/images/collections/culture/most-famous-musician-by-state/florida.jpg"
        description: "Gloria Estefan, born in Havana, Cuba, and raised in Miami, has placed 29 titles on the Hot 100 and 30 on Hot Latin Songs, including 15 No. 1s. Her Miami sound has moved fans since the 1980s, ahead of fellow Florida stars Flo Rida, Ariana Grande, and the Backstreet Boys."

      - name: "Georgia: Ray Charles"
        image: "/images/collections/culture/most-famous-musician-by-state/georgia.jpg"
        description: "Ray Charles's 'Georgia On My Mind' topped the Hot 100 in 1960 and became Georgia's official state song in 1979. Georgia is also home to R.E.M., the B-52s, and Indigo Girls, but Charles's song made the connection official."

      - name: "Hawaii: Bruno Mars"
        image: "/images/collections/culture/most-famous-musician-by-state/hawaii.jpg"
        description: "Bruno Mars was born in the Waikiki neighborhood of Honolulu. His 'Just the Way You Are' spent 20 weeks atop Adult Contemporary, the longest-reigning debut format hit in the chart's 50-year history, and Mark Ronson's 'Uptown Funk!,' featuring Mars, ruled the Hot 100 for 14 weeks in 2015."

      - name: "Idaho: Paul Revere and the Raiders"
        image: "/images/collections/culture/most-famous-musician-by-state/idaho.jpg"
        description: "Paul Revere and the Raiders formed in Boise and notched 21 Hot 100 hits between 1961 and 1973, including the 1971 No. 1 'Indian Reservation (The Lament of the Cherokee Reservation Indian).'"

      - name: "Illinois: Chicago"
        image: "/images/collections/culture/most-famous-musician-by-state/illinois.jpg"
        description: "Originally named Chicago Transit Authority, the band Chicago has sent 46 songs to the Hot 100, 20 of them into the top 10. Even after lead singer Peter Cetera's departure, 'Look Away,' sung by Bill Champlin, ranked as Billboard's top single of 1989."

      - name: "Indiana: Michael Jackson"
        image: "/images/collections/culture/most-famous-musician-by-state/indiana.jpg"
        description: "Michael Jackson was born in Gary, Indiana. He edges out fellow Hoosier John Mellencamp, born in nearby Seymour, whose hit 'Small Town' made his hometown of roughly 17,500 people a recurring theme in his music."

      - name: "Iowa: The Everly Brothers"
        image: "/images/collections/culture/most-famous-musician-by-state/iowa.jpg"
        description: "The Everly Brothers' family settled into the Shenandoah, Iowa, music scene, where their father Ike brought them to sing on his KMA and KFNF radio shows. Their harmonies went on to influence The Beatles and The Beach Boys."

      - name: "Kansas: Kansas"
        image: "/images/collections/culture/most-famous-musician-by-state/kansas.jpg"
        description: "The band Kansas, formed in Topeka, is known for enduring hits 'Carry On Wayward Son' and 'Dust in the Wind.' It edges out Sharon-born Martina McBride, who has placed 55 titles on Hot Country Songs since her 1992 chart debut."

      - name: "Kentucky: Loretta Lynn"
        image: "/images/collections/culture/most-famous-musician-by-state/kentucky.jpg"
        description: "Loretta Lynn, the coal miner's daughter, was born in Butcher Holler, Kentucky. Runners-up in the state's musical derby are the Judds, Naomi and Wynonna, who both hail from Ashland."

      - name: "Louisiana: Louis Armstrong"
        image: "/images/collections/culture/most-famous-musician-by-state/louisiana.jpg"
        description: "Louis Armstrong, Satchmo, came out of New Orleans, the city synonymous with jazz. He crossed over to mainstream audiences as early as the 1920s and broke racial barriers through the power of his music."

      - name: "Maine: Patty Griffin"
        image: "/images/collections/culture/most-famous-musician-by-state/maine.jpg"
        description: "Folk singer-songwriter Patty Griffin was born in Old Town, Maine. She has two Grammys to her name and has been covered by artists including The Chicks and Bette Midler."

      - name: "Maryland: Toni Braxton"
        image: "/images/collections/culture/most-famous-musician-by-state/maryland.jpg"
        description: "Toni Braxton, from Severn, has scored five No. 1s on Top R&B/Hip-Hop Albums and 11 top 10s on Hot R&B/Hip-Hop Songs. Nearly 30 years after her chart debut, 'Do It' became her 14th top-five single on the Adult R&B Songs chart."

      - name: "Massachusetts: Aerosmith"
        image: "/images/collections/culture/most-famous-musician-by-state/massachusetts.jpg"
        description: "Aerosmith, the 'Bad Boys from Boston,' has racked up 28 Hot 100 hits since 1973. That record bests fellow Massachusetts acts Boston, The Cars, Dropkick Murphys, New Kids on the Block, Donna Summer, and James Taylor."

      - name: "Michigan: Madonna"
        image: "/images/collections/culture/most-famous-musician-by-state/michigan.jpg"
        description: "Madonna was born in Bay City, Michigan, graduated from Rochester Adams High School, and attended the University of Michigan before leaving for New York City. She edges out fellow Michigander Bob Seger, whose heartland rock also defines the state."

      - name: "Minnesota: Prince"
        image: "/images/collections/culture/most-famous-musician-by-state/minnesota.jpg"
        description: "Prince gets the nod over fellow Minnesota native Bob Dylan. His film Purple Rain vividly transported 1980s fans to Minneapolis, where it was filmed almost exclusively."

      - name: "Mississippi: Elvis Presley"
        image: "/images/collections/culture/most-famous-musician-by-state/mississippi.jpg"
        description: "Elvis Presley, the King of Rock & Roll, was one of the most important figures in the mainstream popularization of early rock. He has scored 109 Hot 100 hits and holds the record for the most charted albums in Billboard 200 history."

      - name: "Missouri: Nelly"
        image: "/images/collections/culture/most-famous-musician-by-state/missouri.jpg"
        description: "Nelly was born in Austin but came up in St. Louis, proudly repping his adopted hometown as part of the hip-hop group St. Lunatics."

      - name: "Montana: Jeff Ament"
        image: "/images/collections/culture/most-famous-musician-by-state/montana.jpg"
        description: "Jeff Ament, born in Havre and raised in Big Sandy, co-founded and plays bass for Pearl Jam, which has notched five No. 1 albums on the Billboard 200 from 1993's Vs. to 2013's Lightning Bolt. Honorable mention goes to Helena's Nicolette Larson, whose 'Lotta Love' reached No. 8 on the Hot 100 in 1979."

      - name: "Nebraska: Randy Meisner"
        image: "/images/collections/culture/most-famous-musician-by-state/nebraska.jpg"
        description: "Randy Meisner co-founded the Eagles and also helped form Poco. He sings lead on the Eagles' 'Take It to the Limit,' which reached No. 4 on the Hot 100 in 1976."

      - name: "Nevada: The Killers"
        image: "/images/collections/culture/most-famous-musician-by-state/nevada.jpg"
        description: "The Killers formed in Las Vegas in 2001 and have earned five Billboard 200 top 10s, including their first No. 1, 2017's Wonderful Wonderful. Their 2020 single 'Caution' became the band's second Alternative Airplay No. 1, edging out fellow Las Vegas act Imagine Dragons on seniority."

      - name: "New Hampshire: Ray LaMontagne"
        image: "/images/collections/culture/most-famous-musician-by-state/new-hampshire.jpg"
        description: "Nashua's Ray LaMontagne has reached No. 3 on the Billboard 200 with three separate titles: 2008's Gossip in the Grain, 2010's God Willin' & the Creek Don't Rise, and 2014's Supernova."

      - name: "New Jersey: Bruce Springsteen"
        image: "/images/collections/culture/most-famous-musician-by-state/new-jersey.jpg"
        description: "Bruce Springsteen edges out fellow New Jersey icon Bon Jovi, largely on career longevity. Whitney Houston earns an honorable mention from the Garden State as well."

      - name: "New Mexico: The Shins"
        image: "/images/collections/culture/most-famous-musician-by-state/new-mexico.jpg"
        description: "The Shins, formed in Albuquerque, saw their song 'New Slang' immortalized in the 2004 film Garden State. Their 2007 album Wincing the Night Away peaked at No. 2 on the Billboard 200, and 2012's Port of Morrow debuted and peaked at No. 3."

      - name: "New York: Billy Joel"
        image: "/images/collections/culture/most-famous-musician-by-state/new-york.jpg"
        description: "Billy Joel, from the Bronx, was singing about being in a 'New York state of mind' long before 'Empire State of Mind.' He edges out fellow New York-born stars Christina Aguilera, Cardi B, Mariah Carey, Lady Gaga, Jay-Z, and Alicia Keys."

      - name: "North Carolina: J. Cole"
        image: "/images/collections/culture/most-famous-musician-by-state/north-carolina.jpg"
        description: "J. Cole was born on a U.S. military base in West Germany but grew up in Fayetteville, North Carolina. He titled his 2014 album 2014 Forest Hills Drive after the address of a childhood home in the state."

      - name: "North Dakota: Lawrence Welk"
        image: "/images/collections/culture/most-famous-musician-by-state/north-dakota.jpg"
        description: "Lawrence Welk is one of only three North Dakota-born artists to top the Hot 100, alongside Bobby Vee ('Take Good Care of My Baby,' 1961) and Wiz Khalifa. Welk takes the honor for longevity, though Khalifa's 'See You Again' was one of 2015's biggest smashes."

      - name: "Ohio: Chrissie Hynde"
        image: "/images/collections/culture/most-famous-musician-by-state/ohio.jpg"
        description: "Chrissie Hynde, frontwoman of The Pretenders, hails from Akron, Ohio, even though the band formed in England in 1978. The Pretenders joined the Rock and Roll Hall of Fame, located in Cleveland, in 2005, and Hynde's 2014 solo debut Stockholm entered the Billboard 200's top 40."

      - name: "Oklahoma: Garth Brooks"
        image: "/images/collections/culture/most-famous-musician-by-state/oklahoma.jpg"
        description: "Garth Brooks, the Tulsa native and Oklahoma State University graduate, has U.S. album sales approaching 72.5 million, the most of any artist in Nielsen Music/MRC Data history. In March 2020 he banked his 36th Country Airplay top 10, 'Dive Bar,' alongside fellow Oklahoman Blake Shelton, born in Ada."

      - name: "Oregon: Esperanza Spalding"
        image: "/images/collections/culture/most-famous-musician-by-state/oregon.jpg"
        description: "Esperanza Spalding, born in Portland, won the 2011 Best New Artist Grammy over presumed favorite Justin Bieber. The Portland area has also produced The Decemberists, Everclear, and Courtney Love."

      - name: "Pennsylvania: Taylor Swift"
        image: "/images/collections/culture/most-famous-musician-by-state/pennsylvania.jpg"
        description: "Taylor Swift grew up in Wyomissing, Pennsylvania. Red (Taylor's Version) became her 10th Billboard 200 No. 1 in November 2021, edging out fellow Pennsylvanians Daryl Hall and John Oates."

      - name: "Rhode Island: Jeffrey Osborne"
        image: "/images/collections/culture/most-famous-musician-by-state/rhode-island.jpg"
        description: "Providence-born Jeffrey Osborne fronted L.T.D. before launching a solo career, scoring 1984's 'Stay With Me Tonight,' a longtime Rhode Island radio favorite."

      - name: "South Carolina: Darius Rucker"
        image: "/images/collections/culture/most-famous-musician-by-state/south-carolina.jpg"
        description: "Darius Rucker, born in Charleston, rose to fame fronting Hootie & the Blowfish before launching a successful solo career primarily in country music."

      - name: "South Dakota: Shawn Colvin"
        image: "/images/collections/culture/most-famous-musician-by-state/south-dakota.jpg"
        description: "Shawn Colvin, born in Vermillion, South Dakota, released 'Sunny Came Home' in 1997. The single hit the Hot 100 top 10 and earned Colvin Grammys for record of the year and song of the year."

      - name: "Tennessee: Dolly Parton"
        image: "/images/collections/culture/most-famous-musician-by-state/tennessee.jpg"
        description: "Dolly Parton, the Nashville queen, was born in Sevierville, Tennessee. Her Dollywood theme park welcomes roughly 2.5 million visitors annually, and she holds the record for most Hot Country Songs No. 1s (25) by any female artist."

      - name: "Texas: George Strait"
        image: "/images/collections/culture/most-famous-musician-by-state/texas.jpg"
        description: "George Strait, born in Poteet, has sent more songs to No. 1 on Hot Country Songs (44) than any other act, with top 10s on the chart every year from 1981 through 2013. Houston-born Beyoncé earns a shoutout too, her 'Black Parade' debuting at No. 1 on the Digital Song Sales chart dated July 4, 2020."

      - name: "Utah: The Osmonds"
        image: "/images/collections/culture/most-famous-musician-by-state/utah.jpg"
        description: "The Osmonds are synonymous with Utah's Salt Lake region, collecting 13 Hot 100 hits as a group while Donny scored 16 more as a soloist. Donny and sister Marie debuted at No. 30 on the Billboard 200 in 2011 with Donny & Marie, their highest-peaking duets album."

      - name: "Vermont: Phish"
        image: "/images/collections/culture/most-famous-musician-by-state/vermont.jpg"
        description: "Phish formed at the University of Vermont in Burlington in 1983. Ben & Jerry's, headquartered nearby in Waterbury, created its Phish Food ice cream flavor as a tribute to the jam band."

      - name: "Virginia: Bruce Hornsby"
        image: "/images/collections/culture/most-famous-musician-by-state/virginia.jpg"
        description: "Bruce Hornsby has written about his home state of Virginia in songs including 'The Red Plains,' 'The Valley Road,' and 'The Road Not Taken,' in which he sings of falling in love with an Appalachian girl."

      - name: "Washington: Nirvana"
        image: "/images/collections/culture/most-famous-musician-by-state/washington.jpg"
        description: "Seattle is the birthplace of grunge, and Nirvana represents it best. 'Smells Like Teen Spirit' reached No. 6 on the Hot 100 in 1992, marking the genre's first crossover into the chart's top 10, edging out fellow Seattle act Pearl Jam."

      - name: "West Virginia: Brad Paisley"
        image: "/images/collections/culture/most-famous-musician-by-state/west-virginia.jpg"
        description: "Brad Paisley, from Glen Dale, has tallied 18 No. 1s, including a streak of 10 in a row, on Billboard's Hot Country Songs chart, plus nine No. 1s on Top Country Albums. He debuted on the chart in 1999."

      - name: "Wisconsin: Les Paul"
        image: "/images/collections/culture/most-famous-musician-by-state/wisconsin.jpg"
        description: "Les Paul, whom the Rock and Roll Hall of Fame calls an 'architect' of the genre, originated the solid-body electric guitar and perfected multi-track recording technology. He passed away in 2009."

      - name: "Wyoming: Chris LeDoux"
        image: "/images/collections/culture/most-famous-musician-by-state/wyoming.jpg"
        description: "Chris LeDoux was born in Biloxi, Mississippi, but became a Wyoming rodeo legend. Garth Brooks referenced a 'worn-out tape of Chris LeDoux' in his debut single, and LeDoux went on to tally 21 Hot Country Songs appearances before his death in 2005."

  - id: "states-with-the-toughest-musical-calls"
    icon: "fa-solid fa-scale-balanced"
    title: "States With the Toughest Music Picks"
    paragraphs:
      - "Minnesota came down to Prince versus fellow native Bob Dylan. Prince won the nod because Purple Rain was filmed almost entirely in Minneapolis. California weighed the Beach Boys against Santa Barbara's Katy Perry, giving the edge to the band that sang about California girls 45 years before Perry did."
      - "Indiana pitted Michael Jackson, born in Gary, against John Mellencamp, born in nearby Seymour, and Jackson's global fame won out. New Jersey came down to Bruce Springsteen and Bon Jovi, with Springsteen's career longevity serving as the tiebreaker."

