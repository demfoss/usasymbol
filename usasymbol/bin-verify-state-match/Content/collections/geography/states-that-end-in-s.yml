sections:
  - id: "states-ending-s"
    icon: "fa-solid fa-font"
    style: "law-cards"
    title: "All States That End in S"
    subsections:
      - subtitle: "Arkansas"
        text: |
          **Letters:** 8
          **Ending:** -sas

          Arkansas ends in S and has Little Rock as its capital. State law formally preserves the pronunciation ending in saw rather than the final syllable used in Kansas.

          Spelling determines its place here, so the silent final S counts even though ordinary pronunciation does not voice it.
      - subtitle: "Illinois"
        text: |
          **Letters:** 8
          **Ending:** -ois

          Illinois ends in S and has Springfield as its capital. The final S is silent in the standard English pronunciation.

          The written last character qualifies Illinois, showing why this collection depends on spelling rather than sound.
      - subtitle: "Kansas"
        text: |
          **Letters:** 6
          **Ending:** -sas

          Kansas ends in S and has Topeka as its capital. Its name shares six consecutive letters with the end of Arkansas.

          The final S places Kansas on the list, while its pronunciation supplies the clearest contrast with Arkansas.
      - subtitle: "Massachusetts"
        text: |
          **Letters:** 13
          **Ending:** -tts

          Massachusetts ends in S and has Boston as its capital. Its 13-letter spelling is the longest of any state name in this set.

          The terminal S qualifies it, and the name length marks the opposite end of the range from Texas.
      - subtitle: "Texas"
        text: |
          **Letters:** 5
          **Ending:** -xas

          Texas ends in S and has Austin as its capital. The letter X immediately before its final two letters makes the spelling easy to distinguish.

          Its final S qualifies Texas, and its 5 letters make it the shortest name in the group.

