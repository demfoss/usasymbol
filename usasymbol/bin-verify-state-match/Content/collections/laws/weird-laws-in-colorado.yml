faq:
  - question: "Is Boulder's couch ban actually enforced?"
    answer: "Yes, but only inside a marked University Hill boundary. Boulder does not enforce the rule citywide."
  - question: "Can you really get a DUI for riding a bicycle drunk in Colorado?"
    answer: "Yes. Colorado's DUI statute applies to a broadly defined 'vehicle,' which includes bicycles. A drunk cyclist can be charged with DUI or DWAI, though police cannot force a breath test the way they can with a car."
  - question: "Is it illegal to keep a horse in a Denver apartment building?"
    answer: "Denver bans stabling livestock, including horses and mules, on any floor above or below street level unless the building is fireproof. The rule targets the structure, not just the animal."
  - question: "Is the Denver vacuum-lending law real?"
    answer: "No. City officials have publicly called it a myth, since no Denver ordinance or Colorado statute has ever restricted lending a vacuum cleaner."
  - question: "What is the weirdest real law still on the books in Colorado?"
    answer: "The bicycle DUI rule surprises the most people, since riding drunk feels harmless compared to driving. Colorado's broad vehicle definition puts cyclists under the same alcohol law as motorists anyway."
  - question: "Can you actually get in trouble for a snowball fight in Aspen?"
    answer: "Only if you hit a stranger, a building, or a car. Friendly snowball fights between willing participants are not what the ordinance targets."
