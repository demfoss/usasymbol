sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Hawaii That Are Real"
    paragraphs:
      - "A billboard ban dating back to the 1920s and a law naming an actual state of mind anchor the Unusual Laws in Hawaii that check out against the real code. Each one remains active today."
    highlights:
      - name: "Hawaii Banned Billboards in 1927"
        status: "Verified"
        image: "/images/collections/laws/hawaii-billboard-ban.jpg"
        description: |
          **Law:** Hawaii law lets counties prohibit billboards and outdoor advertising devices anywhere within their borders, and every county has done so.

          **Meaning:** Large roadside advertising structures that are common on the mainland are essentially absent across the islands.

          **Reason:** A local beautification group called the Outdoor Circle pushed the territorial legislature to pass the ban in 1927, arguing that billboards would damage the natural scenery Hawaii's tourism economy depended on. It made Hawaii the first place in the country to ban billboards outright.

      - name: "The Aloha Spirit Statute"
        status: "Verified"
        image: "/images/collections/laws/hawaii-aloha-spirit.jpg"
        description: |
          **Law:** Hawaii law defines the "Aloha Spirit" as a coordination of mind and heart, expressed through kindness, unity, agreeableness, humility, and patience, and directs the legislature, governor, and judges to give it consideration while carrying out their official duties.

          **Meaning:** State officials are formally asked to weigh a defined cultural value alongside the law itself when making decisions.

          **Reason:** Lawmakers added the statute in 1986 to preserve a Native Hawaiian philosophy as an official part of state government, not just a tourism slogan.

      - name: "Ferrets Are Banned Statewide"
        status: "Verified"
        image: "/images/collections/laws/hawaii-ferret-ban.jpg"
        description: |
          **Law:** Hawaii bans importing, owning, or breeding ferrets anywhere in the state.

          **Meaning:** A pet that's legal in nearly every other state can trigger fines and confiscation in Hawaii, regardless of how tame or well cared for it is.

          **Reason:** Hawaii is rabies-free, and officials treat any new predatory mammal as a risk to native birds and other species found nowhere else on Earth, on top of the disease concern.

      - name: "The Reef-Safe Sunscreen Law"
        status: "Verified"
        image: "/images/collections/laws/hawaii-sunscreen-law.jpg"
        description: |
          **Law:** Hawaii bans selling or distributing sunscreen containing oxybenzone or octinoxate without a prescription.

          **Meaning:** Many popular drugstore sunscreen brands sold on the mainland can't legally be sold in Hawaii unless they're reformulated without those two ingredients.

          **Reason:** Lawmakers passed the rule in 2018 after research linked both chemicals to coral reef damage, making Hawaii one of the first places in the world to restrict sunscreen ingredients for environmental reasons.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Hawaii We Couldn't Verify"
    paragraphs:
      - "Not all Real Hawaii Laws You Won't Believe hold up once you go looking for the actual code section. A coin-in-the-ear claim and a bird-annoying ban are two of the most repeated, and neither has a citation attached anywhere."
    subsections:
      - subtitle: "It's illegal to put a coin in your ear in Hawaii"
        status: "Not Verified"
        text: |
          **Claim:** Hawaii law bans putting a coin in your ear.

          **Why We Couldn't Verify It:** No statute matching this claim has ever been located, and the stories behind it don't even agree with each other. Some trace it to King Kamehameha in 1847, others to an order destroying old Hawaiian coins around 1900. Researchers who have gone looking for an original source have come up empty.

      - subtitle: "Annoying the birds in a Honolulu park is illegal"
        status: "Not Verified"
        text: |
          **Claim:** Honolulu has a specific ordinance against annoying birds in its public parks.

          **Why We Couldn't Verify It:** No ordinance number or code section using this exact language has surfaced. Honolulu does regulate conduct in its parks generally, but nothing ties this specific claim to a real, citable rule.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Hawaii Laws That Are Myths"
    paragraphs:
      - "A cursed lava rock is the most famous Strange Hawaii Laws myth of all, and a coconut-tree height limit on Kauai turns out to be a colorful nickname for something more ordinary."
    subsections:
      - subtitle: "Pele's Curse: taking a lava rock brings bad luck"
        status: "Myth"
        text: |
          **Myth:** Anyone who removes a lava rock from Hawaii will suffer years of bad luck from the volcano goddess Pele.

          **Reality:** Historians trace the curse to 1946, when a park ranger at Hawaii Volcanoes National Park invented the story to stop tourists from pocketing volcanic rock. It has no roots in actual Hawaiian mythology. Removing rocks from a national park is genuinely illegal under federal regulations, with fines up to $5,000, but that has nothing to do with any curse.

      - subtitle: "No building on Kauai can be taller than a coconut tree"
        status: "Myth"
        text: |
          **Myth:** Kauai law specifically caps building height at the height of a coconut palm.

          **Reality:** Kauai's actual building code sets a real height limit, generally around 30 feet for homes and roughly four stories for larger structures, but the code never mentions coconut trees. The phrase is a nickname that stuck, not the law's real language.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why Hawaii's Four County Governments Write Their Own Rules"
    paragraphs:
      - "Hawaii has no incorporated cities at all, an arrangement unique among U.S. states. Its four inhabited counties, Honolulu, Maui, Hawaii, and Kauai, each function as a combined city-county government with nobody above them to coordinate local code. That's why Kauai's building height limit and Honolulu's park rules were each written in isolation, with no statewide review process to catch overlap or resolve an odd rule against a neighboring island's version."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Honolulu was the first major U.S. city to fine pedestrians for looking at their phones while crossing the street, under a 2017 law with fines up to $99."
      - "Hawaii's cave protection law, passed in 2002, makes it illegal to break or deface stalactites and other formations inside the islands' lava tube caves."
      - "The sunscreen ingredient ban pushed manufacturers to reformulate products specifically for the Hawaii market, and Maui County later went further by requiring mineral-only sunscreen."
      - "Hawaii has zero incorporated cities, a distinction it shares with no other state in the country."
      - "The Aloha Spirit statute lists five specific Hawaiian values by name: akahai, lokahi, oluolu, haahaa, and ahonui."

