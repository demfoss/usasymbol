page:
  h1: "Weird Hawaii Laws Still on the Books"
  quick_answer:
    - "Four Hawaii weird-law claims check out: a statewide billboard ban, the Aloha Spirit statute, a ferret ownership ban, and a reef-safe sunscreen rule."
    - "The billboard ban is the oldest of the four. Hawaii outlawed billboards in 1927, decades before any other state tried it."
    - "Pele's Curse, the idea that stolen lava rocks bring bad luck, is a modern myth invented in 1946, not an ancient Hawaiian belief."
  sources:
