faq:
  - question: "Is it true that Hawaii banned billboards?"
    answer: "Yes. Hawaii law lets counties ban billboards outright, and all of them have. The rule dates to 1927, making Hawaii the first place in the country to outlaw billboards."
  - question: "What is the Aloha Spirit law in Hawaii?"
    answer: "It's a real 1986 statute defining the Aloha Spirit through five Hawaiian values and directing state officials to consider it while carrying out their duties. It's a genuine part of the Hawaii Revised Statutes, not just a slogan."
  - question: "Can you legally own a ferret in Hawaii?"
    answer: "No. Ferrets are banned statewide because Hawaii is rabies-free and treats any new predatory mammal as a threat to native species found nowhere else on Earth."
  - question: "Is Pele's Curse a real Hawaiian legend?"
    answer: "No. It dates only to 1946, when a park ranger invented the story to stop tourists from taking lava rocks. It has no basis in traditional Hawaiian belief, though removing rocks from a national park is a real, separate federal offense."
  - question: "Is the Hawaii sunscreen ban real?"
    answer: "Yes. Hawaii bans selling sunscreen containing oxybenzone or octinoxate without a prescription, a 2018 law meant to protect coral reefs from chemical damage."
  - question: "Is the coin-in-your-ear law in Hawaii real?"
    answer: "No confirmed statute has ever been found. The claim has multiple competing origin stories that don't agree with each other, which is usually a sign that no such law ever existed."
