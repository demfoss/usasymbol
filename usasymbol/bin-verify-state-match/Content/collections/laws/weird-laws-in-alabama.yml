faq:
  - question: "What is the weirdest Alabama law that is actually real?"
    answer: "The bear wrestling ban is a felony covering promoting, participating in, and training bears for wrestling matches. The pre-2009 beer alcohol cap is a close second: Alabama banned beer over 6% alcohol by volume for most of the twentieth century, which kept most craft imports and high-gravity ales off shelves entirely."

  - question: "Is putting salt on a railroad track really illegal in Alabama?"
    answer: "Deliberately placing materials on railroad tracks in a way that endangers operations is a real felony in Alabama. Salt near tracks historically attracted livestock onto the rails, causing derailments, which is the practical reason the rule exists. The 'punishable by death' version has no basis in the law. Capital punishment in Alabama applies to aggravated murder, not railroad interference."

  - question: "Is the fake mustache law in Alabama real?"
    answer: "No. No statute or ordinance matching this claim has been found in Alabama law at any level, statewide, county, or city. The claim has circulated for over twenty years without a source ever being produced."

  - question: "Why did Alabama repeal its beer alcohol cap?"
    answer: "A grassroots campaign called Free the Hops, founded in 2004, organized the push to lift Alabama's 6% beer alcohol cap, arguing it blocked most craft and imported beer from being sold in the state at all. The Legislature repealed the cap and a related 16-ounce bottle limit in 2009."
