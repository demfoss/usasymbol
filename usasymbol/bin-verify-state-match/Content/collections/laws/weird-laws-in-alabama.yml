sections:
  - id: real-statutes
    icon: "fa-solid fa-check-circle"
    style: "law-cards"
    title: "Unusual Laws in Alabama That Are Real"
    paragraphs:
      - "Some Unusual Laws in Alabama turn out to be real once you check the actual text. One stayed on the books for years before a public campaign finally repealed it, and another still gets exaggerated far beyond its actual penalty."
    highlights:
      - name: "Bear Wrestling Is a Felony"
        status: "Verified"
        image: "/images/collections/laws/alabama-bear-wrestling-ban.jpg"
        anchor_phrases:
          - "bear wrestling"
        description: |
          **Law:** Alabama makes it a crime to promote, join, or train a bear for a wrestling match.

          **Meaning:** In practice, the law targets staged entertainment events, not some cartoonish one-off stunt.

          **Reason:** It was written because bear-wrestling shows really did draw paying crowds at fairs and roadside venues, so lawmakers chose a direct ban instead of relying only on general cruelty law.
      - name: "The Beer Cap That Blocked Craft Imports"
        status: "Verified"
        image: "/images/collections/laws/alabama-beer-abv-cap.jpg"
        anchor_phrases:
          - "6% beer cap"
          - "beer cap"
        description: |
          **Law:** For most of the twentieth century, Alabama capped beer at 6% alcohol by volume.

          **Meaning:** The cap kept many stronger craft and imported beers off shelves entirely.

          **Reason:** What sounds random was really a leftover temperance-era idea that stronger beer belonged closer to liquor than to everyday beer. Free the Hops finally helped repeal both the cap and the state's 16-ounce bottle limit in 2009.
      - name: "Salt on Railroad Tracks Is a Felony, Not a Death Sentence"
        status: "Verified"
        image: "/images/collections/laws/alabama-railroad-salt-felony.jpg"
        anchor_phrases:
          - "railroad-interference law"
        description: |
          **Law:** Alabama really does make dangerous interference with railroad tracks a felony.

          **Meaning:** The real point is railroad safety, not some bizarre special anti-salt law.

          **Reason:** Salt and other attractants could draw livestock onto the rails and create a genuine derailment risk. The death-penalty version was added later as internet embellishment.

  - id: no-confirmed-source
    icon: "fa-solid fa-magnifying-glass"
    style: "law-cards"
    title: "Weird Laws in Alabama We Couldn't Verify"
    paragraphs:
      - "Some Weird Laws in Alabama claims have floated around for years without anyone producing an actual statute, ordinance, or date of passage. They are famous online, but the legal source never seems to appear."
    subsections:
      - subtitle: "Wearing a Fake Mustache in Church Is Illegal If It Causes Laughter"
        status: "Not Verified"
        anchor_phrases:
          - "fake-mustache-in-church claim"
        text: |
          **Claim:** Wearing a fake mustache in church is illegal if it causes laughter.

          **Why We Couldn't Verify It:** No Alabama statute, city code, or county ordinance matching this claim has been found. It has circulated for years without a town name, date, or official citation, which usually means the joke spread farther than any real source ever did.

  - id: internet-myths
    icon: "fa-solid fa-ghost"
    style: "law-cards"
    title: "Strange Alabama Laws That Are Myths"
    paragraphs:
      - "Some Strange Alabama Laws claims are more than just unverified. Each one has a clear explanation for why the supposed law never existed in Alabama in the first place."
    subsections:
      - subtitle: "It's Illegal to Carry Ice Cream in Your Back Pocket"
        status: "Myth"
        anchor_phrases:
          - "ice-cream-in-your-back-pocket claim"
        text: |
          **Myth:** It's illegal to carry ice cream in your back pocket.

          **Reality:** This same claim gets pinned on Alabama, Kentucky, Georgia, and several other states depending on who is retelling it. The horse-luring explanation belongs to old folklore, not to any real Alabama code.
      - subtitle: "Putting Salt on a Railroad Track Is Punishable by Death"
        status: "Myth"
        anchor_phrases:
          - "putting salt on a railroad track is punishable by death"
        text: |
          **Myth:** Putting salt on a railroad track is punishable by death.

          **Reality:** A real Alabama law does punish dangerous railroad interference, but not with death. The capital-punishment part was pasted onto a real felony later, then repeated until people started treating the exaggeration as the original rule.

  - id: why-laws-stay
    icon: "fa-solid fa-clock-rotate-left"
    title: "Why the Misquote Outlasts the Correction"
    paragraphs:
      - "The railroad salt claim starts with a real law and adds a fake punishment, which is exactly why it spreads further than a plainly false story. It has just enough truth in it to sound checkable. Alabama treats dangerous railroad interference as a felony, full stop, with no death-penalty provision anywhere in the statute."
      - "The beer cap shows the opposite pattern: a real, well-documented law that most weird-law lists skip because the story ends with repeal instead of a punchline. It took an organized campaign to get rid of it, not just public mockery of an old rule."

  - id: interesting-facts
    icon: "fa-solid fa-lightbulb"
    style: "gradient"
    title: "Key Facts"
    facts:
      - "Alabama's bear wrestling statute sits in the same chapter as the state's gambling offenses, treating it as a conduct crime rather than purely an animal welfare issue."
      - "The 2009 Alabama beer law change also removed a 16-ounce bottle size limit, which had blocked large-format craft beers from being sold at all."
      - "Free the Hops, the campaign behind the 2009 beer law change, started as a small group of home brewers before growing into a statewide lobbying effort."
      - "Alabama's railroad interference law covers any material left on tracks that endangers operations, not just the salt scenario most often repeated online."

