page:
  h1: "Weird Laws in Alabama"

  quick_answer:
    - "Three of the best-known laws on this page point in different directions: a felony ban on bear wrestling, a railroad-interference law, and the repealed 6% beer cap."
    - "The most-circulated Alabama claim says putting salt on a railroad track is punishable by death. The real law makes dangerous railroad interference a felony, but nothing in it creates a capital offense."
    - "The fake-mustache-in-church claim and the ice-cream-in-your-back-pocket claim have no confirmed statute or ordinance behind them at any level."

  sources:
